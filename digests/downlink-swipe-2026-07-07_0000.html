session parameters, exfiltrate data, and manipulate agent responses.","Varonis also found that Code Blocks could bypass VPC Service Controls through unrestricted outbound internet access and that the Cloud Run environment exposed Instance Metadata Service credentials for a low-privileged Google-managed service account.","Varonis reported the issue in November 2025, Google issued an initial security update in April 2026, and Google fully resolved the issue in June 2026."],"insights":["A permission that could be scoped to a single Dialogflow agent still created project-wide risk because agents using Code Blocks in the same GCP project shared the same Google-managed Cloud Run execution environment.","The attack could remain hidden after the malicious Code Block was removed from the Dialogflow Console because the modified execution environment persisted outside the customer’s direct visibility.","Cloud Logging did not record the environment overwrite or injected logic, so the article recommends looking for indirect signs such as successful Playbook update events, rare API access, unusual IP addresses, atypical access times, and failed user requests with exception messages.","VPC Service Controls did not prevent this exfiltration path because the Code Blocks ran in a Google-managed Cloud Run service with unrestricted outbound internet access outside the protected perimeter.","The exposed Instance Metadata Service token was low-privileged, but the article highlights that code execution environments should not have access to IMDS because future privilege changes to that service account could increase risk."],"referencedReports":[],"body":"\u003cp\u003eVaronis Threat Labs discovered a critical vulnerability in Google Cloud Platform’s Dialogflow CX service, which they named Rogue Agent. The flaw affected the Playbook Code Blocks feature and allowed attackers to inject persistent malicious code into the Dialogflow agents’ pipeline. According to the article, the exploit required a single edit permission, dialogflow.playbooks.update, on one agent. Google issued an initial security update in April 2026 and fully resolved the issue in June 2026.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability mattered because Dialogflow agents can handle sensitive customer support, financial services, healthcare, and enterprise workflow data. Attackers could silently exfiltrate conversations, manipulate agent responses, and conduct phishing campaigns disguised as legitimate chatbot interactions. The shared Google-managed Cloud Run execution environment meant a foothold in one agent could compromise other agents in the same GCP project. Varonis said it was not aware of exploitation in the wild before Google’s patch release.\u003c/p\u003e\n\n\u003cp\u003eTechnically, Varonis found that Code Blocks executed in a Cloud Run environment with public network access, a writable file system, and sufficient privileges to modify system files. Researchers identified a writable file named code_execution_env.py that executed configured Code Blocks using Python’s exec() function, exposing variables such as conversation history and session state. They also found that Code Blocks could bypass VPC Service Controls through outbound internet access and that the environment exposed Instance Metadata Service credentials for a low-privileged Google-managed service account. The article recommends auditing Dialogflow CX configurations, reviewing Playbook update actions, checking failed request logs, and manually reviewing Code Blocks.\u003c/p\u003e\n"},{"n":20,"title":"Writer AI Flaw Could Let Agent Previews Leak Session Tokens Across Tenants","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/writer-ai-flaw-could-let-agent-previews.html","time":"13:27","priority":"SHOULD READ","score":84,"tldr":"Researchers disclosed a now-patched Writer AI flaw called WriteOut that let attackers use a malicious agent preview link to steal logged-in users’ session tokens across tenants. A successful exploit could allow takeover of victim Writer accounts and access to private chats, documents, configurations, connectors, and LLM credentials.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of WriteOut, a now-patched critical session isolation vulnerability in Writer, an enterprise generative AI platform. Sand Security said the flaw could allow an outsider with no prior access to take over a Writer AI organization using only a link. The issue could result in cross-tenant compromise, meaning the attacker and victim did not need to belong to the same organization.\u003c/p\u003e\n\n\u003cp\u003eThe attack involved an attacker creating an agent in their own Writer account and sharing a public live preview link. When a logged-in Writer user opened the link, the browser attached the user’s Writer session cookie, and the preview proxy sent that cookie into the attacker’s sandbox. Attacker-controlled code in the sandbox could read and exfiltrate the session token, which the attacker could replay to gain control of the victim’s Writer account.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation could expose private chats, documents, agent-related data, configurations, private models, connectors, and large language model credentials. Depending on the victim’s role, it could also allow administrative control. Writer addressed the issue by preventing user session cookies from being forwarded into sandbox previews and moving previews to an isolated origin.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers disclosed details of WriteOut, a now-patched critical session isolation vulnerability in the Writer enterprise generative AI platform that could result in cross-tenant compromise.","An attacker could create an agent in their own Writer account, share a live preview link, and hijack the account of a logged-in Writer user from a completely separate organization if the victim clicked the link.","The attack involved the victim’s browser attaching their Writer session cookie to the preview request, the preview proxy forwarding that cookie into the attacker’s sandbox, and attacker-controlled code reading and exfiltrating the session token.","Successful exploitation could allow access to private chats, documents, agent-related data, configurations, private models, connectors, large language model credentials, and administrative control depending on the victim’s role.","Writer fixed the issue by preventing user session cookies from being forwarded into sandbox previews and moving previews to an isolated origin."],"insights":["The flaw was especially severe because the attacker and victim did not need to belong to the same Writer organization, meaning one malicious preview link could target users across separate companies.","Writer had guardrails intended to block access to sensitive data, but Sand Security said those checks examined the user instruction rather than what the code actually did at runtime.","The researchers bypassed the guardrails by having the agent fetch and run a remote script, so the exploit logic did not appear directly in the prompt.","The fix focused on stopping session cookies from reaching sandbox previews at all and moving previews to an isolated origin, showing that filtering prompts alone was not sufficient for this issue."],"referencedReports":[{"title":"WriteOut: Writer AI Cross-Tenant","url":"https://www.sandsecurity.ai/blog/writeout-writer-ai-cross-tenant","publisher":"Sand Security","context":"The article cites Sand Security’s report disclosing the WriteOut vulnerability in Writer AI and describing the cross-tenant account takeover attack chain.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of WriteOut, a now-patched critical session isolation vulnerability in Writer, an enterprise generative AI platform. Sand Security said the flaw could allow an outsider with no prior access to take over a Writer AI organization using only a link. The issue could result in cross-tenant compromise, meaning the attacker and victim did not need to belong to the same organization.\u003c/p\u003e\n\n\u003cp\u003eThe attack involved an attacker creating an agent in their own Writer account and sharing a public live preview link. When a logged-in Writer user opened the link, the browser attached the user’s Writer session cookie, and the preview proxy sent that cookie into the attacker’s sandbox. Attacker-controlled code in the sandbox could read and exfiltrate the session token, which the attacker could replay to gain control of the victim’s Writer account.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation could expose private chats, documents, agent-related data, configurations, private models, connectors, and large language model credentials. Depending on the victim’s role, it could also allow administrative control. Writer addressed the issue by preventing user session cookies from being forwarded into sandbox previews and moving previews to an isolated origin.\u003c/p\u003e\n"},{"n":1,"title":"Hidden backdoor in Tenda router firmware grants admin access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hidden-backdoor-in-tenda-router-firmware-grants-admin-access/","time":"17:27","priority":"SHOULD READ","score":82,"tldr":"Multiple Tenda router firmware versions contain an undocumented authentication backdoor that can grant full admin access to the web interface using an alternate plaintext password, regardless of username. No patch is available, so users should disable remote web management and limit local exposure.","briefOverview":"\u003cp\u003eA hidden authentication backdoor has been found in multiple Tenda router firmware versions, potentially allowing an attacker to gain administrative access to the device’s web management panel. CERT/CC says the issue, tracked as CVE-2026-11405, remains unfixed because Tenda could not be reached. The affected devices include Tenda FH1201, W15E, AC10, AC5, and AC6 V2 WiFi routers running specific firmware versions listed in the article.\u003c/p\u003e\n\n\u003cp\u003eThe issue is caused by an undocumented authentication mechanism in the login() function of the /bin/httpd web server binary. If standard MD5-based authentication fails, the firmware retrieves an alternate password from the sys.rzadmin.password configuration value and compares it directly to the plaintext password supplied by the remote user. If the passwords match, the device grants administrator access and creates a valid session regardless of the username entered.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC says successful exploitation grants full administrative access to the device’s web interface, allowing an attacker to reconfigure the device, alter network settings, and disable security features. No patch is currently available, and users are advised to disable the remote web management panel to prevent internet access to the vulnerable interface. CERT/CC also recommends changing the default LAN IP address to reduce opportunistic discovery by automated scanners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A hidden authentication backdoor was found in multiple Tenda router firmware versions, potentially allowing attackers to gain administrative access to the device web management panel.","CERT/CC says CVE-2026-11405 is caused by an undocumented authentication mechanism in the login() function of the /bin/httpd web server binary.","If standard MD5-based authentication fails, the firmware retrieves an alternate password from the sys.rzadmin.password configuration value and compares it directly to the plaintext password supplied by the remote user.","The flaw affects firmware for Tenda FH1201, W15E, AC10, AC5, and AC6 V2 WiFi routers, and no patch is currently available.","CERT/CC advises Tenda users to disable the remote web management panel and change the default LAN IP address to reduce exposure."],"insights":["The backdoor accepts any username as long as the alternate password matches, so changing the normal administrator account credentials does not remove the risk.","The issue remains unfixed because CERT/CC could not reach Tenda, making exposure reduction the only mitigation described in the article.","CERT/CC recommends changing the default LAN IP address specifically to reduce opportunistic discovery by automated scanners, not as a patch for the backdoor itself.","The article notes there is no mention of active exploitation, but says router-focused botnets are very likely to target the issue in the coming period."],"referencedReports":[{"title":"CERT/CC Vulnerability Note VU#213560","url":"https://kb.cert.org/vuls/id/213560","publisher":"CERT Coordination Center","context":"The article cites a CERT/CC security bulletin describing the undocumented Tenda router authentication mechanism and its impact.","category":"","primary":false}],"body":"\u003cp\u003eA hidden authentication backdoor has been found in multiple Tenda router firmware versions, potentially allowing an attacker to gain administrative access to the device’s web management panel. CERT/CC says the issue, tracked as CVE-2026-11405, remains unfixed because Tenda could not be reached. The affected devices include Tenda FH1201, W15E, AC10, AC5, and AC6 V2 WiFi routers running specific firmware versions listed in the article.\u003c/p\u003e\n\n\u003cp\u003eThe issue is caused by an undocumented authentication mechanism in the login() function of the /bin/httpd web server binary. If standard MD5-based authentication fails, the firmware retrieves an alternate password from the sys.rzadmin.password configuration value and compares it directly to the plaintext password supplied by the remote user. If the passwords match, the device grants administrator access and creates a valid session regardless of the username entered.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC says successful exploitation grants full administrative access to the device’s web interface, allowing an attacker to reconfigure the device, alter network settings, and disable security features. No patch is currently available, and users are advised to disable the remote web management panel to prevent internet access to the vulnerable interface. CERT/CC also recommends changing the default LAN IP address to reduce opportunistic discovery by automated scanners.\u003c/p\u003e\n"},{"n":5,"title":"The GitHub Actions Attack Pattern Your CI Security Scanners Miss","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-github-actions-attack-pattern-your-ci-security-scanners-miss/","time":"14:01","priority":"SHOULD READ","score":82,"tldr":"GitHub Actions workflows can be exploitable even when all CI security checks pass, because the risk often comes from how trusted and untrusted workflows are composed rather than from a single bad file. Teams should audit trust boundaries in CI/CD, especially around pull_request_target, workflow_run, secrets, and artifacts, instead of relying on green scanners alone.","briefOverview":"\u003cp\u003eIn June 2026, researchers at Novee Security disclosed a class of CI/CD weakness they named Cordyceps after scanning roughly 30,000 high-impact repositories across the npm, PyPI, crates.io, and Go ecosystems. They flagged 654 repositories and confirmed more than 300 as fully exploitable. The affected build tooling included projects published by Microsoft, Google, Apache, Cloudflare, and the Python Software Foundation, and the entry requirement for an attacker was only a free GitHub account.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue is not usually a single bad line in a workflow file, but the way GitHub Actions workflows are composed across trust boundaries. Workflows using pull_request_target and workflow_run can run in the base repository context with access to secrets and a read and write GITHUB_TOKEN, and attackers can induce them to act on pull request content they control. The article highlights command injection, code injection through actions/github-script, and cross-workflow privilege escalation as the main primitives behind the problem.\u003c/p\u003e\n\n\u003cp\u003eNovee reported confirmed examples involving Microsoft’s Azure Sentinel repository, Google’s AI Agent Development Kit sample repository, and Apache Doris. In the Azure Sentinel case, a pull request comment could run anonymous attacker code on Microsoft’s CI and steal a non-expiring GitHub App key, while the Google example could escalate to owner-level access on the associated Google Cloud project. The article argues that green scanners can miss this kind of exposure because each workflow can look valid on its own, and it recommends closing trust boundaries, limiting permissions, pinning third-party actions, and governing what enters the build at the source.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Novee Security disclosed a class of GitHub Actions CI/CD weakness called Cordyceps after scanning roughly 30,000 high-impact repositories and confirming more than 300 as fully exploitable.","Cordyceps abuses how GitHub Actions workflows are composed, including pull_request_target and workflow_run running in the base repository context with access to secrets and a read and write GITHUB_TOKEN.","The article says standard SAST and DAST scanners miss this issue because each workflow file can be valid and well-formed while the connection between workflows creates the exploitable path.","Novee reported confirmed examples involving Microsoft Azure Sentinel, Google’s AI Agent Development Kit sample repository, and Apache Doris, with paths to credential theft or privileged access.","The article recommends immediate mitigations such as preferring pull_request for untrusted contributions, avoiding checkout of pull request head code in privileged workflows, using read-only default permissions, pinning third-party actions to commit SHAs, and requiring manual approval for first-time contributors."],"insights":["A green CI pipeline can create a false sense of safety because the article’s examples passed checks even though the exploitable risk existed across multiple connected workflow steps.","The most dangerous trust decision may be implicit: the article emphasizes that no one deliberately chose to trust an outsider’s pull request, but the workflow configuration effectively did so.","AI-generated CI/CD configuration can multiply this class of weakness because insecure workflow patterns can be reproduced quickly across many repositories without clear provenance or human-speed review.","The article frames Cordyceps as outside the normal CVE-centered tracking model, meaning organizations that rely only on CVE feeds may miss this kind of supply-chain risk.","The durable fix described is not just patching individual workflows, but assigning ownership of trust boundaries and governing what is allowed to enter the build at the source."],"referencedReports":[{"title":"Cordyceps","url":"http://novee.security/blog/cordyceps/","publisher":"Novee Security","context":"The article cites Novee Security’s disclosure of the Cordyceps class of CI/CD weakness and builds its discussion around Novee’s scan results and confirmed exploitable repositories.","category":"","primary":false}],"body":"\u003cp\u003eIn June 2026, researchers at Novee Security disclosed a class of CI/CD weakness they named Cordyceps after scanning roughly 30,000 high-impact repositories across the npm, PyPI, crates.io, and Go ecosystems. They flagged 654 repositories and confirmed more than 300 as fully exploitable. The affected build tooling included projects published by Microsoft, Google, Apache, Cloudflare, and the Python Software Foundation, and the entry requirement for an attacker was only a free GitHub account.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue is not usually a single bad line in a workflow file, but the way GitHub Actions workflows are composed across trust boundaries. Workflows using pull_request_target and workflow_run can run in the base repository context with access to secrets and a read and write GITHUB_TOKEN, and attackers can induce them to act on pull request content they control. The article highlights command injection, code injection through actions/github-script, and cross-workflow privilege escalation as the main primitives behind the problem.\u003c/p\u003e\n\n\u003cp\u003eNovee reported confirmed examples involving Microsoft’s Azure Sentinel repository, Google’s AI Agent Development Kit sample repository, and Apache Doris. In the Azure Sentinel case, a pull request comment could run anonymous attacker code on Microsoft’s CI and steal a non-expiring GitHub App key, while the Google example could escalate to owner-level access on the associated Google Cloud project. The article argues that green scanners can miss this kind of exposure because each workflow can look valid on its own, and it recommends closing trust boundaries, limiting permissions, pinning third-party actions, and governing what enters the build at the source.\u003c/p\u003e\n"},{"n":18,"title":"RedWing MaaS Packages Android Bank Fraud as a Telegram Rental Service","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/redwing-maas-packages-android-bank.html","time":"17:10","priority":"SHOULD READ","score":82,"tldr":"RedWing is a new Android malware-as-a-service operation sold through Telegram that helps criminals steal banking credentials, one-time codes, and remotely control victims’ phones using phishing and abused Android permissions. The main defense is to avoid sideloaded apps and deny suspicious requests for Accessibility, SMS, notification, and battery-exemption access.","briefOverview":"\u003cp\u003eRedWing is a new Android malware operation being rented on Telegram as a ready-made bank-fraud service. Zimperium’s zLabs says it appears to be a new variant of Oblivion, a $300-a-month rent-a-malware tool documented earlier this year. The service is sold with subscription tiers, referral discounts, guides, and how-to videos, and a Telegram bot can build each buyer a custom app on demand.\u003c/p\u003e\n\n\u003cp\u003eInfection begins when a victim follows a phishing link to a fake app-store page that can mimic Google Play, the Galaxy Store, AppGallery, or a custom page with fake ratings and reviews. The app then asks for permissions one screen at a time, including battery-limit exemptions, default text-message handler access, notifications, and Android Accessibility service access. With those permissions, RedWing can show fake login screens over banking and cryptocurrency apps, read one-time codes, stream the screen, log keystrokes, and silently enable call forwarding using the \u003cem\u003e21\u003c/em\u003e carrier code.\u003c/p\u003e\n\n\u003cp\u003eZimperium counted 82 targeted institutions across several sectors, with a strong focus on Russian financial firms, though the target list can change. The article says RedWing fits a broader move in Android crime toward on-device fraud, where attackers operate inside the victim’s own banking session instead of using stolen passwords elsewhere. Because the kit can be reskinned and its overlay targets changed from a control panel, the article emphasizes that behavior is a better signal than app names for tracking it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["RedWing is an Android malware operation rented through Telegram as a ready-made bank-fraud service that can take over a victim’s phone, steal banking logins, and capture one-time codes.","Zimperium’s zLabs said RedWing appears to be a new variant of Oblivion, a $300-per-month malware rental tool documented earlier this year.","RedWing infections begin with a phishing link to a fake app-store page that can mimic Google Play, the Galaxy Store, AppGallery, or custom pages with fake ratings, reviews, and download counts.","After installation, RedWing asks for permissions including battery-limit exemptions, default text-message handler access, notifications, and Android Accessibility service access, which it can abuse to read the screen and control the phone.","Zimperium counted 82 targeted institutions across several sectors, with a strong focus on Russian financial firms, though the target list can change at any time."],"insights":["RedWing’s Telegram bot can build custom apps on demand, meaning buyers do not need malware-writing skills and each campaign can be tailored after targets are chosen.","The malware’s targeting is split between apps watched through Accessibility, which are baked into each build, and overlay targets, which can be changed later from the control panel without distributing a new app.","RedWing can silently enable call forwarding with the hidden carrier code *21*, allowing attackers to disrupt phone-based verification and bank fraud-check calls.","App names are a weak tracking method because the kit can be reskinned and its overlay targets changed, so defenders should focus on behaviors such as sideloading, Accessibility abuse, and default-SMS requests.","RedWing does not need an Android exploit and depends on users installing apps from outside official stores and approving prompts, making install-time controls a central defense."],"referencedReports":[{"title":"RedWing: A Mobile Malware-as-a-Service Operation","url":"https://zimperium.com/blog/redwing-a-mobile-malware-as-a-service-operation","publisher":"Zimperium zLabs","context":"The article says Zimperium’s zLabs found the RedWing operation and uses its findings to describe the malware’s MaaS model, infection flow, capabilities, and targeting.","category":"","primary":false},{"title":"Oblivion: The New $300 Android RAT That Beats Every Major Phone Manufacturer’s Security","url":"https://www.certosoftware.com/insights/oblivion-the-new-300-android-rat-that-beats-every-major-phone-manufacturers-security/","publisher":"Certo Software","context":"The article references Certo Software’s earlier documentation of Oblivion, which Zimperium says RedWing appears to be a new variant of.","category":"","primary":false}],"body":"\u003cp\u003eRedWing is a new Android malware operation being rented on Telegram as a ready-made bank-fraud service. Zimperium’s zLabs says it appears to be a new variant of Oblivion, a $300-a-month rent-a-malware tool documented earlier this year. The service is sold with subscription tiers, referral discounts, guides, and how-to videos, and a Telegram bot can build each buyer a custom app on demand.\u003c/p\u003e\n\n\u003cp\u003eInfection begins when a victim follows a phishing link to a fake app-store page that can mimic Google Play, the Galaxy Store, AppGallery, or a custom page with fake ratings and reviews. The app then asks for permissions one screen at a time, including battery-limit exemptions, default text-message handler access, notifications, and Android Accessibility service access. With those permissions, RedWing can show fake login screens over banking and cryptocurrency apps, read one-time codes, stream the screen, log keystrokes, and silently enable call forwarding using the \u003cem\u003e21\u003c/em\u003e carrier code.\u003c/p\u003e\n\n\u003cp\u003eZimperium counted 82 targeted institutions across several sectors, with a strong focus on Russian financial firms, though the target list can change. The article says RedWing fits a broader move in Android crime toward on-device fraud, where attackers operate inside the victim’s own banking session instead of using stolen passwords elsewhere. Because the kit can be reskinned and its overlay targets changed from a control panel, the article emphasizes that behavior is a better signal than app names for tracking it.\u003c/p\u003e\n"},{"n":19,"title":"CERT/CC Warns of Hidden Admin Backdoor in Tenda Router Firmware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/certcc-warns-of-hidden-admin-backdoor.html","time":"06:40","priority":"SHOULD READ","score":82,"tldr":"CERT/CC warns that several Tenda router firmware versions contain an undocumented admin backdoor that can bypass normal password checks and grant full web-management control. No patch is available yet, so users should disable remote management and reduce device exposure.","briefOverview":"\u003cp\u003eCERT/CC warned that several firmware versions from Chinese network device manufacturer Tenda contain an undocumented authentication backdoor. The issue, tracked as CVE-2026-11405, can allow an attacker to bypass password verification and obtain full administrative control without valid credentials. The affected firmware versions include releases for Tenda FH1201, W15E, AC10, AC5, and AC6 devices.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor is present in the login() function of the /bin/httpd web server binary. After the normal MD5-based password verification path fails, the code calls GetValue(\u0026ldquo;sys.rzadmin.password\u0026rdquo;) to retrieve an alternate password from the device configuration and compares it in plaintext with the submitted password. If the values match, the application grants admin-level access with role=2 and creates a valid elevated session.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC said the associated \u0026ldquo;rzadmin\u0026rdquo; username is not validated, meaning any username can work when paired with the backdoor password. Successful exploitation can allow unauthorized remote changes to settings, disabling of security features, reconfiguration of the device, and potentially complete device takeover. The vulnerability remained unpatched at the time of writing, and users were advised to disable remote management and change the default LAN IP address.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT/CC warned that several Tenda firmware versions contain an undocumented authentication backdoor that enables administrative access to the devices' web management interfaces.","The vulnerability is tracked as CVE-2026-11405 and can allow an attacker to bypass password verification and obtain full administrative control without valid credentials.","The backdoor is present in the login() function of the /bin/httpd web server binary and uses an alternate password value stored as sys.rzadmin.password when normal authentication fails.","CERT/CC said the associated rzadmin username is not validated, so any username can succeed if paired with the backdoor password.","The vulnerability remained unpatched at the time of writing, and users were advised to disable remote management and change the default LAN IP address."],"insights":["The backdoor path only activates after normal MD5-based authentication fails, which could make it less obvious during routine review of the login process.","The backdoor password is compared in plaintext against a device configuration value, rather than being handled through the normal password verification mechanism.","Because the username tied to the backdoor is not actually validated, the hidden access does not require knowledge of a specific administrator username.","CERT/CC’s recommended mitigations focus on reducing reachability, such as disabling remote management and changing the default LAN IP address, because no patch was available at the time of writing."],"referencedReports":[{"title":"CERT/CC Alert on CVE-2026-11405","url":"https://kb.cert.org/vuls/id/213560","publisher":"CERT Coordination Center (CERT/CC)","context":"The article cites a CERT/CC alert warning that several Tenda firmware versions contain an undocumented authentication backdoor.","category":"","primary":false}],"body":"\u003cp\u003eCERT/CC warned that several firmware versions from Chinese network device manufacturer Tenda contain an undocumented authentication backdoor. The issue, tracked as CVE-2026-11405, can allow an attacker to bypass password verification and obtain full administrative control without valid credentials. The affected firmware versions include releases for Tenda FH1201, W15E, AC10, AC5, and AC6 devices.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor is present in the login() function of the /bin/httpd web server binary. After the normal MD5-based password verification path fails, the code calls GetValue(\u0026ldquo;sys.rzadmin.password\u0026rdquo;) to retrieve an alternate password from the device configuration and compares it in plaintext with the submitted password. If the values match, the application grants admin-level access with role=2 and creates a valid elevated session.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC said the associated \u0026ldquo;rzadmin\u0026rdquo; username is not validated, meaning any username can work when paired with the backdoor password. Successful exploitation can allow unauthorized remote changes to settings, disabling of security features, reconfiguration of the device, and potentially complete device takeover. The vulnerability remained unpatched at the time of writing, and users were advised to disable remote management and change the default LAN IP address.\u003c/p\u003e\n"},{"n":21,"title":"Court Filing Reveals Windows Device ID Helped FBI Trace Alleged Scattered Spider Hacker","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/court-filing-reveals-windows-device-id.html","time":"13:27","priority":"SHOULD READ","score":82,"tldr":"A newly unsealed complaint says the FBI linked alleged Scattered Spider member Peter Stokes to a 2025 jewelry retailer intrusion using a persistent Windows device identifier tied to the ngrok account used in the attack. The case underscores that Scattered Spider’s help-desk social engineering remains dangerous despite arrests, because the activity appears to come from loose, independent cells rather than one centralized gang.","briefOverview":"\u003cp\u003eU.S. prosecutors say a persistent Windows device ID helped the FBI trace alleged Scattered Spider hacker Peter Stokes to a May 2025 intrusion at a luxury jewelry retailer. Stokes, a 19-year-old dual U.S.-Estonian citizen known online as “Bouquet,” is charged with conspiracy, computer intrusion, and fraud, and is presumed innocent pending trial. He was extradited from Finland and made his first court appearance in Chicago on June 30.\u003c/p\u003e\n\n\u003cp\u003eThe attackers allegedly called the retailer’s IT help desk from Google Voice numbers, posed as locked-out employees, and got staff to reset passwords and mobile devices tied to multifactor authentication. They gained control of three accounts, including two IT administrator accounts, installed ngrok and Teleport, moved data to Amazon cloud storage, and stole at least 77 gigabytes. The company blocked an apparent ransomware attempt, did not pay an \u003cspan class=\"math inline\"\u003e\\(8 million cryptocurrency demand, and still incurred about \\)\u003c/span\u003e2 million in disruption, investigation, and cleanup costs.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft records tied the ngrok signup activity to Global Device Identifier g:6755467234350028, described as a persistent identifier tied to a single Windows installation. Investigators also found the same device appearing on IP addresses at the same times as Snapchat, Apple, and Facebook accounts prosecutors attribute to Stokes, including activity that matched travel records in Estonia, New York, and Thailand. The article notes that Group-IB describes Scattered Spider as a loose collective of small independent cells, suggesting that one arrest may not stop the broader activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. prosecutors linked alleged Scattered Spider hacker Peter Stokes to a May 2025 intrusion at a luxury jewelry retailer using a persistent Windows Global Device Identifier tied to a single Windows installation.","Attackers phoned the retailer’s IT help desk from Google Voice numbers, posed as locked-out employees, and got staff to reset passwords and mobile devices tied to multifactor authentication for three accounts, including two IT administrator accounts.","The attackers installed ngrok and Teleport, moved data to Amazon cloud storage, exfiltrated at least 77 gigabytes, and later demanded $8 million in cryptocurrency after the company blocked an apparent ransomware attempt.","Microsoft records showed the same Windows device ID visited the ngrok signup page the same minute the ngrok account was created and also appeared on IP addresses linked to accounts prosecutors attribute to Stokes.","Group-IB described Scattered Spider as a loose collective of small independent cells rather than a single group, arguing that arrests of some cells will not stop the threat itself."],"insights":["Phishing-resistant MFA does not protect an account if a help desk can be persuaded by phone to reset the account and its authentication device.","A persistent Windows device identifier can undermine attempts to hide behind proxies, tunneling tools, and aliases because it may link separate online accounts and activity back to the same Windows installation.","The article highlights help desk identity checks, such as callbacks to numbers already on file, manager approval, or video checks for privileged accounts, as the practical control for this kind of intrusion.","Group-IB’s view of Scattered Spider as small independent cells means individual arrests may leave the shared methods, tools, and chat-room connections intact.","The seized hard drives could be especially important because they may contain tools, infrastructure, or contacts that point investigators toward other members of the loose network."],"referencedReports":[{"title":"Connecting Scattered Spider","url":"https://www.group-ib.com/blog/connecting-scattered-spider/","publisher":"Group-IB","context":"The article cites Group-IB's recent research arguing that Scattered Spider is a loose collective of small independent cells rather than a single centralized group.","category":"","primary":false}],"body":"\u003cp\u003eU.S. prosecutors say a persistent Windows device ID helped the FBI trace alleged Scattered Spider hacker Peter Stokes to a May 2025 intrusion at a luxury jewelry retailer. Stokes, a 19-year-old dual U.S.-Estonian citizen known online as “Bouquet,” is charged with conspiracy, computer intrusion, and fraud, and is presumed innocent pending trial. He was extradited from Finland and made his first court appearance in Chicago on June 30.\u003c/p\u003e\n\n\u003cp\u003eThe attackers allegedly called the retailer’s IT help desk from Google Voice numbers, posed as locked-out employees, and got staff to reset passwords and mobile devices tied to multifactor authentication. They gained control of three accounts, including two IT administrator accounts, installed ngrok and Teleport, moved data to Amazon cloud storage, and stole at least 77 gigabytes. The company blocked an apparent ransomware attempt, did not pay an \u003cspan class=\"math inline\"\u003e\\(8 million cryptocurrency demand, and still incurred about \\)\u003c/span\u003e2 million in disruption, investigation, and cleanup costs.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft records tied the ngrok signup activity to Global Device Identifier g:6755467234350028, described as a persistent identifier tied to a single Windows installation. Investigators also found the same device appearing on IP addresses at the same times as Snapchat, Apple, and Facebook accounts prosecutors attribute to Stokes, including activity that matched travel records in Estonia, New York, and Thailand. The article notes that Group-IB describes Scattered Spider as a loose collective of small independent cells, suggesting that one arrest may not stop the broader activity.\u003c/p\u003e\n"},{"n":23,"title":"Public GitHub Issue Could Trick GitHub Agentic Workflows Into Leaking Private Repo Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/public-github-issue-could-trick-github.html","time":"14:04","priority":"SHOULD READ","score":82,"tldr":"Researchers showed that a malicious public GitHub issue can prompt GitHub Agentic Workflows with broad repo-read permissions to pull data from private repositories and post it publicly. The key risk is architectural: AI agents that read untrusted input, access private data, and can publish output need tightly scoped credentials and human review.","briefOverview":"\u003cp\u003eResearchers at Noma Security showed that a public GitHub issue can trick GitHub Agentic Workflows into leaking the contents of an organization’s private repositories. The technique, called GitLost, requires no stolen credentials and no access to the organization. It affects setups where an organization has enabled the preview feature, lets the agent read untrusted public issue content, gives it read access across private repositories, and allows it to post publicly.\u003c/p\u003e\n\n\u003cp\u003eGitLost relies on indirect prompt injection, where an AI agent follows instructions hidden in content it reads rather than only the instructions from its owner. In Noma’s proof of concept, a malicious issue disguised as a routine request caused the agent to pull a private repository’s README and paste it into a public issue comment. Noma reported that adding the word “Additionally” before the malicious instruction was enough in its test to slip past GitHub’s threat-detection step.\u003c/p\u003e\n\n\u003cp\u003eThe article says the broader risk comes from combining private data access, untrusted input, and a public output channel, a setup described as the “lethal trifecta.” Possible exposed data depends on what the agent’s token can access, including proprietary source code, internal keys, design documents, or CI/CD secrets. Recommended mitigations include scoping tokens to the repository being triaged, limiting what public-facing workflows can post, restricting whose content the agent acts on, and requiring human review before outputs are published.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Noma Security demonstrated a technique called GitLost in which a public GitHub issue can trick GitHub Agentic Workflows into leaking contents from an organization's private repositories into a public comment.","The attack requires no stolen credentials or access to the organization, but it depends on the organization giving the agent read access across repositories, including private ones, and allowing it to process public issue content.","GitLost relies on indirect prompt injection, where instructions hidden in attacker-controlled issue text can cause an AI agent to use its own permissions in unintended ways.","In Noma's proof of concept, prefixing a malicious instruction with the word “Additionally” was enough to bypass GitHub's output threat-detection guardrail and cause private repository README content to be posted publicly.","The article recommends limiting agent tokens to the repository being triaged, restricting what public-facing workflows can post, limiting which authors' content the agent acts on, and gating outputs behind human review."],"insights":["A single wording change, adding “Additionally” before the malicious instruction, was enough in Noma's test to make the request look like a follow-on task and slip past GitHub's threat-detection step.","The article frames the main danger as the agent's permission scope rather than the public issue itself, because a token limited to the triaged repository is described as far less dangerous than broad organization-wide read access.","GitLost fits the “lethal trifecta” described in the article: the agent can reach private data, consumes untrusted public content, and has a public channel for sending information out.","The article emphasizes that output filtering is only a backstop, because GitHub already had guardrails for this class of attack and the researchers still bypassed them in testing.","The practical exfiltration path is the agent's own normal public comment, meaning the leak can occur through intended workflow behavior rather than through a compromised server or stolen credential."],"referencedReports":[{"title":"GitLost: How We Tricked GitHub's AI Agent Into Leaking Private Repos","url":"https://noma.security/blog/gitlost-how-we-tricked-githubs-ai-agent-into-leaking-private-repos/","publisher":"Noma Security","context":"The article cites Noma Security's proof of concept as the basis for the GitLost finding involving GitHub Agentic Workflows leaking private repository contents.","category":"","primary":false},{"title":"The Lethal Trifecta","url":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","publisher":"Simon Willison","context":"The article references Simon Willison's term “lethal trifecta” to describe the risky combination of private data access, untrusted input, and a way to send data out.","category":"","primary":false},{"title":"MCP GitHub Vulnerability","url":"https://invariantlabs.ai/blog/mcp-github-vulnerability","publisher":"Invariant Labs","context":"The article says Invariant Labs showed that a public issue could push an agent connected to GitHub's MCP server into reading a private repository and leaking it through a pull request.","category":"","primary":false},{"title":"Comment and Control: Prompt Injection Credential Theft in Claude Code, Gemini CLI, and GitHub Copilot","url":"https://oddguan.com/blog/comment-and-control-prompt-injection-credential-theft-claude-code-gemini-cli-github-copilot/","publisher":"OddGuan","context":"The article references this cross-vendor study as research that tricked Claude Code, Gemini CLI, and GitHub Copilot agents into leaking their own API keys through issue and pull-request text.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Noma Security showed that a public GitHub issue can trick GitHub Agentic Workflows into leaking the contents of an organization’s private repositories. The technique, called GitLost, requires no stolen credentials and no access to the organization. It affects setups where an organization has enabled the preview feature, lets the agent read untrusted public issue content, gives it read access across private repositories, and allows it to post publicly.\u003c/p\u003e\n\n\u003cp\u003eGitLost relies on indirect prompt injection, where an AI agent follows instructions hidden in content it reads rather than only the instructions from its owner. In Noma’s proof of concept, a malicious issue disguised as a routine request caused the agent to pull a private repository’s README and paste it into a public issue comment. Noma reported that adding the word “Additionally” before the malicious instruction was enough in its test to slip past GitHub’s threat-detection step.\u003c/p\u003e\n\n\u003cp\u003eThe article says the broader risk comes from combining private data access, untrusted input, and a public output channel, a setup described as the “lethal trifecta.” Possible exposed data depends on what the agent’s token can access, including proprietary source code, internal keys, design documents, or CI/CD secrets. Recommended mitigations include scoping tokens to the repository being triaged, limiting what public-facing workflows can post, restricting whose content the agent acts on, and requiring human review before outputs are published.\u003c/p\u003e\n"},{"n":9,"title":"Spain arrests suspected member of pro-Russian hacktivist groups","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/spain-arrests-suspected-member-of-pro-russian-hacktivist-groups/","time":"15:21","priority":"SHOULD READ","score":80,"tldr":"Spanish police arrested a Palencia man suspected of supporting pro-Russian hacktivist groups including CyberArmy of Russia Reborn and Z-Pentest, which have been linked to attacks on critical infrastructure. The investigation, aided by the FBI, also led to seizures of computers, crypto devices, and frozen wallets tied to alleged stolen-data proceeds.","briefOverview":"\u003cp\u003eSpain\u0026rsquo;s National Police arrested a man in Palencia suspected of being an active member of the pro-Russian hacktivist groups CyberArmy of Russia Reborn and Z-Pentest. The groups have been linked to attacks targeting critical infrastructure in the U.S. and Europe. The police acted on information provided by the FBI and opened the investigation in August 2025.\u003c/p\u003e\n\n\u003cp\u003eThe article says CARR has been tied to cyberattacks against water and food-processing facilities, creating real safety risks for people in the U.S. Other alleged CARR members were previously sanctioned by the U.S. government for links to attacks against SCADA systems at an American energy firm. CARR has also been loosely linked to the Russian state-backed threat group APT44, also known as Sandworm.\u003c/p\u003e\n\n\u003cp\u003eSpanish investigators said the arrested man provided logistical and operational support to a Ukrainian hacker who operated for CARR and attempted to help the hacker escape to Russia through Poland and Belarus. Police said he used encrypted messaging applications to coordinate with other members of the groups and participated in actions attributed to NoName057(16). In March 2026, authorities searched his home, seized computers and cryptocurrency storage devices, and froze cryptocurrency wallets allegedly used to receive proceeds from stolen data sales.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Spain's National Police arrested a man in Palencia suspected of being an active member of the pro-Russian hacktivist groups CyberArmy of Russia Reborn and Z-Pentest.","The CyberArmy of Russia Reborn has been linked to cyberattacks against water and food-processing facilities, and alleged members have also been tied to attacks on SCADA systems at an American energy firm.","Spanish investigators said the suspect provided logistical and operational support to a Ukrainian hacker who operated for CARR and tried to facilitate the hacker’s escape to Russia through Poland and Belarus.","Police said the suspect used encrypted messaging applications to coordinate with other members of the groups and participated in actions attributed to NoName057(16).","Authorities seized computers and cryptocurrency storage devices from the suspect’s home and froze cryptocurrency wallets allegedly used to receive proceeds from stolen data sales."],"insights":["The case shows that authorities are treating some pro-Russian hacktivist activity as potentially tied to terrorism-related offenses, not merely as low-level online disruption.","The investigation highlights how hacktivist groups can create real-world safety risks when their targets include water, food-processing, and energy facilities.","The arrest was driven by international cooperation, with Spanish police launching their investigation based on information from the FBI.","The seizure and freezing of cryptocurrency assets indicates investigators are following alleged financial activity, including proceeds from stolen data sales, alongside the suspected hacktivist operations."],"referencedReports":[],"body":"\u003cp\u003eSpain\u0026rsquo;s National Police arrested a man in Palencia suspected of being an active member of the pro-Russian hacktivist groups CyberArmy of Russia Reborn and Z-Pentest. The groups have been linked to attacks targeting critical infrastructure in the U.S. and Europe. The police acted on information provided by the FBI and opened the investigation in August 2025.\u003c/p\u003e\n\n\u003cp\u003eThe article says CARR has been tied to cyberattacks against water and food-processing facilities, creating real safety risks for people in the U.S. Other alleged CARR members were previously sanctioned by the U.S. government for links to attacks against SCADA systems at an American energy firm. CARR has also been loosely linked to the Russian state-backed threat group APT44, also known as Sandworm.\u003c/p\u003e\n\n\u003cp\u003eSpanish investigators said the arrested man provided logistical and operational support to a Ukrainian hacker who operated for CARR and attempted to help the hacker escape to Russia through Poland and Belarus. Police said he used encrypted messaging applications to coordinate with other members of the groups and participated in actions attributed to NoName057(16). In March 2026, authorities searched his home, seized computers and cryptocurrency storage devices, and froze cryptocurrency wallets allegedly used to receive proceeds from stolen data sales.\u003c/p\u003e\n"},{"n":14,"title":"Britain plans to build autonomous AI 'Cyber Shield' to defend nation","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/britain-plans-autonomous-ai-cyber-shield","time":"15:31","priority":"SHOULD READ","score":78,"tldr":"Britain’s NCSC plans to build Cyber Shield, an autonomous AI defense capability that can find and eventually fix cybersecurity weaknesses across government and critical infrastructure at machine speed. The effort is meant to counter AI-assisted attackers and will require partnerships with AI labs, academia, cyber firms and infrastructure operators.","briefOverview":"\u003cp\u003eBritain’s National Cyber Security Centre laid out plans for Cyber Shield, described as a “national scale, sovereign defense capability” using agentic AI systems. The capability is intended to discover and fix cybersecurity weaknesses across government networks and critical national infrastructure. The NCSC said it is designed to counter attackers who could “move at machine speed and greater scale,” reducing opportunities for detection and response.\u003c/p\u003e\n\n\u003cp\u003eThe agency said adversaries aided by AI can already compress reconnaissance and vulnerability discovery from weeks into minutes. It warned that this could overwhelm traditional defenses and shift advantage toward attackers. GCHQ director Anne Keast-Butler previously referenced Cyber Shield and said the agency would “hardwire” agentic AI into machine-speed cyber defense.\u003c/p\u003e\n\n\u003cp\u003eCyber Shield is planned around paired “red” and “blue” AI agents, with red agents probing systems for weaknesses and blue agents defending them in real time. The NCSC said the capability will require six core functions, from automated scanning of British networks to fully autonomous fixing of vulnerabilities, while acknowledging that some functions need significant research progress. The agency gave no timeline and said the program cannot be built by government alone, calling for participation from academia, critical infrastructure operators, frontier AI labs and the cyber defense sector.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Britain’s National Cyber Security Centre outlined plans for Cyber Shield, a national-scale sovereign defense capability using agentic AI to discover and fix cybersecurity weaknesses across government networks and critical national infrastructure.","The NCSC said AI-assisted adversaries can already compress reconnaissance and vulnerability discovery from weeks into minutes, potentially overwhelming traditional defenses.","Cyber Shield is planned around paired red and blue AI agents, with red agents probing systems for weaknesses and blue agents defending them in real time under the control of the organizations that own the systems.","The NCSC said Cyber Shield will require six core functions, including automated scanning of British networks and fully autonomous fixing of vulnerabilities, though some functions still need significant research progress.","The agency gave no timeline for Cyber Shield and said it cannot be built by government alone, calling for help from academia, critical infrastructure operators, frontier AI labs and the cyber defense sector."],"insights":["The NCSC is treating AI-driven defense as a national-scale capability rather than a single government tool, because Cyber Shield is intended to operate across both government networks and critical national infrastructure.","The program’s design keeps control with the organizations that own the infrastructure, even while using autonomous red and blue AI agents to test and defend systems in real time.","The NCSC acknowledged that automated scanning already exists in some form, but fully autonomous fixing of vulnerabilities remains an unsolved capability requiring significant research progress.","The lack of a timeline and the call for frontier AI labs, academia, critical infrastructure operators and cyber defense firms show that Cyber Shield is still at the blueprint-building stage rather than a ready deployment."],"referencedReports":[],"body":"\u003cp\u003eBritain’s National Cyber Security Centre laid out plans for Cyber Shield, described as a “national scale, sovereign defense capability” using agentic AI systems. The capability is intended to discover and fix cybersecurity weaknesses across government networks and critical national infrastructure. The NCSC said it is designed to counter attackers who could “move at machine speed and greater scale,” reducing opportunities for detection and response.\u003c/p\u003e\n\n\u003cp\u003eThe agency said adversaries aided by AI can already compress reconnaissance and vulnerability discovery from weeks into minutes. It warned that this could overwhelm traditional defenses and shift advantage toward attackers. GCHQ director Anne Keast-Butler previously referenced Cyber Shield and said the agency would “hardwire” agentic AI into machine-speed cyber defense.\u003c/p\u003e\n\n\u003cp\u003eCyber Shield is planned around paired “red” and “blue” AI agents, with red agents probing systems for weaknesses and blue agents defending them in real time. The NCSC said the capability will require six core functions, from automated scanning of British networks to fully autonomous fixing of vulnerabilities, while acknowledging that some functions need significant research progress. The agency gave no timeline and said the program cannot be built by government alone, calling for participation from academia, critical infrastructure operators, frontier AI labs and the cyber defense sector.\u003c/p\u003e\n"},{"n":22,"title":"Rogue Agent Flaw Could Have Let Attackers Hijack Google Dialogflow CX Chatbots","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/rogue-agent-flaw-could-have-let.html","time":"16:37","priority":"SHOULD READ","score":78,"tldr":"A flaw in Google Dialogflow CX, dubbed Rogue Agent, could let someone with edit rights to one Code Block-enabled agent hijack the shared runtime for all similar agents in the same Google Cloud project, exposing live chats and enabling phishing messages. Google has fixed the issue, and there is no evidence it was exploited.","briefOverview":"\u003cp\u003eVaronis found a critical flaw in Google Dialogflow CX called Rogue Agent that could have allowed an attacker with edit rights on one Code Block-enabled agent to compromise other Code Block-enabled agents in the same Google Cloud project. The issue affected organizations using Dialogflow Playbooks and custom Code Blocks, which let developers add Python code. It was not a remote, unauthenticated attack, and Google and Varonis said there was no evidence it was used in a real attack.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stemmed from the way Code Blocks ran in a shared Google-managed Cloud Run environment for agents in the same project. Varonis found that the file code_execution_env.py, which wrapped developer code and passed it to Python’s exec() function, was writable inside that shared environment. A malicious Code Block could overwrite that file so attacker-controlled code ran for every Code Block execution across every agent sharing the environment.\u003c/p\u003e\n\n\u003cp\u003eThe attacker’s modified code could access conversation history, session details, and the respond() function, allowing it to read live conversations, send data to an attacker-controlled server, and make bots send attacker-written messages such as password re-verification prompts. Varonis also reported unrestricted outbound internet access and exposure of the Instance Metadata Service in the Code Block environment. Google fixed the issue, and organizations that used Code Block Playbooks before the fix were advised to audit dialogflow.playbooks.update permissions, review Dialogflow API DATA_WRITE logs, check failed request logs, and inspect approved Code Blocks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis found a critical flaw in Google Dialogflow CX, named Rogue Agent, that could let an attacker with dialogflow.playbooks.update permission on one Code Block-enabled agent compromise other Code Block-enabled agents in the same Google Cloud project.","The attack worked because Code Block-enabled agents in the same Google Cloud project shared a Google-managed Cloud Run environment where the writable file code_execution_env.py wrapped and executed Code Block Python code.","A malicious Code Block could overwrite code_execution_env.py so the attacker’s version ran for every Code Block execution across every agent sharing the environment, allowing access to conversation history, session state, and the respond() function.","Varonis also reported that the Code Block environment had unrestricted outbound internet access and could reach the Instance Metadata Service, though the exposed Google-managed service account was low-privilege.","Google fixed the issue, Varonis and Google said there was no evidence of real-world exploitation, and organizations that used Code Block Playbooks before the fix were advised to audit playbook update permissions and related logs."],"insights":["The entry permission, dialogflow.playbooks.update, should be treated as a code-execution permission rather than a simple chatbot content-editing right because Code Blocks can run arbitrary Python in the shared runtime.","Removing or restoring the visible malicious Code Block in the Dialogflow console would not necessarily stop the attack because the overwritten runtime file could keep executing inside the container underneath.","Customer-side detection was limited because the file overwrite occurred inside Google’s managed environment and was not recorded in Cloud Logging, so investigators would need to rely on indirect traces such as playbook updates and failed request errors.","The unrestricted outbound internet access in the Code Block environment created a data-exfiltration and remote-control channel even without the shared file overwrite technique.","The flaw shows that agents sharing one invisible runtime can create cross-agent risk inside a single Google Cloud project, even when the attacker only starts with edit access to one agent."],"referencedReports":[{"title":"Rogue Agent Dialogflow Attack","url":"https://www.varonis.com/blog/rogue-agent-dialogflow-attack","publisher":"Varonis","context":"The article says Varonis found the Dialogflow CX flaw, named it Rogue Agent, and links to Varonis's write-up as the basis for the technical details.","category":"","primary":false},{"title":"Prompts become shells: RCE vulnerabilities in AI agent frameworks","url":"https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/","publisher":"Microsoft","context":"The article references Microsoft researchers showing prompt injection turning into code execution in the Semantic Kernel framework as a comparison to Rogue Agent.","category":"","primary":false}],"body":"\u003cp\u003eVaronis found a critical flaw in Google Dialogflow CX called Rogue Agent that could have allowed an attacker with edit rights on one Code Block-enabled agent to compromise other Code Block-enabled agents in the same Google Cloud project. The issue affected organizations using Dialogflow Playbooks and custom Code Blocks, which let developers add Python code. It was not a remote, unauthenticated attack, and Google and Varonis said there was no evidence it was used in a real attack.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stemmed from the way Code Blocks ran in a shared Google-managed Cloud Run environment for agents in the same project. Varonis found that the file code_execution_env.py, which wrapped developer code and passed it to Python’s exec() function, was writable inside that shared environment. A malicious Code Block could overwrite that file so attacker-controlled code ran for every Code Block execution across every agent sharing the environment.\u003c/p\u003e\n\n\u003cp\u003eThe attacker’s modified code could access conversation history, session details, and the respond() function, allowing it to read live conversations, send data to an attacker-controlled server, and make bots send attacker-written messages such as password re-verification prompts. Varonis also reported unrestricted outbound internet access and exposure of the Instance Metadata Service in the Code Block environment. Google fixed the issue, and organizations that used Code Block Playbooks before the fix were advised to audit dialogflow.playbooks.update permissions, review Dialogflow API DATA_WRITE logs, check failed request logs, and inspect approved Code Blocks.\u003c/p\u003e\n"},{"n":30,"title":"OMB M-26-14: Why federal agencies must fix asset visibility first","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/omb-m-26-14-asset-visibility-logging-maturity-model-compliance","time":"18:30","priority":"SHOULD READ","score":78,"tldr":"OMB M-26-14 makes complete asset visibility the foundation for federal logging maturity, requiring agencies to prove increasing IT, OT, and IoT inventory coverage before they can meet log collection milestones. Agencies should close asset discovery gaps before CISA’s logging reference architecture starts the compliance clock.","briefOverview":"\u003cp\u003eOMB Memorandum M-26-14, issued on May 22 by OMB Director Russell Vought, rescinds M-21-31 and replaces blanket data-retention mandates with a risk-based logging maturity model. The article emphasizes that the new directive ties federal logging progress to asset visibility across IT, OT, and IoT environments. Agencies must achieve maturity milestones after CISA publishes the Logging Reference Architecture, including Level 1 within 120 days, Level 2 within 180 days, and Level 3 within 320 days.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main point is that agencies cannot measure or prove log coverage unless they first know what assets exist on their networks. M-26-14 requires centralized inventory capture of 70%, 80%, 90%, and 95% of IT, OT, and IoT assets at Levels 1 through 4, respectively. Overall maturity is calculated using the lowest-performing element, so weak inventory visibility can hold an agency’s total maturity level down even if other logging capabilities are stronger.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains that OT and IoT systems are explicitly in scope, including systems without native logging capability and systems owned, operated, or managed by third parties. It argues that passive discovery and safe asset discovery methods are necessary for fragile environments where standard IT scanning can create operational risk. Tenable presents its products as tools for building authoritative asset inventories, validating coverage through CDM, and prioritizing logging resources based on exposure and threat context.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OMB M-26-14 rescinds M-21-31 and replaces blanket data-retention mandates with a risk-based logging maturity model based on five elements: inventory visibility, collection coverage, collection operations, data retention, and log management.","The maturity model requires agencies to capture 70%, 80%, 90%, and 95% of IT, OT, and IoT assets in centralized inventories at levels 1 through 4, respectively.","Overall maturity is calculated using the lowest-performing element, so an agency with strong log collection but weak inventory visibility receives the lower overall maturity level.","The directive explicitly includes IoT devices and operational technology systems, including systems owned, operated, or managed by third parties.","Once CISA publishes the logging reference architecture, agencies must submit an Agency Logging Plan within 90 days and reach levels 1, 2, and 3 within 120, 180, and 320 days, respectively."],"insights":["The article frames asset inventory as the practical bottleneck for M-26-14 compliance because the maturity score cannot rise above the weakest element, meaning incomplete inventories can hold back agencies even if their logging tools are advanced.","The memo’s inclusion of OT and IoT systems makes passive discovery especially important because the article notes that standard IT scanners can crash fragile operational equipment such as programmable logic controllers.","The period before CISA publishes the logging reference architecture is presented as a critical preparation window, since agencies can use it to close inventory gaps before the formal deadlines begin.","The article argues that discovering previously unknown assets creates a second challenge: agencies must then prioritize limited logging resources based on risk rather than treating every newly found system equally."],"referencedReports":[{"title":"Ensuring Effective and Efficient Agency Logging and Network Visibility to Defend Against Evolving Cyber Threats","url":"https://www.whitehouse.gov/wp-content/uploads/2026/05/M-26-14-Ensuring-Effective-and-Efficient-Agency-Logging-and-Network-Visibility-to-Defend-Against-Evolving-Cyber-Threats.pdf","publisher":"U.S. Office of Management and Budget","context":"The article is centered on OMB Memorandum M-26-14 and explains its logging maturity model, asset inventory requirements, and deadlines for federal agencies.","category":"","primary":false},{"title":"Improving the Federal Government’s Investigative and Remediation Capabilities Related to Cybersecurity Incidents","url":"https://www.whitehouse.gov/wp-content/uploads/2021/08/M-21-31-Improving-the-Federal-Governments-Investigative-and-Remediation-Capabilities-Related-to-Cybersecurity-Incidents.pdf","publisher":"U.S. Office of Management and Budget","context":"The article references OMB M-21-31 as the prior memorandum that M-26-14 rescinds and replaces.","category":"","primary":false},{"title":"Logging Reference Architecture","url":"https://www.cisa.gov/resources-tools/resources/logging-reference-architecture","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article says M-26-14 deadlines begin after CISA publishes the Logging Reference Architecture and repeatedly ties agency milestones to it.","category":"","primary":false},{"title":"Zero Trust Maturity Model","url":"https://www.cisa.gov/zero-trust-maturity-model","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article states that M-26-14 requires the Logging Reference Architecture to align with CISA’s Zero Trust Maturity Model.","category":"","primary":false}],"body":"\u003cp\u003eOMB Memorandum M-26-14, issued on May 22 by OMB Director Russell Vought, rescinds M-21-31 and replaces blanket data-retention mandates with a risk-based logging maturity model. The article emphasizes that the new directive ties federal logging progress to asset visibility across IT, OT, and IoT environments. Agencies must achieve maturity milestones after CISA publishes the Logging Reference Architecture, including Level 1 within 120 days, Level 2 within 180 days, and Level 3 within 320 days.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main point is that agencies cannot measure or prove log coverage unless they first know what assets exist on their networks. M-26-14 requires centralized inventory capture of 70%, 80%, 90%, and 95% of IT, OT, and IoT assets at Levels 1 through 4, respectively. Overall maturity is calculated using the lowest-performing element, so weak inventory visibility can hold an agency’s total maturity level down even if other logging capabilities are stronger.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains that OT and IoT systems are explicitly in scope, including systems without native logging capability and systems owned, operated, or managed by third parties. It argues that passive discovery and safe asset discovery methods are necessary for fragile environments where standard IT scanning can create operational risk. Tenable presents its products as tools for building authoritative asset inventories, validating coverage through CDM, and prioritizing logging resources based on exposure and threat context.\u003c/p\u003e\n"},{"n":43,"title":"GitHub Secret Scanning Public Monitoring for Enterprises: Coverage and Gaps","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/github-secret-scanning-public-monitoring-for-enterprises-coverage-and-gaps","time":"22:01","priority":"SHOULD READ","score":78,"tldr":"GitHub’s new public monitoring for enterprise secret scanning helps detect leaked organization secrets across public github.com surfaces, but it only catches exposure after secrets are already public and misses many exfiltration paths such as attacker-controlled endpoints and workflow logs. Enterprises should enable it, but pair it with CI/CD runtime egress controls and broader pipeline leak detection to prevent secrets from leaving in the first place.","briefOverview":"\u003cp\u003eGitHub has introduced public monitoring for secret scanning in public preview for enterprises. The feature watches the public surface of github.com for an organization’s secrets beyond repositories the enterprise owns. It scans public content in real time, including git content, pull request comments, and GitHub issues, and uses GitHub’s identity layer and verified domains to attribute leaks back to an enterprise.\u003c/p\u003e\n\n\u003cp\u003eThe article says this closes a real gap because secrets can appear outside repositories monitored by security teams, including in personal forks, open source contributions, public issues, or newly created public repositories used by attackers. It cites Sha1-Hulud and Megalodon as examples where stolen credentials were exfiltrated into public GitHub repositories. Eligible GitHub Enterprise Cloud customers with Secret Protection or Advanced Security can enable the feature from the enterprise Security tab at no additional cost.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that public monitoring is detection after exposure and only covers GitHub’s announced public scan surfaces. It cannot see secrets sent to attacker-controlled infrastructure, and workflow run logs are not listed among the documented scanned surfaces despite past exposure through build logs. The article recommends pairing GitHub public monitoring with runtime egress control and pipeline leak detection so organizations can both find public leaks and stop secrets from leaving CI environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub’s public monitoring for secret scanning is in public preview for enterprises and scans public content on github.com in real time for an organization’s secrets beyond repositories the enterprise owns.","The feature covers public git content, pull request comments, and GitHub issues, and attributes leaks back to an enterprise using GitHub’s identity layer and verified domains.","The article says public monitoring does not scan private repositories and cannot see secrets stolen from developer machines or CI environments and sent to attacker-controlled infrastructure.","The article notes that workflow run logs are not listed among GitHub’s documented scanned surfaces, even though the tj-actions/changed-files compromise exposed CI/CD credentials in build logs.","The article recommends enabling public monitoring for eligible GitHub Enterprise Cloud customers and pairing it with runtime egress control and pipeline leak detection to reduce secret exfiltration risk."],"insights":["GitHub itself has become an attacker exfiltration destination, as shown by Sha1-Hulud creating more than 21,000 public repositories within hours and Megalodon spreading stolen secrets across 5,500 public repositories.","GitHub’s identity layer and verified domains are central to the new feature because they can connect a secret dumped in an unrelated public repository back to the affected enterprise.","Real-time public monitoring reduces response time but still happens after exposure, while attackers can validate and abuse leaked credentials within minutes.","Workflow run logs should be treated as outside the feature’s scope until GitHub documents coverage, even though they have already been used to expose CI/CD credentials.","The article’s recommended security model is layered: use GitHub public monitoring to find secrets exposed on public GitHub surfaces and runtime egress control to stop secrets from leaving CI pipelines."],"referencedReports":[],"body":"\u003cp\u003eGitHub has introduced public monitoring for secret scanning in public preview for enterprises. The feature watches the public surface of github.com for an organization’s secrets beyond repositories the enterprise owns. It scans public content in real time, including git content, pull request comments, and GitHub issues, and uses GitHub’s identity layer and verified domains to attribute leaks back to an enterprise.\u003c/p\u003e\n\n\u003cp\u003eThe article says this closes a real gap because secrets can appear outside repositories monitored by security teams, including in personal forks, open source contributions, public issues, or newly created public repositories used by attackers. It cites Sha1-Hulud and Megalodon as examples where stolen credentials were exfiltrated into public GitHub repositories. Eligible GitHub Enterprise Cloud customers with Secret Protection or Advanced Security can enable the feature from the enterprise Security tab at no additional cost.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that public monitoring is detection after exposure and only covers GitHub’s announced public scan surfaces. It cannot see secrets sent to attacker-controlled infrastructure, and workflow run logs are not listed among the documented scanned surfaces despite past exposure through build logs. The article recommends pairing GitHub public monitoring with runtime egress control and pipeline leak detection so organizations can both find public leaks and stop secrets from leaving CI environments.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft testing new Cloud Rebuild Windows 11 recovery feature","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-testing-new-cloud-rebuild-windows-11-recovery-feature/","time":"07:37","priority":"MAY READ","score":72,"tldr":"Microsoft is testing a new Windows 11 Cloud Rebuild recovery feature that can reinstall the OS from the cloud, including drivers from Windows Update, even when a PC will not boot. The feature is part of Microsoft’s broader push to improve Windows recovery and resilience for broken or inoperable devices.","briefOverview":"\u003cp\u003eMicrosoft has begun testing Cloud Rebuild, a new Windows 11 recovery feature, in the latest Windows 11 Insider Preview builds for users in the Experimental channe
