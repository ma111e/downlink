<script type="application/json" id="dl-articles">[{"n":24,"title":"Suspected China-Aligned Hackers Exploit Roundcube Flaws Against Universities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/suspected-china-aligned-hackers-exploit.html","time":"09:10","priority":"MUST READ","score":94,"tldr":"A suspected China-aligned group tracked as UNK_MassTraction is exploiting patched Roundcube webmail flaws at U.S. and Canadian university physics and engineering departments to steal credentials and gain persistent access to mail servers. The campaign uses an XSS-to-RCE chain with IceCube, SquareShell, VShell, and SNOWLIGHT, showing that exposed mail servers should be defended like other edge devices.","briefOverview":"\u003cp\u003eA suspected China-aligned threat activity cluster is exploiting Roundcube webmail software used by physics and engineering departments at U.S. and Canadian universities. Proofpoint tracks the cluster as UNK_MassTraction and first detected the activity in May 2026. The campaign focuses on administrators and professors in departments with national security ties or entities studying astrophysics and particle physics.\u003c/p\u003e\n\n\u003cp\u003eThe activity uses compromised senders and domains vulnerable to spoofing because of lax DMARC policies to send emails. The exploit for CVE-2024-42009 only requires a recipient to open the email in the Roundcube client, allowing JavaScript code to run in the victim’s browser. Proofpoint assessed that the targeted departments were likely selected because they were running Roundcube versions vulnerable to the N-day flaws used in the campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter exploitation, the IceCube payload steals browser-stored credentials, two-factor authentication information, and cookies, and collects browser and form information. It then uses the session’s CSRF token to exploit CVE-2025-49113, aiming to gain access to the mail server and deploy SquareShell or VShell. If the web shell deployment fails, the attack chain can fall back to a shell script that delivers SNOWLIGHT and then VShell, and Proofpoint said the campaign shows that mail servers should be defended like other externally exposed network devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint observed a suspected China-aligned activity cluster, tracked as UNK_MassTraction, exploiting Roundcube webmail software used by physics and engineering departments at U.S. and Canadian universities.","The campaign targets administrators and professors in departments with national security ties or research areas including astrophysics and particle physics.","The attackers exploit patched Roundcube flaws including CVE-2024-42009 to steal credentials, two-factor authentication data, and cookies, then use CVE-2025-49113 to attempt remote code execution on the mail server.","After exploitation, the campaign can deploy a web shell called SquareShell or the post-exploitation tool VShell, with a fallback chain involving a shell script and the SNOWLIGHT ELF loader.","Proofpoint said the campaign shows that email delivery can enable compromise of mail servers and that Chinese operators are treating mail servers like other externally exposed network devices."],"insights":["The Roundcube XSS exploit only requires the recipient to open the email in the Roundcube client, making ordinary email viewing sufficient to start the compromise chain.","Proofpoint assessed that the attackers likely performed reconnaissance before sending emails because the targeted departments were all running Roundcube versions vulnerable to the specific N-day flaws used in the campaign.","IceCube includes “deferred triggers” that re-attempt exploitation when the user closes the page, changes tabs, moves the mouse out of the browser window, or clicks logout, showing the infection chain was designed to persist despite normal user behavior.","The malware destroys user and malware-initiated sessions after completing its actions or timing out, causing logout while also erasing forensic evidence from the Roundcube server.","Proofpoint noted this is the first time a Chinese hacking group has been tied to exploitation of Roundcube flaws, which the article says have traditionally been abused by Russian state-sponsored actors."],"referencedReports":[],"body":"\u003cp\u003eA suspected China-aligned threat activity cluster is exploiting Roundcube webmail software used by physics and engineering departments at U.S. and Canadian universities. Proofpoint tracks the cluster as UNK_MassTraction and first detected the activity in May 2026. The campaign focuses on administrators and professors in departments with national security ties or entities studying astrophysics and particle physics.\u003c/p\u003e\n\n\u003cp\u003eThe activity uses compromised senders and domains vulnerable to spoofing because of lax DMARC policies to send emails. The exploit for CVE-2024-42009 only requires a recipient to open the email in the Roundcube client, allowing JavaScript code to run in the victim’s browser. Proofpoint assessed that the targeted departments were likely selected because they were running Roundcube versions vulnerable to the N-day flaws used in the campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter exploitation, the IceCube payload steals browser-stored credentials, two-factor authentication information, and cookies, and collects browser and form information. It then uses the session’s CSRF token to exploit CVE-2025-49113, aiming to gain access to the mail server and deploy SquareShell or VShell. If the web shell deployment fails, the attack chain can fall back to a shell script that delivers SNOWLIGHT and then VShell, and Proofpoint said the campaign shows that mail servers should be defended like other externally exposed network devices.\u003c/p\u003e\n"},{"n":39,"title":"UAT-7810 continues building ORB networks using new malware","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/uat-7810/","time":"10:00","priority":"MUST READ","score":94,"tldr":"Cisco Talos reports that China-nexus APT UAT-7810 is continuing to build LapDogs ORB networks by exploiting unpatched routers and deploying newly identified malware families including LONGLEASH, DOGLEASH, JARLEASH, and LEASHTEST. The activity suggests ongoing development of relay infrastructure that other China-linked threat actors can use for operations against high-value targets.","briefOverview":"\u003cp\u003eCisco Talos is tracking infrastructure and malware associated with UAT-7810, a China-nexus advanced persistent threat actor responsible for maintaining and expanding the LapDogs Operational Relay Box network. Talos assesses with high confidence that UAT-7810 provides infrastructure to secondary China-nexus APTs such as UAT-5918, while considering UAT-5918 and UAT-7810 separate actors with distinct objectives and targets. The article says UAT-7810 is most likely tasked with establishing relay networks that other threat actors can use for malicious attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eTalos found that UAT-7810 continues to develop its custom SHORTLEASH malware, with a newer version tracked as LONGLEASH. LONGLEASH is built from the same “ff-agent” codebase and includes capabilities such as reverse shell access, HTTP, DNS, SOCKS, TCP, ICMP, and UDP proxying, traffic redirection, SMTP functions, client authorization, tunnel management, and acting as an intermediate command-and-control server. Talos also identified DOGLEASH, a C-based backdoor for compromised Linux devices, JARLEASH, a Java-based backdoor used for file management, FTP, SFTP, and Netcat functions, and LEASHTEST, a MIPS test binary whose presence likely indicates compromise.\u003c/p\u003e\n\n\u003cp\u003eThe article says UAT-7810 primarily exploits known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717. Talos also identified four servers used to host malicious payloads for MIPS, ARM, and x64 platforms, including 194.233.92[.]26, 217.15.160[.]247, 217.15.164[.]147, and 95.182.100[.]231. One of those IP addresses, 217.15.164[.]147, was also associated with exploitation of ASUS AiCloud Routers using CVE-2025-2492 in early 2026, indicating an attempt by UAT-7810 or an associated actor to expand the ORB network to AiCloud Routers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos is tracking infrastructure and malware associated with UAT-7810, a China-nexus APT actor responsible for maintaining and expanding the LapDogs Operational Relay Box network.","Talos assesses that UAT-7810 likely establishes Operational Relay Box networks that secondary threat actors, including China-nexus APTs such as UAT-5918, can use for malicious attacks against high-value targets.","UAT-7810 continues to develop its SHORTLEASH malware, with Talos tracking a newer version as LONGLEASH that adds capabilities such as proxying, reverse shell access, traffic redirection, SMTP functions, and acting as an intermediate C2 server.","Talos identified two previously unknown UAT-7810 tools: DOGLEASH, a C-based backdoor for compromised Linux devices, and JARLEASH, a Java-based backdoor with file management, FTP, SFTP, and Netcat capabilities.","Talos observed UAT-7810 primarily exploiting known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717."],"insights":["The IP address 217.15.164[.]147 was linked both to UAT-7810 payload hosting and to exploitation of ASUS AiCloud Routers using CVE-2025-2492, indicating the same infrastructure was associated with attempts to reach beyond Ruckus devices.","Two UAT-7810 servers hosted a TLS service on port 99 using the same certificate fingerprint and an obviously fake subject distinguished name made entirely of the value “exploit,” giving defenders a concrete infrastructure clue beyond IP addresses alone.","LONGLEASH includes functionality to remove the implant and its traces if suspicious connections or tampering are detected, which makes rapid evidence preservation important when investigating suspected compromises.","The presence of LEASHTEST on a device is notable even though the binary is not malicious as-is, because Talos says its presence likely indicates compromise and shows UAT-7810 was testing basic MIPS device functionality.","JARLEASH can fall back to an embedded configuration if no external configuration file is present, and the configuration file found by Talos contained Simplified Chinese comments."],"referencedReports":[{"title":"LapDogs STRIKE Report June 2025","url":"https://securityscorecard.com/wp-content/uploads/2025/06/LapDogs-STRIKE-Report-June-2025.pdf","publisher":"SecurityScorecard","context":"The article says SecurityScorecard first disclosed the LapDogs Operational Relay Box network in 2025 and cites the report for overlapping tooling between UAT-5918 and UAT-7810.","category":"","primary":false}],"body":"\u003cp\u003eCisco Talos is tracking infrastructure and malware associated with UAT-7810, a China-nexus advanced persistent threat actor responsible for maintaining and expanding the LapDogs Operational Relay Box network. Talos assesses with high confidence that UAT-7810 provides infrastructure to secondary China-nexus APTs such as UAT-5918, while considering UAT-5918 and UAT-7810 separate actors with distinct objectives and targets. The article says UAT-7810 is most likely tasked with establishing relay networks that other threat actors can use for malicious attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eTalos found that UAT-7810 continues to develop its custom SHORTLEASH malware, with a newer version tracked as LONGLEASH. LONGLEASH is built from the same “ff-agent” codebase and includes capabilities such as reverse shell access, HTTP, DNS, SOCKS, TCP, ICMP, and UDP proxying, traffic redirection, SMTP functions, client authorization, tunnel management, and acting as an intermediate command-and-control server. Talos also identified DOGLEASH, a C-based backdoor for compromised Linux devices, JARLEASH, a Java-based backdoor used for file management, FTP, SFTP, and Netcat functions, and LEASHTEST, a MIPS test binary whose presence likely indicates compromise.\u003c/p\u003e\n\n\u003cp\u003eThe article says UAT-7810 primarily exploits known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717. Talos also identified four servers used to host malicious payloads for MIPS, ARM, and x64 platforms, including 194.233.92[.]26, 217.15.160[.]247, 217.15.164[.]147, and 95.182.100[.]231. One of those IP addresses, 217.15.164[.]147, was also associated with exploitation of ASUS AiCloud Routers using CVE-2025-2492 in early 2026, indicating an attempt by UAT-7810 or an associated actor to expand the ORB network to AiCloud Routers.\u003c/p\u003e\n"},{"n":4,"title":"New Januscape Linux flaw allows VM escape on Intel, AMD devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/linux/new-januscape-linux-kernel-flaw-allows-vm-escape-on-intel-amd-devices/","time":"12:06","priority":"MUST READ","score":93,"tldr":"A 16-year-old Linux KVM/x86 flaw called Januscape allows attackers with root access inside a VM to escape to the host and potentially take over or crash all guest VMs on Intel and AMD systems. Administrators running multi-tenant KVM hosts should ensure the June 2026 kernel patch is applied.","briefOverview":"\u003cp\u003eA 16-year-old Linux kernel vulnerability, dubbed \u003cstrong\u003eJanuscape\u003c/strong\u003e and tracked as CVE-2026-53359, allows attackers to escape a virtual machine and execute arbitrary code on the host. Security researcher Hyunwoo Kim discovered the flaw and said it stems from a use-after-free weakness in the shadow MMU emulation of KVM/x86. The vulnerability was patched in June 2026 and was used as a zero-day exploit in Google\u0026rsquo;s kvmCTF vulnerability reward program.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation allows attackers with root access inside a guest virtual machine to execute code as root on the host, take over all guests running on it, or crash the host kernel. Kim described Januscape as the first guest-to-host exploit that can be triggered on both Intel and AMD processor architectures. He noted that it poses a distinct risk to multi-tenant public cloud environments such as Google Cloud and Amazon Web Services.\u003c/p\u003e\n\n\u003cp\u003eKim published a technical write-up and a proof-of-concept exploit that can trigger a host kernel panic, but said a full guest-to-host escape exploit will not be released for the foreseeable future. On some Linux distributions, such as Red Hat Enterprise Linux, where /dev/kvm is world-writable, unprivileged attackers can exploit CVE-2026-53359 to reliably gain root permissions on unpatched devices. Administrators running KVM/x86 hosts that accept multi-tenant guests should confirm that patch commit 81ccda30b4e8 has been applied to the host kernel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A 16-year-old Linux kernel vulnerability called Januscape, tracked as CVE-2026-53359, allows attackers to escape a virtual machine and execute arbitrary code on the host.","The flaw stems from a use-after-free weakness in the shadow MMU emulation of KVM/x86 and affects both Intel and AMD processor architectures.","Successful exploitation allows attackers with root access inside a guest virtual machine to execute code as root on the host, take over all guests running on it, or crash the host kernel.","Hyunwoo Kim published a technical write-up and a proof-of-concept exploit that can trigger a host kernel panic, but said a full guest-to-host escape exploit will not be released for the foreseeable future.","Administrators running KVM/x86 hosts that accept multi-tenant guests should confirm that patch commit 81ccda30b4e8 has been applied to the host kernel."],"insights":["On some Linux distributions such as Red Hat Enterprise Linux, the article says /dev/kvm is world-writable, which can let unprivileged attackers exploit CVE-2026-53359 to reliably gain root permissions on unpatched devices.","The risk is broader than attackers who already have guest root access because Hyunwoo Kim noted that Dirty Frag could be chained with Januscape to achieve full compromise when guest root access is not initially available.","The published proof-of-concept is limited to triggering a host kernel panic, while the researcher said a full guest-to-host escape exploit will not be released for the foreseeable future.","Cloud environments are especially exposed because the article says root access inside guest virtual machines is the default configuration on public cloud instances."],"referencedReports":[{"title":"Januscape technical write-up","url":"https://github.com/V4bel/Januscape/blob/main/assets/write-up.md","publisher":"Hyunwoo Kim","context":"The article says Hyunwoo Kim published a technical write-up and proof-of-concept exploit for Januscape.","category":"","primary":false}],"body":"\u003cp\u003eA 16-year-old Linux kernel vulnerability, dubbed \u003cstrong\u003eJanuscape\u003c/strong\u003e and tracked as CVE-2026-53359, allows attackers to escape a virtual machine and execute arbitrary code on the host. Security researcher Hyunwoo Kim discovered the flaw and said it stems from a use-after-free weakness in the shadow MMU emulation of KVM/x86. The vulnerability was patched in June 2026 and was used as a zero-day exploit in Google\u0026rsquo;s kvmCTF vulnerability reward program.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation allows attackers with root access inside a guest virtual machine to execute code as root on the host, take over all guests running on it, or crash the host kernel. Kim described Januscape as the first guest-to-host exploit that can be triggered on both Intel and AMD processor architectures. He noted that it poses a distinct risk to multi-tenant public cloud environments such as Google Cloud and Amazon Web Services.\u003c/p\u003e\n\n\u003cp\u003eKim published a technical write-up and a proof-of-concept exploit that can trigger a host kernel panic, but said a full guest-to-host escape exploit will not be released for the foreseeable future. On some Linux distributions, such as Red Hat Enterprise Linux, where /dev/kvm is world-writable, unprivileged attackers can exploit CVE-2026-53359 to reliably gain root permissions on unpatched devices. Administrators running KVM/x86 hosts that accept multi-tenant guests should confirm that patch commit 81ccda30b4e8 has been applied to the host kernel.\u003c/p\u003e\n"},{"n":8,"title":"Chinese hackers develop LONGLEASH malware to expand ORB network","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chinese-hackers-develop-longleash-malware-to-expand-orb-network/","time":"18:52","priority":"MUST READ","score":93,"tldr":"Chinese-linked UAT-7810 is expanding an Operational Relay Box network by exploiting unpatched internet-facing routers, especially Ruckus devices, and deploying a more capable SHORTLEASH successor called LONGLEASH. The upgraded malware adds extensive proxying, tunneling, reverse shell, TLS/PKI, and relay C2 features to help China-aligned APTs hide their traffic and evade attribution.","briefOverview":"\u003cp\u003eChinese hackers tracked as UAT-7810 are actively evolving their malware to expand an Operational Relay Box network by compromising internet-facing networking devices, primarily unpatched Ruckus routers. Cisco Talos researchers say the ORB network serves as secure relay infrastructure for other China-aligned advanced persistent threats, including UAT-5918. This infrastructure lets threat actors proxy network traffic through regional devices so it appears to originate from legitimate local infrastructure, helping evade detection and complicate attribution.\u003c/p\u003e\n\n\u003cp\u003eTalos identified new malware and tools in the campaign, including LONGLEASH, DOGLEASH, JARLEASH, and LEASHTEST. UAT-7810 primarily exploits known vulnerabilities for initial access, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717 in Ruckus routers, as well as CVE-2025-2492 in ASUS AiCloud routers. LONGLEASH is described as an upgraded version of SHORTLEASH that adds capabilities such as reverse shell access, HTTP, DNS, SOCKS, TCP, ICMP, and UDP proxying, SMTP client and server functions, TLS and PKI support, self-removal, and intermediate command-and-control relay functions.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also found DOGLEASH, a lightweight Linux backdoor deployed through web shell scripts that can execute shell commands, access and modify files, retrieve operating system information, and run code directly in memory. JARLEASH is a Java-based administrative tool with web-based file management and FTP, SFTP, and Netcat server functionality, while LEASHTEST checks whether MIPS IoT devices can perform malware-related functions. Cisco Talos concludes that UAT-7810 is continuing to expand its ORB infrastructure while replacing or extending SHORTLEASH with the more capable LONGLEASH and broadening its toolkit.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos says Chinese hackers tracked as UAT-7810 are evolving their malware to expand an Operational Relay Box network by compromising internet-facing networking devices, primarily unpatched Ruckus routers.","The ORB network serves as secure relay infrastructure for other China-aligned advanced persistent threats, including UAT-5918, by making traffic appear to originate from legitimate local devices.","Talos identified new tools in the campaign, including LONGLEASH, DOGLEASH, JARLEASH, and LEASHTEST.","LONGLEASH is an upgraded version of SHORTLEASH with added capabilities such as reverse shell access, multiple proxying methods, SMTP client and server functions, TLS and PKI support, self-removal, and intermediate command-and-control relay features.","UAT-7810 primarily exploits known vulnerabilities for initial access, including flaws in Ruckus routers and ASUS AiCloud routers."],"insights":["UAT-7810’s reliance on known n-day vulnerabilities means unpatched edge devices, rather than new zero-days, are a central weakness being used to grow the ORB network.","LONGLEASH’s ability to act as an intermediate command-and-control server shows the infrastructure is designed to pass commands and data between infected nodes, not just provide simple remote access.","The inclusion of LEASHTEST indicates the operators are testing whether MIPS IoT devices can support malware functions, suggesting active refinement of LONGLEASH for that device class.","LONGLEASH’s self-removal capability when tampering or suspicious activity is detected can hinder investigation and evidence collection on compromised devices.","Because ORB traffic is proxied through regional legitimate devices, defenders may have difficulty distinguishing malicious activity from normal local infrastructure traffic."],"referencedReports":[{"title":"Unmasking a New China-Linked Covert ORB Network Inside the LapDogs Campaign","url":"https://securityscorecard.com/blog/unmasking-a-new-china-linked-covert-orb-network-inside-the-lapdogs-campaign/","publisher":"SecurityScorecard","context":"The article cites SecurityScorecard as the entity that first documented SHORTLEASH in 2025, which LONGLEASH is described as upgrading.","category":"","primary":false}],"body":"\u003cp\u003eChinese hackers tracked as UAT-7810 are actively evolving their malware to expand an Operational Relay Box network by compromising internet-facing networking devices, primarily unpatched Ruckus routers. Cisco Talos researchers say the ORB network serves as secure relay infrastructure for other China-aligned advanced persistent threats, including UAT-5918. This infrastructure lets threat actors proxy network traffic through regional devices so it appears to originate from legitimate local infrastructure, helping evade detection and complicate attribution.\u003c/p\u003e\n\n\u003cp\u003eTalos identified new malware and tools in the campaign, including LONGLEASH, DOGLEASH, JARLEASH, and LEASHTEST. UAT-7810 primarily exploits known vulnerabilities for initial access, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717 in Ruckus routers, as well as CVE-2025-2492 in ASUS AiCloud routers. LONGLEASH is described as an upgraded version of SHORTLEASH that adds capabilities such as reverse shell access, HTTP, DNS, SOCKS, TCP, ICMP, and UDP proxying, SMTP client and server functions, TLS and PKI support, self-removal, and intermediate command-and-control relay functions.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also found DOGLEASH, a lightweight Linux backdoor deployed through web shell scripts that can execute shell commands, access and modify files, retrieve operating system information, and run code directly in memory. JARLEASH is a Java-based administrative tool with web-based file management and FTP, SFTP, and Netcat server functionality, while LEASHTEST checks whether MIPS IoT devices can perform malware-related functions. Cisco Talos concludes that UAT-7810 is continuing to expand its ORB infrastructure while replacing or extending SHORTLEASH with the more capable LONGLEASH and broadening its toolkit.\u003c/p\u003e\n"},{"n":3,"title":"Accenture confirms breach after hacker offers stolen data for sale","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/accenture-confirms-breach-after-hacker-offers-stolen-data-for-sale/","time":"22:06","priority":"MUST READ","score":92,"tldr":"Accenture confirmed an isolated security breach after a hacker known as “888” claimed to be selling 35 GB of stolen source code, keys, tokens, and configuration files. The company says it has remediated the issue and that operations and service delivery were not impacted, but it has not confirmed what data was accessed or whether customers were affected.","briefOverview":"\u003cp\u003eAccenture confirmed it suffered an isolated security breach after a threat actor claimed to have stolen 35 GB of source code and other data from the company. The company told BleepingComputer that it was aware of the matter, had remediated its source, and saw no impact to operations or service delivery. Accenture is a global professional services company that provides consulting, technology, cloud, engineering, and managed services to businesses and governments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor, known as “888,” said the breach occurred in July 2026 and began offering the alleged data for sale on a cybercrime forum. According to the forum post, the stolen data includes source code, RSA keys, SSH keys, Azure personal access tokens, Azure Storage access keys, and configuration files. The actor shared a screenshot that appeared to show cloning of an Azure DevOps repository named “121123_AtriasTalentAcademy” hosted under a redacted accenture.com hostname.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer could not independently verify the full scope of the data allegedly stolen. Accenture did not comment on the claimed amount or type of data accessed, how attackers gained access, or whether customer data was affected. The article also notes that the same threat actor previously attempted to sell Accenture employee data after a third-party breach in 2024, and that Accenture suffered a separate breach in 2021 after the LockBit ransomware gang stole data from its systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Accenture confirmed it suffered an isolated security breach and said it had remediated the source of the issue.","A threat actor known as “888” claimed to have stolen 35 GB of Accenture data in July and offered it for sale on a cybercrime forum.","The threat actor claimed the stolen data includes source code, RSA keys, SSH keys, Azure personal access tokens, Azure Storage access keys, and configuration files.","BleepingComputer could not independently verify the full scope of the data allegedly stolen from Accenture.","Accenture did not disclose how attackers gained access or whether customer data was affected."],"insights":["The alleged stolen material is especially sensitive because it includes not only source code but also access-related items such as RSA keys, SSH keys, Azure personal access tokens, and Azure Storage access keys.","The only public evidence described in the article is a screenshot that appears to show cloning of an Azure DevOps repository, so the claimed 35 GB scope remains unverified by BleepingComputer.","Accenture’s confirmation focuses on remediation and lack of operational impact, but the company did not answer core exposure questions about the data types, access method, or possible customer impact.","The article links this incident to a threat actor who previously attempted to sell Accenture employee data after a third-party breach in 2024, showing repeated public claims involving Accenture data."],"referencedReports":[],"body":"\u003cp\u003eAccenture confirmed it suffered an isolated security breach after a threat actor claimed to have stolen 35 GB of source code and other data from the company. The company told BleepingComputer that it was aware of the matter, had remediated its source, and saw no impact to operations or service delivery. Accenture is a global professional services company that provides consulting, technology, cloud, engineering, and managed services to businesses and governments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor, known as “888,” said the breach occurred in July 2026 and began offering the alleged data for sale on a cybercrime forum. According to the forum post, the stolen data includes source code, RSA keys, SSH keys, Azure personal access tokens, Azure Storage access keys, and configuration files. The actor shared a screenshot that appeared to show cloning of an Azure DevOps repository named “121123_AtriasTalentAcademy” hosted under a redacted accenture.com hostname.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer could not independently verify the full scope of the data allegedly stolen. Accenture did not comment on the claimed amount or type of data accessed, how attackers gained access, or whether customer data was affected. The article also notes that the same threat actor previously attempted to sell Accenture employee data after a third-party breach in 2024, and that Accenture suffered a separate breach in 2021 after the LockBit ransomware gang stole data from its systems.\u003c/p\u003e\n"},{"n":6,"title":"BeyondTrust warns of critical flaws in remote access software","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/beyondtrust-warns-of-critical-flaws-in-remote-access-software/","time":"08:12","priority":"MUST READ","score":92,"tldr":"BeyondTrust patched two critical authentication bypass flaws in its Remote Support and Privileged Remote Access products that could let unauthenticated attackers access vulnerable appliances under certain configurations. Cloud customers are already patched, while self-hosted users should apply the April security rollup or upgrade to version 25.3.3 or later.","briefOverview":"\u003cp\u003eBeyondTrust warned customers to patch two critical security flaws in its Remote Support and Privileged Remote Access software that could allow attackers to bypass authentication. CVE-2026-40138 affects Remote Support and Privileged Remote Access versions 25.3.2 or earlier and stems from improper authentication in the authentication subsystem. Successful exploitation could let attackers without privileges bypass access controls and access targeted appliances, including accounts with elevated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe second critical flaw, CVE-2026-40139, stems from improper processing of BeyondTrust Remote Support authentication requests and could let unauthenticated remote attackers gain unauthorized access to vulnerable instances. BeyondTrust said exploitation of both critical flaws requires a specific authentication configuration to be enabled, but it did not share further details. The company also released updates for CVE-2026-40140 and CVE-2026-40141, two high-severity issues that can be exploited to trigger denial-of-service or access restricted resources on unpatched Remote Support and Privileged Remote Access instances.\u003c/p\u003e\n\n\u003cp\u003eBeyondTrust said a patch was applied to all Remote Support and Privileged Remote Access cloud customers as of April 21, 2026. Self-hosted customers should apply the April security rollup patch if their instance is not subscribed to automatic updates, or upgrade to Remote Support 25.3.3 and above or Privileged Remote Access 25.3.3 and above. Shadowserver tracks nearly 2,000 BeyondTrust Remote Support and Privileged Remote Access instances exposed online, while the article notes that other BeyondTrust remote support flaws have been exploited in recent years, including in ransomware attacks and incidents affecting U.S. government agencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BeyondTrust warned customers to patch two critical flaws in Remote Support and Privileged Remote Access software that could allow attackers to bypass authentication under specific configurations.","CVE-2026-40138 affects Remote Support and Privileged Remote Access versions 25.3.2 or earlier and could let attackers without privileges bypass access controls and access targeted appliances, including accounts with elevated privileges.","CVE-2026-40139 stems from improper processing of Remote Support authentication requests and could allow unauthenticated remote attackers to gain unauthorized access to vulnerable instances.","BeyondTrust also released updates for CVE-2026-40140 and CVE-2026-40141, two high-severity issues that can be exploited to trigger denial-of-service or access restricted resources on unpatched instances.","BeyondTrust said cloud customers were patched as of April 21, 2026, while self-hosted customers should apply the April security rollup or upgrade to Remote Support or Privileged Remote Access version 25.3.3 or later."],"insights":["The critical authentication-bypass flaws are not universally exploitable on every installation because BeyondTrust says a specific authentication configuration must be enabled, but the company did not disclose which configuration that is.","Self-hosted customers that are not subscribed to automatic updates are the group with the clearest remaining exposure, since BeyondTrust says cloud customers were already patched as of April 21, 2026.","Shadowserver’s count of nearly 2,000 internet-exposed BeyondTrust Remote Support and Privileged Remote Access instances does not indicate how many are already patched or are honeypots, making visible exposure difficult to translate into confirmed risk.","Recent history raises the urgency of patching because other BeyondTrust flaws have already been exploited to establish WebSocket channels, deploy ransomware, and compromise U.S. government-related systems."],"referencedReports":[{"title":"BeyondTrust Security Advisory BT26-03","url":"https://www.beyondtrust.com/trust-center/security-advisories/bt26-03","publisher":"BeyondTrust","context":"The article cites BeyondTrust’s advisory for details on the Remote Support and Privileged Remote Access vulnerabilities and patch guidance for cloud and self-hosted customers.","category":"","primary":false}],"body":"\u003cp\u003eBeyondTrust warned customers to patch two critical security flaws in its Remote Support and Privileged Remote Access software that could allow attackers to bypass authentication. CVE-2026-40138 affects Remote Support and Privileged Remote Access versions 25.3.2 or earlier and stems from improper authentication in the authentication subsystem. Successful exploitation could let attackers without privileges bypass access controls and access targeted appliances, including accounts with elevated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe second critical flaw, CVE-2026-40139, stems from improper processing of BeyondTrust Remote Support authentication requests and could let unauthenticated remote attackers gain unauthorized access to vulnerable instances. BeyondTrust said exploitation of both critical flaws requires a specific authentication configuration to be enabled, but it did not share further details. The company also released updates for CVE-2026-40140 and CVE-2026-40141, two high-severity issues that can be exploited to trigger denial-of-service or access restricted resources on unpatched Remote Support and Privileged Remote Access instances.\u003c/p\u003e\n\n\u003cp\u003eBeyondTrust said a patch was applied to all Remote Support and Privileged Remote Access cloud customers as of April 21, 2026. Self-hosted customers should apply the April security rollup patch if their instance is not subscribed to automatic updates, or upgrade to Remote Support 25.3.3 and above or Privileged Remote Access 25.3.3 and above. Shadowserver tracks nearly 2,000 BeyondTrust Remote Support and Privileged Remote Access instances exposed online, while the article notes that other BeyondTrust remote support flaws have been exploited in recent years, including in ransomware attacks and incidents affecting U.S. government agencies.\u003c/p\u003e\n"},{"n":12,"title":"Fake Installers, Fake Reviews, Fake Services – Real Proxies, Real Victims","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/fake-installers-fake-reviews-fake-services-real-proxies-real-victims/","time":"13:00","priority":"MUST READ","score":92,"tldr":"Infoblox researchers link the fake 7-Zip installer campaign to a years-long operation called Lurking Lizard that uses lookalike domains, trojanized apps, and WireVPN-branded software to turn victims’ devices into residential proxy nodes. The actor appears to run an end-to-end proxy ecosystem, from recruiting infected devices to promoting and selling access through fake proxy services and review sites.","briefOverview":"\u003cp\u003eInfoblox researchers describe a long-running operation by an actor they track as Lurking Lizard, beginning from a fake 7-Zip installer campaign discovered in early 2026. The fake installer used 7zip[.]com instead of the legitimate 7-zip[.]org and enrolled devices as proxy nodes that could be rented to residential proxy services. Infoblox linked the activity to operations dating back to at least August 2022 and found more than 230 related domains through DNS and infrastructure analysis.\u003c/p\u003e\n\n\u003cp\u003eThe actor uses trojanized software, lookalike domains, and branded services to recruit victim machines while making the software appear functional enough to avoid removal. The domains impersonated popular software and services, including 7-Zip, VPNs, HeroSMS, IPIDEA, SmartProxy, IP Royal, and 911Proxy, and also included apparent proxy review sites such as proxyreviews[.]org. WHOIS data, registration patterns, and related apps indicated the actor is likely Chinese, with some registrant details pointing to Wuhan, China if accurate.\u003c/p\u003e\n\n\u003cp\u003eA hardcoded IPLogger URL, hxxps://iplogger[.]com/mnWD, helped connect multiple samples and campaigns, including fake 7-Zip installers, video downloader malware, and WireVPN-themed variants. Researchers also observed shared infrastructure patterns such as update subdomains, versioned directory structures, storage bucket-style XML responses, and similar API endpoints across multiple domains. More recent WireVPN Windows samples communicated with WireVPN-branded and benign-looking hosts, showed behavior inconsistent with a standard VPN client, and appeared to support participation in a distributed proxy network rather than a traditional VPN service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox tracks the actor as Lurking Lizard and linked the fake 7-Zip installer campaign to operations dating back to at least August 2022.","Lurking Lizard uses trojanized software and lookalike domains to recruit victim machines as residential proxy nodes while providing enough apparent functionality to discourage uninstalling.","Researchers found more than 230 domains through DNS and infrastructure analysis, including domains impersonating 7-Zip, VPN services, HeroSMS, IPIDEA, SmartProxy, IP Royal, and 911Proxy.","A hardcoded IPLogger URL found in multiple samples linked otherwise distinct campaigns and payloads, including the fake 7-Zip installer, video downloader malware, and WireVPN-themed variants.","WireVPN Windows samples showed behavior that did not match a standard VPN client and instead suggested affected systems could function as exit nodes in a distributed proxy network."],"insights":["The fake 7-Zip domain benefited from years of mistaken references to 7zip.com in forum posts, showing how expired or misquoted domains with search history can give malicious infrastructure built-in credibility.","A single hardcoded IPLogger informer URL, hxxps://iplogger[.]com/mnWD, served as a durable link across campaigns that otherwise appeared unrelated, including fake 7-Zip, video downloader, and WireVPN-themed payloads.","Lurking Lizard did not only collect victim devices; it also controlled lookalike proxy services and apparent proxy review sites, indicating an operation that covered recruitment, marketing, and monetization.","The actor’s impersonation was convincing enough that smartproxy.org, a Lurking Lizard-controlled domain, was initially mistaken for the legitimate Smartproxy ecosystem and was later found to overlap heavily with IPIDEA’s network.","WireVPN’s valid code signing certificate and app store presence gave the broader ecosystem a more legitimate appearance while the analyzed Windows samples showed traffic behavior inconsistent with a standard VPN client."],"referencedReports":[{"title":"Fake 7-Zip downloads are turning home PCs into proxy nodes","url":"https://www.malwarebytes.com/blog/threat-intel/2026/02/fake-7-zip-downloads-are-turning-home-pcs-into-proxy-nodes","publisher":"Malwarebytes","context":"The article says earlier reporting on fake 7-Zip installers treated them as a one-off malware campaign, while Infoblox linked the activity to a broader operation.","category":"","primary":false}],"body":"\u003cp\u003eInfoblox researchers describe a long-running operation by an actor they track as Lurking Lizard, beginning from a fake 7-Zip installer campaign discovered in early 2026. The fake installer used 7zip[.]com instead of the legitimate 7-zip[.]org and enrolled devices as proxy nodes that could be rented to residential proxy services. Infoblox linked the activity to operations dating back to at least August 2022 and found more than 230 related domains through DNS and infrastructure analysis.\u003c/p\u003e\n\n\u003cp\u003eThe actor uses trojanized software, lookalike domains, and branded services to recruit victim machines while making the software appear functional enough to avoid removal. The domains impersonated popular software and services, including 7-Zip, VPNs, HeroSMS, IPIDEA, SmartProxy, IP Royal, and 911Proxy, and also included apparent proxy review sites such as proxyreviews[.]org. WHOIS data, registration patterns, and related apps indicated the actor is likely Chinese, with some registrant details pointing to Wuhan, China if accurate.\u003c/p\u003e\n\n\u003cp\u003eA hardcoded IPLogger URL, hxxps://iplogger[.]com/mnWD, helped connect multiple samples and campaigns, including fake 7-Zip installers, video downloader malware, and WireVPN-themed variants. Researchers also observed shared infrastructure patterns such as update subdomains, versioned directory structures, storage bucket-style XML responses, and similar API endpoints across multiple domains. More recent WireVPN Windows samples communicated with WireVPN-branded and benign-looking hosts, showed behavior inconsistent with a standard VPN client, and appeared to support participation in a distributed proxy network rather than a traditional VPN service.\u003c/p\u003e\n"},{"n":13,"title":"Major Japanese telco says cyberattack exposed 12 million emails","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/major-japanese-telco-cyberattack-12-million-emails","time":"14:45","priority":"MUST READ","score":92,"tldr":"KDDI said a cyberattack on a third-party email platform used by five Japanese ISPs exposed 12.2 million email addresses and 7.6 million passwords. The company patched the exploited software flaw and affected providers are forcing password resets.","briefOverview":"\u003cp\u003eKDDI, one of Japan’s largest telecommunications providers, said a cyberattack targeting an email platform it operates for internet service providers exposed more than 12.2 million customer email addresses and 7.6 million passwords. The affected system is used to manage customer email accounts, webmail services and email storage for five Japanese internet service providers. KDDI first disclosed the unauthorized access in June and confirmed the scale after completing a forensic investigation and submitting a report to Japan’s communications ministry.\u003c/p\u003e\n\n\u003cp\u003eAccording to KDDI, attackers exploited a vulnerability in third-party software used by the email platform. The company said it patched the flaw and modified the system immediately after detecting the intrusion. Investigators found no evidence that the attackers compromised any systems beyond the exploited vulnerability.\u003c/p\u003e\n\n\u003cp\u003eKDDI said its own consumer email services for mobile and fixed-line internet customers run on separate infrastructure and were not affected. The company said many regular users of the affected email service have already changed their passwords, while the affected internet service providers are working to complete mandatory password resets. The disclosure comes amid a string of recent cyber incidents reported by major Japanese companies, including Aflac’s Japanese unit, Nidec and Sapporo Holdings, though the article says there is no indication the incidents are linked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["KDDI said a cyberattack on an email platform it operates for internet service providers exposed more than 12.2 million customer email addresses and 7.6 million passwords.","The breach affected an email system used to manage customer email accounts, webmail services and email storage for five Japanese internet service providers.","KDDI said attackers exploited a vulnerability in third-party software used by the email platform, and the company patched the flaw and modified the system after detecting the intrusion.","KDDI said its own consumer email services for mobile and fixed-line internet customers run on separate infrastructure and were not affected.","The affected internet service providers are working to complete mandatory password resets in the coming days."],"insights":["The full scale of the exposure was not confirmed when KDDI first disclosed the unauthorized access in June, but only after it completed a forensic investigation and submitted a report to Japan’s communications ministry.","The incident shows how one shared email platform operated for multiple internet service providers can expose customers across several providers when a single third-party software flaw is exploited.","KDDI’s separation of its own consumer email services from the affected platform appears to have limited the incident’s reach, since its mobile and fixed-line internet customer email services were not affected.","Although KDDI said many regular users had already changed their passwords, the affected providers still needed to complete mandatory password resets in the following days."],"referencedReports":[{"title":"KDDI unauthorized access disclosure","url":"https://newsroom.kddi.com/news/assets/2026/kddi_nr_s-71_4593/kddi_nr_s-71_4593_pdf_01.pdf","publisher":"KDDI","context":"The article says KDDI first disclosed the unauthorized access in this linked document in June.","category":"","primary":false},{"title":"KDDI report to Japan's communications ministry","url":"https://newsroom.kddi.com/news/assets/2026/kddi_nr_s-73_4619/kddi_nr_s-73_4619_pdf_01.pdf","publisher":"KDDI","context":"The article says KDDI confirmed the scale of the data exposure after completing its forensic investigation and submitting this report to Japan's communications ministry.","category":"","primary":false}],"body":"\u003cp\u003eKDDI, one of Japan’s largest telecommunications providers, said a cyberattack targeting an email platform it operates for internet service providers exposed more than 12.2 million customer email addresses and 7.6 million passwords. The affected system is used to manage customer email accounts, webmail services and email storage for five Japanese internet service providers. KDDI first disclosed the unauthorized access in June and confirmed the scale after completing a forensic investigation and submitting a report to Japan’s communications ministry.\u003c/p\u003e\n\n\u003cp\u003eAccording to KDDI, attackers exploited a vulnerability in third-party software used by the email platform. The company said it patched the flaw and modified the system immediately after detecting the intrusion. Investigators found no evidence that the attackers compromised any systems beyond the exploited vulnerability.\u003c/p\u003e\n\n\u003cp\u003eKDDI said its own consumer email services for mobile and fixed-line internet customers run on separate infrastructure and were not affected. The company said many regular users of the affected email service have already changed their passwords, while the affected internet service providers are working to complete mandatory password resets. The disclosure comes amid a string of recent cyber incidents reported by major Japanese companies, including Aflac’s Japanese unit, Nidec and Sapporo Holdings, though the article says there is no indication the incidents are linked.\u003c/p\u003e\n"},{"n":26,"title":"BeyondTrust Patches Critical Auth Bypass Flaws in Remote Support and PRA","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/beyondtrust-patches-critical-auth.html","time":"05:16","priority":"MUST READ","score":92,"tldr":"BeyondTrust patched critical pre-authentication flaws in Remote Support and Privileged Remote Access that could let unauthenticated attackers bypass access controls and take over vulnerable appliances under certain configurations. Users should upgrade to RS/PRA 25.3.3 or later as soon as possible.","briefOverview":"\u003cp\u003eBeyondTrust has released updates for its Remote Support and Privileged Remote Access products to fix four security vulnerabilities. The most severe issues could allow an unauthenticated remote attacker to bypass access controls and gain unauthorized access to an appliance under specific configurations. The affected versions are Remote Support RS 25.3.2 or lower and Privileged Remote Access PRA 25.3.2 or lower, with fixes available in RS 25.3.3 and PRA 25.3.3 or later.\u003c/p\u003e\n\n\u003cp\u003eThe two critical flaws, CVE-2026-40138 and CVE-2026-40139, both have CVSS scores of 9.2 and affect the authentication subsystem. CVE-2026-40138 impacts both Remote Support and Privileged Remote Access, while CVE-2026-40139 impacts Remote Support. BeyondTrust said successful exploitation of these two flaws depends on a specific authentication configuration being enabled.\u003c/p\u003e\n\n\u003cp\u003eBeyondTrust also fixed CVE-2026-40140, a denial-of-service issue in the network communication subsystem, and CVE-2026-40141, a web application flaw that could allow limited-privilege authenticated users to access unintended resources or data. The company said the issues were identified internally during ongoing security assessments with assistance from publicly available AI models and proprietary research tooling. BeyondTrust did not mention exploitation of these vulnerabilities in the wild, but the article notes that earlier RS and PRA flaws have previously been exploited to deploy web shells and backdoors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BeyondTrust released updates for Remote Support and Privileged Remote Access to address security flaws that could allow unauthenticated attackers to take control of susceptible devices.","CVE-2026-40138 and CVE-2026-40139 are critical pre-authentication flaws with CVSS scores of 9.2 that could allow attackers to bypass access controls and gain unauthorized access to appliances, including accounts with elevated privileges.","CVE-2026-40140 could allow an unauthenticated remote attacker to trigger a denial-of-service condition, and CVE-2026-40141 could allow an authenticated attacker with limited privileges to access unintended resources or data.","Successful exploitation of CVE-2026-40138 and CVE-2026-40139 depends on a specific authentication configuration being enabled, while CVE-2026-40141 is restricted to accounts with specific permissions.","The vulnerabilities are fixed in Remote Support RS 25.3.3 and above and Privileged Remote Access PRA 25.3.3 and above, with no exploitation in the wild mentioned by BeyondTrust."],"insights":["The two most severe flaws require a specific authentication configuration to be enabled, so affected organizations should not only upgrade but also review whether that configuration is present in their deployment.","BeyondTrust says the flaws were found internally during security assessments with help from publicly available AI models, including Anthropic Claude Opus 4.8, and its own proprietary research tools.","Although BeyondTrust does not mention active exploitation of these new flaws, the article notes that earlier Remote Support and Privileged Remote Access flaws have repeatedly been exploited to deploy web shells and backdoors.","The fixes are concentrated in a single version step, with both Remote Support and Privileged Remote Access versions 25.3.2 or lower fixed by upgrading to 25.3.3 or later."],"referencedReports":[{"title":"BT26-03","url":"https://www.beyondtrust.com/trust-center/security-advisories/bt26-03","publisher":"BeyondTrust","context":"The article links to BeyondTrust's security advisory as the source for the listed Remote Support and Privileged Remote Access vulnerabilities and fixed versions.","category":"","primary":false}],"body":"\u003cp\u003eBeyondTrust has released updates for its Remote Support and Privileged Remote Access products to fix four security vulnerabilities. The most severe issues could allow an unauthenticated remote attacker to bypass access controls and gain unauthorized access to an appliance under specific configurations. The affected versions are Remote Support RS 25.3.2 or lower and Privileged Remote Access PRA 25.3.2 or lower, with fixes available in RS 25.3.3 and PRA 25.3.3 or later.\u003c/p\u003e\n\n\u003cp\u003eThe two critical flaws, CVE-2026-40138 and CVE-2026-40139, both have CVSS scores of 9.2 and affect the authentication subsystem. CVE-2026-40138 impacts both Remote Support and Privileged Remote Access, while CVE-2026-40139 impacts Remote Support. BeyondTrust said successful exploitation of these two flaws depends on a specific authentication configuration being enabled.\u003c/p\u003e\n\n\u003cp\u003eBeyondTrust also fixed CVE-2026-40140, a denial-of-service issue in the network communication subsystem, and CVE-2026-40141, a web application flaw that could allow limited-privilege authenticated users to access unintended resources or data. The company said the issues were identified internally during ongoing security assessments with assistance from publicly available AI models and proprietary research tooling. BeyondTrust did not mention exploitation of these vulnerabilities in the wild, but the article notes that earlier RS and PRA flaws have previously been exploited to deploy web shells and backdoors.\u003c/p\u003e\n"},{"n":25,"title":"DEBULL Tooling Abuses Microsoft Device-Code Flow to Target M365 Accounts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/debull-tooling-abuses-microsoft-device.html","time":"15:14","priority":"SHOULD READ","score":88,"tldr":"A Microsoft 365 device-code phishing campaign is using DEBULL tooling to trick users into authorizing attacker-controlled sessions through Microsoft’s legitimate login flow, enabling account takeover without fake password pages. Researchers say this shows Storm-2372-style tactics are being packaged into reusable phishing-as-a-service infrastructure for broader BEC and data theft operations.","briefOverview":"\u003cp\u003eA Microsoft 365 device code phishing campaign used collaboration-themed lures to take control of victim accounts between the last week of June 2026 and early July, according to ZeroBEC. The campaign did not rely on a fake Microsoft password page, but instead pushed users into the legitimate Microsoft device login experience. ZeroBEC said a backend broker generated and polled Microsoft Authentication Broker device-code tokens.\u003c/p\u003e\n\n\u003cp\u003eThe activity shares strong overlaps with Microsoft’s Storm-2372 reporting, including messaging or Teams-style lures that trick victims into entering an attacker-provided device code along with their credentials. ZeroBEC assessed that the operators are using Storm-2372-style tradecraft through a reusable tooling layer called DEBULL. The observed campaign used payment and shared-folder pretexts in phishing emails, redirecting victims to a legitimate but compromised Croatian rental website that acted as a device code orchestrator.\u003c/p\u003e\n\n\u003cp\u003eThe article says successful device code phishing can enable full account takeover, information theft, fraud, business email compromise, lateral movement, and ransomware. ZeroBEC found that DEBULL likely functions as a phishing-as-a-service platform and may use GraphSpy or GraphSpy-derived workflows for Microsoft 365 and Entra post-exploitation. The article also cites Cisco Talos research on ARToken and other reports on EvilTokens and Tycoon 2FA, showing that device code phishing is being adopted by broader phishing-as-a-service ecosystems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Microsoft 365 device code phishing campaign used collaboration-themed lures to take control of victim accounts between the last week of June 2026 and early July, according to ZeroBEC.","The campaign pushed users into Microsoft’s legitimate device login experience while a backend broker generated and polled Microsoft Authentication Broker device-code tokens.","ZeroBEC assessed that the activity shares strong overlaps with Microsoft’s Storm-2372 reporting but uses a reusable tooling layer called DEBULL.","The observed campaign used payment and shared-folder phishing emails that redirected victims through a legitimate but compromised Croatian rental website acting as a device code orchestrator.","Cisco Talos identified an ARToken phishing-as-a-service panel with more than 80 API endpoints for device code phishing, token persistence, email access, business email compromise operations, and SharePoint exfiltration."],"insights":["Because the campaign sends victims through Microsoft’s legitimate device login page rather than a fake password page, traditional checks for bogus Microsoft login sites may not catch this type of phishing.","Proofpoint noted that dynamically generating the device code only after a user clicks the phishing link lets victims start the attack chain whenever they open the email, making the lure less dependent on timing.","ZeroBEC concluded that DEBULL separates the campaign-facing lure layer from the backend identity stack, allowing operators to change phishing pages without changing the token-handling infrastructure.","The use of a legitimate but compromised Croatian rental website as a device code orchestrator shows that trusted-looking third-party sites can be part of the authentication abuse chain.","Talos described ARToken as more than a simple phishing kit because it combines device code phishing with token persistence, email access, SharePoint exfiltration, and BEC operations in one operator panel."],"referencedReports":[{"title":"DEBULL, Storm-2372, Microsoft Device Code Phishing, and GraphSpy","url":"https://zerobec.com/blog/debull-storm-2372-microsoft-device-code-phishing-graphspy","publisher":"ZeroBEC","context":"The article cites ZeroBEC's findings as the source for the observed DEBULL Microsoft 365 device-code phishing campaign.","category":"","primary":false},{"title":"Device Code Phishing Evolution: Identity Takeover","url":"https://www.proofpoint.com/us/blog/threat-insight/device-code-phishing-evolution-identity-takeover","publisher":"Proofpoint","context":"The article references Proofpoint's May 2026 analysis on dynamically generated device codes and phishing-as-a-service implementations.","category":"","primary":false},{"title":"ARToken: Inside an EvilTokens Affiliate Panel Targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article cites Cisco Talos research identifying the ARToken phishing-as-a-service operator panel and its links to EvilTokens.","category":"","primary":false},{"title":"Tycoon 2FA Operators Adopt OAuth Device Code Phishing","url":"https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing","publisher":"eSentire","context":"The article quotes eSentire's May 2026 analysis on Tycoon 2FA operators adopting OAuth device-code phishing.","category":"","primary":false}],"body":"\u003cp\u003eA Microsoft 365 device code phishing campaign used collaboration-themed lures to take control of victim accounts between the last week of June 2026 and early July, according to ZeroBEC. The campaign did not rely on a fake Microsoft password page, but instead pushed users into the legitimate Microsoft device login experience. ZeroBEC said a backend broker generated and polled Microsoft Authentication Broker device-code tokens.\u003c/p\u003e\n\n\u003cp\u003eThe activity shares strong overlaps with Microsoft’s Storm-2372 reporting, including messaging or Teams-style lures that trick victims into entering an attacker-provided device code along with their credentials. ZeroBEC assessed that the operators are using Storm-2372-style tradecraft through a reusable tooling layer called DEBULL. The observed campaign used payment and shared-folder pretexts in phishing emails, redirecting victims to a legitimate but compromised Croatian rental website that acted as a device code orchestrator.\u003c/p\u003e\n\n\u003cp\u003eThe article says successful device code phishing can enable full account takeover, information theft, fraud, business email compromise, lateral movement, and ransomware. ZeroBEC found that DEBULL likely functions as a phishing-as-a-service platform and may use GraphSpy or GraphSpy-derived workflows for Microsoft 365 and Entra post-exploitation. The article also cites Cisco Talos research on ARToken and other reports on EvilTokens and Tycoon 2FA, showing that device code phishing is being adopted by broader phishing-as-a-service ecosystems.\u003c/p\u003e\n"},{"n":41,"title":"Coordinated npm and PyPI Campaign Typosquats Popular Secure Payment Apps","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/npm-pypi-campaign-typosquats-popular-secure-payment-apps?utm_medium=feed","time":"18:09","priority":"SHOULD READ","score":88,"tldr":"Socket detected a coordinated npm and PyPI typosquatting campaign using fake PaySafe, Skrill, and Neteller SDK packages to steal API keys and other environment secrets from developers and CI systems. The malware used sandbox evasion and obfuscated Ngrok C2 infrastructure, so affected users should remove the packages, block the indicators, and rotate exposed credentials.","briefOverview":"\u003cp\u003eSocket’s AI scanner detected a coordinated cluster of 17 malicious npm and PyPI packages published on July 7, 2026. The packages targeted SDK developers and users of the PaySafe, Skrill, and Neteller payment applications through names that appeared related to those services. The npm packages each published four malicious versions, while the PyPI packages each published one malicious version at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eThe packages acted as fake SDKs that mimicked payment clients while stealing credentials and tokens from environment variables. In the npm example, the fake \u003ccode\u003ePaysafeClient\u003c/code\u003e read \u003ccode\u003ePAYSAFE_API_KEY\u003c/code\u003e and \u003ccode\u003ePAYSAFE_ENV\u003c/code\u003e, exposed payment and customer methods, and returned success responses without contacting real Paysafe endpoints. Exfiltration could include host details, username, current working directory, matching environment variables, package name, and API-related data.\u003c/p\u003e\n\n\u003cp\u003eThe malware used sandbox-evasion checks and obfuscated its command-and-control hostname through decoding steps before sending data to \u003ccode\u003ecaliber-spinner-finishing.ngrok-free.dev\u003c/code\u003e. The article says the PyPI packages were not gated on API keys and activated through their \u003ccode\u003e__init__.py\u003c/code\u003e placement. Recommended actions include rotating secrets on affected machines, searching dependency trees for the package names, blocking the packages at registry proxy level, hunting outbound HTTPS to \u003ccode\u003e.ngrok-free.dev\u003c/code\u003e, and auditing CI logs for \u003ccode\u003ePAYSAFE_API_KEY\u003c/code\u003e usage with the listed packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s AI scanner detected 17 malicious npm and PyPI packages published nearly simultaneously on July 7, 2026, targeting developers and users of PaySafe, Skrill, and Neteller payment applications.","The npm packages published four malicious versions each, while the PyPI packages each published one malicious version at the time of publication.","The fake SDKs mimicked legitimate payment clients but returned success responses without contacting real PaySafe endpoints, while stealing credentials and tokens from environment variables.","The malware skipped exfiltration when it detected sandbox-like conditions such as fewer than two CPU cores or hostnames and usernames containing terms like sandbox, analyzer, cuckoo, vmware, or vbox.","Stolen data was sent over HTTPS to the Ngrok hostname caliber-spinner-finishing.ngrok-free.dev and included host details, current working directory, selected environment variables, package name, and extra API-related data."],"insights":["The npm malware only exfiltrated data after a Paysafe API key was present and a fake SDK request method was called, which made the package appear functional while delaying malicious behavior until a likely high-value use case occurred.","The PyPI packages were more broadly dangerous than the npm example because they were not gated on API keys and activated universally through their __init__.py placement.","The actor used different obfuscation keys across versions and packages, which the article says produced different file hashes and made simple signature tracking by a reused key less effective.","Hunting for outbound HTTPS traffic to .ngrok-free.dev from build or CI hosts is particularly actionable because the article notes such traffic is unusual for payment SDKs and legitimate applications.","Any machine that imported or executed the packages may require broad secret rotation because the malware collected all environment variables whose names contained KEY, SECRET, TOKEN, PASS, AUTH, or API, not just Paysafe credentials."],"referencedReports":[],"body":"\u003cp\u003eSocket’s AI scanner detected a coordinated cluster of 17 malicious npm and PyPI packages published on July 7, 2026. The packages targeted SDK developers and users of the PaySafe, Skrill, and Neteller payment applications through names that appeared related to those services. The npm packages each published four malicious versions, while the PyPI packages each published one malicious version at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eThe packages acted as fake SDKs that mimicked payment clients while stealing credentials and tokens from environment variables. In the npm example, the fake \u003ccode\u003ePaysafeClient\u003c/code\u003e read \u003ccode\u003ePAYSAFE_API_KEY\u003c/code\u003e and \u003ccode\u003ePAYSAFE_ENV\u003c/code\u003e, exposed payment and customer methods, and returned success responses without contacting real Paysafe endpoints. Exfiltration could include host details, username, current working directory, matching environment variables, package name, and API-related data.\u003c/p\u003e\n\n\u003cp\u003eThe malware used sandbox-evasion checks and obfuscated its command-and-control hostname through decoding steps before sending data to \u003ccode\u003ecaliber-spinner-finishing.ngrok-free.dev\u003c/code\u003e. The article says the PyPI packages were not gated on API keys and activated through their \u003ccode\u003e__init__.py\u003c/code\u003e placement. Recommended actions include rotating secrets on affected machines, searching dependency trees for the package names, blocking the packages at registry proxy level, hunting outbound HTTPS to \u003ccode\u003e.ngrok-free.dev\u003c/code\u003e, and auditing CI logs for \u003ccode\u003ePAYSAFE_API_KEY\u003c/code\u003e usage with the listed packages.\u003c/p\u003e\n"},{"n":40,"title":"ClickFix to Cash-Out: Anatomy of a Mexican Banking-Fraud Toolkit","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/mexican-banking-fraud-scmbanker-ref6045","time":"00:00","priority":"SHOULD READ","score":86,"tldr":"Elastic researchers detailed REF6045, a Mexico-focused banking fraud operation that uses fake CAPTCHA “ClickFix” lures to install the SCMBANKER PowerShell toolkit and let human operators monitor victims, redirect banking sessions, hijack clipboard transfers, run vishing overlays, and deploy Remote Utilities for full access. The case shows how crude, likely AI-assisted malware can still enable effective operator-driven financial theft when paired with social engineering.","briefOverview":"\u003cp\u003eElastic Security Labs analyzed a Mexican banking fraud operation tracked as REF6045 that uses fake CAPTCHA-style ClickFix pages to trick victims into running a command on Windows. The command installs SCMBANKER, a PowerShell toolkit with components dating back to at least October 2025. The operation is not fully automated; a human operator monitors infected machines and decides when to take actions against victims.\u003c/p\u003e\n\n\u003cp\u003eSCMBANKER gives operators a fraud workflow focused on Mexico’s financial ecosystem, including retail banks, business banking portals, fintechs, payment processors, cryptocurrency exchanges, investment platforms, SAT, and telecom services. The toolkit can monitor banking sessions, capture screenshots, display fake bank warning overlays for vishing, redirect browsers to phishing pages, replace copied CLABE or card numbers, and deploy Remote Utilities Host for hands-on access. Victims can be pushed toward live phone interaction or have their browser and clipboard manipulated during online banking activity.\u003c/p\u003e\n\n\u003cp\u003eElastic’s analysis was enabled by operational security failures, including open directories, an exposed web-root archive, and an unauthenticated file editor that revealed tooling and targeting logic. The infection chain uses a fake Windows Update screen, repeated UAC prompts, a cursor trap, bitsadmin downloads, registry and startup-folder persistence, and a forced reboot to trigger execution. The scripts also contain strong signs of AI assistance, including heavy explanatory comments, document-like scaffolding, and self-documenting obfuscation artifacts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs tracked a Mexican banking fraud operation called REF6045 that uses fake CAPTCHA ClickFix pages to trick victims into running a command that installs the SCMBANKER PowerShell toolkit.","SCMBANKER lets operators monitor banking sessions, capture screenshots, display fake bank warning overlays for vishing, redirect browsers to phishing pages, manipulate copied CLABE and card numbers, and deploy Remote Utilities Host for remote access.","The toolkit heavily targets Mexico’s financial ecosystem, including retail banks, business banking portals, fintechs, payment processors, cryptocurrency exchanges, investment platforms, SAT, and telecom services.","Elastic recovered the operation’s tooling through OPSEC failures including open directories, an exposed web-root archive, and an unauthenticated file editor for live targeting configuration files.","The scripts contain strong signs of AI assistance, including document-like comment scaffolding, explanatory comments beside obfuscated code, and inconsistent coding style."],"insights":["The fake CAPTCHA delivery likely used HTTPS-facing hosts in addition to the exposed IP address because the clipboard-copy step depends on a secure, focused browser context.","REF6045’s workflow is selective rather than fully automated: victims remain in a passive feed until an operator chooses to activate redirects, vishing overlays, clipboard swaps, or Remote Utilities installation by IP address.","The toolkit’s self-update process preserves operator notes, infection timestamps, remote-access status, and install markers, allowing REF6045 to replace the implant without losing victim-tracking state.","The operation’s exposed unauthenticated file editor meant the same configuration files used by the operator to manage live targeting could be read or modified by anyone who found the endpoint.","The Remote Utilities deployment and the vishing page both converge on the same hands-on access path, linking the social-engineering prompt directly to attacker-controlled remote desktop capability."],"referencedReports":[],"body":"\u003cp\u003eElastic Security Labs analyzed a Mexican banking fraud operation tracked as REF6045 that uses fake CAPTCHA-style ClickFix pages to trick victims into running a command on Windows. The command installs SCMBANKER, a PowerShell toolkit with components dating back to at least October 2025. The operation is not fully automated; a human operator monitors infected machines and decides when to take actions against victims.\u003c/p\u003e\n\n\u003cp\u003eSCMBANKER gives operators a fraud workflow focused on Mexico’s financial ecosystem, including retail banks, business banking portals, fintechs, payment processors, cryptocurrency exchanges, investment platforms, SAT, and telecom services. The toolkit can monitor banking sessions, capture screenshots, display fake bank warning overlays for vishing, redirect browsers to phishing pages, replace copied CLABE or card numbers, and deploy Remote Utilities Host for hands-on access. Victims can be pushed toward live phone interaction or have their browser and clipboard manipulated during online banking activity.\u003c/p\u003e\n\n\u003cp\u003eElastic’s analysis was enabled by operational security failures, including open directories, an exposed web-root archive, and an unauthenticated file editor that revealed tooling and targeting logic. The infection chain uses a fake Windows Update screen, repeated UAC prompts, a cursor trap, bitsadmin downloads, registry and startup-folder persistence, and a forced reboot to trigger execution. The scripts also contain strong signs of AI assistance, including heavy explanatory comments, document-like scaffolding, and self-documenting obfuscation artifacts.\u003c/p\u003e\n"},{"n":11,"title":"Rogue Agent: How a Single Code Block Could Hijack Your AI Conversations in Google’s DialogFlow","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/rogue-agent-dialogflow-attack","time":"13:00","priority":"SHOULD READ","score":85,"tldr":"Varonis found and Google patched a critical Dialogflow CX flaw where a single Playbook update permission could let attackers inject persistent code into Google-managed Code Blocks, exposing and manipulating chatbot conversations across agents in the same GCP project. The issue also enabled stealthy data exfiltration despite VPC Service Controls, making log review and Code Block audits important for affected users.","briefOverview":"\u003cp\u003eVaronis Threat Labs discovered a critical vulnerability in Google Cloud Platform’s Dialogflow CX service, which they named Rogue Agent. The flaw affected the Playbook Code Blocks feature and allowed attackers to inject persistent malicious code into the Dialogflow agents’ pipeline. According to the article, the exploit required a single edit permission, dialogflow.playbooks.update, on one agent. Google issued an initial security update in April 2026 and fully resolved the issue in June 2026.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability mattered because Dialogflow agents can handle sensitive customer support, financial services, healthcare, and enterprise workflow data. Attackers could silently exfiltrate conversations, manipulate agent responses, and conduct phishing campaigns disguised as legitimate chatbot interactions. The shared Google-managed Cloud Run execution environment meant a foothold in one agent could compromise other agents in the same GCP project. Varonis said it was not aware of exploitation in the wild before Google’s patch release.\u003c/p\u003e\n\n\u003cp\u003eTechnically, Varonis found that Code Blocks executed in a Cloud Run environment with public network access, a writable file system, and sufficient privileges to modify system files. Researchers identified a writable file named code_execution_env.py that executed configured Code Blocks using Python’s exec() function, exposing variables such as conversation history and session state. They also found that Code Blocks could bypass VPC Service Controls through outbound internet access and that the environment exposed Instance Metadata Service credentials for a low-privileged Google-managed service account. The article recommends auditing Dialogflow CX configurations, reviewing Playbook update actions, checking failed request logs, and manually reviewing Code Blocks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs discovered a critical vulnerability in Google Cloud Platform’s Dialogflow CX service that allowed attackers to inject persistent malicious code through the Playbook Code Blocks feature.","The exploit required only the dialogflow.playbooks.update permission on one agent and could affect other Dialogflow agents in the same GCP project because they shared a Google-managed Cloud Run execution environment.","Attackers could overwrite a writable internal file named code_execution_env.py to intercept Code Block execution, access conversation history and
