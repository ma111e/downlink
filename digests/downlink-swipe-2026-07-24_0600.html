<script type="application/json" id="dl-articles">[{"n":1,"title":"Clop ransomware targets Windchill, FlexPLM in data theft attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/clop-ransomware-targets-windchill-flexplm-in-data-theft-attacks/","time":"07:36","priority":"MUST READ","score":95,"tldr":"Clop is exploiting a critical PTC Windchill and FlexPLM remote code execution flaw, CVE-2026-12569, to deploy JSP webshells and steal sensitive product data for extortion. Organizations using these platforms should urgently patch, restrict exposure, and check for compromise.","briefOverview":"\u003cp\u003eThe Clop ransomware gang is targeting Internet-exposed PTC Windchill and FlexPLM instances in a new data theft extortion campaign. ReliaQuest reported that attackers are actively exploiting CVE-2026-12569, a critical improper input validation and unsafe deserialization vulnerability affecting the two PLM platforms. The flaw enables unauthenticated remote code execution, and attackers have been deploying JSP web shells to run commands and exfiltrate sensitive product data.\u003c/p\u003e\n\n\u003cp\u003ePTC began releasing security patches for CVE-2026-12569 on June 17 and urged customers to review their environments for indicators of compromise. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog after PTC warned customers of heightened threat activity and ordered U.S. federal agencies to secure affected systems within three days. German authorities also acted urgently, with BSI reportedly emailing and calling PTC customers during the night to warn them to patch as quickly as possible.\u003c/p\u003e\n\n\u003cp\u003eWindchill and FlexPLM are Product Lifecycle Management platforms used to track, design, and manage products from concept through manufacturing. PTC says its products are used by more than 30,000 customers globally, including over 1,500 brand and retail customers using FlexPLM, across sectors such as aerospace, defense, automotive, heavy machinery, retail, and medtech. Clop has a history of stealing data from enterprise platforms and publishing stolen files on its dark web leak site if victims refuse to pay a ransom.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Clop ransomware gang is targeting Internet-exposed PTC Windchill and FlexPLM instances in a new data theft extortion campaign.","ReliaQuest reported that attackers are actively exploiting CVE-2026-12569, a critical flaw in PTC Windchill and FlexPLM that enables unauthenticated remote code execution and JSP web shell deployment.","BleepingComputer learned that some companies have begun receiving extortion emails from support@cryptohox.com, a new email address used by the Clop gang.","PTC began releasing security patches for CVE-2026-12569 on June 17 and urged customers to review their environments for indicators of compromise.","CISA added CVE-2026-12569 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to secure affected PTC Windchill and FlexPLM instances within three days."],"insights":["Clop’s use of a newly announced extortion email address, support@cryptohox.com, is consistent with the group’s pattern of changing contact addresses before launching a new extortion campaign.","Government response indicates unusual urgency, with CISA requiring U.S. federal agencies to secure affected systems within three days and Germany’s BSI reportedly contacting PTC customers during the night.","ReliaQuest’s recommended response goes beyond patching: suspected victims should isolate affected servers, collect forensic artifacts, and rotate exposed credentials before restoring service.","The targeted platforms may contain especially valuable data because Windchill and FlexPLM are used to manage product design and manufacturing information across sectors including aerospace, defense, automotive, retail, and medtech."],"referencedReports":[{"title":"Windchill/FlexPLM RCE Vulnerability","url":"https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability","publisher":"PTC","context":"The article says PTC began releasing security patches for CVE-2026-12569 through this advisory.","category":"","primary":false},{"title":"CS473270","url":"https://www.ptc.com/en/support/article/CS473270","publisher":"PTC","context":"The article says PTC released remediation guidance in this private advisory and urged customers to review environments for indicators of compromise.","category":"","primary":false},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/06/25/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article says CISA added CVE-2026-12569 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to secure affected systems.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A1384","publisher":"CISA","context":"The article references CISA's catalog as the place where CVE-2026-12569 was listed as actively exploited.","category":"","primary":false}],"body":"\u003cp\u003eThe Clop ransomware gang is targeting Internet-exposed PTC Windchill and FlexPLM instances in a new data theft extortion campaign. ReliaQuest reported that attackers are actively exploiting CVE-2026-12569, a critical improper input validation and unsafe deserialization vulnerability affecting the two PLM platforms. The flaw enables unauthenticated remote code execution, and attackers have been deploying JSP web shells to run commands and exfiltrate sensitive product data.\u003c/p\u003e\n\n\u003cp\u003ePTC began releasing security patches for CVE-2026-12569 on June 17 and urged customers to review their environments for indicators of compromise. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog after PTC warned customers of heightened threat activity and ordered U.S. federal agencies to secure affected systems within three days. German authorities also acted urgently, with BSI reportedly emailing and calling PTC customers during the night to warn them to patch as quickly as possible.\u003c/p\u003e\n\n\u003cp\u003eWindchill and FlexPLM are Product Lifecycle Management platforms used to track, design, and manage products from concept through manufacturing. PTC says its products are used by more than 30,000 customers globally, including over 1,500 brand and retail customers using FlexPLM, across sectors such as aerospace, defense, automotive, heavy machinery, retail, and medtech. Clop has a history of stealing data from enterprise platforms and publishing stolen files on its dark web leak site if victims refuse to pay a ransom.\u003c/p\u003e\n"},{"n":4,"title":"Kimi K3 Agents Found Redis Zero-Days and Built RCE Exploit, Researchers Say","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/kimi-k3-agents-found-redis-zero-days.html","time":"06:58","priority":"MUST READ","score":93,"tldr":"Redis released seven security updates after researchers published authenticated RCE proof-of-concepts abusing RESTORE to exploit memory corruption in Redis Streams and RedisBloom TDigest loaders. Users should upgrade to the fixed branch release immediately and revoke RESTORE from accounts that do not strictly need it.","briefOverview":"\u003cp\u003eRedis shipped seven security releases on July 23 after researchers published authenticated remote code execution proof-of-concept exploits for stock Redis 6.2.22, 7.4.9, 8.6.4, and 8.8.0. Redis says the underlying memory flaws may lead to remote code execution. The article says neither Redis’s July 23 release notes nor the reviewed public proof-of-concept repositories reported in-the-wild exploitation as of July 24, 2026.\u003c/p\u003e\n\n\u003cp\u003eAll four exploit chains require the RESTORE command. The Redis Streams chains also need EVAL and XGROUP, while the Redis 8.8.0 chain needs EVAL and the bundled RedisBloom module. The article describes one path as a Streams shared-ownership bug that can lead to a double free, and the other as an out-of-bounds write in the RedisBloom TDigest RDB loader.\u003c/p\u003e\n\n\u003cp\u003eRedis 6.2.23, 7.2.15, and 7.4.10 fix the Streams shared-NACK use-after-free, while Redis 8.2.8, 8.4.5, and 8.6.5 fix both the Streams issue and the RedisBloom and TDigest out-of-bounds writes. Redis 8.8.1 fixes the RedisBloom and TDigest loaders, while the Streams guard was already present in Redis 8.8.0. The article recommends upgrading to the fixed release for the deployed branch, revoking RESTORE from accounts that do not strictly need it, and blocking untrusted network access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Redis shipped seven security releases on July 23 after researchers published authenticated remote code execution proof-of-concept exploits for stock Redis 6.2.22, 7.4.9, 8.6.4, and 8.8.0.","All four disclosed exploit chains require the RESTORE command; the Streams chains also require EVAL and XGROUP, while the Redis 8.8.0 chain requires EVAL and the bundled RedisBloom module.","Redis 6.2.23, 7.2.15, and 7.4.10 fix the Streams shared-NACK use-after-free, while Redis 8.2.8, 8.4.5, 8.6.5, and 8.8.1 address the RedisBloom and TDigest loader issues as applicable.","The article says Redis 6.2.22 and 7.4.9 were May security updates that Redis had told users to install, but those releases did not include the shared-NACK ownership guard.","As of July 24, 2026, Redis release notes and the reviewed public proof-of-concept repositories did not report in-the-wild exploitation of these issues."],"insights":["Restricting the RESTORE command is an especially high-value mitigation because the article says it cuts off both disclosed exploit paths, even though the chains differ internally.","Being “recently patched” was not enough in this case, because Redis 6.2.22 and 7.4.9 were May security update targets but still lacked the shared-NACK ownership guard fixed in July.","The public vulnerability tracking picture was incomplete at publication time, as Redis’s July release notes listed no CVE or CVSS score for the new bug classes and NVD still only showed the May records.","The Redis 8.6.4 release notes cited a pull request for the Streams fix, but the article’s source review found the tagged 8.6.4 source did not contain the duplicate-ownership check that appeared in 8.6.5.","The article distinguishes confirmed facts from self-reported AI claims: Redis’s public record confirms the flaws and fixes, but not the claimed count of 19 zero-days or the degree of agent autonomy."],"referencedReports":[{"title":"Redis Releases","url":"https://github.com/redis/redis/releases","publisher":"Redis","context":"The article says Redis shipped seven security releases on July 23 and links to the Redis release page as the source for those fixes.","category":"","primary":false},{"title":"Redis 8.6.4 Release Notes","url":"https://github.com/redis/redis/releases/tag/8.6.4","publisher":"Redis","context":"The article cites the Redis 8.6.4 release notes while discussing the Streams shared-NACK fix and the related pull request.","category":"","primary":false}],"body":"\u003cp\u003eRedis shipped seven security releases on July 23 after researchers published authenticated remote code execution proof-of-concept exploits for stock Redis 6.2.22, 7.4.9, 8.6.4, and 8.8.0. Redis says the underlying memory flaws may lead to remote code execution. The article says neither Redis’s July 23 release notes nor the reviewed public proof-of-concept repositories reported in-the-wild exploitation as of July 24, 2026.\u003c/p\u003e\n\n\u003cp\u003eAll four exploit chains require the RESTORE command. The Redis Streams chains also need EVAL and XGROUP, while the Redis 8.8.0 chain needs EVAL and the bundled RedisBloom module. The article describes one path as a Streams shared-ownership bug that can lead to a double free, and the other as an out-of-bounds write in the RedisBloom TDigest RDB loader.\u003c/p\u003e\n\n\u003cp\u003eRedis 6.2.23, 7.2.15, and 7.4.10 fix the Streams shared-NACK use-after-free, while Redis 8.2.8, 8.4.5, and 8.6.5 fix both the Streams issue and the RedisBloom and TDigest out-of-bounds writes. Redis 8.8.1 fixes the RedisBloom and TDigest loaders, while the Streams guard was already present in Redis 8.8.0. The article recommends upgrading to the fixed release for the deployed branch, revoking RESTORE from accounts that do not strictly need it, and blocking untrusted network access.\u003c/p\u003e\n"},{"n":3,"title":"Fake Notepad++ Plugin Delivers MATCHBOIL.V2 in UAC-0099 Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fake-notepad-plugin-delivers.html","time":"06:50","priority":"MUST READ","score":92,"tldr":"CERT-UA warns that Russia-aligned UAC-0099 is using phishing emails to deliver a fake Notepad++ plugin that installs the MATCHBOIL.V2 loader on Windows systems. The campaign highlights continued Russian targeting of Ukrainian and Western organizations using deceptive software packages and webmail exploitation techniques.","briefOverview":"\u003cp\u003eCERT-UA warned of a new campaign that uses a malicious program disguised as a Notepad++ plugin to compromise Windows systems. The activity is attributed to UAC-0099, a Russia-aligned threat cluster active since at least mid-2022. The group has previously used WinRAR flaws, phishing emails, and malware including LONEPAGE, MATCHBOIL, MATCHWOK, and DRAGSTARE.\u003c/p\u003e\n\n\u003cp\u003eThe latest attacks begin with a phishing email containing an image attachment that leads through a shortened URL to a file-sharing service hosting a ZIP archive. The archive contains a VBScript masquerading as a PDF, which displays a decoy PDF while downloading another archive named Evernote.zip. That archive includes a legitimate copy of Notepad++ 8.8.3, a malicious NppExport.dll plugin, a password-protected updater.rar archive, and winrar.exe.\u003c/p\u003e\n\n\u003cp\u003eThe malicious DLL, codenamed LUNCHPOKE, unpacks updater.rar and sets up persistence by creating a scheduled task that runs RemoteLibUpdater.exe every three minutes. RemoteLibUpdater.exe is BURNYBEAR, a loader for InitTest.dll, a modified version of the C#-based MATCHBOIL loader now called MATCHBOIL.V2. CERT-UA recommends organizations update WinRAR, 7-Zip, and Notepad++ to the latest versions to reduce the risk of known vulnerabilities being used in follow-on attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-UA warned of a new UAC-0099 campaign that uses a malicious program disguised as a Notepad++ plugin to compromise Windows systems.","The attack chain begins with a phishing email containing an image attachment that leads through a shortened URL to a file-sharing service hosting a ZIP archive.","The ZIP archive contains a VBScript masquerading as a PDF, which shows a decoy PDF while downloading an archive with Notepad++ 8.8.3, a malicious NppExport.dll plugin, a password-protected updater.rar file, and winrar.exe.","The malicious DLL, codenamed LUNCHPOKE, unpacks updater.rar and sets up a scheduled task to run RemoteLibUpdater.exe every three minutes.","RemoteLibUpdater.exe is BURNYBEAR, a loader for InitTest.dll, which is a modified version of the C#-based MATCHBOIL loader codenamed MATCHBOIL.V2."],"insights":["CERT-UA’s mitigation advice is broader than the fake Notepad++ plugin itself, urging organizations to update WinRAR, 7-Zip, and Notepad++ because known flaws in these tools can support follow-on attacks.","The campaign uses a full legitimate copy of Notepad++ alongside a malicious plugin, which makes the malware delivery package appear more credible while abusing normal plugin-loading behavior.","BURNYBEAR contains a destructive fallback behavior: if RemoteLibUpdater.exe is run without the expected arguments, it attempts to exhaust the computer’s RAM and processor resources.","The article highlights a broader Russian-linked pattern in which Ukrainian users are targeted first both as a priority and as a testing ground before techniques are used against U.S. and other NATO-aligned targets.","Laundry Bear’s Zimbra campaign is notable because it can trigger by viewing a malicious email in a vulnerable webmail service, rather than requiring the user to click a link or open a file."],"referencedReports":[{"title":"CERT-UA warning on UAC-0099 malicious Notepad++ plugin campaign","url":"https://cert.gov.ua/article/6318634","publisher":"CERT-UA","context":"The article is based on CERT-UA's warning about a campaign using a malicious program disguised as a Notepad++ plugin to compromise Windows systems.","category":"","primary":false},{"title":"ESET Research investigates Russian-aligned Gamaredon group","url":"https://www.eset.com/us/about/newsroom/research/eset-research-investigates-russian-aligned-gamaredon-group-2025/","publisher":"ESET","context":"The article cites ESET research as background for describing the Russia-aligned threat group linked to the activity.","category":"","primary":false},{"title":"TA458 RoundPress Exploits","url":"https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits","publisher":"Proofpoint","context":"The article references a Proofpoint report about Russian webmail targeting using half-click cross-site scripting exploits in Operation RoundPress.","category":"","primary":false}],"body":"\u003cp\u003eCERT-UA warned of a new campaign that uses a malicious program disguised as a Notepad++ plugin to compromise Windows systems. The activity is attributed to UAC-0099, a Russia-aligned threat cluster active since at least mid-2022. The group has previously used WinRAR flaws, phishing emails, and malware including LONEPAGE, MATCHBOIL, MATCHWOK, and DRAGSTARE.\u003c/p\u003e\n\n\u003cp\u003eThe latest attacks begin with a phishing email containing an image attachment that leads through a shortened URL to a file-sharing service hosting a ZIP archive. The archive contains a VBScript masquerading as a PDF, which displays a decoy PDF while downloading another archive named Evernote.zip. That archive includes a legitimate copy of Notepad++ 8.8.3, a malicious NppExport.dll plugin, a password-protected updater.rar archive, and winrar.exe.\u003c/p\u003e\n\n\u003cp\u003eThe malicious DLL, codenamed LUNCHPOKE, unpacks updater.rar and sets up persistence by creating a scheduled task that runs RemoteLibUpdater.exe every three minutes. RemoteLibUpdater.exe is BURNYBEAR, a loader for InitTest.dll, a modified version of the C#-based MATCHBOIL loader now called MATCHBOIL.V2. CERT-UA recommends organizations update WinRAR, 7-Zip, and Notepad++ to the latest versions to reduce the risk of known vulnerabilities being used in follow-on attacks.\u003c/p\u003e\n"},{"n":2,"title":"NodeBB Patches Eight AI-Found Flaws Exposing Admin Access and Private Chats","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nodebb-patches-eight-ai-found-flaws.html","time":"07:41","priority":"SHOULD READ","score":82,"tldr":"NodeBB patched eight high-severity flaws found by AI testing that could expose admin access, private messages, private categories, and enable XSS or post manipulation, with all versions before 4.14.0 affected. Administrators should upgrade to 4.14.2 because disabling federation only reduces exposure and does not fix all issues.","briefOverview":"\u003cp\u003eEight security flaws in NodeBB were publicly disclosed along with exploit code, after Aikido Security said its AI pentest agents found them during a six-hour review of the forum software\u0026rsquo;s source code. Aikido rated all eight as high severity, and every NodeBB version before 4.14.0 is affected. NodeBB has fixed all eight, and administrators are advised to upgrade to version 4.14.2.\u003c/p\u003e\n\n\u003cp\u003eThe flaws included a settings issue that could let a regular forum member open the admin dashboard, unauthenticated access to private messages and private categories, post takeover, vote inflation, and malicious code planted through federation-related paths. The widest flaw involved NodeBB\u0026rsquo;s page-building process, where user input could smuggle in translation codes that later allowed an attacker to plant a link that runs code when clicked. Most access from the admin dashboard issue was read-only, but it included items such as the error log and exported user lists, and the user could also change the site logo.\u003c/p\u003e\n\n\u003cp\u003eFive of the eight issues were in NodeBB\u0026rsquo;s federation code, which affects exposure differently depending on how a forum was installed or upgraded. Fresh version 4 installations federate by default and had all eight flaws, while forums upgraded from version 3 had federation switched off automatically and were affected by only three unless an administrator turned federation back on. None of the eight flaws has a CVE tracking number, and the article says no attacks using them have been reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido Security said its AI pentest agents found eight high-severity flaws in NodeBB during a six-hour source-code review, and exploit code for the flaws was published.","Every NodeBB version before 4.14.0 is affected, all eight flaws have been fixed, and administrators are advised to upgrade to version 4.14.2.","The flaws included a member-accessible admin dashboard issue, unauthenticated access to private messages and private categories, a sitewide link-based code execution issue, post takeover, vote inflation, and two federation-based malicious code issues.","Five of the eight flaws were in NodeBB's federation code, so freshly installed version 4 forums with federation on by default had all eight flaws, while upgraded version 3 forums with federation off had only three applicable flaws.","None of the eight flaws has a CVE tracking number, and nobody has reported attacks using them."],"insights":["Disabling federation is not a complete mitigation because three of the eight flaws are unrelated to NodeBB's federation code.","Fresh NodeBB version 4 installations were more exposed than upgraded version 3 forums because federation is enabled by default on fresh version 4 installs but was automatically switched off during version 3 upgrades.","The admin dashboard issue shows a server-side authorization gap because the interface blocked the dangerous homepage setting only in the browser, where it could be bypassed.","The fixes were spread across multiple releases from May through July, so administrators need the latest 4.14.2 release rather than assuming a single earlier patch fully addressed the problem.","The 4.14.0 template-handling rebuild touched 325 files, so upgrading may require extra work for sites using custom themes or plugins."],"referencedReports":[{"title":"Eight High-Severity Vulnerabilities in NodeBB","url":"https://www.aikido.dev/blog/eight-high-severity-vulnerabilities-nodebb","publisher":"Aikido Security","context":"The article says Aikido Security's AI pentest agents found the eight NodeBB flaws during a six-hour source-code review and links to Aikido's writeup.","category":"","primary":false},{"title":"CVE-2026-58593","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-58593","publisher":"National Vulnerability Database","context":"The article references a separate NodeBB federation flaw with a CVE record that is not one of Aikido's eight flaws.","category":"","primary":false}],"body":"\u003cp\u003eEight security flaws in NodeBB were publicly disclosed along with exploit code, after Aikido Security said its AI pentest agents found them during a six-hour review of the forum software\u0026rsquo;s source code. Aikido rated all eight as high severity, and every NodeBB version before 4.14.0 is affected. NodeBB has fixed all eight, and administrators are advised to upgrade to version 4.14.2.\u003c/p\u003e\n\n\u003cp\u003eThe flaws included a settings issue that could let a regular forum member open the admin dashboard, unauthenticated access to private messages and private categories, post takeover, vote inflation, and malicious code planted through federation-related paths. The widest flaw involved NodeBB\u0026rsquo;s page-building process, where user input could smuggle in translation codes that later allowed an attacker to plant a link that runs code when clicked. Most access from the admin dashboard issue was read-only, but it included items such as the error log and exported user lists, and the user could also change the site logo.\u003c/p\u003e\n\n\u003cp\u003eFive of the eight issues were in NodeBB\u0026rsquo;s federation code, which affects exposure differently depending on how a forum was installed or upgraded. Fresh version 4 installations federate by default and had all eight flaws, while forums upgraded from version 3 had federation switched off automatically and were affected by only three unless an administrator turned federation back on. None of the eight flaws has a CVE tracking number, and the article says no attacks using them have been reported.\u003c/p\u003e\n"}]</script>

  border:1px solid rgba(127,127,127,.35);box-shadow:0 6px 24px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);transition:opacity .2s ease}
#dl-layout-cta span{opacity:.92}
#dl-layout-cta button{cursor:pointer;font:inherit;padding:.35em .85em;border-radius:7px;
  border:1px solid transparent;white-space:nowrap}
#dl-layout-cta button[data-dl-try]{background:#39bdc9;color:#04222a;
  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
