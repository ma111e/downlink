<script type="application/json" id="dl-articles">[{"n":1,"title":"Even the Unsubscribe Link Installed a Remote-Access Tool","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/greeting-card-lure-every-link-screenconnect-rmm-installer","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email disguised as a legitimate e-card rewrote every link, including Unsubscribe and Privacy, to a ScreenConnect remote-access installer, while passing SPF, DKIM, DMARC, and URL reputation checks. The key lesson is that clean authentication, reputable infrastructure, and legitimate software can still combine into a high-risk remote-access phishing attempt.","briefOverview":"\u003cp\u003eA data-protection analyst at a regional nonprofit health system received an email that looked like a legitimate e-card notification. The message used real greeting-card artwork hotlinked from the vendor’s own image network, but nearly every link in the body had been rewritten to download a ScreenConnect remote-support installer requesting guest access. This included not only the main button, but also social icons, Help, About, Privacy, Terms, and Unsubscribe.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft routed the message to Junk with spam confidence level 5, and Themis flagged it at 90 percent confidence and automatically resolved it as phishing. Automated URL reputation checks rated both destination links clean, because the abused ScreenConnect platform domain was legitimate and long established. The article emphasizes that the vendor was not breached; rather, its self-service platform was used as designed by an account that should not have existed.\u003c/p\u003e\n\n\u003cp\u003eThe attack passed SPF, DKIM, DMARC, ARC, and composite authentication because the sender used a free consumer mailbox it actually controlled. The payload was not a fake sign-in page or scanner-defined malware, but signed commercial remote-support software delivered in an unsolicited greeting-card email. The article maps the activity to MITRE ATT\u0026amp;CK techniques for spearphishing links, user execution of a malicious file, and remote access software abuse.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A data-protection analyst at a regional nonprofit health system received an e-card-themed email that used real greeting-card artwork hotlinked from the vendor's own image network.","Nearly every link in the email, including Help, About, Privacy, Terms, and Unsubscribe, was rewritten to a ScreenConnect remote-support installer requesting guest access.","Microsoft routed the message to Junk with spam confidence level 5, while Themis flagged it at 90 percent confidence and automatically resolved it as phishing.","SPF, DKIM, DMARC, ARC, and composite authentication all passed because the attacker sent the message from a free consumer mailbox they controlled.","Automated URL reputation checks returned clean verdicts because the links used legitimate ScreenConnect platform infrastructure, and the installer was signed commercial remote-support software rather than scanner-defined malware."],"insights":["The strongest signal was not any single suspicious link but the message-level pattern that nearly every anchor in the template, including boilerplate links users may trust more than the main button, resolved to the same installer.","Email authentication offered no protection in this case because the attacker did not spoof a domain; the checks accurately confirmed control of the sending mailbox while saying nothing about whether the message was safe.","Domain reputation failed structurally because a long-established remote-support platform’s clean parent-domain history could be inherited by short-lived self-service subdomains created for abuse.","The payload avoided typical phishing indicators by delivering legitimate signed remote-support software instead of a fake login page or scanner-defined malware.","The article highlights Junk routing as insufficient containment because users may retrieve messages from Junk when they are expecting legitimate mail."],"referencedReports":[{"title":"T1566.002 Phishing: Spearphishing Link","url":"https://attack.mitre.org/techniques/T1566/002/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique to classify the delivery method as rewritten links in a cloned brand template.","category":"research","primary":false},{"title":"T1204.002 User Execution: Malicious File","url":"https://attack.mitre.org/techniques/T1204/002/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique because compromise required the recipient to run the downloaded installer.","category":"research","primary":false},{"title":"T1219 Remote Access Software","url":"https://attack.mitre.org/techniques/T1219/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique to describe the abuse of legitimate remote-support tooling for unauthorized access.","category":"research","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the report for statistics on the human element in breaches and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references this guidance when discussing the need to control what users can execute.","category":"guide","primary":false}],"body":"\u003cp\u003eA data-protection analyst at a regional nonprofit health system received an email that looked like a legitimate e-card notification. The message used real greeting-card artwork hotlinked from the vendor’s own image network, but nearly every link in the body had been rewritten to download a ScreenConnect remote-support installer requesting guest access. This included not only the main button, but also social icons, Help, About, Privacy, Terms, and Unsubscribe.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft routed the message to Junk with spam confidence level 5, and Themis flagged it at 90 percent confidence and automatically resolved it as phishing. Automated URL reputation checks rated both destination links clean, because the abused ScreenConnect platform domain was legitimate and long established. The article emphasizes that the vendor was not breached; rather, its self-service platform was used as designed by an account that should not have existed.\u003c/p\u003e\n\n\u003cp\u003eThe attack passed SPF, DKIM, DMARC, ARC, and composite authentication because the sender used a free consumer mailbox it actually controlled. The payload was not a fake sign-in page or scanner-defined malware, but signed commercial remote-support software delivered in an unsolicited greeting-card email. The article maps the activity to MITRE ATT\u0026amp;CK techniques for spearphishing links, user execution of a malicious file, and remote access software abuse.\u003c/p\u003e\n"}]</script>
