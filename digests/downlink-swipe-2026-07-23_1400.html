<script type="application/json" id="dl-articles">[{"n":1,"title":"Russian hackers exploit Zimbra zero-click flaw for email theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-hackers-exploit-zimbra-zero-click-flaw-for-email-theft/","time":"16:49","priority":"MUST READ","score":95,"tldr":"CISA warns that Russian state-backed Laundry Bear hackers are exploiting a patched Zimbra zero-click XSS flaw and phishing kits to steal emails, credentials, 2FA tokens, and app passcodes. Organizations using Zimbra should urgently patch, check IOCs, and review accounts for unauthorized access.","briefOverview":"\u003cp\u003eCISA is warning that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations using Zimbra Collaboration email servers. The group is combining phishing attacks with exploitation of CVE-2025-66376, a now-patched cross-site scripting flaw in Zimbra Collaboration Suite’s Classic UI. CISA says the group exploited the flaw as a zero-day before Zimbra patched it in November 2025 and continues to target organizations running unpatched servers.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability allows JavaScript embedded in specially crafted HTML emails to run automatically when a victim views the message. CISA says Laundry Bear’s exploit collects and sends the victim’s last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens. The attackers also create a new Zimbra application passcode that can be used by legacy email clients such as IMAP or ActiveSync, allowing continued access while bypassing MFA.\u003c/p\u003e\n\n\u003cp\u003eThe stolen information is exfiltrated over both DNS and HTTPS to an actor-controlled server running the group’s Flowerbed collection framework. CISA says Laundry Bear has targeted organizations associated with the Defense Industrial Base, government, education, energy, law enforcement, media, non-governmental organizations, and technology. The advisory recommends updating Zimbra, reviewing indicators of compromise, monitoring suspicious authentication activity, revoking unauthorized application passcodes, and reviewing accounts for unauthorized mailbox access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations using Zimbra Collaboration email servers through phishing and exploitation of a now-patched Zimbra vulnerability.","The attackers exploit CVE-2025-66376, a cross-site scripting flaw in Zimbra Collaboration Suite's Classic UI that lets JavaScript in specially crafted HTML emails run automatically when a victim views the message.","CISA said Laundry Bear used the flaw to collect and send victims' last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens.","The attackers create new Zimbra application passcodes that can be used by legacy clients such as IMAP or ActiveSync to retain email account access while bypassing MFA.","CISA recommends that organizations using Zimbra update to the latest software version, review indicators of compromise, monitor suspicious authentication activity, revoke unauthorized application passcodes, and review accounts for unauthorized mailbox access."],"insights":["The Zimbra flaw is especially dangerous because simply viewing a crafted email can trigger data theft without the victim clicking a link or visiting a fake site.","Laundry Bear’s use of Zimbra application passcodes is a practical persistence method because those passcodes work with legacy email clients that do not support TOTP authentication flows and can bypass MFA.","The campaign uses both DNS and HTTPS for exfiltration, with smaller data sent through DNS A-record queries and larger mailbox archives uploaded over HTTPS.","CISA’s recommendation to revoke unauthorized application passcodes, especially those named “ZimbraWeb,” indicates defenders should inspect more than normal passwords and sessions when investigating compromised Zimbra accounts."],"referencedReports":[{"title":"New Russia-affiliated actor Void Blizzard targets critical sectors for espionage","url":"https://www.microsoft.com/en-us/security/blog/2025/05/27/new-russia-affiliated-actor-void-blizzard-targets-critical-sectors-for-espionage/","publisher":"Microsoft","context":"The article cites Microsoft’s documentation of Void Blizzard compromises of organizations supporting Ukraine in the defense, transportation, and aviation sectors.","category":"","primary":false}],"body":"\u003cp\u003eCISA is warning that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations using Zimbra Collaboration email servers. The group is combining phishing attacks with exploitation of CVE-2025-66376, a now-patched cross-site scripting flaw in Zimbra Collaboration Suite’s Classic UI. CISA says the group exploited the flaw as a zero-day before Zimbra patched it in November 2025 and continues to target organizations running unpatched servers.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability allows JavaScript embedded in specially crafted HTML emails to run automatically when a victim views the message. CISA says Laundry Bear’s exploit collects and sends the victim’s last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens. The attackers also create a new Zimbra application passcode that can be used by legacy email clients such as IMAP or ActiveSync, allowing continued access while bypassing MFA.\u003c/p\u003e\n\n\u003cp\u003eThe stolen information is exfiltrated over both DNS and HTTPS to an actor-controlled server running the group’s Flowerbed collection framework. CISA says Laundry Bear has targeted organizations associated with the Defense Industrial Base, government, education, energy, law enforcement, media, non-governmental organizations, and technology. The advisory recommends updating Zimbra, reviewing indicators of compromise, monitoring suspicious authentication activity, revoking unauthorized application passcodes, and reviewing accounts for unauthorized mailbox access.\u003c/p\u003e\n"},{"n":6,"title":"International alert spotlights Russia-linked attacks on Zimbra webmail","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/zimbra-webmail-zero-click-phishing-russia-laundry-bear","time":"16:58","priority":"MUST READ","score":95,"tldr":"U.S. and allied agencies warned that Russia-linked Laundry Bear hackers are using zero-click phishing emails to exploit a patched Zimbra webmail vulnerability and steal emails, credentials, contacts and tokens from government, defense, transportation and financial targets. Organizations using Zimbra should patch immediately or move users to another mail client if patching is not possible.","briefOverview":"\u003cp\u003eFederal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers have been compromising governmental and commercial organizations in the West through zero-click phishing emails. The campaign is attributed to the advanced persistent threat group Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform. The activity exploits CVE-2025-66376, a vulnerability that was patched in November 2025.\u003c/p\u003e\n\n\u003cp\u003eAccording to the advisory, the hackers extensively targeted Ukrainian entities before shifting toward U.S. and NATO organizations. The agencies said this shows an increasing trend of Russian cyber threat groups using Ukrainian users both as a priority target and as a testbed before broader deployment. They concluded that the covert and persistent nature of the activity, along with the absence of known financial extortion, almost certainly indicates espionage backed by the Russian government.\u003c/p\u003e\n\n\u003cp\u003eSince at least July 2025, Laundry Bear has used a novel exploit in which malicious JavaScript is hidden in emails sent from previously compromised email accounts and runs immediately when the emails are opened. The hackers have attempted to steal the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes. Government agencies urged organizations using Zimbra webmail to patch immediately or, if patching is not feasible, direct employees to use a different mail client.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Federal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers have been compromising governmental and commercial organizations in the West through zero-click phishing emails.","The campaign is attributed to the advanced persistent threat group Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform by exploiting CVE-2025-66376, a vulnerability patched in November 2025.","The advisory said Laundry Bear extensively targeted Ukrainian entities before targeting U.S. and NATO organizations, describing Ukraine as both a priority target and a testbed for techniques later used more broadly.","The hackers have attempted to exfiltrate the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes.","Government agencies urged organizations using Zimbra webmail to immediately patch their software or, if patching is not feasible, direct employees to use a different mail client."],"insights":["Laundry Bear’s shift from earlier password spraying and link-based phishing to a zero-click Zimbra exploit shows a notable increase in the group’s technical capability since its previously described “unsophisticated” campaigns.","The advisory highlights a pattern in which Russian cyber groups first target Ukrainian users as both a priority and a testbed before using the same techniques against U.S. and NATO organizations.","Because the malicious JavaScript is hidden in emails sent from already compromised accounts and runs when messages are opened, normal user caution about not clicking links may not be enough to prevent compromise.","The agencies’ recommendation to use a different mail client if patching is not feasible makes mitigation immediately actionable even for organizations that cannot update Zimbra right away.","The reported focus on stealing emails, passwords, contact lists and authentication codes, combined with no known financial extortion, led the agencies to assess the activity as Russian government-backed espionage."],"referencedReports":[{"title":"Cybersecurity Advisory AA26-204A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a","publisher":"CISA","context":"The article cites this international advisory for details on Laundry Bear’s targeting of Ukrainian, U.S. and NATO organizations and the assessment that the activity indicates Russian government-backed espionage.","category":"","primary":false},{"title":"Russian Webmail Espionage","url":"https://unit42.paloaltonetworks.com/russian-webmail-espionage/","publisher":"Palo Alto Networks Unit 42","context":"The article says Unit 42 published a report on the campaign and described targeting of defense, transportation and financial organizations across NATO member states, Ukraine, CIS countries and Africa.","category":"","primary":false},{"title":"TA488 Targets Zimbra Mailservers with Half-Click Exploits","url":"https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits","publisher":"Proofpoint","context":"The article cites Proofpoint’s advisory for its finding that the group compromised government, high science and defense industrial base targets in the United States.","category":"","primary":false},{"title":"Operation Ghostmail: Zimbra XSS Russian APT Ukraine","url":"https://www.seqrite.com/blog/operation-ghostmail-zimbra-xss-russian-apt-ukraine/","publisher":"Seqrite","context":"The article references Seqrite’s March 2026 description of a zero-click phishing campaign exploiting Zimbra webmail that compromised a Ukrainian maritime agency.","category":"","primary":false}],"body":"\u003cp\u003eFederal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers have been compromising governmental and commercial organizations in the West through zero-click phishing emails. The campaign is attributed to the advanced persistent threat group Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform. The activity exploits CVE-2025-66376, a vulnerability that was patched in November 2025.\u003c/p\u003e\n\n\u003cp\u003eAccording to the advisory, the hackers extensively targeted Ukrainian entities before shifting toward U.S. and NATO organizations. The agencies said this shows an increasing trend of Russian cyber threat groups using Ukrainian users both as a priority target and as a testbed before broader deployment. They concluded that the covert and persistent nature of the activity, along with the absence of known financial extortion, almost certainly indicates espionage backed by the Russian government.\u003c/p\u003e\n\n\u003cp\u003eSince at least July 2025, Laundry Bear has used a novel exploit in which malicious JavaScript is hidden in emails sent from previously compromised email accounts and runs immediately when the emails are opened. The hackers have attempted to steal the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes. Government agencies urged organizations using Zimbra webmail to patch immediately or, if patching is not feasible, direct employees to use a different mail client.\u003c/p\u003e\n"},{"n":2,"title":"Hackers abuse Notepad++ plugins to stealthily install malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abuse-notepad-plus-plus-plugins-to-stealthily-install-malware/","time":"16:32","priority":"MUST READ","score":92,"tldr":"Ukraine’s CERT says the UAC-0099 threat cluster is distributing legitimate Notepad++ bundled with a malicious plugin to gain persistence and deploy loaders such as LunchPoke, BurnyBear, and MatchBoil V2. The campaign does not exploit a Notepad++ supply-chain compromise, but abuses normal plugin-loading behavior to stealthily install malware.","briefOverview":"\u003cp\u003eUkraine\u0026rsquo;s CERT uncovered attacks distributing an archive that contains the legitimate Notepad++ application and a malicious utility called LunchPoke disguised as a plugin. The campaign is attributed to UAC-0099, a threat cluster that primarily targets organizations in Ukraine. The group has previously been linked to providing initial access for attacks carried out by APT44, also known as Sandworm.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA observed that the attack begins with a ZIP archive containing a VBS script disguised as a PDF document, which retrieves another compressed file named Evernote.zip. That second archive contains Notepad++ version 8.8.3, a malicious plugin named NppExport.dll, a password-protected updater.rar archive, and the legitimate WinRAR executable. The VBS script installs the package into a randomly named directory, launches Notepad++, and loads the malicious DLL through the application\u0026rsquo;s normal plugin-loading mechanism.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA says LunchPoke creates a scheduled task and extracts RemoteLibUpdater.exe and InitTest.dll from the RAR archive. RemoteLibUpdater.exe is BurnyBear, a loader for the MatchBoil V2 malware loader, and BurnyBear also has a fallback mechanism that can trigger RAM and CPU resource exhaustion if launching RemoteLibUpdater.exe fails. CERT-UA did not mention the final payloads, the purpose of the campaign, or the targeted organizations, but advised administrators to update Notepad++, 7-Zip, and WinRAR to reduce exposure to known flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine's CERT uncovered attacks distributing an archive containing the legitimate Notepad++ application and a malicious utility called LunchPoke disguised as a plugin to establish persistence.","The campaign is attributed to UAC-0099, a threat cluster that primarily targets organizations in Ukraine and has previously been linked to providing initial access for APT44, also known as Sandworm.","CERT-UA observed that the attack begins with a ZIP archive containing a VBS script disguised as a PDF document, which retrieves another compressed file named Evernote.zip.","The second archive contains Notepad++ version 8.8.3, a malicious NppExport.dll plugin, a password-protected updater.rar archive, and the legitimate WinRAR executable.","CERT-UA advises administrators to update Notepad++ to version 8.9.7, 7-Zip to version 26.02, and WinRAR to version 7.23 to reduce exposure to known flaws in existing products."],"insights":["The attackers did not need to exploit a Notepad++ vulnerability or compromise its supply chain, because they abused the application's normal plugin-loading mechanism to run the malicious DLL.","The attack package includes legitimate software components, including Notepad++ and WinRAR, which can make the activity appear less suspicious while enabling the malware chain.","BurnyBear includes a fallback behavior that triggers RAM and CPU resource exhaustion if RemoteLibUpdater.exe fails to launch, adding a disruptive outcome even when the main loading path breaks.","CERT-UA mentions CVE-2025-56383 in relation to Notepad++ 8.8.3, but the Notepad++ team disputes the issue and says the behavior is standard plugin functionality."],"referencedReports":[{"title":"CVE-2025-56383 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-56383","publisher":"National Vulnerability Database","context":"The article says CERT-UA mentioned CVE-2025-56383 as a DLL hijacking flaw in Notepad++ 8.8.3, while noting that the Notepad++ team disputes the issue.","category":"","primary":false}],"body":"\u003cp\u003eUkraine\u0026rsquo;s CERT uncovered attacks distributing an archive that contains the legitimate Notepad++ application and a malicious utility called LunchPoke disguised as a plugin. The campaign is attributed to UAC-0099, a threat cluster that primarily targets organizations in Ukraine. The group has previously been linked to providing initial access for attacks carried out by APT44, also known as Sandworm.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA observed that the attack begins with a ZIP archive containing a VBS script disguised as a PDF document, which retrieves another compressed file named Evernote.zip. That second archive contains Notepad++ version 8.8.3, a malicious plugin named NppExport.dll, a password-protected updater.rar archive, and the legitimate WinRAR executable. The VBS script installs the package into a randomly named directory, launches Notepad++, and loads the malicious DLL through the application\u0026rsquo;s normal plugin-loading mechanism.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA says LunchPoke creates a scheduled task and extracts RemoteLibUpdater.exe and InitTest.dll from the RAR archive. RemoteLibUpdater.exe is BurnyBear, a loader for the MatchBoil V2 malware loader, and BurnyBear also has a fallback mechanism that can trigger RAM and CPU resource exhaustion if launching RemoteLibUpdater.exe fails. CERT-UA did not mention the final payloads, the purpose of the campaign, or the targeted organizations, but advised administrators to update Notepad++, 7-Zip, and WinRAR to reduce exposure to known flaws.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft 365 outage affects Teams, SharePoint and other services","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-365-outage-affects-teams-sharepoint-and-other-services/","time":"15:34","priority":"SHOULD READ","score":78,"tldr":"Microsoft 365 is experiencing a North America-focused outage affecting Teams, SharePoint, OneDrive, the Admin Center, Power Automate, Copilot Chat, and Loop. Microsoft says it has rerouted some traffic with partial recovery and is working on further mitigation.","briefOverview":"\u003cp\u003eMicrosoft Teams and several Microsoft 365 services are experiencing an outage, primarily affecting users in North America. Downdetector recorded 2,403 reports at 11:11 a.m. ET on July 23, sharply above its normal baseline of 29. SharePoint accounted for 78% of the complaints, followed by Excel at 11% and the Microsoft 365 Admin Center at 6%.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft confirmed that multiple services are degraded and directed administrators to incident MO1437424 in the Microsoft 365 Admin Center. Affected services include OneDrive, SharePoint Online, Microsoft Teams, Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop. Reported issues include intermittent OneDrive access, “Something went wrong” errors in SharePoint Online, degraded Teams chat functionality with images not loading, slow or failed Admin Center loading, Power Automate flows not loading, Copilot Chat delays or failures, and Loop pages failing to open or load.\u003c/p\u003e\n\n\u003cp\u003eThe outage began at 10:44 a.m. ET on July 23 and affects users accessing Microsoft 365 through certain network paths in North America. Microsoft said it rerouted traffic for some affected infrastructure, and initial telemetry indicated partial recovery for some users. The company is expanding its traffic-rerouting efforts while evaluating additional mitigation measures and planned another update by 2:00 p.m. ET.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Teams and several Microsoft 365 services are experiencing an outage primarily affecting users in North America.","Downdetector recorded 2,403 reports at 11:11 a.m. ET on July 23, with SharePoint accounting for 78% of complaints.","Microsoft confirmed degraded service across OneDrive, SharePoint Online, Teams, Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop.","Microsoft said the outage began at 10:44 a.m. ET and affects users accessing Microsoft 365 through certain network paths in North America.","Microsoft rerouted traffic for some affected infrastructure, and initial telemetry indicated partial recovery for some users."],"insights":["SharePoint appears to be the most visibly affected service in user reports, accounting for 78% of Downdetector complaints despite the outage spanning multiple Microsoft 365 products.","Administrators may have difficulty tracking or managing the incident through normal channels because the Microsoft 365 Admin Center itself is loading slowly or not at all.","The impact is not uniform across all Microsoft 365 users because Microsoft says the outage affects users reaching the service through certain network paths in North America.","Microsoft’s partial recovery came from rerouting traffic, indicating that mitigation is focused on changing how users’ connections reach affected infrastructure rather than a product-specific fix."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft Teams and several Microsoft 365 services are experiencing an outage, primarily affecting users in North America. Downdetector recorded 2,403 reports at 11:11 a.m. ET on July 23, sharply above its normal baseline of 29. SharePoint accounted for 78% of the complaints, followed by Excel at 11% and the Microsoft 365 Admin Center at 6%.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft confirmed that multiple services are degraded and directed administrators to incident MO1437424 in the Microsoft 365 Admin Center. Affected services include OneDrive, SharePoint Online, Microsoft Teams, Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop. Reported issues include intermittent OneDrive access, “Something went wrong” errors in SharePoint Online, degraded Teams chat functionality with images not loading, slow or failed Admin Center loading, Power Automate flows not loading, Copilot Chat delays or failures, and Loop pages failing to open or load.\u003c/p\u003e\n\n\u003cp\u003eThe outage began at 10:44 a.m. ET on July 23 and affects users accessing Microsoft 365 through certain network paths in North America. Microsoft said it rerouted traffic for some affected infrastructure, and initial telemetry indicated partial recovery for some users. The company is expanding its traffic-rerouting efforts while evaluating additional mitigation measures and planned another update by 2:00 p.m. ET.\u003c/p\u003e\n"},{"n":5,"title":"State Department imposes visa restrictions on foreign cyber scammers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/visa-restrictions-cyber-scammers","time":"16:29","priority":"SHOULD READ","score":78,"tldr":"The U.S. State Department announced new visa restrictions for foreign cyber scammers, sextortion operators, and their immediate family members, aiming to deter transnational scam networks that cost Americans billions. The move targets criminal operations in Southeast Asia, including groups linked to human trafficking and money laundering.","briefOverview":"\u003cp\u003eThe State Department announced new visa restrictions for individuals linked to foreign cybercrime networks and their immediate family members. Secretary of State Marco Rubio said the restrictions apply to people responsible for, or complicit in, cybercrime and cyber-enabled crime, including cyberscams and sextortion. The announcement came on Rubio’s final day of a trip to the Philippines for ASEAN meetings, in a region described as a hotbed for industrial-scale scam centers.\u003c/p\u003e\n\n\u003cp\u003eRubio said Chinese transnational criminal groups are often behind scam operations that include human trafficking and money laundering. The U.S. government estimates these operations cost Americans $10 billion in 2024. FBI Director Kash Patel also met separately with leaders in the region this week to discuss combating those operations, and Rubio discussed scam centers with Cambodia’s foreign minister.\u003c/p\u003e\n\n\u003cp\u003eThe policy follows President Donald Trump’s March executive order on fighting cybercrime, fraud and predatory schemes. Rubio said the visa restrictions are intended to send a message that the United States will go after those who prey on its citizens. The article notes that visa restrictions are not a new State Department tactic, citing a February 2024 policy targeting people involved in the misuse of commercial spyware and their immediate family members.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The State Department announced new visa restrictions for individuals linked to foreign cybercrime networks and their immediate family members.","Secretary of State Marco Rubio said the restrictions target people responsible for, or complicit in, cybercrime and cyber-enabled crime, including cyberscams and sextortion.","Rubio said Chinese transnational criminal groups are often behind scam operations that include human trafficking and money laundering, and the U.S. government estimates these operations cost Americans $10 billion in 2024.","The announcement came during Rubio’s trip to the Philippines for ASEAN meetings, and he also discussed scam centers with Cambodia’s foreign minister.","The policy follows President Donald Trump’s March executive order on fighting cybercrime, fraud and predatory schemes."],"insights":["The visa policy extends pressure beyond direct cybercrime participants by also targeting their immediate family members, mirroring a prior State Department approach used against commercial spyware abuse.","The timing and location of the announcement tied the policy to Southeast Asia diplomacy, as Rubio was in the Philippines for ASEAN meetings and separately discussed scam centers with Cambodia’s foreign minister.","U.S. officials are framing scam centers as part of broader criminal enterprises rather than isolated online fraud operations, citing links to human trafficking, money laundering, drug distribution, underground banking, and real estate investment.","The article shows coordination across U.S. government efforts, with the visa restrictions following a presidential executive order and FBI Director Kash Patel separately meeting regional leaders about combating scam operations."],"referencedReports":[],"body":"\u003cp\u003eThe State Department announced new visa restrictions for individuals linked to foreign cybercrime networks and their immediate family members. Secretary of State Marco Rubio said the restrictions apply to people responsible for, or complicit in, cybercrime and cyber-enabled crime, including cyberscams and sextortion. The announcement came on Rubio’s final day of a trip to the Philippines for ASEAN meetings, in a region described as a hotbed for industrial-scale scam centers.\u003c/p\u003e\n\n\u003cp\u003eRubio said Chinese transnational criminal groups are often behind scam operations that include human trafficking and money laundering. The U.S. government estimates these operations cost Americans $10 billion in 2024. FBI Director Kash Patel also met separately with leaders in the region this week to discuss combating those operations, and Rubio discussed scam centers with Cambodia’s foreign minister.\u003c/p\u003e\n\n\u003cp\u003eThe policy follows President Donald Trump’s March executive order on fighting cybercrime, fraud and predatory schemes. Rubio said the visa restrictions are intended to send a message that the United States will go after those who prey on its citizens. The article notes that visa restrictions are not a new State Department tactic, citing a February 2024 policy targeting people involved in the misuse of commercial spyware and their immediate family members.\u003c/p\u003e\n"},{"n":8,"title":"Better generic secrets detection starts with finding non-secrets","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/better-generic-secrets-detection-non-secrets","time":"16:11","priority":"MAY READ","score":58,"tldr":"Aikido Security reduced false positives in Betterleaks’ generic secret scanning by adding signatures that filter out public-by-design credentials, cutting manual review volume by about 2.37% in a Common Crawl test. The approach treats generic secret detection as layered filtering, reserving more expensive checks and ML triage for ambiguous cases.","briefOverview":"\u003cp\u003eAikido Security described a new noise-reduction layer in Betterleaks for generic secret detection. Secrets scanners can verify known credential types such as AWS or GitHub tokens with liveness checks, but generic secrets do not have a predefined format or validation path. This leaves users manually reviewing many false positives.\u003c/p\u003e\n\n\u003cp\u003eThe change focuses on filtering credentials that are designed to be public, such as Stripe publishable API keys used in front-end code. Aikido manually wrote detection signatures for common public-by-design credential types and added them to Betterleaks. The authors said AI was surprisingly useless for this task, so the expressions were authored by hand.\u003c/p\u003e\n\n\u003cp\u003eTo measure the impact, Aikido scanned 100GB of Common Crawl data twice, once with the new signatures and once without them. The publishable-credential signatures reduced false positives by 2.37%, which amounted to 27,886 fewer results to review manually, while adding about 5% more scanning time. The article also explains cases that require caution, including credentials that share formats with secret keys, public keys that can become risky through permissions, and test credentials that may still expose sensitive internal data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Secrets scanners can use liveness checks to reduce false positives when a credential type is known, but generic secrets lack predefined checks and often require manual review.","Aikido Security added manually written signatures to Betterleaks to filter out public-by-design credentials, such as Stripe publishable API keys, from generic secret results.","In a test using 100GB of Common Crawl data, the new publishable-credential signatures reduced false positives by 2.37%, equal to 27,886 fewer results to review manually.","The added filtering increased scanning time by about 5%, which the authors considered worthwhile compared with the reduction in manual triage.","The article describes several credential categories that require different handling, including distinctly formatted public keys, nondistinct formats needing nearby keywords, public and secret keys with the same format, misconfigured public keys, and test credentials."],"insights":["The authors found that manually written regular expressions were more useful than AI for identifying common public-by-design credential formats.","A small 2.37% reduction in false positives translated into 27,886 fewer findings to review in their 100GB Common Crawl test, showing that even modest percentage improvements can have large operational impact at scale.","The article warns against automatically dismissing test or sandbox credentials because some organizations place production data in test environments.","When public and secret credentials share the same format, the authors say the safer path is to detect the secret credential type and use an HTTP liveness check rather than filtering by pattern alone.","The authors are prioritizing cheap filtering layers before ML-assisted triage so that more expensive analysis is reserved for the remaining ambiguous results."],"referencedReports":[],"body":"\u003cp\u003eAikido Security described a new noise-reduction layer in Betterleaks for generic secret detection. Secrets scanners can verify known credential types such as AWS or GitHub tokens with liveness checks, but generic secrets do not have a predefined format or validation path. This leaves users manually reviewing many false positives.\u003c/p\u003e\n\n\u003cp\u003eThe change focuses on filtering credentials that are designed to be public, such as Stripe publishable API keys used in front-end code. Aikido manually wrote detection signatures for common public-by-design credential types and added them to Betterleaks. The authors said AI was surprisingly useless for this task, so the expressions were authored by hand.\u003c/p\u003e\n\n\u003cp\u003eTo measure the impact, Aikido scanned 100GB of Common Crawl data twice, once with the new signatures and once without them. The publishable-credential signatures reduced false positives by 2.37%, which amounted to 27,886 fewer results to review manually, while adding about 5% more scanning time. The article also explains cases that require caution, including credentials that share formats with secret keys, public keys that can become risky through permissions, and test credentials that may still expose sensitive internal data.\u003c/p\u003e\n"},{"n":4,"title":"FedRAMP Rev5 Is Ending: What the 20x Transition Really Requires","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fedramp-rev5-is-ending-what-the-20x-transition-really-requires/","time":"14:00","priority":"MAY READ","score":45,"tldr":"FedRAMP 20X shifts compliance from annual, narrative-based audits under Rev5 to continuous assurance backed by machine-readable evidence and recurring validation. Organizations should start building automated evidence pipelines now rather than treating the transition as a documentation remap.","briefOverview":"\u003cp\u003eFedRAMP 20X changes the assurance model from Rev5’s narrative-heavy, point-in-time assessments to continuous proof backed by machine-readable evidence. The article says Rev5 allowed organizations to describe controls, map them to NIST 800-53, and support them with curated evidence sampled annually by assessors. FedRAMP 20X instead uses Key Security Indicators, with 56 KSIs in Low and 61 in Moderate across twelve security domains.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the biggest operational shift is cadence, because machine-based KSIs may be revalidated as often as every few days for Moderate systems while process-based KSIs still require at least quarterly validation. It argues that cloud environments, identities, and deployments change continuously, so assurance must operate continuously as well. The Phase 2 completeness guidance requires at least 70 percent KSI automation, every KSI to be addressed, and evidence in both machine-readable and human-readable forms.\u003c/p\u003e\n\n\u003cp\u003eThe author says the transition is primarily engineering work rather than a documentation update. Organizations are advised to run a KSI gap analysis, prioritize domains such as Authorization by FedRAMP, Cloud Native Architecture, and Identity and Access Management, and build evidence pipelines from sources such as cloud platforms, identity providers, SIEMs, vulnerability scanners, and configuration management tools. The article also promotes a GRC Data and AI Summit 2026 session by Anecdotes CISO Jake Bernardes on the move from Rev5 to continuous, machine-readable assurance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FedRAMP 20X replaces Rev5’s narrative-heavy control approach with Key Security Indicators that require measurable outcomes backed by machine-readable evidence.","The article says the Low baseline includes 56 KSIs and the Moderate baseline includes 61 KSIs across twelve security domains, including cloud-native architecture, identity and access management, monitoring, incident response, and change management.","Under FedRAMP 20X, machine-based KSIs are revalidated on a short recurring schedule, while process-based KSIs still require at least quarterly validation.","The Phase 2 completeness guidance requires automation to cover at least 70 percent of KSIs, every KSI to be addressed, and evidence to exist in both machine-readable and human-readable forms.","The author recommends that Rev5 organizations begin with a KSI gap analysis and build evidence pipelines that collect, normalize, map, and generate structured evidence on the required cadence."],"insights":["The article frames the FedRAMP 20X transition as an engineering problem rather than a documentation problem, because organizations must build systems that continuously collect, normalize, map, and produce evidence.","Manual governance work such as policy approvals, training records, and other process evidence may become the longest transition items because they were not designed to operate continuously.","The author recommends starting with a simple KSI that already has available data, validating it end to end, fixing what breaks, and repeating the process before scaling to harder requirements.","The assessor’s role changes under FedRAMP 20X from primarily reviewing documents and narratives to validating whether an organization’s evidence pipeline accurately reflects reality.","Anecdotes says it first achieved a Low assessment, used the findings to improve its environment, and then achieved FedRAMP 20X Moderate, presenting the process as a feedback loop rather than a one-time pass-or-fail exercise."],"referencedReports":[],"body":"\u003cp\u003eFedRAMP 20X changes the assurance model from Rev5’s narrative-heavy, point-in-time assessments to continuous proof backed by machine-readable evidence. The article says Rev5 allowed organizations to describe controls, map them to NIST 800-53, and support them with curated evidence sampled annually by assessors. FedRAMP 20X instead uses Key Security Indicators, with 56 KSIs in Low and 61 in Moderate across twelve security domains.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the biggest operational shift is cadence, because machine-based KSIs may be revalidated as often as every few days for Moderate systems while process-based KSIs still require at least quarterly validation. It argues that cloud environments, identities, and deployments change continuously, so assurance must operate continuously as well. The Phase 2 completeness guidance requires at least 70 percent KSI automation, every KSI to be addressed, and evidence in both machine-readable and human-readable forms.\u003c/p\u003e\n\n\u003cp\u003eThe author says the transition is primarily engineering work rather than a documentation update. Organizations are advised to run a KSI gap analysis, prioritize domains such as Authorization by FedRAMP, Cloud Native Architecture, and Identity and Access Management, and build evidence pipelines from sources such as cloud platforms, identity providers, SIEMs, vulnerability scanners, and configuration management tools. The article also promotes a GRC Data and AI Summit 2026 session by Anecdotes CISO Jake Bernardes on the move from Rev5 to continuous, machine-readable assurance.\u003c/p\u003e\n"},{"n":9,"title":"Locked Shields 2026: Network Evidence in Action | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/locked-shields-2026-network-evidence","time":"14:30","priority":"MAY READ","score":45,"tldr":"Corelight highlights Locked Shields 2026 as a venue to demonstrate how network evidence can help defenders investigate incidents, validate activity, and respond more effectively during realistic cyber exercises.","briefOverview":"\u003cp\u003eThe article is titled “Locked Shields 2026: Network Evidence in Action” and is associated with C Locked Shields 2026 and network evidence.\u003c/p\u003e\n"},{"n":7,"title":"ThreatsDay: Android Spyware, PLC Attacks, AI Image Prompt Injection + 12 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threatsday-android-spyware-plc-attacks.html","time":"15:02","priority":"MAY READ","score":40,"tldr":"This week’s threats mostly abused trusted tools and familiar workflows, including malicious npm and VS Code packages, fake Android safety apps, AI prompt-injection images, and exposed PLCs. The key lesson is to tightly limit what ordinary-looking installs, permissions, and automation can access if they turn malicious.","briefOverview":"\u003cp\u003eThis ThreatsDay bulletin summarizes a week of security stories where harmful activity was hidden inside ordinary-looking tools, apps, permissions, and system features. The article covers malicious software packages, fake developer extensions, phishing campaigns, Android surveillance and ad-fraud apps, AI prompt-injection techniques, operational technology targeting, and malware using normal network traffic. Its main theme is that many of the threats relied on borrowed trust rather than visibly advanced hacking.\u003c/p\u003e\n\n\u003cp\u003eSeveral incidents involved software or apps that appeared useful or familiar but performed harmful actions. An npm package named @copilot-mcp/apex installed a macOS AMOS-family infostealer during npm install or npx execution, while a counterfeit Visual Studio Code extension called Markdown All Pro impersonated a popular legitimate extension and opened a remote delivery channel. Fake Android apps also played a major role, including a Bahraini Civil Defense “BH Alert” app that embedded OctagonPanel surveillance malware and fake Android applications used by TAG-182 to distribute MarkiRAT.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights broader risks in AI, industrial systems, and normal infrastructure. GhostCommit hid malicious instructions in a PNG image so an AI coding agent could later be tricked into reading repository secrets, while CISA and other U.S. government partners warned about Iranian-affiliated activity targeting internet-connected PLCs across critical infrastructure sectors. Other stories included Lampion banking malware phishing Portuguese users, TrickBot using DNS tunneling for command-and-control, and findings that AI-generated apps contained hundreds of validated security flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An npm package named @copilot-mcp/apex acted as a postinstall dropper that installed a macOS AMOS-family infostealer when users ran npm install or npx @copilot-mcp/apex.","A counterfeit Visual Studio Code extension called Markdown All Pro impersonated the legitimate Markdown All in One extension, sent machine details to an attacker, and opened a remote delivery channel for additional commands.","A technique called GhostCommit hid malicious instructions inside a PNG image in a pull request so an LLM reviewer or coding agent could later be tricked into reading repository secrets from a .env file.","U.S. government agencies warned that Iranian-affiliated activity was targeting internet-connected operational technology devices, including PLCs from Rockwell Automation, Schneider Electric, and Siemens.","Fake Android apps, including a Bahraini Civil Defense “BH Alert” siren app and fake VPN or media tools linked to TAG-182, were used to collect sensitive data or support surveillance operations."],"insights":["Several threats did not need novel exploits because they relied on trusted user actions such as running an install command, installing a familiar-looking extension, granting Android permissions, or opening what appeared to be a legitimate app.","Software supply-chain controls are tightening proactively, as shown by PyPI blocking new files on releases older than 14 days even though it said it was not aware the weakness had already been abused.","AI systems create new trust boundaries because GhostCommit placed the only malicious instructions inside an image that a text-based reviewer would not read, but an AI coding agent could later process and act on.","Some campaigns used legitimate or familiar platforms to lower suspicion, including a malicious Claude Artifact hosted on Claude.ai and fake app sites that cloned Google Play and Bahraini government pages.","The article shows that normal infrastructure features can become hiding places or control channels, including DNS responses used by TrickBot for command-and-control and reusable PLC code modules targeted in operational technology environments."],"referencedReports":[{"title":"GitHub Announces GHES Security Change","url":"https://github.blog/changelog/2026-07-22-upcoming-ghes-change-impacting-uploading-support-bundles/","publisher":"GitHub","context":"The article cites GitHub’s notice about upcoming rejection of command-line support bundle uploads from older unpatched GHES appliances.","category":"","primary":false},{"title":"Npm Dropper Delivers macOS Infostealer","url":"https://safedep.io/malicious-copilot-mcp-apex-npm-macos-infostealer/","publisher":"SafeDep","context":"The article references SafeDep’s analysis of the @copilot-mcp/apex npm package acting as a postinstall dropper for a macOS infostealer.","category":"","primary":false},{"title":"Counterfeit VS Extension Steals Machine Data","url":"https://www.manifold.security/blog/a-beaconing-counterfeit-extension-on-the-vs-code-marketplace-the-markdown-all-pro-extension","publisher":"Manifold Security","context":"The article cites Manifold Security’s analysis of a counterfeit Visual Studio Code extension that impersonated Markdown All in One.","category":"","primary":false},{"title":"PyPI Rejects New Files After 14 Days","url":"https://blog.pypi.org/posts/2026-07-22-releases-now-reject-new-files-after-14-days/","publisher":"PyPI","context":"The article references PyPI’s security change blocking new file uploads to releases older than 14 days.","category":"","primary":false},{"title":"Lampion Malware Targets Portuguese Users","url":"https://www.acronis.com/en/tru/posts/lampions-portugal-focused-phishing-campaign-delivers-multistage-malware/","publisher":"Acronis","context":"The article cites Acronis’s technical analysis of a Portugal-focused phishing campaign delivering Lampion banking malware.","category":"","primary":false},{"title":"New AfterCall Android Ad Fraud Scheme Exposed","url":"https://medium.com/doubleverify-engineering/a-new-ad-fraud-trend-aftercall-ads-ec44279843b2","publisher":"DoubleVerify","context":"The article references DoubleVerify’s findings on AfterCall Android apps that abuse overlay permissions to display ads after phone calls.","category":"","primary":false},{"title":"Claude Desktop Malvertising Campaign Targets 29 Organizations with SectopRAT","url":"https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat","publisher":"Huntress","context":"The article cites Huntress’s disclosure of the FakeAgent malvertising campaign that led to SectopRAT infections.","category":"","primary":false},{"title":"GhostCommit Hides Prompt Injection in Images to Trick AI Agents","url":"https://asset-group.github.io/disclosures/ghostcommit/","publisher":"University of Missouri-Kansas City ASSET Research Group","context":"The article references ASSET Research Group’s disclosure of GhostCommit, a technique that hides malicious AI-agent instructions inside a PNG image.","category":"","primary":false},{"title":"CISA Issues Alert About Iran-Affiliated Threat Actors Targeting PLCs","url":"https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting","publisher":"CISA","context":"The article cites a U.S. government advisory update about Iranian-affiliated activity targeting internet-connected operational technology devices and PLCs.","category":"","primary":false},{"title":"Fake Bahrain Civil-Defense App Turns Phones Into Listening Posts","url":"https://dreamgroup.com/blog/how-a-fake-bahrain-civil-defense-app-turns-a-phone-into-a-listening-post","publisher":"Dream","context":"The article references Dream’s analysis of a fake Bahraini Civil Defense app embedding OctagonPanel surveillance malware.","category":"","primary":false},{"title":"Iran-Nexus TAG-182 Disseminates MarkiRAT Surveillance Tool","url":"https://www.recordedfuture.com/research/nexus-tag182-disseminates-markirat","publisher":"Recorded Future","context":"The article cites Recorded Future’s research on TAG-182 distributing MarkiRAT through fake Android applications.","category":"","primary":false},{"title":"Vibe-Coded Apps Suffer From Exploitable Security Flaws","url":"https://go.xint.io/the-top-security-vulnerabilities-generated-by-ai-code","publisher":"Xint","context":"The article references Xint’s analysis of 28 AI-generated apps that found 434 validated vulnerabilities.","category":"","primary":false},{"title":"Russian Threat Actor Turns Frontier AI into Offensive Platform","url":"https://www.catonetworks.com/blog/cato-ctrl-how-one-threat-actor-turned-frontier-ai-into-an-offensive-platform/","publisher":"Cato Networks","context":"The article cites Cato Networks’ research on the Russian-speaking threat actor Trim using frontier AI models for offensive tooling.","category":"","primary":false},{"title":"TrickBot Variant Uses DNS Tunneling for C2","url":"https://www.fortinet.com/blog/threat-research/inside-a-trickbot-variant-using-dns-tunneling-for-c2","publisher":"Fortinet","context":"The article references Fortinet’s technical analysis of a TrickBot variant using DNS tunneling for command-and-control communication.","category":"","primary":false}],"body":"\u003cp\u003eThis ThreatsDay bulletin summarizes a week of security stories where harmful activity was hidden inside ordinary-looking tools, apps, permissions, and system features. The article covers malicious software packages, fake developer extensions, phishing campaigns, Android surveillance and ad-fraud apps, AI prompt-injection techniques, operational technology targeting, and malware using normal network traffic. Its main theme is that many of the threats relied on borrowed trust rather than visibly advanced hacking.\u003c/p\u003e\n\n\u003cp\u003eSeveral incidents involved software or apps that appeared useful or familiar but performed harmful actions. An npm package named @copilot-mcp/apex installed a macOS AMOS-family infostealer during npm install or npx execution, while a counterfeit Visual Studio Code extension called Markdown All Pro impersonated a popular legitimate extension and opened a remote delivery channel. Fake Android apps also played a major role, including a Bahraini Civil Defense “BH Alert” app that embedded OctagonPanel surveillance malware and fake Android applications used by TAG-182 to distribute MarkiRAT.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights broader risks in AI, industrial systems, and normal infrastructure. GhostCommit hid malicious instructions in a PNG image so an AI coding agent could later be tricked into reading repository secrets, while CISA and other U.S. government partners warned about Iranian-affiliated activity targeting internet-connected PLCs across critical infrastructure sectors. Other stories included Lampion banking malware phishing Portuguese users, TrickBot using DNS tunneling for command-and-control, and findings that AI-generated apps contained hundreds of validated security flaws.\u003c/p\u003e\n"}]</script>
