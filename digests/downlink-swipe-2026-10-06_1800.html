<script type="application/json" id="dl-articles">[{"n":2,"title":"Ninja Forms plugin flaw exploited to hack WordPress sites","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/","time":"21:00","priority":"MUST READ","score":93,"tldr":"Attackers are actively exploiting stored XSS flaws in outdated Ninja Forms and WPC Product Bundles for WooCommerce plugins to install backdoors and create hidden WordPress administrator accounts. Administrators should update to Ninja Forms 3.15.4+ and WPC Product Bundles 8.6.7+ and investigate existing sites for compromise, since patching alone does not remove persistence.","briefOverview":"\u003cp\u003eHackers are exploiting stored cross-site scripting flaws in the Ninja Forms and WPC Product Bundles for WooCommerce WordPress plugins to compromise sites. The affected versions are Ninja Forms 3.15.3 and earlier, tracked as CVE-2026-94504, and WPC Product Bundles for WooCommerce 8.6.6 and earlier, tracked as CVE-2026-93836. Patchstack observed attacks against WPC Product Bundles users on October 4 and against Ninja Forms users the following day, with both campaigns using JavaScript delivered from imgcdn1[.]com.\u003c/p\u003e\n\n\u003cp\u003eThe attackers insert malicious JavaScript into WooCommerce order data or Ninja Forms submissions, where it runs after a logged-in WordPress administrator opens the content. The script uses the administrator’s session to install a fake plugin called “WP Smart Thumbnails” and create administrator accounts. The compromise provides several ways back into a site, including a hidden administrator account, a secret login URL, and an unauthenticated file manager; some persistence remains even if the visible malicious plugin is removed.\u003c/p\u003e\n\n\u003cp\u003eNinja Forms is installed on more than 500,000 sites, while WPC Product Bundles for WooCommerce is active on more than 30,000 sites. Administrators are advised to update to Ninja Forms 3.15.4 or later and WPC Product Bundles for WooCommerce 8.6.7 or later. Updating prevents further exploitation but does not remove existing infections, so administrators are also urged to check their sites for signs of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are exploiting stored cross-site scripting flaws in Ninja Forms versions 3.15.3 and earlier and WPC Product Bundles for WooCommerce versions 8.6.6 and earlier.","The attacks place malicious JavaScript in WooCommerce order data or Ninja Forms submissions, which runs when a logged-in WordPress administrator views the content.","The script installs a malicious plugin posing as “WP Smart Thumbnails” and creates administrator accounts, including one hidden from the WordPress dashboard’s user list.","The infection provides multiple ways to regain access, including a secret login URL and an unauthenticated file manager, and some persistence remains even if the malicious plugin is removed.","Administrators should update to Ninja Forms 3.15.4 or later and WPC Product Bundles for WooCommerce 8.6.7 or later, while checking for compromise because updates do not remove existing infections."],"insights":["Although the flaws require an authenticated session to be exploited, an attacker can trigger the takeover when a legitimate WordPress administrator simply opens a malicious order or form submission.","The same JavaScript payload was served from imgcdn1[.]com in both plugin campaigns, which Patchstack says indicates the same threat actor is likely behind them.","Removing the fake “WP Smart Thumbnails” plugin may not eliminate the compromise because separate auxiliary plugins preserve the hidden account and secret login route.","The hidden administrator account is designed not to appear in the WordPress user list, administrator filter, or displayed user totals, despite retaining full administrator privileges.","The auxiliary attack plugins use backdated timestamps to make detection more difficult."],"referencedReports":[{"title":"Four Ways Back In: The WordPress XSS Campaign That Hides Its Own Admin Account","url":"https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/","publisher":"patchstack","context":"The article cites Patchstack's technical analysis describing the campaign's hidden administrator account and persistence mechanisms.","category":"research","primary":true}],"body":"\u003cp\u003eHackers are exploiting stored cross-site scripting flaws in the Ninja Forms and WPC Product Bundles for WooCommerce WordPress plugins to compromise sites. The affected versions are Ninja Forms 3.15.3 and earlier, tracked as CVE-2026-94504, and WPC Product Bundles for WooCommerce 8.6.6 and earlier, tracked as CVE-2026-93836. Patchstack observed attacks against WPC Product Bundles users on October 4 and against Ninja Forms users the following day, with both campaigns using JavaScript delivered from imgcdn1[.]com.\u003c/p\u003e\n\n\u003cp\u003eThe attackers insert malicious JavaScript into WooCommerce order data or Ninja Forms submissions, where it runs after a logged-in WordPress administrator opens the content. The script uses the administrator’s session to install a fake plugin called “WP Smart Thumbnails” and create administrator accounts. The compromise provides several ways back into a site, including a hidden administrator account, a secret login URL, and an unauthenticated file manager; some persistence remains even if the visible malicious plugin is removed.\u003c/p\u003e\n\n\u003cp\u003eNinja Forms is installed on more than 500,000 sites, while WPC Product Bundles for WooCommerce is active on more than 30,000 sites. Administrators are advised to update to Ninja Forms 3.15.4 or later and WPC Product Bundles for WooCommerce 8.6.7 or later. Updating prevents further exploitation but does not remove existing infections, so administrators are also urged to check their sites for signs of compromise.\u003c/p\u003e\n"},{"n":1,"title":"Hackers exploit 32 zero-days on first day of Pwn2Own Ireland","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-32-zero-days-on-first-day-of-pwn2own-ireland/","time":"19:21","priority":"SHOULD READ","score":82,"tldr":"On day one of Pwn2Own Ireland 2026, researchers demonstrated 32 zero-day vulnerabilities and earned $388,500, including successful compromises of the Samsung Galaxy S26, Philips Hue Bridge Pro, Oracle Autonomous AI Database, printers, LiteLLM, OpenAI Codex, and a Sonos speaker.","briefOverview":"\u003cp\u003eOn the first day of Pwn2Own Ireland 2026, security researchers earned $388,500 after demonstrating 32 zero-day flaws. The contest covers mobile phones, printers, smart-home devices, messaging apps, AI infrastructure, AI coding apps, and wellness healthcare devices. Researchers successfully hacked Samsung’s Galaxy S26 twice, although some bugs used in the challenges were already known to the vendor.\u003c/p\u003e\n\n\u003cp\u003eVinSOC’s Vũ Chí Thành and Huỳnh Đức Tin led the leaderboard after earning \u003cspan class=\"math inline\"\u003e\\(40,000 for a seven-zero-day chain against the Philips Hue Bridge Pro and another \\)\u003c/span\u003e40,000 for a five-zero-day chain targeting Oracle Autonomous AI Database. Other demonstrations affected LiteLLM, Lexmark and Canon multifunction printers, OpenAI Codex, and the Sonos Era 300 speaker; a Google Pixel 10 attempt did not work within the allotted time. ZDI gives affected vendors 90 days to release security updates after a successful contest demonstration before publicly disclosing the flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On the first day of Pwn2Own Ireland 2026, researchers demonstrated 32 zero-day vulnerabilities and earned a combined $388,500.","Interrupt Labs, Ikotas Labs, and Nguyen Thanh Dat of Viettel Cyber Security successfully targeted Samsung's Galaxy S26, although some bugs used in the challenges were already known to Samsung.","Vũ Chí Thành and Huỳnh Đức Tin of VinSOC led the leaderboard after earning $80,000 for exploit chains against the Philips Hue Bridge Pro and Oracle Autonomous AI Database.","Researchers also demonstrated zero-days affecting LiteLLM, Lexmark and Canon multifunction printers, OpenAI Codex, and the Sonos Era 300 smart speaker.","After a successful Pwn2Own demonstration, affected vendors have 90 days to release security updates before Trend Micro's Zero Day Initiative publicly discloses the flaws."],"insights":["The highest-earning team combined multiple previously unknown flaws in single attack paths, using seven against the Philips Hue Bridge Pro and five against Oracle Autonomous AI Database.","A single argument-injection flaw was enough to take down OpenAI's cloud-based Codex coding agent.","Some vulnerabilities used in successful Samsung Galaxy S26 challenges were already known to the vendor, showing that not every demonstrated issue was newly discovered by Samsung during the contest.","The contest’s disclosure process gives vendors a fixed 90-day window to issue updates after a successful demonstration before ZDI publishes the flaws."],"referencedReports":[],"body":"\u003cp\u003eOn the first day of Pwn2Own Ireland 2026, security researchers earned $388,500 after demonstrating 32 zero-day flaws. The contest covers mobile phones, printers, smart-home devices, messaging apps, AI infrastructure, AI coding apps, and wellness healthcare devices. Researchers successfully hacked Samsung’s Galaxy S26 twice, although some bugs used in the challenges were already known to the vendor.\u003c/p\u003e\n\n\u003cp\u003eVinSOC’s Vũ Chí Thành and Huỳnh Đức Tin led the leaderboard after earning \u003cspan class=\"math inline\"\u003e\\(40,000 for a seven-zero-day chain against the Philips Hue Bridge Pro and another \\)\u003c/span\u003e40,000 for a five-zero-day chain targeting Oracle Autonomous AI Database. Other demonstrations affected LiteLLM, Lexmark and Canon multifunction printers, OpenAI Codex, and the Sonos Era 300 speaker; a Google Pixel 10 attempt did not work within the allotted time. ZDI gives affected vendors 90 days to release security updates after a successful contest demonstration before publicly disclosing the flaws.\u003c/p\u003e\n"},{"n":3,"title":"Linux Backdoors Impersonate Email Security Tools to Evade Detection in Korea and Taiwan","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/linux-backdoors-impersonate-email.html","time":"18:24","priority":"SHOULD READ","score":82,"tldr":"Rapid7 uncovered Linux backdoors targeting telecom and edge appliances in South Korea and Taiwan that masquerade as local email-security tools and use covert BPF- and SMTP-based communications. The malware, including BPFDoor, Rekoobe, and the newly identified AVERAT, enables remote shell access, file transfer, proxying, and persistence while evading conventional network detection.","briefOverview":"\u003cp\u003eRapid7 reported Linux backdoors targeting telecom and network appliances in South Korea and Taiwan that disguise themselves as legitimate email-security products and ordinary system processes. The activity includes a new BPFDoor variant and a BPF Rekoobe build aimed at South Korean systems, as well as a previously unreported implant called AVERAT deployed against Taiwanese ShareTech appliances. The samples impersonate products such as SpamSniper and ShareTech, while another BPFDoor artifact uses the process name \u0026ldquo;ora_ppmond,\u0026rdquo; resembling Oracle-related process naming.\u003c/p\u003e\n\n\u003cp\u003eBPFDoor uses Berkeley Packet Filter functionality to inspect incoming network traffic and activates after receiving a magic packet; Rapid7 said operators have also placed this trigger inside standard HTTPS POST requests. Once activated, it can launch TinyShell to provide interactive access and support file uploads and downloads. AVERAT communicates with its command server over TCP port 25 using SMTP and supports functions including file transfer, process enumeration and termination, interactive shells, proxying, rebooting, and loading shared-object modules. Rapid7 recommended reviewing unexpected raw packet sockets and BPF filters, auditing outbound port 25 traffic from non-mail processes, identifying suspicious daemon-like process names, and limiting management access to edge devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rapid7 identified Linux backdoors targeting telecom and network appliances in South Korea and Taiwan that impersonate local email-security products and legitimate-looking processes.","The activity includes a new BPFDoor variant and a BPF Rekoobe build against South Korean targets, plus a previously unreported Linux implant named AVERAT deployed against Taiwanese ShareTech appliances.","BPFDoor uses Berkeley Packet Filter functionality to inspect incoming traffic and activates only after detecting a magic packet, with some operators wrapping triggers in HTTPS POST requests to evade network inspection.","AVERAT uses SMTP for command-and-control, periodically contacts mx.zxopfds[.]com over TCP port 25, and supports file transfers, process control, interactive shells, proxying, rebooting, and loading additional modules.","Rapid7 recommended that organizations review unexpected raw packet sockets and BPF filters, audit outbound TCP port 25 connections from non-mail processes, look for processes masquerading as common daemons, and restrict management access to edge appliances."],"insights":["The implants use regionalized impersonation: South Korea-focused samples mimic SpamSniper components, while malware on Taiwanese appliances is staged from a ShareTech add-on directory and derives an encryption key from the string \"ShareTech.\"","BPFDoor operators adapted after static network signatures were developed by placing their trigger inside standard HTTPS POST requests, relying on SSL offloading in telecom environments to make it harder for conventional inspection to see.","The Rekoobe-based backdoor watches network traffic specifically associated with port 25 and names its processes after SpamSniper components, combining traffic monitoring with product-specific disguise.","AVERAT’s dropper deletes both its staged payload files 10 seconds after execution, while the remaining implant can change its callback settings, command server details, and capabilities at runtime."],"referencedReports":[{"title":"SMTP Is the Key: BPFDoor \u0026 AVERAT Hitting the Network Edge","url":"https://www.rapid7.com/blog/post/tr-smtp-is-the-key-bpfdoor-averat-hitting-the-network-edge/","publisher":"rapid7","context":"The article relies on Rapid7's examination of BPFDoor, Rekoobe, and AVERAT Linux backdoors targeting telecom and network appliances in South Korea and Taiwan.","category":"research","primary":true}],"body":"\u003cp\u003eRapid7 reported Linux backdoors targeting telecom and network appliances in South Korea and Taiwan that disguise themselves as legitimate email-security products and ordinary system processes. The activity includes a new BPFDoor variant and a BPF Rekoobe build aimed at South Korean systems, as well as a previously unreported implant called AVERAT deployed against Taiwanese ShareTech appliances. The samples impersonate products such as SpamSniper and ShareTech, while another BPFDoor artifact uses the process name \u0026ldquo;ora_ppmond,\u0026rdquo; resembling Oracle-related process naming.\u003c/p\u003e\n\n\u003cp\u003eBPFDoor uses Berkeley Packet Filter functionality to inspect incoming network traffic and activates after receiving a magic packet; Rapid7 said operators have also placed this trigger inside standard HTTPS POST requests. Once activated, it can launch TinyShell to provide interactive access and support file uploads and downloads. AVERAT communicates with its command server over TCP port 25 using SMTP and supports functions including file transfer, process enumeration and termination, interactive shells, proxying, rebooting, and loading shared-object modules. Rapid7 recommended reviewing unexpected raw packet sockets and BPF filters, auditing outbound port 25 traffic from non-mail processes, identifying suspicious daemon-like process names, and limiting management access to edge devices.\u003c/p\u003e\n"},{"n":4,"title":"Fake ChatGPT, Gemini, and Claude Ad Portals Capture Credentials and MFA Codes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fake-chatgpt-gemini-and-claude-ad.html","time":"18:38","priority":"SHOULD READ","score":82,"tldr":"Researchers uncovered a phishing platform that impersonates AI advertising tools for ChatGPT, Gemini, Claude, and other brands, using browser-in-the-browser fake login windows to steal credentials and MFA codes. The campaign targets ad-account administrators and agencies, enabling attackers to hijack and monetize valuable advertising accounts.","briefOverview":"\u003cp\u003eResearchers at Island disclosed a human-operated phishing platform that imitates advertising tools for AI brands including ChatGPT, Gemini, Claude, Perplexity, Meta Muse, and Manus. The fake sites claim to offer services such as campaign optimization, spending audits, and advertising-account connections. They are intended to steal login credentials and multi-factor authentication codes from agency staff, media buyers, and advertising-account administrators.\u003c/p\u003e\n\n\u003cp\u003eClicking a \u0026ldquo;Connect\u0026rdquo; button opens a convincing fake sign-in window inside the victim’s real browser, with an address bar that appears to show trusted services such as Google Accounts or Okta. The platform records password attempts, fingerprints the device, exchanges data with an operator through Socket.IO, and lets the operator select the next verification challenge shown to the victim. Stolen advertising accounts can be used to run unauthorized campaigns or sold, while attackers may add their own administrators and reduce the legitimate owner’s access, making recovery take weeks or months.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers identified a human-operated phishing platform that impersonates advertising products for AI chatbot brands including Google Gemini, Anthropic Claude, OpenAI ChatGPT, Perplexity, Meta Muse, and Manus.","The fake sites use a browser-in-the-browser technique that displays counterfeit login windows with trusted-looking address bars to capture account credentials and MFA codes.","The platform fingerprints victims' devices, sends data through Socket.IO endpoints, and enables operators to choose the MFA challenge presented during a login flow.","The AI advertising campaign targets agency staff, media buyers, and manager-account administrators, whose accounts may be used for unauthorized advertising or sold for profit.","Island said the broader platform also includes Google Ads refund and payment scams and fake recruitment sites impersonating Tesla, Louis Vuitton, Nike, and Adecco."],"insights":["The phishing operation can adapt in real time because operators select which MFA prompt a victim sees after receiving the victim’s device information and password attempt.","The scammers rapidly build credibility by tailoring each fake AI brand’s advertising pitch, such as campaign planning, spend audits, or manager-account support, rather than using one generic landing page.","The same underlying platform supports unrelated fraud themes, including Google Ads payment claims and fake recruitment sites, and its earlier source code was exposed through publicly accessible GitHub repositories.","Removing a payment card may be quick after an ad-account takeover, but attackers can add their own administrators and reduce the real owner’s access, leaving account recovery to take weeks or months."],"referencedReports":[{"title":"Behind the Connect Button: The Fake AI Ads Campaign","url":"https://www.island.io/blog/behind-the-connect-button-the-fake-ai-ads-campaign","publisher":"island","context":"Island researchers' report is the primary source for details of the phishing platform impersonating AI advertising products.","category":"research","primary":true},{"title":"Ad Account Theft","url":"https://www.mimecast.com/threat-intelligence-hub/ad-account-theft/","publisher":"mimecast","context":"The article cites Mimecast's July 2026 report on malware-driven advertising-account theft and its commoditization.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers at Island disclosed a human-operated phishing platform that imitates advertising tools for AI brands including ChatGPT, Gemini, Claude, Perplexity, Meta Muse, and Manus. The fake sites claim to offer services such as campaign optimization, spending audits, and advertising-account connections. They are intended to steal login credentials and multi-factor authentication codes from agency staff, media buyers, and advertising-account administrators.\u003c/p\u003e\n\n\u003cp\u003eClicking a \u0026ldquo;Connect\u0026rdquo; button opens a convincing fake sign-in window inside the victim’s real browser, with an address bar that appears to show trusted services such as Google Accounts or Okta. The platform records password attempts, fingerprints the device, exchanges data with an operator through Socket.IO, and lets the operator select the next verification challenge shown to the victim. Stolen advertising accounts can be used to run unauthorized campaigns or sold, while attackers may add their own administrators and reduce the legitimate owner’s access, making recovery take weeks or months.\u003c/p\u003e\n"},{"n":5,"title":"Introducing Socket Scanning for VS Code Marketplace Extensions","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/vscode-extensions?utm_medium=feed","time":"19:07","priority":"MAY READ","score":55,"tldr":"Socket has launched experimental scanning for more than 100,000 VS Code Marketplace extensions to help organizations detect risky or malicious behaviors before installation or automatic updates. The move follows incidents such as the compromised Nx Console update and Socket’s GlassWorm investigation, which showed extensions can steal code, download payloads, and execute processes.","briefOverview":"\u003cp\u003eSocket has launched experimental scanning for VS Code Marketplace extensions, adding coverage for more than 100,000 extensions alongside its existing Open VSX coverage. The service is intended to help teams assess extensions before adopting them, including the tools developers use in environments containing source code, credentials, and company infrastructure. Socket says its analysis examines extension code, dependencies, activation patterns, and capabilities such as file access, network activity, process execution, bundled executables, obfuscation, and hidden functionality.\u003c/p\u003e\n\n\u003cp\u003eThe announcement highlights the risk of malicious extension updates, noting GitHub’s disclosure that a poisoned update to the legitimate Nx Console extension on an employee device led to the exfiltration of internal repositories. Socket also cites its GlassWorm investigation, which connected four VS Code Marketplace extensions and six Open VSX extensions, including two confirmed malicious extensions. One malicious theme used encrypted JavaScript and a Solana dead drop to locate and execute additional payloads, demonstrating that even apparently harmless extensions can conceal harmful behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket launched experimental scanning for VS Code Marketplace extensions, expanding its existing coverage of Open VSX extensions.","Socket states that its VS Code Marketplace coverage scans more than 100,000 extensions and evaluates code, activation patterns, dependencies, and capabilities.","GitHub disclosed that a malicious update to the Nx Console VS Code extension on an employee device led to exfiltration of internal repositories.","Socket’s GlassWorm investigation identified a cluster spanning four VS Code Marketplace extensions and six Open VSX extensions, including two confirmed malicious extensions.","Socket says its analysis can identify file access, network activity, process execution, bundled executables, obfuscated code, hidden functionality, and extension activation behavior."],"insights":["Allowlisting an extension at installation is not sufficient by itself, because automatic updates can replace previously vetted code with malicious code while retaining the same extension name and publisher.","Seemingly low-risk extensions such as color themes can be used to conceal harmful behavior; Socket found one theme that downloaded and ran an additional script while hiding the Windows command window.","Reviewing an extension in isolation can miss campaign-level risk: Socket linked related GlassWorm extensions through code reuse, shared infrastructure, and publishing patterns, including extensions without active malicious payloads in the analyzed versions.","An extension’s activation behavior is a meaningful review factor because it determines when its executable code runs, alongside its access to files, network connections, and external processes."],"referencedReports":[{"title":"Investigating unauthorized access to GitHub's internal repositories","url":"https://github.blog/security/investigating-unauthorized-access-to-githubs-internal-repositories/","publisher":"github","context":"The article cites GitHub's disclosure that a malicious Nx Console extension update on an employee device led to unauthorized access to internal repositories.","category":"news","primary":false}],"body":"\u003cp\u003eSocket has launched experimental scanning for VS Code Marketplace extensions, adding coverage for more than 100,000 extensions alongside its existing Open VSX coverage. The service is intended to help teams assess extensions before adopting them, including the tools developers use in environments containing source code, credentials, and company infrastructure. Socket says its analysis examines extension code, dependencies, activation patterns, and capabilities such as file access, network activity, process execution, bundled executables, obfuscation, and hidden functionality.\u003c/p\u003e\n\n\u003cp\u003eThe announcement highlights the risk of malicious extension updates, noting GitHub’s disclosure that a poisoned update to the legitimate Nx Console extension on an employee device led to the exfiltration of internal repositories. Socket also cites its GlassWorm investigation, which connected four VS Code Marketplace extensions and six Open VSX extensions, including two confirmed malicious extensions. One malicious theme used encrypted JavaScript and a Solana dead drop to locate and execute additional payloads, demonstrating that even apparently harmless extensions can conceal harmful behavior.\u003c/p\u003e\n"}]</script>

#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
