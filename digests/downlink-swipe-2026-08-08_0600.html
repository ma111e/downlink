<script type="application/json" id="dl-articles">[{"n":2,"title":"Metabase Zero-Day Exploited in Wild Allows Admin Access Without Authentication","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/metabase-zero-day-exploited-in-wild.html","time":"06:58","priority":"MUST READ","score":95,"tldr":"Metabase disclosed a maximum-severity zero-day affecting versions 1.58 and later that was exploited to gain unauthenticated admin access via SQL injection. Self-hosted users should patch immediately, block the password reset endpoint as a workaround, and check logs for the listed compromise pattern.","briefOverview":"\u003cp\u003eMetabase warned that a maximum-severity security flaw affecting its business intelligence and data visualization software has been exploited in the wild as a zero-day. The vulnerability has a CVSS score of 10.0 and does not have a CVE identifier. It allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database and gain administrator access to the instance.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, an attacker can change the application configuration, steal stored credentials for connected databases, read any data available through those connections, and export data. Metabase said its Cloud instances have already been updated to the latest version. Users running self-hosted versions are advised to apply the security patches immediately.\u003c/p\u003e\n\n\u003cp\u003eThe affected releases include versions from x.58.0 through vulnerable builds in the x.63 line, with fixed versions released for each supported branch listed in the article. As a temporary workaround, Metabase advised blocking the \u0026ldquo;/api/session/reset_password\u0026rdquo; endpoint until fixes can be applied. Metabase also shared indicators of compromise involving a 400 response to \u0026ldquo;POST /api/session/reset_password\u0026rdquo; followed by a 200 response to \u0026ldquo;GET /api/user/current,\u0026rdquo; and said this pattern likely indicates compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Metabase warned that a maximum-severity security flaw in its business intelligence and data visualization software has been exploited in the wild as a zero-day.","The flaw has a CVSS score of 10.0, does not have a CVE identifier, and allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database to gain administrator access.","Metabase said the issue affects versions 1.58 and above, and it released fixed versions for the x.58 through x.63 release lines while Metabase Cloud instances have already been updated.","Metabase advised self-hosted users to apply patches immediately or temporarily block the “/api/session/reset_password” endpoint until fixes can be applied.","Framework was affected, and it told customers that names, login IPs, addresses, phone numbers, and emails were accessed, while order and payment information was not accessed."],"insights":["A likely compromise can be identified by a specific log pattern: a 400 response to “POST /api/session/reset_password” followed by a 200 response to “GET /api/user/current.”","Metabase recommends more than patching for exposed instances, including deleting all active sessions from the core_session table, reviewing API keys and administrator accounts, rotating connected database credentials, and checking data warehouse and Metabase activity logs.","The vulnerable path involves the password reset endpoint, so Metabase recommends blocking “/api/session/reset_password” as a temporary workaround until affected self-hosted instances can be updated.","The flaw does not yet have a CVE identifier despite being rated CVSS 10.0 and already being exploited in the wild."],"referencedReports":[{"title":"Security Update","url":"https://www.metabase.com/blog/security-update","publisher":"Metabase","context":"The article cites Metabase’s advisory warning that the zero-day vulnerability was exploited in the wild and providing affected versions, mitigations, and indicators of compromise.","category":"advisory","primary":true},{"title":"GHSA-vwf4-m7j8-wcjf","url":"https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf","publisher":"Metabase","context":"The article links to the GitHub security advisory for the maximum-severity Metabase vulnerability that allows unauthenticated SQL injection into the application database.","category":"advisory","primary":true}],"body":"\u003cp\u003eMetabase warned that a maximum-severity security flaw affecting its business intelligence and data visualization software has been exploited in the wild as a zero-day. The vulnerability has a CVSS score of 10.0 and does not have a CVE identifier. It allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database and gain administrator access to the instance.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, an attacker can change the application configuration, steal stored credentials for connected databases, read any data available through those connections, and export data. Metabase said its Cloud instances have already been updated to the latest version. Users running self-hosted versions are advised to apply the security patches immediately.\u003c/p\u003e\n\n\u003cp\u003eThe affected releases include versions from x.58.0 through vulnerable builds in the x.63 line, with fixed versions released for each supported branch listed in the article. As a temporary workaround, Metabase advised blocking the \u0026ldquo;/api/session/reset_password\u0026rdquo; endpoint until fixes can be applied. Metabase also shared indicators of compromise involving a 400 response to \u0026ldquo;POST /api/session/reset_password\u0026rdquo; followed by a 200 response to \u0026ldquo;GET /api/user/current,\u0026rdquo; and said this pattern likely indicates compromise.\u003c/p\u003e\n"},{"n":3,"title":"N-able Issues N-central Hotfix 2 as Attackers Reach Managed Systems and Persist","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/n-central-attackers-reach-managed.html","time":"06:57","priority":"MUST READ","score":95,"tldr":"N-able released a required second hotfix for actively exploited N-central flaws that let attackers bypass authentication, take over accounts, access managed customer systems, and establish persistence using Cloudflare Tunnel. On-premises customers should update to version 2026.3.1.10 immediately and review systems for the published indicators of compromise.","briefOverview":"\u003cp\u003eN-able has released Hotfix 2 for N-central as part of its investigation into ongoing exploitation of a recently disclosed flaw in the Remote Monitoring and Management product. The company said the new hotfix is required even for customers who already applied the earlier hotfix, because it supersedes Hotfix 1 with additional hardening measures. N-able said it is expanding protections in response to threat actors changing their attack techniques.\u003c/p\u003e\n\n\u003cp\u003eThe activity began with unusual behavior detected in a customer environment on July 31, 2026, which led to the discovery of attackers exploiting CVE-2026-18577 in N-central Server. The flaw affects all versions before 2026.3.1.7 and is related to an incomplete fix for CVE-2026-18556; both flaws allow authentication bypass and account takeover and have been flagged by CISA as actively exploited. In observed attacks, the attackers gained remote administrative access, used the Take Control feature to connect to managed systems, and registered a Cloudflare Tunnel service to maintain access even after N-central server access was revoked.\u003c/p\u003e\n\n\u003cp\u003eN-able said a limited number of customers have been affected by the exploitation activity. Customers running on-premise versions are advised to update their instances to 2026.3.1.10 immediately. The company also published expanded IP address indicators of compromise and released a custom service template to help check known indicators against Windows endpoints in N-central, while warning that a clean result is not a guarantee that an environment was not impacted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able released Hotfix 2 for N-central and said it is required even for customers who already applied the earlier hotfix.","N-able detected unusual activity in a customer environment on July 31, 2026, which led to the discovery of attackers exploiting CVE-2026-18577 in N-central Server.","CVE-2026-18577 affects all N-central versions prior to 2026.3.1.7 and is related to an incomplete fix for CVE-2026-18556.","In observed attacks, the flaw let attackers gain remote administrative access, use the Take Control feature to connect to managed systems, and register a Cloudflare Tunnel service for persistence.","N-able advised on-premise customers to update their N-central instances to 2026.3.1.10 immediately and provided IP address indicators of compromise plus a custom service template for checking Windows endpoints."],"insights":["Applying the earlier hotfix is not enough because N-able says Hotfix 2 supersedes Hotfix 1 and adds additional hardening against evolving attacker techniques.","Incident response should extend beyond the N-central server because attackers used N-central access to reach managed systems and create persistence there with a Cloudflare Tunnel service.","A clean result from N-able’s custom service template should not be treated as proof that an environment is unaffected, since N-able says the investigation is ongoing and more indicators may be identified.","CVE-2026-18577 stems from an incomplete fix for CVE-2026-18556, showing that organizations may need to revisit systems they considered already remediated."],"referencedReports":[{"title":"N-central Security Update – August 6, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-6-2026","publisher":"N-able","context":"The article cites N-able's security update as the source for the fresh round of N-central hotfixes and its investigation into ongoing exploitation.","category":"advisory","primary":true},{"title":"N-central 2026.3 Hotfix 2: Additional Mitigation for CVE-2026-18577","url":"https://status.n-able.com/2026/08/06/n-central-2026-3-hotfix-2-additional-mitigation-for-cve-2026-18577/","publisher":"N-able","context":"The article links to N-able's Hotfix 2 notice, which says the new hotfix is required and supersedes Hotfix 1 with additional hardening measures.","category":"advisory","primary":true}],"body":"\u003cp\u003eN-able has released Hotfix 2 for N-central as part of its investigation into ongoing exploitation of a recently disclosed flaw in the Remote Monitoring and Management product. The company said the new hotfix is required even for customers who already applied the earlier hotfix, because it supersedes Hotfix 1 with additional hardening measures. N-able said it is expanding protections in response to threat actors changing their attack techniques.\u003c/p\u003e\n\n\u003cp\u003eThe activity began with unusual behavior detected in a customer environment on July 31, 2026, which led to the discovery of attackers exploiting CVE-2026-18577 in N-central Server. The flaw affects all versions before 2026.3.1.7 and is related to an incomplete fix for CVE-2026-18556; both flaws allow authentication bypass and account takeover and have been flagged by CISA as actively exploited. In observed attacks, the attackers gained remote administrative access, used the Take Control feature to connect to managed systems, and registered a Cloudflare Tunnel service to maintain access even after N-central server access was revoked.\u003c/p\u003e\n\n\u003cp\u003eN-able said a limited number of customers have been affected by the exploitation activity. Customers running on-premise versions are advised to update their instances to 2026.3.1.10 immediately. The company also published expanded IP address indicators of compromise and released a custom service template to help check known indicators against Windows endpoints in N-central, while warning that a clean result is not a guarantee that an environment was not impacted.\u003c/p\u003e\n"},{"n":1,"title":"Progress Kemp LoadMaster Flaw Hits CISA KEV After 792 Reported Exploit Attempts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/progress-kemp-loadmaster-flaw-hits-cisa.html","time":"06:52","priority":"MUST READ","score":94,"tldr":"CISA added the critical Progress Kemp LoadMaster command injection flaw CVE-2026-8037 to its Known Exploited Vulnerabilities catalog after hundreds of exploitation attempts were observed. Federal agencies have been directed to patch affected appliances by August 10, 2026.","briefOverview":"\u003cp\u003eCISA added a critical-severity security flaw affecting Progress Kemp LoadMaster to its Known Exploited Vulnerabilities catalog after reports of active exploitation in the wild. The flaw is tracked as CVE-2026-8037 and has a CVSS score of 9.6. CISA said the issue allows an unauthenticated attacker to execute arbitrary commands on a LoadMaster appliance by exploiting unsanitized input in multiple command endpoints.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr Labs described the issue as present in a function named \u003ccode\u003eescape_quotes()\u003c/code\u003e within the load balancer application. Its analysis said the flaw stemmed from improper handling of user-supplied input, enabling command injection. Successful exploitation can allow an attacker to run arbitrary commands on an affected appliance without valid credentials.\u003c/p\u003e\n\n\u003cp\u003eeSentire previously reported active exploitation efforts targeting the flaw, though it said those efforts were largely unsuccessful. KEVIntel telemetry recorded 792 exploitation attempts over 41 days from 65 unique IP addresses in 18 countries, with the last activity recorded on August 4, 2026. Federal Civilian Executive Branch agencies are recommended to apply the necessary patches by August 10, 2026, in accordance with Binding Operational Directive 26-04.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-8037, a critical Progress Kemp LoadMaster flaw with a CVSS score of 9.6, to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","CVE-2026-8037 is a command injection vulnerability that can allow an unauthenticated attacker to execute arbitrary commands on affected LoadMaster appliances.","watchTowr Labs reported that the issue is present in a function named escape_quotes() and stems from improper handling of user-supplied input.","eSentire reported active exploitation efforts targeting the flaw, though it said those efforts were largely unsuccessful.","KEVIntel telemetry recorded 792 exploitation attempts over 41 days from 65 unique IP addresses across 18 countries, with the latest activity on August 4, 2026."],"insights":["The flaw does not require valid credentials to exploit, which makes exposed LoadMaster appliances especially urgent to patch or otherwise protect.","Although eSentire said the observed exploitation efforts were largely unsuccessful, CISA still added the flaw to the KEV catalog, indicating that unsuccessful attempts were enough to trigger federal remediation requirements.","The exploitation activity appears geographically distributed, with attempts coming from 65 unique IP addresses across 18 countries rather than from only a small number of sources.","Federal Civilian Executive Branch agencies were given only until August 10, 2026 to apply patches, showing that CISA treated the issue as requiring rapid remediation after the KEV listing."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA's alert announcing that CVE-2026-8037 was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article quotes CISA's KEV catalog entry describing CVE-2026-8037 as an unauthenticated command injection issue in Progress LoadMaster.","category":"advisory","primary":true},{"title":"CVE-2026-8037","url":"https://kevintel.com/CVE-2026-8037","publisher":"KEVIntel","context":"The article cites KEVIntel telemetry data reporting 792 exploitation attempts over 41 days from 65 unique IP addresses in 18 countries.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added a critical-severity security flaw affecting Progress Kemp LoadMaster to its Known Exploited Vulnerabilities catalog after reports of active exploitation in the wild. The flaw is tracked as CVE-2026-8037 and has a CVSS score of 9.6. CISA said the issue allows an unauthenticated attacker to execute arbitrary commands on a LoadMaster appliance by exploiting unsanitized input in multiple command endpoints.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr Labs described the issue as present in a function named \u003ccode\u003eescape_quotes()\u003c/code\u003e within the load balancer application. Its analysis said the flaw stemmed from improper handling of user-supplied input, enabling command injection. Successful exploitation can allow an attacker to run arbitrary commands on an affected appliance without valid credentials.\u003c/p\u003e\n\n\u003cp\u003eeSentire previously reported active exploitation efforts targeting the flaw, though it said those efforts were largely unsuccessful. KEVIntel telemetry recorded 792 exploitation attempts over 41 days from 65 unique IP addresses in 18 countries, with the last activity recorded on August 4, 2026. Federal Civilian Executive Branch agencies are recommended to apply the necessary patches by August 10, 2026, in accordance with Binding Operational Directive 26-04.\u003c/p\u003e\n"},{"n":5,"title":"New CSS Attacks Can Break Webmail Defenses to Steal Passwords and Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/new-css-attacks-can-break-webmail.html","time":"08:03","priority":"SHOULD READ","score":84,"tldr":"PortSwigger research shows that allowed HTML/CSS in major webmail services can escape email boundaries to spoof login screens, leak tokens, hijack UI actions, and manipulate AI email tools. The key defense is stricter isolation of email content, especially sandboxed iframes and tighter CSS and resource-request controls.","briefOverview":"\u003cp\u003ePortSwigger researcher Gareth Heyes presented research at Black Hat USA 2026 showing that content inside an email can escape its message boundary and interfere with the surrounding webmail interface. The attack chains span Outlook, Gmail, Fastmail, Proton Mail, Yahoo Mail, and AOL Mail. The techniques can capture passwords, take over third-party accounts, leak tokens, hijack trusted UI actions, and manipulate AI tools that read email. The paper presents proof-of-concept research and does not report malicious exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe research follows two paths: abusing HTML and CSS already allowed by webmail services, or creating a discrepancy between what a sanitizer approves and what the browser or application ultimately creates. Demonstrations included an Outlook and Firefox chain that spoofed a Microsoft sign-in screen, a Yahoo and AOL paste race that could expose a Medium email-login token, and a Gmail and Claude Cowork chain that could leak a Slack token after prompt injection and user interaction. The researcher said Fastmail fixed two CSS mutation bugs and a Proton Mail proxy bypass stopped working on retest, while Outlook label-jacking and Gmail\u0026rsquo;s image-set() bypass still worked when the research was published. The paper recommends isolating HTML email in sandboxed iframes and tightly restricting CSS, custom attributes, select menus, and image requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PortSwigger researcher Gareth Heyes presented research at Black Hat USA 2026 showing that content inside an email can escape its message boundary and interfere with webmail interfaces.","The demonstrated attack chains affected Outlook, Gmail, Fastmail, Proton Mail, Yahoo Mail, and AOL Mail and could capture passwords, leak tokens, hijack trusted UI actions, and manipulate AI tools that read email.","One Outlook and Firefox chain spoofed a Microsoft sign-in screen and captured the password a recipient typed, while a Yahoo and AOL paste race could expose a Medium email-login token.","A Gmail and Claude Cowork chain used prompt injection and user interaction to place a Slack token in an HTML draft, where viewing the draft leaked it.","The research recommends that webmail providers isolate HTML email in sandboxed iframes and tightly restrict CSS, custom attributes, select menus, and image requests."],"insights":["The research shows that dangerous behavior can arise not only from HTML and CSS that webmail services already allow, but also from mismatches between what a sanitizer approves and what the browser or application later creates.","Some attack paths worked around common defenses in unexpected ways, including a Gmail image-set() fallback that still made an external request despite sanitization and a click-based exfiltration method for cases where CSP blocks external resources.","The Outlook chain depended on several separate behaviors combining, including labels triggering controls outside the message, application JavaScript creating new DOM nodes from sanitized custom attributes, and a Firefox select-menu timing behavior enabling real-time capture.","AI-connected email expanded the impact of email content because hidden or injected instructions could influence tools such as Claude Cowork and OpenAI Atlas after they processed or interpreted messages.","Fix status varied across providers and techniques, with Fastmail fixing two CSS mutation bugs and a Proton Mail proxy bypass no longer working on retest, while Outlook label-jacking and Gmail's image-set() bypass still worked when the research was published."],"referencedReports":[{"title":"CSS, the Bomb Inside Your Inbox","url":"https://portswigger.net/research/css-the-bomb-inside-your-inbox","publisher":"PortSwigger","context":"The article is based on PortSwigger research presented by Gareth Heyes at Black Hat USA 2026 about CSS techniques that can break webmail message boundaries.","category":"research","primary":true}],"body":"\u003cp\u003ePortSwigger researcher Gareth Heyes presented research at Black Hat USA 2026 showing that content inside an email can escape its message boundary and interfere with the surrounding webmail interface. The attack chains span Outlook, Gmail, Fastmail, Proton Mail, Yahoo Mail, and AOL Mail. The techniques can capture passwords, take over third-party accounts, leak tokens, hijack trusted UI actions, and manipulate AI tools that read email. The paper presents proof-of-concept research and does not report malicious exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe research follows two paths: abusing HTML and CSS already allowed by webmail services, or creating a discrepancy between what a sanitizer approves and what the browser or application ultimately creates. Demonstrations included an Outlook and Firefox chain that spoofed a Microsoft sign-in screen, a Yahoo and AOL paste race that could expose a Medium email-login token, and a Gmail and Claude Cowork chain that could leak a Slack token after prompt injection and user interaction. The researcher said Fastmail fixed two CSS mutation bugs and a Proton Mail proxy bypass stopped working on retest, while Outlook label-jacking and Gmail\u0026rsquo;s image-set() bypass still worked when the research was published. The paper recommends isolating HTML email in sandboxed iframes and tightly restricting CSS, custom attributes, select menus, and image requests.\u003c/p\u003e\n"},{"n":4,"title":"Atlassian Rovo Can Be Tricked Into Sending Jira and Confluence Data to Attackers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/atlassian-rovo-can-be-tricked-into.html","time":"08:54","priority":"SHOULD READ","score":82,"tldr":"Researchers found Atlassian Rovo could be manipulated into exfiltrating Jira and Confluence data accessible to a signed-in user through prompt-injection techniques. Atlassian has fixed the one-click Rovo URL flaw, but the separate content-borne exfiltration path was reported as still unresolved as of August 5, 2026.","briefOverview":"\u003cp\u003eAtlassian’s Rovo assistant was found to be susceptible to attacker-controlled instructions that could make it collect Jira or Confluence data accessible to a signed-in user and send that data to an outside server. PromptArmor and Varonis Threat Labs found this behavior independently through different routes. The article says only one of those routes is confirmed closed.\u003c/p\u003e\n\n\u003cp\u003ePromptArmor hid instructions in content that Rovo reads, such as an uploaded file, and said Rovo could gather internal Jira and Confluence data and exfiltrate it through a URL request without a separate approval step. The firm said the chain still worked when Rovo’s web-search option was disabled, because the outbound request used a separate URL-retrieval capability. PromptArmor said it disclosed the issue to Atlassian on May 23, 2026, and published on August 5 after what it described as no further communication.\u003c/p\u003e\n\n\u003cp\u003eVaronis Threat Labs found a separate one-click flaw in the rovoChatPrompt URL parameter, which could preload attacker instructions into Rovo Chat for an authenticated user. Bugcrowd’s disclosure record says Atlassian fixed that issue server-side on July 8, 2026, and the reporter validated the fix. The article says Rovo’s access follows the signed-in user’s permissions across Atlassian products and connected third-party apps, so the risk involves data that user can already reach rather than a demonstrated tenant-wide authorization bypass.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PromptArmor reported that attacker-controlled instructions hidden in content read by Atlassian Rovo could make the assistant gather Jira and Confluence data accessible to the signed-in user and send it to an outside server.","PromptArmor said its content-borne exfiltration chain still worked with Rovo’s web-search option switched off, and the article says any later remediation for that path is not confirmed.","Varonis Threat Labs found that the rovoChatPrompt URL parameter could preload attacker instructions into Rovo Chat, allowing one click from an authenticated user to run those instructions with that user’s privileges and send results to an attacker-controlled server.","Bugcrowd’s record says Atlassian fixed the rovoChatPrompt link flaw server-side on July 8, 2026, and the reporter validated the fix.","The article says Rovo’s data access follows permissions in Atlassian products and connected third-party apps, so the demonstrated risk is data the signed-in victim can access rather than a tenant-wide authorization bypass."],"insights":["Disabling Rovo’s web-search option should not be treated as a complete security boundary, because PromptArmor reported that its exfiltration chain used a separate URL-retrieval capability even when web search was off.","There is no customer patch for either issue described: the one-click link flaw was fixed server-side by Atlassian, while the remaining lever for the content-borne path is controlling which apps and groups can use Rovo.","The practical impact depends heavily on ordinary user permissions and connector scope, because Rovo can reach data through Atlassian products and connected third-party apps that the signed-in user is already allowed to access.","The two disclosures do not prove the same problem was fixed, because the confirmed July 8 server-side fix applies to the rovoChatPrompt link flaw, while PromptArmor’s later report described a separate content-borne route as still working when published."],"referencedReports":[{"title":"Atlassian Rovo Exfiltrates Data","url":"https://www.promptarmor.com/resources/atlassian-rovo-exfiltrates-data","publisher":"PromptArmor","context":"The article cites PromptArmor’s published research describing a content-borne indirect prompt-injection chain that made Rovo collect Jira and Confluence data and send it to an outside server.","category":"research","primary":true},{"title":"One-Click Data Exfiltration via rovoChatPrompt URL Parameter Confluence Rovo","url":"https://bugcrowd.com/disclosures/bf1922fb-99d0-4d3b-b419-1728720d29ec/one-click-data-exfiltration-via-rovochatprompt-url-parameter-confluence-rovo","publisher":"Bugcrowd","context":"The article cites the Bugcrowd disclosure record showing Atlassian fixed the rovoChatPrompt link flaw server-side on July 8, 2026 and that the reporter validated the fix.","category":"advisory","primary":true},{"title":"RovoBlast","url":"https://www.varonis.com/blog/rovoblast","publisher":"Varonis Threat Labs","context":"The article cites Varonis Threat Labs’ fuller technical account of the RovoBlast one-click link flaw involving the rovoChatPrompt URL parameter.","category":"research","primary":true}],"body":"\u003cp\u003eAtlassian’s Rovo assistant was found to be susceptible to attacker-controlled instructions that could make it collect Jira or Confluence data accessible to a signed-in user and send that data to an outside server. PromptArmor and Varonis Threat Labs found this behavior independently through different routes. The article says only one of those routes is confirmed closed.\u003c/p\u003e\n\n\u003cp\u003ePromptArmor hid instructions in content that Rovo reads, such as an uploaded file, and said Rovo could gather internal Jira and Confluence data and exfiltrate it through a URL request without a separate approval step. The firm said the chain still worked when Rovo’s web-search option was disabled, because the outbound request used a separate URL-retrieval capability. PromptArmor said it disclosed the issue to Atlassian on May 23, 2026, and published on August 5 after what it described as no further communication.\u003c/p\u003e\n\n\u003cp\u003eVaronis Threat Labs found a separate one-click flaw in the rovoChatPrompt URL parameter, which could preload attacker instructions into Rovo Chat for an authenticated user. Bugcrowd’s disclosure record says Atlassian fixed that issue server-side on July 8, 2026, and the reporter validated the fix. The article says Rovo’s access follows the signed-in user’s permissions across Atlassian products and connected third-party apps, so the risk involves data that user can already reach rather than a demonstrated tenant-wide authorization bypass.\u003c/p\u003e\n"}]</script>
