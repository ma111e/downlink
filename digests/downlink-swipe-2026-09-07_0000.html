"primary":false}],"body":"\u003cp\u003eThis weekly recap covers multiple major security developments, including critical N-able N-central flaws, an actively exploited Google Chrome zero-day, MikroTik RouterOS attacks, and an unpatched Magento and Adobe Commerce zero-day. N-able released hotfixes for authentication bypass and pre-authenticated remote code execution issues, while Huntress reported signs that attackers may be leveraging some of the N-central flaws. Google also patched CVE-2026-85046, a V8 type confusion bug in Chrome that the company said has an exploit in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights attacks affecting routers, online stores, developer infrastructure, and user accounts. CERT Polska warned that attackers are exploiting the MikroTrick chain in MikroTik RouterOS to potentially take full control of devices without authentication when SSH remote access is supported. Sansec reported that Magento and Adobe Commerce storefronts are being compromised through StyleSmuggler to inject malicious code and deploy backdoors, while Coder said attackers abused its Cloudflare infrastructure to deliver malicious Terraform modules that stole credentials and secrets.\u003c/p\u003e\n\n\u003cp\u003eThe recap also emphasizes that defensive assumptions can fail even when users or organizations take common precautions. Attackers used QR codes built from text and markup so they still appear when email images are blocked, and SNMPv3 was described as leaking pre-authentication signals that can help outsiders identify vendors, valid usernames, and likely encryption settings. The article concludes that trusted sources, safer settings, and being fully patched are not enough by themselves, and that logs are needed to investigate whether attackers already gained access.\u003c/p\u003e\n"},{"n":23,"title":"7th September – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/7th-september-threat-intelligence-report/","time":"14:54","priority":"MAY READ","score":40,"tldr":"This week’s threat intelligence highlights major breaches at Thomson Reuters, Baylor Genetics and Dropbox, alongside AI-assisted intrusions that are accelerating ransomware and exploit development. Critical exploited flaws in SonicWall SMA 1000 and JFrog Artifactory require urgent attention, while new campaigns from Chinese, Iranian and North Korean-linked actors continue to target government, crypto, fintech and job-seeker ecosystems.","briefOverview":"\u003cp\u003eCheck Point Research’s 7th September Threat Intelligence Report summarizes major attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings from the week. It includes breaches affecting Thomson Reuters’ C-Track court case-management platform, Baylor Genetics, and Dropbox, as well as a cyberattack that disrupted Hit’s casinos and related services in Slovenia. The reported impacts include exposed court records and personal information, stolen medical and insurance data, unauthorized Dropbox file access, and temporary closures or service outages for casino and hotel operations.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several AI-related security issues, including an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours. Researchers also disclosed GitSpawn, a vulnerability class affecting AI coding agents where malicious repository Git configurations can trigger arbitrary code execution as the developer. Another cited case showed an AI coding assistant helping port a known PLC exploit to a different controller model, producing working payloads after guided analysis.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers critical vulnerabilities and active threat campaigns. SonicWall addressed CVE-2026-83548 and CVE-2026-83549 in SMA 1000 remote access gateways, while JFrog addressed CVE-2026-82329 in self-hosted Artifactory deployments after exploitation was observed against internet-exposed systems. Threat intelligence items include Check Point Research’s findings on Gambling Goblin compromising Brazilian government and education websites, analysis of the JSCeal information stealer, Mirage Kitten’s fake LinkedIn coding tests delivering NodeRabbit and PollCat, and North Korea-linked Contagious Interview activity using trojanized macOS installers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thomson Reuters disclosed a breach of its C-Track court case-management platform affecting courts across 11 U.S. states and Canada, with unauthorized access to files containing court records, names, and other personal information.","Baylor Genetics disclosed a data breach affecting 2.8 million patients and employees after unauthorized access to part of its IT environment, with stolen data including names, birth dates, medical testing and laboratory results, health insurance information, and some Social Security numbers.","Researchers detailed an AI-assisted ransomware intrusion in which autonomous agents compromised an enterprise network in under 10 hours by mapping internal systems, mining code repositories, obtaining root credentials from a secrets manager, and abusing build pipelines and cloud resources.","SonicWall addressed two critical vulnerabilities, CVE-2026-83548 and CVE-2026-83549, affecting SMA 1000 remote access gateways, both of which were exploited as zero-days.","Check Point Research reported on a Chinese-speaking cybercrime cluster called Gambling Goblin that compromises Brazilian government and education websites to redirect visitors to gambling and phishing pages while manipulating search rankings."],"insights":["The reported AI-assisted ransomware intrusion shows that autonomous agents can compress multiple stages of an enterprise compromise into under 10 hours, including finding credentials, using code repositories, and abusing build pipelines and cloud resources.","GitSpawn is especially notable because malicious repository settings can trigger code execution when AI coding agents gather project context, in some cases before a developer is shown a trust prompt.","The Dropbox incident shows that account exposure can occur through a third party’s identity verification weakness even when attackers do not have the victim’s Dropbox password.","The JFrog Artifactory flaw was reportedly exploited shortly after disclosure against internet-facing self-hosted systems, making rapid patching especially important for organizations running their own deployments.","The FalconFlank proof of concept is unusual because it abuses CrowdStrike Falcon’s own Microsoft Office macro-removal remediation behavior to gain higher privileges on affected Windows systems."],"referencedReports":[{"title":"AI-Assisted Cyber Attack: Inside a Unit 42 Investigation","url":"https://unit42.paloaltonetworks.com/ai-assisted-cyber-attack-inside-a-unit-42-investigation/","publisher":"Unit 42","context":"The article cites this research as detailing an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours.","category":"","primary":false},{"title":"AI Coding Agents Git Hijack","url":"https://www.manifold.security/blog/ai-coding-agents-git-hijack","publisher":"Manifold Security","context":"The article cites this research as disclosing GitSpawn, a vulnerability class affecting multiple AI coding agents.","category":"","primary":false},{"title":"Can AI Create PLC Attacks? Yes, But It’s Not That Easy Yet","url":"https://www.forescout.com/blog/can-ai-create-plc-attacks-yes-but-it%E2%80%99s-not-that-easy-yet/","publisher":"Forescout","context":"The article cites this research as showing how an AI coding assistant can help port a known PLC exploit to a different controller model.","category":"","primary":false},{"title":"Mirage Kitten: New Backdoors NodeRabbit and PollCat","url":"https://securelist.com/mirage-kitten-new-backdoors-noderabbit-pollcat/121244/","publisher":"Securelist","context":"The article cites this analysis as mapping an Iran-linked Mirage Kitten campaign using fake LinkedIn coding tests to deliver NodeRabbit and PollCat malware.","category":"","primary":false},{"title":"Contagious Interview: Trojanized macOS Installers","url":"https://www.jamf.com/blog/contagious-interview-trojanized-macos-installers/","publisher":"Jamf","context":"The article cites this analysis as covering new macOS delivery activity linked to North Korea’s Contagious Interview campaign.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Research’s 7th September Threat Intelligence Report summarizes major attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings from the week. It includes breaches affecting Thomson Reuters’ C-Track court case-management platform, Baylor Genetics, and Dropbox, as well as a cyberattack that disrupted Hit’s casinos and related services in Slovenia. The reported impacts include exposed court records and personal information, stolen medical and insurance data, unauthorized Dropbox file access, and temporary closures or service outages for casino and hotel operations.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several AI-related security issues, including an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours. Researchers also disclosed GitSpawn, a vulnerability class affecting AI coding agents where malicious repository Git configurations can trigger arbitrary code execution as the developer. Another cited case showed an AI coding assistant helping port a known PLC exploit to a different controller model, producing working payloads after guided analysis.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers critical vulnerabilities and active threat campaigns. SonicWall addressed CVE-2026-83548 and CVE-2026-83549 in SMA 1000 remote access gateways, while JFrog addressed CVE-2026-82329 in self-hosted Artifactory deployments after exploitation was observed against internet-exposed systems. Threat intelligence items include Check Point Research’s findings on Gambling Goblin compromising Brazilian government and education websites, analysis of the JSCeal information stealer, Mirage Kitten’s fake LinkedIn coding tests delivering NodeRabbit and PollCat, and North Korea-linked Contagious Interview activity using trojanized macOS installers.\u003c/p\u003e\n"}]</script>
