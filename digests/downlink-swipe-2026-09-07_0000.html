ability in the third-party analytics platform Metabase, and BleepingComputer reported that ShipMonk received extortion emails from the ShinyHunters extortion gang."],"insights":["The breach impact expanded by nearly five times because ShipMonk retained older customer data from 2019 to 2021 despite Trezor saying it had repeatedly received written assurances that the data was deleted.","The exposed information creates risks beyond online scams because Trezor specifically warned that leaked shipping details could potentially expose affected customers to physical security risks.","The incident shows a supply-chain data exposure for Trezor customers rather than a compromise of Trezor’s own systems or hardware wallets, since Trezor said its operations, services, systems, and devices were not affected.","The same Metabase-related campaign has affected multiple companies, including Tally, Framework, and ShipMonk, according to the article."],"referencedReports":[],"body":"\u003cp\u003eTrezor says an August data breach at its shipping and logistics provider, ShipMonk, now affects a total of 81,000 customers. The company had initially disclosed on August 13 that nearly 14,000 customers were affected, including customers whose full names, shipping addresses, email addresses, and phone numbers were accessed. Trezor later confirmed that another 67,000 U.S. customers who ordered between November 2019 and August 2021 had their full details exposed, including name, email, phone number, shipping address, and order number. Trezor said the breach did not affect its operations or services, its systems were not compromised, and all Trezor devices are secure.\u003c/p\u003e\n\n\u003cp\u003eTrezor said the expanded impact occurred because ShipMonk failed to delete exposed data from its systems as required by Trezor’s contract and data policy, despite written assurances that the data had been deleted. The company warned affected customers of an increased risk of phishing, scam emails, fraudulent calls or letters, and potential physical security risks. Breach notification emails seen by BleepingComputer said attackers exploited a vulnerability in the third-party analytics platform Metabase. BleepingComputer also reported that ShipMonk received extortion emails from the ShinyHunters extortion gang, and that other companies in the Metabase campaign include Tally and Framework.\u003c/p\u003e\n"},{"n":20,"title":"Shai-Hulud Rises From the Dead after 111 days","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/shai-hulud-npm-resurfaces","time":"11:55","priority":"SHOULD READ","score":86,"tldr":"A known Shai-Hulud npm worm payload with a public SHA-256 hash reappeared in four packages after 111 days of dormancy, despite npm’s publish-time malware scanning. The incident highlights a serious gap in registry-level detection because an unchanged, already-identified malicious file should have been the easiest case to block.","briefOverview":"\u003cp\u003eThe article reports that a Shai-Hulud payload from the May 19, 2026 @AntV npm supply chain attack reappeared after 111 days of silence. The original incident involved a compromised maintainer account pushing 639 malicious versions of @antv packages to npm in a single hour. The same payload, identified by SHA256 hash e37e3ddeeaaa9e0c4fdbcb829b4895a6521031c80053fc436625b61e6ee5b1a6, was found again on September 7 in four package versions published within the same hour by the same npm account.\u003c/p\u003e\n\n\u003cp\u003eThe four packages were feishu-docx-mcp@0.3.2, bmc-i18n-extract-cli@1.1.1, blueai-cli@0.7.0, and bmc-translate-utils@1.1.1. According to the article, records showed 319 package versions carrying this exact hash on May 19, with no new detections between May 20 and September 6. The author emphasizes that the payload was not novel, repacked, or lightly modified, making it an exact hash match to a known malicious file.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that this is significant because npm introduced publish-time malware scanning in July, holding packages for 5 to 15 minutes before they become installable. It states that an exact hash match should be the easiest case for such scanning to catch, unlike harder cases involving multi-stage loaders, dependency confusion, or runtime-triggered payloads. The listed indicators include the C2 domain t[.]m-kosche[.]com, a root-level index.js payload, a preinstall script running bun run index.js, persistence through .vscode/tasks.json and .claude/settings.json, and behavior involving npm token validation, tarball download, payload injection, version bumping, republishing, and mass GitHub repository creation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Shai-Hulud payload with SHA256 hash e37e3ddeeaaa9e0c4fdbcb829b4895a6521031c80053fc436625b61e6ee5b1a6 reappeared in four npm package versions on September 7 after 111 days of no new detections.","The same payload had previously appeared in 319 package versions first seen on May 19, 2026 during the @AntV wave, when a compromised maintainer account pushed 639 malicious versions of @antv packages to npm in a single hour.","The four packages carrying the payload on September 7 were feishu-docx-mcp@0.3.2, bmc-i18n-extract-cli@1.1.1, blueai-cli@0.7.0, and bmc-translate-utils@1.1.1, all published within the same hour by the same npm account.","The article states that npm introduced publish-time malware scanning in July to hold packages for 5 to 15 minutes before they become installable, but this known, unchanged payload still appeared on the registry.","The listed indicators include C2 domain t[.]m-kosche[.]com, a root-level index.js payload, a preinstall script executing bun run index.js, persistence via .vscode/tasks.json and .claude/settings.json, and behavior involving npm token validation, tarball download, payload injection, version bumping, republishing, and mass GitHub repository creation."],"insights":["The reappeared payload was not modified or repacked, so the failure described in the article was not about detecting a new variant but about missing an exact match to a previously public malicious file hash.","The article frames this as an unusually long reactivation gap, stating that 111 days is the longest dormancy-to-reactivation period the authors have seen for a Shai-Hulud payload.","The incident is presented as a test of the lowest bar for publish-time scanning, because the payload required only signature matching rather than behavioral analysis, sandboxing, or interpretation of obfuscated code.","The four-package September reactivation was small in scale compared with the original @AntV wave, but the article argues its importance comes from proving that a known malicious artifact could still become available on npm after the rollout of publish-time scanning."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that a Shai-Hulud payload from the May 19, 2026 @AntV npm supply chain attack reappeared after 111 days of silence. The original incident involved a compromised maintainer account pushing 639 malicious versions of @antv packages to npm in a single hour. The same payload, identified by SHA256 hash e37e3ddeeaaa9e0c4fdbcb829b4895a6521031c80053fc436625b61e6ee5b1a6, was found again on September 7 in four package versions published within the same hour by the same npm account.\u003c/p\u003e\n\n\u003cp\u003eThe four packages were feishu-docx-mcp@0.3.2, bmc-i18n-extract-cli@1.1.1, blueai-cli@0.7.0, and bmc-translate-utils@1.1.1. According to the article, records showed 319 package versions carrying this exact hash on May 19, with no new detections between May 20 and September 6. The author emphasizes that the payload was not novel, repacked, or lightly modified, making it an exact hash match to a known malicious file.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that this is significant because npm introduced publish-time malware scanning in July, holding packages for 5 to 15 minutes before they become installable. It states that an exact hash match should be the easiest case for such scanning to catch, unlike harder cases involving multi-stage loaders, dependency confusion, or runtime-triggered payloads. The listed indicators include the C2 domain t[.]m-kosche[.]com, a root-level index.js payload, a preinstall script running bun run index.js, persistence through .vscode/tasks.json and .claude/settings.json, and behavior involving npm token validation, tarball download, payload injection, version bumping, republishing, and mass GitHub repository creation.\u003c/p\u003e\n"},{"n":26,"title":"Emerging Threat: (CVE-2026-67281) MikroTik RouterOS Unauthenticated File Read via WebFig","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-67281-mikrotik-routeros-unauthenticated-file-read-via-webfig/","time":"12:08","priority":"SHOULD READ","score":85,"tldr":"MikroTik RouterOS has a high-severity unauthenticated WebFig file-read flaw, CVE-2026-67281, that can expose root-owned configuration files and credentials on unpatched devices. Organizations should update to the fixed RouterOS releases and restrict or disable WebFig access, especially on internet-facing routers.","briefOverview":"\u003cp\u003eCVE-2026-67281 is an unauthenticated file read vulnerability in WebFig, the web-based management interface in MikroTik RouterOS. The flaw has a CVSS v4.0 base score of 8.7 and is mapped to CWE-824 and CWE-22. An attacker with network access to WebFig can manipulate the \u003ccode\u003e/jsproxy\u003c/code\u003e path behavior and use directory traversal inside an encrypted URI to read root-owned files, including configuration stores that hold credentials.\u003c/p\u003e\n\n\u003cp\u003eThe affected versions span RouterOS 6.0.0 up to before 6.49.21, RouterOS 7.0.0 up to before 7.23.4, and RouterOS 7.24 up to before 7.24.2. Affected assets include MikroTik routers, switches, wireless access points, and Cloud Hosted Router instances with the \u003ccode\u003ewww\u003c/code\u003e or \u003ccode\u003ewww-ssl\u003c/code\u003e service reachable from an untrusted network. The article notes that these devices often sit at the network edge in branch, retail, small-office, VPN, aggregation, and cloud-hosted environments.\u003c/p\u003e\n\n\u003cp\u003eMikroTik has published fixed builds in RouterOS 6.49.21, 7.23.4, and 7.24.2, and a 7.25 beta build also carries the fix. The article says there is no public reporting of CVE-2026-67281 being exploited at the time of writing, while noting that CERT Polska reported in-the-wild exploitation involving the MikroTrick chain against the SSH service for the same release cluster. Recommended actions include inventorying RouterOS devices, restricting or disabling WebFig, blocking inbound TCP/80 and TCP/443 to router management addresses, rotating credentials after suspected exposure, and reviewing logs for unrecognized users, scripts, or scheduled tasks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-67281 is an unauthenticated file read vulnerability in WebFig, the web-based management interface in MikroTik RouterOS, with a CVSS v4.0 base score of 8.7.","The vulnerability can allow an attacker with network access to the WebFig interface to read root-owned files on the device, including configuration stores that hold credentials.","Affected RouterOS versions include 6.0.0 up to before 6.49.21, 7.0.0 up to before 7.23.4, and 7.24 up to before 7.24.2.","MikroTik has published fixed builds in RouterOS 6.49.21, 7.23.4, and 7.24.2, with a 7.25 beta build also carrying the fix.","The article recommends inventorying RouterOS devices, restricting or disabling WebFig access, blocking inbound TCP/80 and TCP/443 to router management addresses, rotating credentials after suspected exposure, and reviewing device logs for suspicious changes."],"insights":["The article notes that there is no public reporting of CVE-2026-67281 being exploited yet, but warns that defenders should treat this only as a timing observation rather than a reason to deprioritize it.","The vendor advisory reportedly does not name CVE-2026-67281 or WebFig, so administrators relying only on MikroTik’s advisory may miss the specific version-to-vulnerability mapping described in the CVE record and third-party analysis.","A significant share of exposed assets were identified by service fingerprint rather than confirmed version detection, meaning the set of devices that need checking is broader than the set that can be externally confirmed as vulnerable.","Consumer Discretionary organizations represented 46.8% of observed assets, which the article links to distributed retail, apparel, and hospitality networks that often use inexpensive edge hardware managed outside central corporate configuration systems.","The article emphasizes that updating alone may not be enough, because MikroTik also directs administrators to inspect devices for flagged logs, unknown scripts, unfamiliar user accounts, or unexpected configuration entries after patching."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-67281 is an unauthenticated file read vulnerability in WebFig, the web-based management interface in MikroTik RouterOS. The flaw has a CVSS v4.0 base score of 8.7 and is mapped to CWE-824 and CWE-22. An attacker with network access to WebFig can manipulate the \u003ccode\u003e/jsproxy\u003c/code\u003e path behavior and use directory traversal inside an encrypted URI to read root-owned files, including configuration stores that hold credentials.\u003c/p\u003e\n\n\u003cp\u003eThe affected versions span RouterOS 6.0.0 up to before 6.49.21, RouterOS 7.0.0 up to before 7.23.4, and RouterOS 7.24 up to before 7.24.2. Affected assets include MikroTik routers, switches, wireless access points, and Cloud Hosted Router instances with the \u003ccode\u003ewww\u003c/code\u003e or \u003ccode\u003ewww-ssl\u003c/code\u003e service reachable from an untrusted network. The article notes that these devices often sit at the network edge in branch, retail, small-office, VPN, aggregation, and cloud-hosted environments.\u003c/p\u003e\n\n\u003cp\u003eMikroTik has published fixed builds in RouterOS 6.49.21, 7.23.4, and 7.24.2, and a 7.25 beta build also carries the fix. The article says there is no public reporting of CVE-2026-67281 being exploited at the time of writing, while noting that CERT Polska reported in-the-wild exploitation involving the MikroTrick chain against the SSH service for the same release cluster. Recommended actions include inventorying RouterOS devices, restricting or disabling WebFig, blocking inbound TCP/80 and TCP/443 to router management addresses, rotating credentials after suspected exposure, and reviewing logs for unrecognized users, scripts, or scheduled tasks.\u003c/p\u003e\n"},{"n":11,"title":"Telerik UI Padding-Oracle Bug Chained to Unauthenticated RCE — Public Exploit Released","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/telerik-ui-padding-oracle-bug-chained.html","time":"11:20","priority":"SHOULD READ","score":82,"tldr":"A public exploit chain now shows how specific non-default Telerik UI for ASP.NET AJAX RadAsyncUpload configurations can be abused for unauthenticated remote code execution, though Progress patched the flaws in July and there are no confirmed in-the-wild attacks. Organizations should upgrade to version 2026.2.708 or later, as stronger custom keys do not stop the padding-oracle-based chain.","briefOverview":"\u003cp\u003eSecurity firm TantoSec published a working exploit chain for Telerik UI for ASP.NET AJAX that can allow unauthenticated remote code execution on a vulnerable server. Progress Software patched the flaws in version 2026.2.708 on July 8 and published the CVEs and advisory on July 22. The public release includes a detailed write-up, a command-line tool called telerik-rau-exploit, and two mixed-mode DLL payloads.\u003c/p\u003e\n\n\u003cp\u003eThe chain affects the RadAsyncUpload file-upload control in versions 2010.1.309 through 2026.2.519, but running an affected version is not enough by itself. The application must render a RadAsyncUpload control whose server-side handler reads the upload result, and it must use an explicit non-default encryption key for the control. The article states there are no confirmed reports of exploitation in the wild, and the flaws were not in CISA’s Known Exploited Vulnerabilities catalog as of September 7.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a padding oracle in AES-CBC encrypted client-side state, where server responses reveal whether tampered data has valid padding or fails JSON parsing. This allows an attacker to decrypt and forge the upload configuration without knowing the key, then name an arbitrary .NET type that is resolved and deserialized into a gadget that loads an attacker-controlled DLL. Progress recommends upgrading to Telerik UI for ASP.NET AJAX 2026.2.708 or later and notes that successful exploitation may leave no obvious trace in standard ASP.NET error logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TantoSec published a working exploit chain and command-line tool targeting Telerik UI for ASP.NET AJAX RadAsyncUpload flaws that can allow unauthenticated remote code execution under specific conditions.","Progress Software fixed the RadAsyncUpload attack chain in Telerik UI for ASP.NET AJAX version 2026.2.708, released on July 8, after the affected versions 2010.1.309 through 2026.2.519.","The chain requires a non-default configuration in which a page renders a RadAsyncUpload control whose server-side handler reads the upload result and the application uses an explicit custom encryption key for the control.","The attack uses a padding oracle in AES-CBC-encrypted client-side state to forge upload configuration data, then abuses unguarded .NET type resolution to load an attacker-controlled DLL.","The article states there are no confirmed reports of the 2026 flaws being exploited in the wild and that they were not in CISA’s Known Exploited Vulnerabilities catalog as of September 7."],"insights":["A custom encryption key, which Telerik recommends as hardening, is part of the required vulnerable configuration, and Progress warns that using a stronger custom key does not help because the oracle does not need to know the key.","The exploit is practical but noisy and slow, with TantoSec’s lab run requiring about 127,000 oracle requests and roughly an hour, making rate limiting and timing behavior relevant to defenders.","Hiding detailed error messages does not eliminate the issue, but it can force attackers onto the slower timing-based variant tracked as CVE-2026-13183.","Standard ASP.NET error logs may not show obvious evidence of successful exploitation, so Progress recommends looking for behavioral signs such as w3wp.exe spawning cmd.exe, unexpected .aspx files, or mixed-mode DLLs in upload-related locations.","Sites that use affected Telerik UI versions are not automatically exploitable; applications without both the specific RadAsyncUpload usage pattern and explicit non-default encryption key are outside this particular chain."],"referencedReports":[{"title":"Telerik Padding Oracle to Shell","url":"https://tantosec.com/blog/2026/09/telerik-padding-oracle-to-shell/","publisher":"TantoSec","context":"The article says TantoSec's Marcio Almeida walked through the full exploit chain and released a command-line tool and payloads.","category":"","primary":false},{"title":"Security Critical RCE Chain Bulletin July 2026","url":"https://www.telerik.com/products/aspnet-ajax/documentation/knowledge-base/kb-security-critical-rce-chain-bulletin-july-2026","publisher":"Progress Software","context":"The article cites Progress's advisory for the affected Telerik UI for ASP.NET AJAX versions and the fixed release.","category":"","primary":false}],"body":"\u003cp\u003eSecurity firm TantoSec published a working exploit chain for Telerik UI for ASP.NET AJAX that can allow unauthenticated remote code execution on a vulnerable server. Progress Software patched the flaws in version 2026.2.708 on July 8 and published the CVEs and advisory on July 22. The public release includes a detailed write-up, a command-line tool called telerik-rau-exploit, and two mixed-mode DLL payloads.\u003c/p\u003e\n\n\u003cp\u003eThe chain affects the RadAsyncUpload file-upload control in versions 2010.1.309 through 2026.2.519, but running an affected version is not enough by itself. The application must render a RadAsyncUpload control whose server-side handler reads the upload result, and it must use an explicit non-default encryption key for the control. The article states there are no confirmed reports of exploitation in the wild, and the flaws were not in CISA’s Known Exploited Vulnerabilities catalog as of September 7.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a padding oracle in AES-CBC encrypted client-side state, where server responses reveal whether tampered data has valid padding or fails JSON parsing. This allows an attacker to decrypt and forge the upload configuration without knowing the key, then name an arbitrary .NET type that is resolved and deserialized into a gadget that loads an attacker-controlled DLL. Progress recommends upgrading to Telerik UI for ASP.NET AJAX 2026.2.708 or later and notes that successful exploitation may leave no obvious trace in standard ASP.NET error logs.\u003c/p\u003e\n"},{"n":18,"title":"PEEP Turns Chrome and Edge Into Post-Compromise Backdoors for Host Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/peep-turns-chrome-and-edge-into-post.html","time":"18:12","priority":"SHOULD READ","score":82,"tldr":"Researchers detailed PEEP, a post-compromise toolkit that turns Chrome and Edge into persistent backdoors by sideloading a fake bookmarks extension and using a native messaging host to run OS commands. It can steal browser data and cookies, hijack sessions, manage files, and maintain persistence by tampering with Chromium settings and policies.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of PEEP, a Chromium-based post-exploitation toolkit that masquerades as a bookmarks extension for Chrome and Edge. SOCRadar said the tool requires prior administrative or code execution access and injects the extension directly into browser profiles. It bypasses Web Store checks and user prompts by forging Chromium Secure Preferences integrity values.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, PEEP polls its command-and-control server every 30 seconds over plaintext HTTP for new commands. It exfiltrates browsing history, active-tab metadata, session cookies, and other automatically collected data such as public IP address, locale, and time zone. The extension also uses a native-messaging executable, nm_host.exe, to run shell commands, manage files, and discover processes and services.\u003c/p\u003e\n\n\u003cp\u003ePEEP builds on the open-source RedExt browser data analysis and red teaming framework and expands it with installation routines, a native host bridge, heartbeat telemetry, an update channel, and a broader command set. The article says the activity is unattributed, though Chinese-language artifacts in the source code point to a Chinese-speaking threat actor. SOCRadar said PEEP turns Chrome and Edge into persistent backdoors that can support credential theft, session abuse, and command execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers disclosed PEEP, a Chromium-based post-exploitation toolkit that masquerades as a bookmarks extension for Chrome and Edge.","PEEP requires prior administrative or code execution access and injects itself directly into Chrome or Edge profiles by forging Chromium Secure Preferences integrity values.","Once installed, PEEP polls its command-and-control server every 30 seconds over plaintext HTTP while exfiltrating browsing history, active-tab metadata, and session cookies.","PEEP uses a native-messaging tool called nm_host.exe to run host commands, manage files, and discover processes and services from the user context.","SOCRadar said PEEP builds on the open-source RedExt framework and adds installation routines, a native host bridge, heartbeat telemetry, an update channel, and a broader command set."],"insights":["PEEP’s use of Chromium Secure Preferences tampering is notable because it helps the fake extension remain auto-enabled even though it is not distributed through official browser extension marketplaces.","The native-messaging bridge is a major escalation point because it turns browser-level access into operating system-level command execution and file management.","PEEP’s reliance on plaintext HTTP for 30-second command polling creates observable network behavior tied to the listed command-and-control endpoints.","The presence of a Linux Secure Preferences patching script shows the operators were replicating the browser-persistence behavior beyond Windows environments.","The exposed “/health” endpoint reported 34 agent entries, 10 active sessions, and 507 data records, but the article says these cannot be confirmed as real infections rather than test entries."],"referencedReports":[{"title":"PEEP Browser RAT Chrome Extension","url":"https://socradar.io/blog/peep-browser-rat-chrome-extension/","publisher":"SOCRadar","context":"The article cites SOCRadar’s technical analysis as the source for details on PEEP’s installation, persistence, command-and-control endpoints, and host command execution capabilities.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of PEEP, a Chromium-based post-exploitation toolkit that masquerades as a bookmarks extension for Chrome and Edge. SOCRadar said the tool requires prior administrative or code execution access and injects the extension directly into browser profiles. It bypasses Web Store checks and user prompts by forging Chromium Secure Preferences integrity values.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, PEEP polls its command-and-control server every 30 seconds over plaintext HTTP for new commands. It exfiltrates browsing history, active-tab metadata, session cookies, and other automatically collected data such as public IP address, locale, and time zone. The extension also uses a native-messaging executable, nm_host.exe, to run shell commands, manage files, and discover processes and services.\u003c/p\u003e\n\n\u003cp\u003ePEEP builds on the open-source RedExt browser data analysis and red teaming framework and expands it with installation routines, a native host bridge, heartbeat telemetry, an update channel, and a broader command set. The article says the activity is unattributed, though Chinese-language artifacts in the source code point to a Chinese-speaking threat actor. SOCRadar said PEEP turns Chrome and Edge into persistent backdoors that can support credential theft, session abuse, and command execution.\u003c/p\u003e\n"},{"n":12,"title":"Your Cloud Security Checklist Doesn't Work the Way You Think It Does","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/your-cloud-security-checklist-doesnt.html","time":"11:45","priority":"SHOULD READ","score":78,"tldr":"Intruder’s analysis of 3,000 cloud environments found that AWS, Azure, and Google Cloud fail in very different ways, so a single generic cloud security checklist is unlikely to address the biggest risks across providers. IAM and logging issues are nearly universal, while exposure, firewall, encryption, and service misconfiguration risks vary sharply by platform and organization size.","briefOverview":"\u003cp\u003eIntruder analyzed misconfiguration data from 3,000 organizations across AWS, Azure, and Google Cloud for its 2026 Cloud Security Index. The article says risk profiles across the three providers have almost nothing in common, making it difficult for teams to rely on a single cloud security checklist. Weak identity and access management controls and missing logging were near-universal, affecting between 80% and 98% of accounts regardless of provider.\u003c/p\u003e\n\n\u003cp\u003eThe largest provider-specific differences appeared in exposed services, permissive firewalls, weak encryption, and misconfigured services. AWS had the highest prevalence of exposed services at 76%, permissive firewalls at 83%, and weak encryption at 49%, while Google Cloud was lowest in those categories. Azure was the exception for misconfigured services, leading at 80%, and its most common issues centered on Storage Accounts and Entra users without multi-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eOrganization size also changed the risk picture, with most issue categories becoming less common as organizations grew. Weak IAM controls were the exception, affecting 87% of SMEs, 95% of midmarket organizations, and 98% of large enterprises. Midmarket organizations took the longest to remediate cloud issues, averaging 35 days, compared with 8–16 days for smaller businesses and 10 days for large enterprises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Intruder analyzed misconfiguration data from 3,000 organizations across AWS, Azure, and Google Cloud for its 2026 Cloud Security Index.","Weak identity and access management controls and missing logging affected between 80% and 98% of accounts regardless of cloud provider.","AWS had the highest prevalence for exposed services, permissive firewalls, and weak encryption, while Google Cloud had the lowest prevalence in those categories.","Azure had the highest prevalence of misconfigured services at 80%, and its most common issues centered on storage account controls and Entra users without multi-factor authentication.","Weak IAM controls became more common as organizations grew, affecting 87% of SMEs, 95% of midmarket organizations, and 98% of large enterprises."],"insights":["A multi-cloud security program should not prioritize the same fixes equally across AWS, Azure, and Google Cloud, because the article shows large provider-specific gaps such as exposed services affecting 76% of AWS accounts but only 8% of Google Cloud accounts.","Azure storage weaknesses tend to cluster together, since storage key rotation, access keys, and public network access issues affected similar shares of Azure accounts.","Improving network exposure and encryption controls may not address the most persistent risk in larger organizations, because weak IAM controls were the one category that became more prevalent as organization size increased.","Midmarket organizations may need special remediation support or prioritization, because they had the longest average cloud issue remediation time despite facing enterprise-level cloud complexity.","Google Cloud’s lower prevalence across most categories does not mean it is free from major security gaps, since its most common issues were concentrated around OS Login and service account controls."],"referencedReports":[{"title":"2026 Cloud Security Index","url":"https://www.intruder.io/blog/cloud-security-index?utm_source=thehackernews\u0026utm_medium=p_referral\u0026utm_campaign=global%7Cfixed%7Ccloud_index","publisher":"Intruder","context":"The article is based on Intruder’s analysis of misconfiguration data from 3,000 organizations across AWS, Azure, and Google Cloud for the 2026 Cloud Security Index.","category":"","primary":false}],"body":"\u003cp\u003eIntruder analyzed misconfiguration data from 3,000 organizations across AWS, Azure, and Google Cloud for its 2026 Cloud Security Index. The article says risk profiles across the three providers have almost nothing in common, making it difficult for teams to rely on a single cloud security checklist. Weak identity and access management controls and missing logging were near-universal, affecting between 80% and 98% of accounts regardless of provider.\u003c/p\u003e\n\n\u003cp\u003eThe largest provider-specific differences appeared in exposed services, permissive firewalls, weak encryption, and misconfigured services. AWS had the highest prevalence of exposed services at 76%, permissive firewalls at 83%, and weak encryption at 49%, while Google Cloud was lowest in those categories. Azure was the exception for misconfigured services, leading at 80%, and its most common issues centered on Storage Accounts and Entra users without multi-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eOrganization size also changed the risk picture, with most issue categories becoming less common as organizations grew. Weak IAM controls were the exception, affecting 87% of SMEs, 95% of midmarket organizations, and 98% of large enterprises. Midmarket organizations took the longest to remediate cloud issues, averaging 35 days, compared with 8–16 days for smaller businesses and 10 days for large enterprises.\u003c/p\u003e\n"},{"n":19,"title":"DocuSign Lure With Zero Links and One Clickable Body","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/html-imagemap-body-wide-hidden-href-zero-links-esignature-lure","time":"11:00","priority":"MAY READ","score":72,"tldr":"A DocuSign-themed phishing email evaded link detection by hiding its only external URL inside a full-card HTML image map instead of a normal anchor link. The message also spoofed the recipient’s own address with no SPF, DKIM, or DMARC authentication, making behavioral and sender anomaly detection the key signals.","briefOverview":"\u003cp\u003eA DocuSign-themed e-signature notice reached the chief executive of a small independent power and energy company. The message showed a branded document card with a headline offering disclosures for review and a named non-disclosure agreement PDF, but the PDF existed only as body text and there was no attachment. The structured incident record listed zero attachments and zero links, but the article explains that the zero-link result did not reflect the message’s actual click behavior.\u003c/p\u003e\n\n\u003cp\u003eThe entire visible card was placed inside an HTML image map with one clickable area whose coordinates covered every rendered pixel. Its href pointed to the root of \u003ccode\u003edone4you[.]tv\u003c/code\u003e, an unrelated external domain with no visible connection to the e-signature brand or the recipient’s business. Because the message used no anchor tag and did not display the destination as visible text, an extractor focused on anchor elements and visible URL patterns returned an empty links array.\u003c/p\u003e\n\n\u003cp\u003eThe From and To headers both contained the recipient’s own mailbox, and SPF, DKIM, DMARC, and composite authentication all returned none. The message was surfaced through suspicious sender and behavioral signals, with added weight from the mailbox belonging to a senior executive, rather than through URL analysis. The same lure reached the same mailbox twice, eleven days apart, and both occurrences were quarantined and permanently deleted after human review.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A DocuSign-themed e-signature notice reached the chief executive of a small independent power and energy company with a branded document card and a named PDF that was only body text, not an attachment.","The incident record listed zero links and zero attachments, but the message contained a live external href inside an HTML image map area whose coordinates covered the entire visible card.","The destination was the root of done4you[.]tv, a domain with no visible connection to DocuSign or the recipient’s business, and the record contained no landing-page capture or scanner verdict for the host.","The From and To headers both used the recipient’s own mailbox, while SPF, DKIM, DMARC, and composite authentication all returned none.","The message was flagged by suspicious sender and behavioral signals, weighted by the recipient being a senior executive, and both occurrences were quarantined and permanently deleted."],"insights":["A “zero links” finding can be misleading when URL extraction only enumerates anchor tags, because an HTML image map area can still carry a clickable external href.","A message body that renders as one branded card should not be treated as clean solely because link extraction is empty, since the article shows the entire visible card can function as one hidden clickable region.","Self-addressed inbound mail from external infrastructure is a strong anomaly when no SPF, DKIM, DMARC, or composite authentication result supports the sender claim.","The slight subject change across two deliveries eleven days apart is treated in the article as a signal that the sender was testing whether the mailbox was live and whether the technique survived.","The article recommends extracting href attributes from image map area elements and image elements, not only from anchor elements, to close this detection gap."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that phishing accounts for 16 percent of initial access vectors and the human element appears in 62 percent of breaches.","category":"","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance when stating that unexpected document notices should be verified inside the application they claim to come from rather than through the email card.","category":"","primary":false}],"body":"\u003cp\u003eA DocuSign-themed e-signature notice reached the chief executive of a small independent power and energy company. The message showed a branded document card with a headline offering disclosures for review and a named non-disclosure agreement PDF, but the PDF existed only as body text and there was no attachment. The structured incident record listed zero attachments and zero links, but the article explains that the zero-link result did not reflect the message’s actual click behavior.\u003c/p\u003e\n\n\u003cp\u003eThe entire visible card was placed inside an HTML image map with one clickable area whose coordinates covered every rendered pixel. Its href pointed to the root of \u003ccode\u003edone4you[.]tv\u003c/code\u003e, an unrelated external domain with no visible connection to the e-signature brand or the recipient’s business. Because the message used no anchor tag and did not display the destination as visible text, an extractor focused on anchor elements and visible URL patterns returned an empty links array.\u003c/p\u003e\n\n\u003cp\u003eThe From and To headers both contained the recipient’s own mailbox, and SPF, DKIM, DMARC, and composite authentication all returned none. The message was surfaced through suspicious sender and behavioral signals, with added weight from the mailbox belonging to a senior executive, rather than through URL analysis. The same lure reached the same mailbox twice, eleven days apart, and both occurrences were quarantined and permanently deleted after human review.\u003c/p\u003e\n"},{"n":27,"title":"Tracking BigBear 2.0 Evilginx2 Phishing Campaign","source":"cloudsek.com","sourceColorIdx":2,"link":"https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign","time":"00:00","priority":"MAY READ","score":62,"tldr":"Researchers tracked a BigBear 2.0 phishing campaign using Evilginx2 to proxy legitimate login pages and steal credentials and session cookies. The key risk is that this adversary-in-the-middle approach can bypass MFA and enable account takeover.","briefOverview":"\u003cp\u003eThe article is titled “Tracking BigBear 2.0 Evilginx2 Phishing Campaign.” From the title, it concerns a phishing campaign associated with BigBear 2.0 and Evilginx2. The body text provided is not readable as normal prose, so no further factual details about the campaign can be extracted from it.\u003c/p\u003e\n\n\u003cp\u003eThe article indicates that the campaign is being tracked, but it does not provide readable details about who was affected, when the activity occurred, or what outcomes resulted. It also does not provide readable information about the campaign’s significance or real-world impact. Any additional claims about victims, geography, infrastructure, or consequences would go beyond the provided article text.\u003c/p\u003e\n\n\u003cp\u003eThe only explicit technical detail available is the mention of Evilginx2 in the title. The provided content does not include readable descriptions of techniques, indicators, tools, mitigations, or evidence. As a result, the article can only be summarized at a high level as a piece about tracking a BigBear 2.0 Evilginx2 phishing campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Tracking BigBear 2.0 Evilginx2 Phishing Campaign.\"","The article identifies the activity being discussed as a phishing campaign.","The article names BigBear 2.0 in connection with the phishing campaign.","The article names Evilginx2 in connection with the phishing campaign."],"insights":[],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Tracking BigBear 2.0 Evilginx2 Phishing Campaign.” From the title, it concerns a phishing campaign associated with BigBear 2.0 and Evilginx2. The body text provided is not readable as normal prose, so no further factual details about the campaign can be extracted from it.\u003c/p\u003e\n\n\u003cp\u003eThe article indicates that the campaign is being tracked, but it does not provide readable details about who was affected, when the activity occurred, or what outcomes resulted. It also does not provide readable information about the campaign’s significance or real-world impact. Any additional claims about victims, geography, infrastructure, or consequences would go beyond the provided article text.\u003c/p\u003e\n\n\u003cp\u003eThe only explicit technical detail available is the mention of Evilginx2 in the title. The provided content does not include readable descriptions of techniques, indicators, tools, mitigations, or evidence. As a result, the article can only be summarized at a high level as a piece about tracking a BigBear 2.0 Evilginx2 phishing campaign.\u003c/p\u003e\n"},{"n":24,"title":"Qatar’s Digital Boom Has a Blind Spot: What the 2025-26 Threat Data Is Telling Us","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/qatar-digital-boom-blindspot/","time":"13:00","priority":"MAY READ","score":55,"tldr":"Qatar’s rapid digital expansion is creating high-value openings for focused ransomware groups, access brokers, and attackers exploiting enterprise remote-access tools. The key takeaway is that organizations need Qatar-specific threat intelligence and visibility into exposed access before targeted campaigns turn into major incidents.","briefOverview":"\u003cp\u003eQatar is rapidly expanding its digital economy through smart infrastructure, cloud-first government services, API-driven financial services, and more connected OT/ICS systems in critical energy operations such as QatarEnergy’s LNG environment. The article argues that this growth has increased the country’s exposure to targeted cyber activity because attackers only need one valuable foothold. It describes Qatar’s 2025-26 threat landscape as smaller and more concentrated than high-volume threat environments elsewhere, but potentially more dangerous because attackers are pursuing specific sectors, footholds, and weaknesses.\u003c/p\u003e\n\n\u003cp\u003eCyble’s Qatar Threat Landscape Report 2025 found that Qilin was responsible for essentially all observed ransomware activity in Qatar during the period, including a concentrated campaign in October. In 2026 to date, The Gentleman, Everest, Crypto24, and Payload groups have shared the observed ransomware space. The article also says confirmed compromised-access listings tied to Qatar appeared on underground markets, with BFSI and retail organizations making up more than half of those listings, while education was the sector most frequently affected by recorded data breach and leak incidents involving personally identifiable information.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights increased exploitation of enterprise remote-access and connectivity products from Microsoft, Fortinet, Ivanti, and Citrix, warning that an unpatched edge device can become a path into a core network. It also notes low-volume hacktivism tied to regional geopolitical tensions and Qatar’s visibility as a diplomatic hub and LNG exporter. While Qatar has laws, agencies, certification efforts, and international cooperation measures aimed at improving cybersecurity, the article says organizations need region-specific visibility into what is being sold, exploited, and targeted before it becomes an incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Qatar’s rapid shift toward smart infrastructure, cloud-first government services, API-driven finance, and connected OT/ICS systems is expanding its digital footprint and making it an attractive cyber target.","Cyble’s Qatar Threat Landscape Report 2025 found that the Qilin ransomware group was responsible for essentially all observed ransomware activity in Qatar during the period, while in 2026 The Gentleman, Everest, Crypto24, and Payload groups shared the observed ransomware space.","Confirmed listings of compromised access tied to Qatar appeared on underground markets, with BFSI and retail organizations accounting for more than half of those listings.","Data breach and leak incidents were recorded most frequently in Qatar’s education sector, where opportunistic actors targeted personally identifiable information.","The article says exploitation activity increased against enterprise remote-access and connectivity products from Microsoft, Fortinet, Ivanti, and Citrix, making unpatched edge devices a potential bridge into core networks."],"insights":["Qatar’s threat landscape is described as dangerous because of its concentration and precision rather than high attack volume, meaning generic defenses may miss adversaries focused on specific Qatari sectors and footholds.","The article frames compromised-access sales in Qatar’s BFSI and retail sectors as an early warning stage, because attackers may be building entry points before ransomware or fraud becomes visible.","Education is presented as a softer leak point in Qatar’s wider digital ecosystem because universities and training institutions may not receive the same security investment priority as banks or energy firms.","The article highlights a defensive paradox: the enterprise tools used to enable secure remote connectivity are also becoming a major weak link when unpatched edge devices are exploited.","Policy measures and cybersecurity market growth are portrayed as insufficient by themselves, because the article argues that organizations need visibility into what is being sold, exploited, and targeted in their own region before incidents occur."],"referencedReports":[],"body":"\u003cp\u003eQatar is rapidly expanding its digital economy through smart infrastructure, cloud-first government services, API-driven financial services, and more connected OT/ICS systems in critical energy operations such as QatarEnergy’s LNG environment. The article argues that this growth has increased the country’s exposure to targeted cyber activity because attackers only need one valuable foothold. It describes Qatar’s 2025-26 threat landscape as smaller and more concentrated than high-volume threat environments elsewhere, but potentially more dangerous because attackers are pursuing specific sectors, footholds, and weaknesses.\u003c/p\u003e\n\n\u003cp\u003eCyble’s Qatar Threat Landscape Report 2025 found that Qilin was responsible for essentially all observed ransomware activity in Qatar during the period, including a concentrated campaign in October. In 2026 to date, The Gentleman, Everest, Crypto24, and Payload groups have shared the observed ransomware space. The article also says confirmed compromised-access listings tied to Qatar appeared on underground markets, with BFSI and retail organizations making up more than half of those listings, while education was the sector most frequently affected by recorded data breach and leak incidents involving personally identifiable information.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights increased exploitation of enterprise remote-access and connectivity products from Microsoft, Fortinet, Ivanti, and Citrix, warning that an unpatched edge device can become a path into a core network. It also notes low-volume hacktivism tied to regional geopolitical tensions and Qatar’s visibility as a diplomatic hub and LNG exporter. While Qatar has laws, agencies, certification efforts, and international cooperation measures aimed at improving cybersecurity, the article says organizations need region-specific visibility into what is being sold, exploited, and targeted before it becomes an incident.\u003c/p\u003e\n"},{"n":25,"title":"The 72-Hour Reporting Obligation","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/blog/the-72-hour-reporting-obligation/","time":"10:52","priority":"MAY READ","score":55,"tldr":"The UK Cyber Security and Resilience Bill’s 72-hour incident reporting requirement will be especially difficult for OT organisations because many lack current asset inventories, network diagrams, and operational documentation. The key takeaway is that credible reporting depends on pre-incident visibility, not scrambling to reconstruct OT environments after an attack.","briefOverview":"\u003cp\u003eThe article discusses the UK Cyber Security and Resilience Bill’s proposed two-stage incident reporting obligation. Organisations would need to issue an early warning within 24 hours of becoming aware of a significant incident, followed by a fuller report within 72 hours. Reports would have to be sent simultaneously to both the relevant sector regulator and the NCSC.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the 72-hour window is much harder for OT organisations than for IT environments. A credible report needs pre-existing knowledge of which systems were affected, what those systems do operationally, what data or process capability they hold, the likely attack path, and the scope of exposure. The article says this information cannot be reliably reconstructed under pressure after an incident begins.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a knowledge gap in many OT environments, where estates are built over decades, equipment is added without formal documentation, and network diagrams may not have been updated since commissioning. In some cases, knowledge about how systems connect and operate resides with individual engineers rather than written records. The article concludes that the 72-hour reporting obligation effectively tests whether an organisation had sufficient pre-incident visibility into its own environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK Cyber Security and Resilience Bill, as currently drafted, requires an early warning within 24 hours of becoming aware of a significant incident and a fuller report within 72 hours.","Incident reports must be sent simultaneously to both the relevant sector regulator and the NCSC.","A credible 72-hour report requires pre-existing knowledge of affected systems, their operational role, the data or process capability they hold, the likely attack path, and the scope of exposure.","OT environments often lack current asset records, network diagrams, and maintained documentation because they are built over decades and rely heavily on individual engineers’ knowledge.","The article argues that the 72-hour reporting obligation effectively tests whether an organisation had enough visibility into its environment before an incident occurred."],"insights":["The 72-hour deadline exposes a preparedness gap that exists before any incident begins, because the report depends on information that cannot reliably be created while systems are inaccessible and staff are responding under pressure.","OT organisations may be less constrained by the reporting timeline itself than by the absence of written, transferable knowledge about long-running environments that are often understood mainly by individual engineers.","The article frames regulatory reporting as a test of operational visibility rather than incident response performance, meaning compliance depends heavily on maintaining accurate asset, network, and process documentation in advance.","A report that looks credible to a regulator requires linking technical impact to operational function, not merely listing what was detected or shut down."],"referencedReports":[],"body":"\u003cp\u003eThe article discusses the UK Cyber Security and Resilience Bill’s proposed two-stage incident reporting obligation. Organisations would need to issue an early warning within 24 hours of becoming aware of a significant incident, followed by a fuller report within 72 hours. Reports would have to be sent simultaneously to both the relevant sector regulator and the NCSC.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the 72-hour window is much harder for OT organisations than for IT environments. A credible report needs pre-existing knowledge of which systems were affected, what those systems do operationally, what data or process capability they hold, the likely attack path, and the scope of exposure. The article says this information cannot be reliably reconstructed under pressure after an incident begins.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a knowledge gap in many OT environments, where estates are built over decades, equipment is added without formal documentation, and network diagrams may not have been updated since commissioning. In some cases, knowledge about how systems connect and operate resides with individual engineers rather than written records. The article concludes that the 72-hour reporting obligation effectively tests whether an organisation had sufficient pre-incident visibility into its own environment.\u003c/p\u003e\n"},{"n":4,"title":"ChatGPT Astra is now rolling out to $20 Plus subscription","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/chatgpt-astra-is-now-rolling-out-to-20-plus-subscription/","time":"01:15","priority":"MAY READ","score":45,"tldr":"OpenAI is gradually rolling out its new flagship ChatGPT Astra model to $20 Plus subscribers, with some users seeing it first in ChatGPT Work rather than regular Chat. Astra is included within existing Plus limits, but OpenAI has not said when or whether free users will get access.","briefOverview":"\u003cp\u003eOpenAI is gradually rolling out ChatGPT Astra, described as its most powerful model to date, to users with a $20 ChatGPT Plus subscription. The model may appear in ChatGPT Work before it becomes available in the regular Chat model picker. In the article’s example, Astra was available in the author’s Plus account under Work, but not yet in normal Chat.\u003c/p\u003e\n\n\u003cp\u003eOpenAI previously said GPT-6 Astra is available to all Pro, Enterprise, and Business Premium users in ChatGPT Work and Codex, and that it is also live in the API. The company said it may take a few days to roll out to Plus and Business users. OpenAI says Astra usage is included within existing subscription limits, and users who need more usage will be able to buy credits.\u003c/p\u003e\n\n\u003cp\u003eAstra is OpenAI’s new flagship model and is designed for computer use, browsing, coding, science, cybersecurity, and longer professional tasks. OpenAI says it is significantly better than GPT-5.6 Sol at maintaining context during complex work. The company has not said whether Astra will roll out to free users, who currently have access to GPT-5.6 Sol and GPT-5.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI is gradually rolling out ChatGPT Astra to users with a $20 ChatGPT Plus subscription.","Astra may appear in ChatGPT Work before it becomes available in the regular Chat model picker for some Plus users.","OpenAI said GPT-6 Astra is already available to all Pro, Enterprise, and Business Premium users in ChatGPT Work and Codex, and is also live in the API.","OpenAI says Astra usage is included within existing subscription limits, with the option to buy credits for additional usage.","OpenAI has not said whether ChatGPT Astra will roll out to free users, who currently have access to GPT-5.6 Sol and GPT-5."],"insights":["Plus users who do not see Astra in the regular Chat model picker may still be able to access it by checking the ChatGPT Work section.","The rollout is not uniform across ChatGPT surfaces, since one Plus account had Astra in Work while the normal Chat model picker still did not offer it.","Organizations or users needing Astra immediately may already have access through Pro, Enterprise, Business Premium, Codex, or the API rather than waiting for the Plus rollout to complete.","Plus subscribers do not need to change plans just to try Astra, because OpenAI says its usage is included within existing subscription limits."],"referencedReports":[],"body":"\u003cp\u003eOpenAI is gradually rolling out ChatGPT Astra, described as its most powerful model to date, to users with a $20 ChatGPT Plus subscription. The model may appear in ChatGPT Work before it becomes available in the regular Chat model picker. In the article’s example, Astra was available in the author’s Plus account under Work, but not yet in normal Chat.\u003c/p\u003e\n\n\u003cp\u003eOpenAI previously said GPT-6 Astra is available to all Pro, Enterprise, and Business Premium users in ChatGPT Work and Codex, and that it is also live in the API. The company said it may take a few days to roll out to Plus and Business users. OpenAI says Astra usage is included within existing subscription limits, and users who need more usage will be able to buy credits.\u003c/p\u003e\n\n\u003cp\u003eAstra is OpenAI’s new flagship model and is designed for computer use, browsing, coding, science, cybersecurity, and longer professional tasks. OpenAI says it is significantly better than GPT-5.6 Sol at maintaining context during complex work. The company has not said whether Astra will roll out to free users, who currently have access to GPT-5.6 Sol and GPT-5.\u003c/p\u003e\n"},{"n":9,"title":"ChatGPT can now connect to your personal apps to mimic writing style","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/chatgpt-can-now-connect-to-your-personal-apps-to-mimic-writing-style/","time":"10:36","priority":"MAY READ","score":45,"tldr":"OpenAI is testing a ChatGPT “Writing Style” feature that can learn a user’s voice by referencing writing from connected apps like Slack, Google Drive, Notion, and Gmail. The feature could make ChatGPT drafts more personalized without users repeatedly providing tone instructions or writing samples.","briefOverview":"\u003cp\u003eOpenAI appears to be testing a new “Writing Style” feature for ChatGPT that can learn how a user writes by looking at examples from connected apps. The feature is currently available to a small group of users. An onboarding screen says, “ChatGPT will write in your voice by referencing examples from your connected apps.”\u003c/p\u003e\n\n\u003cp\u003eThe feature lets users provide examples across three categories: Messaging, Documents, and Email. OpenAI lists Slack under messaging, Google Drive and Notion for documents, and Gmail for email. Once configured, ChatGPT could reference how a user naturally writes across those services when drafting new content, rather than requiring repeated tone instructions or pasted examples.\u003c/p\u003e\n\n\u003cp\u003eThe article compares the experiment to Anthropic’s Claude Styles feature, which let users upload or paste writing samples and generate a custom style based on communication patterns. OpenAI’s approach appears different because it can reference writing that already exists inside connected services. OpenAI has confirmed it is testing Writing Style, but the article says it is not known when the feature will roll out widely.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI is testing a new ChatGPT feature called “Writing Style” that can learn how a user writes by referencing examples from connected apps.","The feature is currently available to a small group of users, according to the article.","The onboarding screen says ChatGPT will write in the user’s voice by referencing examples from connected apps.","The feature lists Slack for messaging, Google Drive and Notion for documents, and Gmail for email as example connected services.","OpenAI confirmed it is testing Writing Style, but the article says there is no known timeline for a wider rollout."],"insights":["OpenAI’s approach appears to go beyond Anthropic’s Claude Styles because it can reference writing already stored in connected services instead of relying only on samples users upload or paste.","The feature could distinguish between different kinds of writing because it draws from messaging, documents, and email rather than treating a user’s writing style as a single generic pattern.","If configured, the feature could reduce the need for users to repeatedly explain their preferred tone or paste examples into each ChatGPT conversation.","Although OpenAI has confirmed the test, the article states there is no known timeline for a broad rollout."],"referencedReports":[],"body":"\u003cp\u003eOpenAI appears to be testing a new “Writing Style” feature for ChatGPT that can learn how a user writes by looking at examples from connected apps. The feature is currently available to a small group of users. An onboarding screen says, “ChatGPT will write in your voice by referencing examples from your connected apps.”\u003c/p\u003e\n\n\u003cp\u003eThe feature lets users provide examples across three categories: Messaging, Documents, and Email. OpenAI lists Slack under messaging, Google Drive and Notion for documents, and Gmail for email. Once configured, ChatGPT could reference how a user naturally writes across those services when drafting new content, rather than requiring repeated tone instructions or pasted examples.\u003c/p\u003e\n\n\u003cp\u003eThe article compares the experiment to Anthropic’s Claude Styles feature, which let users upload or paste writing samples and generate a custom style based on communication patterns. OpenAI’s approach appears different because it can reference writing that already exists inside connected services. OpenAI has confirmed it is testing Writing Style, but the article says it is not known when the feature will roll out widely.\u003c/p\u003e\n"},{"n":22,"title":"Modern Retail: Secure, Connected, and AI-Ready","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/modern-retail-secure-connected-and-ai-ready","time":"07:01","priority":"MAY READ","score":45,"tldr":"Retailers need unified data security, zero trust access, resilient connectivity, and inspectable AI controls to protect customer data as it moves across cloud apps, stores, partners, and autonomous agents. The article promotes Netskope’s approach for keeping data protected, checkout available, and AI activity governed.","briefOverview":"\u003cp\u003eRetail security teams are being asked to answer where customer data lives, who can access it, whether checkout would survive a network failure, and whether AI agents can be inspected while operating inside guardrails. The article explains that customer information no longer stays in one place for larger retailers, because cloud platforms, AI applications, store systems, and partner platforms create more paths for data to move. It argues that every purchase can produce payment, loyalty, inventory, and fulfillment data that is duplicated through exports, downloads, and unmanaged app sharing.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that this loss of data lineage makes it harder for security teams to know where information originated, who touched it, and where it moved. It cites Verizon’s 2026 retail Data Breach Investigations Report as finding that breaches with third-party involvement increased by 60% from the prior year’s dataset and reached 48% of total breaches. It says retailers need to discover and classify sensitive data across cloud apps, store systems, and partner platforms, trace copies back to their source, and block risky uploads or downloads before they complete.\u003c/p\u003e\n\n\u003cp\u003eThe article also focuses on checkout resilience and AI governance as part of modern retail security. It says point of sale terminals, self-checkout kiosks, handheld scanners, supplier portals, and related systems can create risk when older networks allow broad access, while zero trust network access limits each request to only the access its role requires. It also says SD-WAN can shift checkout traffic to a backup connection when the primary link fails, and that AI agents should be authenticated, access-managed, logged, and checked for unsafe instructions or responses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Retailers need to know where customer data lives, who can access it, whether checkout can survive a network failure, and whether AI agents operate inside inspectable guardrails.","A single retail purchase can create payment, loyalty, inventory, and fulfillment data that moves through multiple systems and may be duplicated through exports, downloads, or unmanaged apps.","Verizon’s 2026 Data Breach Investigations Report on retail found that breaches involving third parties increased by 60% from the previous year’s dataset and reached 48% of total breaches.","The article says zero trust network access can limit each request to the access its role requires, while SD-WAN can move checkout transactions to a backup connection if the primary link fails.","The article says AI agents should be authenticated, given managed access, logged, and supervised with content checks so they cannot reach systems beyond their business purpose."],"insights":["Retail data risk is amplified by everyday business actions such as marketing exports, supplier downloads, and store reports shared through unmanaged apps, not only by direct attacks on core systems.","The article frames data lineage as a practical control for retail security because security teams lose visibility when customer records are copied across cloud apps, store systems, and partner platforms.","Checkout resilience is treated as both a security and business continuity issue, with the article citing downtime costs of about $9,000 per minute on average and up to $500,000 per hour for larger retailers.","AI agents create a distinct governance challenge because they can access and act across multiple applications at once, making overbroad permissions more dangerous than they would be for a human handling one transaction at a time."],"referencedReports":[{"title":"2026 Data Breach Investigations Report Retail Snapshot","url":"https://www.verizon.com/business/resources/reports/2026-dbir-retail-snapshot.pdf","publisher":"Verizon","context":"The article cites this retail report for the finding that breaches with third-party involvement increased by 60% and reached 48% of total breaches.","category":"","primary":false},{"title":"Retail Connectivity Failure: Why You Can’t Afford Downtime","url":"https://tnsi.com/resource/pay/retail-connectivity-failure-why-you-cant-afford-downtime-blog/","publisher":"Transaction Network Services","context":"The article references Transaction Network Services research on the estimated cost of retail downtime and its impact on customer churn.","category":"","primary":false},{"title":"Connected Shoppers Report","url":"https://www.salesforce.com/news/stories/ai-agent-retail-trends-2025/","publisher":"Salesforce","context":"The article cites Salesforce’s Connected Shoppers Report for the finding that 75 percent of retailers view AI agents as essential to compete.","category":"","primary":false},{"title":"2026 CISO Benchmark Report","url":"https://rhisac.org/press-release/ciso-benchmark-2026/","publisher":"RH-ISAC","context":"The article cites RH-ISAC’s 2026 CISO Benchmark Report for retail and hospitality CISO concerns about data leakage through public AI tools.","category":"","primary":false}],"body":"\u003cp\u003eRetail security teams are being asked to answer where customer data lives, who can access it, whether checkout would survive a network failure, and whether AI agents can be inspected while operating inside guardrails. The article explains that customer information no longer stays in one place for larger retailers, because cloud platforms, AI applications, store systems, and partner platforms create more paths for data to move. It argues that every purchase can produce payment, loyalty, inventory, and fulfillment data that is duplicated through exports, downloads, and unmanaged app sharing.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that this loss of data lineage makes it harder for security teams to know where information originated, who touched it, and where it moved. It cites Verizon’s 2026 retail Data Breach Investigations Report as finding that breaches with third-party involvement increased by 60% from the prior year’s dataset and reached 48% of total breaches. It says retailers need to discover and classify sensitive data across cloud apps, store systems, and partner platforms, trace copies back to their source, and block risky uploads or downloads before they complete.\u003c/p\u003e\n\n\u003cp\u003eThe article also focuses on checkout resilience and AI governance as part of modern retail security. It says point of sale terminals, self-checkout kiosks, handheld scanners, supplier portals, and related systems can create risk when older networks allow broad access, while zero trust network access limits each request to only the access its role requires. It also says SD-WAN can shift checkout traffic to a backup connection when the primary link fails, and that AI agents should be authenticated, access-managed, logged, and checked for unsafe instructions or responses.\u003c/p\u003e\n"},{"n":16,"title":"⚡ Weekly Recap: Chrome 0-Day, Router Hijacks, Coder Supply Chain Attack and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/weekly-recap-chrome-0-day-router.html","time":"14:36","priority":"MAY READ","score":40,"tldr":"This week’s recap highlights active exploitation across browsers, routers, e-commerce platforms, and remote management tools, with critical patches for Chrome, MikroTik RouterOS, Magento/Adobe Commerce, and N-able N-central demanding urgent attention. It also underscores that trusted sources and safer settings can still fail, as seen in supply-chain tampering, text-based QR phishing, and protocol-level information leaks.","briefOverview":"\u003cp\u003eThis weekly recap covers multiple major security developments, including critical N-able N-central flaws, an actively exploited Google Chrome zero-day, MikroTik RouterOS attacks, and an unpatched Magento and Adobe Commerce zero-day. N-able released hotfixes for authentication bypass and pre-authenticated remote code execution issues, while Huntress reported signs that attackers may be leveraging some of the N-central flaws. Google also patched CVE-2026-85046, a V8 type confusion bug in Chrome that the company said has an exploit in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights attacks affecting routers, online stores, developer infrastructure, and user accounts. CERT Polska warned that attackers are exploiting the MikroTrick chain in MikroTik RouterOS to potentially take full control of devices without authentication when SSH remote access is supported. Sansec reported that Magento and Adobe Commerce storefronts are being compromised through StyleSmuggler to inject malicious code and deploy backdoors, while Coder said attackers abused its Cloudflare infrastructure to deliver malicious Terraform modules that stole credentials and secrets.\u003c/p\u003e\n\n\u003cp\u003eThe recap also emphasizes that defensive assumptions can fail even when users or organizations take common precautions. Attackers used QR codes built from text and markup so they still appear when email images are blocked, and SNMPv3 was described as leaking pre-authentication signals that can help outsiders identify vendors, valid usernames, and likely encryption settings. The article concludes that trusted sources, safer settings, and being fully patched are not enough by themselves, and that logs are needed to investigate whether attackers already gained access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able released hotfixes for severe N-central flaws, including CVE-2026-86218 with a CVSS score of 10.0, while Huntress reported signs that attackers may be leveraging CVE-2026-86206 or CVE-2026-86207.","Google patched 12 Chrome vulnerabilities, including CVE-2026-85046, a high-severity V8 type confusion flaw that Google said has an exploit in the wild.","CERT Polska warned that attackers are actively exploiting a MikroTik RouterOS zero-day chain called MikroTrick, which can allow unauthenticated full device takeover when remote SSH access is supported.","Sansec reported that Magento and Adobe Commerce storefronts are being compromised through an unpatched zero-day called StyleSmuggler to inject a backdoor into online stores.","Coder said attackers compromised its Cloudflare infrastructure and added unauthorized registry servers that delivered malicious Terraform modules containing credential-stealing code."],"insights":["Blocking email images is not enough to stop all QR-code phishing because attackers can build a scannable QR code directly from text and markup in the email body.","A system being fully patched does not prove it was not compromised, as Huntress investigated a compromised customer N-central environment that was described as fully patched but had limited historical logging available on the appliance.","SNMPv3 deployments can still expose useful pre-login clues to outsiders, including vendor identity, valid usernames, and likely encryption settings, even though SNMPv3 is described as the secure standard for network management.","The Coder incident shows that attackers can abuse trusted delivery infrastructure by changing registry routing so users receive malicious modules from a lookalike source without necessarily compromising the software project’s code repository itself.","The article emphasizes that responders should preserve and review logs, because patch status alone may not provide enough evidence to determine whether attackers already gained access."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 4 – CVE-2026-86218","url":"https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/","publisher":"N-able","context":"The article cites N-able hotfix information for a maximum-severity N-central flaw that could allow pre-authenticated remote code execution.","category":"","primary":false},{"title":"N-central 2026.3 Hotfix 3 – CVE-2026-86206 and CVE-2026-86207","url":"https://status.n-able.com/2026/09/05/n-central-2026-3-hotfix-3-cve-2026-86206-and-cve-2026-86207/","publisher":"N-able","context":"The article references N-able hotfixes for two severe N-central flaws that could allow authentication bypass and full platform access.","category":"","primary":false},{"title":"MikroTik RouterOS CVE Advisory","url":"https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve/","publisher":"CERT Polska","context":"The article cites CERT Polska’s warning that attackers are actively exploiting MikroTik RouterOS flaws in the MikroTrick chain.","category":"","primary":false},{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_01882797386.html","publisher":"Google Chrome Releases","context":"The article references Google’s Chrome update that patched CVE-2026-85046, a V8 flaw with an exploit in the wild.","category":"","primary":false},{"title":"Coder Security Advisory GHSA-vx42-ghc9-gw65","url":"https://github.com/coder/coder/security/advisories/GHSA-vx42-ghc9-gw65","publisher":"Coder","context":"The article cites Coder’s advisory describing compromised Cloudflare infrastructure and malicious Terraform modules served through unauthorized registry servers.","category":"","primary":false},{"title":"Inside Knight Office M365 AitM Attack","url":"https://www.huntress.com/blog/inside-knight-office-m365-aitm-attack","publisher":"Huntress","context":"The article references Huntress research on the Knight Office Microsoft 365 adversary-in-the-middle phishing kit.","category":"","primary":false},{"title":"SNMPv3 Was Supposed to Be the Fix","url":"https://www.malanta.ai/blog-posts/snmpv3-was-supposed-to-be-the-fix","publisher":"Malanta","context":"The article cites Malanta’s findings that SNMPv3 can leak pre-authentication signals such as vendor identity, valid usernames, and likely encryption settings.","category":"","primary":false},{"title":"CISA Cybersecurity Advisory AA26-194A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-194a","publisher":"CISA","context":"The article mentions this CISA advisory in the context of urging upgrades to SNMPv3 while discussing remaining protocol-level exposure.","category":"","primary":false},{"title":"Blog: Text-Rendered QR Phishing in the PhishU Framework","url":"https://phishu.net/blogs/blog-text-rendered-qr-phishing-in-the-phishu-framework.html","publisher":"PhishU","context":"The article quotes PhishU’s analysis explaining how QR codes made from markup and text can still appear when email images are blocked.","category":"","primary":false},{"title":"Exodus Crypto Wallet Installer RAT","url":"https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat","publisher":"Huntress","context":"The article cites Huntress analysis of a tampered Exodus installer that delivered a hidden VNC and SOCKS proxy remote access tool.","category":"","primary":false},{"title":"What Two Independent Datasets Reveal About Who’s Exploiting Your Perimeter","url":"https://www.sentinelone.com/blog/what-two-independent-datasets-reveal-about-whos-exploiting-your-perimeter/","publisher":"SentinelOne and Tenable","context":"The article references a joint analysis from SentinelOne and Tenable about attackers routinely targeting edge device vendor ecosystems.","category":"","primary":false},{"title":"HTML Payload Hijacks Email Summarizer","url":"https://www.forcepoint.com/blog/x-labs/html-payload-hijacks-email-summarizer","publisher":"Forcepoint","context":"The article cites Forcepoint research showing that hidden email instructions can manipulate an unguarded LLM email summarizer’s output.","category":"",
