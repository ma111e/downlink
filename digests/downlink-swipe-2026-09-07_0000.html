<script type="application/json" id="dl-articles">[{"n":8,"title":"Hackers exploit new MikroTik RouterOS flaws to hijack routers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-new-mikrotik-routeros-flaws-to-hijack-routers/","time":"10:32","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting two critical MikroTik RouterOS SSH flaws chained as “MikroTrick” to take full control of internet-exposed routers. MikroTik has released fixes, and admins should update immediately or restrict exposed SSH and related services while checking for compromise.","briefOverview":"\u003cp\u003eHackers are exploiting a chain of two recently disclosed MikroTik RouterOS vulnerabilities to take control of routers with SSH services exposed to the internet. CVE-2026-67276 is an SSH authentication bypass caused by incomplete validation of RSA public keys, while CVE-2026-86060 is an SSH privilege escalation flaw involving specially crafted usernames. Poland’s CERT agency, which discovered the flaws with the help of GPT-5.5-cyber and GPT-5.6-sol, dubbed the exploit chain “MikroTrick” and warned that it is being actively exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eMikroTik fixed the vulnerabilities in RouterOS 7.25beta3, 7.24.2, 7.23.4, and 6.49.21, released on September 3, and Poland’s CERT validated the fixes. The updates add a compromise-detection mechanism that looks for known signs of unauthorized configuration changes at startup, disables malicious entries, and logs a critical warning, but CERT cautions that the absence of a compromise marker is not a guarantee that a router is clean. If compromise is suspected, CERT recommends isolating the router, preserving logs and configuration, factory-resetting the device, rebuilding it from a trusted configuration, and rotating passwords, keys, and other secrets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting two recently disclosed MikroTik RouterOS vulnerabilities to take control of devices with SSH services exposed to the internet.","CVE-2026-67276 is an SSH authentication bypass caused by incomplete validation of RSA public keys, and CVE-2026-86060 is an SSH privilege escalation caused by improper handling of specially crafted usernames.","Poland’s CERT agency, which discovered the flaws with the help of GPT-5.5-cyber and GPT-5.6-sol, dubbed the exploit chain “MikroTrick” and warned that it is being exploited in the wild.","MikroTik fixed the vulnerabilities in RouterOS 7.25beta3, 7.24.2, 7.23.4, and 6.49.21, released on September 3, and added a compromise-detection mechanism for known signs of unauthorized configuration changes.","Poland’s CERT recommends isolating suspected compromised routers, preserving logs and configuration, factory-resetting and rebuilding from a trusted configuration, rotating secrets, and restricting exposed SSH, WWW/WWW-SSL, and bandwidth-test services if updates cannot be applied immediately."],"insights":["MikroTik’s new compromise-detection mechanism can flag and disable known malicious configuration changes at startup, but Poland’s CERT warns that no warning marker does not prove the router is clean.","MikroTik says not all configurations are affected, but it withheld configuration details to give users time to apply updates, making patching the safer action than trying to determine exposure from configuration alone.","The article notes that 122,500 MikroTik devices had an exposed SSH interface as of September 5, showing a large pool of potentially reachable devices even though the exact number vulnerable was not determined.","Poland’s CERT recommends rebuilding suspected compromised routers from a trusted configuration rather than simply cleaning individual settings, and also rotating passwords, keys, and other secrets.","The listed indicators of compromise include unusual SSH log entries involving user “-2,” a highly privileged “ops” account, and two IP addresses associated with confirmed or attempted MikroTrick activity."],"referencedReports":[{"title":"Vulnerabilities in MikroTik RouterOS actively exploited","url":"https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/","publisher":"CERT Polska","context":"The article cites Poland’s CERT advisory warning that the MikroTrick vulnerability chain is being actively exploited against internet-accessible RouterOS devices.","category":"","primary":false},{"title":"September 2026 Vulnerability","url":"https://mikrotik.com/supportsec/september-2026-vulnerability","publisher":"MikroTik","context":"The article references MikroTik’s security advisory announcing fixes for the RouterOS vulnerabilities in several released versions.","category":"","primary":false}],"body":"\u003cp\u003eHackers are exploiting a chain of two recently disclosed MikroTik RouterOS vulnerabilities to take control of routers with SSH services exposed to the internet. CVE-2026-67276 is an SSH authentication bypass caused by incomplete validation of RSA public keys, while CVE-2026-86060 is an SSH privilege escalation flaw involving specially crafted usernames. Poland’s CERT agency, which discovered the flaws with the help of GPT-5.5-cyber and GPT-5.6-sol, dubbed the exploit chain “MikroTrick” and warned that it is being actively exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eMikroTik fixed the vulnerabilities in RouterOS 7.25beta3, 7.24.2, 7.23.4, and 6.49.21, released on September 3, and Poland’s CERT validated the fixes. The updates add a compromise-detection mechanism that looks for known signs of unauthorized configuration changes at startup, disables malicious entries, and logs a critical warning, but CERT cautions that the absence of a compromise marker is not a guarantee that a router is clean. If compromise is suspected, CERT recommends isolating the router, preserving logs and configuration, factory-resetting the device, rebuilding it from a trusted configuration, and rotating passwords, keys, and other secrets.\u003c/p\u003e\n"},{"n":21,"title":"StyleSmuggler fix: patch the Magento and Adobe Commerce RCE","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/stylesmuggler-fix","time":"11:46","priority":"MUST READ","score":96,"tldr":"StyleSmuggler is an actively exploited unauthenticated RCE affecting current Magento Open Source and Adobe Commerce versions, with no Adobe patch available yet. Aikido has released drop-in fixes, while non-customers are advised to disable GraphQL temporarily and check for signs of compromise.","briefOverview":"\u003cp\u003eStyleSmuggler is a new zero-day affecting every current version of Magento Open Source and Adobe Commerce, giving unauthenticated attackers remote code execution. Sansec reported that exploitation began on September 4, 2026, and the article says Adobe had not yet published an advisory, assigned a CVE, or released a patch or workaround. Aikido Intel rated the issue critical for Magento Open Source, Adobe Commerce, and the Magento Cloud metapackage.\u003c/p\u003e\n\n\u003cp\u003eThe exploit works in two stages, starting with PHP injection through style properties in a GraphQL request. The payload is written into a Magento-generated file, such as a checkout failure report, and later executes when Magento renders a Payment Transaction Failed Reminder email. The email does not need to be delivered because the code runs server-side during template rendering.\u003c/p\u003e\n\n\u003cp\u003eAikido Libraries released drop-in fixes for multiple affected branches that sanitize template styles before Magento’s engine processes them. The article says teams that cannot patch immediately can temporarily disable GraphQL, although this can take headless or PWA storefronts offline and does not fix the underlying flaw. Confirmed intrusions have installed a persistent Rust-based backdoor, putting customer personal information, payment transaction details, admin credentials, database contents, and shopper-facing skimmer injection risks at stake.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StyleSmuggler is a new zero-day that gives unauthenticated attackers remote code execution against every current version of Magento Open Source and Adobe Commerce, and it has been under active exploitation since September 4.","Adobe had not published an advisory, assigned a CVE identifier, or released a patch or workaround for StyleSmuggler as of the article’s writing.","Aikido Libraries released drop-in fixes for multiple affected branches, including 2.3.1-p12007002+aikido, 2.4.7-p1012007002+aikido, and 2.4.8-p512007002+aikido.","The exploit uses a GraphQL request to inject PHP through style properties and later executes when Magento renders a Payment Transaction Failed Reminder email.","Confirmed intrusions have installed a persistent Rust-based backdoor disguised as a kernel thread, creating risks to customer personal information, payment transaction details, admin credentials, database contents, and shopper-facing skimmer injections."],"insights":["Disabling GraphQL is only an interim mitigation because it blocks the current entry point but does not fix the underlying flaw, and it can take headless or PWA storefronts offline.","The payload can execute even if the Payment Transaction Failed Reminder email is never delivered, because the code runs during server-side template rendering.","Being fully patched does not guarantee protection, since one confirmed victim was running 2.4.6-p15 with the July and August 2026 security patches applied.","Incident response should account for delayed activation, because the observed Rust-based backdoor can remain dormant for hours before doing anything."],"referencedReports":[{"title":"StyleSmuggler","url":"https://sansec.io/research/stylesmuggler","publisher":"Sansec","context":"The article cites Sansec's research as the public disclosure confirming StyleSmuggler exploitation and reproducing the attack chain.","category":"","primary":false}],"body":"\u003cp\u003eStyleSmuggler is a new zero-day affecting every current version of Magento Open Source and Adobe Commerce, giving unauthenticated attackers remote code execution. Sansec reported that exploitation began on September 4, 2026, and the article says Adobe had not yet published an advisory, assigned a CVE, or released a patch or workaround. Aikido Intel rated the issue critical for Magento Open Source, Adobe Commerce, and the Magento Cloud metapackage.\u003c/p\u003e\n\n\u003cp\u003eThe exploit works in two stages, starting with PHP injection through style properties in a GraphQL request. The payload is written into a Magento-generated file, such as a checkout failure report, and later executes when Magento renders a Payment Transaction Failed Reminder email. The email does not need to be delivered because the code runs server-side during template rendering.\u003c/p\u003e\n\n\u003cp\u003eAikido Libraries released drop-in fixes for multiple affected branches that sanitize template styles before Magento’s engine processes them. The article says teams that cannot patch immediately can temporarily disable GraphQL, although this can take headless or PWA storefronts offline and does not fix the underlying flaw. Confirmed intrusions have installed a persistent Rust-based backdoor, putting customer personal information, payment transaction details, admin credentials, database contents, and shopper-facing skimmer injection risks at stake.\u003c/p\u003e\n"},{"n":2,"title":"Magento StyleSmuggler zero-day exploited to deploy Linux backdoor","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/magento-stylesmuggler-zero-day-exploited-to-deploy-linux-backdoor/","time":"16:50","priority":"MUST READ","score":95,"tldr":"A Magento and Adobe Commerce zero-day dubbed StyleSmuggler is being actively exploited to install a Linux backdoor, including on fully patched systems. Until Adobe releases a fix, admins should consider disabling GraphQL and check for suspicious failed-payment emails, cron jobs, and disguised kworker or fc-cache processes.","briefOverview":"\u003cp\u003eA zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited in attacks to deploy a backdoor. Sansec recorded the first exploitation incident on September 4 against a target running the latest security updates. Adobe Enterprise Support confirmed it was working on a fix, but did not provide a release timeline.\u003c/p\u003e\n\n\u003cp\u003eMagento is an Adobe open-source e-commerce platform installed on more than 160,000 websites, including 14,000 of the top 1 million sites. The exploit observed by Sansec abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email, which triggers code execution. Successful exploitation installs a small Rust-based backdoor as a background process, and the attacker also adds a cron job that repeats every 30 minutes for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor has been disguised as [kworker/u:8:0], while newer versions disguise the process as fc-cache and copy it to ~/.cache/fontconfig/fc-cache. Earlier samples used TLS/WebSockets for command-and-control communication, while newer versions disguise traffic as NTP by sending UDP packets to port 123 and using hostnames resembling time-syncing infrastructure. Until fixes are available, Sansec recommends disabling GraphQL and watching for unexpected Magento “Payment Transaction Failed Reminder” emails, suspicious processes, cron entries, and temporary files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited to deploy a backdoor.","Sansec recorded the first exploitation incident on September 4 against a target running the latest security updates.","The exploit abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email that triggers code execution.","Successful exploitation installs a small Rust-based backdoor as a background process, with newer versions disguising it as fc-cache and copying it to ~/.cache/fontconfig/fc-cache.","Sansec recommends disabling GraphQL as a mitigation until Adobe releases fixes for StyleSmuggler."],"insights":["Fully updated Magento and Adobe Commerce systems may still be exposed, because the first observed exploitation hit a target running the latest security updates.","A sudden increase in Magento “Payment Transaction Failed Reminder” emails is a practical early warning sign of possible exploitation.","The backdoor’s newer versions try to blend in with normal server activity by disguising themselves as fc-cache and making network traffic look like NTP time-sync traffic over UDP port 123.","The malware checks Linux’s TracerPid value and will install but not beacon when tracing is detected, which may make some analysis or monitoring efforts miss active infections.","Rotating Magento credentials is recommended if compromise is suspected, indicating that attackers may gain access requiring credential cleanup even though Sansec did not observe follow-on activity."],"referencedReports":[{"title":"StyleSmuggler 0day","url":"https://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article cites Sansec’s research for indicators of exploitation and recommended monitoring steps for the Magento StyleSmuggler zero-day.","category":"","primary":false}],"body":"\u003cp\u003eA zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited in attacks to deploy a backdoor. Sansec recorded the first exploitation incident on September 4 against a target running the latest security updates. Adobe Enterprise Support confirmed it was working on a fix, but did not provide a release timeline.\u003c/p\u003e\n\n\u003cp\u003eMagento is an Adobe open-source e-commerce platform installed on more than 160,000 websites, including 14,000 of the top 1 million sites. The exploit observed by Sansec abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email, which triggers code execution. Successful exploitation installs a small Rust-based backdoor as a background process, and the attacker also adds a cron job that repeats every 30 minutes for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor has been disguised as [kworker/u:8:0], while newer versions disguise the process as fc-cache and copy it to ~/.cache/fontconfig/fc-cache. Earlier samples used TLS/WebSockets for command-and-control communication, while newer versions disguise traffic as NTP by sending UDP packets to port 123 and using hostnames resembling time-syncing infrastructure. Until fixes are available, Sansec recommends disabling GraphQL and watching for unexpected Magento “Payment Transaction Failed Reminder” emails, suspicious processes, cron entries, and temporary files.\u003c/p\u003e\n"},{"n":15,"title":"N-able Issues Fourth N-central Hotfix in Five Weeks for Unauthenticated RCE Flaw","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/n-able-issues-fourth-n-central-hotfix.html","time":"08:31","priority":"MUST READ","score":95,"tldr":"N-able released an urgent fourth hotfix for N-central after a critical pre-authentication remote code execution flaw, CVE-2026-86218, was found to affect all on-premises builds before 2026.3.1.14. Customers should patch immediately, especially because N-able’s own notices conflict on whether the flaw has already been exploited in the wild.","briefOverview":"\u003cp\u003eN-able released its fourth hotfix in five weeks for the N-central remote monitoring and management platform, addressing CVE-2026-86218. The flaw has a CVSS 4.0 score of 10.0 and could allow remote code execution on an N-central server without authentication. It affects every on-premises N-central build before 2026.3.1.14, including systems already updated to Hotfix 3.\u003c/p\u003e\n\n\u003cp\u003eN-able said hosted N-central instances have already been patched, while on-premises customers are instructed to upgrade to 2026.3.1.14 immediately. The release notes list direct upgrade paths from several earlier versions and state that agents do not need to be upgraded for protection from this CVE. The company’s materials provide no indicators of compromise, interim mitigation, or detection guidance beyond recommending an audit of N-central user accounts for unexpected users.\u003c/p\u003e\n\n\u003cp\u003eN-able’s communications conflict on whether CVE-2026-86218 has been exploited, with the release notes and status post saying there are no confirmed production exploits, while an incident notice says the flaw has been observed being exploited in the wild. Huntress said it could not determine from its own data whether this new CVE was used in a customer compromise it investigated after logs had rotated. The hotfix follows earlier N-central fixes in August and September for authentication bypass, unauthorized API access, and related attack paths, some of which N-able said had been exploited in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able released 2026.3 Hotfix 4 for N-central to address CVE-2026-86218, a CVSS 4.0 score 10.0 static code injection flaw that could allow unauthenticated remote code execution on the N-central server.","CVE-2026-86218 affects every on-premises N-central build before 2026.3.1.14, including systems already updated to Hotfix 3 version 2026.3.1.13.","N-able said hosted N-central instances have already been patched and instructed on-premises customers to upgrade to 2026.3.1.14 immediately.","N-able’s communications conflict on exploitation, with the Hotfix 4 release notes and status post saying there are no confirmed production exploits while an incident notice says the flaw has been observed being exploited in the wild.","The Hotfix 4 materials provide no indicators of compromise, interim mitigation, or detection guidance beyond recommending that administrators audit N-central user accounts for unexpected users."],"insights":["Servers updated to Hotfix 3 are still exposed because Hotfix 4 was released a little over eight hours later for a separate flaw affecting build 2026.3.1.13.","N-able’s own public materials give conflicting messages about exploitation, with one channel saying there are no confirmed production exploits and another saying the flaw has been observed being exploited in the wild.","The absence of indicators of compromise or detection guidance is especially important because Huntress said logs had already rotated in one investigated compromise, limiting its ability to determine which flaw was used.","Huntress advised restricting console access with IP allowlisting or a VPN, and even considering taking internet-reachable servers offline until the hotfix is applied, despite N-able providing no interim mitigation in its notices.","The repeated hotfixes show continued pressure on the N-central 2026.3 line, with four hotfixes issued since August 2 across three distinct sets of vulnerabilities."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 4 – CVE-2026-86218","url":"https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/","publisher":"N-able","context":"The article cites N-able’s Hotfix 4 status post announcing the fix for CVE-2026-86218 and stating that N-able had no confirmed production exploitation.","category":"","primary":false},{"title":"N-central 2026.3 HF4 Release Notes","url":"https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF4_Release_Notes.htm","publisher":"N-able","context":"The article cites N-able’s release notes for affected versions, upgrade paths, hosted instance status, agent requirements, and the company’s statement about exploitation.","category":"","primary":false},{"title":"N-central Immediate Hotfix Required","url":"https://uptime.n-able.com/event/201814/","publisher":"N-able","context":"The article cites N-able’s incident notice because it says the newly identified flaw has been observed being exploited in the wild, which conflicts with other N-able communications.","category":"","primary":false},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress’s analysis of N-central compromises, including its investigation timeline, proof-of-concept reproduction, and mitigation advice.","category":"","primary":false},{"title":"N-central 2026.3 Hotfix 3 – CVE-2026-86206 and CVE-2026-86207","url":"https://status.n-able.com/2026/09/05/n-central-2026-3-hotfix-3-cve-2026-86206-and-cve-2026-86207/","publisher":"N-able","context":"The article cites N-able’s Hotfix 3 status post describing two earlier flaws that N-able said were unrelated to CVE-2026-86218.","category":"","primary":false}],"body":"\u003cp\u003eN-able released its fourth hotfix in five weeks for the N-central remote monitoring and management platform, addressing CVE-2026-86218. The flaw has a CVSS 4.0 score of 10.0 and could allow remote code execution on an N-central server without authentication. It affects every on-premises N-central build before 2026.3.1.14, including systems already updated to Hotfix 3.\u003c/p\u003e\n\n\u003cp\u003eN-able said hosted N-central instances have already been patched, while on-premises customers are instructed to upgrade to 2026.3.1.14 immediately. The release notes list direct upgrade paths from several earlier versions and state that agents do not need to be upgraded for protection from this CVE. The company’s materials provide no indicators of compromise, interim mitigation, or detection guidance beyond recommending an audit of N-central user accounts for unexpected users.\u003c/p\u003e\n\n\u003cp\u003eN-able’s communications conflict on whether CVE-2026-86218 has been exploited, with the release notes and status post saying there are no confirmed production exploits, while an incident notice says the flaw has been observed being exploited in the wild. Huntress said it could not determine from its own data whether this new CVE was used in a customer compromise it investigated after logs had rotated. The hotfix follows earlier N-central fixes in August and September for authentication bypass, unauthorized API access, and related attack paths, some of which N-able said had been exploited in the wild.\u003c/p\u003e\n"},{"n":3,"title":"Mathspace discloses data breach affecting over 1 million people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/mathspace-discloses-data-breach-affecting-over-1-million-people/","time":"13:05","priority":"MUST READ","score":94,"tldr":"Mathspace says attackers exploited a vulnerability in its self-hosted Metabase reporting system to steal personal data belonging to 1,079,819 students, staff, and parents or guardians in Australia and New Zealand. The company says passwords, credentials, tokens, and academic records were not exposed, but affected users should watch for suspicious account activity and phishing attempts.","briefOverview":"\u003cp\u003eMathspace disclosed that attackers stole data from more than 1 million students, school staff, parents, and guardians after breaching its Metabase internal reporting system. The company confirmed the data theft on September 3, 2026, after attackers first gained access on August 10 and downloaded data from its Australian reporting database on August 27. Mathspace said 1,079,819 people were affected, and only people in Australia and New Zealand were impacted.\u003c/p\u003e\n\n\u003cp\u003eMathspace CTO Alvin Savoy said the attackers exploited a security vulnerability in the company’s self-hosted Metabase installation, which allowed them to obtain administrator access without a legitimate login. The company said no academic records, learning activities, results, assessment records, passwords, authentication tokens, SSO credentials, or API credentials were exposed. However, Mathspace warned affected students and school staff to watch for suspicious account activity, including account-detail changes and password-reset messages.\u003c/p\u003e\n\n\u003cp\u003eThe article says the Mathspace breach is part of a wider set of incidents involving Metabase instances at multiple companies worldwide over the last month. BleepingComputer previously reported that threat actors exploited a critical Metabase SQL injection zero-day vulnerability to gain administrator access and steal data from customer instances. The article also says Framework, Tally, and Trezor’s shipping and logistics provider ShipMonk were among affected organizations, and that ShinyHunters added Metabase to its dark web leak site on August 11.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mathspace disclosed that attackers stole personal information belonging to 1,079,819 students, school staff, and parents or guardians in Australia and New Zealand.","Mathspace said the attackers exploited a security vulnerability in its self-hosted Metabase internal reporting system to obtain administrator access without a legitimate login.","The attackers gained access to Mathspace systems on August 10, downloaded data from the Australian reporting database on August 27, and Mathspace confirmed the data theft on September 3, 2026.","Mathspace said no academic records, learning activities, results, assessment records, passwords, authentication tokens, SSO credentials, or API credentials were exposed.","The incident is part of a wider set of data theft attacks involving compromised Metabase instances at companies including Trezor’s provider ShipMonk, Framework, and Tally."],"insights":["Even though Mathspace says the exposed data did not include records linking users to schools, it acknowledged that schools with identifiable email domains may still be possible to associate with affected accounts.","Mathspace warned affected users to watch for account-detail changes and password-reset messages despite saying passwords, authentication tokens, SSO credentials, and API credentials were not exposed.","The attackers had access to Mathspace systems for more than two weeks before downloading data from the Australian reporting database, according to the timeline provided by the company.","The Mathspace incident was not isolated, as Framework, Tally, and ShipMonk-related Trezor data exposure were also tied in the article to compromised Metabase instances."],"referencedReports":[],"body":"\u003cp\u003eMathspace disclosed that attackers stole data from more than 1 million students, school staff, parents, and guardians after breaching its Metabase internal reporting system. The company confirmed the data theft on September 3, 2026, after attackers first gained access on August 10 and downloaded data from its Australian reporting database on August 27. Mathspace said 1,079,819 people were affected, and only people in Australia and New Zealand were impacted.\u003c/p\u003e\n\n\u003cp\u003eMathspace CTO Alvin Savoy said the attackers exploited a security vulnerability in the company’s self-hosted Metabase installation, which allowed them to obtain administrator access without a legitimate login. The company said no academic records, learning activities, results, assessment records, passwords, authentication tokens, SSO credentials, or API credentials were exposed. However, Mathspace warned affected students and school staff to watch for suspicious account activity, including account-detail changes and password-reset messages.\u003c/p\u003e\n\n\u003cp\u003eThe article says the Mathspace breach is part of a wider set of incidents involving Metabase instances at multiple companies worldwide over the last month. BleepingComputer previously reported that threat actors exploited a critical Metabase SQL injection zero-day vulnerability to gain administrator access and steal data from customer instances. The article also says Framework, Tally, and Trezor’s shipping and logistics provider ShipMonk were among affected organizations, and that ShinyHunters added Metabase to its dark web leak site on August 11.\u003c/p\u003e\n"},{"n":5,"title":"N-able patches max severity N-central flaw amid ongoing attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/n-able-patches-max-severity-n-central-flaw-amid-ongoing-attacks/","time":"06:17","priority":"MUST READ","score":94,"tldr":"N-able issued an emergency hotfix for a maximum-severity RCE flaw in its N-central RMM platform and urged on-premises customers to upgrade immediately. Although N-able has not confirmed exploitation, Huntress warned of possible zero-day activity and said systems patched only to the previous hotfix remain vulnerable.","briefOverview":"\u003cp\u003eN-able released an emergency hotfix for a maximum-severity remote code execution flaw affecting its N-central remote monitoring and management platform. The flaw, tracked as CVE-2026-86218, allows threat actors without privileges to execute malicious code on unpatched N-central instances exposed online in low-complexity attacks. N-able addressed the issue with N-central 2026.3 Hotfix 4 and urged on-premises customers to upgrade immediately.\u003c/p\u003e\n\n\u003cp\u003eN-able said it has no confirmation that CVE-2026-86218 has been exploited in production environments, but warned that unpatched systems remain at risk. Huntress flagged the flaw as a potential zero-day and said it could not determine whether this new CVE or two earlier high-severity N-central vulnerabilities were used in a compromised customer environment because logs had already rotated. Shadowserver Foundation tracks nearly 1,500 N-central servers exposed online, most located in the United States and Europe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able released N-central 2026.3 Hotfix 4 to address CVE-2026-86218, a maximum-severity remote code execution flaw in its N-central remote monitoring and management platform.","CVE-2026-86218 allows threat actors without privileges to execute malicious code on unpatched N-central instances exposed online in low-complexity attacks.","N-able said it has no confirmation that CVE-2026-86218 has been exploited in production environments, but urged on-premises N-central customers to upgrade immediately.","Huntress flagged CVE-2026-86218 as a potential zero-day and warned that systems running N-central 2026.3 Hotfix 3 remain vulnerable to the newly disclosed flaw.","Shadowserver Foundation tracks nearly 1,500 N-able N-central servers exposed online, most of them located in the United States and Europe."],"insights":["Customers who applied N-central 2026.3 Hotfix 3 over the weekend are still not fully protected, because Huntress warned that HF3 remains vulnerable to CVE-2026-86218 and HF4 must be applied immediately.","The exploitation picture remains unclear because logs on the compromised customer N-central server had already rotated, preventing Huntress from determining whether CVE-2026-86218 or the earlier CVE-2026-86206 and CVE-2026-86207 flaws were used.","The risk is amplified by exposure: Shadowserver tracks nearly 1,500 internet-facing N-central servers, mostly in the United States and Europe, despite the platform being used to centrally manage client networks and devices.","The article shows a recurring pattern for N-central security issues, noting that one year earlier N-able patched two N-central flaws that were exploited in the wild and that 880 servers remained vulnerable days later."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 4 Release Notes","url":"https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF4_Release_Notes.htm","publisher":"N-able","context":"The article references these release notes as the emergency hotfix addressing CVE-2026-86218.","category":"","primary":false},{"title":"N-central 2026.3 Hotfix 4 - CVE-2026-86218","url":"https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/","publisher":"N-able","context":"The article cites N-able's status advisory urging on-premises N-central customers to upgrade immediately and stating that exploitation had not been confirmed.","category":"","primary":false},{"title":"N-central 2026.3 Hotfix 3 Release Notes","url":"https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF3_Release_Notes.htm","publisher":"N-able","context":"The article references these release notes as the weekend patch for CVE-2026-86206 and CVE-2026-86207.","category":"","primary":false}],"body":"\u003cp\u003eN-able released an emergency hotfix for a maximum-severity remote code execution flaw affecting its N-central remote monitoring and management platform. The flaw, tracked as CVE-2026-86218, allows threat actors without privileges to execute malicious code on unpatched N-central instances exposed online in low-complexity attacks. N-able addressed the issue with N-central 2026.3 Hotfix 4 and urged on-premises customers to upgrade immediately.\u003c/p\u003e\n\n\u003cp\u003eN-able said it has no confirmation that CVE-2026-86218 has been exploited in production environments, but warned that unpatched systems remain at risk. Huntress flagged the flaw as a potential zero-day and said it could not determine whether this new CVE or two earlier high-severity N-central vulnerabilities were used in a compromised customer environment because logs had already rotated. Shadowserver Foundation tracks nearly 1,500 N-central servers exposed online, most located in the United States and Europe.\u003c/p\u003e\n"},{"n":10,"title":"Berlin investigates new data leak after hackers publish stolen login credentials","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/germany-berlin-second-data-breach-city-agencies","time":"11:50","priority":"MUST READ","score":92,"tldr":"Berlin is investigating a new leak of stolen government data, including login credentials, after an August breach of two ministries linked by hackers to the Rhysida ransomware group. Officials say personal data of employees and possibly residents may be exposed, but Berlin has refused to pay the extortion demand.","briefOverview":"\u003cp\u003eGerman authorities are investigating another trove of data stolen from Berlin’s government network after hackers published login credentials and other information over the weekend. The release follows a cyberattack discovered in mid-August that compromised two Berlin ministries responsible for urban development and housing, and for transport, mobility, climate protection and the environment. Berlin’s government said the newly released data includes login credentials but did not say what systems they could access or whether they were still valid.\u003c/p\u003e\n\n\u003cp\u003eBerlin’s data protection authority said attackers stole a large amount of data from the two affected ministries and later published it online. The leak includes personal information about public employees, and data belonging to Berlin residents may also have been exposed. Potentially compromised information includes names, addresses, dates of birth, bank information, email addresses, telephone numbers, correspondence with government agencies and copies of documents submitted to the administration. Berlin has created an additional task force to review the leaked material and identify affected people.\u003c/p\u003e\n\n\u003cp\u003eThe Rhysida ransomware group claimed responsibility for the breach in late August, saying it had stolen 5.79 terabytes of data, but Berlin officials have not publicly attributed the attack to Rhysida or verified the hackers’ claims. Berlin confirmed it received an extortion demand and said it would not pay. Germany’s BSI separately warned about a campaign linked to the same financially motivated hackers behind Rhysida, describing fake CAPTCHA pages that trick visitors into manually running malicious commands. Berlin officials said they had found no evidence that data had been stolen from election systems and that the election environment was secure ahead of the Sept. 20 election.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["German authorities are investigating a newly released trove of data stolen from Berlin’s government network after hackers published login credentials and other information.","The data leak follows a mid-August cyberattack that compromised two Berlin ministries responsible for urban development and housing, and for transport, mobility, climate protection and the environment.","Berlin’s data protection authority said the stolen data includes personal information about public employees and may include data belonging to Berlin residents.","Potentially compromised information includes names, addresses, dates of birth, bank information, email addresses, telephone numbers, correspondence with government agencies and copies of documents submitted to the administration.","The Rhysida ransomware group claimed responsibility for the breach in late August, but Berlin officials have not publicly attributed the attack to Rhysida and said they will not pay the attackers."],"insights":["The newly published login credentials are especially sensitive because Berlin officials did not say what systems they could access or whether they were still valid.","The scale of the stolen data is large enough that authorities are still reviewing the files and created an additional task force to determine who may be affected.","Germany’s BSI connected the broader campaign to fake CAPTCHA pages that trick visitors into manually running malicious commands, showing that ordinary website browsing can be used as an entry point for compromise.","The BSI said stolen information is ultimately published in 92 percent of cases where victims are named on Rhysida’s leak site, underscoring the high likelihood of exposure after a victim is listed.","Despite the breach occurring shortly before Berlin’s Sept. 20 election, officials said they had found no evidence that election systems data was stolen and that the election environment was secure."],"referencedReports":[{"title":"BSI cybersecurity warning 2026-287419-1032","url":"https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032_bits.html","publisher":"Germany’s Federal Office for Information Security (BSI)","context":"The article cites a BSI warning about a cyberattack campaign linked to the financially motivated hackers associated with Rhysida.","category":"","primary":false},{"title":"TerminalFix campaign deploys reverse tunnel through multistage intrusion","url":"https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/","publisher":"Microsoft","context":"The article says the BSI described the campaign as resembling TerminalFix attacks recently documented by Microsoft.","category":"","primary":false}],"body":"\u003cp\u003eGerman authorities are investigating another trove of data stolen from Berlin’s government network after hackers published login credentials and other information over the weekend. The release follows a cyberattack discovered in mid-August that compromised two Berlin ministries responsible for urban development and housing, and for transport, mobility, climate protection and the environment. Berlin’s government said the newly released data includes login credentials but did not say what systems they could access or whether they were still valid.\u003c/p\u003e\n\n\u003cp\u003eBerlin’s data protection authority said attackers stole a large amount of data from the two affected ministries and later published it online. The leak includes personal information about public employees, and data belonging to Berlin residents may also have been exposed. Potentially compromised information includes names, addresses, dates of birth, bank information, email addresses, telephone numbers, correspondence with government agencies and copies of documents submitted to the administration. Berlin has created an additional task force to review the leaked material and identify affected people.\u003c/p\u003e\n\n\u003cp\u003eThe Rhysida ransomware group claimed responsibility for the breach in late August, saying it had stolen 5.79 terabytes of data, but Berlin officials have not publicly attributed the attack to Rhysida or verified the hackers’ claims. Berlin confirmed it received an extortion demand and said it would not pay. Germany’s BSI separately warned about a campaign linked to the same financially motivated hackers behind Rhysida, describing fake CAPTCHA pages that trick visitors into manually running malicious commands. Berlin officials said they had found no evidence that data had been stolen from election systems and that the election environment was secure ahead of the Sept. 20 election.\u003c/p\u003e\n"},{"n":17,"title":"Fake IT Calls Target Executives in Microsoft 365 Data Theft and Extortion Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/microsoft-365-attackers-use-help-desk.html","time":"15:51","priority":"MUST READ","score":92,"tldr":"Threat actors tracked as PREY-0058 are using fake IT help desk calls and adversary-in-the-middle Microsoft 365 login pages to steal executive session tokens, access SaaS data, and extort organizations. Defenders should prioritize phishing-resistant MFA, Conditional Access, and detection of residential-proxy token replay and bulk SharePoint/OneDrive/Exchange access.","briefOverview":"\u003cp\u003eThreat hunters have disclosed details of a widespread data theft and extortion threat cluster targeting Microsoft 365 and other SaaS offerings. Arctic Wolf tracks the activity as PREY-0058 and says it shares significant tradecraft similarities with Mandiant’s UNC6671. The campaign mainly targets directors, vice presidents, and other executive staff.\u003c/p\u003e\n\n\u003cp\u003eThe attacks begin with callers impersonating internal IT or help desk personnel and directing targets to authentication-themed URLs using victim-specific subdomains. These pages lead to operator-controlled Microsoft 365 login flows designed to harvest credentials and MFA approvals so attackers can obtain authenticated session tokens. The captured tokens are then used in session replay attacks from proxy infrastructure such as NodeMaven and from IP addresses matching the victim’s geography and ASN.\u003c/p\u003e\n\n\u003cp\u003eAfter initial access, the threat actors perform discovery in SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands. Arctic Wolf noted that the activity does not involve endpoint malware deployment or network-based lateral movement. The article says targets are primarily in the United States across construction and engineering, healthcare and pharmaceuticals, real estate and property management, finance, and professional services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arctic Wolf is tracking a widespread data theft and extortion threat cluster targeting Microsoft 365 and other SaaS offerings under the name PREY-0058.","The attackers impersonate internal IT or help desk staff in phone calls and direct targets to authentication-themed lure domains that lead to operator-controlled Microsoft 365 login flows.","The campaign mainly targets directors, vice presidents, and other executive staff at U.S. organizations in sectors including construction and engineering, healthcare and pharmaceuticals, real estate, finance, and professional services.","After gaining access, the threat actors conduct discovery in SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands.","Arctic Wolf said defenders can disrupt the activity by detecting anomalous residential-proxy token replay, SharePoint discovery and bulk access, mailbox harvesting, and newly registered authentication-themed lure infrastructure."],"insights":["The campaign does not rely on endpoint malware or network-based lateral movement, making cloud account activity and SaaS access patterns especially important detection points.","The attackers try to make stolen-session sign-ins look normal by using residential proxy infrastructure and IP addresses that match the victim’s geographic location and ASN.","The lure infrastructure is broad and tailored, with hundreds of subdomains found impersonating real companies.","The article notes that names such as PREY-0058, UNC6671, Cinder, and Pink may reflect overlapping affiliates or shared infrastructure rather than a single proven actor identity.","Early post-access activity through Microsoft 365 applications such as “My Signins,” “My Profile,” and “My Apps” can reveal account details and available applications to the attackers."],"referencedReports":[{"title":"Cloud Data Theft Extortion Vishing Proxies","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202609-cloud-data-theft-extortion-vishing-proxies","publisher":"Arctic Wolf","context":"The article says Arctic Wolf is tracking the Microsoft 365 and SaaS data theft and extortion activity as PREY-0058 and links to this technical material.","category":"","primary":false}],"body":"\u003cp\u003eThreat hunters have disclosed details of a widespread data theft and extortion threat cluster targeting Microsoft 365 and other SaaS offerings. Arctic Wolf tracks the activity as PREY-0058 and says it shares significant tradecraft similarities with Mandiant’s UNC6671. The campaign mainly targets directors, vice presidents, and other executive staff.\u003c/p\u003e\n\n\u003cp\u003eThe attacks begin with callers impersonating internal IT or help desk personnel and directing targets to authentication-themed URLs using victim-specific subdomains. These pages lead to operator-controlled Microsoft 365 login flows designed to harvest credentials and MFA approvals so attackers can obtain authenticated session tokens. The captured tokens are then used in session replay attacks from proxy infrastructure such as NodeMaven and from IP addresses matching the victim’s geography and ASN.\u003c/p\u003e\n\n\u003cp\u003eAfter initial access, the threat actors perform discovery in SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands. Arctic Wolf noted that the activity does not involve endpoint malware deployment or network-based lateral movement. The article says targets are primarily in the United States across construction and engineering, healthcare and pharmaceuticals, real estate and property management, finance, and professional services.\u003c/p\u003e\n"},{"n":7,"title":"BigBear Microsoft 365 phishing service bypassed MFA at 258 organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bigbear-microsoft-365-phishing-service-bypassed-mfa-at-258-organizations/","time":"15:39","priority":"SHOULD READ","score":88,"tldr":"BigBear 2.0, an Evilginx2-based phishing-as-a-service platform, bypassed Microsoft 365 MFA at 258 organizations by stealing credentials and authenticated session cookies. CloudSEK found over 5,000 credential records and recommends password resets, session revocation, token refreshes, and phishing-resistant authentication such as FIDO2/WebAuthn.","briefOverview":"\u003cp\u003eA phishing-as-a-service framework called BigBear 2.0 has been used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credentials. CloudSEK researchers gained administrator access to the control panel and found 42 VPS nodes configured to target Microsoft 365. While 461 organizations appeared in the broader targeting dataset, CloudSEK clarified that 258 distinct organizations had at least one completed MFA-bypass compromise.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies after victims complete the multi-factor authentication process. BigBear uses a configuration called “offy” to set up a proxy between the victim and Microsoft’s legitimate authentication infrastructure, allowing attackers to capture credentials, MFA, and session cookies. CloudSEK said the panel exfiltrated 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies, affecting 3,331 unique victim IPs across more than 40 countries.\u003c/p\u003e\n\n\u003cp\u003eCloudSEK also found that BigBear uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and force targets toward weaker authentication methods. The platform uses geo-matched residential proxies for 69 countries to make activity appear less suspicious to Microsoft’s authentication servers. CloudSEK notified law enforcement and several affected organizations, and organizations potentially affected were advised to reset exposed passwords, revoke active sessions, refresh tokens, force re-authentication for high-privileged accounts, enforce phishing-resistant FIDO2/WebAuthn, and use Conditional Access policies requiring managed devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CloudSEK says the BigBear 2.0 phishing-as-a-service framework was used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credential records.","Researchers gained administrator access to the BigBear control panel and found 42 VPS nodes configured to target Microsoft 365 in the observed operation.","The campaign uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies after victims complete the multi-factor authentication process.","CloudSEK reported that the panel exfiltrated 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies, affecting 3,331 unique victim IPs across more than 40 countries.","CloudSEK found that BigBear uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and geo-matched residential proxies for 69 countries to reduce suspicious signals during Microsoft authentication."],"insights":["Geo-location checks alone are not reliable against this campaign because BigBear uses geo-matched residential proxies for 69 countries to make sign-ins appear to come from locations matching victims.","Organizations should not only reset exposed passwords but also revoke active sessions, refresh tokens, and force re-authentication because BigBear captures session cookies that can be replayed after login.","BigBear’s custom JavaScript specifically interferes with FIDO2/WebAuthn authentication to push targets toward weaker authentication methods, making strict enforcement of phishing-resistant authentication important.","The BigBear service appears to support multiple operators because CloudSEK identified at least five affiliate operators receiving stolen credentials in real time through Telegram exfiltration bots.","The administration panel remained online even though the phishing infrastructure had been offline for nearly three weeks, indicating that affected organizations still needed to treat exposed credentials and sessions as a live risk."],"referencedReports":[{"title":"Tracking BigBear 2.0 Evilginx2 Phishing Campaign","url":"https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign","publisher":"CloudSEK","context":"The article cites CloudSEK's report as the source of findings about BigBear 2.0's stolen credential records, affected organizations, infrastructure, and affiliate operators.","category":"","primary":false}],"body":"\u003cp\u003eA phishing-as-a-service framework called BigBear 2.0 has been used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credentials. CloudSEK researchers gained administrator access to the control panel and found 42 VPS nodes configured to target Microsoft 365. While 461 organizations appeared in the broader targeting dataset, CloudSEK clarified that 258 distinct organizations had at least one completed MFA-bypass compromise.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies after victims complete the multi-factor authentication process. BigBear uses a configuration called “offy” to set up a proxy between the victim and Microsoft’s legitimate authentication infrastructure, allowing attackers to capture credentials, MFA, and session cookies. CloudSEK said the panel exfiltrated 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies, affecting 3,331 unique victim IPs across more than 40 countries.\u003c/p\u003e\n\n\u003cp\u003eCloudSEK also found that BigBear uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and force targets toward weaker authentication methods. The platform uses geo-matched residential proxies for 69 countries to make activity appear less suspicious to Microsoft’s authentication servers. CloudSEK notified law enforcement and several affected organizations, and organizations potentially affected were advised to reset exposed passwords, revoke active sessions, refresh tokens, force re-authentication for high-privileged accounts, enforce phishing-resistant FIDO2/WebAuthn, and use Conditional Access policies requiring managed devices.\u003c/p\u003e\n"},{"n":13,"title":"Rogue ScreenConnect Clients Spread Four-Stage VBScript Chain to Newly Connected Hosts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/rogue-screenconnect-clients-spread-four.html","time":"11:36","priority":"SHOULD READ","score":88,"tldr":"Attackers are abusing rogue ConnectWise ScreenConnect clients to run a four-stage VBScript/PowerShell chain that can install backdoors, persistence tools, tunneling utilities, or an XMRig miner. Huntress says the activity has worm-like behavior because infected clients can push the same scripts to newly connected ScreenConnect hosts, and ConnectWise recommends disabling file transfers until a fix is available.","briefOverview":"\u003cp\u003eCybersecurity researchers at Huntress disclosed worm-like activity that abuses ConnectWise ScreenConnect to distribute a malicious Visual Basic Script payload to newly connected systems. Three unrelated August 2026 incidents used different initial access methods: a Quick Assist tech-support scam, a phishing-delivered MSI installer, and a fake Geek Squad refund form lure. After rogue ScreenConnect clients were installed, they repeatedly spawned \u003ccode\u003ewscript.exe\u003c/code\u003e to run scripts named \u003ccode\u003e1.vbs\u003c/code\u003e, \u003ccode\u003e2.vbs\u003c/code\u003e, \u003ccode\u003e3.vbs\u003c/code\u003e, and \u003ccode\u003e4.vbs\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe four-stage chain profiles the host, records a state value in \u003ccode\u003e%TEMP%\\value.txt\u003c/code\u003e, downloads staged content from Dropbox, selects payloads based on the recorded state, and uses PowerShell to decrypt and run later-stage content. Huntress detected different payload branches, including a user-level ScreenConnect backdoor, tooling for UAC bypass and persistence, and tunneling utilities with an XMRig cryptocurrency miner. In some cases, the scripts are written to \u003ccode\u003eC:\\Users\\Public\\Libraries\\Default\\Lib\\Lib1\u003c/code\u003e, enabling compromised hosts to deliver the malicious chain when a new Host connection is observed.\u003c/p\u003e\n\n\u003cp\u003eHuntress said the behavior effectively turns an infected ScreenConnect client into a content-delivery mechanism and can cause a server-side Host system to receive and execute the same four-stage script chain. The company recommended that affected hosts be re-imaged from known-good media or receive a clean operating system install. ConnectWise issued an advisory stating that the issue affects file transfer behavior in ScreenConnect Remote Access Support and Access sessions across Cloud and On-Premise deployments, and advised customers to disable technicians’ file transfer permissions until a fix is available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress disclosed three unrelated August 2026 incidents in which attackers used different initial access methods to deploy rogue ConnectWise ScreenConnect clients that executed a four-stage VBScript chain.","The observed initial access methods were a Quick Assist tech-support scam, a phishing-delivered MSI installer, and a fake Geek Squad refund form lure.","The four scripts, named 1.vbs through 4.vbs, profile the host, retrieve staged data from Dropbox, select payloads based on host state values, and launch PowerShell to decrypt and run later-stage payloads.","Detected payload branches included a user-level ScreenConnect backdoor, tooling for UAC bypass and persistence, and tunneling utilities with an XMRig cryptocurrency miner.","ConnectWise said the issue affects file transfer behavior in both Cloud and On-Premise ScreenConnect deployments and advised customers to disable technicians’ file transfer permissions until a fix is available."],"insights":["The same VBScript chain appeared after three different lures, which means defenders cannot rely on a single initial access pattern to find this activity.","The infection logic uses host profiling results to choose different payloads, so two affected systems may show different follow-on behavior depending on installed security tools and existing ScreenConnect presence.","The activity can retrigger on later reconnections because the client records each ConnectionID only during the active session and removes it after disconnecting.","Huntress recommended re-imaging affected hosts from known-good media or performing a clean operating system install, indicating that normal cleanup may be insufficient for impacted machines.","ConnectWise’s interim mitigation is highly specific: remove TransferFiles or legacy TransferFilesInSession permissions from roles across every relevant session group."],"referencedReports":[{"title":"Rogue ScreenConnect Installations","url":"https://www.huntress.com/blog/rogue-screenconnect-installations","publisher":"Huntress","context":"The article cites Huntress as the source that disclosed the worm-like activity abusing ScreenConnect and details the observed incidents and four-stage VBScript chain.","category":"","primary":false},{"title":"ConnectWise Advisory","url":"https://www.connectwise.com/company/trust/advisories","publisher":"ConnectWise","context":"The article references a ConnectWise advisory stating that the issue affects file transfer behavior in ScreenConnect Cloud and On-Premise deployments and provides mitigation steps.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Huntress disclosed worm-like activity that abuses ConnectWise ScreenConnect to distribute a malicious Visual Basic Script payload to newly connected systems. Three unrelated August 2026 incidents used different initial access methods: a Quick Assist tech-support scam, a phishing-delivered MSI installer, and a fake Geek Squad refund form lure. After rogue ScreenConnect clients were installed, they repeatedly spawned \u003ccode\u003ewscript.exe\u003c/code\u003e to run scripts named \u003ccode\u003e1.vbs\u003c/code\u003e, \u003ccode\u003e2.vbs\u003c/code\u003e, \u003ccode\u003e3.vbs\u003c/code\u003e, and \u003ccode\u003e4.vbs\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe four-stage chain profiles the host, records a state value in \u003ccode\u003e%TEMP%\\value.txt\u003c/code\u003e, downloads staged content from Dropbox, selects payloads based on the recorded state, and uses PowerShell to decrypt and run later-stage content. Huntress detected different payload branches, including a user-level ScreenConnect backdoor, tooling for UAC bypass and persistence, and tunneling utilities with an XMRig cryptocurrency miner. In some cases, the scripts are written to \u003ccode\u003eC:\\Users\\Public\\Libraries\\Default\\Lib\\Lib1\u003c/code\u003e, enabling compromised hosts to deliver the malicious chain when a new Host connection is observed.\u003c/p\u003e\n\n\u003cp\u003eHuntress said the behavior effectively turns an infected ScreenConnect client into a content-delivery mechanism and can cause a server-side Host system to receive and execute the same four-stage script chain. The company recommended that affected hosts be re-imaged from known-good media or receive a clean operating system install. ConnectWise issued an advisory stating that the issue affects file transfer behavior in ScreenConnect Remote Access Support and Access sessions across Cloud and On-Premise deployments, and advised customers to disable technicians’ file transfer permissions until a fix is available.\u003c/p\u003e\n"},{"n":14,"title":"JSCeal Malware Can Bypass Google Authentication Using Stolen Session Cookies","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/jsceal-malware-can-bypass-google.html","time":"07:53","priority":"SHOULD READ","score":88,"tldr":"JSCeal is an actively developed malware campaign targeting crypto traders through fake trading sites and malicious ads, stealing browser cookies, passwords, OAuth tokens, and other data. Researchers found it can replay stolen Google session cookies to bypass authentication and also intercept or modify traffic for cryptocurrency services like Binance, Bybit, and Ledger.","briefOverview":"\u003cp\u003eCheck Point Research analyzed JSCeal, a compiled V8 JavaScript malware used in campaigns that redirect users from malicious Facebook and Google ads to fake cryptocurrency trading sites. The counterfeit sites tell users to download bogus TradingView installers, which lead to deployment of the malware. The activity overlaps with threat clusters tracked as WEEVILPROXY and MeadowLocust, and related campaigns have targeted retail traders and cryptocurrency investors across 12 countries in 25 languages, primarily in Asia Pacific and Latin America.\u003c/p\u003e\n\n\u003cp\u003eJSCeal is protected with javascript-obfuscator and uses techniques such as RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers to complicate analysis. Check Point said it built a fully static deobfuscation pipeline to decode the compiled V8 JavaScript bytecode and recover details about the malware’s execution flow and capabilities. The malware can enumerate Chromium-based browsers including Chrome, Edge, Brave, Opera, Vivaldi, Avast Secure Browser, and Cốc Cốc, then extract cookies, saved passwords, OAuth tokens, and other browser data.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use stolen cookies to reconstruct browser sessions and carry out active session replay attacks that bypass authentication to access a victim’s Google account. It also includes surveillance functions such as keystroke recording and screenshots, along with proxy setup, certificate generation and installation, and service-specific request and response modification. Check Point found handlers focused on cryptocurrency platforms including Binance, Bybit, and Ledger, with some code capturing account data and cryptocurrency balances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research analyzed JSCeal, a compiled V8 JavaScript malware protected with javascript-obfuscator techniques including RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers.","JSCeal is distributed through fake cryptocurrency trading sites reached via malicious ads on Facebook and Google, where users are instructed to download bogus TradingView installers.","The malware can enumerate installed Chromium-based browsers and extract cookies, saved passwords, OAuth tokens, and other data from browser profiles.","JSCeal can use stolen cookie data to reconstruct browser sessions and conduct active session replay attacks to bypass authentication and access victims’ Google accounts.","The malware includes surveillance and traffic-interception capabilities, including keystroke recording, screenshots, local proxy setup, certificate installation, and request or response modification for services such as Binance, Bybit, and Ledger."],"insights":["JSCeal’s operators combine compiled V8 bytecode with several layers of JavaScript obfuscation, which Check Point said moves the malware outside the workflows analysts normally rely on even though it does not make the malware impossible to reverse.","The SourTrade operation avoids sending finished malware over the network by having the victim’s browser retrieve a clean legitimate file and assemble the final malware in memory on the victim’s machine.","JSCeal’s local proxy capability is not limited to watching traffic, because the recovered code includes handlers that can modify selected requests and responses for Binance, Bybit, Ledger, and generic web content.","Check Point’s fully static deobfuscation pipeline shows that compiled and heavily obfuscated JavaScript malware can still be decoded without relying on dynamic execution.","The campaign’s continued activity into recent months and expanded platform coverage indicate that JSCeal remains under active development, according to the researchers."],"referencedReports":[{"title":"Breaking the Seal: Static Deobfuscation of JSCeal’s Compiled V8 Bytecode","url":"https://research.checkpoint.com/2026/breaking-the-seal-static-deobfuscation-of-jsceals-compiled-v8-bytecode/","publisher":"Check Point Research","context":"The article cites Check Point Research’s technical report as the main source for the analysis of JSCeal’s obfuscation, deobfuscation, and malware capabilities.","category":"","primary":false},{"title":"SourTrade: Browser-Assembled Malware","url":"https://blog.confiant.com/p/sourtrade-browser-assembled-malware","publisher":"Confiant","context":"The article references Confiant’s disclosure of the SourTrade malvertising operation and its browser-based malware assembly technique.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Research analyzed JSCeal, a compiled V8 JavaScript malware used in campaigns that redirect users from malicious Facebook and Google ads to fake cryptocurrency trading sites. The counterfeit sites tell users to download bogus TradingView installers, which lead to deployment of the malware. The activity overlaps with threat clusters tracked as WEEVILPROXY and MeadowLocust, and related campaigns have targeted retail traders and cryptocurrency investors across 12 countries in 25 languages, primarily in Asia Pacific and Latin America.\u003c/p\u003e\n\n\u003cp\u003eJSCeal is protected with javascript-obfuscator and uses techniques such as RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers to complicate analysis. Check Point said it built a fully static deobfuscation pipeline to decode the compiled V8 JavaScript bytecode and recover details about the malware’s execution flow and capabilities. The malware can enumerate Chromium-based browsers including Chrome, Edge, Brave, Opera, Vivaldi, Avast Secure Browser, and Cốc Cốc, then extract cookies, saved passwords, OAuth tokens, and other browser data.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use stolen cookies to reconstruct browser sessions and carry out active session replay attacks that bypass authentication to access a victim’s Google account. It also includes surveillance functions such as keystroke recording and screenshots, along with proxy setup, certificate generation and installation, and service-specific request and response modification. Check Point found handlers focused on cryptocurrency platforms including Binance, Bybit, and Ledger, with some code capturing account data and cryptocurrency balances.\u003c/p\u003e\n"},{"n":1,"title":"ConnectWise warns of new ScreenConnect flaw without patch","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/connectwise-warns-of-new-screenconnect-flaw-without-patch/","time":"10:06","priority":"SHOULD READ","score":86,"tldr":"ConnectWise warned of a new unpatched ScreenConnect file transfer vulnerability affecting cloud and on-prem deployments and urged admins to temporarily disable file transfer permissions until a fix is released later this week.","briefOverview":"\u003cp\u003eConnectWise has shared temporary mitigation measures for a new ScreenConnect Remote Access vulnerability that it plans to patch later this week. The issue affects file transfer behavior in ScreenConnect Remote Access Support and Access sessions. ConnectWise said the flaw affects both cloud and on-premises deployments, and it has not yet received a CVE ID.\u003c/p\u003e\n\n\u003cp\u003eThe company advised administrators to log in to the ScreenConnect Administration page, review roles under Administration \u0026gt; Security \u0026gt; Roles, and check session groups with assigned permissions. In the Scoped Permissions window, administrators should deselect the TransferFiles permission, or TransferFilesInSession for legacy versions, for each session group. Shadowserver is tracking nearly 6,000 ScreenConnect instances exposed online, though the article notes it is unclear how many are honeypots or already secured.\u003c/p\u003e\n\n\u003cp\u003eScreenConnect vulnerabilities are often targeted in the wild by financially motivated and state-backed hacking groups. The article cites past exploitation by ransomware gangs and the Kimsuky North Korean APT group, as well as a prior suspected state-sponsored breach involving a high-severity ViewState code injection bug. It also notes that CISA has added three ScreenConnect vulnerabilities to its catalog of actively exploited flaws since February 2024, two of which were also abused in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ConnectWise issued temporary mitigation measures for a new ScreenConnect Remote Access vulnerability that it plans to patch later this week.","The flaw affects file transfer behavior in ScreenConnect Remote Access Support and Access sessions across both cloud and on-premises deployments, and it has not yet received a CVE ID.","ConnectWise advised administrators to disable the TransferFiles permission, or TransferFilesInSession for legacy versions, for each session group assigned to user roles.","Shadowserver is tracking nearly 6,000 ScreenConnect instances exposed online, though it is unclear how many are honeypots or have already been secured.","The article states that ScreenConnect vulnerabilities have often been targeted by financially motivated and state-backed hacking groups, including prior exploitation by ransomware gangs and the Kimsuky North Korean APT group."],"insights":["The mitigation is permission-based rather than version-based, so administrators can reduce exposure before a software patch is available by removing file transfer rights from affected roles and session groups.","The issue is serious enough for ConnectWise to publish interim defensive steps before assigning or referencing a CVE, indicating administrators cannot rely on CVE-based tracking alone for this flaw.","Because ScreenConnect is commonly used by MSPs and IT support teams, a flaw in its remote access or file transfer functions can affect organizations beyond a single end customer environment.","The article highlights a recurring pattern of ScreenConnect flaws being targeted after disclosure, including multiple vulnerabilities added to CISA’s known exploited catalog since February 2024."],"referencedReports":[{"title":"ConnectWise Security Advisories","url":"https://www.connectwise.com/company/trust/advisories#:~:text=September%203%2C%202026%3A","publisher":"ConnectWise","context":"The article cites ConnectWise's security advisory as the source of the warning and temporary mitigation steps for the new ScreenConnect issue.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search=\u0026field_date_added_wrapper=all\u0026field_cve=\u0026sort_by=field_date_added\u0026items_per_page=All\u0026url=\u0026f%5B0%5D=vendor_project%3A1041","publisher":"CISA","context":"The article references CISA's catalog to note that three ScreenConnect vulnerabilities have been added as actively exploited flaws since February 2024.","category":"","primary":false}],"body":"\u003cp\u003eConnectWise has shared temporary mitigation measures for a new ScreenConnect Remote Access vulnerability that it plans to patch later this week. The issue affects file transfer behavior in ScreenConnect Remote Access Support and Access sessions. ConnectWise said the flaw affects both cloud and on-premises deployments, and it has not yet received a CVE ID.\u003c/p\u003e\n\n\u003cp\u003eThe company advised administrators to log in to the ScreenConnect Administration page, review roles under Administration \u0026gt; Security \u0026gt; Roles, and check session groups with assigned permissions. In the Scoped Permissions window, administrators should deselect the TransferFiles permission, or TransferFilesInSession for legacy versions, for each session group. Shadowserver is tracking nearly 6,000 ScreenConnect instances exposed online, though the article notes it is unclear how many are honeypots or already secured.\u003c/p\u003e\n\n\u003cp\u003eScreenConnect vulnerabilities are often targeted in the wild by financially motivated and state-backed hacking groups. The article cites past exploitation by ransomware gangs and the Kimsuky North Korean APT group, as well as a prior suspected state-sponsored breach involving a high-severity ViewState code injection bug. It also notes that CISA has added three ScreenConnect vulnerabilities to its catalog of actively exploited flaws since February 2024, two of which were also abused in ransomware attacks.\u003c/p\u003e\n"},{"n":6,"title":"Trezor data breach impact now reaches 81,000 customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/trezor-data-breach-impact-now-reaches-81-000-customers/","time":"12:16","priority":"SHOULD READ","score":86,"tldr":"Trezor says a breach at shipping provider ShipMonk exposed data for 81,000 customers, including names, emails, phone numbers, shipping addresses, and order numbers. The company says wallets and Trezor systems were not compromised, but affected customers face increased phishing and physical security risks.","briefOverview":"\u003cp\u003eTrezor says an August data breach at its shipping and logistics provider, ShipMonk, now affects a total of 81,000 customers. The company had initially disclosed on August 13 that nearly 14,000 customers were affected, including customers whose full names, shipping addresses, email addresses, and phone numbers were accessed. Trezor later confirmed that another 67,000 U.S. customers who ordered between November 2019 and August 2021 had their full details exposed, including name, email, phone number, shipping address, and order number. Trezor said the breach did not affect its operations or services, its systems were not compromised, and all Trezor devices are secure.\u003c/p\u003e\n\n\u003cp\u003eTrezor said the expanded impact occurred because ShipMonk failed to delete exposed data from its systems as required by Trezor’s contract and data policy, despite written assurances that the data had been deleted. The company warned affected customers of an increased risk of phishing, scam emails, fraudulent calls or letters, and potential physical security risks. Breach notification emails seen by BleepingComputer said attackers exploited a vulnerability in the third-party analytics platform Metabase. BleepingComputer also reported that ShipMonk received extortion emails from the ShinyHunters extortion gang, and that other companies in the Metabase campaign include Tally and Framework.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor said an August data breach at its shipping and logistics provider ShipMonk now affects 81,000 customers in total.","The newly identified affected group includes 67,000 U.S. customers who ordered between November 2019 and August 2021 and had their names, email addresses, phone numbers, shipping addresses, and order numbers exposed.","Trezor said ShipMonk failed to delete the exposed data from its systems despite written assurances that the data had been deleted in line with Trezor’s contract and data policy.","Trezor said its operations and services were not affected, its systems were not compromised, and all Trezor devices remain secure.","Breach notification emails seen by BleepingComputer said attackers exploited a vulner
