<script type="application/json" id="dl-articles">[{"n":11,"title":"Drupal warns of new site takeover flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/drupal-warns-of-new-access-bypass-flaw-exploited-in-attacks/","time":"10:10","priority":"MUST READ","score":96,"tldr":"Drupal warns that attackers are actively exploiting CVE-2026-136716 to take over sites left in vulnerable installer states, including some production systems. Administrators should immediately update to the fixed releases, block access to /core/install.php if patching is delayed, and check the user 1 account and logs for signs of compromise.","briefOverview":"\u003cp\u003eDrupal has warned that attackers are actively exploiting CVE-2026-136716, a critical flaw that can allow takeover of vulnerable websites. The issue affects certain sites in unusual or incomplete installation states, including production sites, and follows the earlier installer-related CVE-2026-132165. Drupal said sites that left their installer remotely accessible after the previous advisory may already have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable state may not be apparent through the Drupal user interface, and already-compromised sites may no longer appear vulnerable. Drupal recommends updating to versions 10.6.23, 11.3.23, or 11.4.14; organizations unable to update immediately should block access to \u003ccode\u003e/core/install.php\u003c/code\u003e through their web-server configuration or \u003ccode\u003e.htaccess\u003c/code\u003e file. Administrators should also confirm they control the user 1 email address, consider resetting it, and review logs for unauthorized access or unexpected changes involving that account.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal says CVE-2026-136716 is being exploited in the wild to take over vulnerable websites.","The flaw affects certain Drupal sites in unusual or incomplete installation states, including production sites, and the vulnerable condition may not be visible in the user interface.","The issue was patched one week after CVE-2026-132165, addressing attack paths that remained after the earlier installer-related fix.","Drupal advises administrators to update to versions 10.6.23, 11.3.23, or 11.4.14, or block access to /core/install.php if they cannot update immediately.","Administrators should verify that the user 1 email address is controlled by them and review logs for unauthorized access or unexpected user 1 account changes."],"insights":["Applying the earlier fix for CVE-2026-132165 did not protect every Drupal installation state, because additional takeover paths remained for some sites.","A site may not visibly show that it is in the vulnerable state, and a previously compromised site may no longer appear vulnerable, making normal interface checks insufficient.","Sites that left the installer remotely accessible after the earlier advisory should be treated as potentially compromised even if they are later secured.","The recommended investigation prioritizes the user 1 account, including confirming its email address is controlled by the administrator and checking for unexpected account activity."],"referencedReports":[{"title":"SA-CORE-2026-019","url":"https://www.drupal.org/sa-core-2026-019","publisher":"drupal","context":"Drupal's security advisory states that the newly patched site-takeover issue is being exploited in the wild and identifies affected installation states.","category":"advisory","primary":true},{"title":"Your Drupal site got hacked, now what?","url":"https://www.drupal.org/docs/develop/security/your-drupal-site-got-hacked-now-what","publisher":"drupal","context":"The article directs administrators to this Drupal guide if they find evidence that their site may have been compromised.","category":"guide","primary":false}],"body":"\u003cp\u003eDrupal has warned that attackers are actively exploiting CVE-2026-136716, a critical flaw that can allow takeover of vulnerable websites. The issue affects certain sites in unusual or incomplete installation states, including production sites, and follows the earlier installer-related CVE-2026-132165. Drupal said sites that left their installer remotely accessible after the previous advisory may already have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable state may not be apparent through the Drupal user interface, and already-compromised sites may no longer appear vulnerable. Drupal recommends updating to versions 10.6.23, 11.3.23, or 11.4.14; organizations unable to update immediately should block access to \u003ccode\u003e/core/install.php\u003c/code\u003e through their web-server configuration or \u003ccode\u003e.htaccess\u003c/code\u003e file. Administrators should also confirm they control the user 1 email address, consider resetting it, and review logs for unauthorized access or unexpected changes involving that account.\u003c/p\u003e\n"},{"n":4,"title":"New NFS2ROOT Linux flaw can let attackers gain root privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-nfs2root-linux-flaw-can-let-attackers-gain-root-privileges/","time":"08:06","priority":"SHOULD READ","score":89,"tldr":"A critical 12-year-old Linux NFS server flaw, CVE-2026-99362 (NFS2ROOT), can let remote unauthenticated attackers gain root access when NFSv4.1 or v4.2 is exposed on TCP port 2049. Organizations should immediately update to a patched kernel and reboot, or restrict NFS access to trusted networks until patching is possible.","briefOverview":"\u003cp\u003eA critical Linux kernel flaw tracked as CVE-2026-99362, and dubbed NFS2ROOT, can allow remote attackers to gain root privileges through the Network File System server. The issue was found by ANSSI’s Jérémy Jean, while OpenSec shared a remote-root exploit and patch with NFSD maintainers. It has existed since Linux kernel 3.16, released in March 2014. No exploitation in the wild has been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a heap buffer overflow in nfsd affecting systems with NFSv4.1 or NFSv4.2 enabled and TCP port 2049 reachable over the internet. Crafted requests can let an attacker corrupt kernel memory, read memory to bypass KASLR, and place a callback that executes a command after the NFS connection is closed. Affected organizations should update to patched kernel versions and reboot, or restrict port 2049 to trusted networks and disable NFS where it is not required. OpenSec also identified potential warning signs, including nfsd4_check_resp\u003cem\u003esize messages, short bursts of NFSv4.1 sessions, and kernel errors involving nfsd4\u003c/em\u003e, svc_, or call_usermodehelper frames.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-99362, dubbed NFS2ROOT, is a critical heap buffer overflow in the Linux NFS server that can allow remote attackers to gain root privileges.","The flaw has existed since Linux kernel 3.16, released in March 2014, and affects systems running nfsd with NFSv4.1 or v4.2 when TCP port 2049 is reachable.","OpenSec disclosed that crafted NFS requests can corrupt kernel memory, defeat address randomization protections, and cause a command to run as root when the attacker closes the NFS connection.","Patched kernel versions include 6.12.117, 6.18.61, 7.3.2, and 7.4-rc1, and administrators should update and reboot systems to use the fixed kernel.","No exploitation in the wild has been reported, but organizations that cannot patch immediately should restrict NFS TCP port 2049 to trusted clients or disable the NFS server if it is unnecessary."],"insights":["The exploit chain described by OpenSec does not end with a malicious request alone: closing the NFS connection triggers the kernel to execute the attacker’s embedded command with root privileges.","Although OpenSec says NFS2ROOT has no network signatures, defenders can look for kernel warnings involving nfsd4_check_resp_size, bursts of short NFSv4.1 sessions from one source, kernel errors with nfsd4_, svc_, or call_usermodehelper frames, and shells launched by kernel worker processes.","The issue is specifically exposed when the NFS server is running NFSv4.1 or v4.2 and TCP port 2049 is reachable over the internet, making internet-facing NFS services the immediate priority for patching or access restrictions.","If updates cannot be applied immediately, the article identifies two practical containment options: limit TCP port 2049 to trusted clients or networks, or stop and disable the NFS server when file sharing is not needed."],"referencedReports":[{"title":"NFS2ROOT: CVE-2026-99362","url":"https://opensec.in/blog/nfs2root-cve-2026-99362","publisher":"opensec","context":"The article cites OpenSec’s technical analysis for the NFS2ROOT exploit details, mitigation guidance, and potential detection indicators.","category":"research","primary":true}],"body":"\u003cp\u003eA critical Linux kernel flaw tracked as CVE-2026-99362, and dubbed NFS2ROOT, can allow remote attackers to gain root privileges through the Network File System server. The issue was found by ANSSI’s Jérémy Jean, while OpenSec shared a remote-root exploit and patch with NFSD maintainers. It has existed since Linux kernel 3.16, released in March 2014. No exploitation in the wild has been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a heap buffer overflow in nfsd affecting systems with NFSv4.1 or NFSv4.2 enabled and TCP port 2049 reachable over the internet. Crafted requests can let an attacker corrupt kernel memory, read memory to bypass KASLR, and place a callback that executes a command after the NFS connection is closed. Affected organizations should update to patched kernel versions and reboot, or restrict port 2049 to trusted networks and disable NFS where it is not required. OpenSec also identified potential warning signs, including nfsd4_check_resp\u003cem\u003esize messages, short bursts of NFSv4.1 sessions, and kernel errors involving nfsd4\u003c/em\u003e, svc_, or call_usermodehelper frames.\u003c/p\u003e\n"},{"n":3,"title":"Unpatched Cacti zero-day with public PoC gives remote code execution","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/","time":"17:06","priority":"SHOULD READ","score":88,"tldr":"A public zero-day PoC enables unauthenticated remote command execution on Cacti Core 1.2.31 through a stored SQL injection chain involving the default guest account. Until a patch is available, administrators should disable guest access, restrict Cacti to trusted networks, and inspect poller configurations and logs for suspicious activity.","briefOverview":"\u003cp\u003eA researcher known as ek0ms savi0r publicly released a zero-day proof of concept called 4HTTP2SHELL for the Cacti network-monitoring platform. The researcher said an unauthenticated attacker can reach command execution as the Cacti server user in four HTTP requests through the default guest-facing surface. The exploit was tested against Cacti Core 1.2.31, though it is unclear whether earlier versions are affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from weak input validation in guest users’ graph display settings, allowing malicious database statements to be saved and later used to alter commands run by Cacti’s real-time poller. The guest account must be enabled, but attackers do not need valid credentials or an API key. Because Cacti may store credentials and SNMP passphrases for monitored devices, compromise of a Cacti server could provide access to other systems on a corporate network. Until a patch is available, administrators are advised to disable the guest account, restrict web access to trusted networks, and review poller configurations and logs for unexpected commands or non-numeric graph display settings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A publicly released proof-of-concept called 4HTTP2SHELL can enable unauthenticated attackers to execute commands on vulnerable Cacti servers in four HTTP requests.","The exploit was tested against Cacti Core 1.2.31 and requires the Cacti guest account to be enabled, but does not require valid credentials.","The attack uses weak validation in guest graph display settings to save malicious database instructions and alter commands run by Cacti's real-time poller.","The access obtained depends on the account running Cacti's web server and poller processes, which may be a low-privileged web-server account rather than root.","Until a patch is released, administrators are advised to disable the Cacti guest account, restrict web-interface access to trusted networks, and review poller configurations and logs for suspicious values in graph display settings."],"insights":["The attack path begins from Cacti’s default guest-facing surface, so simply having guest access enabled is a critical exposure even without a user login or API key.","Although the demonstration achieved root access, the actual level of control gained depends on which account runs Cacti’s web and poller processes, and may be limited to a low-privileged web-server account.","A compromised Cacti server could expose stored credentials and SNMP passphrases used to access monitored network devices, potentially extending the impact beyond the Cacti host itself.","Administrators can look for warnings about non-numeric graph display settings in application logs as a possible sign of attempted exploitation, alongside unexpected poller commands.","As of November 27, the article reported no known use of the flaw in real-world attacks despite the public availability of a proof-of-concept."],"referencedReports":[{"title":"4HTTP2SHELL","url":"https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell","publisher":"ek0ms savi0r / Church of Malware","context":"The researcher’s GitHub repository provides the technical write-up and proof-of-concept demonstration for the Cacti flaw.","category":"research","primary":true},{"title":"4HTTP2ROOT Cacti Zero-Day FAQ","url":"https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/","publisher":"watchTowr","context":"watchTowr explains that the privileges gained depend on the account running Cacti’s web server and poller processes.","category":"research","primary":false},{"title":"Four Requests to Shell: Cacti","url":"https://ravenai.sh/blog/four-requests-to-shell-cacti","publisher":"RavenAI","context":"RavenAI explains the stored SQL injection path involving guest users’ graph display settings and poller command configuration.","category":"research","primary":false}],"body":"\u003cp\u003eA researcher known as ek0ms savi0r publicly released a zero-day proof of concept called 4HTTP2SHELL for the Cacti network-monitoring platform. The researcher said an unauthenticated attacker can reach command execution as the Cacti server user in four HTTP requests through the default guest-facing surface. The exploit was tested against Cacti Core 1.2.31, though it is unclear whether earlier versions are affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from weak input validation in guest users’ graph display settings, allowing malicious database statements to be saved and later used to alter commands run by Cacti’s real-time poller. The guest account must be enabled, but attackers do not need valid credentials or an API key. Because Cacti may store credentials and SNMP passphrases for monitored devices, compromise of a Cacti server could provide access to other systems on a corporate network. Until a patch is available, administrators are advised to disable the guest account, restrict web access to trusted networks, and review poller configurations and logs for unexpected commands or non-numeric graph display settings.\u003c/p\u003e\n"},{"n":5,"title":"SAP confirms security incident after suspicious GitHub activity","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/","time":"09:56","priority":"SHOULD READ","score":88,"tldr":"SAP confirmed suspicious activity in its IT environment and says it took urgent protective measures, while reporting no evidence so far that customer systems or business data were accessed. Reports indicate attackers may have stolen employee GitHub tokens to copy and modify SAP source code.","briefOverview":"\u003cp\u003eSAP confirmed it detected suspicious activity in its IT environment and said it promptly took measures to protect customers and secure its services. The company said its investigation has found no evidence so far of unauthorized access to customer business data. SAP did not disclose which environments were affected or provide further details about the incident.\u003c/p\u003e\n\n\u003cp\u003eDer Spiegel reported, citing an internal SAP memo, that the company is tracking the incident as “Project Granite.” Sources cited by the outlet said attackers may have accessed SAP’s GitHub environment after obtaining employee authentication tokens, then copied and modified source code. SAP has not said whether customers downloading code from its GitHub repositories or using updates connected to those repositories need to take action.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP confirmed it identified suspicious activity in its IT environment and said it promptly implemented measures to protect customers and secure its services.","SAP said its investigation has so far found no evidence of unauthorized access to customer business data.","Der Spiegel reported that SAP is tracking the incident as “Project Granite” and that attackers may have breached SAP’s GitHub environment.","According to insider sources cited by Der Spiegel, attackers stole SAP employee authentication tokens and used them to copy and modify SAP source code on GitHub.","SAP did not disclose which environments were affected or whether customers using code or updates associated with its GitHub repositories should take action."],"insights":["The reported theft of employee authentication tokens would have allowed access to SAP’s GitHub environment without needing to break into customer systems directly.","SAP has not said whether code in its GitHub repositories or updates connected to those repositories were affected, leaving customers without specific guidance on whether they should take action.","The incident emerged alongside a German government warning that agentic AI tools can enable cyberattacks, although SAP has not confirmed that AI was used in its case.","SAP’s public statement is limited to finding no evidence of customer business-data access; it does not rule out the reported copying or modification of source code."],"referencedReports":[{"title":"Public warning on agentic AI tools enabling cyberattacks","url":"https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261126_agentische-KI.html","publisher":"germanys-federal-office-for-information-security","context":"The article cites the BSI's public warning about agentic AI tools, including ARTEX, CAIRN, and PentAGI, that can empower cyberattacks.","category":"advisory","primary":false}],"body":"\u003cp\u003eSAP confirmed it detected suspicious activity in its IT environment and said it promptly took measures to protect customers and secure its services. The company said its investigation has found no evidence so far of unauthorized access to customer business data. SAP did not disclose which environments were affected or provide further details about the incident.\u003c/p\u003e\n\n\u003cp\u003eDer Spiegel reported, citing an internal SAP memo, that the company is tracking the incident as “Project Granite.” Sources cited by the outlet said attackers may have accessed SAP’s GitHub environment after obtaining employee authentication tokens, then copied and modified source code. SAP has not said whether customers downloading code from its GitHub repositories or using updates connected to those repositories need to take action.\u003c/p\u003e\n"},{"n":10,"title":"US Air Force cloud platform reportedly hacked in latest federal breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-air-force-cloud-platform-reportedly-hacked-in-latest-federal-breach/","time":"15:09","priority":"SHOULD READ","score":86,"tldr":"Hackers reportedly breached the US Air Force’s Cloud One platform through an unidentified software flaw, potentially exposing sensitive military operations and logistics data, though the scope and any data theft remain unknown. The incident is part of a recent series of reported intrusions affecting multiple US federal agencies.","briefOverview":"\u003cp\u003eHackers reportedly breached the US Air Force’s Cloud One computing platform by exploiting an unidentified software vulnerability. The intrusion was discovered within the past month during an upgrade, disrupting application migrations and software updates. Cloud One is an enterprise cloud platform used by Department of Defense agencies to host applications supporting military operations, personnel management, logistics, and maintenance.\u003c/p\u003e\n\n\u003cp\u003eA source told Reuters that the breach may have exposed sensitive military operational and logistics information, but the attackers, scope of access, and whether data was stolen remain unknown. US Cyber Command was reportedly called in to assess the impact, while the Air Force declined to comment on the security or operational status of affected systems. The incident follows recently reported breaches involving the FBI, CIA, ODNI, NGA, and Treasury’s FinCEN, although it is unclear whether any of these events are connected.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights ARTEX, an open-source AI-powered penetration-testing framework that the FBI said has been used by multiple threat actors since at least August 2026. ARTEX can automate finding and exploiting weaknesses, gaining higher access, and stealing data using external AI models, with some intrusions reportedly reaching privileged access in less than three hours. It remains unknown whether ARTEX or another AI-powered tool was used in the reported Air Force, FBI, or FinCEN incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers reportedly breached the US Air Force’s Cloud One computing platform through an unidentified software vulnerability discovered during a platform upgrade.","Cloud One supports Department of Defense applications for military operations, personnel management, logistics, and maintenance, and the intrusion disrupted application migrations and software updates.","US Cyber Command was reportedly called in to assess the incident, while the attackers, the extent of access, and whether data was stolen remain unknown.","The reported Cloud One breach follows recently disclosed incidents affecting the FBI, CIA, ODNI, NGA, and the Treasury Department’s Financial Crimes Enforcement Network.","The article says it is unknown whether ARTEX or other AI-powered hacking tools were involved in the Air Force, FBI, or FinCEN incidents."],"insights":["The Cloud One intrusion was discovered during an upgrade and disrupted application migrations and software updates, showing that a security incident can also directly interfere with routine modernization work.","Although several US federal breaches were disclosed in a short period, the article states that it is still unclear whether they are connected.","The ARTEX framework can use external AI models to automate steps from finding weaknesses through obtaining higher-level access and stealing data, and the FBI said some related intrusions reached privileged access in under three hours.","Researchers had identified more than 1,600 publicly exposed ARTEX management consoles by early November, while believing the actual number was higher."],"referencedReports":[{"title":"Hackers breach US Air Force flagship Cloud One computing platform","url":"https://www.reuters.com/world/hackers-breach-us-air-force-flagship-cloud-one-computing-platform-2026-11-27/","publisher":"reuters","context":"The article cites Reuters as the source reporting that hackers breached the US Air Force's Cloud One platform.","category":"news","primary":true}],"body":"\u003cp\u003eHackers reportedly breached the US Air Force’s Cloud One computing platform by exploiting an unidentified software vulnerability. The intrusion was discovered within the past month during an upgrade, disrupting application migrations and software updates. Cloud One is an enterprise cloud platform used by Department of Defense agencies to host applications supporting military operations, personnel management, logistics, and maintenance.\u003c/p\u003e\n\n\u003cp\u003eA source told Reuters that the breach may have exposed sensitive military operational and logistics information, but the attackers, scope of access, and whether data was stolen remain unknown. US Cyber Command was reportedly called in to assess the impact, while the Air Force declined to comment on the security or operational status of affected systems. The incident follows recently reported breaches involving the FBI, CIA, ODNI, NGA, and Treasury’s FinCEN, although it is unclear whether any of these events are connected.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights ARTEX, an open-source AI-powered penetration-testing framework that the FBI said has been used by multiple threat actors since at least August 2026. ARTEX can automate finding and exploiting weaknesses, gaining higher access, and stealing data using external AI models, with some intrusions reportedly reaching privileged access in less than three hours. It remains unknown whether ARTEX or another AI-powered tool was used in the reported Air Force, FBI, or FinCEN incidents.\u003c/p\u003e\n"},{"n":18,"title":"Unpatched Cacti Zero-Day Enables RCE in Just Four HTTP Requests via Guest Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/unpatched-cacti-zero-day-enables-rce-in.html","time":"05:48","priority":"SHOULD READ","score":86,"tldr":"An unpatched zero-day in Cacti Core 1.2.31 lets unauthenticated guest users achieve remote code execution in four HTTP requests by chaining stored SQL injection with unsafe poller command execution. Until a fix is released, disable guest access, restrict web-interface exposure, and inspect poller configurations for suspicious commands.","briefOverview":"\u003cp\u003eA newly disclosed, unpatched zero-day in Cacti Core 1.2.31 can allow unauthenticated remote code execution when the guest account is enabled. The proof-of-concept, tracked as 4HTTP2SHELL and 4HTTP2ROOT, reportedly reaches command execution as the Cacti server user in four HTTP requests. It does not require a login, valid API key, or phishing.\u003c/p\u003e\n\n\u003cp\u003eThe issue begins when guest access is used to write non-numeric text into the \u003ccode\u003epreview_graphs_per_page\u003c/code\u003e setting, which controls graph pagination in Preview Mode. When the graph preview page is loaded with default filters, the stored value can be used for arbitrary SQL queries, including modification of a Cacti poller-table record. Calling the realtime poller endpoint then causes the modified command string to be passed to PHP\u0026rsquo;s \u003ccode\u003epopen()\u003c/code\u003e without allowlist or sanitization checks. Because Cacti can store credentials and connection details for network devices and servers, a compromised Cacti server could provide wider network access or enable suppression of alerts; users are advised to disable guest access, restrict web-interface access, and review poller entries for unexpected commands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept zero-day, tracked as 4HTTP2SHELL and 4HTTP2ROOT, can enable unauthenticated remote code execution in Cacti Core 1.2.31 when the guest account is enabled.","The attack uses guest access to store non-numeric text in the preview_graphs_per_page setting, which is later used to execute arbitrary database queries when the graph preview page is loaded.","The demonstrated attack modifies a Cacti poller-table record and then invokes the realtime poller endpoint, causing the stored command string to be passed to PHP's popen() function without allowlist or sanitization checks.","The researcher identified four contributing failures: guest users can write arbitrary strings to a numeric setting, stored defaults bypass validation, the PDO driver permits stacked statements through a SQL LIMIT clause, and the poller executes database-stored command strings.","Until a fix is available, users are advised to disable the guest account, limit access to the Cacti web interface, and review poller configuration entries for unexpected commands."],"insights":["The flaw turns a seemingly minor graph-display preference into a path for server command execution because the value is stored first and only becomes dangerous later when Cacti loads the graph preview page.","An attacker does not need a Cacti login, valid API key, or phishing step if the default guest surface is enabled, making exposure of the web interface particularly consequential.","Compromise of a Cacti server could extend beyond the monitoring system because it may contain credentials and connection details for network devices and servers.","The same poller-table manipulation that enables command execution could also be used to suppress alerts, potentially reducing visibility into malicious activity."],"referencedReports":[{"title":"4HTTP2SHELL","url":"https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell","publisher":"ek0ms savi0r","context":"The article cites the researcher's proof-of-concept material describing an unauthenticated four-request path to command execution in Cacti.","category":"research","primary":true},{"title":"4HTTP2ROOT Cacti Zero-Day FAQ","url":"https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/","publisher":"watchTowr","context":"The article cites watchTowr's advisory on the potential for Cacti server compromise to provide access to broader network credentials and systems.","category":"advisory","primary":false}],"body":"\u003cp\u003eA newly disclosed, unpatched zero-day in Cacti Core 1.2.31 can allow unauthenticated remote code execution when the guest account is enabled. The proof-of-concept, tracked as 4HTTP2SHELL and 4HTTP2ROOT, reportedly reaches command execution as the Cacti server user in four HTTP requests. It does not require a login, valid API key, or phishing.\u003c/p\u003e\n\n\u003cp\u003eThe issue begins when guest access is used to write non-numeric text into the \u003ccode\u003epreview_graphs_per_page\u003c/code\u003e setting, which controls graph pagination in Preview Mode. When the graph preview page is loaded with default filters, the stored value can be used for arbitrary SQL queries, including modification of a Cacti poller-table record. Calling the realtime poller endpoint then causes the modified command string to be passed to PHP\u0026rsquo;s \u003ccode\u003epopen()\u003c/code\u003e without allowlist or sanitization checks. Because Cacti can store credentials and connection details for network devices and servers, a compromised Cacti server could provide wider network access or enable suppression of alerts; users are advised to disable guest access, restrict web-interface access, and review poller entries for unexpected commands.\u003c/p\u003e\n"},{"n":13,"title":"Software giant SAP confirms cyber incident amid reports of source code breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/sap-germany-cyberattack-github","time":"13:15","priority":"SHOULD READ","score":84,"tldr":"SAP confirmed a cybersecurity incident involving suspicious activity in its GitHub-hosted development environment, where attackers reportedly obtained employee tokens that may have enabled source-code access or modification. SAP says it has found no evidence that customer business data was accessed and has restricted GitHub access and rotated security keys.","briefOverview":"\u003cp\u003eSAP confirmed that it identified suspicious activity and took steps to protect customers and secure its services. The company said it had found no evidence of unauthorized access to customer business data, but did not disclose the nature or extent of the intrusion. Reports from German media said attackers targeted SAP’s GitHub-hosted software development environment and obtained employee authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eAccording to those reports, the tokens could have allowed attackers to copy and modify SAP source code. SAP reportedly launched an internal response called Project Granite, restricted GitHub access, halted automated development processes, and replaced keys used to verify that its software had not been altered. It remains unclear whether proprietary source code was accessed or whether any changed code reached customers, whose organizations use SAP products for functions including accounting, procurement, supply chains, and human resources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP confirmed it identified suspicious activity and said it took immediate steps to protect customers and secure its services.","Reports citing internal communications said attackers targeted SAP’s GitHub-hosted software development environment and obtained employee authentication tokens that could allow them to copy and modify source code.","SAP said its investigation had found no evidence of unauthorized access to customer business data.","SAP reportedly restricted GitHub access, halted automated development processes, and replaced digital keys used to verify the authenticity of its software.","It remains unclear whether attackers accessed proprietary source code or whether altered code was delivered to customers."],"insights":["The reported use of employee authentication tokens meant attackers could potentially modify source code as well as copy it, raising integrity concerns alongside confidentiality concerns.","SAP’s reported decision to halt automated development processes and replace software-verification keys shows the response extended beyond account access to controls that affect how software is built and validated.","The incident follows an April compromise involving SAP-developed open-source packages, but the article states that any connection between the two events is unknown.","SAP had reportedly warned employees about suspicious GitHub activity several days before the incident became public, including advice to assess whether to change credentials or take other precautions."],"referencedReports":[{"title":"CAP developers: Call to action to mitigate and apply solution provided in","url":"https://community.sap.com/t5/technology-blog-posts-by-sap/cap-developers-call-to-action-to-mitigate-and-apply-solution-provided-in/ba-p/14387683","publisher":"sap","context":"The article links to SAP's call to action concerning an April supply-chain attack involving malicious code injected into SAP-developed open-source packages.","category":"advisory","primary":false}],"body":"\u003cp\u003eSAP confirmed that it identified suspicious activity and took steps to protect customers and secure its services. The company said it had found no evidence of unauthorized access to customer business data, but did not disclose the nature or extent of the intrusion. Reports from German media said attackers targeted SAP’s GitHub-hosted software development environment and obtained employee authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eAccording to those reports, the tokens could have allowed attackers to copy and modify SAP source code. SAP reportedly launched an internal response called Project Granite, restricted GitHub access, halted automated development processes, and replaced keys used to verify that its software had not been altered. It remains unclear whether proprietary source code was accessed or whether any changed code reached customers, whose organizations use SAP products for functions including accounting, procurement, supply chains, and human resources.\u003c/p\u003e\n"},{"n":17,"title":"Switzerland Confirms AI-Assisted Cyberattacks Breached Critical Infrastructure Operators","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/switzerland-confirms-ai-assisted.html","time":"06:04","priority":"SHOULD READ","score":84,"tldr":"Switzerland confirmed its first AI-agent-assisted intrusions, including successful breaches of critical-infrastructure operators, reflecting a wider European rise in autonomous attacks that exploit familiar weaknesses at far greater speed and scale. Authorities urge rapid patching, reduced internet exposure, strong authentication, and behavior-based monitoring.","briefOverview":"\u003cp\u003eSwitzerland’s National Cyber Security Centre said attackers using AI agents breached systems at four of five Swiss organizations in recently reported cases. Three incidents targeted critical-infrastructure operators, with two successful intrusions, though no major disruptions were reported. The victims, which were not named, also included small and medium-sized companies. The agency described the cases as a shift in the cyber-threat landscape.\u003c/p\u003e\n\n\u003cp\u003eThe agency said agentic offensive frameworks can scan for known unpatched weaknesses, conduct many attempts in parallel, and change methods when defenses react. Italy’s CSIRT Italia similarly reported campaigns in which autonomous AI agents compromised many systems within hours by combining security flaws, configuration errors, and stolen credentials. The UK National Cyber Security Centre said it has seen a marked rise in AI-assisted attacks since September 2026, including incidents causing downtime on internet-facing services and footholds for further activity.\u003c/p\u003e\n\n\u003cp\u003eAuthorities emphasized that the attacks commonly rely on familiar weaknesses, including credentials committed to code repositories, poorly configured infrastructure, missing or default authentication, and API weaknesses. They recommended prioritizing patches for exposed systems, isolating systems that cannot be patched quickly, reducing internet exposure, using MFA or passkeys, and monitoring for unusual behavior, request bursts, error rates, and data volumes. The article also notes that attackers using ARTEX previously breached European Commission human-resources, medical-reimbursement, and translation systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Switzerland’s National Cyber Security Centre said AI agents breached systems in four of five confirmed recent attacks on Swiss organizations.","Three attacks targeted critical-infrastructure operators, and two succeeded without causing major reported disruptions.","Swiss authorities said agentic offensive frameworks can scan for known unpatched weaknesses, run attacks in parallel, and switch methods when defenses respond.","Italy’s CSIRT Italia reported that AI-directed autonomous agents compromised many systems within hours by combining vulnerabilities, configuration errors, and compromised credentials.","Swiss, Italian, and UK authorities recommended rapid patching, limiting internet exposure, strong authentication, and monitoring for unusual activity."],"insights":["The Swiss agency’s initial advisory said every known case involved a successful compromise, while a subsequent interview reported compromises in four of five confirmed cases without explaining the changed count.","The reported AI-agent activity often exploits long-standing problems such as exposed credentials, weak API security, default or missing authentication, and infrastructure configuration errors rather than requiring novel flaws.","Individual agent actions can resemble ordinary user or API activity, so identifying them depends on recognizing patterns such as request bursts, high error rates, unusual data transfers, and the sequence of actions.","The UK agency noted that these automated frameworks are noisy despite being fast and persistent, which can make them easier to detect when organizations correlate their logs.","Switzerland said the number of AI attack tools freely available online has nearly doubled since October, while emphasizing that this figure measures available tools rather than attacks or victims."],"referencedReports":[{"title":"Security advisory on AI agents","url":"https://www.bacs.admin.ch/en/26-ki-agenten-1-en","publisher":"Switzerland's National Cyber Security Centre","context":"The article cites this advisory as the agency's first notice of AI-agent attacks compromising Swiss organizations' IT systems.","category":"advisory","primary":true},{"title":"Impiego di agenti di IA in campagne di compromissione automatizzate (BL01-261123 CSIRT-ITA)","url":"https://csirt.regione.toscana.it/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate-bl01-261123-csirt-ita/","publisher":"CSIRT Italia","context":"The article cites this official bulletin describing mass compromise campaigns in which AI-directed agents breached many systems within hours.","category":"advisory","primary":false},{"title":"Familiar weaknesses exploited faster: Defending against agentic cyber attacks","url":"https://www.ncsc.gov.uk/blogs/familiar-weaknesses-exploited-faster-defending-against-agentic-cyber-attacks","publisher":"UK National Cyber Security Centre","context":"The article cites this agency guidance on the rise of AI-assisted attacks and recommended detection and defensive measures.","category":"guide","primary":false}],"body":"\u003cp\u003eSwitzerland’s National Cyber Security Centre said attackers using AI agents breached systems at four of five Swiss organizations in recently reported cases. Three incidents targeted critical-infrastructure operators, with two successful intrusions, though no major disruptions were reported. The victims, which were not named, also included small and medium-sized companies. The agency described the cases as a shift in the cyber-threat landscape.\u003c/p\u003e\n\n\u003cp\u003eThe agency said agentic offensive frameworks can scan for known unpatched weaknesses, conduct many attempts in parallel, and change methods when defenses react. Italy’s CSIRT Italia similarly reported campaigns in which autonomous AI agents compromised many systems within hours by combining security flaws, configuration errors, and stolen credentials. The UK National Cyber Security Centre said it has seen a marked rise in AI-assisted attacks since September 2026, including incidents causing downtime on internet-facing services and footholds for further activity.\u003c/p\u003e\n\n\u003cp\u003eAuthorities emphasized that the attacks commonly rely on familiar weaknesses, including credentials committed to code repositories, poorly configured infrastructure, missing or default authentication, and API weaknesses. They recommended prioritizing patches for exposed systems, isolating systems that cannot be patched quickly, reducing internet exposure, using MFA or passkeys, and monitoring for unusual behavior, request bursts, error rates, and data volumes. The article also notes that attackers using ARTEX previously breached European Commission human-resources, medical-reimbursement, and translation systems.\u003c/p\u003e\n"},{"n":19,"title":"Microsoft Store App Found Delivering Vinci RAT Capable of Remote System Control","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-store-app-found-delivering.html","time":"11:49","priority":"SHOULD READ","score":84,"tldr":"A malicious Microsoft Store app called Setup Assistant was used to deliver Vinci RAT, giving attackers persistent remote control through obfuscated JavaScript and PowerShell payloads. The campaign used fake software download sites and a Microsoft-signed installer to lure victims before the app was removed from the Store.","briefOverview":"\u003cp\u003eCybersecurity firm eSentire reported that attackers used a fake snipping-tool website to distribute a Microsoft-signed installer named Snipping-Tool.exe. Running it installed Setup Assistant, an Electron-based application published by ETPS Ltd. through the Microsoft Store. The application was designed to act as a backdoor, communicating with attacker-controlled servers and executing supplied PowerShell or JavaScript code.\u003c/p\u003e\n\n\u003cp\u003eThe activity ultimately deployed Vinci RAT, which can identify the affected system, list installed security tools, provide remote and reverse-shell access, deliver files, and run several kinds of code. Its PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the RAT payload. eSentire also identified related codes-team[.]com subdomains that appeared to impersonate Microsoft Teams and Roblox download pages; Setup Assistant was no longer available in the Microsoft Store when the article was published.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at eSentire reported that attackers used a fake snipping-tool website to deliver a Microsoft-signed installer named Snipping-Tool.exe, which installed the Microsoft Store app Setup Assistant.","Setup Assistant, an Electron-based application published by ETPS Ltd., used obfuscated JavaScript to communicate with attacker-controlled infrastructure and execute PowerShell or JavaScript supplied by that infrastructure.","The campaign deployed Vinci RAT, which can identify the infected computer, check installed security tools, provide remote shell access, transfer files, and run shellcode, DLL, EXE, and PowerShell payloads.","A PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the Vinci RAT payload.","The Setup Assistant app was no longer accessible in the Microsoft Store at the time of reporting, and eSentire said Microsoft had previously responded to its abuse report by stating that the app did not violate its terms."],"insights":["The campaign combined a Microsoft-signed installer and a Microsoft Store-hosted application with fake download pages, showing that trusted-looking distribution paths were part of the delivery chain.","Setup Assistant could wait for specific filenames such as MSTeamsSetup.exe or Reader_install.exe to appear in the Downloads folder before contacting its control server and running the response.","The attackers’ codes-team[.]com infrastructure included subdomains impersonating Microsoft Teams and Roblox download pages, indicating that the same infrastructure supported multiple software-themed lures.","eSentire said it reported the app through Microsoft’s abuse form on November 10, 2026, but received a response that the app was not a terms violation before the app later became unavailable."],"referencedReports":[{"title":"Vinci RAT Lives in the Microsoft Store","url":"https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store","publisher":"esentire","context":"The article relies on eSentire's technical analysis for details of the Setup Assistant application, Vinci RAT delivery chain, and command-and-control behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity firm eSentire reported that attackers used a fake snipping-tool website to distribute a Microsoft-signed installer named Snipping-Tool.exe. Running it installed Setup Assistant, an Electron-based application published by ETPS Ltd. through the Microsoft Store. The application was designed to act as a backdoor, communicating with attacker-controlled servers and executing supplied PowerShell or JavaScript code.\u003c/p\u003e\n\n\u003cp\u003eThe activity ultimately deployed Vinci RAT, which can identify the affected system, list installed security tools, provide remote and reverse-shell access, deliver files, and run several kinds of code. Its PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the RAT payload. eSentire also identified related codes-team[.]com subdomains that appeared to impersonate Microsoft Teams and Roblox download pages; Setup Assistant was no longer available in the Microsoft Store when the article was published.\u003c/p\u003e\n"},{"n":21,"title":"Suspected Vietnam-Linked Hackers Target Southeast Asia in South China Sea Espionage Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/suspected-vietnam-linked-hackers-target.html","time":"16:36","priority":"SHOULD READ","score":84,"tldr":"SOCRadar says a suspected Vietnam-linked espionage group dubbed WeaveLotus compromised Thai and Philippine government, military, and legislative targets by exploiting exposed applications and weak credentials to steal sensitive records related to South China Sea security. The group also reconnoitered Indonesian agencies and used reverse SSH tunnels, credential attacks, and data collection tools to maintain access.","briefOverview":"\u003cp\u003eSOCRadar reported that a suspected Vietnam-linked group it calls WeaveLotus conducted five confirmed intrusions against military, government, and legislative organizations in Thailand and the Philippines between August and September 2026. The group also performed reconnaissance against Indonesian government organizations, although SOCRadar said this did not progress to compromise. The campaign, codenamed RedOps, appears aimed at collecting internal records and documents related to Vietnam\u0026rsquo;s foreign-policy and military-intelligence priorities, including South China Sea defense and military agreements.\u003c/p\u003e\n\n\u003cp\u003eThe operators reportedly gained access by exploiting exposed web applications and default credentials in products including GeoServer, JasperReports, osTicket, and Laravel deployments. They used reverse SSH tunnels and SOCKS proxies to maintain internal access and move into other systems, while also conducting password spraying, extracting databases, and collecting large volumes of records and archives. SOCRadar cited Vietnamese-language code comments, UTC+07:00 working hours, strategic targeting, and custom scripts as evidence linking the activity to Vietnam, while noting that the available evidence does not conclusively establish state sponsorship.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOCRadar identified a suspected Vietnam-linked activity cluster called WeaveLotus that conducted five confirmed intrusions against military, government, and legislative organizations in Thailand and the Philippines between August and September 2026.","The operators gained initial access chiefly through exposed web-application flaws and default credentials in GeoServer, JasperReports, osTicket, and Laravel deployments, then maintained access through reverse SSH tunnels.","In one Thai military intrusion, the attackers likely exploited CVE-2024-36401 in GeoServer, accessed Directus file records, performed text extraction on collected images, and attempted to access surveillance video feeds.","In a Thai government intrusion, the attackers obtained Keycloak credentials, cracked password hashes, and used valid accounts to retrieve 349,782 records from a downstream application.","The group also performed reconnaissance against more than 30 Indonesian government organizations, but SOCRadar said this activity did not advance beyond reconnaissance."],"insights":["The campaign focused exclusively on government, military, and legislative institutions in Thailand, the Philippines, and Indonesia, with no reported private-sector targets, which SOCRadar said is consistent with state-directed intelligence collection.","The attackers combined publicly available research on military agreements with intrusions into government systems, suggesting that stolen internal records were intended to complement information already available online.","In one Thai government case, password hashes were cracked using wordlists based on Thai Buddhist Era years and then tested against a login service, showing that locally predictable password choices helped expose accounts from multiple ministries and agencies.","A Thai legislative target was compromised through unchanged default JasperReports administrator credentials, and the attackers later used employee names paired with National ID numbers in password-spraying attempts against a document-management system."],"referencedReports":[{"title":"RedOps: WeaveLotus Southeast Asian Governments","url":"https://socradar.io/blog/redops-weavelotus-southeast-asian-governments/","publisher":"socradar","context":"The article relies on SOCRadar's technical analysis attributing five intrusions and regional reconnaissance activity to the suspected Vietnam-linked WeaveLotus cluster.","category":"research","primary":true}],"body":"\u003cp\u003eSOCRadar reported that a suspected Vietnam-linked group it calls WeaveLotus conducted five confirmed intrusions against military, government, and legislative organizations in Thailand and the Philippines between August and September 2026. The group also performed reconnaissance against Indonesian government organizations, although SOCRadar said this did not progress to compromise. The campaign, codenamed RedOps, appears aimed at collecting internal records and documents related to Vietnam\u0026rsquo;s foreign-policy and military-intelligence priorities, including South China Sea defense and military agreements.\u003c/p\u003e\n\n\u003cp\u003eThe operators reportedly gained access by exploiting exposed web applications and default credentials in products including GeoServer, JasperReports, osTicket, and Laravel deployments. They used reverse SSH tunnels and SOCKS proxies to maintain internal access and move into other systems, while also conducting password spraying, extracting databases, and collecting large volumes of records and archives. SOCRadar cited Vietnamese-language code comments, UTC+07:00 working hours, strategic targeting, and custom scripts as evidence linking the activity to Vietnam, while noting that the available evidence does not conclusively establish state sponsorship.\u003c/p\u003e\n"},{"n":22,"title":"Hackers Trojanize Official Q-Dir and DesktopOK Downloads to Deliver Remote Access Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-trojanize-official-q-dir-and.html","time":"09:29","priority":"SHOULD READ","score":83,"tldr":"Official Q-Dir and DesktopOK installers and updates from SoftwareOK were reportedly trojanized to install a Python-based remote-access tool that can execute commands, steal files, and capture screenshots. Users of affected versions should check installer hashes and persistence mechanisms such as suspicious scheduled tasks, as reinstalling the apps alone may not remove the RAT.","briefOverview":"\u003cp\u003eCybersecurity company AhnLab reported that official SoftwareOK download and update files for the Windows utilities Q-Dir and DesktopOK were altered to include a Python-based remote-access tool. The malicious installer runs the legitimate application to reduce suspicion while also downloading and installing the hidden payload. Confirmed affected releases include Q-Dir 12.83.0.0, 12.84.0.0, and 12.85.0.0, plus DesktopOK 12.82.0.0 and 12.85.0.0.\u003c/p\u003e\n\n\u003cp\u003eThe installer downloads the legitimate 7-Zip executable and a package containing the remote-access tool and a Python runtime from mail.c1a2[.]top. The tool creates a scheduled task disguised as Microsoft Edge and connects to 8.210.69[.]51:9876, where it can receive instructions to run commands, transfer files, capture screenshots, and collect system information. It also checks for installed security products and sends the results to its control server; AhnLab said users should check hashes, scheduled tasks, suspicious Python environments, related files, and external network communications because reinstalling the affected applications alone may not remove the tool.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AhnLab reported that official SoftwareOK downloads and updates for Q-Dir and DesktopOK were tampered with to install a Python-based remote-access tool.","Confirmed poisoned versions include Q-Dir 12.83.0.0, 12.84.0.0, and 12.85.0.0, as well as DesktopOK 12.82.0.0 and 12.85.0.0.","The malicious installer launches the legitimate application while downloading 7-Zip and a package containing the remote-access tool and its Python runtime from mail.c1a2[.]top.","The remote-access tool can run shell commands and Python code, transfer files, capture screenshots, and collect operating-system and system information after connecting to 8.210.69[.]51:9876.","The malware creates a scheduled task disguised as Microsoft Edge for persistence, and it checks running processes for numerous security products before sending the results to its command-and-control server."],"insights":["The compromise affected both direct downloads and the update process, meaning users could have received the malicious installer even after initially installing a legitimate version.","The installer runs the expected Q-Dir or DesktopOK program while installing the hidden remote-control tool, which is designed to reduce the chance that users notice anything unusual.","Removing and reinstalling the affected program may not eliminate the threat because the remote-control tool establishes a scheduled task that can continue launching it.","The malware reports detected security software to its control server, which AhnLab said could help attackers plan later activity or provide software designed to evade detection.","Although Chinese-language comments were found in the source code, AhnLab did not attribute the activity to a known threat actor."],"referencedReports":[{"title":"AhnLab analysis of trojanized Q-Dir and DesktopOK installers","url":"https://asec.ahnlab.com/en/96827/","publisher":"ahnlab","context":"The article relies on AhnLab's technical analysis for details of the tampered SoftwareOK installers, the Python RAT, and its persistence and command-and-control behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity company AhnLab reported that official SoftwareOK download and update files for the Windows utilities Q-Dir and DesktopOK were altered to include a Python-based remote-access tool. The malicious installer runs the legitimate application to reduce suspicion while also downloading and installing the hidden payload. Confirmed affected releases include Q-Dir 12.83.0.0, 12.84.0.0, and 12.85.0.0, plus DesktopOK 12.82.0.0 and 12.85.0.0.\u003c/p\u003e\n\n\u003cp\u003eThe installer downloads the legitimate 7-Zip executable and a package containing the remote-access tool and a Python runtime from mail.c1a2[.]top. The tool creates a scheduled task disguised as Microsoft Edge and connects to 8.210.69[.]51:9876, where it can receive instructions to run commands, transfer files, capture screenshots, and collect system information. It also checks for installed security products and sends the results to its control server; AhnLab said users should check hashes, scheduled tasks, suspicious Python environments, related files, and external network communications because reinstalling the affected applications alone may not remove the tool.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft pushes emergency hotpatch to fix Windows Server crashes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/new-out-of-band-oob-emergency-hotpatch-fixes-windows-server-2025-crashes/","time":"09:08","priority":"SHOULD READ","score":78,"tldr":"Microsoft released emergency out-of-band hotpatch KB5138318 for Windows Server 2025 to fix 0x139 crashes triggered when time-bound IPv6 route timers expire after the November 2026 hotpatch update. The fix installs automatically for affected hotpatch-enrolled servers without requiring a reboot.","briefOverview":"\u003cp\u003eMicrosoft released emergency out-of-band hotpatch KB5138318 for Windows Server 2025 after the November 2026 security hotpatch KB5131077 caused crashes on some systems. The affected servers may stop unexpectedly with error 0x139, identified as KERNEL_SECURITY_CHECK_FAILURE. Microsoft said the issue affects a limited number of devices with Router Advertisement enabled that receive time-bound IPv6 routes.\u003c/p\u003e\n\n\u003cp\u003eThe crash can occur when a route timer expires. KB5138318 is rolling out through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates, and it downloads and installs automatically without requiring a restart. Microsoft also reported separate November hotpatch-related issues affecting Windows 11 application installation and launch behavior, as well as printing on systems using Forcepoint’s DLP Endpoint Agent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released out-of-band hotpatch KB5138318 to address Windows Server 2025 crashes caused by the November 2026 security hotpatch KB5131077.","Affected Windows Server 2025 devices with Router Advertisement enabled may stop with error 0x139 when a time-bound IPv6 route expires.","KB5138318 is rolling out automatically through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates and does not require a restart.","Microsoft also reported that November 2026 hotpatch updates have caused application installation and launch issues on Windows 11 and printing issues for systems using Forcepoint’s DLP Endpoint Agent.","Microsoft said hotpatch security updates would be enabled by default for eligible Microsoft Intune- and Microsoft Graph API-managed Windows devices after the May 2026 security updates."],"insights":["The server crash condition is limited to Windows Server 2025 devices with Router Advertisement enabled that receive time-bound IPv6 routes, which helps narrow the systems most likely to need attention.","Because KB5138318 installs automatically for affected hotpatch-enrolled servers and takes effect without a restart, organizations can receive the correction without scheduling downtime for a reboot.","The same month’s hotpatch updates are associated with separate Windows 11 application and Forcepoint DLP Endpoint Agent printing problems, indicating that the reported issues are not confined to Windows Server 2025.","Microsoft had planned to enable hotpatch security updates by default for eligible Intune- and Microsoft Graph API-managed Windows devices, increasing the relevance of hotpatch-related issues for managed environments."],"referencedReports":[{"title":"Microsoft Message Center update #5097","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#5097","publisher":"microsoft","context":"Microsoft’s message center update states that some Windows Server 2025 devices can stop with error 0x139 when time-bound IPv6 route timers expire after the November 2026 hotpatch update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released emergency out-of-band hotpatch KB5138318 for Windows Server 2025 after the November 2026 security hotpatch KB5131077 caused crashes on some systems. The affected servers may stop unexpectedly with error 0x139, identified as KERNEL_SECURITY_CHECK_FAILURE. Microsoft said the issue affects a limited number of devices with Router Advertisement enabled that receive time-bound IPv6 routes.\u003c/p\u003e\n\n\u003cp\u003eThe crash can occur when a route timer expires. KB5138318 is rolling out through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates, and it downloads and installs automatically without requiring a restart. Microsoft also reported separate November hotpatch-related issues affecting Windows 11 application installation and launch behavior, as well as printing on systems using Forcepoint’s DLP Endpoint Agent.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft removes WSUS server role in Windows Server 2028","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-removes-wsus-server-role-in-windows-server-2028/","time":"11:18","priority":"SHOULD READ","score":78,"tldr":"Microsoft will remove the WSUS server role from Windows Server 2028, although WSUS will remain supported on earlier releases such as Windows Server 2025 through their support lifecycles. Organizations should plan to migrate update management to Windows Autopatch, Microsoft Intune, and Azure Update Manager.","briefOverview":"\u003cp\u003eMicrosoft has confirmed that Windows Server 2028 will remove the Windows Server Update Services (WSUS) server role. WSUS lets administrators centrally manage and distribute Microsoft updates across large numbers of Windows devices instead of having each device download updates individually. Microsoft officially deprecated WSUS in September 2024 but said it would continue maintaining its existing functionality and publishing updates through the channel. The removal primarily affects enterprise environments that depend on WSUS for update management, not home users or organizations using Microsoft Configuration Manager.\u003c/p\u003e\n\n\u003cp\u003eWSUS will remain available and supported on earlier Windows Server releases, including Windows Server 2025, for the duration of their support lifecycles. Microsoft says WSUS installed on those earlier releases can still manage updates for supported Windows clients and servers, including Windows Server 2028. The company recommends that organizations move to Windows Autopatch and Microsoft Intune for client update management, and Azure Update Manager for server update management. Microsoft also stated that it recognizes the need for update management in disconnected and highly controlled environments and will share more as that work progresses.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2028 will additionally remove VBScript, the legacy Windows Management Instrumentation Command-line utility (WMIC), and Windows Internet Name Service (WINS) support. Microsoft says removing VBScript and WMIC helps thwart malware and attack tactics that abuse those components. Windows Server 2028 was announced at the Ignite 2026 conference and is available for testing through the Windows Insider Program for Windows Server or the Windows Server Technology Adoption Program.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft will remove the Windows Server Update Services (WSUS) server role from Windows Server 2028.","WSUS remains available and supported on earlier Windows Server releases, including Windows Server 2025, for each release's support lifecycle.","Microsoft says WSUS on supported earlier server releases can continue managing updates for supported Windows clients and servers, including Windows Server 2028.","Microsoft recommends Windows Autopatch and Microsoft Intune for client update management and Azure Update Manager for server update management.","Windows Server 2028 will also remove VBScript, the legacy WMIC utility, and Windows Internet Name Service (WINS) support."],"insights":["Organizations do not need Windows Server 2028 to manage updates for Windows Server 2028: WSUS hosted on a supported earlier Windows Server release can still distribute those updates.","The WSUS change is a removal of the server role from the next release, not an immediate shutdown; Windows Server 2025 retains WSUS throughout its support lifecycle.","Microsoft specifically recognizes that disconnected and highly controlled environments need update-management options, but says further details will be shared as that work progresses.","Windows Server 2028’s removal of VBScript, WMIC, and WINS accompanies the WSUS change and eliminates older components that Microsoft says have been abused in malware and attack tactics."],"referencedReports":[{"title":"Features removed or no longer developed starting with Windows Server 2028","url":"https://learn.microsoft.com/en-us/windows-server/get-started/removed-deprecated-features-windows-server?tabs=ws28-preview#:~:text=Next%20steps.-,Windows%20Server%20Update%20Services%20%28WSUS%29,-Windows%20Server%202028","publisher":"microsoft","context":"Microsoft's updated support documentation confirms that the WSUS server role is removed in Windows Server 2028.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has confirmed that Windows Server 2028 will remove the Windows Server Update Services (WSUS) server role. WSUS lets administrators centrally manage and distribute Microsoft updates across large numbers of Windows devices instead of having each device download updates individually. Microsoft officially deprecated WSUS in September 2024 but said it would continue maintaining its existing functionality and publishing updates through the channel. The removal primarily affects enterprise environments that depend on WSUS for update management, not home users or organizations using Microsoft Configuration Manager.\u003c/p\u003e\n\n\u003cp\u003eWSUS will remain available and supported on earlier Windows Server releases, including Windows Server 2025, for the duration of their support lifecycles. Microsoft says WSUS installed on those earlier releases can still manage updates for supported Windows clients and servers, including Windows Server 2028. The company recommends that organizations move to Windows Autopatch and Microsoft Intune for client update management, and Azure Update Manager for server update management. Microsoft also stated that it recognizes the need for update management in disconnected and highly controlled environments and will share more as that work progresses.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2028 will additionally remove VBScript, the legacy Windows Management Instrumentation Command-line utility (WMIC), and Windows Internet Name Service (WINS) support. Microsoft says removing VBScript and WMIC helps thwart malware and attack tactics that abuse those components. Windows Server 2028 was announced at the Ignite 2026 conference and is available for testing through the Windows Insider Program for Windows Server or the Windows Server Technology Adoption Program.\u003c/p\u003e\n"},{"n":7,"title":"pCloud confirms password manager hack after suspicious login alerts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/pcloud-confirms-password-manager-hack-after-suspicious-login-alerts/","time":"19:26","priority":"SHOULD READ","score":78,"tldr":"pCloud confirmed that its pCloud Pass password manager was targeted in a contained cyberattack that exposed a small number of user email addresses and triggered suspicious login alerts, including for accounts protected by 2FA. The company says password vault contents were not compromised, but has not said whether encrypted vaults were accessed or stolen.","briefOverview":"\u003cp\u003epCloud confirmed that its pCloud Pass password manager was targeted in a cyberattack that the company says was promptly contained. Users had reported email alerts saying an unfamiliar device named \u0026ldquo;pd\u0026rdquo; connected to their accounts from an IP address in Luxembourg, including users who had two-factor authentication enabled. pCloud said a small number of pCloud Pass user email addresses were exposed and login attempts were made, which triggered automatic notifications.\u003c/p\u003e\n\n\u003cp\u003eThe company said the incident was isolated to pCloud Pass and did not affect its cloud-storage services. It also said passwords, notes, and other data in pCloud Pass were not compromised because they are encrypted on customers\u0026rsquo; devices and require their master passwords to decrypt. However, pCloud did not disclose whether encrypted password vaults were accessed or stolen, a significant omission because stolen encrypted vaults could be targeted with offline password-cracking attempts outside normal login rate limits and two-factor authentication protections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["pCloud confirmed that a cyberattack targeting its pCloud Pass password manager was promptly contained.","The company said a small number of pCloud Pass user email addresses were exposed and login attempts were made, triggering automatic notifications.","Users reported alerts about an unfamiliar device named \"pd\" connecting from an IP address in Luxembourg, including some users with two-factor authentication enabled.","pCloud said its cloud-storage services were not affected and that passwords, notes, and other pCloud Pass data were not compromised because they are encrypted on customers' devices.","pCloud did not disclose whether encrypted password vaults were accessed or stolen during the incident and warned users to watch for phishing attempts."],"insights":["Two-factor authentication did not prevent users from receiving suspicious-login alerts, showing that the notifications reflected login attempts rather than necessarily successful account access.","Some recipients said they had never used pCloud Pass, and one said the alert went to an email address tied to a storage account requested for deletion nearly a year earlier.","The notification’s “Open settings” link pointed to passqa1.pcloud.com, which appears to be a quality-assurance environment rather than the production password-manager site.","Although pCloud says vault contents remain encrypted on users’ devices, it did not say whether attackers obtained encrypted vaults; such copies could be targeted with password-guessing attempts outside normal login limits and two-factor authentication protections."],"referencedReports":[],"body":"\u003cp\u003epCloud confirmed that its pCloud Pass password manager was targeted in a cyberattack that the company says was promptly contained. Users had reported email alerts saying an unfamiliar device named \u0026ldquo;pd\u0026rdquo; connected to their accounts from an IP address in Luxembourg, including users who had two-factor authentication enabled. pCloud said a small number of pCloud Pass user email addresses were exposed and login attempts were made, which triggered automatic notifications.\u003c/p\u003e\n\n\u003cp\u003eThe company said the incident was isolated to pCloud Pass and did not affect its cloud-storage services. It also said passwords, notes, and other data in pCloud Pass were not compromised because they are encrypted on customers\u0026rsquo; devices and require their master passwords to decrypt. However, pCloud did not disclose whether encrypted password vaults were accessed or stolen, a significant omission because stolen encrypted vaults could be targeted with offline password-cracking attempts outside normal login rate limits and two-factor authentication protections.\u003c/p\u003e\n"},{"n":8,"title":"New Boston Scientific data breach exposes personal, medical info","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-boston-scientific-data-breach-exposes-personal-medical-info/","time":"18:57","priority":"SHOULD READ","score":78,"tldr":"Boston Scientific disclosed a vishing-driven cloud breach affecting 117,789 people in the United States, exposing personal identifiers, health insurance details, and medical information. The company says patient records, connected-device data, and product operations were not affected, and the incident is unrelated to its separate August 2026 cyberattack.","briefOverview":"\u003cp\u003eBoston Scientific is notifying people affected by a cyberattack in which a hacker used a voice-based social-engineering scheme to access the company\u0026rsquo;s cloud infrastructure. The company became aware of the unauthorized access on May 12, and its investigation determined that a data breach occurred on November 5. Texas Attorney General records list 117,789 affected individuals.\u003c/p\u003e\n\n\u003cp\u003eThe exposed information included names, addresses, Social Security numbers, government-issued ID numbers, dates of birth, medical information, and health insurance information. Boston Scientific said patient medical records and data from remote monitoring systems, connected medical devices, and clinical workflow applications were not exposed, and it reported no impact to product safety, performance, remote monitoring, manufacturing, ordering, distribution, or patient services. The company said the incident is unrelated to the separate August 2026 cyberattack that caused global operational disruption, and it recommends affected people use free credit reports and consider fraud alerts or credit freezes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Boston Scientific said a caller using social engineering gained access to its cloud infrastructure, exposing cloud-based applications and hosted data.","The company became aware of unauthorized access on May 12, and its investigation determined that a data breach occurred on November 5.","The Texas Attorney General breach portal reports that 117,789 people were affected, with exposed data including names, addresses, Social Security numbers, government ID numbers, medical information, health insurance information, and dates of birth.","Boston Scientific said patient medical records and data from remote monitoring systems, connected medical devices, and clinical workflow applications were not exposed.","The company said this incident did not disrupt its operations or affect the safety, performance, or remote monitoring of its medical devices, and that it is unrelated to the August 2026 cyberattack."],"insights":["Boston Scientific did not offer free credit monitoring, instead directing affected people to free credit reports and suggesting fraud alerts or credit freezes.","The company specifically distinguished the exposed cloud-hosted information from patient records and data generated by remote monitoring systems, connected medical devices, and clinical workflow applications, which it said were not exposed.","This was Boston Scientific’s second disclosed cybersecurity incident in 2026, but the company said it was unrelated to the August incident that disrupted ordering and shipping globally.","CrowdStrike’s investigation of the August incident found no evidence of compromised cloud applications, while the newer incident involved unauthorized access to Boston Scientific’s cloud infrastructure."],"referencedReports":[{"title":"Boston Scientific California Breach Notification","url":"https://www.documentcloud.org/documents/28936291-bsci-california-breach-notification/","publisher":"boston-scientific","context":"The article cites a sample breach notification Boston Scientific shared with U.S. authorities as the source for details of the voice-phishing intrusion and exposed cloud data.","category":"advisory","primary":true}],"body":"\u003cp\u003eBoston Scientific is notifyin
