e technical problem was that Bing’s pipeline treated the submitted content as an image while an underlying helper read part of it as a command. One route used the public Search by Image upload endpoint with a base64 SVG in the imageBin field, and the other used the imgurl parameter so Bingbot fetched a hosted SVG into the same pipeline. The article says the safer approach for untrusted image processing is to deny ImageMagick delegates, reduce accepted formats, sandbox conversion, reduce privileges, and block outbound network access from workers.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft blames massive Microsoft 365 outage on maintenance bug","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-blames-massive-microsoft-365-outage-on-maintenance-bug/","time":"15:41","priority":"SHOULD READ","score":82,"tldr":"Microsoft says a bug in its automated network maintenance system mistakenly removed too many IP routes in the West US Azure region, causing a major Microsoft 365 and Azure outage. The company rolled back the change, restored services, and is reviewing its maintenance safety checks.","briefOverview":"\u003cp\u003eMicrosoft said a bug in its automated network maintenance request system caused a major outage affecting Azure and Microsoft 365 services. The outage began at 10:44 AM ET on Thursday, July 23, and mostly affected customers accessing Microsoft 365 services through infrastructure connected to Microsoft’s West US Azure region. Downdetector recorded 2,403 outage reports at 11:11 AM ET, far above its normal baseline of 29, with SharePoint accounting for most complaints.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft tracked the Microsoft 365 incident as MO1437424 and said affected services included OneDrive, SharePoint Online, Microsoft Teams, the Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop. Other affected services included Fabric and Power BI, Power Apps, Copilot Studio, Windows 365, and Microsoft Defender. Some Defender customers experienced delays receiving responses from Microsoft Defender Experts, and some investigations, workflows, and remediation actions through Threat Explorer and Advanced Hunting could fail.\u003c/p\u003e\n\n\u003cp\u003eIn a preliminary Azure Post Incident Review, Microsoft said routine device maintenance in the West US Azure region incorrectly removed IP routes from more devices than intended between a West US datacenter and Microsoft’s wide-area network. Microsoft first tried rerouting traffic through alternate network paths, then identified a recent networking change as the cause and rolled it back, completing the reversion at 2:26 PM ET. Microsoft said all affected Azure services had fully recovered by 3:41 PM ET and that it is conducting a full internal review of safety checks and automated maintenance request processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said a bug in its automated network maintenance request system caused Thursday's outage by mistakenly removing IP routes from more devices than intended.","The outage began at 10:44 AM ET on July 23 and mostly affected customers accessing Microsoft 365 services through infrastructure connected to Microsoft’s West US Azure region.","Impacted Microsoft 365 services included OneDrive, SharePoint Online, Microsoft Teams, the Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop.","Microsoft completed a rollback of the maintenance change at 2:26 PM ET, and all affected Azure services had fully recovered by 3:41 PM ET.","Microsoft said it is conducting a full internal review focused on safety checks and automated maintenance request processes and will publish a final Post Incident Review after completing its investigation."],"insights":["Microsoft’s warning for customers to review business continuity and disaster recovery plans came before it had identified the root cause, showing that customers may need to act on continuity plans during a cloud outage even while the provider is still investigating.","The incident affected services beyond Microsoft 365, including Azure networking, database, monitoring, security, and analytics services, indicating that a network maintenance error in one region can disrupt a wide range of dependent cloud products.","Microsoft’s safety check was intended to verify that at least one of two redundant paths remained healthy, but the outage still occurred because the request conversion system incorrectly expanded the maintenance scope.","Traffic that stayed entirely within the West US region was not affected, while traffic entering or leaving the region was disrupted, highlighting that the outage was tied to regional connectivity rather than all services running inside the region."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft said a bug in its automated network maintenance request system caused a major outage affecting Azure and Microsoft 365 services. The outage began at 10:44 AM ET on Thursday, July 23, and mostly affected customers accessing Microsoft 365 services through infrastructure connected to Microsoft’s West US Azure region. Downdetector recorded 2,403 outage reports at 11:11 AM ET, far above its normal baseline of 29, with SharePoint accounting for most complaints.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft tracked the Microsoft 365 incident as MO1437424 and said affected services included OneDrive, SharePoint Online, Microsoft Teams, the Microsoft 365 Admin Center, Power Automate, Copilot Chat, and Microsoft Loop. Other affected services included Fabric and Power BI, Power Apps, Copilot Studio, Windows 365, and Microsoft Defender. Some Defender customers experienced delays receiving responses from Microsoft Defender Experts, and some investigations, workflows, and remediation actions through Threat Explorer and Advanced Hunting could fail.\u003c/p\u003e\n\n\u003cp\u003eIn a preliminary Azure Post Incident Review, Microsoft said routine device maintenance in the West US Azure region incorrectly removed IP routes from more devices than intended between a West US datacenter and Microsoft’s wide-area network. Microsoft first tried rerouting traffic through alternate network paths, then identified a recent networking change as the cause and rolled it back, completing the reversion at 2:26 PM ET. Microsoft said all affected Azure services had fully recovered by 3:41 PM ET and that it is conducting a full internal review of safety checks and automated maintenance request processes.\u003c/p\u003e\n"},{"n":6,"title":"Europol flags 4,340 URLs for removal in 'The Com' crackdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/europol-flags-4-340-urls-for-removal-in-the-com-crackdown/","time":"12:56","priority":"SHOULD READ","score":82,"tldr":"Europol and investigators from nine countries flagged 4,340 URLs for removal in a crackdown on The Com, a decentralized extremist network linked to violent content, child exploitation, self-harm coercion, and cybercrime. The action builds on Project Compass, which has already led to 30 arrests and identified 179 suspects tied to the network.","briefOverview":"\u003cp\u003eEuropol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to “The Com,” a loosely organized network of nihilistic violent extremist groups. Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in the Referral Action Days between June and July 2026. The action was organized by Europol’s EU Internet Referral Unit and Spain’s Intelligence Centre against Terrorism and Organised Crime, and it ties into the European Commission’s ProtectEU counterterrorism agenda.\u003c/p\u003e\n\n\u003cp\u003eEuropol said the operation aimed to disrupt The Com’s online ecosystem, limit the spread of its content, and generate new investigative leads. The content referenced included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and “manhunt” street attacks. Europol also said The Com produces manuals or guides on grooming, murder, improvised explosives, ideological viewpoints, doxing, and swatting.\u003c/p\u003e\n\n\u003cp\u003eThe action builds on Project Compass, a yearlong Europol-led operation launched in January 2025 that has involved law enforcement from 28 countries. That broader effort has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com. Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and the production of child sexual abuse material, often through extortion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Europol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to The Com, a loosely organized network of nihilistic violent extremist groups.","Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in Europol’s Referral Action Days between June and July 2026.","Europol said The Com content included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and manuals on grooming, murder, improvised explosives, doxing, and swatting.","Project Compass, a yearlong Europol-led operation launched in January 2025, has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com.","Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and production of child sexual abuse material."],"insights":["Europol highlighted that The Com uses coded language and emojis that adults may struggle to understand, making its harmful content harder for parents, guardians, and investigators to recognize quickly.","The Com spans both online and offline harm, with Europol describing subgroups tied to network intrusions and ransomware as well as property damage, terrorism, sextortion, and coercion of minors.","The operation aimed not only to remove harmful content but also to generate new investigative leads, showing that URL referrals were used as part of a broader law enforcement intelligence effort.","The Com’s recruitment path relies on public platforms first and then moves potential members and victims into private forums and chat rooms, where Europol says radicalisation and victimisation occur."],"referencedReports":[{"title":"The rise of online cult communities dedicated to extremely violent child abuse","url":"https://www.europol.europa.eu/cms/sites/default/files/documents/IN_The_rise_of_online_cult_communities_dedicated_to_extremely_violent_child_abuse.pdf","publisher":"Europol","context":"The article says Europol published this notification in January 2025 about online cult communities specifically targeting young people.","category":"","primary":false}],"body":"\u003cp\u003eEuropol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to “The Com,” a loosely organized network of nihilistic violent extremist groups. Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in the Referral Action Days between June and July 2026. The action was organized by Europol’s EU Internet Referral Unit and Spain’s Intelligence Centre against Terrorism and Organised Crime, and it ties into the European Commission’s ProtectEU counterterrorism agenda.\u003c/p\u003e\n\n\u003cp\u003eEuropol said the operation aimed to disrupt The Com’s online ecosystem, limit the spread of its content, and generate new investigative leads. The content referenced included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and “manhunt” street attacks. Europol also said The Com produces manuals or guides on grooming, murder, improvised explosives, ideological viewpoints, doxing, and swatting.\u003c/p\u003e\n\n\u003cp\u003eThe action builds on Project Compass, a yearlong Europol-led operation launched in January 2025 that has involved law enforcement from 28 countries. That broader effort has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com. Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and the production of child sexual abuse material, often through extortion.\u003c/p\u003e\n"},{"n":13,"title":"NodeBB Patches Eight AI-Found Flaws Exposing Admin Access and Private Chats","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nodebb-patches-eight-ai-found-flaws.html","time":"07:41","priority":"SHOULD READ","score":82,"tldr":"NodeBB patched eight high-severity flaws found by AI testing that could expose admin access, private messages, private categories, and enable XSS or post manipulation, with all versions before 4.14.0 affected. Administrators should upgrade to 4.14.2 because disabling federation only reduces exposure and does not fix all issues.","briefOverview":"\u003cp\u003eEight security flaws in NodeBB were publicly disclosed along with exploit code, after Aikido Security said its AI pentest agents found them during a six-hour review of the forum software\u0026rsquo;s source code. Aikido rated all eight as high severity, and every NodeBB version before 4.14.0 is affected. NodeBB has fixed all eight, and administrators are advised to upgrade to version 4.14.2.\u003c/p\u003e\n\n\u003cp\u003eThe flaws included a settings issue that could let a regular forum member open the admin dashboard, unauthenticated access to private messages and private categories, post takeover, vote inflation, and malicious code planted through federation-related paths. The widest flaw involved NodeBB\u0026rsquo;s page-building process, where user input could smuggle in translation codes that later allowed an attacker to plant a link that runs code when clicked. Most access from the admin dashboard issue was read-only, but it included items such as the error log and exported user lists, and the user could also change the site logo.\u003c/p\u003e\n\n\u003cp\u003eFive of the eight issues were in NodeBB\u0026rsquo;s federation code, which affects exposure differently depending on how a forum was installed or upgraded. Fresh version 4 installations federate by default and had all eight flaws, while forums upgraded from version 3 had federation switched off automatically and were affected by only three unless an administrator turned federation back on. None of the eight flaws has a CVE tracking number, and the article says no attacks using them have been reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido Security said its AI pentest agents found eight high-severity flaws in NodeBB during a six-hour source-code review, and exploit code for the flaws was published.","Every NodeBB version before 4.14.0 is affected, all eight flaws have been fixed, and administrators are advised to upgrade to version 4.14.2.","The flaws included a member-accessible admin dashboard issue, unauthenticated access to private messages and private categories, a sitewide link-based code execution issue, post takeover, vote inflation, and two federation-based malicious code issues.","Five of the eight flaws were in NodeBB's federation code, so freshly installed version 4 forums with federation on by default had all eight flaws, while upgraded version 3 forums with federation off had only three applicable flaws.","None of the eight flaws has a CVE tracking number, and nobody has reported attacks using them."],"insights":["Disabling federation is not a complete mitigation because three of the eight flaws are unrelated to NodeBB's federation code.","Fresh NodeBB version 4 installations were more exposed than upgraded version 3 forums because federation is enabled by default on fresh version 4 installs but was automatically switched off during version 3 upgrades.","The admin dashboard issue shows a server-side authorization gap because the interface blocked the dangerous homepage setting only in the browser, where it could be bypassed.","The fixes were spread across multiple releases from May through July, so administrators need the latest 4.14.2 release rather than assuming a single earlier patch fully addressed the problem.","The 4.14.0 template-handling rebuild touched 325 files, so upgrading may require extra work for sites using custom themes or plugins."],"referencedReports":[{"title":"Eight High-Severity Vulnerabilities in NodeBB","url":"https://www.aikido.dev/blog/eight-high-severity-vulnerabilities-nodebb","publisher":"Aikido Security","context":"The article says Aikido Security's AI pentest agents found the eight NodeBB flaws during a six-hour source-code review and links to Aikido's writeup.","category":"","primary":false},{"title":"CVE-2026-58593","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-58593","publisher":"National Vulnerability Database","context":"The article references a separate NodeBB federation flaw with a CVE record that is not one of Aikido's eight flaws.","category":"","primary":false}],"body":"\u003cp\u003eEight security flaws in NodeBB were publicly disclosed along with exploit code, after Aikido Security said its AI pentest agents found them during a six-hour review of the forum software\u0026rsquo;s source code. Aikido rated all eight as high severity, and every NodeBB version before 4.14.0 is affected. NodeBB has fixed all eight, and administrators are advised to upgrade to version 4.14.2.\u003c/p\u003e\n\n\u003cp\u003eThe flaws included a settings issue that could let a regular forum member open the admin dashboard, unauthenticated access to private messages and private categories, post takeover, vote inflation, and malicious code planted through federation-related paths. The widest flaw involved NodeBB\u0026rsquo;s page-building process, where user input could smuggle in translation codes that later allowed an attacker to plant a link that runs code when clicked. Most access from the admin dashboard issue was read-only, but it included items such as the error log and exported user lists, and the user could also change the site logo.\u003c/p\u003e\n\n\u003cp\u003eFive of the eight issues were in NodeBB\u0026rsquo;s federation code, which affects exposure differently depending on how a forum was installed or upgraded. Fresh version 4 installations federate by default and had all eight flaws, while forums upgraded from version 3 had federation switched off automatically and were affected by only three unless an administrator turned federation back on. None of the eight flaws has a CVE tracking number, and the article says no attacks using them have been reported.\u003c/p\u003e\n"},{"n":16,"title":"ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html","time":"11:53","priority":"SHOULD READ","score":82,"tldr":"Researchers disclosed AgentForger, a now-patched CSRF flaw in OpenAI’s ChatGPT Workspace Agents that could let a phishing link create and schedule a rogue AI agent inside a victim’s organization using their existing connectors. Such an agent could persistently access enterprise apps, execute attacker-supplied tasks, and exfiltrate data without further user interaction.","briefOverview":"\u003cp\u003eCybersecurity researchers at Zenity Labs disclosed a critical vulnerability in OpenAI\u0026rsquo;s ChatGPT Workspace Agents called \u003cstrong\u003eAgentForger\u003c/strong\u003e. The flaw could have allowed a single phishing link to stealthily build, authorize, and deploy an attacker-controlled autonomous AI agent inside a victim\u0026rsquo;s organization. OpenAI addressed the issue on June 8, 2026, following responsible disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe attack worked when a logged-in employee with access to Workspace Agents and at least one authorized connector clicked a crafted ChatGPT link. The link could cause ChatGPT Agent Builder to automatically submit and execute a prompt embedded in the URL, creating an agent from the chief-of-staff template, attaching available connectors, disabling approval prompts, publishing the agent, scheduling it to run hourly, and invoking Preview Mode. Zenity said the forged agent could then use connected apps such as Outlook, Gmail, Google Drive, Slack, or Teams to receive attacker tasks, access sensitive data, and report results back to the attacker.\u003c/p\u003e\n\n\u003cp\u003eZenity described the issue as an agent trust failure because the platform treated the agent’s creation, approvals, scheduling, and operation as intentional user actions. The article says the rogue agent could persist after the original click, keep receiving commands through emails with subjects beginning with “TASK,” and impersonate the victim to send phishing links on Teams. The findings were also discussed alongside Zenity’s prior research on attackers abusing exposed AI infrastructure, including LiteLLM vulnerabilities and exposed Ollama endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zenity Labs disclosed a critical vulnerability called AgentForger in OpenAI's ChatGPT Workspace Agents that could allow a phishing link to build, authorize, and deploy an attacker-controlled AI agent inside a victim's organization.","OpenAI addressed the AgentForger issue on June 8, 2026, after responsible disclosure.","The attack required the victim to be logged into ChatGPT, have access to Workspace Agents, and have at least one authorized connector such as Outlook, Gmail, Google Calendar, Google Drive, Slack, or Teams.","A malicious URL could cause ChatGPT Agent Builder to automatically submit and execute an embedded prompt in the victim's authenticated session without further interaction.","The forged agent could be scheduled to run every hour, use connected apps to receive attacker tasks by email, execute them, and report results back to the attacker."],"insights":["Preview Mode was especially dangerous in this attack path because it executed the newly created agent against the victim’s connected accounts rather than acting only as a harmless visual preview or dry run.","The attack turned normal enterprise connectors into both a source of sensitive data and a command channel, with each email whose subject began with “TASK” becoming a new assignment for the rogue agent.","The forged agent could continue operating after the original click because publishing and hourly scheduling made it persistent without requiring the Builder tab to remain open or the victim to click another link.","Zenity described the core issue as an agent trust failure because the platform treated the agent’s creation, approval changes, scheduling, and operation as if they were intentional actions by the user."],"referencedReports":[{"title":"AgentForger Part 1: ChatGPT Cross-Site Agent Forgery","url":"https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery","publisher":"Zenity Labs","context":"The article cites Zenity Labs' two-part report as the source of the AgentForger vulnerability disclosure and technical details.","category":"","primary":false},{"title":"AgentForger Part 2: The Autonomous Insider","url":"https://labs.zenity.io/p/agentforger-part-2-the-autonomous-insider","publisher":"Zenity Labs","context":"The article cites this Zenity Labs analysis for details on how the rogue agent could persist and receive attacker instructions through the victim's mailbox.","category":"","primary":false},{"title":"Why AI Security Research Needs to Move Out of the Lab and Into the Wild","url":"https://labs.zenity.io/p/why-ai-security-research-needs-to-move-out-of-the-lab-and-into-the-wild","publisher":"Zenity Labs","context":"The article references this earlier Zenity Labs work while discussing related findings about real-world abuse of exposed AI infrastructure.","category":"","primary":false},{"title":"Scanning for AI Live Campaigns: Mapping the Internet's Exposed LLM Backends","url":"https://labs.zenity.io/p/scanning-for-ai-live-campaigns-mapping-the-internet-s-exposed-llm-backends","publisher":"Zenity Labs","context":"The article links this Zenity Labs research as part of prior work on attackers exploiting exposed AI backends.","category":"","primary":false},{"title":"Bring Your Own Agent: Hijacking Exposed AI Backends to Power Offensive Operations","url":"https://labs.zenity.io/p/bring-your-own-agent-hijacking-exposed-ai-backends-to-power-offensive-operations","publisher":"Zenity Labs","context":"The article cites this Zenity Labs analysis in relation to hijacked AI infrastructure being used for offensive operations.","category":"","primary":false},{"title":"Threat Actors Are Trying to Turn LiteLLM's Connection Test Into a Key Exfiltration Channel","url":"https://labs.zenity.io/p/threat-actors-are-trying-to-turn-litellm-s-connection-test-into-a-key-exfiltration-channel","publisher":"Zenity Labs","context":"The article links this Zenity Labs technical analysis when mentioning abuse of CVE-2024-6587 in LiteLLM.","category":"","primary":false},{"title":"Threat Actors Are Trying to Use LiteLLM's Guardrail Tester to Run Code as Root","url":"https://labs.zenity.io/p/threat-actors-are-trying-to-use-litellm-s-guardrail-tester-to-run-code-as-root","publisher":"Zenity Labs","context":"The article links this Zenity Labs technical analysis when mentioning abuse of CVE-2026-40217 in LiteLLM.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Zenity Labs disclosed a critical vulnerability in OpenAI\u0026rsquo;s ChatGPT Workspace Agents called \u003cstrong\u003eAgentForger\u003c/strong\u003e. The flaw could have allowed a single phishing link to stealthily build, authorize, and deploy an attacker-controlled autonomous AI agent inside a victim\u0026rsquo;s organization. OpenAI addressed the issue on June 8, 2026, following responsible disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe attack worked when a logged-in employee with access to Workspace Agents and at least one authorized connector clicked a crafted ChatGPT link. The link could cause ChatGPT Agent Builder to automatically submit and execute a prompt embedded in the URL, creating an agent from the chief-of-staff template, attaching available connectors, disabling approval prompts, publishing the agent, scheduling it to run hourly, and invoking Preview Mode. Zenity said the forged agent could then use connected apps such as Outlook, Gmail, Google Drive, Slack, or Teams to receive attacker tasks, access sensitive data, and report results back to the attacker.\u003c/p\u003e\n\n\u003cp\u003eZenity described the issue as an agent trust failure because the platform treated the agent’s creation, approvals, scheduling, and operation as intentional user actions. The article says the rogue agent could persist after the original click, keep receiving commands through emails with subjects beginning with “TASK,” and impersonate the victim to send phishing links on Teams. The findings were also discussed alongside Zenity’s prior research on attackers abusing exposed AI infrastructure, including LiteLLM vulnerabilities and exposed Ollama endpoints.\u003c/p\u003e\n"},{"n":26,"title":"Fake Corepack Site Distributes Infostealer and Proxyware to Developers","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/fake-corepack-site-distributes-infostealer-and-proxyware?utm_medium=feed","time":"14:55","priority":"SHOULD READ","score":82,"tldr":"A fake corepack.org site is impersonating the Node.js Corepack tool and serving malicious Windows downloads that install an infostealer, persistence components, and proxyware. Developers should only install Corepack from npm or the official nodejs/corepack repository and treat any Corepack .exe download as malicious.","briefOverview":"\u003cp\u003eA website at \u003ccode\u003ecorepack[.]org\u003c/code\u003e is impersonating Corepack, the Node.js tool for managing package managers, and is offering malicious downloads to developers. Socket\u0026rsquo;s Threat Research team analyzed the site and described it as a developer-targeted phishing and impersonation operation. The article states that Corepack is not distributed as a Windows installer and that the real project has no official website at corepack.org.\u003c/p\u003e\n\n\u003cp\u003eThe campaign takes advantage of Corepack\u0026rsquo;s removal from future Node.js releases after the Node.js Technical Steering Committee voted in 2025 to stop distributing it with Node.js. Developers who still want Corepack now commonly install it from the npm registry, and the fake site targets people searching for how to get it. One contributor reported that corepack.org appeared as the second DuckDuckGo result for \u0026ldquo;corepack.\u0026rdquo;\u003c/p\u003e\n\n\u003cp\u003eClicking \u0026ldquo;Download Free\u0026rdquo; redirects to an OpenShield landing page and downloads \u003ccode\u003evpnsetup_d9gfqvs3dsic73fcvi90.exe\u003c/code\u003e, which drops OpenShield and a persistent Apprunner component. Dynamic analysis confirmed access to browser-profile data and stored SSH keys, host and process discovery, PowerShell and command-shell execution, and run-key persistence. OpenShield also enrolls the system in bandwidth sharing for third-party data-scraping traffic, while another path on the site downloads \u003ccode\u003eOperaGXSetup.exe\u003c/code\u003e through a deceptive adware-style delivery chain flagged as trojan activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The website corepack.org is impersonating Corepack, the Node.js tool for managing package managers, and has begun serving executable downloads to developers.","Socket's Threat Research team found that the site's \"Download Free\" path downloads vpnsetup_d9gfqvs3dsic73fcvi90.exe, which installs OpenShield and a persistent Apprunner component.","Dynamic analysis confirmed that the payload accesses browser-profile data and stored SSH keys, performs host and process discovery, executes PowerShell and command-shell commands, and uses run-key persistence.","OpenShield enrolls infected systems in bandwidth sharing for third-party data-scraping traffic, turning the machine into a proxy exit node.","The article states that Corepack is an npm package with no official installer at corepack.org, and users should install it from the npm registry or follow the official nodejs/corepack repository."],"insights":["The removal of Corepack from Node.js 25 created a timely search-demand gap that attackers are exploiting with a fake download site aimed at developers trying to install it manually.","The article notes that corepack.org reportedly appeared as the second DuckDuckGo result for \"corepack,\" making search placement a practical risk factor in this campaign.","The fake site existed earlier as a low-quality informational page before it began offering downloads, showing that a harmless-looking impersonation domain can later become active malware-delivery infrastructure.","Two separate download paths on the same fake domain lead to different monetization routes: one installs an infostealer and proxyware, while another leads to deceptive adware-style software delivery flagged as trojan activity.","The site’s AI-like mistakes, including confusing the Yarn package manager with textile yarn, provide a concrete warning sign that the page is not maintained by the real Corepack project."],"referencedReports":[{"title":"Hijacking Your Bandwidth: How Proxyware Apps Open You Up to Risk","url":"https://www.trendmicro.com/en_us/research/23/b/hijacking-your-bandwidth-how-proxyware-apps-open-you-up-to-risk.html","publisher":"Trend Micro","context":"The article links to Trend Micro research when explaining that hidden bandwidth-sharing installs are known as proxyjacking and are classified as proxyware or riskware.","category":"","primary":false}],"body":"\u003cp\u003eA website at \u003ccode\u003ecorepack[.]org\u003c/code\u003e is impersonating Corepack, the Node.js tool for managing package managers, and is offering malicious downloads to developers. Socket\u0026rsquo;s Threat Research team analyzed the site and described it as a developer-targeted phishing and impersonation operation. The article states that Corepack is not distributed as a Windows installer and that the real project has no official website at corepack.org.\u003c/p\u003e\n\n\u003cp\u003eThe campaign takes advantage of Corepack\u0026rsquo;s removal from future Node.js releases after the Node.js Technical Steering Committee voted in 2025 to stop distributing it with Node.js. Developers who still want Corepack now commonly install it from the npm registry, and the fake site targets people searching for how to get it. One contributor reported that corepack.org appeared as the second DuckDuckGo result for \u0026ldquo;corepack.\u0026rdquo;\u003c/p\u003e\n\n\u003cp\u003eClicking \u0026ldquo;Download Free\u0026rdquo; redirects to an OpenShield landing page and downloads \u003ccode\u003evpnsetup_d9gfqvs3dsic73fcvi90.exe\u003c/code\u003e, which drops OpenShield and a persistent Apprunner component. Dynamic analysis confirmed access to browser-profile data and stored SSH keys, host and process discovery, PowerShell and command-shell execution, and run-key persistence. OpenShield also enrolls the system in bandwidth sharing for third-party data-scraping traffic, while another path on the site downloads \u003ccode\u003eOperaGXSetup.exe\u003c/code\u003e through a deceptive adware-style delivery chain flagged as trojan activity.\u003c/p\u003e\n"},{"n":8,"title":"Slopsquatting, Phantom Domains, and HalluSquatting Are the Same AI Attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/slopsquatting-phantom-domains-and-hallusquatting-are-the-same-ai-attack/","time":"14:01","priority":"SHOULD READ","score":78,"tldr":"AI coding agents can predictably hallucinate package, repository, skill, or domain names that attackers can register and weaponize, turning automated fetch-and-execute workflows into supply-chain compromise paths. The key defense is to block agents from pulling unverified resources by using pre-fetch validation and governed, pre-vetted dependency catalogs.","briefOverview":"\u003cp\u003eThe article argues that slopsquatting, phantom squatting, and HalluSquatting are variations of the same AI security flaw: AI coding agents can trust names they generated without verifying that those names are legitimate. It describes an attack in which an attacker predicts fake package, domain, repository, or skill names that an AI tool may produce, registers those names, and waits for an automated process to fetch something malicious. Researchers at Tel Aviv University, Technion, and Intuit found that models hallucinated identical names up to 85% of the time for repository requests and 100% of the time for skill installs across tools including Cursor, Windsurf, GitHub Copilot, Cline, Gemini CLI, and OpenClaw.\u003c/p\u003e\n\n\u003cp\u003eThe article says this matters because AI agents may have permission to download, change, execute, and deploy code without enough human review. It warns that HalluSquatting can scale beyond one machine because the agent itself performs the delivery work, without requiring stolen passwords, phishing emails, worms, or link clicks. The article also says the risk can extend beyond top-level packages into transitive dependencies several layers deep, where a compromise may be pulled into automated systems.\u003c/p\u003e\n\n\u003cp\u003eThe article describes the underlying design problem as late binding, where generated text is turned into commands or fetches before the source has been vetted and verified. It says existing backstops such as scanners, SSL certificates, and DNSSEC do not reliably solve the issue, because they do not prove that a name was intended, safe, or previously verified. The article recommends pre-fetch verification and routing open source dependency resolution through a governed, pre-vetted catalog so unverified components are not visible to agents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says slopsquatting, phantom squatting, and HalluSquatting all exploit the same flaw: an AI agent trusts a generated name that has not been verified.","Researchers at Tel Aviv University, Technion, and Intuit found that models hallucinated identical names up to 85% of the time for repository requests and 100% of the time for skill installs across tools including Cursor, Windsurf, GitHub Copilot, Cline, Gemini CLI, and OpenClaw.","The article says attackers can pre-register predictable fake package, domain, repository, or skill names and wait for an automated process to fetch something malicious without stealing passwords, sending phishing emails, or requiring a link click.","The article argues that traditional backstops such as scanners, SSL certificates, and DNSSEC do not reliably stop this threat because they do not prove that a fetched name was intended, safe, or vetted before use.","The article recommends pre-fetch verification and routing open source dependency resolution through a governed, pre-vetted catalog so unverified components are not visible to AI agents."],"insights":["The article frames HalluSquatting as more scalable than earlier slopsquatting and phantom squatting because the AI agent itself performs the delivery work that a botnet operator would otherwise need compromised machines to do.","The researchers treated their measured results as a minimum risk level, arguing that attacker methods are likely to become faster and more accurate over time.","The article highlights that risk can enter through transitive dependencies several layers below a package, even when the top-level package name is real and appears correct.","The article distinguishes pre-vetted catalogs from scanners by arguing that catalogs remove unapproved components before an agent can request them, while scanners inspect unknown uploads at the moment attackers have optimized them to evade detection."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that slopsquatting, phantom squatting, and HalluSquatting are variations of the same AI security flaw: AI coding agents can trust names they generated without verifying that those names are legitimate. It describes an attack in which an attacker predicts fake package, domain, repository, or skill names that an AI tool may produce, registers those names, and waits for an automated process to fetch something malicious. Researchers at Tel Aviv University, Technion, and Intuit found that models hallucinated identical names up to 85% of the time for repository requests and 100% of the time for skill installs across tools including Cursor, Windsurf, GitHub Copilot, Cline, Gemini CLI, and OpenClaw.\u003c/p\u003e\n\n\u003cp\u003eThe article says this matters because AI agents may have permission to download, change, execute, and deploy code without enough human review. It warns that HalluSquatting can scale beyond one machine because the agent itself performs the delivery work, without requiring stolen passwords, phishing emails, worms, or link clicks. The article also says the risk can extend beyond top-level packages into transitive dependencies several layers deep, where a compromise may be pulled into automated systems.\u003c/p\u003e\n\n\u003cp\u003eThe article describes the underlying design problem as late binding, where generated text is turned into commands or fetches before the source has been vetted and verified. It says existing backstops such as scanners, SSL certificates, and DNSSEC do not reliably solve the issue, because they do not prove that a name was intended, safe, or previously verified. The article recommends pre-fetch verification and routing open source dependency resolution through a governed, pre-vetted catalog so unverified components are not visible to agents.\u003c/p\u003e\n"},{"n":11,"title":"Andy Burnham signals continuity on UK cyber policy, reappoints minister despite scrapping ministry","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/andy-burnham-liz-lloyd-cyber-policy-uk","time":"17:14","priority":"SHOULD READ","score":78,"tldr":"Andy Burnham reappointed Liz Lloyd to continue leading UK cyber policy and the Cyber Security and Resilience Bill, signaling continuity despite abolishing the department that previously oversaw the brief. Cyber policy will now move to DCMS as the former DSIT is split across multiple departments.","briefOverview":"\u003cp\u003eNew Prime Minister Andy Burnham reappointed Liz Lloyd to a junior post at the Department for Digital, Culture, Media and Sport, while she retained a second role at the renamed Department for Business, Innovation, Science and Trade. Her formal portfolio has not been announced, but Whitehall sources said she will resume the cyber brief. Lloyd has led on cyber since September 2025 and is steering the government’s Cyber Security and Resilience Bill through the House of Lords.\u003c/p\u003e\n\n\u003cp\u003eThe reappointment signals continuity in UK cyber policy despite Burnham abolishing the Department for Science, Innovation and Technology, which had overseen cyber policy since 2023. Burnham split the former department’s functions across three places: cyber policy and government digital services to DCMS, science to DBIST, and artificial intelligence policy and the AI Security Institute to the Cabinet Office. Industry figures warned that the split discards the integration of data, digital capability, and AI that had been the department’s principal strength.\u003c/p\u003e\n\n\u003cp\u003eThe Cyber Security and Resilience Bill would update rules dating from 2018, extend cyber regulations to more organizations, and bring data centers and managed service providers into scope. It would also set incident reporting deadlines for operators of essential services including energy, water, and health care, and give ministers powers to amend rules and issue directions to companies on national security grounds. Line-by-line scrutiny of the bill begins in September, and the government wants it passed this year.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["New Prime Minister Andy Burnham reappointed Liz Lloyd to a junior post at the Department for Digital, Culture, Media and Sport while she retained a second job at the renamed Department for Business, Innovation, Science and Trade.","Whitehall sources said Lloyd is expected to resume the cyber brief, which she has led since September 2025, although her formal portfolio has not been announced.","Lloyd is steering the Cyber Security and Resilience Bill through the House of Lords, where it cleared second reading earlier this month with cross-party support and is due for line-by-line scrutiny in September.","The Cyber Security and Resilience Bill would extend UK cyber regulations to more organizations, bring data centers and managed service providers into scope, and set incident reporting deadlines for essential services including energy, water, and health care.","Burnham broke up the Department for Science, Innovation and Technology, moving cyber policy and government digital services to DCMS, science to DBIST, and artificial intelligence policy and the AI Security Institute to the Cabinet Office."],"insights":["Burnham’s decision to keep Liz Lloyd on the cyber brief stands out because his early appointments otherwise removed many allies of Keir Starmer, and Lloyd had been close to Starmer as his former director of policy delivery.","Replacing Lloyd shortly before September’s line-by-line scrutiny of the Cyber Security and Resilience Bill could have caused fresh briefing needs and possible delays to legislation the government wants passed this year.","The government’s reorganization separates artificial intelligence security work from the cyber brief for the first time, reversing the previous departmental integration of data, digital capability, and AI.","Industry figures warned that splitting the former Department for Science, Innovation and Technology discards the integration that had been the department’s principal strength.","Lloyd’s cyber policy record includes both advancing the major Cyber Security and Resilience Bill and overseeing the weakening of proposed telecoms security protections after industry lobbying over cost and practicality."],"referencedReports":[],"body":"\u003cp\u003eNew Prime Minister Andy Burnham reappointed Liz Lloyd to a junior post at the Department for Digital, Culture, Media and Sport, while she retained a second role at the renamed Department for Business, Innovation, Science and Trade. Her formal portfolio has not been announced, but Whitehall sources said she will resume the cyber brief. Lloyd has led on cyber since September 2025 and is steering the government’s Cyber Security and Resilience Bill through the House of Lords.\u003c/p\u003e\n\n\u003cp\u003eThe reappointment signals continuity in UK cyber policy despite Burnham abolishing the Department for Science, Innovation and Technology, which had overseen cyber policy since 2023. Burnham split the former department’s functions across three places: cyber policy and government digital services to DCMS, science to DBIST, and artificial intelligence policy and the AI Security Institute to the Cabinet Office. Industry figures warned that the split discards the integration of data, digital capability, and AI that had been the department’s principal strength.\u003c/p\u003e\n\n\u003cp\u003eThe Cyber Security and Resilience Bill would update rules dating from 2018, extend cyber regulations to more organizations, and bring data centers and managed service providers into scope. It would also set incident reporting deadlines for operators of essential services including energy, water, and health care, and give ministers powers to amend rules and issue directions to companies on national security grounds. Line-by-line scrutiny of the bill begins in September, and the government wants it passed this year.\u003c/p\u003e\n"},{"n":23,"title":"SPF, DKIM, and DMARC Passed. The File Was Malware.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/compromised-vendor-account-malicious-excel-attachment","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A compromised vendor Microsoft 365 mailbox sent a fully authenticated email with a malicious Excel attachment to a CEO, showing that SPF, DKIM, and DMARC only verify the sender, not the safety of the content. The key defense is to scan and evaluate attachments and sender behavior even when the sender is trusted and authentication passes.","briefOverview":"\u003cp\u003eA CEO at a large hospitality and resort operator received a short “please see attached” email from a real audiovisual technology vendor. The vendor’s Microsoft 365 mailbox had been compromised, so the message genuinely came from the vendor’s actual account and infrastructure rather than a spoofed domain. The attached spreadsheet was flagged as malicious by file scanning and quarantined.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that SPF, DKIM, DMARC, ARC, and Microsoft composite authentication all passed because the sender was legitimate in origin. Those checks confirmed who sent the message, but they did not determine whether the attachment was safe. The message also had the vendor’s own mailbox in both the From and To headers, with the real recipients delivered by BCC, which the article describes as a sign of a compromised account blasting its contact list.\u003c/p\u003e\n\n\u003cp\u003eThe attack is described as vendor email compromise and mapped to MITRE techniques for spearphishing attachment, user execution of a malicious file, and valid accounts. Themis flagged the message at 90 percent confidence based on signals including a first-time sender reaching a VIP mailbox, an image-based signature, and the malicious file verdict. It quarantined every copy across the affected mailboxes before anyone opened the file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A CEO at a large hospitality and resort operator received a short email from a real audiovisual vendor whose Microsoft 365 mailbox had been compromised.","SPF, DKIM, DMARC, ARC, and Microsoft composite authentication all passed because the message genuinely originated from the vendor’s legitimate infrastructure rather than a spoofed domain.","The email carried a roughly 138 KB spreadsheet that file scanning flagged as malicious, while the embedded signature-block image scanned clean.","The From and To headers both named the vendor’s own mailbox, with the real recipients delivered by BCC, which the article describes as a classic sign of a compromised account blasting its contact list.","Themis flagged the message at 90 percent confidence and quarantined every copy across the affected mailboxes before anyone opened the file."],"insights":["A fully authenticated message from a long-established vendor can still be dangerous because authentication confirms the origin of the email, not the safety of its attachment.","A self-addressed email with real recipients hidden in BCC is a useful warning sign when a compromised mailbox is being used to blast a contact list.","Messages with no links, no urgency, and very little text can still be high-risk when the entire attack is contained in an attached file.","First-time contact with a VIP recipient, especially from an otherwise trusted sender, is an actionable behavioral signal that authentication and sender reputation do not capture."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on malware-laden messages in gateway attacks and the human element in breaches.","category":"","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report to support that business-context email attacks, including vendor and partner compromise, remain among the costliest categories organizations face.","category":"","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites the guidance for the point that authentication helps stop spoofing but does not clear email content as safe.","category":"","primary":false}],"body":"\u003cp\u003eA CEO at a large hospitality and resort operator received a short “please see attached” email from a real audiovisual technology vendor. The vendor’s Microsoft 365 mailbox had been compromised, so the message genuinely came from the vendor’s actual account and infrastructure rather than a spoofed domain. The attached spreadsheet was flagged as malicious by file scanning and quarantined.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that SPF, DKIM, DMARC, ARC, and Microsoft composite authentication all passed because the sender was legitimate in origin. Those checks confirmed who sent the message, but they did not determine whether the attachment was safe. The message also had the vendor’s own mailbox in both the From and To headers, with the real recipients delivered by BCC, which the article describes as a sign of a compromised account blasting its contact list.\u003c/p\u003e\n\n\u003cp\u003eThe attack is described as vendor email compromise and mapped to MITRE techniques for spearphishing attachment, user execution of a malicious file, and valid accounts. Themis flagged the message at 90 percent confidence based on signals including a first-time sender reaching a VIP mailbox, an image-based signature, and the malicious file verdict. It quarantined every copy across the affected mailboxes before anyone opened the file.\u003c/p\u003e\n"},{"n":5,"title":"Chick-fil-A data breach affects more than 13,000 customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chick-fil-a-data-breach-affects-more-than-13-000-customers/","time":"14:04","priority":"MAY READ","score":72,"tldr":"Chick-fil-A says credential stuffing attacks on its website and mobile app exposed data from 13,322 Chick-fil-A One customer accounts. The company logged out impacted users, removed payment methods, restored balances, and urged affected customers to change reused passwords.","briefOverview":"\u003cp\u003eChick-fil-A confirmed that more than 13,000 customers had data stolen in a recent wave of credential stuffing attacks. The company detected the attacks after identifying suspicious login activity targeting certain Chick-fil-A One accounts on its website and mobile app between June 17 and June 19. A filing shared by the Office of the Maine Attorney General says the breach affected 13,322 people in total.\u003c/p\u003e\n\n\u003cp\u003eChick-fil-A said the attackers used automated tools and credentials obtained from a third-party source to access customer accounts. The data accessed included combinations of names, email addresses, Chick-fil-A One membership numbers, Chick-fil-A credit amounts, mobile pay numbers, and the last four digits of credit or debit card numbers. If stored in the compromised accounts, birth dates, phone numbers, and addresses may also have been accessed.\u003c/p\u003e\n\n\u003cp\u003eIn response, Chick-fil-A logged out all impacted accounts, removed payment methods, restored affected Chick-fil-A One balances, and added rewards to affected accounts as an apology. The company advised impacted customers to change their passwords because the accounts were compromised using credentials stolen from third-party services. Chick-fil-A also disclosed in March 2023 that more than 71,000 customers had personal information stolen after another series of credential stuffing attacks between December 2022 and February 2023.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chick-fil-A confirmed that 13,322 customers were affected by a data breach caused by credential stuffing attacks against its website and mobile app.","The attacks occurred between June 17 and June 19 and used automated tools with credentials obtained from a third-party source to access Chick-fil-A One accounts.","The exposed data may include names, email addresses, Chick-fil-A One membership numbers, Chick-fil-A credit amounts, mobile pay numbers, the last four digits of credit or debit card numbers, and, if stored in the accounts, birth dates, phone numbers, and addresses.","Chick-fil-A said it logged out all impacted accounts, removed payment methods, restored affected account balances, added rewards to affected accounts, and advised impacted customers to change their passwords.","Chick-fil-A previously disclosed in March 2023 that hackers stole personal information from more than 71,000 customers after another series of credential stuffing attacks between December 2022 and February 2023."],"insights":["Chick-fil-A’s notice emphasizes that the compromised accounts used credentials stolen from third-party services, making password reuse a direct cause of customer exposure in this incident.","Even without full payment card numbers, the accessed account data included enough payment-related details and loyalty account information to require payment method removal and balance restoration by Chick-fil-A.","This is the second disclosed Chick-fil-A credential stuffing incident in roughly three years, following a 2023 disclosure involving more than 71,000 customers.","Chick-fil-A’s response went beyond account security steps by restoring loyalty balances and adding rewards to affected accounts as an apology."],"referencedReports":[],"body":"\u003cp\u003eChick-fil-A confirmed that more than 13,000 customers had data stolen in a recent wave of credential stuffing attacks. The company detected the attacks after identifying suspicious login activity targeting certain Chick-fil-A One accounts on its website and mobile app between June 17 and June 19. A filing shared by the Office of the Maine Attorney General says the breach affected 13,322 people in total.\u003c/p\u003e\n\n\u003cp\u003eChick-fil-A said the attackers used automated tools and credentials obtained from a third-party source to access customer accounts. The data accessed included combinations of names, email addresses, Chick-fil-A One membership numbers, Chick-fil-A credit amounts, mobile pay numbers, and the last four digits of credit or debit card numbers. If stored in the compromised accounts, birth dates, phone numbers, and addresses may also have been accessed.\u003c/p\u003e\n\n\u003cp\u003eIn response, Chick-fil-A logged out all impacted accounts, removed payment methods, restored affected Chick-fil-A One balances, and added rewards to affected accounts as an apology. The company advised impacted customers to change their passwords because the accounts were compromised using credentials stolen from third-party services. Chick-fil-A also disclosed in March 2023 that more than 71,000 customers had personal information stolen after another series of credential stuffing attacks between December 2022 and February 2023.\u003c/p\u003e\n"},{"n":9,"title":"OnTrac notifies customers of data breach after network hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ontrac-notifies-customers-of-data-breach-after-network-hack/","time":"19:55","priority":"MAY READ","score":72,"tldr":"OnTrac says hackers breached its corporate network in March and may have accessed customer personal information, though it has not disclosed exactly what data or how many people were affected. The company is offering 12 months of credit monitoring and says it has no evidence the stolen information has been published or misused.","briefOverview":"\u003cp\u003eOnTrac is notifying customers that hackers breached its corporate network and may have accessed personal details belonging to customers. The company detected the incident on March 23, and an internal investigation found that an attacker accessed certain files between March 20 and 22. Apart from names, the article says it is unclear what type of information was exposed because OnTrac redacted the data elements in the notification sample shared with authorities.\u003c/p\u003e\n\n\u003cp\u003eOnTrac is a private American parcel-delivery company focused on last-mile e-commerce deliveries and was formed in 2021 from the merger of OnTrac Logistics and LaserShip. The company operates at 102 locations across 35 states, covers roughly 70% of the U.S. population, and works with more than 7,000 independent delivery contractors. OnTrac said it brought in a third-party specialist to help determine the scope of the breach and took steps to ensure the data was re-secured and not distributed.\u003c/p\u003e\n\n\u003cp\u003eThe article says OnTrac is not aware of any fraud or publication of stolen information resulting from the incident and has no reason to believe misuse will occur. The company is offering affected customers free access to 12 months of credit monitoring and identity protection through CyberScout, with a 90-day enrollment deadline. At the time of writing, no ransomware or data extortion threat groups had taken responsibility for the attack, and OnTrac had not responded to BleepingComputer’s questions about the number of impacted clients or whether a ransom was paid.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OnTrac is notifying customers that hackers breached its corporate network and may have accessed personal details belonging to customers.","The company detected the incident on March 23, and an internal investigation found that the attacker accessed certain files between March 20 and 22.","OnTrac redacted the exposed data elements in the notification sample shared with authorities, so the article says it is unclear what type of information was exposed apart from names.","OnTrac is offering affected customers free access to a 12-month credit monitoring and identity protection service through CyberScout, with a 90-day enrollment deadline.","At the time of writing, no ransomware or data extortion threat groups had taken responsibility for the attack."],"insights":["OnTrac’s redaction of the exposed data elements in the notification sample leaves customers without public clarity on what personal information, beyond names, may have been accessed.","The company’s statement that it took steps to ensure the data was “re-secured and not distributed” is notable because the article says this suggests a possible agreement with the attackers, typically a ransom payment.","Although the article raises the possibility of an agreement with attackers, it also notes that no ransomware or data extortion group had claimed responsibility at publication time.","Affected customers have a limited 90-day window to enroll in the free 12-month credit monitoring and identity protection service offered through CyberScout."],"referencedReports":[],"body":"\u003cp\u003eOnTrac is notifying customers that hackers breached its corporate network and may have accessed personal details belonging to customers. The company detected the incident on March 23, and an internal investigation found that an attacker accessed certain files between March 20 and 22. Apart from names, the article says it is unclear what type of information was exposed because OnTrac redacted the data elements in the notification sample shared with authorities.\u003c/p\u003e\n\n\u003cp\u003eOnTrac is a private American parcel-delivery company focused on last-mile e-commerce deliveries and was formed in 2021 from the merger of OnTrac Logistics and LaserShip. The company operates at 102 locations across 35 states, covers roughly 70% of the U.S. population, and works with more than 7,000 independent delivery contractors. OnTrac said it brought in a third-party specialist to help determine the scope of the breach and took steps to ensure the data was re-secured and not distributed.\u003c/p\u003e\n\n\u003cp\u003eThe article says OnTrac is not aware of any fraud or publication of stolen information resulting from the incident and has no reason to believe misuse will occur. The company is offering affected customers free access to 12 months of credit monitoring and identity protection through CyberScout, with a 90-day enrollment deadline. At the time of writing, no ransomware or data extortion threat groups had taken responsibility for the attack, and OnTrac had not responded to BleepingComputer’s questions about the number of impacted clients or whether a ransom was paid.\u003c/p\u003e\n"},{"n":7,"title":"Man gets six years for hacking 750 women's Snapchat accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/man-gets-six-years-for-hacking-750-womens-snapchat-accounts/","time":"11:17","priority":"MAY READ","score":68,"tldr":"An Illinois man was sentenced to 76 months in prison for phishing Snapchat access codes from more than 750 women, stealing nude images, and trading or selling them online. Investigators also found he collected and distributed child sexual abuse material.","briefOverview":"\u003cp\u003eAn Illinois man, 26-year-old Kyle Svara, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women. Prosecutors said he stole nude photos that he later traded or sold online. Svara admitted in February that he used social engineering tactics to phish Snapchat access codes from victims.\u003c/p\u003e\n\n\u003cp\u003eBetween May 2020 and February 2021, Svara targeted more than 4,500 victims while posing as a Snap Inc representative and using anonymized phone numbers. After stealing credentials, he accessed approximately 517 women’s Snapchat accounts without permission to download nude or semi-nude photos. He also activated two-factor authentication to lock victims out of compromised accounts.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that Svara distributed child sexual abuse material and discovered approximately 530 images and 600 videos depicting CSAM in his Mega account. Court documents said he advertised hacking “services” online, traded stolen images, and offered to get into girls’ Snapchat accounts through Kik. One client, former Northeastern University track and field coach Steve Waithe, hired Svara to hack Snapchat accounts belonging to Northeastern students and members of women’s athletic teams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kyle Svara, a 26-year-old Illinois man, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women to steal nude photos that he later traded or sold online.","Between May 2020 and February 2021, Svara targeted more than 4,500 victims while posing as a Snap Inc representative and using anonymized phone numbers to phish Snapchat access codes.","After stealing credentials, Svara accessed approximately 517 women’s Snapchat accounts without permission, downloaded nude or semi-nude photos, and activated two-factor authentication to lock victims out of their accounts.","Investigators found approximately 530 images and 600 videos depicting child sexual abuse material in Svara’s Mega account, and the Justice Department said he collected, distributed, and solicited CSAM.","Former Northeastern University track and field coach Steve Waithe hired Svara to hack Snapchat accounts of students at Northeastern and members of the women’s track and field and soccer teams."],"insights":["Two-factor authentication was used by Svara after account takeover to lock victims out, showing that an account protection feature can be abused when an attacker enables it first.","The scheme combined broad impersonation of Snap Inc with targeted abuse of personal and campus relationships, affecting strangers as well as neighbors, family friends, classmates, personal friends, and college students.","Svara advertised paid account-hacking services online and was hired by Steve Waithe, showing that stolen access to private social media accounts was being treated as a purchasable service.","The case connected social media account theft, trading of stolen intimate images, sextortion-related targeting, and child sexual abuse material in a single investigation."],"referencedReports":[],"body":"\u003cp\u003eAn Illinois man, 26-year-old Kyle Svara, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women. Prosecutors said he stole nude photos that he later traded or sold online. Svara admitted in February that he used social engineering tactics to phish Snapchat access codes from victims.\u003c/p\u003e\n\n\u003cp\u003eBetween May 2020 and February 2021, Svara targeted more than 4,500 victims while posing as a Snap Inc representative and using anonymized phone numbers. After stealing credentials, he accessed approximately 517 women’s Snapchat accounts without permission to download nude or semi-nude photos. He also activated two-factor authentication to lock victims out of compromised accounts.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that Svara distributed child sexual abuse material and discovered approximately 530 images and 600 videos depicting CSAM in his Mega account. Court documents said he advertised hacking “services” online, traded stolen images, and offered to get into girls’ Snapchat accounts through Kik. One client, former Northeastern University track and field coach Steve Waithe, hired Svara to hack Snapchat accounts belonging to Northeastern students and members of women’s athletic teams.\u003c/p\u003e\n"},{"n":30,"title":"Shiny Hunters Impact to Health Sector and Recommended Mitigation Strategies","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/","time":"16:13","priority":"MAY READ","score":60,"tldr":"Health-sector organizations are seeing more ShinyHunters-style attacks that use vishing to trigger helpdesk or MFA resets, take over SSO accounts, and steal data from connected SaaS platforms for extortion. The key defense is to treat SSO as Tier 0 by hardening helpdesk verification, using phishing-resistant MFA, enforcing conditional access, and monitoring SaaS logs for rapid exfiltration.","briefOverview":"\u003cp\u003eHealth sector organizations are facing an observed increase in successful attacks by the threat actor ShinyHunters. The article says the group appears to prioritize identity compromise and SaaS access over traditional ransomware deployment. Its described operational pattern is vishing, followed by helpdesk or MFA reset or device re-enrollment, SSO account takeover, pivoting into connected SaaS platforms, and rapid data exfiltration for extortion leverage.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that SSO is the control plane and that ShinyHunters’ leverage is created through data theft at cloud scale. It describes the group as behaving less like a traditional ransomware crew and more like an identity- and SaaS-access extortion operation. Recent incident reporting cited in the article says vishing of multiple employees led to compromise of a Microsoft Entra SSO account, followed by data theft from SaaS and internal platforms such as Microsoft 365 and SharePoint.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends breaking the vishing-to-SSO takeover chain by hardening helpdesk and IAM support workflows, using out-of-band identity proofing, applying a no same-call reset rule, and protecting MFA registration and reset processes. It also recommends treating Microsoft Entra, Okta, or Google SSO as “Tier 0” by applying conditional access, privileged access discipline, and stronger monitoring. Additional recommendations include detecting SaaS data theft, reducing data access blast radius, preparing SaaS containment playbooks, and running targeted vishing training for helpdesk staff, executives, VIPs, new hires, and remote workers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health sector organizations are facing an observed increase in successful attacks by the threat actor ShinyHunters.","The article says ShinyHunters appears to prioritize identity compromise and SaaS access over traditional ransomware deployment.","The described attack pattern is vishing, followed by helpdesk or MFA reset or device re-enrollment, SSO account takeover, pivoting into connected SaaS platforms, and rapid data exfiltration for extortion leverage.","The article recommends hardening helpdesk and IAM support workflows with out-of-band identity proofing, a no same-call reset rule, and step-up verification for authentication factor changes.","The article recommends treating Microsoft Entra, Okta, or Google SSO as a Tier 0 control plane by applying conditional access, privileged access discipline, SaaS logging, and exfiltration detection."],"insights":["The article frames the helpdesk as a critical security control point, recommending a “no same-call” rule so support agents cannot complete password, MFA, or device reset requests during the same inbound call.","The article emphasizes that limited operational disruption does not mean low impact, because ShinyHunters’ leverage comes from stealing cloud-hosted data rather than deploying traditional ransomware.","The article recommends monitoring identity and SaaS activity together, including MFA reset events, new device enrollments, OAuth consent changes, bulk downloads, and unusual API calls.","The article identifies phishing-resistant MFA for admins, helpdesk staff, and executives as a near-term priority because these groups are high-value targets in the described attack chain.","The article recommends preparing SaaS-specific containment steps in advance, including revoking refresh tokens, disabling user sessions, and quarantining suspicious OAuth apps or service principals."],"referencedReports":[],"body":"\u003cp\u003eHealth sector organizations are facing an observed increase in successful attacks by the threat actor ShinyHunters. The article says the group appears to prioritize identity compromise and SaaS access over traditional ransomware deployment. Its described operational pattern is vishing, followed by helpdesk or MFA reset or device re-enrollment, SSO account takeover, pivoting into connected SaaS platforms, and rapid data exfiltration for extortion leverage.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that SSO is the control plane and that ShinyHunters’ leverage is created through data theft at cloud scale. It describes the group as behaving less like a traditional ransomware crew and more like an identity- and SaaS-access extortion operation. Recent incident reporting cited in the article says vishing of multiple employees led to compromise of a Microsoft Entra SSO account, followed by data theft from SaaS and internal platforms such as Microsoft 365 and SharePoint.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends breaking the vishing-to-SSO takeover chain by hardening helpdesk and IAM support workflows, using out-of-band identity proofing, applying a no same-call reset rule, and protecting MFA registration and reset processes. It also recommends treating Microsoft Entra, Okta, or Google SSO as “Tier 0” by applying conditional access, privileged access discipline, and stronger monitoring. Additional recommendations include detecting SaaS data theft, reducing data access blast radius, preparing SaaS containment playbooks, and running targeted vishing training for helpdesk staff, executives, VIPs, new hires, and remote workers.\u003c/p\u003e\n"},{"n":12,"title":"'Wrench' attacks against crypto holders appear to be on the rise","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/wrench-attacks-against-cryptocurrency-holders","time":"15:55","priority":"MAY READ","score":58,"tldr":"Physical “wrench” attacks against crypto holders are rising, with CertiK reporting a 33% year-over-year increase in the first half of 2026 and $124 million in associated reported losses. These crimes use violence, kidnapping, home invasions or threats against victims and their families to force transfers of digital assets, especially where self-custody leaves no intermediary to stop transactions.","briefOverview":"\u003cp\u003eCryptocurrency accounts have long been targeted by online hacks and scams, but the article reports that a growing share of crypto thefts now begins in the physical world. CertiK said “wrench” attacks, which involve in-person coercion against crypto holders, rose 33 percent year over year in the first half of 2026. The company found 52 such attacks worldwide through June, compared with 39 during the same period in 2025.\u003c/p\u003e\n\n\u003cp\u003eCertiK defines wrench attacks as incidents where adversaries use violence, intimidation, or credible threats to force a victim to transfer digital assets, surrender private keys, unlock a wallet, reveal credentials, or pressure a third party into compliance. The crimes include home invasions, kidnappings, and, in rare cases, murder. The article notes examples including the kidnapping of a French mother and child in April, a 2025 home invasion in Minnesota, and a 2024 Connecticut case involving a carjacked Lamborghini.\u003c/p\u003e\n\n\u003cp\u003eReported losses linked to wrench attacks reached \u003cspan class=\"math inline\"\u003e\\(124 million so far this year, compared with \\)\u003c/span\u003e10.5 million in the first half of 2025, though CertiK said the figure reflects overall financial scale rather than realized criminal profits. The report said attackers may target spouses, parents, children, employees, drivers, assistants, or close friends instead of the primary crypto holder. Researcher Lukasz Olejnik noted that self-custody can leave users on their own because there is no intermediary, such as a bank, to halt, slow, or reverse a transaction.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CertiK reported that “wrench” attacks against cryptocurrency holders increased 33 percent year over year in the first half of 2026, with 52 incidents worldwide compared with 39 in the same period of 2025.","CertiK defines wrench attacks as physical coercion involving violence, intimidation, or credible threats to force a victim to transfer digital assets, surrender private keys, unlock a wallet, reveal credentials, or pressure a third party into compliance.","The reported losses tied to wrench attacks reached $124 million so far in 2026, compared with $10.5 million in the first half of 2025, though CertiK said these figures indicate financial scale rather than realized criminal profits.","The article cites examples including the kidnapping of a French mother and child in April, a 2025 home invasion in Minnesota, and a 2024 Connecticut case involving a carjacked Lamborghini.","Researcher Lukasz Olejnik noted that wrench attacks exploit self-custody of cryptocurrency, where users keep assets themselves and have no intermediary such as a bank to halt, slow, or reverse a transaction."],"insights":["CertiK says its count likely underestimates the problem because some victims may not report wrench attacks and many cases do not become public until investigations are completed.","Attackers do not always need to reach the main crypto holder because they can pressure spouses, parents, children, employees, drivers, assistants, or close friends who may have more predictable routines and less security training.","The reported $124 million in losses should not be read as confirmed criminal profit because CertiK says the figure can include assets that were coerced from victims as well as assets that may have been frozen.","Self-custody changes the risk model for crypto holders because, unlike with a bank, there may be no intermediary able to halt, slow, or reverse a transaction made under coercion."],"referencedReports":[{"title":"Intel3D Wrench H1 2026","url":"https://www.certik.com/certik-report/intel3d/intel3d-wrench-h1-2026","publisher":"CertiK","context":"The article is based on CertiK’s report finding a 33 percent year-over-year increase in wrench attacks in the first half of 2026.","category":"","primary":false},{"title":"The Rise of Wrench Attacks and Crypto-Related Violent Crime","url":"https://www.trmlabs.com/resources/blog/the-rise-of-wre
