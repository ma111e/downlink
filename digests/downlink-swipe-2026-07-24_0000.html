nch-attacks-and-crypto-related-violent-crime","publisher":"TRM Labs","context":"The article cites TRM Labs as another blockchain analysis firm that reported on the rise of wrench attacks.","category":"","primary":false}],"body":"\u003cp\u003eCryptocurrency accounts have long been targeted by online hacks and scams, but the article reports that a growing share of crypto thefts now begins in the physical world. CertiK said “wrench” attacks, which involve in-person coercion against crypto holders, rose 33 percent year over year in the first half of 2026. The company found 52 such attacks worldwide through June, compared with 39 during the same period in 2025.\u003c/p\u003e\n\n\u003cp\u003eCertiK defines wrench attacks as incidents where adversaries use violence, intimidation, or credible threats to force a victim to transfer digital assets, surrender private keys, unlock a wallet, reveal credentials, or pressure a third party into compliance. The crimes include home invasions, kidnappings, and, in rare cases, murder. The article notes examples including the kidnapping of a French mother and child in April, a 2025 home invasion in Minnesota, and a 2024 Connecticut case involving a carjacked Lamborghini.\u003c/p\u003e\n\n\u003cp\u003eReported losses linked to wrench attacks reached \u003cspan class=\"math inline\"\u003e\\(124 million so far this year, compared with \\)\u003c/span\u003e10.5 million in the first half of 2025, though CertiK said the figure reflects overall financial scale rather than realized criminal profits. The report said attackers may target spouses, parents, children, employees, drivers, assistants, or close friends instead of the primary crypto holder. Researcher Lukasz Olejnik noted that self-custody can leave users on their own because there is no intermediary, such as a bank, to halt, slow, or reverse a transaction.\u003c/p\u003e\n"},{"n":31,"title":"Benchmarking report finds healthcare CISOs prioritize IAM, resilience as AI threats accelerate","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/benchmarking-report-finds-healthcare-cisos-prioritize-iam-resilience-as-ai-threats-accelerate/","time":"12:46","priority":"MAY READ","score":58,"tldr":"Health-ISAC’s first CISO Benchmarking Report finds healthcare security leaders are prioritizing identity and access management, resilience, and workforce challenges as AI-driven impersonation threats increasingly target help desks, finance teams, and clinical operations.","briefOverview":"\u003cp\u003eHealth-ISAC’s first CISO Benchmarking Report found that healthcare chief information security officers are operating in an increasingly complex threat environment. The report draws on survey responses from 76 CISOs representing healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations. It provides a snapshot of cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in the sector.\u003c/p\u003e\n\n\u003cp\u003eThe article says cyberattacks in healthcare can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions. It highlights identity and access management, resilience, and AI-related threats as key concerns for healthcare security leaders. The report is presented as a benchmark of how healthcare CISOs are responding to a threat landscape that increasingly affects both operations and patient-facing care.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said AI-amplified impersonation beyond email remains underestimated in healthcare. He described incidents involving voice, video, and urgent workflow manipulation aimed at help desks, call centers, finance teams, and clinical operations. According to Weiss, the risk is that people may be convincingly pressured into resetting multi-factor authentication, changing payment details, or granting access because the interaction feels authentic, personalized, and time-sensitive.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s first CISO Benchmarking Report is based on survey responses from 76 chief information security officers across healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations.","The report found that healthcare CISOs are operating in an increasingly complex threat environment where cyberattacks can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions.","The report offers a snapshot of cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in the healthcare sector.","Errol Weiss of Health-ISAC said AI-amplified impersonation beyond email remains underestimated in healthcare.","Weiss said incidents involving voice, video, and urgent workflow manipulation have targeted help desks, call centers, finance teams, and clinical operations."],"insights":["The article highlights that AI-enabled impersonation risk is not limited to email phishing, but also includes convincing voice and video interactions aimed at operational teams.","Help desks and call centers are specifically exposed because attackers can pressure staff into resetting multi-factor authentication or granting access during seemingly authentic, urgent interactions.","Finance teams face a distinct AI-amplified impersonation risk because attackers may use personalized, time-sensitive interactions to push changes to payment details.","The report frames healthcare cybersecurity as a patient safety and care continuity issue, not only an information protection issue."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s first CISO Benchmarking Report found that healthcare chief information security officers are operating in an increasingly complex threat environment. The report draws on survey responses from 76 CISOs representing healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations. It provides a snapshot of cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in the sector.\u003c/p\u003e\n\n\u003cp\u003eThe article says cyberattacks in healthcare can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions. It highlights identity and access management, resilience, and AI-related threats as key concerns for healthcare security leaders. The report is presented as a benchmark of how healthcare CISOs are responding to a threat landscape that increasingly affects both operations and patient-facing care.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said AI-amplified impersonation beyond email remains underestimated in healthcare. He described incidents involving voice, video, and urgent workflow manipulation aimed at help desks, call centers, finance teams, and clinical operations. According to Weiss, the risk is that people may be convincingly pressured into resetting multi-factor authentication, changing payment details, or granting access because the interaction feels authentic, personalized, and time-sensitive.\u003c/p\u003e\n"},{"n":10,"title":"5 AI Security Challenges in 2026 and Why They Matter","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/ai-security-challenges","time":"14:53","priority":"MAY READ","score":55,"tldr":"AI security in 2026 is fundamentally data security: as AI agents gain direct access to enterprise data, traditional app-level controls are no longer enough. Organizations need automated, data-centric security that continuously discovers sensitive data, right-sizes permissions, and detects abnormal AI activity in real time.","briefOverview":"\u003cp\u003eThe article argues that the biggest AI security challenges in 2026 all point to one reality: AI security is data security. It says AI models need broad access to enterprise data to deliver value, but that access increases risk. Varonis CEO and Co-Founder Yaki Faitelson and Varonis VP of Strategy Ron Bennatan discussed the evolving threat AI poses and why protecting data has become more crucial as AI adoption accelerates.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several challenges, including the tension between moving quickly with AI and maintaining security, the limits of application-level controls, and the non-deterministic behavior of AI systems. It says AI agents can operate on behalf of users and access systems directly, often bypassing traditional application interfaces. Because AI behavior cannot be fully predicted before deployment, the article says security teams need continuous monitoring and automated detection and response.\u003c/p\u003e\n\n\u003cp\u003eThe article also says AI expands the blast radius because organizations may have thousands of autonomous agents with access to large volumes of data. A single compromised identity could expose massive amounts of data if excessive access is not reduced. It recommends an automated data security platform that discovers sensitive data, right-sizes permissions, enforces policies, monitors agent behavior, and provides AI detection and response that moves as quickly as AI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that in 2026 the biggest AI security challenges point to the idea that AI security is data security.","Enterprise AI needs broad access to company data to deliver value, but that access increases risk if organizations lack proper controls.","The article says AI agents can access systems directly on behalf of users, often bypassing traditional application interfaces and app-level permissions.","Because AI behavior cannot be fully predicted before deployment, security teams need continuous monitoring and automated detection and response in real time.","The article recommends an automated data security platform that finds sensitive data, reduces excessive access, enforces policies, monitors agent behavior, and stops threats quickly."],"insights":["The article frames delaying AI adoption and adopting AI without proper controls as both carrying serious consequences, making safe enablement the goal rather than slowing AI use.","The article identifies a shift in the security control point from applications to the data itself because AI agents may bypass traditional app interfaces while acting on behalf of users.","The article says static policies are insufficient for AI because AI behavior cannot be fully validated before deployment and may produce failure scenarios that were not anticipated.","The article treats excessive access as a core AI risk, arguing that reducing the blast radius requires automatically removing unnecessary permissions rather than relying only on governance policies."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that the biggest AI security challenges in 2026 all point to one reality: AI security is data security. It says AI models need broad access to enterprise data to deliver value, but that access increases risk. Varonis CEO and Co-Founder Yaki Faitelson and Varonis VP of Strategy Ron Bennatan discussed the evolving threat AI poses and why protecting data has become more crucial as AI adoption accelerates.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several challenges, including the tension between moving quickly with AI and maintaining security, the limits of application-level controls, and the non-deterministic behavior of AI systems. It says AI agents can operate on behalf of users and access systems directly, often bypassing traditional application interfaces. Because AI behavior cannot be fully predicted before deployment, the article says security teams need continuous monitoring and automated detection and response.\u003c/p\u003e\n\n\u003cp\u003eThe article also says AI expands the blast radius because organizations may have thousands of autonomous agents with access to large volumes of data. A single compromised identity could expose massive amounts of data if excessive access is not reduced. It recommends an automated data security platform that discovers sensitive data, right-sizes permissions, enforces policies, monitors agent behavior, and provides AI detection and response that moves as quickly as AI.\u003c/p\u003e\n"},{"n":21,"title":"Seeing AI Agents Is Not Enough. Security Teams Must Enforce What They Can Do","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/seeing-ai-agents-is-not-enough-security.html","time":"11:30","priority":"MAY READ","score":55,"tldr":"Security teams must move beyond simply discovering AI agents and enforce what each agent is allowed to do based on identity, ownership, permissions, usage, and intent. The key challenge is building a consistent, context-aware control plane that governs agents across platforms before they take risky actions.","briefOverview":"\u003cp\u003eThe article argues that AI agent security is moving from adoption and visibility toward control, and that simply finding AI agents across an organization is not enough. AI agents are appearing in SaaS platforms, developer environments, cloud workflows, customer support systems, productivity tools, and internal applications. The article says the risk is not the number of agents, but that they can operate across systems without consistent identity, intent, ownership, and enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AI agents break static access models because they are defined more by goals than by fixed workflows. They can interpret instructions, call different tools, invoke APIs, access data, and take action without a human in the loop. Security teams therefore need to ask not only what an agent can access, but what it should be allowed to do under specific conditions and for a specific purpose.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends correlating ownership, consumers, identities, intent, access, usage, origin, and lifecycle state before defining controls for AI agents. It says enforcement should happen before, during, and after agents act, rather than only through remediation after a risk is found. The article calls for a unified, identity-centric, context-aware, and platform-agnostic control plane that can discover, understand, and enforce rules for AI agents across enterprise environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI agent security is moving from adoption to visibility and then to control, with enforcement of least privilege proving harder than expected.","The article says discovery alone is insufficient because AI agents can reason, plan, call tools, invoke APIs, access data, and take action without a human in the loop.","Security teams need to correlate ownership, consumers, identities, intent, access, usage, origin, and lifecycle state before they can define meaningful controls for AI agents.","The article states that effective AI agent enforcement should govern what agents can do before, during, and after they take action, rather than only remediating risks after detection.","The article recommends a unified, identity-centric, context-aware, and platform-agnostic control plane to discover, understand, and enforce rules for AI agents across enterprise environments."],"insights":["The article highlights that two AI agents with similar permissions can have very different risk profiles depending on what each agent is trying to accomplish, making intent a required part of access decisions.","The article warns that an AI agent inventory disconnected from enforcement can create false confidence because it may show that agents exist without proving their access is appropriate or their owners remain accountable.","The article says ownership can be difficult to determine because agent context is often scattered across identity systems, cloud permissions, SaaS integrations, infrastructure-as-code, and creator knowledge.","The article recommends shifting enforcement from after-the-fact cleanup to upfront rules, such as allowing a support agent to read ticket history while preventing bulk customer data exports.","The article argues that platform-by-platform controls will not scale because enterprises will use many AI agent platforms, SaaS-native agents, internal frameworks, cloud services, and developer tools with different logs and permission models."],"referencedReports":[{"title":"Careful Adoption of Agentic AI Services","url":"https://www.cyber.gov.au/business-government/secure-design/artificial-intelligence/careful-adoption-of-agentic-ai-services","publisher":"Australian Cyber Security Centre","context":"The article cites this guidance as warning that agentic AI introduces privilege, authentication, accountability, design, and behavioral risks that security teams should address before using such systems in critical workflows.","category":"","primary":false},{"title":"OWASP Top 10 for Agentic Applications","url":"https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/","publisher":"OWASP","context":"The article references this work for risks such as identity and privilege abuse, tool misuse, insecure inter-agent communication, cascading failures, and rogue agents.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that AI agent security is moving from adoption and visibility toward control, and that simply finding AI agents across an organization is not enough. AI agents are appearing in SaaS platforms, developer environments, cloud workflows, customer support systems, productivity tools, and internal applications. The article says the risk is not the number of agents, but that they can operate across systems without consistent identity, intent, ownership, and enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AI agents break static access models because they are defined more by goals than by fixed workflows. They can interpret instructions, call different tools, invoke APIs, access data, and take action without a human in the loop. Security teams therefore need to ask not only what an agent can access, but what it should be allowed to do under specific conditions and for a specific purpose.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends correlating ownership, consumers, identities, intent, access, usage, origin, and lifecycle state before defining controls for AI agents. It says enforcement should happen before, during, and after agents act, rather than only through remediation after a risk is found. The article calls for a unified, identity-centric, context-aware, and platform-agnostic control plane that can discover, understand, and enforce rules for AI agents across enterprise environments.\u003c/p\u003e\n"},{"n":24,"title":"The SOCI Act, explained: obligations, recent reforms, and where preemptive cyber defense fits","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/the-soci-act-obligations/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=the-soci-act-obligations","time":"12:49","priority":"MAY READ","score":55,"tldr":"Australia’s SOCI Act requires critical infrastructure operators to register assets, report cyber incidents quickly, and maintain board-approved risk programs, with obligations expanding through recent and proposed reforms. The key takeaway is that early visibility into adversary infrastructure can help regulated entities manage risk before incidents occur and better meet SOCI’s tightening expectations.","briefOverview":"\u003cp\u003eAustralia’s Security of Critical Infrastructure Act 2018, known as the SOCI Act, sets obligations for entities that own, operate, or hold a direct interest in critical infrastructure assets. The article says it applies across eleven sectors, including communications, financial services and markets, data storage or processing, defence industry, higher education and research, energy, food and grocery, healthcare and medical, space technology, transport, and water and sewerage. It explains that the law is designed around the risk that failures in one essential sector can cascade into others, such as energy disruption affecting medical supply, food, water, telecommunications, transport, and banking.\u003c/p\u003e\n\n\u003cp\u003eFor most responsible entities, the article identifies three main positive security obligations: registering the asset, reporting cyber incidents, and maintaining a written Critical Infrastructure Risk Management Program. Significant-impact critical incidents affecting asset availability must be reported to the Australian Signals Directorate within 12 hours of awareness, while lesser relevant incidents have a 72-hour reporting window. The risk management program must address cyber, physical, personnel, and supply chain hazards, be approved by the board, and be reported on annually.\u003c/p\u003e\n\n\u003cp\u003eThe article says the SOCI framework has expanded through the ERP Act 2024 and Cyber Security Act 2024, with further reforms in consultation that may extend duties to third parties such as managed service providers and tighten supply chain expectations. It argues that preemptive cyber defense fits the Act because many obligations depend on early awareness, including near real-time threat visibility for Systems of National Significance and fast incident reporting. Silent Push is presented as mapping adversary preparation across DNS, WHOIS, certificate, and hosting data and issuing Indicators of Future Attack before campaigns are launched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Australia’s Security of Critical Infrastructure Act 2018 applies to organisations that own, operate, or hold a direct interest in critical infrastructure assets across eleven sectors, including communications, financial services, data storage, defence industry, higher education, energy, food and grocery, healthcare, space technology, transport, and water.","For most responsible entities, the SOCI Act requires asset registration, cyber incident reporting within 12 hours for significant-impact critical incidents or 72 hours for lesser relevant incidents, and a board-approved Critical Infrastructure Risk Management Program covering cyber, physical, personnel, and supply chain risks.","Assets designated as Systems of National Significance carry Enhanced Cyber Security Obligations covering incident response planning, cyber security exercises, vulnerability assessments, and providing system information for a near real-time government threat picture.","The article says recent and proposed reforms have expanded the SOCI framework, including the ERP Act 2024, the Cyber Security Act 2024, and consultation on extending duties to third parties such as managed service providers and tightening supply chain expectations.","The article argues that Silent Push’s preemptive cyber defense can support SOCI obligations by mapping adversary infrastructure before attacks launch and issuing Indicators of Future Attack based on DNS, WHOIS, certificate, and hosting data."],"insights":["The article emphasizes that the SOCI Act’s incident reporting clock starts when an organisation becomes aware of an incident, not after it has determined the full scope, making early awareness operationally important.","The article highlights interconnection as a practical compliance challenge because a prolonged failure in one regulated sector, such as energy, can cascade into healthcare, food, water, telecommunications, transport, and banking.","The article frames preemptive cyber defense as useful for compliance because it targets the period when adversaries are still registering domains, aging them, setting up hosting, and staging campaigns before anything is delivered.","The article notes that proposed reforms would make supplier and partner infrastructure more relevant to SOCI compliance by pushing supply chain risk further to the front of the framework."],"referencedReports":[],"body":"\u003cp\u003eAustralia’s Security of Critical Infrastructure Act 2018, known as the SOCI Act, sets obligations for entities that own, operate, or hold a direct interest in critical infrastructure assets. The article says it applies across eleven sectors, including communications, financial services and markets, data storage or processing, defence industry, higher education and research, energy, food and grocery, healthcare and medical, space technology, transport, and water and sewerage. It explains that the law is designed around the risk that failures in one essential sector can cascade into others, such as energy disruption affecting medical supply, food, water, telecommunications, transport, and banking.\u003c/p\u003e\n\n\u003cp\u003eFor most responsible entities, the article identifies three main positive security obligations: registering the asset, reporting cyber incidents, and maintaining a written Critical Infrastructure Risk Management Program. Significant-impact critical incidents affecting asset availability must be reported to the Australian Signals Directorate within 12 hours of awareness, while lesser relevant incidents have a 72-hour reporting window. The risk management program must address cyber, physical, personnel, and supply chain hazards, be approved by the board, and be reported on annually.\u003c/p\u003e\n\n\u003cp\u003eThe article says the SOCI framework has expanded through the ERP Act 2024 and Cyber Security Act 2024, with further reforms in consultation that may extend duties to third parties such as managed service providers and tighten supply chain expectations. It argues that preemptive cyber defense fits the Act because many obligations depend on early awareness, including near real-time threat visibility for Systems of National Significance and fast incident reporting. Silent Push is presented as mapping adversary preparation across DNS, WHOIS, certificate, and hosting data and issuing Indicators of Future Attack before campaigns are launched.\u003c/p\u003e\n"},{"n":32,"title":"The State of Identity Security in the AI Era","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/the-state-of-identity-security-in-the-ai-era/","time":"14:25","priority":"MAY READ","score":55,"tldr":"A Semperis white paper warns that organizations are rapidly giving AI agents access to critical identity systems like Active Directory, Entra ID, and Okta without adequate safeguards. The key risk is that poorly controlled AI identities could accelerate full identity compromise and major business outages.","briefOverview":"\u003cp\u003eHealth-ISAC published an article for a Semperis white paper titled “The State of Identity Security in the AI Era” on July 24, 2026. The white paper is described as a study of AI’s effect on the identity attack surface and organizations’ responses. The article says AI is quietly redrawing the attack boundary of the global identity fabric.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that organizations are giving AI agents the keys to critical systems faster than they are putting guardrails around those new identities. It states that without rigorous defense and recoverability of identity infrastructure, over-helpful agents can become a fast track to full compromise. The specific identity platforms named are Active Directory, Entra ID, and Okta.\u003c/p\u003e\n\n\u003cp\u003eA quoted statement from Tim Brown, former SolarWinds CISO and Team8 CISO in Residency, says that wiring unguarded AI into Active Directory, Entra ID, or Okta is not innovation. The quote says this can become the fastest route from a productivity booster to a full-scale business outage. The article frames the issue in a world where ransomware can shut down hospitals and pipelines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article announces a Semperis white paper titled “The State of Identity Security in the AI Era.”","The white paper studies AI’s effect on the identity attack surface and how organizations are responding.","The article says AI is quietly redrawing the attack boundary of the global identity fabric.","The article says organizations are giving AI agents access to critical systems faster than they are putting guardrails around those new identities.","The article warns that without rigorous defense and recoverability of identity infrastructure, over-helpful agents can become a fast track to full compromise of Active Directory, Entra ID, or Okta."],"insights":["The article frames AI agents as new identities that need guardrails, not just as productivity tools.","The article singles out Active Directory, Entra ID, and Okta as critical systems where unguarded AI access can turn into organization-wide compromise.","The article links identity recoverability with AI safety, emphasizing that defenses must include the ability to restore identity infrastructure after compromise.","The quoted warning from Tim Brown stresses that connecting AI to identity systems without safeguards can shift a productivity initiative into a full-scale business outage."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published an article for a Semperis white paper titled “The State of Identity Security in the AI Era” on July 24, 2026. The white paper is described as a study of AI’s effect on the identity attack surface and organizations’ responses. The article says AI is quietly redrawing the attack boundary of the global identity fabric.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that organizations are giving AI agents the keys to critical systems faster than they are putting guardrails around those new identities. It states that without rigorous defense and recoverability of identity infrastructure, over-helpful agents can become a fast track to full compromise. The specific identity platforms named are Active Directory, Entra ID, and Okta.\u003c/p\u003e\n\n\u003cp\u003eA quoted statement from Tim Brown, former SolarWinds CISO and Team8 CISO in Residency, says that wiring unguarded AI into Active Directory, Entra ID, or Okta is not innovation. The quote says this can become the fastest route from a productivity booster to a full-scale business outage. The article frames the issue in a world where ransomware can shut down hospitals and pipelines.\u003c/p\u003e\n"},{"n":28,"title":"2026 Mid-Year Update: On Pace for Our Biggest Year Yet","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/2026-mid-year-update-on-pace-for-our-biggest-year-yet","time":"11:05","priority":"MAY READ","score":45,"tldr":"StepSecurity says it is on track for its biggest year yet, driven by rapid enterprise adoption and new products covering developer machines, CI/CD, package registries, and threat intelligence. The company frames this growth around AI-fueled software supply chain risk, arguing that organizations now need layered protection across the entire development pipeline.","briefOverview":"\u003cp\u003eStepSecurity’s mid-year 2026 update says the company is on pace for its biggest year yet after more than 5x ARR growth in both 2024 and 2025. The company says revenue growth accelerated in H1 2026 and that it closed roughly 7x more new customers than in H1 2025. It also says its customer base has shifted from startups and mid-sized technology companies toward publicly listed enterprises, unicorns, large-scale AI companies, cybersecurity vendors, and organizations in regulated sectors such as financial services, defense technology, healthcare, and enterprise software.\u003c/p\u003e\n\n\u003cp\u003eThe article frames this growth around a broader change in software supply chain risk caused by AI. StepSecurity says AI has increased the volume of code being produced and shipped while also making it easier for attackers to target developer machines, code repositories, package registries, and CI/CD pipelines. It says its security research team observed self-spreading worms targeting AI coding agents, malware with signs of AI-assisted development, and attack timelines compressed from months to days.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says it shipped all major items from its 2026 roadmap in H1, including Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds. The company describes its platform as layered protection across developer machines, repositories, package downloads, and CI/CD runtime, with tools to block compromised packages and prove whether an organization is affected. It also says its research team discovered or was among the first to publicly report major supply chain attacks including the Axios npm compromise, Shai-Hulud attack on TanStack, Nx Console VS Code extension compromise, Microsoft durabletask PyPI compromise, and Red Hat cloud services npm compromises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity says 2026 is on track to be its biggest year yet after more than 5x ARR growth in both 2024 and 2025.","The company says it closed roughly 7x more new customers in H1 2026 than in H1 2025, including publicly listed enterprises, unicorns, large-scale AI companies, and organizations in regulated industries such as financial services, defense technology, and healthcare.","StepSecurity says AI has increased both the amount of software being shipped and attackers' ability to target developer machines, code repositories, package registries, and CI/CD pipelines.","In H1 2026, StepSecurity shipped Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds.","StepSecurity says its research team discovered or was among the first to publicly report several supply chain attacks in H1 2026, including the Axios npm compromise, the Shai-Hulud attack on TanStack, the Nx Console VS Code extension compromise, Microsoft's durabletask PyPI compromise, and Red Hat cloud services npm compromises."],"insights":["StepSecurity highlights that many customer expansions happened before the first renewal, suggesting teams saw enough value within weeks to broaden deployment ahead of schedule.","The company presents cybersecurity vendors as an important validation signal, noting that several well-known security companies chose StepSecurity to protect their own development pipelines in H1 2026.","StepSecurity argues that incident response now requires evidence across multiple places at once, including whether a compromised package ran in CI/CD, exists on developer machines, or appears in pull requests or default branches.","The article emphasizes that StepSecurity's threat research is directly converted into automated customer protection, so public discoveries of compromised packages and tools feed back into its platform controls.","StepSecurity frames single-stage security tools as insufficient because they can only see one part of the software pipeline, while the attacks described can move across developer machines, repositories, package registries, and CI/CD systems."],"referencedReports":[{"title":"Supply Chain Compromises Impact Nx Console and GitHub Repositories","url":"https://www.cisa.gov/news-events/alerts/2026/05/28/supply-chain-compromises-impact-nx-console-and-github-repositories","publisher":"CISA","context":"The article cites this CISA alert as documentation of GitHub's disclosure about the Nx Console VS Code extension compromise and its impact on roughly 3,800 GitHub internal repositories.","category":"","primary":false}],"body":"\u003cp\u003eStepSecurity’s mid-year 2026 update says the company is on pace for its biggest year yet after more than 5x ARR growth in both 2024 and 2025. The company says revenue growth accelerated in H1 2026 and that it closed roughly 7x more new customers than in H1 2025. It also says its customer base has shifted from startups and mid-sized technology companies toward publicly listed enterprises, unicorns, large-scale AI companies, cybersecurity vendors, and organizations in regulated sectors such as financial services, defense technology, healthcare, and enterprise software.\u003c/p\u003e\n\n\u003cp\u003eThe article frames this growth around a broader change in software supply chain risk caused by AI. StepSecurity says AI has increased the volume of code being produced and shipped while also making it easier for attackers to target developer machines, code repositories, package registries, and CI/CD pipelines. It says its security research team observed self-spreading worms targeting AI coding agents, malware with signs of AI-assisted development, and attack timelines compressed from months to days.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says it shipped all major items from its 2026 roadmap in H1, including Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds. The company describes its platform as layered protection across developer machines, repositories, package downloads, and CI/CD runtime, with tools to block compromised packages and prove whether an organization is affected. It also says its research team discovered or was among the first to publicly report major supply chain attacks including the Axios npm compromise, Shai-Hulud attack on TanStack, Nx Console VS Code extension compromise, Microsoft durabletask PyPI compromise, and Red Hat cloud services npm compromises.\u003c/p\u003e\n"},{"n":34,"title":"TTP-Based Detection: The Missing Layer in Modern SOCs | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/ttp-based-behavioral-detection","time":"14:30","priority":"MAY READ","score":45,"tldr":"Corelight argues that modern SOCs need TTP-based detection to identify attacker behaviors rather than relying mainly on alerts, signatures, or indicators of compromise. The key takeaway is that mapping network evidence to frameworks like MITRE ATT\u0026CK can improve detection fidelity and help analysts catch threats earlier.","briefOverview":"\u003cp\u003eThe article is a Corelight piece titled “TTP-Based Detection: The Missing Layer in Modern SOCs.” It focuses on TTP-based detection in the context of modern security operations centers. The title frames this detection approach as a layer that is missing from many current SOC practices.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the article is its emphasis on detection based on attacker tactics, techniques, and procedures rather than only other forms of monitoring. It presents this approach as relevant to how SOCs identify security activity. The key technical focus is the use of TTP-based detection as a distinct detection layer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that TTP-based detection is a missing layer in many modern security operations centers.","The article focuses on detecting attacker behaviors rather than relying only on individual warning signs.","The article presents TTP-based detection as a way to improve how security teams identify and respond to threats."],"insights":["The article frames TTP-based detection as an additional layer for modern SOCs, implying that existing detection layers alone are not sufficient.","By emphasizing TTPs, the article points security teams toward detecting patterns of attacker behavior rather than focusing only on isolated alerts or indicators."],"referencedReports":[],"body":"\u003cp\u003eThe article is a Corelight piece titled “TTP-Based Detection: The Missing Layer in Modern SOCs.” It focuses on TTP-based detection in the context of modern security operations centers. The title frames this detection approach as a layer that is missing from many current SOC practices.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the article is its emphasis on detection based on attacker tactics, techniques, and procedures rather than only other forms of monitoring. It presents this approach as relevant to how SOCs identify security activity. The key technical focus is the use of TTP-based detection as a distinct detection layer.\u003c/p\u003e\n"},{"n":27,"title":"Ground Truth for Every Security Function","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/triage-investigate-hunt-defend/","time":"19:10","priority":"MAY READ","score":35,"tldr":"Censys argues that modern security teams need a live, first-party map of Internet infrastructure to make faster decisions across triage, investigation, threat hunting, and defense. The article positions Censys Internet Map, Platform, ARC, and related signals as the shared “ground truth” layer for those workflows.","briefOverview":"\u003cp\u003eCensys presents its work as building a live, comprehensive map of the Internet rather than a stale feed, secondhand vendor summary, or partial view assembled from logs and assumptions. The article says the Internet is now part of every security workflow, where employees authenticate, adversaries stage infrastructure, vulnerabilities become reachable, AI systems expose new surfaces, and third-party risk becomes operational reality. It frames the recurring question for security teams as: what is this thing on the Internet, and should we care?\u003c/p\u003e\n\n\u003cp\u003eThe article describes the Censys Internet Map as first-party observation of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure churn. It says Censys Platform lets practitioners search, enrich, pivot, automate, monitor, and act on that map in existing tools and workflows. It also describes Censys ARC, Censys Reputation Score, and Active DNS as ways to add expert judgment, faster risk decisions, and live relationships between names and infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCensys says its data is used by SOC analysts for triage, incident responders for infrastructure reconstruction, threat hunters for pivoting from indicators into campaigns, detection engineers for building logic, network defenders for enforcement, and exposure teams for understanding reachable systems. The article argues these are not separate stories but connected moments across triage, investigation, hunting, and defense. Its conclusion is that modern security teams need first-party Internet observation, expert judgment, and workflows that help practitioners move from signal to decision faster.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys built the Censys Internet Map as a first-party view of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure changes on the Internet.","Censys Platform is intended to let practitioners search, enrich, pivot, automate, monitor, and act on Internet Map data within their existing tools and workflows.","Censys ARC adds expert judgment to raw Internet observations, such as identifying commodity hosting, adversary-like infrastructure, risky service exposure, and urgent findings.","The article says SOC analysts, incident responders, threat hunters, detection engineers, network defenders, and vulnerability teams use Censys data across triage, investigation, hunting, and defense workflows.","Censys argues that triage, investigation, hunting, and defense are connected parts of modern security work that all depend on the same external Internet data."],"insights":["Censys frames the same Internet data as useful across multiple security roles, noting that SOC triage, incident response, threat hunting, detection engineering, network defense, and exposure management were “the same” story viewed from different seats.","The article emphasizes that an alert is not an answer but the start of a question, making external Internet context a decision aid for whether to close, escalate, or further enrich a case.","Censys argues that defenders need live DNS relationships because infrastructure now appears, changes, resolves, disappears, and reappears faster than older workflows can tolerate.","The article positions threat hunting as a process of finding patterns beneath single indicators by pivoting across shared Internet traits such as certificates, fingerprints, services, hosting, DNS relationships, and threat context.","Censys presents defense as continuous rather than divided into “before” and “after,” because signals can come from alerts, exposed services, new domain-to-host relationships, or vulnerability findings that need Internet context."],"referencedReports":[],"body":"\u003cp\u003eCensys presents its work as building a live, comprehensive map of the Internet rather than a stale feed, secondhand vendor summary, or partial view assembled from logs and assumptions. The article says the Internet is now part of every security workflow, where employees authenticate, adversaries stage infrastructure, vulnerabilities become reachable, AI systems expose new surfaces, and third-party risk becomes operational reality. It frames the recurring question for security teams as: what is this thing on the Internet, and should we care?\u003c/p\u003e\n\n\u003cp\u003eThe article describes the Censys Internet Map as first-party observation of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure churn. It says Censys Platform lets practitioners search, enrich, pivot, automate, monitor, and act on that map in existing tools and workflows. It also describes Censys ARC, Censys Reputation Score, and Active DNS as ways to add expert judgment, faster risk decisions, and live relationships between names and infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCensys says its data is used by SOC analysts for triage, incident responders for infrastructure reconstruction, threat hunters for pivoting from indicators into campaigns, detection engineers for building logic, network defenders for enforcement, and exposure teams for understanding reachable systems. The article argues these are not separate stories but connected moments across triage, investigation, hunting, and defense. Its conclusion is that modern security teams need first-party Internet observation, expert judgment, and workflows that help practitioners move from signal to decision faster.\u003c/p\u003e\n"},{"n":33,"title":"N2K Cyberwire Daily – The defense against the AI arts.","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/n2k-cyberwire-daily-the-defense-against-the-ai-arts/","time":"13:05","priority":"MAY READ","score":35,"tldr":"Health-ISAC’s Errol Weiss appeared on N2K Cyberwire to discuss healthcare ransomware trends and findings from recent Health-ISAC reports on the sector’s evolving threat landscape. The key takeaway is that healthcare defenders are prioritizing information sharing, identity and access management, and resilience as AI-driven threats accelerate.","briefOverview":"\u003cp\u003eThe article highlights N2K Cyberwire Daily podcast episode 2597, titled “The defense against the AI arts,” published for the July 21, 2026 episode. Errol Weiss, Chief Security Officer at Health-ISAC, joins Dave Bittner to discuss ransomware trends in the healthcare industry. The guest segment begins at section 15:40 after recent cyber news.\u003c/p\u003e\n\n\u003cp\u003eThe episode also includes findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report. The article says these reports examine the current threat landscape facing the health sector. Related resources listed in the article cover topics including healthcare CISO priorities, quarterly threat insights, crisis readiness, vendor risk, and AI-related risks in the health sector.\u003c/p\u003e\n\n\u003cp\u003eA pulled quote from Weiss emphasizes that information sharing in the health sector is even better than what he saw in the financial sector. He attributes this to healthcare organizations’ shared mission of helping people and saving lives, and to security staff being aligned with that mission. The article provides a link to listen to the N2K Cyberwire podcast episode.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Errol Weiss, Chief Security Officer at Health-ISAC, joins Dave Bittner on N2K Cyberwire Daily episode 2597 to discuss ransomware trends in the healthcare industry.","The podcast episode also covers findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report, which examine the current threat landscape facing the health sector.","The episode begins with recent cyber news, and the guest segment with Errol Weiss starts at section 15:40.","A quoted passage from the episode says information sharing in the health sector is stronger than what was seen in the financial sector because healthcare organizations share a mission of helping people and saving lives.","The article provides a link to listen to the N2K Cyberwire podcast episode and lists related Health-ISAC resources and reports."],"insights":["Health-ISAC frames healthcare security collaboration as unusually strong, with Errol Weiss saying the sector’s information sharing is even better than what he saw in the financial sector.","The article connects ransomware trends in healthcare with broader sector reports, indicating that the podcast discussion is tied to Health-ISAC’s formal benchmarking and quarterly threat findings rather than only guest commentary.","The related resources emphasize identity and access management, resilience, AI threats, vendor risk, and crisis readiness, showing the areas Health-ISAC is directing readers to alongside the ransomware discussion."],"referencedReports":[],"body":"\u003cp\u003eThe article highlights N2K Cyberwire Daily podcast episode 2597, titled “The defense against the AI arts,” published for the July 21, 2026 episode. Errol Weiss, Chief Security Officer at Health-ISAC, joins Dave Bittner to discuss ransomware trends in the healthcare industry. The guest segment begins at section 15:40 after recent cyber news.\u003c/p\u003e\n\n\u003cp\u003eThe episode also includes findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report. The article says these reports examine the current threat landscape facing the health sector. Related resources listed in the article cover topics including healthcare CISO priorities, quarterly threat insights, crisis readiness, vendor risk, and AI-related risks in the health sector.\u003c/p\u003e\n\n\u003cp\u003eA pulled quote from Weiss emphasizes that information sharing in the health sector is even better than what he saw in the financial sector. He attributes this to healthcare organizations’ shared mission of helping people and saving lives, and to security staff being aligned with that mission. The article provides a link to listen to the N2K Cyberwire podcast episode.\u003c/p\u003e\n"}]</script>
