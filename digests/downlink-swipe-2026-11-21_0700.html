<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers Exploit Critical VMware, Cisco, and Apache Flaws as Espionage Attacks Emerge","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-vmware-cisco.html","time":"08:49","priority":"MUST READ","score":96,"tldr":"CISA added four actively exploited flaws in Apache Roller, Cisco Expressway, SAP NetWeaver, and VMware vCenter to its KEV catalog, urging U.S. federal agencies to patch by November 23, 2026. The VMware vCenter flaw has been linked to suspected China-nexus espionage group Armory Castle, while Cisco Expressway was used in a breach of a Russian organization.","briefOverview":"\u003cp\u003eCISA added four flaws affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after citing evidence of active exploitation. The affected issues include CVE-2026-129448 in Apache Roller, CVE-2026-76466 in Cisco Expressway, CVE-2025-42884 in SAP NetWeaver, and CVE-2026-123890 in VMware vCenter. Federal Civilian Executive Branch agencies were directed to patch all four by November 23, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Roller issue can let an unauthenticated remote attacker execute code through its XML-RPC endpoint, and its maintainers acknowledged that it is being actively exploited. Cisco Expressway\u0026rsquo;s hard-coded credentials flaw can enable root-level command execution on clustered devices, and F6 reported it was used to breach a Russian organization after a proof-of-concept exploit was released. The VMware vCenter authentication-bypass flaw has been linked to suspected China-nexus group Armory Castle, which reportedly combined it with a BeyondTrust Remote Support flaw to deploy custom backdoors for persistence and data theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four vulnerabilities affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after finding evidence of active exploitation.","The Apache Roller flaw, CVE-2026-129448, can allow an unauthenticated remote attacker to run arbitrary code through its XML-RPC endpoint, and Apache Roller maintainers said it is being actively exploited.","CVE-2026-76466 in Cisco Expressway can allow an unauthenticated remote attacker with persistent cookies and network access to run commands as root on a clustered device through the database service.","A suspected China-nexus espionage group called Armory Castle reportedly used the VMware vCenter authentication-bypass flaw CVE-2026-123890 alongside a BeyondTrust Remote Support flaw to install custom backdoors and steal data.","U.S. Federal Civilian Executive Branch agencies were directed to patch all four vulnerabilities by November 23, 2026."],"insights":["SAP NetWeaver Enterprise Portal was added to CISA's actively exploited catalog even though the article says there were no public reports documenting exploitation of CVE-2025-42884 at the time of writing.","The Cisco Expressway flaw was reportedly used against a Russian organization after a proof-of-concept exploit became available, and the intruders then moved through the network and accessed sensitive data.","Armory Castle reportedly combined the VMware vCenter authentication bypass with a separate BeyondTrust Remote Support flaw, illustrating that attackers used multiple weaknesses together to maintain access and steal data."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/20/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert as the source for adding the Apache Roller, Cisco Expressway, SAP NetWeaver, and VMware vCenter flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added four flaws affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after citing evidence of active exploitation. The affected issues include CVE-2026-129448 in Apache Roller, CVE-2026-76466 in Cisco Expressway, CVE-2025-42884 in SAP NetWeaver, and CVE-2026-123890 in VMware vCenter. Federal Civilian Executive Branch agencies were directed to patch all four by November 23, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Roller issue can let an unauthenticated remote attacker execute code through its XML-RPC endpoint, and its maintainers acknowledged that it is being actively exploited. Cisco Expressway\u0026rsquo;s hard-coded credentials flaw can enable root-level command execution on clustered devices, and F6 reported it was used to breach a Russian organization after a proof-of-concept exploit was released. The VMware vCenter authentication-bypass flaw has been linked to suspected China-nexus group Armory Castle, which reportedly combined it with a BeyondTrust Remote Support flaw to deploy custom backdoors for persistence and data theft.\u003c/p\u003e\n"},{"n":2,"title":"Signal Blocks AI Agents From Reading Private Chats via Screenshots on Android and iOS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/signal-blocks-ai-agents-from-reading.html","time":"08:49","priority":"SHOULD READ","score":78,"tldr":"Signal now blocks screenshots by default on supported Android and iOS devices to limit OS-level AI agents from reading private chats, though it acknowledges the safeguard cannot prevent all data-access paths. The change follows concerns that agents with broad accessibility, screenshot, or notification permissions can extract Signal content outside the app’s encryption protections.","briefOverview":"\u003cp\u003eSignal announced that it will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats. The feature applies to agentic systems built into iOS 27 and Android versions where Signal can detect an AI assistant attempting to read its screen. Signal said these systems can scan what is displayed, capture Signal data, and make it available to AI agents outside the app’s control. Meredith Whittaker, president of the Signal Foundation, called the integrations an existential threat to Signal’s privacy guarantees.\u003c/p\u003e\n\n\u003cp\u003eUsers can disable the controls through Signal’s App Security settings, but Signal warned that doing so could expose their content and their contacts’ content to AI agents. The company acknowledged that screenshot blocking is incomplete because agents may retrieve data already present on a device through the file system or other methods. Reuters reported that Meta’s Muse agent accessed Signal messages through macOS accessibility and screenshot tools, and through Android push-notification access. Signal is urging technology companies to provide documented controls that let apps fully opt out of AI access to screens, files, notifications, APIs, and other operating-system functions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Signal will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats, while acknowledging that the protection is incomplete.","Signal says users can disable the setting through its privacy and app-security controls, but doing so may expose their Signal content and their contacts’ content to AI agents.","Signal warned that screenshot blocking cannot prevent AI agents from obtaining data through other routes, including files already on a user’s device.","Reuters reported that Meta’s Muse AI agent accessed Signal messages on Apple and Android devices by using broad permissions, including macOS accessibility and screenshot tools and Android push-notification access.","Signal is urging technology companies to provide documented app-level controls that can fully opt apps out of AI data access and processing."],"insights":["Signal’s encryption cannot independently preserve privacy when an operating-system AI agent can capture chat content from the screen, notifications, or files after it is displayed on a device.","A single user granting broad permissions to an AI agent can create privacy exposure for every participant in that user’s Signal conversations, not only the person who enabled the agent.","Meta’s Muse reportedly accessed Signal on macOS through accessibility and screenshot permissions, while on Android it read Signal messages through push-notification access, showing that the access route can differ by operating system.","Signal’s screenshot restriction is only a partial safeguard because it does not stop an AI agent from retrieving Signal content that may already be stored on the device.","Apple’s iOS 27.2 includes an Excluded Apps setting for Siri, Search, and suggestions, giving users a separate operating-system control over which apps those features can access."],"referencedReports":[{"title":"Meta Bets Big on Muse AI Agent as Early Safety Mishaps Surface","url":"https://www.reuters.com/investigations/meta-bets-big-muse-ai-agent-early-safety-mishaps-surface-2026-11-18/","publisher":"reuters","context":"The article cites a Reuters investigation reporting that Meta’s Muse AI agent accessed Signal messages on macOS and Android by using broad operating-system permissions.","category":"news","primary":false}],"body":"\u003cp\u003eSignal announced that it will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats. The feature applies to agentic systems built into iOS 27 and Android versions where Signal can detect an AI assistant attempting to read its screen. Signal said these systems can scan what is displayed, capture Signal data, and make it available to AI agents outside the app’s control. Meredith Whittaker, president of the Signal Foundation, called the integrations an existential threat to Signal’s privacy guarantees.\u003c/p\u003e\n\n\u003cp\u003eUsers can disable the controls through Signal’s App Security settings, but Signal warned that doing so could expose their content and their contacts’ content to AI agents. The company acknowledged that screenshot blocking is incomplete because agents may retrieve data already present on a device through the file system or other methods. Reuters reported that Meta’s Muse agent accessed Signal messages through macOS accessibility and screenshot tools, and through Android push-notification access. Signal is urging technology companies to provide documented controls that let apps fully opt out of AI access to screens, files, notifications, APIs, and other operating-system functions.\u003c/p\u003e\n"}]</script>
