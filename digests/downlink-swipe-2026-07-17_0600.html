<script type="application/json" id="dl-articles">[{"n":4,"title":"CISA Adds Exploited SharePoint RCE Zero-Day CVE-2026-58644 to KEV","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cisa-adds-exploited-sharepoint-rce-zero.html","time":"06:42","priority":"MUST READ","score":96,"tldr":"CISA added a newly patched Microsoft SharePoint Server zero-day, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog after confirming active exploitation, requiring U.S. federal agencies to patch by July 19, 2026. Organizations running on-premises SharePoint should urgently apply updates, verify defenses like AMSI, and check for signs of compromise.","briefOverview":"\u003cp\u003eCISA added a newly patched Microsoft SharePoint Server vulnerability, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies are required to apply the fixes by July 19, 2026. Microsoft revised its bulletin to clarify that the flaw has been exploited in the wild, meaning it was used as a zero-day before patches were available.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8. Microsoft said that, in a network-based attack, an attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The flaw affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eCISA also warned of active exploitation of multiple SharePoint Server vulnerabilities, including CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, and CVE-2026-58644, that could allow unauthorized access to on-premises instances. The agency said the activity can involve remote code execution and post-exploitation actions such as stealing IIS machine keys, using deserialization techniques for persistence, and deploying malware. CISA recommended applying Microsoft updates, verifying AMSI integration, removing intrusion artifacts before rotating IIS machine keys, improving logging, limiting internet exposure, and restricting access to SharePoint Central Administration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-58644, a newly patched Microsoft SharePoint Server flaw, to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 19, 2026.","CVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8 that allows an unauthorized attacker to execute arbitrary code.","Microsoft said the vulnerability can be exploited remotely over the internet and has low attack complexity because attackers need no significant prior system knowledge and can repeatedly succeed with a payload against the vulnerable component.","The vulnerability affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.","CISA warned that multiple SharePoint Server vulnerabilities, including CVE-2026-58644, are being actively exploited to gain unauthorized access to on-premises instances and support post-exploitation activity such as stealing IIS machine keys and deploying malware."],"insights":["CISA’s July 19, 2026 deadline gives federal agencies only a few days from the July 14 Patch Tuesday release to remediate CVE-2026-58644, reflecting the urgency created by confirmed exploitation before fixes were available.","CISA specifically advises removing intrusion artifacts before rotating IIS machine keys, because rotating keys while harvesting tools remain present could allow attackers to steal the new keys as well.","The SharePoint hardening guidance goes beyond patching by recommending reduced internet exposure, blocked external access to Central Administration, and restricted farm and database communications, indicating that configuration changes are part of the immediate containment strategy.","Microsoft revised its bulletin after release to clarify that CVE-2026-58644 had been exploited in the wild, meaning organizations relying only on the original Patch Tuesday context may have underestimated the urgency of the update."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/16/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites this CISA alert as the source for adding CVE-2026-58644 and two Fortinet flaws to the KEV catalog.","category":"","primary":false},{"title":"CVE-2026-58644","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-58644","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the SharePoint Server vulnerability, its exploitability, and affected versions.","category":"","primary":false},{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article references this CISA warning about active exploitation of multiple SharePoint Server vulnerabilities and recommended hardening measures.","category":"","primary":false},{"title":"SharePoint Server security hardening","url":"https://learn.microsoft.com/en-us/sharepoint/security-for-sharepoint-server/security-hardening","publisher":"Microsoft","context":"The article points readers to Microsoft’s SharePoint Server security-hardening guidance as part of CISA’s recommended containment measures.","category":"","primary":false},{"title":"CVE-2026-39808 Fortinet FortiSandbox Command Injection","url":"https://www.crowdsec.net/vulntracking-report/cve-2026-39808-fortinet-fortisandbox-command-injection","publisher":"CrowdSec","context":"The article cites this report in connection with active exploitation of a Fortinet FortiSandbox flaw added to CISA’s KEV catalog.","category":"","primary":false}],"body":"\u003cp\u003eCISA added a newly patched Microsoft SharePoint Server vulnerability, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies are required to apply the fixes by July 19, 2026. Microsoft revised its bulletin to clarify that the flaw has been exploited in the wild, meaning it was used as a zero-day before patches were available.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8. Microsoft said that, in a network-based attack, an attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The flaw affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eCISA also warned of active exploitation of multiple SharePoint Server vulnerabilities, including CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, and CVE-2026-58644, that could allow unauthorized access to on-premises instances. The agency said the activity can involve remote code execution and post-exploitation actions such as stealing IIS machine keys, using deserialization techniques for persistence, and deploying malware. CISA recommended applying Microsoft updates, verifying AMSI integration, removing intrusion artifacts before rotating IIS machine keys, improving logging, limiting internet exposure, and restricting access to SharePoint Central Administration.\u003c/p\u003e\n"},{"n":1,"title":"CISA urges immediate action on actively exploited Fortinet flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-feds-to-patch-exploited-fortinet-fortisandbox-flaws-by-sunday/","time":"07:03","priority":"MUST READ","score":95,"tldr":"CISA says two critical Fortinet FortiSandbox flaws are being actively exploited and has ordered U.S. federal agencies to patch affected systems by July 19. The vulnerabilities allow unauthenticated remote code execution via command injection, so admins should upgrade immediately.","briefOverview":"\u003cp\u003eCISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet’s FortiSandbox threat detection platform. The flaws are tracked as CVE-2026-39808 and CVE-2026-25089, and Fortinet addressed them on April 14 and June 9, respectively. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and requires federal agencies to patch vulnerable FortiSandbox instances by Sunday, July 19.\u003c/p\u003e\n\n\u003cp\u003eFortinet’s advisories said successful exploitation allows unauthenticated threat actors to remotely execute unauthorized code through low-complexity command injection attacks that require no user interaction. Administrators must upgrade affected deployments to the latest released versions to resolve the issues and block incoming attacks. Fortinet has not yet tagged the two vulnerabilities as used in attacks, and it had not replied to BleepingComputer’s emails about in-the-wild exploitation.\u003c/p\u003e\n\n\u003cp\u003eThreat intelligence company Defused reported on June 16 that attackers had started abusing multiple Fortinet FortiSandbox vulnerabilities, including CVE-2026-39808 and CVE-2026-25089. The article also notes other Fortinet flaws patched earlier in the year that were reported as exploited, including a FortiClient EMS SQL injection vulnerability and a path traversal vulnerability. CISA tracks 28 Fortinet vulnerabilities exploited in attacks in recent years, 13 of which have also been abused in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet FortiSandbox, tracked as CVE-2026-39808 and CVE-2026-25089.","Fortinet addressed CVE-2026-39808 on April 14 and CVE-2026-25089 on June 9, and administrators must upgrade affected deployments to the latest released versions to block attacks.","Successful exploitation allows unauthenticated threat actors to remotely execute unauthorized code through low-complexity command injection attacks that require no user interaction.","Threat intelligence company Defused reported on June 16 that attackers had begun exploiting multiple Fortinet FortiSandbox vulnerabilities, including CVE-2026-39808 and CVE-2026-25089, in the wild.","CISA added the two flaws to its Known Exploited Vulnerabilities catalog and requires U.S. federal agencies to patch vulnerable FortiSandbox instances by Sunday, July 19."],"insights":["CISA’s emergency patch deadline leaves federal agencies only a few days to remediate, reflecting the urgency assigned once the flaws were added to the Known Exploited Vulnerabilities catalog.","The article highlights a gap between Fortinet’s public advisories and external exploitation reports, noting that Fortinet had not yet labeled the two flaws as exploited even after Defused and CISA reported in-the-wild activity.","Defused reported exploitation of an additional FortiSandbox issue, CVE-2026-39813, but CISA’s action in this article only covers CVE-2026-39808 and CVE-2026-25089.","Fortinet products have a substantial history of real-world abuse, with CISA tracking 28 exploited Fortinet vulnerabilities in recent years and 13 also used in ransomware attacks."],"referencedReports":[{"title":"Fortinet PSIRT Advisory FG-IR-26-100 (CVE-2026-39808)","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-100","publisher":"Fortinet","context":"The article says Fortinet addressed CVE-2026-39808 and detailed the flaw in a security advisory issued at the time.","category":"","primary":false},{"title":"Fortinet PSIRT Advisory FG-IR-26-141 (CVE-2026-25089)","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-141","publisher":"Fortinet","context":"The article says Fortinet addressed CVE-2026-25089 and detailed the flaw in a security advisory issued at the time.","category":"","primary":false},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA’s alert confirming the two Fortinet flaws are actively exploited in the wild and adding them to the Known Exploited Vulnerabilities catalog.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA’s catalog where the two Fortinet FortiSandbox vulnerabilities were added after confirmed exploitation.","category":"","primary":false}],"body":"\u003cp\u003eCISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet’s FortiSandbox threat detection platform. The flaws are tracked as CVE-2026-39808 and CVE-2026-25089, and Fortinet addressed them on April 14 and June 9, respectively. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and requires federal agencies to patch vulnerable FortiSandbox instances by Sunday, July 19.\u003c/p\u003e\n\n\u003cp\u003eFortinet’s advisories said successful exploitation allows unauthenticated threat actors to remotely execute unauthorized code through low-complexity command injection attacks that require no user interaction. Administrators must upgrade affected deployments to the latest released versions to resolve the issues and block incoming attacks. Fortinet has not yet tagged the two vulnerabilities as used in attacks, and it had not replied to BleepingComputer’s emails about in-the-wild exploitation.\u003c/p\u003e\n\n\u003cp\u003eThreat intelligence company Defused reported on June 16 that attackers had started abusing multiple Fortinet FortiSandbox vulnerabilities, including CVE-2026-39808 and CVE-2026-25089. The article also notes other Fortinet flaws patched earlier in the year that were reported as exploited, including a FortiClient EMS SQL injection vulnerability and a path traversal vulnerability. CISA tracks 28 Fortinet vulnerabilities exploited in attacks in recent years, 13 of which have also been abused in ransomware attacks.\u003c/p\u003e\n"},{"n":3,"title":"US charges two over laundering $43 million from investment fraud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-charges-two-over-laundering-43-million-from-investment-fraud/","time":"08:13","priority":"SHOULD READ","score":78,"tldr":"U.S. prosecutors charged Zhuoying Chen and Haojie Zhang with laundering at least $43 million stolen from cyber investment fraud victims through 140 bank accounts and dozens of shell companies. If convicted of money-laundering conspiracy, they face up to 20 years in prison.","briefOverview":"\u003cp\u003eU.S. prosecutors charged 27-year-old Zhuoying Chen and 38-year-old Haojie Zhang for their alleged roles in a large-scale crime ring that laundered money stolen through cyber investment fraud scams. The two allegedly managed a network of more than a dozen people in Queens and Brooklyn between 2020 and 2022. According to the unsealed indictment, the network transferred at least $43 million in scam proceeds to bank accounts in China.\u003c/p\u003e\n\n\u003cp\u003eThe alleged laundering operation used 140 bank accounts under roughly 45 shell companies. The underlying scams involved criminals contacting potential victims through social media or messaging services, building trust, and persuading them to invest in fraudulent opportunities. Victims were shown fake profiles with profits to encourage further investment before additional funds were stolen.\u003c/p\u003e\n\n\u003cp\u003eChen and Zhang each face a maximum sentence of 20 years in prison if convicted of conspiracy to commit money laundering. The article notes that investment fraud accounted for 49% of all scam-related incidents in the FBI\u0026rsquo;s 2025 Internet Crime Report, with reported losses of $8.6 billion. It also places the case alongside other recent U.S. and European actions against pig butchering and investment fraud schemes involving tens or hundreds of millions in losses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. prosecutors charged Zhuoying Chen and Haojie Zhang for their alleged roles in a crime ring that laundered money stolen in cyber investment fraud scams.","Chen and Zhang allegedly managed a network of more than a dozen people in Queens and Brooklyn between 2020 and 2022.","The indictment alleges the network moved at least $43 million in scam proceeds to bank accounts in China using 140 bank accounts under roughly 45 shell companies.","The underlying scams involved criminals contacting victims through social media or messaging services, building trust, showing fake profits, and stealing additional money invested in the schemes.","If convicted of conspiracy to commit money laundering, Chen and Zhang face a maximum sentence of 20 years in prison."],"insights":["The alleged laundering network relied on a large volume of ordinary financial infrastructure, including 140 bank accounts and roughly 45 shell companies, showing how investment scam proceeds can be fragmented across many accounts rather than moved through a single channel.","Authorities are targeting not only the people who contact and deceive victims but also the alleged money-moving networks that allow scammers to continue operating.","The article places this case in a broader enforcement pattern, citing multiple recent U.S. and European actions against investment fraud and pig butchering schemes involving tens or hundreds of millions of dollars.","Investment fraud represented nearly half of all scam-related incidents in the FBI’s 2025 Internet Crime Report, making it a dominant category of reported scam losses rather than a niche threat."],"referencedReports":[{"title":"2025 Internet Crime Report","url":"https://www.bleepingcomputer.com/news/security/fbi-americans-lost-a-record-21-billion-to-cybercrime-last-year/","publisher":"fbi","context":"The article cites the FBI's 2025 Internet Crime Report for figures on investment fraud incidents and reported losses.","category":"","primary":false}],"body":"\u003cp\u003eU.S. prosecutors charged 27-year-old Zhuoying Chen and 38-year-old Haojie Zhang for their alleged roles in a large-scale crime ring that laundered money stolen through cyber investment fraud scams. The two allegedly managed a network of more than a dozen people in Queens and Brooklyn between 2020 and 2022. According to the unsealed indictment, the network transferred at least $43 million in scam proceeds to bank accounts in China.\u003c/p\u003e\n\n\u003cp\u003eThe alleged laundering operation used 140 bank accounts under roughly 45 shell companies. The underlying scams involved criminals contacting potential victims through social media or messaging services, building trust, and persuading them to invest in fraudulent opportunities. Victims were shown fake profiles with profits to encourage further investment before additional funds were stolen.\u003c/p\u003e\n\n\u003cp\u003eChen and Zhang each face a maximum sentence of 20 years in prison if convicted of conspiracy to commit money laundering. The article notes that investment fraud accounted for 49% of all scam-related incidents in the FBI\u0026rsquo;s 2025 Internet Crime Report, with reported losses of $8.6 billion. It also places the case alongside other recent U.S. and European actions against pig butchering and investment fraud schemes involving tens or hundreds of millions in losses.\u003c/p\u003e\n"},{"n":2,"title":"Windows Server 2022 reach end of mainstream support in 90 days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-server-2022-reach-end-of-mainstream-support-in-90-days/","time":"09:10","priority":"MAY READ","score":65,"tldr":"Windows Server 2022 will leave mainstream support on October 13, 2026, but will continue receiving free monthly security updates under extended support until October 14, 2031. Microsoft is urging customers to plan upgrades to Windows Server 2025 for full mainstream support.","briefOverview":"\u003cp\u003eMicrosoft announced that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the last mainstream support update for this version. After that date, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is advising customers to upgrade to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server. Windows Server 2025 became generally available in November 2024 and is scheduled to reach the end of mainstream support on November 13, 2029, with extended support ending on November 14, 2034. Customers who want to test Windows Server 2025 before deployment can use a free 180-day trial through the Microsoft Evaluation Center.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also said customers should evaluate upgrade options and begin deployment testing early to help ensure a smooth transition. The article notes that Microsoft recently extended Windows Server 2022 hotpatching until October 2027 for systems running Datacenter: Azure Edition. It also says Microsoft reminded customers that Windows 10 Enterprise LTSB 2016 and the Home and Pro editions of Windows 11 24H2 will stop receiving updates three months after reaching end of support.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced that Windows Server 2022 will reach the end of mainstream support on October 13, 2026.","After October 13, 2026, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.","Microsoft advises customers to plan upgrades to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server.","Windows Server 2025 became generally available in November 2024 and is scheduled to receive mainstream support until November 13, 2029, with extended support ending on November 14, 2034.","Microsoft also extended Windows Server 2022 hotpatching until October 2027 for systems running Datacenter: Azure Edition."],"insights":["Organizations do not need to pay extra for Windows Server 2022 security updates during extended support, because Microsoft says monthly security updates will continue at no additional cost through October 14, 2031.","Customers have a defined testing path for migration because Microsoft offers a free 180-day Windows Server 2025 trial through the Microsoft Evaluation Center.","Windows Server 2022 Datacenter: Azure Edition users have an extra planning consideration because hotpatching has been extended until October 2027, one year beyond the mainstream support end date.","Microsoft is encouraging early upgrade testing rather than waiting for the support deadline, saying customers should evaluate upgrade options and begin deployment testing early to help ensure a smooth transition."],"referencedReports":[{"title":"Windows Server 2022 end of mainstream support message center update","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#4900","publisher":"Microsoft","context":"The article cites Microsoft's message center update as the source for the Windows Server 2022 mainstream support end date and extended security update timeline.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft announced that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the last mainstream support update for this version. After that date, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is advising customers to upgrade to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server. Windows Server 2025 became generally available in November 2024 and is scheduled to reach the end of mainstream support on November 13, 2029, with extended support ending on November 14, 2034. Customers who want to test Windows Server 2025 before deployment can use a free 180-day trial through the Microsoft Evaluation Center.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also said customers should evaluate upgrade options and begin deployment testing early to help ensure a smooth transition. The article notes that Microsoft recently extended Windows Server 2022 hotpatching until October 2027 for systems running Datacenter: Azure Edition. It also says Microsoft reminded customers that Windows 10 Enterprise LTSB 2016 and the Home and Pro editions of Windows 11 24H2 will stop receiving updates three months after reaching end of support.\u003c/p\u003e\n"}]</script>

  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
