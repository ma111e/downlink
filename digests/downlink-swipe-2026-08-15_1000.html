<script type="application/json" id="dl-articles">[{"n":1,"title":"The Grant Thread Was Real. The Portal Was Not.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/hijacked-nonprofit-mailbox-genuine-grant-thread-dynamics-365-gate","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"Attackers abused a compromised nonprofit Google Workspace mailbox to resend a genuine federal grant thread to unrelated recipients, adding only a phishing link disguised as grant documents. The lure bypassed basic trust checks by using real correspondence and a Microsoft Dynamics 365 marketing redirect, making behavioral signals like first-time sender, Bcc delivery, and recipient mismatch the key detections.","briefOverview":"\u003cp\u003eA compromised nonprofit Google Workspace mailbox sent a phishing message that reused a genuine federal grant notification as its credibility layer. The quoted thread contained real grant metadata, real addressees from the original correspondence, and hotlinked header and footer images from GrantSolutions. The message was delivered by Bcc to an operations executive at a professional services firm who had no relationship to the grant or the original thread.\u003c/p\u003e\n\n\u003cp\u003eThe fabricated part was the new top paragraph, which claimed that grant submission portal files and project documents were available through a single link. That link used Microsoft Dynamics 365 marketing redirect infrastructure on public-usa.mkt.dynamics.com, and the static link scanner rated it clean. A live screenshot showed a PNC Foundation grant funding opportunity page with an assigned opportunity number and a field asking for a work or business email, but the article states that no testing was performed beyond that page.\u003c/p\u003e\n\n\u003cp\u003eThe article says delivery was not achieved through a clever authentication bypass, because the sender’s domain simply had no SPF record, DKIM passed through a non-aligned Google signing domain, and DMARC failed under a policy of none. The key detection evidence was behavioral: a first-time high-risk sender, no prior relationship history, undisclosed recipients, and a quoted grant thread whose original addressees did not include the reader. Themis scored the message at 82% confidence for credential theft and automatically resolved the incident as phishing for the single affected mailbox.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A compromised nonprofit Google Workspace mailbox reused a genuine federal grant notification containing real grant metadata and hotlinked GrantSolutions images as the credibility layer for a phishing message.","The message was blind-copied to an operations executive at a professional services firm who had no relationship to the grant or the original nonprofit recipients.","The only new call to action pointed to a Microsoft Dynamics 365 marketing redirect URL that the static link scanner rated clean.","A live screenshot of the linked page showed PNC Foundation grant opportunity branding and access gated behind a work or business email field, but no testing was performed beyond that page.","Themis scored the message at 82% confidence for credential theft and the incident was automatically resolved as phishing for the single affected mailbox."],"insights":["Inspecting the quoted grant thread would not reveal the deception because the article states the quoted content was authentic; the fabricated elements were the attacker’s top paragraph and the unrelated recipient context.","The article emphasizes that the failed DMARC result was not the decisive issue because the domain’s policy was set to take no action and the mail posture resembled an ordinary small nonprofit configuration.","The clean verdict on the Microsoft Dynamics 365 redirect shows why judging only the first link host can miss risk when the visible hostname belongs to a large legitimate service.","The mismatch between undisclosed recipients and highly specific grant content is presented as a stronger warning sign than the reputation or age of the sending domain.","The article separates observed evidence from inference by noting that only an email-gated landing page was confirmed, while any password request or later credential theft step was not directly observed."],"referencedReports":[{"title":"Compromise Accounts: Email Accounts (T1586.002)","url":"https://attack.mitre.org/techniques/T1586/002/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique to explain that the use of a real nonprofit mailbox with no relationship history aligns with compromised email accounts.","category":"research","primary":false},{"title":"Phishing: Spearphishing Link (T1566.002)","url":"https://attack.mitre.org/techniques/T1566/002/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique when describing the phishing link hidden behind a legitimate Microsoft Dynamics 365 marketing redirect host.","category":"research","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the report for breach initial access statistics involving phishing and pretexting.","category":"research","primary":false},{"title":"2025 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for reported business email compromise losses of just over $3.05 billion.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references this guidance to support the value of behavior-aware controls for phishing detection.","category":"guide","primary":false}],"body":"\u003cp\u003eA compromised nonprofit Google Workspace mailbox sent a phishing message that reused a genuine federal grant notification as its credibility layer. The quoted thread contained real grant metadata, real addressees from the original correspondence, and hotlinked header and footer images from GrantSolutions. The message was delivered by Bcc to an operations executive at a professional services firm who had no relationship to the grant or the original thread.\u003c/p\u003e\n\n\u003cp\u003eThe fabricated part was the new top paragraph, which claimed that grant submission portal files and project documents were available through a single link. That link used Microsoft Dynamics 365 marketing redirect infrastructure on public-usa.mkt.dynamics.com, and the static link scanner rated it clean. A live screenshot showed a PNC Foundation grant funding opportunity page with an assigned opportunity number and a field asking for a work or business email, but the article states that no testing was performed beyond that page.\u003c/p\u003e\n\n\u003cp\u003eThe article says delivery was not achieved through a clever authentication bypass, because the sender’s domain simply had no SPF record, DKIM passed through a non-aligned Google signing domain, and DMARC failed under a policy of none. The key detection evidence was behavioral: a first-time high-risk sender, no prior relationship history, undisclosed recipients, and a quoted grant thread whose original addressees did not include the reader. Themis scored the message at 82% confidence for credential theft and automatically resolved the incident as phishing for the single affected mailbox.\u003c/p\u003e\n"}]</script>
