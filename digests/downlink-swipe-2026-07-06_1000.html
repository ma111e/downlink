<script type="application/json" id="dl-articles">[{"n":1,"title":"Max severity Adobe ColdFusion flaw now exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/max-severity-adobe-coldfusion-flaw-now-exploited-in-attacks/","time":"13:18","priority":"MUST READ","score":94,"tldr":"Attackers are now exploiting CVE-2026-48282, a maximum-severity Adobe ColdFusion flaw that allows unauthenticated remote code execution on unpatched systems. Adobe and Canada’s Cyber Centre urge administrators to apply the latest ColdFusion updates immediately.","briefOverview":"\u003cp\u003eAttackers are now exploiting a maximum-severity Adobe ColdFusion vulnerability tracked as CVE-2026-48282, according to the Canadian Centre for Cyber Security. ColdFusion is a commercial web app development platform used to build and deploy enterprise-grade websites. The flaw affects ColdFusion versions 2025.9, 2023.20, and earlier, and can be exploited by attackers without privileges to gain remote code execution on unpatched systems.\u003c/p\u003e\n\n\u003cp\u003eAdobe released security updates to address the vulnerability and said the issue posed a high risk of exploitation. The company recommended that administrators install the update as soon as possible, such as within 72 hours. Two days later, the Canadian Centre for Cyber Security warned that open-source reporting indicates CVE-2026-48282 is being exploited and encouraged users and administrators to apply the necessary updates.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks nearly 800 Adobe ColdFusion instances exposed online, though the article says it is unknown how many are honeypots or have already been secured against attacks targeting CVE-2026-48282. The article also notes that Adobe recently patched multiple maximum-severity flaws in ColdFusion and Campaign Classic, all described as exploitable through low-complexity attacks that do not require user interaction. Since November 2021, CISA has included 79 vulnerabilities in Adobe products in its catalog of actively exploited flaws, including 10 that were also abused in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are exploiting the maximum-severity Adobe ColdFusion vulnerability CVE-2026-48282, according to a warning from the Canadian Centre for Cyber Security.","CVE-2026-48282 affects Adobe ColdFusion versions 2025.9, 2023.20, and earlier, and can allow attackers without privileges to gain remote code execution on unpatched systems.","Adobe released security updates for the vulnerability and recommended that administrators install them as soon as possible, such as within 72 hours.","The Canadian Centre for Cyber Security said open-source reporting indicates CVE-2026-48282 is being exploited and encouraged users and administrators to apply the necessary updates.","Shadowserver tracks nearly 800 Adobe ColdFusion instances exposed online, but the article says it is not known how many are honeypots or have been secured against CVE-2026-48282 attacks."],"insights":["The exploitation warning came just two days after Adobe released patches, making Adobe’s recommendation to update within 72 hours especially actionable for ColdFusion administrators.","There is a gap between Adobe’s public position and the Canadian Centre for Cyber Security’s warning: Adobe has not flagged the patched flaws as actively exploited, while CCCS says open-source reporting indicates CVE-2026-48282 is being exploited.","Shadowserver’s count of nearly 800 internet-exposed ColdFusion instances is difficult to interpret because the article says it is unknown how many are honeypots or already secured, so exposure data alone does not show the number of vulnerable targets.","The article notes that CISA has listed 79 actively exploited Adobe product vulnerabilities since November 2021, including 10 abused in ransomware attacks, underscoring why Adobe patching is a recurring security priority."],"referencedReports":[{"title":"Adobe Security Advisory - AV26-647","url":"https://www.cyber.gc.ca/en/alerts-advisories/adobe-security-advisory-av26-647","publisher":"Canadian Centre for Cyber Security","context":"The article cites this advisory as the source warning that open-source reporting indicates CVE-2026-48282 is being exploited and urging users and administrators to apply updates.","category":"","primary":false}],"body":"\u003cp\u003eAttackers are now exploiting a maximum-severity Adobe ColdFusion vulnerability tracked as CVE-2026-48282, according to the Canadian Centre for Cyber Security. ColdFusion is a commercial web app development platform used to build and deploy enterprise-grade websites. The flaw affects ColdFusion versions 2025.9, 2023.20, and earlier, and can be exploited by attackers without privileges to gain remote code execution on unpatched systems.\u003c/p\u003e\n\n\u003cp\u003eAdobe released security updates to address the vulnerability and said the issue posed a high risk of exploitation. The company recommended that administrators install the update as soon as possible, such as within 72 hours. Two days later, the Canadian Centre for Cyber Security warned that open-source reporting indicates CVE-2026-48282 is being exploited and encouraged users and administrators to apply the necessary updates.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks nearly 800 Adobe ColdFusion instances exposed online, though the article says it is unknown how many are honeypots or have already been secured against attacks targeting CVE-2026-48282. The article also notes that Adobe recently patched multiple maximum-severity flaws in ColdFusion and Campaign Classic, all described as exploitable through low-complexity attacks that do not require user interaction. Since November 2021, CISA has included 79 vulnerabilities in Adobe products in its catalog of actively exploited flaws, including 10 that were also abused in ransomware attacks.\u003c/p\u003e\n"},{"n":3,"title":"Suspected China-Nexus Hackers Use Fake Indian Tax Filing Utility to Deploy DcRAT","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/suspected-china-nexus-hackers-use-fake.html","time":"10:58","priority":"MUST READ","score":92,"tldr":"A suspected China-linked campaign is targeting Indian taxpayers and finance professionals with fake Income Tax Department lures that install DcRAT through a malicious tax-filing utility. The operation uses DLL sideloading, anti-analysis checks, image-based payload concealment, persistence, and data exfiltration to steal sensitive information.","briefOverview":"\u003cp\u003eA suspected China-nexus threat activity cluster has been observed targeting Indian taxpayers, tax professionals, and corporate finance teams with a remote access trojan designed to steal sensitive data. Seqrite Labs codenamed the campaign Operation DragonReturn and said it was first observed on May 18, 2026, during India’s annual income tax filing season. The campaign uses spear-phishing emails impersonating the Income Tax Department of India and lures recipients with tax violations and penalty themes.\u003c/p\u003e\n\n\u003cp\u003eThe attack leads victims to a bogus landing page that instructs them to download a ZIP archive posing as an official offline tax-filing utility. The archive is engineered to sideload a malicious DLL named nvdaHelperRemote.dll, which injects another payload into memory, retrieves a JPG file from a hard-coded server, and extracts a secondary DLL from it. The malware copies itself as Mixed Reality.exe, creates a Windows service named MixedSvc for persistence, disables Windows AMSI scanning, and decrypts and loads DCRat.\u003c/p\u003e\n\n\u003cp\u003eSeqrite Labs assessed that the campaign’s goal is financial gain or sensitive data theft, and said the malware also includes a payload capable of taking screenshots and exfiltrating data to a remote server. The actor behind the activity remains unclear, but the article cites ChinaNet IP addresses, a Chinese-language DCRat management panel, and overlaps with Silver Fox as indicators of a China-aligned operation. The article also notes separate LevelBlue reporting on ValleyRAT campaigns using fake installers and salary-themed phishing emails targeting Chinese- and Japanese-speaking users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Seqrite Labs observed a suspected China-nexus campaign, codenamed Operation DragonReturn, targeting Indian taxpayers, tax professionals, and corporate finance teams starting on May 18, 2026.","The campaign uses spear-phishing emails impersonating the Income Tax Department of India and links to a fake tax-related site that delivers a ZIP archive posing as an official offline tax-filing utility.","The malicious archive uses DLL sideloading to run nvdaHelperRemote.dll, inject another payload into memory, retrieve a JPG file from 204.194.48[.]250, and extract a secondary DLL hidden inside the image.","The malware copies itself as Mixed Reality.exe, creates an auto-start Windows service named MixedSvc, and deploys payloads including a .NET loader that disables Windows AMSI scanning and loads DCRat.","Seqrite Labs said the campaign shows infrastructure and tactical overlaps with Silver Fox, while LevelBlue separately reported ValleyRAT campaigns using fake installers and salary-themed phishing emails against Chinese- and Japanese-speaking users."],"insights":["The campaign’s use of real legal citations, bilingual content, and active payload rotation led Seqrite Labs to assess it as a deliberate and sustained operation rather than opportunistic phishing.","The fake tax-filing utility closely mirrors a legitimate offline utility from India’s Income Tax Department, making the lure especially credible during the annual tax filing season.","The malware hides a secondary payload inside a JPG image and extracts it after download, showing that image files retrieved from suspicious infrastructure can be part of the infection chain rather than harmless content.","Attribution remains uncertain, but the combination of ChinaNet IP addresses, a Chinese-language DCRat management panel, and overlaps with Silver Fox gives the campaign multiple links to China-aligned activity.","The article connects several recent RAT campaigns through shared themes such as fake installers, DLL sideloading, and anti-analysis behavior, indicating that similar delivery methods are being reused across different language and regional targets."],"referencedReports":[{"title":"Operation DragonReturn: China-Nexus Cyber Espionage Campaign Targeting Govt. of India MoF Tax Infrastructure via Multi-Stage DCRat Deployment","url":"https://www.seqrite.com/blog/operation-dragonreturn-china-nexus-cyber-espionage-campaign-targeting-govt-of-india-mof-tax-infrastructure-via-multi-stage-dcrat-deployment/","publisher":"Seqrite Labs","context":"The article cites Seqrite Labs' analysis as the source for Operation DragonReturn, including the targeting, infection chain, payload behavior, and attribution overlaps.","category":"","primary":false},{"title":"An Analysis of ValleyRAT Infection Campaigns From Fake Installers \u0026 Japanese Malicious Emails","url":"https://www.levelblue.com/blogs/spiderlabs-blog/an-analysis-of-valleyrat-infection-campaigns-from-fake-installers-japanese-malicious-emails","publisher":"LevelBlue","context":"The article references LevelBlue's analysis of two ValleyRAT campaigns using fake installers and salary-themed phishing emails against Chinese- and Japanese-speaking users.","category":"","primary":false},{"title":"Fake Installer ValleyRAT","url":"https://www.cybereason.com/blog/fake-installer-valleyrat","publisher":"Cybereason","context":"The article cites Cybereason's February 2026 analysis describing fake installer ValleyRAT activity, including PoolParty Variant 7 and possible commonalities with other activity.","category":"","primary":false},{"title":"Under the SADBRIDGE with GOSAR","url":"https://www.elastic.co/security-labs/under-the-sadbridge-with-gosar","publisher":"Elastic Security Labs","context":"The article references Elastic Security Labs' analysis of SADBRIDGE and GOSAR activity attributed to REF3864.","category":"","primary":false}],"body":"\u003cp\u003eA suspected China-nexus threat activity cluster has been observed targeting Indian taxpayers, tax professionals, and corporate finance teams with a remote access trojan designed to steal sensitive data. Seqrite Labs codenamed the campaign Operation DragonReturn and said it was first observed on May 18, 2026, during India’s annual income tax filing season. The campaign uses spear-phishing emails impersonating the Income Tax Department of India and lures recipients with tax violations and penalty themes.\u003c/p\u003e\n\n\u003cp\u003eThe attack leads victims to a bogus landing page that instructs them to download a ZIP archive posing as an official offline tax-filing utility. The archive is engineered to sideload a malicious DLL named nvdaHelperRemote.dll, which injects another payload into memory, retrieves a JPG file from a hard-coded server, and extracts a secondary DLL from it. The malware copies itself as Mixed Reality.exe, creates a Windows service named MixedSvc for persistence, disables Windows AMSI scanning, and decrypts and loads DCRat.\u003c/p\u003e\n\n\u003cp\u003eSeqrite Labs assessed that the campaign’s goal is financial gain or sensitive data theft, and said the malware also includes a payload capable of taking screenshots and exfiltrating data to a remote server. The actor behind the activity remains unclear, but the article cites ChinaNet IP addresses, a Chinese-language DCRat management panel, and overlaps with Silver Fox as indicators of a China-aligned operation. The article also notes separate LevelBlue reporting on ValleyRAT campaigns using fake installers and salary-themed phishing emails targeting Chinese- and Japanese-speaking users.\u003c/p\u003e\n"},{"n":7,"title":"Cavern Manticore: Exposing Iran-Linked Modular C2 Framework","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","time":"12:25","priority":"MUST READ","score":92,"tldr":"Check Point Research details Cavern Manticore, an Iran-linked threat actor targeting Israeli government and IT organizations with a modular .NET C2 framework that abuses RMM tools and DLL sideloading for initial access. The framework’s unusual mix of .NET Framework, C++/CLI, and NativeAOT modules enables stealthy post-exploitation capabilities such as file, database, LDAP, network reconnaissance, credential testing, and tunneling while complicating analysis and detection.","briefOverview":"\u003cp\u003eCheck Point Research tracks Cavern Manticore as an Iran-nexus threat actor operating against Israeli targets, especially in the government and IT sectors. The report describes a modular command-and-control framework called Cavern that is built on .NET and used for post-exploitation activity. In multiple observed intrusions, the initial foothold was achieved through abuse of existing Remote Monitoring and Management software deployed in the targeted organization.\u003c/p\u003e\n\n\u003cp\u003eThe recovered execution chain begins with abuse of SysAid’s software update feature to deploy a WinDirStat DLL sideloading package to \u003ccode\u003eC:\\ProgramData\\WinDir\\WinDirStat.exe\u003c/code\u003e. The legitimate WinDirStat executable loads a trojanized \u003ccode\u003euxtheme.dll\u003c/code\u003e, which acts as the Cavern Agent, and the agent loads \u003ccode\u003en-HTCommp.dll\u003c/code\u003e to communicate with command-and-control infrastructure. The framework includes modules for file system access, SQL database browsing, LDAP and Active Directory reconnaissance, network reconnaissance, SMB credential brute-forcing, and SOCKS5/WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eA notable feature of Cavern is its use of three different .NET compilation formats: .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT. The article says this compilation strategy functions as an anti-analysis layer because different components require different reverse-engineering workflows, and NativeAOT hides useful strings and runtime-resolved API usage from simple static triage. The report also highlights supply-chain risk, noting that compromised IT providers were sometimes used as stepping stones toward higher-value targets through trusted service-provider relationships.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research tracks Cavern Manticore as an Iran-nexus threat actor targeting Israeli organizations, especially in the government and IT sectors.","Cavern Manticore used a modular .NET command-and-control framework with components compiled as .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT binaries.","The observed execution chain abused SysAid’s software update feature to deploy a WinDirStat DLL sideloading package in which a trojanized uxtheme.dll acted as the Cavern Agent.","The framework’s modules provide post-exploitation capabilities including file system browsing, database enumeration and querying, LDAP and Active Directory reconnaissance, network reconnaissance, SMB credential brute-forcing, and SOCKS5/WebSocket tunneling.","The article reports that in multiple observed intrusions, the initial foothold was achieved through abuse of existing Remote Monitoring and Management software deployed in the targeted organization."],"insights":["Cavern’s anti-analysis strategy relies less on traditional obfuscation and more on mixing .NET Framework, Mixed-Mode C++/CLI, and NativeAOT formats, forcing analysts to use different reverse-engineering workflows for different components.","The Cavern Agent hides its real behavior behind the uxtheme.dll export EnableThemeDialogTexture at ordinal 20, while most other exports are inert stubs that can mislead automated sandbox analysis.","The agent loads managed modules inside separate AppDomains and unloads them after execution, which lets it remove loaded module artifacts from memory without ending the host process.","The communication module’s fixed Microsoft Edge User-Agent and custom X-User-token header provide stable network detection opportunities despite its XOR and Base64 traffic encoding.","The article highlights that trusted IT providers and existing RMM software were operationally important to the intrusions, because attackers used them as pathways toward higher-value Israeli targets rather than only as final victims."],"referencedReports":[{"title":"Recovering Metadata from .NET Native AOT Binaries","url":"https://blog.washi.dev/posts/recovering-nativeaot-metadata/","publisher":"Washi","context":"The article cites this write-up while describing tooling used to reconstruct metadata from NativeAOT samples.","category":"","primary":false},{"title":"OilRig’s Outer Space and Juicy Mix: Same ol’ rig, new drill pipes","url":"https://www.welivesecurity.com/en/eset-research/oilrigs-outer-space-juicy-mix-same-ol-rig-new-drill-pipes/","publisher":"ESET Research","context":"The article references this ESET research when discussing links between Cavern Manticore and the OilRig subgroup Lyceum.","category":"","primary":false},{"title":"Mercury leveraging Log4j 2 vulnerabilities in unpatched systems to target Israeli organizations","url":"https://www.microsoft.com/en-us/security/blog/2022/08/25/mercury-leveraging-log4j-2-vulnerabilities-in-unpatched-systems-to-target-israeli-organizations/?msockid=0813a307e19b696c19cab43ee0c768c2","publisher":"Microsoft","context":"The article cites this Microsoft analysis as prior activity involving SysAid servers and Iranian MOIS-aligned actors, including MuddyWater.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Research tracks Cavern Manticore as an Iran-nexus threat actor operating against Israeli targets, especially in the government and IT sectors. The report describes a modular command-and-control framework called Cavern that is built on .NET and used for post-exploitation activity. In multiple observed intrusions, the initial foothold was achieved through abuse of existing Remote Monitoring and Management software deployed in the targeted organization.\u003c/p\u003e\n\n\u003cp\u003eThe recovered execution chain begins with abuse of SysAid’s software update feature to deploy a WinDirStat DLL sideloading package to \u003ccode\u003eC:\\ProgramData\\WinDir\\WinDirStat.exe\u003c/code\u003e. The legitimate WinDirStat executable loads a trojanized \u003ccode\u003euxtheme.dll\u003c/code\u003e, which acts as the Cavern Agent, and the agent loads \u003ccode\u003en-HTCommp.dll\u003c/code\u003e to communicate with command-and-control infrastructure. The framework includes modules for file system access, SQL database browsing, LDAP and Active Directory reconnaissance, network reconnaissance, SMB credential brute-forcing, and SOCKS5/WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eA notable feature of Cavern is its use of three different .NET compilation formats: .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT. The article says this compilation strategy functions as an anti-analysis layer because different components require different reverse-engineering workflows, and NativeAOT hides useful strings and runtime-resolved API usage from simple static triage. The report also highlights supply-chain risk, noting that compromised IT providers were sometimes used as stepping stones toward higher-value targets through trusted service-provider relationships.\u003c/p\u003e\n"},{"n":2,"title":"Ukrainian media outlets now among 'priority targets' for Russian hackers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-media-organizations-priority-hacking-targets-russia","time":"13:20","priority":"SHOULD READ","score":78,"tldr":"Ukraine’s SBU warned that media outlets have become priority targets for Russian hackers, citing recent DDoS and phishing attempts against major TV broadcasters. Ukrainian media are also facing continued physical damage from Russian missile and drone strikes.","briefOverview":"\u003cp\u003eUkraine\u0026rsquo;s domestic security agency, the SBU, said media organizations have become one of the priority targets for Russian hackers. Volodymyr Karastelyov, head of the SBU\u0026rsquo;s cyber department, disclosed two previously unreported cyberattacks targeting Ukrainian television broadcasters, without attributing them to specific Russian entities. Previous attacks have sought to disrupt broadcasts, spread propaganda, and undermine public trust.\u003c/p\u003e\n\n\u003cp\u003eIn one incident earlier this year, Russian hackers launched a three-hour distributed denial-of-service attack against an unnamed nationwide television channel, generating up to 200,000 requests per minute from a botnet of compromised devices before it was repelled. In another incident last year, attackers targeted one of Ukraine\u0026rsquo;s leading television groups with phishing and access attempts through connected infrastructure in an effort to seize control of its platform and publish propaganda disguised as Ukrainian media content. The SBU said it has neutralized more than 16,000 cyberattacks and cyber incidents against Ukrainian government agencies, financial institutions, defense organizations, and media outlets since Russia\u0026rsquo;s full-scale invasion.\u003c/p\u003e\n\n\u003cp\u003eUkraine\u0026rsquo;s SSSCIP said in a report last year that Russian hackers had carried out more than 200 successful cyberattacks against Ukrainian media organizations since the start of the invasion, using tactics including phishing, DDoS attacks, website defacements, destructive malware, and unauthorized publication of disinformation. Ukrainian media organizations have also sustained physical damage from Russian missile and drone strikes. The National Union of Journalists of Ukraine documented 80 incidents in the first half of this year involving damage to media infrastructure or impacts on journalists, and Channel 5\u0026rsquo;s office was damaged this week during an overnight Russian strike involving 68 missiles and nearly 400 drones.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine's SBU said media organizations have become one of the priority targets for Russian hackers.","Volodymyr Karastelyov, head of the SBU's cyber department, disclosed two previously unreported cyberattacks targeting Ukrainian television broadcasters, including a DDoS attack on a nationwide channel and a phishing campaign against a leading television group.","The SBU said it has neutralized more than 16,000 cyberattacks and cyber incidents targeting Ukrainian government agencies, financial institutions, defense organizations, and media outlets since Russia's full-scale invasion.","Ukraine's SSSCIP reported last year that Russian hackers had carried out more than 200 successful cyberattacks against Ukrainian media organizations since the start of the invasion.","The National Union of Journalists of Ukraine documented 80 incidents in the first half of this year in which Russian attacks damaged media infrastructure or affected journalists carrying out their work."],"insights":["Russian operations against Ukrainian media are not limited to taking outlets offline; at least one attempted intrusion sought to publish propaganda through a compromised Ukrainian broadcaster, making trusted media platforms part of the target.","The reported attacks show Ukrainian broadcasters face simultaneous pressure through multiple paths, including phishing against internal systems and access attempts through connected infrastructure.","The three-hour DDoS incident reached up to 200,000 requests per minute but was repelled, indicating that even large-scale disruption attempts against nationwide Ukrainian media can be contained.","The article shows that Ukrainian media resilience now involves both digital and physical risks, as the same sector is being targeted by cyber operations and by missile and drone strikes that damage studios, equipment, and newsrooms."],"referencedReports":[{"title":"SSSCIP report on Russian cyberattacks against Ukrainian media organizations","url":"https://therecord.media/ukraine-media-cyberattacks-russia-ssscip-report","publisher":"Ukraine's State Service of Special Communications and Information Protection","context":"The article cites an SSSCIP report from last year stating that Russian hackers carried out more than 200 successful cyberattacks against Ukrainian media organizations since the start of the invasion.","category":"","primary":false}],"body":"\u003cp\u003eUkraine\u0026rsquo;s domestic security agency, the SBU, said media organizations have become one of the priority targets for Russian hackers. Volodymyr Karastelyov, head of the SBU\u0026rsquo;s cyber department, disclosed two previously unreported cyberattacks targeting Ukrainian television broadcasters, without attributing them to specific Russian entities. Previous attacks have sought to disrupt broadcasts, spread propaganda, and undermine public trust.\u003c/p\u003e\n\n\u003cp\u003eIn one incident earlier this year, Russian hackers launched a three-hour distributed denial-of-service attack against an unnamed nationwide television channel, generating up to 200,000 requests per minute from a botnet of compromised devices before it was repelled. In another incident last year, attackers targeted one of Ukraine\u0026rsquo;s leading television groups with phishing and access attempts through connected infrastructure in an effort to seize control of its platform and publish propaganda disguised as Ukrainian media content. The SBU said it has neutralized more than 16,000 cyberattacks and cyber incidents against Ukrainian government agencies, financial institutions, defense organizations, and media outlets since Russia\u0026rsquo;s full-scale invasion.\u003c/p\u003e\n\n\u003cp\u003eUkraine\u0026rsquo;s SSSCIP said in a report last year that Russian hackers had carried out more than 200 successful cyberattacks against Ukrainian media organizations since the start of the invasion, using tactics including phishing, DDoS attacks, website defacements, destructive malware, and unauthorized publication of disinformation. Ukrainian media organizations have also sustained physical damage from Russian missile and drone strikes. The National Union of Journalists of Ukraine documented 80 incidents in the first half of this year involving damage to media infrastructure or impacts on journalists, and Channel 5\u0026rsquo;s office was damaged this week during an overnight Russian strike involving 68 missiles and nearly 400 drones.\u003c/p\u003e\n"},{"n":6,"title":"A Phishing Link Wearing Two Security Vendors' Badges: Inside a Benefits-Enrollment Credential Lure","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/regions-benefits-lure-egress-barracuda-redirect-laundering","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email impersonating Regions Bank used clean Amazon SES authentication and hid its credential-harvesting destination behind nested Egress Defend and Barracuda link-protection wrappers. The key takeaway is that trusted security-vendor rewrite domains can launder malicious links, so defenses must decode redirect chains and assess message context rather than relying on visible URL reputation or SPF/DKIM/DMARC alone.","briefOverview":"\u003cp\u003eA phishing email targeted a finance team at a hospitality organization with a same-day “Benefits Enrollment Deadline” lure using Regions Bank branding. The Chief Financial Officer reported the message after noticing an unfamiliar sender, and four mailboxes in the department received it. The article says the email mixed a bank-branded benefits message with a footer claiming it came from the recipient organization’s own domain, creating a mismatch no legitimate sender would produce.\u003c/p\u003e\n\n\u003cp\u003eThe message authenticated cleanly through Amazon SES using the unrelated Saudi-registered domain hatmi.sa. SPF passed, DKIM passed for both hatmi.sa and amazonses.com, and DMARC passed aligned to hatmi.sa, while Microsoft’s composite authentication scored it 100 and the spam confidence level was -1. The article emphasizes that these checks prove authorization by the sending domain, but not the legitimacy of the brand shown in the email body or the truthfulness of the message.\u003c/p\u003e\n\n\u003cp\u003eThe main link, labeled “Complete Enrollment,” hid its destination behind two trusted link-protection wrappers: Egress Defend and Barracuda Link Protection. Inside the nested redirect chain, a Base64Url-encoded payload exposed the target domain aemf.org, which was unrelated to Regions Bank. The article concludes that visible URL reputation checks can be defeated by trusted-rewrite laundering, and that detection must unwrap redirects, evaluate the real destination, and consider message context such as brand mismatch, first-time sender, and urgent deadline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email used Regions Bank branding to present a same-day benefits-enrollment deadline to a finance team at a hospitality organization.","The email authenticated successfully through Amazon SES using the unrelated Saudi-registered domain hatmi.sa, with SPF, DKIM, and DMARC all passing.","The Complete Enrollment button pointed first to an Egress Defend rewrite URL, which contained a Barracuda Link Protection URL, which in turn contained an encoded target domain of aemf.org.","The article states that visible URL reputation checks can be bypassed when a malicious destination is hidden behind trusted security-vendor link wrappers.","The reporting user flagged the suspicious email, four mailboxes were quarantined, and the laundered link did not receive a click."],"insights":["SPF, DKIM, and DMARC passing for hatmi.sa only proved that the message was authorized by that unrelated sending domain, not that the Regions Bank branding or benefits-enrollment pretext was legitimate.","The suspicious mismatch between a bank-branded message and a footer claiming to be from the recipient organization provided a strong contextual warning even though the email’s authentication and spam scores looked trusted.","The article highlights that link scanning must decode nested redirect parameters and Base64Url payloads, because evaluating only the first visible domain can miss the destination hidden deeper in the chain.","The legitimate Regions links in the rest of the email functioned as visual decoration that helped the message appear complete while the only consequential link was the Complete Enrollment button."],"referencedReports":[{"title":"Verizon 2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for statistics on the human element in breaches, credential involvement, and phishing as an initial-access method.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article cites it as documenting adversaries abusing legitimate cloud and security services to evade reputation filtering.","category":"","primary":false},{"title":"FBI IC3 2024 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites it for phishing being the most-reported crime type by volume.","category":"","primary":false},{"title":"IBM Cost of a Data Breach 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article cites it for phishing being among the costliest initial vectors.","category":"","primary":false},{"title":"CISA phishing guidance","url":"https://www.cisa.gov/secure-our-world/recognize-and-report-phishing","publisher":"CISA","context":"The article cites it for guidance to report messages that do not look right.","category":"","primary":false}],"body":"\u003cp\u003eA phishing email targeted a finance team at a hospitality organization with a same-day “Benefits Enrollment Deadline” lure using Regions Bank branding. The Chief Financial Officer reported the message after noticing an unfamiliar sender, and four mailboxes in the department received it. The article says the email mixed a bank-branded benefits message with a footer claiming it came from the recipient organization’s own domain, creating a mismatch no legitimate sender would produce.\u003c/p\u003e\n\n\u003cp\u003eThe message authenticated cleanly through Amazon SES using the unrelated Saudi-registered domain hatmi.sa. SPF passed, DKIM passed for both hatmi.sa and amazonses.com, and DMARC passed aligned to hatmi.sa, while Microsoft’s composite authentication scored it 100 and the spam confidence level was -1. The article emphasizes that these checks prove authorization by the sending domain, but not the legitimacy of the brand shown in the email body or the truthfulness of the message.\u003c/p\u003e\n\n\u003cp\u003eThe main link, labeled “Complete Enrollment,” hid its destination behind two trusted link-protection wrappers: Egress Defend and Barracuda Link Protection. Inside the nested redirect chain, a Base64Url-encoded payload exposed the target domain aemf.org, which was unrelated to Regions Bank. The article concludes that visible URL reputation checks can be defeated by trusted-rewrite laundering, and that detection must unwrap redirects, evaluate the real destination, and consider message context such as brand mismatch, first-time sender, and urgent deadline.\u003c/p\u003e\n"},{"n":4,"title":"How to Evaluate an AI SOC Platform in 2026: 6 Capabilities That Separate Leaders from Bolt-On AI solutions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/how-to-evaluate-ai-soc-platform-in-2026.html","time":"11:30","priority":"MAY READ","score":45,"tldr":"The article argues that buyers evaluating AI SOC platforms should look past marketing claims and test whether agents can perform detection, triage, investigation, and response using real-time correlated security context with auditable outcomes. It promotes Exaforce as an example of this agentic SOC approach.","briefOverview":"\u003cp\u003eThe article explains how security teams should evaluate AI SOC platforms in 2026, arguing that products using the same label can differ widely. It distinguishes platforms where AI agents perform detection, triage, investigation, and response from bolt-on AI tools that mainly summarize alerts inside an existing SIEM. The article says the important measures are investigation time, false-positive volume, analyst hours returned, SOC operating cost, and whether the architecture can handle increasing attack volume, speed, and complexity.\u003c/p\u003e\n\n\u003cp\u003eA central technical point is that predictable AI SOC agents depend on a real-time, correlated data foundation rather than just a model or a fast query engine. The article says trustworthy agents need context such as identities, resources, device or asset data, configuration drift, behavioral baselines, and relationships between them before an alert fires. It recommends testing six capabilities during evaluation: correlated data, full-lifecycle agents, auditable verdicts, detection coverage beyond the SIEM, staged autonomy with human oversight, and measurable outcomes.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Exaforce as an example of an agentic AI SOC platform built around these capabilities. It describes four Exabots for detection, triage, investigation, and response, all using a unified real-time data platform across cloud, SaaS, identity, endpoint, and code. It cites customer examples including Guardant Health using Exaforce as its primary SIEM and MDR, Invisible cutting investigation time by 95%, and Forcepoint reaching a 14-minute mean time to respond on P0 incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article defines an AI SOC platform as a security operations platform where AI agents carry out detection, triage, investigation, and response by reasoning over correlated security data under human oversight.","The article says buyers should test whether a platform has a real-time, correlated data foundation that connects identity, configuration, resource, and behavioral baseline data before alerts occur.","The article recommends evaluating whether agents can handle the full incident lifecycle, preserve context across detection, triage, investigation, and response, and provide evidence-backed verdicts that analysts can audit.","The article argues that strong AI SOC platforms should cover data sources beyond the SIEM, support staged autonomy with human approval for sensitive actions, and produce measurable improvements such as lower false-positive rates and faster investigation and response times.","The article presents Exaforce as an example of an agentic AI SOC platform, describing its Exabots for detection, triage, investigation, and response and citing customer outcomes such as reduced investigation time and a 14-minute mean time to respond for P0 incidents."],"insights":["During a proof of concept, the article suggests testing a vendor by choosing a random identity and asking the platform to show its permissions, configuration drift, and behavioral baseline, because the article says this context cannot be faked at query time.","The article warns that fast search results are not enough to prove an AI SOC platform is reliable, because a fast query engine can still lack continuously correlated identity, configuration, resource, and baseline context.","The article treats immediate full autonomy as a warning sign, saying trustworthy platforms should begin with recommendations, build evidence records, and require human approval for irreversible actions.","The article highlights that detection coverage should be tested on sources that often never reach a SIEM because ingesting them is too expensive, such as high-volume cloud audit logs, GitHub, and Google Workspace.","The article says predictability in AI SOC agents depends more on the data foundation than on the AI model itself, because agents need prebuilt, real-time context to produce verdicts that can be reproduced and audited."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how security teams should evaluate AI SOC platforms in 2026, arguing that products using the same label can differ widely. It distinguishes platforms where AI agents perform detection, triage, investigation, and response from bolt-on AI tools that mainly summarize alerts inside an existing SIEM. The article says the important measures are investigation time, false-positive volume, analyst hours returned, SOC operating cost, and whether the architecture can handle increasing attack volume, speed, and complexity.\u003c/p\u003e\n\n\u003cp\u003eA central technical point is that predictable AI SOC agents depend on a real-time, correlated data foundation rather than just a model or a fast query engine. The article says trustworthy agents need context such as identities, resources, device or asset data, configuration drift, behavioral baselines, and relationships between them before an alert fires. It recommends testing six capabilities during evaluation: correlated data, full-lifecycle agents, auditable verdicts, detection coverage beyond the SIEM, staged autonomy with human oversight, and measurable outcomes.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Exaforce as an example of an agentic AI SOC platform built around these capabilities. It describes four Exabots for detection, triage, investigation, and response, all using a unified real-time data platform across cloud, SaaS, identity, endpoint, and code. It cites customer examples including Guardant Health using Exaforce as its primary SIEM and MDR, Invisible cutting investigation time by 95%, and Forcepoint reaching a 14-minute mean time to respond on P0 incidents.\u003c/p\u003e\n"},{"n":11,"title":"Use Case Deep Dive: Your EDR Fired on an IP. Here’s How to Know if it’s Part of Something Bigger.","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/webinar/use-case-deep-dive-your-edr-fired-on-an-ip-heres-how-to-know-if-its-part-of-something-bigger/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=use-case-deep-dive-your-edr-fired-on-an-ip-heres-how-to-know-if-its-part-of-something-bigger","time":"13:59","priority":"MAY READ","score":45,"tldr":"When an EDR alert flags an IP address, analysts should enrich and correlate it with related infrastructure, indicators, and historical activity to determine whether it is an isolated event or part of a broader threat campaign.","briefOverview":"\u003cp\u003eThe article is titled “Use Case Deep Dive: Your EDR Fired on an IP. Here’s How to Know if it’s Part of Something Bigger.” It presents a security investigation scenario centered on an EDR alert involving an IP address. The core focus is determining whether that single alert is isolated or connected to broader activity.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the article is that it treats an IP-based EDR alert as a possible starting point for a larger investigation. The title indicates that the article is structured as a use case deep dive rather than a general news report. The key technical detail explicitly present is the use of EDR telemetry or alerting around an IP address to decide whether there is a wider issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is presented as a use case deep dive.","The article focuses on a situation where an EDR alert fires on an IP address.","The article discusses how to determine whether the flagged IP address is part of something larger."],"insights":["The article frames an EDR alert on a single IP address as a starting point for investigation rather than a complete conclusion.","The title signals a practical use-case approach focused on deciding whether one alert connects to broader activity."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Use Case Deep Dive: Your EDR Fired on an IP. Here’s How to Know if it’s Part of Something Bigger.” It presents a security investigation scenario centered on an EDR alert involving an IP address. The core focus is determining whether that single alert is isolated or connected to broader activity.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the article is that it treats an IP-based EDR alert as a possible starting point for a larger investigation. The title indicates that the article is structured as a use case deep dive rather than a general news report. The key technical detail explicitly present is the use of EDR telemetry or alerting around an IP address to decide whether there is a wider issue.\u003c/p\u003e\n"},{"n":5,"title":"⚡ Weekly Recap: Proxy Botnets, Browser Ransomware, AI Agent Tricks, Fake PoC Malware and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/monday-recap-proxy-botnets-browser.html","time":"13:01","priority":"MAY READ","score":40,"tldr":"This week’s major cyber stories show attackers abusing ordinary trusted surfaces—home devices, software dependencies, browser APIs, identity flows, and AI agent instructions—to hide, steal credentials, or gain control. The core lesson is to treat familiar tools and “boring” infrastructure as active attack surfaces, not safe defaults.","briefOverview":"\u003cp\u003eThis weekly recap covers a broad set of cyber incidents and research, with the main theme that ordinary trusted systems are being abused in unexpected ways. Google, working with the FBI, Lumen, and other partners, disrupted the NetNut residential proxy network, also known as Popa, which was estimated to include at least 2 million devices globally. Google said NetNut used SDKs on home devices such as smart TVs and streaming boxes, including components tied to BADBOX 2.0, to route traffic through residential devices and mask malicious activity.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks and risks involving fake proof-of-concept code, messaging identities, browser features, banking malware, and AI systems. Security researchers were targeted by fake GitHub PoC repositories that looked clean but pulled a malicious dependency named skytext to deliver the ChocoPoC trojan, while WhatsApp’s username rollout raised impersonation concerns in India. Check Point reported an AI-generated browser ransomware technique that abuses Chromium’s File System Access API, though the article states there is no evidence it has been used in the wild.\u003c/p\u003e\n\n\u003cp\u003eOther covered developments include indirect prompt injection against AI agents, Dropping Elephant’s in-memory RAT campaign, Microsoft Entra self-service password reset changes, scam ads impersonating trusted brands, and multiple phishing-as-a-service kits. The recap also lists many trending CVEs across products including Adobe ColdFusion, Cursor, Linux Kernel, Google Chrome, Langflow, WinRAR, Apache Tomcat, Webmin, QNAP products, phpBB, and Gitea. The conclusion emphasizes that the week’s problems often came from trusted devices, repositories, reset paths, browser features, and other seemingly routine parts of technology.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google, working with the FBI, Lumen, and other partners, disrupted the NetNut residential proxy network, which was estimated to include at least 2 million devices globally and used smart TVs, streaming boxes, and apps with hidden proxy code to route malicious traffic.","Security researchers were targeted by fake Python proof-of-concept repositories on GitHub that appeared clean but pulled a malicious dependency named skytext, which delivered the ChocoPoC trojan.","WhatsApp began global reservations of usernames to let users connect without sharing phone numbers, but the rollout raised impersonation concerns in India involving public authorities, financial institutions, government departments, and prominent figures.","Check Point reported an AI-generated browser ransomware technique that abuses Chromium’s picker-based File System Access API, though the article states there is no evidence this pattern has been abused in the wild.","The article lists many active security issues and campaigns, including indirect prompt injection against AI agents, blockchain-based command lookups in ClickFix and TONResolver campaigns, Laravel Livewire credential theft affecting more than 6,100 applications, and multiple phishing-as-a-service kits targeting Microsoft 365, AWS, and other logins."],"insights":["Several incidents share the same pattern: attackers are hiding inside trusted layers such as device SDKs, clean-looking dependencies, browser permission prompts, directory contact fields, and legitimate OAuth flows rather than relying only on obviously malicious files.","The ChocoPoC campaign shows that reviewing only the visible proof-of-concept code is insufficient, because the article says the malicious payload was placed in a dependency while the PoC itself looked clean.","Microsoft’s SSPR change highlights that identity recovery data can be dangerous when it comes from directory attributes that users never explicitly registered or verified as password-reset methods.","The ClickFix and TONResolver campaigns show attackers using public blockchains as resilient lookup points for command-and-control information, making the malicious infrastructure harder to disrupt than a single fixed server.","The article’s CVE data suggests patch prioritization based only on scheduled remediation cycles is increasingly mismatched with the pace of exploitation, because ProjectDiscovery reported that exploit timelines can be measured in days or even be negative."],"referencedReports":[{"title":"Indirect Prompt Injection Web Content Targets AI Agents","url":"https://www.zscaler.com/blogs/security-research/indirect-prompt-injection-web-content-targets-ai-agents","publisher":"Zscaler","context":"The article cites Zscaler research on campaigns using hidden website instructions, SEO poisoning, and CSS/HTML abuse to influence AI agents.","category":"","primary":false},{"title":"Malware Tracking: Dropping Elephant Tradecraft China-Themed Loader Chain","url":"https://www.rapid7.com/blog/post/tr-malware-tracking-dropping-elephant-tradecraft-china-themed-loader-chain/","publisher":"Rapid7","context":"The article references Rapid7 analysis of Dropping Elephant using DLL side-loading, Donut shellcode, and an in-memory RAT.","category":"","primary":false},{"title":"Microsoft Entra self-service password reset authentication methods change","url":"https://mc.merill.net/message/MC1325414","publisher":"Microsoft","context":"The article cites a Microsoft notice that Entra self-service password reset will require explicitly registered authentication methods.","category":"","primary":false},{"title":"Microsoft Authenticator jailbreak and root detection for Entra credentials","url":"https://mc.merill.net/message/MC1179154","publisher":"Microsoft","context":"The article references a Microsoft notice about jailbreak and root detection for Entra credentials in Microsoft Authenticator.","category":"","primary":false},{"title":"Branded Gambling Campaigns: How Scammers Are Exploiting Trusted Brands","url":"https://www.netcraft.com/blog/branded-gambling-campaigns-how-scammers-are-exploiting-trusted-brands","publisher":"Netcraft","context":"The article cites Netcraft research on scam ads impersonating trusted brands to drive users to online gambling sites.","category":"","primary":false},{"title":"PhishLumos","url":"https://ieeexplore.ieee.org/document/11534625","publisher":"Tokyo Metropolitan University and NTT Security Holdings","context":"The article references research describing PhishLumos as a way to counter cloaking-based phishing campaigns using infrastructure evidence and graph-based analysis.","category":"","primary":false},{"title":"The Vulnerability Curve Bent with the AI Curve","url":"https://projectdiscovery.io/blog/the-vulnerability-curve-bent-with-the-ai-curve#what-this-actually-means","publisher":"ProjectDiscovery","context":"The article cites a ProjectDiscovery report about the growth of CVE publication and shrinking exploit timelines in the AI era.","category":"","primary":false},{"title":"ClickFix campaign utilizing MaaS kit with Blockchain C2","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-07-02-ClickFix-campaign-utilizing-MaaS-kit-with-Blockchain-C2.txt","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42 threat intelligence on a ClickFix campaign using the Polygon blockchain for command-and-control configuration.","category":"","primary":false},{"title":"Bypassing Microsoft Entra Conditional Access Policies via Nested App Authentication","url":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/bypassing-microsoft-entra-conditional-access-policies-via-nested-app-authentication/","publisher":"NetSPI","context":"The article cites NetSPI technical analysis of a way to bypass Microsoft Entra Conditional Access Policies using Nested App Authentication flows.","category":"","primary":false},{"title":"CVE-2025-54068 Laravel Livewire credential theft campaign","url":"https://www.imperva.com/blog/cve-2025-54068-laravel-livewire-credential-theft-campaign-6000-applications-compromised/","publisher":"Imperva","context":"The article references Imperva research on a Laravel Livewire credential theft campaign affecting more than 6,100 applications.","category":"","primary":false},{"title":"TONResolver","url":"https://www.trendmicro.com/en_us/research/26/f/tonresolver.html","publisher":"Trend Micro","context":"The article cites Trend Micro analysis of a campaign targeting Booking.com partner companies and abusing the TON blockchain as a resolver.","category":"","primary":false},{"title":"Dissecting Android Malware Post 1: Mamont Banking Trojan","url":"https://www.nccgroup.com/research/dissecting-android-malware-post-1-mamont-banking-trojan/","publisher":"NCC Group","context":"The article references NCC Group research on Mamont Android malware distributed through dropper apps disguised as dating services.","category":"","primary":false},{"title":"Dissecting Android Malware Post 2: Mamont Variant Advanced Dropper Logic and Encrypted Payload","url":"https://www.nccgroup.com/research/dissecting-android-malware-post-2-mamont-variant-advanced-dropper-logic-and-encrypted-payload/","publisher":"NCC Group","context":"The article cites further NCC Group analysis of a Mamont variant with phishing overlays, command execution, and device information collection.","category":"","primary":false},{"title":"AsyncRAT Reloaded: Python TryCloudflare Malware","url":"https://www.forcepoint.com/blog/x-labs/asyncrat-reloaded-python-trycloudflare-malware","publisher":"Forcepoint","context":"The article references Forcepoint research on a phishing chain using Dropbox, URL files, scripts, and Python to deliver AsyncRAT.","category":"","primary":false},{"title":"AsyncRAT and Remcos Delivered in Multi-Stage Phishing Campaign","url":"https://www.levelblue.com/blogs/spiderlabs-blog/asyncrat-and-remcos-delivered-in-multi-stage-phishing-campaign","publisher":"LevelBlue","context":"The article cites LevelBlue research on phishing emails with malicious spreadsheets that deliver AsyncRAT or Remcos RAT.","category":"","primary":false},{"title":"Clubfoot Wolf mass-compromises Russian companies","url":"https://bi.zone/expertise/blog/clubfoot-wolf-massovo-komprometiruet-rossiyskie-kompanii/","publisher":"BI.ZONE","context":"The article references BI.ZONE research on Clubfoot Wolf spear-phishing attacks against Russian sectors using NetSupport RAT.","category":"","primary":false},{"title":"Fluffy Wolf tested novelties on Russian companies","url":"https://bi.zone/eng/expertise/blog/fluffy-wolf-ispytal-novinki-na-rossiyskikh-kompaniyakh/","publisher":"BI.ZONE","context":"The article cites BI.ZONE research on Fluffy Wolf using email attachments and GitHub links to deliver PureLogs Stealer, PureRAT, and Pay2Key ransomware.","category":"","primary":false},{"title":"CodeStorm PhishKit Tenant-Aware M365 Replay","url":"https://zerobec.com/blog/codestorm-phishkit-tenant-aware-m365-replay","publisher":"Zerobec","context":"The article references Zerobec research identifying CodeStorm as a tenant-aware Microsoft 365 phishing kit.","category":"","primary":false},{"title":"ARToken: Inside an EvilTokens affiliate panel targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article cites Cisco Talos research on ARToken, a phishing-as-a-service operator panel targeting Microsoft 365.","category":"","primary":false},{"title":"Behind the Console: AWS AiTM phishing kit and beyond","url":"https://securitylabs.datadoghq.com/articles/behind-the-console-aws-aitm-phishing-kit-and-beyond/","publisher":"Datadog Security Labs","context":"The article references Datadog Security Labs analysis of Console, a phishing kit for harvesting AWS console credentials.","category":"","primary":false},{"title":"Mirage2FA obfuscated HTML loader delivers Microsoft 365 MFA phishing kit","url":"https://www.fortra.com/blog/mirage2fa-obfuscated-html-loader-delivers-microsoft-365-mfa-phishing-kit","publisher":"Fortra","context":"The article cites Fortra research on Mirage2FA using short-lived HTML smuggling and obfuscated JavaScript loaders for Microsoft 365 phishing pages.","category":"","primary":false},{"title":"Bluekit phishing-as-a-service threat","url":"https://www.netcraft.com/blog/bluekit-phishing-as-a-service-threat","publisher":"Netcraft","context":"The article references Netcraft research on Bluekit using a browser-in-the-middle technique to capture logins.","category":"","primary":false},{"title":"Tycoon 2FA AiTM Detection Engineering","url":"https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering","publisher":"Elastic Security Labs","context":"The article cites Elastic research about Tycoon 2FA phishing-as-a-service resurfacing with new infrastructure and obfuscation.","category":"","primary":false},{"title":"Tycoon2FA post-takedown rebuild","url":"https://abnormal.ai/blog/tycoon2fa-post-takedown-rebuild","publisher":"Abnormal AI","context":"The article references Abnormal AI research on Tycoon 2FA rebuilding after a law enforcement takedown.","category":"","primary":false},{"title":"Chinese-language phishing services","url":"https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/","publisher":"Google Cloud","context":"The article cites Google Cloud research on the expansion of Chinese-language phishing-as-a-service communities and the Darcula platform.","category":"","primary":false},{"title":"Lead data obfuscation brokers","url":"https://www.group-ib.com/blog/lead-data-obfuscation-brokers/","publisher":"Group-IB","context":"The article references a Group-IB report on data brokers in Chinese-speaking dark web forums and Telegram channels advertising purportedly stolen data.","category":"","primary":false}],"body":"\u003cp\u003eThis weekly recap covers a broad set of cyber incidents and research, with the main theme that ordinary trusted systems are being abused in unexpected ways. Google, working with the FBI, Lumen, and other partners, disrupted the NetNut residential proxy network, also known as Popa, which was estimated to include at least 2 million devices globally. Google said NetNut used SDKs on home devices such as smart TVs and streaming boxes, including components tied to BADBOX 2.0, to route traffic through residential devices and mask malicious activity.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks and risks involving fake proof-of-concept code, messaging identities, browser features, banking malware, and AI systems. Security researchers were targeted by fake GitHub PoC repositories that looked clean but pulled a malicious dependency named skytext to deliver the ChocoPoC trojan, while WhatsApp’s username rollout raised impersonation concerns in India. Check Point reported an AI-generated browser ransomware technique that abuses Chromium’s File System Access API, though the article states there is no evidence it has been used in the wild.\u003c/p\u003e\n\n\u003cp\u003eOther covered developments include indirect prompt injection against AI agents, Dropping Elephant’s in-memory RAT campaign, Microsoft Entra self-service password reset changes, scam ads impersonating trusted brands, and multiple phishing-as-a-service kits. The recap also lists many trending CVEs across products including Adobe ColdFusion, Cursor, Linux Kernel, Google Chrome, Langflow, WinRAR, Apache Tomcat, Webmin, QNAP products, phpBB, and Gitea. The conclusion emphasizes that the week’s problems often came from trusted devices, repositories, reset paths, browser features, and other seemingly routine parts of technology.\u003c/p\u003e\n"},{"n":8,"title":"6th July – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/6th-july-threat-intelligence-report-2/","time":"12:01","priority":"MAY READ","score":40,"tldr":"This weekly threat intelligence roundup highlights major ransomware and data breach incidents alongside emerging AI-enabled threats and actively exploited critical vulnerabilities in Oracle E-Business Suite, Citrix NetScaler, Linux, and Progress Kemp LoadMaster. Organizations should prioritize patching exposed systems and monitoring for ransomware, supply-chain malware, and credential-theft activity.","briefOverview":"\u003cp\u003eThe article is a weekly threat intelligence report for 6th July covering major attacks, AI-related threats, vulnerabilities, and recent threat research. It reports ransomware and data breach incidents affecting River Bank \u0026amp; Trust, Indra Group, Nidec’s Taiwanese subsidiary, and Aflac’s Japan operations. Aflac said attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related security concerns, including a Check Point Research demonstration of browser-native ransomware generated by a large language model that abuses Chrome’s File System Access API. It also describes research into command injection weaknesses in open-source AI coding agents, where 10 out of 11 tools failed to block obfuscated destructive commands. Researchers also warned that attackers are registering AI-generated domains to hijack traffic and deliver phishing, including an AI-built phishing kit called Montana Empire.\u003c/p\u003e\n\n\u003cp\u003eSeveral serious vulnerabilities are listed, including CVE-2026-46817 in Oracle E-Business Suite, CVE-2026-46242 in the Linux kernel, CVE-2026-8451 in Citrix NetScaler, and CVE-2026-8037 in Progress Kemp LoadMaster. The article notes exploitation or public exploit activity for multiple flaws, including reported exploitation of about 950 internet-exposed Oracle E-Business Suite instances and active exploitation of Citrix NetScaler less than 24 hours after disclosure. The threat research section also covers PolinRider, Vect and TeamPCP, ChocoPoC, and analysis of 3,000 live ClickFix payloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["River Bank \u0026 Trust experienced a ransomware incident after an unauthorized actor accessed the network of parent company River Financial Corporation on June 16.","Aflac disclosed a data breach affecting its Japan operations after attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.","Check Point Research demonstrated a browser-native ransomware technique generated by a large language model that abuses Chrome’s File System Access API to read, exfiltrate, and encrypt photos inside the browser on Android and Windows.","Oracle E-Business Suite is affected by CVE-2026-46817, a critical remote code execution flaw reportedly exploited against about 950 internet-exposed instances worldwide.","Researchers described a North Korea-aligned supply-chain campaign called PolinRider that published 108 malicious packages and a Chrome extension across open-source registries."],"insights":["Several of the listed vulnerabilities had reported exploitation activity at or soon after disclosure, including Citrix NetScaler exploitation within less than 24 hours and Kemp LoadMaster exploitation attempts beginning on June 29.","The AI-related threats described in the report are not limited to text generation; they include practical abuse of browser file permissions, weak command filtering in AI coding agents, and registration of AI-hallucinated domains for phishing.","Developer and researcher ecosystems are repeatedly targeted in the report, with malicious packages, a Chrome extension, fake proof-of-concept exploits on GitHub and PyPI, and VS Code auto-run tasks all used as delivery mechanisms.","The Vect and TeamPCP partnership shows ransomware delivery being paired with supply-chain credential theft, with at least one confirmed Vect attack using credentials sourced by TeamPCP."],"referencedReports":[{"title":"PolinRider: North Korea-Linked Supply Chain Campaign Expands","url":"https://socket.dev/blog/polinrider-north-korea-linked-supply-chain-campaign-expands?__cf_chl_f_tk=7ghpzGOXz_lx2w3mZxpNj_deI74xo2o7zrqFIIqBCtY-1783238962-1.0.1.1-IVRy8bf_c.o2d5gXmE3Pr1OMZtMR667RYlwgH8PBvuc","publisher":"Socket","context":"The article cites researchers elaborating on a North Korea-aligned supply-chain campaign called PolinRider.","category":"","primary":false},{"title":"Researcher Analyzes 3,000 Live ClickFix Payloads","url":"https://thehackernews.com/2026/07/researcher-analyzes-3000-live-clickfix.html","publisher":"The Hacker News","context":"The article cites research analyzing 3,000 live ClickFix payloads and their evolving delivery techniques.","category":"","primary":false}],"body":"\u003cp\u003eThe article is a weekly threat intelligence report for 6th July covering major attacks, AI-related threats, vulnerabilities, and recent threat research. It reports ransomware and data breach incidents affecting River Bank \u0026amp; Trust, Indra Group, Nidec’s Taiwanese subsidiary, and Aflac’s Japan operations. Aflac said attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related security concerns, including a Check Point Research demonstration of browser-native ransomware generated by a large language model that abuses Chrome’s File System Access API. It also describes research into command injection weaknesses in open-source AI coding agents, where 10 out of 11 tools failed to block obfuscated destructive commands. Researchers also warned that attackers are registering AI-generated domains to hijack traffic and deliver phishing, including an AI-built phishing kit called Montana Empire.\u003c/p\u003e\n\n\u003cp\u003eSeveral serious vulnerabilities are listed, including CVE-2026-46817 in Oracle E-Business Suite, CVE-2026-46242 in the Linux kernel, CVE-2026-8451 in Citrix NetScaler, and CVE-2026-8037 in Progress Kemp LoadMaster. The article notes exploitation or public exploit activity for multiple flaws, including reported exploitation of about 950 internet-exposed Oracle E-Business Suite instances and active exploitation of Citrix NetScaler less than 24 hours after disclosure. The threat research section also covers PolinRider, Vect and TeamPCP, ChocoPoC, and analysis of 3,000 live ClickFix payloads.\u003c/p\u003e\n"},{"n":9,"title":"Mid-Year Threat Trends: What H1 2026 Signals for the Rest of the Year","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/2026-threat-intelligence-trends/","time":"12:59","priority":"MAY READ","score":40,"tldr":"Cyble says H1 2026 showed ransomware, access brokers, identity-based attacks, geopolitically driven operations, and AI-enabled threats scaling faster and becoming more coordinated. Security teams should prepare for continued growth in identity abuse, rapid exploitation, and hybrid cyber activity through the rest of 2026.","briefOverview":"\u003cp\u003eCyble’s mid-year threat trends article says the first half of 2026 showed attackers scaling operations while defenders are still catching up. Ransomware remained highly visible, with 702 ransomware attacks and 54 major data breaches and leaks recorded worldwide in March 2026. Five groups—Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom—accounted for more than 56% of that activity, while the Americas saw 1,305 cyber incidents in Q1 2026, including 1,138 publicly claimed ransomware attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights access brokers and identity abuse as major drivers of the threat landscape. In March 2026, Cyble observed 20 incidents involving the sale of access to compromised networks on underground forums, with professional services and retail most commonly listed, and three sellers—vexin, holyduxy, and algoyim—accounting for more than 55% of the activity. It also says attackers are increasingly relying on credential theft, MFA bypass, session hijacking, and third-party access abuse, meaning they are often logging in rather than breaking in.\u003c/p\u003e\n\n\u003cp\u003eGeopolitical activity and AI also shaped the first half of 2026, according to the article. During the February 2026 escalation in the Middle East, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, navigation disruption affected over 1,100 vessels near the Strait of Hormuz, and more than 8,000 conflict-themed domains were registered. The article also says AI-driven tooling has moved from experimental to operational, citing an open-source AI-native testing framework used to compromise more than 600 Fortinet FortiGate appliances across 55 countries and 26 malicious npm packages linked to North Korean actors distributing RAT malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In March 2026, Cyble recorded 702 ransomware attacks and 54 major data breaches and leaks worldwide, with Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom responsible for more than 56% of the ransomware activity.","In Q1 2026, the Americas saw 1,305 cyber incidents, including 1,138 publicly claimed ransomware attacks, and five groups drove 58% of that ransomware volume.","Cyble observed 20 incidents of access to compromised networks being sold on underground forums in March 2026, with professional services and retail as the most commonly listed sectors.","The article says attackers increasingly rely on credential theft, MFA bypass, session hijacking, and third-party access abuse, meaning they are often logging in instead of breaking in.","During the February 2026 Middle East escalation, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, navigation disruption affected over 1,100 vessels near the Strait of Hormuz, and more than 8,000 conflict-themed domains were registered."],"insights":["Ransomware activity appears highly concentrated, with a small number of groups driving more than half of observed activity globally in March 2026 and in the Americas during Q1 2026.","The access broker market is acting as an upstream supply chain for larger attacks, meaning compromised network access may be sold and used before a breach becomes publicly visible.","The article frames identity as the new weak point, emphasizing that monitoring and access controls must account for attackers using valid logins rather than only looking for malware or forced entry.","Geopolitical crises can quickly expand into broad cyber and information operations, as shown by the Middle East escalation combining connectivity disruption, hacktivist activity, navigation interference, and thousands of conflict-themed domains.","AI is no longer described as experimental in the article; it is already being used operationally in attacks while defenders are also adopting AI-assisted monitoring to keep pace."],"referencedReports":[],"body":"\u003cp\u003eCyble’s mid-year threat trends article says the first half of 2026 showed attackers scaling operations while defenders are still catching up. Ransomware remained highly visible, with 702 ransomware attacks and 54 major data breaches and leaks recorded worldwide in March 2026. Five groups—Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom—accounted for more than 56% of that activity, while the Americas saw 1,305 cyber incidents in Q1 2026, including 1,138 publicly claimed ransomware attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights access brokers and identity abuse as major drivers of the threat landscape. In March 2026, Cyble observed 20 incidents involving the sale of access to compromised networks on underground forums, with professional services and retail most commonly listed, and three sellers—vexin, holyduxy, and algoyim—accounting for more than 55% of the activity. It also says attackers are increasingly relying on credential theft, MFA bypass, session hijacking, and third-party access abuse, meaning they are often logging in rather than breaking in.\u003c/p\u003e\n\n\u003cp\u003eGeopolitical activity and AI also shaped the first half of 2026, according to the article. During the February 2026 escalation in the Middle East, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, navigation disruption affected over 1,100 vessels near the Strait of Hormuz, and more than 8,000 conflict-themed domains were registered. The article also says AI-driven tooling has moved from experimental to operational, citing an open-source AI-native testing framework used to compromise more than 600 Fortinet FortiGate appliances across 55 countries and 26 malicious npm packages linked to North Korean actors distributing RAT malware.\u003c/p\u003e\n"},{"n":10,"title":"Integrations of the Month","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/integrations-of-the-month-july-2026/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=integrations-of-the-month-july-2026","time":"12:53","priority":"MAY READ","score":40,"tldr":"Silent Push is promoting new integrations with Splunk, Tines, and ServiceNow that bring its preemptive threat intelligence and IOFA data directly into detection, automation, and incident-response workflows. The main message is that these integrations help teams identify, enrich, route, and block adversary infrastructure before it is used in attacks.","briefOverview":"\u003cp\u003eSilent Push highlights three integrations with Splunk, Tines, and ServiceNow that are intended to place preemptive threat data inside tools security teams already use. The article says these integrations are designed to reduce context switching and make threat data actionable in detection, automation, and incident workflows. It focuses on Indicators of Future Attack, Traffic Origin data, Context Graph intelligence, and the Threat Check API.\u003c/p\u003e\n\n\u003cp\u003eFor Splunk, Silent Push feeds Indicators of Future Attack into Splunk as enrichment data so detection rules can act on infrastructure that is being staged before it reaches an environment. The article says Traffic Origin data can show when an IP appears to be in one place, such as Ireland, while upstream traffic is coming from another place, such as Iran. It also says the Threat Check API can return a scored and contextualized verdict for new domains or IPs in milliseconds.\u003c/p\u003e\n\n\u003cp\u003eFor Tines, Silent Push exposes enriched Context Graph data as actions so teams can automate alert enrichment, routing, closure of low-risk cases, and proactive blocking. The article says workflows can push newly identified pre-weaponized infrastructure to a firewall or WAF before it is used against an organization. For ServiceNow, Silent Push attaches Context Graph data to tickets for suspicious domains or IPs, including risk scores, related adversary campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push highlights three integrations with Splunk, Tines, and ServiceNow that are designed to place preemptive threat data inside tools security teams already use.","The Splunk integration feeds Indicators of Future Attack and Traffic Origin data into Splunk as enrichment data so detection rules can act on infrastructure being staged before it reaches an environment.","The Tines integration exposes Silent Push Context Graph data as Tines actions, enabling automated alert enrichment, case routing, low-risk closure, and proactive blocking workflows without writing code.","The ServiceNow integration attaches Context Graph data to tickets for suspicious domains or IPs, including a risk score, related adversary campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.","Silent Push says its Threat Check API shows an average of 154 days between when it identifies infrastructure and when that infrastructure appears in other feeds, with a median of 117 days."],"insights":["Silent Push frames the value of its integrations around changing security-team decisions, such as treating an IP that appears Irish differently when upstream traffic is identified as coming from Iran.","The article positions Threat Check as useful even without a full integration build because it can be called from existing Splunk pipelines, custom scripts, or Tines workflows for fast verdicts during triage.","Silent Push claims its preemptive data can provide substantial lead time, citing an average of 154 days and a median of 117 days between its identification of infrastructure and that infrastructure appearing in other feeds.","The Tines integration is presented as especially actionable because it can automatically push newly identified pre-weaponized infrastructure to a firewall or WAF without creating a ticket or requiring a manual step.","The ServiceNow integration is designed to preserve threat context at the ticket level by attaching risk scores, campaign links, threat actor associations, matching IOFA patterns, and connected infrastructure directly to incidents."],"referencedReports":[],"body":"\u003cp\u003eSilent Push highlights three integrations with Splunk, Tines, and ServiceNow that are intended to place preemptive threat data inside tools security teams already use. The article says these integrations are designed to reduce context switching and make threat data actionable in detection, automation, and incident workflows. It focuses on Indicators of Future Attack, Traffic Origin data, Context Graph intelligence, and the Threat Check API.\u003c/p\u003e\n\n\u003cp\u003eFor Splunk, Silent Push feeds Indicators of Future Attack into Splunk as enrichment data so detection rules can act on infrastructure that is being staged before it reaches an environment. The article says Traffic Origin data can show when an IP appears to be in one place, such as Ireland, while upstream traffic is coming from another place, such as Iran. It also says the Threat Check API can return a scored and contextualized verdict for new domains or IPs in milliseconds.\u003c/p\u003e\n\n\u003cp\u003eFor Tines, Silent Push exposes enriched Context Graph data as actions so teams can automate alert enrichment, routing, closure of low-risk cases, and proactive blocking. The article says workflows can push newly identified pre-weaponized infrastructure to a firewall or WAF before it is used against an organization. For ServiceNow, Silent Push attaches Context Graph data to tickets for suspicious domains or IPs, including risk scores, related adversary campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.\u003c/p\u003e\n"},{"n":12,"title":"Community Bootcamp: Live View - Inspect a suspicious URL right now","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/webinar/community-bootcamp-live-view-inspect-a-suspicious-url-right-now/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=community-bootcamp-live-view-inspect-a-suspicious-url-right-now","time":"10:58","priority":"MAY READ","score":25,"tldr":"This appears to be an announcement for a community bootcamp session focused on using Live View to inspect a suspicious URL in real time.","briefOverview":"\u003cp\u003eThe article is titled “Community Bootcamp: Live View - Inspect a suspicious URL right now.” The title presents the item as a Community Bootcamp. It says the bootcamp is about Live View and inspecting a suspicious URL.\u003c/p\u003e\n\n\u003cp\u003eThe article body provided here is not readable as normal prose. It does not provide clear details about who is hosting the bootcamp, when it takes place, or who is affected. It also does not provide specific technical findings, URLs, indicators, or outcomes from the inspection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “Community Bootcamp: Live View - Inspect a suspicious URL right now.”","The title identifies the item as a Community Bootcamp session.","The title says the bootcamp focuses on using Live View.","The title says the session involves inspecting a suspicious URL."],"insights":["The usable article text provides only the title, while the body appears unreadable or corrupted, so no concrete technical findings or indicators can be extracted from it.","The phrase “right now” indicates the session is framed around immediate, hands-on inspection rather than a retrospective write-up.","Because the item is labeled “Community Bootcamp,” the article presents the topic as an educational activity rather than as reporting on a specific incident."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Community Bootcamp: Live View - Inspect a suspicious URL right now.” The title presents the item as a Community Bootcamp. It says the bootcamp is about Live View and inspecting a suspicious URL.\u003c/p\u003e\n\n\u003cp\u003eThe article body provided here is not readable as normal prose. It does not provide clear details about who is hosting the bootcamp, when it takes place, or who is affected. It also does not provide specific technical findings, URLs, indicators, or outcomes from the inspection.\u003c/p\u003e\n"}]</script>
