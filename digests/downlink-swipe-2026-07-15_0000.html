s with over 700 fake financial advisers and may have stolen more than €100 million per month. Authorities say tens of thousands of victims were lured into fake investment platforms and persuaded to send cryptocurrency while being shown fictitious profits.","briefOverview":"\u003cp\u003eDutch Police announced the arrest of multiple individuals suspected of being part of an international investment fraud scheme with an estimated tens of thousands of victims. Authorities believe the group operated 20 call centers across multiple countries, with more than 700 people posing as financial advisers. The organization is estimated to have made more than €100 million per month at one point.\u003c/p\u003e\n\n\u003cp\u003eThe main suspect is a 46-year-old Israeli-Polish national who was arrested in Poland on May 26, extradited to the Netherlands, and placed in detention pending trial. Between July 7 and 10, multiple Dutch and Belgian nationals were also arrested in Cyprus, Greece, and Belgium for suspected connections to the scheme. Dutch authorities said additional arrests related to the cybercrime organization should not be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe fraudsters built trust with victims over extended periods and directed them to realistic-looking investment platforms that displayed fictitious profits. Victims were persuaded to increase their investments, usually through cryptocurrency transfers, while the criminals kept the money. Dutch authorities linked at least 550 fraud reports and $28.6 million in reported losses to the organization, but police estimate there may be tens of thousands of victims worldwide.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dutch Police arrested multiple individuals suspected of involvement in an international investment fraud scheme with tens of thousands of victims.","Authorities believe the group operated 20 call centers with more than 700 people posing as financial advisers and at one point generated more than €100 million per month.","The main suspect, a 46-year-old Israeli-Polish national, was arrested in Poland on May 26, extradited to the Netherlands, and placed in detention pending trial.","The fraudsters built trust with victims, directed them to realistic-looking investment platforms showing fictitious profits, and persuaded them to increase investments through cryptocurrency transfers.","Dutch authorities linked at least 550 fraud reports and $28.6 million in reported losses to the organization, while estimating that many victims worldwide lost more than €10,000 each."],"insights":["The alleged operation’s scale was unusually industrialized, with 20 call centers and more than 700 people divided into teams with distinct roles and targeting focuses.","The main suspect’s technical expertise was described by police as indispensable because it helped set up infrastructure that concealed identities and calling locations for an extended period.","Investigators ultimately advanced the case by tracing IP addresses, financial routes, and other digital traces, then examining key technical equipment that revealed how the organization operated and where perpetrators were located.","The confirmed reported losses of $28.6 million may represent only a fraction of the total harm, because police linked 550 reports to the group while estimating tens of thousands of victims worldwide."],"referencedReports":[],"body":"\u003cp\u003eDutch Police announced the arrest of multiple individuals suspected of being part of an international investment fraud scheme with an estimated tens of thousands of victims. Authorities believe the group operated 20 call centers across multiple countries, with more than 700 people posing as financial advisers. The organization is estimated to have made more than €100 million per month at one point.\u003c/p\u003e\n\n\u003cp\u003eThe main suspect is a 46-year-old Israeli-Polish national who was arrested in Poland on May 26, extradited to the Netherlands, and placed in detention pending trial. Between July 7 and 10, multiple Dutch and Belgian nationals were also arrested in Cyprus, Greece, and Belgium for suspected connections to the scheme. Dutch authorities said additional arrests related to the cybercrime organization should not be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe fraudsters built trust with victims over extended periods and directed them to realistic-looking investment platforms that displayed fictitious profits. Victims were persuaded to increase their investments, usually through cryptocurrency transfers, while the criminals kept the money. Dutch authorities linked at least 550 fraud reports and $28.6 million in reported losses to the organization, but police estimate there may be tens of thousands of victims worldwide.\u003c/p\u003e\n"},{"n":10,"title":"LAPD sidelines relationship with license-plate reader company Flock Safety","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/lapd-halts-flock-safety-alpr-contract","time":"13:00","priority":"SHOULD READ","score":78,"tldr":"The LAPD is pausing its use of Flock Safety license-plate reader cameras and not renewing its contract until data ownership, privacy, security, and sharing safeguards are clarified. The move follows an audit finding wrongful stolen-vehicle flags and growing concerns over ALPR data use in immigration enforcement, abortion investigations, and protest tracking.","briefOverview":"\u003cp\u003eThe Los Angeles Police Department is not renewing its contract with automated license plate reader camera company Flock Safety amid a dispute over who controls the data Flock collects. The department announced on July 11 that it is putting the relationship on ice after an inspector general’s audit pushed it to stop using Flock technology pending enforceable privacy and security rules. LAPD Chief Information Officer Dean Gialamas said the department wants clear terms about who owns the data and what happens to it after collection.\u003c/p\u003e\n\n\u003cp\u003eThe audit found that over a two-month period, the department investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media. The LAPD said it will not use Flock until data, privacy, security, and sharing concerns are resolved through a contractual relationship. A department spokesperson confirmed the decision but did not otherwise comment.\u003c/p\u003e\n\n\u003cp\u003eFlock called the LAPD’s decision a surprise and said it is confident ongoing discussions can clear up what it described as misconceptions behind the pause. The company said it had been working with the LAPD on privacy protections, auditability, accountability, and limits around data access. The article says Los Angeles is the largest police department to break with Flock, which has also lost contracts in communities including Seattle, Austin, Eugene, Cambridge, and Dayton.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Los Angeles Police Department is not renewing its contract with automated license plate reader company Flock Safety amid a dispute over who controls the data Flock collects.","An inspector general’s audit pushed the LAPD to stop using Flock technology until enforceable privacy and security rules are added.","The audit found that over a two-month period, the LAPD investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media.","LAPD Chief Information Officer Dean Gialamas said the department will not use Flock until data, privacy, security, and sharing concerns are resolved through a contractual relationship.","Flock called the LAPD’s decision a surprise and said it is confident ongoing discussions can address what it described as misconceptions behind the pause."],"insights":["The dispute centers not on whether the cameras work, but on whether the LAPD can enforce clear contractual limits over data ownership, retention, security, and sharing.","The article highlights that inaccurate license-plate matches can have direct consequences for ordinary drivers, with 161 car owners investigated in two months after Flock wrongly identified their vehicles as stolen.","Los Angeles is described as the largest police department to break with Flock, making the LAPD’s pause a significant escalation compared with earlier contract losses in smaller communities.","Flock’s data-sharing practices have become a broader public concern because the article links the technology to immigration policing, an abortion-related investigation, and protester tracking in several cities."],"referencedReports":[],"body":"\u003cp\u003eThe Los Angeles Police Department is not renewing its contract with automated license plate reader camera company Flock Safety amid a dispute over who controls the data Flock collects. The department announced on July 11 that it is putting the relationship on ice after an inspector general’s audit pushed it to stop using Flock technology pending enforceable privacy and security rules. LAPD Chief Information Officer Dean Gialamas said the department wants clear terms about who owns the data and what happens to it after collection.\u003c/p\u003e\n\n\u003cp\u003eThe audit found that over a two-month period, the department investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media. The LAPD said it will not use Flock until data, privacy, security, and sharing concerns are resolved through a contractual relationship. A department spokesperson confirmed the decision but did not otherwise comment.\u003c/p\u003e\n\n\u003cp\u003eFlock called the LAPD’s decision a surprise and said it is confident ongoing discussions can clear up what it described as misconceptions behind the pause. The company said it had been working with the LAPD on privacy protections, auditability, accountability, and limits around data access. The article says Los Angeles is the largest police department to break with Flock, which has also lost contracts in communities including Seattle, Austin, Eugene, Cambridge, and Dayton.\u003c/p\u003e\n"},{"n":12,"title":"Trump administration unveils AI-supported clearinghouse for cyber vulnerabilities","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/gold-eagle-cybersecurity-vulnerabilities-clearinghouse","time":"20:00","priority":"SHOULD READ","score":78,"tldr":"The Trump administration launched Gold Eagle, a Treasury-housed federal clearinghouse that uses AI to help government, industry, and critical infrastructure operators find, validate, prioritize, and patch cyber vulnerabilities faster. Officials said the effort depends on reauthorization of the CISA 2015 Act, which expires in September.","briefOverview":"\u003cp\u003eThe Trump administration announced Gold Eagle, a new and already operative federal clearinghouse for cybersecurity vulnerabilities. The effort is housed in the Treasury Department with support from the Pentagon, the Department of Homeland Security, and the Cybersecurity and Infrastructure Security Agency. It allows industry, critical infrastructure operators, and the government to use artificial intelligence to rapidly detect, prioritize, and patch vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eOfficials said Gold Eagle is intended to coordinate vulnerability discovery and patching at a speed and scale not previously seen. A senior White House official said the clearinghouse will help avoid duplicated effort, validate vulnerabilities, and coordinate industry and government engineers as they triage, prioritize, and fix issues. The clearinghouse is now ingesting and validating vulnerabilities, while administrators work on a system to distribute them to stakeholders without risking leaks.\u003c/p\u003e\n\n\u003cp\u003eThe article says Gold Eagle resulted from a White House executive order published last month and uses AI to detect and fix vulnerabilities in software and networks. Closed-source models such as Anthropic’s Mythos will also be used, and Carnegie Mellon University’s Software Engineering Institute supported development of an intake platform. Officials said the effort is made possible by the CISA 2015 Act and warned that it would be fundamentally challenged if Congress does not reauthorize the law before it expires in September.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Trump administration announced Gold Eagle, an already operative federal clearinghouse that uses artificial intelligence to help industry, critical infrastructure operators, and government detect, prioritize, and patch cybersecurity vulnerabilities.","Gold Eagle is housed in the Treasury Department with support from the Pentagon, the Department of Homeland Security, and the Cybersecurity and Infrastructure Security Agency, and open-source software providers are also participating.","A senior White House official said the clearinghouse is ingesting and validating vulnerabilities and that administrators are creating a system to distribute vulnerabilities to stakeholders without risking leaks.","Closed source models including Anthropic’s Mythos will be used in the vulnerability-hunting effort, according to the official.","Officials said Gold Eagle is made possible by the CISA 2015 Act and that the effort would be fundamentally challenged if Congress does not reauthorize the law before it expires in September."],"insights":["Gold Eagle is already operational, not merely a proposed initiative, with officials saying it is currently ingesting and validating vulnerabilities.","The clearinghouse is designed not only to find vulnerabilities but also to prevent duplicated effort by coordinating which groups scan for, validate, prioritize, and fix the same issues.","The administration plans to use closed-source AI models such as Anthropic’s Mythos even though it had forced Anthropic to take Mythos and Claude Fable 5 offline the previous month over security concerns before later relaxing that order.","Officials linked Gold Eagle’s viability directly to the CISA 2015 Act, saying the effort would be fundamentally challenged if Congress does not reauthorize the law before it expires in September."],"referencedReports":[],"body":"\u003cp\u003eThe Trump administration announced Gold Eagle, a new and already operative federal clearinghouse for cybersecurity vulnerabilities. The effort is housed in the Treasury Department with support from the Pentagon, the Department of Homeland Security, and the Cybersecurity and Infrastructure Security Agency. It allows industry, critical infrastructure operators, and the government to use artificial intelligence to rapidly detect, prioritize, and patch vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eOfficials said Gold Eagle is intended to coordinate vulnerability discovery and patching at a speed and scale not previously seen. A senior White House official said the clearinghouse will help avoid duplicated effort, validate vulnerabilities, and coordinate industry and government engineers as they triage, prioritize, and fix issues. The clearinghouse is now ingesting and validating vulnerabilities, while administrators work on a system to distribute them to stakeholders without risking leaks.\u003c/p\u003e\n\n\u003cp\u003eThe article says Gold Eagle resulted from a White House executive order published last month and uses AI to detect and fix vulnerabilities in software and networks. Closed-source models such as Anthropic’s Mythos will also be used, and Carnegie Mellon University’s Software Engineering Institute supported development of an intake platform. Officials said the effort is made possible by the CISA 2015 Act and warned that it would be fundamentally challenged if Congress does not reauthorize the law before it expires in September.\u003c/p\u003e\n"},{"n":25,"title":"It Passed SPF, DKIM, and DMARC. It Was Still a W-2 Heist.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/w2-payroll-bec-authenticated-isp-mailbox-reply-to-third-domain","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A W-2 payroll phishing attempt passed SPF, DKIM, and DMARC because it came through a legitimate authenticated ISP mailbox, proving that email authentication verifies the sending domain but not the person behind the display name. Defenders should treat authenticated email as only one signal and require out-of-band verification for bulk PII requests.","briefOverview":"\u003cp\u003eA payroll inbox received an urgent request to send the 2025 W-2 PDFs for every employee at every location the same day. The message had no malicious link, attachment, or malware, but asked for highly sensitive payroll records containing Social Security numbers, wages, and home addresses. The article describes this as a high-severity business email compromise attempt focused on impersonation and bulk PII exfiltration.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox and routed through the provider’s legitimate mail servers. The display name carried a company leader’s identity and was padded with a long junk string to push the real ISP address out of view in many mail clients. The Reply-To pointed to pointdsk.com, a third domain registered roughly two hours before the message was sent.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft scored the message SCL 9, tagged it as high-confidence spam, and placed it in Junk, while IRONSCALES quarantined it outright. The article emphasizes that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name. It recommends weighing behavioral signals, display-name mismatches, first-time senders, third-domain Reply-To routes, and freshly registered infrastructure, and requiring out-of-band verification before sending bulk PII.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A payroll inbox received an urgent email requesting the 2025 W-2 PDFs for every employee at every location the same day.","The message passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox through the provider’s legitimate mail servers.","The email used a display name carrying a company leader’s identity, while the Reply-To pointed to pointdsk.com, a third domain registered roughly two hours before the message was sent.","Microsoft scored the message SCL 9 and placed it in Junk, while IRONSCALES quarantined it outright based on impersonation, behavioral, and spam signals.","The article emphasizes that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name."],"insights":["A clean SPF, DKIM, and DMARC result can give attackers the benefit of the doubt in environments that are tuned to trust authenticated senders or when administrators release quarantined messages.","The strongest warning signs were outside the authentication results: an external sender using the company name in the display name, a bulk W-2 request, urgency, and a Reply-To domain that differed from the sender domain.","The attacker did not need a malicious link, attachment, or forged domain because the entire theft attempt depended on persuading payroll staff to send sensitive files in reply.","The article recommends an out-of-band verification rule for bulk PII requests so that no W-2 batch, payroll change, or employee-data export is completed based only on an email request."],"referencedReports":[{"title":"FBI IC3 2024 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report for the statement that BEC losses were above $2.9 billion.","category":"","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for gateway telemetry showing BEC as roughly 3 percent of the email attack mix.","category":"","primary":false}],"body":"\u003cp\u003eA payroll inbox received an urgent request to send the 2025 W-2 PDFs for every employee at every location the same day. The message had no malicious link, attachment, or malware, but asked for highly sensitive payroll records containing Social Security numbers, wages, and home addresses. The article describes this as a high-severity business email compromise attempt focused on impersonation and bulk PII exfiltration.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox and routed through the provider’s legitimate mail servers. The display name carried a company leader’s identity and was padded with a long junk string to push the real ISP address out of view in many mail clients. The Reply-To pointed to pointdsk.com, a third domain registered roughly two hours before the message was sent.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft scored the message SCL 9, tagged it as high-confidence spam, and placed it in Junk, while IRONSCALES quarantined it outright. The article emphasizes that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name. It recommends weighing behavioral signals, display-name mismatches, first-time senders, third-domain Reply-To routes, and freshly registered infrastructure, and requiring out-of-band verification before sending bulk PII.\u003c/p\u003e\n"},{"n":36,"title":"Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds","source":"securityboulevard.com","sourceColorIdx":3,"link":"https://securityboulevard.com/2026/06/meta-microsoft-doj-and-others-disrupt-southeast-asia-scam-compounds/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=over-1-4-million-accounts-disrupted-in-cybercrime-crackdown-2","time":"09:14","priority":"SHOULD READ","score":78,"tldr":"Meta, Microsoft, the U.S. Department of Justice, and other partners disrupted scam compounds in Southeast Asia linked to large-scale online fraud operations. The action highlights growing coordinated pressure on criminal networks that rely on forced labor and digital platforms to run global scams.","briefOverview":"\u003cp\u003eThe article is titled “Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds.” The core event described by the title is a disruption involving Meta, Microsoft, the DOJ, and other unnamed participants. The targets are described as scam compounds in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe title indicates that the activity involved multiple major stakeholders rather than a single organization acting alone. It also identifies the affected setting as scam compounds, but the provided article text does not contain readable details about specific victims, methods, or outcomes. No clear technical details, indicators, or impact metrics are available from the provided content beyond the title.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports on a disruption of scam compounds in Southeast Asia.","Meta, Microsoft, and the U.S. Department of Justice are named as participants in the disruption.","The article indicates that additional unnamed parties were also involved in the disruption effort."],"insights":["The disruption involved both private technology companies and a government law enforcement agency, showing the effort was not limited to a single sector.","The article frames the target as scam compounds in Southeast Asia, indicating the action was aimed at organized real-world scam operations rather than only individual online scammers.","The named involvement of both Meta and Microsoft suggests the scam activity was significant enough to draw attention from multiple major technology platforms."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds.” The core event described by the title is a disruption involving Meta, Microsoft, the DOJ, and other unnamed participants. The targets are described as scam compounds in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe title indicates that the activity involved multiple major stakeholders rather than a single organization acting alone. It also identifies the affected setting as scam compounds, but the provided article text does not contain readable details about specific victims, methods, or outcomes. No clear technical details, indicators, or impact metrics are available from the provided content beyond the title.\u003c/p\u003e\n"},{"n":48,"title":"New critical infrastructure cybersecurity framework features government, regional council options","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/new-critical-infrastructure-cybersecurity-framework-features-government-regional-council-options/","time":"13:45","priority":"SHOULD READ","score":78,"tldr":"DHS proposed a new public-private critical infrastructure collaboration framework, ANCHOR, to replace the eliminated CIPAC system as the Trump administration pushes more cyber resilience responsibility to state and local levels. Health-ISAC warned that without strong legal protections, companies may hesitate to share sensitive cyber incident details needed for effective risk mitigation.","briefOverview":"\u003cp\u003eThe Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday. The article says this system would replace a framework that President Donald Trump eliminated weeks after returning to office. The Trump administration has said it wants to push more cybersecurity resilience responsibilities to the state and local levels.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC highlighted concerns about the proposed ANCHOR framework. Errol Weiss, chief security officer at the Health Information Sharing and Analysis Center, said the government needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents. He said industry leaders relied on the legal protections built into the old CIPAC framework to hold candid, strategic conversations about sensitive vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article points to legal protections as a key issue for whether ANCHOR can achieve its stated goals of robust risk mitigation. The affected stakeholders include government entities, regional councils, critical infrastructure organizations, and industry groups involved in sharing sensitive cyber information. The article directs readers to SmartCities Dive for the full story.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday.","The proposed system would replace a framework that President Donald Trump eliminated weeks after returning to office.","The Trump administration has said it wants to push more cybersecurity resilience responsibilities to the state and local levels.","Errol Weiss of Health-ISAC said ANCHOR needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents.","Weiss said industry leaders had relied on legal protections in the old CIPAC framework to hold candid discussions about sensitive vulnerabilities."],"insights":["Health-ISAC’s concern indicates that the success of ANCHOR may depend less on creating a new collaboration structure and more on whether participants feel legally safe sharing sensitive incident information.","The article highlights a tension between shifting cyber resilience responsibilities to state and local levels and the need for federal action to address legal exposures around information sharing.","The old CIPAC framework’s legal protections were viewed by industry leaders as essential for candid discussions about sensitive vulnerabilities, not merely as a procedural feature."],"referencedReports":[],"body":"\u003cp\u003eThe Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday. The article says this system would replace a framework that President Donald Trump eliminated weeks after returning to office. The Trump administration has said it wants to push more cybersecurity resilience responsibilities to the state and local levels.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC highlighted concerns about the proposed ANCHOR framework. Errol Weiss, chief security officer at the Health Information Sharing and Analysis Center, said the government needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents. He said industry leaders relied on the legal protections built into the old CIPAC framework to hold candid, strategic conversations about sensitive vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article points to legal protections as a key issue for whether ANCHOR can achieve its stated goals of robust risk mitigation. The affected stakeholders include government entities, regional councils, critical infrastructure organizations, and industry groups involved in sharing sensitive cyber information. The article directs readers to SmartCities Dive for the full story.\u003c/p\u003e\n"},{"n":35,"title":"Over 1.4 Million Accounts Disrupted in Cybercrime Crackdown","source":"securityweek.com","sourceColorIdx":7,"link":"https://www.securityweek.com/over-1-4-million-accounts-disrupted-in-cybercrime-crackdown/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=over-1-4-million-accounts-disrupted-in-cybercrime-crackdown","time":"09:04","priority":"SHOULD READ","score":76,"tldr":"An international cybercrime crackdown disrupted more than 1.4 million accounts linked to online fraud and other illicit activity, highlighting the scale of coordinated law enforcement action against digital crime networks.","briefOverview":"\u003cp\u003eThe article is titled “Over 1.4 Million Accounts Disrupted in Cybercrime Crackdown.” The core event presented by the article is a cybercrime crackdown that disrupted more than 1.4 million accounts. The title indicates the significance of the event is the large number of accounts affected.\u003c/p\u003e\n\n\u003cp\u003eNo clear technical details, named organizations, countries, tools, or methods are readable from the provided article content. The body text appears corrupted or encoded, so the only reliable details available are from the title. Based on the readable information, the article focuses on account disruption as the main impact of the crackdown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is about a cybercrime crackdown.","The crackdown disrupted more than 1.4 million accounts.","The article’s title emphasizes the large number of accounts affected by the crackdown."],"insights":["The article frames the action as a cybercrime crackdown, indicating the disruption was presented as an enforcement action rather than a routine platform cleanup.","The title describes the affected assets as accounts, not devices or organizations, so the article’s measurable impact is focused on access points used by people or operators."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Over 1.4 Million Accounts Disrupted in Cybercrime Crackdown.” The core event presented by the article is a cybercrime crackdown that disrupted more than 1.4 million accounts. The title indicates the significance of the event is the large number of accounts affected.\u003c/p\u003e\n\n\u003cp\u003eNo clear technical details, named organizations, countries, tools, or methods are readable from the provided article content. The body text appears corrupted or encoded, so the only reliable details available are from the title. Based on the readable information, the article focuses on account disruption as the main impact of the crackdown.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft: Some Dell PCs shut down after recent Windows updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-some-dell-devices-shut-down-after-windows-update/","time":"08:26","priority":"MAY READ","score":72,"tldr":"Microsoft is blocking the latest Windows 11 security update on some Dell PCs after a driver incompatibility caused unexpected shutdowns, poor performance, overheating, and battery drain. The issue stems from a conflict between Intel’s IPF Processor Participant driver and a new Windows USB-C Connection Manager interface, with a fix expected soon.","briefOverview":"\u003cp\u003eMicrosoft is blocking this month’s Windows 11 security updates on some Dell devices because they are causing shutdowns and performance issues. The known issue affects only Dell systems after installing the KB5101650 cumulative update released for Windows 11 25H2 and 24H2 devices. Affected devices can potentially experience unexpected shutdowns, poor performance, increased heat, and battery drain.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the root cause is a change introduced in the June 23, 2026 KB5095093 preview cumulative update. The change causes an incompatibility between the new Windows USB-C Connection Manager interface and the Intel Innovation Platform Framework Processor Participant driver. Affected systems may show a yellow exclamation point in Device Manager next to that Intel driver.\u003c/p\u003e\n\n\u003cp\u003eThe Intel IPF Processor Participant driver is a core system-level hardware driver that manages system power and thermals by adjusting processor cooling, power consumption, and thermal performance. Microsoft said the issue was reported by Dell during testing and is working with Dell to address it. Until a fix is available, Microsoft will stop pushing the KB5101650 update to affected systems and plans to release a resolution in the coming days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is blocking the KB5101650 Windows 11 security update on some Dell devices because it can cause shutdowns and performance issues.","The issue affects only Dell systems after installing the KB5101650 cumulative update for Windows 11 25H2 and 24H2 devices.","Microsoft said affected Dell devices may show a yellow exclamation point in Device Manager next to the Intel Innovation Platform Framework Processor Participant driver.","The root cause is an incompatibility between the Intel driver and the new Windows USB-C Connection Manager interface introduced in the June 23, 2026 KB5095093 preview cumulative update.","Microsoft is working with Dell on a fix and plans to release a resolution for affected devices in the coming days."],"insights":["The security update is being blocked because of a problem first introduced by an earlier preview update, KB5095093, rather than by the security update alone.","Device Manager can provide a visible sign of the issue through a yellow exclamation point next to the Intel Innovation Platform Framework Processor Participant driver.","The affected driver controls power and thermal behavior, which explains why the reported symptoms include shutdowns, increased heat, battery drain, and poor performance.","Dell identified the incompatibility during testing and reported it to Microsoft before Microsoft paused delivery of the update to affected systems."],"referencedReports":[{"title":"KB5101650","url":"https://support.microsoft.com/help/5101650","publisher":"Microsoft","context":"The article identifies KB5101650 as the Windows 11 cumulative security update being blocked on some affected Dell devices.","category":"","primary":false},{"title":"Some Dell devices with a specific Intel driver might experience poor performance","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#some-dell-devices-with-a-specific-intel-driver-might-experience-poor-performance","publisher":"Microsoft","context":"The article cites Microsoft’s Windows release health dashboard for the known issue affecting some Dell devices and the expected resolution.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft is blocking this month’s Windows 11 security updates on some Dell devices because they are causing shutdowns and performance issues. The known issue affects only Dell systems after installing the KB5101650 cumulative update released for Windows 11 25H2 and 24H2 devices. Affected devices can potentially experience unexpected shutdowns, poor performance, increased heat, and battery drain.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the root cause is a change introduced in the June 23, 2026 KB5095093 preview cumulative update. The change causes an incompatibility between the new Windows USB-C Connection Manager interface and the Intel Innovation Platform Framework Processor Participant driver. Affected systems may show a yellow exclamation point in Device Manager next to that Intel driver.\u003c/p\u003e\n\n\u003cp\u003eThe Intel IPF Processor Participant driver is a core system-level hardware driver that manages system power and thermals by adjusting processor cooling, power consumption, and thermal performance. Microsoft said the issue was reported by Dell during testing and is working with Dell to address it. Until a fix is available, Microsoft will stop pushing the KB5101650 update to affected systems and plans to release a resolution in the coming days.\u003c/p\u003e\n"},{"n":26,"title":"Understanding Claude Tag’s access model in Slack and how to configure it securely","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/claude-tag-slack-access-model","time":"15:08","priority":"MAY READ","score":68,"tldr":"Claude Tag in Slack uses admin-configured shared access bundles rather than the credentials of the user who tags it, so channel membership effectively determines who can direct the agent within that preset scope. Organizations should treat bundle attachments and Slack channel membership as an access-control boundary, using least-privilege bundles, private channels, approval flows, and Claude Enterprise login/RBAC controls.","briefOverview":"\u003cp\u003eAnthropic’s Claude Tag is an AI agent for Slack that acts on connected services using shared credentials configured by an administrator, rather than the credentials of the user who tags it. In direct messages, Claude Tag uses the sender’s own claude.ai account and connectors, but in shared channels it uses an agent identity with permissions defined by an access bundle. Tenable Research reviewed this access model with Anthropic through coordinated disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that Slack channel configuration becomes part of the access-control surface for Claude Tag. When an access bundle is attached to a channel, members of that channel can converse with Claude and direct it within the scope of the admin-configured bundle. Organizations can also require claude.ai login and role-based access control before users may interact with Claude at all.\u003c/p\u003e\n\n\u003cp\u003eKey technical details include that GitHub access uses a Claude GitHub App installation token scoped to an organization owner’s repository allowlist, while non-GitHub OAuth connectors such as Google Drive may reuse the credential of the admin or owner who connected them. Anthropic’s documentation warns that a bundle attached to a public channel grants its access to anyone who joins that channel, so elevated credentials should be kept in private-channel scopes. The article recommends auditing access bundles, reviewing bundle scope and channel membership together, scoping bundles minimally, managing invite policies, and using per-user delegation where appropriate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Claude Tag acts on connected services using shared credentials configured by an administrator for a Slack workspace or private channel, rather than the credentials of the user who tags it.","In shared Slack channels, Claude Tag uses a service identity model in which one admin-configured access bundle serves everyone in the channel.","Organizations can require users to log in to claude.ai and use role-based access control before they may interact with Claude Tag at all.","Tenable Research worked with Anthropic’s security team through coordinated disclosure to review Claude Tag’s access model and admin configuration experience.","The article recommends auditing access bundles, reviewing channel membership and bundle scope together, scoping bundles minimally, managing channel invite policies, and using per-user delegation where appropriate."],"insights":["Slack channel membership becomes part of the practical access-control surface for Claude Tag because users who can converse with Claude in a scoped channel can direct the agent within the admin-configured bundle.","Public Slack channels are especially sensitive because Anthropic’s documentation warns that attaching a bundle to a public channel can grant its access to anyone who joins that channel.","Claude Tag can reduce uncontrolled per-user writes because actions occur only where the shared agent is scoped to write, rather than wherever an individual user’s own credentials might have access.","Different channels can and should receive different bundles, such as scoping a finance channel only to finance repositories and an engineering channel only to engineering repositories.","For non-GitHub OAuth connectors such as Google Drive, the access bundle may reuse the OAuth credential of the organization admin or owner who connected it, making least-privilege bundle design especially important."],"referencedReports":[],"body":"\u003cp\u003eAnthropic’s Claude Tag is an AI agent for Slack that acts on connected services using shared credentials configured by an administrator, rather than the credentials of the user who tags it. In direct messages, Claude Tag uses the sender’s own claude.ai account and connectors, but in shared channels it uses an agent identity with permissions defined by an access bundle. Tenable Research reviewed this access model with Anthropic through coordinated disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that Slack channel configuration becomes part of the access-control surface for Claude Tag. When an access bundle is attached to a channel, members of that channel can converse with Claude and direct it within the scope of the admin-configured bundle. Organizations can also require claude.ai login and role-based access control before users may interact with Claude at all.\u003c/p\u003e\n\n\u003cp\u003eKey technical details include that GitHub access uses a Claude GitHub App installation token scoped to an organization owner’s repository allowlist, while non-GitHub OAuth connectors such as Google Drive may reuse the credential of the admin or owner who connected them. Anthropic’s documentation warns that a bundle attached to a public channel grants its access to anyone who joins that channel, so elevated credentials should be kept in private-channel scopes. The article recommends auditing access bundles, reviewing bundle scope and channel membership together, scoping bundles minimally, managing invite policies, and using per-user delegation where appropriate.\u003c/p\u003e\n"},{"n":42,"title":"Harden-Runner Block Mode Now Available for macOS and Windows GitHub-Hosted Runners","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/harden-runner-block-mode-now-available-for-macos-and-windows-github-hosted-runners","time":"23:11","priority":"MAY READ","score":66,"tldr":"StepSecurity’s Harden-Runner v2.20.0 now supports egress block mode on macOS and Windows GitHub-hosted runners, extending outbound traffic enforcement beyond Linux. This lets teams block unauthorized network calls from compromised workflows or dependencies that could exfiltrate secrets from sensitive build and signing pipelines.","briefOverview":"\u003cp\u003eHarden-Runner v2.20.0 extends egress block mode to macOS and Windows GitHub-hosted runners. The article says this allows teams to stop secret exfiltration on every operating system their pipelines run on, rather than only observing outbound traffic. Previously, Harden-Runner could enforce \u003ccode\u003eegress-policy: block\u003c/code\u003e on Linux GitHub-hosted runners, while macOS and Windows GitHub-hosted runners only supported audit mode.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recent GitHub Actions attacks, including the Megalodon campaign and GhostAction, as examples where compromised workflows or dependencies made outbound calls to steal secrets. It says macOS and Windows runners can handle sensitive credentials, including Apple signing certificates, provisioning profiles, App Store Connect API keys, and Windows code signing certificates. The article also notes that the Velora DEX SDK compromise shipped an npm package that specifically dropped a macOS backdoor.\u003c/p\u003e\n\n\u003cp\u003eWith block mode, outbound calls that are not on the allowed endpoints list are stopped, regardless of whether they come from a compromised dependency, poisoned action, or injected script. The recommended rollout is to start in audit mode, review the policy Harden-Runner generates from actual traffic, and then switch to block mode. The article says Harden-Runner protects more than 13,000 open-source projects and enterprises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Harden-Runner v2.20.0 extends egress block mode to macOS and Windows GitHub-hosted runners.","The article says recent GitHub Actions attacks, including Megalodon and GhostAction, relied on outbound calls to exfiltrate secrets.","Before this release, Harden-Runner supported egress-policy: block on Linux GitHub-hosted runners, while macOS and Windows GitHub-hosted runners only had audit mode.","macOS runners often build and sign iOS and macOS apps using Apple signing certificates, provisioning profiles, and App Store Connect API keys.","The recommended path is to start in audit mode, review the recommended policy generated from actual traffic, and then switch to block mode."],"insights":["The article frames outbound network access as the decisive control in recent GitHub Actions secret theft campaigns, arguing that preventing a runner from making an unauthorized external call can turn an incident into a near miss.","macOS and Windows runners are presented as high-value CI targets because they commonly handle signing material that could let attackers make malicious software appear legitimate.","The release changes Harden-Runner’s role on macOS and Windows from detection-only to prevention, allowing teams to enforce policies built from previously observed workflow traffic.","The article recommends using audit mode first because real workflow traffic can be used to generate an allowlist before switching to blocking, reducing the risk of breaking legitimate builds."],"referencedReports":[],"body":"\u003cp\u003eHarden-Runner v2.20.0 extends egress block mode to macOS and Windows GitHub-hosted runners. The article says this allows teams to stop secret exfiltration on every operating system their pipelines run on, rather than only observing outbound traffic. Previously, Harden-Runner could enforce \u003ccode\u003eegress-policy: block\u003c/code\u003e on Linux GitHub-hosted runners, while macOS and Windows GitHub-hosted runners only supported audit mode.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recent GitHub Actions attacks, including the Megalodon campaign and GhostAction, as examples where compromised workflows or dependencies made outbound calls to steal secrets. It says macOS and Windows runners can handle sensitive credentials, including Apple signing certificates, provisioning profiles, App Store Connect API keys, and Windows code signing certificates. The article also notes that the Velora DEX SDK compromise shipped an npm package that specifically dropped a macOS backdoor.\u003c/p\u003e\n\n\u003cp\u003eWith block mode, outbound calls that are not on the allowed endpoints list are stopped, regardless of whether they come from a compromised dependency, poisoned action, or injected script. The recommended rollout is to start in audit mode, review the policy Harden-Runner generates from actual traffic, and then switch to block mode. The article says Harden-Runner protects more than 13,000 open-source projects and enterprises.\u003c/p\u003e\n"},{"n":9,"title":"Trump’s DNI pick grilled about election security, voter fraud","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/jay-clayton-odni-nominee-senate-confirmation-hearing","time":"17:50","priority":"MAY READ","score":65,"tldr":"Jay Clayton, Trump’s nominee for director of national intelligence, faced sharp Senate questioning over his refusal to clearly say Joe Biden won the 2020 election and over his views on voter fraud and election security. The hearing raised concerns among Democrats about whether he would preserve intelligence independence and protect election integrity if confirmed.","briefOverview":"\u003cp\u003eJay Clayton, President Donald Trump’s nominee for director of national intelligence, faced questioning from Democrats on the Senate Intelligence Committee about his independence, election security, and past statements on voter fraud. He resisted giving a firm answer on whether Joe Biden won the 2020 presidential election, saying that U.S. processes were followed and Biden became president. Senators Mark Warner and Angus King criticized his answers, saying he had not clearly acknowledged a simple fact.\u003c/p\u003e\n\n\u003cp\u003eElection security was presented as a major concern for Democrats ahead of the November midterms, with fears that Clayton could assist Trump’s efforts to undermine past or future election outcomes. Clayton said election audit trails in some places are not what should be expected for something so important, and he said election integrity could be greatly improved. He was also questioned about subpoenas issued to journalists reporting on the Air Force One airplane Qatar gifted to Trump, which some policymakers viewed as an intimidation tactic and an assault on free speech.\u003c/p\u003e\n\n\u003cp\u003eThe hearing gave little attention to national security threats from Russia, China, and others, and to efforts to shrink the Office of the Director of National Intelligence. There was no substantive discussion of Section 702 of the Foreign Intelligence Surveillance Act, which had lapsed the previous month and allows U.S. intelligence agencies to collect digital communications of foreigners overseas without a warrant. In written responses to the committee, Clayton said he wanted to understand how to minimize the harm to national security caused by the lapse in Section 702 authorities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jay Clayton, President Donald Trump’s nominee for director of national intelligence, faced questioning from Senate Intelligence Committee Democrats about his independence, election security, and past statements about voter fraud.","Clayton repeatedly avoided giving a firm answer that Joe Biden won the 2020 presidential election, saying instead that Biden became president after U.S. processes were completed.","Democrats expressed concern that Clayton could assist Trump’s efforts to undermine the outcomes of past or future elections.","Clayton was also questioned about his decision to subpoena journalists reporting on the Air Force One airplane Qatar gifted to Trump.","The hearing included little substantive discussion of threats from Russia and China, efforts to shrink the Office of the Director of National Intelligence, or the recent lapse of Section 702 of the Foreign Intelligence Surveillance Act."],"insights":["The hearing focused heavily on election legitimacy and press freedom concerns, while giving little attention to major intelligence topics such as Russia, China, and the lapse of Section 702 authorities.","Clayton’s written answer on Section 702 emphasized reducing national security harm from the lapse, but the article says senators did not substantively examine the issue during the hearing.","The article links the breakdown of Section 702 renewal talks to Trump’s appointment of Bill Pulte as acting DNI, highlighting how personnel choices affected surveillance policy negotiations.","Clayton’s responses framed election integrity as an area needing improvement, even as the article notes experts have found no evidence of widespread ballot fraud."],"referencedReports":[],"body":"\u003cp\u003eJay Clayton, President Donald Trump’s nominee for director of national intelligence, faced questioning from Democrats on the Senate Intelligence Committee about his independence, election security, and past statements on voter fraud. He resisted giving a firm answer on whether Joe Biden won the 2020 presidential election, saying that U.S. processes were followed and Biden became president. Senators Mark Warner and Angus King criticized his answers, saying he had not clearly acknowledged a simple fact.\u003c/p\u003e\n\n\u003cp\u003eElection security was presented as a major concern for Democrats ahead of the November midterms, with fears that Clayton could assist Trump’s efforts to undermine past or future election outcomes. Clayton said election audit trails in some places are not what should be expected for something so important, and he said election integrity could be greatly improved. He was also questioned about subpoenas issued to journalists reporting on the Air Force One airplane Qatar gifted to Trump, which some policymakers viewed as an intimidation tactic and an assault on free speech.\u003c/p\u003e\n\n\u003cp\u003eThe hearing gave little attention to national security threats from Russia, China, and others, and to efforts to shrink the Office of the Director of National Intelligence. There was no substantive discussion of Section 702 of the Foreign Intelligence Surveillance Act, which had lapsed the previous month and allows U.S. intelligence agencies to collect digital communications of foreigners overseas without a warrant. In written responses to the committee, Clayton said he wanted to understand how to minimize the harm to national security caused by the lapse in Section 702 authorities.\u003c/p\u003e\n"},{"n":33,"title":"Coinbase and Meta Back DOJ Anti-Scam Operation","source":"coincentral.com","sourceColorIdx":0,"link":"https://coincentral.com/coinbase-and-meta-back-doj-anti-scam-operation/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=coinbase-and-meta-back-doj-anti-scam-operation","time":"08:59","priority":"MAY READ","score":62,"tldr":"Coinbase and Meta are supporting a U.S. Department of Justice anti-scam operation aimed at disrupting fraud networks and protecting victims. The key takeaway is increased coordination between major tech/crypto firms and federal law enforcement against online scams.","briefOverview":"\u003cp\u003eThe article is titled “Coinbase and Meta Back DOJ Anti-Scam Operation.” The readable information indicates that Coinbase and Meta are backing an anti-scam operation associated with the DOJ. The provided article body is otherwise corrupted or unreadable.\u003c/p\u003e\n\n\u003cp\u003eBecause the readable text is limited to the title, the article does not provide verifiable details about the operation’s targets, methods, timing, or outcomes. It also does not include readable technical details about scams, affected users, infrastructure, or enforcement actions. No specific impact beyond the involvement of Coinbase, Meta, and the DOJ can be confirmed from the provided article text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says Coinbase backed a Department of Justice anti-scam operation.","The article says Meta backed a Department of Justice anti-scam operation.","The article concerns an anti-scam operation involving the Department of Justice."],"insights":["The article text provided is unreadable or corrupted, so the only verifiable substance available is the title.","The title indicates the Department of Justice anti-scam operation drew backing from both Coinbase and Meta, two companies from different parts of the online ecosystem."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Coinbase and Meta Back DOJ Anti-Scam Operation.” The readable information indicates that Coinbase and Meta are backing an anti-scam operation associated with the DOJ. The provided article body is otherwise corrupted or unreadable.\u003c/p\u003e\n\n\u003cp\u003eBecause the readable text is limited to the title, the article does not provide verifiable details about the operation’s targets, methods, timing, or outcomes. It also does not include readable technical details about scams, affected users, infrastructure, or enforcement actions. No specific impact beyond the involvement of Coinbase, Meta, and the DOJ can be confirmed from the provided article text.\u003c/p\u003e\n"},{"n":29,"title":"There and Back Again: An Operators Guide on NTLM Relaying Egress","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/15/there-and-back-again-an-operators-guide-on-ntlm-relaying-egress/","time":"16:00","priority":"MAY READ","score":60,"tldr":"SpecterOps describes a practical NTLM relay technique that coerces SMB or WebDAV authentication out to an internet-facing cloud host, tunnels it back through red team infrastructure, and relays it into the target network to achieve privilege escalation. The key defense is enforcing LDAP signing/LDAPS channel binding, enabling EPA on ADCS web enrollment, and restricting outbound SMB and unnecessary inbound traffic.","briefOverview":"\u003cp\u003eSpecterOps describes “There and Back Again,” a technique for coercing NTLM authentication outbound to the internet, catching it with a cloud host, forwarding it back to red team infrastructure, and proxying it into the target environment for NTLM relay. The article frames the method as useful during assessments where operators have only low-privilege command-and-control access and cannot bind locally to port 445/TCP or perform more traditional local relay setups. It notes that the technique can be used to relay coerced authentication to services such as ADCS web enrollment endpoints or LDAP/LDAPS for identity or computer takeover.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the main requirement is for at least one internal system to reach an attacker-controlled cloud host over the needed outbound path. It describes cases where domain controllers and obvious sensitive systems could not send outbound SMB traffic, but another reachable Windows server in a different network segment could be coerced and relayed. It also highlights WebDAV over port 443/TCP as a practical option when SMB egress is blocked or local firewall rules prevent receiving WebDAV traffic on a high port.\u003c/p\u003e\n\n\u003cp\u003eThe walkthrough covers provisioning an Azure VM, redirecting port 443/TCP to 8443/TCP, using SSH forwarding, and routing traffic back through a SOCKS5 proxy tied to a ceded-access agent. It then demonstrates a local privilege escalation flow involving DNS record creation, EFS and WebClient preparation, PetitPotam coercion, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution. The defensive guidance recommends LDAP signing and LDAPS channel binding, Extended Protection for Authentication on ADCS web enrollment, restricting outbound SMB to public IPs, and local firewall rules that allow only necessary inbound ports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps describes “There and Back Again” as a technique that coerces outbound NTLM authentication to an internet-facing cloud host, forwards it back to red team infrastructure, and proxies it into the target environment to relay to services such as ADCS web enrollment or LDAP/LDAPS.","The technique is useful when operators only have low-privilege command-and-control access and cannot bind locally to port 445/TCP or when firewall rules prevent more traditional WebDAV relays inside the environment.","The article states that vulnerable ADCS web enrollment endpoints lacking Extended Protection for Authentication are still seen in nearly 70–80% of client environments with an Active Directory presence.","The article demonstrates a local privilege escalation flow using WebDAV coercion over port 443/TCP, DNS record creation, EFS and WebClient service preparation, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution.","The defensive guidance recommends enabling LDAP signing and LDAPS channel binding, enabling Extended Protection for Authentication on ADCS web enrollment endpoints, restricting outbound SMB to public IPs, and deploying local firewall rules that allow only necessary inbound ports."],"insights":["Blocking obvious high-value systems such as domain controllers from outbound SMB is not sufficient, because the article describes finding a less obvious Windows server in a different network segment whose coerced outbound authentication could still be relayed for escalation.","WebDAV over port 443/TCP is highlighted as a practical way to bypass common firewall restrictions that block SMB egress or local high-port WebDAV relays.","The article notes that setting LDAPS channel binding to “When Supported” can preserve compatibility with legacy systems while still preventing NTLM relay to LDAPS because the default Windows WebDAV client includes the channel binding token.","Low-privilege domain users can add the DNS record needed for the WebDAV coercion flow, so the article treats DNS record creation as an expected part of the attack path rather than an administrative barrier.","Even when Credential Guard is in use, the article states that operators can extract an LDAP service ticket from the current logon session without touching LSASS, which can still support the demonstrated DNS modification step."],"referencedReports":[{"title":"NTLM relaying over SOCKS","url":"https://tw1sm.github.io/2021-02-15-socks-relay/","publisher":"Matt Creel","context":"The article cites Matt Creel’s blog as prior guidance on NTLM relaying over SOCKS that this tradecraft builds on.","category":"","primary":false}],"body":"\u003cp\u003eSpecterOps describes “There and Back Again,” a technique for coercing NTLM authentication outbound to the internet, catching it with a cloud host, forwarding it back to red team infrastructure, and proxying it into the target environment for NTLM relay. The article frames the method as useful during assessments where operators have only low-privilege command-and-control access and cannot bind locally to port 445/TCP or perform more traditional local relay setups. It notes that the technique can be used to relay coerced authentication to services such as ADCS web enrollment endpoints or LDAP/LDAPS for identity or computer takeover.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the main requirement is for at least one internal system to reach an attacker-controlled cloud host over the needed outbound path. It describes cases where domain controllers and obvious sensitive systems could not send outbound SMB traffic, but another reachable Windows server in a different network segment could be coerced and relayed. It also highlights WebDAV over port 443/TCP as a practical option when SMB egress is blocked or local firewall rules prevent receiving WebDAV traffic on a high port.\u003c/p\u003e\n\n\u003cp\u003eThe walkthrough covers provisioning an Azure VM, redirecting port 443/TCP to 8443/TCP, using SSH forwarding, and routing traffic back through a SOCKS5 proxy tied to a ceded-access agent. It then demonstrates a local privilege escalation flow involving DNS record creation, EFS and WebClient preparation, PetitPotam coercion, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution. The defensive guidance recommends LDAP signing and LDAPS channel binding, Extended Protection for Authentication on ADCS web enrollment, restricting outbound SMB to public IPs, and local firewall rules that allow only necessary inbound ports.\u003c/p\u003e\n"},{"n":24,"title":"ADPathFinder: OpenGraph Attack Path Mapping in BloodHound CE","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/network-pentesting/adpathfinder-opengraph-attack-path-mapping-in-bloodhound-ce/","time":"07:40","priority":"MAY READ","score":58,"tldr":"NetSPI released ADPathFinder, an open-source tool that maps and prioritizes Active Directory privilege escalation paths across BloodHound CE data, including AD, ADCS, MSSQL, and SCCM OpenGraph sources. It also enriches password audit results with BloodHound context so testers can identify cracked credentials that matter most.","briefOverview":"\u003cp\u003eADPathFinder is a tool for mapping privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data. It combines SharpHound data with OpenGraph collectors such as MSSQLHound and ConfigManBearPig so relationships across different datasets can be queried together. The article presents it as a way to find and prioritize paths in large BloodHound environments where thousands of users and hundreds of thousands of edges can make manual review difficult.\u003c/p\u003e\n\n\u003cp\u003eThe tool maps shortest paths from low-privileged users and computers to high-value targets such as Domain Admins and Domain Controllers. Users and computers that reach the same target through the same chain are grouped into shared findings, reducing repeated results and showing which paths affect the most principals. It also includes standalone checks for issues such as SMB signing disabled, delegation misconfigurations, WebClient on servers, and specific ADCS, SCCM, and MSSQL conditions.\u003c/p\u003e\n\n\u003cp\u003eADPathFinder also performs password auditing when an NTDS dump and hashcat potfile are provided. It checks enabled accounts for blank passwords, password reuse, passwords similar to usernames, LM hash use, weak password patterns, and cracked Kerberoastable or AS-REP roastable accounts, while adding BloodHound context such as group membership and escalation paths. The tool outputs per-domain HTML reports grouped by severity and shared path, along with text and JSON outputs, and the article warns that NTDS dumps, potfiles, reports, and optional cleartext password output are sensitive material.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ADPathFinder maps privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data.","ADPathFinder combines SharpHound data with OpenGraph collectors such as MSSQLHound and ConfigManBearPig so cross-dataset paths are reported as a single finding instead of separate leads.","The tool groups users and computers that reach the same target through the same chain, which can reduce many similar paths in a large graph into one finding with affected principals attached.","ADPathFinder can perform password audits from an NTDS dump and hashcat potfile, adding BloodHound context such as group membership, roastability, delegation, and account risk.","ADPathFinder writes per-domain HTML reports organized by severity and shared path, with text and JSON outputs available alongside the HTML."],"insights":["ADPathFinder prioritizes otherwise standalone misconfigurations by whether they sit on an escalation path, so an issue such as SMB signing disabled can move from medium to high severity when the affected host provides onward access to a high-value target.","The tool is designed to reduce report noise in large environments by grouping many users or computers that share the same attack chain into a single finding with the affected principals attached.","ADPathFinder can connect an Active Directory user, a SQL login, linked SQL servers, and SCCM permissions into one continuous finding when SharpHound, MSSQLHound, and ConfigManBearPig data are loaded together.","Password audit results are separated by account importance and graph context, so a cracked password on a Domain Admin or on an account in an escalation path is not treated the same as a cracked password on a standard user account.","The article cautions that ADPathFinder’s optional `--unsafe-report` output can include cleartext passwords and should be handled with the same care as the source NTDS data."],"referencedReports":[],"body":"\u003cp\u003eADPathFinder is a tool for mapping privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data. It combines SharpHound data with OpenGraph collectors such as MSSQLHound and ConfigManBearPig so relationships across different datasets can be queried together. The article presents it as a way to find and prioritize paths in large BloodHound environments where thousands of users and hundreds of thousands of edges can make manual review difficult.\u003c/p\u003e\n\n\u003cp\u003eThe tool maps shortest paths from low-privileged users and computers to high-value targets such as Domain Admins and Domain Controllers. Users and computers that reach the same target through the same chain are grouped into shared findings, reducing repeated results and showing which paths affect the most principals. It also includes standalone checks for issues such as SMB signing disabled, delegation misconfigurations, WebClient on servers, and specific ADCS, SCCM, and MSSQL conditions.\u003c/p\u003e\n\n\u003cp\u003eADPathFinder also performs password auditing when an NTDS dump and hashcat potfile are provided. It checks enabled accounts for blank passwords, password reuse, passwords similar to usernames, LM hash use, weak password patterns, and cracked Kerberoastable or AS-REP roastable accounts, while adding BloodHound context such as group membership and escalation paths. The tool outputs per-domain HTML reports grouped by severity and shared path, along with text and JSON outputs, and the article warns that NTDS dumps, potfiles, reports, and optional cleartext password output are sensitive material.\u003c/p\u003e\n"},{"n":39,"title":"Life Finds a Way: Securing the Enterprise When Everyone Is a Developer","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/life-finds-a-way-securing-the-enterprise-when-everyone-is-a-developer/","time":"10:34","priority":"MAY READ","score":55,"tldr":"AI agents and citizen developers are rapidly expanding enterprise attack surfaces and collapsing exploitation timelines, making traditional “do the basics” security programs insufficient. Security teams must adapt to agent-driven scale by securing AI workflows directly and moving as fast as the tools now changing the environment.","briefOverview":"\u003cp\u003eRob Gurzeev of CyCognito spoke with Gadi Evron, founder and CEO of Knostic and CISO-in-Residence for AI at the Cloud Security Alliance, about how AI is changing enterprise security. Evron argues that long-standing security assumptions are breaking as agents, coding tools, and citizen developers spread across organizations. The discussion centers on the idea that “everyone is a developer” now, which turns shadow IT into AI everywhere and fragments how technology is built and managed.\u003c/p\u003e\n\n\u003cp\u003eA major point in the conversation is that AI has compressed time to exploitation from weeks to hours, making older response models and patching assumptions less reliable. Evron says vulnerabilities are easier to find with tools like Claude Code, while defenders still have not had the same mature “singularity moment” as attackers. Gurzeev adds that AI applications, MCP servers, and other quickly built assets may expose sensitive systems such as Salesforce or SAP data with missing authentication or careless misconfigurations.\u003c/p\u003e\n\n\u003cp\u003eBoth speakers emphasize scale and coverage over traditional depth, because organizations may face far more applications, agents, and assets than before. Evron says security leaders must work more closely with vendors, stay embedded in roadmaps, and be ready to learn from startups as the market shifts. The conversation also stresses that leaders and employees need to become power users of AI agents, experiment constantly, and accept that tools and workflows built one month may need to be discarded the next.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Gadi Evron argues that AI agents are breaking long-standing security assumptions because configuration, access control, and software creation are becoming less centrally managed and less predictable.","The conversation highlights that AI has shortened the time from finding a weakness to exploiting it from weeks to hours, making older patching and response timelines inadequate.","Evron says “do the basics” is no longer enough because agents can create new paths, assets, workflows, and exposures that security teams may not know about.","Rob Gurzeev says citizen developers and AI-built applications are expanding the attack surface, including AI applications and MCP servers that may expose sensitive company data without proper authentication.","Both speakers emphasize that security leaders need to prioritize scale, coverage, and rapid learning because AI tools and risks are changing every few weeks."],"insights":["Evron argues that the same AI agents creating new security risks are also the only realistic way for organizations to keep up with basic security work at machine speed.","The article suggests that security leaders should ask vendors not just for support, but to explain how they keep up with rapid AI-driven changes and to involve customers in their roadmaps.","Evron says teams may need to discard AI workflows, scaffolding, and rules they built only weeks earlier because model improvements can make those structures a constraint rather than an advantage.","The discussion frames token usage as an early maturity metric for AI adoption, not because it proves efficiency, but because leaders first need employees to experiment enough to change how they work.","Gurzeev describes AI pentesting economics as an emerging operational problem: organizations may have millions of assets, but no clear formula for deciding what should be tested, when, and at what cost."],"referencedReports":[],"body":"\u003cp\u003eRob Gurzeev of CyCognito spoke with Gadi Evron, founder and CEO of Knostic and CISO-in-Residence for AI at the Cloud Security Alliance, about how AI is changing enterprise security. Evron argues that long-standing security assumptions are breaking as agents, coding tools, and citizen developers spread across organizations. The discussion centers on the idea that “everyone is a developer” now, which turns shadow IT into AI everywhere and fragments how technology is built and managed.\u003c/p\u003e\n\n\u003cp\u003eA major point in the conversation is that AI has compressed time to exploitation from weeks to hours, making older response models and patching assumptions less reliable. Evron says vulnerabilities are easier to find with tools like Claude Code, while defenders still have not had the same mature “singularity moment” as attackers. Gurzeev adds that AI applications, MCP servers, and other quickly built assets may expose sensitive systems such as Salesforce or SAP data with missing authentication or careless misconfigurations.\u003c/p\u003e\n\n\u003cp\u003eBoth speakers emphasize scale and coverage over traditional depth, because organizations may face far more applications, agents, and assets than before. Evron says security leaders must work more closely with vendors, stay embedded in roadmaps, and be ready to learn from startups as the market shifts. The conversation also stresses that leaders and employees need to become power users of AI agents, experiment constantly, and accept that tools and workflows built one month may need to be discarded the next.\u003c/p\u003e\n"},{"n":41,"title":"Enrichment Shouldn't Cost You a Lookup: Introducing Censys Unlimited Enrichment","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/unlimited-enrichment/","time":"18:12","priority":"MAY READ","score":55,"tldr":"Censys launched Unlimited Enrichment, a credit-free host enrichment API designed to let security teams enrich every external IP in SIEM, SOAR, and AI SOC workflows without rationing lookups. The key takeaway is that Censys wants IP context to become an always-on first step in alert triage rather than a costly, selective investigation step.","briefOverview":"\u003cp\u003eCensys introduced Unlimited Enrichment, a credit-free host enrichment API for IPv4 and IPv6 addresses. The article says the product is meant to remove the need for teams to ration enrichment lookups because each lookup draws down a credit balance. Censys presents the service as a way to bring external IP context into the start of alert triage across SIEM, SOAR, and AI SOC workflows.\u003c/p\u003e\n\n\u003cp\u003eUnlimited Enrichment returns a compact, standardized host profile with fields such as geolocation, network and ASN ownership, forward and reverse DNS, open ports and protocols, device and service labels, the Censys ARC Reputation Score, detected threats, and third-party context from sources including GreyNoise, IPinfo, and Mallory.ai. The article emphasizes that the endpoint takes an IP address and returns a fixed JSON object that is predictable to parse and cheaper to store, index, and use in model-driven workflows. Censys says deeper investigation can still use full host detail, CenQL, the MCP server, CLI, and Collections with webhooks.\u003c/p\u003e\n\n\u003cp\u003eThe article gives examples of how the enrichment data can support firewall, EDR, DLP, and IAM alerts. In those scenarios, fields such as threat names, command-and-control evidence, hosting status, privacy flags, location, service labels, and reputation score help analysts decide whether to close, escalate, contain, or investigate further. Censys says Unlimited Enrichment is available as an option on the Censys Core plan.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys introduced Unlimited Enrichment, a credit-free host enrichment API for IPv4 and IPv6 addresses.","Unlimited Enrichment returns a compact, standardized profile that includes geolocation, network and ASN ownership, DNS data, open ports and protocols, labels, Censys ARC Reputation Score, detected threats, and third-party context.","Censys designed the API for high-volume automated lookups in SIEM, SOAR, and AI SOC pipelines so teams can enrich alerts at the start of triage instead of rationing lookups.","The article describes example uses for firewall, EDR, DLP, and IAM alerts where enrichment data can help analysts decide whether to close, escalate, contain, or investigate further.","Unlimited Enrichment is available as an option on the Censys Core plan."],"insights":["Censys positions unlimited enrichment as most valuable when it happens b
