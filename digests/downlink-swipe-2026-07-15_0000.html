<script type="application/json" id="dl-articles">[{"n":27,"title":"CVE-2026-15409, CVE-2026-15410: SonicWall SMA 1000 zero-day vulnerabilities exploited in the wild","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/cve-2026-15409-cve-2026-15410-sonicwall-sma-1000-zero-day-vulnerabilities-exploited-in-the","time":"17:14","priority":"MUST READ","score":96,"tldr":"SonicWall patched two SMA 1000 zero-day vulnerabilities, CVE-2026-15409 and CVE-2026-15410, that have been exploited in the wild and may be chained for unauthenticated remote code execution. Organizations should urgently update affected appliances and review SonicWall’s indicators of compromise.","briefOverview":"\u003cp\u003eSonicWall patched two recently exploited zero-day vulnerabilities in its SMA 1000 Series secure remote access appliances. The flaws are CVE-2026-15409, a server-side request forgery vulnerability with a CVSSv3 score of 10, and CVE-2026-15410, a remote code execution vulnerability with a CVSSv3 score of 7.2. SonicWall confirmed that exploitation of these vulnerabilities has been observed in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article states that while SonicWall’s advisory does not specify whether the flaws were exploited together, they may form a fully remote, unauthenticated path to arbitrary operating system command execution on affected appliances. CVE-2026-15409 affects the SMA 1000 Workplace interface and can allow a remote, unauthenticated attacker to make network requests to locations of the attacker’s choosing. CVE-2026-15410 is a code injection vulnerability in the Appliance Management Console, which normally requires authentication.\u003c/p\u003e\n\n\u003cp\u003eSMA 1000 appliances are internet-facing enterprise remote access gateways, and the article notes that a compromise could expose administrator credentials, VPN session tokens, and details about internal network architecture. SonicWall released fixed versions for SMA1000 models 6210, 7210, and 8200v, and the advisory includes indicators of compromise but no workarounds. CISA added both CVEs to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17, and the article recommends immediate patching.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall patched CVE-2026-15409 and CVE-2026-15410 in its SMA 1000 Series secure remote access appliances after confirming exploitation in the wild.","CVE-2026-15409 is a server-side request forgery vulnerability in the SMA 1000 Workplace interface with a CVSSv3 score of 10.","CVE-2026-15410 is a code injection vulnerability in the Appliance Management Console that can allow remote code execution and has a CVSSv3 score of 7.2.","The article states that the two vulnerabilities may be chained to create a fully remote, unauthenticated path to arbitrary operating system command execution on affected appliances.","SonicWall released fixed versions for SMA1000 models 6210, 7210, and 8200v, and CISA added both CVEs to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17."],"insights":["CISA set a remediation deadline of July 17 even though the vulnerabilities were added to the Known Exploited Vulnerabilities Catalog on July 14, indicating an unusually short patching window.","SonicWall’s advisory does not provide workarounds, so the article’s recommended response centers on applying fixed versions and reviewing indicators of compromise.","The article notes that no public proof-of-concept code was available at publication time, but warns that exploitation may increase if one becomes available.","Because SMA 1000 appliances sit directly on the internet and aggregate remote access credentials, the article emphasizes that compromise could expose administrator credentials, VPN session tokens, and internal network details.","The article places these flaws in a broader pattern by listing multiple previously exploited SonicWall SMA and SonicOS vulnerabilities from 2019 through 2025."],"referencedReports":[{"title":"SonicWall Security Advisory SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall","context":"The article cites SonicWall’s advisory as the disclosure source for the two exploited SMA 1000 vulnerabilities and notes that it provides patches and indicators of compromise.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article notes that CISA added CVE-2026-15409 and CVE-2026-15410 to its Known Exploited Vulnerabilities Catalog with a July 17 remediation date.","category":"","primary":false}],"body":"\u003cp\u003eSonicWall patched two recently exploited zero-day vulnerabilities in its SMA 1000 Series secure remote access appliances. The flaws are CVE-2026-15409, a server-side request forgery vulnerability with a CVSSv3 score of 10, and CVE-2026-15410, a remote code execution vulnerability with a CVSSv3 score of 7.2. SonicWall confirmed that exploitation of these vulnerabilities has been observed in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article states that while SonicWall’s advisory does not specify whether the flaws were exploited together, they may form a fully remote, unauthenticated path to arbitrary operating system command execution on affected appliances. CVE-2026-15409 affects the SMA 1000 Workplace interface and can allow a remote, unauthenticated attacker to make network requests to locations of the attacker’s choosing. CVE-2026-15410 is a code injection vulnerability in the Appliance Management Console, which normally requires authentication.\u003c/p\u003e\n\n\u003cp\u003eSMA 1000 appliances are internet-facing enterprise remote access gateways, and the article notes that a compromise could expose administrator credentials, VPN session tokens, and details about internal network architecture. SonicWall released fixed versions for SMA1000 models 6210, 7210, and 8200v, and the advisory includes indicators of compromise but no workarounds. CISA added both CVEs to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17, and the article recommends immediate patching.\u003c/p\u003e\n"},{"n":2,"title":"CISA warns admins to patch actively exploited SharePoint flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-admins-to-patch-actively-exploited-sharepoint-flaws/","time":"09:44","priority":"MUST READ","score":95,"tldr":"CISA is warning admins to urgently patch on-premises Microsoft SharePoint servers because attackers are actively exploiting three flaws to bypass authentication, execute code, steal IIS machine keys, and maintain persistence. Federal agencies must secure systems affected by the latest exploited flaw by July 17 or take them offline if they cannot be mitigated.","briefOverview":"\u003cp\u003eCISA warned that attackers are actively exploiting three vulnerabilities to hack Internet-exposed on-premises SharePoint Server instances. The flaws are tracked as CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164, and they affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition. CISA said attackers are using them to bypass authentication, gain remote code execution, and conduct post-exploitation activity.\u003c/p\u003e\n\n\u003cp\u003eThe reported post-exploitation activity includes stealing Internet Information Services machine keys, gaining persistence, and deploying malware on compromised systems. CISA also flagged two additional SharePoint Server vulnerabilities, CVE-2026-55040 and CVE-2026-58644, that Microsoft patched on Tuesday and described as attractive targets, though they are not yet known to be exploited in the wild. Shadowserver currently tracks nearly 10,000 Internet-exposed Microsoft SharePoint servers, with more than 800 unpatched against CVE-2026-32201 and CVE-2026-45659.\u003c/p\u003e\n\n\u003cp\u003eCISA urged security teams to apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, monitor affected servers, and enable AMSI integration for SharePoint web applications with Microsoft Defender Antivirus detections. Additional recommendations include hunting for and remediating intrusion artifacts before rotating IIS machine keys, limiting direct Internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind a Layer 7 reverse proxy or similar control where exposure is required. Federal agencies have until July 17 to secure SharePoint servers affected by CVE-2026-56164 under BOD 26-04 or discontinue them if mitigations cannot be applied.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that attackers are actively exploiting CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164 to hack Internet-exposed on-premises SharePoint Server instances.","The three actively exploited flaws affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition.","CISA said attackers are using the flaws to bypass authentication, gain remote code execution, steal Internet Information Services machine keys, gain persistence, and deploy malware on compromised systems.","Shadowserver currently tracks nearly 10,000 Internet-exposed Microsoft SharePoint servers, including more than 800 that are unpatched against CVE-2026-32201 and CVE-2026-45659.","CISA recommended applying Microsoft’s latest patches, verifying successful installation, shortening patching cycles, enabling AMSI integration for SharePoint web applications, using Microsoft Defender Antivirus detections, and reducing direct Internet exposure."],"insights":["CISA says teams should hunt for and remove intrusion artifacts before rotating IIS machine keys, indicating that key rotation alone may not be sufficient if attackers already have persistence or other footholds.","The latest actively exploited SharePoint flaw, CVE-2026-56164, has an unusually short federal remediation deadline, with agencies required to secure affected servers by July 17 or discontinue them if mitigations cannot be applied.","CISA highlighted two newly patched SharePoint flaws, CVE-2026-55040 and CVE-2026-58644, as attractive attacker targets even though they are not yet known to be exploited in the wild.","Shadowserver reports nearly 10,000 Internet-exposed SharePoint servers, but the article notes there are no details on how many are vulnerable to CVE-2026-56164 or are honeypots, leaving uncertainty around the true exposed risk for the newest exploited flaw.","CISA’s count of 11 exploited SharePoint vulnerabilities since November 2021, including 7 used in ransomware attacks, shows SharePoint has repeatedly been a target in real-world intrusions."],"referencedReports":[{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article cites CISA's Tuesday advisory as the source for details on active exploitation and recommended SharePoint hardening steps.","category":"","primary":false},{"title":"Security hardening for SharePoint Server","url":"https://learn.microsoft.com/en-us/sharepoint/security-for-sharepoint-server/security-hardening","publisher":"Microsoft","context":"The article recommends reviewing Microsoft's official SharePoint Server security-hardening guidance as part of additional defensive measures.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search=%22Microsoft%20SharePoint%22\u0026field_date_added_wrapper=all\u0026field_cve=\u0026sort_by=field_date_added\u0026items_per_page=All\u0026url=","publisher":"CISA","context":"The article references CISA's catalog to state that 11 Microsoft SharePoint vulnerabilities have been flagged as exploited since November 2021.","category":"","primary":false}],"body":"\u003cp\u003eCISA warned that attackers are actively exploiting three vulnerabilities to hack Internet-exposed on-premises SharePoint Server instances. The flaws are tracked as CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164, and they affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition. CISA said attackers are using them to bypass authentication, gain remote code execution, and conduct post-exploitation activity.\u003c/p\u003e\n\n\u003cp\u003eThe reported post-exploitation activity includes stealing Internet Information Services machine keys, gaining persistence, and deploying malware on compromised systems. CISA also flagged two additional SharePoint Server vulnerabilities, CVE-2026-55040 and CVE-2026-58644, that Microsoft patched on Tuesday and described as attractive targets, though they are not yet known to be exploited in the wild. Shadowserver currently tracks nearly 10,000 Internet-exposed Microsoft SharePoint servers, with more than 800 unpatched against CVE-2026-32201 and CVE-2026-45659.\u003c/p\u003e\n\n\u003cp\u003eCISA urged security teams to apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, monitor affected servers, and enable AMSI integration for SharePoint web applications with Microsoft Defender Antivirus detections. Additional recommendations include hunting for and remediating intrusion artifacts before rotating IIS machine keys, limiting direct Internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind a Layer 7 reverse proxy or similar control where exposure is required. Federal agencies have until July 17 to secure SharePoint servers affected by CVE-2026-56164 under BOD 26-04 or discontinue them if mitigations cannot be applied.\u003c/p\u003e\n"},{"n":19,"title":"Two SonicWall SMA 1000 Zero-Days Exploited, One Could Enable Admin Commands","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/two-sonicwall-sma-1000-zero-days.html","time":"05:30","priority":"MUST READ","score":95,"tldr":"SonicWall is warning that two actively exploited zero-days in SMA 1000 appliances can enable SSRF and, for authenticated attackers, administrator-level command execution. Customers should apply the available hotfixes immediately and investigate for listed indicators of compromise.","briefOverview":"\u003cp\u003eSonicWall warned that two zero-day vulnerabilities affecting Secure Mobile Access 1000 series appliances are being actively exploited. One flaw, CVE-2026-15409, is a server-side request forgery vulnerability with a CVSS score of 10.0. The other, CVE-2026-15410, is a post-authentication code injection vulnerability in the Appliance Management Console with a CVSS score of 7.2.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 could allow a remote unauthenticated attacker to cause the appliance to make requests to an unintended location. CVE-2026-15410 could allow a remote authenticated attacker to execute arbitrary operating system commands as administrator under certain conditions. SonicWall said it investigated multiple cases indicating active exploitation and urged customers to apply fixes as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePatches are available in versions 12.4.3-03453 and 12.5.0-02835 platform-hotfix and higher versions. SonicWall also urged users to perform forensic analysis for listed indicators of compromise, including suspicious log entries and illegitimate routes in /var/lib/unit/conf.json. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 17, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall warned that two zero-day vulnerabilities affecting SMA 1000 series appliances are being actively exploited.","CVE-2026-15409 is a server-side request forgery vulnerability with a CVSS score of 10.0 that can allow a remote unauthenticated attacker to cause the appliance to make requests to an unintended location.","CVE-2026-15410 is a post-authentication code injection vulnerability in the Appliance Management Console with a CVSS score of 7.2 that can allow a remote authenticated attacker to execute arbitrary operating system commands as administrator under certain conditions.","SonicWall released fixes in versions 12.4.3-03453 and 12.5.0-02835 platform-hotfix and higher versions, and urged customers to apply them as soon as possible.","CISA added CVE-2026-15409 and CVE-2026-15410 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 17, 2026."],"insights":["SonicWall’s recommended response goes beyond patching when indicators of compromise are found, including re-imaging or redeploying appliances, changing user and administrator passwords, and resetting time-based one-time password tokens.","The listed indicators point to specific log and configuration artifacts defenders can check, including unexpected /__api__/login or /__api__/logout entries, suspicious /wsproxy host parameters, hotfix rollback entries with path traversal names, and illegitimate routes in /var/lib/unit/conf.json.","The article notes that /__api__/login and /__api__/logout do not exist in legitimate configuration, making their presence in /var/lib/unit/conf.json a particularly clear sign of possible compromise.","CISA’s requirement for federal civilian agencies to apply fixes by July 17, 2026 gives affected U.S. government organizations only a short remediation window after the July 14 catalog addition."],"referencedReports":[{"title":"SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall","context":"The article cites SonicWall's vulnerability advisory as the source warning of active exploitation and listing fixes for the SMA 1000 vulnerabilities.","category":"","primary":false},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA's alert adding the two SonicWall flaws to the Known Exploited Vulnerabilities catalog and setting a federal remediation deadline.","category":"","primary":false}],"body":"\u003cp\u003eSonicWall warned that two zero-day vulnerabilities affecting Secure Mobile Access 1000 series appliances are being actively exploited. One flaw, CVE-2026-15409, is a server-side request forgery vulnerability with a CVSS score of 10.0. The other, CVE-2026-15410, is a post-authentication code injection vulnerability in the Appliance Management Console with a CVSS score of 7.2.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 could allow a remote unauthenticated attacker to cause the appliance to make requests to an unintended location. CVE-2026-15410 could allow a remote authenticated attacker to execute arbitrary operating system commands as administrator under certain conditions. SonicWall said it investigated multiple cases indicating active exploitation and urged customers to apply fixes as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePatches are available in versions 12.4.3-03453 and 12.5.0-02835 platform-hotfix and higher versions. SonicWall also urged users to perform forensic analysis for listed indicators of compromise, including suspicious log entries and illegitimate routes in /var/lib/unit/conf.json. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 17, 2026.\u003c/p\u003e\n"},{"n":5,"title":"AsyncAPI npm packages infected with credential-stealing malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/-asyncapi-npm-packages-infected-with-credential-stealing-malware/","time":"15:37","priority":"MUST READ","score":94,"tldr":"Attackers compromised AsyncAPI GitHub Actions workflows to publish five malicious npm package versions that installed credential-stealing remote access malware while still appearing to come from legitimate trusted releases. The packages have been removed, but anyone who installed them during the July 14 exposure window should remove payloads, regenerate lock files, and rotate credentials.","briefOverview":"\u003cp\u003eFive malicious versions of AsyncAPI packages were published to npm in a supply-chain attack that delivered a remote access trojan with information-stealing capabilities. The attacker exploited a misconfigured GitHub Actions workflow and pushed trojanized packages under the @asyncapi namespace. The affected packages had a cumulative weekly download count of more than 2.25 million.\u003c/p\u003e\n\n\u003cp\u003eSecurity companies said the incident involved CI/CD pipeline compromises rather than stolen npm tokens or malicious maintainers. Step Security reported that the attacker pushed commits under a placeholder git identity and let the repositories’ real release workflows publish the packages through npm’s GitHub OIDC trusted-publisher integration. This caused the resulting packages to carry legitimate SLSA provenance attestations, indicating they came from an authorized workflow.\u003c/p\u003e\n\n\u003cp\u003eThe malware used an obfuscated JavaScript implant to trigger a downloader, retrieved a second-stage script from IPFS, and launched it as a hidden process. Wiz described the third-stage payload as a 92,000-line modular malware framework that establishes persistence and communicates over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network. All five malicious versions have been removed from npm, but existing installations and lock files from the July 14 exposure window may still contain them, and recommended actions include pinning known-good files, regenerating lock files, removing the hidden NodeJS/sync.js payload, terminating malicious processes, and rotating credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five malicious versions of AsyncAPI packages were published to npm in a supply-chain attack that delivered a remote access trojan with information-stealing capabilities.","The attacker exploited a misconfigured GitHub Actions workflow, compromised two AsyncAPI GitHub repositories on July 14, and used the legitimate release workflow with npm’s GitHub OIDC trusted-publisher integration to publish the packages.","The malicious packages were @asyncapi/generator 3.3.1, @asyncapi/generator-helpers 1.1.1, @asyncapi/generator-components 0.7.1, and @asyncapi/specs 6.11.2-alpha.1 and 6.11.2.","The final payload establishes persistence, communicates with command-and-control servers over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network, and appears intended to steal credentials, tokens, browser data, CI/CD secrets, AI developer tool data, cryptocurrency wallets, and database information.","All five malicious package versions have been removed from npm, but existing installations and lock files created during the July 14 exposure window may still contain the malicious releases."],"insights":["The malicious packages carried legitimate SLSA provenance attestations because the attacker used the real release workflow, showing that trusted publishing signals did not guarantee the package contents were safe in this incident.","The article says the compromise came from CI/CD pipeline abuse rather than stolen npm tokens or malicious maintainers, making the GitHub Actions workflow configuration a central remediation focus.","Removing the malicious versions from npm does not fully eliminate risk because existing installations and lock files created during the exposure window may still reference or contain the bad releases.","Aikido reported that the malware’s automated data-harvesting functions did not work and exited before collecting data, but the same access could still be used manually through the shell.","The malware included a local check for Russia and terminated its process if there was a match."],"referencedReports":[{"title":"Compromised next branch pushes malicious AsyncAPI generator, generator-helpers, and generator-components to npm","url":"http://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","publisher":"Step Security","context":"The article cites Step Security’s report to explain that the incident was a CI/CD pipeline compromise rather than stolen npm tokens or malicious maintainers.","category":"","primary":false},{"title":"AsyncAPI Supply Chain Attack","url":"https://socket.dev/blog/asyncapi-supply-chain-attack#Stage-1:-Primary-implant-in-the-published-packages","publisher":"Socket","context":"The article cites Socket’s analysis for details on the first-stage obfuscated JavaScript implant and downloader behavior in the published packages.","category":"","primary":false},{"title":"M-Red Team AsyncAPI Supply Chain Compromise via GitHub Actions","url":"https://www.wiz.io/blog/m-red-team-asyncapi-supply-chain-compromise-via-github-actions","publisher":"Wiz","context":"The article cites Wiz’s analysis for details about the third-stage payload, its modular architecture, persistence, and command-and-control channels.","category":"","primary":false},{"title":"AsyncAPI Generator Supply Chain Attack Miasma RAT","url":"https://safedep.io/asyncapi-generator-supply-chain-attack-miasma-rat/","publisher":"SafeDep","context":"The article cites SafeDep researchers for their assessment that the malware may be a private parallel Miasma build or a separate group using the Miasma brand.","category":"","primary":false},{"title":"AsyncAPI npm packages backdoored via GitHub Actions","url":"https://www.aikido.dev/blog/asyncapi-npm-packages-backdoored-via-github-actions","publisher":"Aikido","context":"The article cites Aikido’s report for the finding that the malware’s data-harvesting functions did not work and exited before collecting data.","category":"","primary":false},{"title":"AsyncAPI npm organization compromised: 2M weekly downloads affected","url":"https://www.ox.security/blog/asyncapi-npm-organization-compromised-2m-weekly-downloads-affected/","publisher":"Ox Security","context":"The article cites Ox Security’s analysis for the observation that the malware checks whether it is running in Russia and terminates if it finds a match.","category":"","primary":false}],"body":"\u003cp\u003eFive malicious versions of AsyncAPI packages were published to npm in a supply-chain attack that delivered a remote access trojan with information-stealing capabilities. The attacker exploited a misconfigured GitHub Actions workflow and pushed trojanized packages under the @asyncapi namespace. The affected packages had a cumulative weekly download count of more than 2.25 million.\u003c/p\u003e\n\n\u003cp\u003eSecurity companies said the incident involved CI/CD pipeline compromises rather than stolen npm tokens or malicious maintainers. Step Security reported that the attacker pushed commits under a placeholder git identity and let the repositories’ real release workflows publish the packages through npm’s GitHub OIDC trusted-publisher integration. This caused the resulting packages to carry legitimate SLSA provenance attestations, indicating they came from an authorized workflow.\u003c/p\u003e\n\n\u003cp\u003eThe malware used an obfuscated JavaScript implant to trigger a downloader, retrieved a second-stage script from IPFS, and launched it as a hidden process. Wiz described the third-stage payload as a 92,000-line modular malware framework that establishes persistence and communicates over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network. All five malicious versions have been removed from npm, but existing installations and lock files from the July 14 exposure window may still contain them, and recommended actions include pinning known-good files, regenerating lock files, removing the hidden NodeJS/sync.js payload, terminating malicious processes, and rotating credentials.\u003c/p\u003e\n"},{"n":14,"title":"Microsoft smashes Patch Tuesday record for second successive month","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-vulnerabilities-patch-tuesday-release","time":"12:15","priority":"MUST READ","score":94,"tldr":"Microsoft’s July Patch Tuesday fixed a record 622 vulnerabilities, including two already exploited flaws in SharePoint Server and Active Directory Federation Services. The surge underscores rapidly growing vulnerability volumes, likely aided by AI-assisted discovery, while defenders face harder triage due to Microsoft’s less detailed update guide.","briefOverview":"\u003cp\u003eMicrosoft released fixes for more than 600 security vulnerabilities in July, making it the largest Patch Tuesday in the program’s history. The 622 CVEs are more than triple the size of the previous record set last month and larger than the three previous months combined. Microsoft’s Security Update Guide no longer lists the individual CVEs in the batch, instead showing counts by product family and a “Notable CVEs” section, while individual advisories remain available separately.\u003c/p\u003e\n\n\u003cp\u003eThe article says vulnerability counts have been rising rapidly, with Microsoft and analysts suggesting AI-assisted tools are contributing to the trend. Rapid7’s Adam Barnett described the surge as part of an industry-wide increase in vulnerability report counts and remediation publication. Jerry Gamblin noted that while published vulnerability volumes have “gone vertical,” confirmed exploitation has not risen at the same pace, with 85 of more than 35,000 CVEs from the first half of the year appearing in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said two July flaws are already being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. A separate SharePoint issue, CVE-2026-55040, was described by Rapid7 as the first half of an exploit chain leading to unauthenticated remote code execution, with the second vulnerability expected to be patched in August. The release also addressed CVE-2026-50661, a publicly disclosed BitLocker security feature bypass, while new proof-of-concept activity from Nightmare Eclipse continued around other Windows flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released fixes for more than 600 security vulnerabilities in July, making it the largest Patch Tuesday in the program's history and more than triple the previous record set last month.","Microsoft's Security Update Guide no longer lists the individual CVEs in the Patch Tuesday batch, instead showing a summary table by product family and a “Notable CVEs” section, while individual advisories remain available separately.","Microsoft said two flaws patched this month are being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services.","Rapid7 said CVE-2026-55040 is the first half of an exploit chain that leads to unauthenticated remote code execution against a vulnerable SharePoint server, with the second vulnerability expected to be patched in August.","The article says Microsoft and analysts have linked rising vulnerability volumes to AI-assisted tools, while Jerry Gamblin noted that exploited vulnerabilities have not risen at the same pace as published CVEs."],"insights":["Microsoft’s shift from listing every Patch Tuesday CVE to providing only summarized counts may make prioritization harder for defenders and third-party trackers because they now have to reconstruct the full picture from separate advisory feeds.","The record-breaking number of published vulnerabilities does not appear to be matched by a similar rise in confirmed exploitation, as only 85 of more than 35,000 CVEs published in the first half of the year were in CISA’s Known Exploited Vulnerabilities catalog.","One SharePoint issue patched this month may still leave organizations exposed to a fuller attack chain because Rapid7 said the second vulnerability needed for unauthenticated remote code execution remains embargoed until an expected August patch.","Microsoft rated the actively exploited SharePoint flaw CVE-2026-56164 as only “Important” with a CVSS score of 5.3, showing that real-world exploitation can affect flaws that are not assigned the highest severity rating."],"referencedReports":[{"title":"Patch Tuesday - July 2026","url":"https://www.rapid7.com/blog/post/em-patch-tuesday-july-2026/","publisher":"Rapid7","context":"The article cites Rapid7’s Adam Barnett discussing the surge in vulnerability report counts and uses Rapid7 analysis for details on several July Patch Tuesday issues.","category":"","primary":false},{"title":"Jerry Gamblin analysis of CVE and KEV trends","url":"https://jgamblin.com/2026/07/01/3528/","publisher":"Jerry Gamblin","context":"The article cites Jerry Gamblin’s analysis noting that published vulnerability counts have risen sharply while confirmed exploited vulnerabilities have not risen at the same pace.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released fixes for more than 600 security vulnerabilities in July, making it the largest Patch Tuesday in the program’s history. The 622 CVEs are more than triple the size of the previous record set last month and larger than the three previous months combined. Microsoft’s Security Update Guide no longer lists the individual CVEs in the batch, instead showing counts by product family and a “Notable CVEs” section, while individual advisories remain available separately.\u003c/p\u003e\n\n\u003cp\u003eThe article says vulnerability counts have been rising rapidly, with Microsoft and analysts suggesting AI-assisted tools are contributing to the trend. Rapid7’s Adam Barnett described the surge as part of an industry-wide increase in vulnerability report counts and remediation publication. Jerry Gamblin noted that while published vulnerability volumes have “gone vertical,” confirmed exploitation has not risen at the same pace, with 85 of more than 35,000 CVEs from the first half of the year appearing in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said two July flaws are already being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. A separate SharePoint issue, CVE-2026-55040, was described by Rapid7 as the first half of an exploit chain leading to unauthenticated remote code execution, with the second vulnerability expected to be patched in August. The release also addressed CVE-2026-50661, a publicly disclosed BitLocker security feature bypass, while new proof-of-concept activity from Nightmare Eclipse continued around other Windows flaws.\u003c/p\u003e\n"},{"n":22,"title":"Researcher Drops New Windows Zero-Day PoC Hours After Microsoft Patch Tuesday","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-drops-new-windows-zero-day.html","time":"11:07","priority":"MUST READ","score":94,"tldr":"A researcher released a stripped-down PoC for LegacyHive, a Windows User Profile Service privilege-escalation zero-day that still works on fully patched supported Windows systems after July 2026 Patch Tuesday. The disclosure adds pressure on Microsoft amid active exploitation of newly patched SharePoint Server and ADFS flaws.","briefOverview":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive. The issue is described as a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability. The PoC requires another standard user credential and a third username, which can be an administrator account, and can mount the target user hive in the current user classes root if successful.\u003c/p\u003e\n\n\u003cp\u003eChaotic Eclipse said the released exploit was stripped down to prevent public exploitation, while the original exploit did not require additional user credentials and was not limited to the usrclass.dat hive. The article says the vulnerability is notable because it works on all supported desktop and server versions of Windows, including systems running the latest July 2026 Patch Tuesday update. The disclosure comes amid an ongoing dispute between Chaotic Eclipse and Microsoft over earlier public exploit releases.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights Microsoft’s July 2026 Patch Tuesday, which addressed a record 622 flaws. CISA added actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services to its Known Exploited Vulnerabilities catalog. CISA also warned of active exploitation of multiple SharePoint Server flaws affecting supported on-premises versions, involving unauthorized access, remote code execution, and post-exploitation activity such as stealing IIS machine keys and using deserialization techniques.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive for a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability.","The LegacyHive proof-of-concept requires another standard user credential and a third username, and if successful it mounts the target user hive in the current user classes root.","Chaotic Eclipse said the released exploit was stripped down to prevent public exploitation, while the original exploit did not require additional user credentials and was not limited to the usrclass.dat hive.","The article states that LegacyHive works on all supported desktop and server versions of Windows, including systems running the latest July 2026 Patch Tuesday update.","Microsoft’s July 2026 Patch Tuesday addressed a record 622 flaws, including actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services that CISA added to its Known Exploited Vulnerabilities catalog."],"insights":["LegacyHive is especially notable because it remained functional immediately after Microsoft’s July 2026 Patch Tuesday, meaning the latest available Windows updates did not address the issue described by the researcher.","The public LegacyHive release appears intentionally limited, since Chaotic Eclipse said the original exploit did not require extra user credentials and was not restricted to the usrclass.dat hive.","Microsoft is facing pressure from both unpatched public disclosures and active exploitation of patched flaws, with the article describing an ongoing dispute with Chaotic Eclipse alongside CISA warnings about exploited SharePoint Server and ADFS vulnerabilities.","CISA’s SharePoint warning highlights that attackers are not only gaining unauthorized access but also using post-exploitation activity such as stealing IIS machine keys and deserialization techniques to maintain persistence and deploy malware."],"referencedReports":[{"title":"LegacyHive Public Disclosure","url":"https://blog.projectnightcrawler.dev/posts/2026-07-14-legacyhive-public-disclosure/","publisher":"Project Nightcrawler / Chaotic Eclipse","context":"The article cites this public disclosure as the source for the LegacyHive proof-of-concept exploit release.","category":"","primary":false},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references this CISA alert for the addition of exploited SharePoint Server and Active Directory Federation Services vulnerabilities to the KEV catalog.","category":"","primary":false},{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article cites this CISA advisory about active exploitation of multiple SharePoint Server flaws and recommended hardening.","category":"","primary":false},{"title":"CVE-2026-55040 Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article references Rapid7’s analysis describing issues in the SharePoint JWT token validation pipeline for CVE-2026-55040.","category":"","primary":false},{"title":"CVE-2026-55040","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-55040","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s vulnerability entry for the critical SharePoint Server security feature bypass flaw addressed in the July 2026 update.","category":"","primary":false}],"body":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive. The issue is described as a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability. The PoC requires another standard user credential and a third username, which can be an administrator account, and can mount the target user hive in the current user classes root if successful.\u003c/p\u003e\n\n\u003cp\u003eChaotic Eclipse said the released exploit was stripped down to prevent public exploitation, while the original exploit did not require additional user credentials and was not limited to the usrclass.dat hive. The article says the vulnerability is notable because it works on all supported desktop and server versions of Windows, including systems running the latest July 2026 Patch Tuesday update. The disclosure comes amid an ongoing dispute between Chaotic Eclipse and Microsoft over earlier public exploit releases.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights Microsoft’s July 2026 Patch Tuesday, which addressed a record 622 flaws. CISA added actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services to its Known Exploited Vulnerabilities catalog. CISA also warned of active exploitation of multiple SharePoint Server flaws affecting supported on-premises versions, involving unauthorized access, remote code execution, and post-exploitation activity such as stealing IIS machine keys and using deserialization techniques.\u003c/p\u003e\n"},{"n":46,"title":"UK Cybercrime Journal: University of Nottingham Breached by ShinyHunters","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/07/uk-cybercrime-journal-university-of.html","time":"08:00","priority":"MUST READ","score":94,"tldr":"ShinyHunters breached the University of Nottingham and leaked more than 40GB of sensitive student, finance, and personal data, including over 455,000 unique email addresses. The incident appears tied to a wider campaign exploiting a critical Oracle PeopleSoft zero-day, with education institutions heavily targeted.","briefOverview":"\u003cp\u003eOn 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site. The attackers leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses. The stolen data included contact information, transaction amounts, IP addresses, full names, home addresses, postcodes, email addresses, phone numbers, dates of birth, and other internal campus data.\u003c/p\u003e\n\n\u003cp\u003eHave I Been Pwned analysis found the leaked data contained over 455,000 unique email addresses, along with personal information including ethnicities, disabilities, and passport numbers. On 11 June 2026, Mandiant and Google Threat Intelligence Group disclosed an active compromise and extortion campaign attributed to UNC6240, also known as ShinyHunters, targeting Oracle PeopleSoft application infrastructure. The campaign used a critical remote code execution vulnerability tracked as CVE-2026-35273, and Google identified over 100 exposed organizations, 68% of which were academic institutions.\u003c/p\u003e\n\n\u003cp\u003eThe article says ShinyHunters has been a prolific threat actor with a focus on the education sector, noting that it targeted Instructure Canvas in May 2026 and that other UK universities were affected by that breach. It also places the Nottingham incident alongside other education-sector breaches involving PowerSchools, the University of Oxford, and schools in Powys county in Wales. The defensive takeaways include patching Oracle PeopleSoft, checking system integrity while patching, threat hunting for suspicious activity, sharing threat intelligence, rotating credentials, requesting replacement identity documents where needed, and considering credit monitoring.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site.","ShinyHunters leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses.","Have I Been Pwned analysis found the leaked data contained over 455,000 unique email addresses along with personal information including ethnicities, disabilities, and passport numbers.","Mandiant and Google Threat Intelligence Group attributed an active compromise and extortion campaign targeting Oracle PeopleSoft application infrastructure to UNC6240, also known as ShinyHunters.","The campaign used a critical Oracle PeopleSoft remote code execution vulnerability tracked as CVE-2026-35273, according to Mandiant and Google Threat Intelligence Group."],"insights":["Google identified more than 100 exposed organizations in the Oracle PeopleSoft campaign, and 68% were academic institutions, indicating that education organizations should treat exposed PeopleSoft systems as an urgent priority.","The discovery of MeshCentral agents on ShinyHunters infrastructure shows defenders should look for remote management tooling as part of investigations into suspected PeopleSoft compromise.","The article emphasizes checking system integrity while patching, because applying updates alone may not reveal compromises that already occurred before remediation.","The leaked data included highly sensitive identity attributes such as passport numbers, ethnicities, and disabilities, making the breach response more complex than simple password resets."],"referencedReports":[{"title":"ShinyHunters Targets Education Sector via Oracle Exploit","url":"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit","publisher":"Mandiant and Google Threat Intelligence Group","context":"The article cites this disclosure for the active compromise and extortion campaign attributed to UNC6240/ShinyHunters targeting Oracle PeopleSoft infrastructure via CVE-2026-35273.","category":"","primary":false},{"title":"Oracle E-Business Suite Zero-Day Exploitation","url":"https://cloud.google.com/blog/topics/threat-intelligence/oracle-ebusiness-suite-zero-day-exploitation/","publisher":"Google Threat Intelligence Group","context":"The article references this prior analysis when comparing the ShinyHunters Oracle PeopleSoft campaign with an earlier CLOP campaign against Oracle E-Business Suite.","category":"","primary":false}],"body":"\u003cp\u003eOn 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site. The attackers leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses. The stolen data included contact information, transaction amounts, IP addresses, full names, home addresses, postcodes, email addresses, phone numbers, dates of birth, and other internal campus data.\u003c/p\u003e\n\n\u003cp\u003eHave I Been Pwned analysis found the leaked data contained over 455,000 unique email addresses, along with personal information including ethnicities, disabilities, and passport numbers. On 11 June 2026, Mandiant and Google Threat Intelligence Group disclosed an active compromise and extortion campaign attributed to UNC6240, also known as ShinyHunters, targeting Oracle PeopleSoft application infrastructure. The campaign used a critical remote code execution vulnerability tracked as CVE-2026-35273, and Google identified over 100 exposed organizations, 68% of which were academic institutions.\u003c/p\u003e\n\n\u003cp\u003eThe article says ShinyHunters has been a prolific threat actor with a focus on the education sector, noting that it targeted Instructure Canvas in May 2026 and that other UK universities were affected by that breach. It also places the Nottingham incident alongside other education-sector breaches involving PowerSchools, the University of Oxford, and schools in Powys county in Wales. The defensive takeaways include patching Oracle PeopleSoft, checking system integrity while patching, threat hunting for suspicious activity, sharing threat intelligence, rotating credentials, requesting replacement identity documents where needed, and considering credit monitoring.\u003c/p\u003e\n"},{"n":3,"title":"Zoom warns of critical account takeover vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/zoom-warns-of-critical-account-takeover-vulnerability/","time":"20:16","priority":"MUST READ","score":93,"tldr":"Zoom patched a critical Windows flaw, CVE-2026-53412, that could let unauthenticated attackers take over accounts via network access. Users should update Zoom Workplace, VDI Client, and Meeting SDK for Windows immediately.","briefOverview":"\u003cp\u003eZoom is warning of a critical vulnerability in its desktop client and software development kit for Windows that could be exploited by an unauthenticated party to hijack accounts. The flaw was discovered internally, is tracked as CVE-2026-53412, and has a severity score of 9.8 out of 10. Zoom described it as an improper input validation issue that may allow account takeover via network access.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Zoom Workplace for Windows before version 7.0.0, the Windows VDI Client before versions 7.0.10, 6.6.15, and 6.5.18, and the Meeting SDK for Windows before version 7.0.0. Zoom Workplace is a widely used desktop collaboration application for meetings, chat, VoIP phone calls, calendar, email, document collaboration, whiteboards, and AI-powered productivity features. The company recommends applying the latest updates to mitigate the risk.\u003c/p\u003e\n\n\u003cp\u003eZoom’s latest security patches also fix three high-severity flaws tracked as CVE-2026-53410, CVE-2026-53409, and CVE-2026-53411. These issues affect several Windows Zoom products and could allow authenticated local users to escalate privileges. At the time of disclosure, there were no indications that any of the vulnerabilities fixed by Zoom were being exploited in attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zoom warned of a critical improper input validation vulnerability, tracked as CVE-2026-53412, in its desktop client and software development kit for Windows.","CVE-2026-53412 has a severity score of 9.8 out of 10 and may allow an unauthenticated user to conduct an account takeover via network access.","The flaw affects Zoom Workplace for Windows before version 7.0.0, the Windows VDI Client before versions 7.0.10, 6.6.15, and 6.5.18, and the Meeting SDK for Windows before version 7.0.0.","Zoom recommends that users apply the latest updates to mitigate the risks from CVE-2026-53412.","Zoom’s latest security patches also address three high-severity Windows-related flaws tracked as CVE-2026-53410, CVE-2026-53409, and CVE-2026-53411, and there are no indications at disclosure that any fixed vulnerabilities are being exploited."],"insights":["Because the critical account takeover flaw requires only network access and no authentication, updating exposed or widely used Windows Zoom clients is more urgent than flaws that require local access.","Zoom did not publish technical details beyond describing CVE-2026-53412 as improper input validation, so defenders may have limited information to assess exposure beyond checking affected product versions.","Organizations using Zoom’s VDI products need to check multiple fixed version branches, since the advisory lists different patched versions for the Windows VDI Client.","The same patch cycle fixes both remote account takeover risk and several local privilege escalation issues, making it important to update more than just the standard Zoom Workplace desktop client."],"referencedReports":[{"title":"ZSB-26014","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26014/","publisher":"Zoom","context":"The article cites Zoom's security advisory for CVE-2026-53412, which describes the improper input validation issue and account takeover risk.","category":"","primary":false},{"title":"ZSB-26012","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26012/","publisher":"Zoom","context":"The article links to Zoom's advisory for CVE-2026-53410, a high-severity TOCTOU race condition addressed in the latest patches.","category":"","primary":false},{"title":"ZSB-26011","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26011/","publisher":"Zoom","context":"The article links to Zoom's advisory for CVE-2026-53409, a high-severity improper privilege management flaw affecting Zoom Rooms for Windows.","category":"","primary":false},{"title":"ZSB-26013","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26013/","publisher":"Zoom","context":"The article links to Zoom's advisory for CVE-2026-53411, a high-severity improper input validation flaw affecting the Zoom Workplace VDI Plugin for Windows.","category":"","primary":false}],"body":"\u003cp\u003eZoom is warning of a critical vulnerability in its desktop client and software development kit for Windows that could be exploited by an unauthenticated party to hijack accounts. The flaw was discovered internally, is tracked as CVE-2026-53412, and has a severity score of 9.8 out of 10. Zoom described it as an improper input validation issue that may allow account takeover via network access.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Zoom Workplace for Windows before version 7.0.0, the Windows VDI Client before versions 7.0.10, 6.6.15, and 6.5.18, and the Meeting SDK for Windows before version 7.0.0. Zoom Workplace is a widely used desktop collaboration application for meetings, chat, VoIP phone calls, calendar, email, document collaboration, whiteboards, and AI-powered productivity features. The company recommends applying the latest updates to mitigate the risk.\u003c/p\u003e\n\n\u003cp\u003eZoom’s latest security patches also fix three high-severity flaws tracked as CVE-2026-53410, CVE-2026-53409, and CVE-2026-53411. These issues affect several Windows Zoom products and could allow authenticated local users to escalate privileges. At the time of disclosure, there were no indications that any of the vulnerabilities fixed by Zoom were being exploited in attacks.\u003c/p\u003e\n"},{"n":17,"title":"Compromised AsyncAPI npm Packages Deliver Multi-Stage Botnet Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/compromised-asyncapi-npm-packages.html","time":"09:16","priority":"MUST READ","score":92,"tldr":"Compromised @asyncapi npm packages were used to deliver a multi-stage botnet loader that downloads the Miasma payload from IPFS and can steal credentials, persist, move laterally, and spread through package registries. The attackers abused legitimate GitHub Actions publishing workflows with valid provenance, so affected systems should be treated as potentially compromised if the poisoned modules were loaded.","briefOverview":"\u003cp\u003eFour compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, according to findings from OX Security, SafeDep, Socket, and StepSecurity. The affected versions were @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1. All five malicious versions have since been unpublished from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages contained a hidden JavaScript implant that decoded to the same second-stage downloader. Unlike earlier cases that used install hooks, this malicious code ran when the infected module was loaded by Node.js, then launched a detached background node that downloaded and executed malware from IPFS. The next-stage payload was an encrypted JavaScript loader named \u0026ldquo;sync.js,\u0026rdquo; which decoded to the Miasma tasking framework and included support for multiple command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eThe Miasma framework supported HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract, and the article says it could facilitate credential theft, AI tool poisoning, LAN lateral movement, worm-like propagation, and persistence across several operating systems. StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows with npm’s GitHub OIDC trusted-publisher integration, rather than stealing an npm token. The article advises treating any endpoint that imported or executed one of the affected package versions as potentially compromised, while noting that exposure depends on whether the infected module was loaded during a build or developer workflow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Four compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, affecting @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1.","The poisoned packages contained a hidden JavaScript implant that executed when the infected module was loaded by Node.js, not through npm install hooks.","The implant downloaded an encrypted second-stage JavaScript loader named sync.js from IPFS, which decoded to the Miasma tasking framework.","The Miasma framework supported six command-and-control communication channels: HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract.","StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows to publish the packages with valid OIDC provenance attestations, rather than stealing an npm token."],"insights":["Valid SLSA provenance attestations did not mean the packages were safe, because they only showed that an authorized GitHub Actions workflow published them, not that the commits triggering the workflow were legitimate.","Organizations should assess whether the poisoned modules were actually loaded during builds or developer workflows, because the malware did not run at npm install time.","Revoking a stolen token could trigger the malware’s dead man’s switch to wipe directories, according to the article’s description of its behavior.","The malware avoided running on systems with Russian language settings or with several named security tools installed, which could reduce visibility in some analysis and monitoring environments.","Although the code contained the Miasma string and resembled earlier Shai-Hulud and Miasma campaigns, OX Security stated that it was not attributed to those prior campaigns."],"referencedReports":[{"title":"AsyncAPI npm Organization Compromised: 2M Weekly Downloads Affected","url":"https://www.ox.security/blog/asyncapi-npm-organization-compromised-2m-weekly-downloads-affected/","publisher":"OX Security","context":"The article cites OX Security as one of the entities whose findings documented compromised @asyncapi npm packages distributing a multi-stage botnet loader.","category":"","primary":false},{"title":"AsyncAPI Generator Supply Chain Attack: Miasma RAT","url":"https://safedep.io/asyncapi-generator-supply-chain-attack-miasma-rat/","publisher":"SafeDep","context":"The article cites SafeDep as one of the entities whose findings described the AsyncAPI package compromise and Miasma-related payload.","category":"","primary":false},{"title":"AsyncAPI Supply Chain Attack","url":"https://socket.dev/blog/asyncapi-supply-chain-attack","publisher":"Socket","context":"The article cites Socket’s findings and quotes its description of the compromised packages deploying an obfuscated first-stage payload that downloads an encrypted Miasma payload from IPFS.","category":"","primary":false},{"title":"Compromised Next Branch Pushes Malicious AsyncAPI Generator, Generator Helpers, and Generator Components to npm","url":"https://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","publisher":"StepSecurity","context":"The article cites StepSecurity’s analysis that the attacker gained repository push access and used legitimate GitHub Actions release workflows to publish the malicious packages.","category":"","primary":false}],"body":"\u003cp\u003eFour compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, according to findings from OX Security, SafeDep, Socket, and StepSecurity. The affected versions were @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1. All five malicious versions have since been unpublished from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages contained a hidden JavaScript implant that decoded to the same second-stage downloader. Unlike earlier cases that used install hooks, this malicious code ran when the infected module was loaded by Node.js, then launched a detached background node that downloaded and executed malware from IPFS. The next-stage payload was an encrypted JavaScript loader named \u0026ldquo;sync.js,\u0026rdquo; which decoded to the Miasma tasking framework and included support for multiple command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eThe Miasma framework supported HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract, and the article says it could facilitate credential theft, AI tool poisoning, LAN lateral movement, worm-like propagation, and persistence across several operating systems. StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows with npm’s GitHub OIDC trusted-publisher integration, rather than stealing an npm token. The article advises treating any endpoint that imported or executed one of the affected package versions as potentially compromised, while noting that exposure depends on whether the infected module was loaded during a build or developer workflow.\u003c/p\u003e\n"},{"n":34,"title":"Thousands of compromised websites abused by DriveSurge in active ClickFix and FakeUpdates campaigns","source":"techradar.com","sourceColorIdx":2,"link":"https://www.techradar.com/pro/security/thousands-of-compromised-websites-abused-by-drivesurge-in-active-clickfix-and-fakeupdates-campaigns#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=thousands-of-compromised-websites-abused-by-drivesurge-in-active-clickfix-and-fakeupdates-campaigns","time":"08:29","priority":"MUST READ","score":92,"tldr":"DriveSurge is abusing thousands of compromised websites to run active ClickFix and FakeUpdates campaigns, tricking visitors into installing malware through fake browser or update prompts. The key takeaway is that legitimate-looking compromised sites are being used at scale to deliver social-engineering malware attacks.","briefOverview":"\u003cp\u003eThe article reports that thousands of compromised websites are being abused by DriveSurge. The activity is described as active at the time of the article. The campaigns named in the article are ClickFix and FakeUpdates.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the report is the scale of the website abuse, with thousands of sites involved. The affected parties include the compromised websites being used in the campaigns. The key technical detail provided is that the activity is tied to the ClickFix and FakeUpdates campaign names.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thousands of compromised websites are being abused in active campaigns.","DriveSurge is identified as the actor abusing the compromised websites.","The campaigns are identified as ClickFix and FakeUpdates campaigns."],"insights":["DriveSurge is linked to both ClickFix and FakeUpdates activity, indicating the same named actor is associated with multiple active campaign types.","The abuse involves thousands of compromised websites, making the website compromise itself a major part of the campaign rather than an isolated delivery method.","Because the campaigns are described as active, the activity was ongoing at the time of the article rather than only a historical finding."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that thousands of compromised websites are being abused by DriveSurge. The activity is described as active at the time of the article. The campaigns named in the article are ClickFix and FakeUpdates.\u003c/p\u003e\n\n\u003cp\u003eThe significance of the report is the scale of the website abuse, with thousands of sites involved. The affected parties include the compromised websites being used in the campaigns. The key technical detail provided is that the activity is tied to the ClickFix and FakeUpdates campaign names.\u003c/p\u003e\n"},{"n":40,"title":"Emerging Threat: (CVE-2026-56164) SharePoint Server Privilege Escalation via Missing Authentication","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-56164-sharepoint-server-privilege-escalation-via-missing-authentication/","time":"11:01","priority":"MUST READ","score":92,"tldr":"CVE-2026-56164 is a zero-day privilege escalation flaw in on-premises Microsoft SharePoint Server that Microsoft says is being exploited in the wild, making internet-facing farms a priority despite its Moderate rating. Organizations should apply the SharePoint-specific July 2026 patches, verify exposure, and treat unsupported SharePoint 2016/2019 deployments as high-risk.","briefOverview":"\u003cp\u003eCVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function. An unauthenticated attacker can exploit it over a network without credentials or user interaction. Microsoft assigned it a CVSS v3.1 base score of 5.3 and rates it Moderate, but the article notes that Microsoft confirmed exploitation in the wild and that it was disclosed as a zero-day.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope. The article describes affected assets as internet-facing SharePoint farms such as collaboration portals, document stores, intranet gateways, or extranet sites running IIS and exposed to untrusted networks. It also notes that SharePoint Server 2016 and 2019 reached the end of extended support on July 14, 2026, with no paid extended security update program.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, and the article emphasizes that SharePoint must be patched through its own servicing process rather than only through Windows cumulative updates. Recommended actions include inventorying internet-facing SharePoint instances, enabling AMSI integration in Full Mode, setting Request Body Scan mode to Full, restricting access, reviewing IIS and SharePoint logs, and rotating IIS machine keys on farms suspected of compromise. CyCognito says it published an Emerging Threat Advisory for the vulnerability in its platform and is researching enhanced detection capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function.","Microsoft assigned CVE-2026-56164 a CVSS v3.1 base score of 5.3 and rates it Moderate, but confirmed it has been exploited in the wild and was disclosed as a zero-day.","The vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope.","Microsoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, and the article states that installing the Windows cumulative update alone does not patch a SharePoint farm.","The article recommends that defenders inventory internet-facing SharePoint Server instances, enable AMSI integration in Full Mode, restrict network access, review IIS and SharePoint logs, and rotate IIS machine keys on farms suspected of compromise."],"insights":["The article argues that the Moderate CVSS rating is not the main risk signal because Microsoft confirmed in-the-wild exploitation and the flaw was disclosed as a zero-day.","The discovery credit to Mandiant incident responders and Google’s FLARE team is presented as an indicator that the flaw was likely found during active incident response rather than routine research.","The article highlights that SharePoint Server 2016 and 2019 reached end of extended support on the same day the fix shipped, leaving organizations still using those versions without a paid extended security update fallback.","A SharePoint farm may remain vulnerable even after normal Windows patching because the article states that SharePoint updates must be applied through SharePoint’s own servicing process.","The exposure pattern suggests ownership problems rather than a sector-specific issue, with old SharePoint farms often outliving the teams or projects that created them."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function. An unauthenticated attacker can exploit it over a network without credentials or user interaction. Microsoft assigned it a CVSS v3.1 base score of 5.3 and rates it Moderate, but the article notes that Microsoft confirmed exploitation in the wild and that it was disclosed as a zero-day.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope. The article describes affected assets as internet-facing SharePoint farms such as collaboration portals, document stores, intranet gateways, or extranet sites running IIS and exposed to untrusted networks. It also notes that SharePoint Server 2016 and 2019 reached the end of extended support on July 14, 2026, with no paid extended security update program.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, and the article emphasizes that SharePoint must be patched through its own servicing process rather than only through Windows cumulative updates. Recommended actions include inventorying internet-facing SharePoint instances, enabling AMSI integration in Full Mode, setting Request Body Scan mode to Full, restricting access, reviewing IIS and SharePoint logs, and rotating IIS machine keys on farms suspected of compromise. CyCognito says it published an Emerging Threat Advisory for the vulnerability in its platform and is researching enhanced detection capabilities.\u003c/p\u003e\n"},{"n":37,"title":"TELEPUZ: a modular MaaS malware spreading via CLICKFIX-VIDAR chains","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/telepuz-maas-malware-clickfix","time":"00:00","priority":"MUST READ","score":90,"tldr":"Elastic Security Labs identified TELEPUZ, a fast-evolving modular malware likely offered as MaaS, spreading through CLICKFIX-VIDAR chains and using WebSocket C2, persistence, UAC bypass, evasion, credential theft, keylogging, and web-injection modules. Its active development and growing VirusTotal submissions suggest the threat is likely to expand despite currently limited C2 infrastructure.","briefOverview":"\u003cp\u003eElastic Security Labs is tracking TELEPUZ, an emerging full-featured, lightweight, and modular malware family spreading through a CLICKFIX-VIDAR infection chain. The campaign begins with a ClickFix social engineering page that prompts a user to copy, paste, and run a Windows PowerShell command, which downloads a VIDAR Go variant. VIDAR then retrieves the TELEPUZ stager and main payload from staging infrastructure, including domains such as hurgadatour[.]shop.\u003c/p\u003e\n\n\u003cp\u003eTELEPUZ is a 64-bit Windows DLL written in C and appears to be in active development, with regular VirusTotal submissions and a growing number of builds observed since activity began around late April 2026. The malware installs persistence, performs anti-VM and anti-debugger checks, attempts privilege escalation through UAC bypass techniques, and can register itself as a Windows service. It also uses evasion methods including indirect syscalls, NTDLL unhooking, AMSI and ETW patching, and removal of third-party DllNotification callbacks.\u003c/p\u003e\n\n\u003cp\u003eThe malware communicates with command-and-control infrastructure over WebSockets, using fallback methods that include Telegram, Steam profiles, DNS records, and a Polygon blockchain smart contract. The article identifies two primary C2 domains, cal.joycedoula[.]com[.]br and cal.snehamumbai[.]org, while noting a larger set of staging domains used for payload delivery. TELEPUZ supports 36 commands and can download modules for keylogging, stealing data, web injection, Chromium cookie extraction, screenshots, file operations, process hollowing, and other capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs is tracking an emerging threat named TELEPUZ that has been spreading via a CLICKFIX-VIDAR infection chain and has been operating since late April 2026 according to collected infrastructure information.","The infection chain begins with a ClickFix social engineering page that prompts the user to copy, paste, and execute a Windows PowerShell command, which downloads a VIDAR Go variant that then retrieves the TELEPUZ stager and main payload.","TELEPUZ is a 64-bit Windows DLL written in C that is lightweight, modular, and uses obfuscation techniques including garbage instructions, import hashing, custom RC4 string encryption, and indirect syscalls.","The malware installs persistence, performs anti-VM and anti-debugger checks, attempts UAC bypass and SYSTEM privilege escalation, registers itself as a Windows service, and communicates with its C2 over WebSockets.","TELEPUZ supports 36 commands and can download additional modules for functions such as keylogging, stealing data, web injection, Chromium cookie extraction, screenshots, file operations, process listing, and process hollowing."],"insights":["The string “telemetriawork” in second-stage download URLs is a strong pivot for finding related TELEPUZ stagers and payloads, with VirusTotal searches returning hundreds of associated files.","TELEPUZ uses several public fallback channels for C2 recovery, including a Telegram profile, a Steam profile, DNS records, and a Polygon smart contract, allowing operators to change C2 addresses if the primary server fails.","The Polygon smart contract doubles as a kill switch because TELEPUZ exits its communication thread if the returned blockchain data is fewer than 10 bytes.","Although many staging domains have been observed, the article identifies only two primary C2 domains, suggesting the payload distribution infrastructure is broader than the command infrastructure.","The WebInjector module does not need to inject into browsers; it interacts with Chromium-based browsers through Chrome DevTools Protocol and with Firefox through WebDriver BiDi."],"referencedReports":[],"body":"\u003cp\u003eElastic Security Labs is tracking TELEPUZ, an emerging full-featured, lightweight, and modular malware family spreading through a CLICKFIX-VIDAR infection chain. The campaign begins with a ClickFix social engineering page that prompts a user to copy, paste, and run a Windows PowerShell command, which downloads a VIDAR Go variant. VIDAR then retrieves the TELEPUZ stager and main payload from staging infrastructure, including domains such as hurgadatour[.]shop.\u003c/p\u003e\n\n\u003cp\u003eTELEPUZ is a 64-bit Windows DLL written in C and appears to be in active development, with regular VirusTotal submissions and a growing number of builds observed since activity began around late April 2026. The malware installs persistence, performs anti-VM and anti-debugger checks, attempts privilege escalation through UAC bypass techniques, and can register itself as a Windows service. It also uses evasion methods including indirect syscalls, NTDLL unhooking, AMSI and ETW patching, and removal of third-party DllNotification callbacks.\u003c/p\u003e\n\n\u003cp\u003eThe malware communicates with command-and-control infrastructure over WebSockets, using fallback methods that include Telegram, Steam profiles, DNS records, and a Polygon blockchain smart contract. The article identifies two primary C2 domains, cal.joycedoula[.]com[.]br and cal.snehamumbai[.]org, while noting a larger set of staging domains used for payload delivery. TELEPUZ supports 36 commands and can download modules for keylogging, stealing data, web injection, Chromium cookie extraction, screenshots, file operations, process hollowing, and other capabilities.\u003c/p\u003e\n"},{"n":20,"title":"OkoBot Malware Framework Injects Seed Phrase Phishing Into Ledger and Trezor Apps","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/okobot-malware-framework-injects-seed.html","time":"15:30","priority":"SHOULD READ","score":88,"tldr":"OkoBot is a Windows malware framework that injects fake recovery-phrase prompts directly into legitimate Ledger and Trezor desktop apps, sometimes waiting until a real hardware wallet is plugged in. The key
