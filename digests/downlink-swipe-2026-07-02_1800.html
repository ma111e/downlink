<script type="application/json" id="dl-articles">[{"n":7,"title":"ShinyHunters \u0026 Rockstar: Snowflake Data Breach Leads to Compromise | Mitiga","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/shinyhunters-snowflake-and-rockstar-another-saas-leads-to-compromise","time":"21:42","priority":"MUST READ","score":94,"tldr":"ShinyHunters allegedly compromised Rockstar by stealing service account tokens from third-party analytics provider Anodot and using that trusted access to exfiltrate Snowflake data. The key lesson is that supply chain attacks often look like legitimate logins, so organizations must monitor service accounts and integration behavior for anomalies.","briefOverview":"\u003cp\u003eShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments. The attackers stole service account tokens, logged in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics. The article states that no vulnerability in Snowflake itself was exploited.\u003c/p\u003e\n\n\u003cp\u003eThe incident is presented as a supply chain attack in which attackers used trusted third-party access rather than directly breaking into Rockstar’s environment. Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis. ShinyHunters posted demands on April 11 with an April 14 deadline, and then published the records on April 12 after Rockstar refused to pay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that stolen service account tokens can defeat detection systems that focus on unauthorized access attempts because the activity appears to come from legitimate users. It recommends checking whether an organization uses Anodot, reviewing known infrastructure such as Mullvad VPN nodes and Tor exit nodes, and baselining service account behavior. It also provides example detections for anomalous service account logins, service account external stage creation in Snowflake, and rapid database reconnaissance in a new session.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments.","The attackers stole service account tokens, used them to log in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics.","The article states that no vulnerability in Snowflake itself was exploited.","Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis.","The article recommends checking whether an organization uses Anodot, reviewing known infrastructure indicators such as Mullvad and Tor nodes, and baselining service account activity."],"insights":["The article emphasizes that detection must focus on trusted service accounts because stolen third-party tokens can make attacker activity appear like normal authenticated access.","The reported timeline from Anodot’s outage on April 4 to ShinyHunters publishing Rockstar data on April 12 shows that organizations may have only days to detect and contain this type of compromise before extortion escalates.","The article recommends starting hunts by identifying whether Anodot is used before attempting broader behavioral analysis, because that can quickly narrow the investigation scope.","External stage creation by service accounts in Snowflake is highlighted as a practical warning sign because external stages can be used as preparation for moving data out of Snowflake.","Rapid database reconnaissance immediately after a new session starts is presented as a strong behavioral signal for suspicious Snowflake activity."],"referencedReports":[{"title":"Unpacking the 2024 Snowflake Data Breach","url":"https://cloudsecurityalliance.org/blog/2025/05/07/unpacking-the-2024-snowflake-data-breach","publisher":"Cloud Security Alliance","context":"The article cites this analysis for the claim that companies reported up to $3 million in direct financial consequences from Snowflake-related breaches.","category":"","primary":false}],"body":"\u003cp\u003eShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments. The attackers stole service account tokens, logged in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics. The article states that no vulnerability in Snowflake itself was exploited.\u003c/p\u003e\n\n\u003cp\u003eThe incident is presented as a supply chain attack in which attackers used trusted third-party access rather than directly breaking into Rockstar’s environment. Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis. ShinyHunters posted demands on April 11 with an April 14 deadline, and then published the records on April 12 after Rockstar refused to pay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that stolen service account tokens can defeat detection systems that focus on unauthorized access attempts because the activity appears to come from legitimate users. It recommends checking whether an organization uses Anodot, reviewing known infrastructure such as Mullvad VPN nodes and Tor exit nodes, and baselining service account behavior. It also provides example detections for anomalous service account logins, service account external stage creation in Snowflake, and rapid database reconnaissance in a new session.\u003c/p\u003e\n"},{"n":3,"title":"Google Disrupts NetNut Residential Proxy Network Spanning 2 Million Home Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/google-disrupts-netnut-residential.html","time":"18:54","priority":"SHOULD READ","score":85,"tldr":"Google, working with the FBI, Lumen, and others, says it has significantly degraded NetNut/Popa, a residential proxy network that used millions of home devices such as smart TVs and streaming boxes to relay other people’s traffic. The main risk for consumers is that hidden or poorly disclosed bandwidth-sharing apps can turn their internet connection into an exit node for criminals and other threat actors.","briefOverview":"\u003cp\u003eGoogle’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, a residential proxy network spread across home devices worldwide. Google estimates the network includes at least 2 million devices, including smart TVs and streaming boxes. If one of these devices is in a home, strangers can route their traffic through that household’s internet connection, leaving the home address associated with whatever activity occurs.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that residential proxy networks sell access to real home internet addresses so traffic appears to come from ordinary home browsing rather than datacenters. Operators build these networks by getting their code onto home devices, sometimes through cheap off-brand hardware with pre-installed software or free apps that hide the bandwidth-sharing function. Google said an exit node can bring outside traffic inside the home network, and in one week in June it counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.\u003c/p\u003e\n\n\u003cp\u003eResearchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by publicly traded Israeli company Alarum Technologies. Alarum rejects the “botnet” label and says its software is for consented bandwidth-sharing that does not compromise devices, while Synthient reported that none of more than 20 apps it examined showed users a consent prompt. Google described the action as degradation rather than a complete takedown because NetNut uses reseller relationships, and similar networks can buy capacity from rivals or reappear under other brands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, reducing its pool of usable devices by millions.","Google identifies NetNut as a residential proxy network spread across at least 2 million home devices worldwide, including smart TVs and streaming boxes.","In one week in June, Google counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.","Researchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by the publicly traded Israeli company Alarum Technologies.","Google said the disruption is degradation rather than a kill because NetNut uses reseller relationships and similar networks can buy capacity from rivals or resurface under other brands."],"insights":["A seemingly separate proxy brand may still depend on the same NetNut device pool because Google says NetNut’s reseller program lets other companies sell the network under their own names.","The clearest consumer warning sign is an app that offers payment for “unused bandwidth” or “sharing your internet,” since the article identifies this as a main way these networks grow.","Alarum’s consent-based defense is weakened by Synthient’s finding that none of the more than 20 apps it examined showed users a consent prompt.","Disrupting one residential proxy network may not produce lasting impact because Google says operators can buy capacity from rivals and effectively become resellers themselves."],"referencedReports":[{"title":"Google’s Continued Disruption of Residential Proxy Networks","url":"https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks","publisher":"Google Threat Intelligence Group","context":"The article cites Google Threat Intelligence Group’s post as the source for its claim that Google and partners degraded NetNut’s usable device pool by millions.","category":"","primary":false},{"title":"Popa: From Sourcing to Distribution","url":"https://synthient.com/blog/popa-from-sourcing-to-distribution","publisher":"Synthient","context":"The article cites Synthient’s controlled test showing traffic sent into NetNut’s commercial gateway came out through a device enrolled in Popa.","category":"","primary":false}],"body":"\u003cp\u003eGoogle’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, a residential proxy network spread across home devices worldwide. Google estimates the network includes at least 2 million devices, including smart TVs and streaming boxes. If one of these devices is in a home, strangers can route their traffic through that household’s internet connection, leaving the home address associated with whatever activity occurs.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that residential proxy networks sell access to real home internet addresses so traffic appears to come from ordinary home browsing rather than datacenters. Operators build these networks by getting their code onto home devices, sometimes through cheap off-brand hardware with pre-installed software or free apps that hide the bandwidth-sharing function. Google said an exit node can bring outside traffic inside the home network, and in one week in June it counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.\u003c/p\u003e\n\n\u003cp\u003eResearchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by publicly traded Israeli company Alarum Technologies. Alarum rejects the “botnet” label and says its software is for consented bandwidth-sharing that does not compromise devices, while Synthient reported that none of more than 20 apps it examined showed users a consent prompt. Google described the action as degradation rather than a complete takedown because NetNut uses reseller relationships, and similar networks can buy capacity from rivals or reappear under other brands.\u003c/p\u003e\n"},{"n":5,"title":"Roblox, Minecraft, and the Insidious Internet for Children","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/roblox-minecraft-and-the-insidious-internet-for-children/","time":"19:44","priority":"SHOULD READ","score":82,"tldr":"Censys research found a large, fast-changing ecosystem of Roblox and Minecraft offerwall scams and phishing sites targeting children, with at least 437 Roblox reward sites and hundreds of spoofing domains. The key takeaway is that defenders cannot rely on threat feeds alone and need content, hostname, and infrastructure fingerprinting to detect and disrupt this abuse.","briefOverview":"\u003cp\u003eCensys researched websites targeting children who play Roblox and Minecraft with promises of free in-game currency, gift cards, perks, or account verification. The article separates the ecosystem into offerwall reward sites, which pay or claim to pay users for tasks such as surveys and app installs, and phishing or generator lures, which aim to steal credentials or private data. In a June 2026 snapshot, Censys found 437 Roblox offerwall web properties and 20 Minecraft offerwall web properties, with 6 overlapping both sets.\u003c/p\u003e\n\n\u003cp\u003eThe research argues that these sites matter because they monetize children’s time, attention, and personal data, and some run on poorly maintained infrastructure with known vulnerabilities. The Roblox offerwall population was fragmented across many brands, heavily used free domain-validated certificates, and frequently sat behind Cloudflare or cheap hosting. Censys also found exposed origins and shared operator signals, including the Rocash and RbxBest example where content pivots, certificates, analytics IDs, ad IDs, and backend services linked related properties.\u003c/p\u003e\n\n\u003cp\u003eThe phishing portion highlights a Roblox cluster on 179.43.150[.]242 using typosquats, fake Bloxlink and RoVer verification pages, short-link front doors, and repeated kit subdomains such as auth, arkoselabs, twostepverification, thumbnails, and metrics. The article says Minecraft phishing differs because it often targets Microsoft accounts through Minecraft-themed sign-in or verification lures, and some abuse happens inside Discord through one-time-code social engineering. Its conclusion is that defenders should rely on content fingerprints, hostname patterns, certificate names, and infrastructure analysis rather than waiting for conventional threat feeds to flag fast-rotating domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys research found 437 web properties matching a Roblox offerwall reward-site fingerprint in a June 2026 snapshot.","The Roblox offerwall sites commonly promise Robux or gift cards in exchange for tasks such as surveys, app installs, watching videos, or completing offers.","Censys found that many Roblox phishing domains impersonate Roblox, Bloxlink, or RoVer, including typosquats, fake verification pages, and short-link front doors.","The article states that Minecraft phishing often targets Microsoft accounts because Minecraft accounts migrated to Microsoft logins.","The research concludes that defenders should use content fingerprints and infrastructure analysis because conventional threat feeds may miss or lag behind these fast-changing child-targeted fraud sites."],"insights":["The Rocash example showed that pivoting on page content can reveal an unproxied origin behind Cloudflare, and in this case the origin certificate linked a children’s reward site to a gambling-adjacent brand.","Shared monetization identifiers such as Google Analytics tags, AdSense publisher IDs, and NitroPay ad units were described as higher-fidelity links between offerwall properties than page titles or branding.","The Roblox phishing cluster reused a repeated subdomain skeleton, including auth, games, arkoselabs, twostepverification, thumbnails, and metrics, making the kit structure a more durable detection signal than individual rotating domains.","The article notes that offerwall operators tend to use Cloudflare and budget hosting to appear trustworthy, while the highlighted phishing operator used exposed bulletproof hosting to resist takedowns.","Minecraft phishing has a different detection surface from Roblox phishing because it often leads to Microsoft sign-in theft or Discord one-time-code social engineering rather than direct game-currency or username-based lures."],"referencedReports":[],"body":"\u003cp\u003eCensys researched websites targeting children who play Roblox and Minecraft with promises of free in-game currency, gift cards, perks, or account verification. The article separates the ecosystem into offerwall reward sites, which pay or claim to pay users for tasks such as surveys and app installs, and phishing or generator lures, which aim to steal credentials or private data. In a June 2026 snapshot, Censys found 437 Roblox offerwall web properties and 20 Minecraft offerwall web properties, with 6 overlapping both sets.\u003c/p\u003e\n\n\u003cp\u003eThe research argues that these sites matter because they monetize children’s time, attention, and personal data, and some run on poorly maintained infrastructure with known vulnerabilities. The Roblox offerwall population was fragmented across many brands, heavily used free domain-validated certificates, and frequently sat behind Cloudflare or cheap hosting. Censys also found exposed origins and shared operator signals, including the Rocash and RbxBest example where content pivots, certificates, analytics IDs, ad IDs, and backend services linked related properties.\u003c/p\u003e\n\n\u003cp\u003eThe phishing portion highlights a Roblox cluster on 179.43.150[.]242 using typosquats, fake Bloxlink and RoVer verification pages, short-link front doors, and repeated kit subdomains such as auth, arkoselabs, twostepverification, thumbnails, and metrics. The article says Minecraft phishing differs because it often targets Microsoft accounts through Minecraft-themed sign-in or verification lures, and some abuse happens inside Discord through one-time-code social engineering. Its conclusion is that defenders should rely on content fingerprints, hostname patterns, certificate names, and infrastructure analysis rather than waiting for conventional threat feeds to flag fast-rotating domains.\u003c/p\u003e\n"},{"n":1,"title":"Launch of UK's National Cyber Action Plan delayed amid Labour leadership crisis","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/launch-of-uk-national-cyber-action-plan-delayed","time":"20:32","priority":"SHOULD READ","score":78,"tldr":"The UK’s National Cyber Action Plan has been delayed again after Keir Starmer’s resignation triggered a Labour leadership crisis, reinforcing concerns that cybersecurity remains a low political priority despite major recent incidents. A related Cyber Resilience Pledge for FTSE 350 companies is still expected to proceed.","briefOverview":"\u003cp\u003eBritain\u0026rsquo;s National Cyber Action Plan has been delayed again following Prime Minister Keir Starmer\u0026rsquo;s resignation, according to multiple sources cited in the article. The plan had been due for publication on Monday but was postponed amid uncertainty over the Labour Party leadership contest opening July 9. A government spokesperson said the government remains committed to publishing the plan and pointed to the Cyber Security and Resilience Bill, the Cyber Resilience Pledge, and support from the National Cyber Security Centre.\u003c/p\u003e\n\n\u003cp\u003eThe delay adds to concerns described in the article that cybersecurity remains a low political priority in Westminster. Other UK cyber policy efforts have also faced delays, including the Cyber Security and Resilience Bill, which took more than four years to reach Parliament and is not expected to be enforced until 2028. The article also cites delayed ransomware proposals that were disrupted when Rishi Sunak called a general election.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recent real-world impacts from cyber incidents, including the Qilin-linked ransomware attack on Synnovis that disrupted London hospitals and the Jaguar Land Rover cyberattack that halted vehicle production for more than a month. Recorded Future News understands the action plan will include three pillars focused on Threat, Growth and Resilience, and will reflect NCSC chief executive Richard Horne’s framing of “near, mid and far spaces” in cyberspace. A related Cyber Resilience Pledge is still expected to proceed, with FTSE 350 companies asked to make cybersecurity a board-level responsibility, join the NCSC’s Early Warning service, and require Cyber Essentials certification across supply chains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Britain's National Cyber Action Plan, which was due for publication on Monday, has been postponed following Prime Minister Keir Starmer's resignation and uncertainty over the Labour Party leadership contest opening July 9.","A government spokesperson said the government remains committed to publishing the National Cyber Action Plan and pointed to the Cyber Security and Resilience Bill, the national Cyber Resilience Pledge, and support from the National Cyber Security Centre.","A number of FTSE 350 companies are still expected to sign the government's voluntary Cyber Resilience Pledge on Tuesday to improve their digital defenses.","The Cyber Security and Resilience Bill took more than four years to reach Parliament and is not expected to be enforced until 2028, a decade after the NIS Regulations it was written to replace.","Recorded Future News understands the National Cyber Action Plan will include three pillars focused on Threat, Growth, and Resilience, and the Cyber Resilience Pledge will ask companies to make cybersecurity a board-level responsibility, join the NCSC's Early Warning service, and require Cyber Essentials certification across their supply chains."],"insights":["The article shows a repeated pattern in which UK cyber policy initiatives have been delayed by political events, including a general election, a cabinet reshuffle, and now a Labour leadership contest.","The Cyber Security and Resilience Bill may not be enforced until 2028 even though its core provisions were completed in 2022, meaning the replacement for the NIS Regulations could arrive a decade after those rules were introduced.","The government is still moving ahead with the Cyber Resilience Pledge even though the broader National Cyber Action Plan has been delayed, indicating that voluntary commitments from major companies are being separated from the formal strategy launch.","Recent major incidents cited in the article affected real-world services and the economy, including canceled hospital operations after the Synnovis attack and a £1.9 billion estimated economic impact from the Jaguar Land Rover shutdown.","The planned action plan appears to place significant emphasis on privately owned cloud, technology, and telecommunications infrastructure, which Richard Horne described as the shared “mid space” that the government wants to harden with providers."],"referencedReports":[],"body":"\u003cp\u003eBritain\u0026rsquo;s National Cyber Action Plan has been delayed again following Prime Minister Keir Starmer\u0026rsquo;s resignation, according to multiple sources cited in the article. The plan had been due for publication on Monday but was postponed amid uncertainty over the Labour Party leadership contest opening July 9. A government spokesperson said the government remains committed to publishing the plan and pointed to the Cyber Security and Resilience Bill, the Cyber Resilience Pledge, and support from the National Cyber Security Centre.\u003c/p\u003e\n\n\u003cp\u003eThe delay adds to concerns described in the article that cybersecurity remains a low political priority in Westminster. Other UK cyber policy efforts have also faced delays, including the Cyber Security and Resilience Bill, which took more than four years to reach Parliament and is not expected to be enforced until 2028. The article also cites delayed ransomware proposals that were disrupted when Rishi Sunak called a general election.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recent real-world impacts from cyber incidents, including the Qilin-linked ransomware attack on Synnovis that disrupted London hospitals and the Jaguar Land Rover cyberattack that halted vehicle production for more than a month. Recorded Future News understands the action plan will include three pillars focused on Threat, Growth and Resilience, and will reflect NCSC chief executive Richard Horne’s framing of “near, mid and far spaces” in cyberspace. A related Cyber Resilience Pledge is still expected to proceed, with FTSE 350 companies asked to make cybersecurity a board-level responsibility, join the NCSC’s Early Warning service, and require Cyber Essentials certification across supply chains.\u003c/p\u003e\n"},{"n":6,"title":"Agentic SOC: Why Your AI Strategy Will Live or Die on Data | Mitiga","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/no-king-no-kingdom-the-agentic-soc-will-live-or-die-on-data","time":"21:48","priority":"MAY READ","score":45,"tldr":"Mitiga argues that Agentic SOCs will only work if AI agents are fed normalized, context-rich forensic data rather than raw SIEM logs. The article positions Mitiga’s Cloud Security Data Lake, detections, and response capabilities as the backbone needed to reduce noise, hallucinations, and AI/SIEM costs.","briefOverview":"\u003cp\u003eThe article argues that Agentic SOC capabilities are already being rolled out by security vendors and startups, with AI agents triaging alerts, investigating threats, and recommending or executing responses with minimal human intervention. It says this model is different from earlier AI co-pilots because agents can coordinate with other agents and humans to plan, explain, and act against cyber events at machine speed. The article emphasizes that humans still set intent, constraints, and approvals for high-impact actions.\u003c/p\u003e\n\n\u003cp\u003eThe central point is that an Agentic SOC depends on the quality and depth of the data underneath it. The article warns that noisy, fragmented, incomplete, or raw logs can cause agents to miss cross-platform attack paths, chase false positives, hallucinate links, and increase operating costs. It also says organizations may face both a “SIEM tax” and an “AI agent tax” if they send full-fidelity cloud and SaaS telemetry into generic platforms that charge by data volume.\u003c/p\u003e\n\n\u003cp\u003eMitiga presents its Cloud Security Data Lake as an AI-ready forensic backbone for Agentic SOC workflows. The article describes three layers: an Intelligence Layer that collects, normalizes, enriches, correlates, and retains cloud, SaaS, identity, and AI data; a Signal Layer that provides high-fidelity detections; and an Action Layer that supports in-context response actions across cloud providers, SaaS platforms, identity systems, and AI services. It positions Mitiga’s platform, Mitiga MCP, and Helios AIDR as tools for giving agents investigation-grade context, reducing noise, lowering cost, and supporting Zero-Impact Breach Prevention.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI agents in an Agentic SOC succeed or fail based on the quality, depth, and context of the data they consume.","It defines an Agentic SOC as an operating model where specialized AI agents triage alerts, investigate threats, correlate telemetry, and propose or execute response actions under human-defined guardrails.","The article says noisy, fragmented, or incomplete logs can cause agents to miss cross-platform attack paths, chase false positives, hallucinate threat links, and increase operating costs.","Mitiga positions its Cloud Security Data Lake as an AI-ready forensic backbone that collects, normalizes, enriches, correlates, and retains cloud, SaaS, identity, and AI data for up to 1,000 days.","The article describes Mitiga’s Intelligence, Signal, and Action layers as providing investigation-grade context, high-fidelity detections, and in-context response actions for Agentic SOC workflows."],"insights":["The article argues that the main failure point for an Agentic SOC is not the AI model itself but the data foundation beneath it, making architecture choices more important than model selection.","It highlights a combined cost problem where organizations may stack an “AI agent tax” on top of the existing “SIEM tax” if agents are forced to process large volumes of raw logs.","The article presents high-fidelity detections as a cost-control mechanism because agents should be triggered only when there is enough evidence and context to justify deeper investigation.","It warns that raw or partial telemetry can make AI agents confidently pursue nonexistent attack paths, turning incomplete data into faster and more convincing mistakes.","The vendor evaluation checklist implies that organizations should treat vague answers about data substrate, ingest costs, signal quality, and response controls as warning signs that an Agentic SOC offering may be only an expensive assistant."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that Agentic SOC capabilities are already being rolled out by security vendors and startups, with AI agents triaging alerts, investigating threats, and recommending or executing responses with minimal human intervention. It says this model is different from earlier AI co-pilots because agents can coordinate with other agents and humans to plan, explain, and act against cyber events at machine speed. The article emphasizes that humans still set intent, constraints, and approvals for high-impact actions.\u003c/p\u003e\n\n\u003cp\u003eThe central point is that an Agentic SOC depends on the quality and depth of the data underneath it. The article warns that noisy, fragmented, incomplete, or raw logs can cause agents to miss cross-platform attack paths, chase false positives, hallucinate links, and increase operating costs. It also says organizations may face both a “SIEM tax” and an “AI agent tax” if they send full-fidelity cloud and SaaS telemetry into generic platforms that charge by data volume.\u003c/p\u003e\n\n\u003cp\u003eMitiga presents its Cloud Security Data Lake as an AI-ready forensic backbone for Agentic SOC workflows. The article describes three layers: an Intelligence Layer that collects, normalizes, enriches, correlates, and retains cloud, SaaS, identity, and AI data; a Signal Layer that provides high-fidelity detections; and an Action Layer that supports in-context response actions across cloud providers, SaaS platforms, identity systems, and AI services. It positions Mitiga’s platform, Mitiga MCP, and Helios AIDR as tools for giving agents investigation-grade context, reducing noise, lowering cost, and supporting Zero-Impact Breach Prevention.\u003c/p\u003e\n"},{"n":2,"title":"Ransomware Groups Turn to Citrix Bleed 2, BYOVD, and Supply Chain Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ransomware-groups-turn-to-citrix-bleed.html","time":"18:30","priority":"MAY READ","score":40,"tldr":"Multiple ransomware groups are escalating attacks by combining Citrix Bleed 2 exploitation, stolen VPN credentials, legitimate remote-management tools, BYOVD techniques, and supply-chain credential theft to gain access, evade defenses, exfiltrate data, and deploy ransomware. The key takeaway is that ransomware operations are increasingly relying on valid credentials and trusted tools to blend into normal environments while making incidents harder to detect and investigate.","briefOverview":"\u003cp\u003eThreat actors associated with the Anubis ransomware operation have been observed exploiting Citrix Bleed 2, tracked as CVE-2025-5777, to gain initial access. Arctic Wolf said Anubis affiliates also used valid VPN credentials and abused legitimate remote access and administration tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment. The intrusions involved RDP and SMB activity, credential access, PsExec service creation, RMM deployment, Cloudflare Tunnel use in some cases, and cloud-transfer tooling for data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eAnubis is a ransomware-as-a-service group that emerged in late 2024 as a rebrand of Sphinx ransomware and was announced on the RAMP underground forum in February 2025. Ransomware.Live data cited in the article says the group has claimed 91 victims on its leak site, with 11 victims reported in June 2026 alone. Targeted sectors include healthcare, business services, manufacturing, technology, and financial services, with more than half of victims located in the U.S. and others in the U.K., Australia, France, and Canada.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes activity from The Gentlemen ransomware group, including use of known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and bring-your-own-vulnerable-driver techniques involving the ktapi.sys driver. Kaspersky said the backdoor can collect system information, communicate with an external server, execute commands through cmd.exe, and establish a SOCKS proxy connection. Sophos also reported that VECT and TeamPCP formed a partnership combining supply chain attack-driven credential theft with ransomware deployment across organizations compromised in the Trivy and LiteLLM supply chain attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anubis ransomware affiliates have been observed exploiting Citrix Bleed 2, tracked as CVE-2025-5777, and using valid VPN credentials to gain initial access to victim environments.","Arctic Wolf reported that Anubis affiliates abused legitimate remote access and administration tools including ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment to maintain control while blending in with normal IT activity.","The Anubis intrusions involved lateral movement through RDP and PsExec, credential access, deployment of cloud-transfer tools such as S3 Browser, rclone, s5cmd, WinSCP, and PuTTY for exfiltration, and actions to impair defenses such as disabling Windows Defender real-time protection.","Kaspersky detailed The Gentlemen ransomware group’s use of a Go-based backdoor that collects system information, communicates with an external server, executes commands through cmd.exe, and can establish a SOCKS proxy connection.","Sophos reported that VECT and TeamPCP formed a partnership to combine supply chain attack-driven credential theft with ransomware deployment across organizations compromised in the Trivy and LiteLLM supply chain attacks."],"insights":["Anubis increases pressure on victims by offering a /WIPEMODE feature that reduces files to 0 KB even if a ransom is later paid, making recovery dependent on backups rather than decryption.","The Anubis activity shows that common IT administration tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment can be abused to maintain access while appearing similar to normal IT operations.","The Gentlemen’s BYOVD activity demonstrates that even fully updated Windows systems with exploit mitigations enabled may not be fully protected against vulnerable third-party drivers used to disable endpoint security tools.","VECT’s encryptor has implementation flaws that permanently destroy files larger than 128 KB instead of encrypting them, which undermines its operational effectiveness and changes the impact for victims.","The VECT and TeamPCP partnership is notable because it combines large-scale supply chain credential theft with a ransomware operation, lowering the barrier to entry for broader ransomware deployment according to Sophos."],"referencedReports":[{"title":"CitrixBleed 2 to Cloudflared: The Tools and Techniques Behind Anubis Ransomware Attacks","url":"https://arcticwolf.com/resources/blog/citrixbleed-2-to-cloudflared-the-tools-and-techniques-behind-anubis-ransomware-attacks/","publisher":"Arctic Wolf","context":"The article cites Arctic Wolf's report as the source for Anubis affiliates exploiting Citrix Bleed 2 and using legitimate remote administration tools.","category":"","primary":false},{"title":"Anubis Ransomware Stresses Need for Advanced Data Backup","url":"https://zerolabs.rubrik.com/blog/anubis-ransomware-stresses-need-advanced-data-backup","publisher":"Rubrik Zero Labs","context":"The article references Rubrik Zero Labs' July 2025 report describing Anubis affiliate profit splits and the ransomware's irreversible /WIPEMODE feature.","category":"","primary":false},{"title":"The Gentlemen RaaS","url":"https://securelist.com/the-gentlemen-raas/120447/","publisher":"Kaspersky","context":"The article cites Kaspersky's analysis of The Gentlemen ransomware group's use of known vulnerabilities, weak or stolen credentials, a Go-based backdoor, and BYOVD techniques.","category":"","primary":false},{"title":"Not Very Gentlemanly: Analyzing a Zero-Day Exploit Used by The Gentlemen Ransomware to Disable Targets' EDRs","url":"https://expel.com/blog/not-very-gentlemanly-analyzing-a-zero-day-exploit-used-by-the-gentlemen-ransomware-to-disable-targets-edrs/","publisher":"Expel","context":"The article references Expel's analysis of The Gentlemen group's use of a zero-day vulnerability in the ktapi.sys driver as part of its BYOVD arsenal.","category":"","primary":false},{"title":"VECT and TeamPCP Partner for Ransomware Campaigns","url":"https://www.sophos.com/en-us/blog/vect-and-teampcp-partner-for-ransomware-campaigns","publisher":"Sophos","context":"The article cites Sophos Counter Threat Unit's investigation into the partnership between VECT and TeamPCP for supply chain credential theft and ransomware deployment.","category":"","primary":false},{"title":"VECT Ransomware Analysis","url":"https://www.jumpsec.com/guides/vect-ransomware-analysis/","publisher":"JUMPSEC","context":"The article references JUMPSEC's analysis finding that VECT has implementation flaws that can permanently destroy files larger than 128 KB.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors associated with the Anubis ransomware operation have been observed exploiting Citrix Bleed 2, tracked as CVE-2025-5777, to gain initial access. Arctic Wolf said Anubis affiliates also used valid VPN credentials and abused legitimate remote access and administration tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment. The intrusions involved RDP and SMB activity, credential access, PsExec service creation, RMM deployment, Cloudflare Tunnel use in some cases, and cloud-transfer tooling for data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eAnubis is a ransomware-as-a-service group that emerged in late 2024 as a rebrand of Sphinx ransomware and was announced on the RAMP underground forum in February 2025. Ransomware.Live data cited in the article says the group has claimed 91 victims on its leak site, with 11 victims reported in June 2026 alone. Targeted sectors include healthcare, business services, manufacturing, technology, and financial services, with more than half of victims located in the U.S. and others in the U.K., Australia, France, and Canada.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes activity from The Gentlemen ransomware group, including use of known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and bring-your-own-vulnerable-driver techniques involving the ktapi.sys driver. Kaspersky said the backdoor can collect system information, communicate with an external server, execute commands through cmd.exe, and establish a SOCKS proxy connection. Sophos also reported that VECT and TeamPCP formed a partnership combining supply chain attack-driven credential theft with ransomware deployment across organizations compromised in the Trivy and LiteLLM supply chain attacks.\u003c/p\u003e\n"},{"n":4,"title":"Catan and Mouse","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/catan-and-mouse/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos highlights ARToken, a mature phishing-as-a-service panel linked to EvilTokens that targets Microsoft 365 with device-code phishing, token persistence, email access, BEC workflows, and SharePoint exfiltration. Defenders should review Talos’ IOCs and hunt for related activity in their environments.","briefOverview":"\u003cp\u003eCisco Talos is highlighting research into ARToken, a fully featured phishing-as-a-service operator panel branded “ARToken.” The panel shares infrastructure, API contracts, and operational patterns with the EvilTokens platform documented by Sekoia and Microsoft in early 2026. Talos states that ARToken includes capabilities that had not previously been documented.\u003c/p\u003e\n\n\u003cp\u003eThe ARToken panel exposes more than 80 API endpoints for device code phishing, Primary Refresh Token persistence, email access, business email compromise operations, and SharePoint exfiltration. These functions are available to operators through a React-based dashboard. Talos says the feature set shows the platform is more mature than a simple device code phishing kit and is a complete business email compromise operations environment.\u003c/p\u003e\n\n\u003cp\u003eTalos advises defenders to review the capabilities the panel provides and use the indicators of compromise it published to block malicious activity. The indicators can also be used as pivots for internal hunts if they are present in an environment. The newsletter also notes other weekly security headlines, including a Microsoft 365 password-spraying campaign, threat actors attempting to misuse organization-owned AI agents, and exploitation of CVE-2026-48558 in SimpleHelp remote monitoring and management software.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos highlighted research into ARToken, a fully featured phishing-as-a-service operator panel that shares infrastructure, API contracts, and operational patterns with the EvilTokens platform documented by Sekoia and Microsoft in early 2026.","The ARToken panel exposes more than 80 API endpoints for device code phishing, Primary Refresh Token persistence, email access, business email compromise operations, and SharePoint exfiltration.","Talos stated that ARToken’s features indicate the platform is more mature than a simple device code phishing kit and functions as a complete business email compromise operations environment.","Talos advised defenders to use the indicators of compromise it provided to block malicious activity and as pivots for internal hunts if the indicators are present.","The newsletter also cited reports about an aggressive password-spraying campaign against Microsoft 365, attempts to misuse organization-owned AI agents, and exploitation of CVE-2026-48558 in SimpleHelp remote monitoring and management software."],"insights":["ARToken’s React-based dashboard makes advanced Microsoft 365 abuse capabilities accessible through an operator interface, which lowers the practical barrier for running business email compromise activity.","The overlap in infrastructure, API contracts, and operational patterns between ARToken and EvilTokens gives defenders multiple pivot points for connecting current activity to previously documented research by Sekoia and Microsoft.","Talos specifically recommends using the provided indicators of compromise not only for blocking but also as starting points for internal threat hunts, making the research immediately operational for defenders.","The newsletter frames ARToken alongside Microsoft 365 password spraying and SimpleHelp exploitation, emphasizing that identity and remote-access pathways remain prominent targets in the week’s threat landscape."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos is highlighting research into ARToken, a fully featured phishing-as-a-service operator panel branded “ARToken.” The panel shares infrastructure, API contracts, and operational patterns with the EvilTokens platform documented by Sekoia and Microsoft in early 2026. Talos states that ARToken includes capabilities that had not previously been documented.\u003c/p\u003e\n\n\u003cp\u003eThe ARToken panel exposes more than 80 API endpoints for device code phishing, Primary Refresh Token persistence, email access, business email compromise operations, and SharePoint exfiltration. These functions are available to operators through a React-based dashboard. Talos says the feature set shows the platform is more mature than a simple device code phishing kit and is a complete business email compromise operations environment.\u003c/p\u003e\n\n\u003cp\u003eTalos advises defenders to review the capabilities the panel provides and use the indicators of compromise it published to block malicious activity. The indicators can also be used as pivots for internal hunts if they are present in an environment. The newsletter also notes other weekly security headlines, including a Microsoft 365 password-spraying campaign, threat actors attempting to misuse organization-owned AI agents, and exploitation of CVE-2026-48558 in SimpleHelp remote monitoring and management software.\u003c/p\u003e\n"}]</script>
