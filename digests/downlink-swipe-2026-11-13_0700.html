<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers Exploit PHP2Shell Flaws in Check Point Gateways to Deploy TSGA Backdoor and Wipe ESXi Files","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-php2shell-flaws-in.html","time":"08:05","priority":"MUST READ","score":96,"tldr":"Attackers exploited unpatched PHP2Shell flaws and a Gaia OS privilege-escalation vulnerability on Check Point gateways to deploy the TSGA backdoor, then in some cases pivoted to VMware ESXi hosts to run destructive wiper malware. The campaign initially targeted Israeli organizations before expanding globally, with possible but unconfirmed links to China-aligned actors.","briefOverview":"\u003cp\u003eAn unknown threat actor targeted unpatched Check Point Security Gateways using the PHP2Shell vulnerabilities to gain initial access. The activity began on October 30, 2026, against Israeli organizations, followed by a broader wave on November 2 affecting organizations across multiple countries and sectors. Check Point said some first-wave targets also experienced destructive actions, including the deployment of file-wiping malware.\u003c/p\u003e\n\n\u003cp\u003eAfter entering through vulnerable Mobile Access portals, the attackers exploited CVE-2026-123039, a Gaia OS DynamicCLI authorization flaw, to elevate access from the portal service account to root. They deployed PHP web shells and the persistent TSGA backdoor, which includes TSProxy for concealed attacker connections through existing appliance processes. In some cases, they used the vpxuser service account over SSH to reach VMware ESXi hosts, execute the destroy_v6 wiper, delete files, and leave DREAM_ANNEXATION.txt notes.\u003c/p\u003e\n\n\u003cp\u003eCheck Point assessed TSGA and TSProxy as Check Point-specific components of the PhiliKit toolkit previously associated by ESET with the China-nexus Armory Castle group. Infrastructure and scanning-hour patterns also suggested possible China-aligned involvement, but Check Point said it could not confidently attribute the operation. The use of wiper malware and politically themed notes referring to the Israeli-Palestine conflict leave open several possibilities, including a false-flag operation or destructive activity intended as a distraction.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unknown threat actor exploited PHP2Shell vulnerabilities in unpatched Check Point Security Gateways and used CVE-2026-123039 in Gaia OS to gain root-level control.","The campaign began on October 30, 2026, against Israeli organizations and expanded on November 2 to organizations in multiple countries and sectors.","Attackers deployed PHP web shells and the TSGA backdoor, which includes TSProxy and supports encrypted remote access, configuration theft, persistence, process injection, and firewall-log tampering.","In some compromises, the attackers used SSH access to move from a Check Point gateway to a VMware ESXi host, where they executed the destroy_v6 wiper and dropped DREAM_ANNEXATION.txt notes.","Check Point said the TSGA and TSProxy components resemble the PhiliKit toolkit associated with the China-nexus group Armory Castle, but it could not confidently attribute the campaign."],"insights":["The attackers chained internet-facing PHP2Shell access with a local DynamicCLI flaw, turning an initial gateway compromise into root-level control of the appliance.","The activity began roughly one week after a security fix became available, and Check Point observed active exploitation against a couple of dozen customers.","TSGA is designed for long-term concealed access because it combines a standalone backdoor with TSProxy code that intercepts specially marked connections inside existing appliance processes while allowing normal traffic to continue.","The destructive phase was not limited to the gateway: attackers used the vpxuser service account over SSH to reach VMware ESXi hosts and run a program that overwrites and deletes files.","Although TSGA and TSProxy resemble tooling linked to the China-nexus Armory Castle group, Check Point said the wiper use and Israel-focused political messages prevent confident attribution."],"referencedReports":[{"title":"PHP2Shell Exploitation on Check Point Gateway","url":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","publisher":"check-point-research","context":"The article is based on Check Point's technical analysis of PHP2Shell exploitation, the Gaia OS privilege-escalation flaw, TSGA deployment, and destructive activity against ESXi hosts.","category":"research","primary":true}],"body":"\u003cp\u003eAn unknown threat actor targeted unpatched Check Point Security Gateways using the PHP2Shell vulnerabilities to gain initial access. The activity began on October 30, 2026, against Israeli organizations, followed by a broader wave on November 2 affecting organizations across multiple countries and sectors. Check Point said some first-wave targets also experienced destructive actions, including the deployment of file-wiping malware.\u003c/p\u003e\n\n\u003cp\u003eAfter entering through vulnerable Mobile Access portals, the attackers exploited CVE-2026-123039, a Gaia OS DynamicCLI authorization flaw, to elevate access from the portal service account to root. They deployed PHP web shells and the persistent TSGA backdoor, which includes TSProxy for concealed attacker connections through existing appliance processes. In some cases, they used the vpxuser service account over SSH to reach VMware ESXi hosts, execute the destroy_v6 wiper, delete files, and leave DREAM_ANNEXATION.txt notes.\u003c/p\u003e\n\n\u003cp\u003eCheck Point assessed TSGA and TSProxy as Check Point-specific components of the PhiliKit toolkit previously associated by ESET with the China-nexus Armory Castle group. Infrastructure and scanning-hour patterns also suggested possible China-aligned involvement, but Check Point said it could not confidently attribute the operation. The use of wiper malware and politically themed notes referring to the Israeli-Palestine conflict leave open several possibilities, including a false-flag operation or destructive activity intended as a distraction.\u003c/p\u003e\n"},{"n":2,"title":"Critical Apache HTTP Server vulnerability can allow remote code execution (CVE-2026-119618)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/cve-2026-119618-apache-http-server-rce","time":"08:49","priority":"MUST READ","score":92,"tldr":"Apache HTTP Server versions 2.4.55–2.4.70 with HTTP/2 enabled are affected by critical unauthenticated remote code execution flaw CVE-2026-119618; upgrade to 2.4.71 or later immediately, or disable HTTP/2 until patching is possible.","briefOverview":"\u003cp\u003eCVE-2026-119618 is a critical vulnerability in Apache HTTP Server’s HTTP/2 module, mod_http2, affecting Apache HTTP Server versions 2.4.55 through 2.4.70. The flaw can allow an unauthenticated remote attacker to run arbitrary code with the privileges of the web server process. The article states that no exploitation in the wild had been reported at publication.\u003c/p\u003e\n\n\u003cp\u003eThe issue is a race condition in the \u003ccode\u003eassign_headers()\u003c/code\u003e function, where improper coordination over shared resources can cause heap corruption that can be converted into remote code execution. Apache HTTP Server 2.4.71 and later fix the issue, while standalone GitHub mod_h2 builds should be updated to versions newer than 2.0.42. Organizations unable to patch immediately can reduce exposure by disabling HTTP/2 and limiting protocols to HTTP/1.1, although this does not fix the underlying flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical flaw in Apache HTTP Server's HTTP/2 module that can allow an unauthenticated remote attacker to execute arbitrary code.","Apache HTTP Server versions 2.4.55 through 2.4.70 are affected, and version 2.4.71 and later contain the fix.","The flaw is a race condition in the assign_headers() function that can cause heap corruption and be turned into remote code execution.","Organizations that cannot patch immediately can reduce exposure by disabling HTTP/2 and restricting Apache to HTTP/1.1.","The article states that there were no reports of exploitation in the wild at the time of publication."],"insights":["Servers behind a standard HTTP load balancer are not exposed in the usual setup, so what sits in front of Apache can materially change exposure.","Where an operating-system vendor has not yet published a fixed package, a vulnerable host may not appear as affected in Aikido detection, so administrators should also check their distribution’s tracker.","Disabling HTTP/2 removes the attack path but does not fix the underlying flaw, making it a temporary exposure-reduction measure rather than a replacement for upgrading.","In cloud environments, a compromised Apache server can provide a path toward adjacent microservices or cloud metadata endpoints."],"referencedReports":[{"title":"Apache HTTP Server Security Advisory","url":"https://httpd.apache.org/security/vulnerabilities_24.html","publisher":"Apache Software Foundation","context":"The article cites Apache's security advisory as the source listing CVE-2026-119618.","category":"advisory","primary":true}],"body":"\u003cp\u003eCVE-2026-119618 is a critical vulnerability in Apache HTTP Server’s HTTP/2 module, mod_http2, affecting Apache HTTP Server versions 2.4.55 through 2.4.70. The flaw can allow an unauthenticated remote attacker to run arbitrary code with the privileges of the web server process. The article states that no exploitation in the wild had been reported at publication.\u003c/p\u003e\n\n\u003cp\u003eThe issue is a race condition in the \u003ccode\u003eassign_headers()\u003c/code\u003e function, where improper coordination over shared resources can cause heap corruption that can be converted into remote code execution. Apache HTTP Server 2.4.71 and later fix the issue, while standalone GitHub mod_h2 builds should be updated to versions newer than 2.0.42. Organizations unable to patch immediately can reduce exposure by disabling HTTP/2 and limiting protocols to HTTP/1.1, although this does not fix the underlying flaw.\u003c/p\u003e\n"},{"n":3,"title":"Ransomware at the hypervisor layer: how attackers use ESXi and vCenter features for malicious purposes","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/esxi-ransomware/121959/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"A BlackNevas ransomware operation destroyed a virtualized environment by compromising vCenter and abusing legitimate VMware management features to enable ESXi SSH access, disrupt backups, and wipe virtual-machine data without exploiting a hypervisor vulnerability. The key defense is to treat vCenter, ESXi administration, and backup recovery as separate high-trust security boundaries with isolated identities, restricted access, and remotely retained telemetry.","briefOverview":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated a BlackNevas ransomware campaign that destroyed four ESXi hosts, every virtual machine on them, two vCenter Server Appliances, and connected backup infrastructure over 10 days. The attackers did not exploit an ESXi or vCenter vulnerability; instead, they used legitimate VMware management interfaces after obtaining privileged access through systems inside the organization’s perimeter. The case shows how compromise of the virtualization management plane can allow an attacker to affect many systems at once.\u003c/p\u003e\n\n\u003cp\u003eAfter logging in to a vCenter appliance through SSH as root, the attackers installed MeshAgent and a Ligolo-ng reverse tunnel disguised as a VMware-related systemd service. They used vCenter Host Profiles to enable SSH on ESXi hosts, delivered an ESXi payload through SFTP, tested it, and later ran it against the \u003ccode\u003e/vmfs/\u003c/code\u003e storage path, while virtual machines were rapidly stopped. Backup defenses and recovery infrastructure were disrupted before the ESXi impact, reinforcing the article’s recommendation to isolate vCenter administration, hypervisor identities, backup systems, and log collection from the wider production environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A BlackNevas ransomware campaign destroyed four ESXi hosts, all virtual machines on them, two vCenter Server Appliances, and connected backup infrastructure over a 10-day period.","The attackers used legitimate VMware management interfaces rather than exploiting a hypervisor vulnerability, enabling ESXi SSH through vCenter Host Profiles before directly accessing target hosts.","After accessing a vCenter appliance through SSH as root, the attackers deployed MeshAgent and later installed a Ligolo-ng reverse tunnel as a persistent systemd service disguised as vmware-vdma.","The ransomware payload was delivered to ESXi through SFTP, staged under /tmp, tested roughly three hours before detonation, and then executed against the /vmfs virtual-machine storage path.","The attackers disrupted backup infrastructure before the ESXi impact by disabling antivirus protection, stopping backup services, encrypting recovery systems, and disrupting administrative access."],"insights":["A fully patched ESXi environment can still face catastrophic impact if attackers compromise vCenter, because vCenter can legitimately change host settings and enable direct access to managed hosts.","The combination of a Host Profile change that enables SSH and a new SSH connection from vCenter to the same ESXi host is a higher-confidence warning than either event alone.","Guest-based security software may only see the effects of hypervisor-side disk modification, not the ESXi process that performed it, making vCenter and ESXi logs essential for investigation.","Backups are not protected merely because stored data is immutable; recovery also depends on separate identities, management systems, network access, and tested restoration procedures.","Rebooting an affected ESXi host before collecting logs can erase evidence because ESXi may store logs on temporary memory-backed storage unless persistent scratch space or remote logging is configured."],"referencedReports":[{"title":"Global report on cybersecurity services 2026","url":"https://securelist.com/global-report-security-services-2026/119233/","publisher":"kaspersky","context":"The article cites this report for GERT incident statistics showing ransomware accounted for 39.4% of cases handled in 2025.","category":"research","primary":false},{"title":"The state of ransomware in 2026","url":"https://securelist.com/state-of-ransomware-in-2026/119761/","publisher":"kaspersky","context":"The article references this research as evidence that ransomware remained a major threat at the beginning of 2026.","category":"research","primary":false},{"title":"Hypervisor ransomware: Multiple threat actor groups hop on leaked Babuk code to build ESXi lockers","url":"https://www.sentinelone.com/labs/hypervisor-ransomware-multiple-threat-actor-groups-hop-on-leaked-babuk-code-to-build-esxi-lockers/","publisher":"sentinelone","context":"The article cites SentinelOne's technical analysis documenting ransomware families that used ESXi lockers derived from leaked Babuk source code.","category":"research","primary":false},{"title":"Twelve group: Unified kill chain","url":"https://securelist.com/twelve-group-unified-kill-chain/113877/","publisher":"kaspersky","context":"The article references this technical analysis as an example of the Twelve group chaining vCenter vulnerabilities to deploy a web shell and establish persistence.","category":"research","primary":false},{"title":"Ransomware operators exploit ESXi hypervisor vulnerability for mass encryption","url":"https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/","publisher":"microsoft","context":"The article cites Microsoft's analysis of ransomware operators abusing CVE-2024-37085 to obtain full ESXi administration through Active Directory integration.","category":"research","primary":false},{"title":"ESXi hypervisors malware persistence","url":"https://cloud.google.com/blog/topics/threat-intelligence/esxi-hypervisors-malware-persistence","publisher":"mandiant","context":"The article references Mandiant's technical analysis documenting malicious vSphere Installation Bundles used for persistent access on compromised ESXi hosts.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated a BlackNevas ransomware campaign that destroyed four ESXi hosts, every virtual machine on them, two vCenter Server Appliances, and connected backup infrastructure over 10 days. The attackers did not exploit an ESXi or vCenter vulnerability; instead, they used legitimate VMware management interfaces after obtaining privileged access through systems inside the organization’s perimeter. The case shows how compromise of the virtualization management plane can allow an attacker to affect many systems at once.\u003c/p\u003e\n\n\u003cp\u003eAfter logging in to a vCenter appliance through SSH as root, the attackers installed MeshAgent and a Ligolo-ng reverse tunnel disguised as a VMware-related systemd service. They used vCenter Host Profiles to enable SSH on ESXi hosts, delivered an ESXi payload through SFTP, tested it, and later ran it against the \u003ccode\u003e/vmfs/\u003c/code\u003e storage path, while virtual machines were rapidly stopped. Backup defenses and recovery infrastructure were disrupted before the ESXi impact, reinforcing the article’s recommendation to isolate vCenter administration, hypervisor identities, backup systems, and log collection from the wider production environment.\u003c/p\u003e\n"},{"n":4,"title":"CERT-In’s AI Security Auditing Guidelines: Will Your AI System Need an Independent Audit?","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/cert-in-security-auditing-guideline/","time":"08:34","priority":"MAY READ","score":60,"tldr":"CERT-In’s AI Security Auditing Guidelines use an eight-factor risk score to place AI systems into audit tiers, with Tier 2 and above requiring independent audits by CERT-In-empanelled organizations. Adding autonomous actions such as issuing refunds can raise a chatbot’s tier and trigger more frequent, stringent oversight.","briefOverview":"\u003cp\u003eCERT-In issued its Artificial Intelligence (AI) Security Auditing Guidelines v1.0 on 4 November 2026, establishing a risk-based framework for assessing the security, governance, and resilience of AI systems. The guidance covers systems developed, procured, deployed, or operated in India, as well as those processing Indian data or serving Indian users. It applies regardless of whether the underlying model is built internally, supplied by a vendor, open-weight, or accessed through an API.\u003c/p\u003e\n\n\u003cp\u003eOrganizations score each AI system across eight factors, including impact, autonomy, data sensitivity, exposure, reversibility, sector importance, adversarial exposure, and complexity. Scores determine one of four tiers, with Tier 2 and above requiring independent audits by CERT-In-empanelled auditing organizations and higher tiers requiring more frequent or continuous assurance. The article illustrates that allowing a customer-support chatbot to issue refunds can raise its score from Tier 2 to Tier 3, while reportable AI incidents must be reported within six hours and supported by 180 days of retained logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-In’s AI Security Auditing Guidelines v1.0, dated 4 November 2026, cover AI systems developed, procured, deployed, or operated in India, as well as systems that process Indian data or serve Indian users.","The guidelines score AI systems from 1 to 4 across eight factors, producing totals from 8 to 32 that determine one of four risk tiers and associated audit requirements.","AI systems in Tier 2 and above, with scores of 13 or higher, require an independent audit by a CERT-In-empanelled auditing organization.","A customer-facing chatbot that can autonomously issue refunds may score higher than one that only answers questions, moving from the article’s illustrative Tier 2 example to Tier 3.","AI incidents meeting CERT-In’s reportable criteria must be reported within six hours, and the article states that the existing CERT-In Directions require 180-day log retention."],"insights":["Using a third-party AI model or API does not remove an organization’s system from audit scope, and missing vendor evidence is recorded as a scope limitation rather than proof that requirements are met.","Risk scoring must reflect what an AI system can actually do without credit for claimed safeguards, so a human approval control does not reduce the system’s inherent-risk score.","A system can be escalated to a higher tier regardless of its numerical score if it can autonomously execute transactions, code, or external communications, has privileged access, or cannot be reliably stopped or rolled back.","Auditors must independently validate an organization’s risk tier, and the higher tier applies when the auditor’s assessment exceeds the organization’s own assessment.","The guidelines instruct audit teams using AI tools to treat documents, logs, and tool outputs from the organization being audited as untrusted because they may contain attempts to manipulate the audit process."],"referencedReports":[{"title":"Artificial Intelligence (AI) Security Auditing Guidelines v1.0","url":"https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf","publisher":"CERT-In","context":"The article is based on these guidelines, which define the AI risk-scoring tiers, audit requirements, and security expectations discussed throughout.","category":"guide","primary":true}],"body":"\u003cp\u003eCERT-In issued its Artificial Intelligence (AI) Security Auditing Guidelines v1.0 on 4 November 2026, establishing a risk-based framework for assessing the security, governance, and resilience of AI systems. The guidance covers systems developed, procured, deployed, or operated in India, as well as those processing Indian data or serving Indian users. It applies regardless of whether the underlying model is built internally, supplied by a vendor, open-weight, or accessed through an API.\u003c/p\u003e\n\n\u003cp\u003eOrganizations score each AI system across eight factors, including impact, autonomy, data sensitivity, exposure, reversibility, sector importance, adversarial exposure, and complexity. Scores determine one of four tiers, with Tier 2 and above requiring independent audits by CERT-In-empanelled auditing organizations and higher tiers requiring more frequent or continuous assurance. The article illustrates that allowing a customer-support chatbot to issue refunds can raise its score from Tier 2 to Tier 3, while reportable AI incidents must be reported within six hours and supported by 180 days of retained logs.\u003c/p\u003e\n"},{"n":5,"title":"Health-ISAC Daily Cyber Headlines – November 13, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-13-2026/","time":"09:28","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 13, 2026 roundup highlights a global Microsoft 365 outage, healthcare security incidents in Singapore, critical Red Hat Quay and Apache flaws, and a UK warning over unauthorized medical-record access.","briefOverview":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 13, 2026, is a roundup of cybersecurity developments affecting healthcare and related technology. It covers a global Microsoft 365 outage, two healthcare incidents in Singapore, and an international malware disruption. The roundup also identifies critical flaws involving Red Hat Quay and Apache.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a UK regulatory warning about unauthorized access to medical records. Its coverage spans global, Singaporean, and UK developments, alongside issues involving Microsoft, Red Hat Quay, and Apache. The page also links to related Health-ISAC resources and previous daily cyber-headline editions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 13, 2026 daily cyber headlines cover a global Microsoft 365 outage.","The roundup includes two healthcare incidents in Singapore.","The article covers an international malware disruption and critical flaws involving Red Hat Quay and Apache.","The roundup also reports a UK regulatory warning about unauthorized access to medical records."],"insights":["The roundup brings together service disruption, healthcare incidents, software flaws, and unauthorized medical-record access in a single daily healthcare-focused briefing.","The issues described span multiple regions, including Singapore, the United Kingdom, and a global Microsoft 365 outage, showing that the roundup covers impacts beyond one country or organization."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 13, 2026, is a roundup of cybersecurity developments affecting healthcare and related technology. It covers a global Microsoft 365 outage, two healthcare incidents in Singapore, and an international malware disruption. The roundup also identifies critical flaws involving Red Hat Quay and Apache.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a UK regulatory warning about unauthorized access to medical records. Its coverage spans global, Singaporean, and UK developments, alongside issues involving Microsoft, Red Hat Quay, and Apache. The page also links to related Health-ISAC resources and previous daily cyber-headline editions.\u003c/p\u003e\n"}]</script>

#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
