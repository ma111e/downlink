<script type="application/json" id="dl-articles">[{"n":1,"title":"Socket for Asana Is Now Available","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/socket-for-asana-now-available?utm_medium=feed","time":"18:16","priority":"MAY READ","score":35,"tldr":"Socket launched a beta Asana integration for Business and Enterprise plans that turns Socket alerts into assigned, trackable Asana tasks. Teams can create tasks manually or through automated ticketing rules and keep alert and task status synced between both systems.","briefOverview":"\u003cp\u003eSocket launched Socket for Asana, a new integration that turns Socket alerts into assigned and trackable Asana tasks. Teams can create tasks one at a time from the Socket dashboard or automatically through ticketing rules. The integration is intended to remove the manual work of recreating findings in Asana and updating both Socket and Asana separately.\u003c/p\u003e\n\n\u003cp\u003eOwners or Admins in a Socket organization can connect an Asana workspace from \u003cstrong\u003eSettings → Integrations → Asana\u003c/strong\u003e using OAuth. Socket supports connecting multiple Asana workspaces to the same Socket organization, so tasks can be routed to the projects and teams responsible for resolving them. When creating a task from an alert, users can choose the Asana workspace and project, then add tags and an assignee.\u003c/p\u003e\n\n\u003cp\u003eAutomated ticketing rules can create and update Asana tasks when alert events occur across a Socket organization. Rules can use alert events, conditions such as type, priority, or repository, and settings for workspace, project, tags, assignee, and status updates. The integration can keep linked Asana tasks and Socket alerts in sync, including completing the Asana task when an alert is cleared or triage-ignoring the Socket alert when the linked Asana task is completed. Socket for Asana is available in beta on Business and Enterprise plans.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket launched Socket for Asana, an integration that turns Socket alerts into assigned and trackable Asana tasks.","Socket Owners or Admins can connect one or more Asana workspaces from Settings → Integrations → Asana in the Socket dashboard using OAuth.","Users can manually create an Asana task from a Socket alert by selecting the Asana workspace and project, then adding tags and an assignee.","Automated ticketing rules can create and update Asana tasks based on alert events, conditions, workspace, project, tags, assignee, and status update settings.","The integration can keep linked Asana tasks and Socket alerts in sync, including completing an Asana task when an alert is cleared or triage-ignoring a Socket alert when the linked Asana task is completed."],"insights":["Only an Owner or Admin in a Socket organization can connect Asana, so teams must involve someone with those Socket permissions before they can use the integration.","The integration supports multiple Asana workspaces in one Socket organization, which is useful for routing alerts to different projects and teams rather than forcing all remediation work into one workspace.","Ticketing rules can target alerts by attributes such as type, priority, and repository, allowing teams to send high-priority findings to a different workflow than lower-priority findings.","The two-way sync can reduce cleanup work after remediation because completing a linked Asana task can automatically triage-ignore the related Socket alert."],"referencedReports":[],"body":"\u003cp\u003eSocket launched Socket for Asana, a new integration that turns Socket alerts into assigned and trackable Asana tasks. Teams can create tasks one at a time from the Socket dashboard or automatically through ticketing rules. The integration is intended to remove the manual work of recreating findings in Asana and updating both Socket and Asana separately.\u003c/p\u003e\n\n\u003cp\u003eOwners or Admins in a Socket organization can connect an Asana workspace from \u003cstrong\u003eSettings → Integrations → Asana\u003c/strong\u003e using OAuth. Socket supports connecting multiple Asana workspaces to the same Socket organization, so tasks can be routed to the projects and teams responsible for resolving them. When creating a task from an alert, users can choose the Asana workspace and project, then add tags and an assignee.\u003c/p\u003e\n\n\u003cp\u003eAutomated ticketing rules can create and update Asana tasks when alert events occur across a Socket organization. Rules can use alert events, conditions such as type, priority, or repository, and settings for workspace, project, tags, assignee, and status updates. The integration can keep linked Asana tasks and Socket alerts in sync, including completing the Asana task when an alert is cleared or triage-ignoring the Socket alert when the linked Asana task is completed. Socket for Asana is available in beta on Business and Enterprise plans.\u003c/p\u003e\n"}]</script>
