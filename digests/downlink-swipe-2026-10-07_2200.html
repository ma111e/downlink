<script type="application/json" id="dl-articles">[{"n":1,"title":"Ransomware recovery CEO charged over secret ransom payments","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ransomware-recovery-ceo-charged-over-secret-ransom-payments/","time":"23:04","priority":"SHOULD READ","score":78,"tldr":"MonsterCloud owner Zohar Pinhasi has been charged with wire-fraud offenses for allegedly secretly paying ransomware gangs for decryption keys while claiming the company used proprietary recovery technology. Prosecutors say the firm facilitated more than $8 million in ransoms and charged victims over $19 million for remediation services.","briefOverview":"\u003cp\u003eZohar Pinhasi, owner of Florida-based ransomware remediation company MonsterCloud, was indicted in the Eastern District of New York on charges of conspiracy to commit wire fraud and two counts of wire fraud. Prosecutors allege that from June 2018 through June 2023, he misled customers by claiming MonsterCloud could recover encrypted data using proprietary technology without paying the criminals responsible. Pinhasi surrendered, pleaded not guilty, and was released on a $2 million bond; he faces up to 20 years in prison if convicted.\u003c/p\u003e\n\n\u003cp\u003eAccording to the indictment, MonsterCloud allegedly obtained decryption keys by contacting ransomware operators and paying them, often as its first step rather than only after other recovery efforts failed. Prosecutors say the company then used decrypted files supplied through those payments as proof that it could restore customer data, while charging customers far more than the ransom amounts. The alleged operation facilitated more than \u003cspan class=\"math inline\"\u003e\\(8 million in ransom payments and charged hundreds of companies in the United States and Canada more than \\)\u003c/span\u003e19 million for recovery and remediation services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["MonsterCloud owner Zohar Pinhasi was charged with one count of conspiracy to commit wire fraud and two counts of wire fraud over an alleged ransomware-decryption scheme that prosecutors say operated from June 2018 through June 2023.","Prosecutors allege that MonsterCloud claimed it could recover encrypted customer data using proprietary technology, but instead commonly contacted ransomware operators and paid them for decryption keys.","The indictment alleges that MonsterCloud charged clients substantially more than the ransoms it paid, including one case involving an approximately $8,200 payment to a ransomware gang and a roughly $150,000 charge to the victim.","Prosecutors say Pinhasi and co-conspirators facilitated more than $8 million in ransom payments while charging hundreds of U.S. and Canadian companies more than $19 million for recovery and remediation services.","Pinhasi pleaded not guilty after surrendering and was released on a $2 million bond, according to the U.S. Attorney's Office."],"insights":["Although some MonsterCloud contracts disclosed that it might communicate with or pay cybercriminals, prosecutors allege the contracts represented this as a fallback after other recovery methods had failed rather than the usual first step.","The indictment alleges that decrypted sample files presented as proof of MonsterCloud’s recovery capability were supplied by the ransomware operations after payment, which could make paid decryption appear to be an independent technical solution.","A 2019 ProPublica investigation described a test in which researchers posing as ransomware victims received payment offers at attacker-controlled email accounts, which they traced to recovery firms including MonsterCloud.","The cited customer charges show that the alleged markup was not uniform: prosecutors describe one case rising from about $8,200 to $150,000 and another from about $236,000 to $380,000."],"referencedReports":[{"title":"2019 ProPublica investigation","url":"http://features.propublica.org/ransomware/ransomware-attack-data-recovery-firms-paying-hackers/","publisher":"propublica","context":"The article cites this investigation for earlier reporting that MonsterCloud and other recovery firms sometimes sought to pay ransomware operators while presenting other recovery options to clients.","category":"news","primary":false}],"body":"\u003cp\u003eZohar Pinhasi, owner of Florida-based ransomware remediation company MonsterCloud, was indicted in the Eastern District of New York on charges of conspiracy to commit wire fraud and two counts of wire fraud. Prosecutors allege that from June 2018 through June 2023, he misled customers by claiming MonsterCloud could recover encrypted data using proprietary technology without paying the criminals responsible. Pinhasi surrendered, pleaded not guilty, and was released on a $2 million bond; he faces up to 20 years in prison if convicted.\u003c/p\u003e\n\n\u003cp\u003eAccording to the indictment, MonsterCloud allegedly obtained decryption keys by contacting ransomware operators and paying them, often as its first step rather than only after other recovery efforts failed. Prosecutors say the company then used decrypted files supplied through those payments as proof that it could restore customer data, while charging customers far more than the ransom amounts. The alleged operation facilitated more than \u003cspan class=\"math inline\"\u003e\\(8 million in ransom payments and charged hundreds of companies in the United States and Canada more than \\)\u003c/span\u003e19 million for recovery and remediation services.\u003c/p\u003e\n"},{"n":2,"title":"Evolution of Web3 in Cloud Supply Chain Attacks","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/web3-cloud-supply-chain-attacks/","time":"22:00","priority":"MAY READ","score":60,"tldr":"Supply-chain malware is increasingly using blockchain-based Web3 mechanisms to dynamically hide and update command-and-control infrastructure while stealing cloud credentials from developer systems and CI/CD pipelines. Organizations should treat unexpected blockchain traffic from development tools as suspicious and enforce endpoint monitoring and build-pipeline integrity controls.","briefOverview":"\u003cp\u003eThreat actors are increasingly combining open-source software supply-chain compromises with Web3-based command-and-control infrastructure to steal cloud credentials from developers and CI/CD systems. The article highlights the ChainDrop npm worm and the PolinRider campaign, which targeted packages and developer workflows to collect cloud access keys, service-account credentials, deployment secrets, and short-lived identity tokens. These techniques can provide access to cloud management consoles and APIs and may bypass multifactor authentication when other protections are absent.\u003c/p\u003e\n\n\u003cp\u003eWeb3 command-and-control has evolved from querying fixed smart contracts for a server address, to placing encrypted instructions in blockchain transaction data, to encoding an IPv4 address in a zero-value transaction recipient address. This makes traditional domain blocking and static indicator blocklists less effective because attackers can update infrastructure through blockchain transactions without changing malicious package code. The article recommends identifying whether blockchain traffic is expected in an organization, monitoring unexpected blockchain connections from developer tools and build runners, and detecting unauthorized changes to package scripts, repository configuration, and workspace automation before builds execute.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are using blockchain-based Web3 mechanisms to dynamically resolve command-and-control endpoints instead of hard-coding domains or IP addresses in malicious software.","The ChainDrop npm worm infected more than 400 packages and used installation-time scripts to harvest cloud identity keys, CI/CD tokens, and short-lived OIDC federation keys.","The PolinRider campaign targeted multiple package ecosystems, including npm, Go modules, and Packagist, and used repository settings, web resources, and IDE workspace automation to run credential-stealing loaders.","The article describes an evolution from smart-contract storage through transaction input data hiding to zero-value transactions that encode an active command-and-control IP address in the recipient wallet address.","The article recommends behavioral monitoring for unexpected blockchain activity, process-level inspection of developer and CI/CD systems, and automated controls to detect unauthorized build configuration and package-script changes."],"insights":["For organizations that do not use blockchain services, any outbound blockchain activity can be treated as a high-confidence anomaly rather than relying only on known malicious addresses or domains.","ChainDrop searches the memory of running build processes, allowing it to capture short-lived cloud credentials that may never be written to disk.","The NullReceiver technique can encode a command-and-control IPv4 address in a zero-value blockchain transaction’s recipient address, leaving no domain, payload, smart contract, or transaction data field for filters to inspect.","Malicious supply-chain packages can establish persistence through project task hooks and workspace automation, causing payloads to run again when a developer opens a project or begins an AI coding session."],"referencedReports":[{"title":"PolinRider: North Korea-Linked Supply Chain Campaign Expands Across Open Source Ecosystems","url":"https://socket.dev/blog/polinrider-north-korea-linked-supply-chain-campaign-expands","publisher":"socket","context":"The article cites this analysis for details on the expanding PolinRider supply-chain campaign.","category":"research","primary":false},{"title":"ChainVeil and ViteVenom are DPRK’s PolinRider Campaign","url":"https://opensourcemalware.com/blog/chainveil-and-vitevenom-dprk-polinrider-campaign","publisher":"opensourcemalware","context":"The article references this analysis when describing PolinRider variants and their Web3 command-and-control mechanisms.","category":"research","primary":false},{"title":"Supply Chain Attack Using Ethereum Smart Contracts to Distribute Multi-Platform Malware","url":"https://checkmarx.com/uncategorized/supply-chain-attack-using-ethereum-smart-contracts-to-distribute-multi-platform-malware/","publisher":"checkmarx","context":"The article cites this research as an example of late-2024 npm supply-chain campaigns using Ethereum smart contracts.","category":"research","primary":false},{"title":"“EtherHiding” — Hiding Web2 Malicious Code in Web3 Smart Contracts","url":"https://guard.io/labs/etherhiding-hiding-web2-malicious-code-in-web3-smart-contracts","publisher":"guard.io","context":"The article uses Guard.io’s EtherHiding taxonomy to describe early Web3 command-and-control implementations.","category":"research","primary":false},{"title":"Cross-Chain TxDataHiding Crypto Heist: A Very Chainful Process (Part 1)","url":"https://ransom-isac.org/blog/cross-chain-txdatahiding-crypto-heist/","publisher":"ransom-isac","context":"The article cites this technical analysis for the TxDataHiding approach of embedding encrypted command-and-control data in blockchain transactions.","category":"research","primary":false},{"title":"DPRK Adopts EtherHiding: Nation-State Malware Hiding on Blockchains","url":"https://cloud.google.com/blog/topics/threat-intelligence/dprk-adopts-etherhiding","publisher":"google-cloud","context":"The article references this research to support reporting that a DPRK-affiliated actor uses EtherHiding to distribute malware and steal cryptocurrency.","category":"research","primary":false},{"title":"Six npm Packages Use Ethereum Transactions to Retrieve Malicious Payloads","url":"https://www.sonatype.com/blog/six-npm-packages-use-ethereum-transactions-to-retrieve-malicious-payloads","publisher":"sonatype","context":"The article cites this analysis for supply-chain compromises using the NullReceiver zero-data address-resolution technique.","category":"research","primary":false},{"title":"Amazon identifies North Korean hacker group behind open-source supply chain attacks","url":"https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/","publisher":"amazon-web-services","context":"The article references Amazon Threat Intelligence findings on North Korean groups targeting open-source dependencies to enter enterprise infrastructure.","category":"research","primary":false},{"title":"Mitigating the Axios npm supply chain compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/04/01/mitigating-the-axios-npm-supply-chain-compromise/","publisher":"microsoft","context":"The article cites this report when describing the compromise of the axios maintainer and the malicious plain-crypto-js dependency.","category":"advisory","primary":false},{"title":"From package to postinstall payload: Inside the Mastra npm supply chain compromise by Sapphire Sleet","url":"https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/","publisher":"microsoft","context":"The article references this technical analysis for the Mastra AI campaign’s poisoned npm packages and credential-stealing build hooks.","category":"research","primary":false},{"title":"Supply chain attack on arrayref","url":"https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/","publisher":"rust","context":"The article cites this notice when describing the poisoning of the arrayref crate on crates.io.","category":"advisory","primary":false}],"body":"\u003cp\u003eThreat actors are increasingly combining open-source software supply-chain compromises with Web3-based command-and-control infrastructure to steal cloud credentials from developers and CI/CD systems. The article highlights the ChainDrop npm worm and the PolinRider campaign, which targeted packages and developer workflows to collect cloud access keys, service-account credentials, deployment secrets, and short-lived identity tokens. These techniques can provide access to cloud management consoles and APIs and may bypass multifactor authentication when other protections are absent.\u003c/p\u003e\n\n\u003cp\u003eWeb3 command-and-control has evolved from querying fixed smart contracts for a server address, to placing encrypted instructions in blockchain transaction data, to encoding an IPv4 address in a zero-value transaction recipient address. This makes traditional domain blocking and static indicator blocklists less effective because attackers can update infrastructure through blockchain transactions without changing malicious package code. The article recommends identifying whether blockchain traffic is expected in an organization, monitoring unexpected blockchain connections from developer tools and build runners, and detecting unauthorized changes to package scripts, repository configuration, and workspace automation before builds execute.\u003c/p\u003e\n"}]</script>
