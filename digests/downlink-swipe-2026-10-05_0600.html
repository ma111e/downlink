<script type="application/json" id="dl-articles">[{"n":3,"title":"New NetScaler Zero-Day Exploited in Targeted Attacks Can Knock SAML Deployments Offline","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/new-netscaler-zero-day-exploited-in.html","time":"06:40","priority":"MUST READ","score":94,"tldr":"Citrix patched CVE-2026-88779, an actively exploited high-severity memory overflow in NetScaler ADC and Gateway SAML deployments that can cause persistent denial of service. Organizations using NetScaler as a SAML service or identity provider should update to the fixed releases immediately.","briefOverview":"\u003cp\u003eCitrix released security updates for CVE-2026-88779, a high-severity memory overflow vulnerability in NetScaler ADC and NetScaler Gateway with a CVSS score of 8.7. Citrix said the flaw has been exploited in targeted zero-day attacks against unmitigated customer-managed deployments. The company said successful exploitation can cause denial of service and, if repeatedly triggered, may leave the service unavailable.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability applies when NetScaler is configured as a SAML service provider or SAML identity provider, which organizations can check through specific SAML configuration entries. Citrix said it has not identified an impact on customer-data integrity, indicating its analysis found the issue affects service availability. Fixed versions are available for supported NetScaler 14.1, 13.1, FIPS, and NDcPP releases, and CISA added the flaw to its Known Exploited Vulnerabilities catalog with an October 7, 2026 patch deadline for U.S. federal agencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released updates for CVE-2026-88779, a high-severity memory overflow in NetScaler ADC and NetScaler Gateway with a CVSS score of 8.7.","Citrix said the flaw has been used in targeted attacks against unpatched NetScaler deployments and can cause denial of service, potentially leaving a service unavailable if repeatedly triggered.","The issue affects customer-managed NetScaler deployments configured as either a SAML service provider or a SAML identity provider.","Citrix said it has not identified an impact on the integrity of customer data from CVE-2026-88779.","CISA added CVE-2026-88779 to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to apply patches by October 7, 2026."],"insights":["Organizations can quickly determine whether they meet the affected configuration condition by checking for \"add authentication samlAction\" entries for SAML service provider use or \"add authentication samlIdPProfile\" entries for SAML identity provider use.","The flaw is limited to service availability rather than identified customer-data integrity impact, but repeated triggering can keep the affected service offline.","watchTowr said it reproduced the flaw within hours after observing activity against NetScaler honeypots, while Citrix confirmed targeted exploitation of unpatched deployments.","The advisory follows active exploitation of two other NetScaler flaws, CVE-2026-88771 and CVE-2026-88772, which attackers have used to install web shells and tunneling tools."],"referencedReports":[{"title":"CVE-2026-88779","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697174","publisher":"citrix","context":"Citrix's security advisory identifies the NetScaler flaw, affected versions, and fixed releases.","category":"advisory","primary":true},{"title":"Understanding and Addressing CVE-2026-88779 in Citrix NetScaler ADC and Citrix NetScaler Gateway","url":"https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/","publisher":"citrix","context":"The article cites Citrix's technical explanation of the memory overflow and the deployment conditions required for denial of service.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/04/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article references CISA's notice adding CVE-2026-88779 to the Known Exploited Vulnerabilities catalog and setting a federal remediation deadline.","category":"advisory","primary":false}],"body":"\u003cp\u003eCitrix released security updates for CVE-2026-88779, a high-severity memory overflow vulnerability in NetScaler ADC and NetScaler Gateway with a CVSS score of 8.7. Citrix said the flaw has been exploited in targeted zero-day attacks against unmitigated customer-managed deployments. The company said successful exploitation can cause denial of service and, if repeatedly triggered, may leave the service unavailable.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability applies when NetScaler is configured as a SAML service provider or SAML identity provider, which organizations can check through specific SAML configuration entries. Citrix said it has not identified an impact on customer-data integrity, indicating its analysis found the issue affects service availability. Fixed versions are available for supported NetScaler 14.1, 13.1, FIPS, and NDcPP releases, and CISA added the flaw to its Known Exploited Vulnerabilities catalog with an October 7, 2026 patch deadline for U.S. federal agencies.\u003c/p\u003e\n"},{"n":4,"title":"Attackers Target Rejetto HFS Flaw That Enables Admin Session Forgery and RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-target-rejetto-hfs-flaw-that.html","time":"08:09","priority":"MUST READ","score":94,"tldr":"Attackers are actively exploiting CVE-2026-61500 in Rejetto HTTP File Server versions 3.0.0–3.2.0 to forge administrator sessions and achieve remote code execution. Organizations should upgrade to HFS 3.2.1 or later immediately.","briefOverview":"\u003cp\u003eA critical flaw in Rejetto HTTP File Server (HFS), tracked as CVE-2026-61500 and rated 9.3, is facing active exploitation attempts, according to VulnCheck. The issue affects HFS versions 3.0.0 through 3.2.0 and can allow remote attackers to forge an administrator session and take control of affected systems. VulnCheck detected attempts on October 1, 2026, including activity from an unnamed China-based threat actor targeting vulnerable hosts in the United States.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from HFS generating its session-cookie signing key with the non-cryptographic JavaScript \u003ccode\u003eMath.random()\u003c/code\u003e function while exposing outputs from the same generator during unauthenticated login. An attacker can gather a small number of login responses, reconstruct the generator’s state, recover the signing key, and create a valid administrator cookie. With administrator access, the documented \u003ccode\u003eserver_code\u003c/code\u003e configuration feature can be used to execute server-side JavaScript and achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eRejetto released a patch in HFS version 3.2.1 in July 2026, while a Python proof-of-concept exploit became public in late September. Horizon3.ai researcher Zach Hanley said Anthropic’s Mythos model was used to discover the vulnerability. This is the second Rejetto HFS flaw known to be actively exploited, following CVE-2024-23692, which was used in 2024 to distribute cryptocurrency miners, trojans, and HATVIBE malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-61500 is a critical flaw in Rejetto HTTP File Server versions 3.0.0 through 3.2.0 that allows administrator session forgery and remote code execution.","The flaw results from HFS using the non-cryptographic Math.random() generator for its session-cookie signing key while exposing outputs from the same generator during unauthenticated login.","A remote attacker can collect login responses, reconstruct the generator state, recover the signing key, and forge an administrator session cookie.","Rejetto released a fix in HFS version 3.2.1 in July 2026, and a public Python proof-of-concept exploit was released in late September 2026.","VulnCheck detected exploitation attempts on October 1, 2026, including an unnamed China-based threat actor targeting vulnerable hosts in the United States."],"insights":["The issue is not limited to guessing a password: exposed login data can be used to recreate the server’s random-number state and produce a valid administrator session cookie.","HFS’s documented server_code configuration feature turns the session-forgery flaw into full remote code execution once an attacker gains administrator access.","Exploitation was detected shortly after public technical details and a Python proof-of-concept became available, highlighting the short window between public disclosure and real-world targeting.","Rejetto HFS has now had two high-severity flaws observed under active exploitation, following CVE-2024-23692 in 2024."],"referencedReports":[{"title":"CVE-2026-61500","url":"https://github.com/advisories/GHSA-xxrm-3f86-v97j","publisher":"GitHub Advisory Database","context":"The article cites this advisory for details on the predictable session-cookie signing key in Rejetto HFS.","category":"advisory","primary":true},{"title":"Anthropic Mythos: Rejetto HFS RCE","url":"https://horizon3.ai/attack-research/disclosures/anthropic-mythos-rejetto-hfs-rce/","publisher":"Horizon3.ai","context":"The article cites Horizon3.ai researcher Zach Hanley’s technical disclosure describing the authentication bypass and remote code execution path.","category":"research","primary":true}],"body":"\u003cp\u003eA critical flaw in Rejetto HTTP File Server (HFS), tracked as CVE-2026-61500 and rated 9.3, is facing active exploitation attempts, according to VulnCheck. The issue affects HFS versions 3.0.0 through 3.2.0 and can allow remote attackers to forge an administrator session and take control of affected systems. VulnCheck detected attempts on October 1, 2026, including activity from an unnamed China-based threat actor targeting vulnerable hosts in the United States.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from HFS generating its session-cookie signing key with the non-cryptographic JavaScript \u003ccode\u003eMath.random()\u003c/code\u003e function while exposing outputs from the same generator during unauthenticated login. An attacker can gather a small number of login responses, reconstruct the generator’s state, recover the signing key, and create a valid administrator cookie. With administrator access, the documented \u003ccode\u003eserver_code\u003c/code\u003e configuration feature can be used to execute server-side JavaScript and achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eRejetto released a patch in HFS version 3.2.1 in July 2026, while a Python proof-of-concept exploit became public in late September. Horizon3.ai researcher Zach Hanley said Anthropic’s Mythos model was used to discover the vulnerability. This is the second Rejetto HFS flaw known to be actively exploited, following CVE-2024-23692, which was used in 2024 to distribute cryptocurrency miners, trojans, and HATVIBE malware.\u003c/p\u003e\n"},{"n":2,"title":"Google halts open-source bug bounty program amid AI spam surge","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/google/google-halts-open-source-bug-bounty-program-amid-ai-spam-surge/","time":"08:27","priority":"SHOULD READ","score":79,"tldr":"Google has temporarily halted product-vulnerability submissions to its Open Source Software Vulnerability Rewards Program after a surge of mostly invalid AI-generated reports. Supply-chain reports and existing submissions remain unaffected while Google redesigns the program, with an update expected in Q1 2027.","briefOverview":"\u003cp\u003eGoogle has temporarily stopped accepting product-vulnerability submissions through its Open Source Software Vulnerability Rewards Program (OSS VRP) after a significant increase in automated reports, most of which it says are invalid. The program covers Google-maintained open-source projects including Golang, Angular, Bazel, Protocol Buffers, and Fuchsia, as well as some third-party dependencies and repository configurations. Google said the pause does not affect supply-chain reports or outstanding reports, including product-vulnerability reports submitted before October 1, 2026.\u003c/p\u003e\n\n\u003cp\u003eResearchers can still submit high-impact open-source fixes through Google’s Patch Rewards Program, which offers rewards up to $15,000, and can report qualifying issues in Google Cloud open-source repositories through the Cloud VRP. Google is revising the OSS VRP to address the automated-submission problem and expects to provide an update in Q1 2027. The article notes similar pressure elsewhere: curl ended its HackerOne bug bounty program after AI-generated reports overwhelmed maintainers, while Microsoft has warned that AI-assisted vulnerability discovery raises operational demands across the software industry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google temporarily suspended product-vulnerability submissions to its Open Source Software Vulnerability Rewards Program because of a significant increase in automated reports, most of which were invalid.","The suspension does not affect supply-chain reports or reports submitted before October 1, 2026.","Researchers can still submit open-source security patches through Google’s Patch Rewards Program and report Google Cloud open-source repository issues affecting Cloud products through the Cloud VRP.","Google said it is redesigning the OSS VRP to address automated submissions and plans to provide an update in Q1 2027.","Curl ended its HackerOne bug bounty program in January after a flood of AI-generated reports, while Intel removed financial rewards from its Intigriti program in mid-September."],"insights":["Google’s pause is limited to OSS VRP product-vulnerability submissions: supply-chain reports, previously submitted reports, Patch Rewards submissions, and qualifying Google Cloud open-source reports remain available paths for researchers.","The program redesign is expected to take months, as Google committed only to an update in Q1 2027 after stopping affected submissions in October 2026.","The issue is not isolated to Google: curl ended its HackerOne bounty program after AI-generated report volume, and Intel removed financial rewards from its Intigriti program.","Google paid a record $17.1 million to more than 700 researchers in 2025, illustrating that the automated-report problem is affecting a large, active vulnerability-reporting ecosystem.","Microsoft warned that AI-assisted discovery is increasing the volume of identified software flaws and the operational effort needed to handle them."],"referencedReports":[],"body":"\u003cp\u003eGoogle has temporarily stopped accepting product-vulnerability submissions through its Open Source Software Vulnerability Rewards Program (OSS VRP) after a significant increase in automated reports, most of which it says are invalid. The program covers Google-maintained open-source projects including Golang, Angular, Bazel, Protocol Buffers, and Fuchsia, as well as some third-party dependencies and repository configurations. Google said the pause does not affect supply-chain reports or outstanding reports, including product-vulnerability reports submitted before October 1, 2026.\u003c/p\u003e\n\n\u003cp\u003eResearchers can still submit high-impact open-source fixes through Google’s Patch Rewards Program, which offers rewards up to $15,000, and can report qualifying issues in Google Cloud open-source repositories through the Cloud VRP. Google is revising the OSS VRP to address the automated-submission problem and expects to provide an update in Q1 2027. The article notes similar pressure elsewhere: curl ended its HackerOne bug bounty program after AI-generated reports overwhelmed maintainers, while Microsoft has warned that AI-assisted vulnerability discovery raises operational demands across the software industry.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft: Windows KB5124010 update crashes some games and apps","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-windows-kb5124010-update-crashes-some-games-and-apps/","time":"09:37","priority":"MAY READ","score":63,"tldr":"Microsoft confirmed that the optional Windows 11 KB5124010 preview update can cause some games and applications using built-in AC-3 (Dolby Digital) audio decoding to crash or close unexpectedly. The company is working on a fix; affected users can avoid installing the update for now.","briefOverview":"\u003cp\u003eMicrosoft confirmed that the September 2026 KB5124010 Windows 11 preview update can cause some games and applications using AC-3, also known as Dolby Digital, audio decoding to crash. Affected programs may fail to launch, close without warning, or stop working when users access certain features such as music playback. Microsoft said the affected applications can include games, media players, and some productivity software.\u003c/p\u003e\n\n\u003cp\u003eKB5124010 is optional for most Windows users and requires selecting “Download and install,” limiting potential exposure. However, it can install automatically on Windows 11 24H2 devices with the “Get the latest updates as soon as they’re available” setting enabled. Microsoft said modern apps that do not use Windows for this audio decoding are unaffected, while older applications relying on Windows’ built-in audio decoder are most commonly impacted; the company is working on a fix but has not provided a timeline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the September 2026 KB5124010 Windows 11 preview update can cause some games and applications that use AC-3 (Dolby Digital) audio decoding to crash or close unexpectedly.","KB5124010 is optional for most users, but it installs automatically on Windows 11 24H2 devices where the “Get the latest updates as soon as they’re available” setting is enabled.","Affected applications may fail to start, close without warning, or stop working after users access features such as music playback.","Microsoft said modern applications that do not rely on Windows for this audio decoding are not affected, while the issue is most common in legacy applications using Windows’ built-in audio decoder.","Microsoft is working on a resolution but has not provided a timeline for a fix."],"insights":["The potential impact is narrower than a general Windows audio failure because Microsoft says many modern applications do not use Windows for this type of audio decoding and are therefore unaffected.","A Windows 11 24H2 device can receive KB5124010 automatically if its “Get the latest updates as soon as they’re available” setting is enabled, despite the update otherwise being optional.","The problem may only appear when a person uses a particular feature, such as playing music, rather than immediately when the affected application starts.","The crashes are most commonly associated with older applications that rely on Windows’ built-in audio decoding component."],"referencedReports":[{"title":"Applications which require AC-3 audio decoding might close unexpectedly","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-26h2#applications-which-require-ac-3-audio-decoding-might-close-unexpectedly","publisher":"microsoft","context":"Microsoft’s Windows release health dashboard documents the KB5124010 issue affecting applications that use AC-3 audio decoding.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that the September 2026 KB5124010 Windows 11 preview update can cause some games and applications using AC-3, also known as Dolby Digital, audio decoding to crash. Affected programs may fail to launch, close without warning, or stop working when users access certain features such as music playback. Microsoft said the affected applications can include games, media players, and some productivity software.\u003c/p\u003e\n\n\u003cp\u003eKB5124010 is optional for most Windows users and requires selecting “Download and install,” limiting potential exposure. However, it can install automatically on Windows 11 24H2 devices with the “Get the latest updates as soon as they’re available” setting enabled. Microsoft said modern apps that do not use Windows for this audio decoding are unaffected, while older applications relying on Windows’ built-in audio decoder are most commonly impacted; the company is working on a fix but has not provided a timeline.\u003c/p\u003e\n"}]</script>
