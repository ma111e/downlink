<script type="application/json" id="dl-articles">[{"n":1,"title":"Mini Shai-Hulud hits openapi-react-query-codegen: 10 malicious npm versions","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/mini-shai-hulud-hits-openapi-react-query-codegen/","time":"16:19","priority":"MUST READ","score":94,"tldr":"Ten malicious versions of @7nohe/openapi-react-query-codegen were published to npm after an attacker abused a GitHub Actions issue_comment release workflow to mint trusted publishing tokens without stealing maintainer credentials. Some versions executed without install scripts via node-gyp, so affected users must check for the listed versions and payload files, update to a clean release, and rotate exposed credentials.","briefOverview":"\u003cp\u003eOn August 28, 2026, ten malicious versions of \u003ccode\u003e@7nohe/openapi-react-query-codegen\u003c/code\u003e were published to npm between 20:00 and 20:21 UTC. The package generates React Query hooks from an OpenAPI schema and has roughly 150,000 weekly downloads. The \u003ccode\u003elatest\u003c/code\u003e tag pointed to malicious version \u003ccode\u003e3.0.4\u003c/code\u003e during the window, and npm removed all ten versions on August 29 while restoring \u003ccode\u003elatest\u003c/code\u003e to \u003ccode\u003e3.0.2\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attacker did not need a stolen npm token or hijacked maintainer account, but instead abused a GitHub release workflow triggered by \u003ccode\u003eissue_comment\u003c/code\u003e events. The workflow lacked an author association check, checked out pull request head code from a fork, and had \u003ccode\u003eid-token: write\u003c/code\u003e, allowing npm trusted publishing tokens to be minted through OIDC. All ten releases had valid SLSA provenance attestations because they were produced by the project’s real release workflow, so provenance did not separate malicious artifacts from legitimate builds.\u003c/p\u003e\n\n\u003cp\u003eThe malicious releases used two execution paths, which makes detection more complicated. Eight versions included \u003ccode\u003ebinding.gyp\u003c/code\u003e and \u003ccode\u003e3FWCvzduYZg.js\u003c/code\u003e, with four of them executing through the native build path without any install script, while two prereleases had a malicious \u003ccode\u003epreinstall\u003c/code\u003e but no payload files. The payload targeted cloud, registry, CI, developer, and AI assistant configuration surfaces, and the article recommends auditing lockfiles and install logs, updating to a clean version, rotating reachable credentials, reviewing AI assistant configuration files, and checking similar release workflow patterns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 28, 2026, ten malicious versions of @7nohe/openapi-react-query-codegen were published to npm between 20:00 and 20:21 UTC, with the latest tag pointing to malicious version 3.0.4 during that window.","The attacker abused a GitHub Actions release workflow triggered by issue_comment events that checked out pull request code and had id-token: write permission, allowing npm trusted publishing tokens to be minted without a stolen npm token or hijacked maintainer account.","Eight of the malicious releases contained a multi-stage loader that targeted cloud, registry, and developer credentials, while two prerelease versions used a preinstall script but did not include the payload files.","Four affected versions had no install script and executed through node-gyp evaluation of a malicious binding.gyp file, so scanning only for install hooks would miss them.","The article recommends auditing lockfiles and install logs for the ten affected versions, updating to a clean version, rotating credentials reachable from affected machines or runners, and reviewing AI assistant configuration files for unexpected changes."],"insights":["Valid SLSA provenance did not distinguish the malicious releases from legitimate builds because the artifacts were produced by the project’s genuine release workflow.","Disabling or scanning only for install scripts would not have caught all affected versions because four releases executed through the native build path using binding.gyp despite having no install hook.","Detection must combine package-specific file indicators, such as binding.gyp and 3FWCvzduYZg.js, with direct lockfile checks for the two prereleases that did not include those payload files.","All ten malicious versions were removed from npm, so a pinned affected lockfile now fails with a 404 during npm ci, which is described as a safe outcome but not a self-explanatory one.","The payload referenced multiple AI coding assistant configuration files and included a Model Context Protocol-shaped server stub, making review of assistant configuration files a specific remediation step."],"referencedReports":[{"title":"Upstream incident report and maintainer postmortem","url":"https://github.com/7nohe/openapi-react-query-codegen/issues/217","publisher":"7nohe/openapi-react-query-codegen","context":"The article cites this issue for the maintainer’s postmortem describing how the release workflow was abused and confirming the incident scope.","category":"research","primary":true},{"title":"GHSA-9pvf-vcx3-x239","url":"https://github.com/7nohe/openapi-react-query-codegen/security/advisories/GHSA-9pvf-vcx3-x239","publisher":"GitHub Security Advisory","context":"The article references this advisory as the published security advisory for the malicious @7nohe/openapi-react-query-codegen versions, with CVSS 9.6.","category":"advisory","primary":true}],"body":"\u003cp\u003eOn August 28, 2026, ten malicious versions of \u003ccode\u003e@7nohe/openapi-react-query-codegen\u003c/code\u003e were published to npm between 20:00 and 20:21 UTC. The package generates React Query hooks from an OpenAPI schema and has roughly 150,000 weekly downloads. The \u003ccode\u003elatest\u003c/code\u003e tag pointed to malicious version \u003ccode\u003e3.0.4\u003c/code\u003e during the window, and npm removed all ten versions on August 29 while restoring \u003ccode\u003elatest\u003c/code\u003e to \u003ccode\u003e3.0.2\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attacker did not need a stolen npm token or hijacked maintainer account, but instead abused a GitHub release workflow triggered by \u003ccode\u003eissue_comment\u003c/code\u003e events. The workflow lacked an author association check, checked out pull request head code from a fork, and had \u003ccode\u003eid-token: write\u003c/code\u003e, allowing npm trusted publishing tokens to be minted through OIDC. All ten releases had valid SLSA provenance attestations because they were produced by the project’s real release workflow, so provenance did not separate malicious artifacts from legitimate builds.\u003c/p\u003e\n\n\u003cp\u003eThe malicious releases used two execution paths, which makes detection more complicated. Eight versions included \u003ccode\u003ebinding.gyp\u003c/code\u003e and \u003ccode\u003e3FWCvzduYZg.js\u003c/code\u003e, with four of them executing through the native build path without any install script, while two prereleases had a malicious \u003ccode\u003epreinstall\u003c/code\u003e but no payload files. The payload targeted cloud, registry, CI, developer, and AI assistant configuration surfaces, and the article recommends auditing lockfiles and install logs, updating to a clean version, rotating reachable credentials, reviewing AI assistant configuration files, and checking similar release workflow patterns.\u003c/p\u003e\n"}]</script>
