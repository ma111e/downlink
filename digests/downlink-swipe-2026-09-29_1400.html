<script type="application/json" id="dl-articles">[{"n":6,"title":"New Spectre-v2 BTR Attack Leaks Linux Memory Despite Existing Defenses","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-spectre-v2-btr-attack-leaks-linux.html","time":"17:00","priority":"SHOULD READ","score":84,"tldr":"Researchers disclosed Branch Target Reuse (BTR), a new Spectre-v2 technique that abuses stale branch-prediction entries in JIT engines to transiently execute reused code locations and leak secrets. Proof-of-concept Linux kernel exploits recovered a root password hash from fully patched Intel systems, and fixes have been merged for the affected cBPF JIT.","briefOverview":"\u003cp\u003eResearchers from VUSec and Scuola Superiore Sant\u0026rsquo;Anna disclosed Branch Target Reuse (BTR), a new Spectre-v2 variant affecting Just-In-Time (JIT) engines. BTR was evaluated against Mozilla Firefox\u0026rsquo;s SpiderMonkey, GraalVM, and the Linux kernel\u0026rsquo;s cBPF JIT, with different exploitability characteristics and leakage rates. The researchers developed two end-to-end Linux kernel proof-of-concept exploits that recovered a root password hash within minutes from a fully patched Intel system using default protections.\u003c/p\u003e\n\n\u003cp\u003eBTR exploits stale indirect branch-prediction entries that may remain after JIT-generated code is freed, even though processors restore normal code consistency after code changes. An attacker can cause a code region to be freed and partially reused, then trigger an indirect branch that speculatively jumps to the old location, enabling transient control-flow hijacking and secret disclosure. The technique can bypass software hardening or reach misaligned instruction sequences, although it requires the stale prediction entry to persist and be selected by the processor. Linux mitigations were released and merged as CVE-2026-64507 and CVE-2026-64508, while GraalVM randomized JIT code-cache locations and Mozilla is prioritizing site isolation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers from VUSec and Scuola Superiore Sant'Anna disclosed Branch Target Reuse (BTR), a new Spectre-v2 variant affecting JIT engines.","BTR exploits stale indirect branch-prediction entries that can remain after JIT-generated code is freed and its memory is reused, enabling transient control-flow hijacking and data disclosure.","The researchers found SpiderMonkey, GraalVM, and the Linux kernel's cBPF JIT affected, with differing exploitability and data-leakage rates.","Two proof-of-concept Linux kernel exploits recovered a root password hash within minutes from a fully patched Intel system with default protections enabled.","Linux mitigations for BTR were released and merged as CVE-2026-64507 and CVE-2026-64508, while GraalVM randomized JIT code-cache locations and Mozilla is prioritizing site isolation."],"insights":["BTR can work despite existing software hardening because it redirects speculative execution to an outdated code location, potentially bypassing protections or causing the processor to interpret instructions from a misaligned position.","The attack depends on a narrow condition: the processor must retain an old branch-prediction record after code is freed, and must choose that stale record when predicting the next branch.","Different affected JIT engines do not present the same risk, as the researchers reported markedly different exploitability characteristics and data-leakage rates across SpiderMonkey, GraalVM, and Linux cBPF JIT.","GraalVM's mitigation focuses on reducing reuse of old code-memory regions by randomizing JIT code-cache locations, rather than directly clearing stale processor predictions."],"referencedReports":[{"title":"Branch Target Reuse (BTR)","url":"https://www.vusec.net/projects/btr","publisher":"vusec and scuola superiore sant'anna","context":"The article cites this research project for the newly disclosed Spectre-v2 BTR technique and its accompanying technical analysis.","category":"research","primary":true},{"title":"CVE-2026-64507","url":"https://lore.kernel.org/linux-cve-announce/2026072554-CVE-2026-64507-5288@gregkh/","publisher":"linux kernel","context":"The article links this Linux kernel CVE announcement as one of the mitigations released and merged for BTR.","category":"advisory","primary":false},{"title":"CVE-2026-64508","url":"https://lore.kernel.org/linux-cve-announce/2026072554-CVE-2026-64508-fe26@gregkh/","publisher":"linux kernel","context":"The article links this Linux kernel CVE announcement as another mitigation released and merged for BTR.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers from VUSec and Scuola Superiore Sant\u0026rsquo;Anna disclosed Branch Target Reuse (BTR), a new Spectre-v2 variant affecting Just-In-Time (JIT) engines. BTR was evaluated against Mozilla Firefox\u0026rsquo;s SpiderMonkey, GraalVM, and the Linux kernel\u0026rsquo;s cBPF JIT, with different exploitability characteristics and leakage rates. The researchers developed two end-to-end Linux kernel proof-of-concept exploits that recovered a root password hash within minutes from a fully patched Intel system using default protections.\u003c/p\u003e\n\n\u003cp\u003eBTR exploits stale indirect branch-prediction entries that may remain after JIT-generated code is freed, even though processors restore normal code consistency after code changes. An attacker can cause a code region to be freed and partially reused, then trigger an indirect branch that speculatively jumps to the old location, enabling transient control-flow hijacking and secret disclosure. The technique can bypass software hardening or reach misaligned instruction sequences, although it requires the stale prediction entry to persist and be selected by the processor. Linux mitigations were released and merged as CVE-2026-64507 and CVE-2026-64508, while GraalVM randomized JIT code-cache locations and Mozilla is prioritizing site isolation.\u003c/p\u003e\n"},{"n":2,"title":"New Spectre v2 attack variant leaks Linux root password hash in minutes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-spectre-v2-attack-variant-leaks-linux-root-password-hash-in-minutes/","time":"17:10","priority":"SHOULD READ","score":82,"tldr":"Researchers demonstrated Branch Target Reuse (BTR), a Spectre v2 variant that abuses stale CPU branch-prediction data after JIT code reuse to leak a Linux root password hash in minutes. The issue affects tested Intel, AMD, and Arm CPUs; Linux kernel fixes are available, so users should update their OS and firmware.","briefOverview":"\u003cp\u003eResearchers at VUsec and Scuola Superiore Sant\u0026rsquo;Anna disclosed Branch Target Reuse (BTR), a new Spectre v2 attack variant that can recover a Linux root password hash in minutes. BTR abuses stale CPU branch-prediction information after a just-in-time compiler frees code and places different code at the same memory address. The researchers said this demonstrates that self-modifying-code-based transient-execution attacks can be practical in real-world environments.\u003c/p\u003e\n\n\u003cp\u003eIn Linux tests, unprivileged classic BPF programs trained a prediction, then triggered reuse of the old program memory with attacker-crafted code. The resulting speculative execution created measurable cache traces that let the researchers infer data byte by byte and recover a running \u003ccode\u003esu\u003c/code\u003e process\u0026rsquo;s root password hash at roughly eight bytes per second, averaging three to five minutes on Raptor Cove and Lion Cove. The issues, tracked as CVE-2026-64507 and CVE-2026-64508, have Linux kernel fixes available; VUsec reported confirming the underlying behavior on tested Intel, AMD, and Arm CPUs, and recommends applying operating-system and firmware updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at VUsec and Scuola Superiore Sant'Anna developed Branch Target Reuse (BTR), a Spectre v2 variant that reuses stale processor branch predictions after JIT-generated code is replaced at the same memory address.","In Linux tests using unprivileged classic BPF programs, the researchers recovered a running su process's root password hash at about eight bytes per second, taking three to five minutes on average on Raptor Cove and Lion Cove systems.","The researchers reported that their Linux cBPF exploits worked both under the default configuration and with constant blinding enabled.","VUsec confirmed the underlying behavior on every CPU it tested, including Intel, AMD, and Arm processors.","The issues are identified as CVE-2026-64507 and CVE-2026-64508, and fixes have been merged into the Linux kernel."],"insights":["BTR challenges the long-held assumption that attacks based on dynamically generated and replaced code were impractical because of self-modifying-code behavior in common JIT engines.","The Linux proof of concept still recovered the password hash when constant blinding was enabled by encoding attacker-controlled instructions in jump offsets.","Although BTR exposed a root password hash rather than the plaintext password, the hash could be attacked offline, with the result depending on the password's strength and hashing method.","The researchers found evidence of stale prediction survival in Firefox's SpiderMonkey and a speculative sandbox-check bypass path in GraalVM, but did not complete practical exploits against either engine.","According to VUsec, current CPUs lack a mechanism to synchronize branch-prediction state with changed code, which is why the behavior appeared across the Intel, AMD, and Arm processors tested."],"referencedReports":[{"title":"BTR","url":"https://www.vusec.net/projects/btr/","publisher":"vusec","context":"The article cites VUsec's BTR research page for the researchers' claim that their end-to-end Linux exploit leaked a root password hash within three to five minutes.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at VUsec and Scuola Superiore Sant\u0026rsquo;Anna disclosed Branch Target Reuse (BTR), a new Spectre v2 attack variant that can recover a Linux root password hash in minutes. BTR abuses stale CPU branch-prediction information after a just-in-time compiler frees code and places different code at the same memory address. The researchers said this demonstrates that self-modifying-code-based transient-execution attacks can be practical in real-world environments.\u003c/p\u003e\n\n\u003cp\u003eIn Linux tests, unprivileged classic BPF programs trained a prediction, then triggered reuse of the old program memory with attacker-crafted code. The resulting speculative execution created measurable cache traces that let the researchers infer data byte by byte and recover a running \u003ccode\u003esu\u003c/code\u003e process\u0026rsquo;s root password hash at roughly eight bytes per second, averaging three to five minutes on Raptor Cove and Lion Cove. The issues, tracked as CVE-2026-64507 and CVE-2026-64508, have Linux kernel fixes available; VUsec reported confirming the underlying behavior on tested Intel, AMD, and Arm CPUs, and recommends applying operating-system and firmware updates.\u003c/p\u003e\n"},{"n":3,"title":"Automated AI agent used to breach cybersecurity nonprofit DIVD","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/automated-ai-agent-used-to-breach-cybersecurity-nonprofit-divd/","time":"15:39","priority":"SHOULD READ","score":80,"tldr":"Dutch vulnerability-disclosure nonprofit DIVD says it was breached through an undisclosed technical flaw, with an autonomous AI agent conducting noisy and poorly executed post-exploitation activity. The organization is investigating, has notified authorities, and plans to share more details on October 1.","briefOverview":"\u003cp\u003eThe Dutch Institute for Vulnerability Disclosure (DIVD), a nonprofit that helps organizations address known security weaknesses, reported that it was breached after seven years of uneventful operations. DIVD said the intrusion exploited an undisclosed technical vulnerability, which it specifically said was not Citrix NetScaler. The organization described the incident as a serious but loud and messy attack that left substantial evidence for investigators.\u003c/p\u003e\n\n\u003cp\u003eDIVD believes an automated AI agent conducted post-exploitation activity, deciding its next actions independently and leaving comments that over-explained its reasoning. According to the organization, the poorly trained or configured agent made mistakes, including interfering with its own password-spraying activity during an adversary-in-the-middle operation. DIVD has notified police, the Dutch data-protection authority, and the National Cyber Security Center, and plans a fuller update on October 1 while working to identify and notify other possible victims of the same flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Dutch Institute for Vulnerability Disclosure (DIVD) reported that it was breached through an undisclosed technical vulnerability that it said was not Citrix NetScaler.","DIVD said the intruder used an automated AI agent for post-compromise activity, with the agent choosing its next steps autonomously.","According to DIVD, the activity was loud and messy, and the agent made mistakes such as disrupting its own password-spraying attempt during an adversary-in-the-middle operation.","DIVD notified police, the Dutch data-protection authority, and the National Cyber Security Center, and said its investigation is ongoing.","DIVD plans to provide a more detailed update on October 1 and notify other possible victims of the same vulnerability when it can."],"insights":["DIVD said the AI agent’s actions were sufficiently sloppy and over-explained in its comments that investigators have material to reconstruct and reverse-engineer the incident.","The agent reportedly disrupted its own password-spraying effort while conducting an adversary-in-the-middle operation, indicating that autonomous activity did not prevent operational mistakes.","DIVD is withholding technical details of the flaw while the investigation continues because disclosure could affect other potential victims."],"referencedReports":[],"body":"\u003cp\u003eThe Dutch Institute for Vulnerability Disclosure (DIVD), a nonprofit that helps organizations address known security weaknesses, reported that it was breached after seven years of uneventful operations. DIVD said the intrusion exploited an undisclosed technical vulnerability, which it specifically said was not Citrix NetScaler. The organization described the incident as a serious but loud and messy attack that left substantial evidence for investigators.\u003c/p\u003e\n\n\u003cp\u003eDIVD believes an automated AI agent conducted post-exploitation activity, deciding its next actions independently and leaving comments that over-explained its reasoning. According to the organization, the poorly trained or configured agent made mistakes, including interfering with its own password-spraying activity during an adversary-in-the-middle operation. DIVD has notified police, the Dutch data-protection authority, and the National Cyber Security Center, and plans a fuller update on October 1 while working to identify and notify other possible victims of the same flaw.\u003c/p\u003e\n"},{"n":4,"title":"Windows 11 2026 Update released, here's everything you need to know","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-2026-update-released-heres-everything-you-need-to-know/","time":"17:37","priority":"MAY READ","score":68,"tldr":"Microsoft has begun broadly rolling out Windows 11 26H2, a small enablement update for 24H2 and 25H2 systems that mainly resets the support lifecycle because most features have already arrived through monthly updates. PCs running the separate 26H1 branch cannot upgrade directly to 26H2.","briefOverview":"\u003cp\u003eMicrosoft has begun rolling out the Windows 11 2026 Update, version 26H2, to everyone. Although it is the annual feature update, the company says users may not notice major changes because Windows 11 versions 24H2, 25H2, and 26H2 share the same servicing branch. Most new features and improvements have already been delivered gradually through monthly updates.\u003c/p\u003e\n\n\u003cp\u003eFor devices already running 24H2 or 25H2, 26H2 is delivered as a small enablement package and should install much like a regular monthly update rather than a full operating system replacement. Commercial PCs may have previously disabled features enabled by 26H2, including Windows settings backup, app-specific taskbar actions, and some File Explorer improvements. Devices on Windows 11 26H1 cannot upgrade directly to 26H2 because they use a different Windows core, while installing 26H2 starts a new support period of 24 months for Home and Pro editions and 36 months for Enterprise and Education editions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft has started rolling out the Windows 11 2026 Update, version 26H2, to all users.","Windows 11 versions 24H2, 25H2, and 26H2 share a servicing branch, allowing 26H2 to be installed as a small enablement package rather than a full operating system replacement.","Many 26H2 features may already be present on fully updated systems because Microsoft has been introducing them through monthly updates.","For commercial PCs, 26H2 enables Windows settings backup, app-specific taskbar actions, and some File Explorer improvements that were not previously enabled by default.","Devices running Windows 11 version 26H1 cannot update directly to 26H2 because 26H1 uses a different Windows core."],"insights":["For organizations already using Windows 11 24H2 or 25H2, moving to 26H2 should resemble applying a regular monthly update rather than deploying a large operating system upgrade.","Windows 11’s annual version labels no longer necessarily indicate a distinct set of new features, because features are being delivered gradually through monthly updates and later enabled by version.","Installing 26H2 renews the Windows support lifecycle, providing 24 months of support for Home and Pro editions and 36 months for Enterprise and Education editions.","The separate 26H1 branch creates an upgrade exception: devices on it must wait for a future Windows release instead of moving directly to 26H2."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft has begun rolling out the Windows 11 2026 Update, version 26H2, to everyone. Although it is the annual feature update, the company says users may not notice major changes because Windows 11 versions 24H2, 25H2, and 26H2 share the same servicing branch. Most new features and improvements have already been delivered gradually through monthly updates.\u003c/p\u003e\n\n\u003cp\u003eFor devices already running 24H2 or 25H2, 26H2 is delivered as a small enablement package and should install much like a regular monthly update rather than a full operating system replacement. Commercial PCs may have previously disabled features enabled by 26H2, including Windows settings backup, app-specific taskbar actions, and some File Explorer improvements. Devices on Windows 11 26H1 cannot upgrade directly to 26H2 because they use a different Windows core, while installing 26H2 starts a new support period of 24 months for Home and Pro editions and 36 months for Enterprise and Education editions.\u003c/p\u003e\n"},{"n":5,"title":"Kiteworks Fixes Critical Flaw Found During Nine-Hour Precautionary Shutdown","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/kiteworks-fixes-critical-flaw-found.html","time":"14:13","priority":"MAY READ","score":68,"tldr":"Kiteworks discovered and patched a previously unknown critical vulnerability affecting a capability enabled by fewer than 1% of customers during a nine-hour precautionary shutdown prompted by intelligence about a possible imminent attack. The company says it found no evidence of exploitation and has advised customers to restore their systems.","briefOverview":"\u003cp\u003eKiteworks said it identified and fixed a previously unknown critical security vulnerability during a scheduled nine-hour precautionary shutdown. The company worked with federal intelligence authorities over the weekend after receiving intelligence about a potential imminent cyberattack. Kiteworks said the shutdown was preventive and not a response to a confirmed breach.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was limited to a capability enabled by fewer than 1% of customers, and other Kiteworks products were not affected. Kiteworks deployed a fix during the shutdown and added another protective layer across all environments, stating that it found no evidence of malicious exploitation. The company has not disclosed technical details or assigned a CVE identifier, and it recommended that customers bring their systems back online after the threat window passed without observed anomalies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kiteworks identified and fixed a previously unknown critical security vulnerability during a nine-hour precautionary shutdown.","The vulnerability was limited to a capability enabled by fewer than 1% of Kiteworks customers, and other Kiteworks products were not affected.","Kiteworks said it added an additional protective layer across all environments and found no evidence that the vulnerability had been maliciously exploited.","The company had taken customer and hosted environments offline after receiving intelligence about a potential imminent cyberattack, and lifted the shutdown recommendation on September 27, 2026.","Kiteworks has not disclosed technical details of the flaw or assigned it a CVE identifier."],"insights":["The precautionary shutdown was not presented as a response to a confirmed breach; it was a proactive measure based on intelligence about a possible imminent attack.","Taking systems offline gave Kiteworks the window to identify and deploy a fix for an unknown critical issue before any confirmed malicious use was observed.","Although the identified issue was confined to a feature enabled by fewer than 1% of customers, Kiteworks applied an additional protective layer across all environments.","Because Kiteworks has not released technical details or a CVE identifier, customers and outside defenders have limited public information for independently tracking the flaw."],"referencedReports":[],"body":"\u003cp\u003eKiteworks said it identified and fixed a previously unknown critical security vulnerability during a scheduled nine-hour precautionary shutdown. The company worked with federal intelligence authorities over the weekend after receiving intelligence about a potential imminent cyberattack. Kiteworks said the shutdown was preventive and not a response to a confirmed breach.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was limited to a capability enabled by fewer than 1% of customers, and other Kiteworks products were not affected. Kiteworks deployed a fix during the shutdown and added another protective layer across all environments, stating that it found no evidence of malicious exploitation. The company has not disclosed technical details or assigned a CVE identifier, and it recommended that customers bring their systems back online after the threat window passed without observed anomalies.\u003c/p\u003e\n"},{"n":7,"title":"upm Launches as a Fast, Tiny Package Manager Written in TypeScript","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/upm-package-manager?utm_medium=feed","time":"15:38","priority":"MAY READ","score":55,"tldr":"UnJS has launched upm, a 250 KB TypeScript npm package manager designed for fast installs, embeddable JavaScript use, and safer defaults such as disabled lifecycle scripts and a 24-hour package release cooldown. The prerelease tool supports common npm configuration and existing lockfiles with significant compatibility limits.","briefOverview":"\u003cp\u003ePooya Parsa, a Nuxt contributor and creator of Nitro and UnJS, introduced upm, a TypeScript package manager for the npm registry. upm uses Node.js built-in networking, worker threads, compression, and filesystem tools, and its build is reported as 256 KB on disk and 84.5 KB packed. It provides a JavaScript API, allowing other tools to use its installer or resolver without starting a separate process.\u003c/p\u003e\n\n\u003cp\u003eupm supports install, add, remove, run, frozen-lockfile mode, selected \u003ccode\u003e.npmrc\u003c/code\u003e settings, and imports from several existing lockfile formats when no \u003ccode\u003eupm.lock\u003c/code\u003e is present. It avoids hoisting undeclared dependencies and uses a shared store with hardlinks where possible. For security, it skips dependency lifecycle scripts by default and applies a configurable 24-hour minimum release age for newly selected versions, although it is still a prerelease with no update command, no Git or local-directory dependencies, and limited peer-dependency handling.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Pooya Parsa introduced upm, a TypeScript package manager for the npm registry that is about 250 KB and can also be called through a JavaScript API.","In the project's benchmarks, upm ranked first overall for cold installs across Nitro, Nuxt, and Next.js tests, while warm-install results placed it fourth behind Bun, aube, and Deno.","upm supports install, add, remove, run, frozen-lockfile mode, selected .npmrc settings, and installation from package-lock.json, pnpm-lock.yaml, or bun.lock when no upm.lock exists.","By default, upm skips dependency lifecycle scripts and requires newly selected package versions to be at least 24 hours old, though the release-delay setting can be changed or disabled.","upm is a prerelease with limitations including no update command, no Git or local-directory dependencies, limited peer-dependency handling, and restricted compatibility with other package-manager lockfiles."],"insights":["upm’s release-age safeguard can cause an installation to select the newest older eligible version instead of the current latest release, or fail entirely when no version in the requested range is old enough.","The 24-hour release delay does not protect projects that already have a version recorded in upm.lock or explicitly request an exact new version.","Disabling automatic dependency scripts reduces one common risk path, but packages that rely on installation-time builds or downloads may require additional manual setup.","upm’s small size may matter in CI because restoring a larger package-manager binary from cache can offset startup-speed advantages, although the article notes that its comparison does not measure complete CI jobs.","Projects can test upm against existing package-lock.json, pnpm-lock.yaml, or bun.lock files without replacing them, but this does not work for lockfiles containing workspaces, patches, Git dependencies, or file dependencies."],"referencedReports":[],"body":"\u003cp\u003ePooya Parsa, a Nuxt contributor and creator of Nitro and UnJS, introduced upm, a TypeScript package manager for the npm registry. upm uses Node.js built-in networking, worker threads, compression, and filesystem tools, and its build is reported as 256 KB on disk and 84.5 KB packed. It provides a JavaScript API, allowing other tools to use its installer or resolver without starting a separate process.\u003c/p\u003e\n\n\u003cp\u003eupm supports install, add, remove, run, frozen-lockfile mode, selected \u003ccode\u003e.npmrc\u003c/cod d is planned to add Entra ID monitoring and automated alerting in future releases."],"insights":["The article’s central distinction is that access rules reduce risk only before an incident; real-time event monitoring is needed to reveal when those rules are being bypassed or misused.","Adding session-ID context can turn a raw system-change record into an attributable action by identifying the user behind it, which the article presents as a way to make event logs more useful for investigations.","Consolidating related actions, such as creating and then renaming a security group, into one record can reduce the effort required to interpret multi-step administrative activity.","The article describes a response workflow in which an investigator can immediately review an account’s access and change its lifecycle status to temporarily restrict it while the investigation continues."],"referencedReports":[],"body":"\u003cp\u003eThis sponsored article promotes tenfold Software’s approach to identity security, arguing that periodic access reviews and role-based access controls alone cannot identify active misuse of accounts. It says organizations face expanding attack surfaces from cloud applications and external accounts, alongside increasingly sophisticated threats. The article contends that real-time visibility into identity-related events is needed to investigate potential breaches as they occur.\u003c/p\u003e\n\n\u003cp\u003eTenfold’s event-auditing platform is described as ingesting Windows and Active Directory logs in real time, enriching them with session-ID context to identify the user behind a change, and consolidating related multistep events into a single record. It offers searchable and shareable custom queries for events such as privileged-account logins and password-reset requests. The product combines identity governance, data access governance, and event monitoring, and the article says teams can review an account’s access and temporarily lock it down during a
