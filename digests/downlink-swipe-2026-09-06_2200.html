on.","Astra may appear in ChatGPT Work before it becomes available in the regular Chat model picker for some Plus users.","OpenAI said GPT-6 Astra is already available to all Pro, Enterprise, and Business Premium users in ChatGPT Work and Codex, and is also live in the API.","OpenAI says Astra usage is included within existing subscription limits, with the option to buy credits for additional usage.","OpenAI has not said whether ChatGPT Astra will roll out to free users, who currently have access to GPT-5.6 Sol and GPT-5."],"insights":["Plus users who do not see Astra in the regular Chat model picker may still be able to access it by checking the ChatGPT Work section.","The rollout is not uniform across ChatGPT surfaces, since one Plus account had Astra in Work while the normal Chat model picker still did not offer it.","Organizations or users needing Astra immediately may already have access through Pro, Enterprise, Business Premium, Codex, or the API rather than waiting for the Plus rollout to complete.","Plus subscribers do not need to change plans just to try Astra, because OpenAI says its usage is included within existing subscription limits."],"referencedReports":[],"body":"\u003cp\u003eOpenAI is gradually rolling out ChatGPT Astra, described as its most powerful model to date, to users with a $20 ChatGPT Plus subscription. The model may appear in ChatGPT Work before it becomes available in the regular Chat model picker. In the article’s example, Astra was available in the author’s Plus account under Work, but not yet in normal Chat.\u003c/p\u003e\n\n\u003cp\u003eOpenAI previously said GPT-6 Astra is available to all Pro, Enterprise, and Business Premium users in ChatGPT Work and Codex, and that it is also live in the API. The company said it may take a few days to roll out to Plus and Business users. OpenAI says Astra usage is included within existing subscription limits, and users who need more usage will be able to buy credits.\u003c/p\u003e\n\n\u003cp\u003
