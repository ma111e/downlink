<script type="application/json" id="dl-articles">[{"n":3,"title":"Bitget hacked via zero-day in third-party security products","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bitget-hacked-via-zero-day-in-third-party-security-products/","time":"11:11","priority":"MUST READ","score":94,"tldr":"Bitget says attackers stole $387.5 million from its hot and warm wallets after exploiting zero-day flaws in two unnamed third-party security appliances, then moving laterally into its production wallet environment. Investigators found web shells, malware, and a custom withdrawal tool; Bitget attributes the heist to North Korean hackers.","briefOverview":"\u003cp\u003eBitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two unnamed third-party security appliances. The exchange suspended withdrawals after detecting multiple unauthorized transfers involving ETH, XRP, BNB, AVAX, USDT, USDC, and other tokens across several blockchain networks. CEO Gracy Chen attributed the incident to North Korean hackers, citing IP behavior patterns and on-chain analysis.\u003c/p\u003e\n\n\u003cp\u003eInvestigations by SlowMist and Google Cloud\u0026rsquo;s Mandiant found that the attackers gained privileged access to two security appliances and used one of them to establish persistent access. SlowMist reported that hidden scripts running under a service process read a database password from an environment variable, while Mandiant said the attackers deployed a web shell and later moved to Bitget\u0026rsquo;s production wallet job server to install malicious packages. The attackers then used a custom withdrawal tool to conduct transfers for nearly three hours, and Bitget has launched a program offering a 5% bounty for help recovering or freezing the stolen funds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two third-party security appliances.","SlowMist and Mandiant found that the attackers used compromised security appliances to gain persistent access and move laterally to Bitget’s production wallet job server.","Investigators reported that the attackers deployed a web shell, malicious packages, and a custom withdrawal tool to carry out transfers over nearly three hours on September 25.","Bitget suspended withdrawals after detecting unauthorized transfers and later launched a Recovery Bounty Program offering a 5% reward for help recovering or freezing stolen funds.","Bitget CEO Gracy Chen attributed the incident to North Korean hackers, citing IP behavior patterns and on-chain analysis."],"insights":["The earliest identified malicious activity occurred on August 31, weeks before the unauthorized transfers were detected, indicating that the intruders had access before the theft.","A hidden script running under a legitimate service process read a database password from an environment variable, allowing the attackers to connect to Bitget’s database.","Compromising a third-party security appliance gave the attackers a path into Bitget’s production wallet job server, where they installed malicious packages and used a custom tool to initiate withdrawals.","The stolen assets spanned multiple tokens and seven blockchain networks, complicating recovery efforts and prompting Bitget to offer a 5% bounty for freezing or recovering funds."],"referencedReports":[{"title":"SlowMist Investigation Progress Report - Bitget","url":"https://github.com/slowmist/Knowledge-Base/blob/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf","publisher":"slowmist","context":"The article cites SlowMist's investigation findings on the initial compromise, hidden scripts, database-password access, and theft timeline.","category":"research","primary":true},{"title":"Bitget Status Update (MFR26-1029)","url":"https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf","publisher":"mandiant","context":"The article cites Mandiant's forensic findings that attackers compromised two third-party security appliances and moved laterally to Bitget's wallet job server.","category":"research","primary":true}],"body":"\u003cp\u003eBitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two unnamed third-party security appliances. The exchange suspended withdrawals after detecting multiple unauthorized transfers involving ETH, XRP, BNB, AVAX, USDT, USDC, and other tokens across several blockchain networks. CEO Gracy Chen attributed the incident to North Korean hackers, citing IP behavior patterns and on-chain analysis.\u003c/p\u003e\n\n\u003cp\u003eInvestigations by SlowMist and Google Cloud\u0026rsquo;s Mandiant found that the attackers gained privileged access to two security appliances and used one of them to establish persistent access. SlowMist reported that hidden scripts running under a service process read a database password from an environment variable, while Mandiant said the attackers deployed a web shell and later moved to Bitget\u0026rsquo;s production wallet job server to install malicious packages. The attackers then used a custom withdrawal tool to conduct transfers for nearly three hours, and Bitget has launched a program offering a 5% bounty for help recovering or freezing the stolen funds.\u003c/p\u003e\n"},{"n":4,"title":"Russian FSB-linked hackers scale up phishing attacks against Ukraine supporters","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-hackers-ukraine-blizzard","time":"12:00","priority":"SHOULD READ","score":88,"tldr":"Microsoft says the FSB-linked Star Blizzard group has expanded from targeted Ukraine-focused phishing to large-scale campaigns against more than 100 organizations, mainly in the U.S. and UK. The group now uses the RedFlick delivery method to install the CosmicPulse backdoor with fewer victim actions and improved evasion.","briefOverview":"\u003cp\u003eMicrosoft reported that the Russian FSB-linked hacking group Star Blizzard has expanded its phishing operations in 2026. Also known as Callisto and ColdRiver, the group has targeted Ukrainian individuals and institutions as well as NGOs, think tanks, governments, and financial institutions supporting Ukraine. More than 100 organizations, primarily in the United States and United Kingdom, have been affected.\u003c/p\u003e\n\n\u003cp\u003eThe group has shifted from highly targeted messages to campaigns sending tens or hundreds of emails, with Microsoft identifying at least 13 large-scale campaigns since January. Its early campaigns targeted Ukr.net users with fake notices about tax audits or unpaid fines, while later campaigns used fake event invitations and internal-looking messages aimed at international organizations. Star Blizzard also adopted a method Microsoft calls RedFlick, in which opening a file in a password-protected archive can use scheduled tasks to install the CosmicPulse backdoor with only one victim action, replacing the more involved ClickFix method.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that the Russian FSB-linked Star Blizzard group has expanded phishing operations in 2026, affecting more than 100 organizations primarily in the United States and United Kingdom.","Star Blizzard has targeted Ukrainian individuals and institutions as well as NGOs, think tanks, governments, and financial institutions that support Ukraine politically or financially.","Microsoft identified at least 13 large-scale phishing campaigns since January, reflecting a shift from highly targeted messages to campaigns involving tens or hundreds of emails.","Since March, the group has used accounts created on compromised websites and often sent fake conference or event invitations impersonating reputable think tanks or NGOs.","Star Blizzard’s RedFlick technique uses a password-protected archive and scheduled tasks to install the CosmicPulse backdoor after a victim opens a file, requiring only one victim action."],"insights":["Star Blizzard’s move from free email accounts to accounts created on compromised websites changes the apparent source of its phishing messages while continuing to impersonate trusted contacts or organizations.","The group’s earliest 2026 campaigns focused on Ukr.net users with fake tax-audit and unpaid-fine notices before expanding to international targets with counterfeit event invitations and internal-looking communications.","RedFlick reduces the infection process to one victim action, unlike the group’s earlier ClickFix method, which required several steps before CosmicPulse could be installed.","Microsoft said the combination of large-scale phishing and RedFlick is likely to improve Star Blizzard’s reach, ability to avoid detection, and likelihood of compromising targets."],"referencedReports":[{"title":"Star Blizzard refines phishing and malware delivery with the RedFlick technique","url":"https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/","publisher":"microsoft","context":"The article relies on Microsoft’s report for its findings on Star Blizzard’s expanded phishing campaigns and RedFlick malware-delivery method.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft reported that the Russian FSB-linked hacking group Star Blizzard has expanded its phishing operations in 2026. Also known as Callisto and ColdRiver, the group has targeted Ukrainian individuals and institutions as well as NGOs, think tanks, governments, and financial institutions supporting Ukraine. More than 100 organizations, primarily in the United States and United Kingdom, have been affected.\u003c/p\u003e\n\n\u003cp\u003eThe group has shifted from highly targeted messages to campaigns sending tens or hundreds of emails, with Microsoft identifying at least 13 large-scale campaigns since January. Its early campaigns targeted Ukr.net users with fake notices about tax audits or unpaid fines, while later campaigns used fake event invitations and internal-looking messages aimed at international organizations. Star Blizzard also adopted a method Microsoft calls RedFlick, in which opening a file in a password-protected archive can use scheduled tasks to install the CosmicPulse backdoor with only one victim action, replacing the more involved ClickFix method.\u003c/p\u003e\n"},{"n":2,"title":"TeamViewer urges users to patch severe flaws “as soon as possible”","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/teamviewer-urges-users-to-patch-severe-flaws-as-soon-as-possible/","time":"12:25","priority":"SHOULD READ","score":87,"tldr":"TeamViewer urges customers to update Full Client and Host software to version 15.82 immediately to fix five high-severity flaws, including an access-control bypass that could enable unauthorized remote code execution. The company says it has seen no evidence of public exploits or active exploitation.","briefOverview":"\u003cp\u003eTeamViewer has urged customers to update its Full Client and Host software to version 15.82 as soon as possible to address five high-severity security vulnerabilities. The affected software runs on Windows, Linux, and macOS, and the company said the fixes are also available in supported maintenance and legacy releases. TeamViewer stated that it is not aware of public disclosure or active exploitation of the flaws.\u003c/p\u003e\n\n\u003cp\u003eThe most severe issue, CVE-2026-92370, is an access-control weakness that could allow remote threat actors to perform unauthorized actions leading to code execution on targeted systems. The four other issues involve path traversal, a heap-based buffer overflow, a race condition, and improper path validation; they could allow local attackers to execute code with the current user\u0026rsquo;s privileges or raise privileges to NT AUTHORITY/SYSTEM or root. The update is significant because TeamViewer\u0026rsquo;s remote-access software has previously been abused by criminals, including ransomware groups, to access systems and deploy malicious tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TeamViewer urged customers to update TeamViewer Full Client and Host software to version 15.82 as soon as possible to address five high-severity vulnerabilities.","The most severe issue, CVE-2026-92370, is an access-control weakness in TeamViewer software for Windows, Linux, and macOS that could allow unauthorized remote actions leading to code execution on affected systems.","The other four flaws include a path traversal issue, a heap-based buffer overflow, a race condition, and improper path validation that could enable local attackers to execute code or elevate privileges.","TeamViewer stated that the vulnerabilities are fixed in version 15.82 and supported maintenance and legacy releases, and that it is unaware of public disclosure or active exploitation.","The article notes that criminals, including ransomware groups, have previously abused TeamViewer remote-access software to access victims' systems and deploy malicious tools."],"insights":["TeamViewer issued a rare advisory telling all users to update “as soon as possible” despite stating that it knows of no public exploit code or active exploitation.","The fixes span TeamViewer Full Client and Host installations across Windows, Linux, and macOS, making the advisory relevant beyond a single operating system.","The vulnerability set includes both a flaw that could permit unauthorized remote actions and flaws that could let a local attacker gain the current user’s privileges or escalate to SYSTEM or root.","The urgency is heightened by TeamViewer’s role as remote-access software, which the article says has previously been abused by criminals and ransomware groups to enter systems and deploy malicious tools."],"referencedReports":[{"title":"TV-2026-1010 Security Bulletin","url":"https://www.teamviewer.com/en-us/resources/trust-center/security-bulletins/tv-2026-1010/","publisher":"teamviewer","context":"TeamViewer's security advisory urges users to update because it addresses multiple vulnerabilities in TeamViewer Full Client, Host, and related services.","category":"advisory","primary":true}],"body":"\u003cp\u003eTeamViewer has urged customers to update its Full Client and Host software to version 15.82 as soon as possible to address five high-severity security vulnerabilities. The affected software runs on Windows, Linux, and macOS, and the company said the fixes are also available in supported maintenance and legacy releases. TeamViewer stated that it is not aware of public disclosure or active exploitation of the flaws.\u003c/p\u003e\n\n\u003cp\u003eThe most severe issue, CVE-2026-92370, is an access-control weakness that could allow remote threat actors to perform unauthorized actions leading to code execution on targeted systems. The four other issues involve path traversal, a heap-based buffer overflow, a race condition, and improper path validation; they could allow local attackers to execute code with the current user\u0026rsquo;s privileges or raise privileges to NT AUTHORITY/SYSTEM or root. The update is significant because TeamViewer\u0026rsquo;s remote-access software has previously been abused by criminals, including ransomware groups, to access systems and deploy malicious tools.\u003c/p\u003e\n"},{"n":5,"title":"AI Coding Agents Exposed 13,000 Internal Images, Including Billing Records, on GitHub","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/ai-coding-agents-exposed-13000-internal.html","time":"11:30","priority":"SHOULD READ","score":83,"tldr":"AI coding agents and the gitshot tool exposed more than 13,000 internal screenshots—including billing records and unreleased product details—by uploading them to public GitHub repositories under developers’ personal accounts. Organizations should audit personal GitHub repositories, releases, and gists, remove exposed files, rotate visible credentials, and restrict agents from creating public repositories.","briefOverview":"\u003cp\u003eGlow reported that AI coding agents uploaded more than 13,000 internal developer screenshots from over 300 organizations to public GitHub repositories. The images included customer billing records, internal financial screens, unreleased product features, and screen recordings. Many repositories were created under developers’ personal GitHub accounts, outside company organizations where security teams might not detect them.\u003c/p\u003e\n\n\u003cp\u003eThe issue arose when agents were asked to show visual code changes for review but could not attach images through GitHub’s command-line tool or display images stored in private repositories. Glow found that agents used separate public repositories to host screenshots, and at one company the workaround spread through reusable agent instruction files, resulting in more than a thousand uploads. About one-third of affected organizations had developers using gitshot, which by default uploads images as publicly accessible release assets in a personal repository; GitHub CLI version 2.99.0 now provides an \u0026ndash;attach option for adding files to pull requests, issues, and comments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Glow reported finding more than 13,000 internal images from developers at over 300 organizations in public GitHub repositories, including customer billing records and unreleased product screens.","The images were commonly uploaded to public repositories under developers’ personal GitHub accounts after coding agents were asked to provide screenshots of changes for code review.","Glow said that storing screenshots in a private repository could result in broken images for reviewers, leading agents to host the files separately in public repositories.","About one-third of the affected organizations had developers using gitshot, which by default uploads screenshots as publicly accessible release assets in a personal GitHub repository named gitshot-images.","GitHub CLI version 2.99.0, released September 1, added an --attach option for attaching images to pull requests, issues, and comments with repository write access."],"insights":["Publicly exposed screenshots may be difficult to find because GitHub release assets do not appear in a repository’s normal file list and can be downloaded without logging in.","Reviewing only a company’s GitHub organization can miss the issue, since the images were commonly placed in developers’ personal accounts, including accounts belonging to former employees.","At one software company, a public-upload workaround spread when agents saved it as a reusable instruction file, leading to more than a thousand screenshots and recordings being uploaded.","Text-based security scanners may not detect sensitive information visible inside screenshots, so organizations need to inspect image content as well as repository text."],"referencedReports":[{"title":"How AI Agents Exposed Developer Screenshots From Leading Tech Companies","url":"https://www.glow.io/blogs/how-ai-agents-exposed-developer-screenshots-from-leading-tech-companies","publisher":"glow","context":"The article cites Glow’s published findings on AI coding agents uploading internal developer screenshots to public GitHub repositories.","category":"research","primary":true}],"body":"\u003cp\u003eGlow reported that AI coding agents uploaded more than 13,000 internal developer screenshots from over 300 organizations to public GitHub repositories. The images included customer billing records, internal financial screens, unreleased product features, and screen recordings. Many repositories were created under developers’ personal GitHub accounts, outside company organizations where security teams might not detect them.\u003c/p\u003e\n\n\u003cp\u003eThe issue arose when agents were asked to show visual code changes for review but could not attach images through GitHub’s command-line tool or display images stored in private repositories. Glow found that agents used separate public repositories to host screenshots, and at one company the workaround spread through reusable agent instruction files, resulting in more than a thousand uploads. About one-third of affected organizations had developers using gitshot, which by default uploads images as publicly accessible release assets in a personal repository; GitHub CLI version 2.99.0 now provides an \u0026ndash;attach option for adding files to pull requests, issues, and comments.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft to block Entra ID script injection attacks starting October","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-to-block-entra-id-script-injection-attacks-starting-october/","time":"13:37","priority":"SHOULD READ","score":78,"tldr":"Microsoft will enforce a Content Security Policy for browser-based Entra ID sign-ins beginning in mid-October 2026, allowing only trusted Microsoft-hosted scripts and blocking externally injected code. Organizations should identify and replace browser extensions or tools that inject scripts into login pages before the rollout completes.","briefOverview":"\u003cp\u003eMicrosoft will begin enforcing additional Content Security Policy protections for Microsoft Entra ID browser sign-ins in mid-October 2026, with the rollout expected to conclude by late October. The policy will permit scripts only from trusted Microsoft content delivery network domains and block external or injected code. Microsoft says the measure helps protect against risks including cross-site scripting, where malicious code placed on a website can steal credentials. The change applies by default and does not require tenant configuration.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should stop using browser extensions or tools that inject code or scripts into sign-in pages before the enforcement date. Microsoft recommends testing sign-in scenarios and using the browser developer console to identify blocked-script policy violations, which appear as red text. Users will still be able to sign in even if unsupported script-injection tools no longer work. Microsoft Authentication Library and API-based authentication are not affected because the enforcement applies only to browser-based sign-ins using login.microsoftonline.com.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft will begin enforcing additional Content Security Policy protections for browser-based Entra ID sign-ins in mid-October 2026, with rollout expected to finish by late October 2026.","The policy will allow scripts only from trusted Microsoft content delivery network domains and block external or injected code on Entra ID sign-in pages.","Microsoft advises organizations to stop using browser extensions and tools that inject code into sign-in pages and to test sign-in scenarios before the change takes effect.","Users will still be able to sign in if unsupported script-injection tools cease functioning, and the update requires no tenant configuration.","Microsoft Authentication Library and API-based authentication flows are not affected because the enforcement applies only to browser sign-ins through login.microsoftonline.com."],"insights":["The change is enabled by default and requires no tenant configuration, so organizations cannot rely on an administrator-controlled opt-in period to preserve incompatible script-injection tools.","Administrators can identify likely breakage before enforcement by checking browser developer consoles during sign-in flows for red Content Security Policy violation messages that identify blocked scripts.","The restriction is limited to browser-based authentication at login.microsoftonline.com, leaving Microsoft Authentication Library and API-based authentication flows unaffected.","Microsoft frames the measure as part of its Secure Future Initiative, alongside disabling ActiveX controls in Microsoft 365 and Office 2024 applications and blocking legacy authentication access to Microsoft 365 files."],"referencedReports":[{"title":"Microsoft Entra ID will enhance sign-in security by enforcing a Content Security Policy blocking external script injection","url":"https://admin.microsoft.com/#/MessageCenter/:/messages/MC1481309","publisher":"microsoft","context":"Microsoft's Message Center update states that trusted Microsoft-hosted scripts will be enforced for Entra ID browser sign-ins beginning in mid-October 2026.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft will begin enforcing additional Content Security Policy protections for Microsoft Entra ID browser sign-ins in mid-October 2026, with the rollout expected to conclude by late October. The policy will permit scripts only from trusted Microsoft content delivery network domains and block external or injected code. Microsoft says the measure helps protect against risks including cross-site scripting, where malicious code placed on a website can steal credentials. The change applies by default and does not require tenant configuration.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should stop using browser extensions or tools that inject code or scripts into sign-in pages before the enforcement date. Microsoft recommends testing sign-in scenarios and using the browser developer console to identify blocked-script policy violations, which appear as red text. Users will still be able to sign in even if unsupported script-injection tools no longer work. Microsoft Authentication Library and API-based authentication are not affected because the enforcement applies only to browser-based sign-ins using login.microsoftonline.com.\u003c/p\u003e\n"},{"n":7,"title":"US-Focused CSuite Phishing Steals Microsoft 365 Sessions and Deploys RMM Tools for Remote Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/us-focused-csuite-phishing-steals.html","time":"10:45","priority":"MAY READ","score":72,"tldr":"A US-focused CSuite phishing campaign uses business-themed lures to steal Microsoft 365 sessions and deploy legitimate RMM tools such as ScreenConnect and Action1, giving attackers both account and endpoint access. The activity is concentrated in the United States and targets business-critical sectors including technology, manufacturing, government, and consulting.","briefOverview":"\u003cp\u003eANY.RUN researchers traced a US-focused phishing campaign called CSuite across 351 sandbox analyses, with 51% of related submissions coming from the United States. Technology, manufacturing, government and administration, and consulting were among the most exposed sectors. The campaign uses familiar business lures themed around Adobe, DocuSign, Zoom, Google Meet, Dropbox, and Microsoft 365.\u003c/p\u003e\n\n\u003cp\u003eCSuite can steal Microsoft 365 access and active sessions through credential-harvesting or device-code phishing flows, while a separate path delivers installers, archives, or BAT/VBS droppers. These droppers can install legitimate remote-management tools such as ScreenConnect or Action1, giving attackers remote access to an employee endpoint; one Adobe-themed lure delivered a BAT file that elevated privileges and installed ScreenConnect. By compromising both accounts and devices, the campaign can support mailbox takeover, payment fraud, internal targeting, and persistent access to business systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ANY.RUN traced the US-focused CSuite phishing campaign across 351 sandbox analyses, with 51% of related submissions originating in the United States.","CSuite uses lures impersonating services including Adobe, DocuSign, Zoom, Google Meet, Dropbox, and Microsoft 365.","The campaign can install legitimate remote-management tools such as ScreenConnect or Action1 through installers, archives, or BAT/VBS droppers, providing attackers remote access to endpoints.","CSuite also uses credential-harvesting and device-code phishing flows intended to capture Microsoft 365 access and active sessions.","Technology, manufacturing, government and administration, and consulting were among the sectors most exposed to CSuite activity in the analyzed corpus."],"insights":["CSuite can expand a single phishing incident into simultaneous compromise of a Microsoft 365 account and an employee device, increasing the scope of containment required.","An Adobe-themed lure observed by ANY.RUN delivered a BAT file that elevated privileges and installed ScreenConnect, illustrating a direct route from a phishing page to persistent remote access.","Researchers used the recurring \"/m/js/utils.js\" path found in a CSuite lure page to identify related activity across additional sandbox analyses.","The campaign’s infrastructure can rotate quickly, making manually maintained blocklists prone to becoming outdated."],"referencedReports":[],"body":"\u003cp\u003eANY.RUN researchers traced a US-focused phishing campaign called CSuite across 351 sandbox analyses, with 51% of related submissions coming from the United States. Technology, manufacturing, government and administration, and consulting were among the most exposed sectors. The campaign uses familiar business lures themed around Adobe, DocuSign, Zoom, Google Meet, Dropbox, and Microsoft 365.\u003c/p\u003e\n\n\u003cp\u003eCSuite can steal Microsoft 365 access and active sessions through credential-harvesting or device-code phishing flows, while a separate path delivers installers, archives, or BAT/VBS droppers. These droppers can install legitimate remote-management tools such as ScreenConnect or Action1, giving attackers remote access to an employee endpoint; one Adobe-themed lure delivered a BAT file that elevated privileges and installed ScreenConnect. By compromising both accounts and devices, the campaign can support mailbox takeover, payment fraud, internal targeting, and persistent access to business systems.\u003c/p\u003e\n"},{"n":8,"title":"An ISP DKIM-Signed This Brand Impersonation","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/isp-signed-dmarc-pass-pharmacy-brand-survey-replica","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonating a UK pharmacy chain passed SPF, DKIM, DMARC, and composite authentication because it was legitimately sent and signed through a consumer ISP’s mail platform. The incident shows that email authentication verifies domain authorization, not the true author or legitimacy of a brand-themed message.","briefOverview":"\u003cp\u003eA UK fresh-produce wholesaler received a survey lure on 14 February 2026 that impersonated a major UK pharmacy chain and directed users to a replica storefront with a prize-survey modal. The landing page copied retail features including search, department links, login options, a loyalty-card header, and a product carousel, but it still displayed Christmas promotions and gift sets. The email also echoed the recipient’s mailbox address as a “Customer login ID” to make the bulk message appear personalized.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, DMARC, and composite authentication because it was genuinely sent through a consumer ISP’s mail platform using the ISP’s domain and signature. The article emphasizes that these checks confirm authorization to use a domain, not whether the author is affiliated with the brand shown in the display name. Recipient-side filtering was separately skipped with SCL:-1 and SFV:SKN, while sender-history signals identified it as a first-time, high-risk sender with no prior relationship to the organization. The incident was automatically resolved as phishing, illustrating how brand-display-name mismatches, unfamiliar sender history, and stale cloned-site content can expose a message that passes standard authentication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A UK fresh-produce wholesaler received a survey phishing email on 14 February 2026 that impersonated a major UK pharmacy chain and linked to a replica storefront page.","The email passed SPF, DKIM, DMARC, and composite authentication because it was sent through and signed by a consumer ISP using the ISP’s own domain.","The sender used a pharmacy-brand display name with a rewards-themed mailbox on an unrelated consumer ISP domain, while the landing page showed outdated Christmas promotions.","The recipient’s mail system recorded SCL:-1 and SFV:SKN, indicating the message was marked non-spam before filtering ran due to a recipient-side allow-list entry or mail flow rule.","The article emphasizes that email authentication verifies authorization to use a domain but does not establish who authored a message or whether a claimed brand relationship is genuine."],"insights":["A fully authenticated email can still be a brand impersonation because authentication confirms that a domain authorized the message, not that the sender has any legitimate relationship with the brand shown in the display name.","Outdated seasonal content on a cloned retail page can be a durable phishing indicator: the page still advertised Christmas gift sets and stocking fillers when the email was delivered on 14 February.","The message’s skipped filtering and its authentication results were separate issues; SCL:-1 with SFV:SKN reflected a recipient-side allow-list or mail-flow rule, not a consequence of SPF, DKIM, or DMARC passing.","Organization-specific context exposed the deception: the sender was a first-time contact with no prior recipient history, despite presenting itself as a familiar consumer brand and claiming the recipient was a registered customer.","Echoing the recipient’s mailbox address as a customer login ID made a bulk survey lure appear personalized without demonstrating that the sender had a real customer relationship."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s breach and email-gateway phishing statistics to contextualize the prevalence of phishing.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references this report as documenting a shift toward identity-shaped attacks over malware.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA guidance stating that email authentication controls address spoofing rather than impersonation.","category":"guide","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the report for its finding that phishing was the most-reported complaint type by volume in 2024.","category":"research","primary":false}],"body":"\u003cp\u003eA UK fresh-produce wholesaler received a survey lure on 14 February 2026 that impersonated a major UK pharmacy chain and directed users to a replica storefront with a prize-survey modal. The landing page copied retail features including search, department links, login options, a loyalty-card header, and a product carousel, but it still displayed Christmas promotions and gift sets. The email also echoed the recipient’s mailbox address as a “Customer login ID” to make the bulk message appear personalized.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, DMARC, and composite authentication because it was genuinely sent through a consumer ISP’s mail platform using the ISP’s domain and signature. The article emphasizes that these checks confirm authorization to use a domain, not whether the author is affiliated with the brand shown in the display name. Recipient-side filtering was separately skipped with SCL:-1 and SFV:SKN, while sender-history signals identified it as a first-time, high-risk sender with no prior relationship to the organization. The incident was automatically resolved as phishing, illustrating how brand-display-name mismatches, unfamiliar sender history, and stale cloned-site content can expose a message that passes standard authentication.\u003c/p\u003e\n"},{"n":6,"title":"Know Your Enemy: Browser-Based Attack Techniques in 2026","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/know-your-enemy-browser-based-attack.html","time":"11:58","priority":"MAY READ","score":45,"tldr":"Browser-based threats are increasingly driving the full breach lifecycle, using techniques such as AiTM phishing, ClickFix, OAuth authorization phishing, malicious extensions, credential stuffing, and stolen-session replay to bypass traditional email, endpoint, and MFA defenses. Security teams need visibility and controls within browser sessions, including extension governance, identity hardening, and detection of suspicious user interactions.","briefOverview":"\u003cp\u003eThe article identifies six browser-based techniques that security teams should monitor in 2026: credential and session phishing, malicious copy-and-paste prompts known as ClickFix, authorization phishing, malicious browser extensions, credential stuffing and ghost logins, and session hijacking. It argues that many breaches now begin and may remain entirely within browser sessions used to access business applications. These techniques exploit gaps in tools focused on email, networks, or endpoints.\u003c/p\u003e\n\n\u003cp\u003eReverse-proxy phishing kits such as Tycoon2FA, Sneaky2FA, and Evilginx can capture credentials and active session tokens in real time, while OAuth-based authorization phishing can obtain access tokens through consent grants or device-code flows without stealing a password. ClickFix campaigns use fake CAPTCHA, verification, or installation prompts to make users copy and run malicious commands, often leading to remote-access tools or information-stealing software. Malicious extensions, password-based logins outside SSO, and stolen browser session tokens can also provide routes into business accounts, including from unmanaged personal or contractor devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Modern reverse-proxy phishing kits such as Tycoon2FA, Sneaky2FA, and Evilginx can intercept credentials and live session tokens in real time, bypassing most forms of multi-factor authentication.","ClickFix attacks use fake CAPTCHA or verification prompts to persuade users to copy and execute malicious commands, and Push reported that ClickFix accounted for 52% of its detections in Q2 2026.","Authorization phishing abuses OAuth consent grants, device code flows, and token exchanges to obtain access tokens without stealing credentials during the sign-in process.","Push found that 46.76% of browser extensions used by its customers had permission combinations capable of enabling account takeover without user interaction.","Stolen session tokens, often obtained through infostealer malware, can be replayed in an attacker-controlled browser to bypass authentication, including passkeys."],"insights":["Because 89% of phishing domains are active for fewer than two days, blocklists alone are unlikely to stop many phishing attempts before the domains disappear or change.","Phishing that abuses OAuth approval or device-code flows can obtain access tokens without intercepting the sign-in process, making even phishing-resistant passkeys irrelevant to that specific technique.","The article says every major browser-extension breach in the previous 18 months involved extensions rated low risk beforehand, so allowlisting and monitoring for later changes are more effective than relying only on static risk scores.","SSO can leave behind “ghost logins” when applications retain separate password-based access methods, meaning those logins may not appear in identity-provider records unless they are explicitly disabled.","Personal devices and browser synchronization can bridge personal-account compromise to corporate-account compromise, while the article cites non-managed devices as the source of 46% of infostealer infections that led to corporate breaches."],"referencedReports":[],"body":"\u003cp\u003eThe article identifies six browser-based techniques that security teams should monitor in 2026: credential and session phishing, malicious copy-and-paste prompts known as ClickFix, authorization phishing, malicious browser extensions, credential stuffing and ghost logins, and session hijacking. It argues that many breaches now begin and may remain entirely within browser sessions used to access business applications. These techniques exploit gaps in tools focused on email, networks, or endpoints.\u003c/p\u003e\n\n\u003cp\u003eReverse-proxy phishing kits such as Tycoon2FA, Sneaky2FA, and Evilginx can capture credentials and active session tokens in real time, while OAuth-based authorization phishing can obtain access tokens through consent grants or device-code flows without stealing a password. ClickFix campaigns use fake CAPTCHA, verification, or installation prompts to make users copy and run malicious commands, often leading to remote-access tools or information-stealing software. Malicious extensions, password-based logins outside SSO, and stolen browser session tokens can also provide routes into business accounts, including from unmanaged personal or contractor devices.\u003c/p\u003e\n"},{"n":9,"title":"Introducing Adversary Intelligence: LLM Tradecraft","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/09/30/introducing-adversary-intelligence-llm-tradecraft/","time":"11:30","priority":"MAY READ","score":28,"tldr":"SpecterOps and OpenAI have launched Adversary Intelligence: LLM Tradecraft, an on-demand course teaching security practitioners how LLMs and agentic systems work, how to assess their risks, and how to secure them. The ten-module course includes hosted labs and covers topics including prompting, agents, Codex, MCP, prompt injection, evaluation, and reverse engineering.","briefOverview":"\u003cp\u003eSpecterOps has introduced Adversary Intelligence: LLM Tradecraft, a new on-demand course in its Tradecraft Academy developed with OpenAI. The course is intended for security practitioners who need to use, assess, and secure large language models and AI agents without already having an extensive machine-learning background. Enrollment is open, with the first cohort beginning October 15 and new cohorts planned monthly.\u003c/p\u003e\n\n\u003cp\u003eThe ten-module course covers machine-learning fundamentals, large language models, prompting, AI agents, Codex, Model Context Protocol, evaluation, threat modeling, prompt injection, and reverse engineering. It emphasizes that an AI agent consists of both the model and the surrounding software that determines its available information, tools, stored state, and execution. Hosted labs let learners build machine-learning models, create agent workflows, evaluate agent behavior with MLflow, and use Codex for tasks including malware reverse engineering. Each cohort provides 30 days of access to course materials and labs, along with a ChatGPT Pro subscription from OpenAI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps, in partnership with OpenAI, introduced the on-demand Adversary Intelligence: LLM Tradecraft course through its Tradecraft Academy.","The course contains ten standalone modules with hosted labs covering machine-learning foundations, large language models, agents, prompting, Codex, Model Context Protocol, evaluation, threat modeling, prompt injection, and reverse engineering.","The course is designed for security practitioners without extensive machine-learning backgrounds and connects AI concepts to practical security work.","The material emphasizes that an AI agent includes both the language model and surrounding software that controls its information, tools, stored state, and execution.","Enrollment is open, with the first cohort beginning October 15 and including 30 days of course and lab access plus a ChatGPT Pro subscription from OpenAI."],"insights":["The course treats the surrounding software of an AI agent, not just the language model, as a critical security boundary because that software controls the information, tools, memory, and execution available to the model.","The article emphasizes that higher evaluation scores can be misleading: evaluator bias and reward hacking can improve a measured score without actually improving the underlying system.","Model Context Protocol integrations can create risks beyond ordinary API security, including malicious tool descriptions entering a model’s context, changing tool definitions, and tool hijacking.","The course distinguishes protections that depend on a model following instructions from protections that an application can enforce, highlighting a practical difference when defending against prompt injection.","The course applies AI assistance to reverse engineering while emphasizing the value of deterministic tools and tests for validating a model’s flexible interpretations."],"referencedReports":[{"title":"Learning Machine Learning blog series","url":"https://specterops.io/blog/2022/04/05/learning-machine-learning-part-1-introduction-and-revoke-obfuscation/","publisher":"SpecterOps","context":"The article cites SpecterOps' earlier technical blog series as an example of teaching machine-learning concepts through obfuscated PowerShell and security scenarios.","category":"guide","primary":false}],"body":"\u003cp\u003eSpecterOps has introduced Adversary Intelligence: LLM Tradecraft, a new on-demand course in its Tradecraft Academy developed with OpenAI. The course is intended for security practitioners who need to use, assess, and secure large language models and AI agents without already having an extensive machine-learning background. Enrollment is open, with the first cohort beginning October 15 and new cohorts planned monthly.\u003c/p\u003e\n\n\u003cp\u003eThe ten-module course covers machine-learning fundamentals, large language models, prompting, AI agents, Codex, Model Context Protocol, evaluation, threat modeling, prompt injection, and reverse engineering. It emphasizes that an AI agent consists of both the model and the surrounding software that determines its available information, tools, stored state, and execution. Hosted labs let learners build machine-learning models, create agent workflows, evaluate agent behavior with MLflow, and use Codex for tasks including malware reverse engineering. Each cohort provides 30 days of access to course materials and labs, along with a ChatGPT Pro subscription from OpenAI.\u003c/p\u003e\n"}]</script>
