<script type="application/json" id="dl-articles">[{"n":2,"title":"UK Cybercrime Journal: ACRO Breach Report","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/08/uk-cybercrime-journal-acro-breach-report.html","time":"09:00","priority":"SHOULD READ","score":82,"tldr":"ACRO’s public-facing portal was compromised for nearly two years due to unpatched Kentico CMS vulnerabilities, unclear patching ownership, poor alert review, and inadequate logging, potentially exposing sensitive records data. The key lesson is that basic governance, timely patching, monitored security alerts, and network segmentation are critical to limiting breach impact.","briefOverview":"\u003cp\u003eOn 7 August 2026, the UK Information Commissioner’s Office disclosed that the ACRO Criminal Records Office suffered three separate compromises of its customer portal website between July 2021 and June 2023. ACRO is a national police unit that provides services including Police Certificates, International Child Protection Certificates, and Subject Access Requests. In March 2023, ACRO was notified about an SQL injection attack that reportedly exposed 15 sets of credentials, mostly belonging to employees.\u003c/p\u003e\n\n\u003cp\u003eA forensic investigation found threat actor activity in the website environment from 9 July 2021 to 22 June 2023. The portal used Kentico CMS version 12.0.0 between September 2019 and March 2023, and the article says ambiguity over who was responsible for patching led to missed hotfixes and updates. Between 15 and 16 February 2023, an unknown threat actor staged personal data for exfiltration, including Police Certificate Applications, Subject Access Request forms, and International Child Protection Certificate forms.\u003c/p\u003e\n\n\u003cp\u003eACRO could not definitively determine whether the staged data was successfully exfiltrated because of insufficient log retention. A maximum of 10,920 data subjects had their data staged, but ACRO notified 84,048 people on a precautionary basis in April 2023. The ICO also learned that ACRO’s Trend Micro antivirus detected and quarantined four attempts to install Mimikatz, but the alerts were not reviewed or acted upon, while network segmentation prevented the attacker from pivoting into core policing systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK Information Commissioner’s Office disclosed that ACRO Criminal Records Office suffered three separate compromises of its customer portal website between July 2021 and June 2023.","A forensic investigation found long-term threat actor activity in the website environment from 9 July 2021 to 22 June 2023 after ACRO was notified in March 2023 about an SQL injection attack that reportedly exposed 15 sets of credentials.","ACRO’s Kentico CMS website ran version 12.0.0 between September 2019 and March 2023, and missed hotfixes and updates because responsibility for patching was unclear.","An unknown threat actor staged personal data for exfiltration in February 2023, including Police Certificate Applications, Subject Access Request forms, and International Child Protection Certificate forms, affecting a maximum of 10,920 data subjects while ACRO notified 84,048 people as a precaution.","ACRO’s Trend Micro antivirus detected and quarantined four attempts to install Mimikatz, but the warnings were not reviewed or acted on because ACRO lacked a documented patching policy and structured process for analyzing security alerts."],"insights":["ACRO’s security tooling did detect and quarantine attempted Mimikatz activity, but the lack of a structured alert-review process meant a potentially important warning did not lead to an effective response.","The breach impact was materially limited by network segmentation, which prevented movement from the compromised web environment into core policing systems.","Insufficient log retention left ACRO unable to determine whether staged personal data was actually exfiltrated, forcing a much larger precautionary notification to 84,048 people despite a maximum of 10,920 data subjects having data staged.","The ICO response highlights a public-sector enforcement distinction: ACRO received a public reprimand rather than a fine that would confiscate public funds.","ACRO’s post-incident move to Salesforce Experience Cloud was specifically tied to automated patching and hotfixes, addressing the earlier ambiguity around who was responsible for maintaining the Kentico CMS portal."],"referencedReports":[{"title":"ACRO Reprimand","url":"https://ico.org.uk/media2/njrjayzm/acro-reprimand-202608.pdf","publisher":"UK Information Commissioner's Office","context":"The article says the ICO disclosed the ACRO compromises in this reprimand and bases the incident details and findings on it.","category":"news","primary":true}],"body":"\u003cp\u003eOn 7 August 2026, the UK Information Commissioner’s Office disclosed that the ACRO Criminal Records Office suffered three separate compromises of its customer portal website between July 2021 and June 2023. ACRO is a national police unit that provides services including Police Certificates, International Child Protection Certificates, and Subject Access Requests. In March 2023, ACRO was notified about an SQL injection attack that reportedly exposed 15 sets of credentials, mostly belonging to employees.\u003c/p\u003e\n\n\u003cp\u003eA forensic investigation found threat actor activity in the website environment from 9 July 2021 to 22 June 2023. The portal used Kentico CMS version 12.0.0 between September 2019 and March 2023, and the article says ambiguity over who was responsible for patching led to missed hotfixes and updates. Between 15 and 16 February 2023, an unknown threat actor staged personal data for exfiltration, including Police Certificate Applications, Subject Access Request forms, and International Child Protection Certificate forms.\u003c/p\u003e\n\n\u003cp\u003eACRO could not definitively determine whether the staged data was successfully exfiltrated because of insufficient log retention. A maximum of 10,920 data subjects had their data staged, but ACRO notified 84,048 people on a precautionary basis in April 2023. The ICO also learned that ACRO’s Trend Micro antivirus detected and quarantined four attempts to install Mimikatz, but the alerts were not reviewed or acted upon, while network segmentation prevented the attacker from pivoting into core policing systems.\u003c/p\u003e\n"},{"n":1,"title":"Assess, Monitor and Act on Insider Risk with Agentic Support","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/assess-monitor-and-act-on-insider-risk-with-agentic-support","time":"07:01","priority":"MAY READ","score":25,"tldr":"Netskope is promoting its Insider Threat AISecOps Agent, which monitors selected high-risk users and combines DLP, behavior, malware, access, and app activity signals into daily risk assessments. The goal is to reduce manual alert triage and help analysts prioritize insider-risk cases with evidence-backed context.","briefOverview":"\u003cp\u003eInsider risk has become a constant operational challenge, with employees able to exfiltrate large volumes of data and contractors with privileged access sometimes missing from HR-managed leaver lists. The article cites the Ponemon Institute’s 2026 Cost of Insider Risks Global Report, which says insider incidents cost the average organization $19.5 million a year. It argues that security teams often have visibility across many tools but still spend days manually determining whether a user presents a risk.\u003c/p\u003e\n\n\u003cp\u003eNetskope Insider Threat AISecOps Agent is presented as a way to assess organization-selected high-risk users on the Netskope One platform. The agent combines behavioral anomalies, Netskope User Confidence Index scores, DLP incidents, malware detections, access changes, and application activity into a daily risk assessment. Organizations can build watchlists by adding users directly, selecting identity provider groups such as Microsoft Entra ID groups, or uploading a CSV file.\u003c/p\u003e\n\n\u003cp\u003eWhen a watched user’s combined risk score demands attention, the agent surfaces a prioritized insight with the signals and evidence that drove the score. Analysts decide whether an insight becomes a case, and once a case is opened, the agent investigates automatically and returns a verdict of risk, inconclusive, or legitimate with recommended actions. The article says this approach can reduce low-priority alert triage, focus analyst time on higher-risk users, and give leadership defensible proof of the insider risk process.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that insider incidents now cost the average organization $19.5 million a year, according to the Ponemon Institute’s 2026 Cost of Insider Risks Global Report.","Netskope Insider Threat AISecOps Agent assesses organization-selected high-risk users and combines behavior, DLP, malware, access, and activity signals into a daily risk assessment.","Organizations can build watchlists by adding users directly, selecting identity provider groups such as Microsoft Entra ID groups, or uploading a CSV file.","When a watched user’s combined risk score demands attention, the agent surfaces a prioritized insight with the signals and evidence that drove the score.","If an analyst opens a case from an insight, the agent investigates automatically and returns a verdict of risk, inconclusive, or legitimate, along with recommended actions."],"insights":["The article highlights contractors with privileged access and departing users as common blind spots because they may not appear on HR-managed leaver lists or may leave before a manual review is completed.","The watchlist model is positioned as a way to avoid monitoring an entire workforce while still giving leadership a defensible record of who was covered, why they were covered, and how often they were assessed.","The agent suppresses noise by logging low-risk daily checks without creating insights, so analyst attention is reserved for watched users whose combined risk score crosses a concern threshold.","The article emphasizes that analyst control is preserved because turning an insight into a case remains a human decision, even though the agent performs the investigation once a case is opened.","The example in the article shows that individually minor signals, such as a few DLP violations, lower user confidence, after-hours access, and increased downloads, can become significant when combined into one user-focused assessment."],"referencedReports":[{"title":"Cost of Insider Risks Global Report","url":"https://ponemon.dtex.ai/","publisher":"Ponemon Institute","context":"The article cites the Ponemon Institute’s 2026 Cost of Insider Risks Global Report for the claim that insider incidents cost the average organization $19.5 million a year.","category":"research","primary":false}],"body":"\u003cp\u003eInsider risk has become a constant operational challenge, with employees able to exfiltrate large volumes of data and contractors with privileged access sometimes missing from HR-managed leaver lists. The article cites the Ponemon Institute’s 2026 Cost of Insider Risks Global Report, which says insider incidents cost the average organization $19.5 million a year. It argues that security teams often have visibility across many tools but still spend days manually determining whether a user presents a risk.\u003c/p\u003e\n\n\u003cp\u003eNetskope Insider Threat AISecOps Agent is presented as a way to assess organization-selected high-risk users on the Netskope One platform. The agent combines behavioral anomalies, Netskope User Confidence Index scores, DLP incidents, malware detections, access changes, and application activity into a daily risk assessment. Organizations can build watchlists by adding users directly, selecting identity provider groups such as Microsoft Entra ID groups, or uploading a CSV file.\u003c/p\u003e\n\n\u003cp\u003eWhen a watched user’s combined risk score demands attention, the agent surfaces a prioritized insight with the signals and evidence that drove the score. Analysts decide whether an insight becomes a case, and once a case is opened, the agent investigates automatically and returns a verdict of risk, inconclusive, or legitimate with recommended actions. The article says this approach can reduce low-priority alert triage, focus analyst time on higher-risk users, and give leadership defensible proof of the insider risk process.\u003c/p\u003e\n"}]</script>
