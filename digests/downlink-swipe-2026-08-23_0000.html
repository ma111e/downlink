<script type="application/json" id="dl-articles">[{"n":2,"title":"Emerging Threat: (CVE-2026-21580) Confluence Privilege Escalation via Unauthenticated Stored XSS","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-21580-confluence-privilege-escalation-via-unauthenticated-stored-xss/","time":"05:51","priority":"MUST READ","score":92,"tldr":"CVE-2026-21580 is a critical unauthenticated stored XSS flaw in self-hosted Atlassian Confluence Data Center and Server that can let attackers execute code in an admin’s browser and escalate privileges. Organizations should urgently inventory exposed Confluence instances, restrict access, and upgrade to fixed releases.","briefOverview":"\u003cp\u003eCVE-2026-21580 is a stored cross-site scripting vulnerability in Atlassian Confluence Data Center and Server, grouped by Atlassian with a privilege escalation component and a security misconfiguration weakness. An attacker can persist crafted HTML or JavaScript on a vulnerable instance, and the payload later executes in the browser of a user who views the affected content. The issue has a CVSS 4.0 base score of 8.6, while Atlassian labels it Critical under its advisory taxonomy.\u003c/p\u003e\n\n\u003cp\u003eExploitation does not require authentication, meaning an attacker with network access to the Confluence instance can plant the payload without valid credentials. The privilege escalation depends on who views the page, because if an administrator or space administrator reads it, the injected script runs with that user’s session authority. Atlassian reports no confirmed in-the-wild exploitation at the time of writing, and the flaw was reported through its bug bounty program.\u003c/p\u003e\n\n\u003cp\u003eThe affected software is self-hosted Confluence Data Center and Server, with affected releases spanning 7.1.1 through 10.2.0; Confluence Cloud is not in scope. Atlassian has published fixes and recommends upgrading to the latest version, with 9.2.21 or later and 10.2.13 or later named for maintained lines. The article also recommends inventorying all self-hosted Confluence instances, restricting access to trusted networks or an authenticated VPN, auditing permissions, monitoring logs for anomalous unauthenticated page edits, and reviewing Content Security Policy headers at the reverse proxy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-21580 is a stored cross-site scripting vulnerability in Atlassian Confluence Data Center and Server that Atlassian groups with a privilege escalation component and a security misconfiguration weakness.","Exploitation does not require authentication, and an attacker with network access to a vulnerable Confluence instance can plant a payload that later runs in the browser of a user who views the affected content.","The vulnerability has a CVSS 4.0 base score of 8.6, while Atlassian labels it Critical under its own advisory taxonomy.","Atlassian lists affected Confluence Data Center and Server releases spanning 7.1.1 through 10.2.0, while Confluence Cloud is not in scope.","Atlassian has published fixed releases and recommends upgrading to the latest Confluence Data Center and Server version, with 9.2.21 or later and 10.2.13 or later named as supported fixed versions for maintained lines."],"insights":["The vendor’s Critical label and the CVSS High-band score may lead to different patching priorities, so teams using score-driven policies should account for that mismatch.","The article highlights that forgotten staging wikis, test service desks, and inherited Confluence instances may pose a major exposure risk because they often remain internet-facing while falling outside normal patch cycles.","CyCognito’s observed exposure data was based mostly on service fingerprinting rather than confirmed version detection, so the reported exposed systems should be treated as potentially affected rather than confirmed vulnerable.","Organizations on older Confluence release lines may not be able to apply a simple targeted patch and may need a larger version upgrade because fixes are only named for maintained lines.","The largest exposure bucket was organizations whose industry could not be classified, which the article frames as evidence that Confluence exposure is driven more by collaboration lifecycle gaps than by a single sector’s practices."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-21580 is a stored cross-site scripting vulnerability in Atlassian Confluence Data Center and Server, grouped by Atlassian with a privilege escalation component and a security misconfiguration weakness. An attacker can persist crafted HTML or JavaScript on a vulnerable instance, and the payload later executes in the browser of a user who views the affected content. The issue has a CVSS 4.0 base score of 8.6, while Atlassian labels it Critical under its advisory taxonomy.\u003c/p\u003e\n\n\u003cp\u003eExploitation does not require authentication, meaning an attacker with network access to the Confluence instance can plant the payload without valid credentials. The privilege escalation depends on who views the page, because if an administrator or space administrator reads it, the injected script runs with that user’s session authority. Atlassian reports no confirmed in-the-wild exploitation at the time of writing, and the flaw was reported through its bug bounty program.\u003c/p\u003e\n\n\u003cp\u003eThe affected software is self-hosted Confluence Data Center and Server, with affected releases spanning 7.1.1 through 10.2.0; Confluence Cloud is not in scope. Atlassian has published fixes and recommends upgrading to the latest version, with 9.2.21 or later and 10.2.13 or later named for maintained lines. The article also recommends inventorying all self-hosted Confluence instances, restricting access to trusted networks or an authenticated VPN, auditing permissions, monitoring logs for anomalous unauthenticated page edits, and reviewing Content Security Policy headers at the reverse proxy.\u003c/p\u003e\n"},{"n":1,"title":"A Real Thread, a Real Mailbox, One Swapped Button","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/compromised-vendor-mailbox-reused-internal-thread-hijacked-voicemail-cta","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A compromised vendor Microsoft 365 mailbox sent a phishing voicemail lure embedded in a real prior internal thread, allowing SPF, DKIM, DMARC and ARC to pass and making the message look trustworthy. The key risk is that valid vendor accounts can bypass sender-based trust signals, so payload links and user reports must be evaluated independently of authentication results.","briefOverview":"\u003cp\u003eA resident-services staff member at a residential property management company received a voicemail playback notice in mid-August 2026 from a vendor mailbox her employer had corresponded with before. The message was sent from the vendor’s own Microsoft 365 tenant, from a real employee mailbox at a real software vendor. Under the notice was a genuine internal vendor support thread from the previous day, including real signatures and working links.\u003c/p\u003e\n\n\u003cp\u003eThe only new part of the message was the voicemail playback block, which included two call-to-action buttons. Both buttons resolved through Microsoft link rewriting to the same unrelated domain, \u003ccode\u003ereikongaku[.]com\u003c/code\u003e, while the surrounding message contained many legitimate vendor links. SPF, DKIM, DMARC, both ARC seals, and composite authentication all passed because the message really left the vendor’s own environment.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the case as vendor email compromise and account takeover, mapped to MITRE ATT\u0026amp;CK T1566.002 and T1078.004. Automated content analysis flagged a benign vendor marketing-automation tracking redirect while the two payload buttons were recorded as clean, and no confidence score was attached to the message. The recipient reported the email herself, the report was approved manually, and the affected mailbox was quarantined roughly three days after the send.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A resident-services staff member at a residential property management company received a voicemail playback notice in mid-August 2026 from a vendor mailbox her employer had corresponded with before.","The email was sent from the vendor’s own Microsoft 365 tenant, and SPF, DKIM, DMARC, both ARC seals, and composite authentication all passed under the vendor’s domain.","The message reused a genuine internal vendor support thread from the previous day, including real staff signatures and working vendor links, while adding only a new voicemail playback block.","The two call-to-action buttons in the fake voicemail block both resolved through Microsoft link rewriting to hxxps://reikongaku[.]com/voicewavcalerIDsms/.","The recipient reported the message herself, the report was approved manually, and the affected mailbox was quarantined roughly three days after the send."],"insights":["Email authentication results were not useful for detecting this attack because the attacker used a real vendor mailbox, so the message truthfully passed the checks that normally validate sender identity.","The attack gained credibility by changing only the two voicemail buttons while leaving a genuine internal vendor thread and its legitimate links intact, making casual link checking less likely to expose the malicious destination.","The empty transcription preview was an effective lure element because it made the call-to-action buttons appear to be the only way to learn what the voicemail said.","Automated analysis flagged a benign vendor marketing-tracking link while recording the two actual payload buttons as clean, showing that a clean or mixed link verdict did not identify the real risk in this message.","The self-addressed From and To header pattern was a useful clue because it was consistent with a blind-copied blast sent from a mailbox under someone else’s control."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on the human element in breaches, phishing as an initial access vector, and credentials across the kill chain.","category":"research","primary":false},{"title":"2025 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report for the figure of $3.05 billion in business email compromise losses in a single year.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance for the distinction between validating a sender and handling a payload.","category":"guide","primary":false}],"body":"\u003cp\u003eA resident-services staff member at a residential property management company received a voicemail playback notice in mid-August 2026 from a vendor mailbox her employer had corresponded with before. The message was sent from the vendor’s own Microsoft 365 tenant, from a real employee mailbox at a real software vendor. Under the notice was a genuine internal vendor support thread from the previous day, including real signatures and working links.\u003c/p\u003e\n\n\u003cp\u003eThe only new part of the message was the voicemail playback block, which included two call-to-action buttons. Both buttons resolved through Microsoft link rewriting to the same unrelated domain, \u003ccode\u003ereikongaku[.]com\u003c/code\u003e, while the surrounding message contained many legitimate vendor links. SPF, DKIM, DMARC, both ARC seals, and composite authentication all passed because the message really left the vendor’s own environment.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the case as vendor email compromise and account takeover, mapped to MITRE ATT\u0026amp;CK T1566.002 and T1078.004. Automated content analysis flagged a benign vendor marketing-automation tracking redirect while the two payload buttons were recorded as clean, and no confidence score was attached to the message. The recipient reported the email herself, the report was approved manually, and the affected mailbox was quarantined roughly three days after the send.\u003c/p\u003e\n"}]</script>
