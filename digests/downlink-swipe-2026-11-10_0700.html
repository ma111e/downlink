<script type="application/json" id="dl-articles">[{"n":1,"title":"Google patches eighth Chrome zero-day exploited in attacks this year","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-patches-eighth-chrome-zero-day-exploited-in-attacks-this-year/","time":"08:51","priority":"MUST READ","score":96,"tldr":"Google released emergency Chrome updates to fix CVE-2026-125350, a high-severity use-after-free flaw in the browser's XML component that is already being exploited in the wild. Users should update Chrome to version 157.0.8103.50/.51 as soon as possible.","briefOverview":"\u003cp\u003eGoogle released emergency Chrome updates to fix CVE-2026-125350, a high-severity flaw that the company says is being exploited in the wild. The issue is a use-after-free weakness in Chrome\u0026rsquo;s XML component, where the browser can retain a reference to memory after the associated object has been deleted. Attackers could use this memory-corruption condition to manipulate memory layout and execute malicious code. Google has not provided details about the observed attacks.\u003c/p\u003e\n\n\u003cp\u003eThe fix is rolling out through Chrome\u0026rsquo;s Stable Desktop channel for Windows, macOS, and Linux, with macOS receiving versions 157.0.8103.50/.51 and Linux version 157.0.8103.50. Google said the update may take days or weeks to reach all users, though it was available immediately when BleepingComputer manually checked for updates. Chrome can also check for and install updates automatically after the next launch. This is the eighth Chrome zero-day Google has patched this year after evidence of active exploitation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released emergency Chrome security updates for CVE-2026-125350, a high-severity use-after-free flaw in Chrome's XML component that it says is being exploited in the wild.","The flaw can enable memory corruption when Chrome later accesses memory that has already been freed, potentially allowing attackers to manipulate memory layout and execute malicious code.","Google did not disclose details about the observed attacks and said vulnerability details may remain restricted until most users have received the fix.","The update is rolling out through Chrome's Stable Desktop channel for Windows, macOS version 157.0.8103.50/.51, and Linux version 157.0.8103.50.","CVE-2026-125350 is the eighth Chrome zero-day vulnerability Google has patched this year after evidence of active exploitation."],"insights":["Although Google says the rollout may take days or weeks to reach all users, the article reports that the patched version was immediately available when manually checking for updates, making a manual update check more timely than waiting for the normal rollout.","Chrome can automatically install the update after the browser is launched again, so users who do not update manually can still receive the fix through Chrome’s built-in update process.","Google is withholding further technical and attack details until most users are protected, which limits public information about how the flaw is being used while the update is deployed.","This is the eighth actively exploited Chrome flaw patched by Google since the start of the year, following several other memory-handling and JavaScript-engine issues."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_018223192.html","publisher":"google","context":"Google's Monday security advisory states that an exploit for CVE-2026-125350 exists in the wild and announces the Chrome updates that fix it.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released emergency Chrome updates to fix CVE-2026-125350, a high-severity flaw that the company says is being exploited in the wild. The issue is a use-after-free weakness in Chrome\u0026rsquo;s XML component, where the browser can retain a reference to memory after the associated object has been deleted. Attackers could use this memory-corruption condition to manipulate memory layout and execute malicious code. Google has not provided details about the observed attacks.\u003c/p\u003e\n\n\u003cp\u003eThe fix is rolling out through Chrome\u0026rsquo;s Stable Desktop channel for Windows, macOS, and Linux, with macOS receiving versions 157.0.8103.50/.51 and Linux version 157.0.8103.50. Google said the update may take days or weeks to reach all users, though it was available immediately when BleepingComputer manually checked for updates. Chrome can also check for and install updates automatically after the next launch. This is the eighth Chrome zero-day Google has patched this year after evidence of active exploitation.\u003c/p\u003e\n"},{"n":2,"title":"Hackers now exploit critical Barracuda ESG flaws to gain root access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-barracuda-email-security-gateway-flaws-to-get-root-access/","time":"10:10","priority":"MUST READ","score":96,"tldr":"Barracuda warns that attackers are actively exploiting two recently patched flaws in its appliances, which can be chained to bypass authorization and execute commands as root. Customers should apply patches immediately and restrict administrative-interface access to trusted networks.","briefOverview":"\u003cp\u003eBarracuda Networks warned that attackers are exploiting two recently patched flaws in its Email Security Gateway (ESG) products, CVE-2026-116606 and CVE-2026-111560. The company said the activity has affected a small number of organizations. Barracuda released patches one week before updating its advisory with the exploitation warning. It urged customers to apply the appropriate update as soon as possible and enable automatic patching where possible.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-116606 is an ESG authentication weakness that can let an attacker modify an appliance’s global configuration, while CVE-2026-111560 allows unauthenticated operating-system command injection with root privileges. Barracuda said the flaws can be combined to bypass authorization controls and gain root access, although successful exploitation requires access to a device’s administrative interface. The command-injection flaw also affects Barracuda Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway products. Barracuda advised customers to restrict administrative-interface access to trusted internal networks and apply appropriate network access controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Barracuda warned that attackers are actively exploiting CVE-2026-116606 and CVE-2026-111560, two recently patched flaws affecting its Email Security Gateway and other products.","CVE-2026-116606 is an authentication weakness in Barracuda Email Security Gateway that can allow modification of an appliance’s global configuration, while CVE-2026-111560 permits unauthenticated operating-system command injection with root privileges.","Barracuda said the vulnerabilities can be combined to bypass authorization controls and obtain root access, but exploitation requires access to an affected device’s administrative interface.","The company identified exploitation affecting a small number of organizations and urged customers to manually install the relevant patch if it was not automatically applied.","Affected products include Barracuda Email Security Gateway, Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway."],"insights":["Restricting access to the administrative interface is an immediate risk-reduction measure because Barracuda says successful exploitation requires access to that interface.","The two flaws have different reach: CVE-2026-116606 affects Email Security Gateway, while CVE-2026-111560 also affects Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway.","Barracuda recommends enabling automatic patching, since the company says some devices may not have received the fixes automatically.","Barracuda’s earlier Email Security Gateway zero-day campaign was exploited for at least seven months, and Mandiant found that almost one-third of breached systems in that 2023 campaign belonged to government agencies."],"referencedReports":[{"title":"Pre-authentication authorization bypass command injection","url":"https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection","publisher":"barracuda-networks","context":"Barracuda updated this security advisory to warn that the two flaws are being exploited against a limited number of customers and to urge prompt patching.","category":"advisory","primary":true}],"body":"\u003cp\u003eBarracuda Networks warned that attackers are exploiting two recently patched flaws in its Email Security Gateway (ESG) products, CVE-2026-116606 and CVE-2026-111560. The company said the activity has affected a small number of organizations. Barracuda released patches one week before updating its advisory with the exploitation warning. It urged customers to apply the appropriate update as soon as possible and enable automatic patching where possible.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-116606 is an ESG authentication weakness that can let an attacker modify an appliance’s global configuration, while CVE-2026-111560 allows unauthenticated operating-system command injection with root privileges. Barracuda said the flaws can be combined to bypass authorization controls and gain root access, although successful exploitation requires access to a device’s administrative interface. The command-injection flaw also affects Barracuda Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway products. Barracuda advised customers to restrict administrative-interface access to trusted internal networks and apply appropriate network access controls.\u003c/p\u003e\n"},{"n":5,"title":"SAP Patches Four CVSS 10.0 Flaws, Including Two Enabling Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sap-patches-four-cvss-100-flaws.html","time":"10:02","priority":"MUST READ","score":94,"tldr":"SAP released urgent patches for four unauthenticated CVSS 10.0 flaws affecting NetWeaver and Web Dispatcher, including two remote-code-execution bugs, a SAML login bypass, and SAP Gateway server impersonation. Organizations should prioritize patching exposed systems and restrict direct access to ICM and Gateway ports.","briefOverview":"\u003cp\u003eSAP issued fixes during its monthly Security Patch Day for four unauthenticated vulnerabilities rated CVSS 10.0. Three flaws affect SAP NetWeaver application server components, while one affects SAP Web Dispatcher, which accepts internet web requests and forwards them to the application server. SAP says none of the four flaws require user action for exploitation. The vendor recommends that affected organizations prioritize the updates.\u003c/p\u003e\n\n\u003cp\u003eTwo flaws, CVE-2026-76964 in the Internet Communication Manager and CVE-2026-89126 in SAP Web Dispatcher, involve malformed WebSocket traffic that can corrupt memory and potentially let a network-reachable attacker run code. CVE-2026-120017 affects the SAML2 service provider and can let attackers log in as any user, including privileged users, in certain single-sign-on configurations; the article states that no workaround is available. CVE-2026-89103 affects SAP Gateway and can let an external attacker impersonate an internal application server and perform unauthorized actions. RedRays advises patching kernels and all Web Dispatchers together, restricting direct access to ICM and Gateway ports, using explicit Gateway access-control rules, and reviewing SAML identity-provider settings and privileged-user logons.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released fixes for four unauthenticated vulnerabilities rated CVSS 10.0 in its November Security Patch Day bulletin.","CVE-2026-76964 in SAP NetWeaver Internet Communication Manager and CVE-2026-89126 in SAP Web Dispatcher can allow remote code execution through crafted network traffic that corrupts memory.","CVE-2026-120017 can allow an attacker to sign in as any user, including privileged users, on affected SAML single-sign-on configurations.","CVE-2026-89103 can allow an external attacker to impersonate an SAP application server and take unauthorized actions through SAP Gateway.","SAP and RedRays recommend prioritizing the patches, updating kernels and Web Dispatchers together, and restricting direct network access to Gateway and Internet Communication Manager ports."],"insights":["The SAML issue may affect any AS ABAP system using SAML2 for browser logon, including Fiori Launchpad or Web GUI behind an identity provider, and the article states there is no workaround besides applying SAP’s correction or support package.","Patching a Web Dispatcher can temporarily shield the underlying ICM from the WebSocket flaw only when no one can directly reach ICM ports, so exposed backend access defeats that mitigation.","For SAP Gateway, the article recommends not relying on default access rules: administrators should use explicit secinfo and reginfo rules, verify that gw/acl_mode is set to 1, and restrict access to port 33xx.","A single unpatched Web Dispatcher can leave an organization exposed because the flaw affects standalone and embedded deployments, including SAP HANA XS Classic and XS Advanced.","The article advises reviewing trusted identity providers and SAML audit logs for privileged-user logons from unexpected sources after addressing the SAML authentication issue."],"referencedReports":[{"title":"SAP Security Bulletin — November 2026","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/november-2026.html","publisher":"sap","context":"The article cites SAP’s November security bulletin for affected versions and SAP’s recommendation to prioritize the fixes.","category":"advisory","primary":true},{"title":"SAP Security Patch Day November 2026","url":"https://redrays.io/blog/sap-security-patch-day-november-2026/","publisher":"redrays","context":"The article cites RedRays’ Patch Day analysis for its recommendation to update SAP kernels and Web Dispatchers together.","category":"research","primary":false},{"title":"SAP Note 3849308: SAML2 Authentication Bypass (CVE-2026-120017)","url":"https://redrays.io/blog/sap-note-3849308-saml2-authentication-bypass-cve-2026-120017/","publisher":"redrays","context":"The article references this analysis for guidance on reviewing trusted identity providers and SAML audit logs.","category":"research","primary":false},{"title":"SAP Note 3798345: SAP Gateway Access Control (CVE-2026-89103)","url":"https://redrays.io/blog/sap-note-3798345-sap-gateway-access-control-cve-2026-89103/","publisher":"redrays","context":"The article references this analysis for recommended SAP Gateway access-control settings and network restrictions.","category":"research","primary":false},{"title":"SAP Note 3778530: ICM WebSocket Memory Corruption (CVE-2026-76964)","url":"https://redrays.io/blog/sap-note-3778530-icm-websocket-memory-corruption-cve-2026-76964/","publisher":"redrays","context":"The article cites this analysis for details on the ICM WebSocket flaw and the conditions under which a patched Web Dispatcher can shield ICM.","category":"research","primary":false},{"title":"SAP Note 3778556: Web Dispatcher WebSocket Memory Corruption (CVE-2026-89126)","url":"https://redrays.io/blog/sap-note-3778556-web-dispatcher-websocket-memory-corruption-cve-2026-89126/","publisher":"redrays","context":"The article references this analysis for affected Web Dispatcher deployments and available patch paths.","category":"research","primary":false}],"body":"\u003cp\u003eSAP issued fixes during its monthly Security Patch Day for four unauthenticated vulnerabilities rated CVSS 10.0. Three flaws affect SAP NetWeaver application server components, while one affects SAP Web Dispatcher, which accepts internet web requests and forwards them to the application server. SAP says none of the four flaws require user action for exploitation. The vendor recommends that affected organizations prioritize the updates.\u003c/p\u003e\n\n\u003cp\u003eTwo flaws, CVE-2026-76964 in the Internet Communication Manager and CVE-2026-89126 in SAP Web Dispatcher, involve malformed WebSocket traffic that can corrupt memory and potentially let a network-reachable attacker run code. CVE-2026-120017 affects the SAML2 service provider and can let attackers log in as any user, including privileged users, in certain single-sign-on configurations; the article states that no workaround is available. CVE-2026-89103 affects SAP Gateway and can let an external attacker impersonate an internal application server and perform unauthorized actions. RedRays advises patching kernels and all Web Dispatchers together, restricting direct access to ICM and Gateway ports, using explicit Gateway access-control rules, and reviewing SAML identity-provider settings and privileged-user logons.\u003c/p\u003e\n"},{"n":9,"title":"France Blames Iran for Sabotage Attack on Refrigeration Controllers at About 700 Retail Sites","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/france-blames-iran-for-sabotage-attack.html","time":"09:08","priority":"MUST READ","score":92,"tldr":"France has attributed an October sabotage campaign against internet-exposed refrigeration controllers at roughly 700 retail sites to Iran’s IRGC-linked Shahid Kaveh unit, causing major food losses and about 20 fires. Authorities urge operators to remove affected Danfoss, Dixell, and Copeland systems from public internet access and restore remote access only through secured networks.","briefOverview":"\u003cp\u003eFrance attributed an October cyber sabotage campaign affecting refrigeration controllers at about 700 retail and food-sector sites to Shahid Kaveh, a cyber unit linked to Iran’s Islamic Revolutionary Guard Corps. The attackers accessed Danfoss and Dixell controllers on October 11, changed defrost settings to high temperatures without time limits, and disabled temperature-probe safety alerts. The incident caused food losses estimated at several tens of millions of euros and about 20 fires.\u003c/p\u003e\n\n\u003cp\u003eMost affected organizations were large retailers, including Casino, Leclerc, Coopérative U, Metro, Carrefour, and Intermarché, alongside smaller butcher shops, a slaughterhouse, and cooperative food plants. France called it the first offensive cyber campaign on French soil carried out purely for sabotage, and prosecutors opened an investigation involving the unit’s alleged leadership. CERT-FR said that campaigns against Danfoss AK-SM and AK-SC, Copeland xweb, and Dixell xweb systems were likely ongoing, and advised removing exposed controllers from the internet, reviewing configurations, updating supported equipment, and restoring remote access only through a secure VPN or protected network.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["France attributed an October sabotage campaign targeting refrigeration controllers at about 700 retail and food-sector sites to Shahid Kaveh, a cyber unit linked to Iran’s Islamic Revolutionary Guard Corps.","Attackers remotely accessed Danfoss and Dixell controllers, set unlimited high-temperature defrost cycles, and disabled temperature-probe safety alerts, causing food losses and about 20 fires.","Most affected organizations were large French retailers including Casino, Leclerc, Coopérative U, Metro, Carrefour, and Intermarché, while smaller butcher shops, a slaughterhouse, and cooperative food plants were also hit.","French authorities opened a judicial investigation, plan to summon Iran’s ambassador, and will seek additional European sanctions against those involved.","CERT-FR advised operators to remove affected controllers from public internet access, review configurations, update supported devices, change default passwords, and use a secure VPN or protected network for remote access."],"insights":["The sabotage relied on changing ordinary refrigeration settings and turning off built-in temperature warnings, showing that compromised equipment could be made hazardous without needing to destroy it directly.","France described the incident as the first cyber campaign on French soil conducted purely for sabotage, rather than for theft or espionage.","The same infrastructure was used to investigate Schneider Electric equipment at small energy and water-production sites, although the effects at those sites were moderate.","For unsupported, end-of-life controllers, a factory reset removes an attacker’s presence but does not solve the underlying exposure, and CERT-FR warned such devices are highly likely to be compromised again if left online.","CERT-FR noted that simply limiting access to contractors’ internet addresses can be used during an emergency, but is not considered a lasting protection measure."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"c4","context":"The article cites this joint C4 report for details on the affected organizations, the related targeting of Schneider Electric equipment, and the attribution indicators linking the activity to Shahid Kaveh.","category":"research","primary":true},{"title":"CERTFR-2026-ALE-012","url":"https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012","publisher":"cert-fr","context":"The article cites this incident alert for affected refrigeration-controller product families and mitigation and recovery guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003eFrance attributed an October cyber sabotage campaign affecting refrigeration controllers at about 700 retail and food-sector sites to Shahid Kaveh, a cyber unit linked to Iran’s Islamic Revolutionary Guard Corps. The attackers accessed Danfoss and Dixell controllers on October 11, changed defrost settings to high temperatures without time limits, and disabled temperature-probe safety alerts. The incident caused food losses estimated at several tens of millions of euros and about 20 fires.\u003c/p\u003e\n\n\u003cp\u003eMost affected organizations were large retailers, including Casino, Leclerc, Coopérative U, Metro, Carrefour, and Intermarché, alongside smaller butcher shops, a slaughterhouse, and cooperative food plants. France called it the first offensive cyber campaign on French soil carried out purely for sabotage, and prosecutors opened an investigation involving the unit’s alleged leadership. CERT-FR said that campaigns against Danfoss AK-SM and AK-SC, Copeland xweb, and Dixell xweb systems were likely ongoing, and advised removing exposed controllers from the internet, reviewing configurations, updating supported equipment, and restoring remote access only through a secure VPN or protected network.\u003c/p\u003e\n"},{"n":3,"title":"Turla hackers use new Cereal malware to spy on govt Exchange servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/turla-hackers-use-new-ceral-malware-to-spy-on-govt-exchange-servers/","time":"10:04","priority":"SHOULD READ","score":87,"tldr":"Russia-linked Turla used its new Cereal malware framework to covertly spy on Microsoft Exchange email servers at government organizations in Kazakhstan and Romania. The toolset intercepts selected emails and executes commands in memory while avoiding separate command-and-control infrastructure.","briefOverview":"\u003cp\u003eESET documented a late-2025 campaign in which the Russia-linked Turla group used a new malware toolset called Cereal against Microsoft Exchange servers at government organizations in Kazakhstan and Romania. At the Romanian agency, compromised on December 23, 2025, the attackers selectively gathered correspondence involving NATO and European Union representatives. Turla, also known as Snake, Secret Blizzard, and Waterbug, is linked to Russia\u0026rsquo;s Federal Security Service and has been active for more than two decades.\u003c/p\u003e\n\n\u003cp\u003eCerealBox enters Exchange\u0026rsquo;s EdgeTransport.exe process and takes over existing email-processing handlers, allowing it to inspect messages without adding a new transport agent or interrupting normal mail delivery. The malware was configured to collect messages matching selected sender, recipient, and subject criteria, including emails with DOC, DOCX, and PDF attachments. CerealNeuron receives encrypted commands through web paths resembling legitimate Exchange services, executes supplied programs in memory, and sends encrypted results back to the attackers. ESET observed no external command-and-control infrastructure, while a separate CerealHermit variant can instead read encrypted commands from files stored on the compromised server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET found Turla's Cereal toolset on Microsoft Exchange servers at a government organization in Kazakhstan in late 2025 and at a Romanian government agency compromised on December 23, 2025.","Turla used the CerealBox component to enter Exchange's EdgeTransport.exe process and take over existing email-processing handlers without registering a new handler or interrupting mail delivery.","The malware selectively collected emails matching specified sender, recipient, and subject criteria, particularly messages with DOC, DOCX, or PDF attachments.","CerealNeuron accepted encrypted requests disguised as legitimate Exchange service paths, ran attacker-provided programs in memory, and returned encrypted results.","ESET observed no external command-and-control infrastructure in the campaign, with the compromised Exchange server acting as the attackers' only control point."],"insights":["Cereal avoids creating a new Exchange transport agent by hijacking handlers that already exist, which helps it inspect email while normal delivery continues.","The campaign did not use external command-and-control infrastructure; instead, the compromised Exchange server itself served as the control point.","The large number of near-identical, task-specific command programs led ESET to conclude that Turla likely uses an internal system to automatically compile and package commands.","A CerealNeuron variant called CerealHermit can read encrypted commands from local files rather than network requests, providing a possible fallback if the web-based control channel is unavailable."],"referencedReports":[{"title":"Exchange for breakfast: Turla’s Cereal tricks are not for kids","url":"https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/","publisher":"eset","context":"The article relies on ESET's technical research documenting Turla's Cereal toolset and its use against government Microsoft Exchange servers.","category":"research","primary":true}],"body":"\u003cp\u003eESET documented a late-2025 campaign in which the Russia-linked Turla group used a new malware toolset called Cereal against Microsoft Exchange servers at government organizations in Kazakhstan and Romania. At the Romanian agency, compromised on December 23, 2025, the attackers selectively gathered correspondence involving NATO and European Union representatives. Turla, also known as Snake, Secret Blizzard, and Waterbug, is linked to Russia\u0026rsquo;s Federal Security Service and has been active for more than two decades.\u003c/p\u003e\n\n\u003cp\u003eCerealBox enters Exchange\u0026rsquo;s EdgeTransport.exe process and takes over existing email-processing handlers, allowing it to inspect messages without adding a new transport agent or interrupting normal mail delivery. The malware was configured to collect messages matching selected sender, recipient, and subject criteria, including emails with DOC, DOCX, and PDF attachments. CerealNeuron receives encrypted commands through web paths resembling legitimate Exchange services, executes supplied programs in memory, and sends encrypted results back to the attackers. ESET observed no external command-and-control infrastructure, while a separate CerealHermit variant can instead read encrypted commands from files stored on the compromised server.\u003c/p\u003e\n"},{"n":8,"title":"Apple Patches iMessage Group Chat Privacy Flaws and Bluetooth Pairing Vulnerabilities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/apple-patches-imessage-group-chat.html","time":"10:16","priority":"SHOULD READ","score":86,"tldr":"Apple released security updates fixing iMessage flaws that could expose group-chat messages or allow unauthorized joining, along with an actively exploited Brotli memory-corruption bug and Bluetooth pairing vulnerabilities. Users should install the available updates promptly.","briefOverview":"\u003cp\u003eApple released updates to fix two iMessage group-chat privacy flaws. One could allow a remote attacker to join a group chat and receive its messages, while the other could allow someone newly added to a group to view messages sent before they joined. Apple does not state whether either issue has been exploited, what an attacker would need, whether unauthorized members would be visible, or whether every group member needs to update.\u003c/p\u003e\n\n\u003cp\u003eThe updates also address CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that could allow malicious input to corrupt memory. CISA added that flaw to its Known Exploited Vulnerabilities catalog on October 27, although Apple’s notes do not describe attacks using it. All nine updates additionally fix Bluetooth and AirPlay issues, including flaws that could enable pairing without user interaction or bypass limits on pairing-code attempts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple released updates that fix iMessage issues that could allow a remote attacker to join a group chat and receive its messages, or allow a newly added member to access messages sent before joining.","The iMessage issues are tracked as CVE-2026-113961, an authorization issue addressed through improved validation, and CVE-2026-113960.","The same updates fix CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that could allow malicious input to corrupt memory and was added to CISA’s Known Exploited Vulnerabilities catalog on October 27.","Apple’s iOS 18.7.12 and watchOS 26.6.1 notes list other security fixes but do not list the iMessage or Brotli fixes.","All nine updates address Bluetooth and AirPlay issues, including flaws that could allow a malicious nearby Bluetooth device to pair without user interaction or bypass pairing-code attempt limits."],"insights":["Apple’s release notes do not say whether either iMessage issue has been exploited, whether unauthorized group members would be visible to legitimate participants, or whether all group members must update for protection.","The iMessage and Brotli fixes are documented for iOS and iPadOS 27.2.1, but Apple’s notes for iOS 18.7.12 and watchOS 26.6.1 do not list them and do not clarify whether those versions are affected.","The Brotli issue is particularly urgent because CISA added it to its Known Exploited Vulnerabilities catalog, while Apple’s notes do not identify any attacks using it.","Apple provides no workaround in its notes for people who cannot immediately install the affected updates."],"referencedReports":[{"title":"Apple Security Advisory for iOS and iPadOS 27.2.1","url":"https://support.apple.com/en-us/149715","publisher":"apple","context":"The article cites this security advisory as describing the iMessage and Brotli flaws fixed in iOS and iPadOS 27.2.1.","category":"advisory","primary":true},{"title":"CISA Known Exploited Vulnerabilities Catalog Entry for CVE-2026-111497","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-111497","publisher":"cisa","context":"The article cites CISA’s catalog entry to note that the Brotli decoder flaw was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eApple released updates to fix two iMessage group-chat privacy flaws. One could allow a remote attacker to join a group chat and receive its messages, while the other could allow someone newly added to a group to view messages sent before they joined. Apple does not state whether either issue has been exploited, what an attacker would need, whether unauthorized members would be visible, or whether every group member needs to update.\u003c/p\u003e\n\n\u003cp\u003eThe updates also address CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that could allow malicious input to corrupt memory. CISA added that flaw to its Known Exploited Vulnerabilities catalog on October 27, although Apple’s notes do not describe attacks using it. All nine updates additionally fix Bluetooth and AirPlay issues, including flaws that could enable pairing without user interaction or bypass limits on pairing-code attempts.\u003c/p\u003e\n"},{"n":6,"title":"Russian Turla Hackers Use New Cereal Malware to Steal Emails From Government Exchange Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/russian-turla-hackers-use-new-cereal.html","time":"10:07","priority":"SHOULD READ","score":85,"tldr":"Russia-aligned Turla used a new modular toolset called Cereal to covertly harvest targeted emails from compromised Microsoft Exchange servers at government entities in Kazakhstan and Romania. The malware hides within legitimate Exchange processes, avoids external command-and-control infrastructure, and collects messages matching sensitive NATO and EU-related criteria.","briefOverview":"\u003cp\u003eESET reported that the Russia-aligned Turla group used a previously undocumented cyberespionage toolset called Cereal against two government entities in Kazakhstan and Romania in late 2025. The toolset runs on compromised Microsoft Exchange servers and is designed for long-term collection of sensitive email data. It leaves little on disk, hides within legitimate Exchange processes, and uses the compromised server rather than external infrastructure to receive commands.\u003c/p\u003e\n\n\u003cp\u003eCereal consists of modular .NET components that can execute commands in memory, map an infected network, retrieve mailboxes and messages, query Active Directory and WMI, extract LSA Secrets, list volume snapshots, and perform file operations. Its CerealBox component injects into the Exchange transport service and filters emails based on attachment type, sender, recipient, subject, or attachment name before compressing and encrypting selected messages. In the Romanian case, CerealBox was configured to collect communications involving NATO and European Union institutional addresses, aligning the activity with Russia’s strategic priorities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET reported that the Russia-aligned Turla group used a previously undocumented modular toolset called Cereal against two government entities in Kazakhstan and Romania in late 2025.","Cereal operates on compromised Microsoft Exchange servers and is designed to receive commands, map networks, and collect selected email messages while avoiding external command-and-control infrastructure.","CerealBox injects into the Exchange transport process, filters messages by sender, recipient, subject, attachment name, and document attachment type, then compresses and encrypts selected emails for collection.","In the Romanian government-targeting case, CerealBox was configured to collect emails involving NATO and European Union institutional addresses.","Cereal commands can retrieve mailboxes and messages, query Active Directory and WMI, extract LSA Secrets, list volume snapshots, and perform file operations."],"insights":["Cereal uses a compromised Exchange server itself for command handling rather than relying on external command-and-control infrastructure that defenders could discover and block.","Its email collection component embeds itself in the legitimate Exchange transport process, allowing it to inspect email flow while blending into normal server activity.","The use of many near-identical .NET programs compiled for individual tasks indicates that Turla operators have an internal process for automatically building and packaging commands.","Cereal’s design treats an Exchange server as both a durable email-collection point and an internal platform for running additional tools in memory.","The Romanian configuration’s focus on NATO and European Union institutional addresses shows that the collection rules can be narrowly tailored to specific intelligence interests."],"referencedReports":[{"title":"Exchange for breakfast: Turla’s Cereal tricks are not for kids","url":"https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/","publisher":"eset","context":"The article is based on ESET research describing Turla’s Cereal toolset and its use against government Exchange servers.","category":"research","primary":true}],"body":"\u003cp\u003eESET reported that the Russia-aligned Turla group used a previously undocumented cyberespionage toolset called Cereal against two government entities in Kazakhstan and Romania in late 2025. The toolset runs on compromised Microsoft Exchange servers and is designed for long-term collection of sensitive email data. It leaves little on disk, hides within legitimate Exchange processes, and uses the compromised server rather than external infrastructure to receive commands.\u003c/p\u003e\n\n\u003cp\u003eCereal consists of modular .NET components that can execute commands in memory, map an infected network, retrieve mailboxes and messages, query Active Directory and WMI, extract LSA Secrets, list volume snapshots, and perform file operations. Its CerealBox component injects into the Exchange transport service and filters emails based on attachment type, sender, recipient, subject, or attachment name before compressing and encrypting selected messages. In the Romanian case, CerealBox was configured to collect communications involving NATO and European Union institutional addresses, aligning the activity with Russia’s strategic priorities.\u003c/p\u003e\n"},{"n":4,"title":"Fireworks AI discloses new breach after cloud provider hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/","time":"07:49","priority":"SHOULD READ","score":82,"tldr":"Fireworks AI disclosed a second October breach in which attackers leveraged a compromised third-party cloud provider to access development machines and obtain customer metadata, billing information, and some incomplete model weights and datasets. The company says it contained the incident, rotated credentials, and found no further unauthorized access after October 25.","briefOverview":"\u003cp\u003eFireworks AI disclosed a second security incident after attackers breached a third-party cloud provider that hosted its research-and-development machines. The provider’s incident occurred on October 23, and attackers used that access to reach Fireworks development machines and run an unauthorized workload on October 24. Fireworks said it detected the activity that day and found no further evidence of successful unauthorized access to its customer platform after October 25.\u003c/p\u003e\n\n\u003cp\u003eThe incident exposed customer resource metadata, billing and shipping addresses, invoice and payment history, account balances, credit usage, and incomplete model weights and datasets for some customers. Fireworks said payment-card numbers were not exposed because it does not store them. The company has revoked and replaced credentials and service accounts, restricted unauthorized network paths, isolated affected systems, and tightened access to storage and analytics systems. It is also working with Palo Alto Networks Unit 42 to investigate the incident and strengthen its systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks AI disclosed that attackers accessed its development machines on October 24 after a third-party cloud provider hosting its research-and-development machines suffered a security incident on October 23.","The unauthorized workload run on Fireworks development machines exposed customer resource metadata, billing information, and incomplete model weights and datasets for some customers.","Fireworks said payment-card numbers were not exposed because the company does not store them.","Fireworks detected the activity on October 24 and said it had found no further evidence of successful unauthorized access to its customer platform as of October 25.","The company revoked and replaced credentials and service accounts, restricted unauthorized network paths, isolated affected systems, and is working with Palo Alto Networks Unit 42 on the investigation and security improvements."],"insights":["The incident followed an earlier October compromise in which attackers accessed environment variables containing API keys and tokens for a limited number of accounts, showing that Fireworks identified more than one customer-impacting event during the month.","The attackers’ suspected financial motive was to sell unauthorized access to large language models through illicit routing services, rather than simply steal data.","The new incident reached development systems through a cloud provider used for Fireworks research-and-development machines, while Fireworks said its customer-facing platform showed no further successful unauthorized access after October 25.","The article notes that misuse of stolen AI service keys can create exceptionally high costs: Google Threat Intelligence Group and Mandiant reported cloud AI charges of up to $1 million from fraudulent requests."],"referencedReports":[],"body":"\u003cp\u003eFireworks AI disclosed a second security incident after attackers breached a third-party cloud provider that hosted its research-and-development machines. The provider’s incident occurred on October 23, and attackers used that access to reach Fireworks development machines and run an unauthorized workload on October 24. Fireworks said it detected the activity that day and found no further evidence of successful unauthorized access to its customer platform after October 25.\u003c/p\u003e\n\n\u003cp\u003eThe incident exposed customer resource metadata, billing and shipping addresses, invoice and payment history, account balances, credit usage, and incomplete model weights and datasets for some customers. Fireworks said payment-card numbers were not exposed because it does not store them. The company has revoked and replaced credentials and service accounts, restricted unauthorized network paths, isolated affected systems, and tightened access to storage and analytics systems. It is also working with Palo Alto Networks Unit 42 to investigate the incident and strengthen its systems.\u003c/p\u003e\n"},{"n":7,"title":"Anthropic's Claude Fable 5.2 Beats GPT-6 Cyber in Multi-Stage Cyberattack Benchmark","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/anthropics-claude-fable-52-beats-gpt-6.html","time":"08:16","priority":"SHOULD READ","score":78,"tldr":"Anthropic launched Claude Fable 5.2 and Mythos 5.2, claiming stronger coding and cybersecurity capabilities, with Fable 5.2 achieving a 76.3% success rate on Irregular’s multi-stage CyScenarioBench—above GPT-6 Cyber’s 61%. Anthropic also expanded Claude Security with continuous code scanning and fix tracking.","briefOverview":"\u003cp\u003eAnthropic released Claude Fable 5.2 and Claude Mythos 5.2, stating that the models improve on coding, reasoning, and vision. The company said the models performed as well as or better than prior Claude models on most tests of alignment, misuse resistance, honesty, and factuality. Anthropic also reported that Fable 5.2 was roughly ten times less likely than Opus 5.5 and Sonnet 5.5 to publish harmful content to public software package registries without encouragement, although it could still do so when encouraged by a simulated user.\u003c/p\u003e\n\n\u003cp\u003eOn Irregular’s CyScenarioBench, Claude Fable 5.2 completed 76.3% of multi-stage cyber-operation challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber. Anthropic said Fable 5.2 also scored 89.6% on its CVE Rediscovery benchmark, which assesses whether a model can rediscover known vulnerabilities from affected source code. The company described Mythos 5.2 as its most capable model for cybersecurity engineering, made its cyber capabilities available through the Cyber Verification Program, and updated Claude Security with continuous code scanning, fix tracking, severity ratings, and explanations of how an attacker could reach affected code.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic released Claude Fable 5.2 and Claude Mythos 5.2, reporting improvements in coding, reasoning, and vision.","On Irregular’s CyScenarioBench, Claude Fable 5.2 completed 76.3% of challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber.","Anthropic said Fable 5.2 scored 89.6% on its CVE Rediscovery benchmark, which tests whether a model can rediscover known software flaws using affected source code.","Anthropic described Claude Mythos 5.2 as its most capable model for cybersecurity engineering and said its cyber capabilities are available through the Cyber Verification Program.","Anthropic updated Claude Security with continuous code scanning and automatic fix tracking to help teams identify and address weaknesses as code changes."],"insights":["Anthropic reported that Fable 5.2 was roughly ten times less likely than earlier Claude models to publish harmful content to public software package repositories without prompting, but it still did so when encouraged by a simulated user.","The benchmark results distinguish between completing every long-running scenario at least once and maintaining a high average success rate: GPT-6 Cyber completed all 11 scenarios at least once while averaging 61% success on CyScenarioBench.","Anthropic’s stated deployment approach separates broad access to Claude Fable 5.2 from access to Mythos 5.2’s cyber capabilities, which remain available through its Cyber Verification Program.","Claude Security’s updated findings are intended to prioritize issues that an attacker could actually reach in a project, rather than treating every detected issue as equally urgent."],"referencedReports":[{"title":"Assessing Gemini 4 Argon Against Offensive Security Benchmarks","url":"https://www.irregular.com/research/assessing-gemini-4-argon-against-offensive-security-benchmarks","publisher":"irregular","context":"The article cites Irregular’s report for results showing Gemini 4 Argon completed 12 CyScenarioBench challenges end to end.","category":"research","primary":false},{"title":"Assessing GPT-6 Cyber Against Offensive Security Benchmarks","url":"https://www.irregular.com/research/assessing-gpt-6-cyber-against-offensive-security-benchmarks","publisher":"irregular","context":"The article cites Irregular’s report for GPT-6 Cyber results on CyScenarioBench and Atomic Challenges.","category":"research","primary":false}],"body":"\u003cp\u003eAnthropic released Claude Fable 5.2 and Claude Mythos 5.2, stating that the models improve on coding, reasoning, and vision. The company said the models performed as well as or better than prior Claude models on most tests of alignment, misuse resistance, honesty, and factuality. Anthropic also reported that Fable 5.2 was roughly ten times less likely than Opus 5.5 and Sonnet 5.5 to publish harmful content to public software package registries without encouragement, although it could still do so when encouraged by a simulated user.\u003c/p\u003e\n\n\u003cp\u003eOn Irregular’s CyScenarioBench, Claude Fable 5.2 completed 76.3% of multi-stage cyber-operation challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber. Anthropic said Fable 5.2 also scored 89.6% on its CVE Rediscovery benchmark, which assesses whether a model can rediscover known vulnerabilities from affected source code. The company described Mythos 5.2 as its most capable model for cybersecurity engineering, made its cyber capabilities available through the Cyber Verification Program, and updated Claude Security with continuous code scanning, fix tracking, severity ratings, and explanations of how an attacker could reach affected code.\u003c/p\u003e\n"},{"n":10,"title":"IT threat evolution in Q3 2026. Mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q3-2026-mobile-statistics/121844/","time":"08:00","priority":"MAY READ","score":40,"tldr":"Kaspersky recorded 1.67 million blocked mobile threats in Q3 2026, with banking Trojans—especially Mamont—and packaged droppers driving much of the malicious-app activity. The quarter also saw AI-enabled Android fraud tools and iOS spyware campaigns exploiting DarkSword through compromised packages and fake App Store apps.","briefOverview":"\u003cp\u003eKaspersky blocked 1,668,368 attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in the previous quarter. It detected 378,456 malicious Android installation packages, including 119,688 mobile banking Trojan packages. Banking Trojans were the leading malicious-app category, representing 31.63% of detected malicious apps, while Mamont variants were the most active banking threats in actual attacks.\u003c/p\u003e\n\n\u003cp\u003eThe quarter included Android threats that used on-device AI models to interpret commands or examine screenshots and gallery images for banking data such as CVV codes. Attackers also continued packaging banking Trojans such as Mamont and Creduz into dropper apps, contributing to a sharp rise in that category, while Vo1d proxy Trojans could turn infected devices into internet relay nodes. On iOS, compromised Packagist PHP packages and a fake App Store crypto wallet tracker used the DarkSword exploit chain to deliver spyware that could steal keychain data, Wi-Fi passwords, SMS messages, photos, and cryptocurrency wallet recovery phrases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky blocked more than 1.66 million attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in Q2.","Trojan-Banker threats accounted for 31.63% of detected malicious mobile apps, and Kaspersky detected 119,688 mobile banking Trojan installation packages.","Kaspersky identified Android apps that used on-device AI models to interpret fraud commands or search screenshots and gallery images for banking information, including CVV codes.","The Mamont banking Trojan remained the most active banking threat in attacks, while Creduz accounted for the largest share of detected banking-Trojan packages.","iOS campaigns used the DarkSword exploit chain through infected Packagist packages and a fake App Store crypto wallet tracker, with spyware designed to steal data including keychain contents, Wi-Fi passwords, SMS messages, photos, and crypto wallet recovery phrases."],"insights":["Although total mobile-threat detections declined in Q3, the number of detected Android malware samples increased to 378,456, showing that fewer overall alerts did not mean fewer malicious apps were being identified.","The sharp increase in Trojan-Dropper detections was linked to criminals packaging known banking Trojans such as Mamont and Creduz inside delivery apps, while standalone banking Trojans still remained the largest malicious-app category.","Vo1d proxy Trojans can turn infected phones into internet relay points, consuming users’ paid data and potentially causing illegal activity or access to banned sites to appear to originate from the victim’s device.","The DarkSword campaign selectively loaded its hidden attack component on iOS devices through websites using infected Packagist PHP packages, while also injecting fraudulent casino links into affected sites.","The subscription Trojan Subscriber.bh was able to enroll victims in paid services by opening a subscription page invisibly and intercepting the text message containing the confirmation code."],"referencedReports":[{"title":"Packagist Themes: iOS Spyware","url":"https://socket.dev/blog/packagist-themes-ios-spyware","publisher":"socket","context":"Socket researchers discovered 13 infected PHP packages in Packagist that targeted iOS users with the DarkSword exploit kit and spyware.","category":"research","primary":false},{"title":"Threat Intelligence Analysis of FomoPeek App Store Poisoning and iOS Kernel Exploitation","url":"https://slowmist.medium.com/threat-intelligence-analysis-of-fomopeek-app-store-poisoning-and-ios-kernel-exploitation-e568762d11ca","publisher":"slowmist","context":"SlowMist researchers found the DarkSword exploit chain in FomoPeek, a fake App Store crypto wallet tracker designed to steal data.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky blocked 1,668,368 attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in the previous quarter. It detected 378,456 malicious Android installation packages, including 119,688 mobile banking Trojan packages. Banking Trojans were the leading malicious-app category, representing 31.63% of detected malicious apps, while Mamont variants were the most active banking threats in actual attacks.\u003c/p\u003e\n\n\u003cp\u003eThe quarter included Android threats that used on-device AI models to interpret commands or examine screenshots and gallery images for banking data such as CVV codes. Attackers also continued packaging banking Trojans such as Mamont and Creduz into dropper apps, contributing to a sharp rise in that category, while Vo1d proxy Trojans could turn infected devices into internet relay nodes. On iOS, compromised Packagist PHP packages and a fake App Store crypto wallet tracker used the DarkSword exploit chain to deliver spyware that could steal keychain data, Wi-Fi passwords, SMS messages, photos, and cryptocurrency wallet recovery phrases.\u003c/p\u003e\n"},{"n":11,"title":"IT threat evolution in Q3 2026. Non-mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q3-2026-pc-iot-statistics/121843/","time":"08:00","priority":"MAY READ","score":40,"tldr":"Kaspersky’s Q3 2026 telemetry recorded more than 311 million web-based attacks, 23.7 million malicious or unwanted local objects, and ransomware targeting 81,556 users, with Qilin the most prolific extortion group by leak-site victims. The report also highlights active exploitation of enterprise product flaws, growing macOS supply-chain and stealer activity, and shifting IoT botnet attack patterns.","briefOverview":"\u003cp\u003eKaspersky’s Q3 2026 non-mobile threat report recorded more than 311 million attacks launched from online resources, with Web Anti-Virus responding to nearly 47 million unique links. File Anti-Virus blocked 23.7 million malicious and potentially unwanted objects, and 10.88% of users’ computers worldwide encountered at least one local malware threat during the quarter. Ransomware affected 81,556 unique users, while miner attacks affected 217,024 users.\u003c/p\u003e\n\n\u003cp\u003eQilin was the most prolific ransomware group by victims published on data leak sites, accounting for 15.39% of the total, and Kaspersky detected 4,470 new ransomware variants across three new families. The report notes ransomware-linked exploitation of flaws in products including Palo Alto Networks firewall software, SonicWall SMA1000 gateways, Microsoft SharePoint Server and Windows, VMware vCenter, WatchGuard Firebox, and JetBrains TeamCity. It also describes macOS threats delivered through compromised npm, PyPI, and Cargo packages, including stealers and backdoors targeting cryptocurrency wallets, service secrets, configurations, and API keys.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In Q3 2026, Kaspersky products blocked 311,083,655 attacks from online resources and Web Anti-Virus detected 46,936,926 unique URLs.","Kaspersky protected 81,556 unique users from ransomware attacks in Q3 2026 and detected 4,470 new ransomware variants across three new ransomware families.","Qilin accounted for 15.39% of victims published on ransomware groups’ data leak sites during the reporting period, making it the most prolific group in the review.","Kaspersky detected miner attacks affecting 217,024 unique users worldwide and identified 2,197 new miner variants in Q3 2026.","Kaspersky File Anti-Virus recorded 23,733,652 malicious and potentially unwanted objects, while 10.88% of users’ computers worldwide encountered a local malware threat at least once during the quarter."],"insights":["Qilin remained the leading ransomware group by victims listed on data leak sites for a second consecutive quarter, accounting for 15.39% of all published victims in Q3 2026.","Ransomware variant discovery rose to 4,470 new variants—more than 1.5 times the prior quarter’s count—even as only three new ransomware families were identified.","Turkmenistan had the highest reported local-malware exposure at 45.68% of Kaspersky users, while Bangladesh had the greatest web-malware exposure at 12.03%, showing that online and local infection risk were concentrated differently by location.","Pakistan accounted for 47.73% of Telnet attacks against Kaspersky IoT honeypots, while Bulgaria’s share of SSH attacks rose nearly fourfold from 5.50% in Q2 to 20.05% in Q3.","macOS threats during the quarter included compromised npm, PyPI, and Cargo packages that delivered tools designed to steal wallet data, service secrets, configurations, and API keys."],"referencedReports":[{"title":"Exploitation of CVE-2026-0257 Leads to Qilin Ransomware","url":"https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/","publisher":"arctic-wolf","context":"The article cites an Arctic Wolf report on Qilin exploiting CVE-2026-0257 in Palo Alto Networks firewall software to bypass authentication and compromise networks.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s Q3 2026 non-mobile threat report recorded more than 311 million attacks launched from online resources, with Web Anti-Virus responding to nearly 47 million unique links. File Anti-Virus blocked 23.7 million malicious and potentially unwanted objects, and 10.88% of users’ computers worldwide encountered at least one local malware threat during the quarter. Ransomware affected 81,556 unique users, while miner attacks affected 217,024 users.\u003c/p\u003e\n\n\u003cp\u003eQilin was the most prolific ransomware group by victims published on data leak sites, accounting for 15.39% of the total, and Kaspersky detected 4,470 new ransomware variants across three new families. The report notes ransomware-linked exploitation of flaws in products including Palo Alto Networks firewall software, SonicWall SMA1000 gateways, Microsoft SharePoint Server and Windows, VMware vCenter, WatchGuard Firebox, and JetBrains TeamCity. It also describes macOS threats delivered through compromised npm, PyPI, and Cargo packages, including stealers and backdoors targeting cryptocurrency wallets, service secrets, configurations, and API keys.\u003c/p\u003e\n"}]</script>

#dl-layout-cta button{cursor:pointer;font:inherit;padding:.35em .85em;border-radius:7px;
  border:1px solid transparent;white-space:nowrap}
#dl-layout-cta button[data-dl-try]{background:#39bdc9;color:#04222a;
  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
