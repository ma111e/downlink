<script type="application/json" id="dl-articles">[{"n":3,"title":"The Home Office Phish With Five Dead Links","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/ukvi-sponsorship-management-system-pdf-hollow-footer-annotations","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing campaign impersonated the UK Home Office’s Sponsorship Management System using a benign-looking PDF with one hidden live link to a credential-harvesting page, while five government-style footer links were dead decoration. Because the email body contained no URLs or malware, the message bypassed gateway checks despite failed DMARC and an unrelated sender domain.","briefOverview":"\u003cp\u003eA UK IT security and business-continuity distributor received a phishing email impersonating the UK Home Office and claiming that the recipient needed to complete a security upgrade for the genuine Sponsorship Management System. The lure targeted visa sponsor licence holders, for whom access to that Home Office portal is needed to issue certificates of sponsorship. The email body contained no links and relied entirely on a PDF attachment named \u003ccode\u003esponsor_upgrade_guidelines.pdf\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe one-page PDF visually copied GOV.UK styling and included a “Complete upgrade” button containing the only working link, which led to an HTML page in a Contabo European object-storage bucket. Five footer links styled as government resources were real PDF link annotations but had empty destinations, making them decorative rather than functional. The document contained no JavaScript, automatic actions, embedded files, forms, launch actions, or rich media, while the message failed DMARC, had no DKIM signature, was marked clean by the inline secure email gateway, and was delivered to three mailboxes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email impersonated the UK Home Office and used a security-upgrade notice for the genuine Sponsorship Management System to target visa sponsor licence holders.","The email body contained no links; its 62,599-byte PDF attachment contained one working “Complete upgrade” button leading to an HTML page hosted in a Contabo European object-storage bucket.","Five government-style footer links in the PDF were real link annotations with empty destinations, leaving them as decorative, non-working links.","The PDF contained no JavaScript, automatic actions, embedded files, forms, launch actions, or rich media, and the article attributes its malicious purpose to the external destination carried by its sole live button.","DMARC failed and no DKIM signature was applied, but the inline secure email gateway marked the message clean and it was delivered to three mailboxes."],"insights":["The campaign used a genuine UK government Reply-To address, meaning replies would go to the real Home Office rather than the attacker; the article describes this as a credibility signal rather than an attacker-controlled communication channel.","The attacker avoided putting a URL in the email body, moving the sole destination into a PDF button and thereby past the layer where mail filtering commonly performs link-reputation checks.","Although SPF passed at the origin, it only confirmed that the attacker’s own host was authorized to send for the attacker’s own domain and did not establish that the message was legitimate.","The PDF’s lack of executable content illustrates that a malicious attachment can function purely as a convincing carrier for an external destination, rather than needing code that runs when opened.","The article recommends examining PDF link annotations because government-style footer links may be visually convincing while having empty destinations."],"referencedReports":[{"title":"FBI IC3 2024 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites this annual report when discussing annually tracked phishing volume.","category":"research","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for figures on phishing as an initial access vector and the human element in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA's phishing guidance to support its description of phishing as social deception.","category":"advisory","primary":false}],"body":"\u003cp\u003eA UK IT security and business-continuity distributor received a phishing email impersonating the UK Home Office and claiming that the recipient needed to complete a security upgrade for the genuine Sponsorship Management System. The lure targeted visa sponsor licence holders, for whom access to that Home Office portal is needed to issue certificates of sponsorship. The email body contained no links and relied entirely on a PDF attachment named \u003ccode\u003esponsor_upgrade_guidelines.pdf\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe one-page PDF visually copied GOV.UK styling and included a “Complete upgrade” button containing the only working link, which led to an HTML page in a Contabo European object-storage bucket. Five footer links styled as government resources were real PDF link annotations but had empty destinations, making them decorative rather than functional. The document contained no JavaScript, automatic actions, embedded files, forms, launch actions, or rich media, while the message failed DMARC, had no DKIM signature, was marked clean by the inline secure email gateway, and was delivered to three mailboxes.\u003c/p\u003e\n"},{"n":2,"title":"The Third-Party Agent Problem: Why Security Built for AI You Chose Misses the Agents You Didn't","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/the-third-party-agent-problem-why.html","time":"11:00","priority":"MAY READ","score":38,"tldr":"Third-party AI agents embedded in existing SaaS products can bypass traditional identity and security controls, creating untracked permissions and connectivity risks. Organizations need continuous discovery and governance of agent identities, access, reach, and behavior rather than relying on point-in-time reviews.","briefOverview":"\u003cp\u003eThe article argues that third-party AI agents are increasingly arriving inside software enterprises already use, rather than through a deliberate AI procurement or deployment decision. In environments studied for the 2026 State of Agent Security Report, roughly 1,280 third-party products embed AI, but only about 282 sit behind single sign-on. The rest may be invisible to identity infrastructure because they do not authenticate through it.\u003c/p\u003e\n\n\u003cp\u003eIt separates agents into inherited agents delivered through platform updates, configured agents built with an enterprise’s prompts and logic on another provider’s systems, and built agents running on infrastructure owned by the enterprise. The article says every agent should be evaluated by its identity, permissions, connectivity to other applications and data, and actual activity. It contends that organizations need continuously updated visibility into agents, their inherited access, their direct and indirect reach, and changes in behavior, rather than relying on spreadsheets and periodic reviews.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that roughly 1,280 third-party products embed AI in environments studied for the 2026 State of Agent Security Report, while about 282 use single sign-on and the remainder are not visible to identity infrastructure by default.","It distinguishes inherited agents that arrive through updates to existing platforms, configured agents created with an organization’s prompts and logic on another provider’s systems, and built agents running on infrastructure owned end to end by the organization.","The article recommends evaluating every agent by its identity, permissions, connectivity to other products and data, and actual activity.","It argues that security programs need continuously refreshed visibility into operating agents, their inherited access, their direct and indirect reach, their behavior, and changes over time.","The article says that the EU AI Act obligations phasing in through 2026 presume that enterprises can inventory their AI systems, identify owners, and demonstrate oversight."],"insights":["The article argues that the critical security gap is not simply that agents have powerful capabilities, but that many arrive through software updates without the adoption decision that normally creates a review, owner, and security controls.","An agent can inherit a chat platform’s permissions while also reaching external systems such as GitHub and production infrastructure, meaning its effective access may extend well beyond the application where users encounter it.","The article treats an agent’s real-world reach through connected applications, permissions, data stores, and other agents as more important than reviewing the agent’s configuration in isolation.","The article states that spreadsheets and quarterly reviews can handle dozens of agents but do not scale to hundreds or thousands, making continuously updated visibility necessary.","The article links agent inventory and ownership to regulatory readiness, stating that organizations unable to enumerate their agents cannot meet the EU AI Act’s assumed oversight requirements."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that third-party AI agents are increasingly arriving inside software enterprises already use, rather than through a deliberate AI procurement or deployment decision. In environments studied for the 2026 State of Agent Security Report, roughly 1,280 third-party products embed AI, but only about 282 sit behind single sign-on. The rest may be invisible to identity infrastructure because they do not authenticate through it.\u003c/p\u003e\n\n\u003cp\u003eIt separates agents into inherited agents delivered through platform updates, configured agents built with an enterprise’s prompts and logic on another provider’s systems, and built agents running on infrastructure owned by the enterprise. The article says every agent should be evaluated by its identity, permissions, connectivity to other applications and data, and actual activity. It contends that organizations need continuously updated visibility into agents, their inherited access, their direct and indirect reach, and changes in behavior, rather than relying on spreadsheets and periodic reviews.\u003c/p\u003e\n"},{"n":1,"title":"Criminal IP Introduces AITEM as the Next Evolution of Attack Surface Management","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/criminal-ip-introduces-aitem-as-the-next-evolution-of-attack-surface-management/","time":"12:30","priority":"MAY READ","score":28,"tldr":"AI SPERA is promoting AITEM, an AI-powered expansion of its Criminal IP platform that aims to prioritize and automate responses to threat exposure across external assets, internal infrastructure, OSINT, dark-web data, and Shadow AI.","briefOverview":"\u003cp\u003eAI SPERA is introducing AITEM, an AI-powered threat exposure management approach presented as the next evolution of its Criminal IP attack surface management offering. The company will discuss the platform at GovWare 2026 in Singapore, where CEO Byungtak Kang is scheduled to present a session on AI-driven attack surface management. The sponsored article argues that security teams need to move beyond listing internet-facing systems toward investigating, prioritizing, and responding to risks.\u003c/p\u003e\n\n\u003cp\u003eAITEM combines information from external assets, internal infrastructure, open-source intelligence, dark-web data, Shadow AI, leaked data, and emerging vulnerabilities. It is designed to use AI to connect threats with assets, support natural-language investigations, rank findings using organization-specific criteria and real-world attacker activity, and automate alerts, tickets, and workflow actions. AI SPERA says faster action is increasingly important because automated scanning, published proof-of-concept code, and AI-assisted vulnerability discovery allow attackers to identify exposed systems more quickly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI SPERA is introducing AITEM, described as an AI-powered threat exposure management approach and an evolution of traditional attack surface management.","AITEM combines exposure information from external assets, internal infrastructure, open-source intelligence, dark-web data, Shadow AI, leaked data, and emerging vulnerabilities.","The platform applies AI to detect relevant threats, investigate findings through natural-language queries, prioritize risks using organization-defined criteria and real-world attacker activity, and automate alerts and workflow actions.","AI SPERA CEO Byungtak Kang will present a GovWare 2026 session in Singapore on AI-driven attack surface management and threat hunting.","The article argues that automated scanning, public exploit code, and AI-assisted vulnerability discovery are increasing the need for organizations to respond to exposed systems more quickly."],"insights":["The article frames the main security challenge as shortening the time between finding an exposed system and acting on it, rather than simply discovering more assets.","AITEM is intended to rank risks using an organization's own criteria alongside evidence such as active attacker interest and real-world exploitability, instead of relying solely on standard vendor scores.","The proposed use of AI is focused on repetitive analysis and connecting scattered information, while people retain responsibility for judgment, prioritization, and accountability.","The platform's scope extends beyond public-facing systems to include internal infrastructure, leaked data, dark-web information, and unauthorized use of AI tools."],"referencedReports":[],"body":"\u003cp\u003eAI SPERA is introducing AITEM, an AI-powered threat exposure management approach presented as the next evolution of its Criminal IP attack surface management offering. The company will discuss the platform at GovWare 2026 in Singapore, where CEO Byungtak Kang is scheduled to present a session on AI-driven attack surface management. The sponsored article argues that security teams need to move beyond listing internet-facing systems toward investigating, prioritizing, and responding to risks.\u003c/p\u003e\n\n\u003cp\u003eAITEM combines information from external assets, internal infrastructure, open-source intelligence, dark-web data, Shadow AI, leaked data, and emerging vulnerabilities. It is designed to use AI to connect threats with assets, support natural-language investigations, rank findings using organization-specific criteria and real-world attacker activity, and automate alerts, tickets, and workflow actions. AI SPERA says faster action is increasingly important because automated scanning, published proof-of-concept code, and AI-assisted vulnerability discovery allow attackers to identify exposed systems more quickly.\u003c/p\u003e\n"}]</script>
