<script type="application/json" id="dl-articles">[{"n":1,"title":"SafePal data breach impacts 39,798 customers, stolen info for sale","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/safepal-data-breach-impacts-39-798-customers-stolen-info-for-sale/","time":"23:47","priority":"SHOULD READ","score":78,"tldr":"SafePal says an order-tracking authorization flaw exposed order details for 39,798 customers, and a threat actor is now claiming to sell the stolen data. Wallet seed phrases, private keys, passwords, and payment data were not exposed, but affected customers should watch for targeted phishing and scam calls.","briefOverview":"\u003cp\u003eSafePal is warning of a data breach affecting about 39,798 customers who placed orders between March 2, 2025, and April 11, 2026. The exposed information includes names, email addresses, shipping addresses, phone numbers, and purchase information. SafePal says the incident did not expose wallet seed phrases, private keys, passwords, bank account information, payment card numbers, government-issued identification numbers, or other credentials.\u003c/p\u003e\n\n\u003cp\u003eA threat actor now claims to be selling the stolen SafePal customer data on a cybercrime forum, although BleepingComputer has not independently verified that the actor possesses the data. SafePal says the stolen information could be used for targeted phishing and other social engineering attacks, and customers reported SafePal phishing emails and phone calls as early as May. The company says it has taken down more than 30 fraudulent websites and phishing links tied to the incident.\u003c/p\u003e\n\n\u003cp\u003eSafePal says its investigation found an authorization flaw in the order-tracking function of a plug-in that allowed unauthorized access to another customer’s order information. The company also found a separate configuration error that stopped a data-cleanup process between September 2025 and April 2026, causing order data to be retained as far back as March 2025. SafePal says it fixed the vulnerability, added protections, purged personal data from active e-commerce servers for affected orders, and is working with a third-party security firm to validate the fix and review its order-processing systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SafePal says a data breach affected about 39,798 customers who placed orders between March 2, 2025, and April 11, 2026.","The exposed information includes names, email addresses, shipping addresses, phone numbers, and purchase information, but SafePal says wallet seed phrases, private keys, passwords, bank account information, payment card numbers, government-issued identification numbers, and other credentials were not exposed.","SafePal says the breach resulted from an authorization flaw in the order-tracking function of a plug-in that allowed unauthorized access to another customer’s order information.","A threat actor claims to be selling the stolen SafePal customer data on a cybercrime forum, though BleepingComputer has not independently verified that the actor possesses the data.","SafePal says affected customers do not need to replace their hardware wallets or move cryptocurrency because of the breach, but customers who shared seed phrases or private keys in response to phishing should treat their wallet as compromised."],"insights":["SafePal’s online verification tool can help customers check exposure, but the article says the seller is also using order ID and shipping country details from stolen orders to prove the data is legitimate to potential buyers.","A separate data-cleanup configuration error made the breach broader because order data was retained as far back as March 2025 instead of being removed as intended.","Customers reported SafePal-themed phishing emails and phone calls as early as May, months before SafePal notified impacted customers on August 16.","SafePal’s guidance focuses on phishing risk rather than wallet replacement, because the company says the breach did not compromise wallet access or funds unless a customer already shared a seed phrase or private key."],"referencedReports":[{"title":"Security Update","url":"https://www.safepal.com/en/blog/security-update","publisher":"SafePal","context":"The article cites SafePal’s security advisory as the company’s statement on the breach, exposed data, customer notification, and remediation steps.","category":"advisory","primary":true}],"body":"\u003cp\u003eSafePal is warning of a data breach affecting about 39,798 customers who placed orders between March 2, 2025, and April 11, 2026. The exposed information includes names, email addresses, shipping addresses, phone numbers, and purchase information. SafePal says the incident did not expose wallet seed phrases, private keys, passwords, bank account information, payment card numbers, government-issued identification numbers, or other credentials.\u003c/p\u003e\n\n\u003cp\u003eA threat actor now claims to be selling the stolen SafePal customer data on a cybercrime forum, although BleepingComputer has not independently verified that the actor possesses the data. SafePal says the stolen information could be used for targeted phishing and other social engineering attacks, and customers reported SafePal phishing emails and phone calls as early as May. The company says it has taken down more than 30 fraudulent websites and phishing links tied to the incident.\u003c/p\u003e\n\n\u003cp\u003eSafePal says its investigation found an authorization flaw in the order-tracking function of a plug-in that allowed unauthorized access to another customer’s order information. The company also found a separate configuration error that stopped a data-cleanup process between September 2025 and April 2026, causing order data to be retained as far back as March 2025. SafePal says it fixed the vulnerability, added protections, purged personal data from active e-commerce servers for affected orders, and is working with a third-party security firm to validate the fix and review its order-processing systems.\u003c/p\u003e\n"},{"n":2,"title":"Anthropic confirms Claude is down in major outage affecting multiple services","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-confirms-claude-is-down-in-major-outage-affecting-multiple-services/","time":"22:28","priority":"MAY READ","score":62,"tldr":"Anthropic confirmed a major Claude outage affecting login and performance across Claude.ai, Claude Code, and Claude Cowork, while the Claude API and Console remained operational. The disruption began around 21:58 UTC on August 16 and was restored by 22:40 UTC.","briefOverview":"\u003cp\u003eAnthropic confirmed a major outage affecting Claude, with users reporting login problems and degraded performance across several services. The incident began on August 16, 2026, at around 21:58 UTC. Anthropic’s status page initially said the company was investigating an issue preventing some users from authenticating to Claude.ai, Claude Code, and Claude Cowork.\u003c/p\u003e\n\n\u003cp\u003eA few minutes later, Anthropic reported a broader service disruption involving degraded performance on Claude.ai and platform.claude.com. Users could experience problems signing in, Claude failing to load, requests not completing, or other errors when using the affected services. Anthropic’s status page classified Claude.ai, Claude Code, and Claude Cowork as experiencing a major outage, while Claude Console and the Claude API were listed as operational.\u003c/p\u003e\n\n\u003cp\u003eAnthropic did not disclose the cause of the outage while the incidents were under investigation. The article’s updates state that authentication issues were reported at 21:58 UTC and degraded performance was reported at 22:07 UTC. By 22:40 UTC, Anthropic confirmed that all services were restored.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic confirmed a major outage affecting Claude.ai, Claude Code, and Claude Cowork.","The incident began on August 16, 2026, at around 21:58 UTC, with Anthropic investigating authentication issues affecting multiple Claude services.","Anthropic later reported degraded performance affecting Claude.ai and platform.claude.com at 22:07 UTC.","Users experienced problems signing in, Claude failing to load, requests not completing, or other errors when using the affected services.","Anthropic said all services were restored by 22:40 UTC."],"insights":["The outage did not affect all Anthropic services equally, as Claude Console and the Claude API were listed as operational while Claude.ai, Claude Code, and Claude Cowork were in a major outage.","Anthropic reported two related problems within minutes: authentication issues at 21:58 UTC and broader degraded performance affecting Claude.ai and platform.claude.com at 22:07 UTC.","The disruption was resolved relatively quickly, with all services restored by 22:40 UTC after the first reported investigation began at 21:58 UTC."],"referencedReports":[],"body":"\u003cp\u003eAnthropic confirmed a major outage affecting Claude, with users reporting login problems and degraded performance across several services. The incident began on August 16, 2026, at around 21:58 UTC. Anthropic’s status page initially said the company was investigating an issue preventing some users from authenticating to Claude.ai, Claude Code, and Claude Cowork.\u003c/p\u003e\n\n\u003cp\u003eA few minutes later, Anthropic reported a broader service disruption involving degraded performance on Claude.ai and platform.claude.com. Users could experience problems signing in, Claude failing to load, requests not completing, or other errors when using the affected services. Anthropic’s status page classified Claude.ai, Claude Code, and Claude Cowork as experiencing a major outage, while Claude Console and the Claude API were listed as operational.\u003c/p\u003e\n\n\u003cp\u003eAnthropic did not disclose the cause of the outage while the incidents were under investigation. The article’s updates state that authentication issues were reported at 21:58 UTC and degraded performance was reported at 22:07 UTC. By 22:40 UTC, Anthropic confirmed that all services were restored.\u003c/p\u003e\n"}]</script>
