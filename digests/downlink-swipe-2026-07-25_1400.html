<script type="application/json" id="dl-articles">[{"n":2,"title":"Malicious sites use JavaScript to build malware in browser memory","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-sites-use-javascript-to-build-malware-in-browser-memory/","time":"15:21","priority":"SHOULD READ","score":88,"tldr":"A large malvertising campaign is using fake Solana, Luno, and TradingView sites to make victims’ browsers assemble unique malware executables in memory, helping evade network and static detection. Crypto investors and traders should avoid sponsored downloads and only install apps from official sources after verifying signatures.","briefOverview":"\u003cp\u003eA massive malvertising campaign is using fake Solana, Luno, and TradingView webpages to deliver malware through malicious JavaScript. The operation has been active since late 2024 and is localized to 25 languages in 12 countries, primarily in Asia Pacific and Latin America. It targets retail traders and crypto investors, while redirecting researchers, scanners, and security bots to blank pages.\u003c/p\u003e\n\n\u003cp\u003eConfiant says the campaign stands out because it uses the web browser as a local assembly pipeline for the malware. The landing page registers a service worker and sets up a shared worker that helps assemble the malware from remote components and locally generated bytes. Randomized seed and size parameters are used for each session so the resulting malware file has a unique hash.\u003c/p\u003e\n\n\u003cp\u003eThe technique means no finished malware file is transmitted over the network, making detection less likely and analysis more challenging. Confiant says the final executable is handed to the service worker and downloaded from a same-origin path, so the browser sees it as coming from the landing page domain. Users involved in financial or cryptocurrency activities are advised to avoid downloads from social media ads or sponsored search results, get files from official websites, and verify installer signatures and publishers before running them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A massive malvertising campaign uses fake Solana, Luno, and TradingView webpages with malicious JavaScript that instructs browsers to assemble malware directly in memory.","The operation has been active since late 2024, is localized to 25 languages in 12 countries, and primarily targets retail traders and crypto investors in Asia Pacific and Latin America.","Confiant says the pages register a service worker and use a SharedWorker to request a randomized “/config” response so each session can build a malware file with a unique hash.","The technique avoids transmitting a finished malware file over the network, making detection less likely and analysis more challenging.","Users engaged in financial or cryptocurrency activities are advised to avoid downloading apps from social media advertisements or sponsored search results and to verify installers from official company websites."],"insights":["The campaign’s use of randomized seed and size parameters means each victim can receive a malware executable with a unique hash, reducing the usefulness of hash-based detection.","Because the final executable is assembled inside the browser rather than sent as a completed file over the network, defenders may have fewer network artifacts to inspect.","The same-origin ServiceWorker delivery method makes the download appear to come from the fake landing page domain, even though some components originate from elsewhere.","The campaign filters visitors so researchers, scanners, and security bots are redirected to blank pages, which can make discovery and analysis harder.","The shift from StreamSaver-based delivery to same-origin ServiceWorker delivery since April shows the operators are actively changing delivery methods within the same campaign."],"referencedReports":[{"title":"SourTrade: Browser-Assembled Malware","url":"http://blog.confiant.com/p/sourtrade-browser-assembled-malware","publisher":"Confiant","context":"The article relies on Confiant’s analysis to explain how the campaign uses the browser as a local assembly pipeline for malware.","category":"research","primary":true},{"title":"The scam that won’t quit: Malicious TradingView Premium ads jump from Meta to Google and YouTube","url":"https://www.bitdefender.com/en-us/blog/labs/the-scam-that-wont-quit-malicious-tradingview-premium-ads-jump-from-meta-to-google-and-youtube","publisher":"Bitdefender","context":"The article cites Bitdefender’s 2025 report as supporting evidence about an earlier resilient malvertising campaign that used StreamSaver to distribute malware and described the payload’s capabilities.","category":"research","primary":false}],"body":"\u003cp\u003eA massive malvertising campaign is using fake Solana, Luno, and TradingView webpages to deliver malware through malicious JavaScript. The operation has been active since late 2024 and is localized to 25 languages in 12 countries, primarily in Asia Pacific and Latin America. It targets retail traders and crypto investors, while redirecting researchers, scanners, and security bots to blank pages.\u003c/p\u003e\n\n\u003cp\u003eConfiant says the campaign stands out because it uses the web browser as a local assembly pipeline for the malware. The landing page registers a service worker and sets up a shared worker that helps assemble the malware from remote components and locally generated bytes. Randomized seed and size parameters are used for each session so the resulting malware file has a unique hash.\u003c/p\u003e\n\n\u003cp\u003eThe technique means no finished malware file is transmitted over the network, making detection less likely and analysis more challenging. Confiant says the final executable is handed to the service worker and downloaded from a same-origin path, so the browser sees it as coming from the landing page domain. Users involved in financial or cryptocurrency activities are advised to avoid downloads from social media ads or sponsored search results, get files from official websites, and verify installer signatures and publishers before running them.\u003c/p\u003e\n"},{"n":1,"title":"ShinyHunters data leaks fuel $2,000 sextortion email scam","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-data-leaks-fuel-2-000-sextortion-email-scam/","time":"14:16","priority":"SHOULD READ","score":78,"tldr":"Scammers are using email addresses from ShinyHunters-leaked breaches to send fake sextortion emails demanding $2,000 in Bitcoin. There is no evidence recipients’ devices were hacked, and victims should not pay or respond.","briefOverview":"\u003cp\u003eThreat actors are using email addresses exposed in data breaches leaked by the ShinyHunters extortion group to send sextortion emails demanding $2,000 in Bitcoin. The emails claim to come from ShinyHunters and say hackers compromised recipients’ devices after obtaining their email addresses from breached company databases. BleepingComputer says the messages appear to be from someone who downloaded previously leaked ShinyHunters data rather than from the extortion group itself, and ShinyHunters denied involvement.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer has seen leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign. In some cases, BleepingComputer confirmed that targeted email addresses were included in the associated data previously leaked by ShinyHunters. The campaign shows how leaked data can later be reused by unrelated threat actors to make threats appear more legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe emails falsely claim attackers installed an exploit on victims’ computers and phones, giving access to microphones, cameras, keyboards, photos, browsing history, conversations, and contact lists. They also claim to have recorded recipients visiting adult websites and threaten to share intimate videos unless payment is made within 48 hours. The article says there is no indication the sender compromised devices, installed malware, accessed cameras, or monitored recipients’ activity, and recipients should not pay or respond.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are using email addresses exposed in data breaches leaked by ShinyHunters to send sextortion emails demanding $2,000 in Bitcoin.","BleepingComputer saw leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign.","The emails claim to be from ShinyHunters and falsely state that attackers compromised recipients’ devices, accessed cameras and microphones, and recorded them visiting adult websites.","BleepingComputer contacted ShinyHunters, and the extortion group denied involvement in the sextortion email campaign.","Recipients are advised not to pay the ransom or respond to the sender, because there is no indication the sender accessed their devices or personal activity."],"insights":["The campaign shows that leaked data can continue to harm individuals after publication, even when the new abuse is carried out by actors unrelated to the original breach.","The scammers increase credibility by naming the specific breached company tied to the recipient’s leaked email address, making a generic sextortion message appear targeted.","Betterment specifically noted that knowing someone’s email address does not give an attacker the ability to install malware or access that person’s device.","The article advises recipients who interacted with the Betterment-themed message to contact Betterment’s fraud team, while others should delete the email without replying, paying, clicking links, or opening attachments."],"referencedReports":[],"body":"\u003cp\u003eThreat actors are using email addresses exposed in data breaches leaked by the ShinyHunters extortion group to send sextortion emails demanding $2,000 in Bitcoin. The emails claim to come from ShinyHunters and say hackers compromised recipients’ devices after obtaining their email addresses from breached company databases. BleepingComputer says the messages appear to be from someone who downloaded previously leaked ShinyHunters data rather than from the extortion group itself, and ShinyHunters denied involvement.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer has seen leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign. In some cases, BleepingComputer confirmed that targeted email addresses were included in the associated data previously leaked by ShinyHunters. The campaign shows how leaked data can later be reused by unrelated threat actors to make threats appear more legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe emails falsely claim attackers installed an exploit on victims’ computers and phones, giving access to microphones, cameras, keyboards, photos, browsing history, conversations, and contact lists. They also claim to have recorded recipients visiting adult websites and threaten to share intimate videos unless payment is made within 48 hours. The article says there is no indication the sender compromised devices, installed malware, accessed cameras, or monitored recipients’ activity, and recipients should not pay or respond.\u003c/p\u003e\n"}]</script>
