<script type="application/json" id="dl-articles">[{"n":1,"title":"Critical NGINX Vulnerability Can Crash Workers and May Allow Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-nginx-vulnerability-can-crash.html","time":"20:42","priority":"MUST READ","score":94,"tldr":"F5 patched a critical NGINX heap buffer overflow, CVE-2026-42533, that can let unauthenticated attackers crash worker processes and may enable remote code execution in certain configurations. Organizations should upgrade to nginx 1.30.4/1.31.3 or NGINX Plus 37.0.3.1 because temporary mitigations may not fully close the issue.","briefOverview":"\u003cp\u003eF5 shipped fixes for CVE-2026-42533, a critical nginx flaw that allows a remote, unauthenticated attacker to trigger a heap buffer overflow in the worker process with crafted HTTP requests. The issue was patched on July 15 in nginx 1.30.4 stable, nginx 1.31.3 mainline, and NGINX Plus 37.0.3.1. Triggering the flaw can crash or restart the worker process, causing denial of service, and F5 says it may allow remote code execution where ASLR is disabled or can be bypassed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability depends on configuration, not just version, and appears in a specific pattern involving a regex-based map whose output variable is referenced after a capture from an earlier regex match. The article explains that nginx’s two-pass script engine first measures the needed buffer size and then writes the result, but the shared capture state can be overwritten between those passes. As a result, the buffer may be sized for one capture while the write uses a different attacker-sized capture, producing an overflow controlled by the request.\u003c/p\u003e\n\n\u003cp\u003eF5 lists the flaw as affecting core nginx, NGINX Plus, NGINX Ingress Controller, Gateway Fabric, App Protect WAF, and Instance Manager, though fixed builds for the latter four were not listed at publication. F5 recommends upgrading and offers a temporary mitigation of switching affected regex maps to named captures, but researcher Stan Shaw says upgrading is the only complete fix because a narrower named-capture path remains. As of July 20, CVE-2026-42533 was not in CISA’s Known Exploited Vulnerabilities catalog and no public exploit code had appeared, while Shaw said he would publish a proof-of-concept 21 days after the patch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 patched CVE-2026-42533 on July 15 in nginx 1.30.4, nginx 1.31.3, and NGINX Plus 37.0.3.1.","The flaw can let a remote, unauthenticated attacker trigger a heap buffer overflow in the nginx worker process using crafted HTTP requests.","Triggering the vulnerability can crash or restart the worker process and may allow remote code execution where ASLR is disabled or can be bypassed.","Exposure depends on configuration and involves a regex-based map whose output variable is referenced in a string expression after a capture from an earlier regex match.","F5’s temporary mitigation is to switch affected regex maps to named captures, but researcher Stan Shaw said upgrading is the only complete fix."],"insights":["The vulnerability is configuration-dependent, so simply running a vulnerable nginx version is not enough to confirm exposure; administrators need to inspect whether regex-based maps and capture variables are used in the specific ordering described.","Researcher Stan Shaw claims the bug can leak uninitialized heap data when the clobbered capture is smaller than the original, potentially providing the address information needed to bypass ASLR on a default Ubuntu 24.04 build.","F5’s suggested mitigation of switching affected regex maps to named captures may not fully address the issue, because Shaw says a map that defines the same named group as the location regex can still reach the overflow through another code path.","The article says no public exploit code or CISA Known Exploited Vulnerabilities listing existed as of July 20, but Shaw plans to publish a proof-of-concept 21 days after the patch, creating a limited window to upgrade before exploit details may become public."],"referencedReports":[{"title":"F5 advisory for CVE-2026-42533","url":"https://my.f5.com/manage/s/article/K000162097","publisher":"F5","context":"The article cites F5's advisory for affected products, severity ratings, impact, and mitigation guidance for CVE-2026-42533.","category":"","primary":false},{"title":"NGINX security advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article references nginx's security advisories for the vulnerable version range, stating that versions from 0.9.6 through 1.31.2 are affected.","category":"","primary":false},{"title":"CVE-2026-42533 nginx RCE writeup","url":"https://cyberstan.co.uk/nginx-rce/","publisher":"Stan Shaw / cyberstan","context":"The article cites Stan Shaw's detailed writeup for technical claims about ASLR bypass, heap data leakage, and a mitigation bypass variant.","category":"","primary":false}],"body":"\u003cp\u003eF5 shipped fixes for CVE-2026-42533, a critical nginx flaw that allows a remote, unauthenticated attacker to trigger a heap buffer overflow in the worker process with crafted HTTP requests. The issue was patched on July 15 in nginx 1.30.4 stable, nginx 1.31.3 mainline, and NGINX Plus 37.0.3.1. Triggering the flaw can crash or restart the worker process, causing denial of service, and F5 says it may allow remote code execution where ASLR is disabled or can be bypassed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability depends on configuration, not just version, and appears in a specific pattern involving a regex-based map whose output variable is referenced after a capture from an earlier regex match. The article explains that nginx’s two-pass script engine first measures the needed buffer size and then writes the result, but the shared capture state can be overwritten between those passes. As a result, the buffer may be sized for one capture while the write uses a different attacker-sized capture, producing an overflow controlled by the request.\u003c/p\u003e\n\n\u003cp\u003eF5 lists the flaw as affecting core nginx, NGINX Plus, NGINX Ingress Controller, Gateway Fabric, App Protect WAF, and Instance Manager, though fixed builds for the latter four were not listed at publication. F5 recommends upgrading and offers a temporary mitigation of switching affected regex maps to named captures, but researcher Stan Shaw says upgrading is the only complete fix because a narrower named-capture path remains. As of July 20, CVE-2026-42533 was not in CISA’s Known Exploited Vulnerabilities catalog and no public exploit code had appeared, while Shaw said he would publish a proof-of-concept 21 days after the patch.\u003c/p\u003e\n"}]</script>
