<script type="application/json" id="dl-articles">[{"n":34,"title":"tensorlake NPM package compromised with Shai Hulud worm","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/tensorlake-npm-package-compromised","time":"03:32","priority":"MUST READ","score":96,"tldr":"The npm package tensorlake version 0.5.144 was compromised with a Shai-Hulud worm that steals credentials and browser wallet data, spreads through supply chains, and can wipe infected systems if its GitHub token is revoked. Organizations that installed this version should treat affected hosts as fully compromised, remove it, and immediately rotate exposed secrets.","briefOverview":"\u003cp\u003eOn 8 October 2026, a threat actor published tensorlake version 0.5.144 to npm with a variant of the Shai-Hulud worm. Tensorlake is a serverless sandbox for AI agents with more than 100,000 reported lifetime npm installs. The article reports no evidence that the actor published compromised versions of Tensorlake’s PyPI or Cargo packages.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package runs a preinstall script that launches obfuscated code through the Bun runtime. It attempts to steal sensitive environment variables, local credential files, browser data, and data from 14 cryptocurrency wallet browser extensions, while also attempting to replicate through connected supply chains. It uses the hardcoded domain \u003ccode\u003eiseekaigogo[.]com\u003c/code\u003e and an Ethereum-contract-based mechanism for command-and-control information, and it includes a dead-man’s switch that can wipe infected systems if an embedded GitHub token is revoked.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were introduced into the Tensorlake GitHub repository through verified commits made under a maintainer identity on 7 October 2026. The repository was compromised for approximately 20 hours before the npm publication occurred. The article advises treating infected systems as fully compromised and urgently rotating all secrets and credentials they contained.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A compromised version of the tensorlake npm package, version 0.5.144, was published on 8 October 2026 and contains a variant of the Shai-Hulud worm.","The malicious package runs through a preinstall script that drops the Bun runtime and executes an obfuscated payload in lib/Math_Symbol.js.","The payload attempts to collect sensitive environment variables, local credential files, browser data, and data from 14 cryptocurrency browser extensions.","The malware uses iseekaigogo[.]com as a hardcoded command-and-control address and can retrieve an alternative address through a threat actor-controlled Ethereum contract.","The article advises treating infected systems as fully compromised and rotating all secrets and credentials they contained as a critical priority."],"insights":["The malware includes a dead-man’s switch that can wipe infected machines if its embedded GitHub token is revoked, making investigation and containment more urgent.","Although the malware can retrieve an alternate command-and-control address through an Ethereum contract, the contract’s most recent value was the same hardcoded domain, iseekaigogo[.]com.","The payload targets browser storage for 14 cryptocurrency wallet extensions and downloads a system-specific HackBrowserData tool, extending its collection beyond typical development and cloud credentials.","A tensorlake-specific WORMTAG marker suggests this was a new compromise rather than continued reinfection from an earlier Shai-Hulud wave.","The attacker introduced the malicious files through verified maintainer commits and controlled the repository for about 20 hours before successfully publishing the npm package."],"referencedReports":[],"body":"\u003cp\u003eOn 8 October 2026, a threat actor published tensorlake version 0.5.144 to npm with a variant of the Shai-Hulud worm. Tensorlake is a serverless sandbox for AI agents with more than 100,000 reported lifetime npm installs. The article reports no evidence that the actor published compromised versions of Tensorlake’s PyPI or Cargo packages.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package runs a preinstall script that launches obfuscated code through the Bun runtime. It attempts to steal sensitive environment variables, local credential files, browser data, and data from 14 cryptocurrency wallet browser extensions, while also attempting to replicate through connected supply chains. It uses the hardcoded domain \u003ccode\u003eiseekaigogo[.]com\u003c/code\u003e and an Ethereum-contract-based mechanism for command-and-control information, and it includes a dead-man’s switch that can wipe infected systems if an embedded GitHub token is revoked.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were introduced into the Tensorlake GitHub repository through verified commits made under a maintainer identity on 7 October 2026. The repository was compromised for approximately 20 hours before the npm publication occurred. The article advises treating infected systems as fully compromised and urgently rotating all secrets and credentials they contained.\u003c/p\u003e\n"},{"n":44,"title":"TensorLake npm SDK Compromised in ChainDrop Shai-Hulud Credential-Stealing Attack","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/tensorlake-compromise?utm_medium=feed","time":"02:54","priority":"MUST READ","score":96,"tldr":"Tensorlake’s npm SDK version 0.5.144 was compromised with the Shai-Hulud/ChainDrop credential-stealing worm, which runs during installation via a preinstall hook and can steal secrets, establish persistence, and spread through npm. Organizations that installed it should treat affected hosts as compromised, remove persistence before revoking tokens, and rebuild systems from trusted sources.","briefOverview":"\u003cp\u003eTensorlake’s npm SDK version 0.5.144 was compromised in a ChainDrop/Shai-Hulud supply-chain attack. Published on October 8, 2026, the release contained obfuscated malware and was flagged by Socket about 11 minutes later. The malicious package used a \u003ccode\u003epreinstall\u003c/code\u003e hook, meaning its code could run during installation without a developer importing the SDK or starting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eThe payload targets credentials and sensitive data from npm, GitHub, AWS, Kubernetes, HashiCorp Vault, SSH keys, environment files, cryptocurrency wallets, messaging applications, and AI development tools. It can send collected data to attackers, establish persistent access, execute remotely supplied code, and use stolen npm publishing credentials to spread to other packages. Its remote endpoint is resolved through an Ethereum contract using public RPC endpoints, with a GitHub fallback.\u003c/p\u003e\n\n\u003cp\u003eOrganizations that installed \u003ccode\u003etensorlake@0.5.144\u003c/code\u003e should treat hosts where the installation script ran as compromised. The article advises blocking the version, isolating affected systems, investigating persistence, and removing the \u003ccode\u003egh-token-monitor\u003c/code\u003e before revoking GitHub tokens because revocation can trigger an attacker-supplied handler intended to wipe the user’s home directory. Teams should then replace exposed credentials, audit connected accounts for unauthorized activity, and rebuild affected environments from trusted sources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tensorlake npm SDK version 0.5.144, published on October 8, 2026, contained obfuscated malicious code associated with the ChainDrop/Shai-Hulud supply-chain campaign.","A preinstall script ran the malicious loader during package installation, so the code could execute without a developer importing the SDK or starting an agent.","The payload targeted npm and GitHub tokens, AWS and Kubernetes credentials, HashiCorp Vault, SSH keys, environment files, cryptocurrency wallets, messaging-app data, and AI development-tool configuration files.","The malware could exfiltrate collected secrets, establish persistence, execute attacker-supplied code, and use stolen npm publishing credentials to spread to additional packages.","Organizations that installed tensorlake@0.5.144 are advised to isolate affected hosts, remove the gh-token-monitor persistence mechanism before revoking tokens, rotate exposed credentials, and rebuild affected environments from trusted sources."],"insights":["Installing the compromised SDK was sufficient for exposure because its preinstall hook ran before developers imported the package or used any AI agent functionality.","The package’s use in AI-agent infrastructure does not protect the installation environment: the malicious code runs on the developer workstation, server, or build runner before any generated code reaches Tensorlake’s isolated sandbox.","The remote control endpoint was not hardcoded; the payload resolved it through an Ethereum contract using public RPC services, with a GitHub fallback.","Revoking a stolen GitHub token before removing the persistent gh-token-monitor can trigger attacker-supplied code intended to wipe the affected user’s home directory.","The reported 12,000 weekly downloads reflect the package’s overall usage and do not establish how many times the malicious release was downloaded or how many systems were infected."],"referencedReports":[],"body":"\u003cp\u003eTensorlake’s npm SDK version 0.5.144 was compromised in a ChainDrop/Shai-Hulud supply-chain attack. Published on October 8, 2026, the release contained obfuscated malware and was flagged by Socket about 11 minutes later. The malicious package used a \u003ccode\u003epreinstall\u003c/code\u003e hook, meaning its code could run during installation without a developer importing the SDK or starting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eThe payload targets credentials and sensitive data from npm, GitHub, AWS, Kubernetes, HashiCorp Vault, SSH keys, environment files, cryptocurrency wallets, messaging applications, and AI development tools. It can send collected data to attackers, establish persistent access, execute remotely supplied code, and use stolen npm publishing credentials to spread to other packages. Its remote endpoint is resolved through an Ethereum contract using public RPC endpoints, with a GitHub fallback.\u003c/p\u003e\n\n\u003cp\u003eOrganizations that installed \u003ccode\u003etensorlake@0.5.144\u003c/code\u003e should treat hosts where the installation script ran as compromised. The article advises blocking the version, isolating affected systems, investigating persistence, and removing the \u003ccode\u003egh-token-monitor\u003c/code\u003e before revoking GitHub tokens because revocation can trigger an attacker-supplied handler intended to wipe the user’s home directory. Teams should then replace exposed credentials, audit connected accounts for unauthorized activity, and rebuild affected environments from trusted sources.\u003c/p\u003e\n"},{"n":47,"title":"Tensorlake npm Package Compromised: A Worm With a Hostage Token That Wipes Your Machine If You Revoke It","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/tensorlake-npm-compromised-hostage-token-worm","time":"03:19","priority":"MUST READ","score":96,"tldr":"The npm package tensorlake@0.5.144 was compromised with a credential-stealing worm that spreads through npm and GitHub and installs a token-monitoring persistence mechanism that can wipe a victim’s home directory if its stolen GitHub token is revoked. Affected users should first disable and remove the gh-token-monitor service, then rotate all exposed credentials and pin Tensorlake to 0.5.143.","briefOverview":"\u003cp\u003e\u003ccode\u003etensorlake@0.5.144\u003c/code\u003e on npm was released with malicious code that runs during installation on developer machines. The package steals GitHub and npm tokens, cloud and Kubernetes credentials, SSH keys, browser logins, and configuration for AI coding tools. It encrypts and sends collected data to a public GitHub repository created in the victim’s account or to \u003ccode\u003eiseekaigogo.com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use stolen npm tokens to infect and republish a victim’s packages, and stolen GitHub tokens to add files that run when repositories are opened in Claude Code or Visual Studio Code. It also installs a \u003ccode\u003egh-token-monitor\u003c/code\u003e service that checks a stolen GitHub token every minute and deletes the user’s home directory if the token is revoked or otherwise rejected. Affected users are instructed to remove this monitor before revoking credentials, then rotate exposed secrets and pin Tensorlake to version \u003ccode\u003e0.5.143\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The npm package tensorlake@0.5.144 contains a malicious preinstall script that targets developer machines, downloads Bun, and runs an obfuscated file.","The malicious code steals GitHub and npm tokens, cloud and Kubernetes credentials, SSH keys, browser logins, and AI-tool configuration, then sends encrypted data to a GitHub repository it creates or to iseekaigogo.com.","Using stolen npm and GitHub tokens, the malware can republish infected packages and add persistent .claude/settings.json and .vscode/tasks.json files to repositories it can access.","The malware installs a gh-token-monitor service that checks a stolen GitHub token every minute and deletes the user’s home directory if GitHub rejects the token.","Affected users should remove the gh-token-monitor service before revoking credentials, then rotate exposed secrets and pin Tensorlake to version 0.5.143."],"insights":["The compromised release had a valid npm provenance attestation because it was published from the legitimate repository, showing that provenance identifies where a package was built rather than whether its code is safe.","The install hook skips CI environments, indicating that developer workstations—not automated build systems—are the primary target, although CI secrets should still be rotated if they were accessible.","Revoking the stolen GitHub token is unsafe until the gh-token-monitor persistence mechanism is removed, because the monitor is designed to erase the user’s home directory when the token becomes invalid.","The malware can persist beyond the initial package installation by placing configuration files in repositories that trigger when developers open them in Claude Code or Visual Studio Code.","The malicious commits were pushed directly to the Tensorlake main branch without pull requests, and the package release was subsequently published through the repository’s normal release workflow."],"referencedReports":[],"body":"\u003cp\u003e\u003ccode\u003etensorlake@0.5.144\u003c/code\u003e on npm was released with malicious code that runs during installation on developer machines. The package steals GitHub and npm tokens, cloud and Kubernetes credentials, SSH keys, browser logins, and configuration for AI coding tools. It encrypts and sends collected data to a public GitHub repository created in the victim’s account or to \u003ccode\u003eiseekaigogo.com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use stolen npm tokens to infect and republish a victim’s packages, and stolen GitHub tokens to add files that run when repositories are opened in Claude Code or Visual Studio Code. It also installs a \u003ccode\u003egh-token-monitor\u003c/code\u003e service that checks a stolen GitHub token every minute and deletes the user’s home directory if the token is revoked or otherwise rejected. Affected users are instructed to remove this monitor before revoking credentials, then rotate exposed secrets and pin Tensorlake to version \u003ccode\u003e0.5.143\u003c/code\u003e.\u003c/p\u003e\n"},{"n":32,"title":"Japan Sees Sharp Rise in Web Data Leaks Amid Mobile API Abuse and Metabase Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/japan-sees-sharp-rise-in-web-data-leaks.html","time":"15:45","priority":"MUST READ","score":93,"tldr":"JPCERT/CC warns that a surge of Japanese personal-data leaks is linked to mobile-app API abuse, weak access controls and exploitation of the critical Metabase SQL injection flaw CVE-2026-72898. Organizations should urgently patch Metabase, review logs and API permissions, rotate exposed credentials, and enforce rate limits and least privilege.","briefOverview":"\u003cp\u003eJPCERT/CC warned of a series of personal-data leaks affecting Japanese organizations, where attackers have abused mobile-app APIs and targeted known software flaws. The incidents have affected consumer apps, business intelligence tools, and employee-facing management systems that were not expected to be publicly accessible. JPCERT/CC said its information is limited and fragmentary, did not name any attacker or victim, and cautioned that the same method may not have been used in every case.\u003c/p\u003e\n\n\u003cp\u003eMacnica counted 119 similar publicly disclosed web-system incidents in Japan through October 6, 2026, compared with 84 during all of 2025 and 62 in 2024; 81 of this year\u0026rsquo;s cases were disclosed from July onward. Park24 said data from about 6.6 million Times Car accounts was obtained, including identity-document images from about 1.6 million accounts, while Monogatari Corporation reported 10,788,963 leaked records from the Yakiniku King app member system. Macnica also identified 99 similar cases in 13 other countries and regions, although it said disclosure practices differ and it does not know whether Japan is the only target.\u003c/p\u003e\n\n\u003cp\u003eThe reported methods include extracting API endpoints and keys from public smartphone apps, accessing internal API functions not available in app screens, abusing overly broad API permissions, and using stolen keys. JPCERT/CC also identified exploitation of CVE-2026-72898, an unauthenticated SQL injection flaw in Metabase that can provide administrator access and expose credentials for connected databases. The center recommends patching affected Metabase versions, reviewing logs and account activity, rotating connected-database credentials, enforcing access controls and rate limits on every API endpoint, and limiting API-token privileges and lifetimes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JPCERT/CC warned that attackers behind a series of personal-data leaks at Japanese organizations have abused mobile-app APIs, targeted known software flaws, and accessed business tools and employee systems that were not expected to be publicly reachable.","Macnica recorded 119 publicly disclosed, similar web-system personal-data theft or leak incidents in Japan through October 6, 2026, with 81 reported since July.","Park24 reported that data from about 6.6 million Times Car accounts was obtained by a third party, and that identity documents such as driver’s-license images leaked from about 1.6 million accounts.","JPCERT/CC identified exploitation of CVE-2026-72898, a critical unauthenticated SQL injection flaw in Metabase that can enable administrator access and theft of credentials for connected databases.","JPCERT/CC recommends access controls on every API endpoint, rate limits for abuse-prone functions, least-privilege API tokens, token expiration, and rapid token revocation."],"insights":["Attackers can extract API endpoints and keys from publicly released smartphone apps, then make requests that resemble normal app use while accessing functions not exposed through the app’s screens.","Of the 81 similar Japanese incidents disclosed since July, 65 contained too little detail to determine how attackers entered, limiting attribution of the current activity to any single method or group.","Metabase’s minimum safe releases are newer than the initial versions that fixed CVE-2026-72898, because the company later issued another critical advisory and raised its recommended baseline.","AhaSlides reported that an attacker accessed its Metabase environment from August 12 to September 7, showing that exploitation continued after the initial Metabase fix was released.","JPCERT/CC and Macnica caution that requests from listed source IP addresses are not proof of malicious activity because some may be shared VPN exit addresses; unusually heavy traffic or errors should instead prompt detailed log review."],"referencedReports":[{"title":"JPCERT/CC Alert on Unauthorized Access and Personal Data Leaks at Japanese Organizations","url":"https://www.jpcert.or.jp/at/2026/at260030.html","publisher":"jpcert-cc","context":"The article is based on this October 8, 2026 JPCERT/CC alert describing observed API abuse, known-vulnerability exploitation, indicators, and defensive measures.","category":"advisory","primary":true},{"title":"Analysis of Web-System Incidents in 2026","url":"https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html","publisher":"macnica-security-research-center","context":"The article cites Macnica's October 7 analysis for its count of similar disclosed incidents in Japan and observations from incident response and log analysis.","category":"research","primary":true},{"title":"JPCERT/CC Alert on CVE-2026-72898 in Metabase","url":"https://www.jpcert.or.jp/at/2026/at260023.html","publisher":"jpcert-cc","context":"The article references JPCERT/CC's August 14 warning about the critical Metabase SQL injection flaw.","category":"advisory","primary":false},{"title":"Metabase Security Update, August 6, 2026","url":"https://www.metabase.com/blog/security-update-6-aug-2026","publisher":"metabase","context":"The article cites this Metabase security update as the announcement of the fix for CVE-2026-72898.","category":"advisory","primary":false},{"title":"Metabase Critical Security Advisory GHSA-r495-55cx-fjh7","url":"https://github.com/metabase/metabase/security/advisories/GHSA-r495-55cx-fjh7","publisher":"metabase","context":"The article references this August 11 advisory covering additional critical issues identified by Metabase.","category":"advisory","primary":false},{"title":"Metabase Security-Focused Release Announcement","url":"https://www.metabase.com/blog/security-focused-release-announcement-2026-08-12","publisher":"metabase","context":"The article uses this release advisory for Metabase's updated minimum safe versions.","category":"advisory","primary":false},{"title":"Personal Information Protection Commission Alert on Data Leaks","url":"https://www.ppc.go.jp/files/pdf/261007_alert_dataleakage.pdf","publisher":"japan-personal-information-protection-commission","context":"The article says the Japanese privacy regulator issued this alert to businesses handling personal data following large unauthorized-access incidents.","category":"advisory","primary":false},{"title":"Guidance on Personal Data Leaks Caused by Unauthorized Access","url":"https://www.ppc.go.jp/files/pdf/261007_warning.pdf","publisher":"japan-personal-information-protection-commission","context":"The article references this revised regulator guidance, which includes an API-abuse case study.","category":"guide","primary":false}],"body":"\u003cp\u003eJPCERT/CC warned of a series of personal-data leaks affecting Japanese organizations, where attackers have abused mobile-app APIs and targeted known software flaws. The incidents have affected consumer apps, business intelligence tools, and employee-facing management systems that were not expected to be publicly accessible. JPCERT/CC said its information is limited and fragmentary, did not name any attacker or victim, and cautioned that the same method may not have been used in every case.\u003c/p\u003e\n\n\u003cp\u003eMacnica counted 119 similar publicly disclosed web-system incidents in Japan through October 6, 2026, compared with 84 during all of 2025 and 62 in 2024; 81 of this year\u0026rsquo;s cases were disclosed from July onward. Park24 said data from about 6.6 million Times Car accounts was obtained, including identity-document images from about 1.6 million accounts, while Monogatari Corporation reported 10,788,963 leaked records from the Yakiniku King app member system. Macnica also identified 99 similar cases in 13 other countries and regions, although it said disclosure practices differ and it does not know whether Japan is the only target.\u003c/p\u003e\n\n\u003cp\u003eThe reported methods include extracting API endpoints and keys from public smartphone apps, accessing internal API functions not available in app screens, abusing overly broad API permissions, and using stolen keys. JPCERT/CC also identified exploitation of CVE-2026-72898, an unauthenticated SQL injection flaw in Metabase that can provide administrator access and expose credentials for connected databases. The center recommends patching affected Metabase versions, reviewing logs and account activity, rotating connected-database credentials, enforcing access controls and rate limits on every API endpoint, and limiting API-token privileges and lifetimes.\u003c/p\u003e\n"},{"n":7,"title":"Cisco warns of critical flaws allowing Nexus switch takeover","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-critical-flaws-allowing-nexus-switch-takeover/","time":"15:26","priority":"SHOULD READ","score":88,"tldr":"Cisco issued patches for five critical NX-OS flaws that could let attackers gain root-level code execution or crash affected Nexus 3000 and 9000 switches when vulnerable features are enabled. Organizations should upgrade promptly or disable NX-API, NGOAM, and MPLS OAM where unnecessary.","briefOverview":"\u003cp\u003eCisco released advisories for five critical vulnerabilities in NX-OS that could allow attackers to run code with root privileges on affected Nexus switches. If code execution is not achieved, the flaws can also crash processes and cause a device reload, producing a denial-of-service condition. Cisco said it was not aware of public announcements or malicious exploitation at the time the advisories were published.\u003c/p\u003e\n\n\u003cp\u003eThe issues affect Nexus 3000 and Nexus 9000 Series switches running standalone NX-OS when NX-API, Next Generation OAM (NGOAM), or MPLS OAM is enabled. The NX-API issue can be triggered with a crafted HTTP request, while the NGOAM flaws involve crafted IP traffic and the MPLS OAM flaw involves a crafted MPLS echo-request packet. Nexus 7000 switches and Nexus 9000 devices in ACI mode are not affected, and Nexus 9000 systems with Silicon One ASICs are unaffected by the MPLS OAM issue.\u003c/p\u003e\n\n\u003cp\u003eCisco recommends upgrading to fixed NX-OS releases identified through its Software Checker tool and disabling unneeded NX-API, NGOAM, or MPLS OAM features. For systems that cannot yet be upgraded and rebooted, Cisco provides temporary Live Protect shields. Cisco also released hardening updates for Cisco License, including flaws with severity scores up to 10.0, and recommends upgrading affected installations to version 10-202609 because no workarounds are available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco disclosed five critical NX-OS vulnerabilities that can enable root-level arbitrary code execution on affected Nexus switches or cause processes to crash and devices to reload.","The flaws affect Nexus 3000 and Nexus 9000 Series switches in standalone NX-OS mode when NX-API, Next Generation OAM, or MPLS OAM is enabled.","Cisco said Nexus 7000 switches and Nexus 9000 switches operating in ACI mode are not affected by any of the five vulnerabilities.","Cisco recommends upgrading to fixed NX-OS releases, disabling unneeded affected features, or using temporary Live Protect shields when an upgrade and reboot cannot yet be performed.","Cisco said the flaws were found during internal security testing and that it was unaware of public disclosure or malicious exploitation when the advisories were published."],"insights":["Exposure is configuration-dependent for the Nexus flaws: NX-API and MPLS OAM are disabled by default, while the NGOAM flaws require that feature to be enabled.","CVE-2026-76486 has additional prerequisites beyond NGOAM, requiring either SRv6 or a configured NV Overlay environment, while CVE-2026-76501 is limited to SRv6-enabled systems and only some Nexus 9000 models support SRv6.","Nexus 9000 switches using Silicon One ASICs are not affected by CVE-2026-76465 because they do not support the required MPLS OAM feature.","Cisco License has separate high- and critical-severity issues that affect vulnerable releases regardless of configuration, have no workarounds, and require an upgrade to version 10-202609; older Smart Software Manager releases will not be patched."],"referencedReports":[{"title":"Cisco NX-API Remote Code Execution Vulnerability Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-napi-rce-r2shwu2j","publisher":"cisco","context":"The article links Cisco's advisory for CVE-2026-76471, affecting the NX-API feature on vulnerable Nexus switches.","category":"advisory","primary":true},{"title":"Cisco Next Generation OAM Remote Code Execution Vulnerabilities Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ngoam-rce-LWKQ4BU","publisher":"cisco","context":"The article links Cisco's advisory for CVE-2026-76485, CVE-2026-76486, and CVE-2026-76501, which require NGOAM to be enabled.","category":"advisory","primary":true},{"title":"Cisco MPLS OAM Remote Code Execution Vulnerability Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-moam-rce-uBTzYV7","publisher":"cisco","context":"The article links Cisco's advisory for CVE-2026-76465, involving MPLS echo-request packet validation.","category":"advisory","primary":true},{"title":"Cisco License Security Hardening Updates Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-ssm-Ph77wdhf","publisher":"cisco","context":"The article links Cisco's security advisory covering critical Cisco License issues, including authentication, signature-verification, credential-protection, and code-injection flaws.","category":"advisory","primary":true}],"body":"\u003cp\u003eCisco released advisories for five critical vulnerabilities in NX-OS that could allow attackers to run code with root privileges on affected Nexus switches. If code execution is not achieved, the flaws can also crash processes and cause a device reload, producing a denial-of-service condition. Cisco said it was not aware of public announcements or malicious exploitation at the time the advisories were published.\u003c/p\u003e\n\n\u003cp\u003eThe issues affect Nexus 3000 and Nexus 9000 Series switches running standalone NX-OS when NX-API, Next Generation OAM (NGOAM), or MPLS OAM is enabled. The NX-API issue can be triggered with a crafted HTTP request, while the NGOAM flaws involve crafted IP traffic and the MPLS OAM flaw involves a crafted MPLS echo-request packet. Nexus 7000 switches and Nexus 9000 devices in ACI mode are not affected, and Nexus 9000 systems with Silicon One ASICs are unaffected by the MPLS OAM issue.\u003c/p\u003e\n\n\u003cp\u003eCisco recommends upgrading to fixed NX-OS releases identified through its Software Checker tool and disabling unneeded NX-API, NGOAM, or MPLS OAM features. For systems that cannot yet be upgraded and rebooted, Cisco provides temporary Live Protect shields. Cisco also released hardening updates for Cisco License, including flaws with severity scores up to 10.0, and recommends upgrading affected installations to version 10-202609 because no workarounds are available.\u003c/p\u003e\n"},{"n":9,"title":"FBI disrupts Chinese hacking tools used to breach critical infrastructure","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-disrupts-chinese-hacking-tools-used-to-breach-critical-infrastructure/","time":"21:42","priority":"SHOULD READ","score":88,"tldr":"The FBI seized seven domains used by China-linked Flax Typhoon and Integrity Technology Group to operate MicroScan and FishHub, tools used to scan, phish, and steal data from critical infrastructure and other organizations worldwide.","briefOverview":"\u003cp\u003eThe FBI seized seven domains used by China-based Integrity Technology Group to operate MicroScan and FishHub, tools U.S. authorities say were used by China-linked hackers associated with Flax Typhoon. The tools supported vulnerability scanning, targeted deceptive emails, remote access, and data theft against organizations worldwide. Targets included a South Carolina power company, airports in Japan and Poland, Taiwanese energy companies, universities, and organizations in U.S. government, manufacturing, healthcare, law enforcement, education, and religious sectors.\u003c/p\u003e\n\n\u003cp\u003eMicroScan is a Python-based scanner with more than 1,300 penetration-testing scripts, and it was used alongside Mirai-infected internet devices to identify weaknesses in exposed services. The FBI confirmed that scanning of two Taiwanese universities was followed by successful breaches, while FishHub was used to deploy additional malware and steal files; investigators found data from more than 20 organizations on a linked server. The FBI, CISA, NSA, and international partners issued indicators and urged organizations to patch vulnerable systems, disable unnecessary exposed services, and enforce multifactor authentication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI seized seven domains used by China-based Integrity Technology Group to operate MicroScan and FishHub, which U.S. authorities linked to Flax Typhoon activity.","MicroScan used a Mirai-infected device network to scan targets for weaknesses, including a South Carolina power company, airports in Japan and Poland, Taiwanese energy companies, and universities.","FishHub was used to send targeted deceptive emails, deploy additional malicious software, and remove files from compromised networks; investigators found data from more than 20 organizations on a linked server.","U.S. and international agencies said the activity targeted U.S. government agencies and organizations in manufacturing, healthcare, information technology, law enforcement, education, and religious sectors across multiple regions.","Authorities urged organizations to review published warning signs, update vulnerable systems, limit unnecessary internet-facing services, and require multi-factor authentication."],"insights":["The operation was not limited to identifying weak systems: the FBI confirmed that scans of two Taiwanese universities were followed by successful compromises.","Investigators found a custom web application that enabled third parties to browse stolen emails without direct access to the compromised accounts.","MicroScan reportedly contained more than 1,300 penetration-testing scripts and commonly targeted eight known flaws, including Shellshock, Pulse Secure VPN, and GitLab issues.","This was a follow-on disruption against the same company: U.S. authorities had previously disrupted an Integrity Tech-operated Mirai botnet of more than 200,000 compromised consumer devices in September 2024."],"referencedReports":[],"body":"\u003cp\u003eThe FBI seized seven domains used by China-based Integrity Technology Group to operate MicroScan and FishHub, tools U.S. authorities say were used by China-linked hackers associated with Flax Typhoon. The tools supported vulnerability scanning, targeted deceptive emails, remote access, and data theft against organizations worldwide. Targets included a South Carolina power company, airports in Japan and Poland, Taiwanese energy companies, universities, and organizations in U.S. government, manufacturing, healthcare, law enforcement, education, and religious sectors.\u003c/p\u003e\n\n\u003cp\u003eMicroScan is a Python-based scanner with more than 1,300 penetration-testing scripts, and it was used alongside Mirai-infected internet devices to identify weaknesses in exposed services. The FBI confirmed that scanning of two Taiwanese universities was followed by successful breaches, while FishHub was used to deploy additional malware and steal files; investigators found data from more than 20 organizations on a linked server. The FBI, CISA, NSA, and international partners issued indicators and urged organizations to patch vulnerable systems, disable unnecessary exposed services, and enforce multifactor authentication.\u003c/p\u003e\n"},{"n":12,"title":"Leaked chats show Russian extortion gang sending ‘agents’ into US law firms","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/leaked-chats-show-russian-extortion-gang-sending-agents-to-law-firms","time":"14:46","priority":"SHOULD READ","score":88,"tldr":"Leaked chats linked to the Russia-based Silent Ransom Group describe a campaign to recruit U.S.-based operatives to physically infiltrate law firms and steal data for extortion. The archive also contains unverified discussions of kidnapping, blackmail, and targeting U.S. military personnel, while some extortion activity and office-infiltration tactics have been independently corroborated.","briefOverview":"\u003cp\u003eLeaked chats allegedly involving the Russia-based Silent Ransom Group, also tracked as Luna Moth and Chatty Spider, describe extortion operations against mostly U.S. law firms from August 2025 through September 2026. The messages show members tracking victims, negotiating multimillion-dollar payments, and directing U.S.-based recruits referred to as “agents.” Chainalysis said cryptocurrency addresses in the leak could be tied to known group extortions, while cautioning it could not verify all claims in the archive.\u003c/p\u003e\n\n\u003cp\u003eThe chats describe recruiting agents through Telegram advertisements and using disguises such as delivery workers, clients, and IT personnel to gain entry to offices and copy files. This physical-access approach matches an FBI warning that group members posed as IT staff to access victims’ computers; one law firm told the extortionists that someone entered its New York office and copied files to a flash drive. The archive also includes discussions of blackmail, kidnapping, and seeking military-related information, but it does not provide evidence that the most extreme proposals were carried out.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A leaked archive of chats from August 2025 through September 2026 appears to document members of the Russia-based Silent Ransom Group tracking victims, negotiating extortion payments, and directing U.S.-based recruits called “agents.”","Chainalysis said cryptocurrency addresses in the archive could be tied to known extortions by Silent Ransom Group, also known as Luna Moth and Chatty Spider, but said it could not verify all claims in the leak.","The FBI previously warned that Silent Ransom Group members posed as IT personnel to gain physical access to victims’ computers, and one law firm told the group that someone had entered its New York office and copied files to a flash drive.","The chats describe recruiting Russian-speaking U.S.-based agents through Telegram job advertisements and considering disguises such as delivery workers, IT staff, clients, and lawyers.","The archive includes discussions of targeting military-related information and using coercive tactics against executives, but it does not show that the most extreme proposed schemes were carried out."],"insights":["The group’s use of ordinary job advertisements on Telegram shows how physical access operations were reportedly supplied through a broad, disposable recruitment pipeline rather than relying only on trusted insiders.","The chats describe extortion cases being managed through sales-style stages from “chat” to “gold,” with roughly $200 million in claimed settlements across dozens of completed cases, although those figures were not independently verified.","A law firm’s reported discovery that an intruder copied files to a flash drive, together with the FBI’s warning about criminals posing as IT workers, provides corroboration for the group’s physical-entry tactic beyond the leaked planning discussions.","The reported plans included disguises such as delivery workers, clients, and IT staff, indicating that office reception and in-person access could be used to obtain data even when no remote computer break-in is described.","The archive distinguishes between documented extortion activity and unverified extreme proposals, including kidnapping and military targeting; it contains no evidence that those latter plans were carried out."],"referencedReports":[{"title":"FBI Flash Alert on Silent Ransom Group Physical Infiltration","url":"https://therecord.media/fbi-warns-hackers-visit-law-firms-to-steal-data","publisher":"fbi","context":"The article cites an FBI flash alert warning that Silent Ransom Group members posed as IT personnel to gain physical access to victims' computers.","category":"advisory","primary":false}],"body":"\u003cp\u003eLeaked chats allegedly involving the Russia-based Silent Ransom Group, also tracked as Luna Moth and Chatty Spider, describe extortion operations against mostly U.S. law firms from August 2025 through September 2026. The messages show members tracking victims, negotiating multimillion-dollar payments, and directing U.S.-based recruits referred to as “agents.” Chainalysis said cryptocurrency addresses in the leak could be tied to known group extortions, while cautioning it could not verify all claims in the archive.\u003c/p\u003e\n\n\u003cp\u003eThe chats describe recruiting agents through Telegram advertisements and using disguises such as delivery workers, clients, and IT personnel to gain entry to offices and copy files. This physical-access approach matches an FBI warning that group members posed as IT staff to access victims’ computers; one law firm told the extortionists that someone entered its New York office and copied files to a flash drive. The archive also includes discussions of blackmail, kidnapping, and seeking military-related information, but it does not provide evidence that the most extreme proposals were carried out.\u003c/p\u003e\n"},{"n":20,"title":"International coalition seizes tools used by cyber firm behind Flax Typhoon ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/flax-typhoon-china-tools-integrity-tech-international-takedown","time":"19:20","priority":"SHOULD READ","score":88,"tldr":"An international coalition led by U.S. agencies seized websites supporting Microscan and FishHub, tools used by China-linked Integrity Tech and Flax Typhoon to scan, phish, and compromise critical infrastructure worldwide.","briefOverview":"\u003cp\u003eThe U.S. Justice Department, working with international partners, seized websites supporting Microscan and FishHub, hacking tools operated by Beijing-based Integrity Tech. U.S. authorities said the company was hired by China’s Ministry of State Security and supplied China-linked threat actors with capabilities used against critical infrastructure and other organizations worldwide. The related advisory was supported by agencies in Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States.\u003c/p\u003e\n\n\u003cp\u003eMicroscan has reportedly been used since 2017 to identify specific weaknesses in websites, affecting organizations including a South Carolina power company, airports in Japan and Poland, and Taiwanese natural-gas and power entities. FishHub was designed to accelerate phishing campaigns and provide access after a network was breached; authorities said it was used against about 20 universities in Taiwan. The FBI, CISA, and NSA said these actors often target poorly monitored edge devices to maintain hidden, long-term access, while officials warned that Chinese government hackers may be positioning themselves in critical infrastructure networks for potential future disruption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Justice Department seized websites supporting Microscan and FishHub, tools created by Beijing-based Integrity Tech and used by China-linked threat actors.","Authorities said Microscan has been used since 2017 to scan websites for specific weaknesses, with targets including a South Carolina power company, Japanese and Polish airports, and Taiwanese natural-gas and power organizations.","FishHub was designed to speed up phishing operations and was used to provide remote access after a breach, including against about 20 universities in Taiwan.","The FBI, CISA, and NSA said Integrity Tech and related Chinese groups often target poorly monitored internet-facing devices to maintain long-term access to organizations.","The advisory was supported by Australia, Japan, the United Kingdom, Spain, New Zealand, and Canada, and described targeting across critical infrastructure and other sectors worldwide."],"insights":["Integrity Tech’s role extended beyond conducting intrusions: authorities said it supplied scanning, phishing, botnet, and email-theft capabilities to China-linked threat actors, allowing malicious activity to operate at greater scale.","The threat actors reportedly favored edge devices that receive limited monitoring, using them to retain hidden, long-term access to victim networks.","Investigators found that some stolen email data was accessible only from IP addresses in Xiamen, China, indicating access controls were applied to the exfiltrated material.","The seizure follows a September 2024 disruption of a separate Mirai-based Flax Typhoon botnet involving more than 260,000 consumer devices, showing that Integrity Tech’s infrastructure has been the subject of repeated U.S. actions."],"referencedReports":[{"title":"Joint Cybersecurity Advisory on Integrity Tech Tools and Flax Typhoon Activity","url":"https://www.ic3.gov/CSA/2026/261008.pdf","publisher":"FBI, CISA, and NSA","context":"The article says U.S. officials published a 58-page advisory describing Microscan, FishHub, and other tools used in the long-running Flax Typhoon campaign.","category":"advisory","primary":true},{"title":"Downrange: A Survey of China’s Cyber Ranges","url":"https://cset.georgetown.edu/wp-content/uploads/CSET-Downrange-A-Survey-of-Chinas-Cyber-Ranges-1.pdf","publisher":"Center for Security and Emerging Technology, Georgetown University","context":"The article cites this survey in describing Integrity Technology’s role in developing cyber ranges in China.","category":"research","primary":false}],"body":"\u003cp\u003eThe U.S. Justice Department, working with international partners, seized websites supporting Microscan and FishHub, hacking tools operated by Beijing-based Integrity Tech. U.S. authorities said the company was hired by China’s Ministry of State Security and supplied China-linked threat actors with capabilities used against critical infrastructure and other organizations worldwide. The related advisory was supported by agencies in Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States.\u003c/p\u003e\n\n\u003cp\u003eMicroscan has reportedly been used since 2017 to identify specific weaknesses in websites, affecting organizations including a South Carolina power company, airports in Japan and Poland, and Taiwanese natural-gas and power entities. FishHub was designed to accelerate phishing campaigns and provide access after a network was breached; authorities said it was used against about 20 universities in Taiwan. The FBI, CISA, and NSA said these actors often target poorly monitored edge devices to maintain hidden, long-term access, while officials warned that Chinese government hackers may be positioning themselves in critical infrastructure networks for potential future disruption.\u003c/p\u003e\n"},{"n":22,"title":"The phone was compromised before the user turned it on: the rise of Midnight Mimosa","source":"bitdefender.com","sourceColorIdx":7,"link":"https://www.bitdefender.com/en-us/blog/labs/midnight-mimosa-malware","time":"12:57","priority":"SHOULD READ","score":88,"tldr":"Bitdefender uncovered Midnight Mimosa, a firmware-preinstalled Android malware family on low-cost MediaTek devices that operates with system privileges before a user ever turns the phone on. It can silently install payloads, evade Play Protect, conduct ad and click fraud, and enroll phones as residential-proxy botnet nodes; related ad-fraud apps were also found on Google Play.","briefOverview":"\u003cp\u003eBitdefender identified Midnight Mimosa, a malware campaign preinstalled in the firmware of low-cost, multi-brand Android devices using MediaTek platforms. The persistent system applications appear under names including \u003ccode\u003ecom.android.system.lite\u003c/code\u003e, \u003ccode\u003ecom.android.sys.prot\u003c/code\u003e, and \u003ccode\u003ecom.android.sys.gmsprot\u003c/code\u003e, and are present before the owner turns on the phone. Because they are platform-signed and run with system-level privileges, they cannot be normally uninstalled and can silently install or remove apps, grant permissions, and load code supplied remotely.\u003c/p\u003e\n\n\u003cp\u003eThe malware uses hidden plugins and ordinary-looking cover apps, such as weather, app-lock, note, OCR, and icon tools, to generate fraudulent advertising impressions and clicks. It temporarily disables the Google Play Store before installing payloads, then re-enables it, and some samples falsely record Google Play as the installer despite lacking the Play-applied frosting signature block. Bitdefender observed the campaign on thousands of devices in more than 150 countries and found thirteen Google Play apps sharing related ad-fraud code and command servers. In addition to ad fraud, a dropped fake app-lock application can enroll devices as residential-proxy relay nodes, allowing operators to use victims\u0026rsquo; internet connections as part of a remotely controlled network.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitdefender identified Midnight Mimosa as a preinstalled Android malware campaign on low-cost, multi-brand MediaTek devices, where persistent system apps are present before a user first turns on the phone.","The malware runs with system-level privileges that let it silently install or remove apps, grant permissions, load remotely supplied code, and temporarily disable the Google Play Store before installing payloads.","Its dropped apps conduct hidden advertising and click fraud and can turn infected devices into residential-proxy relay nodes controlled through a remote server.","Bitdefender observed the campaign on thousands of unique devices in more than 150 countries over roughly two years, with Mexico, France, and Italy among the most represented countries.","The researchers also found thirteen Google Play applications that share ad-fraud code and command servers with the malware family, although those apps lack the preinstalled system component's privileges."],"insights":["The malware can make sideloaded apps appear to have come from Google Play by recording com.android.vending as the installer, but Bitdefender notes that the absence of Google Play’s server-applied “frosting” signature block exposes the forged origin.","The operation rotates package names, signing certificates, native-library names, and payload versions, so Bitdefender recommends identifying the family through stable markers such as libeasy.so, cn.kw.lib.hex, and the api.weatherlive.world server rather than package-name blocklists.","The system component temporarily disables the Play Store immediately before installing a payload and re-enables it afterward, creating a window intended to prevent Play Protect from scanning the installation.","Because the root component resides in the phone’s system partition and is platform-signed, normal app removal is ineffective; the article says durable remediation requires firmware-level cleanup or disabling the component through ADB.","The campaign uses ordinary-looking weather, app-lock, note, and OCR apps as the visible advertising hosts, while separate hidden components supply the fraudulent click logic and control the timing remotely."],"referencedReports":[{"title":"Keenadu Android Backdoor","url":"https://securelist.com/keenadu-android-backdoor/118913/","publisher":"securelist","context":"The article cites this prior technical research as having detailed a similar method of delivering Android malware.","category":"research","primary":false},{"title":"Need help identifying com.android.sys.extplv Google Play installed package on Cubot KINGKONG X","url":"https://xdaforums.com/t/need-help-identifying-com-android-sys-extplv-google-play-installed-package-on-cubot-kingkong-x.4793574/","publisher":"xda-forums","context":"The article references this public forum report in which device owners described a hidden com.android.sys.* package that returned under a new name after removal.","category":"news","primary":false}],"body":"\u003cp\u003eBitdefender identified Midnight Mimosa, a malware campaign preinstalled in the firmware of low-cost, multi-brand Android devices using MediaTek platforms. The persistent system applications appear under names including \u003ccode\u003ecom.android.system.lite\u003c/code\u003e, \u003ccode\u003ecom.android.sys.prot\u003c/code\u003e, and \u003ccode\u003ecom.android.sys.gmsprot\u003c/code\u003e, and are present before the owner turns on the phone. Because they are platform-signed and run with system-level privileges, they cannot be normally uninstalled and can silently install or remove apps, grant permissions, and load code supplied remotely.\u003c/p\u003e\n\n\u003cp\u003eThe malware uses hidden plugins and ordinary-looking cover apps, such as weather, app-lock, note, OCR, and icon tools, to generate fraudulent advertising impressions and clicks. It temporarily disables the Google Play Store before installing payloads, then re-enables it, and some samples falsely record Google Play as the installer despite lacking the Play-applied frosting signature block. Bitdefender observed the campaign on thousands of devices in more than 150 countries and found thirteen Google Play apps sharing related ad-fraud code and command servers. In addition to ad fraud, a dropped fake app-lock application can enroll devices as residential-proxy relay nodes, allowing operators to use victims\u0026rsquo; internet connections as part of a remotely controlled network.\u003c/p\u003e\n"},{"n":27,"title":"Tensorlake npm Package Compromised to Deliver Shai-Hulud Credential-Stealing Worm","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/tensorlake-npm-package-compromised-to.html","time":"05:46","priority":"SHOULD READ","score":88,"tldr":"Tensorlake’s npm SDK version 0.5.144 was compromised with the Shai-Hulud self-propagating credential-stealing worm, which can steal cloud, source-control, Kubernetes, Vault, SSH, and AI-tool secrets while establishing persistence. Users who installed the malicious release should remove it immediately, investigate affected environments, and rotate all potentially exposed credentials.","briefOverview":"\u003cp\u003eThe Tensorlake TypeScript SDK package on npm was compromised as part of the ChainDrop/Shai-Hulud supply-chain attack. Malicious version 0.5.144 contained obfuscated code that steals credentials, sends out collected data, establishes persistence, and can execute code supplied by attackers. The version is no longer available from npm, and users who installed it are advised to remove it and rotate credentials.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package uses a preinstall hook to launch an obfuscated loader and a Bun-based credential-stealing, self-propagating worm. It targets npm and GitHub tokens, AWS secrets, Vault and Kubernetes credentials, SSH keys, .env files, cryptocurrency wallets, messaging data, and files associated with Claude, Cursor, Kiro, Windsurf, and Zed. It can also republish compromised packages through a victim’s publishing identity, plant GitHub Actions workflows, and write files that cause it to run again when repositories are opened in Claude Code or Visual Studio Code.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tensorlake npm package version 0.5.144 was compromised as part of the ChainDrop/Shai-Hulud software supply-chain campaign and has been removed from the npm registry.","The malicious release uses a preinstall script and obfuscated Bun-based code to run a credential-stealing, self-propagating worm.","The malware targets npm and GitHub tokens, AWS credentials, HashiCorp Vault and Kubernetes credentials, SSH keys, .env files, cryptocurrency wallets, messaging-app data, and configuration files for several AI coding tools.","The worm can republish compromised package versions using a victim’s publishing identity and may plant GitHub Actions workflows, while also creating files that run when repositories are opened in Claude Code or Visual Studio Code.","Users who installed the malicious version are advised to remove it immediately and rotate their credentials."],"insights":["Removing the affected dependency alone may not end the risk, because the malware can establish persistence that retains attacker access after the package is removed.","The malware includes a “hostage token” mechanism that monitors whether a stolen GitHub token remains valid and, if it is revoked, can run attacker-supplied PowerShell code through Invoke-Expression.","Rather than relying on only one server for instructions, the malware resolves its command-and-control address through an Ethereum contract and can use GitHub as a fallback location for stolen data.","The malware writes settings and task files into accessible repositories so that it can run again when someone opens those projects in Claude Code or Visual Studio Code."],"referencedReports":[{"title":"Tensorlake Compromise","url":"https://socket.dev/blog/tensorlake-compromise","publisher":"socket","context":"Socket’s analysis describes the malicious Tensorlake release as an obfuscated credential-stealing worm that establishes persistence and executes remotely supplied code.","category":"research","primary":true},{"title":"Tensorlake npm Compromised: Hostage Token Worm","url":"https://www.stepsecurity.io/blog/tensorlake-npm-compromised-hostage-token-worm","publisher":"stepsecurity","context":"StepSecurity’s analysis provides details on the rogue repository commits, package publication, and files written to trigger execution in Claude Code and Visual Studio Code.","category":"research","primary":true}],"body":"\u003cp\u003eThe Tensorlake TypeScript SDK package on npm was compromised as part of the ChainDrop/Shai-Hulud supply-chain attack. Malicious version 0.5.144 contained obfuscated code that steals credentials, sends out collected data, establishes persistence, and can execute code supplied by attackers. The version is no longer available from npm, and users who installed it are advised to remove it and rotate credentials.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package uses a preinstall hook to launch an obfuscated loader and a Bun-based credential-stealing, self-propagating worm. It targets npm and GitHub tokens, AWS secrets, Vault and Kubernetes credentials, SSH keys, .env files, cryptocurrency wallets, messaging data, and files associated with Claude, Cursor, Kiro, Windsurf, and Zed. It can also republish compromised packages through a victim’s publishing identity, plant GitHub Actions workflows, and write files that cause it to run again when repositories are opened in Claude Code or Visual Studio Code.\u003c/p\u003e\n"},{"n":30,"title":"FBI Says China-Linked Hackers Ran Portal Giving Third Parties Access to Stolen Emails","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fbi-says-china-linked-hackers-ran.html","time":"18:32","priority":"SHOULD READ","score":88,"tldr":"A joint FBI-led advisory says China-linked Integrity Technology Group actors have targeted organizations worldwide since at least 2021, stealing email and operating a portal that lets third parties access the stolen content. The group uses known vulnerabilities, password spraying, phishing-style XSS pages, and tools including SoftEther and Microsoft 365/Exchange email collectors.","briefOverview":"\u003cp\u003eThe FBI and agencies from six other countries said hackers linked to China-based Integrity Technology Group have targeted government organizations, law enforcement, healthcare systems, manufacturers, IT organizations, schools, and religious institutions since at least January 2021. Targets included organizations in Southeast Asia, Africa, and North America, as well as U.S. government services and critical sectors. The advisory says the actors stole email and operated a web application that gave unidentified third parties access to stolen email content. Integrity Technology Group has been sanctioned by the United States and the United Kingdom.\u003c/p\u003e\n\n\u003cp\u003eThe actors used open-source scanners and the MicroScan tool to find vulnerable internet-facing systems, exploited known flaws, and conducted password spraying against Microsoft 365 and Exchange accounts. They also used a fake login page created through a cross-site scripting payload, SoftEther VPN software for persistent access, and DCSync to copy Active Directory credentials and related domain information. For email collection, they used a PHP-based bot called Curlc4.txt and the office-cli tool to access Exchange and Microsoft 365 mailboxes. Agencies recommend patching affected systems, requiring multifactor authentication, monitoring for unusual Active Directory replication and connected cloud applications, reviewing web logs, and checking the advisory\u0026rsquo;s indicators before blocking them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A joint FBI advisory says hackers linked to China-based Integrity Technology Group have targeted government, law-enforcement, healthcare, manufacturing, IT, education, and religious organizations since at least January 2021.","The advisory says the actors stole email from organizations and operated a web application that gave unidentified third parties access to stolen email content.","The actors used open-source scanners, the MicroScan tool, known software flaws, password spraying against Microsoft 365 and Exchange accounts, and a fake login page created through a web-page scripting flaw.","The FBI says the group used SoftEther for continued access, DCSync to copy Active Directory account data, and tools including Curlc4.txt and office-cli to collect email.","Agencies recommend applying patches, requiring multifactor authentication for webmail and remote access, reviewing logs, monitoring for unusual Active Directory replication, and checking cloud applications with access to email or files."],"insights":["The reported third-party email-access portal indicates that stolen messages were made available beyond the operators who collected them, although the advisory does not identify the users of that portal.","The actors used ordinary administrative and legitimate-access mechanisms, including SoftEther and Microsoft 365 access methods, which the agencies said could help them avoid detection.","Some access to stolen data was reportedly restricted to IP addresses in Xiamen, China.","The advisory labels five vulnerabilities as newly added to CISA's Known Exploited Vulnerabilities catalog, but those entries were not present in CISA's published catalog data when The Hacker News checked it on October 8.","The advisory's IOC dates may not represent the latest known activity, since 10 listed IP addresses had later last-seen dates in a 2024 advisory than in the new list."],"referencedReports":[{"title":"Joint Cybersecurity Advisory on Integrity Technology Group-Linked Threat Actors","url":"https://www.ic3.gov/CSA/2026/261008.pdf","publisher":"FBI and partner agencies","context":"The article is based on this joint advisory, which details the actors' targeting, intrusion methods, email theft, infrastructure, and indicators of compromise.","category":"advisory","primary":true},{"title":"Raptor Train Botnet Joint Cybersecurity Advisory","url":"https://www.ic3.gov/CSA/2024/240918.pdf","publisher":"FBI and partner agencies","context":"The article references this earlier advisory regarding the Raptor Train botnet and compares its command-and-control IP-address activity dates with those in the newer advisory.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI and agencies from six other countries said hackers linked to China-based Integrity Technology Group have targeted government organizations, law enforcement, healthcare systems, manufacturers, IT organizations, schools, and religious institutions since at least January 2021. Targets included organizations in Southeast Asia, Africa, and North America, as well as U.S. government services and critical sectors. The advisory says the actors stole email and operated a web application that gave unidentified third parties access to stolen email content. Integrity Technology Group has been sanctioned by the United States and the United Kingdom.\u003c/p\u003e\n\n\u003cp\u003eThe actors used open-source scanners and the MicroScan tool to find vulnerable internet-facing systems, exploited known flaws, and conducted password spraying against Microsoft 365 and Exchange accounts. They also used a fake login page created through a cross-site scripting payload, SoftEther VPN software for persistent access, and DCSync to copy Active Directory credentials and related domain information. For email collection, they used a PHP-based bot called Curlc4.txt and the office-cli tool to access Exchange and Microsoft 365 mailboxes. Agencies recommend patching affected systems, requiring multifactor authentication, monitoring for unusual Active Directory replication and connected cloud applications, reviewing web logs, and checking the advisory\u0026rsquo;s indicators before blocking them.\u003c/p\u003e\n"},{"n":49,"title":"Suspected TraderTraitor Group Uses Trojanized Terraform Provider to Deliver Cross-Platform Malware","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver","time":"19:49","priority":"SHOULD READ","score":88,"tldr":"Zscaler researchers found a suspected North Korean TraderTraitor campaign using a trojanized Terraform provider to silently deliver FLATROOF and ROOFDECK malware to macOS, Linux, and Windows developer systems. The malware steals browser credentials, cryptocurrency wallet data, and system information while establishing persistent remote access through resilient command-and-control channels.","briefOverview":"\u003cp\u003eZscaler ThreatLabz reported a July 2026 campaign suspected to be linked to the North Korean TraderTraitor group that used a trojanized Terraform provider masquerading as an AWS provider. The provider executes malicious code when Terraform loads it but continues functioning normally, potentially making the compromise less noticeable. It downloads a Bash loader from a HashiCorp-themed lookalike domain and uses a temporary-directory lock file to limit repeated execution.\u003c/p\u003e\n\n\u003cp\u003eThe loader selects payloads for macOS, Linux, or Windows based on the operating system and processor architecture, disguising encrypted executables as \u003ccode\u003e.woff\u003c/code\u003e font files. The resulting FLATROOF backdoor can establish persistence, receive commands through Telegram, GitHub, or an attacker-controlled HTTP service, and deploy Python scripts to steal browser data, shell history, system information, and cryptocurrency wallet-related data. A subsequent ROOFDECK backdoor can discover its control server through local configuration, a signed encrypted Pastebin entry, or Nostr profile metadata, and provides remote command execution, file operations, clipboard access, persistence controls, and other system-management capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz identified a trojanized Terraform provider named terraform-provider-awsbeta_v1.0.0 that runs malicious code when Terraform loads the provider while retaining normal provider behavior.","The provider downloads a Bash loader from a HashiCorp-themed lookalike domain, and the loader selects encrypted FLATROOF payloads for macOS, Linux, or Windows based on the operating system and processor architecture.","FLATROOF is a Rust-based backdoor that supports Telegram, GitHub, and attacker-controlled HTTP channels for command-and-control, and includes platform-specific persistence methods.","FLATROOF deploys Python stealers that collect browser credentials, cookies, browsing data, command history, system details, and, on Windows, data associated with MetaMask, Phantom, Trust Wallet, and Rabby extensions.","ROOFDECK can find its command-and-control address from a local file, a signed encrypted Pastebin entry, or Nostr profile metadata before communicating through HTTP and WebSocket endpoints."],"insights":["The trojanized provider was designed to remain functional as a Terraform provider while launching its malicious routine, which could make the compromise less noticeable to users.","The loader disguises encrypted executables as font files, appending them after decoy font content and recovering them through a marker, Base64 decoding, and AES-256-CBC decryption.","The Bash loader can use Python, Node.js, Perl, or OpenSSL to decrypt its payload, allowing it to operate across systems with different installed software.","ROOFDECK verifies an RSA signature on the encrypted server address retrieved from Pastebin, preventing others from redirecting infected systems without the operator's signing key.","ROOFDECK can fall back to Nostr profile metadata to locate its Pastebin dead drop, providing another path for discovering its current control server."],"referencedReports":[],"body":"\u003cp\u003eZscaler ThreatLabz reported a July 2026 campaign suspected to be linked to the North Korean TraderTraitor group that used a trojanized Terraform provider masquerading as an AWS provider. The provider executes malicious code when Terraform loads it but continues functioning normally, potentially making the compromise less noticeable. It downloads a Bash loader from a HashiCorp-themed lookalike domain and uses a temporary-directory lock file to limit repeated execution.\u003c/p\u003e\n\n\u003cp\u003eThe loader selects payloads for macOS, Linux, or Windows based on the operating system and processor architecture, disguising encrypted executables as \u003ccode\u003e.woff\u003c/code\u003e font files. The resulting FLATROOF backdoor can establish persistence, receive commands through Telegram, GitHub, or an attacker-controlled HTTP service, and deploy Python scripts to steal browser data, shell history, system information, and cryptocurrency wallet-related data. A subsequent ROOFDECK backdoor can discover its control server through local configuration, a signed encrypted Pastebin entry, or Nostr profile metadata, and provides remote command execution, file operations, clipboard access, persistence controls, and other system-management capabilities.\u003c/p\u003e\n"},{"n":5,"title":"Ransomware attack disrupts Japan's IDCF Cloud used by govt clients","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ransomware-attack-disrupts-japans-idcf-cloud-used-by-govt-clients/","time":"20:09","priority":"SHOULD READ","score":86,"tldr":"IDC Frontier’s IDCF Cloud suffered a ransomware attack that forced an outage in its East Japan Region 1, affecting 495 companies and local governments. The attackers claim to have encrypted 3.6 PB of data, impacted hypervisors and VM disks, and deleted more than 554,000 snapshots.","briefOverview":"\u003cp\u003eIDC Frontier said a ransomware attack against its IDCF Cloud service began at 3:40 AM local time on October 7 and caused an outage in East Japan Region 1. The company shut down and isolated affected network and systems to prevent the incident from spreading. It said 495 companies and local governments using the cloud service were affected. IDC Frontier is investigating the intrusion route, the precise cause, and the scope of the impact.\u003c/p\u003e\n\n\u003cp\u003eIDC Frontier also disabled customer access to management consoles in all regions while it verifies security. A message seen by customers claimed the attackers encrypted 225 databases containing 3.6 PB of data, reached 239 hypervisors, sealed 16,000 virtual-machine disks, and deleted 554,153 snapshots. Nissui Logistics separately reported a suspected unauthorized-access incident at a third-party data center that halted goods shipping and receiving, though it is unclear whether it is connected to IDCF Cloud. Macnica recorded 119 Japanese incidents involving personal-information theft or exposed data since the start of the year, including 83 between July 1 and October 6.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["IDC Frontier said a ransomware attack began at 3:40 AM local time on October 7 and caused an outage in IDCF Cloud’s East Japan Region 1.","IDC Frontier shut down and isolated affected systems and temporarily disabled customer management-console access across all regions while checking security.","The company said 495 companies and local governments using IDCF Cloud were affected by the incident.","A message displayed to customers claimed the attackers encrypted 225 databases containing 3.6 PB of data, reached 239 hypervisors, sealed 16,000 virtual-machine disks, and deleted 554,153 snapshots.","Nissui Logistics reported an outage at a third-party data center that halted shipping and receiving, though it is unclear whether this is connected to the IDCF Cloud incident."],"insights":["The incident’s impact extends beyond the affected East Japan cluster because IDC Frontier disabled management-console access for customers in every region while it verifies security.","The attackers’ claimed deletion of 554,153 snapshots highlights that recovery copies, not only active databases and virtual machines, were reportedly targeted.","A disruption at a cloud provider can have direct physical-business consequences: Nissui Logistics said its outage stopped goods from being shipped and received, although a connection to IDCF Cloud has not been confirmed.","Macnica recorded 119 Japanese incidents involving stolen or exposed personal information since the start of the year, including 83 between July 1 and October 6, compared with 84 for all of 2025 under the same criteria."],"referencedReports":[{"title":"Web Incidents 2026","url":"https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html","publisher":"macnica","context":"The article cites Macnica’s tracking of Japanese cybersecurity incidents involving stolen personal information or exposed data in 2026.","category":"research","primary":false}],"body":"\u003cp\u003eIDC Frontier said a ransomware attack against its IDCF Cloud service began at 3:40 AM local time on October 7 and caused an outage in East Japan Region 1. The company shut down and isolated affected network and systems to prevent the incident from spreading. It said 495 companies and local governments using the cloud service were affected. IDC Frontier is investigating the intrusion route, the precise cause, and the scope of the impact.\u003c/p\u003e\n\n\u003cp\u003eIDC Frontier also disabled customer access to management consoles in all regions while it verifies security. A message seen by customers claimed the attackers encrypted 225 databases containing 3.6 PB of data, reached 239 hypervisors, sealed 16,000 virtual-machine disks, and deleted 554,153 snapshots. Nissui Logistics separately reported a suspected unauthorized-access incident at a third-party data center that halted goods shipping and receiving, though it is unclear whether it is connected to IDCF Cloud. Macnica recorded 119 Japanese incidents involving personal-information theft or exposed data since the start of the year, including 83 between July 1 and October 6.\u003c/p\u003e\n"},{"n":25,"title":"UAC-0099 Targets Ukrainian Government Personnel With ASHVEIN RAT Hiding Commands in HTML","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/uac-0099-targets-ukrainian-government.html","time":"15:26","priority":"SHOULD READ","score":86,"tldr":"Russia-aligned UAC-0099 is targeting Ukrainian government personnel with the newly documented ASHVEIN .NET RAT, which steals browser credentials, captures screenshots, collects files, and receives encrypted commands hidden in HTML. The group continues to evolve its tooling and delivery methods, including DLL sideloading, VHD containers, and convincing Ukrainian government-themed decoys.","briefOverview":"\u003cp\u003eTrendAI attributed a previously undocumented .NET information stealer and remote-access tool called ASHVEIN to the Russia-aligned UAC-0099 group, which it tracks as Earth Sirrush. The malware has been used against Ukrainian government personnel and can steal Chrome and Firefox credentials, take screenshots, collect files, identify infected systems, and run PowerShell commands remotely. It also uses encrypted communications with its operators and can conceal instructions inside invisible HTML elements.\u003c/p\u003e\n\n\u003cp\u003eUAC-0099 delivers ASHVEIN through methods including DLL sideloading, VHD containers, and dedicated .NET droppers. One example, AnswerFromPolice, displays a document impersonating the National Police of Ukraine while installing the malware in the background. The group has targeted Ukrainian government, defense, border guard, and logistics organizations since at least mid-2022, and available evidence indicates its targeting has expanded to civilian logistics and infrastructure operators that support Ukraine.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TrendAI attributed the previously undocumented ASHVEIN .NET information stealer and remote-access tool to the Russia-aligned UAC-0099 threat actor, which it tracks as Earth Sirrush.","ASHVEIN can steal credentials from Chrome and Firefox, capture screenshots, enumerate and retrieve files, execute PowerShell commands remotely, fingerprint systems, and communicate with its operators using encryption.","UAC-0099 has used DLL sideloading, VHD containers, and dedicated .NET droppers to deliver ASHVEIN, including an executable called AnswerFromPolice that displays a decoy document impersonating the National Police of Ukraine.","UAC-0099 has targeted Ukrainian government, defense, border guard, and logistics entities since at least mid-2022, and available evidence indicates its targeting has expanded to civilian logistics and infrastructure operators.","The group has continued evolving its tooling from PowerShell- and Go-based tools toward compiled C# binaries
