and steal payment data.","An authentication flaw in an unspecified yard management system allowed attackers to forge session cookies for arbitrary users because the application used a hard-coded signing secret and predictable user identifiers."],"insights":["Several campaigns abused trusted or legitimate channels—including Microsoft Power BI domains, the Visual Studio Marketplace, Open VSX, npm, and RubyGems—to make malicious activity appear more credible or reach developers through normal software workflows.","The phishing campaign analyzed by Barracuda was designed to influence both the human recipient and any AI email assistant processing the message, pairing password-protected attachments with hidden prompt-injection instructions.","The healthcare analysis found that only 31% of exposed systems support TLS 1.3, while most medical and operational devices lack SSH implementations capable of transitioning to post-quantum cryptography, leaving long-lived patient data exposed to future decryption risks.","Threat actors were not uniformly careful: one ransomware affiliate allegedly published victims’ data independently and kept proceeds from its own group, while another attacker’s exposed server revealed post-compromise tools and potentially collected material to unrelated internet hosts."],"referencedReports":[{"title":"GlassWorm-Linked VS Code Extensions Discovered","url":"https://socket.dev/blog/glassworm-vscode-themes","publisher":"socket","context":"The article cites Socket’s analysis of suspicious Visual Studio Code themes linked to earlier GlassWorm activity.","category":"research","primary":true},{"title":"Mapping BraZetsu Infrastructure via TLS Certificates","url":"https://hunt.io/blog/brazetsu-access-broker-infrastructure","publisher":"hunt.io","context":"The article references Hunt.io’s network-indicator analysis tracing BraZetsu command-and-control infrastructure through TLS certificate data.","category":"research","primary":true},{"title":"New VulcanRAT207.A Detailed","url":"https://www.morphisec.com/blog/copy-of-how-to-stop-ransomware-before-execution/","publisher":"morphisec","context":"The article cites Morphisec’s technical analysis of a WhatsApp-lured Windows intrusion that deploys VulcanRAT207.","category":"research","primary":true},{"title":"PQC Readiness in Healthcare","url":"https://www.forescout.com/research-labs/pqc-in-healthcare-from-data-risk-to-migration-readiness/","publisher":"forescout","context":"The article draws on Forescout’s analysis of healthcare devices’ readiness to migrate to post-quantum cryptography.","category":"research","primary":true},{"title":"Gentlemen Ransomware Affiliate Double Crosses Gang","url":"https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files","publisher":"cloudsek","context":"The article cites CloudSEK’s report on the Gentlemen ransomware affiliate Azazel allegedly operating an independent leak site and retaining extortion proceeds.","category":"research","primary":true},{"title":"Phishing Campaign Abuses Microsoft Power BI to Drop RMM Tools","url":"https://www.huntress.com/blog/screenconnect-power-bi","publisher":"huntress","context":"The article references Huntress’s analysis of phishing emails abusing Microsoft Power BI domains to deliver rogue ScreenConnect installers.","category":"research","primary":true},{"title":"Flaw in Recreation Management Software Abused to Upload Web Shells","url":"https://www.huntress.com/blog/parks-recreation-platform-webshell-attack","publisher":"huntress","context":"The article cites Huntress’s technical account of file-upload abuse against recreation management software servers.","category":"research","primary":true},{"title":"Meta's Muse Agent Collects Extensive Data","url":"https://time.com/article/2026/10/06/meta-muse-ai-agent-privacy/","publisher":"time","context":"The article references TIME’s analysis of Muse internal instructions that described dossiers being updated about users and people they mention.","category":"research","primary":true},{"title":"@subql/common npm Package Compromised","url":"https://www.stepsecurity.io/blog/subql-ecosystem-compromised","publisher":"stepsecurity","context":"The article cites StepSecurity’s report that version 5.8.3 of @subql/common contained a credential-collecting payload with remote shell support.","category":"research","primary":true},{"title":"Phishing Campaign Targets Both Humans and AI Agents","url":"https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants","publisher":"barracuda","context":"The article cites Barracuda’s analysis of phishing messages combining social engineering for people with hidden prompt injections targeting AI email assistants.","category":"research","primary":true},{"title":"Open Directory Exposes Threat Actor Tradecraft","url":"https://threatmon.io/an-open-server-an-exposed-toolkit-inside-a-viva-aerobus-linked-intrusion/","publisher":"threatmon","context":"The article references ThreatMon’s analysis of an exposed attacker-controlled server containing tools associated with an intrusion linked to Viva Aerobus.","category":"research","primary":true},{"title":"Bypassing Session Cookie Authentication","url":"https://www.resecurity.com/blog/article/session-cookie-authentication-bypass-predictable-signing-secret-enableds-account-impersonations","publisher":"resecurity","context":"The article cites Resecurity’s technical analysis of predictable session cookies that could be forged to impersonate users in a yard management system.","category":"research","primary":true}],"body":"\u003cp\u003eThis week’s ThreatsDay roundup covers a mix of ransomware activity, phishing, malicious software packages, exposed attacker infrastructure, and weak application security designs. Several incidents show attackers abusing trusted platforms or simple flaws to gain access, steal information, or deploy remote-control tools. The stories also show that attackers can be careless themselves, including a ransomware affiliate that allegedly withheld proceeds from its own group and an exposed server containing post-compromise tools.\u003c/p\u003e\n\n\u003cp\u003eDeveloper ecosystems were a major target, with suspicious Visual Studio Code themes tied to GlassWorm activity, a compromised @subql/common npm package, 42 malicious RubyGems packages, and nine npm packages carrying a self-spreading Linux worm. The malicious packages targeted developer machines and automated build environments, with capabilities including credential collection, remote shells, file access, screenshots, and propagation through SSH keys and npm tokens. Separately, a phishing campaign abused Microsoft Power BI domains to lead targets to rogue ScreenConnect installers, while a WhatsApp-delivered file posing as a financial statement deployed the VulcanRAT207 remote-access trojan.\u003c/p\u003e\n\n\u003cp\u003eThe roundup also highlights risks from insecure systems and long-term technology gaps. A file-upload weakness in recreation management software was abused to upload web shells and steal payment data, while a yard management system’s hard-coded cookie-signing secret and predictable user identifiers could enable account impersonation. Forescout reported that many medical and operational healthcare devices cannot readily transition to post-quantum cryptography, and only 31% of exposed healthcare systems support TLS 1.3. Barracuda also described phishing emails that combine conventional social engineering for people with hidden instructions intended to manipulate AI email assistants.\u003c/p\u003e\n"},{"n":40,"title":"Making sure the checks get printed","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/making-sure-the-checks-get-printed/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos warns that malware authors are embedding natural-language prompt injections in code to manipulate AI-assisted malware analysis, sometimes steering verdicts in the attacker’s favor. Defenders should treat extracted sample text only as untrusted evidence and detect suspicious instructions aimed at analysis systems.","briefOverview":"\u003cp\u003eCisco Talos reports that malware authors are embedding natural-language instructions in malicious code to mislead AI-assisted analysis systems, a trend it calls “A3: AI-Analysis Evasion.” Over the past 18 months, Talos observed techniques ranging from simple comments that tell an AI to ignore a file to “template spraying” intended to deceive particular large language models. Talos found these methods steered AI verdicts in an attacker’s favor about 35 percent of the time.\u003c/p\u003e\n\n\u003cp\u003eThe approach is being used across varying levels of malware sophistication and can accompany more direct threats. Talos says the MANTLEMAZE family combines AI-focused deception with abuse of vulnerable drivers to disable endpoint detection and response software from kernel space. Because the misleading instructions must be written in plaintext, Talos recommends that defenders flag imperative language aimed at analysis systems and ensure extracted sample text is treated as evidence rather than as a directive.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter also emphasizes intentional risk management for legacy systems that cannot be updated without disrupting essential operations. Its example describes isolating outdated check-printing devices onto a separate network with no internet access, reducing both exposure and the chance that attackers would find the devices during internal mapping. The article argues that such compensating controls can help keep critical services running while reducing risk from unsupported software and hardware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reports that malware authors are embedding natural-language instructions in code to evade AI-assisted analysis, a trend it calls \"A3: AI-Analysis Evasion.\"","Talos observed techniques over the past 18 months ranging from comments telling an AI to ignore a file to template spraying intended to mislead specific large language models.","Talos found that these prompt-injection techniques steer an AI verdict in the attacker’s favor about 35 percent of the time and are used across different levels of malware sophistication.","The MANTLEMAZE family combines AI-analysis deception with abuse of vulnerable drivers to disable endpoint detection and response software from kernel space.","Talos recommends treating text extracted from a sample strictly as evidence rather than as a system directive and flagging imperative language addressed to analysis systems within binaries."],"insights":["The instructions used to mislead AI analysis must appear in plaintext, giving defenders a comparatively stable signal to search for inside suspicious files.","Even though the AI-manipulation techniques succeeded only about 35 percent of the time in Talos testing, they are cheap enough to be adopted by malware ranging from simple to sophisticated.","AI-focused deception can be paired with more direct technical harm: Talos says MANTLEMAZE also abuses vulnerable drivers to disable endpoint security software from a highly privileged part of the system.","When essential legacy systems cannot be updated without disrupting critical business functions, isolating them from the internet and other networks can substantially reduce risk even without fixing the underlying outdated software."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos reports that malware authors are embedding natural-language instructions in malicious code to mislead AI-assisted analysis systems, a trend it calls “A3: AI-Analysis Evasion.” Over the past 18 months, Talos observed techniques ranging from simple comments that tell an AI to ignore a file to “template spraying” intended to deceive particular large language models. Talos found these methods steered AI verdicts in an attacker’s favor about 35 percent of the time.\u003c/p\u003e\n\n\u003cp\u003eThe approach is being used across varying levels of malware sophistication and can accompany more direct threats. Talos says the MANTLEMAZE family combines AI-focused deception with abuse of vulnerable drivers to disable endpoint detection and response software from kernel space. Because the misleading instructions must be written in plaintext, Talos recommends that defenders flag imperative language aimed at analysis systems and ensure extracted sample text is treated as evidence rather than as a directive.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter also emphasizes intentional risk management for legacy systems that cannot be updated without disrupting essential operations. Its example describes isolating outdated check-printing devices onto a separate network with no internet access, reducing both exposure and the chance that attackers would find the devices during internal mapping. The article argues that such compensating controls can help keep critical services running while reducing risk from unsupported software and hardware.\u003c/p\u003e\n"},{"n":45,"title":"New on the Map — September 2026: 22 Protocol and Endpoint Scanners","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/new-on-the-map-september-2026-22-protocol-and-endpoint-scanners/","time":"14:56","priority":"MAY READ","score":40,"tldr":"Censys added 22 new Internet-exposure scanners, including detections for Cisco SD-WAN, fuel controllers, alarm systems, Hikvision management services, STOMP brokers, and Dovecot Pigeonhole. Organizations should use these detections to identify and restrict publicly reachable systems, particularly products with known active exploitation or patch histories.","briefOverview":"\u003cp\u003eCensys added 22 protocol and endpoint scanners in September 2026 to improve visibility into Internet-reachable services. The company says these scanners help organizations identify systems on their own or suppliers’ attack surfaces before attackers find them. Six scanners are highlighted: Cisco SD-WAN vdaemon, OPW FSC3000, C-Nord Security Center, Hikvision DNVRS-Webs, STOMP, and Dovecot Pigeonhole. The full list is available in Censys release notes.\u003c/p\u003e\n\n\u003cp\u003eCensys found 11,180 reachable Cisco SD-WAN vdaemon services, where an unauthenticated exchange can disclose an organization name, device identifier, and site ID. The article cites active exploitation of a Cisco SD-WAN authentication-bypass flaw and notes that CISA added exploited Cisco SD-WAN privilege-escalation flaws to its Known Exploited Vulnerabilities catalog. Other highlighted services can expose fuel-site control systems, alarm status and keyholder information, camera-fleet management, enterprise messaging brokers, and email-filtering infrastructure. Censys recommends that organizations use its platform queries to identify exposed services, restrict unnecessary public reachability, and verify patch status where relevant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys added 22 protocol and endpoint scanners in September 2026 to identify additional types of Internet-reachable services.","Censys reported 11,180 Internet-reachable Cisco SD-WAN vdaemon services, whose unauthenticated exchange can reveal an organization name, device identifier, and site ID.","The article highlights scanners for OPW FSC3000 fuel controllers, C-Nord Security Center alarm monitoring, Hikvision DVR/NVR management, STOMP messaging, and Dovecot Pigeonhole mail filtering.","CISA added exploited Cisco SD-WAN privilege-escalation flaws and an Apache ActiveMQ remote-code-execution flaw to its Known Exploited Vulnerabilities catalog, according to the cited sources.","Censys advises organizations to use its platform queries to identify exposed services and confirm that relevant systems are not openly reachable or are appropriately patched."],"insights":["Cisco SD-WAN exposure is especially actionable because an unauthenticated exchange can reveal an organization’s name, device identifier, and site ID before login, while Cisco SD-WAN flaws are described as actively exploited.","The newly covered exposures extend beyond conventional IT systems to equipment that can influence fuel dispensing, alarm monitoring, and camera fleets, making Internet visibility relevant to physical operations as well as business systems.","The C-Nord service may disclose live armed or disarmed status, event history, and sometimes a keyholder’s name without authentication, exposing information that could be useful for targeting a property.","STOMP exposure requires identifying the underlying broker and its patch status because the article links the protocol family to Apache ActiveMQ flaws that have been used by ransomware actors.","Censys distinguishes between typical deployment sectors and observed host data, so the listed industries should not be treated as evidence that exposed hosts belong to those sectors."],"referencedReports":[{"title":"SD-WAN Ongoing Exploitation","url":"https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/","publisher":"Cisco Talos Intelligence","context":"The article cites Cisco Talos as confirming active exploitation of an authentication-bypass flaw in Cisco SD-WAN Manager and Controller.","category":"research","primary":false},{"title":"Dovecot Security","url":"https://dovecot.org/security.html","publisher":"Dovecot","context":"The article cites Dovecot's security information for a patch addressing a crash-triggering bug in Pigeonhole mail-filter connections.","category":"advisory","primary":false},{"title":"Pigeonhole Stack Buffer Underflow Advisory","url":"https://seclists.org/fulldisclosure/2026/Aug/116","publisher":"Full Disclosure","context":"The article references this advisory as fixing a stack buffer underflow in Pigeonhole's compilation of submitted filter scripts.","category":"advisory","primary":false}],"body":"\u003cp\u003eCensys added 22 protocol and endpoint scanners in September 2026 to improve visibility into Internet-reachable services. The company says these scanners help organizations identify systems on their own or suppliers’ attack surfaces before attackers find them. Six scanners are highlighted: Cisco SD-WAN vdaemon, OPW FSC3000, C-Nord Security Center, Hikvision DNVRS-Webs, STOMP, and Dovecot Pigeonhole. The full list is available in Censys release notes.\u003c/p\u003e\n\n\u003cp\u003eCensys found 11,180 reachable Cisco SD-WAN vdaemon services, where an unauthenticated exchange can disclose an organization name, device identifier, and site ID. The article cites active exploitation of a Cisco SD-WAN authentication-bypass flaw and notes that CISA added exploited Cisco SD-WAN privilege-escalation flaws to its Known Exploited Vulnerabilities catalog. Other highlighted services can expose fuel-site control systems, alarm status and keyholder information, camera-fleet management, enterprise messaging brokers, and email-filtering infrastructure. Censys recommends that organizations use its platform queries to identify exposed services, restrict unnecessary public reachability, and verify patch status where relevant.\u003c/p\u003e\n"},{"n":37,"title":"Act Before the Incident: Process-Aware Policy in Your SWG","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/act-before-the-incident-process-aware-policy-in-your-swg","time":"07:01","priority":"MAY READ","score":35,"tldr":"Netskope says its Client now sends process and parent-process details to its Next-Gen Secure Web Gateway, enabling real-time policies and logging to identify and block suspicious application traffic before it can access the internet.","briefOverview":"\u003cp\u003eNetskope says its Client now provides process names and parent process names to the Netskope One Next-Gen Secure Web Gateway (NG-SWG). This information is available for real-time policy controls and transaction logging. The company positions the capability as a way to stop suspicious scripts and applications before they make internet requests, rather than relying only on endpoint tools that act after a process is already running.\u003c/p\u003e\n\n\u003cp\u003eThe added context can be used in Real-Time Protection and SSL do-not-decrypt policies, including rules that trigger when processes such as \u003ccode\u003ecurl.exe\u003c/code\u003e or parent processes such as \u003ccode\u003epowershell.exe\u003c/code\u003e are detected. Netskope says process data can also help investigate suspicious activity, including transfers of source code to personal cloud storage and unusual traffic that normally bypasses inspection for employee privacy. The article also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as additional NG-SWG policy capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Client now sends process names and parent process names to the Netskope One Next-Generation Secure Web Gateway for real-time policy controls and logging.","The added process context can allow policies to act before a subsequent process runs, rather than relying solely on endpoint tools that terminate a risky process after it is already running.","Real-Time Protection and SSL do-not-decrypt policies can be configured to trigger when a specific process, such as curl.exe, or parent process, such as powershell.exe, is detected.","Process and parent process names are available in Netskope Transaction Events to help identify which application on a device generated a request.","Netskope also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as other Next-Generation Secure Web Gateway policy capabilities."],"insights":["Web requests related to personal finances or health may be bypassed to protect employee privacy, but the article notes that this can create a covert channel that AI could exploit; process context can help identify unusual programs generating that traffic.","Process and parent-process records can support investigations into apparent data theft by helping determine whether a user may have been targeted by unknown prompts, scripts, or processes that moved data to compromised personal cloud storage.","Real-time user coaching can collect a user’s justification and permit a transaction instead of simply blocking it, creating feedback that can be used to refine security policies.","Application instance awareness can distinguish company and personal versions of cloud applications, allowing organizations to review transfers of company data to personal storage accounts, including when an employee leaves."],"referencedReports":[],"body":"\u003cp\u003eNetskope says its Client now provides process names and parent process names to the Netskope One Next-Gen Secure Web Gateway (NG-SWG). This information is available for real-time policy controls and transaction logging. The company positions the capability as a way to stop suspicious scripts and applications before they make internet requests, rather than relying only on endpoint tools that act after a process is already running.\u003c/p\u003e\n\n\u003cp\u003eThe added context can be used in Real-Time Protection and SSL do-not-decrypt policies, including rules that trigger when processes such as \u003ccode\u003ecurl.exe\u003c/code\u003e or parent processes such as \u003ccode\u003epowershell.exe\u003c/code\u003e are detected. Netskope says process data can also help investigate suspicious activity, including transfers of source code to personal cloud storage and unusual traffic that normally bypasses inspection for employee privacy. The article also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as additional NG-SWG policy capabilities.\u003c/p\u003e\n"},{"n":38,"title":"BuySell Technologies Moves from Perimeter-Based Security to Zero Trust with Netskope SASE/SSE to Support Rapid Business Growth","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/resources/case-studies/buysell","time":"04:03","priority":"MAY READ","score":35,"tldr":"BuySell Technologies adopted Netskope SASE/SSE and a zero-trust security model to replace perimeter-based controls and support its rapid business growth.","briefOverview":"\u003cp\u003eBuySell Technologies announced a move from perimeter-based security to a zero-trust approach. The company is using Netskope SASE and SSE as part of this transition. The announcement presents the change as support for BuySell Technologies’ rapid business growth.\u003c/p\u003e\n\n\u003cp\u003eThe article centers on BuySell Technologies and Netskope. Its key technical theme is replacing a perimeter-focused security model with zero trust, which emphasizes more careful access decisions rather than relying only on a network boundary. Netskope’s SASE and SSE offerings are the named services involved in the company’s security change.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BuySell Technologies moved from perimeter-based security to a zero-trust approach.","The company selected Netskope SASE and SSE services as part of this security transition.","The change is intended to support BuySell Technologies’ rapid business growth."],"insights":["The transition is framed as a business-growth initiative as well as a security change, linking BuySell Technologies’ rapid expansion to its move away from perimeter-based security.","BuySell Technologies’ zero-trust transition specifically involves both Netskope SASE and SSE offerings, rather than a single named product alone."],"referencedReports":[],"body":"\u003cp\u003eBuySell Technologies announced a move from perimeter-based security to a zero-trust approach. The company is using Netskope SASE and SSE as part of this transition. The announcement presents the change as support for BuySell Technologies’ rapid business growth.\u003c/p\u003e\n\n\u003cp\u003eThe article centers on BuySell Technologies and Netskope. Its key technical theme is replacing a perimeter-focused security model with zero trust, which emphasizes more careful access decisions rather than relying only on a network boundary. Netskope’s SASE and SSE offerings are the named services involved in the company’s security change.\u003c/p\u003e\n"},{"n":4,"title":"OAuth grants pile up faster than you can review them. Here's how to keep up.","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/oauth-grants-pile-up-faster-than-you-can-review-them-heres-how-to-keep-up/","time":"14:00","priority":"MAY READ","score":25,"tldr":"Sponsored by Nudge Security, the article argues that organizations need dedicated OAuth grant discovery, risk assessment, and lifecycle governance because grants can remain active outside traditional SSO controls. It promotes Nudge Security’s AI-driven OAuth Grant Risk Analyst to prioritize, review, and help revoke risky app connections at scale.","briefOverview":"\u003cp\u003eThe sponsored article argues that employee-approved OAuth grants create persistent connections between third-party applications and corporate data, often outside normal single sign-on and multi-factor authentication controls. It says these grants can remain valid while dormant and may not appear in activity logs, making them difficult for IT and security teams to inventory and review. The article cites the Vercel breach as involving a compromised OAuth token from Context.ai that had been connected to an employee’s enterprise Google Workspace account.\u003c/p\u003e\n\n\u003cp\u003eNudge Security says its platform discovers OAuth grants, app-to-app integrations, API keys, service accounts, and remote MCP server connections across an organization’s SaaS environment. Its OAuth Grant Risk Analyst evaluates the grantor, vendor security posture, permissions, and accessible data, then recommends that a grant be permitted, justified, or revoked. The article says security teams retain approval over actions, while Nudge can send justification requests, alert on new OAuth activity, and revoke risky or unused grants, including during employee offboarding.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OAuth grants create continuing connections between apps and corporate data, and the article says they can remain valid even after an employee’s credentials are disabled in some circumstances.","The article states that a 1,000-person company could have roughly 88,000 OAuth grants, including about 31,000 with permissions to access data, based on Nudge Security figures.","The article cites the recent Vercel breach as involving a compromised OAuth token from Context.ai, an AI tool connected to an employee’s enterprise Google Workspace account.","Nudge Security says its platform discovers OAuth grants, API keys, service accounts, and remote MCP server connections across an organization’s SaaS environment.","The sponsored article says Nudge Security’s OAuth Grant Risk Analyst evaluates grants and recommends that organizations permit, justify, or revoke them, while leaving final action approval to the security team."],"insights":["OAuth access does not automatically inherit the protections of single sign-on or multi-factor authentication, so organizations need a separate process to review and manage these app permissions.","Dormant app permissions can remain valid without generating activity logs, meaning a review process based only on observed use can miss potentially active access paths.","Even “Sign in with Google” connections may create identity-only grants that should be included in an organization’s inventory alongside more visibly active integrations.","The article argues that manual review does not scale because a single thorough grant review can take about 45 minutes, while its promoted analysis agent is claimed to produce a recommendation in 15 seconds.","Assessing a grant requires considering the employee who approved it, the app provider, the permissions requested, and the data the app can reach, rather than relying only on a general risk score."],"referencedReports":[],"body":"\u003cp\u003eThe sponsored article argues that employee-approved OAuth grants create persistent connections between third-party applications and corporate data, often outside normal single sign-on and multi-factor authentication controls. It says these grants can remain valid while dormant and may not appear in activity logs, making them difficult for IT and security teams to inventory and review. The article cites the Vercel breach as involving a compromised OAuth token from Context.ai that had been connected to an employee’s enterprise Google Workspace account.\u003c/p\u003e\n\n\u003cp\u003eNudge Security says its platform discovers OAuth grants, app-to-app integrations, API keys, service accounts, and remote MCP server connections across an organization’s SaaS environment. Its OAuth Grant Risk Analyst evaluates the grantor, vendor security posture, permissions, and accessible data, then recommends that a grant be permitted, justified, or revoked. The article says security teams retain approval over actions, while Nudge can send justification requests, alert on new OAuth activity, and revoke risky or unused grants, including during employee offboarding.\u003c/p\u003e\n"}]</script>
