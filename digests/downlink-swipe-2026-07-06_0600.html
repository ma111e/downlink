<script type="application/json" id="dl-articles">[{"n":1,"title":"SkillCloak Lets Malicious AI Agent Skills Evade Static Scanners with Self-Extracting Packing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-skillcloak-technique-lets-malicious.html","time":"06:33","priority":"SHOULD READ","score":84,"tldr":"Researchers found that malicious AI agent “skills” can evade static scanners at high rates using simple obfuscation and self-extracting payloads, while still running normally on tools like Claude Code and OpenAI Codex. The key takeaway is that teams should not trust scan badges alone and need runtime behavior monitoring, least-privilege access, and stricter vetting for agent extensions.","briefOverview":"\u003cp\u003eResearchers at the Hong Kong University of Science and Technology found that scanners meant to detect malicious AI agent skills can be bypassed by disguised skills that still work as intended. Their paper, “Cloak and Detonate,” tested these techniques against eight scanners and 1,613 malicious skills from ClawHub. The strongest method, self-extracting packing, bypassed every scanner tested more than 90% of the time, and most of them more than 99% of the time.\u003c/p\u003e\n\n\u003cp\u003eThe researchers’ tool, SKILLCLOAK, disguises malicious skills in two ways: by rewriting scanner-triggering bytes or by hiding the payload in skipped directories such as \u003ccode\u003e.git/\u003c/code\u003e and rebuilding it only when the agent runs it. The article says this matters because skills run with the agent’s access to files, terminals, and saved passwords, and a malicious one can steal credentials, copy source code, or install a backdoor. The cloaked skills reportedly worked just as well as the originals on Claude Code and OpenAI Codex.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also built SKILLDETONATE, a runtime checker that runs skills in a sandbox and watches what they read, write, and send. In controlled testing, it caught 97% of attacks with a 2% false-positive rate, and on real-world malicious skills it caught 87%. The article notes that public marketplaces already contain malicious skills and says static scanning should be treated as a starting point, while the more durable defense is watching what a skill does when it runs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at the Hong Kong University of Science and Technology found that scanners for malicious AI agent skills can be evaded by simple changes that leave the malicious skill functioning.","The SKILLCLOAK tool rewrites malicious skills either by altering scanner-triggering bytes or by using self-extracting packing that hides the payload in skipped directories such as .git/.","Across eight scanners and 1,613 malicious skills from ClawHub, the self-extracting packing method bypassed each scanner more than 90% of the time and bypassed most of them more than 99% of the time.","The researchers proposed SKILLDETONATE, a sandbox-based runtime checker that watches file access, writes, and data transfers, and caught 97% of attacks in controlled tests with a 2% false-positive rate.","The article says public marketplaces already contain malicious skills, including Bitdefender’s finding that roughly 17% of skills checked on one marketplace carried hidden malicious code and Koi Security’s count of 341 malicious skills in the ClawHavoc campaign."],"insights":["The same design choice that makes skills portable across agents also increases risk, because a single malicious bundle can run across different AI coding agents with the agent’s access to files, terminals, and saved passwords.","Scanner performance can collapse after cloaking: Cisco’s scanner reportedly caught 99% of real-world malicious skills before cloaking but only about 10% after cloaking.","Directories and limits that scanners ignore for practical reasons, such as skipped .git/ folders or size caps, become useful hiding places for malicious payloads.","A one-time marketplace approval is insufficient because several examples in the article involve code or instructions that change, unpack, or get fetched only when the skill or tool runs.","Runtime checking is more expensive than static scanning, taking a couple of minutes per skill instead of a few seconds, but the article frames it as a pre-deployment cost rather than a constant runtime burden."],"referencedReports":[{"title":"Cloak and Detonate","url":"https://arxiv.org/abs/2607.02357","publisher":"Hong Kong University of Science and Technology","context":"The article is primarily based on this new study, which evaluates how malicious AI agent skills can evade static scanners and proposes the SKILLDETONATE runtime checker.","category":"","primary":false},{"title":"Helpful Skills or Hidden Payloads? Bitdefender Labs Dives Deep Into the OpenClaw Malicious Skill Trap","url":"https://www.bitdefender.com/en-us/blog/labs/helpful-skills-or-hidden-payloads-bitdefender-labs-dives-deep-into-the-openclaw-malicious-skill-trap","publisher":"Bitdefender Labs","context":"The article cites Bitdefender’s finding that roughly 17% of skills it checked on one marketplace carried hidden malicious code.","category":"","primary":false},{"title":"ClawHavoc: 341 Malicious ClawedBot Skills Found by the Bot They Were Targeting","url":"https://www.koi.ai/blog/clawhavoc-341-malicious-clawedbot-skills-found-by-the-bot-they-were-targeting","publisher":"Koi Security","context":"The article references Koi Security’s count of 341 malicious skills in a campaign it called ClawHavoc.","category":"","primary":false},{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"Unit 42","context":"The article cites Unit 42’s analysis of five evasive skills that were still live on ClawHub despite built-in scanning.","category":"","primary":false},{"title":"Clone This Repo and I Own Your Machine","url":"https://0din.ai/blog/clone-this-repo-and-i-own-your-machine","publisher":"Mozilla 0DIN","context":"The article references Mozilla 0DIN’s tracing of a case where a clean-looking GitHub repository led Claude Code to open a reverse shell after fetching malicious code at runtime from a DNS record.","category":"","primary":false},{"title":"Securing AI agents: AI tools move from reading to acting","url":"https://www.microsoft.com/en-us/security/blog/2026/06/30/securing-ai-agents-ai-tools-move-from-reading-acting/","publisher":"Microsoft","context":"The article cites Microsoft’s warning that a poisoned Model Context Protocol tool description could push a finance agent into leaking unpaid invoices.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at the Hong Kong University of Science and Technology found that scanners meant to detect malicious AI agent skills can be bypassed by disguised skills that still work as intended. Their paper, “Cloak and Detonate,” tested these techniques against eight scanners and 1,613 malicious skills from ClawHub. The strongest method, self-extracting packing, bypassed every scanner tested more than 90% of the time, and most of them more than 99% of the time.\u003c/p\u003e\n\n\u003cp\u003eThe researchers’ tool, SKILLCLOAK, disguises malicious skills in two ways: by rewriting scanner-triggering bytes or by hiding the payload in skipped directories such as \u003ccode\u003e.git/\u003c/code\u003e and rebuilding it only when the agent runs it. The article says this matters because skills run with the agent’s access to files, terminals, and saved passwords, and a malicious one can steal credentials, copy source code, or install a backdoor. The cloaked skills reportedly worked just as well as the originals on Claude Code and OpenAI Codex.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also built SKILLDETONATE, a runtime checker that runs skills in a sandbox and watches what they read, write, and send. In controlled testing, it caught 97% of attacks with a 2% false-positive rate, and on real-world malicious skills it caught 87%. The article notes that public marketplaces already contain malicious skills and says static scanning should be treated as a starting point, while the more durable defense is watching what a skill does when it runs.\u003c/p\u003e\n"},{"n":5,"title":"When checking the URL isn’t enough: a Device Code Phishing attack via a Microsoft website","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/microsoft-device-code-phishing-attack/120350/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"Attackers are abusing Microsoft’s legitimate Device Code Flow to trick users into entering one-time codes on official Microsoft pages, allowing them to obtain access and refresh tokens even when MFA is completed. Organizations should disable Device Code Flow where unnecessary and monitor DeviceCodeSignIn events for anomalous activity.","briefOverview":"\u003cp\u003eThe article describes a Device Code Phishing campaign that abused Microsoft’s legitimate Device Authorization Grant flow. Instead of asking victims to enter credentials on a fake domain, attackers guided them to enter a one-time code on Microsoft’s real authentication page. This undermines the common advice to only check whether a login page is on the correct domain. The campaign observed by Kaspersky ran from early April to mid-May 2026 and used phishing emails styled as law firm notices with password-protected PDF attachments.\u003c/p\u003e\n\n\u003cp\u003eThe attack flow led victims from a PDF link through redirects and CAPTCHA pages to a phishing page that displayed a one-time code fetched by the attacker’s server-side application. Clicking the code copied it to the clipboard and redirected the victim to Microsoft’s official device login page, where the victim entered the code and completed MFA. After successful authentication, the attacker obtained access_token, refresh_token, and id_token values, enabling access to the victim’s mailbox, OneDrive files, and Teams conversations. The article also describes a later Portuguese-language variant targeting users in Brazil that used Cacoo.com as a trusted open redirect before sending victims to the same type of code-entry flow.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that users avoid entering authorization codes from unexpected emails or messages, even when the link points to an official Microsoft domain. It also advises checking redirect parameters such as redirect_uri, return_url, or next and confirming the final loaded URL before entering corporate credentials. For enterprises, it recommends evaluating whether Device Code Flow is needed, disabling it globally through Conditional Access policies if not required, monitoring DeviceCodeSignIn events, enforcing device compliance states, and alerting on unusual sign-in behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes a Device Code Phishing campaign in which attackers instructed victims to enter a one-time code on Microsoft’s legitimate device login page as part of the OAuth 2.0 Device Authorization Grant flow.","In the observed campaign from early April to mid-May 2026, victims received phishing emails styled as law firm notices with password-protected PDF attachments that led them through redirects and CAPTCHA pages to a phishing page displaying a one-time code.","After victims entered the code and completed MFA on Microsoft’s official page, the attackers obtained access_token, refresh_token, and id_token values that enabled access to email, OneDrive files, and Teams conversations.","A later variant targeting users in Brazil used an email in Portuguese and a link through the legitimate Cacoo.com domain as an open redirect to the phishing infrastructure.","The article recommends that users avoid entering unexpected authorization codes and that enterprises consider disabling Device Code Flow if unnecessary, monitor DeviceCodeSignIn events, enforce device compliance, and alert on unusual sign-in behavior."],"insights":["Checking for a legitimate Microsoft domain is insufficient in this scenario because the victim completes the decisive step on Microsoft’s real authentication page rather than on a fake login form.","MFA does not prevent this attack when the user is tricked into approving the Device Authorization Grant flow, because successful authentication causes tokens to be issued to the attacker-controlled application.","The refresh_token is especially important because it lets the attacker renew access after the initial access token expires, allowing continued access without further user interaction.","Open redirects on trusted services such as Microsoft-linked URLs and Cacoo.com were used to make phishing links appear safer while still routing victims to attacker-controlled infrastructure.","Monitoring specifically for DeviceCodeSignIn events is a targeted detection opportunity because the attack relies on the Device Code Flow rather than ordinary password theft."],"referencedReports":[],"body":"\u003cp\u003eThe article describes a Device Code Phishing campaign that abused Microsoft’s legitimate Device Authorization Grant flow. Instead of asking victims to enter credentials on a fake domain, attackers guided them to enter a one-time code on Microsoft’s real authentication page. This undermines the common advice to only check whether a login page is on the correct domain. The campaign observed by Kaspersky ran from early April to mid-May 2026 and used phishing emails styled as law firm notices with password-protected PDF attachments.\u003c/p\u003e\n\n\u003cp\u003eThe attack flow led victims from a PDF link through redirects and CAPTCHA pages to a phishing page that displayed a one-time code fetched by the attacker’s server-side application. Clicking the code copied it to the clipboard and redirected the victim to Microsoft’s official device login page, where the victim entered the code and completed MFA. After successful authentication, the attacker obtained access_token, refresh_token, and id_token values, enabling access to the victim’s mailbox, OneDrive files, and Teams conversations. The article also describes a later Portuguese-language variant targeting users in Brazil that used Cacoo.com as a trusted open redirect before sending victims to the same type of code-entry flow.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that users avoid entering authorization codes from unexpected emails or messages, even when the link points to an official Microsoft domain. It also advises checking redirect parameters such as redirect_uri, return_url, or next and confirming the final loaded URL before entering corporate credentials. For enterprises, it recommends evaluating whether Device Code Flow is needed, disabling it globally through Conditional Access policies if not required, monitoring DeviceCodeSignIn events, enforcing device compliance states, and alerting on unusual sign-in behavior.\u003c/p\u003e\n"},{"n":3,"title":"Opera GX Flaw Let Malicious Sites Auto-Install Mods to Steal Data From Visited Pages","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/opera-gx-flaw-let-malicious-sites-auto.html","time":"07:27","priority":"SHOULD READ","score":82,"tldr":"Opera patched a critical Opera GX flaw that let malicious websites silently install GX Mods and use CSS to steal data, such as a signed-in user’s Gmail address, from pages the victim visited. Users should ensure they are on Opera GX version 130.0.5847.89 or later.","briefOverview":"\u003cp\u003eResearchers found a flaw in Opera GX, the gaming-focused version of the Opera browser, that let a malicious website silently install a browser mod and use it to steal specific data from pages a victim visited. In a proof of concept, they reconstructed a signed-in user\u0026rsquo;s full Gmail address from a single visit without requiring any click. Opera patched the flaw in Opera GX version 130.0.5847.89 and said it found no evidence that it had been used in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue came from Opera GX\u0026rsquo;s mod installation behavior, where GX Mods could be downloaded and enabled automatically without an approval prompt. Although GX Mods cannot run JavaScript and have no permissions, their CSS could apply to every page the browser opened, creating what the researchers called a universal CSS injection. The researchers used CSS attribute selectors to trigger requests to an attacker-controlled server when parts of a hidden value matched, allowing the Gmail address to be rebuilt from overlapping three-letter chunks.\u003c/p\u003e\n\n\u003cp\u003eOpera\u0026rsquo;s bug bounty team ultimately rated the issue P1, its highest severity, and paid the maximum $5,000 award for a critical bug. The article notes that Opera had been warned about the auto-install behavior in 2023, when a researcher used it as part of an address-bar spoofing attack that Opera patched without removing the underlying auto-install path. The researchers also documented a separate crash issue involving loading a .crx file in private mode, which affected regular Opera as well as Opera GX.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found a flaw in Opera GX that allowed a malicious website to silently install a GX Mod and use it to extract specific data from pages a victim visited.","In a proof of concept, the researchers reconstructed a signed-in user's full Gmail address from a single visit without requiring any click from the victim.","Opera patched the flaw in Opera GX version 130.0.5847.89 and said it found no evidence that the issue was exploited in the wild.","The attack worked because GX Mods could be downloaded and enabled automatically without an approval prompt, and their CSS could apply to every page the browser opened.","Opera's bug bounty team ultimately rated the issue P1, its top severity, and paid the maximum $5,000 award for a critical bug."],"insights":["The attack showed that CSS-only data theft became more dangerous in Opera GX because the injected styling was not limited to one page and could follow the victim across every site the browser opened.","The removal notice was not an effective safeguard in the researchers' demonstration because the redirect and data leak could occur within seconds, before a user could realistically read the notice and click Remove.","The underlying auto-install behavior had been identified in 2023, but Opera initially patched only the specific address-bar spoofing attack rather than removing the auto-install path that enabled this later issue.","The researchers demonstrated the severity to Opera's bug bounty triage team by reconstructing an analyst's own Gmail address during reproduction, after the issue was initially rated only P3.","A separate issue documented by the researchers showed that loading a .crx in private mode could crash the browser and dump every open tab, affecting regular Opera as well as Opera GX."],"referencedReports":[{"title":"One Trigram at a Time: XS-Leak via Universal CSS Injection and DoS in Opera (GX)","url":"https://zhero-web-sec.github.io/research-and-things/one-trigram-at-a-time-xsleak-via-universal-css-injection-and-dos-in-opera-%28gx%29","publisher":"Zhero Web Security","context":"The article cites the researchers' technical write-up describing the XS-Leak technique used to reconstruct a Gmail address through Opera GX Mods.","category":"","primary":false},{"title":"Security fix: GX Mods vulnerability","url":"https://blogs.opera.com/security/2026/07/security-fix-gx-mods-vulnerability/","publisher":"Opera","context":"The article references Opera's advisory for the vendor's account of the flaw, its fix, and its statement that it found no evidence of exploitation in the wild.","category":"","primary":false},{"title":"You Are Not Where You Think You Are: Opera Browser's Address Bar Spoofing Vulnerabilities","url":"https://medium.com/@renwa/you-are-not-where-you-think-you-are-opera-browsers-address-bar-spoofing-vulnerabilities-aa36ad8321d8","publisher":"Renwa","context":"The article cites Renwa's 2023 research as prior work that identified Opera's mod auto-install behavior and used it in an address-bar spoofing attack.","category":"","primary":false},{"title":"Blind CSS Exfiltration","url":"https://portswigger.net/research/blind-css-exfiltration","publisher":"PortSwigger","context":"The article references PortSwigger's research as a related example of CSS-only data theft that is normally confined to the page where the styling is injected.","category":"","primary":false}],"body":"\u003cp\u003eResearchers found a flaw in Opera GX, the gaming-focused version of the Opera browser, that let a malicious website silently install a browser mod and use it to steal specific data from pages a victim visited. In a proof of concept, they reconstructed a signed-in user\u0026rsquo;s full Gmail address from a single visit without requiring any click. Opera patched the flaw in Opera GX version 130.0.5847.89 and said it found no evidence that it had been used in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue came from Opera GX\u0026rsquo;s mod installation behavior, where GX Mods could be downloaded and enabled automatically without an approval prompt. Although GX Mods cannot run JavaScript and have no permissions, their CSS could apply to every page the browser opened, creating what the researchers called a universal CSS injection. The researchers used CSS attribute selectors to trigger requests to an attacker-controlled server when parts of a hidden value matched, allowing the Gmail address to be rebuilt from overlapping three-letter chunks.\u003c/p\u003e\n\n\u003cp\u003eOpera\u0026rsquo;s bug bounty team ultimately rated the issue P1, its highest severity, and paid the maximum $5,000 award for a critical bug. The article notes that Opera had been warned about the auto-install behavior in 2023, when a researcher used it as part of an address-bar spoofing attack that Opera patched without removing the underlying auto-install path. The researchers also documented a separate crash issue involving loading a .crx file in private mode, which affected regular Opera as well as Opera GX.\u003c/p\u003e\n"},{"n":4,"title":"New Java-Based QuimaRAT MaaS Built to Run on Windows, Linux, and macOS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-java-based-quimarat-maas-built-to.html","time":"08:13","priority":"SHOULD READ","score":82,"tldr":"Researchers warn that QuimaRAT is a new Java-based malware-as-a-service platform targeting Windows, Linux, and macOS with modular plugins, persistence, credential theft, surveillance, and resilient C2 features. Its builder, loader, and dropper tools are designed to help operators package payloads and evade detection across multiple delivery scenarios.","briefOverview":"\u003cp\u003eCybersecurity researchers have flagged QuimaRAT, a new Java-based remote access trojan capable of targeting Windows, Linux, and macOS environments. LevelBlue says the malware is advertised under a malware-as-a-service model, with prices ranging from \u003cspan class=\"math inline\"\u003e\\(150 for one month to \\)\u003c/span\u003e1,200 for lifetime access. The Quima suite includes Quima Control, Quima Builder, Quima Loader, and Quima Dropper, covering remote administration, payload building, browser-based delivery, and HTML/SVG payload generation.\u003c/p\u003e\n\n\u003cp\u003eQuimaRAT is described as a modular Java project built using Apache Maven and containing embedded Java Native Access native libraries for multiple operating systems and architectures. It supports encrypted plugins that can be delivered, loaded, unloaded, and updated from its command-and-control infrastructure. The malware also includes environment validation, sandbox and virtual environment evasion, single-instance execution using a lock file, and operating system-specific persistence methods.\u003c/p\u003e\n\n\u003cp\u003eThe malware can communicate with its command-and-control server over TCP, WebSocket, TLS, or HTTPS, and includes a watchdog component to reconnect if contact is lost. Its capabilities include remote command execution, remote payload and plugin delivery, credential theft, file transfer, clipboard manipulation, webcam surveillance, and fileless shellcode execution on Windows hosts. LevelBlue said QuimaRAT should be viewed as a modular Java RAT platform rather than a single static implant, citing obfuscation and build characteristics that support rotating static fingerprints without changing core behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers have identified QuimaRAT, a Java-based remote access trojan advertised as malware-as-a-service and capable of targeting Windows, Linux, and macOS environments.","QuimaRAT is built with a modular architecture that supports encrypted plugins delivered, loaded, unloaded, and updated from its command-and-control infrastructure.","The Quima suite includes Quima Control, Quima Builder, Quima Loader, and Quima Dropper, with tools for generating payload formats and staging browser-based delivery flows.","QuimaRAT uses operating system-specific persistence methods, including Windows Registry Run keys and scheduled tasks, Linux .desktop autostart entries and crontab reboot tasks, and macOS LaunchAgent plist files.","The malware supports capabilities such as remote command execution, plugin delivery, credential theft, file transfer, clipboard manipulation, webcam surveillance, and fileless shellcode execution on Windows hosts."],"insights":["QuimaRAT’s operator can rotate or replace command-and-control infrastructure through an optional Pastebin-based update mechanism without rebuilding or redistributing the malware payload.","The Quima Loader delivery flow is designed to place the main payload in the browser cache first, then have a small loader read and execute it, which the malware developer claims can bypass Windows SmartScreen protections.","The malware includes a single-instance lock file mechanism in the operating system temporary directory, causing it to terminate if another QuimaRAT instance is already running.","QuimaRAT’s macOS capabilities are more constrained than Windows and Linux because the seller notes that features such as screen capture and input control require user-granted admin permissions.","LevelBlue assessed QuimaRAT as a modular platform rather than a static implant because its obfuscation and build characteristics support rotating static fingerprints while retaining core behavior."],"referencedReports":[{"title":"Novel Java-Based QuimaRAT Targets Windows, macOS, and Linux","url":"https://www.levelblue.com/blogs/spiderlabs-blog/novel-java-based-quimarat-targets-windows-macos-and-linux","publisher":"LevelBlue","context":"The article cites LevelBlue's technical analysis as the source for details on QuimaRAT's modular architecture, cross-platform design, persistence, command-and-control, and capabilities.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have flagged QuimaRAT, a new Java-based remote access trojan capable of targeting Windows, Linux, and macOS environments. LevelBlue says the malware is advertised under a malware-as-a-service model, with prices ranging from \u003cspan class=\"math inline\"\u003e\\(150 for one month to \\)\u003c/span\u003e1,200 for lifetime access. The Quima suite includes Quima Control, Quima Builder, Quima Loader, and Quima Dropper, covering remote administration, payload building, browser-based delivery, and HTML/SVG payload generation.\u003c/p\u003e\n\n\u003cp\u003eQuimaRAT is described as a modular Java project built using Apache Maven and containing embedded Java Native Access native libraries for multiple operating systems and architectures. It supports encrypted plugins that can be delivered, loaded, unloaded, and updated from its command-and-control infrastructure. The malware also includes environment validation, sandbox and virtual environment evasion, single-instance execution using a lock file, and operating system-specific persistence methods.\u003c/p\u003e\n\n\u003cp\u003eThe malware can communicate with its command-and-control server over TCP, WebSocket, TLS, or HTTPS, and includes a watchdog component to reconnect if contact is lost. Its capabilities include remote command execution, remote payload and plugin delivery, credential theft, file transfer, clipboard manipulation, webcam surveillance, and fileless shellcode execution on Windows hosts. LevelBlue said QuimaRAT should be viewed as a modular Java RAT platform rather than a single static implant, citing obfuscation and build characteristics that support rotating static fingerprints without changing core behavior.\u003c/p\u003e\n"},{"n":2,"title":"New TrojPix Attack Leaks Data From Air-Gapped Systems via Video Cable Emissions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-trojpix-attack-leaks-data-from-air.html","time":"08:50","priority":"MAY READ","score":72,"tldr":"Researchers demonstrated TrojPix, a covert channel that lets malware on an air-gapped computer leak data by subtly modulating screen pixels so video cables emit decodable radio signals. It is lab research, but its reported speed of up to 8.1 Mbps shows that once malware is present, air-gapped systems could potentially exfiltrate whole files quickly unless protected with physical shielding, fiber links, and strong malware prevention.","briefOverview":"\u003cp\u003eResearchers at Shandong University have demonstrated TrojPix, a technique for leaking data from computers that are cut off from every network. TrojPix works by subtly modifying on-screen pixels in ways people cannot see, causing the video cable carrying them to radiate a faint radio signal that a nearby receiver can decode. The article emphasizes that TrojPix requires malware to already be on the target machine, so it is a way to get stolen data out rather than a way to break in.\u003c/p\u003e\n\n\u003cp\u003eIn testing, TrojPix reached a peak throughput of 8.1 Mbps and a maximum distance of 208 meters, though those figures were measured separately. The article notes that this speed is much faster than most air-gap covert channels and could move a 100 MB file in under two minutes. It also says real-world range would depend on barriers such as walls, shielding, and noise.\u003c/p\u003e\n\n\u003cp\u003eThe researchers call the method imperceptible pixel modulation and say it needs no administrator rights or hardware changes, only user-level malware that can draw to the screen. They describe modes that either make the display appear dark as if powered off or hide the signal inside ordinary-looking screen content. Suggested countermeasures include using fiber-optic video links instead of copper, shielding cables and rooms where warranted, and keeping malware off the machine in the first place.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at Shandong University demonstrated TrojPix, a technique that leaks data from air-gapped computers by subtly modifying on-screen pixels so video cables radiate a radio signal that a nearby receiver can decode.","TrojPix requires malware to already be present on the target machine and is a data exfiltration method rather than an initial access technique.","In tests, TrojPix reached a peak throughput of 8.1 Mbps and a maximum distance of 208 meters, with those measurements taken separately.","The researchers say TrojPix needs no administrator rights or hardware changes, and user-level malware that can draw to the screen is sufficient.","Suggested countermeasures include using fiber-optic video links instead of copper, shielding cables and rooms where needed, and preventing malware from getting onto the machine."],"insights":["TrojPix shifts air-gap leakage from password-sized data to whole-file exfiltration, because its reported 8.1 Mbps peak rate could move a 100 MB file in under two minutes.","The channel can operate while the monitor appears switched off or while ordinary-looking content is on screen, so visual inspection of the display may not reveal that data is being transmitted.","Because the emission itself cannot be patched away, the article frames the most practical defenses as physical controls such as fiber-optic video links, shielding, and TEMPEST-rated environments.","The technique was tested across nine monitor brands and fifteen video cables, indicating the researchers did not find it limited to one narrow hardware setup.","Despite its high lab performance, the article emphasizes that real-world practicality depends on conditions such as walls, shielding, and radio noise, and that known real-world air-gap compromises have used USB drives rather than radio leakage."],"referencedReports":[{"title":"TrojPix","url":"https://www.usenix.org/conference/usenixsecurity26/presentation/zhang-guoming","publisher":"USENIX","context":"The article links to the TrojPix research as the primary work demonstrating imperceptible pixel modulation for leaking data from air-gapped systems via video cable emissions.","category":"","primary":false},{"title":"TEMPEST-LoRa","url":"https://arxiv.org/abs/2506.21069","publisher":"arXiv","context":"The article cites TEMPEST-LoRa as earlier research that used video cable emissions to reach off-the-shelf LoRa radios.","category":"","primary":false},{"title":"Ethernet hardware implant research","url":"https://arxiv.org/abs/2605.02702","publisher":"arXiv","context":"The article references this research as an example of data exfiltration from Ethernet using a planted hardware implant, contrasting it with TrojPix's lack of hardware changes.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Shandong University have demonstrated TrojPix, a technique for leaking data from computers that are cut off from every network. TrojPix works by subtly modifying on-screen pixels in ways people cannot see, causing the video cable carrying them to radiate a faint radio signal that a nearby receiver can decode. The article emphasizes that TrojPix requires malware to already be on the target machine, so it is a way to get stolen data out rather than a way to break in.\u003c/p\u003e\n\n\u003cp\u003eIn testing, TrojPix reached a peak throughput of 8.1 Mbps and a maximum distance of 208 meters, though those figures were measured separately. The article notes that this speed is much faster than most air-gap covert channels and could move a 100 MB file in under two minutes. It also says real-world range would depend on barriers such as walls, shielding, and noise.\u003c/p\u003e\n\n\u003cp\u003eThe researchers call the method imperceptible pixel modulation and say it needs no administrator rights or hardware changes, only user-level malware that can draw to the screen. They describe modes that either make the display appear dark as if powered off or hide the signal inside ordinary-looking screen content. Suggested countermeasures include using fiber-optic video links instead of copper, shielding cables and rooms where warranted, and keeping malware off the machine in the first place.\u003c/p\u003e\n"}]</script>
