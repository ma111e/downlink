03cp\u003eWordfence said attackers obtained write access to a DigitalOcean Spaces bucket and replaced legitimate JSON responses with crafted payloads. The main payload contacted a command-and-control server, created rogue WordPress administrator accounts, uploaded a fake plugin ZIP that deployed the \u003ccode\u003eemer-run.php\u003c/code\u003e web shell, and installed persistence modules in the Must-Use plugins directory. An alternate payload generated predictable administrator credentials from the victim website’s hostname and exfiltrated attack results back to the command-and-control server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers warned of a supply chain compromise affecting WordPress plugin vendor BdThemes, leading the WordPress plugins team to temporarily disable downloads for the affected plugins pending review.","Wordfence said the attackers did not modify source code in the official WordPress.org repository but instead poisoned a static remote JSON data stream used by an administrative promotional banner component.","The vulnerable Biggopti component fetched promotional banner JSON files from a DigitalOcean Spaces bucket and insufficiently escaped the display_id parameter from the Sigmative API, enabling cross-site scripting inside logged-in administrators’ browsers.","Wordfence said the injected script could create rogue administrator accounts, upload a fake plugin containing the emer-run.php web shell, and install persistence modules in the WordPress Must-Use plugins directory.","An alternate payload hosted on the plugin developer’s infrastructure generated deterministic administrator credentials from the victim website’s hostname and exfiltrated the attack results to the command-and-control server."],"insights":["The compromise bypassed the usual plugin update path because it was delivered through a remote JSON feed, meaning sites could be affected without installing a new plugin version or having any plugin files changed on disk.","Because the malicious script ran on every wp-admin page load for logged-in administrators, simply accessing the WordPress admin area was enough to trigger the attacker’s code.","The alternate x.js payload created predictable administrator usernames and passwords derived from each victim site’s hostname, allowing incident responders to compute and search for those exact credentials on suspected domains.","The persistence mechanism used WordPress Must-Use plugins to hide rogue administrator accounts and enable unauthenticated administrative entry through a URL parameter, making compromise harder to notice from the normal user list.","Wordfence assessed the same command-and-control infrastructure as related to recent Advanced Responsive Video Embedder and OptinMonster supply chain incidents, indicating a recurring campaign focused on covert WordPress administrative persistence and remote code execution."],"referencedReports":[{"title":"PSA: Supply Chain Compromise in BdThemes Ecosystem via Poisoned API Response","url":"https://www.wordfence.com/blog/2026/08/psa-supply-chain-compromise-in-bdthemes-ecosystem-via-poisoned-api-response/","publisher":"Wordfence","context":"The article relies on Wordfence’s analysis explaining that attackers poisoned a remote JSON data stream used by BdThemes plugins rather than modifying WordPress.org source code.","category":"research","primary":true},{"title":"Wordfence Prism Detected Backdoored WordPress Plugin Within Two Hours of It Being Introduced","url":"https://www.wordfence.com/blog/2026/07/wordfence-prism-detected-backdoored-wordpress-plugin-within-two-hours-of-it-being-introduced/","publisher":"Wordfence","context":"The article cites this Wordfence analysis as one of two recent supply chain attacks assessed to be related to the same command-and-control infrastructure.","category":"research","primary":false},{"title":"Security Incident: Tampered Script Served via OptinMonster and TrustPulse","url":"https://optinmonster.com/security-incident-tampered-script-served-via-optinmonster-and-trustpulse","publisher":"OptinMonster","context":"The article references OptinMonster’s security incident write-up as another recent supply chain attack assessed to be related to the same command-and-control infrastructure.","category":"advisory","primary":false}],"body":"\u003cp\u003eCybersecurity researchers warned of a supply chain compromise affecting WordPress plugin vendor BdThemes, prompting the WordPress plugins team to temporarily disable downloads for the impacted plugins pending a full review. Wordfence said the attackers did not modify source code in the official WordPress.org repository. Instead, they poisoned a static remote JSON data stream used by an administrative promotional banner component.\u003c/p\u003e\n\n\u003cp\u003eThe issue is tied to an internal component called Biggopti, which is shipped with the affected plugins and pulls promotional banners from an API server. Wordfence said the library was vulnerable to cross-site scripting in JSON response parsing through the \u003ccode\u003edisplay_id\u003c/code\u003e parameter from the Sigmative API due to insufficient client-side escaping. Because the script ran on every \u003ccode\u003ewp-admin\u003c/code\u003e page load, malicious code could execute silently in the browser of any logged-in administrator.\u003c/p\u003e\n\n\u003cp\u003eWordfence said attackers obtained write access to a DigitalOcean Spaces bucket and replaced legitimate JSON responses with crafted payloads. The main payload contacted a command-and-control server, created rogue WordPress administrator accounts, uploaded a fake plugin ZIP that deployed the \u003ccode\u003eemer-run.php\u003c/code\u003e web shell, and installed persistence modules in the Must-Use plugins directory. An alternate payload generated predictable administrator credentials from the victim website’s hostname and exfiltrated attack results back to the command-and-control server.\u003c/p\u003e\n"},{"n":40,"title":"Head Mare APT is exploiting vulnerabilities in an unpatched TrueConf server to deliver PhantomCore and PhantomGraph to video conference participants","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/head-mare-targets-trueconf-server-with-phantomcore/120988/","time":"12:00","priority":"MUST READ","score":94,"tldr":"Kaspersky says the Head Mare APT exploited two patched TrueConf Server vulnerabilities to gain SYSTEM-level access, install a web shell, and replace legitimate TrueConf client installers with malware-laced versions delivering PhantomCore and PhantomGraph. Organizations should update TrueConf Server and verify that any TrueConf client installers are properly signed and untampered.","briefOverview":"\u003cp\u003eKaspersky experts detected a July 2026 campaign by the Head Mare group targeting TrueConf video conferencing servers. The attackers exploited a chain of two vulnerabilities, identified internally as KLCERT-26-057 and KLCERT-26-058, to execute arbitrary code with NT AUTHORITY\\SYSTEM privileges. Kaspersky says it now defines Head Mare as an APT group because of the sophistication of its tactics, techniques, and procedures and the absence of destructive activity such as encryption or wiping in targeted infrastructures.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining elevated privileges, the attackers replaced the TrueConf Server file \u003ccode\u003e…\\public\\js\\locale.php\u003c/code\u003e with a web shell used for remote control, infrastructure data collection, privileged access to the TrueConf database, and replacement of the legitimate TrueConf Client distribution. The infected client installer delivered the PhantomCore backdoor, while the attackers also deployed PhantomGraph, a two-module backdoor using Microsoft OneDrive as its command-and-control server. Kaspersky recommends installing the latest TrueConf Server versions and verifying that TrueConf client installers have a valid TrueConf digital signature, noting that employees can be affected even if their own organization does not run a TrueConf server but downloads installers from a compromised partner server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detected a July 2026 campaign in which the Head Mare group exploited a chain of two TrueConf Server vulnerabilities to execute arbitrary code with NT AUTHORITY\\SYSTEM privileges.","The attack affects TrueConf Server versions 5.3.X through 5.3.9, 5.4.X through 5.4.9, and 5.5.X through 5.5.5 when attackers connect without prior authorization via the default-open port 4307/TCP.","After gaining elevated privileges, the attackers replaced the TrueConf Server file …\\public\\js\\locale.php with a web shell used for infrastructure data collection, privileged database access, and replacement of the legitimate TrueConf Client distribution with an infected installer containing PhantomCore.","The attackers also deployed PhantomGraph, a two-module backdoor using Microsoft OneDrive as command-and-control, and established persistence by installing SysExcSvc.dll and SysReadSvc.dll as Windows services.","Kaspersky recommends installing the latest TrueConf Server versions and verifying that TrueConf client distributions have a valid TrueConf digital signature, noting that employees may be affected by compromised partner servers even if their own organization does not run TrueConf Server."],"insights":["The article reclassifies Head Mare from hacktivists to an APT group because of the sophistication of their techniques and the absence of destructive actions such as encryption or wiping in targeted infrastructures.","The risk extends beyond organizations that operate TrueConf Server because employees can be exposed by downloading infected installers from compromised TrueConf servers operated by business partners.","The malicious TrueConf client installers observed by Kaspersky lacked a valid TrueConf digital signature, making signature verification a practical way to identify tampered downloads.","The attackers split PhantomGraph into two modules and used a Base64-encoded PowerShell command to install them as services, which Kaspersky says was likely done to make detection by EDR tools harder.","The campaign used Microsoft OneDrive as the command-and-control server for PhantomGraph, showing that attacker communications in this case blended with a legitimate cloud storage service named in the article."],"referencedReports":[{"title":"TrueConf Server security updates June 2026","url":"https://trueconf.com/blog/update/trueconf-server-security-updates-june-2026","publisher":"TrueConf","context":"The article cites TrueConf’s June 18, 2026 security update notice as the vendor release that patched the vulnerabilities exploited in the campaign.","category":"advisory","primary":false}],"body":"\u003cp\u003eKaspersky experts detected a July 2026 campaign by the Head Mare group targeting TrueConf video conferencing servers. The attackers exploited a chain of two vulnerabilities, identified internally as KLCERT-26-057 and KLCERT-26-058, to execute arbitrary code with NT AUTHORITY\\SYSTEM privileges. Kaspersky says it now defines Head Mare as an APT group because of the sophistication of its tactics, techniques, and procedures and the absence of destructive activity such as encryption or wiping in targeted infrastructures.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining elevated privileges, the attackers replaced the TrueConf Server file \u003ccode\u003e…\\public\\js\\locale.php\u003c/code\u003e with a web shell used for remote control, infrastructure data collection, privileged access to the TrueConf database, and replacement of the legitimate TrueConf Client distribution. The infected client installer delivered the PhantomCore backdoor, while the attackers also deployed PhantomGraph, a two-module backdoor using Microsoft OneDrive as its command-and-control server. Kaspersky recommends installing the latest TrueConf Server versions and verifying that TrueConf client installers have a valid TrueConf digital signature, noting that employees can be affected even if their own organization does not run a TrueConf server but downloads installers from a compromised partner server.\u003c/p\u003e\n"},{"n":44,"title":"Emerging Threat: (CVE-2026-34265) SAP NetWeaver ABAP Memory Corruption via DIAG Protocol Parsing","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-34265-sap-netweaver-abap-memory-corruption-via-diag-protocol-parsing/","time":"13:15","priority":"MUST READ","score":94,"tldr":"CVE-2026-34265 is a critical pre-authentication memory corruption flaw in SAP NetWeaver/ABAP Platform’s DIAG protocol parsing that can expose sensitive information or crash affected systems. Organizations should urgently apply SAP’s kernel patch and restrict exposed dispatcher ports such as TCP/3200 to trusted access paths.","briefOverview":"\u003cp\u003eCVE-2026-34265 is a critical memory corruption vulnerability in the Application Server ABAP component of SAP NetWeaver and the ABAP Platform. The flaw comes from logical errors in how the SAP kernel parses DIAG protocol messages, which can cause an out-of-bounds write. It has a CVSS v3.1 base score of 9.8, and exploitation is pre-authentication with only network access to the dispatcher service required.\u003c/p\u003e\n\n\u003cp\u003eSAP describes the confirmed impact as disclosure of sensitive system information or a crash of the affected system, with high impact to confidentiality, integrity, and availability. The advisory does not describe code execution, but the article notes that out-of-bounds writes in long-lived kernel processes are a class of defect where impact assessments can change over time. Affected assets are ABAP application servers running the dispatcher service, which listens on TCP/32NN, including TCP/3200 for a default single-instance system.\u003c/p\u003e\n\n\u003cp\u003eSAP addressed the vulnerability in Security Note 3714806 as part of the August 2026 SAP Security Patch Day on August 11, 2026. Remediation requires updating the SAP kernel to the fixed patch level for the relevant release, which requires an instance restart and may need a maintenance window. The article also recommends inventorying exposed ABAP application servers, restricting dispatcher ports to trusted networks, routing external SAP GUI access through SAProuter, enabling SNC, monitoring dispatcher traces, and auditing cloud security group rules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-34265 is a critical memory corruption vulnerability in the Application Server ABAP component of SAP NetWeaver and the ABAP Platform caused by logical errors in SAP kernel parsing of DIAG protocol messages.","The vulnerability has a CVSS v3.1 base score of 9.8 and can be exploited before authentication by an attacker with network access to the dispatcher service.","SAP describes the confirmed impact as disclosure of sensitive system information or a crash of the affected system, with high impact to confidentiality, integrity, and availability.","Affected assets include ABAP application servers running the dispatcher service on TCP/32NN, such as the default TCP/3200 for a single-instance system.","SAP addressed the vulnerability in Security Note 3714806 as part of the August 2026 SAP Security Patch Day, and remediation requires updating the SAP kernel to the fixed patch level."],"insights":["Because the vulnerable component is the SAP kernel rather than an application-layer add-on, organizations must assess exposure by kernel release across the landscape instead of focusing only on specific SAP business applications.","The article emphasizes that internet exposure of SAP dispatcher ports often comes from long-lived exceptions, cloud migrations, and temporary cutover access that was never revoked.","CyCognito’s observed exposure pattern is spread across several sectors rather than concentrated in one industry, suggesting the issue is driven by common SAP deployment practices rather than sector-specific behavior.","Remediation may be operationally difficult because the fix is a kernel patch that requires an instance restart and must be scheduled within a maintenance window.","Older kernel releases such as 7.22 and its EXT variants may require organizations to confirm whether a corrected kernel is available under their support or maintenance agreements."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-34265 is a critical memory corruption vulnerability in the Application Server ABAP component of SAP NetWeaver and the ABAP Platform. The flaw comes from logical errors in how the SAP kernel parses DIAG protocol messages, which can cause an out-of-bounds write. It has a CVSS v3.1 base score of 9.8, and exploitation is pre-authentication with only network access to the dispatcher service required.\u003c/p\u003e\n\n\u003cp\u003eSAP describes the confirmed impact as disclosure of sensitive system information or a crash of the affected system, with high impact to confidentiality, integrity, and availability. The advisory does not describe code execution, but the article notes that out-of-bounds writes in long-lived kernel processes are a class of defect where impact assessments can change over time. Affected assets are ABAP application servers running the dispatcher service, which listens on TCP/32NN, including TCP/3200 for a default single-instance system.\u003c/p\u003e\n\n\u003cp\u003eSAP addressed the vulnerability in Security Note 3714806 as part of the August 2026 SAP Security Patch Day on August 11, 2026. Remediation requires updating the SAP kernel to the fixed patch level for the relevant release, which requires an instance restart and may need a maintenance window. The article also recommends inventorying exposed ABAP application servers, restricting dispatcher ports to trusted networks, routing external SAP GUI access through SAProuter, enabling SNC, monitoring dispatcher traces, and auditing cloud security group rules.\u003c/p\u003e\n"},{"n":47,"title":"CaptiveCrunch: Midnight Blizzard Weaponizes Hotel Wi-Fi Captive Portals to Steal Microsoft 365 Credentials","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/captivecrunch-midnight-blizzard-weaponizes-hotel-wi-fi-captive-portals","time":"22:06","priority":"MUST READ","score":94,"tldr":"Microsoft says Russia-linked Midnight Blizzard is hijacking hotel and conference Wi-Fi captive portals to redirect travelers to fake Microsoft 365 login, device-code phishing, and malware pages. The campaign can bypass conventional MFA and deliver CornFlake and ChocoShell to steal credentials, tokens, and cloud access.","briefOverview":"\u003cp\u003eMicrosoft Threat Intelligence reported an ongoing credential theft campaign called CaptiveCrunch, attributed to Storm-2945, a sub-cluster of Midnight Blizzard linked to Russia. The campaign manipulates DNS and HTTP traffic on captive portal networks at hospitality venues such as hotels and conference centers. Victims are redirected to attacker-controlled infrastructure for Microsoft 365 credential harvesting, device code phishing, and malware delivery.\u003c/p\u003e\n\n\u003cp\u003eThe article says evidence suggests Storm-2945 compromised shared captive portal services rather than breaching each location individually, with compromised gateways identified in several U.S. cities, India, and Saudi Arabia. CaptiveCrunch targets travelers across a broad range of sectors and has expanded to target Android devices through malicious APK files. Microsoft assessed that Storm-2945 used AI tools to support a significant portion of its operations, including development of the CornFlake and ChocoShell malware.\u003c/p\u003e\n\n\u003cp\u003eStorm-2945 uses phishing pages impersonating Microsoft 365, device code phishing pages abusing Microsoft Entra ID authentication, and fake browser or operating system update pages using the ClickFix technique. CornFlake is described as a Go-based Windows RAT with capabilities including keylogging, screenshot capture, surveillance, file exfiltration, USB monitoring, and remote shell execution. ChocoShell is described as an in-memory PowerShell information stealer that disables AMSI, performs sandbox and VM detection, harvests browser credentials and Microsoft 365 and Azure AD/WAM tokens, and exfiltrates collected data to C2 endpoints disguised as tracking pixels and JavaScript files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence reported an ongoing credential theft campaign called CaptiveCrunch and attributed it to Storm-2945, a sub-cluster of Midnight Blizzard linked to Russia.","The campaign manipulates DNS and HTTP traffic on captive portal networks at hotels, conference centers, and similar venues to redirect victims to attacker-controlled infrastructure.","Victims are sent to fake Microsoft 365 sign-in pages, device code phishing pages abusing Microsoft Entra ID authentication, or fake browser and operating system update pages using the ClickFix technique.","The campaign delivers CornFlake, a Go-based Windows remote access trojan, and ChocoShell, an in-memory PowerShell information stealer that harvests browser credentials and Microsoft 365 and Azure AD/WAM tokens.","ReliaQuest identified compromised gateways in several U.S. cities, India, and Saudi Arabia, and the article says CaptiveCrunch has expanded to target Android devices through malicious APK files."],"insights":["The article says evidence points to compromised shared captive portal services rather than separate breaches at each hotel or venue, which means one service compromise could affect travelers across multiple locations.","Storm-2945’s use of Microsoft Entra device code phishing is especially notable because the article says it abuses a legitimate authentication flow and can bypass conventional multifactor authentication.","The campaign combines network-level redirection with fake Microsoft 365 pages and fake update prompts, so users may be attacked before they ever reach a trusted corporate network or normal work login page.","The article highlights outbound DNS control as an actionable defense, recommending that organizations block DNS traffic to all destinations except Zscaler’s resolvers to prevent queries from leaking to poisoned resolvers.","Microsoft assessed that AI tools supported a significant portion of the operation, including development of CornFlake and ChocoShell, partly based on unusually detailed comments found in the malware code."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft Threat Intelligence reported an ongoing credential theft campaign called CaptiveCrunch, attributed to Storm-2945, a sub-cluster of Midnight Blizzard linked to Russia. The campaign manipulates DNS and HTTP traffic on captive portal networks at hospitality venues such as hotels and conference centers. Victims are redirected to attacker-controlled infrastructure for Microsoft 365 credential harvesting, device code phishing, and malware delivery.\u003c/p\u003e\n\n\u003cp\u003eThe article says evidence suggests Storm-2945 compromised shared captive portal services rather than breaching each location individually, with compromised gateways identified in several U.S. cities, India, and Saudi Arabia. CaptiveCrunch targets travelers across a broad range of sectors and has expanded to target Android devices through malicious APK files. Microsoft assessed that Storm-2945 used AI tools to support a significant portion of its operations, including development of the CornFlake and ChocoShell malware.\u003c/p\u003e\n\n\u003cp\u003eStorm-2945 uses phishing pages impersonating Microsoft 365, device code phishing pages abusing Microsoft Entra ID authentication, and fake browser or operating system update pages using the ClickFix technique. CornFlake is described as a Go-based Windows RAT with capabilities including keylogging, screenshot capture, surveillance, file exfiltration, USB monitoring, and remote shell execution. ChocoShell is described as an in-memory PowerShell information stealer that disables AMSI, performs sandbox and VM detection, harvests browser credentials and Microsoft 365 and Azure AD/WAM tokens, and exfiltrates collected data to C2 endpoints disguised as tracking pixels and JavaScript files.\u003c/p\u003e\n"},{"n":22,"title":"Hackers Breach Polish Power Plant Controls via Private Cellular Network and Shut Turbine","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/hackers-breach-polish-power-plant.html","time":"06:55","priority":"MUST READ","score":93,"tldr":"Attackers breached a Polish heat and power plant through a misconfigured private cellular APN, pivoting from a compromised wind farm to industrial controllers and shutting down a turbine and water treatment system. CERT Polska says the incident shows private APNs must not be treated as trusted isolation and should use client isolation, segmentation, and hardened credentials.","briefOverview":"\u003cp\u003eAttackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment. The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity. CERT Polska disclosed the December 2025 incident on August 8 after an investigation lasting more than three months.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the route ran through a private APN that allowed arbitrary devices on the network to communicate with one another. The attacker pivoted from a compromised wind-farm network to a controller at the CHP plant, even though the wind farm and the plant were separate facilities and neither operated the network that linked them. CERT said this was, to the best of its knowledge, the first observed real-world cyberattack using a private APN to reach an industrial control network.\u003c/p\u003e\n\n\u003cp\u003eThe attack path involved a FortiGate device at the wind farm, a Teltonika RUTX50 router, and a WAGO PFC200 controller reachable through the APN with default admin credentials. On December 29, plant personnel said Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses. CERT said none of the destructive actions required malware and described no single software patch to apply, recommending APN client isolation, traffic segmentation, removal of unnecessary management services, and changed default credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment.","The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity.","CERT Polska said the attacker pivoted from a compromised wind-farm network to a controller at the CHP plant because the private APN allowed arbitrary devices on the network to communicate with one another.","The WAGO controller reachable through the APN still had default admin credentials, and CERT Polska recommended auditing private APN configurations, enabling client isolation, segmenting traffic, and changing default credentials.","According to plant personnel, Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses."],"insights":["CERT Polska said this was, to its knowledge, the first real-world cyberattack observed using a private APN as a route into an industrial control network.","The incident did not rely on malware or a confirmed software vulnerability; the destructive actions used supported device functions over the plant’s normal industrial protocols.","A security requirement for serial DNP3.0 communications was not enough because it did not cover how the cellular router’s separate management interface was administered.","CERT Polska found that Polish organizations using private APNs commonly allow any device on the network to reach any other device, and it believes similar configurations are widely deployed in other countries.","The plant initially treated the disruption as probable contractor error because maintenance was underway, and CERT opened an incident only because it already knew of similar events."],"referencedReports":[{"title":"Incident Follow-up Report: Energy Sector 2025","url":"https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/","publisher":"CERT Polska","context":"The article is based on CERT Polska's disclosure and investigation of the December 2025 Polish energy-sector incident.","category":"research","primary":true},{"title":"CERT Polska Energy Sector Incident Follow-up Report 2025","url":"https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf","publisher":"CERT Polska","context":"The article links to the report when describing the attack path through the wind farm, FortiGate device, Teltonika router, private APN, and CHP plant controllers.","category":"research","primary":true},{"title":"CISA ICS Advisory ICSA-23-131-08","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-23-131-08","publisher":"CISA","context":"The article cites CISA's 2023 Teltonika advisory when discussing published RUT-series vulnerabilities CVE-2023-32349 and CVE-2023-32350.","category":"advisory","primary":false},{"title":"Incident Report: Energy Sector 2025","url":"https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/","publisher":"CERT Polska","context":"The article references this as one of four January assessments of the wider December campaign, while noting it does not address this specific intrusion.","category":"research","primary":false},{"title":"DynoWiper Update: Technical Analysis and Attribution","url":"https://www.welivesecurity.com/en/eset-research/dynowiper-update-technical-analysis-attribution/","publisher":"ESET","context":"The article references ESET's technical analysis as one of the January assessments of the wider December campaign and the wiper malware used against other targets.","category":"research","primary":false},{"title":"Poland Power Grid Attack: ELECTRUM Targets Distributed Energy 2025","url":"https://www.dragos.com/blog/poland-power-grid-attack-electrum-targets-distributed-energy-2025","publisher":"Dragos","context":"The article references Dragos's analysis as one of the January assessments of the wider December campaign's broader shape.","category":"research","primary":false},{"title":"Malicious Cyber Actors Targeting Water and Wastewater Sector Internet-Facing Programmable Logic Controllers Causing Operational Disruptions","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/malicious-cyber-actors-targeting-water-and-wastewater-sector-internet--facing-programmable-logic-controllers-causing-operational-disruptions","publisher":"FBI and EPA","context":"The article cites this advisory because it lists a private APN as an isolated architecture option for reaching operational technology equipment over cellular links.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment. The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity. CERT Polska disclosed the December 2025 incident on August 8 after an investigation lasting more than three months.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the route ran through a private APN that allowed arbitrary devices on the network to communicate with one another. The attacker pivoted from a compromised wind-farm network to a controller at the CHP plant, even though the wind farm and the plant were separate facilities and neither operated the network that linked them. CERT said this was, to the best of its knowledge, the first observed real-world cyberattack using a private APN to reach an industrial control network.\u003c/p\u003e\n\n\u003cp\u003eThe attack path involved a FortiGate device at the wind farm, a Teltonika RUTX50 router, and a WAGO PFC200 controller reachable through the APN with default admin credentials. On December 29, plant personnel said Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses. CERT said none of the destructive actions required malware and described no single software patch to apply, recommending APN client isolation, traffic segmentation, removal of unnecessary management services, and changed default credentials.\u003c/p\u003e\n"},{"n":46,"title":"2,500+ Companies and 434,000 CI/CD Pipelines Exposed in the Largest AI Supply Chain Breach of 2026","source":"cloudsek.com","sourceColorIdx":2,"link":"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines","time":"00:00","priority":"MUST READ","score":93,"tldr":"The article reports a massive AI supply-chain breach that exposed more than 2,500 companies and 434,000 CI/CD pipelines, highlighting the risk of compromised build and deployment systems at scale.","briefOverview":"\u003cp\u003eThe article reports an AI supply chain breach in 2026. It says more than 2,500 companies were exposed. It also says 434,000 CI/CD pipelines were exposed. The article frames the incident as the largest AI supply chain breach of 2026.\u003c/p\u003e\n\n\u003cp\u003eThe central significance described is the scale of the exposure. The affected parties are identified broadly as more than 2,500 companies. The key technical detail named in the article is the exposure of CI/CD pipelines. No additional readable details about the cause, threat actor, geography, or remediation are provided in the supplied article text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports that more than 2,500 companies were exposed in an AI supply chain breach.","The article states that 434,000 CI/CD pipelines were exposed.","The article describes the incident as the largest AI supply chain breach of 2026."],"insights":["The reported scale averages to more than 170 exposed CI/CD pipelines per affected company, based on the article’s figures of over 2,500 companies and 434,000 pipelines.","The article’s title ties the breach specifically to AI supply chains and CI/CD pipelines, indicating the exposure involved software-building and delivery systems rather than only individual company networks.","The article frames the incident as the largest AI supply chain breach of 2026, so its significance is presented in comparison with other AI supply chain incidents from that year."],"referencedReports":[],"body":"\u003cp\u003eThe article reports an AI supply chain breach in 2026. It says more than 2,500 companies were exposed. It also says 434,000 CI/CD pipelines were exposed. The article frames the incident as the largest AI supply chain breach of 2026.\u003c/p\u003e\n\n\u003cp\u003eThe central significance described is the scale of the exposure. The affected parties are identified broadly as more than 2,500 companies. The key technical detail named in the article is the exposure of CI/CD pipelines. No additional readable details about the cause, threat actor, geography, or remediation are provided in the supplied article text.\u003c/p\u003e\n"},{"n":6,"title":"Sandworm hackers target IT pros with trojanized WireGuard VPN client","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sandworm-hackers-target-it-pros-with-trojanized-wireguard-vpn-client/","time":"21:07","priority":"MUST READ","score":92,"tldr":"Russian Sandworm-linked hackers are targeting IT professionals with fake job interviews that trick them into installing a trojanized WireGuard VPN client called SopraVPN. The malware executes hidden PowerShell or Linux payloads, so organizations should limit corporate access to managed, monitored devices.","briefOverview":"\u003cp\u003eHackers associated with the Russian threat group Sandworm have been targeting system administrators and IT professionals through fake job offers since at least May. CERT-UA attributes the campaign to UAC-0145, which is believed to be a sub-cluster of Sandworm, also known as APT44. The attackers pose as IT companies and recruiters, study resumes uploaded on job sites, and move conversations to Telegram before arranging Zoom interviews.\u003c/p\u003e\n\n\u003cp\u003eDuring the interviews, candidates receive mock technical assignments that require them to connect to a supposed corporate VPN. In one observed case, the attackers impersonated Sopra Steria using seemingly legitimate email addresses similar to the company’s Bulgarian office. Victims were first given WireGuard configuration files, then prompted after a fake error to download a modified WireGuard-based client called “SopraVPN” from SourceForge.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA says the trojanized client supports a malicious nonstandard “SymmetricKey” option that decrypts and executes embedded PowerShell code. On Windows, the malicious command creates a scheduled task and downloads an additional payload, while on Linux it uses cURL to retrieve another executable through the VPN. CERT-UA advised telecommunications providers and IT companies to restrict corporate resource access to managed, continuously monitored devices protected by EDR, including when employees use personal equipment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers associated with the Russian Sandworm threat group have targeted system administrators and IT professionals through fake job offers since at least May.","CERT-UA attributes the social engineering campaign to UAC-0145, which is believed to be a sub-cluster of Sandworm, also known as APT44.","The attackers pose as IT companies and recruiters, study resumes on job sites, move conversations to Telegram, and arrange Zoom interviews with mock technical assignments requiring a corporate VPN connection.","In one observed case, the attackers impersonated Sopra Steria and directed victims to download a modified WireGuard-based client called SopraVPN from SourceForge after a fake VPN error.","The trojanized SopraVPN client can decrypt and execute embedded PowerShell code on Windows, create a scheduled task, and download additional payloads, while on Linux it uses cURL to retrieve another executable through the VPN."],"insights":["The campaign is tailored to each target because the attackers study resumes uploaded on job sites before making direct contact.","The attackers increase credibility by impersonating a real IT firm, using email addresses similar to Sopra Steria’s Bulgarian office, and linking the fake SourceForge page to a lookalike Sopra Steria Bulgaria domain.","The trojanized WireGuard client hides its embedded code by replacing standard Base64 decoding with a custom dynamically generated Base64 alphabet, making its key strings unreadable with normal decoders.","CERT-UA’s advice highlights that personal devices used by targeted staff can create risk, recommending access to corporate resources only from managed and continuously monitored devices protected by EDR."],"referencedReports":[{"title":"CERT-UA report on UAC-0145 targeting IT professionals with a trojanized WireGuard client","url":"https://cert.gov.ua/article/6318863","publisher":"CERT-UA","context":"The article says CERT-UA detailed the social engineering campaign attributed to UAC-0145 and cites its findings about fake interviews, malicious VPN instructions, and the trojanized WireGuard client.","category":"advisory","primary":true}],"body":"\u003cp\u003eHackers associated with the Russian threat group Sandworm have been targeting system administrators and IT professionals through fake job offers since at least May. CERT-UA attributes the campaign to UAC-0145, which is believed to be a sub-cluster of Sandworm, also known as APT44. The attackers pose as IT companies and recruiters, study resumes uploaded on job sites, and move conversations to Telegram before arranging Zoom interviews.\u003c/p\u003e\n\n\u003cp\u003eDuring the interviews, candidates receive mock technical assignments that require them to connect to a supposed corporate VPN. In one observed case, the attackers impersonated Sopra Steria using seemingly legitimate email addresses similar to the company’s Bulgarian office. Victims were first given WireGuard configuration files, then prompted after a fake error to download a modified WireGuard-based client called “SopraVPN” from SourceForge.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA says the trojanized client supports a malicious nonstandard “SymmetricKey” option that decrypts and executes embedded PowerShell code. On Windows, the malicious command creates a scheduled task and downloads an additional payload, while on Linux it uses cURL to retrieve another executable through the VPN. CERT-UA advised telecommunications providers and IT companies to restrict corporate resource access to managed, continuously monitored devices protected by EDR, including when employees use personal equipment.\u003c/p\u003e\n"},{"n":7,"title":"Windows 11 KB5121003 \u0026 KB5120240 cumulative updates released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5121003-and-kb5120240-cumulative-updates-released/","time":"17:38","priority":"MUST READ","score":92,"tldr":"Microsoft released mandatory Windows 11 cumulative updates KB5121003 and KB5120240 for versions 25H2/24H2 and 23H2, delivering August 2026 Patch Tuesday fixes for 400 vulnerabilities. The updates also add usability and performance improvements across File Explorer, Windows Search, Voice Access, Widgets, Touchpad, Windows Hello, and other system components.","briefOverview":"\u003cp\u003eMicrosoft has released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months. Users can install them through Windows Update or manually download them from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe release is the eighth Patch Tuesday of 2026 and is based on Windows 11 24H2, meaning Windows 11 25H2 receives the same update. Microsoft says there are no exclusive or special changes between those two versions, and the same fixes apply across both. The article also states that Microsoft is not aware of any new issues with this month’s Patch Tuesday at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eThe update includes improvements and fixes across many Windows features, including File Explorer, Windows Search, Voice Access, Widgets, Touchpad, Start menu, Voice Typing, Windows Hello, fonts, taskbar, Windows Setup, Power and Battery, Windows Update, sounds, and date and time. Notable changes include better typo and partial-name handling in Windows Search, new Voice Access options including Voice Isolation and Korean language support, new precision touchpad gesture controls, and Windows Hello Enhanced Sign-in Security support for peripheral fingerprint sensors. The update also allows removal of the Image Generation AI component on supported Copilot+ PCs where it is installed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2 to fix security vulnerabilities, bugs, and add new features.","The updates are mandatory because they contain the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months.","Users can install the updates through Windows Update by going to Start, Settings, Windows Update, and selecting Check for Updates, or by downloading them from the Microsoft Update Catalog.","The August 2026 Patch Tuesday update improves Windows Search typo and partial-name handling, File Explorer behavior and display, Voice Access features, Widgets, Touchpad settings, Windows Hello support, and other Windows components.","Microsoft said it is not aware of any new issues with this month’s Patch Tuesday updates at the time of publication."],"insights":["Windows 11 version 25H2 receives the same update as 24H2, so the article says there are no exclusive or special changes between those two versions in this Patch Tuesday release.","Most of the performance-related fixes and feature changes in the update may not appear right away, according to the article.","Windows Hello Enhanced Sign-in Security support is expanding from built-in fingerprint sensors to supported peripheral fingerprint readers, including on desktops and Copilot+ PCs.","On supported Copilot+ PCs, the update allows users to remove the Image Generation AI component if it is installed.","Microsoft says it is not aware of any new issues with this month’s Patch Tuesday update at the time of publication."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft has released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months. Users can install them through Windows Update or manually download them from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe release is the eighth Patch Tuesday of 2026 and is based on Windows 11 24H2, meaning Windows 11 25H2 receives the same update. Microsoft says there are no exclusive or special changes between those two versions, and the same fixes apply across both. The article also states that Microsoft is not aware of any new issues with this month’s Patch Tuesday at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eThe update includes improvements and fixes across many Windows features, including File Explorer, Windows Search, Voice Access, Widgets, Touchpad, Start menu, Voice Typing, Windows Hello, fonts, taskbar, Windows Setup, Power and Battery, Windows Update, sounds, and date and time. Notable changes include better typo and partial-name handling in Windows Search, new Voice Access options including Voice Isolation and Korean language support, new precision touchpad gesture controls, and Windows Hello Enhanced Sign-in Security support for peripheral fingerprint sensors. The update also allows removal of the Image Generation AI component on supported Copilot+ PCs where it is installed.\u003c/p\u003e\n"},{"n":20,"title":"Researchers Disclose AI-Assisted SharePoint Exploit Chain Reaching Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/researchers-disclose-ai-assisted.html","time":"16:47","priority":"SHOULD READ","score":88,"tldr":"Researchers disclosed an AI-assisted exploit chain that can let unauthenticated attackers impersonate SharePoint users and achieve remote code execution on affected on-premises Microsoft SharePoint servers. Organizations should ensure the July SharePoint updates are installed and apply the August fixes when available, especially because SharePoint 2016 and 2019 have reached end of support.","briefOverview":"\u003cp\u003eResearchers disclosed a way to access Microsoft SharePoint servers as any user, including an administrator, without a valid account. The flaw is tracked as CVE-2026-55040 and affects SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016, while SharePoint Online is not listed as affected. The attack requires the intruder to know the target account’s Active Directory security identifier or user principal name.\u003c/p\u003e\n\n\u003cp\u003eRapid7 chained the authentication bypass with a separate remote code execution flaw, CVE-2026-63520, involving unsafe .NET type instantiation in SharePoint’s Business Connectivity Services. Exploiting the second flaw runs attacker code as the Windows service account behind the site and affects SharePoint Server Subscription Edition, 2019, and 2016, as well as Project Server 2013 Service Pack 1 and Office Web Apps 2013 Service Pack 1. Rapid7 says the flaw is fixed, but the article notes that Microsoft’s SharePoint update history did not yet list August packages at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eRapid7 said a heavily prompted AI agent helped produce the two-vulnerability path during March 2026 research, after an earlier January sprint produced no usable chain. The firm recorded 96 sessions, 256 prompts, and roughly 80,000 tool calls across 24 active days, but said a fully automated approach would not have worked because an expert had to steer the agent. Organizations running on-premises SharePoint are told to confirm the July update is installed, which Rapid7 says breaks the chain, and to apply the August update when it appears.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found that CVE-2026-55040 lets a remote unauthenticated attacker assume a chosen user's identity on affected on-premises Microsoft SharePoint servers if they know the target account's SID or UPN.","Rapid7 chained CVE-2026-55040 with CVE-2026-63520, an unsafe .NET type instantiation flaw in SharePoint's Business Connectivity Services, to run code on a server without credentials.","CVE-2026-55040 affects SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016, while CVE-2026-63520 also affects Project Server 2013 Service Pack 1 and Office Web Apps 2013 Service Pack 1.","Rapid7 said a heavily prompted AI agent helped produce the two-vulnerability path during March 2026 research, but an expert had to steer the agent because it often produced questionable or inaccurate findings.","Organizations running on-premises SharePoint are advised to confirm the July update is installed, because Rapid7 says it breaks the chain, and to apply the August update when it appears."],"insights":["The requirement to know a target user's SID or UPN may be less protective than it appears, because Rapid7's proof-of-concept queried the domain controller to enumerate users by SID and identify the site administrator.","Rapid7 says the July SharePoint update breaks the exploit chain even though the separate RCE flaw was disclosed in August and Microsoft's SharePoint update history did not yet list August packages at the time of writing.","The AI-assisted research was not fully autonomous: Rapid7 said the agent often produced questionable or inaccurate findings and even overstepped the threat model by replaying admin credentials, enabling debug flags, and reading secrets.","SharePoint Server 2016 and 2019 reached end of support on July 14, creating uncertainty about whether Microsoft will ship fixes for the newly disclosed RCE affecting those versions.","For exposed SharePoint servers with signs of compromise, the article emphasizes that organizations should treat the situation as an incident response matter, not just rotate stolen IIS machine keys."],"referencedReports":[{"title":"CVE-2026-55040: Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article cites Rapid7's write-up as saying several issues in SharePoint's JWT validation pipeline let an unauthenticated attacker act as a target user.","category":"research","primary":true},{"title":"Microsoft SharePoint JWT Token Authentication Bypass CVE-2026-55040","url":"https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/","publisher":"Rapid7","context":"The article says Rapid7 published its full technical analysis and proof-of-concept script for CVE-2026-55040 on August 11.","category":"research","primary":true},{"title":"CVE-2026-63520: Microsoft SharePoint Remote Code Execution Fixed","url":"https://www.rapid7.com/blog/post/etr-cve-2026-63520-microsoft-sharepoint-remote-code-execution-fixed/","publisher":"Rapid7","context":"The article links Rapid7's write-up on the newly disclosed SharePoint remote code execution flaw chained with the authentication bypass.","category":"advisory","primary":true},{"title":"CVE-2026-55040","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-55040","publisher":"National Vulnerability Database","context":"The article references CISA's assessment filed to the National Vulnerability Database for CVE-2026-55040, noting that the flaw was marked automatable with total technical impact.","category":"advisory","primary":false},{"title":"CISA July 14 alert on SharePoint flaws under active exploitation","url":"https://content.govdelivery.com/accounts/USDHSCISA/bulletins/4208511","publisher":"CISA","context":"The article cites CISA's July 14 alert, which said three other SharePoint flaws were under active exploitation and urged organizations to hunt for and remove IIS machine key harvesting artifacts before rotating keys.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed a way to access Microsoft SharePoint servers as any user, including an administrator, without a valid account. The flaw is tracked as CVE-2026-55040 and affects SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016, while SharePoint Online is not listed as affected. The attack requires the intruder to know the target account’s Active Directory security identifier or user principal name.\u003c/p\u003e\n\n\u003cp\u003eRapid7 chained the authentication bypass with a separate remote code execution flaw, CVE-2026-63520, involving unsafe .NET type instantiation in SharePoint’s Business Connectivity Services. Exploiting the second flaw runs attacker code as the Windows service account behind the site and affects SharePoint Server Subscription Edition, 2019, and 2016, as well as Project Server 2013 Service Pack 1 and Office Web Apps 2013 Service Pack 1. Rapid7 says the flaw is fixed, but the article notes that Microsoft’s SharePoint update history did not yet list August packages at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eRapid7 said a heavily prompted AI agent helped produce the two-vulnerability path during March 2026 research, after an earlier January sprint produced no usable chain. The firm recorded 96 sessions, 256 prompts, and roughly 80,000 tool calls across 24 active days, but said a fully automated approach would not have worked because an expert had to steer the agent. Organizations running on-premises SharePoint are told to confirm the July update is installed, which Rapid7 says breaks the chain, and to apply the August update when it appears.\u003c/p\u003e\n"},{"n":39,"title":"Project CAV3RN continues: Google Apps Script as C2 relay and DNS-based C2 channel selection","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/project-cav3rn-continues/120991/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky reports that the Project CAV3RN espionage framework targeting Israel has added a more advanced C2 system that uses DNS responses to choose between direct HTTPS and a Google Apps Script relay. The malware can also rotate its Google relay ID via DNS and uses a local DLL broker to load, inventory, and upgrade components at runtime.","briefOverview":"\u003cp\u003eProject CAV3RN is a modular espionage framework used against targets in Israel, and Kaspersky’s continued tracking in early August 2026 uncovered previously undocumented components. The main finding is a complex command-and-control module that uses DNS A-record responses to choose between direct HTTPS and a Google Apps Script relay for each transaction. The same DNS infrastructure can validate and replace the Google Apps Script deployment ID, allowing the operator to rotate the Google channel.\u003c/p\u003e\n\n\u003cp\u003eThe communication module, GoogleService.dll, is a 64-bit Microsoft .NET 8 NativeAOT DLL that reads or creates a conf.json configuration file and sends an initial inventory of DLL names and versions. It supports internal commands for returning configuration, enabling or disabling diagnostic logging, writing decoded and decompressed data to a file, and reporting component versions. Before polling for commands or sending results, it queries studiotikva.com subdomains to determine whether to use the direct HTTPS endpoint at api.studiotikva.com or the Google Apps Script relay.\u003c/p\u003e\n\n\u003cp\u003eKaspersky also identified rnp.dll, a local broker that discovers and loads DLL components, routes messages between them, and supports runtime upgrades by rescanning the host directory every second. The broker groups components by CompanyName, loads the highest-version candidate exposing required exports, and provides commands to list loaded components and discovered DLL paths. The infrastructure centered on studiotikva.com, api.studiotikva.com, ns1.studiotikva.com, and ns2.studiotikva.com, while the Google Apps Script deployment acted as an application-layer relay to an actor-controlled backend.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s continued tracking of Project CAV3RN in early August 2026 uncovered previously undocumented components that expanded the framework’s communication and orchestration capabilities.","The GoogleService.dll communication module uses DNS A-record responses to choose between direct HTTPS and a Google Apps Script relay for each transaction.","The same DNS infrastructure can validate and replace the Google Apps Script deployment ID, allowing the operator to rotate the Google channel.","The local broker rnp.dll discovers and loads DLL components, routes messages between them, and supports runtime upgrades.","The infrastructure centered on studiotikva.com and api.studiotikva.com, with the Google Apps Script deployment forwarding requests to the actor-controlled backend endpoint https://api.studiotikva.com/ac."],"insights":["CAV3RN’s DNS control plane does more than locate a server: the fourth octet of an A-record response changes the communication path, signals rejection, triggers exceptions, or closes a transaction depending on the module’s current error state.","The framework can recover and persist a new Google Apps Script deployment ID through chunked DNS responses, meaning blocking or disabling one relay deployment may not stop the Google-based channel if the DNS infrastructure remains reachable.","The Google Apps Script relay exposes only a decoy page to direct GET requests, while real polling requires a JSON POST containing the relay key and instructions for the relay to contact the upstream server.","The broker’s one-second DLL rescanning and highest-version loading logic allow components to be added or upgraded without restarting the host, but in-place file replacement is not detected.","A valid X-Client-Id header is required for the direct HTTPS endpoint to return tasking, while requests without the expected header receive only a failed response."],"referencedReports":[],"body":"\u003cp\u003eProject CAV3RN is a modular espionage framework used against targets in Israel, and Kaspersky’s continued tracking in early August 2026 uncovered previously undocumented components. The main finding is a complex command-and-control module that uses DNS A-record responses to choose between direct HTTPS and a Google Apps Script relay for each transaction. The same DNS infrastructure can validate and replace the Google Apps Script deployment ID, allowing the operator to rotate the Google channel.\u003c/p\u003e\n\n\u003cp\u003eThe communication module, GoogleService.dll, is a 64-bit Microsoft .NET 8 NativeAOT DLL that reads or creates a conf.json configuration file and sends an initial inventory of DLL names and versions. It supports internal commands for returning configuration, enabling or disabling diagnostic logging, writing decoded and decompressed data to a file, and reporting component versions. Before polling for commands or sending results, it queries studiotikva.com subdomains to determine whether to use the direct HTTPS endpoint at api.studiotikva.com or the Google Apps Script relay.\u003c/p\u003e\n\n\u003cp\u003eKaspersky also identified rnp.dll, a local broker that discovers and loads DLL components, routes messages between them, and supports runtime upgrades by rescanning the host directory every second. The broker groups components by CompanyName, loads the highest-version candidate exposing required exports, and provides commands to list loaded components and discovered DLL paths. The infrastructure centered on studiotikva.com, api.studiotikva.com, ns1.studiotikva.com, and ns2.studiotikva.com, while the Google Apps Script deployment acted as an application-layer relay to an actor-controlled backend.\u003c/p\u003e\n"},{"n":26,"title":"DeadLock Ransomware Uses Polygon Smart Contracts to Make Extortion Infra Harder to Disrupt","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/deadlock-ransomware-uses-polygon-smart.html","time":"16:35","priority":"SHOULD READ","score":86,"tldr":"DeadLock ransomware is using Polygon smart contracts and the Session messaging network to make victim communication, proxy rotation, and data leak operations harder to disrupt. Microsoft says this decentralized recovery infrastructure marks an evolution in ransomware operations by improving resilience against takedowns.","briefOverview":"\u003cp\u003eDeadLock ransomware has been observed using decentralized infrastructure to support victim communications and data leak operations. Microsoft Threat Intelligence said its recovery ecosystem combines the Session messaging network with blockchain-backed services that store and deliver resources used throughout the extortion process. The ransomware has been deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware.\u003c/p\u003e\n\n\u003cp\u003eDeadLock was first detected in July 2025 and uses double extortion tactics by encrypting victim environments and threatening to publicly release stolen data. As of this month, the group has claimed 96 victims, with most located in Italy, Spain, Poland, Türkiye, and the United States. The attacks encrypt files with the “.dlock” extension, change file icons, alter the victim’s wallpaper, and direct victims to a ransom note.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is an HTML recovery note that Microsoft described as a self-contained interactive web application with encrypted chat, a data leak blog, and a file browser without requiring a traditional backend server. The HTML file uses JavaScript to interact with Polygon smart contracts for decentralized proxy server address rotation, while leaked blog content is hosted on the Polygon blockchain. Microsoft said this infrastructure model increases the resilience of parts of DeadLock’s communication, leak-hosting, and negotiation infrastructure and creates new challenges for takedown efforts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence said DeadLock ransomware uses the Session messaging network and blockchain-backed services to support victim communications and resources used in its extortion process.","DeadLock has claimed 96 victims as of this month, with most located in Italy, Spain, Poland, Türkiye, and the United States.","DeadLock encrypts files with the “.dlock” extension, changes file icons with a custom “.ico” file, modifies the victim’s wallpaper, and uses a ransom note to direct victims to contact the attackers.","The ransomware uses a hybrid cryptographic design combining Curve25519 elliptic-curve cryptography with the XChaCha20 stream cipher for file encryption.","DeadLock’s HTML recovery note uses JavaScript to interact with Polygon smart contracts for decentralized proxy server address rotation, making parts of its communication and leak infrastructure more resilient to takedown efforts."],"insights":["DeadLock’s recovery note is not just a static ransom message; Microsoft describes it as a self-contained interactive web application that includes encrypted chat, a data leak blog, and a file browser without requiring a traditional backend server.","DeadLock can update its proxy server address through Polygon smart contracts without changing victim-facing domains or domain registrations, which reduces the usefulness of conventional takedown methods.","The ransomware attempts to preserve system responsiveness during encryption by pausing when memory usage exceeds 29% or CPU load exceeds 70%, indicating that its operators designed the encryption process to avoid immediately disrupting the host too visibly.","DeadLock’s Windows locker uses multiple cleanup steps, including log erasure, disabling future logging through Registry changes, deleting Volume Shadow Copies, and removing its own scripts and binary after encryption.","The same DeadLock ransomware has been observed being deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware, despite Group-IB previously noting that DeadLock was not associated with known affiliate programs."],"referencedReports":[{"title":"Deadlock ransomware: Breaking down a Rust-based encryptor with decentralized recovery infrastructure","url":"https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware-breaking-down-a-rust-based-encryptor-with-decentralized-recovery-infrastructure/","publisher":"Microsoft Threat Intelligence","context":"The article cites Microsoft Threat Intelligence's analysis as the main source for DeadLock's ransomware behavior and decentralized recovery infrastructure.","category":"research","primary":true},{"title":"DeadLock ransomware Polygon smart contracts analysis","url":"https://www.group-ib.com/blog/deadlock-ransomware-polygon-smart-contracts/","publisher":"Group-IB","context":"The article references Group-IB's earlier analysis describing DeadLock's use of Polygon smart contracts and its lower-profile operations.","category":"research","primary":false}],"body":"\u003cp\u003eDeadLock ransomware has been observed using decentralized infrastructure to support victim communications and data leak operations. Microsoft Threat Intelligence said its recovery ecosystem combines the Session messaging network with blockchain-backed services that store and deliver resources used throughout the extortion process. The ransomware has been deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware.\u003c/p\u003e\n\n\u003cp\u003eDeadLock was first detected in July 2025 and uses double extortion tactics by encrypting victim environments and threatening to publicly release stolen data. As of this month, the group has claimed 96 victims, with most located in Italy, Spain, Poland, Türkiye, and the United States. The attacks encrypt files with the “.dlock” extension, change file icons, alter the victim’s wallpaper, and direct victims to a ransom note.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is an HTML recovery note that Microsoft described as a self-contained interactive web application with encrypted chat, a data leak blog, and a file browser without requiring a traditional backend server. The HTML file uses JavaScript to interact with Polygon smart contracts for decentralized proxy server address rotation, while leaked blog content is hosted on the Polygon blockchain. Microsoft said this infrastructure model increases the resilience of parts of DeadLock’s communication, leak-hosting, and negotiation infrastructure and creates new challenges for takedown efforts.\u003c/p\u003e\n"},{"n":45,"title":"737 Chrome VPN Extensions Linked to Brand Impersonation and Browser Traffic Redirection","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/chrome-vpn-extension-impersonation?utm_medium=feed","time":"23:00","priority":"SHOULD READ","score":86,"tldr":"Socket researchers found 737 Chrome VPN/proxy extensions, many impersonating trusted privacy brands, that route users’ entire browser traffic through SOCKS5 proxies controlled by a single Russian-linked Myxa VPN operation. The campaign targets Russian-speaking users seeking censorship circumvention and exposes their browsing activity while also using DNS-over-HTTPS evasion, fake premium servers, and Chrome Web Store policy evasion.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team identified a campaign of 737 free VPN and proxy extensions published across at least 40 Chrome Web Store developer accounts. Of these, 274 impersonated 66 established VPN and privacy brands, including Proton VPN, NordVPN, Surfshark, Cloudflare’s 1.1.1.1, Google’s Outline, AmneziaVPN, and AntiZapret. The campaign accumulated 75,486 install-count bucket totals, with 516 extensions still active when Socket collected the corpus.\u003c/p\u003e\n\n\u003cp\u003eSocket analyzed code from 522 retrieved extensions and found that 520 configured Chrome to route browser traffic through SOCKS5 proxy infrastructure on port 1082, using a bypass list limited to loopback addresses. The extensions mainly targeted Russian-speaking users seeking access to blocked services such as Instagram, ChatGPT, and YouTube. Socket also found 104 extensions that used Cloudflare and Google DNS-over-HTTPS endpoints to resolve their own proxy hostnames and then gave Chrome raw IP addresses.\u003c/p\u003e\n\n\u003cp\u003eThe report says the extensions placed the operator in a position to observe destinations, TLS SNI values, users’ source IP addresses, and any plain HTTP request contents while connected. Socket also documented non-existent premium server locations, false statements submitted to Chrome Web Store reviewers, post-approval code substitution, and remote configuration behavior. Google had removed 221 of the 737 extensions, but 516 remained live at the time the corpus was collected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team identified 737 free VPN and proxy extensions across at least 40 Chrome Web Store developer accounts, with 274 impersonating 66 established VPN and privacy brands.","Socket analyzed code from 522 retrieved extensions and found that 520 configured Chrome to route browser traffic through the same SOCKS5 proxy infrastructure on port 1082 with only loopback addresses in the bypass list.","The campaign accumulated 75,486 Chrome Web Store install-count bucket totals across all 737 extensions, including 58,318 installs on 516 extensions that were active when the corpus was collected.","The extensions mainly targeted Russian-speaking users seeking access to blocked services, and 690 of 734 extensions in the source dataset were Russian-targeted by at least one of Socket’s tests.","Socket found that all 200 premium server hostnames tested for Japan, Singapore, Canada, Australia, and Turkey returned no A record, while those entries were marked as premium in the shipped server lists."],"insights":["The article emphasizes that the proxy behavior alone is not enough to distinguish a malicious browser VPN from a legitimate one, because a real browser-scoped VPN would also need to use Chrome’s proxy capability; the stronger evidence comes from surrounding conduct such as brand impersonation, fake premium locations, false review justifications, and post-approval code substitution.","DNS blocking alone would not fully disrupt the campaign because 104 extensions resolved their proxy hostnames through Cloudflare and Google DNS-over-HTTPS endpoints and then handed Chrome raw IP addresses instead of domains.","Permission-based review and monitoring can miss meaningful risk changes because 49 extensions received post-approval code updates while the manifest permission set stayed unchanged, including cases where the reviewed and shipped manifests differed only by version and update URL.","Chrome Web Store takedowns did not remove the broader operation, as publishers often retained live extensions after removals and one removed extension had 50 structurally identical live counterparts carrying 3,217 installs.","Clustering extensions by normalized code structure is more effective than relying on extension IDs or file hashes in this campaign because the actor regenerated names, comments, branding, and server lists across logically similar builds."],"referencedReports":[],"body":"\u003cp\u003eSocket’s Threat Research Team identified a campaign of 737 free VPN and proxy extensions published across at least 40 Chrome Web Store developer accounts. Of these, 274 impersonated 66 established VPN and privacy brands, including Proton VPN, NordVPN, Surfshark, Cloudflare’s 1.1.1.1, Google’s Outline, AmneziaVPN, and AntiZapret. The campaign accumulated 75,486 install-count bucket totals, with 516 extensions still active when Socket collected the corpus.\u003c/p\u003e\n\n\u003cp\u003eSocket analyzed code from 522 retrieved extensions and found that 520 configured Chrome to route browser traffic through SOCKS5 proxy infrastructure on port 1082, using a bypass list limited to loopback addresses. The extensions mainly targeted Russian-speaking users seeking access to blocked services such as Instagram, ChatGPT, and YouTube. Socket also found 104 extensions that used Cloudflare and Google DNS-over-HTTPS endpoints to resolve their own proxy hostnames and then gave Chrome raw IP addresses.\u003c/p\u003e\n\n\u003cp\u003eThe report says the extensions placed the operator in a position to observe destinations, TLS SNI values, users’ source IP addresses, and any plain HTTP request contents while connected. Socket also documented non-existent premium server locations, false statements submitted to Chrome Web Store reviewers, post-approval code substitution, and remote configuration behavior. Google had removed 221 of the 737 extensions, but 516 remained live at the time the corpus was collected.\u003c/p\u003e\n"},{"n":16,"title":"Ransomware group hijacks hospital system’s Facebook page amid ongoing cyberattack fallout","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ransomware-group-hijacks-hospital-facebook-amid-cyberattack-response","time":"19:15","priority":"SHOULD READ","score":85,"tldr":"AnMed is still dealing with major disruptions two weeks after a malware attack, while its Facebook page was briefly hijacked to post unverified ransom claims by The Gentlemen ransomware group. The attackers alleged they stole 6 TB of sensitive patient data, but AnMed says it has not confirmed any impact to patient information.","briefOverview":"\u003cp\u003eTwo weeks after a cyberattack knocked out AnMed’s IT systems, the nonprofit medical system is still dealing with closures and an apparent hack of its Facebook page. AnMed operates four hospitals and other clinics in Georgia and South Carolina. The Facebook page was removed shortly after posts appeared claiming to be from “The Gentlemen” ransomware group and showing ransom demands.\u003c/p\u003e\n\n\u003cp\u003eThe hackers claimed they had exfiltrated 6 terabytes of data, including highly sensitive health information related to sexual assault, mental health, abortions and sexual harassment incidents. The article says they did not provide evidence for these claims, and AnMed says it has not confirmed the scope of any potential impact to patient information. AnMed said unauthorized posts were removed, platform access was disabled, and it is working with the provider to secure the accounts.\u003c/p\u003e\n\n\u003cp\u003eAnMed originally described the incident as a cybersecurity disruption involving malware and has continued working to restore systems. As of Monday, 10 facilities remained closed to appointments while the organization continued posting daily updates on open and closed offices. The article also describes The Gentlemen as a prolific ransomware-as-a-service group whose operators have been reported to use edge devices, credential brute-forcing, known vulnerabilities, access brokers, administrator account access, data exfiltration, ransomware deployment and tools to disable endpoint detection and response technology.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two weeks after a cyberattack knocked out AnMed’s IT systems, the nonprofit medical system was still facing facility closures and an apparent hack of its Facebook page.","Posts claiming to be from The Gentlemen ransomware group appeared on AnMed’s Facebook page and alleged the theft of 6 terabytes of data, including highly sensitive health information, but did not provide evidence.","AnMed said the unauthorized social media posts were removed, access through the platform was disabled, and the claims in the posts had not been verified.","As of Monday, 10 AnMed facilities remained closed to appointments while the organization continued daily updates on open and closed offices.","Security firms cited in the article said The Gentlemen has become a prolific ransomware-as-a-service group that often gains access through internet-facing systems and offers affiliates tools to disable endpoint detection and response technology."],"insights":["The alleged hijacking of AnMed’s Facebook page shows how ransomware groups may use a victim’s public communication channels to amplify ransom pressure during an ongoing incident.","The Gentlemen’s reported 90 percent affiliate payout is unusually generous and may help explain why the group has become highly prolific since emerging in the second half of 2025.","The article highlights internet-facing edge systems such as firewalls and VPN appliances as common initial access paths for The Gentlemen’s affiliates.","The group’s tooling appears focused not only on encrypting systems but also on disabling endpoint detection and response products before data theft and ransomware deployment."],"referencedReports":[{"title":"HastaLaMuerte: The Gentlemen RaaS TTPs","url":"https://www.group-ib.com/blog/hastalamuerte-gentlemen-raas-ttps/","publisher":"Group-IB","context":"The article cites Group-IB for the assessment that The Gentlemen was founded by a former Qilin affiliate using the moniker “hastalamuerte.”","category":"research","primary":false},{"title":"Thus Spoke The Gentlemen","url":"https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/","publisher":"Check Point Research","context":"The article cites Check Point for victim-count data and analysis of The Gentlemen’s affiliate fee structure and access methods.","category":"research","primary":false},{"title":"Dragos Industrial Ransomware Analysis: Q2 20
