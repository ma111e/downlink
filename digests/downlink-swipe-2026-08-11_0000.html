<script type="application/json" id="dl-articles">[{"n":3,"title":"Microsoft August 2026 Patch Tuesday fixes 400 flaws, 3 zero-days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-august-2026-patch-tuesday-fixes-400-flaws-3-zero-days/","time":"18:08","priority":"MUST READ","score":96,"tldr":"Microsoft’s August 2026 Patch Tuesday fixes 400 vulnerabilities, including 42 critical flaws and three zero-days. The most urgent is CVE-2026-68820, an actively exploited Windows AFD.sys privilege-escalation bug used by North Korea’s Lazarus group to deploy the FudModule rootkit.","briefOverview":"\u003cp\u003eMicrosoft’s August 2026 Patch Tuesday includes security updates for 400 flaws, including one actively exploited zero-day and two publicly disclosed zero-day vulnerabilities. The release addresses 42 “Critical” vulnerabilities, made up of 37 remote code execution flaws and 5 elevation of privilege flaws. Microsoft said the total only counts fixes released on Patch Tuesday and excludes some flaws in products such as Mariner, Teams, Azure, Entra, Office, and Power Apps that were fixed earlier in the month.\u003c/p\u003e\n\n\u003cp\u003eThe actively exploited zero-day is CVE-2026-68820, a Windows Ancillary Function Driver for WinSock elevation of privilege vulnerability that can grant SYSTEM privileges. Microsoft described it as a use-after-free issue that a locally authenticated attacker could exploit by running a specially crafted application to trigger a race condition, with no user interaction required. Check Point said North Korean threat actors known as Lazarus exploited the flaw to deploy a new version of FudModule, Lazarus’ kernel-mode rootkit.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also fixed two publicly disclosed zero-days: CVE-2026-62832 in the Windows User Profile Service and CVE-2026-72971 in the Windows Container Isolation FS Filter Driver, unionfs.sys. The Windows User Profile Service issue involves improper link resolution before file access and can allow an authenticated attacker with credentials for another local account to access or modify another user’s data and gain administrator privileges. The article also notes that other vendors, including Adobe, Cisco, Metabase, N-able, SAP, TP-Link, and VMware, released security updates or advisories in August 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s August 2026 Patch Tuesday includes security updates for 400 flaws, including one actively exploited zero-day and two publicly disclosed zero-day vulnerabilities.","The updates address 42 critical vulnerabilities, consisting of 37 remote code execution flaws and 5 elevation of privilege flaws.","The actively exploited zero-day, CVE-2026-68820, is a Windows Ancillary Function Driver for WinSock vulnerability that can allow a locally authenticated attacker to gain SYSTEM privileges.","Check Point reported that North Korean threat actors known as Lazarus exploited CVE-2026-68820 to deploy a new version of the FudModule kernel-mode rootkit.","Microsoft also fixed two publicly disclosed zero-days: CVE-2026-62832 in Windows User Profile Service and CVE-2026-72971 in Windows Container Isolation FS Filter Driver unionfs.sys."],"insights":["Microsoft says the 400-flaw total excludes vulnerabilities in several products that were fixed earlier in the month, so organizations may need to review more than just the Patch Tuesday release to account for all recent Microsoft fixes.","Microsoft linked the high volume of recent Patch Tuesday fixes to its use of an AI-powered vulnerability discovery system, indicating that larger-than-usual monthly update batches may continue.","CVE-2026-68820 does not require user interaction, but it does require local authentication, making it especially relevant after an attacker has already gained some access to a Windows system.","The publicly disclosed Windows User Profile Service flaw matches the previously reported “LegacyHive” issue, which was described as allowing non-admin users to trigger administrator-level command execution when an admin logs into a compromised device."],"referencedReports":[{"title":"CVE-2026-68820 - Windows Ancillary Function Driver for WinSock Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-68820","publisher":"Microsoft","context":"The article links to Microsoft’s advisory for the actively exploited Windows AFD.sys zero-day fixed in the August 2026 Patch Tuesday updates.","category":"advisory","primary":true},{"title":"Shattering the Dream: When a Job Offer Becomes a Zero-Day Attack","url":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","publisher":"Check Point","context":"The article cites Check Point’s report saying Lazarus exploited CVE-2026-68820 to deploy a new version of the FudModule kernel-mode rootkit.","category":"research","primary":true},{"title":"CVE-2026-62832 - Windows User Profile Service Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62832","publisher":"Microsoft","context":"The article links to Microsoft’s advisory for a publicly disclosed Windows User Profile Service elevation of privilege flaw fixed in the update.","category":"advisory","primary":true},{"title":"CVE-2026-72971 - Windows Container Isolation FS Filter Driver (unionfs.sys) Tampering Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-72971","publisher":"Microsoft","context":"The article links to Microsoft’s advisory for a publicly disclosed Windows Container Isolation FS Filter Driver tampering flaw fixed in the update.","category":"advisory","primary":true},{"title":"Adobe Security Bulletins and Advisories","url":"https://helpx.adobe.com/security/security-bulletin.html","publisher":"Adobe","context":"The article notes that Adobe released security updates for vulnerabilities in ColdFusion, Commerce, Lightroom Classic, Content Credentials SDK, and Campaign Classic.","category":"advisory","primary":false},{"title":"Cisco Security Advisories","url":"https://sec.cloudapps.cisco.com/security/center/publicationListing.x","publisher":"Cisco","context":"The article notes that Cisco released security updates for numerous products, including Cisco Catalyst SD-WAN, IOS, IOS XE, and ClamAV.","category":"advisory","primary":false},{"title":"GHSA-vwf4-m7j8-wcjf","url":"http://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf","publisher":"Metabase","context":"The article says Metabase released security updates for a critical SQL injection flaw that was exploited in data-theft attacks.","category":"advisory","primary":false},{"title":"August 2026 Security Notes","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html?isu_page=1","publisher":"SAP","context":"The article notes that SAP released August security updates for numerous products, including a 10.0-severity flaw in SAP Commerce Cloud Data Hub Adapter.","category":"advisory","primary":false},{"title":"VMware Security Advisory VMSA-2026-0005","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926?utm_campaign=VCF_FY26_VCF_VMSA-2026-0005_MKT_CM_6254\u0026utm_content=VCF_FY26_VCF_VMSA-2026-0005_6254_SecurityAlert_MKT_TRANS_EM_12268","publisher":"VMware","context":"The article says VMware released security updates for VMware Avi Load Balancer covering authentication bypasses and remote code execution flaws.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft’s August 2026 Patch Tuesday includes security updates for 400 flaws, including one actively exploited zero-day and two publicly disclosed zero-day vulnerabilities. The release addresses 42 “Critical” vulnerabilities, made up of 37 remote code execution flaws and 5 elevation of privilege flaws. Microsoft said the total only counts fixes released on Patch Tuesday and excludes some flaws in products such as Mariner, Teams, Azure, Entra, Office, and Power Apps that were fixed earlier in the month.\u003c/p\u003e\n\n\u003cp\u003eThe actively exploited zero-day is CVE-2026-68820, a Windows Ancillary Function Driver for WinSock elevation of privilege vulnerability that can grant SYSTEM privileges. Microsoft described it as a use-after-free issue that a locally authenticated attacker could exploit by running a specially crafted application to trigger a race condition, with no user interaction required. Check Point said North Korean threat actors known as Lazarus exploited the flaw to deploy a new version of FudModule, Lazarus’ kernel-mode rootkit.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also fixed two publicly disclosed zero-days: CVE-2026-62832 in the Windows User Profile Service and CVE-2026-72971 in the Windows Container Isolation FS Filter Driver, unionfs.sys. The Windows User Profile Service issue involves improper link resolution before file access and can allow an authenticated attacker with credentials for another local account to access or modify another user’s data and gain administrator privileges. The article also notes that other vendors, including Adobe, Cisco, Metabase, N-able, SAP, TP-Link, and VMware, released security updates or advisories in August 2026.\u003c/p\u003e\n"},{"n":27,"title":"Microsoft Patches 398 Flaws Including a Windows Driver Zero-Day Under Active Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/microsoft-patches-398-flaws-including.html","time":"20:10","priority":"MUST READ","score":96,"tldr":"Microsoft’s latest Patch Tuesday fixes 398 flaws, led by an actively exploited Windows afd.sys kernel driver zero-day that can let attackers with local code execution escalate to SYSTEM. Admins should prioritize that patch, then address exposed unauthenticated RCE flaws in DNS Server, WDS, QUIC, HPC Pack, and ensure SharePoint has both July and August fixes.","briefOverview":"\u003cp\u003eMicrosoft released its monthly security updates, fixing 398 new CVEs according to the Zero Day Initiative, including 62 rated Critical. The top priority is CVE-2026-68820, a Windows afd.sys kernel driver flaw that Microsoft says is under active exploitation. The flaw can let an attacker who already has code running on a machine escalate privileges to SYSTEM.\u003c/p\u003e\n\n\u003cp\u003eCheck Point Research said CVE-2026-68820 is a use-after-free in the Ancillary Function Driver for WinSock and that Lazarus used it in the Operation Dream Job campaign. Microsoft has not publicly attributed the exploitation. The release also includes four unauthenticated remote code execution flaws with CVSS scores of 9.8 affecting Windows DNS Server, Windows Deployment Services, Microsoft QUIC, and HPC Pack.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that patch priority should account for exploit status, service exposure, and whether affected services are present in an environment. It also notes that the August release closes CVE-2026-63520, the remote code execution half of a SharePoint chain whose authentication bypass, CVE-2026-55040, was fixed in July. On-premises SharePoint farms should have both the July authentication-bypass fix and the August RCE fix installed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released monthly security updates addressing 398 new CVEs, including 62 rated Critical according to the Zero Day Initiative.","CVE-2026-68820 is an actively exploited Windows afd.sys kernel driver flaw that can allow an attacker with code already running on a machine to escalate privileges to SYSTEM.","Check Point Research said Lazarus used CVE-2026-68820 in its Operation Dream Job campaign, but Microsoft has not publicly attributed the exploitation.","The release fixes four unauthenticated remote code execution flaws affecting Windows DNS Server, Windows Deployment Services, Microsoft QUIC, and HPC Pack, each with a CVSS score of 9.8.","The August update fixes CVE-2026-63520, the remote code execution part of a SharePoint exploit chain whose authentication bypass, CVE-2026-55040, was fixed in July."],"insights":["Microsoft’s patch priority is not determined by CVSS score alone, since the actively exploited CVE-2026-68820 is prioritized ahead of four 9.8-rated server flaws because attackers are already using it.","Service inventory and internet reachability are critical for prioritization, because the practical risk from the DNS Server, WDS, QUIC, and HPC Pack flaws depends on whether those services are present and exposed in a given environment.","The Zero Day Initiative’s description of the Windows DNS Server flaw as “wormable” reflects a technical condition, but the article explicitly notes that this does not mean a worm currently exists.","For on-premises SharePoint, the July patch for CVE-2026-55040 already broke Rapid7’s demonstrated unauthenticated RCE chain, while the August patch closes the separate RCE component."],"referencedReports":[{"title":"Shattering the Dream: When a Job Offer Becomes a Zero-Day Attack","url":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","publisher":"Check Point Research","context":"The article cites Check Point Research as saying Lazarus used CVE-2026-68820 in its Operation Dream Job campaign and describing the flaw as a use-after-free in afd.sys.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft released its monthly security updates, fixing 398 new CVEs according to the Zero Day Initiative, including 62 rated Critical. The top priority is CVE-2026-68820, a Windows afd.sys kernel driver flaw that Microsoft says is under active exploitation. The flaw can let an attacker who already has code running on a machine escalate privileges to SYSTEM.\u003c/p\u003e\n\n\u003cp\u003eCheck Point Research said CVE-2026-68820 is a use-after-free in the Ancillary Function Driver for WinSock and that Lazarus used it in the Operation Dream Job campaign. Microsoft has not publicly attributed the exploitation. The release also includes four unauthenticated remote code execution flaws with CVSS scores of 9.8 affecting Windows DNS Server, Windows Deployment Services, Microsoft QUIC, and HPC Pack.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that patch priority should account for exploit status, service exposure, and whether affected services are present in an environment. It also notes that the August release closes CVE-2026-63520, the remote code execution half of a SharePoint chain whose authentication bypass, CVE-2026-55040, was fixed in July. On-premises SharePoint farms should have both the July authentication-bypass fix and the August RCE fix installed.\u003c/p\u003e\n"},{"n":41,"title":"Shattering the Dream – When a Job Offer Becomes a Zero-Day Attack","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","time":"17:30","priority":"MUST READ","score":96,"tldr":"Check Point says Lazarus’ Operation Dream Job is targeting defense, aerospace, and aviation organizations with fake job lures, trojanized PDF viewers, and new malware including Troy and RelayShell. The campaign also used a Windows AFD.sys zero-day, CVE-2026-68820, to deploy the FudModule rootkit for SYSTEM privileges and EDR evasion.","briefOverview":"\u003cp\u003eCheck Point Research is tracking a long-running Lazarus-affiliated campaign called \u003cstrong\u003eOperation Dream Job\u003c/strong\u003e that targets organizations worldwide, with a particular focus on the defense sector. The latest wave focuses on the defense sector in Europe and India, especially companies in aerospace and aviation. The campaign uses fake job opportunities to convince victims to download malicious files.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two active infection chains: one using DLL sideloading with a legitimate PDF viewer and malicious DLL, and another using \u003cstrong\u003eSecurityPDF\u003c/strong\u003e, a trojanized PDF viewer that executes encrypted payloads from crafted PDF documents. The attackers deployed malware including \u003cstrong\u003eMISTPEN\u003c/strong\u003e, \u003cstrong\u003eForestTiger\u003c/strong\u003e, the newly identified \u003cstrong\u003eTroy\u003c/strong\u003e backdoor, \u003cstrong\u003eFudModule\u003c/strong\u003e, and \u003cstrong\u003eRelayShell\u003c/strong\u003e. They also used impersonation websites and search engine optimization to distribute the trojanized viewer.\u003c/p\u003e\n\n\u003cp\u003eDuring the intrusion, the threat actor exploited \u003cstrong\u003eCVE-2026-68820\u003c/strong\u003e, a zero-day vulnerability in Microsoft’s \u003cstrong\u003eAFD.sys\u003c/strong\u003e driver, to deploy a new version of the \u003cstrong\u003eFudModule\u003c/strong\u003e kernel-mode rootkit with SYSTEM privileges and reduce EDR visibility. Check Point Research disclosed the issue to Microsoft, which released a patch on August 11, 2026. The attackers also compromised Roundcube, WordPress, and PrestaShop servers, using \u003cstrong\u003eRelayShell\u003c/strong\u003e webshells to turn them into command-and-control relay nodes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research is tracking a Lazarus-affiliated Operation Dream Job campaign that targets organizations worldwide, with a particular focus on the defense sector in Europe and India.","The campaign uses fake job opportunities to deliver malicious files, including DLL sideloading packages and a trojanized PDF viewer called SecurityPDF that executes payloads from specially crafted PDF documents.","During the intrusion, the threat actor exploited CVE-2026-68820, a zero-day vulnerability in Microsoft’s AFD.sys driver, to deploy a new version of the FudModule kernel-mode rootkit with SYSTEM privileges.","The attackers used compromised Roundcube, WordPress, and PrestaShop servers as command-and-control infrastructure, including RelayShell PHP webshells deployed on vulnerable Roundcube servers.","The campaign deployed multiple malware components, including MISTPEN, ForestTiger, the newly identified Troy backdoor, FudModule, and RelayShell."],"insights":["The attackers separated the malicious PDF document from the trojanized PDF viewer and used impersonation websites with search engine optimization, which the article says likely reduced the likelihood of detection compared with a single phishing attachment.","The new FudModule version no longer includes a dedicated Microsoft Defender-disabling stage, but it can still blind Microsoft Defender through a generic security-product suppression engine used against multiple vendors.","The article reports that FudModule v3.1 specifically checks for newer Windows 11 builds 26100 and 26200, making the campaign relevant to fully patched and current Windows 11 environments before Microsoft’s August 11, 2026 fix.","RelayShell was designed mainly as a relay between infected endpoints and operators rather than as a traditional direct command-execution webshell, allowing compromised web servers to blend into the attacker’s command-and-control infrastructure.","At least one compromised organization in France was reused to send spear-phishing messages to additional targets, showing that trusted victim infrastructure became part of the campaign’s delivery mechanism."],"referencedReports":[{"title":"Operation Dream Job","url":"https://www.clearskysec.com/operation-dream-job/","publisher":"ClearSky Cyber Security","context":"The article links to ClearSky’s prior Operation Dream Job research when introducing the long-running campaign.","category":"research","primary":false},{"title":"Gotta Fly: Lazarus Targets UAV Sector","url":"https://www.welivesecurity.com/en/eset-research/gotta-fly-lazarus-targets-uav-sector/","publisher":"ESET","context":"The article says the July 2026 infection chain shares many characteristics with an Operation Dream Job campaign described by ESET in 2025.","category":"research","primary":false},{"title":"UNC2970 Backdoor Deployment Using Trojanized PDF Reader","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc2970-backdoor-trojanized-pdf-reader?hl=en","publisher":"Mandiant","context":"The article cites Mandiant as first documenting MISTPEN in 2024.","category":"research","primary":false},{"title":"Lazarus FudModule v3","url":"https://www.gendigital.com/blog/insights/research/lazarus-fudmodule-v3","publisher":"Gen Digital","context":"The article compares the newly observed FudModule behavior with FudModule v3 reported by Gen Digital in 2024.","category":"research","primary":false},{"title":"CVE-2025-60719","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-60719","publisher":"Microsoft Security Response Center","context":"The article references Microsoft’s CVE-2025-60719 page when comparing the newly discovered AFD.sys issue to a previously fixed vulnerability.","category":"advisory","primary":false}],"body":"\u003cp\u003eCheck Point Research is tracking a long-running Lazarus-affiliated campaign called \u003cstrong\u003eOperation Dream Job\u003c/strong\u003e that targets organizations worldwide, with a particular focus on the defense sector. The latest wave focuses on the defense sector in Europe and India, especially companies in aerospace and aviation. The campaign uses fake job opportunities to convince victims to download malicious files.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two active infection chains: one using DLL sideloading with a legitimate PDF viewer and malicious DLL, and another using \u003cstrong\u003eSecurityPDF\u003c/strong\u003e, a trojanized PDF viewer that executes encrypted payloads from crafted PDF documents. The attackers deployed malware including \u003cstrong\u003eMISTPEN\u003c/strong\u003e, \u003cstrong\u003eForestTiger\u003c/strong\u003e, the newly identified \u003cstrong\u003eTroy\u003c/strong\u003e backdoor, \u003cstrong\u003eFudModule\u003c/strong\u003e, and \u003cstrong\u003eRelayShell\u003c/strong\u003e. They also used impersonation websites and search engine optimization to distribute the trojanized viewer.\u003c/p\u003e\n\n\u003cp\u003eDuring the intrusion, the threat actor exploited \u003cstrong\u003eCVE-2026-68820\u003c/strong\u003e, a zero-day vulnerability in Microsoft’s \u003cstrong\u003eAFD.sys\u003c/strong\u003e driver, to deploy a new version of the \u003cstrong\u003eFudModule\u003c/strong\u003e kernel-mode rootkit with SYSTEM privileges and reduce EDR visibility. Check Point Research disclosed the issue to Microsoft, which released a patch on August 11, 2026. The attackers also compromised Roundcube, WordPress, and PrestaShop servers, using \u003cstrong\u003eRelayShell\u003c/strong\u003e webshells to turn them into command-and-control relay nodes.\u003c/p\u003e\n"},{"n":48,"title":"Tracking Shai-Hulud: Inside the ChainDrop NPM Worm","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/tracking-shai-hulud-inside-chaindrop-npm-worm","time":"21:21","priority":"MUST READ","score":96,"tldr":"ChainDrop is a self-propagating npm worm that abused a compromised maintainer account and trusted GitHub Actions release pipelines to publish malicious packages with valid provenance, then stole developer tokens to spread to more than 400 packages. Its use of Ethereum-based C2, IDE/AI-tool persistence hooks, and destructive token-revocation behavior shows that signed builds and SLSA attestations alone cannot guarantee package safety.","briefOverview":"\u003cp\u003eOn August 4, 2026, a self-propagating worm called ChainDrop entered the npm ecosystem through a compromised maintainer account in the keyv ecosystem. The attacker injected malicious code into the legitimate source repositories and triggered GitHub Actions release workflows to publish poisoned versions of packages including keyv, cacheable, flat-cache, and file-entry-cache. Aikido Security researchers found that the worm propagated to more than 400 packages.\u003c/p\u003e\n\n\u003cp\u003eChainDrop is significant because some malicious packages, most notably keyv@6.0.0, carried authentic SLSA provenance attestations after being built and published by the legitimate repository workflow. The article emphasizes that a signed origin does not guarantee safe content when the attacker controls the source repository or build process. The worm spread by stealing npm tokens and republishing infected versions of every package those tokens could reach, reaching a peak of roughly one infected package per second.\u003c/p\u003e\n\n\u003cp\u003eTechnically, ChainDrop used a preinstall hook to run setup.mjs, download the Bun runtime, and execute the obfuscated Math_Symbol.js payload. The payload harvested credentials including npm tokens, GitHub credentials, cloud keys, Kubernetes credentials, HashiCorp Vault tokens, SSH keys, and AI tooling credentials, then exfiltrated stolen data through GitHub dead-drop repositories or fallback Ethereum-based command-and-control. The worm also planted persistence hooks in Claude Code and Visual Studio Code configuration files and included a token-revocation trap that could wipe a victim’s home directory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 4, 2026, ChainDrop entered the npm ecosystem through a compromised maintainer account in the keyv ecosystem and triggered legitimate GitHub Actions release workflows to publish poisoned package versions.","Some infected packages, most notably keyv@6.0.0, were published to npm with authentic SLSA provenance attestations because the build originated from the legitimate repository and workflow.","ChainDrop stole npm tokens and other developer credentials, then used valid publishing rights to republish infected versions of packages, spreading to more than 400 packages in under four hours.","The worm used an Ethereum smart contract to retrieve active command-and-control domains, allowing the attacker to rotate domains without changing the deployed malware.","ChainDrop planted persistence hooks in Claude Code and Visual Studio Code configuration files and included a token-revocation trap that could trigger deletion of the victim’s home directory."],"insights":["Valid SLSA or Sigstore provenance did not distinguish the malicious releases from clean ones because the attacker controlled the legitimate source repository and release workflow.","Domain blocklists and DNS sinkholes were weakened because ChainDrop retrieved fallback command-and-control domains from an Ethereum smart contract that could be updated with a blockchain transaction.","Removing the malicious package or using npm install with --ignore-scripts was insufficient because ChainDrop also planted hooks in IDE and AI-agent configuration files that could re-execute the payload when a project was opened.","Revoking exposed tokens could trigger a destructive response from the worm, so incident response had to account for the article’s described token-monitoring process and possible home-directory wipe.","AI-based package scanning pipelines could be manipulated because earlier related variants embedded prompt-injection instructions, and the article recommends treating scanner refusals or missing verdicts as escalation signals rather than clean results."],"referencedReports":[],"body":"\u003cp\u003eOn August 4, 2026, a self-propagating worm called ChainDrop entered the npm ecosystem through a compromised maintainer account in the keyv ecosystem. The attacker injected malicious code into the legitimate source repositories and triggered GitHub Actions release workflows to publish poisoned versions of packages including keyv, cacheable, flat-cache, and file-entry-cache. Aikido Security researchers found that the worm propagated to more than 400 packages.\u003c/p\u003e\n\n\u003cp\u003eChainDrop is significant because some malicious packages, most notably keyv@6.0.0, carried authentic SLSA provenance attestations after being built and published by the legitimate repository workflow. The article emphasizes that a signed origin does not guarantee safe content when the attacker controls the source repository or build process. The worm spread by stealing npm tokens and republishing infected versions of every package those tokens could reach, reaching a peak of roughly one infected package per second.\u003c/p\u003e\n\n\u003cp\u003eTechnically, ChainDrop used a preinstall hook to run setup.mjs, download the Bun runtime, and execute the obfuscated Math_Symbol.js payload. The payload harvested credentials including npm tokens, GitHub credentials, cloud keys, Kubernetes credentials, HashiCorp Vault tokens, SSH keys, and AI tooling credentials, then exfiltrated stolen data through GitHub dead-drop repositories or fallback Ethereum-based command-and-control. The worm also planted persistence hooks in Claude Code and Visual Studio Code configuration files and included a token-revocation trap that could wipe a victim’s home directory.\u003c/p\u003e\n"},{"n":36,"title":"Microsoft's August 2026 Patch Tuesday Addresses 398 CVEs (CVE-2026-68820)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsofts-august-2026-patch-tuesday-addresses-398-cves-cve-2026-68820","time":"18:04","priority":"MUST READ","score":95,"tldr":"Microsoft’s August 2026 Patch Tuesday fixes 398 CVEs, including 42 critical flaws and three zero-days. The top priority is CVE-2026-68820, a Windows Ancillary Function Driver for WinSock elevation-of-privilege vulnerability already exploited in the wild to gain SYSTEM privileges.","briefOverview":"\u003cp\u003eMicrosoft patched 398 CVEs in its August 2026 Patch Tuesday release. The update included 42 vulnerabilities rated critical, 355 rated important, and one rated moderate, with Tenable noting that its counts omitted two MITRE-assigned CVEs, CVE-2026-6726 and CVE-2026-6727. Microsoft said the release included three zero-days, including one vulnerability that was exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe exploited zero-day is CVE-2026-68820, an elevation of privilege vulnerability in the Windows Ancillary Function Driver for WinSock with a CVSSv3 score of 7.0. A local attacker could exploit it to elevate to SYSTEM privileges, and Microsoft also patched two additional elevation of privilege vulnerabilities in the same driver, CVE-2026-61348 and CVE-2026-70307. Another publicly disclosed issue, CVE-2026-62832 in Windows User Profile Service, could allow a local attacker to gain ADMINISTRATOR privileges and was assessed as “Exploitation More Likely.”\u003c/p\u003e\n\n\u003cp\u003eThe release also included critical remote code execution flaws such as CVE-2026-62893 in Windows Deployment Services TFTP Server and CVE-2026-62823 in Windows DHCP Server. CVE-2026-62893 could allow a remote, unauthenticated attacker to execute code by sending crafted packets to a vulnerable service, while CVE-2026-62823 involves a heap-based buffer overflow using a crafted packet over an adjacent network. Microsoft also patched 29 CVEs affecting Microsoft Office SharePoint, including three rated critical and three assessed as “Exploitation More Likely,” and Tenable recommended patching systems as soon as possible and scanning environments to find unpatched systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched 398 CVEs in its August 2026 Patch Tuesday release, including 42 rated critical, 355 rated important, and one rated moderate.","The August 2026 update included three zero-days, including CVE-2026-68820, a Windows Ancillary Function Driver for WinSock elevation of privilege vulnerability that Microsoft said was exploited in the wild.","CVE-2026-62832 is a Windows User Profile Service elevation of privilege vulnerability that was publicly disclosed before a patch was available and was assessed as “Exploitation More Likely.”","CVE-2026-62893 is a critical Windows Deployment Services TFTP Server remote code execution vulnerability with a CVSSv3 score of 9.8 that could allow a remote, unauthenticated attacker to execute code by sending crafted packets to a vulnerable service.","Microsoft patched 29 CVEs affecting Microsoft Office SharePoint, including three rated critical and three assessed as “Exploitation More Likely.”"],"insights":["Elevation of privilege flaws made up the largest share of the August 2026 Patch Tuesday release at 40.7%, which means many fixes address ways attackers could gain higher access after already reaching a system.","The Windows Ancillary Function Driver for WinSock continues to be a recurring zero-day target, with the article citing prior zero-days in the same driver in August 2024, February 2025, May 2025, and now August 2026.","The Windows DHCP Server received one critical remote code execution fix plus 13 additional important fixes in the same release, making it a concentrated area of patching this month.","SharePoint administrators have an unusually large patching workload in this release, with 29 SharePoint CVEs spanning spoofing, remote code execution, elevation of privilege, information disclosure, and tampering issues.","Microsoft assessed the publicly disclosed Windows Container Isolation FS Filter Driver tampering flaw as “Exploitation Unlikely,” making it lower priority than the publicly disclosed Windows User Profile Service flaw assessed as “Exploitation More Likely.”"],"referencedReports":[{"title":"Microsoft's August 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-Aug","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s August 2026 security updates as the source for the Patch Tuesday fixes covering 398 CVEs.","category":"advisory","primary":true},{"title":"CVE-2026-68820 | Windows Ancillary Function Driver for WinSock Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-68820","publisher":"Microsoft Security Response Center","context":"The article discusses this MSRC advisory as the zero-day Windows Ancillary Function Driver for WinSock flaw exploited in the wild.","category":"advisory","primary":true},{"title":"CVE-2026-62832 | Windows User Profile Service Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-62832","publisher":"Microsoft Security Response Center","context":"The article references this MSRC advisory for a publicly disclosed Windows User Profile Service flaw assessed as “Exploitation More Likely.”","category":"advisory","primary":true},{"title":"CVE-2026-72971 | Windows Container Isolation FS Filter Driver Tampering Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-72971","publisher":"Microsoft Security Response Center","context":"The article references this MSRC advisory for a publicly disclosed tampering vulnerability in the Windows Container Isolation FS Filter Driver.","category":"advisory","primary":true},{"title":"CVE-2026-62893 | Windows Deployment Services TFTP Server Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-62893","publisher":"Microsoft Security Response Center","context":"The article cites this MSRC advisory for a critical Windows Deployment Services TFTP Server remote code execution flaw assessed as “Exploitation More Likely.”","category":"advisory","primary":true},{"title":"CVE-2026-62823 | Windows DHCP Server Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-62823","publisher":"Microsoft Security Response Center","context":"The article cites this MSRC advisory for a critical Windows DHCP Server remote code execution vulnerability involving a heap-based buffer overflow.","category":"advisory","primary":true},{"title":"Microsoft Exploitability Index","url":"https://www.microsoft.com/en-us/msrc/exploitability-index","publisher":"Microsoft Security Response Center","context":"The article uses Microsoft’s Exploitability Index to describe whether several vulnerabilities are considered more or less likely to be exploited.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft patched 398 CVEs in its August 2026 Patch Tuesday release. The update included 42 vulnerabilities rated critical, 355 rated important, and one rated moderate, with Tenable noting that its counts omitted two MITRE-assigned CVEs, CVE-2026-6726 and CVE-2026-6727. Microsoft said the release included three zero-days, including one vulnerability that was exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe exploited zero-day is CVE-2026-68820, an elevation of privilege vulnerability in the Windows Ancillary Function Driver for WinSock with a CVSSv3 score of 7.0. A local attacker could exploit it to elevate to SYSTEM privileges, and Microsoft also patched two additional elevation of privilege vulnerabilities in the same driver, CVE-2026-61348 and CVE-2026-70307. Another publicly disclosed issue, CVE-2026-62832 in Windows User Profile Service, could allow a local attacker to gain ADMINISTRATOR privileges and was assessed as “Exploitation More Likely.”\u003c/p\u003e\n\n\u003cp\u003eThe release also included critical remote code execution flaws such as CVE-2026-62893 in Windows Deployment Services TFTP Server and CVE-2026-62823 in Windows DHCP Server. CVE-2026-62893 could allow a remote, unauthenticated attacker to execute code by sending crafted packets to a vulnerable service, while CVE-2026-62823 involves a heap-based buffer overflow using a crafted packet over an adjacent network. Microsoft also patched 29 CVEs affecting Microsoft Office SharePoint, including three rated critical and three assessed as “Exploitation More Likely,” and Tenable recommended patching systems as soon as possible and scanning environments to find unpatched systems.\u003c/p\u003e\n"},{"n":43,"title":"Microsoft Patch Tuesday for August 2026 — Snort rules and prominent vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-patch-tuesday-for-august-2026/","time":"22:21","priority":"MUST READ","score":95,"tldr":"Microsoft’s August 2026 Patch Tuesday fixes 421 vulnerabilities, including 62 critical flaws and one Windows Ancillary Function Driver for WinSock privilege escalation bug already exploited in the wild. Cisco Talos released new Snort rules to help detect exploitation attempts for selected vulnerabilities.","briefOverview":"\u003cp\u003eMicrosoft released its August 2026 monthly security update, addressing 421 vulnerabilities across a range of products. Microsoft marked 62 of the vulnerabilities as critical, and 40 of those critical issues are remote code execution vulnerabilities. Microsoft also noted that one vulnerability disclosed this month, CVE-2026-68820 in the Windows Ancillary Function Driver for WinSock, has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several critical vulnerabilities that Microsoft considers more likely to be exploited, including flaws in Windows Deployment Services TFTP Server, Microsoft SharePoint Server, and Windows DHCP Server. It also lists many critical issues considered less likely or unlikely to be exploited, affecting products such as Microsoft Excel, Microsoft Office, Exchange Server, Windows DNS Server, Windows Device Health Attestation, Azure services, Microsoft Teams, and Microsoft QUIC. Impacts described in the article include remote code execution, elevation of privilege, information disclosure, and spoofing.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos also identified several important vulnerabilities that Microsoft rates as more likely to be exploited, including issues in Visual Studio Code, SharePoint Server, Microsoft High Performance Computing Pack, Windows TCP/IP, Windows Kernel, Windows HTTP.sys, Kerberos, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article provides Snort 2 and Snort 3 rule coverage identifiers and notes that additional rules may be released later.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s August 2026 security update addresses 421 vulnerabilities across multiple products, including 62 marked as critical.","Microsoft stated that CVE-2026-68820, an elevation of privilege vulnerability in the Windows Ancillary Function Driver for WinSock, has been exploited in the wild.","Of the 62 critical vulnerabilities, 40 are remote code execution vulnerabilities.","Microsoft assessed exploitation as more likely for critical vulnerabilities affecting Windows Deployment Services TFTP Server, Microsoft SharePoint Server, and Windows DHCP Server.","Cisco Talos released a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities."],"insights":["The only vulnerability Microsoft says has been exploited in the wild this month is not one of the highest-scoring flaws; CVE-2026-68820 has a CVSS base score of 7.0 and affects the Windows Ancillary Function Driver for WinSock.","Several vulnerabilities with very high CVSS scores, including CVE-2026-56162, CVE-2026-63508, and CVE-2026-65667 with 10.0 scores, are listed under “other critical vulnerabilities” rather than among the flaws Microsoft considers more likely to be exploited.","Microsoft’s “more likely” critical vulnerabilities include network-reachable flaws in Windows Deployment Services TFTP Server, SharePoint Server, and Windows DHCP Server, giving defenders specific server-side products to prioritize.","Talos highlights many “important” vulnerabilities as more likely to be exploited, showing that Microsoft’s exploitation likelihood is not limited to vulnerabilities marked critical.","Cisco Talos provided specific Snort 2 and Snort 3 rule coverage identifiers, allowing users of those rule sets to verify whether they have detection coverage for some of the disclosed vulnerabilities."],"referencedReports":[{"title":"Microsoft Security Update Guide","url":"https://msrc.microsoft.com/update-guide/","publisher":"Microsoft","context":"The article says Microsoft’s update page contains the complete list of vulnerabilities disclosed in the August 2026 security update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released its August 2026 monthly security update, addressing 421 vulnerabilities across a range of products. Microsoft marked 62 of the vulnerabilities as critical, and 40 of those critical issues are remote code execution vulnerabilities. Microsoft also noted that one vulnerability disclosed this month, CVE-2026-68820 in the Windows Ancillary Function Driver for WinSock, has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several critical vulnerabilities that Microsoft considers more likely to be exploited, including flaws in Windows Deployment Services TFTP Server, Microsoft SharePoint Server, and Windows DHCP Server. It also lists many critical issues considered less likely or unlikely to be exploited, affecting products such as Microsoft Excel, Microsoft Office, Exchange Server, Windows DNS Server, Windows Device Health Attestation, Azure services, Microsoft Teams, and Microsoft QUIC. Impacts described in the article include remote code execution, elevation of privilege, information disclosure, and spoofing.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos also identified several important vulnerabilities that Microsoft rates as more likely to be exploited, including issues in Visual Studio Code, SharePoint Server, Microsoft High Performance Computing Pack, Windows TCP/IP, Windows Kernel, Windows HTTP.sys, Kerberos, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article provides Snort 2 and Snort 3 rule coverage identifiers and notes that additional rules may be released later.\u003c/p\u003e\n"},{"n":12,"title":"CISA: Microsoft SharePoint flaw now exploited in ransomware attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-microsoft-sharepoint-flaw-now-exploited-in-ransomware-attacks/","time":"12:12","priority":"MUST READ","score":94,"tldr":"CISA says ransomware gangs are now exploiting CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution flaw affecting unpatched servers. Organizations should urgently apply Microsoft’s patches and monitor SharePoint systems for compromise.","briefOverview":"\u003cp\u003eCISA confirmed that ransomware gangs have begun abusing CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability. The flaw has been flagged as actively exploited since early July and affects unpatched SharePoint servers. Microsoft has not yet updated its CVE-2026-45659 advisory to mark the vulnerability as exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from deserialization of untrusted data and allows attackers with low privileges to execute arbitrary code. Microsoft previously said the flaw can be exploited in low-complexity attacks because attackers do not need significant prior knowledge of the system and can achieve repeatable success against the vulnerable component. Security updates were released in May for SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog on July 1 and ordered Federal Civilian Executive Branch agencies to secure their servers within three days. CISA also urged security teams to monitor affected servers, apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, enable AMSI integration for SharePoint web applications, and use Microsoft Defender Antivirus detections. Shadowserver currently tracks over 8,500 Microsoft SharePoint servers exposed online, with over 200 unpatched against this vulnerability.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA confirmed that ransomware gangs have begun abusing CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability that has been flagged as actively exploited since early July.","CVE-2026-45659 stems from deserialization of untrusted data and allows attackers with low privileges to execute arbitrary code on unpatched SharePoint servers.","CISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog on July 1 and ordered Federal Civilian Executive Branch agencies to secure their servers within three days.","Shadowserver currently tracks over 8,500 Microsoft SharePoint servers exposed online, with over 200 of them unpatched against CVE-2026-45659.","Microsoft has not yet updated the CVE-2026-45659 advisory to mark the flaw as exploited, despite CISA flagging it as abused by ransomware gangs."],"insights":["CISA’s ransomware warning raises the urgency beyond routine patching because the same SharePoint flaw had already been treated as actively exploited and given a three-day federal remediation deadline in July.","The article highlights a gap between government and vendor tracking: CISA flags CVE-2026-45659 as actively exploited and used in ransomware campaigns, while Microsoft has not yet updated its advisory to confirm in-the-wild exploitation.","CISA’s recommendations go beyond installing patches, emphasizing verification of patch success, shorter patching cycles, SharePoint AMSI integration, and Microsoft Defender Antivirus detections to find and remediate compromise.","SharePoint has been a repeated ransomware target, with CISA flagging 14 actively exploited Microsoft SharePoint vulnerabilities since November 2021 and eight of them also exploited in ransomware attacks."],"referencedReports":[{"title":"Known Exploited Vulnerabilities Catalog: CVE-2026-45659","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-45659#:~:text=Known%20To%20Be%20Used%20in%20Ransomware%20Campaigns%3F%20Known","publisher":"CISA","context":"The article cites CISA’s KEV Catalog update as the source for CVE-2026-45659 being flagged as used in ransomware campaigns.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA confirmed that ransomware gangs have begun abusing CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability. The flaw has been flagged as actively exploited since early July and affects unpatched SharePoint servers. Microsoft has not yet updated its CVE-2026-45659 advisory to mark the vulnerability as exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from deserialization of untrusted data and allows attackers with low privileges to execute arbitrary code. Microsoft previously said the flaw can be exploited in low-complexity attacks because attackers do not need significant prior knowledge of the system and can achieve repeatable success against the vulnerable component. Security updates were released in May for SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog on July 1 and ordered Federal Civilian Executive Branch agencies to secure their servers within three days. CISA also urged security teams to monitor affected servers, apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, enable AMSI integration for SharePoint web applications, and use Microsoft Defender Antivirus detections. Shadowserver currently tracks over 8,500 Microsoft SharePoint servers exposed online, with over 200 unpatched against this vulnerability.\u003c/p\u003e\n"},{"n":13,"title":"US and South Korea warn of Gunra ransomware targeting govt agencies","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-warns-of-gunra-ransomware-attacks-against-government-critical-infrastructure/","time":"09:47","priority":"MUST READ","score":94,"tldr":"U.S. and South Korean agencies warned that the Gunra ransomware group is targeting government and critical infrastructure organizations worldwide, using Conti-derived malware and exploiting internet-facing Fortinet and VPN systems. Defenders are urged to quickly patch known exploited flaws, segment networks, and maintain offline backups.","briefOverview":"\u003cp\u003eU.S. federal agencies and South Korea\u0026rsquo;s National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks. In a joint advisory, the agencies said Gunra uses a malware variant based on the Conti ransomware source code leaked in February 2022. The group targets a wide range of sectors, including healthcare and public health, financial services, and government services.\u003c/p\u003e\n\n\u003cp\u003eThe advisory says Gunra first emerged in April 2025 as a sophisticated double-extortion ransomware variant. The FBI observed Gunra actors attempting to contact management staff at victim companies directly by email to solicit ransom payments, though with limited success. The article also notes that a separate South Korean advisory linked Gunra to Lazarus Group, a North Korean state-backed hacking group.\u003c/p\u003e\n\n\u003cp\u003eGunra has been observed attacking Fortinet firewalls by exploiting two critical authentication vulnerabilities in FortiOS and FortiProxy, CVE-2024-55591 and CVE-2025-24472. The group also exploits credential-exposure and SSH access control flaws in internet-facing VPN gateways, and it expanded from Windows-focused attacks to cross-platform campaigns after introducing a Linux variant in mid-2025. The U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and keep offline backups of their data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. federal agencies and South Korea's National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks.","The advisory says Gunra first emerged in April 2025 as a double-extortion ransomware variant derived from the Conti ransomware source code leaked in February 2022.","Gunra has exploited Fortinet FortiOS and FortiProxy authentication vulnerabilities CVE-2024-55591 and CVE-2025-24472 to gain access to victim networks.","Gunra introduced a Linux variant in mid-2025 and launched a ransomware-as-a-service affiliate program in January 2026.","The U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and maintain offline backups."],"insights":["Gunra actors tried to pressure victims by emailing company management directly for ransom payments, but the FBI observed that this had limited success.","Gunra’s move from Windows-only activity to adding a Linux variant shows its campaigns now target more than one operating environment.","The group is commercializing its operations by offering affiliates a management panel, configurable ransomware builder, cross-platform payloads, and structured documentation.","Gunra has operated under the branding alias Golden Community while expanding its ransomware-as-a-service program.","A separate South Korean advisory connected Gunra to Lazarus Group, a North Korean state-backed hacking group."],"referencedReports":[{"title":"AA26-222A: #StopRansomware: Gunra Ransomware","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a","publisher":"CISA","context":"The article relies on this joint U.S. and South Korean advisory for details about Gunra ransomware activity, tactics, and defensive recommendations.","category":"advisory","primary":true},{"title":"Monday joint advisory on Gunra ransomware","url":"https://content.govdelivery.com/accounts/USDHSCISA/bulletins/4244745","publisher":"CISA","context":"The article cites this linked joint advisory as the source of warnings to government and critical infrastructure organizations about Gunra ransomware attacks.","category":"advisory","primary":true},{"title":"AhnLab advisory on Gunra ransomware and Lazarus Group links","url":"https://asec.ahnlab.com/en/94696/","publisher":"AhnLab","context":"The article references this separate advisory from AhnLab and South Korean government agencies as exposing links between Gunra and Lazarus Group.","category":"advisory","primary":false},{"title":"Operation Double Barrel","url":"https://image.ahnlab.com/atip/content/file/20260730/%5BAhnLab%5DOperation%20Double%20Barrel%28ENG%29%282026.07.30%29.pdf","publisher":"AhnLab","context":"The article links this report as the analysis that exposed connections between the Gunra ransomware gang and Lazarus Group.","category":"research","primary":false}],"body":"\u003cp\u003eU.S. federal agencies and South Korea\u0026rsquo;s National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks. In a joint advisory, the agencies said Gunra uses a malware variant based on the Conti ransomware source code leaked in February 2022. The group targets a wide range of sectors, including healthcare and public health, financial services, and government services.\u003c/p\u003e\n\n\u003cp\u003eThe advisory says Gunra first emerged in April 2025 as a sophisticated double-extortion ransomware variant. The FBI observed Gunra actors attempting to contact management staff at victim companies directly by email to solicit ransom payments, though with limited success. The article also notes that a separate South Korean advisory linked Gunra to Lazarus Group, a North Korean state-backed hacking group.\u003c/p\u003e\n\n\u003cp\u003eGunra has been observed attacking Fortinet firewalls by exploiting two critical authentication vulnerabilities in FortiOS and FortiProxy, CVE-2024-55591 and CVE-2025-24472. The group also exploits credential-exposure and SSH access control flaws in internet-facing VPN gateways, and it expanded from Windows-focused attacks to cross-platform campaigns after introducing a Linux variant in mid-2025. The U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and keep offline backups of their data.\u003c/p\u003e\n"},{"n":14,"title":"Cisco warns of ASA and FTD VPN flaw exploited to crash devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-asa-and-ftd-vpn-flaw-exploited-to-crash-devices/","time":"19:45","priority":"MUST READ","score":94,"tldr":"Cisco warns that CVE-2026-20349, a high-severity flaw in ASA and FTD remote access services, is being actively exploited to remotely crash vulnerable devices and cause denial-of-service conditions. There are no workarounds, so Cisco urges customers to apply the available hot fixes immediately.","briefOverview":"\u003cp\u003eCisco is warning that a high-severity denial-of-service vulnerability in Secure Firewall ASA and Threat Defense software is being actively exploited in attacks. The flaw, tracked as CVE-2026-20349, has a severity score of 8.6 and can be used to remotely crash affected devices. Cisco says a successful exploit can cause the device to reload, resulting in a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by insufficient error checking while processing HTTP requests. An attacker can exploit it by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device, and it can be exploited remotely without authentication or user interaction when SSL listen sockets are enabled. Vulnerable configurations include IKEv2 Remote Access VPN with client services, SSL VPN, and Zero Trust Network Access on FTD devices, while Secure Firewall Management Center software is not affected.\u003c/p\u003e\n\n\u003cp\u003eCisco has released hot fixes for affected ASA 9.16, 9.18, 9.20, 9.22, 9.23, and 9.24 releases, as well as FTD releases 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0. The company says there are no workarounds and strongly recommends upgrading to a fixed software release. Cisco PSIRT says it became aware of active exploitation in August 2026, but Cisco has not shared details about the attackers, targeted organizations, or indicators of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco warned that CVE-2026-20349, a high-severity denial-of-service vulnerability in Secure Firewall ASA and Threat Defense software, is being actively exploited to remotely crash affected devices.","The vulnerability is caused by insufficient error checking while processing HTTP requests and can be exploited by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device.","The flaw can be exploited remotely without authentication or user interaction when SSL listen sockets are enabled.","Vulnerable configurations include IKEv2 Remote Access VPN with client services, SSL VPN, and Zero Trust Network Access on FTD devices, while Secure Firewall Management Center software is not affected.","Cisco has released hot fixes for affected ASA and FTD releases, says there are no workarounds, and strongly recommends upgrading to a fixed software release."],"insights":["Cisco says it became aware of active exploitation in August 2026 but has not shared who is exploiting the flaw, which organizations are being targeted, or any indicators of compromise.","Because Cisco lists no workaround, affected customers cannot rely on configuration changes alone for full remediation and must move to a fixed software release.","The affected release range spans multiple ASA and FTD branches, including ASA 9.16 through 9.24 and FTD 7.0 through 10.0, making version checks important across several supported deployments.","Secure Firewall Management Center is explicitly not affected, so remediation efforts can be focused on ASA and FTD devices with the vulnerable remote access services enabled."],"referencedReports":[{"title":"Cisco security advisory for CVE-2026-20349","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-vpn-dos-dzv4mQFF","publisher":"Cisco","context":"The article cites Cisco's advisory as the source for details on the actively exploited ASA and FTD denial-of-service vulnerability and available hot fixes.","category":"advisory","primary":true},{"title":"Cisco advisory on ClamAV vulnerabilities with public exploits","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-WuuvVd26","publisher":"Cisco","context":"The article notes that Cisco also disclosed Secure Endpoint Connector exposure to ClamAV vulnerabilities with public exploits in a separate advisory.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco is warning that a high-severity denial-of-service vulnerability in Secure Firewall ASA and Threat Defense software is being actively exploited in attacks. The flaw, tracked as CVE-2026-20349, has a severity score of 8.6 and can be used to remotely crash affected devices. Cisco says a successful exploit can cause the device to reload, resulting in a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by insufficient error checking while processing HTTP requests. An attacker can exploit it by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device, and it can be exploited remotely without authentication or user interaction when SSL listen sockets are enabled. Vulnerable configurations include IKEv2 Remote Access VPN with client services, SSL VPN, and Zero Trust Network Access on FTD devices, while Secure Firewall Management Center software is not affected.\u003c/p\u003e\n\n\u003cp\u003eCisco has released hot fixes for affected ASA 9.16, 9.18, 9.20, 9.22, 9.23, and 9.24 releases, as well as FTD releases 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0. The company says there are no workarounds and strongly recommends upgrading to a fixed software release. Cisco PSIRT says it became aware of active exploitation in August 2026, but Cisco has not shared details about the attackers, targeted organizations, or indicators of compromise.\u003c/p\u003e\n"},{"n":28,"title":"Gunra Ransomware Exploits Fortinet and Schneider Electric Flaws to Breach Networks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/gunra-ransomware-exploits-fortinet-and.html","time":"09:16","priority":"MUST READ","score":94,"tldr":"South Korean and U.S. agencies warn that Gunra ransomware is breaching critical infrastructure and other organizations worldwide by exploiting Fortinet and Schneider Electric flaws, then stealing data and encrypting systems for double extortion. Organizations should urgently patch internet-facing systems, segment networks, and protect offline or immutable backups.","briefOverview":"\u003cp\u003eSouth Korean and U.S. cybersecurity and intelligence agencies warned that Gunra ransomware attacks are targeting critical infrastructure sectors and organizations worldwide. The affected sectors include healthcare and public health, financial services, government services and facilities, and professional and nonprofit services. The attacks use a double extortion model that combines data theft with file encryption, and victims who do not pay within five to seven days have their data published on a leak site.\u003c/p\u003e\n\n\u003cp\u003eThe article says Gunra attacks have exploited flaws in Schneider Electric PowerLogic P5, tracked as CVE-2024-5559, and Fortinet FortiOS and FortiProxy, tracked as CVE-2025-24472, to gain initial access. The group has listed 51 victims since emerging in April 2025, with most from South Korea, Brazil, Spain, Thailand, and Hong Kong, while only three victims have been reported from Canada and the U.S. Gunra has also launched a ransomware-as-a-service affiliate program and has adopted branding aliases such as Golden Community.\u003c/p\u003e\n\n\u003cp\u003eGunra has used Impacket tools for lateral movement and credential dumping, deleted logs and command history, and exfiltrated data from Microsoft OneDrive, SharePoint, and in some cases MEGA. The article describes cases involving SSL-VPN credential interception, session hijacking, tampering with VDI authentication files to bypass multi-factor authentication, and deletion of backup and archived data. AhnLab said similarities between Gunra activity and a separate state-sponsored campaign suggest the groups may have shared techniques, tools, and infrastructure or collaborated to a limited extent during the attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["South Korean and U.S. cybersecurity and intelligence agencies warned that Gunra ransomware attacks are targeting critical infrastructure sectors and organizations worldwide, including healthcare, financial services, government services, and professional and nonprofit services.","Gunra attacks have exploited flaws in Schneider Electric PowerLogic P5 tracked as CVE-2024-5559 and Fortinet FortiOS and FortiProxy tracked as CVE-2025-24472 to gain initial access before stealing data and encrypting systems.","Gunra has listed 51 victims since emerging in April 2025, with most victims from South Korea, Brazil, Spain, Thailand, and Hong Kong, according to Ransomware.Live data cited in the article.","The group uses tools including Impacket utilities for lateral movement and credential dumping, deletes logs and command history, and exfiltrates data from Microsoft OneDrive, SharePoint, and in some cases to MEGA.","AhnLab said shared techniques, tools, and infrastructure suggest Gunra and a separate state-sponsored threat group may have collaborated to a limited extent during some attacks."],"insights":["Gunra’s Linux ransomware builds reportedly have a catastrophic cryptographic weakness identified by Breakglass Intelligence that can allow recovery of encryption keys without paying, making specialist incident response particularly important for Linux victims.","Gunra has moved beyond ordinary ransomware operations by recruiting penetration testers and ethical hackers as initial access brokers and offering them a share of ransom profits for enterprise network access.","The group’s operational pattern includes conducting malicious activity and internal reconnaissance mainly between 10 p.m. and 6 a.m., deleting logs, and clearing command history, giving defenders specific time windows and artifacts to scrutinize.","In at least one case, Gunra bypassed multi-factor authentication by modifying corporate VDI authentication portal files so that a Gunra-designated one-time password value would successfully authenticate.","The reported overlap between Gunra activity and a separate state-sponsored campaign involving AnySign4PC, Struggle, and Brandoor suggests defenders should not treat ransomware and nation-state tooling as completely separate detection priorities in these incidents."],"referencedReports":[{"title":"CISA, FBI, and Partners Warn Organizations of Gunra Ransomware Actors Targeting Multiple Critical Infrastructure Sectors","url":"https://www.cisa.gov/news-events/news/cisa-fbi-and-partners-warn-organizations-gunra-ransomware-actors-targeting-multiple-critical","publisher":"CISA","context":"The article cites this warning from South Korean and U.S. agencies about Gunra ransomware targeting critical infrastructure and organizations worldwide.","category":"advisory","primary":true},{"title":"#StopRansomware: Gunra Ransomware","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a","publisher":"CISA","context":"The article cites this cybersecurity advisory for details on Gunra exploiting Schneider Electric PowerLogic P5 and Fortinet FortiOS and FortiProxy flaws for initial access.","category":"advisory","primary":true},{"title":"Gunra Ransomware: What You Don’t Know","url":"https://theravenfile.com/2025/09/23/gunra-ransomware-what-you-dont-know/","publisher":"The Raven File","context":"The article references Rakesh Krishnan’s analysis describing Gunra’s phishing use, WhatsApp-themed negotiation panel, and file encryption capabilities.","category":"research","primary":false},{"title":"Inside Gunra RaaS: From Affiliate Recruitment on the Dark Web to Full Technical Dissection of Their Locker","url":"https://www.cloudsek.com/blog/inside-gunra-raas-from-affiliate-recruitment-on-the-dark-web-to-full-technical-dissection-of-their-locker","publisher":"CloudSEK","context":"The article cites this technical dissection for details on Gunra’s ransomware-as-a-service affiliate program, management panel, builder, payloads, and documentation.","category":"research","primary":false},{"title":"Gunra Ransomware’s Linux Variant Has a Fatal Flaw: Time-Seeded rand() Makes Encrypted Files Recoverable Without Paying","url":"https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying#recovery-procedure-for-incident-responders","publisher":"Breakglass Intelligence","context":"The article references this analysis for the finding that Gunra’s Linux builds had a cryptographic weakness allowing file recovery.","category":"research","primary":false}],"body":"\u003cp\u003eSouth Korean and U.S. cybersecurity and intelligence agencies warned that Gunra ransomware attacks are targeting critical infrastructure sectors and organizations worldwide. The affected sectors include healthcare and public health, financial services, government services and facilities, and professional and nonprofit services. The attacks use a double extortion model that combines data theft with file encryption, and victims who do not pay within five to seven days have their data published on a leak site.\u003c/p\u003e\n\n\u003cp\u003eThe article says Gunra attacks have exploited flaws in Schneider Electric PowerLogic P5, tracked as CVE-2024-5559, and Fortinet FortiOS and FortiProxy, tracked as CVE-2025-24472, to gain initial access. The group has listed 51 victims since emerging in April 2025, with most from South Korea, Brazil, Spain, Thailand, and Hong Kong, while only three victims have been reported from Canada and the U.S. Gunra has also launched a ransomware-as-a-service affiliate program and has adopted branding aliases such as Golden Community.\u003c/p\u003e\n\n\u003cp\u003eGunra has used Impacket tools for lateral movement and credential dumping, deleted logs and command history, and exfiltrated data from Microsoft OneDrive, SharePoint, and in some cases MEGA. The article describes cases involving SSL-VPN credential interception, session hijacking, tampering with VDI authentication files to bypass multi-factor authentication, and deletion of backup and archived data. AhnLab said similarities between Gunra activity and a separate state-sponsored campaign suggest the groups may have shared techniques, tools, and infrastructure or collaborated to a limited extent during the attacks.\u003c/p\u003e\n"},{"n":30,"title":"Sandworm-Linked UAC-0145 Uses Fake Job Interviews to Push VPN That Can Run Commands","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/sandworm-linked-uac-0145-uses-fake-job.html","time":"18:36","priority":"MUST READ","score":94,"tldr":"Ukraine’s CERT says Sandworm-linked UAC-0145 is targeting Ukrainian IT workers with fake recruiter interviews that trick them into installing a malicious WireGuard-based VPN. The trojanized VPN can silently run commands and fetch additional payloads, highlighting fake job offers as an active nation-state intrusion tactic.","briefOverview":"\u003cp\u003eCERT-UA disclosed a social engineering campaign by Russian nation-state threat actors targeting IT workers in Ukraine by posing as recruiters. The agency attributed the activity to UAC-0145, a subgroup within Sandworm, also known as APT44, Seashell Blizzard, and UAC-0002. The campaign has been ongoing since May 2026 and typically targets system administrators or IT specialists through job search websites.\u003c/p\u003e\n\n\u003cp\u003eThe attackers move conversations from built-in job site chats to Telegram, claim to represent an IT company or Sopra Steria Bulgaria, and conduct a Zoom interview with an English-speaking man. They then send instructions for a technical interview that include WireGuard configuration files for connecting to a supposed corporate VPN. When the victim encounters errors, the attackers recommend downloading a custom VPN solution named SopraVPN from SourceForge links and a lookalike domain mimicking Sopra Steria Bulgaria.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said the attackers’ VPN client was compiled from WireGuard source code with modifications that add support for a non-standard “SymmetricKey” option. This mechanism uses Base64-encoded AES-256-GCM data and a value derived from the “PrivateKey” to decrypt PowerShell code, which is then passed to WireGuard’s standard command-execution mechanism. The Windows client creates a scheduled task to download a secondary payload, while the Linux variant uses cURL to download an executable file from attacker infrastructure over the VPN.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-UA disclosed an ongoing social engineering campaign since May 2026 in which Russian nation-state actors target Ukrainian IT workers by posing as recruiters.","CERT-UA attributed the activity to UAC-0145, a subgroup within Sandworm, also known as APT44, Seashell Blizzard, and UAC-0002.","The attackers contact candidates on job search websites, move conversations to Telegram, conduct a Zoom interview, and send instructions for a technical interview involving WireGuard VPN configuration files.","When the provided VPN configuration fails, the attackers direct victims to download a custom VPN client named SopraVPN from SourceForge links designed to mimic Sopra Steria Bulgaria’s website.","CERT-UA said the modified WireGuard client supports a non-standard configuration option that decrypts and runs PowerShell code, allowing arbitrary commands to execute on the victim host."],"insights":["The lure is tailored to people with privileged technical roles, as CERT-UA says the targets are typically system administrators or IT specialists, making successful compromise especially valuable for follow-on access.","The malicious behavior is hidden inside what appears to be a legitimate technical hiring exercise, using real interview steps, Zoom calls, WireGuard configuration files, and a custom VPN client to make the request seem normal.","CERT-UA’s description shows that configuration files themselves are part of the risk, because the modified WireGuard client abuses added configuration handling to decrypt and run PowerShell code.","The campaign uses multiple layers of legitimacy, including impersonation of Sopra Steria Bulgaria, job search platforms, Telegram, Zoom, SourceForge-hosted projects, and a lookalike domain, rather than relying on a single fake artifact.","CERT-UA specifically recommends limiting corporate resource access to managed devices with security software, configured policies, and continuous monitoring, reflecting concern that personally installed tools from fake interviews can become an organizational entry point."],"referencedReports":[{"title":"CERT-UA advisory on UAC-0145 fake recruiter campaign","url":"https://cert.gov.ua/article/6318863","publisher":"CERT-UA","context":"The article cites CERT-UA as disclosing details of the ongoing campaign targeting Ukrainian IT workers and attributes the technical findings to the agency’s advisory.","category":"advisory","primary":true}],"body":"\u003cp\u003eCERT-UA disclosed a social engineering campaign by Russian nation-state threat actors targeting IT workers in Ukraine by posing as recruiters. The agency attributed the activity to UAC-0145, a subgroup within Sandworm, also known as APT44, Seashell Blizzard, and UAC-0002. The campaign has been ongoing since May 2026 and typically targets system administrators or IT specialists through job search websites.\u003c/p\u003e\n\n\u003cp\u003eThe attackers move conversations from built-in job site chats to Telegram, claim to represent an IT company or Sopra Steria Bulgaria, and conduct a Zoom interview with an English-speaking man. They then send instructions for a technical interview that include WireGuard configuration files for connecting to a supposed corporate VPN. When the victim encounters errors, the attackers recommend downloading a custom VPN solution named SopraVPN from SourceForge links and a lookalike domain mimicking Sopra Steria Bulgaria.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said the attackers’ VPN client was compiled from WireGuard source code with modifications that add support for a non-standard “SymmetricKey” option. This mechanism uses Base64-encoded AES-256-GCM data and a value derived from the “PrivateKey” to decrypt PowerShell code, which is then passed to WireGuard’s standard command-execution mechanism. The Windows client creates a scheduled task to download a secondary payload, while the Linux variant uses cURL to download an executable file from attacker infrastructure over the VPN.\u003c/p\u003e\n"},{"n":32,"title":"BdThemes Supply Chain Attack Poisons JSON to Create Rogue WordPress Admins","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/bdthemes-supply-chain-attack-poisons.html","time":"05:48","priority":"MUST READ","score":94,"tldr":"BdThemes’ WordPress plugins were compromised through a poisoned remote JSON feed, letting attackers run XSS in admin browsers without changing plugin code. The payload created rogue admin accounts, installed a web shell, and added stealthy persistence via WordPress mu-plugins.","briefOverview":"\u003cp\u003eCybersecurity researchers warned of a supply chain compromise affecting WordPress plugin vendor BdThemes, prompting the WordPress plugins team to temporarily disable downloads for the impacted plugins pending a full review. Wordfence said the attackers did not modify source code in the official WordPress.org repository. Instead, they poisoned a static remote JSON data stream used by an administrative promotional banner component.\u003c/p\u003e\n\n\u003cp\u003eThe issue is tied to an internal component called Biggopti, which is shipped with the affected plugins and pulls promotional banners from an API server. Wordfence said the library was vulnerable to cross-site scripting in JSON response parsing through the \u003ccode\u003edisplay_id\u003c/code\u003e parameter from the Sigmative API due to insufficient client-side escaping. Because the script ran on every \u003ccode\u003ewp-admin\u003c/code\u003e page load, malicious code could execute silently in the browser of any logged-in administrator.\u003c/p\u003e\n\n\u0
