26","url":"https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026","publisher":"Dragos","context":"The article cites Dragos for its finding that The Gentlemen claimed 125 attacks on industrial organizations in the second quarter of 2026.","category":"research","primary":false},{"title":"Killing Me Gently: Inside Gentlemen’s EDR Killer Framework","url":"https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/","publisher":"ESET Research","context":"The article cites ESET Research for analysis of The Gentlemen’s tools for disabling endpoint detection and response technology.","category":"research","primary":false},{"title":"Not Very Gentlemanly: Analyzing a Zero-Day Exploit Used by The Gentlemen Ransomware to Disable Target’s EDRs","url":"https://expel.com/blog/not-very-gentlemanly-analyzing-a-zero-day-exploit-used-by-the-gentlemen-ransomware-to-disable-targets-edrs/","publisher":"Expel","context":"The article cites Expel for an observed case in which The Gentlemen abused a third-party vendor driver vulnerability to disable a victim’s EDR.","category":"research","primary":false}],"body":"\u003cp\u003eTwo weeks after a cyberattack knocked out AnMed’s IT systems, the nonprofit medical system is still dealing with closures and an apparent hack of its Facebook page. AnMed operates four hospitals and other clinics in Georgia and South Carolina. The Facebook page was removed shortly after posts appeared claiming to be from “The Gentlemen” ransomware group and showing ransom demands.\u003c/p\u003e\n\n\u003cp\u003eThe hackers claimed they had exfiltrated 6 terabytes of data, including highly sensitive health information related to sexual assault, mental health, abortions and sexual harassment incidents. The article says they did not provide evidence for these claims, and AnMed says it has not confirmed the scope of any potential impact to patient information. AnMed said unauthorized posts were removed, platform access was disabled, and it is working with the provider to secure the accounts.\u003c/p\u003e\n\n\u003cp\u003eAnMed originally described the incident as a cybersecurity disruption involving malware and has continued working to restore systems. As of Monday, 10 facilities remained closed to appointments while the organization continued posting daily updates on open and closed offices. The article also describes The Gentlemen as a prolific ransomware-as-a-service group whose operators have been reported to use edge devices, credential brute-forcing, known vulnerabilities, access brokers, administrator account access, data exfiltration, ransomware deployment and tools to disable endpoint detection and response technology.\u003c/p\u003e\n"},{"n":9,"title":"Wesco confirms security incident after ExfilSquad claims data theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/","time":"15:59","priority":"SHOULD READ","score":84,"tldr":"Wesco confirmed it is investigating a cloud CRM security incident after ExfilSquad claimed it stole and leaked 2.6 million records. The company says operations are unaffected and it does not believe sensitive customer, employee, payment, or financial data is at risk.","briefOverview":"\u003cp\u003eGlobal supply chain and distribution company Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident. The statement came after the data extortion group ExfilSquad claimed it stole sensitive information from Wesco and leaked it on its data leak site. Wesco said the incident involves the company’s cloud CRM environment.\u003c/p\u003e\n\n\u003cp\u003eWesco said it worked with its cloud CRM vendor and does not believe there is a risk to sensitive data. The company stated that it has not experienced any business disruption, that operations continue as normal, and that its investigation found no evidence of ransomware or other malicious software on its IT systems. Wesco also said it does not believe payment card information, financial account information, or other sensitive customer or employee data is at risk.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 2.6 million records containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information. After its deadline for ransom payment negotiations expired, the group published the data allegedly taken from Wesco’s systems. The article notes that recent reports from Resecurity and VenariX say ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables, while public information indicates Wesco may use Microsoft Dynamics 365.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident involving the company's cloud CRM environment.","ExfilSquad claimed it stole 2.6 million records from Wesco containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information.","Wesco said it worked with its cloud CRM vendor and does not believe payment card information, financial account information, or other sensitive customer or employee data is at risk.","Wesco stated that it has not experienced business disruption and that all operations continue as normal.","Wesco said its investigation found no evidence of ransomware or other malicious software on its IT systems."],"insights":["The incident is notable because Wesco describes it as involving a cloud CRM environment rather than a broader compromise of its IT systems, and says it found no ransomware or other malicious software.","ExfilSquad’s publication of the alleged Wesco data after a missed negotiation deadline shows the group is using data exposure for extortion even when the victim reports no business disruption.","The article highlights a gap between ExfilSquad’s claim of stealing customer and employee PII and Wesco’s statement that it does not believe sensitive customer or employee data is at risk.","Reports that ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables are especially relevant because public information cited in the article indicates Wesco may use Microsoft Dynamics 365."],"referencedReports":[{"title":"ExfilSquad Targets New Victims, Shares Data via Torrents","url":"https://www.resecurity.com/blog/article/exfilsquad-targets-new-victims-shares-data-via-torrents","publisher":"Resecurity","context":"The article cites a recent Resecurity report examining ExfilSquad activity and noting that the group has targeted improperly configured Microsoft Power Pages data tables.","category":"research","primary":false},{"title":"ExfilSquad Targets Misconfigured Microsoft Power Pages Portals","url":"https://www.linkedin.com/pulse/exfilsquad-targets-misconfigured-microsoft-power-pages-portals-odhtc/","publisher":"VenariX","context":"The article cites a recent VenariX report examining ExfilSquad activity and noting past targeting of improperly configured Microsoft Power Pages data tables.","category":"research","primary":false}],"body":"\u003cp\u003eGlobal supply chain and distribution company Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident. The statement came after the data extortion group ExfilSquad claimed it stole sensitive information from Wesco and leaked it on its data leak site. Wesco said the incident involves the company’s cloud CRM environment.\u003c/p\u003e\n\n\u003cp\u003eWesco said it worked with its cloud CRM vendor and does not believe there is a risk to sensitive data. The company stated that it has not experienced any business disruption, that operations continue as normal, and that its investigation found no evidence of ransomware or other malicious software on its IT systems. Wesco also said it does not believe payment card information, financial account information, or other sensitive customer or employee data is at risk.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 2.6 million records containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information. After its deadline for ransom payment negotiations expired, the group published the data allegedly taken from Wesco’s systems. The article notes that recent reports from Resecurity and VenariX say ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables, while public information indicates Wesco may use Microsoft Dynamics 365.\u003c/p\u003e\n"},{"n":23,"title":"Researchers Built a Fake Crypto Startup and Hired Three Suspected North Korean IT Workers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/researchers-built-fake-crypto-startup.html","time":"11:35","priority":"SHOULD READ","score":84,"tldr":"Researchers posing as a fake crypto startup hired three suspected North Korean IT workers and found they used forged or altered identity documents, VPN infrastructure, AI job tools, and immediate system reconnaissance after onboarding. The key lesson is that North Korean operatives can gain legitimate employee access through normal remote hiring workflows, so identity verification must continue beyond initial onboarding.","briefOverview":"\u003cp\u003eSecurity researchers created a fake cryptocurrency startup called Ballena Azul, advertised developer jobs, and hired three people they believe were North Korean operatives. The company issued recorded virtual machines to the hires, who entered through the normal hiring process, cleared interviews, signed contracts, and received access to work systems. The researchers presented the work at DEF CON 34 and described the three as suspected Famous Chollima operatives under the wider Lazarus umbrella.\u003c/p\u003e\n\n\u003cp\u003eThe article says the onboarding documents contained warning signs that hiring teams could use. One hire claimed to live in Pasadena, Texas, but sent a California driver\u0026rsquo;s license and a New York bank account, while another supplied a Texas license, a valid Social Security number, and a Kansas City bank account. A third sent a New York license belonging to someone else, and the researchers reported that one image had Google Gemini processing metadata and a SynthID watermark.\u003c/p\u003e\n\n\u003cp\u003eOnce onboarded, all three ran commands such as dxdiag, systeminfo, and wmic to profile their machines and checked what country their connections appeared to originate from. One installed Chrome Remote Desktop and synced a personal Google account to the sandbox, exposing browsing history, saved passwords, installed extensions, and GitHub activity. The researchers observed tools and services including 2fa.cn, Outlook.com, AIApply, Final Round AI, Simplify Copilot, ChatGPT saved prompts, Vultr, Gorilla Servers, and AstrillVPN exit nodes, and advised periodic identity checks, in-person verification, recruiter training, and blocking AstrillVPN.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researchers created a fake cryptocurrency startup called Ballena Azul, advertised developer jobs, and hired three people they believe were North Korean operatives.","The hires submitted inconsistent or allegedly altered identity materials, including driver's licenses, bank accounts in different states, a valid Social Security number, and one license belonging to someone else.","The researchers reported that one submitted image showed Google Gemini processing metadata and a SynthID watermark, but the article says the report does not explain how the watermark was detected.","After onboarding, all three workers ran commands such as dxdiag, systeminfo, and wmic to profile their work virtual machines and checked what country their connections appeared to come from.","The researchers advise periodic identity checks, in-person verification for remote-first companies, recruiter training, and blocking AstrillVPN."],"insights":["The article highlights onboarding paperwork as a practical detection point because one hire claimed a Texas residence while submitting a California driver's license and a New York bank account.","The operation shows that the risk is not limited to unauthorized intrusions, because the suspected operatives gained access through normal hiring, interviews, contracts, and issued work machines.","AI-related document checks have limits: Gemini can check for SynthID watermarks, but a negative result only rules out content created or edited by Google's AI models, not other AI tools.","The researchers observed a shift in operational tooling from their December investigation, including 2fa.cn for passing two-factor codes and Outlook.com appearing where only Gmail had been seen before.","One worker's use of Chrome Remote Desktop and personal Google account syncing exposed browsing history, saved passwords, installed extensions, and GitHub activity to the monitored sandbox."],"referencedReports":[{"title":"Lazarus Group IT Workers Investigation: Part Two","url":"https://any.run/cybersecurity-blog/lazarus-group-it-workers-investigation-part-two/","publisher":"ANY.RUN","context":"The article says the fake-employer operation was conducted by researchers from BCA LTD, NorthScan, and ANY.RUN and links to ANY.RUN's write-up of the investigation.","category":"research","primary":true},{"title":"July 31 joint advisory on North Korean IT workers","url":"https://www.ic3.gov/CSA/2026/260731.pdf","publisher":"IC3","context":"The article cites the advisory for warnings that North Korean IT workers seek contracts to remit salaries to North Korean agencies and for hiring-risk indicators such as forged or altered documents.","category":"advisory","primary":false},{"title":"Astrill VPN","url":"https://www.silentpush.com/blog/astrill-vpn/","publisher":"Silent Push","context":"The article says Silent Push separately tracked Astrill as a fixture of North Korean operations.","category":"research","primary":false}],"body":"\u003cp\u003eSecurity researchers created a fake cryptocurrency startup called Ballena Azul, advertised developer jobs, and hired three people they believe were North Korean operatives. The company issued recorded virtual machines to the hires, who entered through the normal hiring process, cleared interviews, signed contracts, and received access to work systems. The researchers presented the work at DEF CON 34 and described the three as suspected Famous Chollima operatives under the wider Lazarus umbrella.\u003c/p\u003e\n\n\u003cp\u003eThe article says the onboarding documents contained warning signs that hiring teams could use. One hire claimed to live in Pasadena, Texas, but sent a California driver\u0026rsquo;s license and a New York bank account, while another supplied a Texas license, a valid Social Security number, and a Kansas City bank account. A third sent a New York license belonging to someone else, and the researchers reported that one image had Google Gemini processing metadata and a SynthID watermark.\u003c/p\u003e\n\n\u003cp\u003eOnce onboarded, all three ran commands such as dxdiag, systeminfo, and wmic to profile their machines and checked what country their connections appeared to originate from. One installed Chrome Remote Desktop and synced a personal Google account to the sandbox, exposing browsing history, saved passwords, installed extensions, and GitHub activity. The researchers observed tools and services including 2fa.cn, Outlook.com, AIApply, Final Round AI, Simplify Copilot, ChatGPT saved prompts, Vultr, Gorilla Servers, and AstrillVPN exit nodes, and advised periodic identity checks, in-person verification, recruiter training, and blocking AstrillVPN.\u003c/p\u003e\n"},{"n":31,"title":"Zoom Annotation Flaws Could Let a Meeting Participant Hijack Another Attendee's Client","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/zoom-annotation-flaws-could-let-meeting.html","time":"19:08","priority":"SHOULD READ","score":84,"tldr":"Zoom patched annotation-tool flaws that could let a meeting participant silently take over another attendee’s client during screen sharing, with no victim interaction beyond being in the meeting. The bugs affect multiple Zoom products and were fixed in June and July, with no reported exploitation.","briefOverview":"\u003cp\u003eZoom patched flaws in its annotation tool that could have allowed someone sharing their screen to take over the computers of viewers, or allowed a viewer to take over the presenter’s client. The issue required no click, download, prompt, or visible sign beyond the victim being in the meeting. Fixes shipped in June and July, about two months before public disclosure, and no exploitation had been reported as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe affected versions included Zoom Workplace, Zoom Workplace VDI Client for Windows, Zoom Rooms, and the Zoom Meeting SDK before the fixed releases listed in the article. Zoom tracks the issues as CVE-2026-53413, CVE-2026-53414, and CVE-2026-53415, with vendor CVSS scores of 8.3, 6.5, and 8.3. The research came from A Security, which said it went from finding the flaw to a working exploit in under a day using fewer than 20 prompts on publicly available AI models, though the article says that claim cannot be checked outside the company.\u003c/p\u003e\n\n\u003cp\u003eThe technical details come from A Security’s reverse engineering because Zoom published no technical detail. The article says annotation drawings are sent as structured objects with counts followed by data, and one flaw let an oversized count overflow a fixed 128-byte buffer and overwrite the return address. Another issue involved missing checks on where a message came from, allowing a malformed object message to be accepted on a channel where an acknowledgement was expected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zoom patched flaws in its annotation tool that could have allowed a meeting participant sharing their screen to take over viewers’ clients, or allowed a viewer to take over the presenter’s client.","The flaws required no victim click, download, prompt, or visible on-screen indication beyond the victim being in the Zoom meeting.","Zoom fixed the affected client versions in June and July, about two months before the flaws were made public, and no exploitation had been reported as of publication.","The affected products include Zoom Workplace, Zoom Workplace VDI Client for Windows, Zoom Rooms, and the Zoom Meeting SDK before the fixed versions listed by Zoom.","A Security said it developed a working exploit in under a day using fewer than 20 prompts on publicly available AI models, but the article notes that no one outside the company can verify that claim."],"insights":["The article highlights a mismatch between the zero-click description of the flaws and Zoom’s CVE vectors, which mark user interaction as required.","A Security’s automated function-ranking approach initially missed the vulnerable library, and the flaw surfaced only after researchers traced the running Zoom client through a live call feature by feature.","The over-read flaw is described very differently by the researcher and the vendor: A Security says it exposed memory useful for bypassing address randomization, while Zoom’s advisory says it may only allow denial of service and assigns no confidentiality impact.","One malformed annotation message could reach other meeting participants because the client dispatcher trusted the message type from the wire without checking whether it came from the expected meeting role.","The article notes that because Zoom issues its own CVE records and NIST no longer routinely re-scores them, Zoom’s lower severity ratings will likely remain the official ones."],"referencedReports":[{"title":"A Security ZOOMSDAY","url":"https://a.security/blog/asecurity-zoomsday","publisher":"A Security","context":"The article says Zoom published no technical detail and relies on A Security's own reverse engineering for the internals of the annotation flaws.","category":"research","primary":true},{"title":"ZSB-26015","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26015/","publisher":"Zoom","context":"The article cites this Zoom security bulletin as covering CVE-2026-53413, a buffer over-write flaw.","category":"advisory","primary":true},{"title":"ZSB-26016","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26016/","publisher":"Zoom","context":"The article cites this Zoom security bulletin as covering CVE-2026-53414, a buffer over-read flaw.","category":"advisory","primary":true},{"title":"ZSB-26017","url":"https://www.zoom.com/en/trust/security-bulletin/zsb-26017/","publisher":"Zoom","context":"The article cites this Zoom security bulletin as covering CVE-2026-53415, a use-after-free flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eZoom patched flaws in its annotation tool that could have allowed someone sharing their screen to take over the computers of viewers, or allowed a viewer to take over the presenter’s client. The issue required no click, download, prompt, or visible sign beyond the victim being in the meeting. Fixes shipped in June and July, about two months before public disclosure, and no exploitation had been reported as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe affected versions included Zoom Workplace, Zoom Workplace VDI Client for Windows, Zoom Rooms, and the Zoom Meeting SDK before the fixed releases listed in the article. Zoom tracks the issues as CVE-2026-53413, CVE-2026-53414, and CVE-2026-53415, with vendor CVSS scores of 8.3, 6.5, and 8.3. The research came from A Security, which said it went from finding the flaw to a working exploit in under a day using fewer than 20 prompts on publicly available AI models, though the article says that claim cannot be checked outside the company.\u003c/p\u003e\n\n\u003cp\u003eThe technical details come from A Security’s reverse engineering because Zoom published no technical detail. The article says annotation drawings are sent as structured objects with counts followed by data, and one flaw let an oversized count overflow a fixed 128-byte buffer and overwrite the return address. Another issue involved missing checks on where a message came from, allowing a malformed object message to be accepted on a channel where an acknowledgement was expected.\u003c/p\u003e\n"},{"n":2,"title":"DDoS attacks over 1 Tbps surged fivefold in the second quarter","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ddos-attacks-over-1-tbps-surged-fivefold-in-the-second-quarter/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Cloudflare says DDoS attacks exceeding 1 Tbps surged more than fivefold in Q2, with over 800 such attacks mitigated compared to 130 in Q1. Overall DDoS activity also rose, though most attacks remained short and relatively small.","briefOverview":"\u003cp\u003eCloudflare says it mitigated more than 800 network-layer DDoS attacks exceeding 1 Tbps in the second quarter of the year. The company recorded just 130 attacks above 1 Tbps in the first quarter, making the latest figure a more than fivefold increase. Cloudflare reported the findings in a new report shared with BleepingComputer and presented at the Black Hat security conference.\u003c/p\u003e\n\n\u003cp\u003eIn the first half of the year, Cloudflare says it mitigated 23.2 million network-layer DDoS attacks and 29.64 trillion malicious HTTP requests. Network-layer DDoS attacks rose from 10.04 million in Q1 to 13.17 million in Q2, while malicious HTTP request volume grew from 12.75 trillion to 16.89 trillion. Overall DDoS activity peaked in April, with 6.46 trillion HTTP DDoS requests and 165 PB of network-layer attack traffic, followed by a decline Cloudflare tentatively attributed to Operation PowerOFF.\u003c/p\u003e\n\n\u003cp\u003eCloudflare observed a shift toward DNS-related and reflection/amplification techniques in the last quarter. DNS floods accounted for 40% of Q2 network-layer attacks, up from 25.7% in Q1, while CLDAP floods increased 881.9% quarter over quarter and UDP floods ranked second in Q2 at 14.06%. Despite the growth in very large attacks, Cloudflare said 96.62% of network-layer attacks remained below 50 Mbps and 90.6% ended within 10 minutes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare says it mitigated more than 800 network-layer DDoS attacks exceeding 1 Tbps in the second quarter, up from 130 such attacks in the first quarter.","Cloudflare reported mitigating 23.2 million network-layer DDoS attacks and 29.64 trillion malicious HTTP requests in the first half of the year.","Network-layer DDoS attacks rose from 10.04 million in Q1 to 13.17 million in Q2, while malicious HTTP request volume grew from 12.75 trillion to 16.89 trillion.","Cloudflare observed DDoS activity peaking in April, followed by a decline it tentatively linked to the international Operation PowerOFF crackdown on DDoS-for-hire services.","Cloudflare said attacks shifted toward DNS-related and reflection/amplification techniques, with DNS floods accounting for 40% of Q2 network-layer attacks."],"insights":["The sharp rise in attacks over 1 Tbps did not mean most attacks became large, since Cloudflare said 96.62% of network-layer attacks were still below 50 Mbps.","Short attacks remained the norm despite overall growth, with 90.6% of network-layer DDoS attacks ending within 10 minutes.","The share of attacks lasting more than three hours more than doubled from Q1 to Q2, rising from 0.387% to 0.828%, even though they remained rare.","DNS-related activity became a major concentration area, with DNS floods rising from 25.7% in Q1 to 40% in Q2 and CLDAP floods increasing 881.9% quarter over quarter.","Cloudflare observed a decline in DDoS activity after April and tentatively linked it to Operation PowerOFF, which targeted DDoS-for-hire services and warned 75,000 users."],"referencedReports":[],"body":"\u003cp\u003eCloudflare says it mitigated more than 800 network-layer DDoS attacks exceeding 1 Tbps in the second quarter of the year. The company recorded just 130 attacks above 1 Tbps in the first quarter, making the latest figure a more than fivefold increase. Cloudflare reported the findings in a new report shared with BleepingComputer and presented at the Black Hat security conference.\u003c/p\u003e\n\n\u003cp\u003eIn the first half of the year, Cloudflare says it mitigated 23.2 million network-layer DDoS attacks and 29.64 trillion malicious HTTP requests. Network-layer DDoS attacks rose from 10.04 million in Q1 to 13.17 million in Q2, while malicious HTTP request volume grew from 12.75 trillion to 16.89 trillion. Overall DDoS activity peaked in April, with 6.46 trillion HTTP DDoS requests and 165 PB of network-layer attack traffic, followed by a decline Cloudflare tentatively attributed to Operation PowerOFF.\u003c/p\u003e\n\n\u003cp\u003eCloudflare observed a shift toward DNS-related and reflection/amplification techniques in the last quarter. DNS floods accounted for 40% of Q2 network-layer attacks, up from 25.7% in Q1, while CLDAP floods increased 881.9% quarter over quarter and UDP floods ranked second in Q2 at 14.06%. Despite the growth in very large attacks, Cloudflare said 96.62% of network-layer attacks remained below 50 Mbps and 90.6% ended within 10 minutes.\u003c/p\u003e\n"},{"n":4,"title":"DeadLock ransomware uses blockchain to resist infrastructure takedown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/deadlock-ransomware-uses-blockchain-to-resist-infrastructure-takedown/","time":"22:15","priority":"SHOULD READ","score":82,"tldr":"DeadLock ransomware is using Polygon blockchain smart contracts and decentralized services to keep victim communications and leak-site infrastructure online even if traditional servers are taken down. Microsoft says the setup improves resilience but still depends on components like proxies, RPC endpoints, and Wasabi-hosted files that can be disrupted.","briefOverview":"\u003cp\u003eDeadLock ransomware is using decentralized infrastructure backed by blockchain services to protect its victim communications and data-leak activity. The operation emerged in mid-2025 and uses double-extortion tactics, combining data theft or leaks with file encryption to pressure victims into paying. By July, its data leak site listed 80 organizations, mostly in Europe, across sectors including IT, mining, transportation, manufacturing, hospitality, and consumer goods.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft researchers observed DeadLock being deployed by multiple groups, including an affiliate previously linked to the Lynx and INC ransomware ecosystems. The operators use the Polygon blockchain to store configuration data and leak-site posts, while the victim-facing HTML chat page retrieves the current chat-proxy address through a read-only eth_call. DeadLock also uses the decentralized Session network to encrypt victim communications and provides access to stolen files hosted on Wasabi.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said this setup lets the operators replace the chat proxy without modifying the victim-facing application and reduces dependence on conventional domains and web servers that law enforcement can take down. However, Microsoft noted the resilience is not absolute because communications still require the custom proxy, public Polygon RPC endpoints must remain accessible, and Wasabi-hosted files can be removed. DeadLock’s locker avoids certain countries and encrypts selected non-system directories using per-file XChaCha20 keys protected with Curve25519, while limiting resource usage so the victim may continue using the machine during encryption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DeadLock ransomware uses decentralized infrastructure backed by blockchain services to support victim communications and data-leak activity.","Microsoft researchers found that DeadLock stores configuration data and leak-site posts on the Polygon blockchain, with its HTML chat page retrieving the current chat-proxy address through a read-only eth_call.","DeadLock also uses the decentralized Session network to encrypt victim communications and provides access to stolen files hosted on the Wasabi cloud service.","Microsoft reported that DeadLock avoids countries in the former Soviet Union and Commonwealth of Independent States region, as well as Iran, Syria, Oman, and Yemen.","DeadLock encrypts selected non-system directories with per-file XChaCha20 keys protected by Curve25519 and renames encrypted files with a victim-specific identifier and the .dlock extension."],"insights":["DeadLock’s use of blockchain-stored command-and-control addresses is notable because Microsoft says this technique is common among cybercriminals but rare in ransomware operations.","DeadLock’s infrastructure is more resilient than a conventional Tor or web-server setup, but Microsoft notes it still has disruption points because it depends on a custom proxy, accessible public Polygon RPC endpoints, and removable Wasabi-hosted files.","DeadLock is designed to reduce visible disruption during encryption by limiting itself to up to 29% of system memory and 70% of CPU resources so victims may continue using the machine without major performance issues.","DeadLock speeds up encryption of larger files by encrypting 512-byte blocks intermittently while still making the files mostly irrecoverable.","Microsoft’s defensive recommendations emphasize blocking ransomware behavior after access is gained, including EDR in block mode, tamper protection, Controlled Folder Access, and rules that restrict PsExec and WMI-based lateral movement."],"referencedReports":[{"title":"DeadLock ransomware: Breaking down a Rust-based encryptor with decentralized recovery infrastructure","url":"https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware-breaking-down-a-rust-based-encryptor-with-decentralized-recovery-infrastructure/","publisher":"Microsoft","context":"The article cites Microsoft’s report as the source for details on DeadLock’s blockchain-backed infrastructure and encryption scheme.","category":"research","primary":true}],"body":"\u003cp\u003eDeadLock ransomware is using decentralized infrastructure backed by blockchain services to protect its victim communications and data-leak activity. The operation emerged in mid-2025 and uses double-extortion tactics, combining data theft or leaks with file encryption to pressure victims into paying. By July, its data leak site listed 80 organizations, mostly in Europe, across sectors including IT, mining, transportation, manufacturing, hospitality, and consumer goods.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft researchers observed DeadLock being deployed by multiple groups, including an affiliate previously linked to the Lynx and INC ransomware ecosystems. The operators use the Polygon blockchain to store configuration data and leak-site posts, while the victim-facing HTML chat page retrieves the current chat-proxy address through a read-only eth_call. DeadLock also uses the decentralized Session network to encrypt victim communications and provides access to stolen files hosted on Wasabi.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said this setup lets the operators replace the chat proxy without modifying the victim-facing application and reduces dependence on conventional domains and web servers that law enforcement can take down. However, Microsoft noted the resilience is not absolute because communications still require the custom proxy, public Polygon RPC endpoints must remain accessible, and Wasabi-hosted files can be removed. DeadLock’s locker avoids certain countries and encrypts selected non-system directories using per-file XChaCha20 keys protected with Curve25519, while limiting resource usage so the victim may continue using the machine during encryption.\u003c/p\u003e\n"},{"n":5,"title":"Cisco warns of high-severity ClamAV flaws with public exploits","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-high-severity-clamav-flaws-with-public-exploits/","time":"11:03","priority":"SHOULD READ","score":82,"tldr":"Cisco warned that two high-severity ClamAV flaws with public proof-of-concept exploits can let unauthenticated remote attackers crash the scanning process via crafted ZIP files, causing denial of service. ClamAV 1.5.4 fixes the issues, while Cisco plans Secure Endpoint Connector updates later this month.","briefOverview":"\u003cp\u003eCisco warned of two high-severity vulnerabilities affecting the Secure Endpoint Connector that can allow threat actors to crash the ClamAV scanning process in denial-of-service attacks. The flaws, tracked as CVE-2026-20337 and CVE-2026-20338, were found in the ZIP archive parser of ClamAV, the open-source and cross-platform engine used to scan files for malware. Cisco said unauthenticated, remote attackers can exploit the issues by submitting a crafted ZIP file for scanning.\u003c/p\u003e\n\n\u003cp\u003eCisco’s Product Security Incident Response Team said proof-of-concept exploit code is publicly available for the vulnerabilities, but it has no evidence they have been exploited in the wild. Cisco added that the security impact is high only for Windows platforms because they are the only ones that run the ClamAV scanning process in a privileged security context. The flaws affect ClamAV 1.5.0 through 1.5.3 and were patched in ClamAV 1.5.4, while Cisco plans Secure Endpoint Connector updates for Windows, Linux, and Mac later this month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco warned of two high-severity vulnerabilities, CVE-2026-20337 and CVE-2026-20338, affecting the Secure Endpoint Connector and the ClamAV ZIP archive parser.","Unauthenticated remote attackers can exploit the flaws by submitting a crafted ZIP file for scanning, causing the ClamAV scanning process to terminate and creating a denial-of-service condition.","Cisco’s PSIRT said proof-of-concept exploit code is publicly available for both vulnerabilities, but it has no evidence that the flaws have been exploited in the wild.","The vulnerabilities affect ClamAV versions 1.5.0 through 1.5.3 and were patched in ClamAV 1.5.4, released on August 7.","Cisco said the security impact is high only on Windows platforms and plans to release updates later this month for affected Secure Endpoint Connector versions on Windows, Linux, and Mac."],"insights":["Windows deployments deserve the most urgent attention because Cisco says only Windows runs the ClamAV scanning process in a privileged security context, making the impact high on that platform.","There are no workarounds for CVE-2026-20337 and CVE-2026-20338, so remediation depends on applying ClamAV 1.5.4 or waiting for Cisco’s planned Secure Endpoint Connector updates.","The flaws are easier to operationalize than many vulnerabilities because Cisco says public proof-of-concept exploit code is already available, even though it has not seen in-the-wild exploitation.","The affected attack path is file scanning itself: a malicious ZIP submitted for inspection can disable the scanner, potentially preventing or delaying later scanning operations."],"referencedReports":[{"title":"Cisco Security Advisory for ClamAV vulnerabilities CVE-2026-20337 and CVE-2026-20338","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-clamav-WuuvVd26","publisher":"Cisco","context":"The article cites Cisco's Friday advisory as the source describing how crafted ZIP files can terminate the ClamAV scanning process and noting public proof-of-concept exploit code.","category":"advisory","primary":true},{"title":"CVE-2026-20337 GitHub Advisory","url":"https://github.com/advisories/GHSA-rhg3-hwfw-hp7p","publisher":"GitHub","context":"The article links to this advisory when identifying one of the two high-severity ClamAV ZIP archive parser vulnerabilities.","category":"advisory","primary":false},{"title":"CVE-2026-20338 GitHub Advisory","url":"https://github.com/advisories/GHSA-xw98-8fcm-j8x7","publisher":"GitHub","context":"The article links to this advisory when identifying one of the two high-severity ClamAV ZIP archive parser vulnerabilities.","category":"advisory","primary":false},{"title":"ClamAV 1.5.4 and 1.4.6 Security Patch","url":"https://blog.clamav.net/2026/08/clamav-154-and-146-security-patch.html","publisher":"ClamAV","context":"The article references this release post to state that the vulnerabilities were patched in ClamAV 1.5.4, released on August 7.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco warned of two high-severity vulnerabilities affecting the Secure Endpoint Connector that can allow threat actors to crash the ClamAV scanning process in denial-of-service attacks. The flaws, tracked as CVE-2026-20337 and CVE-2026-20338, were found in the ZIP archive parser of ClamAV, the open-source and cross-platform engine used to scan files for malware. Cisco said unauthenticated, remote attackers can exploit the issues by submitting a crafted ZIP file for scanning.\u003c/p\u003e\n\n\u003cp\u003eCisco’s Product Security Incident Response Team said proof-of-concept exploit code is publicly available for the vulnerabilities, but it has no evidence they have been exploited in the wild. Cisco added that the security impact is high only for Windows platforms because they are the only ones that run the ClamAV scanning process in a privileged security context. The flaws affect ClamAV 1.5.0 through 1.5.3 and were patched in ClamAV 1.5.4, while Cisco plans Secure Endpoint Connector updates for Windows, Linux, and Mac later this month.\u003c/p\u003e\n"},{"n":19,"title":"Cyberattack on logistics giant Ceva hits retailers and Steam customers across Europe","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ceva-logistics-cyberattack-bol-steam-debijenkorf-ace-tate","time":"15:43","priority":"SHOULD READ","score":82,"tldr":"A cyberattack on Ceva Logistics disrupted operations at eight European warehouses, delaying shipments for major retailers and Steam hardware customers. Customer and shipment data from companies including Bol, De Bijenkorf, Ajax, Ace \u0026 Tate and Valve may have been exposed.","briefOverview":"\u003cp\u003eA cyberattack on Ceva Logistics reportedly disrupted part of the company’s contract logistics business in Europe. The incident affected operations at eight warehouses and caused shipping delays for retailers whose inventory was stored at those facilities. Ceva has not publicly disclosed the attack and did not respond to a request for comment, according to the article.\u003c/p\u003e\n\n\u003cp\u003eAffected companies reportedly include Bol, De Bijenkorf, Ace \u0026amp; Tate, Ajax and Steam’s hardware business in Europe. Bol said cybercriminals accessed two Ceva systems used to process orders from one of its distribution centers, while Bol’s own systems were not affected. Potentially exposed information included names, addresses, postal codes, telephone numbers, email addresses, order numbers, tracking information and purchase details.\u003c/p\u003e\n\n\u003cp\u003eValve notified European customers that information associated with physical Steam hardware purchases may have been compromised because Ceva handles its shipments in Europe. Valve said Ceva receives delivery information and can retain those records for up to 90 days after an order, and that it could not determine exactly which records attackers obtained. The article says there has been no public attribution for the attack and it remains unclear whether ransomware was used or an extortion demand was made.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on Ceva Logistics reportedly disrupted operations at eight warehouses in Europe, causing shipping delays for retailers whose inventory was stored at the affected facilities.","Bol said cybercriminals accessed two Ceva systems used to process orders from one of its distribution centers, while Bol’s own systems were not affected.","Potentially exposed customer data included names, addresses, postal codes, telephone numbers, email addresses, order numbers, tracking information and purchase details.","Valve notified European customers that information linked to purchases of physical Steam hardware may have been compromised because Ceva handles its shipments in Europe.","Ceva has not publicly disclosed the attack, and the article says it remains unclear who was behind it or whether a ransom demand was made."],"insights":["The incident shows that customer exposure can come from logistics systems rather than a retailer’s own systems, as Bol said its own systems were not affected while Ceva systems used for order processing were accessed.","Several affected companies notified customers even though Ceva had not publicly disclosed the attack, making client notifications a key source of information about the incident.","Valve said Ceva could retain delivery records for up to 90 days after an order, which expanded the set of Steam hardware customers Valve considered potentially affected.","The reported disruption was limited to part of Ceva’s contract logistics business, while its air, ocean, ground and rail transportation management operations reportedly continued without disruption."],"referencedReports":[],"body":"\u003cp\u003eA cyberattack on Ceva Logistics reportedly disrupted part of the company’s contract logistics business in Europe. The incident affected operations at eight warehouses and caused shipping delays for retailers whose inventory was stored at those facilities. Ceva has not publicly disclosed the attack and did not respond to a request for comment, according to the article.\u003c/p\u003e\n\n\u003cp\u003eAffected companies reportedly include Bol, De Bijenkorf, Ace \u0026amp; Tate, Ajax and Steam’s hardware business in Europe. Bol said cybercriminals accessed two Ceva systems used to process orders from one of its distribution centers, while Bol’s own systems were not affected. Potentially exposed information included names, addresses, postal codes, telephone numbers, email addresses, order numbers, tracking information and purchase details.\u003c/p\u003e\n\n\u003cp\u003eValve notified European customers that information associated with physical Steam hardware purchases may have been compromised because Ceva handles its shipments in Europe. Valve said Ceva receives delivery information and can retain those records for up to 90 days after an order, and that it could not determine exactly which records attackers obtained. The article says there has been no public attribution for the attack and it remains unclear whether ransomware was used or an extortion demand was made.\u003c/p\u003e\n"},{"n":21,"title":"Researchers Turn USB Auto-Install Into a Full SYSTEM Takeover on Windows 11","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/researchers-turn-usb-auto-install-into.html","time":"10:48","priority":"SHOULD READ","score":82,"tldr":"Researchers showed that Windows Plug and Play auto-installation can be abused to install signed vendor software for emulated USB devices and chain third-party driver flaws into SYSTEM-level code execution on a fully updated Windows 11 system. The attack requires either physical USB device emulation or non-default Remote Desktop USB redirection, so admins should restrict device installation and leave USB/PnP redirection disabled unless needed.","briefOverview":"\u003cp\u003eSecurity researchers Alejandro Hernando and Borja Martinez described a technique called \u003cstrong\u003e“Plug And Pwn: Weaponizing Windows PnP Auto-Install”\u003c/strong\u003e that abuses Windows Plug and Play to fetch signed vendor software for an emulated USB device. The researchers said that, under the required conditions, an unprivileged user can turn the Plug and Play installation path into SYSTEM code execution. Their disclosed demonstration used a fully updated Windows 11 system, and the article cautions that the result should not be generalized to untested Windows versions.\u003c/p\u003e\n\n\u003cp\u003eIn the physical chain, the researchers emulated a Sierra Wireless device so Windows installed SwiService.exe, a SYSTEM service exposing a SetDNS primitive. They used it to redirect DNS, then emulated a Sony FeliCa reader whose co-installer retrieved configuration files over plaintext HTTP and derived local filenames from URL paths. The researchers said a path-traversal flaw allowed them to place a DLL in System32, and reconnecting the Sierra device then loaded the planted DLL and yielded SYSTEM access.\u003c/p\u003e\n\n\u003cp\u003eThe same Plug and Play path can also be triggered over Remote Desktop without physical hardware when supported Plug and Play or low-level USB redirection is enabled, but Microsoft says that redirection is not allowed by default. In the remote variant, the researchers’ Python client forged a USB identity and presented a phantom Intel RealSense device, leading Windows down the redirected device-installation path. The article says administrators that do not need the feature can leave it disabled and can use Microsoft device-installation restrictions to allow or block devices by hardware ID, compatible ID, device-instance ID, or setup class.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers Alejandro Hernando and Borja Martinez described a technique called “Plug And Pwn: Weaponizing Windows PnP Auto-Install” that abuses Windows Plug and Play to fetch signed vendor software for emulated USB devices and execute privileged installation components.","The researchers demonstrated a physical attack chain on a fully updated Windows 11 system by emulating a Sierra Wireless device, using a SYSTEM service to redirect DNS, then emulating a Sony FeliCa reader whose co-installer could place a DLL in System32 through a path-traversal flaw.","Reconnecting the emulated Sierra Wireless device caused the planted DLL to load and yielded SYSTEM access, according to the researchers.","The same Plug and Play installation path can be triggered over Remote Desktop with synthetic USB traffic when supported Plug and Play or low-level USB redirection is enabled, but Microsoft says these redirection features are not allowed by default.","The remote variant described by the researchers presents a phantom Intel RealSense device and abuses the resulting RealSense software through a CRYPTBASE.dll search-order hijack from a user-writable installation directory to gain SYSTEM code execution."],"insights":["The attack does not depend on unsigned or obviously malicious drivers; it abuses Windows’ normal trust in signed third-party vendor installation packages selected through Plug and Play hardware IDs.","Remote exposure is configuration-dependent because Microsoft says supported Plug and Play and RemoteFX USB redirection are not allowed by default, making disabled USB redirection a meaningful mitigation rather than merely a hardening preference.","Device-installation restriction policies can be used to control this risk because Microsoft allows administrators to permit or block devices by hardware ID, compatible ID, device-instance ID, and setup class, including on Remote Desktop servers where redirected devices are involved.","The article cautions that the demonstrated SYSTEM takeover should not be generalized across untested Windows versions, because the disclosed test was performed on a fully updated Windows 11 system."],"referencedReports":[{"title":"Plug And Pwn: Weaponizing Windows PnP Auto-Install","url":"https://plugandpwn.com/","publisher":"Alejandro Hernando and Borja Martinez","context":"The article is based on research prepared for DEF CON 34 that describes abusing Windows Plug and Play auto-installation to gain SYSTEM access.","category":"research","primary":true}],"body":"\u003cp\u003eSecurity researchers Alejandro Hernando and Borja Martinez described a technique called \u003cstrong\u003e“Plug And Pwn: Weaponizing Windows PnP Auto-Install”\u003c/strong\u003e that abuses Windows Plug and Play to fetch signed vendor software for an emulated USB device. The researchers said that, under the required conditions, an unprivileged user can turn the Plug and Play installation path into SYSTEM code execution. Their disclosed demonstration used a fully updated Windows 11 system, and the article cautions that the result should not be generalized to untested Windows versions.\u003c/p\u003e\n\n\u003cp\u003eIn the physical chain, the researchers emulated a Sierra Wireless device so Windows installed SwiService.exe, a SYSTEM service exposing a SetDNS primitive. They used it to redirect DNS, then emulated a Sony FeliCa reader whose co-installer retrieved configuration files over plaintext HTTP and derived local filenames from URL paths. The researchers said a path-traversal flaw allowed them to place a DLL in System32, and reconnecting the Sierra device then loaded the planted DLL and yielded SYSTEM access.\u003c/p\u003e\n\n\u003cp\u003eThe same Plug and Play path can also be triggered over Remote Desktop without physical hardware when supported Plug and Play or low-level USB redirection is enabled, but Microsoft says that redirection is not allowed by default. In the remote variant, the researchers’ Python client forged a USB identity and presented a phantom Intel RealSense device, leading Windows down the redirected device-installation path. The article says administrators that do not need the feature can leave it disabled and can use Microsoft device-installation restrictions to allow or block devices by hardware ID, compatible ID, device-instance ID, or setup class.\u003c/p\u003e\n"},{"n":25,"title":"Kimwolf v7 Android Botnet Makes HTTP/2 DDoS Traffic Look Like Legitimate Browsing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/kimwolf-v7-android-botnet-makes-http2.html","time":"19:36","priority":"SHOULD READ","score":82,"tldr":"Kimwolf v7 is a more resilient Android/IoT botnet that uses realistic HTTP/2 browser fingerprints to make DDoS traffic harder to distinguish from legitimate browsing. Its operators have also shifted propagation outside the core malware while using ENS, Tor, and local proxy routing to make command-and-control harder to disrupt.","briefOverview":"\u003cp\u003eCybersecurity researchers have discovered Kimwolf v7, a new version of the Kimwolf/AISURU Android and Internet of Things botnet. Palo Alto Networks Unit 42 found the version in February 2026 and said it includes major changes to improve operational resilience and conduct distributed denial-of-service attacks. The botnet is known to target Android TV boxes, while its Linux counterpart AISURU primarily focuses on Linux IoT devices.\u003c/p\u003e\n\n\u003cp\u003eKimwolf v7 adds an HTTP/2-based flood that builds complete browser fingerprints, which makes attack traffic harder to distinguish from legitimate browsing. The botnet also uses Ethereum Name Service to obtain command-and-control addresses, a hard-coded Tor .onion hidden service as a backup, and a local proxy for routing command-and-control traffic. Unit 42 said the removal of scanning, exploitation, and brute-force functions indicates that propagation has been split from the core payload and offloaded to an external loader.\u003c/p\u003e\n\n\u003cp\u003eThe malware typically reaches Android TVs that have Android Debug Bridge enabled on port 5555 and can install malware capable of DDoS attacks and traffic relay. Once launched, it attempts to disguise itself as legitimate Android system processes such as \u0026ldquo;netd_service.\u0026rdquo; Unit 42 said organizations should treat Android TV boxes as untrusted, segment them from enterprise networks, and disable ADB or restrict it to USB-only access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks Unit 42 discovered Kimwolf v7 in February 2026 as a new version of the Kimwolf/AISURU Android and IoT botnet.","Kimwolf v7 adds an HTTP/2-based DDoS flood that builds complete browser fingerprints, making attack traffic harder to distinguish from legitimate browsing.","The botnet uses Ethereum Name Service, a hard-coded Tor .onion hidden service, and a local proxy to make its command-and-control infrastructure more resistant to takedown efforts.","Kimwolf v7 removed scanning, exploitation, and brute-force functionality, indicating that propagation has been split from the core payload and offloaded to an external loader.","Unit 42 said organizations should treat Android TV boxes as untrusted, segment them from enterprise networks, and disable ADB or restrict it to USB-only access."],"insights":["Kimwolf v7’s removal of scanning, exploitation, and brute-force code suggests defenders may not see the infection mechanism in the main bot binary because initial access has been moved to a separate external loader.","Disabling or restricting Android Debug Bridge is especially actionable because the article identifies exposed ADB on port 5555 as the primary propagation vector for Kimwolf on Android TV boxes.","The use of legitimate public Ethereum RPC services to resolve command-and-control addresses means blocking only obvious malicious infrastructure may be insufficient for disrupting the botnet’s communications.","The shift in APK payload filenames between libnkernel.so and libdevice.so shows the operators are actively adjusting how conspicuous their Android payloads appear.","Kimwolf v7’s local proxy design routes both clearnet and Tor command-and-control traffic through 127.0.0.1:23075, giving defenders a concrete local indicator to look for on infected devices."],"referencedReports":[{"title":"Kimwolf v7 Botnet Malware","url":"https://unit42.paloaltonetworks.com/kimwolf-v7-botnet-malware/","publisher":"Palo Alto Networks Unit 42","context":"The article says Palo Alto Networks Unit 42 discovered Kimwolf v7 in February 2026 and cites its technical findings throughout the piece.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers have discovered Kimwolf v7, a new version of the Kimwolf/AISURU Android and Internet of Things botnet. Palo Alto Networks Unit 42 found the version in February 2026 and said it includes major changes to improve operational resilience and conduct distributed denial-of-service attacks. The botnet is known to target Android TV boxes, while its Linux counterpart AISURU primarily focuses on Linux IoT devices.\u003c/p\u003e\n\n\u003cp\u003eKimwolf v7 adds an HTTP/2-based flood that builds complete browser fingerprints, which makes attack traffic harder to distinguish from legitimate browsing. The botnet also uses Ethereum Name Service to obtain command-and-control addresses, a hard-coded Tor .onion hidden service as a backup, and a local proxy for routing command-and-control traffic. Unit 42 said the removal of scanning, exploitation, and brute-force functions indicates that propagation has been split from the core payload and offloaded to an external loader.\u003c/p\u003e\n\n\u003cp\u003eThe malware typically reaches Android TVs that have Android Debug Bridge enabled on port 5555 and can install malware capable of DDoS attacks and traffic relay. Once launched, it attempts to disguise itself as legitimate Android system processes such as \u0026ldquo;netd_service.\u0026rdquo; Unit 42 said organizations should treat Android TV boxes as untrusted, segment them from enterprise networks, and disable ADB or restrict it to USB-only access.\u003c/p\u003e\n"},{"n":29,"title":"A Malicious SIM Card Can Run Attacker Code Inside the Modems Behind Cellular IoT Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/a-malicious-sim-card-can-run-attacker.html","time":"12:05","priority":"SHOULD READ","score":82,"tldr":"Researchers found that malicious SIM cards can use the standardized RUN AT command interface to execute attacker-controlled commands inside some Qualcomm-based cellular modems, enabling takeover of IoT devices such as EV chargers and industrial routers. The issue affects several Quectel modules and a few phones, with mitigations planned but no broad public advisories or confirmed exploitation yet.","briefOverview":"\u003cp\u003eResearchers at the University of Birmingham and Fuzzware found that a malicious SIM card can use the standardized RUN AT command to make some cellular modems execute commands chosen by an attacker. They tested 26 phones and cellular modules and found the capability enabled in 9 devices, including 6 of 8 cellular modules and 3 of 18 phones. The affected phones named in the article were the OPPO Find X5, OPPO Reno 14 F 5G, and ASUS Zenfone 9, while the most exposed hardware was machine-to-machine equipment using Quectel modules.\u003c/p\u003e\n\n\u003cp\u003eThe article says the attack requires a hostile card already in the device, such as one swapped by hand, inserted as a thin interposer, pushed by a compromised operator, or subverted in software or on the production line. This makes unattended cellular IoT gear with accessible SIM trays a particularly relevant target, including electric-vehicle chargers, industrial routers, car telematics units, payment terminals, and other devices. The researchers used the technique to run code on a commercial Autel EV charger containing a Quectel EC25AFXDGA module.\u003c/p\u003e\n\n\u003cp\u003eThe technical issue centers on RUN AT, a SIM proactive command that asks the modem to execute AT commands, which can expose a broad control interface to the SIM. Every device that accepted the command used a Qualcomm communication processor, but five other Qualcomm-based handsets in the survey did not accept it, which the paper suggests may be due to vendor customization. Qualcomm said it has built a hardened configuration that disables the interface by default, Quectel said it has mitigated a file-access flaw and is still working on the interface itself, and the article says no attacks using the interface have been reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at the University of Birmingham and Fuzzware tested 26 phones and cellular modules and found that 9 accepted the SIM-issued RUN AT command, including 6 of 8 cellular modules and 3 of 18 phones.","The attack requires a hostile SIM card already in the device, which could be swapped by hand, inserted as a thin interposer, pushed by a compromised operator, or subverted in software or on the production line.","The affected devices all run a Qualcomm communication processor, but five other Qualcomm-based handsets in the survey did not accept the command, which the paper attributes to vendor customization.","The researchers used the capability to achieve code execution on a commercial Autel EV charger containing a Quectel EC25AFXDGA module through a flaw in the module’s atfwd_daemon.","Qualcomm said it has built a hardened configuration that disables the interface by default, while Quectel said it has mitigated the file-access flaw and is still working on the interface itself."],"insights":["The most exposed environment is not ordinary smartphones but unattended cellular IoT equipment with accessible SIM trays, because the attack requires a hostile card already in the slot and those devices often have few other exposed interfaces.","There is no universal patch because RUN AT is a standardized SIM capability, and the article says disabling or hardening it depends on choices made by individual vendors for their own products.","Operators of cellular IoT fleets have an immediate action available: ask module suppliers whether RUN AT is enabled in the shipped firmware and whether it can be disabled.","The same Qualcomm base does not guarantee the same exposure, because all nine devices that accepted RUN AT used Qualcomm communication processors while five other Qualcomm-based handsets in the survey did not accept it.","Verification at fleet scale is difficult because Quectel does not release firmware updates publicly and its vulnerability portal requires a login, while affected and fixed firmware version numbers have not been published."],"referencedReports":[{"title":"USENIX WOOT 2026 paper by Lisowski et al.","url":"https://www.usenix.org/system/files/woot26-lisowski.pdf","publisher":"University of Birmingham and Fuzzware","context":"The article relies on the researchers' paper for the device survey results, technical findings, and case studies involving RUN AT commands from hostile SIMs.","category":"research","primary":true},{"title":"Android Security Bulletin—December 2025","url":"https://source.android.com/docs/security/bulletin/2025-12-01","publisher":"Google","context":"The article cites this bulletin as the place where Google patched the separate CVE-2025-48618 issue involving a hostile SIM opening an attacker-controlled web page on locked Android phones.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers at the University of Birmingham and Fuzzware found that a malicious SIM card can use the standardized RUN AT command to make some cellular modems execute commands chosen by an attacker. They tested 26 phones and cellular modules and found the capability enabled in 9 devices, including 6 of 8 cellular modules and 3 of 18 phones. The affected phones named in the article were the OPPO Find X5, OPPO Reno 14 F 5G, and ASUS Zenfone 9, while the most exposed hardware was machine-to-machine equipment using Quectel modules.\u003c/p\u003e\n\n\u003cp\u003eThe article says the attack requires a hostile card already in the device, such as one swapped by hand, inserted as a thin interposer, pushed by a compromised operator, or subverted in software or on the production line. This makes unattended cellular IoT gear with accessible SIM trays a particularly relevant target, including electric-vehicle chargers, industrial routers, car telematics units, payment terminals, and other devices. The researchers used the technique to run code on a commercial Autel EV charger containing a Quectel EC25AFXDGA module.\u003c/p\u003e\n\n\u003cp\u003eThe technical issue centers on RUN AT, a SIM proactive command that asks the modem to execute AT commands, which can expose a broad control interface to the SIM. Every device that accepted the command used a Qualcomm communication processor, but five other Qualcomm-based handsets in the survey did not accept it, which the paper suggests may be due to vendor customization. Qualcomm said it has built a hardened configuration that disables the interface by default, Quectel said it has mitigated a file-access flaw and is still working on the interface itself, and the article says no attacks using the interface have been reported.\u003c/p\u003e\n"},{"n":33,"title":"OpenAI Launches GPT-5.6-Cyber with Reduced Safeguards for Exploit Development","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/openai-launches-gpt-56-cyber-with.html","time":"13:11","priority":"SHOULD READ","score":82,"tldr":"OpenAI launched GPT-5.6-Cyber, a more permissive cybersecurity model for trusted partners that can assist with exploit development, vulnerability research, and security testing. The key takeaway is that OpenAI is deliberately expanding controlled access to frontier cyber capabilities for defenders despite the heightened misuse risks.","briefOverview":"\u003cp\u003eOpenAI unveiled GPT-5.6-Cyber, a cybersecurity-focused model built on GPT-5.6 Sol for vulnerability research, penetration testing, and incident response. The company said the model is trained to improve tasks such as finding zero-day vulnerabilities and developing exploit chains, while reducing refusals for certain higher-risk, dual-use cyber tasks. It is being made available through Daybreak Red, a new access tier for trusted partners conducting authorized vulnerability research, exploit validation, and security testing.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said GPT-5.6-Cyber completed 95.0% of requests in its Advanced Cybersecurity Completion Rate evaluation, compared with 1.5% for GPT-5.6 Sol, 2.0% with Daybreak Blue access, and 57.3% for GPT-5.5-Cyber. The model also outperformed GPT-5.6 Sol and GPT-5.5-Cyber on the ExploitGym benchmark, though OpenAI said it performed worse than GPT-5.6 Sol on open-ended tasks involving vulnerability discovery, proof-of-concept development, and report submission. One high-severity flaw found by the model was CVE-2026-15903, a V8 JavaScript engine out-of-bounds read and write vulnerability patched by Google in July 2026.\u003c/p\u003e\n\n\u003cp\u003eGPT-5.6-Cyber has been made available to trusted customer partners including Accenture, Akamai, Cisco, Cloudflare, CrowdStrike, Fortinet, IBM, Palo Alto Networks, PwC, and Sophos. OpenAI framed the release as a way to help defenders identify and patch vulnerabilities before attackers exploit them, as AI is also helping cybercriminals and nation-state hackers carry out attacks faster and at greater scale. The article also notes that AI-generated patches still require substantial human review, citing 1Password findings that models fully resolved vulnerabilities without materially changing application behavior only 26.0% of the time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI unveiled GPT-5.6-Cyber, a cybersecurity-focused model built on GPT-5.6 Sol for vulnerability research, penetration testing, and incident response.","OpenAI said GPT-5.6-Cyber is designed to reduce refusals for certain higher-risk, dual-use cyber tasks and completed 95.0% of requests in its Advanced Cybersecurity Completion Rate evaluation.","The model has been made available through Daybreak Red to trusted customer partners including Accenture, Akamai, Cisco, Cloudflare, CrowdStrike, Fortinet, IBM, Palo Alto Networks, PwC, and Sophos.","OpenAI said GPT-5.6-Cyber helped discover CVE-2026-15903, a high-severity V8 JavaScript engine vulnerability patched by Google in July 2026.","The article states that AI is shortening the path from vulnerability disclosure to exploitation, while AI-generated patches still require substantial human review and often fail to fully resolve vulnerabilities."],"insights":["OpenAI’s internal evaluation shows a dramatic policy and capability gap between access tiers: GPT-5.6-Cyber completed 95.0% of advanced cyber requests, while GPT-5.6 Sol completed 1.5% and Daybreak Blue completed 2.0%.","GPT-5.6-Cyber outperformed other models on exploit-focused benchmarks, but OpenAI said it performed worse than GPT-5.6 Sol on open-ended vulnerability discovery and reporting because it sometimes produced shorter, less detailed reports.","The article highlights an asymmetry in current AI security use: models are improving at finding and exploiting vulnerabilities, but 1Password found they fully fixed vulnerabilities without materially changing behavior only 26.0% of the time.","OpenAI is limiting the more permissive Daybreak Red access to trusted customer partners, reflecting its stated concern that models with reduced safeguards carry misuse and misalignment risks beyond standard model usage."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/07/stable-channel-update-for-desktop_049796704.html","publisher":"Google","context":"The article links to Google’s Chrome release note when discussing CVE-2026-15903, a V8 vulnerability that Google patched in July 2026.","category":"advisory","primary":false},{"title":"Why AI-generated patches still require human review","url":"https://1password.com/blog/why-ai-generated-patches-still-require-human-review","publisher":"1Password","context":"The article cites 1Password’s findings that AI-generated patches fully resolved vulnerabilities without materially changing application behavior only 26.0% of the time.","category":"research","primary":false}],"body":"\u003cp\u003eOpenAI unveiled GPT-5.6-Cyber, a cybersecurity-focused model built on GPT-5.6 Sol for vulnerability research, penetration testing, and incident response. The company said the model is trained to improve tasks such as finding zero-day vulnerabilities and developing exploit chains, while reducing refusals for certain higher-risk, dual-use cyber tasks. It is being made available through Daybreak Red, a new access tier for trusted partners conducting authorized vulnerability research, exploit validation, and security testing.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said GPT-5.6-Cyber completed 95.0% of requests in its Advanced Cybersecurity Completion Rate evaluation, compared with 1.5% for GPT-5.6 Sol, 2.0% with Daybreak Blue access, and 57.3% for GPT-5.5-Cyber. The model also outperformed GPT-5.6 Sol and GPT-5.5-Cyber on the ExploitGym benchmark, though OpenAI said it performed worse than GPT-5.6 Sol on open-ended tasks involving vulnerability discovery, proof-of-concept development, and report submission. One high-severity flaw found by the model was CVE-2026-15903, a V8 JavaScript engine out-of-bounds read and write vulnerability patched by Google in July 2026.\u003c/p\u003e\n\n\u003cp\u003eGPT-5.6-Cyber has been made available to trusted customer partners including Accenture, Akamai, Cisco, Cloudflare, CrowdStrike, Fortinet, IBM, Palo Alto Networks, PwC, and Sophos. OpenAI framed the release as a way to help defenders identify and patch vulnerabilities before attackers exploit them, as AI is also helping cybercriminals and nation-state hackers carry out attacks faster and at greater scale. The article also notes that AI-generated patches still require substantial human review, citing 1Password findings that models fully resolved vulnerabilities without materially changing application behavior only 26.0% of the time.\u003c/p\u003e\n"},{"n":34,"title":"Malicious MCP Servers Can Split Instructions to Make AI Coding Agents Exfiltrate Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/malicious-mcp-servers-can-split.html","time":"10:24","priority":"SHOULD READ","score":82,"tldr":"Researchers found that malicious MCP servers can split harmful instructions across tool descriptions and results, causing AI coding agents to combine them and exfiltrate secrets such as SSH keys, .env files, source code, and customer data. The main lesson is that MCP clients must treat server output as untrusted data and prevent unchecked data flow between tools, because safety depends heavily on the surrounding client controls, not just the model.","briefOverview":"\u003cp\u003eASSET Research Group disclosed GhostSplice, a technique showing that a malicious MCP server connected to an AI coding assistant can make the assistant exfiltrate SSH keys, environment secrets, source code, and customer data. The disclosure describes controlled tests in isolated projects seeded with fake credentials, not a reported real-world intrusion. The attack assumes the developer has already connected the attacker’s MCP server and that the agent can already read the files being taken.\u003c/p\u003e\n\n\u003cp\u003eGhostSplice works by splitting a malicious request into fragments that each appear routine, such as placing one fragment in a tool description and another in a tool result. In the reference implementation, a harmless-looking tool called integrity_checker has fields named alpha through delta, while a later project-scan result maps those fields to files including .ssh/id_rsa, proprietary source, customers.csv, and .env. Read separately, neither piece contains the full theft request, but read together they instruct the agent to collect sensitive local files and pass their contents to the attacker’s tool.\u003c/p\u003e\n\n\u003cp\u003eASSET reported that splitting the request into two pieces raised average compliance from 42% to 82% across eleven API-tested models, with results varying by model, coding client, and surrounding safety controls. The article notes that the same model can refuse in one coding client and exfiltrate in another, so the results should not be treated as a simple model ranking. The recommended defense is for clients to treat server output as data rather than instructions and to stop values from one tool’s output from flowing unchecked into another tool’s arguments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ASSET Research Group disclosed GhostSplice, a technique in controlled tests where a malicious MCP server splits instructions across tool descriptions, tool results, and in some setups server-initiated sampling to make AI coding agents exfiltrate secrets.","The attack assumes the developer has already connected the attacker’s MCP server and that the agent can already read the files being taken, so it is not a way to break into an arbitrary agent from the outside.","In the reference implementation, a harmless-looking integrity_checker tool with fields named alpha through delta is later paired with a project-scan result that maps those fields to files such as .ssh/id_rsa, proprietary source, customers.csv, and .env.","ASSET reported that splitting the request into two pieces raised average compliance from 42% to 82% across eleven API-tested models, while results varied significantly by coding client and safety controls around the same model.","The article says defenses should focus on the client by treating server output as data rather than instructions and preventing values from one tool’s output from flowing unchecked into another tool’s arguments."],"insights":["The same model can refuse the attack in one coding client but comply in another, showing that the surrounding client controls can change the outcome as much as the model choice.","Simple fill-in-the-blanks framing was more effective than elaborate compliance or governance stories because it gave the model fewer false claims to question.","A 0% score in the published results did not necessarily mean no sensitive data was exposed, since ASSET said Claude Sonnet still sent proprietary source containing a live hardcoded key in one test while redacting more obvious secrets.","MCP’s structured separation between tools and results did not stop agents in ASSET’s tests from combining instruction fragments across those boundaries within the same working context."],"referencedReports":[{"title":"GhostSplice","url":"https://asset-group.github.io/disclosures/ghostsplice/","publisher":"ASSET Research Group","context":"The article cites ASSET Research Group's GhostSplice disclosure for the reported test results and compliance rates across models and clients.","category":"research","primary":true},{"title":"Developer mode and MCP apps in ChatGPT","url":"https://help.openai.com/en/articles/12584461-developer-mode-and-mcp-apps-in-chatgpt","publisher":"OpenAI","context":"The article references OpenAI's guidance warning that unsafe MCP servers increase prompt-injection risk and advising organizations to vet custom and third-party integrations.","category":"guide","primary":false}],"body":"\u003cp\u003eASSET Research Group disclosed GhostSplice, a technique showing that a malicious MCP server connected to an AI coding assistant can make the assistant exfiltrate SSH keys, environment secrets, source code, and customer data. The disclosure describes controlled tests in isolated projects seeded with fake credentials, not a reported real-world intrusion. The attack assumes the developer has already connected the attacker’s MCP server and that the agent can already read the files being taken.\u003c/p\u003e\n\n\u003cp\u003eGhostSplice works by splitting a malicious request into fragments that each appear routine, such as placing one fragment in a tool description and another in a tool result. In the reference implementation, a harmless-looking tool called integrity_checker has fields named alpha through delta, while a later project-scan result maps those fields to files including .ssh/id_rsa, proprietary source, customers.csv, and .env. Read separately, neither piece contains the full theft request, but read together they instruct the agent to collect sensitive local files and pass their contents to the attacker’s tool.\u003c/p\u003e\n\n\u003cp\u003eASSET reported that splitting the request into two pieces raised average compliance from 42% to 82% across eleven API-tested models, with results varying by model, coding client, and surrounding safety controls. The article notes that the same model can refuse in one coding client and exfiltrate in another, so the results should not be treated as a simple model ranking. The recommended defense is for clients to treat server output as data rather than instructions and to stop values from one tool’s output from flowing unchecked into another tool’s arguments.\u003c/p\u003e\n"},{"n":37,"title":"AI Sidebar Extension Monetizes Its Own Updates","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/ai-s
