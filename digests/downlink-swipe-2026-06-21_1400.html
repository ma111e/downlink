<script type="application/json" id="dl-articles">[{"n":1,"title":"AryStinger botnet infected thousands of D-Link routers worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/arystinger-botnet-infected-thousands-of-d-link-routers-worldwide/","time":"14:14","priority":"SHOULD READ","score":85,"tldr":"A new botnet called AryStinger has infected more than 4,000 outdated D-Link routers worldwide, turning them into proxies for scanning, tunneling, command execution, and potential traffic interception. Owners of end-of-life routers should replace them or update firmware, change default passwords, and disable remote management.","briefOverview":"\u003cp\u003eA previously undocumented malware botnet named AryStinger has compromised more than 4,000 outdated routers and turns them into proxies for malicious traffic. Qianxin\u0026rsquo;s XLab threat intelligence team says infected devices become remotely controlled “executors” that can perform scanning, proxying, tunneling, command execution, and other attacker-directed activity. The attacker can split large scanning tasks into smaller chunks and distribute them across infected devices for parallel execution.\u003c/p\u003e\n\n\u003cp\u003eXLab warns that AryStinger can also tamper with DNS settings, hijack user browsing, and silently monitor and potentially steal inbound and outbound network traffic. The malware exploits older flaws including CVE-2013-3307, CVE-2016-5681, and CVE-2025-11837, primarily targeting D-Link DIR-850L and D-Link DIR-818LW routers. Qianxin telemetry shows that infections are concentrated in South Korea, China, Sweden, Malaysia, and Singapore.\u003c/p\u003e\n\n\u003cp\u003eResearchers found two AryStinger variants: a C-based version that mostly targets outdated routers and a Go-based version focused on NAS systems with far more limited reach. The NAS version includes additional capabilities such as IP and DNS scanning, command execution, payload execution, and internal network reconnaissance through open-source penetration testing tools. XLab did not attribute AryStinger to any known activity cluster, and owners of end-of-life routers are advised to replace them, update firmware, change default administrator passwords, and disable remote management panels.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A previously undocumented malware botnet named AryStinger has compromised more than 4,000 outdated routers and turns infected devices into proxies for malicious traffic.","Qianxin's XLab says AryStinger can make infected devices perform scanning, proxying, tunneling, command execution, and other attacker-controlled activities.","AryStinger primarily targets D-Link DIR-850L and D-Link DIR-818LW routers by exploiting older flaws including CVE-2013-3307, CVE-2016-5681, and CVE-2025-11837.","Qianxin telemetry shows almost half of the infections are in South Korea, followed by China, Sweden, Malaysia, and Singapore.","XLab found two AryStinger variants: a C-based version targeting mostly outdated routers and a more advanced Go-based version focused on NAS systems with far more limited reach."],"insights":["AryStinger’s distributed design lets the attacker split large scanning tasks across many infected devices, making early target-mapping activity more efficient before later intrusion attempts.","The botnet’s impact is not limited to using routers as traffic relays, because XLab warns it can also alter DNS settings, hijack browsing, and silently monitor inbound and outbound traffic.","The NAS-focused Go variant appears more capable than the router-focused C variant, but the article notes it currently has far more limited reach.","XLab notes that AryStinger’s DNS-scanning infrastructure could potentially be repurposed to generate large volumes of DNS queries against resolvers, although no such attacks were observed.","Using source code execution in the NAS version creates practical limitations because it depends on language runtimes being present and can introduce noise that harms stealth."],"referencedReports":[{"title":"AryStinger Botnet Hijacks Legacy Routers for Global Attacks","url":"https://blog.xlab.qianxin.com/arystinger-botnet-hijacks-legacy-routers-for-global-attacks-en/","publisher":"Qianxin XLab","context":"The article cites XLab’s technical analysis as the source for AryStinger’s behavior, capabilities, targeting, variants, and infection telemetry.","category":"","primary":false}],"body":"\u003cp\u003eA previously undocumented malware botnet named AryStinger has compromised more than 4,000 outdated routers and turns them into proxies for malicious traffic. Qianxin\u0026rsquo;s XLab threat intelligence team says infected devices become remotely controlled “executors” that can perform scanning, proxying, tunneling, command execution, and other attacker-directed activity. The attacker can split large scanning tasks into smaller chunks and distribute them across infected devices for parallel execution.\u003c/p\u003e\n\n\u003cp\u003eXLab warns that AryStinger can also tamper with DNS settings, hijack user browsing, and silently monitor and potentially steal inbound and outbound network traffic. The malware exploits older flaws including CVE-2013-3307, CVE-2016-5681, and CVE-2025-11837, primarily targeting D-Link DIR-850L and D-Link DIR-818LW routers. Qianxin telemetry shows that infections are concentrated in South Korea, China, Sweden, Malaysia, and Singapore.\u003c/p\u003e\n\n\u003cp\u003eResearchers found two AryStinger variants: a C-based version that mostly targets outdated routers and a Go-based version focused on NAS systems with far more limited reach. The NAS version includes additional capabilities such as IP and DNS scanning, command execution, payload execution, and internal network reconnaissance through open-source penetration testing tools. XLab did not attribute AryStinger to any known activity cluster, and owners of end-of-life routers are advised to replace them, update firmware, change default administrator passwords, and disable remote management panels.\u003c/p\u003e\n"}]</script>
