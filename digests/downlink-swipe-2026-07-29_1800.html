<script type="application/json" id="dl-articles">[{"n":1,"title":"Cisco warns of FMC static credential flaw exploited in zero-day attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-fmc-static-credential-flaw-exploited-in-zero-day-attacks/","time":"21:35","priority":"MUST READ","score":94,"tldr":"Cisco warned that a static credential flaw in Secure Firewall Management Center, CVE-2026-20316, has been exploited in zero-day attacks and urged customers to install hot fixes because there are no workarounds. Administrators should check logs for the /var/tmp/license.tmp indicator and rotate credentials, keys, and certificates if compromise is suspected.","briefOverview":"\u003cp\u003eCisco warned that a high-severity Secure Firewall Management Center static credential vulnerability, tracked as CVE-2026-20316, was actively exploited in zero-day attacks. The flaw is caused by static credentials for a low-privilege account built into Cisco Secure FMC Software. Cisco says an unauthenticated remote attacker can use those credentials to log in to an affected system and access sensitive data available to that account.\u003c/p\u003e\n\n\u003cp\u003eAlthough CVE-2026-20316 has a CVSS score of 5.3, Cisco assigned it a High severity rating because the access can be combined with other FMC vulnerabilities to elevate privileges. The flaw affects Cisco Secure FMC Software regardless of device configuration, but does not affect Cloud-Delivered FMC, Firewall Device Manager, Secure Firewall ASA Software, Secure Firewall Threat Defense Software, or Security Cloud Control. Cisco released hot fixes for Secure FMC releases 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0, and said there are no workarounds that address the vulnerability.\u003c/p\u003e\n\n\u003cp\u003eCisco said it became aware of active exploitation in July 2026 and advised administrators to review the /var/log/messages file for signs of compromise, including entries containing /var/tmp/license.tmp. If that indicator is found, administrators should rotate all user credentials, keys, and certificates on the affected FMC device and contact Cisco TAC for recovery assistance. Cisco also updated an advisory for a separate critical FMC authentication bypass flaw, CVE-2026-20079, but said it is not aware of malicious exploitation of that vulnerability.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco warned that CVE-2026-20316, a high-severity static credential vulnerability in Secure Firewall Management Center Software, has been actively exploited in zero-day attacks to gain unauthorized access to vulnerable devices.","The vulnerability is caused by static credentials for a low-privilege account built into Cisco Secure FMC Software, which an unauthenticated remote attacker can use to log in and access sensitive data available to that account.","Cisco released hot fixes for Secure FMC releases 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0, and said there are no workarounds that address the vulnerability.","Cisco advised administrators to check /var/log/messages for entries involving /var/tmp/license.tmp and to rotate all user credentials, keys, and certificates on affected FMC devices if that indicator is present.","Cisco also updated its advisory for CVE-2026-20079, a separate critical FMC authentication bypass flaw with a maximum CVSS score of 10.0, but said it is not aware of malicious exploitation of that vulnerability."],"insights":["Cisco rated CVE-2026-20316 as High severity despite its 5.3 CVSS score because the low-privilege access can be combined with other FMC vulnerabilities to elevate privileges.","Cisco published the same /var/tmp/license.tmp indicator for both CVE-2026-20316 and CVE-2026-20079, but the article says the company has not explained whether the two vulnerabilities are connected.","The FMC management interface being exposed to the public internet increases risk, while Cisco notes that keeping it unexposed reduces the attack surface.","If the /var/tmp/license.tmp indicator is found, Cisco advises rotating all user credentials, keys, and certificates on the affected FMC device because exploitation has been ongoing."],"referencedReports":[],"body":"\u003cp\u003eCisco warned that a high-severity Secure Firewall Management Center static credential vulnerability, tracked as CVE-2026-20316, was actively exploited in zero-day attacks. The flaw is caused by static credentials for a low-privilege account built into Cisco Secure FMC Software. Cisco says an unauthenticated remote attacker can use those credentials to log in to an affected system and access sensitive data available to that account.\u003c/p\u003e\n\n\u003cp\u003eAlthough CVE-2026-20316 has a CVSS score of 5.3, Cisco assigned it a High severity rating because the access can be combined with other FMC vulnerabilities to elevate privileges. The flaw affects Cisco Secure FMC Software regardless of device configuration, but does not affect Cloud-Delivered FMC, Firewall Device Manager, Secure Firewall ASA Software, Secure Firewall Threat Defense Software, or Security Cloud Control. Cisco released hot fixes for Secure FMC releases 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0, and said there are no workarounds that address the vulnerability.\u003c/p\u003e\n\n\u003cp\u003eCisco said it became aware of active exploitation in July 2026 and advised administrators to review the /var/log/messages file for signs of compromise, including entries containing /var/tmp/license.tmp. If that indicator is found, administrators should rotate all user credentials, keys, and certificates on the affected FMC device and contact Cisco TAC for recovery assistance. Cisco also updated an advisory for a separate critical FMC authentication bypass flaw, CVE-2026-20079, but said it is not aware of malicious exploitation of that vulnerability.\u003c/p\u003e\n"},{"n":3,"title":"Critical Rails Flaw Could Let Unauthenticated Attackers Read Server Files via Image Uploads","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-rails-flaw-could-let.html","time":"18:10","priority":"MUST READ","score":94,"tldr":"Ruby on Rails patched a critical Active Storage flaw, CVE-2026-66066, that could let unauthenticated attackers use crafted image uploads with libvips to read sensitive server files and steal secrets. Affected operators should upgrade immediately and rotate any credentials the Rails process could access.","briefOverview":"\u003cp\u003eRuby on Rails released fixes for a critical Active Storage vulnerability tracked as \u003ccode\u003eCVE-2026-66066\u003c/code\u003e with a CVSS score of 9.5. The flaw could let unauthenticated attackers read arbitrary files from application servers through crafted image uploads. Exposed data could include the Rails process environment and secrets such as \u003ccode\u003esecret_key_base\u003c/code\u003e, the Rails master key, database passwords, cloud storage credentials, and API tokens.\u003c/p\u003e\n\n\u003cp\u003eAffected applications use libvips for Active Storage image processing and accept image uploads from untrusted users. Ethiack and GMO Flatt Security list affected ranges as Rails 7.0.0 through 7.2.3.1, Rails 8.0.0 through 8.0.5, and Rails 8.1.0 through 8.1.3, while Rails 6.0.0 through 6.1.7.10 are affected only when configured to use Vips. Applications using MiniMagick are not exposed through this specific attack path, and Rails 7.0 and 7.1 are end of life with no fixed releases.\u003c/p\u003e\n\n\u003cp\u003eOperators should upgrade to Rails 7.2.3.2, 8.0.5.1, or 8.1.3.1 and rotate every secret readable by the application process. The patch calls \u003ccode\u003eVips.block_untrusted(true)\u003c/code\u003e when Active Storage starts, and patched installations require libvips 8.13 or later and ruby-vips 2.2.1 or later when ruby-vips is installed. Neither Rails nor the researchers reported in-the-wild exploitation at publication, and The Hacker News found no public proof-of-concept at 17:30 UTC on July 29, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby on Rails released fixes for CVE-2026-66066, a critical Active Storage vulnerability that could let unauthenticated attackers read arbitrary files from application servers through crafted image uploads.","The flaw affects applications that use libvips for Active Storage image processing and accept image uploads from untrusted users, with affected ranges including Rails 7.0.0 through 7.2.3.1, Rails 8.0.0 through 8.0.5, and Rails 8.1.0 through 8.1.3.","Rails 6.0.0 through 6.1.7.10 releases are affected only when Active Storage is configured to use Vips, while applications using MiniMagick are not exposed through this specific attack path.","Operators are advised to upgrade to Rails 7.2.3.2, 8.0.5.1, or 8.1.3.1 and rotate secrets readable by the application process, including secret_key_base, the Rails master key, database credentials, Active Storage service keys, and third-party tokens.","Neither Rails nor the researchers reported in-the-wild exploitation at publication, and The Hacker News found no public proof-of-concept or exploit repository as of 17:30 UTC on July 29, 2026."],"insights":["Applying the Rails patch is not enough if the flaw may already have been exploited, because Rails warned that credentials potentially read by attackers must still be rotated.","A vulnerable app does not need to expose a separate resize or thumbnail feature, because Rails said variant generation is not a separate requirement for the attack path.","Rails 7.0 and 7.1 users cannot simply apply a fixed release on those branches because they are end of life, so they must move to Rails 7.2.3.2 or later.","The mitigation depends on newer image-processing components, since patched installations require libvips 8.13 or later and ruby-vips 2.2.1 or later when ruby-vips is installed.","There is a difference between the official advisory’s broad package range of activestorage below 7.2.3.2 and the researchers’ practical Vips-based attack path, which they place at Rails 6.0 and later."],"referencedReports":[{"title":"GHSA-xr9x-r78c-5hrm","url":"https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm","publisher":"Ruby on Rails","context":"The article cites the Rails security advisory as the source explaining that unsafe libvips operations were not blocked by Active Storage.","category":"advisory","primary":true},{"title":"KindaRails2Shell: Rails RCE CVE-2026-66066","url":"https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve-2026-66066","publisher":"Ethiack","context":"The article references Ethiack’s research as one of the independent reports identifying the affected Rails ranges and the issue.","category":"research","primary":true},{"title":"KindaRails2Shell Rails","url":"https://blog.flatt.tech/entry/kindarails2shell_rails","publisher":"GMO Flatt Security","context":"The article references GMO Flatt Security’s technical analysis as one of the independent reports identifying the affected Rails ranges and the issue.","category":"research","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article says CVE-2026-66066 was not listed in CISA’s Known Exploited Vulnerabilities catalog version 2026.07.27 at publication time.","category":"advisory","primary":false}],"body":"\u003cp\u003eRuby on Rails released fixes for a critical Active Storage vulnerability tracked as \u003ccode\u003eCVE-2026-66066\u003c/code\u003e with a CVSS score of 9.5. The flaw could let unauthenticated attackers read arbitrary files from application servers through crafted image uploads. Exposed data could include the Rails process environment and secrets such as \u003ccode\u003esecret_key_base\u003c/code\u003e, the Rails master key, database passwords, cloud storage credentials, and API tokens.\u003c/p\u003e\n\n\u003cp\u003eAffected applications use libvips for Active Storage image processing and accept image uploads from untrusted users. Ethiack and GMO Flatt Security list affected ranges as Rails 7.0.0 through 7.2.3.1, Rails 8.0.0 through 8.0.5, and Rails 8.1.0 through 8.1.3, while Rails 6.0.0 through 6.1.7.10 are affected only when configured to use Vips. Applications using MiniMagick are not exposed through this specific attack path, and Rails 7.0 and 7.1 are end of life with no fixed releases.\u003c/p\u003e\n\n\u003cp\u003eOperators should upgrade to Rails 7.2.3.2, 8.0.5.1, or 8.1.3.1 and rotate every secret readable by the application process. The patch calls \u003ccode\u003eVips.block_untrusted(true)\u003c/code\u003e when Active Storage starts, and patched installations require libvips 8.13 or later and ruby-vips 2.2.1 or later when ruby-vips is installed. Neither Rails nor the researchers reported in-the-wild exploitation at publication, and The Hacker News found no public proof-of-concept at 17:30 UTC on July 29, 2026.\u003c/p\u003e\n"},{"n":2,"title":"Anthropic confirms Claude is down worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-confirms-claude-is-down-worldwide/","time":"21:39","priority":"MAY READ","score":62,"tldr":"Anthropic confirmed a worldwide Claude outage causing elevated errors and “529 Overloaded” failures across Claude and API-dependent tools. The company says it has identified the issue and is working on a fix, with partial recovery reported for most models.","briefOverview":"\u003cp\u003eAnthropic confirmed that Claude is down for some users, with elevated errors affecting multiple AI models. The disruption is causing requests to fail in Claude and in tools that rely on its API. Users encountering the issue may see the message: “API Error: 529 Overloaded. This is a server-side issue, usually temporary — try again in a moment.”\u003c/p\u003e\n\n\u003cp\u003eAnthropic began investigating the outage at 7:49 p.m. UTC on July 29. At 8:33 p.m. UTC, the company said it had identified the issue and was working to resolve it, but it did not disclose the underlying cause or provide a recovery timeline. The article notes that a 529 error generally means Claude’s servers are unable to handle the current volume of requests.\u003c/p\u003e\n\n\u003cp\u003eIn an update, Anthropic said at 17:30 EDT that it was continuing to work to fully resolve elevated requests and latency to Claude models. The company reported that it had begun seeing recovery across most models. Some users, however, could still encounter errors while the fix continued.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic confirmed that Claude is down for some users, with elevated errors across multiple AI models.","The disruption is causing requests to fail with a “529 Overloaded” message in Claude and tools that rely on its API.","Anthropic began investigating the outage at 7:49 p.m. UTC on July 29 and said at 8:33 p.m. UTC that it had identified the issue and was working to resolve it.","The article states that a 529 error generally means Claude’s servers are unable to handle the current volume of requests.","As of 17:30 EDT, Anthropic said it was continuing to work to fully resolve elevated requests and latency, with recovery beginning across most models."],"insights":["Tools that rely on Claude’s API can fail even when users are not interacting with Claude directly, so the outage’s impact extends beyond Anthropic’s own chat interface.","The “529 Overloaded” message indicates a server-side problem, meaning affected users are told the issue is usually temporary and to try again later rather than troubleshoot their own setup.","Anthropic said it had identified the issue but did not reveal the underlying cause or provide a recovery timeline, leaving users without clear guidance on when service would fully return.","Recovery was uneven across Claude models, with Anthropic reporting improvement across most models while warning that some users could still encounter errors."],"referencedReports":[],"body":"\u003cp\u003eAnthropic confirmed that Claude is down for some users, with elevated errors affecting multiple AI models. The disruption is causing requests to fail in Claude and in tools that rely on its API. Users encountering the issue may see the message: “API Error: 529 Overloaded. This is a server-side issue, usually temporary — try again in a moment.”\u003c/p\u003e\n\n\u003cp\u003eAnthropic began investigating the outage at 7:49 p.m. UTC on July 29. At 8:33 p.m. UTC, the company said it had identified the issue and was working to resolve it, but it did not disclose the underlying cause or provide a recovery timeline. The article notes that a 529 error generally means Claude’s servers are unable to handle the current volume of requests.\u003c/p\u003e\n\n\u003cp\u003eIn an update, Anthropic said at 17:30 EDT that it was continuing to work to fully resolve elevated requests and latency to Claude models. The company reported that it had begun seeing recovery across most models. Some users, however, could still encounter errors while the fix continued.\u003c/p\u003e\n"}]</script>
