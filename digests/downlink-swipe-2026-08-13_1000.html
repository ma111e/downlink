<script type="application/json" id="dl-articles">[{"n":13,"title":"Potential for Remote Code Execution in Microsoft SCCM via Newly-Discovered Exploit Chain","source":"xmcyber.com","sourceColorIdx":9,"link":"https://xmcyber.com/blog/potential-for-remote-code-execution-in-microsoft-sccm-via-newly-discovered-exploit-chain/","time":"12:01","priority":"SHOULD READ","score":89,"tldr":"XM Cyber researchers found an SCCM exploit chain that can let a low-privileged domain user or certain SCCM operators gain remote code execution as SYSTEM on the primary site server, potentially compromising the whole environment. Microsoft has patched only the initial RBAC bypass, so organizations should restrict AdminService access and audit SCCM roles until the remaining fixes arrive.","briefOverview":"\u003cp\u003eSecurity researchers from XM Cyber discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could be used to achieve remote code execution. The article says a standard domain user with no SCCM permissions, no admin role, and no user interaction could take advantage of the chain. The exploit targets the primary site server, which manages the entire infrastructure, so successful exploitation could grant control over the whole environment.\u003c/p\u003e\n\n\u003cp\u003eThe chain combines a missing authorization check on an SCCM AdminService upload endpoint, a Zip-Slip-style path traversal issue called “CabSlip,” weak code-signing verification, and automatic privileged DLL loading by SMS Executive. Microsoft assigned CVE-2026-47301 to one reported issue and released a fix in July 2026 for the broken authorization vulnerability. The article states that the rest of the chain remains unpatched until a planned ConfigMgr 2609 release in October 2026.\u003c/p\u003e\n\n\u003cp\u003eEven after the initial fix, users with the built-in Operations Administrator role or custom roles with Create permission on SMS_ConsoleExtensionData can still trigger the downstream chain through another API. The article recommends monitoring AdminService.log for a System.IO.DirectoryNotFoundException followed by an HTTP 500 response, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments. It also notes that disabling SCCMProviderGraph.exe is not supported by Microsoft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["XM Cyber researchers discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could allow remote code execution by a standard domain user with no SCCM permissions, no admin role, and no user interaction.","The exploit chain targets the SCCM primary site server and combines a missing authorization check in an AdminService upload endpoint, a CabSlip path traversal issue, weak code-signing verification, and privileged DLL loading by SMS Executive.","Microsoft assigned CVE-2026-47301 to one of the reported vulnerabilities and released a fix for the broken authorization issue in July 2026, but the rest of the chain remains unpatched until a planned ConfigMgr 2609 release in October 2026.","Users assigned the built-in Operations Administrator role, or any custom role with Create permission on the SMS_ConsoleExtensionData object type, can still trigger the downstream exploit chain through a different API.","The article recommends monitoring AdminService.log for System.IO.DirectoryNotFoundException followed by HTTP 500 errors, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments."],"insights":["Patching CVE-2026-47301 only removes the path for standard domain users, because Operations Administrator users or custom roles with Create permission on SMS_ConsoleExtensionData can still reach the same downstream exploit chain through the standard UploadExtension endpoint.","The code-signing step does not meaningfully limit exploitation to trusted SCCM-related signers, because the article says SCCM accepts any structurally valid, non-expired signature and skips certificate revocation checks.","A failed cleanup operation can become a practical detection signal, because CabSlip writes files outside the expected ExpandedCab directory and causes a System.IO.DirectoryNotFoundException followed by an HTTP 500 response in AdminService.log.","The exploit turns a file-write bug into SYSTEM-level execution by overwriting adsource.dll, which is loaded by a Microsoft-signed component even though SMS Executive verifies adsysdis.dll itself before loading it.","Disabling SCCMProviderGraph.exe is not a supported mitigation, so the article points administrators toward firewall restrictions on the AdminService API port and RBAC audits instead."],"referencedReports":[],"body":"\u003cp\u003eSecurity researchers from XM Cyber discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could be used to achieve remote code execution. The article says a standard domain user with no SCCM permissions, no admin role, and no user interaction could take advantage of the chain. The exploit targets the primary site server, which manages the entire infrastructure, so successful exploitation could grant control over the whole environment.\u003c/p\u003e\n\n\u003cp\u003eThe chain combines a missing authorization check on an SCCM AdminService upload endpoint, a Zip-Slip-style path traversal issue called “CabSlip,” weak code-signing verification, and automatic privileged DLL loading by SMS Executive. Microsoft assigned CVE-2026-47301 to one reported issue and released a fix in July 2026 for the broken authorization vulnerability. The article states that the rest of the chain remains unpatched until a planned ConfigMgr 2609 release in October 2026.\u003c/p\u003e\n\n\u003cp\u003eEven after the initial fix, users with the built-in Operations Administrator role or custom roles with Create permission on SMS_ConsoleExtensionData can still trigger the downstream chain through another API. The article recommends monitoring AdminService.log for a System.IO.DirectoryNotFoundException followed by an HTTP 500 response, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments. It also notes that disabling SCCMProviderGraph.exe is not supported by Microsoft.\u003c/p\u003e\n"},{"n":4,"title":"$7 Million in Expired Domains Fuel a Streaming Empire with a Malware Secret","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/7-million-in-expired-domains-fuel-a-streaming-empire-with-a-malware-secret/","time":"12:59","priority":"SHOULD READ","score":88,"tldr":"Infoblox says the Sable Squirrel threat actor has spent an estimated $7 million buying expired, trusted domains to run a large illegal sports streaming and gambling network. Some of the same domains also serve as command-and-control infrastructure for RAT malware and ransomware-linked samples, showing the operation monetizes its domain empire through both gambling traffic and malware.","briefOverview":"\u003cp\u003eInfoblox Threat Intel reports that Sable Squirrel controls more than 10,000 domains supporting illegal sports streaming, online gambling promotion, redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control. The operation centers on Asian sports piracy brands such as Xoilac, Cakhia, 90phut, Socolive, and MiTom, with Vietnam as a major focus in the data. Infoblox says the same back-end services, sports data feeds, image infrastructure, and live chat components also appear around Chinese-language betting brands and campaigns aimed at Indonesian and Russian-speaking audiences.\u003c/p\u003e\n\n\u003cp\u003eA major feature of the operation is its domain strategy: Sable Squirrel buys expired domains with real history as well as registering fresh lookalike domains tied to its streaming brands. Infoblox confirmed more than \u003cspan class=\"math inline\"\u003e\\(430,000 in dropcatch purchases across roughly 160 domains and estimates total dropcatch spending north of \\)\u003c/span\u003e7 million. These purchases include domains formerly tied to press outlets, charities, government and civic campaigns, major brands, academic institutions, and companies such as General Electric, Procter \u0026amp; Gamble, Sony PlayStation, and Ve Interactive.\u003c/p\u003e\n\n\u003cp\u003eInfoblox identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures. A coordinated wave in late 2025 configured hundreds of existing Sable Squirrel domains as malware control infrastructure while many still displayed live football streaming pages to visitors. Vietnamese enforcement actions in February and March 2026 froze flagship sites, charged 30 suspects, and seized roughly 300 billion VND, but Infoblox observed that registrations recovered within a month and the operation expanded toward the 2026 World Cup.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox Threat Intel says Sable Squirrel controls more than 10,000 domains used for illegal sports streaming, online gambling promotion, traffic redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control.","Infoblox confirmed more than $430,000 in dropcatch purchases across roughly 160 domains and estimates Sable Squirrel’s total dropcatch spend is north of $7 million.","Researchers identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures.","A coordinated wave in late 2025 configured hundreds of existing Sable Squirrel domains as malware command-and-control while many of those domains continued presenting live football streaming content to visitors.","Vietnamese enforcement actions in February and March 2026 froze flagship sites, charged 30 suspects, and seized roughly 300 billion VND, but Infoblox observed that registrations recovered within a month and the operation expanded toward the 2026 World Cup."],"insights":["Sable Squirrel’s dropcatch strategy shows that aged registration history, backlinks, residual traffic, and historical reputation can become security liabilities when defenses treat them as signs of trustworthiness.","The malware attribution was unusually direct because many samples contained Sable Squirrel brand names such as socolive, xoilac, and 8xbet in Windows executable metadata and startup keys.","The operation’s resilience depended less on any single flagship site and more on a long-lived shared back end for video, chat, scores, odds, images, redirection, and tracking that continued operating despite domain churn and enforcement actions.","Although hundreds of domains were configured as malware command-and-control, exposure was concentrated in a small number of workhorse domains, with colatv88xb[.]cc accounting for nearly 70% of exposed customer networks in Infoblox’s data.","Sable Squirrel’s own infrastructure had weaknesses, including stock WordPress sites compromised by Balada Injector and at least one lookalike domain apparently taken over through a nameserver change."],"referencedReports":[{"title":"Meet the hydras: tracing the illegal gambling operators that sponsor football","url":"https://www.playthegame.org/news/meet-the-hydras-tracing-the-illegal-gambling-operators-that-sponsor-football/","publisher":"Play the Game","context":"The article cites this research as documenting how illegal gambling networks use many front brands on shared software and payment rails to obscure ownership.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox Threat Intel reports that Sable Squirrel controls more than 10,000 domains supporting illegal sports streaming, online gambling promotion, redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control. The operation centers on Asian sports piracy brands such as Xoilac, Cakhia, 90phut, Socolive, and MiTom, with Vietnam as a major focus in the data. Infoblox says the same back-end services, sports data feeds, image infrastructure, and live chat components also appear around Chinese-language betting brands and campaigns aimed at Indonesian and Russian-speaking audiences.\u003c/p\u003e\n\n\u003cp\u003eA major feature of the operation is its domain strategy: Sable Squirrel buys expired domains with real history as well as registering fresh lookalike domains tied to its streaming brands. Infoblox confirmed more than \u003cspan class=\"math inline\"\u003e\\(430,000 in dropcatch purchases across roughly 160 domains and estimates total dropcatch spending north of \\)\u003c/span\u003e7 million. These purchases include domains formerly tied to press outlets, charities, government and civic campaigns, major brands, academic institutions, and companies such as General Electric, Procter \u0026amp; Gamble, Sony PlayStation, and Ve Interactive.\u003c/p\u003e\n\n\u003cp\u003eInfoblox identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures. A coordinated wave in late 2025 configured hundreds of existing Sable Squirrel domains as malware control infrastructure while many still displayed live football streaming pages to visitors. Vietnamese enforcement actions in February and March 2026 froze flagship sites, charged 30 suspects, and seized roughly 300 billion VND, but Infoblox observed that registrations recovered within a month and the operation expanded toward the 2026 World Cup.\u003c/p\u003e\n"},{"n":5,"title":"Dropcatch Scavengers: Expired Malicious Domains Become Cash Cows","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/dropcatch-scavengers-expired-malicious-domains-become-cash-cows/","time":"12:58","priority":"SHOULD READ","score":88,"tldr":"Infoblox found that multiple threat actors are buying expired malicious domains still embedded in compromised websites, then reusing the inherited traffic to push scams, ad fraud, and malware. The key risk is that old website compromises continue harming visitors even after the original attacker’s domains expire, because dropcatch actors can easily take over the abandoned infrastructure.","briefOverview":"\u003cp\u003eInfoblox Threat Intel describes a class of dropcatch actors who acquire expired malicious domains that are still embedded in compromised websites. Instead of compromising sites themselves, these actors inherit unanswered traffic from old infection chains and redirect visitors to scams, unwanted content, affiliate advertising, or malware. The article focuses on three actors: Stuffy Squirrel, Shady Squirrel, and Swiping Squirrel, which together control thousands of domains present across tens of thousands of compromised sites.\u003c/p\u003e\n\n\u003cp\u003eStuffy Squirrel has operated since at least 2020, hides malicious activity inside legitimate-looking scripts, and monetizes traffic through affiliate advertising platforms including ExoClick, PushHouse, and a Russian popunder network. Shady Squirrel uses referral checks, cloaking, custom JavaScript injections, Keitaro, and server-side fingerprinting, and in 2026 sent traffic to 1Win, a tech support scam actor, SocGholish, and Keitaro infrastructure. Infoblox says Shady Squirrel enabled SocGholish to regain access to tens of thousands of compromised sites about 10 days after Operation Endgame disrupted SocGholish infrastructure.\u003c/p\u003e\n\n\u003cp\u003eSwiping Squirrel has acquired over 3,000 domains since 2022 and sells much of its traffic to Team Internet’s ZeroPark, with other observed affiliations including AliExpress and other commerce entities. Its chain uses client-side fingerprinting, cloaking, relay domains, and redirects to affiliate platforms, where visitors may end up at malware, scams, or shopping pages. The article concludes that dropcatch domains pose significant risk because expired domains from old compromises can continue producing victim traffic long after the original malicious campaigns have ended.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox reports that some threat actors acquire expired malicious domains still embedded in compromised websites and use the inherited traffic to redirect visitors to scams, unwanted content, affiliate advertising, or malware.","Stuffy Squirrel has operated since at least 2020, controls over 500 domains, hides malicious activity inside legitimate-looking scripts, and monetizes traffic through affiliate advertising platforms such as ExoClick and PushHouse.","Shady Squirrel has operated since at least July 2023, has acquired over 700 domains, and in 2026 sent traffic to 1Win, a tech support scam actor, SocGholish, and a Keitaro server.","Infoblox says Shady Squirrel helped SocGholish regain access to tens of thousands of compromised sites about 10 days after Operation Endgame disrupted SocGholish infrastructure in June 2026.","Swiping Squirrel has acquired over 3,000 domains since 2022 and sells traffic mainly to Team Internet’s ZeroPark, where visitors may be routed to malware, scams, or commerce pages."],"insights":["Expired malicious domains can retain value because compromised websites continue requesting them after the original domains lapse, allowing new actors to receive victim traffic without compromising sites themselves.","The actors’ server-side checks and click-dependent delivery make their malicious behavior difficult for automated scanners to observe, because direct probes or non-interactive visits may only receive decoys or the original website.","Different dropcatch actors can coexist on the same compromised websites and compete in a race condition to capture the same visitor traffic.","Domains can move between threat actors over time, so attribution requires examining the scripts and delivery behavior rather than relying only on domain ownership or history.","Shady Squirrel’s use of inherited compromised-site traffic allowed SocGholish to regain broad delivery reach shortly after Operation Endgame disrupted its infrastructure."],"referencedReports":[{"title":"Massive Campaign Uses Hacked WordPress Sites as Platform for Black Hat Ad Network","url":"https://blog.sucuri.net/2023/01/massive-campaign-uses-hacked-wordpress-sites-as-platform-for-black-hat-ad-network.html","publisher":"Sucuri","context":"The article cites Sucuri’s analysis to show that weatherplllatform[.]com was previously used as Balada injector infrastructure infecting WordPress sites.","category":"research","primary":false},{"title":"Balada Injector: Synopsis of a Massive Ongoing WordPress Malware Campaign","url":"https://blog.sucuri.net/2023/04/balada-injector-synopsis-of-a-massive-ongoing-wordpress-malware-campaign.html","publisher":"Sucuri","context":"The article references Sucuri’s Balada Injector research when describing the prior malicious history of domains later acquired by Stuffy Squirrel.","category":"research","primary":false},{"title":"Update: JavaScript Skimmer Enhancements","url":"https://www.zscaler.com/blogs/security-research/update-javascript-skimmer-enhancements","publisher":"Zscaler","context":"The article cites Zscaler research to identify magesource[.]su as a former Magecart card-skimming domain targeting compromised Magento stores.","category":"research","primary":false},{"title":"Help TDS: Malicious Plugins Redirect to Tech Support Scams","url":"https://www.godaddy.com/resources/news/help-tds-malicious-plugins-redirect-tech-support-scams","publisher":"GoDaddy","context":"The article references GoDaddy’s Help TDS analysis while explaining an older Keitaro chain that redirected to Help TDS.","category":"research","primary":false},{"title":"Inside Master134: Ad networks' blind eye threatens enterprises","url":"https://www.techtarget.com/searchsecurity/feature/Inside-Master134-Ad-networks-blind-eye-threatens-enterprises","publisher":"TechTarget","context":"The article cites TechTarget’s reporting when noting AdventureFeeds connections with the malvertiser Master134.","category":"news","primary":false}],"body":"\u003cp\u003eInfoblox Threat Intel describes a class of dropcatch actors who acquire expired malicious domains that are still embedded in compromised websites. Instead of compromising sites themselves, these actors inherit unanswered traffic from old infection chains and redirect visitors to scams, unwanted content, affiliate advertising, or malware. The article focuses on three actors: Stuffy Squirrel, Shady Squirrel, and Swiping Squirrel, which together control thousands of domains present across tens of thousands of compromised sites.\u003c/p\u003e\n\n\u003cp\u003eStuffy Squirrel has operated since at least 2020, hides malicious activity inside legitimate-looking scripts, and monetizes traffic through affiliate advertising platforms including ExoClick, PushHouse, and a Russian popunder network. Shady Squirrel uses referral checks, cloaking, custom JavaScript injections, Keitaro, and server-side fingerprinting, and in 2026 sent traffic to 1Win, a tech support scam actor, SocGholish, and Keitaro infrastructure. Infoblox says Shady Squirrel enabled SocGholish to regain access to tens of thousands of compromised sites about 10 days after Operation Endgame disrupted SocGholish infrastructure.\u003c/p\u003e\n\n\u003cp\u003eSwiping Squirrel has acquired over 3,000 domains since 2022 and sells much of its traffic to Team Internet’s ZeroPark, with other observed affiliations including AliExpress and other commerce entities. Its chain uses client-side fingerprinting, cloaking, relay domains, and redirects to affiliate platforms, where visitors may end up at malware, scams, or shopping pages. The article concludes that dropcatch domains pose significant risk because expired domains from old compromises can continue producing victim traffic long after the original malicious campaigns have ended.\u003c/p\u003e\n"},{"n":11,"title":"Dissecting the JWR phishing framework","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Cisco Talos analyzed JWR, a sophisticated real-time phishing framework likely related to The Outsider PhaaS, that lets operators live-control victim sessions and steal payment data, credentials, identity documents, 2FA codes, and device fingerprints. Talos observed it being delivered through SMS lures impersonating toll, postal, and courier services across Southeast Asia and the Middle East.","briefOverview":"\u003cp\u003eCisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages across major payment and shopping platforms. The framework can harvest complete payment card data, login credentials, personally identifiable information, identity document images, 2FA codes, and device fingerprints in real time. Talos assesses with medium confidence that JWR is a variant of “The Outsider,” a phishing-as-a-service platform, based on similarities in client engine scripts and functionality.\u003c/p\u003e\n\n\u003cp\u003eThe JWR client engine uses a real-time, operator-driven design rather than simply collecting submitted form data. It keeps an AES-CTR encrypted WebSocket open to the actor’s command-and-control server, allowing the operator to steer the victim’s session live, redirect them between phishing pages, display fake errors, and request additional information such as OTPs, PINs, or app approvals. The Vue.js victim application renders across 44 phishing pages, streams keystrokes as they are typed, and supports more than 40 actor-issued instructions.\u003c/p\u003e\n\n\u003cp\u003eTalos observed an active SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East. The malicious URLs led victims to fake pages that loaded the JWR client and enabled host mode. The article also notes JWR integrations for Shopify and WooCommerce, which can reconstruct realistic shopping cart details to make fake checkout pages more convincing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages for major payment and shopping platforms.","The JWR client engine keeps an AES-CTR encrypted WebSocket open to the threat actor, allowing the operator to steer each victim’s session live instead of only collecting submitted form data.","JWR targets payment data, identity documents, Social Security numbers, passport and driver’s license images, website and PayPal credentials, 2FA codes, and device fingerprints.","Talos assesses with medium confidence that JWR is a variant of “The Outsider” phishing-as-a-service platform based on similarities in client engine scripts and functionality.","Talos observed a real-world SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East."],"insights":["JWR streams victim keystrokes to the operator as they are typed, allowing the actor to decide the next fake verification step before the victim submits the form.","The framework can repeatedly show fake failure prompts such as declined-card or invalid-code messages, enabling the operator to pressure one victim into entering multiple cards or verification codes in a single session.","JWR includes an HTTP long-poll fallback endpoint for environments where WebSocket connections are blocked, preserving live operator control under more restrictive network conditions.","The client stores and reuses a JWRCID session token across visits, allowing the operator to correlate repeat visits from the same device.","JWR’s Shopify and WooCommerce integrations reconstruct realistic cart details such as product names, quantities, prices, and totals, making the fake checkout flow more convincing."],"referencedReports":[{"title":"The Outsider Part 1: Pulling One Thread on a $1.9 Billion Phishing Machine","url":"https://tapetumlabs.com/the-outsider-part-1-pulling-one-thread-on-a-1-9-billion-phishing-machine/","publisher":"Tapetum Labs","context":"The article cites this external research as reporting on The Outsider PhaaS platform operated by the Chinese-speaking actor Outsider Enterprise, which Talos compares to JWR.","category":"research","primary":true},{"title":"The Outsider Part 2: Putting a Price on a Phishing Machine","url":"https://tapetumlabs.com/the-outsider-part-2-putting-a-price-on-a-phishing-machine/","publisher":"Tapetum Labs","context":"The article cites this external research for information that The Outsider PhaaS was sold as a self-servicing product through the actor’s Telegram channels.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages across major payment and shopping platforms. The framework can harvest complete payment card data, login credentials, personally identifiable information, identity document images, 2FA codes, and device fingerprints in real time. Talos assesses with medium confidence that JWR is a variant of “The Outsider,” a phishing-as-a-service platform, based on similarities in client engine scripts and functionality.\u003c/p\u003e\n\n\u003cp\u003eThe JWR client engine uses a real-time, operator-driven design rather than simply collecting submitted form data. It keeps an AES-CTR encrypted WebSocket open to the actor’s command-and-control server, allowing the operator to steer the victim’s session live, redirect them between phishing pages, display fake errors, and request additional information such as OTPs, PINs, or app approvals. The Vue.js victim application renders across 44 phishing pages, streams keystrokes as they are typed, and supports more than 40 actor-issued instructions.\u003c/p\u003e\n\n\u003cp\u003eTalos observed an active SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East. The malicious URLs led victims to fake pages that loaded the JWR client and enabled host mode. The article also notes JWR integrations for Shopify and WooCommerce, which can reconstruct realistic shopping cart details to make fake checkout pages more convincing.\u003c/p\u003e\n"},{"n":12,"title":"Emerging Threat: (CVE-2026-26035) FortiWeb Admin Authentication Bypass via RADIUS Admin Groups","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/2817-2/","time":"10:31","priority":"SHOULD READ","score":84,"tldr":"Fortinet disclosed CVE-2026-26035, a FortiWeb authentication bypass that can let unauthenticated attackers gain admin access when RADIUS-based admin groups are configured. Organizations should urgently identify FortiWeb appliances using RADIUS admin authentication, restrict management access, audit for suspicious logins, and confirm fixed versions with Fortinet.","briefOverview":"\u003cp\u003eFortinet disclosed CVE-2026-26035 on August 12, 2026 in advisory FG-IR-26-158, describing it as a broken access control issue in the RADIUS type admin group for FortiWeb. The article says the flaw is an improper authentication vulnerability in FortiWeb’s remote RADIUS administrator authentication path. Fortinet rates the issue High severity, while third-party trackers report a CVSS v3.1 base score of 9.8, with the article noting that the difference likely reflects the configuration precondition.\u003c/p\u003e\n\n\u003cp\u003ePublic reporting cited in the article states that a remote attacker with no valid credentials can log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords and obtain administrative access. Successful exploitation would place the attacker in the administrative context of a web application firewall, enabling policy changes, certificate and key access, log manipulation, and visibility into inspected traffic. The article says no public proof of concept had been reported at the time of writing, and Fortinet had not reported exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eFortinet lists FortiWeb 8.0, 7.6, 7.4, 7.2, and 7.0 branches as affected, but the article emphasizes that risk is narrower because it applies to deployments using remote RADIUS administrator authentication through an admin group. The article says fixed build numbers could not be independently confirmed at the time of writing, so defenders should confirm fixed versions directly with Fortinet. Recommended actions include inventorying FortiWeb appliances, identifying those using RADIUS admin authentication, restricting management access, disabling RADIUS-based admin groups where local accounts are sufficient, and auditing administrator activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-26035 is an improper authentication vulnerability in Fortinet FortiWeb’s remote RADIUS administrator authentication path, disclosed by Fortinet on August 12, 2026 in advisory FG-IR-26-158.","Public reporting states that a remote attacker with no valid credentials can log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords and obtain administrative access to the appliance.","Fortinet lists the 8.0, 7.6, 7.4, 7.2, and 7.0 branches of FortiWeb as affected, with third-party trackers reporting specific vulnerable ranges across those branches.","The deployments at risk are FortiWeb appliances configured to authenticate administrators against a RADIUS server through an admin group, rather than every FortiWeb instance running an affected build.","Fortinet has published an advisory, but the article says defenders should confirm fixed versions directly with Fortinet because specific fixed build numbers could not be independently confirmed at the time of writing."],"insights":["The practical risk depends more on whether a FortiWeb appliance uses RADIUS-backed administrator groups than on the affected version number alone, because organizations using only local administrator accounts are described as being in a materially different position.","The severity ratings differ significantly, with Fortinet rating the issue High while third-party trackers report a 9.8 Critical score, likely because Fortinet accounts for the configuration precondition and generic scoring does not.","Patch status is not straightforward from public affected-version ranges, so the article recommends confirming fixed builds directly with Fortinet rather than assuming a later branch build is safe.","The vulnerability affects the management path of a security appliance placed at the network edge, meaning the device’s role as a protective control can become a liability if its administrator access is exposed.","CyCognito’s observed exposure data identifies potentially affected FortiWeb assets through service fingerprinting, but it does not confirm either the running version or whether RADIUS administrator authentication is configured."],"referencedReports":[],"body":"\u003cp\u003eFortinet disclosed CVE-2026-26035 on August 12, 2026 in advisory FG-IR-26-158, describing it as a broken access control issue in the RADIUS type admin group for FortiWeb. The article says the flaw is an improper authentication vulnerability in FortiWeb’s remote RADIUS administrator authentication path. Fortinet rates the issue High severity, while third-party trackers report a CVSS v3.1 base score of 9.8, with the article noting that the difference likely reflects the configuration precondition.\u003c/p\u003e\n\n\u003cp\u003ePublic reporting cited in the article states that a remote attacker with no valid credentials can log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords and obtain administrative access. Successful exploitation would place the attacker in the administrative context of a web application firewall, enabling policy changes, certificate and key access, log manipulation, and visibility into inspected traffic. The article says no public proof of concept had been reported at the time of writing, and Fortinet had not reported exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eFortinet lists FortiWeb 8.0, 7.6, 7.4, 7.2, and 7.0 branches as affected, but the article emphasizes that risk is narrower because it applies to deployments using remote RADIUS administrator authentication through an admin group. The article says fixed build numbers could not be independently confirmed at the time of writing, so defenders should confirm fixed versions directly with Fortinet. Recommended actions include inventorying FortiWeb appliances, identifying those using RADIUS admin authentication, restricting management access, disabling RADIUS-based admin groups where local accounts are sufficient, and auditing administrator activity.\u003c/p\u003e\n"},{"n":1,"title":"White House taps security firms for offensive hack-back operations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/white-house-taps-security-firms-for-offensive-hack-back-operations/","time":"13:30","priority":"SHOULD READ","score":82,"tldr":"A new White House memo creates a program for vetted private security firms to conduct government-directed hack-back operations against foreign cybercriminal groups. The effort targets ransomware, phishing, fraud, sextortion, and impersonation scams, but marks a major expansion of private-sector involvement in offensive cyber operations.","briefOverview":"\u003cp\u003eA new White House memo signed by U.S. President Donald Trump directs the National Coordination Center, part of the Homeland Security Task Force, to establish a program allowing private security companies to apply for approval to hack foreign cybercrime organizations. The national security presidential memorandum enables the NCC to use private-sector capabilities for cyber operations against transnational criminal organizations under U.S. Government control and authority. The White House said the program is intended to disrupt foreign groups involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams.\u003c/p\u003e\n\n\u003cp\u003eThe program will be overseen by executive directors designated by the Justice and Homeland Security departments, and participating security firms will be vetted before entering contracts with one of the two departments. The memo requires procedures to ensure operations comply with the U.S. Constitution, federal law, U.S. international obligations, and applicable international agreements. Participating companies must maintain a bond or escrow of at least $1 million that can be forfeited if they do not comply with contractual agreements.\u003c/p\u003e\n\n\u003cp\u003eCompanies must immediately stop operations and notify the National Coordination Center if they discover activity that exceeds approved limits, including unintended targeting of U.S. citizens or U.S.-based systems. The White House said U.S. consumers reported losing more than $20.8 billion to cyber-enabled crime in 2025. Veracode co-founder Chris Wysopal called the memo a major expansion of the private sector’s role in offensive cyber operations, while former Cyber National Mission Force leader and Automox CTO Jason Kikta described it as “a perpetual motion machine for billable threats.”\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new White House memo signed by U.S. President Donald Trump directs the National Coordination Center to create a program allowing private security companies to apply for approval to hack foreign cybercrime organizations.","The program will let vetted private companies conduct limited cyber operations against transnational criminal organizations under the control and authority of the U.S. Government.","The program will be overseen by executive directors designated by the Justice and Homeland Security departments, and participating firms must enter contracts with one of those departments.","Participating companies must maintain a bond or escrow of at least $1 million that can be forfeited if they fail to comply with contractual agreements.","The White House said the program is intended to disrupt foreign criminal groups involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams."],"insights":["The memo includes a financial enforcement mechanism by requiring participating companies to keep at least $1 million in bond or escrow that can be forfeited for noncompliance.","The program requires companies to immediately stop operations and notify the National Coordination Center if they discover activity beyond approved limits, including unintended targeting of U.S. citizens or U.S.-based systems.","The framework encourages participating private companies to form agreements not only with federal agencies but also with other private entities and state, local, tribal, and territorial agencies to gather threat information and propose operations.","Security experts quoted in the article described the memo as a major expansion of private-sector involvement in offensive cyber operations and a significant shift in U.S. cyber policy."],"referencedReports":[],"body":"\u003cp\u003eA new White House memo signed by U.S. President Donald Trump directs the National Coordination Center, part of the Homeland Security Task Force, to establish a program allowing private security companies to apply for approval to hack foreign cybercrime organizations. The national security presidential memorandum enables the NCC to use private-sector capabilities for cyber operations against transnational criminal organizations under U.S. Government control and authority. The White House said the program is intended to disrupt foreign groups involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams.\u003c/p\u003e\n\n\u003cp\u003eThe program will be overseen by executive directors designated by the Justice and Homeland Security departments, and participating security firms will be vetted before entering contracts with one of the two departments. The memo requires procedures to ensure operations comply with the U.S. Constitution, federal law, U.S. international obligations, and applicable international agreements. Participating companies must maintain a bond or escrow of at least $1 million that can be forfeited if they do not comply with contractual agreements.\u003c/p\u003e\n\n\u003cp\u003eCompanies must immediately stop operations and notify the National Coordination Center if they discover activity that exceeds approved limits, including unintended targeting of U.S. citizens or U.S.-based systems. The White House said U.S. consumers reported losing more than $20.8 billion to cyber-enabled crime in 2025. Veracode co-founder Chris Wysopal called the memo a major expansion of the private sector’s role in offensive cyber operations, while former Cyber National Mission Force leader and Automox CTO Jason Kikta described it as “a perpetual motion machine for billable threats.”\u003c/p\u003e\n"},{"n":6,"title":"Germany moves to give spy agencies hacking and sabotage powers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/germany-spy-agency-powers","time":"12:45","priority":"SHOULD READ","score":82,"tldr":"Germany’s cabinet approved a major intelligence reform bill that would give its spy agencies new powers to hack foreign systems, disrupt hostile infrastructure, sabotage supply chains, and conduct limited domestic operational interference. The proposal includes safeguards and AI-analysis rules but is expected to face civil liberties challenges.","briefOverview":"\u003cp\u003eGermany’s cabinet approved legislation that would give its intelligence agencies new powers to hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany. The bill would overhaul the laws governing the foreign intelligence service, the BND, and the domestic agency for the protection of the constitutional order, the BfV. It still needs to pass parliament, but the government says it wants the law in force next year.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the powers could be used to substitute faulty components into deliveries, sabotage drone factories or chemical weapons laboratories through cyber operations, and disable servers used by hostile state-sponsored hackers and disinformation operators. The bill would also require telecommunications carriers and digital service providers to assist the agencies, with possible fines or service suspensions for noncompliance. The proposed powers stop short of allowing measures intended to endanger a person’s life or physical safety.\u003c/p\u003e\n\n\u003cp\u003eThe draft also regulates how intelligence agencies use artificial intelligence to analyze data. It authorizes self-learning systems but bans discriminatory algorithms, requires spot checks of machine-generated outputs, and treats some conclusions such as movement profiles and personality assessments as intrusions requiring additional justification. Civil liberties groups have said they plan to challenge the legislation, and opposition parties have raised differing criticisms of the bill.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Germany’s cabinet approved legislation that would allow its intelligence agencies to hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany.","The draft bill rewrites the laws governing Germany’s foreign intelligence service, the BND, and its domestic agency for the protection of the constitutional order, the BfV.","The bill would require telecommunications carriers and digital service providers to assist the agencies, with enforcement powers that could result in fines or service suspensions.","The proposed powers bar intelligence agencies from measures intended to endanger a person’s life or physical safety.","The bill authorizes intelligence agencies to use self-learning systems for analysis, prohibits discriminatory algorithms, and requires machine-generated outputs to be spot-checked under qualified supervision."],"insights":["Germany’s proposed powers are narrower than those of some close allies because the bill explicitly bars actions intended to endanger life or physical safety, unlike the broader covert-action frameworks described for France, the United States, and Britain.","The bill’s legal structure reflects Germany’s rule-of-law concerns by requiring the BND president to formally identify a foreign power as persistently and systematically threatening German interests before disruption operations can proceed.","The BfV’s proposed ability to feed false information to people inside Germany is described as having no equivalent statutory authority in British, French, or American law.","The bill treats certain AI-generated conclusions, such as movement profiles and personality assessments, as intrusions in their own right, requiring extra justification before analysts can retrieve them.","Civil liberties challenges may focus on a constitutional tension identified in the article: Germany’s intelligence agencies were previously allowed lower legal thresholds partly because they lacked operational powers, which the bill would now grant."],"referencedReports":[],"body":"\u003cp\u003eGermany’s cabinet approved legislation that would give its intelligence agencies new powers to hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany. The bill would overhaul the laws governing the foreign intelligence service, the BND, and the domestic agency for the protection of the constitutional order, the BfV. It still needs to pass parliament, but the government says it wants the law in force next year.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the powers could be used to substitute faulty components into deliveries, sabotage drone factories or chemical weapons laboratories through cyber operations, and disable servers used by hostile state-sponsored hackers and disinformation operators. The bill would also require telecommunications carriers and digital service providers to assist the agencies, with possible fines or service suspensions for noncompliance. The proposed powers stop short of allowing measures intended to endanger a person’s life or physical safety.\u003c/p\u003e\n\n\u003cp\u003eThe draft also regulates how intelligence agencies use artificial intelligence to analyze data. It authorizes self-learning systems but bans discriminatory algorithms, requires spot checks of machine-generated outputs, and treats some conclusions such as movement profiles and personality assessments as intrusions requiring additional justification. Civil liberties groups have said they plan to challenge the legislation, and opposition parties have raised differing criticisms of the bill.\u003c/p\u003e\n"},{"n":7,"title":"Trump taps cyber firms to go on offensive against criminals","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/trump-cyber-crime-offensive","time":"13:30","priority":"SHOULD READ","score":82,"tldr":"The Trump administration will allow vetted U.S. cybersecurity firms to conduct government-approved offensive cyber operations against transnational cybercrime groups under DOJ and DHS oversight. The plan aims to disrupt scams and ransomware but raises legal and safety concerns for participating companies and employees.","briefOverview":"\u003cp\u003eThe Trump administration will allow vetted private U.S. companies to conduct offensive cyber operations against cybercrime organizations, according to a presidential memorandum released Wednesday. The firms will partner with the Justice and Homeland Security departments on operations and surveillance targeting transnational cybercrime, fraud, and other predatory schemes against Americans. The memorandum says the goal is to use private-sector capabilities that have historically been underutilized in disrupting criminal networks operating in cyberspace.\u003c/p\u003e\n\n\u003cp\u003eThe operations must be approved in advance by DOJ and DHS officials, who will review each cyber operations package and provide written approval and direction before any action is taken. The document says officials will not approve any operation that results in loss of life or rises to the level of use of force or armed attack under international law. The effort builds on a March executive order directing federal agencies to take a stronger stance against cybercrime, and a White House fact sheet said American consumers reported $20.8 billion in cyber-related losses last year.\u003c/p\u003e\n\n\u003cp\u003eParticipating companies will sign contracts with DOJ or DHS, undergo rigorous vetting, disclose all contractual relationships, and face penalties of at least $1 million for violations. Federal agencies have two months to develop operating procedures and minimum standards, including technical proficiency, facility security, personnel vetting, reliability, and other factors. The memorandum also requires companies to stop operations, conduct minimization procedures, and immediately notify federal officials if activity exceeds approved limits, such as unintentionally targeting a U.S. person, a U.S.-based system, or a system controlled by a U.S. person.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Trump administration will allow vetted private U.S. companies to conduct offensive cyber operations against transnational cybercrime organizations in partnership with the Justice and Homeland Security departments.","DOJ and DHS officials must review and provide written approval for each cyber operations package before a participating company can take action.","The presidential memorandum says officials will not approve operations that result in loss of life or rise to the level of use of force or armed attack under international law.","Participating companies will sign contracts, undergo rigorous vetting, report activities routinely to the federal government, and face penalties of at least $1 million for violations.","Cybersecurity experts raised concerns about unclear legal protections, possible foreign government targeting of participating employees, and protocols for mistakes or misidentified targets."],"insights":["The memorandum explicitly anticipates accidental targeting of U.S. persons or U.S.-based systems, requiring companies to stop the operation, minimize the impact, and immediately notify the National Cyber Director and DOJ.","The policy leaves unresolved how private offensive operations would be handled when criminal groups are linked to foreign governments, even though the article cites alleged ties between scam networks and government or military officials in China, Cambodia, and Myanmar.","Participating companies will have to disclose all contractual relationships to the federal government, indicating the program is designed to monitor potential conflicts of interest beyond the specific cyber operations themselves.","The program is not limited to major contractors, as the memorandum says the government is seeking both large and small firms for different parts of the effort.","The article highlights a concrete personal risk for cybersecurity employees by comparing the program’s concerns to a Chinese citizen arrested in Italy and extradited to the U.S. over alleged work for a cybersecurity company tied to attacks."],"referencedReports":[],"body":"\u003cp\u003eThe Trump administration will allow vetted private U.S. companies to conduct offensive cyber operations against cybercrime organizations, according to a presidential memorandum released Wednesday. The firms will partner with the Justice and Homeland Security departments on operations and surveillance targeting transnational cybercrime, fraud, and other predatory schemes against Americans. The memorandum says the goal is to use private-sector capabilities that have historically been underutilized in disrupting criminal networks operating in cyberspace.\u003c/p\u003e\n\n\u003cp\u003eThe operations must be approved in advance by DOJ and DHS officials, who will review each cyber operations package and provide written approval and direction before any action is taken. The document says officials will not approve any operation that results in loss of life or rises to the level of use of force or armed attack under international law. The effort builds on a March executive order directing federal agencies to take a stronger stance against cybercrime, and a White House fact sheet said American consumers reported $20.8 billion in cyber-related losses last year.\u003c/p\u003e\n\n\u003cp\u003eParticipating companies will sign contracts with DOJ or DHS, undergo rigorous vetting, disclose all contractual relationships, and face penalties of at least $1 million for violations. Federal agencies have two months to develop operating procedures and minimum standards, including technical proficiency, facility security, personnel vetting, reliability, and other factors. The memorandum also requires companies to stop operations, conduct minimization procedures, and immediately notify federal officials if activity exceeds approved limits, such as unintentionally targeting a U.S. person, a U.S.-based system, or a system controlled by a U.S. person.\u003c/p\u003e\n"},{"n":9,"title":"One Extra Letter, Full Auth Pass, Nothing to Scan","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/typosquat-full-auth-ach-change-out-of-band-encrypted-file-pin","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Attackers used a one-letter typosquatted vendor domain with properly configured SPF, DKIM and DMARC to send an ACH payment-change request that passed authentication and contained no malicious links or payloads. The key lesson is that email authentication proves domain control, not legitimacy, so payment changes must be verified outside email and checked against trusted vendor records.","briefOverview":"\u003cp\u003eA large U.S. regional healthcare system received an ACH enrolment notice that appeared to come from a medical-device manufacturer it already bought from. The message said the manufacturer was ending check and credit-card payments and moving payments to ACH. The sending domain was \u003ccode\u003earthrrex[.]com\u003c/code\u003e, a one-character typosquat of the real \u003ccode\u003earthrex[.]com\u003c/code\u003e domain with a doubled \u003ccode\u003er\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, Microsoft composite authentication, and ARC checks because the attacker owned and correctly configured the lookalike domain. The message contained links only to the real manufacturer’s website and social channels, and the attached PDF had no JavaScript, form fields, embedded executable, or detectable malicious content. The banking-detail request appeared as unlinked plain text, while the actual ACH information was promised later as an encrypted file with a PIN sent separately.\u003c/p\u003e\n\n\u003cp\u003eThe attached memo was styled as an executive notice, but its PDF metadata showed it was created and modified on the same day the lookalike domain was registered, while the memo text was dated three days earlier. IRONSCALES Themis scored the message at 84 percent confidence based on the newly registered return-path domain, and four mailboxes across two waves in mid-July were quarantined and mitigated. The article concludes that authentication should be treated as an identity claim rather than a verdict, and that payment-instruction changes should be verified through trusted contact information outside email.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A large U.S. regional healthcare system received an ACH enrolment notice that appeared to come from Arthrex, a medical-device manufacturer it already did business with.","The attacker used the typosquatted domain arthrrex.com, which differs from the legitimate arthrex.com domain by a doubled “r”.","The message passed SPF, DKIM, DMARC, Microsoft composite authentication, and ARC checks because the attacker owned and correctly configured the sending domain.","The email and attached PDF contained no malicious links, JavaScript, form fields, executable content, account numbers, or routing details for scanners to evaluate.","IRONSCALES Themis scored the message at 84 percent confidence based on the newly registered return-path domain, and four mailboxes across two waves in mid-July were quarantined and mitigated."],"insights":["A full SPF, DKIM, and DMARC pass can still be consistent with fraud when the attacker owns the lookalike domain, because those checks only confirm control of the sending domain rather than whether the domain represents the real vendor.","The attacker deliberately kept the actionable fraud details out of the email path by requesting a plain-text reply and promising bank information later in an encrypted file with a separate PIN, leaving link scanning, attachment detonation, and bank-detail matching with nothing useful to inspect.","The PDF metadata undermined the memo’s story: it showed the document was created and modified on the same day the lookalike domain was registered, while the memo text was dated three days earlier.","Edit-distance checks against an organization’s vendor master list would have been more relevant than ordinary link or attachment scanning, because the decisive signal was a one-character variant of a known supplier’s domain.","Payment-instruction changes should be confirmed through a known contract phone number rather than any contact path in the email, because the message pre-explained why the receiving bank account would not match the vendor’s name."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article cites the report for statistics on pretexting as an initial access vector and breaches involving a human element.","category":"research","primary":false},{"title":"2025 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for the stated amount of business email compromise losses.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references the guidance when recommending that payment changes be confirmed through a trusted contract number rather than details in the email request.","category":"guide","primary":false}],"body":"\u003cp\u003eA large U.S. regional healthcare system received an ACH enrolment notice that appeared to come from a medical-device manufacturer it already bought from. The message said the manufacturer was ending check and credit-card payments and moving payments to ACH. The sending domain was \u003ccode\u003earthrrex[.]com\u003c/code\u003e, a one-character typosquat of the real \u003ccode\u003earthrex[.]com\u003c/code\u003e domain with a doubled \u003ccode\u003er\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, Microsoft composite authentication, and ARC checks because the attacker owned and correctly configured the lookalike domain. The message contained links only to the real manufacturer’s website and social channels, and the attached PDF had no JavaScript, form fields, embedded executable, or detectable malicious content. The banking-detail request appeared as unlinked plain text, while the actual ACH information was promised later as an encrypted file with a PIN sent separately.\u003c/p\u003e\n\n\u003cp\u003eThe attached memo was styled as an executive notice, but its PDF metadata showed it was created and modified on the same day the lookalike domain was registered, while the memo text was dated three days earlier. IRONSCALES Themis scored the message at 84 percent confidence based on the newly registered return-path domain, and four mailboxes across two waves in mid-July were quarantined and mitigated. The article concludes that authentication should be treated as an identity claim rather than a verdict, and that payment-instruction changes should be verified through trusted contact information outside email.\u003c/p\u003e\n"},{"n":10,"title":"The State of Ransomware Q2 2026","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/","time":"12:54","priority":"SHOULD READ","score":82,"tldr":"Check Point Research reports that ransomware activity stayed near record highs in Q2 2026, with more active groups emerging even as leaders like Qilin and The Gentlemen still dominated victim counts. The report also highlights falling ransom payment rates, faster AI-assisted tooling and exploit development, and law enforcement efforts targeting shared criminal infrastructure.","briefOverview":"\u003cp\u003eCheck Point Research’s State of Ransomware Q2 2026 report says the ransomware ecosystem remained concentrated, but the number of active groups widened significantly. The top 10 groups accounted for 57.6% of all victims, down from 71% in Q1, while active groups rose from 71 to 93. Data leak sites recorded 2,139 victims in Q2, essentially flat from Q1 and up 33% year over year.\u003c/p\u003e\n\n\u003cp\u003eQilin remained the most prolific operator for a fourth straight quarter with 279 victims, though its count fell 17%. The Gentlemen surged 62% to 269 victims and outpaced Qilin during June. An internal leak exposed The Gentlemen’s roughly nine-person core team, broader affiliate base, and use of AI coding assistants to build a ransomware management panel in about three days.\u003c/p\u003e\n\n\u003cp\u003eThe report says ransom payment rates fell to a multi-year low near 23%, continuing a six-year decline from 85% in 2019, while on-chain ransomware payments still exceeded $820 million in 2025. Law enforcement actions in Q2 focused on shared criminal infrastructure, including laundering, malware signing, infostealer, and VPN anonymization services used by multiple groups. The US share of victims fell from 50% to 42%, and the report says vulnerabilities are now being weaponized within hours to days of disclosure, with AI increasingly cited as an accelerant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research reported that the top 10 ransomware groups accounted for 57.6% of victims in Q2 2026, down from 71% in Q1, while the number of active groups rose from 71 to 93.","Data leak sites recorded 2,139 ransomware victims in Q2 2026, which was essentially flat compared with Q1 and 33% higher year over year.","Qilin remained the most prolific ransomware operator for a fourth straight quarter with 279 victims, while The Gentlemen rose 62% to 269 victims and outpaced Qilin during June.","An internal leak of The Gentlemen exposed a core team of roughly nine operators, a broader affiliate base, and evidence that the group used AI coding assistants to build its ransomware management panel in about three days.","Ransom payment rates fell to a multi-year low near 23%, even as on-chain ransomware payments still exceeded $820 million in 2025."],"insights":["The ransomware ecosystem is becoming less top-heavy: leading groups still dominate, but the drop in the top 10 groups’ victim share alongside a record 93 active groups suggests newer or smaller groups are gaining more room to operate.","The Gentlemen’s internal leak is notable because it provided first-party evidence that AI coding assistants can materially speed up criminal tooling development, with a ransomware management panel reportedly built in about three days.","The payment market is splitting rather than simply shrinking, as average payments are rising while median payments fall, indicating that large enterprises continue to pay heavily while mid-market victims increasingly resist or settle for smaller amounts.","Law enforcement activity in Q2 focused on shared services used by many ransomware groups, such as laundering, malware signing, infostealer, and anonymization infrastructure, rather than only pursuing individual ransomware brands.","The decline in the US share of victims appears tied to the growth of groups such as The Gentlemen and Krybit that target the US less often than the broader ransomware ecosystem average."],"referencedReports":[],"body":"\u003cp\u003eCheck Point Research’s State of Ransomware Q2 2026 report says the ransomware ecosystem remained concentrated, but the number of active groups widened significantly. The top 10 groups accounted for 57.6% of all victims, down from 71% in Q1, while active groups rose from 71 to 93. Data leak sites recorded 2,139 victims in Q2, essentially flat from Q1 and up 33% year over year.\u003c/p\u003e\n\n\u003cp\u003eQilin remained the most prolific operator for a fourth straight quarter with 279 victims, though its count fell 17%. The Gentlemen surged 62% to 269 victims and outpaced Qilin during June. An internal leak exposed The Gentlemen’s roughly nine-person core team, broader affiliate base, and use of AI coding assistants to build a ransomware management panel in about three days.\u003c/p\u003e\n\n\u003cp\u003eThe report says ransom payment rates fell to a multi-year low near 23%, continuing a six-year decline from 85% in 2019, while on-chain ransomware payments still exceeded $820 million in 2025. Law enforcement actions in Q2 focused on shared criminal infrastructure, including laundering, malware signing, infostealer, and VPN anonymization services used by multiple groups. The US share of victims fell from 50% to 42%, and the report says vulnerabilities are now being weaponized within hours to days of disclosure, with AI increasingly cited as an accelerant.\u003c/p\u003e\n"},{"n":8,"title":"Brazil orders Discord to suspend livestreaming after teen suicide","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/discord-brazil-orders-suspension-livestreaming","time":"13:37","priority":"SHOULD READ","score":78,"tldr":"Brazil ordered Discord to suspend its Go Live livestreaming feature nationwide after authorities said a 13-year-old was encouraged to die by suicide during a broadcast and regulators found evidence of child-safety failures. Discord said it is reviewing the order and called the suspension premature.","briefOverview":"\u003cp\u003eBrazil’s National Data Protection Authority ordered Discord to suspend its Go Live livestreaming feature in Brazil while officials investigate whether the platform failed to protect children from content encouraging self-harm and suicide. The order follows the death of a 13-year-old girl in central-western Brazil whom authorities say was encouraged to harm herself during a roughly 45-minute Discord livestream in July. Five teenagers have been arrested in connection with the case, and police also intervened in a separate incident involving a girl preparing to die by suicide during an online broadcast.\u003c/p\u003e\n\n\u003cp\u003eThe ANPD said it found “robust evidence” that Discord failed to take reasonable steps to protect children and teenagers from harmful content, especially material promoting or facilitating violence, self-harm, or suicide. The regulator emphasized that Discord itself is not being blocked in Brazil and that the order applies only to Go Live. Discord has three business days to show it has fully implemented the suspension across Brazil, and the suspension will remain until the company demonstrates effective measures to address the risks identified by regulators.\u003c/p\u003e\n\n\u003cp\u003eThe regulator said Discord’s technical setup makes livestream abuse difficult to prevent because the company cannot access video content as it is being broadcast, limiting real-time detection and leaving it largely dependent on automated systems and user reports. Brazilian authorities also criticized Discord’s March move to add end-to-end encryption to Go Live, saying it further limited detection of harmful activity as it happened. Discord confirmed it received the order, said it was reviewing it, disputed the regulator’s description of its safety practices, and called the livestreaming suspension in Brazil “premature.”\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Brazil’s National Data Protection Authority ordered Discord to suspend its Go Live livestreaming feature in Brazil until the company can show it has effective safeguards to protect children and teenagers.","The order follows the death of a 13-year-old girl in central-western Brazil whom authorities say was encouraged to harm herself during a roughly 45-minute Discord livestream in July.","Brazilian authorities said five teenagers have been arrested in connection with the case and that police intervened in a separate incident involving a girl preparing to die by suicide during an online broadcast.","The ANPD said it found robust evidence that Discord failed to take reasonable steps to protect children and teenagers from harmful content promoting or facilitating violence, self-harm, or suicide.","Discord confirmed it had received the order, said it was reviewing it, and called the suspension of livestreaming in Brazil premature."],"insights":["The regulator specifically targeted Discord’s Go Live feature rather than blocking Discord entirely, showing that Brazilian authorities are trying to limit the riskiest function while keeping the broader service available.","Brazilian authorities cited Discord’s end-to-end encryption for Go Live as a safety concern because it further limits the company’s ability to detect harmful activity while it is happening.","The ANPD said Discord’s safeguards were inadequate partly because they acted only after harm had occurred or relied heavily on user reports from individual servers.","Discord could face fines of up to 50 million Brazilian reais, or roughly $10 million, per violation if regulators confirm violations during the broader investigation.","SaferNet Brasil reported receiving 406 reports involving Discord in just the first seven months of 2026, indicating that concerns about the platform in Brazil extend beyond the single livestreaming case."],"referencedReports":[{"title":"SaferNet Brasil encaminha às autoridades documentação técnica sobre o Discord","url":"https://new.safernet.org.br/content/safernet-brasil-encaminha-autoridades-documentacao-tecnica-sobre-o-discord","publisher":"SaferNet Brasil","context":"The article cites a recent SaferNet Brasil analysis of Discord’s disclosures to the European Union, noting that child and adolescent protection historically made up a large share of Discord’s reported moderation decisions in Europe.","category":"research","primary":false}],"body":"\u003cp\u003eBrazil’s National Data Protection Authority ordered Discord to suspend its Go Live livestreaming feature in Brazil while officials investigate whether the platform failed to protect children from content encouraging self-harm and suicide. The order follows the death of a 13-year-old girl in central-western Brazil whom authorities say was encouraged to harm herself during a roughly 45-minute Discord livestream in July. Five teenagers have been arrested in connection with the case, and police also intervened in a separate incident involving a girl preparing to die by suicide during an online broadcast.\u003c/p\u003e\n\n\u003cp\u003eThe ANPD said it found “robust evidence” that Discord failed to take reasonable steps to protect children and teenagers from harmful content, especially material promoting or facilitating violence, self-harm, or suicide. The regulator emphasized that Discord itself is not being blocked in Brazil and that the order applies only to Go Live. Discord has three business days to show it has fully implemented the suspension across Brazil, and the suspension will remain until the company demonstrates effective measures to address the risks identified by regulators.\u003c/p\u003e\n\n\u003cp\u003eThe regulator said Discord’s technical setup makes livestream abuse difficult to prevent because the company cannot access video content as it is being broadcast, limiting real-time detection and leaving it largely dependent on automated systems and user reports. Brazilian authorities also criticized Discord’s March move to add end-to-end encryption to Go Live, saying it further limited detection of harmful activity as it happened. Discord confirmed it received the order, said it was reviewing it, disputed the regulator’s description of its safety practices, and called the livestreaming suspension in Brazil “premature.”\u003c/p\u003e\n"},{"n":2,"title":"WhatsApp rolls out new feature that flags potential scam messages","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/whatsapp-rolls-out-new-feature-that-flags-potential-scam-messages/","time":"11:50","priority":"MAY READ","score":68,"tldr":"WhatsApp is rolling out an optional Scam Alert feature that uses on-device machine learning to warn users about likely scam messages from non-contacts without sending message content to Meta. Users can block, report, continue, or mark chats as trusted, with optional sharing of recent messages to improve accuracy.","briefOverview":"\u003cp\u003eWhatsApp has begun a limited beta rollout of Scam Alert, a new optional feature that warns users about potential scam messages. The feature uses an on-device machine learning model and is being tested with researchers in the company’s Bug Bounty community. WhatsApp says no message content leaves the device for classification or is automatically reported to WhatsApp, Meta, or anyone else.\u003c/p\u003e\n\n\u003cp\u003eScam Alert is designed to check whether incoming messages from non-contacts match known scam patterns. The model uses linguistic signals and probabilistic classification based on conversational structure, and it was trained on scam conversations reported by users. If it detects a potential scam attempt, the user sees a warning asking them to block, report, or continue the conversation.\u003c/p\u003e\n\n\u003cp\u003eUsers can mark a flagged chat as trusted if they believe the warning is wrong, which removes the warning and prevents Scam Alert from flagging that chat again. They can also choose to share the last five received messages with WhatsApp to help improve the feature’s accuracy. The rollout is part of broader WhatsApp security efforts that include warnings for suspicious device-linking requests and Strict Account Settings for high-risk users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WhatsApp has begun a limited beta rollout of an optional Scam Alert feature that uses an on-device machine learning model to warn users about potential scam messages.","Scam Alert checks incoming messages from non-contacts against known scam patterns using linguistic signals and the structure of the conversation.","When Scam Alert detects a potential scam attempt, it shows a chat warning asking the user to block, report, or continue the conversation.","WhatsApp says no message content leaves the device for classification or is automatically reported to WhatsApp, Meta, or anyone else.","Users can mark a flagged chat as trusted to stop future Scam Alert warnings for that chat, and they can optionally share the last five received messages with WhatsApp to help improve the feature."],"insights":["WhatsApp is testing Scam Alert with researchers in its Bug Bounty community before broader availability, indicating the company is seeking external security feedback on the warning system during the limited beta rollout.","The feature is designed to complement end-to-end encryption by classifying potential scams on the user’s device rather than sending message content elsewhere for analysis.","Users who believe a warning is wrong can both disable warnings for that specific chat by marking it trusted and separately choose whether to share the last five received messages with WhatsApp to improve accuracy.","Scam Alert is part of a broader WhatsApp anti-scam and high-risk-user protection push that also includes warnings for suspicious device-linking requests and Strict Account Settings."],"referencedReports":[],"body":"\u003cp\u003eWhatsApp has begun a limited beta rollout of Scam Alert, a new optional feature that warns users about potential scam messages. The feature uses an on-device machine learning model and is being tested with researchers in the company’s Bug Bounty community. WhatsApp says no message content leaves the device for classification or is automatically reported to WhatsApp, Meta, or anyone else.\u003c/p\u003e\n\n\u003cp\u003eScam Alert is designed to check whether incoming messages from non-contacts match known scam patterns. The model uses linguistic signals and probabilistic classification based on conversational structure, and it was trained on scam conversations reported by users. If it detects a potential scam attempt, the user sees a warning asking them to block, report, or continue the conversation.\u003c/p\u003e\n\n\u003cp\u003eUsers can mark a flagged chat as trusted if they believe the warning is wrong, which removes the warning and prevents Scam Alert from flagging that chat again. They can also choose to share the last five received messages with WhatsApp to help improve the feature’s accuracy. The rollout is part of broader WhatsApp security efforts that include warnings for suspicious device-linking requests and Strict Account Settings for high-risk users.\u003c/p\u003e\n"},{"n":3,"title":"Drop Something? Don’t Worry, Someone Caught it","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/drop-something-dont-worry-someone-caught-it/","time":"13:00","priority":"MAY READ","score":60,"tldr":"Infoblox found that about one in five newly registered domains are previously expired domains that have been re-registered, giving them inherited reputation, traffic, and lingering connections that can be abused. Defenders should treat dropped domains as a security risk because ownership changes can transfer trust to domain investors or threat actors.","briefOverview":"\u003cp\u003eInfoblox Threat Intel examined “dropcatch” domains, which are domains that expired, became available again, and were re-registered by someone else. During the first half of 2026, Infoblox observed over 50,000 dropc
