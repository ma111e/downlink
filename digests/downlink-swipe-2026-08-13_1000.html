atch domains per day in gTLDs alone, rising to around 65,000 per day when various ccTLDs were included. For gTLDs, nearly 20% of all observed registrations were dropcatch domains, meaning about one in five newly registered domains had a prior life.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that dropped domains can come from failed businesses, temporary events, charities, political campaigns, personal blogs, mergers, acquisitions, missed renewal notices, or abandoned threat actor infrastructure. These domains matter because they may retain reputation, traffic, email, cached search results, lingering DNS records, and other connections from their previous owners. Infoblox notes that threat actors can take advantage of this inherited trust, while defenders may also catch expired domains to prevent abuse or recover forgotten assets.\u003c/p\u003e\n\n\u003cp\u003eInfoblox says measuring dropcatch activity is difficult because creation date information varies across TLDs and historical domain data is needed to determine whether a newly observed domain existed before. The research found that about 92% of observed gTLD dropcatch domains came from just 15 TLDs, with .net and .xyz showing particularly high dropcatch rates. The article also describes how expired domains may pass through recovery phases, backorders, and auctions before being re-registered, and cites a case where a previously expired CDN domain was caught in February 2026 and used to send website visitors to malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox observed over 50,000 dropcatch domains per day in gTLDs during the first half of 2026, rising to around 65,000 per day when various ccTLDs were included.","Nearly 20% of observed gTLD registrations were dropcatch domains, meaning about one in five newly registered domains had a prior registration history.","Dropcatch domains can inherit reputation, traffic, email, cached search results, lingering DNS records, and other connections from their previous owners, making them potentially valuable to threat actors.","Approximately 92% of all observed gTLD dropcatch domains came from just 15 TLDs, with .net and .xyz showing dropcatch rates near three out of every ten newly observed domains.","Infoblox said identifying dropcatch domains at scale is difficult because creation date availability varies across TLDs and historical domain ownership or use is often hard to determine reliably."],"insights":["A domain’s original creation date can be misleading as a trust signal because a previously registered domain may reappear with a new owner while still benefiting from reputation tied to its old history.","Expired domains used only for internal purposes can still become costly security or business problems, as Infoblox described being asked for $40,000 to recover one such domain after missing renewal notices.","Dropcatch risk is concentrated enough that focusing monitoring on a small set of TLDs may be practical, since about 92% of observed gTLD dropcatch domains came from only 15 TLDs.","Some expired domains are not merely re-registered after deletion but can be auctioned earlier through registrar-operated platforms, meaning recovery and acquisition paths may begin before a domain fully returns to open availability.","Long-broken links can become dangerous again years later, as shown by the CDN domain that returned no responses for years before being caught in February 2026 and used to send website visitors to malware."],"referencedReports":[{"title":"The Perils of Expired Domains: We’re Reading Your Email","url":"https://labs.watchtowr.com/the-perils-of-expired-domains-were-reading-your-email/","publisher":"watchTowr Labs","context":"The article cites watchTowr Labs’ analysis as an example of how expired domains can expose email intended for the original domain holder.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox Threat Intel examined “dropcatch” domains, which are domains that expired, became available again, and were re-registered by someone else. During the first half of 2026, Infoblox observed over 50,000 dropcatch domains per day in gTLDs alone, rising to around 65,000 per day when various ccTLDs were included. For gTLDs, nearly 20% of all observed registrations were dropcatch domains, meaning about one in five newly registered domains had a prior life.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that dropped domains can come from failed businesses, temporary events, charities, political campaigns, personal blogs, mergers, acquisitions, missed renewal notices, or abandoned threat actor infrastructure. These domains matter because they may retain reputation, traffic, email, cached search results, lingering DNS records, and other connections from their previous owners. Infoblox notes that threat actors can take advantage of this inherited trust, while defenders may also catch expired domains to prevent abuse or recover forgotten assets.\u003c/p\u003e\n\n\u003cp\u003eInfoblox says measuring dropcatch activity is difficult because creation date information varies across TLDs and historical domain data is needed to determine whether a newly observed domain existed before. The research found that about 92% of observed gTLD dropcatch domains came from just 15 TLDs, with .net and .xyz showing particularly high dropcatch rates. The article also describes how expired domains may pass through recovery phases, backorders, and auctions before being re-registered, and cites a case where a previously expired CDN domain was caught in February 2026 and used to send website visitors to malware.\u003c/p\u003e\n"}]</script>
