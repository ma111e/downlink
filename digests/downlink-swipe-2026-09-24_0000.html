s://www.bleepingcomputer.com/news/security/fedramp-vdr-and-ver-daily-scans-are-only-the-beginning/","time":"14:02","priority":"MAY READ","score":55,"tldr":"FedRAMP’s VDR and VER rules, mandatory from December 7, 2026, require continuous, automated vulnerability detection, evidence validation, and tightly timed remediation rather than periodic scans and manual compliance artifacts. The sponsored article argues that providers should build durable continuous-validation capabilities now as part of the broader transition from FedRAMP Rev5 to FedRAMP 20x.","briefOverview":"\u003cp\u003eFedRAMP’s Vulnerability Detection and Response (VDR) and Vulnerability Exploitability Rules (VER) become mandatory for cloud service offerings obtaining or maintaining FedRAMP certification on December 7, 2026. Offerings operating under a corrective action plan have a grace period through March 7, 2027. The sponsored article argues that the rules require more than frequent vulnerability scans: they require a continuously operating system that produces current, machine-readable evidence of security exposure and response.\u003c/p\u003e\n\n\u003cp\u003eUnder the new rules, machine-based resources must be scanned between every 14 days for Class A and at least daily for Class D, while machine verification and validation can be required as often as every three days for higher 20x classes. Remediation deadlines range from 192 days to 12 hours based on PAIN rating and exploitability, providers must assume exploits are automatable unless evidence shows otherwise, and failures in detection and response processes must be treated as vulnerabilities. The article places these requirements within FedRAMP’s transition from Rev5 to FedRAMP 20x, which replaces several manually maintained compliance artifacts with ongoing, automated validation based on live data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FedRAMP’s Vulnerability Detection and Response and Vulnerability Exploitability Rules become mandatory for cloud service offerings obtaining or maintaining FedRAMP certification on December 7, 2026, with a corrective-action-plan grace period through March 7, 2027.","The VDR rules require machine-based resources to be scanned from every 14 days at Class A to at least daily at Class D, while machine verification and validation must run at least monthly for Rev5 holders and as often as every three days for higher 20x classes.","Remediation deadlines range from 192 days to 12 hours depending on a vulnerability’s PAIN rating and exploitability, and providers must assume exploits are automatable unless they have evidence otherwise.","FedRAMP requires providers to treat failures in their vulnerability-detection and response processes as vulnerabilities themselves.","FedRAMP is replacing Rev5 with FedRAMP 20x, with new rules mandatory for all stakeholders on January 1, 2027, and no new Rev5 applications accepted after June 11, 2027."],"insights":["A 12-hour remediation deadline turns vulnerability handling from a normal ticket-queue task into an around-the-clock ownership and paging problem, including during holidays and weekends.","Because providers must treat failures in their own detection and response processes as vulnerabilities, the systems used to generate compliance evidence are themselves part of the security scope.","The shift from Plans of Action and Milestones to Accepted Weaknesses, and from Continuous Monitoring to Ongoing Certification, reflects FedRAMP’s move away from manually maintained documents toward evidence generated from live systems.","The article frames the December 2026 VDR and VER deadline as an early part of the broader FedRAMP 20x transition, meaning work designed only to meet the immediate deadline may need to be rebuilt in 2027.","Structured, current security evidence can potentially serve FedRAMP, SOC 2 audits, and customer due-diligence requests instead of requiring separate compliance efforts for each framework."],"referencedReports":[{"title":"FedRAMP Notice NTC-0014: Response to CISA BOD 26-04","url":"https://www.fedramp.gov/notices/0014/","publisher":"fedramp","context":"The article cites this FedRAMP notice for the December 7, 2026 effective date and the requirement to assume exploits are automatable unless evidence shows otherwise.","category":"advisory","primary":true}],"body":"\u003cp\u003eFedRAMP’s Vulnerability Detection and Response (VDR) and Vulnerability Exploitability Rules (VER) become mandatory for cloud service offerings obtaining or maintaining FedRAMP certification on December 7, 2026. Offerings operating under a corrective action plan have a grace period through March 7, 2027. The sponsored article argues that the rules require more than frequent vulnerability scans: they require a continuously operating system that produces current, machine-readable evidence of security exposure and response.\u003c/p\u003e\n\n\u003cp\u003eUnder the new rules, machine-based resources must be scanned between every 14 days for Class A and at least daily for Class D, while machine verification and validation can be required as often as every three days for higher 20x classes. Remediation deadlines range from 192 days to 12 hours based on PAIN rating and exploitability, providers must assume exploits are automatable unless evidence shows otherwise, and failures in detection and response processes must be treated as vulnerabilities. The article places these requirements within FedRAMP’s transition from Rev5 to FedRAMP 20x, which replaces several manually maintained compliance artifacts with ongoing, automated validation based on live data.\u003c/p\u003e\n"},{"n":35,"title":"Introducing Censys CLI Skills: AI-Assisted Investigations at Scale","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/introducing-censys-cli-skills/","time":"17:00","priority":"MAY READ","score":55,"tldr":"Censys has launched nine AI-agent skills for its cencli command-line tool, enabling structured, repeatable Internet-facing infrastructure investigations with automated pivots, population counts, and evidence tracking. The skills aim to help security teams investigate alerts, threat intelligence, vulnerabilities, and phishing campaigns at scale while retaining analyst judgment.","briefOverview":"\u003cp\u003eCensys introduced nine markdown-based skills that teach AI coding assistants to use cencli, its open-source command-line tool, for Internet infrastructure investigations. The skills are available as a Claude Code plugin but can also work with tools that accept custom instructions. They are intended to help SOC, threat-intelligence, vulnerability-management, and brand-protection teams perform repeatable investigations at alert-queue speed.\u003c/p\u003e\n\n\u003cp\u003eThe release includes six command-wrapper skills for search, view, aggregate, enrich, CensEye, and timeline operations; a CenQL query reference; and methodology skills for investigation and analysis with jq and SQLite. Before a larger investigation starts, the investigation skill confirms the target, estimates API calls, and offers a lighter option; standard runs use 20–50 calls, while deep pivoting can exceed 100. The article emphasizes counting how many Internet hosts share a potential signal, reading page content before choosing a fingerprint, documenting negative findings, and distinguishing reusable operator clues from common hosting-provider or platform defaults.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys released nine markdown-based skills for AI coding assistants to drive cencli, its open-source command-line interface, for Internet infrastructure investigations.","The skills include six command wrappers, a CenQL query-language reference, and two methodology skills for structured investigation and analysis using jq and SQLite.","The investigation skill confirms the target and estimated API-call count before starting, with standard investigations using 20–50 calls and deep pivoting potentially exceeding 100 calls.","The article advises analysts to count the population matching a potential indicator before treating it as distinctive, and to document negative findings as rigorously as positive ones.","The skills are distributed as a Claude Code plugin but are plain markdown files intended to work with other agent tools that support custom instructions."],"insights":["A single IP address is often a weak long-term signal because infrastructure can be reassigned or replaced, while reused artifacts such as a page body, SSH host key, or favicon can reveal related systems not included in an original report.","Population counts are essential before using a signal as evidence: the article treats zero to five matches as potentially unique, while 25 or more matches indicate a broad signal that may be provider or platform noise.","Reading a webpage before searching for technical fingerprints can produce stronger pivots; in the example, a small hidden-frame script and a Russian developer comment explained why the page body hash was meaningful.","A zero-result search does not necessarily establish uniqueness, because some Censys fields only index services that are currently visible; analysts should first verify that the field is populated.","The article separates tracking into confidence tiers, using a shared SSH key for an operator-sized set, page hashes for a wider kit-sized set, and original indicators mainly for log correlation rather than direct detection."],"referencedReports":[],"body":"\u003cp\u003eCensys introduced nine markdown-based skills that teach AI coding assistants to use cencli, its open-source command-line tool, for Internet infrastructure investigations. The skills are available as a Claude Code plugin but can also work with tools that accept custom instructions. They are intended to help SOC, threat-intelligence, vulnerability-management, and brand-protection teams perform repeatable investigations at alert-queue speed.\u003c/p\u003e\n\n\u003cp\u003eThe release includes six command-wrapper skills for search, view, aggregate, enrich, CensEye, and timeline operations; a CenQL query reference; and methodology skills for investigation and analysis with jq and SQLite. Before a larger investigation starts, the investigation skill confirms the target, estimates API calls, and offers a lighter option; standard runs use 20–50 calls, while deep pivoting can exceed 100. The article emphasizes counting how many Internet hosts share a potential signal, reading page content before choosing a fingerprint, documenting negative findings, and distinguishing reusable operator clues from common hosting-provider or platform defaults.\u003c/p\u003e\n"},{"n":31,"title":"Infostealers Are Exposing More Than Passwords. Here’s What Security Teams Need to Know","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/infostealers-are-exposing-more-than-passwords-heres-what-security-teams-need-to-know/","time":"16:24","priority":"MAY READ","score":54,"tldr":"Infostealer infections can expose passwords, browser cookies, session tokens, device identifiers, and service-use data, enabling attackers to exploit identities beyond a simple credential reset. Organizations should correlate external exposure signals and review active sessions and authentication artifacts alongside strengthening authentication controls.","briefOverview":"\u003cp\u003eConstella Intelligence reported 5.53 million devices with infostealer infection dates during Q2 2026, a 99.53% increase from Q1. Its analysis found web addresses in 99.75% of infostealer records and passwords in 94.97%, alongside usernames, email addresses, and hardware IDs. These collected artifacts can show which services a victim uses and help connect activity to an identity or device.\u003c/p\u003e\n\n\u003cp\u003eInfostealers can also collect browser cookies, session tokens, browsing data, cached credentials, and device information, so the risk can extend beyond stolen passwords. A valid stolen session could potentially be reused without another normal login, depending on token validity, platform controls, and whether the compromised session is detected and revoked. Constella recommends correlating identity exposure signals, acting immediately on confirmed plaintext credentials, investigating infections beyond password resets, reviewing active sessions where supported, strengthening authentication controls, and continuously monitoring external exposure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Constella Intelligence recorded 5.53 million devices with infostealer infection dates during Q2 2026, a 99.53% increase from Q1.","Constella’s Q2 analysis found web addresses in 99.75% of infostealer records, passwords in 94.97%, usernames in 46.95%, email addresses in 46.05%, and hardware IDs in 22.62%.","Infostealers can capture browser cookies, session tokens, browsing data, cached credentials, and device information in addition to passwords.","An employee’s identity may be exposed through an infection on a personal or unmanaged device even when an organization has strong controls around its corporate network and managed endpoints.","Constella recommends correlating exposure across identities, treating confirmed plaintext credentials as immediately actionable, investigating infostealer infections beyond password resets, and continuously monitoring external identity exposure."],"insights":["A stolen authenticated browser session may potentially be reused without a new username-and-password login if the session remains valid and is not detected and revoked.","Organizations can face consequences from an employee’s exposed identity even when the original infostealer infection occurred on a personal or otherwise unmanaged device.","URLs, email addresses, passwords, and device information become more useful to attackers when connected together, because they can reveal services associated with a victim and provide identity and device context.","Investigating an infostealer exposure may need to include reviewing active sessions and authentication artifacts where supported, rather than only resetting passwords."],"referencedReports":[{"title":"Constella Intelligence Quarterly Identity Breach Report","url":"https://constella.ai/reports/2026-quarterly-identity-breach-report-q2/","publisher":"Constella Intelligence","context":"The article cites Constella’s Q2 2026 Quarterly Identity Breach Report as the source for its infostealer and external identity-exposure findings and links to the complete report.","category":"research","primary":true}],"body":"\u003cp\u003eConstella Intelligence reported 5.53 million devices with infostealer infection dates during Q2 2026, a 99.53% increase from Q1. Its analysis found web addresses in 99.75% of infostealer records and passwords in 94.97%, alongside usernames, email addresses, and hardware IDs. These collected artifacts can show which services a victim uses and help connect activity to an identity or device.\u003c/p\u003e\n\n\u003cp\u003eInfostealers can also collect browser cookies, session tokens, browsing data, cached credentials, and device information, so the risk can extend beyond stolen passwords. A valid stolen session could potentially be reused without another normal login, depending on token validity, platform controls, and whether the compromised session is detected and revoked. Constella recommends correlating identity exposure signals, acting immediately on confirmed plaintext credentials, investigating infections beyond password resets, reviewing active sessions where supported, strengthening authentication controls, and continuously monitoring external exposure.\u003c/p\u003e\n"},{"n":16,"title":"Secrets Sprawl Is an Identity Problem That AI Just Made Impossible to Ignore","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/secrets-sprawl-is-identity-problem-that.html","time":"11:00","priority":"MAY READ","score":52,"tldr":"AI coding agents are accelerating secrets sprawl by accessing, copying and using long-lived credentials across developer environments, configurations and connected systems. Organizations should treat agents as non-human identities, using centrally managed short-lived secrets, least-privilege access, inventorying and auditing, and human approval for sensitive actions.","briefOverview":"\u003cp\u003eAI coding agents are increasing the speed at which credentials can be exposed, with GitGuardian’s 2026 State of Secrets Sprawl Report finding that AI-assisted commits leak secrets at approximately twice the rate of human-written commits. The article argues that this is not a new kind of weakness, but an increase in the scale and pace of existing credential-management problems. Agents can read project files, execute commands, call APIs, interact with Model Context Protocol servers, and modify configurations, creating additional paths for credentials to spread.\u003c/p\u003e\n\n\u003cp\u003eThe article frames secrets sprawl as a non-human identity problem because every action an agent takes on another system is authorized by a credential. Sensitive credentials may be present in local \u003ccode\u003e.env\u003c/code\u003e files, agent and MCP configurations, CI/CD variables, ticketing systems, and collaboration tools, while shared or over-permissioned agent accounts make attribution and access control harder. It recommends centralized secrets management, short-lived automatically rotated credentials, separate narrowly scoped identities for each agent, human approval for sensitive operations, inventories of agents and MCP servers, and logging and auditing of agent activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitGuardian’s 2026 State of Secrets Sprawl Report says AI-assisted commits leak secrets at about twice the rate of human-written commits.","AI coding agents can read sensitive local files, execute commands, call APIs, interact with MCP servers, and modify configurations, creating more paths for credentials to spread.","The article argues that secrets sprawl in AI-assisted development should be managed as a non-human identity problem by controlling what each agent identity can access.","Keeper Security’s RSAC 2026 survey found that 46% of respondents said AI-powered tools can access critical systems and sensitive data, while 76% said those identities are not consistently governed by privileged-access policies.","The article recommends centralized secrets management, short-lived automatically rotated credentials, scoped identities for each agent, human approval for sensitive operations, and complete logging of agent activity."],"insights":["Rotating a credential found in a source repository may provide little protection if identical active copies remain in CI/CD variables, ticketing systems, collaboration tools, or local configuration files.","AI agents change the security assumptions for developer workstations because plaintext credentials in local files can become accessible to software operating across the same environment, even when those credentials are unrelated to the assigned task.","Using a shared service account for multiple agents prevents reliable attribution of actions and gives every agent the broadest access required by any one of them.","An orchestration layer that holds credentials for several agents can create a domino effect, because compromise of that identity can grant access to every system it was authorized to reach.","Secret scanning is inherently reactive because it detects credentials after they have spread, while centralized, short-lived and narrowly scoped credentials reduce the value of a leaked secret."],"referencedReports":[{"title":"2026 State of Secrets Sprawl Report","url":"https://www.gitguardian.com/state-of-secrets-sprawl-report-2026","publisher":"gitguardian","context":"The article cites this report for the finding that AI-assisted commits leak secrets at approximately twice the rate of human-written commits.","category":"research","primary":false},{"title":"Keeper Security RSAC 2026 Survey","url":"https://www.prnewswire.com/news-releases/keeper-security-research-exposes-critical-gaps-in-securing-ai-agents-machines-and-non-human-identities-302735305.html","publisher":"keeper-security","context":"The article references this survey for findings on AI tools accessing critical systems and gaps in privileged-access governance for AI identities.","category":"research","primary":false}],"body":"\u003cp\u003eAI coding agents are increasing the speed at which credentials can be exposed, with GitGuardian’s 2026 State of Secrets Sprawl Report finding that AI-assisted commits leak secrets at approximately twice the rate of human-written commits. The article argues that this is not a new kind of weakness, but an increase in the scale and pace of existing credential-management problems. Agents can read project files, execute commands, call APIs, interact with Model Context Protocol servers, and modify configurations, creating additional paths for credentials to spread.\u003c/p\u003e\n\n\u003cp\u003eThe article frames secrets sprawl as a non-human identity problem because every action an agent takes on another system is authorized by a credential. Sensitive credentials may be present in local \u003ccode\u003e.env\u003c/code\u003e files, agent and MCP configurations, CI/CD variables, ticketing systems, and collaboration tools, while shared or over-permissioned agent accounts make attribution and access control harder. It recommends centralized secrets management, short-lived automatically rotated credentials, separate narrowly scoped identities for each agent, human approval for sensitive operations, inventories of agents and MCP servers, and logging and auditing of agent activity.\u003c/p\u003e\n"},{"n":40,"title":"The Water-System Attacks Were Simple. Securing OT Isn't. | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/water-system-attacks-securing-ot","time":"16:58","priority":"MAY READ","score":52,"tldr":"The article argues that recent simple attacks on water systems, including Iranian-linked Cyber Av3ngers targeting Unitronics controllers, expose how difficult it is to secure operational technology. Effective OT defense requires visibility into industrial networks, asset inventory, segmentation, and monitoring for abnormal behavior—not just patching internet-exposed devices.","briefOverview":"\u003cp\u003eThe article examines attacks targeting water systems and argues that the simplicity of those attacks should not be mistaken for simplicity in defending against them. It focuses on the challenge of securing operational technology, the systems used to run physical processes and essential services. The central message is that these environments require protection tailored to their unique operational needs.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes the importance of visibility into industrial networks and the equipment connected to them. It highlights the value of identifying unusual activity and understanding the systems that support water operations. The broader impact is that weaknesses in these environments can affect organizations responsible for delivering essential public services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article examines simple attacks targeting water systems.","It argues that securing operational technology, the systems that help run physical services, is more difficult than the attacks themselves may suggest.","The article discusses internet-connected Unitronics equipment used in water-system environments.","It highlights the need for visibility into industrial networks and for detecting unusual activity."],"insights":["Simple attacks against water-system equipment can still expose broader weaknesses in the systems used to operate essential public services.","The article emphasizes that effective protection requires ongoing visibility into industrial networks and the ability to identify unusual activity, rather than relying on a single defensive measure."],"referencedReports":[],"body":"\u003cp\u003eThe article examines attacks targeting water systems and argues that the simplicity of those attacks should not be mistaken for simplicity in defending against them. It focuses on the challenge of securing operational technology, the systems used to run physical processes and essential services. The central message is that these environments require protection tailored to their unique operational needs.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes the importance of visibility into industrial networks and the equipment connected to them. It highlights the value of identifying unusual activity and understanding the systems that support water operations. The broader impact is that weaknesses in these environments can affect organizations responsible for delivering essential public services.\u003c/p\u003e\n"},{"n":38,"title":"Healthcare’s cyberattack problem is getting worse","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/healthcares-cyberattack-problem-is-getting-worse/","time":"15:46","priority":"MAY READ","score":45,"tldr":"Healthcare organizations face increasingly frequent cyberattacks that can expose sensitive patient data and disrupt essential medical services. Health-ISAC’s Errol Weiss discusses the ShinyHunters threat and the need for stronger sector-wide defenses.","briefOverview":"\u003cp\u003eHealthcare cyberattacks are becoming more common, particularly affecting medical service providers and suppliers. The article highlights that these incidents can expose people’s personal information and can shut down or delay vital healthcare services. This creates risks both for privacy and for the delivery of medical care.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC interviewed its chief security officer, Errol Weiss, about what is at stake and how healthcare organizations can avoid becoming victims. The discussion covers what stands out about ShinyHunters’ attacks, whether the healthcare sector is adequately prepared, and how organizations can protect themselves. Weiss joined Health-ISAC in 2019 and previously worked at Bank of America, Citigroup, and the National Security Agency.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyberattacks against medical service providers and suppliers are becoming more common.","Healthcare cyberattacks can expose people’s personal information and shut down or delay vital healthcare services.","Health-ISAC interviewed Chief Security Officer Errol Weiss about healthcare cybersecurity.","The discussion addresses what stands out about ShinyHunters’ attacks, healthcare-sector preparedness, and ways organizations can protect themselves.","Errol Weiss joined Health-ISAC in 2019 and previously worked at Bank of America, Citigroup, and the National Security Agency."],"insights":["The article treats healthcare suppliers as well as medical service providers as potential targets, indicating that disruption risks extend beyond direct care providers.","The consequences highlighted are both privacy-related and operational: attacks can expose personal information while also shutting down or delaying vital services.","The discussion specifically examines ShinyHunters’ attacks alongside broader questions about healthcare readiness and organizational protection."],"referencedReports":[],"body":"\u003cp\u003eHealthcare cyberattacks are becoming more common, particularly affecting medical service providers and suppliers. The article highlights that these incidents can expose people’s personal information and can shut down or delay vital healthcare services. This creates risks both for privacy and for the delivery of medical care.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC interviewed its chief security officer, Errol Weiss, about what is at stake and how healthcare organizations can avoid becoming victims. The discussion covers what stands out about ShinyHunters’ attacks, whether the healthcare sector is adequately prepared, and how organizations can protect themselves. Weiss joined Health-ISAC in 2019 and previously worked at Bank of America, Citigroup, and the National Security Agency.\u003c/p\u003e\n"},{"n":39,"title":"Healthcare Cybersecurity is Entering the Era of Collective Defense","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/healthcare-cybersecurity-is-entering-the-era-of-collective-defense/","time":"16:54","priority":"MAY READ","score":45,"tldr":"Healthcare cybersecurity must shift from isolated organizational defenses to collective defense, using trusted, contextual information sharing and joint preparedness across hospitals, suppliers, and authorities. EU initiatives and communities such as Health-ISAC can improve sector-wide early warning and resilience.","briefOverview":"\u003cp\u003eHealthcare cybersecurity is moving from isolated organizational protection toward collective defense because hospitals increasingly depend on cloud platforms, medical technology providers, and complex digital supply chains. A weakness at one organization or common supplier can become a risk for the entire sector. The article argues that individual organizations have only a limited view of the broader threat landscape, while threat actors share infrastructure and methods across borders.\u003c/p\u003e\n\n\u003cp\u003eCombining separate observations, such as unusual authentication activity at one hospital and a phishing campaign at another, can reveal early stages of larger attacks. The EU Action Plan for the cybersecurity of hospitals includes shared capabilities such as an EU-wide early-warning service, incident-response support, and sector exercises, alongside organizational requirements such as NIS2. The article says effective sharing must include context about how incidents unfolded, failed controls, and effects on clinical operations, and that preparedness exercises should involve suppliers, national authorities, and other partners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Healthcare organizations increasingly depend on cloud platforms, medical technology providers, and digital supply chains, so a vulnerability at one organization or common supplier can affect the wider sector.","Individual organizations see only part of the threat landscape, while combining events such as unusual authentication activity and phishing campaigns can reveal early signs of broader attacks.","The EU Action Plan for the cybersecurity of hospitals includes shared measures such as an EU-wide early-warning service, enhanced incident-response support, and sector exercises.","Effective information sharing requires trusted relationships and contextual details about how incidents unfolded, which controls failed, and how clinical operations were affected.","Healthcare leaders should make collaboration a formal resilience capability and include suppliers, national authorities, and other partners in collective preparedness exercises."],"insights":["The article identifies an imbalance in which threat actors share infrastructure and techniques across borders, while defenders often remain limited by their own organizational boundaries.","Sharing only technical warning signs is insufficient; the article emphasizes that the most useful shared knowledge also explains failed controls and effects on clinical operations.","Collaboration should be treated as an operational capability, meaning healthcare organizations should be prepared to contribute lessons learned rather than only receive intelligence.","Exercises involving suppliers, authorities, and other partners can reveal ecosystem dependencies that a single healthcare organization cannot see on its own."],"referencedReports":[],"body":"\u003cp\u003eHealthcare cybersecurity is moving from isolated organizational protection toward collective defense because hospitals increasingly depend on cloud platforms, medical technology providers, and complex digital supply chains. A weakness at one organization or common supplier can become a risk for the entire sector. The article argues that individual organizations have only a limited view of the broader threat landscape, while threat actors share infrastructure and methods across borders.\u003c/p\u003e\n\n\u003cp\u003eCombining separate observations, such as unusual authentication activity at one hospital and a phishing campaign at another, can reveal early stages of larger attacks. The EU Action Plan for the cybersecurity of hospitals includes shared capabilities such as an EU-wide early-warning service, incident-response support, and sector exercises, alongside organizational requirements such as NIS2. The article says effective sharing must include context about how incidents unfolded, failed controls, and effects on clinical operations, and that preparedness exercises should involve suppliers, national authorities, and other partners.\u003c/p\u003e\n"},{"n":17,"title":"ThreatsDay: AI Search Poisoning, AI Coding Tool Leaking Repos, One-Click Code Execution and 13 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/threatsday-ai-search-poisoning-ai.html","time":"17:52","priority":"MAY READ","score":40,"tldr":"This weekly roundup shows attackers increasingly abusing trusted tools, AI services, software updates, and social-engineering lures rather than relying on sophisticated exploits. Key risks include AI search poisoning, source-code leakage by coding assistants, malicious supply-chain updates, phishing, and one-click code execution in VS Code.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup documents a range of attacks that abuse trusted routes, including AI search results, software updates, login prompts, coding tools, and ordinary links. A reported AI disinformation campaign flooded online platforms with false support contacts and login pages that appeared in responses from ChatGPT, Gemini, and Google AI Overviews. Other phishing campaigns impersonated Claude Max, OpenAI subscription invoices, and government or law-enforcement officials.\u003c/p\u003e\n\n\u003cp\u003eSoftware and developer environments were also prominent targets. Z.ai disabled ZCode functions after a default setting was found sending local code repositories to Alibaba Cloud servers in China, while a malicious Admin Menu Editor Pro update installed web shells on WordPress sites. Researchers described a Visual Studio Code Workspace Trust bypass that could let an attacker run code after a victim clicks a normal-looking link, and GitHub introduced cache-mode to limit cache-poisoning risks in GitHub Actions. The article also covers malware distribution through compromised dependencies, fake CAPTCHA checks, Android banking overlays, and social-engineering lures that require little or no exploit development.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A campaign is poisoning AI search answers with fraudulent support contacts and login pages for major companies, including airlines, banks, and travel services.","Z.ai disabled ZCode features after a default setting was found sending users' local code repositories to Alibaba Cloud servers in China without consent.","A malicious Admin Menu Editor Pro update installed a web shell on WordPress sites, and at least 230 customers installed it on 1,500 sites.","Researchers described a Visual Studio Code Workspace Trust bypass in which clicking a single normal-looking link could allow code to run with the user's access to files, SSH keys, cloud tokens, and source code.","The FBI reported nearly 61,000 complaints of government or law-enforcement impersonation scams between January 2025 and July 2026, with losses exceeding $1.6 billion."],"insights":["Several incidents show that attackers can succeed without advanced software flaws by abusing trusted-looking paths such as search answers, routine updates, ordinary links, and fake sign-in windows.","The fake Claude Max campaign made its counterfeit Google sign-in box draggable and displayed a padlock and correctly spelled address, showing how convincing a fake login prompt can appear inside a browser tab.","The Admin Menu Editor Pro incident persisted across a clean update attempt, indicating that the update server may have been compromised at a root level and that simply releasing a replacement update was insufficient.","GitHub Actions cache-mode provides a concrete least-privilege control because a cache item written in one workflow can otherwise be restored by another, potentially allowing malicious build files to run with that workflow's secrets and permissions.","Recent DarkMe incidents relied on convincing users to run a linked .pif file instead of using exploits, which Huntress described as a cheaper and more indiscriminate approach."],"referencedReports":[{"title":"Considerations for Critical Infrastructure Operators Working with Third-Party ICS Integrators","url":"https://www.cisa.gov/resources-tools/resources/considerations-critical-infrastructure-operators-working-third-party-ics-integrators","publisher":"cisa and fbi","context":"The article cites this fact sheet urging critical-infrastructure operators to apply least privilege when providing third-party industrial-control-system integrators access.","category":"advisory","primary":false},{"title":"Russia's MAX App's Capabilities Detailed","url":"https://arxiv.org/abs/2609.11814","publisher":"university of michigan, university of calgary, georgia institute of technology, and indian institute of technology delhi","context":"The article references this forensic research on surveillance capabilities in Russia's MAX super-app.","category":"research","primary":false},{"title":"EDR Evasion Using Process Parameter Poisoning","url":"https://flashpoint.io/blog/process-parameter-poisoning-edr-evasion-technique/","publisher":"flashpoint","context":"The article cites Flashpoint's proof-of-concept analysis of Process Parameter Poisoning as an endpoint-detection evasion technique.","category":"research","primary":false},{"title":"Dark Sorcery: How Hackers Manipulate AI to Scam You","url":"https://medium.com/@arielsimon/dark-sourcery-how-hackers-manipulate-ai-to-scam-you-88df434d2073","publisher":"vigilance security","context":"The article references Ariel Simon's analysis of a campaign poisoning AI-generated search answers with fraudulent support information and login pages.","category":"research","primary":false},{"title":"Exvicy, a Copycat of the ErrTraffic Malware Distribution Framework","url":"https://www.sekoia.com/blog/exvicy-a-copycat-of-the-errtraffic-malware-distribution-framework","publisher":"sekoia","context":"The article cites Sekoia's technical analysis finding that the Exvicy ClickFix framework reused ErrTraffic code and command-and-control logic.","category":"research","primary":false},{"title":"FBI Warns Scammers Impersonating Law Enforcement and Government Officials","url":"https://www.ic3.gov/PSA/2026/PSA260917","publisher":"fbi internet crime complaint center","context":"The article references the FBI warning about widespread scams impersonating U.S. and foreign government or law-enforcement officials.","category":"advisory","primary":false},{"title":"Supply Chain Targets Deep-Live-Cam","url":"https://safedep.io/deep-live-cam-supply-chain-attack/","publisher":"safedep","context":"The article cites SafeDep's disclosure of a malicious dependency added to the Deep-Live-Cam Python application.","category":"research","primary":false},{"title":"ulid-xyz Transitive Dependency Delivery Chain","url":"https://safedep.io/ulid-xyz-transitive-dependency-delivery-chain/#the-payload","publisher":"safedep","context":"The article references SafeDep's analysis of the typosquatted ulid-xyz npm package and its cross-platform remote-access trojan.","category":"research","primary":false},{"title":"DarkMe RAT Abandons Exploits","url":"https://www.huntress.com/blog/darkme-rat-abandons-exploits","publisher":"huntress","context":"The article cites Huntress's analysis of DarkMe incidents that relied on social engineering instead of exploits.","category":"research","primary":false},{"title":"Bypassing VS Code Workspace Trust with a Single Link","url":"https://remedio.io/blog/bypassing-vs-code-workspace-trust-with-a-single-link/","publisher":"remedio","context":"The article references Remedio's vulnerability analysis of a Visual Studio Code Workspace Trust bypass that could enable code execution after a single click.","category":"research","primary":false}],"body":"\u003cp\u003eThis ThreatsDay roundup documents a range of attacks that abuse trusted routes, including AI search results, software updates, login prompts, coding tools, and ordinary links. A reported AI disinformation campaign flooded online platforms with false support contacts and login pages that appeared in responses from ChatGPT, Gemini, and Google AI Overviews. Other phishing campaigns impersonated Claude Max, OpenAI subscription invoices, and government or law-enforcement officials.\u003c/p\u003e\n\n\u003cp\u003eSoftware and developer environments were also prominent targets. Z.ai disabled ZCode functions after a default setting was found sending local code repositories to Alibaba Cloud servers in China, while a malicious Admin Menu Editor Pro update installed web shells on WordPress sites. Researchers described a Visual Studio Code Workspace Trust bypass that could let an attacker run code after a victim clicks a normal-looking link, and GitHub introduced cache-mode to limit cache-poisoning risks in GitHub Actions. The article also covers malware distribution through compromised dependencies, fake CAPTCHA checks, Android banking overlays, and social-engineering lures that require little or no exploit development.\u003c/p\u003e\n"},{"n":32,"title":"Trust and the enticing consultancy offer","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/trust-and-the-enticing-consultancy-offer/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cybersecurity professionals should treat unsolicited consulting and recruiting offers with skepticism, as attackers may use flattery and payment to manipulate trusted insiders into disclosing nonpublic information or installing malware. The newsletter also highlights Talos’ CAIRN toolkit for tracking AI-integrated malware.","briefOverview":"\u003cp\u003eThe article warns that attackers may disguise social-engineering attempts as paid consulting engagements or lucrative recruiting offers. A suspicious $300 consultation offer came from a sparse social-media profile tied to an apparent consulting employer with no footprint and one employee. The described scheme uses an initial call to assess a target’s access and knowledge, then escalates to requests for written or “special” reports containing nonpublic information.\u003c/p\u003e\n\n\u003cp\u003eTargets may be pressured through praise and compensation to contact coworkers, probe internal systems, or misuse professional relationships, risking trust that is worth far more than the offered payment. The newsletter also highlights Talos’ open-source CAIRN toolkit, which tracks AI-integrated malware by identifying artifacts such as prompt templates, API keys, and jailbreak terms without initially examining the underlying binary. Talos notes that these artifacts can also appear in benign frameworks, so CAIRN results still require manual reverse engineering for a final determination.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article warns that unsolicited social-media consultancy offers and recruiting messages can be social-engineering attempts intended to exploit a professional’s trusted access or nonpublic knowledge.","A suspicious $300 consultation offer described in the article came from a sparse profile claiming to represent a consulting employer with no apparent footprint and only one employee.","The reported consultancy scam begins with a screening call and may progress to requests for reports that require the target to contact coworkers, probe internal systems, or abuse professional relationships.","Talos released CAIRN, an open-source toolkit that identifies and classifies AI-integrated malware using artifacts such as prompt templates, API keys, and jailbreak terms.","The newsletter reports that AI-integrated malware is evolving toward autonomous operation and that analysts must still manually reverse engineer samples to confirm CAIRN findings."],"insights":["A seemingly ordinary paid consultation can function as a screening step to identify people with access or knowledge an attacker wants before making more sensitive requests.","The article notes that completing a requested “special report” may require a target to misuse not only internal access but also professional relationships and friendships, making the eventual loss of trust more costly than the payment offered.","CAIRN is designed to classify AI-integrated malware from traces such as prompt templates, API keys, and jailbreak terms without first analyzing the malware binary itself.","One malware sample discussed by Talos, CLOSEDQUORUM, reportedly lets a panel of commercial AI models choose its next command-and-control action after deployment.","CAIRN can accelerate investigation, but benign AI frameworks can create false signals, so analysts still need manual review to reach a final conclusion."],"referencedReports":[],"body":"\u003cp\u003eThe article warns that attackers may disguise social-engineering attempts as paid consulting engagements or lucrative recruiting offers. A suspicious $300 consultation offer came from a sparse social-media profile tied to an apparent consulting employer with no footprint and one employee. The described scheme uses an initial call to assess a target’s access and knowledge, then escalates to requests for written or “special” reports containing nonpublic information.\u003c/p\u003e\n\n\u003cp\u003eTargets may be pressured through praise and compensation to contact coworkers, probe internal systems, or misuse professional relationships, risking trust that is worth far more than the offered payment. The newsletter also highlights Talos’ open-source CAIRN toolkit, which tracks AI-integrated malware by identifying artifacts such as prompt templates, API keys, and jailbreak terms without initially examining the underlying binary. Talos notes that these artifacts can also appear in benign frameworks, so CAIRN results still require manual reverse engineering for a final determination.\u003c/p\u003e\n"},{"n":37,"title":"JNUC 2026 Day 1 recap: powering up in Kansas City","source":"jamf.com","sourceColorIdx":3,"link":"https://www.jamf.com/blog/jnuc-2026-day-1-recap/","time":"15:19","priority":"MAY READ","score":40,"tldr":"Jamf’s JNUC 2026 Day 1 emphasized Declarative Device Management as the foundation of modern Apple management, alongside expanded platform APIs, blueprints, AI governance and infrastructure-as-code workflows. Sessions also highlighted CrowdStrike integration, Android Enterprise management and large-scale automation successes.","briefOverview":"\u003cp\u003eJamf Nation opened JNUC 2026 in Kansas City with a keynote from CEO Beth Tschida and a full schedule of breakout sessions. The keynote introduced the Platform API Gateway, Device Health, Vitals, Routines and expanded AI governance. Jamf’s Platform State of the Union also covered blueprints, the Platform API, the Jamf Terraform Provider, App Insights, Jamf Device Checker and Jamf Tap.\u003c/p\u003e\n\n\u003cp\u003eDeclarative Device Management (DDM) was the dominant Day 1 theme, appearing directly in three of the four best-attended breakout sessions and influencing discussions of profiles, software updates and self service. Eli Lilly said it reduced OS compliance time from 30 days to five across more than 60,000 iPhones and iPads and more than 7,300 Macs through DDM-powered automation. Sessions also emphasized GitOps, Terraform and modern APIs, while CrowdStrike Falcon integration and Android Enterprise management highlighted security and cross-platform management needs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jamf opened JNUC 2026 in Kansas City with CEO Beth Tschida’s first keynote, which included announcements on the Platform API Gateway, Device Health, Vitals, Routines and expanded AI governance.","Declarative Device Management was a central Day 1 theme, with three of the four best-attended breakout sessions directly covering it.","Eli Lilly reported reducing OS compliance time from 30 days to five across more than 60,000 iPhones and iPads and more than 7,300 Macs using DDM-powered automation.","Sessions highlighted infrastructure-as-code, GitOps and Terraform, including Eli Lilly’s report of a 90% reduction in deployment time across five Jamf Pro instances.","CrowdStrike Falcon integration and Android Enterprise management were among the Day 1 topics, reflecting interest in security and cross-platform device management."],"insights":["Declarative Device Management has moved from an emerging capability to a practical operating model, demonstrated by its presence in three of the four most-attended Day 1 sessions and by Eli Lilly’s reported reduction in OS compliance time from 30 days to five.","Jamf administrators are increasingly adopting engineering practices: Lloyds Banking Group trained an eight-person Mac team from no Git experience to owning a GitOps workflow, while Eli Lilly used Terraform across five Jamf Pro instances to reduce deployment time by 90% and reclaim more than 350 hours annually.","Jamf’s platform direction centers on blueprints as a shared layer connecting its API, user interface and AI capabilities, supporting the company’s shift from a platform users configure to one they build on.","The article presents a clear modernization path away from Jamf’s Classic API toward the Platform API, including a session aimed at showing that the transition is accessible without previous coding experience.","Braindate search activity shows that attendees’ immediate interests extend beyond device configuration to AI, partner relationships, Intune, user groups and platform single sign-on."],"referencedReports":[],"body":"\u003cp\u003eJamf Nation opened JNUC 2026 in Kansas City with a keynote from CEO Beth Tschida and a full schedule of breakout sessions. The keynote introduced the Platform API Gateway, Device Health, Vitals, Routines and expanded AI governance. Jamf’s Platform State of the Union also covered blueprints, the Platform API, the Jamf Terraform Provider, App Insights, Jamf Device Checker and Jamf Tap.\u003c/p\u003e\n\n\u003cp\u003eDeclarative Device Management (DDM) was the dominant Day 1 theme, appearing directly in three of the four best-attended breakout sessions and influencing discussions of profiles, software updates and self service. Eli Lilly said it reduced OS compliance time from 30 days to five across more than 60,000 iPhones and iPads and more than 7,300 Macs through DDM-powered automation. Sessions also emphasized GitOps, Terraform and modern APIs, while CrowdStrike Falcon integration and Android Enterprise management highlighted security and cross-platform management needs.\u003c/p\u003e\n"},{"n":27,"title":"Top CodeQL alternatives in 2026","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/top-codeql-alternatives","time":"19:12","priority":"MAY READ","score":35,"tldr":"The article argues that teams moving away from GitHub CodeQL due to slow database builds, query complexity, and limited coverage should consider alternatives based on their needs, such as Semgrep for custom rules, Veracode for compliance, or SonarQube for code quality. It positions Aikido Security as the strongest overall replacement by combining low-noise SAST, automated fixes, cross-file analysis, and broader security coverage in one platform.","briefOverview":"\u003cp\u003eThe article compares six alternatives to GitHub CodeQL: Aikido Security, Semgrep, Snyk Code, SonarQube, Checkmarx, and Veracode. It says teams seek alternatives because CodeQL builds a relational database before analysis, which can add substantial time and may fail to process code cleanly. The article cites one team that measured database creation at roughly eight times its application build time and a Doyensec benchmark in which about 85% of files produced errors during database creation.\u003c/p\u003e\n\n\u003cp\u003eThe comparison focuses on cross-file analysis, alert noise, developer fixes in pull requests, coverage beyond source-code scanning, setup effort, and pricing as private repositories grow. Semgrep is presented as a fast, customizable option with YAML rules, while Veracode is positioned for compiled-code analysis and compliance-focused reporting, and SonarQube for code-quality gates. The article promotes Aikido Security as the broadest replacement, claiming it combines static code analysis with dependency, secret, infrastructure, container, cloud, runtime, and pentesting capabilities, along with contextual prioritization and automated code-fix suggestions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CodeQL builds a relational database from source code to support vulnerability queries, but its database creation can be slow or fail to analyze some files cleanly on large codebases.","The article compares Aikido Security, Semgrep, Snyk Code, SonarQube, Checkmarx, and Veracode as alternatives to CodeQL based on dataflow depth, alert noise, coverage, workflow, and cost.","Semgrep offers fast source-based scanning and customizable YAML rules, but the article says its deeper cross-file analysis is limited or available in its paid Pro engine.","Veracode performs static analysis on compiled builds and emphasizes vetted findings and compliance reporting, but its build-upload workflow can slow feedback for developers.","The article positions Aikido Security as a broad CodeQL alternative that combines static code analysis with dependency, secret, infrastructure, container, cloud, and pentesting coverage."],"insights":["One team reported that CodeQL database creation took roughly eight times as long as its application build, illustrating that analysis setup time can become a major development bottleneck.","An independent benchmark cited in the article found that about 85% of files generated errors during CodeQL database creation, meaning code that fails to be processed may receive no analysis at all.","Semgrep’s open-source offering narrowed after its 2024 licensing and feature changes, while the Opengrep fork retained Semgrep-compatible rules and restored free cross-function taint analysis.","The article distinguishes between tools optimized for fast developer feedback and tools optimized for compliance: Veracode emphasizes vetted findings and audit reporting but uses a slower build-upload workflow.","A tool choice can depend on needs beyond source-code scanning, since CodeQL does not cover dependencies, secrets, infrastructure-as-code, or runtime validation without additional tools."],"referencedReports":[{"title":"Semgrep vs. CodeQL","url":"https://blog.doyensec.com/2022/10/06/semgrep-codeql.html","publisher":"doyensec","context":"The article cites this independent OWASP benchmark for findings that CodeQL database creation produced errors for about 85% of files and for Semgrep's comparative performance.","category":"research","primary":false}],"body":"\u003cp\u003eThe article compares six alternatives to GitHub CodeQL: Aikido Security, Semgrep, Snyk Code, SonarQube, Checkmarx, and Veracode. It says teams seek alternatives because CodeQL builds a relational database before analysis, which can add substantial time and may fail to process code cleanly. The article cites one team that measured database creation at roughly eight times its application build time and a Doyensec benchmark in which about 85% of files produced errors during database creation.\u003c/p\u003e\n\n\u003cp\u003eThe comparison focuses on cross-file analysis, alert noise, developer fixes in pull requests, coverage beyond source-code scanning, setup effort, and pricing as private repositories grow. Semgrep is presented as a fast, customizable option with YAML rules, while Veracode is positioned for compiled-code analysis and compliance-focused reporting, and SonarQube for code-quality gates. The article promotes Aikido Security as the broadest replacement, claiming it combines static code analysis with dependency, secret, infrastructure, container, cloud, runtime, and pentesting capabilities, along with contextual prioritization and automated code-fix suggestions.\u003c/p\u003e\n"}]</script>
