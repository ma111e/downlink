<script type="application/json" id="dl-articles">[{"n":7,"title":"Emerging Threat: (CVE-2026-89103) SAP Gateway Authentication Bypass via Default Access Control List","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-89103-sap-gateway-authentication-bypass-via-default-access-control-list/","time":"16:11","priority":"MUST READ","score":93,"tldr":"SAP Gateway has a critical pre-authentication authentication-bypass flaw, CVE-2026-89103, that can let network-accessible attackers be treated as trusted internal application servers. Organizations should urgently apply SAP Security Note 3798345 and restrict external access to gateway ports TCP/33NN and TCP/48NN.","briefOverview":"\u003cp\u003eCVE-2026-89103 is a critical broken access-control flaw in SAP Gateway with a CVSS v3.1 score of 10.0. The default gateway access control list can cause an external attacker to be classified as an internal application server before authentication. This can enable unauthorized actions in SAP environments and affect confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include SAP NetWeaver application servers and other SAP systems using affected kernel releases when their gateway services are reachable, commonly on TCP/33NN and TCP/48NN. SAP released a kernel-update correction in Security Note 3798345 during its November 2026 Security Patch Day, though older kernels may require an additional gw/acl_mode_proxy configuration setting. Until patching is confirmed, the article recommends restricting internet access to the gateway ports, using explicit secinfo and reginfo rules, and monitoring gateway logs and host processes for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-89103 is a critical SAP Gateway access-control flaw with a CVSS v3.1 score of 10.0 that can allow a network-accessible attacker to be treated as an internal application server before authentication.","Affected systems include SAP NetWeaver application servers and other SAP systems using affected kernel releases when their gateway ports are reachable, typically TCP/33NN and TCP/48NN.","SAP released a kernel-update correction in Security Note 3798345 during its November 2026 Security Patch Day, and published analysis indicates older kernels may require the gw/acl_mode_proxy setting after patching.","Until patching is confirmed, the article recommends blocking internet access to gateway ports, replacing default gateway rules with explicit secinfo and reginfo entries, and monitoring for unexpected external program registrations.","CyCognito observed potentially exposed SAP NetWeaver assets across multiple sectors, led by Information Technology and Communication Services."],"insights":["Many identified assets were classified as potentially exposed based on SAP NetWeaver service fingerprints rather than confirmed software versions or configurations, so their exposure status still requires verification.","Public sources disagree on whether the vulnerable condition is the shipped default or depends on missing or overly permissive gateway rules, making direct review of SAP Security Note 3798345 important.","Internet-reachable gateway ports may persist because they support legitimate system-to-system traffic, particularly in service-provider, partner-facing, and legacy SAP environments.","The observed exposure is concentrated in Information Technology and Communication Services, where providers and large centralized SAP estates can operate numerous externally reachable application servers."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-89103 is a critical broken access-control flaw in SAP Gateway with a CVSS v3.1 score of 10.0. The default gateway access control list can cause an external attacker to be classified as an internal application server before authentication. This can enable unauthorized actions in SAP environments and affect confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include SAP NetWeaver application servers and other SAP systems using affected kernel releases when their gateway services are reachable, commonly on TCP/33NN and TCP/48NN. SAP released a kernel-update correction in Security Note 3798345 during its November 2026 Security Patch Day, though older kernels may require an additional gw/acl_mode_proxy configuration setting. Until patching is confirmed, the article recommends restricting internet access to the gateway ports, using explicit secinfo and reginfo rules, and monitoring gateway logs and host processes for suspicious activity.\u003c/p\u003e\n"},{"n":3,"title":"Attackers Exploit AhsayCBS Flaws to Deploy Sandbox-Evading Python Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-exploit-ahsaycbs-flaws-to.html","time":"16:00","priority":"SHOULD READ","score":88,"tldr":"Attackers exploited two now-patched AhsayCBS zero-day flaws to compromise backup servers, deploy JSP web shells, XMRig miners, tunneling tools, and a host-locked Python backdoor designed to evade sandbox analysis. The intrusion also targeted backup infrastructure credentials, including a Veeam database query intended to decrypt stored credentials.","briefOverview":"\u003cp\u003eHuntress observed attackers in early October 2026 exploiting two then-unpatched AhsayCBS flaws, CVE-2026-105133 and CVE-2026-105134, to bypass authentication and run commands on affected systems. Ahsay Backup released patches for the vulnerabilities in mid-October 2026. The activity initially included rapid deployment of web shells and XMRig cryptocurrency miners, but Huntress said this intrusion showed a more deliberate and persistent operation. The affected servers appear to have been chosen because they held or managed backups.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed five types of JSP web shells, including one that hid encrypted payloads in PNG image pixel data and ran them from memory. They also used two XMRig miners, tunneling tools such as GOST and Chisel, legitimate remote-access software, and Microsoft Defender exclusions. A Python backdoor called main.py was designed to run only on its intended host by checking a hash derived from the system\u0026rsquo;s MachineGuid before loading an in-memory DLL that contacted a command-and-control server. On a related Veeam server, Huntress also saw a PowerShell command consistent with querying the VeeamBackup database for stored credentials and decrypting them using DPAPI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress observed attackers exploiting CVE-2026-105133 and CVE-2026-105134 in AhsayCBS to bypass authentication and execute arbitrary commands before Ahsay Backup released patches in mid-October 2026.","The attackers deployed five families of JSP web shells, including AhsayCBS.jsp, which hides encrypted payloads in PNG pixel data and executes them from memory.","The intrusion deployed two XMRig cryptocurrency miners, including one masquerading as Microsoft Edge and another configured to restart every minute through a SYSTEM scheduled task.","A Python backdoor named main.py checks a hash derived from the host MachineGuid before running an in-memory DLL that contacts creepexplosiondarknight[.]com, helping prevent execution in sandboxes or on analysts' machines.","On a related Veeam server, Huntress observed a PowerShell command consistent with NetExec's Veeam credential-theft module querying the VeeamBackup PostgreSQL database and decrypting stored credentials with DPAPI."],"insights":["The intrusion went beyond opportunistic cryptomining: the operator placed multiple web shells, used two miners with separate wallets and pools, and staged tools for tunneling and remote access.","The Python implant was tied to a specific host by requiring a marker file named from that system's MachineGuid hash, a design intended to keep it from running in sandboxes or on an analyst's computer.","AhsayCBS.jsp was made to resemble an internal image-preview service and concealed encrypted payloads in PNG pixel data, showing an effort to make the web shell less conspicuous.","The activity included both an AhsayCBS foothold and a Veeam credential query in the same environment, while the article notes that backup software can contain credentials for hypervisors, repositories, and domain accounts.","The attackers configured Microsoft Defender exclusions and deployed several access options, including GOST, Chisel, AnyDesk, Atera, and Splashtop, rather than relying on a single persistence method."],"referencedReports":[{"title":"AhsayCBS Webshells","url":"https://www.huntress.com/blog/ahsaycbs-webshells","publisher":"huntress","context":"The article cites Huntress research as the source that observed the AhsayCBS exploitation and analyzed the web shells, miners, tunneling tools, and Python implant.","category":"research","primary":true}],"body":"\u003cp\u003eHuntress observed attackers in early October 2026 exploiting two then-unpatched AhsayCBS flaws, CVE-2026-105133 and CVE-2026-105134, to bypass authentication and run commands on affected systems. Ahsay Backup released patches for the vulnerabilities in mid-October 2026. The activity initially included rapid deployment of web shells and XMRig cryptocurrency miners, but Huntress said this intrusion showed a more deliberate and persistent operation. The affected servers appear to have been chosen because they held or managed backups.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed five types of JSP web shells, including one that hid encrypted payloads in PNG image pixel data and ran them from memory. They also used two XMRig miners, tunneling tools such as GOST and Chisel, legitimate remote-access software, and Microsoft Defender exclusions. A Python backdoor called main.py was designed to run only on its intended host by checking a hash derived from the system\u0026rsquo;s MachineGuid before loading an in-memory DLL that contacted a command-and-control server. On a related Veeam server, Huntress also saw a PowerShell command consistent with querying the VeeamBackup database for stored credentials and decrypting them using DPAPI.\u003c/p\u003e\n"},{"n":4,"title":"Blind Eagle Uses Fake Court Notices to Deliver Remote Access Trojan Across Latin America","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/blind-eagle-uses-fake-court-notices-to.html","time":"15:58","priority":"SHOULD READ","score":84,"tldr":"Blind Eagle is running a large phishing campaign across Latin America using fake court and government notices to deliver an AsyncRAT/DCRat-derived remote-access trojan. The chain uses weaponized SVG files, HTML smuggling, AMSI/ETW bypasses, and startup persistence, with Colombia a key target.","briefOverview":"\u003cp\u003eBlind Eagle, also known as APT-C-36, has launched a phishing campaign targeting organizations across Latin America with fake judicial and administrative notices in Spanish and Portuguese. The emails target people handling cases, contracts, and institutional service requests and deliver a remote-access trojan related to AsyncRAT and DCRat. Zenox observed nearly 3,300 malicious emails in a targeted wave between late October and early November 2026, though it could not confirm successful real-world compromises.\u003c/p\u003e\n\n\u003cp\u003eOne identified lure used a weaponized SVG file that impersonated Colombia’s Fiscalía General de la Nación and created a ZIP file in the recipient’s browser to evade email security controls. The ZIP contained a JavaScript dropper that gathered system and network information before launching a script that bypassed Windows security-monitoring features, displayed a fake criminal citation, removed evidence, and established automatic startup execution. PowerShell then decoded and ran the final remote-access trojan in memory, putting potentially sensitive legal, financial, and institutional information at risk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blind Eagle, also known as APT-C-36, used fake judicial and administrative notices in Spanish and Portuguese to target organizations in Latin America with a remote-access trojan.","The phishing chain included a weaponized SVG file impersonating Colombia’s Fiscalía General de la Nación, which created a ZIP archive locally in the recipient’s browser.","A JavaScript dropper collected system information, then launched a script that bypassed Windows security monitoring features and displayed a fake criminal-citation page.","The final payload was an AsyncRAT fork with DCRat lineage that was decoded and launched in memory using PowerShell.","Zenox observed nearly 3,300 malicious emails in a targeted phishing wave between late October and early November 2026, although it could not confirm successful compromises."],"insights":["The malicious SVG used HTML smuggling to build its ZIP payload inside the browser with ZipCrypto, a method intended to evade email security controls rather than simply delivering a conventional attachment.","The dropper checked for Portuguese- and Spanish-localized directories and collected network and system details, indicating that the payload was designed with the regional target environment in mind.","The malware both displayed a fake criminal-citation page and removed its original XHTML file and Mark of the Web metadata, combining user distraction with steps that reduce evidence and Windows warnings.","Persistence was established through the Windows Startup folder, allowing the malicious program to run automatically when the system starts."],"referencedReports":[{"title":"Last Heist: New APT-C-36 Infection Wave in LATAM","url":"https://zenox.ai/en/last-heist-new-apt-c-36-infection-wave-in-latam/","publisher":"zenox","context":"The article is based on Zenox's report detailing Blind Eagle's judicial- and administrative-themed phishing campaign in Latin America.","category":"research","primary":true}],"body":"\u003cp\u003eBlind Eagle, also known as APT-C-36, has launched a phishing campaign targeting organizations across Latin America with fake judicial and administrative notices in Spanish and Portuguese. The emails target people handling cases, contracts, and institutional service requests and deliver a remote-access trojan related to AsyncRAT and DCRat. Zenox observed nearly 3,300 malicious emails in a targeted wave between late October and early November 2026, though it could not confirm successful real-world compromises.\u003c/p\u003e\n\n\u003cp\u003eOne identified lure used a weaponized SVG file that impersonated Colombia’s Fiscalía General de la Nación and created a ZIP file in the recipient’s browser to evade email security controls. The ZIP contained a JavaScript dropper that gathered system and network information before launching a script that bypassed Windows security-monitoring features, displayed a fake criminal citation, removed evidence, and established automatic startup execution. PowerShell then decoded and ran the final remote-access trojan in memory, putting potentially sensitive legal, financial, and institutional information at risk.\u003c/p\u003e\n"},{"n":5,"title":"Fireworks AI Breach Widens to Expose Customer Billing Data and Incomplete Model Weights","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/fireworks-ai-breach-widens-to-expose.html","time":"15:33","priority":"SHOULD READ","score":84,"tldr":"Fireworks AI expanded its breach disclosure after attackers accessed customer billing data, resource metadata, secrets, datasets, and incomplete model weights through compromised internal and third-party cloud access. The incident also affected fewer than 1% of Notion workspaces, potentially exposing Notion AI Insights chat transcripts.","briefOverview":"\u003cp\u003eFireworks AI said its investigation of a security incident found broader impact than it initially reported. Attackers accessed account and billing information, secrets, datasets, and incomplete model weights for a limited set of customer accounts. The company initially identified unauthorized use of internal credentials that exposed environment variables, including stored API keys and tokens, in evaluation jobs.\u003c/p\u003e\n\n\u003cp\u003eFireworks said the attackers later reached its development environment through an unnamed third-party cloud provider hosting its research and development machines, then ran an unauthorized workload that caused additional customer-data impact. Exposed billing data may include billing and shipping addresses, invoice and payment history, account balances, and credit usage, although Fireworks said it does not store payment card numbers. Notion said the incident affected fewer than 1% of its workspaces and may have included Notion AI Insights chat transcripts; it disabled Insights and stopped serving open-weight models through Fireworks while investigating.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks AI said its investigation found that attackers accessed account and billing information, secrets, datasets, and incomplete model weights for a limited set of customer accounts.","The company said attackers reached its development environment through an unnamed third-party cloud provider hosting Fireworks R\u0026D machines and then ran an unauthorized workload.","The exposed billing information may include billing and shipping addresses, invoice and payment history, account balances, and credit usage, while Fireworks AI said it does not store payment card numbers.","Fireworks AI linked the activity to a financially motivated cybercriminal group seeking to sell stolen access to large language models through illicit routing gateways.","Notion said the incident affected fewer than 1% of its workspaces and may have included Notion AI Insights chat transcripts, prompting it to disable the Insights feature."],"insights":["The incident’s assessed impact expanded from exposed environment variables in evaluation jobs to billing records, datasets, and incomplete model weights after attackers reached Fireworks development machines through a third-party cloud provider.","Notion said most affected Insights chat transcripts could not be tied to a person or workspace and did not include tool-call results, but it still advised affected customers to rotate any passwords, API keys, or other credentials pasted during the exposure window.","Fireworks characterized the suspected criminals’ goal as reselling unauthorized access to large language models, meaning victims can face both data exposure and charges for AI usage they did not authorize.","Notion disabled its Insights feature and stopped serving open-weight models through Fireworks while it investigates, showing that the incident affected service availability and vendor use in addition to data exposure."],"referencedReports":[{"title":"October 2026 Security Incident","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident","publisher":"fireworks-ai","context":"Fireworks AI’s initial security bulletin described unauthorized access to environment variables in evaluation jobs for a limited number of customer accounts.","category":"advisory","primary":true},{"title":"October 2026 Security Incident Update","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident-update","publisher":"fireworks-ai","context":"Fireworks AI’s updated bulletin reported that attackers reached development machines through a third-party cloud provider and caused additional customer-data impact.","category":"advisory","primary":true},{"title":"Security Incident Involving a Third-Party AI Vendor","url":"https://www.notion.com/en-us/security/advisories/security-incident-involving-a-third-party-ai-vendor","publisher":"notion","context":"Notion’s advisory states that the Fireworks AI incident affected fewer than 1% of Notion workspaces and may have included certain Notion AI Insights chat transcripts.","category":"advisory","primary":false}],"body":"\u003cp\u003eFireworks AI said its investigation of a security incident found broader impact than it initially reported. Attackers accessed account and billing information, secrets, datasets, and incomplete model weights for a limited set of customer accounts. The company initially identified unauthorized use of internal credentials that exposed environment variables, including stored API keys and tokens, in evaluation jobs.\u003c/p\u003e\n\n\u003cp\u003eFireworks said the attackers later reached its development environment through an unnamed third-party cloud provider hosting its research and development machines, then ran an unauthorized workload that caused additional customer-data impact. Exposed billing data may include billing and shipping addresses, invoice and payment history, account balances, and credit usage, although Fireworks said it does not store payment card numbers. Notion said the incident affected fewer than 1% of its workspaces and may have included Notion AI Insights chat transcripts; it disabled Insights and stopped serving open-weight models through Fireworks while investigating.\u003c/p\u003e\n"},{"n":2,"title":"AI company Fireworks says hackers stole data, billing info during October breaches","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ai-company-fireworks-says-hackers-stole-data-in-oct-attacks","time":"16:08","priority":"SHOULD READ","score":82,"tldr":"AI infrastructure provider Fireworks says October breaches exposed some customer account, billing, invoice, payment, dataset, and AI-related data after attackers stole credentials and accessed development systems through a compromised third-party cloud provider. The incidents reflect a growing “LLMJacking” trend in which criminals hijack cloud AI access to run unauthorized workloads and generate major fraudulent charges.","briefOverview":"\u003cp\u003eFireworks, an AI infrastructure company, said cybercriminals stole account and billing information and confidential access credentials in a breach discovered on October 6. The company hired Palo Alto Networks Unit 42 to investigate and said a well-known financially motivated group was responsible. Fireworks said a limited number of customer accounts were affected and that those customers were notified.\u003c/p\u003e\n\n\u003cp\u003eFireworks also reported that attackers compromised a third-party cloud provider hosting its research-and-development machines on October 23, then used that access on October 24 to reach Fireworks development systems and run an unauthorized workload. The additional exposure included internal data, billing information, invoices, payment history, datasets, and other AI-related data. Notion, which used Fireworks for AI classification and model inference, said it disconnected from Fireworks, deleted data in its systems, disabled its Insights feature, and stopped using Fireworks to serve open-weight models while it investigates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks said cybercriminals stole account and billing information, along with access secrets, in a breach it discovered on October 6.","Fireworks said a separate October 23 compromise of a third-party cloud provider enabled unauthorized access to its development machines and exposed internal data, billing records, datasets, and other AI-related data.","Fireworks said the incidents affected a limited number of customer accounts, and it notified the affected customers while revoking compromised credentials and working with Palo Alto Networks Unit 42.","Notion said it disconnected from Fireworks, deleted data held in Fireworks systems, disabled its Insights feature, and stopped serving open-weight models through Fireworks while it investigates potential customer-data exposure.","Google Threat Intelligence Group and Mandiant said LLMJacking incidents can generate more than $100,000 in fraudulent cloud charges in a day and reach $1 million cumulatively before access is revoked."],"insights":["The Fireworks incidents show that a compromise at a third-party cloud provider can be used to reach a customer’s development machines, extending the impact beyond the provider that was initially breached.","LLMJacking can create unusually rapid financial harm: Google and Mandiant observed individual cases with more than $100,000 in fraudulent cloud use in one day.","The reported criminal activity appears specialized, with some groups concentrating on gaining initial access and others monetizing or reselling stolen access to AI services.","Notion’s response shows that customers of an affected AI provider may need to disable dependent features, disconnect services, and delete provider-held data even when they were not the originally breached company."],"referencedReports":[{"title":"October 2026 Security Incident","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident","publisher":"fireworks","context":"Fireworks’ security bulletin describes the breach it discovered on October 6.","category":"advisory","primary":true},{"title":"Security Incident Involving a Third-Party AI Vendor","url":"https://www.notion.com/en-gb/security/advisories/security-incident-involving-a-third-party-ai-vendor","publisher":"notion","context":"Notion’s advisory describes the potential effect of the Fireworks incidents on its customers and its response.","category":"advisory","primary":false},{"title":"LLMJacking: Monetizing Compromised Cloud Models","url":"https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models","publisher":"google-threat-intelligence-group-and-mandiant","context":"Google Threat Intelligence Group and Mandiant’s technical analysis provides broader findings on criminals hijacking enterprise access to large language models.","category":"research","primary":false}],"body":"\u003cp\u003eFireworks, an AI infrastructure company, said cybercriminals stole account and billing information and confidential access credentials in a breach discovered on October 6. The company hired Palo Alto Networks Unit 42 to investigate and said a well-known financially motivated group was responsible. Fireworks said a limited number of customer accounts were affected and that those customers were notified.\u003c/p\u003e\n\n\u003cp\u003eFireworks also reported that attackers compromised a third-party cloud provider hosting its research-and-development machines on October 23, then used that access on October 24 to reach Fireworks development systems and run an unauthorized workload. The additional exposure included internal data, billing information, invoices, payment history, datasets, and other AI-related data. Notion, which used Fireworks for AI classification and model inference, said it disconnected from Fireworks, deleted data in its systems, disabled its Insights feature, and stopped using Fireworks to serve open-weight models while it investigates.\u003c/p\u003e\n"},{"n":1,"title":"Cybercriminals are increasingly infecting regular people with spyware","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/spyware-cyber-crime-iverify","time":"15:45","priority":"MAY READ","score":60,"tldr":"iVerify reports that criminal spyware infections on consumer iPhones are rising, with leaked Coruna and DarkSword exploit kits enabling large-scale web-based compromises for credential and cryptocurrency theft. The shift means sophisticated mobile surveillance capabilities once largely limited to nation-state operations are increasingly threatening ordinary users and employees.","briefOverview":"\u003cp\u003eiVerify reported that spyware is increasingly affecting ordinary consumers and employees, with 1.07 infections per 1,000 consumer scans and 0.7 per 1,000 enterprise scans. The firm scanned hundreds of thousands of consumer devices and said a typical Fortune 500 company sees about 65 infections per year. It attributed enterprises’ lower rate to enforced patching, on-device detection, and network security controls.\u003c/p\u003e\n\n\u003cp\u003eAbout 75% of detections involved criminals using Coruna or DarkSword iOS exploit kits, while the remaining 25% involved mercenary spyware such as Pegasus. DarkSword can infect people who visit a compromised website without clicking a link, and Coruna uses web-based attacks involving WebKit and kernel flaws; both can expose messages, photos, emails, microphones, and cameras. iVerify said affected device owners did not receive Apple threat notifications, and that the tools illustrate how phone-compromise capabilities once associated with restricted intelligence operations are reaching broader criminal use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["iVerify reported 1.07 spyware infections per 1,000 consumer device scans, compared with 0.7 per 1,000 enterprise scans.","About 75% of iVerify’s detections involved criminal actors using the Coruna or DarkSword iOS exploit kits, while 25% involved mercenary spyware such as Pegasus.","DarkSword can infect a device through a compromised website without the visitor clicking a link, while Coruna uses web-based attacks involving WebKit and kernel flaws.","The report said infected DarkSword and Coruna device owners did not receive Apple threat notifications, despite the tools’ ability to access messages, photos, emails, microphones, and cameras.","iVerify said the findings show mobile spyware has expanded from a tool primarily associated with nation-state targeting to a broad cybercrime risk affecting ordinary users and employees."],"insights":["Enterprise devices had a lower detected infection rate than consumer devices, which iVerify attributed to enforced patching, on-device detection, and network security controls.","Most infected enterprise users were rank-and-file employees rather than senior executives, challenging a threat model focused mainly on VIPs.","DarkSword and Coruna infections did not trigger Apple threat notifications, even though the report says the tools can provide phone access comparable to advanced commercial spyware.","The reported consumer infection rate remained significant even after iVerify’s free-check user base quadrupled, expanding scans beyond people who already suspected they were targeted."],"referencedReports":[{"title":"Advanced Mobile Threat Report 2026","url":"https://www.iverify.com/advanced-mobile-threat-report-2026","publisher":"iverify","context":"The article is based on iVerify's new report on large-scale consumer and enterprise mobile spyware detections.","category":"research","primary":true}],"body":"\u003cp\u003eiVerify reported that spyware is increasingly affecting ordinary consumers and employees, with 1.07 infections per 1,000 consumer scans and 0.7 per 1,000 enterprise scans. The firm scanned hundreds of thousands of consumer devices and said a typical Fortune 500 company sees about 65 infections per year. It attributed enterprises’ lower rate to enforced patching, on-device detection, and network security controls.\u003c/p\u003e\n\n\u003cp\u003eAbout 75% of detections involved criminals using Coruna or DarkSword iOS exploit kits, while the remaining 25% involved mercenary spyware such as Pegasus. DarkSword can infect people who visit a compromised website without clicking a link, and Coruna uses web-based attacks involving WebKit and kernel flaws; both can expose messages, photos, emails, microphones, and cameras. iVerify said affected device owners did not receive Apple threat notifications, and that the tools illustrate how phone-compromise capabilities once associated with restricted intelligence operations are reaching broader criminal use.\u003c/p\u003e\n"},{"n":6,"title":"Sage: AI for Assumed-Breach Operations, Built Into Mythic","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/11/10/sage-ai-for-assumed-breach-operations-built-into-mythic/","time":"17:00","priority":"MAY READ","score":58,"tldr":"SpecterOps has released Sage, an open-source AI assistant embedded in Mythic v4 that helps operators plan and execute assumed-breach operations across Mythic agents while requiring approval for each action in supervised mode. Sage uses BloodHound and a proof-backed engagement ledger to preserve operational context, with autonomous operation restricted to research labs.","briefOverview":"\u003cp\u003eSpecterOps has released Sage, an open-source AI assistant that runs as a native chat container inside Mythic v4 for assumed-breach operations. Operators can describe an objective, and Sage identifies suitable Mythic agents, callbacks, commands, and arguments while retaining operator control through approval cards. Sage is intended to reduce the burden of tracking command syntax, tool availability, and operational information across long-running assessments.\u003c/p\u003e\n\n\u003cp\u003eSage provides read-only conversation mode, supervised mode requiring approval for each guarded action, and an experimental autonomous mode intended only for lab use. It maintains operational context through BloodHound attack-path data and an Engagement State Ledger that records gains only when they are supported by evidence from Mythic tasks, files, credentials, callbacks, or BloodHound data. Sage can query installed Mythic agent schemas, validate proposed command arguments, and use programmed capabilities that generate and verify concrete actions; however, it remains beta software, with end-to-end validation primarily conducted using Mythic v4, LiteLLM, and the Apollo payload.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps released Sage as an open-source AI assistant that runs inside Mythic v4 and helps operators translate objectives into proposed actions across available Mythic agents.","Sage offers conversation, supervised, and autonomous modes; supervised mode requires approval for every guarded action, while autonomous mode is described as an experimental research capability for lab environments.","Sage stores operational context in BloodHound and an Engagement State Ledger, where claimed gains are recorded as achieved only when supported by Mythic, credential, callback, task, file, or BloodHound evidence.","Sage can learn command schemas from installed Mythic payload types, validate proposed arguments before tasking, and use built-in capabilities that convert selected actions into concrete Mythic commands.","The project is beta software validated primarily with Mythic v4, LiteLLM, and the Apollo payload, with other providers and Mythic agents supported but not yet fully validated."],"insights":["Sage separates AI decision-making from command construction for its programmed capabilities: the model selects a capability, while code generates the concrete Mythic commands and verifies their effects against actual output.","An entry in Sage’s Engagement State Ledger is not treated as achieved merely because the model says so; it must include a proof record tied to evidence such as Mythic task output, callback records, credentials, files, or BloodHound data.","Sage can work with different Mythic agents by querying Mythic’s own command schemas, checking that a command is available on the selected callback, and validating or repairing arguments before presenting an approval request.","Autonomous mode does not use the normal multi-agent conversation system; it instead uses a deterministic cycle that evaluates available capabilities, verifies results, and stops under limits for cycles, lack of progress, tokens, or elapsed time.","The article cites prior research indicating that language models handle individual penetration-testing tasks better than sustained multi-host operations, which is why Sage keeps operational memory outside the model in BloodHound and its ledger."],"referencedReports":[{"title":"PentestGPT: An LLM-empowered Automatic Penetration Testing Tool","url":"https://arxiv.org/abs/2308.06782","publisher":"arxiv","context":"The article cites this research as finding that LLMs can handle individual penetration-testing subtasks but struggle to maintain an integrated view of an entire test.","category":"research","primary":false},{"title":"Incalmo","url":"https://arxiv.org/abs/2501.16466","publisher":"arxiv","context":"The article cites this research to support its claim that separate context tracking and asset acquisition improve LLM offense-system performance across multi-host networks.","category":"research","primary":false},{"title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://arxiv.org/abs/2307.03172","publisher":"arxiv","context":"The article cites this study for evidence that models use information less reliably when it appears in the middle of a long context.","category":"research","primary":false}],"body":"\u003cp\u003eSpecterOps has released Sage, an open-source AI assistant that runs as a native chat container inside Mythic v4 for assumed-breach operations. Operators can describe an objective, and Sage identifies suitable Mythic agents, callbacks, commands, and arguments while retaining operator control through approval cards. Sage is intended to reduce the burden of tracking command syntax, tool availability, and operational information across long-running assessments.\u003c/p\u003e\n\n\u003cp\u003eSage provides read-only conversation mode, supervised mode requiring approval for each guarded action, and an experimental autonomous mode intended only for lab use. It maintains operational context through BloodHound attack-path data and an Engagement State Ledger that records gains only when they are supported by evidence from Mythic tasks, files, credentials, callbacks, or BloodHound data. Sage can query installed Mythic agent schemas, validate proposed command arguments, and use programmed capabilities that generate and verify concrete actions; however, it remains beta software, with end-to-end validation primarily conducted using Mythic v4, LiteLLM, and the Apollo payload.\u003c/p\u003e\n"}]</script>
