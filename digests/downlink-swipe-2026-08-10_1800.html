<script type="application/json" id="dl-articles">[{"n":1,"title":"BdThemes plugins supply-chain hack creates rogue WordPress admins","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bdthemes-plugins-supply-chain-hack-creates-rogue-wordpress-admins/","time":"21:12","priority":"MUST READ","score":94,"tldr":"BdThemes’ WordPress plugin ecosystem was hit by a supply-chain compromise where attackers poisoned a remote JSON feed to run malicious JavaScript in admin dashboards, creating hidden rogue administrator accounts. Affected plugins were pulled from WordPress.org while the issue remained under investigation.","briefOverview":"\u003cp\u003eA threat actor compromised the upstream infrastructure of BdThemes, a developer of premium WordPress web-design tools, and modified a remote JSON feed delivered to administrators’ browsers to create rogue admin accounts. BdThemes provides plugins including Element Pack, Prime Slider, Ultimate Post Kit, Pixel Gallery, and Ultimate Store Kit. Its free Element Pack plugin shows more than 100,000 active installations on WordPress.org, while BdThemes advertises more than 350,000 active installs across its portfolio.\u003c/p\u003e\n\n\u003cp\u003eDefiant said Wordfence began seeing attacks through its web application firewall on August 7, and researchers determined the earliest possible start of the campaign was June 23. The affected BdThemes products were pulled from the WordPress.org directory on August 8 pending investigation, and the article says the issue was listed as unpatched as of publication. At the time of writing, BdThemes had not published an official statement, and BleepingComputer had not received a response to its request for comment.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket. The attack exploited a cross-site scripting flaw in the Biggop Library used by the Biggopti component, allowing malicious JavaScript to run when a logged-in administrator opened a wp-admin page. The injected code used the legitimate administrator’s authenticated session to create rogue admin accounts, manipulated WordPress database queries to hide them, and used an additional payload called w2.js to establish persistence through a webshell named emer-run.php by installing a fake plugin.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor compromised BdThemes’ upstream infrastructure and modified a remote JSON feed delivered to administrators’ browsers to create rogue WordPress administrator accounts.","Wordfence researchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket, exploiting a cross-site scripting flaw in the Biggop Library used by the Biggopti component.","The malicious JavaScript used a legitimate administrator’s authenticated session to create rogue admin accounts, and an additional payload called w2.js established persistence through a webshell named emer-run.php by installing a fake plugin.","The affected BdThemes plugins were pulled from the WordPress.org directory on August 8 pending investigation, and the issue was listed as unpatched as of publication.","Defiant said the earliest possible start of the campaign was June 23, while Wordfence began seeing attacks through its web application firewall on August 7."],"insights":["The compromise was especially stealthy because it was driven entirely through a remote API response and did not require a plugin update, file modification, or user interaction.","The malicious code executed whenever a logged-in administrator opened a WordPress admin page, meaning routine site management activity could trigger the compromise.","The injected code manipulated WordPress database queries to hide rogue administrator accounts from the user list, reducing the chance that site owners would notice the compromise through normal admin checks.","Although the issue was assigned only a medium severity score, the article describes an attack path that could create persistent hidden administrator access on impacted sites.","Defiant said reports on the command-and-control infrastructure linked the observed attacks to the same attacker associated with recent Advanced Responsive Video Embedder and OptinMonster supply-chain compromises."],"referencedReports":[{"title":"PSA: Supply Chain Compromise in BdThemes Ecosystem via Poisoned API Response","url":"https://www.wordfence.com/blog/2026/08/psa-supply-chain-compromise-in-bdthemes-ecosystem-via-poisoned-api-response/","publisher":"Defiant / Wordfence","context":"The article cites Defiant’s Wordfence report for the technical details of the poisoned API response, the XSS flaw, rogue administrator creation, and persistence mechanism.","category":"research","primary":true}],"body":"\u003cp\u003eA threat actor compromised the upstream infrastructure of BdThemes, a developer of premium WordPress web-design tools, and modified a remote JSON feed delivered to administrators’ browsers to create rogue admin accounts. BdThemes provides plugins including Element Pack, Prime Slider, Ultimate Post Kit, Pixel Gallery, and Ultimate Store Kit. Its free Element Pack plugin shows more than 100,000 active installations on WordPress.org, while BdThemes advertises more than 350,000 active installs across its portfolio.\u003c/p\u003e\n\n\u003cp\u003eDefiant said Wordfence began seeing attacks through its web application firewall on August 7, and researchers determined the earliest possible start of the campaign was June 23. The affected BdThemes products were pulled from the WordPress.org directory on August 8 pending investigation, and the article says the issue was listed as unpatched as of publication. At the time of writing, BdThemes had not published an official statement, and BleepingComputer had not received a response to its request for comment.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket. The attack exploited a cross-site scripting flaw in the Biggop Library used by the Biggopti component, allowing malicious JavaScript to run when a logged-in administrator opened a wp-admin page. The injected code used the legitimate administrator’s authenticated session to create rogue admin accounts, manipulated WordPress database queries to hide them, and used an additional payload called w2.js to establish persistence through a webshell named emer-run.php by installing a fake plugin.\u003c/p\u003e\n"},{"n":3,"title":"FBI, South Korea warn of Gunra ransomware gang targeting critical infrastructure","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ransomware-south-korea-fbi-gunra","time":"19:30","priority":"MUST READ","score":94,"tldr":"The FBI and South Korea warned that the Gunra ransomware gang is exploiting Fortinet firewall vulnerabilities to target critical infrastructure, healthcare, finance and government organizations worldwide. Victims face data theft, encryption and ransom demands often exceeding $10 million.","briefOverview":"\u003cp\u003eThe FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is breaching critical infrastructure organizations through vulnerabilities in popular Fortinet firewall products. The joint advisory said Gunra actors have been exploiting CVE-2024-55591 and CVE-2025-24472 to gain privileged access, steal data, encrypt systems and extort victims. The agencies said the group is targeting healthcare, financial services and government sectors globally.\u003c/p\u003e\n\n\u003cp\u003eGunra emerged in April 2025 and is built using source code from the Conti ransomware that was leaked in 2022. In many incidents reviewed by the FBI and South Korea’s police agency, victims received ransom demands exceeding $10 million and were given five to seven days to pay. The FBI also observed Gunra actors trying to contact management staff at victim companies directly by email to solicit ransom payments, with limited success.\u003c/p\u003e\n\n\u003cp\u003eThe FBI said Gunra has expanded and commercialized its platform, moved to a ransomware-as-a-service model and recruited hackers to act as initial access brokers under aliases including “Golden Community.” The group initially focused on Windows devices but later created a Linux variant, which researchers found has a weakness that can allow defenders to reconstruct keys from file timestamps and recover files without paying. The advisory comes as Dragos reported 1,140 ransomware incidents affecting industrial organizations worldwide in the second quarter of 2026, including four attributed to Gunra.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is exploiting Fortinet firewall vulnerabilities CVE-2024-55591 and CVE-2025-24472 to breach critical infrastructure organizations.","The advisory said Gunra emerged in April 2025 and was built using source code from the Conti ransomware that was leaked in 2022.","The agencies said Gunra is targeting healthcare, financial services and government sectors globally, with ransom demands in many cases exceeding $10 million and payment deadlines of five to seven days.","Researchers recently warned that some tools and infrastructure used by North Korea’s Lazarus Group appear to have been shared with Gunra as it targeted South Korean organizations.","The advisory noted that researchers found a weakness in Gunra’s Linux variant that can allow defenders to reconstruct keys using file timestamps and recover files without paying the ransom."],"insights":["Gunra’s use of leaked Conti source code shows that older ransomware leaks can continue to enable new groups years later, with this operation emerging in April 2025 from code leaked in 2022.","Gunra’s Linux variant may not always require ransom payment for recovery because researchers found that defenders can reconstruct keys from file timestamps.","Gunra’s move to a ransomware-as-a-service model and recruitment of initial access brokers indicates the group has shifted from a single operation toward a broader criminal platform.","The group’s attempts to email victim-company management directly show that its extortion tactics extend beyond technical disruption into pressure on business leadership."],"referencedReports":[{"title":"Cybersecurity Advisory AA26-222A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a","publisher":"CISA, FBI and South Korea’s National Police Agency","context":"The article is based on a joint cybersecurity advisory warning that Gunra ransomware actors are exploiting Fortinet firewall vulnerabilities to target critical infrastructure and other sectors.","category":"advisory","primary":true},{"title":"Gunra Ransomware’s Linux Variant Has a Fatal Flaw: Time-Seeded rand() Makes Encrypted Files Recoverable Without Paying","url":"https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying","publisher":"Breakglass","context":"The article cites this analysis for the finding that a weakness in Gunra’s Linux variant can allow defenders to reconstruct keys from file timestamps and recover files without paying.","category":"research","primary":false},{"title":"Dragos Industrial Ransomware Analysis: Q2 2026","url":"https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026","publisher":"Dragos","context":"The article cites Dragos’ analysis for data showing 1,140 ransomware incidents affecting industrial organizations worldwide in Q2 2026, including attacks attributed to Gunra.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is breaching critical infrastructure organizations through vulnerabilities in popular Fortinet firewall products. The joint advisory said Gunra actors have been exploiting CVE-2024-55591 and CVE-2025-24472 to gain privileged access, steal data, encrypt systems and extort victims. The agencies said the group is targeting healthcare, financial services and government sectors globally.\u003c/p\u003e\n\n\u003cp\u003eGunra emerged in April 2025 and is built using source code from the Conti ransomware that was leaked in 2022. In many incidents reviewed by the FBI and South Korea’s police agency, victims received ransom demands exceeding $10 million and were given five to seven days to pay. The FBI also observed Gunra actors trying to contact management staff at victim companies directly by email to solicit ransom payments, with limited success.\u003c/p\u003e\n\n\u003cp\u003eThe FBI said Gunra has expanded and commercialized its platform, moved to a ransomware-as-a-service model and recruited hackers to act as initial access brokers under aliases including “Golden Community.” The group initially focused on Windows devices but later created a Linux variant, which researchers found has a weakness that can allow defenders to reconstruct keys from file timestamps and recover files without paying. The advisory comes as Dragos reported 1,140 ransomware incidents affecting industrial organizations worldwide in the second quarter of 2026, including four attributed to Gunra.\u003c/p\u003e\n"},{"n":2,"title":"OpenAI releases ChatGPT 5.6 Cyber, but it's only for approved users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/openai-releases-chatgpt-56-cyber-but-its-only-for-approved-users/","time":"19:24","priority":"MAY READ","score":68,"tldr":"OpenAI has launched GPT 5.6 Cyber, a specialized model for vulnerability research, penetration testing, incident response, and remediation, but access is limited to approved security partners and vendors. Customers will use it through those partners’ services rather than receiving direct access to the underlying model.","briefOverview":"\u003cp\u003eOpenAI has developed a new model called GPT 5.6 Cyber for vulnerability research, penetration testing, and incident response. The model is only available to select companies, including Accenture, IBM, Capgemini, Cognizant, EY, KPMG, PwC, NCC Group, and SpecterOps. It is also rolling out to supported security vendors, including Palo Alto Networks, CrowdStrike, Cisco, Sophos, Akamai, Fortinet, and Cloudflare.\u003c/p\u003e\n\n\u003cp\u003eOpenAI says regular users will not receive access to the underlying models because of security risks and past abuse of models to launch security attacks. Approved partners will instead use the models inside existing security products, managed services, and customer engagements. OpenAI says this approach can help defenders find serious vulnerabilities, validate which ones matter, and fix them faster.\u003c/p\u003e\n\n\u003cp\u003ePartners can access two versions of ChatGPT’s cyber capabilities through Daybreak Access: Daybreak Blue and Daybreak Red. Daybreak Blue is designed for broad defensive security workloads, while Daybreak Red is intended for more specialized and closely governed work. OpenAI says safeguards may include identity verification, clearly defined testing scopes, logging, monitoring, and human oversight, and that access to the underlying models remains with the approved partner rather than being transferred directly to the customer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI has developed GPT 5.6 Cyber, a model designed for vulnerability research, penetration testing, and incident response.","GPT 5.6 Cyber is available only to select companies and supported security vendors, not to regular users.","OpenAI says approved partners will use the models inside existing security products, managed services, and customer engagements rather than transferring access directly to customers.","OpenAI offers Daybreak Blue for broad defensive security workloads and Daybreak Red for more specialized and closely governed work.","OpenAI says safeguards may include identity verification, clearly defined testing scopes, logging, monitoring, and human oversight."],"insights":["OpenAI is using a partner-controlled delivery model in which customers can benefit from GPT 5.6 Cyber during engagements without receiving direct access to the underlying models.","The split between Daybreak Blue and Daybreak Red shows that OpenAI is separating general defensive uses from more sensitive security work that requires closer governance.","The approved partner list combines major consulting firms with security product vendors, indicating the model is intended for both managed service engagements and integration into existing security products.","OpenAI’s stated safeguards, including identity verification, defined testing scopes, logging, monitoring, and human oversight, show that access is being treated as a controlled security workflow rather than a general-purpose ChatGPT feature."],"referencedReports":[],"body":"\u003cp\u003eOpenAI has developed a new model called GPT 5.6 Cyber for vulnerability research, penetration testing, and incident response. The model is only available to select companies, including Accenture, IBM, Capgemini, Cognizant, EY, KPMG, PwC, NCC Group, and SpecterOps. It is also rolling out to supported security vendors, including Palo Alto Networks, CrowdStrike, Cisco, Sophos, Akamai, Fortinet, and Cloudflare.\u003c/p\u003e\n\n\u003cp\u003eOpenAI says regular users will not receive access to the underlying models because of security risks and past abuse of models to launch security attacks. Approved partners will instead use the models inside existing security products, managed services, and customer engagements. OpenAI says this approach can help defenders find serious vulnerabilities, validate which ones matter, and fix them faster.\u003c/p\u003e\n\n\u003cp\u003ePartners can access two versions of ChatGPT’s cyber capabilities through Daybreak Access: Daybreak Blue and Daybreak Red. Daybreak Blue is designed for broad defensive security workloads, while Daybreak Red is intended for more specialized and closely governed work. OpenAI says safeguards may include identity verification, clearly defined testing scopes, logging, monitoring, and human oversight, and that access to the underlying models remains with the approved partner rather than being transferred directly to the customer.\u003c/p\u003e\n"},{"n":4,"title":"What’s in America’s Code?","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/whats-in-americas-code/","time":"18:28","priority":"MAY READ","score":45,"tldr":"Booz Allen tested several Chinese frontier LLMs commonly used by U.S. developers against an American model and warns that relying on foreign AI to generate or secure code could introduce major software supply-chain risks. The article urges readers to review the test results and recommended actions.","briefOverview":"\u003cp\u003eThe article says there are major risks with allowing Chinese large language models to code for U.S. applications. It argues that the first link in the software supply chain is no longer the code itself, but the AI models behind it. As U.S. developers increasingly rely on AI to generate, debug, and secure code, the article raises the question of whether the models writing and powering the nation’s code can be trusted.\u003c/p\u003e\n\n\u003cp\u003eTo examine that question, Booz Allen, identified as a Health-ISAC Community Champion, tested several models in May 2026. Booz Allen used its AI-native test platform to evaluate five frontier AI models head-to-head. The tested models included four Chinese models commonly used by U.S. developers and one American model.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the testing as relevant to software supply chain risk for U.S. applications. It directs readers to the test results and Booz Allen’s recommended actions. The article is tagged with AI and Community Services and appears alongside related Health-ISAC resources and news.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that there are major risks with allowing Chinese large language models to code for U.S. applications.","The article says the first link in the software supply chain is now the AI models behind generated code, rather than the code itself.","The article says U.S. developers are increasingly relying on AI to generate, debug, and secure code.","In May 2026, Booz Allen used its AI-native test platform to evaluate five frontier AI models head-to-head.","The evaluation included four Chinese models commonly used by U.S. developers and one American model."],"insights":["The article treats the AI model used to create code as part of the software supply chain, not just as a development aid.","The article highlights model origin as a trust factor when U.S. developers use AI to generate, debug, or secure code.","Booz Allen’s evaluation was designed as a direct comparison between four Chinese models commonly used by U.S. developers and one American model.","The article points readers to Booz Allen’s test results and recommended actions as the next step for addressing the identified risks."],"referencedReports":[],"body":"\u003cp\u003eThe article says there are major risks with allowing Chinese large language models to code for U.S. applications. It argues that the first link in the software supply chain is no longer the code itself, but the AI models behind it. As U.S. developers increasingly rely on AI to generate, debug, and secure code, the article raises the question of whether the models writing and powering the nation’s code can be trusted.\u003c/p\u003e\n\n\u003cp\u003eTo examine that question, Booz Allen, identified as a Health-ISAC Community Champion, tested several models in May 2026. Booz Allen used its AI-native test platform to evaluate five frontier AI models head-to-head. The tested models included four Chinese models commonly used by U.S. developers and one American model.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the testing as relevant to software supply chain risk for U.S. applications. It directs readers to the test results and Booz Allen’s recommended actions. The article is tagged with AI and Community Services and appears alongside related Health-ISAC resources and news.\u003c/p\u003e\n"}]</script>
