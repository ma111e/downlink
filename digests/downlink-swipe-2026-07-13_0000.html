<script type="application/json" id="dl-articles">[{"n":2,"title":"CISA warns of actively exploited RCE flaws in Joomla extensions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-actively-exploited-rce-flaws-in-joomla-extensions/","time":"15:20","priority":"MUST READ","score":95,"tldr":"CISA says attackers are actively exploiting arbitrary file upload flaws in the Joomla iCagenda and Balbooa Forms extensions to achieve remote code execution and potentially take over websites. Joomla admins should update iCagenda to 4.0.8 or 3.9.15 and Balbooa Forms to 2.4.1 immediately.","briefOverview":"\u003cp\u003eCISA is warning that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads. The agency added the flaws to its Known Exploited Vulnerabilities catalog as maximum priority items. Federal agencies were ordered to apply available security updates or mitigations within three days, with the deadline set for today.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48939 affects iCagenda, an extension used for registering and scheduling events and creating calendars. CISA says the flaw allows arbitrary files to be uploaded through the file attachment feature, ultimately enabling PHP code upload and execution. The article says exploitation can lead to data theft, web shell installation, and complete website compromise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56291 affects Balbooa Forms, a drag-and-drop form builder for Joomla sites that supports file uploads. CISA says attackers can use this functionality to upload dangerous file types, such as executable files, leading to remote code execution and full website takeover. The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15 and Balbooa Forms version 2.4.1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads.","CISA categorized the flaws as maximum priority and ordered federal agencies to apply available security updates or mitigations within three days, with the deadline set for today.","CVE-2026-48939 affects the iCagenda extension and can allow attackers to upload arbitrary files, including PHP scripts, which may lead to data theft, web shell installation, and complete website compromise.","CVE-2026-56291 affects the Balbooa Forms extension for Joomla and can allow dangerous file types, such as executable files, to be uploaded, leading to remote code execution and full website takeover.","The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15 and Balbooa Forms version 2.4.1."],"insights":["Both Joomla extension flaws were reportedly exploited in automated attacks before the vendors released patches, meaning some sites may have been compromised even if updates were applied soon after release.","The Balbooa Forms flaw was reportedly exploited as a zero-day starting July 8, one day before the vendor released version 2.4.1 to fix it.","CISA gave federal agencies only three days to apply updates or mitigations, showing the agency considered these exploited Joomla extension flaws especially urgent.","Administrators need to check for both major iCagenda branches because the article lists separate fixed versions, 4.0.8 and 3.9.15."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/10/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites CISA's alert as the basis for the warning that the Joomla extension flaws were added to the Known Exploited Vulnerabilities catalog with an urgent federal patching deadline.","category":"","primary":false},{"title":"iCagenda Zero-Day File Upload RCE","url":"https://mysites.guru/blog/icagenda-zero-day-file-upload-rce/","publisher":"mySites.guru","context":"The article references mySites.guru's write-up as the source for observed attacks against the iCagenda flaw shortly before version 4.0.8 was released.","category":"","primary":false},{"title":"Balbooa Forms Unauthenticated File Upload Flaw","url":"http://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/","publisher":"mySites.guru","context":"The article references mySites.guru's write-up as the source for the claim that the Balbooa Forms flaw was exploited as a zero-day starting July 8.","category":"","primary":false}],"body":"\u003cp\u003eCISA is warning that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads. The agency added the flaws to its Known Exploited Vulnerabilities catalog as maximum priority items. Federal agencies were ordered to apply available security updates or mitigations within three days, with the deadline set for today.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48939 affects iCagenda, an extension used for registering and scheduling events and creating calendars. CISA says the flaw allows arbitrary files to be uploaded through the file attachment feature, ultimately enabling PHP code upload and execution. The article says exploitation can lead to data theft, web shell installation, and complete website compromise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56291 affects Balbooa Forms, a drag-and-drop form builder for Joomla sites that supports file uploads. CISA says attackers can use this functionality to upload dangerous file types, such as executable files, leading to remote code execution and full website takeover. The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15 and Balbooa Forms version 2.4.1.\u003c/p\u003e\n"},{"n":18,"title":"iCagenda and Balbooa Forms Joomla Flaws Reportedly Exploited as Zero-Days","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/icagenda-and-balbooa-forms-joomla-flaws.html","time":"05:36","priority":"MUST READ","score":95,"tldr":"CISA added critical Joomla extension flaws in iCagenda and Balbooa Forms to its KEV catalog after reports of active zero-day exploitation allowing unauthenticated file uploads and remote code execution. Site owners should urgently update to patched versions and check upload folders for PHP web shells or other signs of compromise.","briefOverview":"\u003cp\u003eCISA added two maximum-severity Joomla extension flaws to its Known Exploited Vulnerabilities catalog after reports of zero-day exploitation in the wild. The flaws are CVE-2026-48939 in iCagenda and CVE-2026-56291 in Balbooa Forms, both rated 10.0 on the CVSS scale. Both vulnerabilities allow arbitrary file uploads that can lead to PHP code execution or remote code execution.\u003c/p\u003e\n\n\u003cp\u003eMySites.guru said CVE-2026-48939 has been exploited since June 15, 2026, in automated attacks against Joomla sites with iCagenda installed. The issue affects iCagenda 4.x through 4.0.7 and legacy 3.x versions from 3.2.1 through 3.9.14, and JoomliC released fixes in versions 4.0.8 and 3.9.15. Site owners were advised to check the \u003ccode\u003eimages/icagenda/frontend/attachments/\u003c/code\u003e folder for suspicious PHP files.\u003c/p\u003e\n\n\u003cp\u003eMySites.guru also reported zero-day exploitation of CVE-2026-56291 in Balbooa Forms versions up to and including 2.4.0, with a fix released in version 2.4.1. The article says attackers could upload PHP files into a public folder without login, a CSRF token, or file type checks, and then run them. The disclosure came as Australia’s ACSC warned of a global campaign targeting CMS and plugin vulnerabilities to deploy web shells on websites.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added two maximum-severity Joomla extension vulnerabilities, CVE-2026-48939 in iCagenda and CVE-2026-56291 in Balbooa Forms, to its Known Exploited Vulnerabilities catalog after reports of zero-day exploitation.","CVE-2026-48939 allows arbitrary file uploads through iCagenda's file attachment feature, leading to PHP code upload and execution, and affects iCagenda 4.x through 4.0.7 and legacy 3.x versions 3.2.1 through 3.9.14.","JoomliC released fixes for CVE-2026-48939 in iCagenda versions 4.0.8 and 3.9.15, and site owners were advised to check the images/icagenda/frontend/attachments/ folder for suspicious PHP files.","CVE-2026-56291 affects Balbooa Forms versions up to and including 2.4.0, allows arbitrary file uploads leading to remote code execution, and was patched in version 2.4.1.","The Australian Cyber Security Centre warned of a global campaign in which malicious actors are scanning websites to deploy web shells by exploiting vulnerabilities in CMS software and plugins."],"insights":["Both Joomla flaws received the maximum CVSS score of 10.0 and were added to CISA’s KEV catalog with only a three-day remediation deadline for U.S. federal civilian agencies, underscoring the urgency of active exploitation.","The iCagenda exploitation described by mySites.guru was automated and identifiable in logs by the user agent string “icagenda-batch/1.0,” giving defenders a concrete artifact to search for in access logs.","For iCagenda compromises, the article identifies the exact default location where planted shells may appear: images/icagenda/frontend/attachments/.","For Balbooa Forms compromises, checking only uploaded files is not enough; mySites.guru also advised reviewing Joomla administrator accounts and recently modified or unfamiliar PHP files across the site.","The ACSC alert shows the issue is broader than these two Joomla extensions, describing a scaled global campaign targeting many CMS products and plugins to deploy web shells."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/10/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites this CISA alert as the source for adding the iCagenda and Balbooa Forms flaws to the Known Exploited Vulnerabilities catalog.","category":"","primary":false},{"title":"iCagenda Zero-Day File Upload RCE","url":"https://mysites.guru/blog/icagenda-zero-day-file-upload-rce/","publisher":"mySites.guru","context":"The article cites this analysis for details on zero-day exploitation of CVE-2026-48939, including the observed scanner behavior and affected iCagenda versions.","category":"","primary":false},{"title":"iCagenda Security Update","url":"https://www.joomlic.com/news/icagenda-security-update","publisher":"JoomliC","context":"The article references this vendor security update for the patched iCagenda versions addressing CVE-2026-48939.","category":"","primary":false},{"title":"Balbooa Forms Unauthenticated File Upload Flaw","url":"https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/#cve-record-and-disclosure-timeline","publisher":"mySites.guru","context":"The article cites this technical write-up for details on CVE-2026-56291, including unauthenticated file upload behavior, disclosure timing, and compromise indicators.","category":"","primary":false},{"title":"Large-scale exploitation campaign targeting website Content Management Systems (CMS)","url":"https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/large-scale-exploitation-campaign-targeting-website-content-management-systems-cms","publisher":"Australian Cyber Security Centre","context":"The article cites this ACSC alert for its warning about a global campaign targeting CMS and plugin vulnerabilities to deploy web shells.","category":"","primary":false}],"body":"\u003cp\u003eCISA added two maximum-severity Joomla extension flaws to its Known Exploited Vulnerabilities catalog after reports of zero-day exploitation in the wild. The flaws are CVE-2026-48939 in iCagenda and CVE-2026-56291 in Balbooa Forms, both rated 10.0 on the CVSS scale. Both vulnerabilities allow arbitrary file uploads that can lead to PHP code execution or remote code execution.\u003c/p\u003e\n\n\u003cp\u003eMySites.guru said CVE-2026-48939 has been exploited since June 15, 2026, in automated attacks against Joomla sites with iCagenda installed. The issue affects iCagenda 4.x through 4.0.7 and legacy 3.x versions from 3.2.1 through 3.9.14, and JoomliC released fixes in versions 4.0.8 and 3.9.15. Site owners were advised to check the \u003ccode\u003eimages/icagenda/frontend/attachments/\u003c/code\u003e folder for suspicious PHP files.\u003c/p\u003e\n\n\u003cp\u003eMySites.guru also reported zero-day exploitation of CVE-2026-56291 in Balbooa Forms versions up to and including 2.4.0, with a fix released in version 2.4.1. The article says attackers could upload PHP files into a public folder without login, a CSRF token, or file type checks, and then run them. The disclosure came as Australia’s ACSC warned of a global campaign targeting CMS and plugin vulnerabilities to deploy web shells on websites.\u003c/p\u003e\n"},{"n":10,"title":"US and allies warn of Russian critical infrastructure attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-and-allies-share-defense-tips-against-russian-hackers-targeting-critical-infrastructure/","time":"09:32","priority":"MUST READ","score":94,"tldr":"The U.S. and allies warned that Russian FSB-linked hackers are targeting poorly secured routers, especially those using weak SNMP settings or vulnerable Cisco Smart Install features, to infiltrate critical infrastructure networks. Agencies urged organizations to harden routers by upgrading SNMP, disabling risky services, blocking SNMP/TFTP traffic, patching firmware, and replacing end-of-life devices.","briefOverview":"\u003cp\u003eCybersecurity agencies from the United States and eight other countries issued a joint warning that Russian state hackers are targeting vulnerable and poorly configured routers to infiltrate critical infrastructure networks. The advisory was co-authored by the NSA, FBI, and CISA, along with agencies from Australia, the United Kingdom, Canada, New Zealand, Estonia, Finland, France, and Italy. It attributes the activity to hackers from the Russian Federal Security Service Center 16, a group also tracked as Berserk Bear, Energetic Bear, Crouching Yeti, Dragonfly, Ghost Blizzard, and Static Tundra.\u003c/p\u003e\n\n\u003cp\u003eThe group scans internet-connected IP address ranges for routers that accept default or common SNMP authentication strings. It then issues commands using spoofed IP addresses to copy device configuration files and exfiltrate them via the Trivial File Transfer Protocol to actor-controlled servers. The article also says the same group has targeted critical infrastructure using CVE-2018-0171 in the Smart Install feature of Cisco IOS and Cisco IOS XE software since November 2021.\u003c/p\u003e\n\n\u003cp\u003eThe sectors described as most at risk include energy, communications, defense industrial base, healthcare, financial services, defense, and state and local government services. The advisory urges defenders to upgrade to SNMPv3, disable Cisco Smart Install, enforce strong unique passwords, block TFTP and SNMP traffic at edge firewalls, update software and firmware, and replace end-of-life devices. The article also notes a separate law enforcement operation that disrupted FrostArmada, an APT28-attributed campaign that had infected 18,000 routers across 120 countries by December 2025.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity agencies from the United States and eight other countries issued a joint warning that Russian state hackers are targeting vulnerable and poorly configured routers to infiltrate critical infrastructure networks.","The joint advisory attributes the activity to hackers from the Russian Federal Security Service Center 16, also tracked as Berserk Bear, Energetic Bear, Crouching Yeti, Dragonfly, Ghost Blizzard, and Static Tundra.","The hackers scan internet-connected IP ranges for routers using default or common SNMP authentication strings, then use spoofed IP addresses to copy device configuration files and exfiltrate them via Trivial File Transfer Protocol to actor-controlled servers.","The FBI previously warned in August 2025 that the same group had been targeting critical infrastructure since November 2021 by exploiting CVE-2018-0171 in the Smart Install feature of Cisco IOS and Cisco IOS XE software.","The advisory urges defenders to upgrade to SNMPv3, disable Cisco Smart Install, enforce strong unique passwords, block TFTP and SNMP traffic at edge firewalls, update software and firmware, and replace end-of-life devices."],"insights":["The advisory highlights that even basic router misconfigurations, such as default or common SNMP community strings, remain valuable enough for a Russian state-linked group to target critical infrastructure networks at scale.","The attackers are not relying on a single path into networks; the article says they use SNMP scans, Cisco Smart Install issues, and web-portal flaws to gain control of network devices.","Blocking TFTP and SNMP traffic at edge firewalls is a particularly actionable mitigation because the article describes the attackers using SNMP to find and access routers and TFTP to exfiltrate configuration files.","The article separates this FSB Center 16 activity from the FrostArmada campaign attributed to APT28, showing that multiple Russian-linked groups have recently targeted routers for different purposes."],"referencedReports":[{"title":"Joint advisory","url":"https://www.ic3.gov/CSA/2026/260713.pdf","publisher":"NSA, FBI, CISA, and allied cybersecurity agencies","context":"The article says a joint advisory co-authored by U.S. and allied agencies attributes router-targeting attacks on critical infrastructure to Russian FSB Center 16 hackers.","category":"","primary":false},{"title":"UK and allies urge critical sectors to improve defences against Russian intelligence targeting","url":"https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting","publisher":"UK National Cyber Security Centre","context":"The article links to the UK NCSC warning that Centre 16 is hunting for vulnerable routers using default or weak SNMP passwords and community strings.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity agencies from the United States and eight other countries issued a joint warning that Russian state hackers are targeting vulnerable and poorly configured routers to infiltrate critical infrastructure networks. The advisory was co-authored by the NSA, FBI, and CISA, along with agencies from Australia, the United Kingdom, Canada, New Zealand, Estonia, Finland, France, and Italy. It attributes the activity to hackers from the Russian Federal Security Service Center 16, a group also tracked as Berserk Bear, Energetic Bear, Crouching Yeti, Dragonfly, Ghost Blizzard, and Static Tundra.\u003c/p\u003e\n\n\u003cp\u003eThe group scans internet-connected IP address ranges for routers that accept default or common SNMP authentication strings. It then issues commands using spoofed IP addresses to copy device configuration files and exfiltrate them via the Trivial File Transfer Protocol to actor-controlled servers. The article also says the same group has targeted critical infrastructure using CVE-2018-0171 in the Smart Install feature of Cisco IOS and Cisco IOS XE software since November 2021.\u003c/p\u003e\n\n\u003cp\u003eThe sectors described as most at risk include energy, communications, defense industrial base, healthcare, financial services, defense, and state and local government services. The advisory urges defenders to upgrade to SNMPv3, disable Cisco Smart Install, enforce strong unique passwords, block TFTP and SNMP traffic at edge firewalls, update software and firmware, and replace end-of-life devices. The article also notes a separate law enforcement operation that disrupted FrostArmada, an APT28-attributed campaign that had infected 18,000 routers across 120 countries by December 2025.\u003c/p\u003e\n"},{"n":17,"title":"Misconfigured Server Reveals Three Evilginx Phishing Operations Targeting Microsoft 365","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/misconfigured-server-reveals-three.html","time":"07:30","priority":"SHOULD READ","score":88,"tldr":"A misconfigured phishing server exposed three Evilginx-based Microsoft 365 phishing operations that steal or refresh tokens to keep access even after MFA. The key defense is that passkeys/FIDO2 help against reverse-proxy phishing, but device-code phishing requires blocking or tightly restricting Microsoft’s device code flow with Conditional Access.","briefOverview":"\u003cp\u003eLexfo found that a Microsoft 365 phishing operator had left a Python web server exposed on a public port with directory listing enabled, revealing tooling, logs, archives, RMM installers, combolists, and Telegram session files. The exposed server led researchers from one operator, tracked as codemado, to two more operators and three campaigns in total. Each campaign used a custom fork of the open-source Evilginx proxy, and the largest had been running for more than a year with victims that were overwhelmingly corporate mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe operations used two different methods to get around Microsoft 365 account protections. One method used Evilginx adversary-in-the-middle proxying to capture live logins and session cookies, while another abused Microsoft’s legitimate OAuth device code flow so victims completed sign-in and MFA on a real Microsoft page. The article says phishing-resistant MFA such as FIDO2 or passkeys can stop the Evilginx-style reverse-proxy method, but it does not stop device-code phishing because the victim authorizes the attacker’s session on genuine Microsoft infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe report links the campaigns to codemado, mail-argenta, and saroula01, and notes signs of AI-assisted development in supporting code, scripts, and phishlets across the operations. The black-queen device-code campaign logged 218 distinct captured accounts across a dozen countries between June 2025 and July 2026, with about 94 percent corporate mailboxes. The article recommends blocking device code flow wherever possible through Conditional Access, using sign-in logs to inventory legitimate use, layering IP-based policies and Continuous Access Evaluation, and hunting for suspicious refresh-token grants and RMM tooling such as XEOX.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lexfo found a misconfigured Python web server with directory listing enabled, exposing phishing configurations, credential-harvesting logs, RMM installers, combolists, backup archives, and Telegram session files tied to a Microsoft 365 phishing operation.","The exposed server led researchers to three phishing operations using custom forks of the open-source Evilginx proxy, including campaigns linked in the article to codemado, mail-argenta, and saroula01.","The operations used two different approaches against Microsoft 365 accounts: Evilginx adversary-in-the-middle proxying of live logins and abuse of Microsoft’s legitimate OAuth device code flow.","The black-queen device-code campaign attributed to saroula01 logged 218 distinct captured accounts across a dozen countries between June 2025 and July 2026, with about 94 percent identified as corporate mailboxes.","The article says phishing-resistant MFA such as FIDO2 or passkeys can stop Evilginx-style reverse-proxy phishing, but device-code phishing requires Conditional Access controls such as blocking device code flow where possible."],"insights":["A passkey or FIDO2 rollout does not address Microsoft device-code phishing in this case, because victims complete the sign-in on genuine Microsoft infrastructure and authorize the attacker’s session themselves.","Defenders need to hunt on the Entra sign-in log field “Original transfer method,” because Microsoft guidance cited in the article says device-code sessions can remain tagged there even when later refresh events no longer show the current authentication protocol as device code flow.","The operators’ token-refresh behavior matters as much as the initial credential capture, because the article describes repeated captures and token files set to autoRefresh, including sessions refreshed as many as 25 times.","The exposed artifacts show that small changes around public Evilginx forks, such as URL rewriting, SRI-related HTML attribute changes, and prefilled victim emails, can turn widely available code into more durable phishing infrastructure.","The article highlights that AI assistance appeared mostly in supporting scripts and phishlets rather than major Evilginx core changes, suggesting the immediate operational benefit was faster customization around existing kits."],"referencedReports":[{"title":"From Open Directory to Phishing Operator","url":"https://blog.lexfo.fr/opendir-to-phishing-operator.html","publisher":"Lexfo","context":"The article is based on Lexfo’s research into a misconfigured phishing server that exposed tooling and led researchers to three Microsoft 365 phishing operations.","category":"","primary":false},{"title":"Storm-2372 conducts device code phishing campaign","url":"https://www.microsoft.com/en-us/security/blog/2025/02/13/storm-2372-conducts-device-code-phishing-campaign/","publisher":"Microsoft","context":"The article cites Microsoft’s documentation of device-code phishing in a campaign it assessed with medium confidence as Russia-aligned.","category":"","primary":false},{"title":"The Quarry PhaaS IRS SSA Phishing","url":"https://socradar.io/blog/the-quarry-phaas-irs-ssa-phishing/","publisher":"SOCRadar","context":"The article references SOCRadar’s June 2026 documentation of The Quarry phishing-as-a-service ecosystem and its links to MaDoO Blaster promotion.","category":"","primary":false},{"title":"Conditional Access: Block device code flow","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-teams-devices-device-code-flow","publisher":"Microsoft","context":"The article cites Microsoft guidance recommending that organizations block device code flow wherever possible and test the policy before enforcement.","category":"","primary":false},{"title":"AI-enabled device code phishing campaign April 2026","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/","publisher":"Microsoft","context":"The article references Microsoft’s separate documentation of device-code phishing that used AI-driven backend automation and generative-AI lures.","category":"","primary":false}],"body":"\u003cp\u003eLexfo found that a Microsoft 365 phishing operator had left a Python web server exposed on a public port with directory listing enabled, revealing tooling, logs, archives, RMM installers, combolists, and Telegram session files. The exposed server led researchers from one operator, tracked as codemado, to two more operators and three campaigns in total. Each campaign used a custom fork of the open-source Evilginx proxy, and the largest had been running for more than a year with victims that were overwhelmingly corporate mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe operations used two different methods to get around Microsoft 365 account protections. One method used Evilginx adversary-in-the-middle proxying to capture live logins and session cookies, while another abused Microsoft’s legitimate OAuth device code flow so victims completed sign-in and MFA on a real Microsoft page. The article says phishing-resistant MFA such as FIDO2 or passkeys can stop the Evilginx-style reverse-proxy method, but it does not stop device-code phishing because the victim authorizes the attacker’s session on genuine Microsoft infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe report links the campaigns to codemado, mail-argenta, and saroula01, and notes signs of AI-assisted development in supporting code, scripts, and phishlets across the operations. The black-queen device-code campaign logged 218 distinct captured accounts across a dozen countries between June 2025 and July 2026, with about 94 percent corporate mailboxes. The article recommends blocking device code flow wherever possible through Conditional Access, using sign-in logs to inventory legitimate use, layering IP-based policies and Continuous Access Evaluation, and hunting for suspicious refresh-token grants and RMM tooling such as XEOX.\u003c/p\u003e\n"},{"n":22,"title":"Forg365 PhaaS Targets Microsoft 365 with Device Code and AitM Session Theft","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/forg365-phaas-targets-microsoft-365.html","time":"13:03","priority":"SHOULD READ","score":86,"tldr":"Forg365 is a new phishing-as-a-service platform targeting Microsoft 365 that combines device code phishing, adversary-in-the-middle session theft, anti-bot evasion, AI-generated lures, and tools for maintaining access to compromised mailboxes. The key defense is to restrict device code authentication, audit mailbox activity and mail-flow rules, and remove legacy aliases that attackers can abuse for phishing delivery.","briefOverview":"\u003cp\u003eA new phishing-as-a-service operation called \u003cstrong\u003eForg365\u003c/strong\u003e is targeting Microsoft 365 accounts using device code phishing, adversary-in-the-middle tactics, antibot evasion, AI-assisted lure creation, and post-compromise mailbox operations. The service is distributed via Telegram and costs \u003cspan class=\"math inline\"\u003e\\(400 per month or \\)\u003c/span\u003e3,800 per year. Its attack chains use legitimate email delivery infrastructure such as Amazon SES and Twilio SendGrid to make phishing lures blend into regular email traffic before redirecting victims to Forg365-controlled domains.\u003c/p\u003e\n\n\u003cp\u003eZeroBAC said Forg365 exposes a mature operator workflow that includes lure generation, campaign sending, SMTP rotation, AI email generation, token vaulting, account intelligence, keyword alerts, viewer links, and browser-extension support. The platform includes a device-auth phishing branch that presents a Microsoft-styled verification code page and pushes the victim into a legitimate Microsoft Authentication Broker sign-in flow, where the code authorizes an attacker-controlled session. For adversary-in-the-middle phishing, it uses route tokens, session cookies, and traffic classification to decide whether to show phishing content or a benign decoy, including redirecting VPN users to innocuous content.\u003c/p\u003e\n\n\u003cp\u003eForg365 also includes a Chromium-based browser extension called ForgCookie that is designed to maintain access to compromised Microsoft accounts by refreshing and injecting Microsoft session cookies. The platform supports post-compromise actions such as monitoring compromised mailboxes for specific keywords and drafting replies to email threads with AI assistance. The article recommends blocking device code authentication unless required, reviewing mailbox artifacts after device code events, auditing mail-flow rules, and decommissioning legacy aliases that no longer correspond to active employees.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Forg365 is a phishing-as-a-service operation sold via Telegram for $400 per month or $3,800 per year that targets Microsoft 365 accounts.","Forg365 attack chains use phishing lures delivered through legitimate email infrastructure such as Amazon SES and Twilio SendGrid before redirecting victims to Forg365-controlled domains.","The platform includes device code phishing that shows a Microsoft-styled verification code page and pushes victims into a legitimate Microsoft Authentication Broker sign-in flow that authorizes an attacker-controlled session.","Forg365 provides an operator panel at logfriend[.]com/login for generating lures, setting up campaigns, and managing captured tokens.","Forg365 includes a Chromium browser extension called ForgCookie that is designed to maintain access to compromised Microsoft accounts by refreshing and injecting Microsoft session cookies."],"insights":["Forg365 blends into normal email traffic by combining Amazon SES sender domains with SendGrid-hosted images or tracking resources before redirecting victims to attacker-controlled domains.","The kit can show benign decoy content when it detects a VPN connection, indicating that investigators and automated defenses may not see the same pages as real victims.","Forg365 goes beyond stealing credentials by supporting post-compromise mailbox actions such as keyword monitoring and AI-assisted drafting of replies in existing email threads.","Legacy aliases can create a hidden delivery path for phishing because messages forwarded from a historical namespace may appear to security tools as normal correspondence.","Blocking device code authentication unless required is a directly recommended mitigation because Forg365 and related kits use that sign-in flow to authorize attacker-controlled sessions."],"referencedReports":[{"title":"Inside Forg365: Telegram-Distributed Sneaky2FA-Style PhaaS","url":"https://zerobec.com/blog/inside-forg365-telegram-distributed-sneaky2fa-style-phaas","publisher":"ZeroBAC","context":"The article relies on ZeroBAC's analysis of Forg365's operator workflow, phishing methods, token handling, and post-compromise capabilities.","category":"","primary":false},{"title":"Sneaky 2FA Returns: Trusted Sender, Tenant-Branded Microsoft 365 Replay","url":"https://zerobec.com/blog/sneaky-2fa-returns-trusted-sender-tenant-branded-microsoft-365-replay","publisher":"ZeroBAC","context":"The article references this analysis as an example of campaigns using compromised SaaS sender accounts to route users to Sneaky 2FA-style phishing pages.","category":"","primary":false},{"title":"Kali365 Device Code Phishing Kit","url":"https://www.huntress.com/blog/kali365-device-code-phishing-kit","publisher":"Huntress","context":"The article cites Huntress research on phishing emails that use Canva-hosted pages and the Kali365 kit to hijack Microsoft accounts through device code phishing.","category":"","primary":false},{"title":"Token Bingo: Don’t Let Your Code Be the Winner","url":"https://arcticwolf.com/resources/blog/token-bingo-dont-let-your-code-be-the-winner/","publisher":"Arctic Wolf","context":"The article references this Arctic Wolf analysis while discussing Kali365 phishing campaigns that distributed pages impersonating Russia's MAX messenger.","category":"","primary":false},{"title":"Kali365 Expands into AWS, Microsoft, Okta, Xerox, MAX Messenger","url":"https://arcticwolf.com/resources/blog/kali365-expands-into-aws-microsoft-okta-xerox-max-messenger/","publisher":"Arctic Wolf","context":"The article quotes Arctic Wolf's assessment of MAX account takeover potential in Kali365-related phishing activity.","category":"","primary":false},{"title":"The Quarry PhaaS IRS SSA Phishing","url":"https://socradar.io/blog/the-quarry-phaas-irs-ssa-phishing/","publisher":"SOCRadar","context":"The article cites SOCRadar research on The Quarry phishing-as-a-service kit and campaigns impersonating the IRS, Social Security Administration, and major brands.","category":"","primary":false},{"title":"Following a USPS Smishing Kit Through Censys DNS Data","url":"https://censys.com/blog/following-a-usps-smishing-kit-through-censys-dns-data/","publisher":"Censys","context":"The article references Censys research on USPS and UPS smishing pages that capture personal and financial data in real time.","category":"","primary":false},{"title":"Nyasher Google Account Takeover Webflow Cloudflare Workers","url":"https://zerobec.com/blog/nyasher-google-account-takeover-webflow-cloudflare-workers","publisher":"ZeroBAC","context":"The article cites ZeroBAC analysis of fake bid proposal workflows using the Nyasher framework to take over Google accounts.","category":"","primary":false},{"title":"GPPStorm Google Partners Phishing Workspace Credentials","url":"https://zerobec.com/blog/gppstorm-google-partners-phishing-workspace-credentials","publisher":"ZeroBAC","context":"The article references ZeroBAC research on GPPStorm phishing emails that imitate Google Partners enrollment workflows to capture credentials.","category":"","primary":false},{"title":"EvilTokens Device Code Phishing Legacy Aliases","url":"https://zerobec.com/blog/eviltokens-device-code-phishing-legacy-aliases","publisher":"ZeroBAC","context":"The article cites ZeroBAC analysis of an EvilTokens device code phishing flow that abused a legacy email alias and multiple redirect hops.","category":"","primary":false}],"body":"\u003cp\u003eA new phishing-as-a-service operation called \u003cstrong\u003eForg365\u003c/strong\u003e is targeting Microsoft 365 accounts using device code phishing, adversary-in-the-middle tactics, antibot evasion, AI-assisted lure creation, and post-compromise mailbox operations. The service is distributed via Telegram and costs \u003cspan class=\"math inline\"\u003e\\(400 per month or \\)\u003c/span\u003e3,800 per year. Its attack chains use legitimate email delivery infrastructure such as Amazon SES and Twilio SendGrid to make phishing lures blend into regular email traffic before redirecting victims to Forg365-controlled domains.\u003c/p\u003e\n\n\u003cp\u003eZeroBAC said Forg365 exposes a mature operator workflow that includes lure generation, campaign sending, SMTP rotation, AI email generation, token vaulting, account intelligence, keyword alerts, viewer links, and browser-extension support. The platform includes a device-auth phishing branch that presents a Microsoft-styled verification code page and pushes the victim into a legitimate Microsoft Authentication Broker sign-in flow, where the code authorizes an attacker-controlled session. For adversary-in-the-middle phishing, it uses route tokens, session cookies, and traffic classification to decide whether to show phishing content or a benign decoy, including redirecting VPN users to innocuous content.\u003c/p\u003e\n\n\u003cp\u003eForg365 also includes a Chromium-based browser extension called ForgCookie that is designed to maintain access to compromised Microsoft accounts by refreshing and injecting Microsoft session cookies. The platform supports post-compromise actions such as monitoring compromised mailboxes for specific keywords and drafting replies to email threads with AI assistance. The article recommends blocking device code authentication unless required, reviewing mailbox artifacts after device code events, auditing mail-flow rules, and decommissioning legacy aliases that no longer correspond to active employees.\u003c/p\u003e\n"},{"n":1,"title":"New CrashStealer malware poses as Apple crash reporting tool","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-crashstealer-malware-poses-as-apple-crash-reporting-tool/","time":"19:04","priority":"SHOULD READ","score":85,"tldr":"A new macOS infostealer called CrashStealer is impersonating Apple’s CrashReporter tool and using a signed, notarized installer to bypass Gatekeeper and trick users into entering their password. It steals Keychain data, browser credentials, password manager data, crypto wallets, and files before encrypting and exfiltrating them to its C2 server.","briefOverview":"\u003cp\u003eA new macOS information-stealing malware called CrashStealer is pretending to be Apple’s crash-reporting tool to steal credentials, Keychain data, and cryptocurrency wallets. Researchers began tracking it in May while it appeared to still be in development, and observed it being used in attacks in early July. The malware’s binary uses the name “CrashReporter.app,” creates a LaunchAgent named “com.apple.crashreporter.helper,” and uses the legitimate tool’s icon and metadata to look like an Apple component.\u003c/p\u003e\n\n\u003cp\u003eJamf researchers say CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” which allows it to bypass macOS Gatekeeper without warnings. When launched, it displays a fake macOS password prompt and validates the entered password locally using the dscl command-line tool. CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.\u003c/p\u003e\n\n\u003cp\u003eBefore exfiltrating stolen data, CrashStealer encrypts it with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl. Jamf says CrashStealer is distinct from other infostealer families because of its client-side encryption mechanism and native C++ implementation. The campaign uses a fake software site registered in late June, with downloads gated behind a meeting PIN, and Jamf’s report provides indicators of compromise including malicious tool names, hashes, delivery infrastructure, and filesystem artifacts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrashStealer is a new macOS information-stealing malware that impersonates Apple's CrashReporter.app to steal credentials, Keychain data, and cryptocurrency wallets.","Jamf researchers reported that CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” allowing it to bypass macOS Gatekeeper without warnings.","When launched, CrashStealer shows a fake macOS password prompt and validates the entered password locally using the dscl command-line tool.","CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.","Before exfiltration, CrashStealer encrypts stolen data with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl."],"insights":["CrashStealer’s signed and Apple-notarized installer shows that macOS Gatekeeper may not warn users even when the delivered application is malicious.","The fake software site requires a meeting PIN before downloading the payload, which Jamf says indicates the campaign is limited to visitors who provide the right code.","CrashStealer re-signs itself for persistence, rewriting code-signature data so the binary’s hash changes even though the code remains untouched.","Jamf highlighted CrashStealer as distinct from other macOS infostealers because it uses client-side AES-256-GCM encryption and is implemented natively in C++."],"referencedReports":[{"title":"CrashStealer macOS Infostealer Analysis","url":"https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/","publisher":"Jamf","context":"The article cites Jamf's analysis and report for details on CrashStealer’s targeted data, behavior, delivery infrastructure, filesystem artifacts, and indicators of compromise.","category":"","primary":false}],"body":"\u003cp\u003eA new macOS information-stealing malware called CrashStealer is pretending to be Apple’s crash-reporting tool to steal credentials, Keychain data, and cryptocurrency wallets. Researchers began tracking it in May while it appeared to still be in development, and observed it being used in attacks in early July. The malware’s binary uses the name “CrashReporter.app,” creates a LaunchAgent named “com.apple.crashreporter.helper,” and uses the legitimate tool’s icon and metadata to look like an Apple component.\u003c/p\u003e\n\n\u003cp\u003eJamf researchers say CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” which allows it to bypass macOS Gatekeeper without warnings. When launched, it displays a fake macOS password prompt and validates the entered password locally using the dscl command-line tool. CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.\u003c/p\u003e\n\n\u003cp\u003eBefore exfiltrating stolen data, CrashStealer encrypts it with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl. Jamf says CrashStealer is distinct from other infostealer families because of its client-side encryption mechanism and native C++ implementation. The campaign uses a fake software site registered in late June, with downloads gated behind a meeting PIN, and Jamf’s report provides indicators of compromise including malicious tool names, hashes, delivery infrastructure, and filesystem artifacts.\u003c/p\u003e\n"},{"n":8,"title":"EU sanctions Russian GRU military hackers over cyberattacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/eu-and-uk-hit-russia-with-first-joint-cyber-sanctions-package/","time":"11:19","priority":"SHOULD READ","score":85,"tldr":"The EU and UK sanctioned Russian GRU, FSB-linked hackers, cybercriminals, and supporting entities accused of coordinating cyberattacks and influence operations across Europe. Officials tied Russia’s cyber ecosystem to attacks on government networks, critical infrastructure, and Poland’s energy sector.","briefOverview":"\u003cp\u003eThe European Union and the United Kingdom jointly sanctioned Russian individuals and entities accused of supporting cyberattacks and hybrid operations across Europe. The EU sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, while the UK sanctioned 24 individuals and entities. The UK designations included senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko, members of IMPULS, people tied to Lumma Stealer, and individuals connected to Rybar LLC.\u003c/p\u003e\n\n\u003cp\u003eThe Council of the EU also identified the 16th Centre of Russia’s Federal Security Service as controlling several cyber threat groups, including Turla. Officials said this unit has targeted government networks and critical infrastructure in countries including France, Germany, Poland, Cyprus, the Netherlands, Austria, Slovakia, Romania, and Finland since 2010. Turla was linked to a recent failed strike against Poland’s critical infrastructure, including energy grid organizations, which officials said could have cut power to roughly 500,000 people during winter.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites a late-December cyberattack on Poland’s power grid that damaged key operational technology equipment beyond repair but did not disrupt power. That incident was later attributed to Sandworm, which attempted to deploy DynoWiper data-wiping malware and disable compromised devices. The sanctions follow a January European Commission proposal for new cybersecurity legislation and earlier EU sanctions against Chinese and Iranian companies accused of coordinating cyberattacks on EU critical infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Union sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, while the United Kingdom separately sanctioned 24 individuals and entities tied to Russian cyber and hybrid operations.","The United Kingdom sanctioned senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko, members of the IMPULS company, people tied to the Lumma Stealer malware operation, and ten people connected to Rybar LLC.","The Council of the European Union publicly identified the 16th Centre of Russia's Federal Security Service as controlling several cyber threat groups, including Turla.","Officials said Russia-linked groups targeted government networks and critical infrastructure in multiple European countries and linked Turla to a failed strike against Poland's critical infrastructure that could have cut power to roughly 500,000 people during winter.","A late-December cyberattack on Poland's power grid damaged key operational technology equipment beyond repair but failed to disrupt power, and was later attributed to the Russian state-backed hacking group Sandworm."],"insights":["The sanctions target not only state intelligence officers but also private companies, cybercriminals, self-described hacktivists, malware operators, and media figures, showing that EU and UK officials view Russia’s cyber activity as a coordinated ecosystem rather than isolated government hacking.","The article links cyber operations to potential physical-world harm, noting that a failed attack on Polish energy organizations could have cut power to roughly 500,000 people during winter.","The EU publicly naming the FSB’s 16th Centre as controlling groups including Turla is notable because it connects a long-running hacking group to a specific Russian security service unit.","The UK’s link between the Lumma Stealer operation and at least 2,100 domestic victims over six months shows that the sanctions also address financially harmful malware activity affecting individuals and organizations inside the UK."],"referencedReports":[],"body":"\u003cp\u003eThe European Union and the United Kingdom jointly sanctioned Russian individuals and entities accused of supporting cyberattacks and hybrid operations across Europe. The EU sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, while the UK sanctioned 24 individuals and entities. The UK designations included senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko, members of IMPULS, people tied to Lumma Stealer, and individuals connected to Rybar LLC.\u003c/p\u003e\n\n\u003cp\u003eThe Council of the EU also identified the 16th Centre of Russia’s Federal Security Service as controlling several cyber threat groups, including Turla. Officials said this unit has targeted government networks and critical infrastructure in countries including France, Germany, Poland, Cyprus, the Netherlands, Austria, Slovakia, Romania, and Finland since 2010. Turla was linked to a recent failed strike against Poland’s critical infrastructure, including energy grid organizations, which officials said could have cut power to roughly 500,000 people during winter.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites a late-December cyberattack on Poland’s power grid that damaged key operational technology equipment beyond repair but did not disrupt power. That incident was later attributed to Sandworm, which attempted to deploy DynoWiper data-wiping malware and disable compromised devices. The sanctions follow a January European Commission proposal for new cybersecurity legislation and earlier EU sanctions against Chinese and Iranian companies accused of coordinating cyberattacks on EU critical infrastructure.\u003c/p\u003e\n"},{"n":4,"title":"Hackers backdoor Jscrambler npm package with infostealer malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-backdoor-jscrambler-npm-package-with-infostealer-malware/","time":"19:44","priority":"SHOULD READ","score":84,"tldr":"Jscrambler disclosed that attackers used compromised npm publishing credentials to release malicious versions of its package containing infostealer malware, resulting in about 1,500 downloads before removal. Developers who installed the affected versions should treat their environments as compromised, rotate secrets, and update to the latest safe release.","briefOverview":"\u003cp\u003eJscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package, which is used with the company’s Code Integrity product. The affected releases were 8.14, 8.16, 8.17, and 8.20, and they included information-stealing malware that executed during the preinstall hook. Jscrambler said the incident was limited to that package and did not affect other products, including Webpage Integrity.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package remained available for about two hours before Jscrambler deprecated it and released safe version 8.22. npm statistics showed that the malicious package was downloaded 1,479 times during that window. The affected package was also a dependency for four other Jscrambler packages, which the company deprecated and replaced with new versions.\u003c/p\u003e\n\n\u003cp\u003eSocket detected and analyzed the compromise, reporting that the malware targeted source code, developer credentials, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging apps. Socket also reported that the malware used strong per-string obfuscation with the ChaCha20-Poly1305 encryption algorithm, making the code difficult to reverse-engineer. Jscrambler said the compromise was possible because of compromised npm publishing credentials, which it revoked, and advised affected developers to treat their environments as compromised, rotate all secrets, and restore from safe backups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package used with the company’s Code Integrity product.","The malicious releases, versions 8.14, 8.16, 8.17, and 8.20, included information-stealing malware that executed during the preinstall hook.","The malicious package remained available for about two hours, was downloaded 1,479 times, and was replaced by safe version 8.22.","Socket reported that the malware targeted source code, developer secrets, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging app data.","Jscrambler said the incident was caused by compromised npm publishing credentials, which it revoked, and advised affected developers to treat environments as compromised and rotate all secrets."],"insights":["The malicious package was live for only two hours but still reached 1,479 downloads, showing how quickly a compromised npm package can spread through developer environments.","Because the compromised package was also a dependency for four other Jscrambler packages, users could have been exposed even if they installed one of those related packages rather than the main jscrambler package directly.","The malware targeted a broad mix of developer, cloud, browser, messaging, AI coding tool, and cryptocurrency data, so Jscrambler’s guidance to rotate all secrets is more practical than trying to identify only one affected credential type.","Socket reported that the malware used ChaCha20-Poly1305 per-string obfuscation, making analysis harder even though the package was removed quickly."],"referencedReports":[{"title":"Security Advisory: Malicious npm Package","url":"http://jscrambler.com/blog/security-advisory-malicious-npm-package","publisher":"Jscrambler","context":"The article cites Jscrambler’s warning about the unauthorized publication of malicious versions of its npm package and the company’s response.","category":"","primary":false},{"title":"Jscrambler Supply Chain Attack","url":"https://socket.dev/blog/jscrambler-supply-chain-attack","publisher":"Socket","context":"The article references Socket’s analysis of the compromised Jscrambler npm release, including the types of data targeted and the malware’s obfuscation technique.","category":"","primary":false}],"body":"\u003cp\u003eJscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package, which is used with the company’s Code Integrity product. The affected releases were 8.14, 8.16, 8.17, and 8.20, and they included information-stealing malware that executed during the preinstall hook. Jscrambler said the incident was limited to that package and did not affect other products, including Webpage Integrity.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package remained available for about two hours before Jscrambler deprecated it and released safe version 8.22. npm statistics showed that the malicious package was downloaded 1,479 times during that window. The affected package was also a dependency for four other Jscrambler packages, which the company deprecated and replaced with new versions.\u003c/p\u003e\n\n\u003cp\u003eSocket detected and analyzed the compromise, reporting that the malware targeted source code, developer credentials, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging apps. Socket also reported that the malware used strong per-string obfuscation with the ChaCha20-Poly1305 encryption algorithm, making the code difficult to reverse-engineer. Jscrambler said the compromise was possible because of compromised npm publishing credentials, which it revoked, and advised affected developers to treat their environments as compromised, rotate all secrets, and restore from safe backups.\u003c/p\u003e\n"},{"n":14,"title":"CrashStealer macOS Malware Uses Notarized Dropper to Pass Gatekeeper Checks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/crashstealer-macos-malware-uses.html","time":"17:36","priority":"SHOULD READ","score":84,"tldr":"Researchers found CrashStealer, a new native C++ macOS infostealer delivered through a signed and Apple-notarized dropper that can pass Gatekeeper checks. It steals browser credentials, crypto wallet data, password manager data, files, and keychain material before encrypting and exfiltrating it to attacker infrastructure.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a new macOS information stealer called CrashStealer that can harvest sensitive data from compromised systems. Jamf Threat Labs said the malware is implemented in native C++, unlike other stealers built on AppleScript droppers or Objective-C-based wrappers. The malware validates the victim’s login password locally before collecting data, encrypts harvested files with AES-GCM, and exfiltrates them over libcurl.\u003c/p\u003e\n\n\u003cp\u003eCrashStealer is distributed through a signed and Apple-notarized dropper delivered as a disk image named “Werkbit.app.” Because both the disk image and binary are notarized and use a valid developer ID, the dropper passes Gatekeeper checks. The download is served from werkbit[.]io and is gated behind a meeting PIN, while additional domains and shared backend infrastructure suggest the operation is part of a larger, multi-platform campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter launch, the dropper contacts a GitHub repository to retrieve “sys.cache,” extracts a curl command, and downloads a shell script that stages “CrashReporter.dmg” in the /tmp directory. The malware establishes persistence as a LaunchAgent, resists analysis, unlocks the login keychain using the validated password, and collects browser credentials, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads. The harvested data is packaged into a ZIP archive and sent to an attacker-controlled server at 179.43.166[.]242.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrashStealer is a new macOS information stealer implemented in native C++ and analyzed by Jamf Threat Labs.","CrashStealer is distributed through a signed and Apple-notarized dropper named Werkbit.app, allowing it to pass Gatekeeper checks because the disk image and binary are notarized and use a valid developer ID.","The dropper contacts a GitHub repository to retrieve a file named sys.cache, uses it to extract a curl command, and downloads a shell script that fetches and stages CrashReporter.dmg in the /tmp directory.","After execution, CrashStealer establishes persistence as a LaunchAgent, validates the victim’s login password locally, unlocks the login keychain, and collects browser data, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads.","The harvested data is packaged into a ZIP archive, encrypted with AES-GCM, and exfiltrated to an attacker-controlled server at 179.43.166[.]242."],"insights":["The campaign’s use of a signed and Apple-notarized dropper shows that passing Gatekeeper checks is not sufficient evidence that a macOS app is safe.","The download being gated behind a meeting PIN indicates the operators limited access to the installer rather than openly serving it to every visitor.","CrashStealer validates the victim’s login password locally before stealing data, allowing it to unlock the login keychain as part of its collection process.","Jamf assessed that shared backend infrastructure and additional related domains point to CrashStealer being part of a larger, multi-platform campaign.","CrashStealer’s use of native C++, AES-GCM encryption, encrypted strings, control-flow flattening, and layered anti-debugging distinguishes it from more common macOS stealers built with AppleScript droppers or Objective-C wrappers."],"referencedReports":[{"title":"CrashStealer macOS Infostealer Analysis","url":"https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/","publisher":"Jamf Threat Labs","context":"The article cites Jamf Threat Labs' analysis as the source for technical details about CrashStealer’s implementation, delivery chain, data collection, encryption, exfiltration, persistence, and anti-analysis behavior.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a new macOS information stealer called CrashStealer that can harvest sensitive data from compromised systems. Jamf Threat Labs said the malware is implemented in native C++, unlike other stealers built on AppleScript droppers or Objective-C-based wrappers. The malware validates the victim’s login password locally before collecting data, encrypts harvested files with AES-GCM, and exfiltrates them over libcurl.\u003c/p\u003e\n\n\u003cp\u003eCrashStealer is distributed through a signed and Apple-notarized dropper delivered as a disk image named “Werkbit.app.” Because both the disk image and binary are notarized and use a valid developer ID, the dropper passes Gatekeeper checks. The download is served from werkbit[.]io and is gated behind a meeting PIN, while additional domains and shared backend infrastructure suggest the operation is part of a larger, multi-platform campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter launch, the dropper contacts a GitHub repository to retrieve “sys.cache,” extracts a curl command, and downloads a shell script that stages “CrashReporter.dmg” in the /tmp directory. The malware establishes persistence as a LaunchAgent, resists analysis, unlocks the login keychain using the validated password, and collects browser credentials, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads. The harvested data is packaged into a ZIP archive and sent to an attacker-controlled server at 179.43.166[.]242.\u003c/p\u003e\n"},{"n":5,"title":"Lidl discloses online shop breach after service provider hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lidl-discloses-online-shop-breach-after-service-provider-hack/","time":"14:19","priority":"SHOULD READ","score":82,"tldr":"Lidl warned online shop customers in Germany, Belgium, and the Netherlands that attackers stole personal data from a separately stored file after hacking an IT service provider. The company says the shop system itself was not affected, but it cannot yet rule out exposure of passwords, addresses, bank details, or payment information.","briefOverview":"\u003cp\u003eGerman discount supermarket chain Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at a service provider. The incident affected customers who used Lidl\u0026rsquo;s online shop. Lidl said the online shop\u0026rsquo;s system itself was not affected.\u003c/p\u003e\n\n\u003cp\u003eAccording to Lidl, unknown individuals briefly gained access to a separately stored file containing customer data and stole part of the data from it. The stolen information includes salutation, first and last name, telephone number, email address, date of birth, and customer number. Lidl said it cannot yet rule out that passwords, billing and delivery addresses, bank details, or other payment information may also be involved.\u003c/p\u003e\n\n\u003cp\u003eThe hacked IT service provider filed a police report and engaged IT forensic experts to investigate the full scope and impact of the incident. Lidl also notified the Dutch Data Protection Authority of the data breach. The company warned affected customers to be alert for possible phishing attempts or identity fraud and to verify unexpected messages before clicking links or providing data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at an IT service provider.","The breach involved a separately stored file containing online shop customer data, while Lidl said the online shop system itself was not affected.","The stolen data includes salutation, first and last name, telephone number, email address, date of birth, and customer number.","Lidl said it cannot yet rule out that affected customers' passwords, billing and delivery addresses, bank details, or other payment information may also be involved.","The hacked IT service provider filed a police report and engaged IT forensic experts, while Lidl notified the Dutch Data Protection Authority and warned customers about possible phishing attempts or identity fraud."],"insights":["Lidl’s statement that the online shop system was not affected but a separately stored customer file was accessed shows the risk came through data held outside the main shopping platform.","The investigation is still incomplete because Lidl has confirmed some stolen customer fields but says it cannot yet rule out exposure of passwords, addresses, bank details, or payment information.","The stolen data is sufficient to make phishing attempts more convincing because it includes names, phone numbers, email addresses, dates of birth, and customer numbers.","The incident has cross-border impact, with customer notifications in Germany, Belgium, and the Netherlands and a report made to the Dutch Data Protection Authority."],"referencedReports":[],"body":"\u003cp\u003eGerman discount supermarket chain Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at a service provider. The incident affected customers who used Lidl\u0026rsquo;s online shop. Lidl said the online shop\u0026rsquo;s system itself was not affected.\u003c/p\u003e\n\n\u003cp\u003eAccording to Lidl, unknown individuals briefly gained access to a separately stored file containing customer data and stole part of the data from it. The stolen information includes salutation, first and last name, telephone number, email address, date of birth, and customer number. Lidl said it cannot yet rule out that passwords, billing and delivery addresses, bank details, or other payment information may also be involved.\u003c/p\u003e\n\n\u003cp\u003eThe hacked IT service provider filed a police report and engaged IT forensic experts to investigate the full scope and impact of the incident. Lidl also notified the Dutch Data Protection Authority of the data breach. The company warned affected customers to be alert for possible phishing attempts or identity fraud and to verify unexpected messages before clicking links or providing data.\u003c/p\u003e\n"},{"n":13,"title":"VPN service favored by ransomware groups is sanctioned by US","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/first-vpn-administrator-us-sanctions-ransomware-groups","time":"18:50","priority":"SHOULD READ","score":82,"tldr":"The U.S. sanctioned First VPN Service and its Ukrainian administrator for helping ransomware gangs hide their identities and infrastructure while attacking U.S. critical sectors. A Belarusian seller of malware-obfuscation tools was also sanctioned as part of a broader effort to disrupt cybercrime service providers.","briefOverview":"\u003cp\u003eThe U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses. The Treasury Department said 1VPNS helped ransomware groups hide their identities, disguise malicious software, and evade detection. It said those attacks caused billions of dollars in losses to U.S. critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions mean no one in the U.S. can complete transactions with the designees, and the article notes that sanctions are also a reputational blow that often leads to lower business revenues. A Belarusian national, Yegeniy Vladimirovich Silayev, was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files. European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses.","The Treasury Department said First VPN Service helped ransomware groups hide their identities, disguise malicious software, and evade detection, enabling attacks that caused billions of dollars in losses to U.S. critical infrastructure providers.","The Treasury Department said Rashevskyi used fake identities to buy infrastructure from companies that might otherwise refuse to do business with him due to abuse complaints tied to 1VPNS servers.","Belarusian national Yegeniy Vladimirovich Silayev was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files.","European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity."],"insights":["The sanctions focus on the support ecosystem around ransomware, not only the operators, because the Treasury said disrupting service providers and tool suppliers can affect many gangs at once.","First VPN marketed its refusal to keep logs or cooperate with law enforcement as a selling point, showing that noncooperation itself was used to attract criminal customers.","Rashevskyi’s alleged use of fake identities to buy infrastructure highlights that abuse complaints from internet service providers can make hosting access harder for criminal services.","The sanctions may harm the designees beyond legal restrictions because the article notes that sanctions are a reputational blow that often leads to lower business revenues."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses. The Treasury Department said 1VPNS helped ransomware groups hide their identities, disguise malicious software, and evade detection. It said those attacks caused billions of dollars in losses to U.S. critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions mean no one in the U.S. can complete transactions with the designees, and the article notes that sanctions are also a reputational blow that often leads to lower business revenues. A Belarusian national, Yegeniy Vladimirovich Silayev, was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files. European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity.\u003c/p\u003e\n"},{"n":19,"title":"Google and Microsoft Pull ModHeader With 1.6 Million Installs After Dormant Collector Found","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/google-and-microsoft-pull-modheader.html","time":"17:17","priority":"SHOULD READ","score":82,"tldr":"Google and Microsoft removed the popular ModHeader browser extension after researchers found a dormant browsing-history collection system hidden in the official Chrome and Edge versions. Although the collector’s allow-list was empty and no exfiltration was proven, it could have been activated through a routine update without new permissions.","briefOverview":"\u003cp\u003eGoogle and Microsoft removed ModHeader, a popular header-editing browser extension with about 1.6 million installs across Chrome and Edge, after researchers found a hidden browsing-history collector in the official store version. Stripe OLT analyzed the Chrome build, checked the code against Google’s Web Store signature, and confirmed the collector was inside the genuine extension rather than a counterfeit. Microsoft pulled the Edge listing on July 3, and Google removed the Chrome listing on July 10.\u003c/p\u003e\n\n\u003cp\u003eThe collector was dormant because an internal allow-list shipped empty, and the article says there is no proof it ever gathered or sent browsing domains. In version 7.0.18, the same minified background code that supported normal header editing also contained logic to build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the bundle once a day to api.stanfordstudies.com. Separate analyses by HackIndex and researcher Yunus Aydin described the same pipeline in versions 7.0.18 and 7.0.17.\u003c/p\u003e\n\n\u003cp\u003eThe article says the design is significant because the collector could have been activated by populating the allow-list through a routine update without new permissions or a user click. Automated checkers had rated ModHeader low risk, while the encrypted data, dormant upload path, minified code, unflagged endpoints, and signed popular extension status could frustrate different checks. Users are advised to remove ModHeader, prevent sync or managed policies from reinstalling it, and rotate secrets such as API keys, bearer tokens, and session cookies if they pasted them into the extension.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google and Microsoft removed the ModHeader browser extension from Chrome and Edge after researchers found a hidden browsing-history collector in the official store version.","Researchers said the collector was dormant because an internal allow-list shipped empty, and no proof has emerged that it ever collected or sent browsing domains.","The extension’s code could build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the data once a day to api.stanfordstudies.com if enabled.","The extension also pinged extensions-hub.com on install, update, and uninstall with the product, version, and browser.","Users are advised to remove ModHeader, ensure browser sync or managed policies do not reinstall it, and rotate any secrets such as API keys, bearer tokens, or session cookies that were pasted into it."],"insights":["A store signature only confirmed that the suspicious code came from the genuine ModHeader extension, not that the code was safe or consistent with the extension’s advertised purpose.","The collector’s empty allow-list made the upload path invisible during normal testing while leaving the endpoint, encryption key, scheduler, fingerprinting logic, and local storage logic already present on users’ machines.","Automated extension risk tools rated ModHeader as low risk even though its design combined encrypted data, dormant uploads, minified code, new endpoints, and the trust of a popular signed extension.","The article highlights that a routine extension update could have activated the collector by populating the allow-list without requiring new browser permissions or a user click.","Users who pasted API keys, bearer tokens, or session cookies into ModHeader face a separate risk because researchers found its header-history feature storing full HTTP headers on disk."],"referencedReports":[{"title":"Chrome Extension Hidden Data Exfiltration 900k Users","url":"https://stripeolt.com/knowledge-hub/threat-research/chrome-extension-hidden-data-exfiltration-900k-users/","publisher":"Stripe OLT","context":"The article says Stripe OLT analyzed ModHeader’s code, checked it against Google’s Web Store signature, and published hunting queries for defenders.","category":"","primary":false},{"title":"ModHeader Malware Chrome Spyware","url":"https://hackindex.io/research/modheader-malware-chrome-spyware","publisher":"HackIndex","context":"The article cites HackIndex as a separate teardown of ModHeader version 7.0.18 that described the same data collection and upload pipeline.","category":"","primary":false},{"title":"ModHeader Data Exfiltration StanfordStudies","url":"https://aydinnyunus.github.io/2026/07/12/modheader-data-exfiltration-stanfordstudies/","publisher":"Yunus Aydin","context":"The article cites researcher Yunus Aydin’s analysis of ModHeader version 7.0.17 as another teardown describing the same pipeline.","category":"","primary":false}],"body":"\u003cp\u003eGoogle and Microsoft removed ModHeader, a popular header-editing browser extension with about 1.6 million installs across Chrome and Edge, after researchers found a hidden browsing-history collector in the official store version. Stripe OLT analyzed the Chrome build, checked the code against Google’s Web Store signature, and confirmed the collector was inside the genuine extension rather than a counterfeit. Microsoft pulled the Edge listing on July 3, and Google removed the Chrome listing on July 10.\u003c/p\u003e\n\n\u003cp\u003eThe collector was dormant because an internal allow-list shipped empty, and the article says there is no proof it ever gathered or sent browsing domains. In version 7.0.18, the same minified background code that supported normal header editing also contained logic to build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the bundle once a day to api.stanfordstudies.com. Separate analyses by HackIndex and researcher Yunus Aydin described the same pipeline in versions 7.0.18 and 7.0.17.\u003c/p\u003e\n\n\u003cp\u003eThe article says the design is significant because the collector could have been activated by populating the allow-list through a routine update without new permissions or a user click. Automated checkers had rated ModHeader low risk, while the encrypted data, dormant upload path, minified code, unflagged endpoints, and signed popular exte
