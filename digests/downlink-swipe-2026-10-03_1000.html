<script type="application/json" id="dl-articles">[{"n":2,"title":"Salesforce Sites Phishing: The Attacker Owned Nothing","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/salesforce-sites-phishing-attacker-owned-nothing","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing campaign abused legitimate subscription-billing email infrastructure, Salesforce Sites hosting, and Wikimedia branding, so SPF, DKIM, and DMARC all appeared valid despite a credential-harvesting lure. The key detection signal was behavioral: a first-time sender impersonating Salesforce in the From local part and requesting login credentials or an Organization ID by reply.","briefOverview":"\u003cp\u003eA UK consumer fintech received a malicious email claiming that its Salesforce organization had been temporarily deactivated. The email was sent through a subscription billing platform’s legitimate production transactional mail service and carried valid DKIM, SPF, and DMARC results at the organization’s inbound gateway. A human analyst confirmed the message was malicious and quarantined it.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page was hosted on a genuine Salesforce Sites organization, and the Salesforce logo was loaded from Wikimedia Commons, leaving the attacker without an obvious malicious domain or image host. The organization’s secure email gateway rewrote URLs for click protection, which caused DKIM to fail later at Microsoft 365 even though ARC records preserved the original authentication passes. The message also offered a no-click route by asking the recipient to reply with an Organization ID, bypassing link rewriting, sandboxing, and click-event monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that sender authentication and reputation systems cannot determine whether a legitimate sender is making a deceptive request. It identifies behavioral signals as more useful in this case, including a first-time sender using a major SaaS brand in the sender’s local part while sending from an unrelated domain. It recommends hunting for that sender pattern and using phishing-resistant MFA and conditional access to reduce the impact of stolen credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A UK consumer fintech received a malicious email impersonating Salesforce that was delivered through a subscription billing platform’s legitimate transactional email service with valid sender authentication.","The credential-harvesting page was hosted on a genuine Salesforce Sites organization, while the impersonated Salesforce logo was loaded from Wikimedia Commons.","The organization’s secure email gateway rewrote body URLs for click protection, causing the original DKIM signature to fail at Microsoft 365 even though the inbound gateway’s ARC records preserved the original passing authentication results.","The email also asked the recipient to reply with an Organization ID, creating a no-click path that would not trigger URL rewriting, sandboxing, or click-event monitoring.","The article concludes that behavioral signals, such as a first-time sender using a major SaaS brand in the sender name and requesting account access or identifiers, are important when attackers abuse legitimate third-party infrastructure."],"insights":["Valid email authentication can confirm that a legitimate vendor’s mail system sent a message without validating the truthfulness of the sender’s local part or the request made in the email.","URL rewriting by a recipient’s own email gateway can break downstream DKIM verification, so final-hop authentication failures may reflect defensive processing rather than a forged message.","A reply-based request for an Organization ID bypasses link-focused controls because it produces no rewritten URL, sandbox detonation, or click event.","A practical hunt proposed by the article is to identify first-time senders whose local part uses a major SaaS brand while their domain has no legitimate business relationship to that brand.","Shared platforms such as Salesforce Sites and Wikimedia Commons reduce the usefulness of domain and image reputation because blocking the entire legitimate service is impractical."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites this report for statistics on pretexting, phishing, credential use, the human element in breaches, and blocked-attack gateway mix.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA guidance when recommending phishing-resistant MFA and conditional access controls.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites this report alongside CISA guidance to support phishing-resistant MFA and conditional access.","category":"research","primary":false},{"title":"Cost of a Data Breach Report 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article references IBM's report to argue that investment in preventative controls is preferable to the costs of a data breach.","category":"research","primary":false}],"body":"\u003cp\u003eA UK consumer fintech received a malicious email claiming that its Salesforce organization had been temporarily deactivated. The email was sent through a subscription billing platform’s legitimate production transactional mail service and carried valid DKIM, SPF, and DMARC results at the organization’s inbound gateway. A human analyst confirmed the message was malicious and quarantined it.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page was hosted on a genuine Salesforce Sites organization, and the Salesforce logo was loaded from Wikimedia Commons, leaving the attacker without an obvious malicious domain or image host. The organization’s secure email gateway rewrote URLs for click protection, which caused DKIM to fail later at Microsoft 365 even though ARC records preserved the original authentication passes. The message also offered a no-click route by asking the recipient to reply with an Organization ID, bypassing link rewriting, sandboxing, and click-event monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that sender authentication and reputation systems cannot determine whether a legitimate sender is making a deceptive request. It identifies behavioral signals as more useful in this case, including a first-time sender using a major SaaS brand in the sender’s local part while sending from an unrelated domain. It recommends hunting for that sender pattern and using phishing-resistant MFA and conditional access to reduce the impact of stolen credentials.\u003c/p\u003e\n"},{"n":1,"title":"The State of Cybersecurity in 2026: Key Segments, Insights, and Innovations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/the-state-of-cybersecurity-in-2026key.html","time":"11:00","priority":"MAY READ","score":35,"tldr":"This sponsored 2026 cybersecurity report argues that organizations must shift to continuous, integrated risk management across identities, telemetry, endpoints, cloud environments, connected devices, and human threats. It highlights vendor perspectives on using automation and AI to improve visibility, remediation, and security operations at scale.","briefOverview":"\u003cp\u003eThe report examines how cybersecurity is changing as organizations expand their use of cloud infrastructure, AI, distributed systems, and connected environments. It says security teams must manage more identities, devices, data, and internet-facing infrastructure, with threats increasingly moving across systems rather than targeting a single point of failure. The report focuses on continuous visibility, control, and the ability to respond to risk at scale.\u003c/p\u003e\n\n\u003cp\u003eIt covers identity security, telemetry and data management, endpoint management, human risk intelligence, exposure management, human security, email and domain security, connected devices, AI-native security operations, and cloud security. Key themes include least-privilege access, automated patching and remediation, managing security data for reuse, and reducing exposures by identifying ownership and safe corrective actions. It also highlights risks from AI-enabled phishing, voice cloning, deepfakes, impersonation, fraudulent domains, and identity-driven cloud attacks, while presenting AI as a way to support investigations rather than replace human judgment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The report says cybersecurity is being reshaped by expanded cloud infrastructure, AI, distributed systems, and more complex digital environments.","It argues that identity security is becoming more important as cloud services, remote work, automation, and AI agents increase the number of human and non-human identities that need access.","The report states that collecting more security data alone does not ensure better visibility, and organizations are focusing on how data is routed, structured, retained, and reused.","It says AI-powered social engineering is making phishing, voice cloning, deepfakes, and impersonation easier to create and scale, driving a shift toward continuous and personalized human-security programs.","The report describes cloud environments as a major target for attacks driven by stolen or misused identities, credentials, configurations, and cloud controls."],"insights":["The report emphasizes that the value of security telemetry is not its volume but the ability to route, reshape, and reuse it when needed.","It frames exposure management as a process of connecting individual weaknesses to ownership and safe risk-reduction actions, rather than merely finding vulnerabilities.","It treats digital impersonation as a broader public-infrastructure issue involving domains, DNS, certificates, websites, and email rather than an email-only problem.","For connected devices, the report says risk identification must result in controls that are enforced and remain effective as the device fleet grows.","The report presents AI in security operations as a tool to speed investigations and connect evidence while retaining human judgment."],"referencedReports":[],"body":"\u003cp\u003eThe report examines how cybersecurity is changing as organizations expand their use of cloud infrastructure, AI, distributed systems, and connected environments. It says security teams must manage more identities, devices, data, and internet-facing infrastructure, with threats increasingly moving across systems rather than targeting a single point of failure. The report focuses on continuous visibility, control, and the ability to respond to risk at scale.\u003c/p\u003e\n\n\u003cp\u003eIt covers identity security, telemetry and data management, endpoint management, human risk intelligence, exposure management, human security, email and domain security, connected devices, AI-native security operations, and cloud security. Key themes include least-privilege access, automated patching and remediation, managing security data for reuse, and reducing exposures by identifying ownership and safe corrective actions. It also highlights risks from AI-enabled phishing, voice cloning, deepfakes, impersonation, fraudulent domains, and identity-driven cloud attacks, while presenting AI as a way to support investigations rather than replace human judgment.\u003c/p\u003e\n"}]</script>
