<script type="application/json" id="dl-articles">[{"n":2,"title":"China-Linked Hackers Exploit Critical VMware vCenter Zero-Day to Gain Admin Access and Steal Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/china-linked-hackers-exploit-critical.html","time":"06:33","priority":"MUST READ","score":98,"tldr":"China-linked Armory Castle exploited the critical VMware vCenter authentication-bypass zero-day CVE-2026-123890 to obtain administrator access, steal data, and persist across targeted environments. Organizations should urgently apply Broadcom’s November 2026 patches and investigate exposure to associated tools including BONESAW and SAWSNAKE.","briefOverview":"\u003cp\u003eThe suspected China-linked espionage group Armory Castle, formerly UNC5221, exploited the critical VMware vCenter Server zero-day CVE-2026-123890 in early September 2026. The flaw is an unauthenticated authentication bypass in VMware Directory Service that can establish a session as administrator@vsphere.local. Google Threat Intelligence Group and Mandiant said the group used a Golang utility called BONESAW to exploit the issue, obtain data such as the data.mdb database, take over the vCenter Security Token Service, and create an SSO administrator account. Broadcom released patches on November 19, 2026, including vCenter 8.0 U3m and designated Cloud Foundation and vSphere Foundation versions.\u003c/p\u003e\n\n\u003cp\u003eThe vCenter activity was part of a wider campaign that also exploited a BeyondTrust Remote Support zero-day, then moved through an internal Linux appliance toward the virtualized environment. Armory Castle used tools including SLIMSAVAGE and CAGEMATCH web shells, the SAWSNAKE token-forging utility, and BEARBONES and LAZYBONES backdoors. The group scanned for VMware-related ports, enabled vCenter SSH through the VAMI API, created an additional administrator account, enumerated ESXi storage, and stole archived data through the compromised Remote Support appliance. Google said the use of two zero-days and specialized malware for several appliance types demonstrated substantial resources and a sustained effort against high-priority targets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Threat Intelligence Group and Mandiant attributed early September 2026 exploitation of the critical VMware vCenter flaw CVE-2026-123890 to the suspected China-linked group Armory Castle, formerly UNC5221.","CVE-2026-123890 is an unauthenticated VMware Directory Service flaw that can create an authenticated administrator@vsphere.local session, enabling attackers to run commands and obtain files such as the data.mdb database.","Broadcom released fixes for the flaw on November 19, 2026, including VMware vCenter 8.0 U3m and specified VMware Cloud Foundation and vSphere Foundation releases.","Google observed the group using the Golang-based BONESAW utility to exploit the flaw, extract database data, take over the vCenter token service, and create an SSO administrator account.","The campaign also involved web shells, backdoors, internal scanning for VMware-related ports, ESXi file-system reconnaissance, and theft of archived data."],"insights":["The intrusion moved from a compromised BeyondTrust Remote Support device through an internal Linux appliance and into the virtualized environment, showing that the vCenter compromise was part of a broader multi-system campaign rather than an isolated entry point.","After BONESAW accessed vCenter, SAWSNAKE could generate forged login tokens that let the attackers impersonate users and bypass multi-factor authentication through a Golden SAML technique.","The group specifically scanned for ports 9080, 5480, and 2012; port 2012 is the vCenter Single Sign-On control interface used in its remote exploitation workflow.","The attackers established several persistence paths on vCenter and ESXi systems, including a new administrator account, enabled SSH through the VAMI API, and an SSH public key placed in the root account’s authorized keys.","Google said the campaign’s use of two zero-days and several specialized toolsets targeting different appliances indicates substantial resources and operational commitment."],"referencedReports":[{"title":"VMSA-2026-0009","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495","publisher":"broadcom","context":"The article links Broadcom’s security advisory for CVE-2026-123890 and its affected VMware products.","category":"advisory","primary":false},{"title":"VMSA-2026-0009 Security Advisory","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md","publisher":"vmware","context":"The article cites this VMware security-advisory repository entry as the source for the patches released on November 19, 2026.","category":"advisory","primary":false},{"title":"Armory Castle Exploits vSphere","url":"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"google-threat-intelligence-group-and-mandiant","context":"The article relies on Google Threat Intelligence Group and Mandiant’s technical analysis for the attribution, exploitation details, and malware used in the campaign.","category":"research","primary":true}],"body":"\u003cp\u003eThe suspected China-linked espionage group Armory Castle, formerly UNC5221, exploited the critical VMware vCenter Server zero-day CVE-2026-123890 in early September 2026. The flaw is an unauthenticated authentication bypass in VMware Directory Service that can establish a session as administrator@vsphere.local. Google Threat Intelligence Group and Mandiant said the group used a Golang utility called BONESAW to exploit the issue, obtain data such as the data.mdb database, take over the vCenter Security Token Service, and create an SSO administrator account. Broadcom released patches on November 19, 2026, including vCenter 8.0 U3m and designated Cloud Foundation and vSphere Foundation versions.\u003c/p\u003e\n\n\u003cp\u003eThe vCenter activity was part of a wider campaign that also exploited a BeyondTrust Remote Support zero-day, then moved through an internal Linux appliance toward the virtualized environment. Armory Castle used tools including SLIMSAVAGE and CAGEMATCH web shells, the SAWSNAKE token-forging utility, and BEARBONES and LAZYBONES backdoors. The group scanned for VMware-related ports, enabled vCenter SSH through the VAMI API, created an additional administrator account, enumerated ESXi storage, and stole archived data through the compromised Remote Support appliance. Google said the use of two zero-days and specialized malware for several appliance types demonstrated substantial resources and a sustained effort against high-priority targets.\u003c/p\u003e\n"},{"n":1,"title":"New Unpatched Windows 0-Day FastUnlock Lets Someone Holding a Locked PC Run Programs on It","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-unpatched-windows-0-day-fastunlock.html","time":"05:30","priority":"SHOULD READ","score":82,"tldr":"A newly disclosed, unpatched Windows zero-day called FastUnlock can let someone with physical access to a locked PC launch programs under a limited account through lock-screen recovery and Narrator. Until Microsoft releases a fix, use BitLocker startup PINs and shut down or hibernate sensitive devices before they leave your control.","briefOverview":"\u003cp\u003eA newly disclosed, unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in. The method was published by a researcher known as MSNightmare or Nightmare Eclipse, and ThreatLocker said it independently tested and confirmed it works. No Microsoft fix has been released, and the article says there is no evidence that the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eFastUnlock requires physical access, a Microsoft account reachable through lock-screen recovery options, and use of Windows Narrator to navigate the locked screen. ThreatLocker reached a point where it could run a program under WSIAccount, which it identified as a limited, non-administrator account. BitLocker systems that automatically unlock drives through the TPM may still be exposed because the drive is already unlocked by the time the lock screen appears; the article recommends stronger physical controls, a BitLocker startup PIN, and shutting down or hibernating sensitive devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in.","The technique uses Windows Narrator and lock-screen recovery options, requires access to a Microsoft account, and provides only a limited, non-administrator account.","ThreatLocker tested the publicly disclosed technique and reported that it worked, while no Microsoft fix or evidence of real-world exploitation has been reported.","BitLocker configurations that automatically unlock drives through the TPM may not prevent FastUnlock because the drive is already unlocked when the lock screen appears.","Until a patch is available, the article recommends physical device protection, enabling a BitLocker startup PIN, and shutting down or hibernating devices before they leave someone’s control."],"insights":["A standard BitLocker setup that unlocks the drive automatically with the computer’s security chip may not stop this method, because the drive is already available by the time the lock screen appears.","Adding a BitLocker startup PIN is only protective before the computer starts, so it does not help if the device is already running and sitting at its lock screen.","The disclosed method does not defeat disk encryption or provide administrator access; it operates after the system has already unlocked its own drive and reaches a limited account.","The original disclosure contains little written detail, while ThreatLocker’s independent test provides the clearest description of the technique’s practical effect."],"referencedReports":[{"title":"FastUnlock","url":"https://github.com/MSNightmare/FastUnlock","publisher":"msnightmare / nightmare-eclipse","context":"The article cites the researcher's GitHub disclosure, which includes a video and limited written details of the FastUnlock technique.","category":"research","primary":true},{"title":"Proof of Concept for FastUnlock: Windows Lock Screen Bypass from Nightmare Eclipse","url":"https://www.threatlocker.com/blog/proof-of-concept-for-fastunlock-windows-lock-screen-bypass-from-nightmare-eclipse","publisher":"threatlocker","context":"The article relies on ThreatLocker’s independent test as the clearest account of the technique’s practical effect.","category":"research","primary":true},{"title":"BitLocker Countermeasures","url":"https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/countermeasures","publisher":"microsoft","context":"The article cites Microsoft’s guidance recommending a startup PIN and shutting down or hibernating devices against hands-on attackers.","category":"guide","primary":false}],"body":"\u003cp\u003eA newly disclosed, unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in. The method was published by a researcher known as MSNightmare or Nightmare Eclipse, and ThreatLocker said it independently tested and confirmed it works. No Microsoft fix has been released, and the article says there is no evidence that the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eFastUnlock requires physical access, a Microsoft account reachable through lock-screen recovery options, and use of Windows Narrator to navigate the locked screen. ThreatLocker reached a point where it could run a program under WSIAccount, which it identified as a limited, non-administrator account. BitLocker systems that automatically unlock drives through the TPM may still be exposed because the drive is already unlocked by the time the lock screen appears; the article recommends stronger physical controls, a BitLocker startup PIN, and shutting down or hibernating sensitive devices.\u003c/p\u003e\n"}]</script>
