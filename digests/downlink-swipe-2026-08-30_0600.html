<script type="application/json" id="dl-articles">[{"n":1,"title":"ASM Has a Silent C, and It Stands for Change Management","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/asm-has-a-silent-c-and-it-stands-for-change-management/","time":"09:46","priority":"MAY READ","score":55,"tldr":"The article argues that attack surface management should be treated as continuous change management, not just vulnerability tracking, because AI-driven self-service infrastructure is making assets and misconfigurations appear faster. Effective ASM needs frequent discovery, business context, change-aware prioritization, deeper validation, and proof that fixes actually worked.","briefOverview":"\u003cp\u003eThe article argues that attack surface management should be understood as a change management function, not only as a way to support vulnerability management. It says security teams must respond to both external changes, such as new CVEs or public proof of concepts, and internal changes, such as new MCP servers, public API updates, or storage bucket policy changes. The author says this shift matters because AI-assisted self-service infrastructure is allowing more people across organizations to deploy technology, creating more frequent opportunities for risky misconfigurations.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a less-discussed exploit window: the time between a misconfiguration going live and an attacker finding it. It says this window is shrinking while gaps are opening more often, because the number of people able to deploy to production has increased. To keep up, the author says ASM programs need structural discovery that treats the attack surface as a graph of related assets and dependencies, along with rapid run frequency that can reveal changes close to when they occur.\u003c/p\u003e\n\n\u003cp\u003eThe author also says ASM platforms need business and technology context to separate meaningful security changes from routine infrastructure churn, such as dynamic IP changes caused by CDNs, load balancers, and cloud providers. The article argues that prioritization should be recalculated whenever the environment changes and should direct deeper testing toward the assets that matter most. It concludes that remediation must include confirming whether fixes actually worked, because roughly 25% of issues marked resolved still leave the underlying risk open.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that attack surface management should be viewed as a change management function rather than only as support for vulnerability management.","The author says the time between a misconfiguration going live and an attacker finding it is shrinking, while such gaps are appearing more often because more people can deploy to production with AI-assisted self-service infrastructure.","The article states that an attack surface should be treated as a graph of related assets and dependencies, not simply as a list of assets.","The author says daily discovery has become a baseline expectation, citing a 2025 SANS survey in which 59% of respondents preferred daily scan frequency.","The article says remediation should include re-validating fixes because roughly 25% of issues marked resolved still leave the underlying risk open."],"insights":["Security teams should challenge the word “continuous” in ASM tools because the article says some platforms use it for partial, periodic runs spaced weeks or more apart.","Daily discovery without context can make teams “drown faster,” because frequent scanning increases alert volume unless the platform can distinguish meaningful security changes from routine infrastructure churn.","Dynamic IP changes from CDNs, load balancers, and IaaS/PaaS providers can make the same applications look like new alerts unless the ASM platform recognizes that the underlying asset has not meaningfully changed.","A theoretical vulnerability can drop in priority when tested against the real environment, such as when a WAF blocks an SQL injection attempt against an application that appears vulnerable by version.","Remediation tracking should not stop when a ticket is closed because the article says about 25% of issues marked resolved still leave the underlying risk open."],"referencedReports":[{"title":"2025 SANS ASM Survey","url":"https://www.sans.org/white-papers/sans-attack-surface-management-survey-2025","publisher":"SANS","context":"The article cites the survey to support the claim that daily scanning has become the baseline expectation, noting that 59% of respondents preferred daily scan frequency.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that attack surface management should be understood as a change management function, not only as a way to support vulnerability management. It says security teams must respond to both external changes, such as new CVEs or public proof of concepts, and internal changes, such as new MCP servers, public API updates, or storage bucket policy changes. The author says this shift matters because AI-assisted self-service infrastructure is allowing more people across organizations to deploy technology, creating more frequent opportunities for risky misconfigurations.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a less-discussed exploit window: the time between a misconfiguration going live and an attacker finding it. It says this window is shrinking while gaps are opening more often, because the number of people able to deploy to production has increased. To keep up, the author says ASM programs need structural discovery that treats the attack surface as a graph of related assets and dependencies, along with rapid run frequency that can reveal changes close to when they occur.\u003c/p\u003e\n\n\u003cp\u003eThe author also says ASM platforms need business and technology context to separate meaningful security changes from routine infrastructure churn, such as dynamic IP changes caused by CDNs, load balancers, and cloud providers. The article argues that prioritization should be recalculated whenever the environment changes and should direct deeper testing toward the assets that matter most. It concludes that remediation must include confirming whether fixes actually worked, because roughly 25% of issues marked resolved still leave the underlying risk open.\u003c/p\u003e\n"}]</script>
