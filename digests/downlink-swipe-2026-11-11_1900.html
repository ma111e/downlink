<script type="application/json" id="dl-articles">[{"n":2,"title":"Active ScreenConnect attacks breach MSPs, impact dozens of organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations/","time":"22:56","priority":"MUST READ","score":94,"tldr":"Attackers are compromising MSP ScreenConnect environments to push rogue remote-access clients to customer devices, affecting at least six MSPs and 286 endpoints across 47 organizations. ConnectWise and Huntress urge partners to avoid interactive sessions with suspected compromised devices, review Run Command history, revoke sessions, reset credentials, and check for listed indicators of compromise.","briefOverview":"\u003cp\u003eConnectWise is investigating an active campaign targeting managed service providers that uses compromised cloud-hosted ScreenConnect environments to deploy rogue remote-access clients to customer devices. Huntress reported identifying six compromised MSPs and at least 286 affected endpoints across 47 organizations, with totals continuing to rise. The campaign began around 17:47 UTC on the day Huntress reported it.\u003c/p\u003e\n\n\u003cp\u003eAttackers are using ScreenConnect’s Run Command feature to install clients that provide access outside the legitimate MSP environment. Huntress also warned that a technician’s workstation could potentially be compromised when the technician opens a ScreenConnect session with an infected customer device, though the mechanism is unclear. ConnectWise advised partners to avoid interactive sessions with suspected compromised devices, review account activity and Run Command history, revoke active sessions, reset credentials from a trusted device, verify multifactor authentication, and check for the published indicators of compromise.\u003c/p\u003e\n\n\u003cp\u003eHuntress said its telemetry currently points to compromised credentials and hijacked MSP support sessions, but the initial access method has not been determined. Sequential attacker-assigned tags suggest that other MSPs may have been compromised earlier. BleepingComputer also found a July 2026 malicious batch script using one rogue ScreenConnect client ID, although it remains unclear whether that earlier activity is part of the current campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress identified an active campaign in which compromised cloud-hosted ScreenConnect environments at managed service providers were used to deploy rogue ScreenConnect clients to customer devices.","As of Huntress’s report, the campaign had affected six managed service providers and at least 286 endpoints across 47 organizations, with the number continuing to rise.","The attackers used ScreenConnect’s Run Command feature to install remote-access clients outside the legitimate managed service provider’s ScreenConnect environment.","ConnectWise said it was investigating the malicious activity and advised partners to avoid interactive sessions with suspected compromised devices, review account activity, revoke active sessions, reset credentials from a trusted device, and verify multifactor authentication.","Huntress said its telemetry pointed to compromised credentials and hijacked support sessions, but it had not determined how the attackers initially accessed the affected managed service provider environments."],"insights":["The reported risk extends beyond customer devices: Huntress warned that a technician’s own workstation could be compromised when the technician starts a ScreenConnect session with an infected customer device.","Sequential attacker-assigned tags indicate that additional managed service providers may have been compromised before the campaign was detected, so Huntress recommends reviewing Run Command history even when no alert was received.","One rogue ScreenConnect client ID appeared in a malicious Social Security-themed batch script uploaded to VirusTotal in July 2026, showing that the identifier was associated with earlier malware activity.","The earlier script attempted to weaken Microsoft Defender protections, establish automatic startup persistence, download installers, and notify attackers through Telegram after confirming installation."],"referencedReports":[],"body":"\u003cp\u003eConnectWise is investigating an active campaign targeting managed service providers that uses compromised cloud-hosted ScreenConnect environments to deploy rogue remote-access clients to customer devices. Huntress reported identifying six compromised MSPs and at least 286 affected endpoints across 47 organizations, with totals continuing to rise. The campaign began around 17:47 UTC on the day Huntress reported it.\u003c/p\u003e\n\n\u003cp\u003eAttackers are using ScreenConnect’s Run Command feature to install clients that provide access outside the legitimate MSP environment. Huntress also warned that a technician’s workstation could potentially be compromised when the technician opens a ScreenConnect session with an infected customer device, though the mechanism is unclear. ConnectWise advised partners to avoid interactive sessions with suspected compromised devices, review account activity and Run Command history, revoke active sessions, reset credentials from a trusted device, verify multifactor authentication, and check for the published indicators of compromise.\u003c/p\u003e\n\n\u003cp\u003eHuntress said its telemetry currently points to compromised credentials and hijacked MSP support sessions, but the initial access method has not been determined. Sequential attacker-assigned tags suggest that other MSPs may have been compromised earlier. BleepingComputer also found a July 2026 malicious batch script using one rogue ScreenConnect client ID, although it remains unclear whether that earlier activity is part of the current campaign.\u003c/p\u003e\n"},{"n":1,"title":"eMudhra revokes 8 more CA certificates after private key mishap","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/emudhra-revokes-8-more-ca-certificates-after-private-key-mishap/","time":"21:27","priority":"SHOULD READ","score":85,"tldr":"eMudhra revoked eight additional intermediate CA certificates after a faulty key-transfer script exposed RSA private-key material in host memory, bringing the total affected intermediates to 16. The incident prompted major vendors to block the compromised trust chains, and eMudhra plans to exit the publicly trusted TLS certificate business.","briefOverview":"\u003cp\u003eeMudhra revoked eight additional RSA intermediate certificate authority certificates after its investigation found that a custom Python script handled their private-key information in the memory of the computer running it. The revocations bring the total affected intermediates to 16, including eight ECDSA certificates whose private keys were reduced to one byte and could be recovered by trying 256 possible values. The script had been used in April 2025 to transfer certificate authority keys between hardware security modules from different vendors. eMudhra said the RSA keys were not weakened in the same way, but it could not show that they had been handled in accordance with its certificate security policy.\u003c/p\u003e\n\n\u003cp\u003eSome of the affected RSA intermediates had issued TLS and code-signing certificates since May 2026, with the last certificate issued on November 3, and eMudhra said affected customer certificates were replaced or migrated. The company also found that a June 2025 issue involving revocation lists signed by nonmatching keys could have exposed the flawed process earlier, but it corrected the immediate issue without investigating the cause. Mozilla, Google, Apple, and Microsoft released protections to block the compromised eMudhra certificate chains because the recoverable keys could have enabled forged certificates for legitimate websites. eMudhra says it has found no evidence of malicious use, plans to leave the publicly trusted TLS certificate business, and commissioned a KPMG review of its key-management procedures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["eMudhra revoked eight additional RSA intermediate certificate authority certificates after finding that a custom Python key-transfer script processed private-key material in the host computer's memory rather than solely inside secure hardware.","The additional revocations bring the total number of affected eMudhra intermediate certificates to 16, including eight ECDSA certificates whose private keys were reduced to one byte and could be recovered by testing 256 values.","The flawed script was used in April 2025 to transfer certificate authority keys between hardware security module vendors after delays obtaining new hardware.","Mozilla, Google, Apple, and Microsoft released protections to block trust in the compromised eMudhra certificate chains.","eMudhra plans to leave the publicly trusted TLS certificate business, stop issuing under its remaining G1 hierarchy by November 16, and has commissioned a KPMG review expected by December 4."],"insights":["eMudhra revoked the additional RSA intermediates not because they were shown to be weak, but because it could not demonstrate that their private keys had remained protected as required by its own certificate security policy.","A June 2025 mismatch between certificate revocation lists and their corresponding certificate keys was an early indicator of the faulty process, but eMudhra fixed the immediate symptom without investigating its cause.","The flawed transfer process affected both key types differently: eight ECDSA keys became trivially recoverable, while eight RSA keys were exposed to handling in ordinary computer memory.","Some affected RSA intermediates continued issuing certificates from May 2026 until as late as November 3, before their November 7 revocation.","The investigation found that eMudhra lacked checks to verify generated private-key strength and to confirm that signing keys matched those originally created in its secure hardware."],"referencedReports":[{"title":"eMudhra incident report","url":"https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c82","publisher":"emudhra","context":"eMudhra's incident report describes how a custom key-transfer script mishandled ECDSA and RSA private keys, leading to revocations of 16 intermediate CA certificates.","category":"advisory","primary":true}],"body":"\u003cp\u003eeMudhra revoked eight additional RSA intermediate certificate authority certificates after its investigation found that a custom Python script handled their private-key information in the memory of the computer running it. The revocations bring the total affected intermediates to 16, including eight ECDSA certificates whose private keys were reduced to one byte and could be recovered by trying 256 possible values. The script had been used in April 2025 to transfer certificate authority keys between hardware security modules from different vendors. eMudhra said the RSA keys were not weakened in the same way, but it could not show that they had been handled in accordance with its certificate security policy.\u003c/p\u003e\n\n\u003cp\u003eSome of the affected RSA intermediates had issued TLS and code-signing certificates since May 2026, with the last certificate issued on November 3, and eMudhra said affected customer certificates were replaced or migrated. The company also found that a June 2025 issue involving revocation lists signed by nonmatching keys could have exposed the flawed process earlier, but it corrected the immediate issue without investigating the cause. Mozilla, Google, Apple, and Microsoft released protections to block the compromised eMudhra certificate chains because the recoverable keys could have enabled forged certificates for legitimate websites. eMudhra says it has found no evidence of malicious use, plans to leave the publicly trusted TLS certificate business, and commissioned a KPMG review of its key-management procedures.\u003c/p\u003e\n"},{"n":3,"title":"Notion says Fireworks breach exposed customer AI chat transcripts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/notion-says-fireworks-breach-exposed-customer-ai-chat-transcripts/","time":"20:54","priority":"SHOULD READ","score":82,"tldr":"Notion says a breach at AI vendor Fireworks AI exposed Notion AI chat transcripts from its Insights dataset for less than 1% of users. Affected users should review incident notices and rotate any passwords, API keys, or credentials entered in those chats.","briefOverview":"\u003cp\u003eNotion disclosed that a breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts from a small number of workspaces. Fireworks said an attacker accessed its development environment through a third-party cloud provider on October 23, compromising resource metadata, billing information, model weights, and datasets for some customers. Notion learned on November 2 of an exposed dataset that Fireworks initially said contained only synthetic test data, but Fireworks confirmed on November 8 that customer data, including Notion user data, had been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe exposed transcripts came from the dataset for Notion’s Insights feature, which helps workspace administrators understand how their teams use AI and has now been disabled. Notion says fewer than 1% of its users were affected, and that most impacted transcripts were not labeled with their author or source workspace and did not include tool-call results. After the initial alert, Notion cut off traffic to Fireworks, deleted its data from the vendor’s systems, and halted training runs by November 3. Affected users are advised to review the available incident information and rotate any passwords, API keys, or other credentials entered into affected chats.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Notion disclosed that a security breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts from a small number of workspaces.","The exposed transcripts came from the dataset used for Notion’s Insights feature, which lets workspace administrators view how their teams use AI and has now been disabled.","Notion stopped sending traffic to Fireworks AI, deleted its data from the vendor’s systems, and halted training runs by November 3 after being alerted to an exposed dataset.","Notion says fewer than 1% of its users are affected, and most of the affected transcripts were not labeled with the author or the workspace they came from.","Notion advises affected users to rotate passwords, API keys, and other credentials that they entered into affected chats."],"insights":["Fireworks AI initially told Notion that the exposed dataset contained only synthetic test data, but later confirmed that customer data, including Notion user data, had been accessed.","The affected transcripts were largely disconnected from specific users and workspaces and did not include tool-call results, limiting the information included in most impacted records.","The incident shows that Notion AI’s Insights feature involved storing and analyzing conversations through Fireworks AI, despite Fireworks having contractually committed to zero retention of Notion data.","Notion provides affected workspace owners a way to review the relevant data and share a download link with individual members, making it possible for users to identify chats that may have contained credentials."],"referencedReports":[{"title":"Security incident involving a third-party AI vendor","url":"https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9","publisher":"notion","context":"Notion’s security advisory states that Fireworks AI confirmed customer data, including Notion user data, had been accessed.","category":"advisory","primary":true},{"title":"Security incident involving a third-party AI vendor FAQ","url":"https://www.notion.com/help/security-incident-involving-a-third-party-ai-vendor","publisher":"notion","context":"Notion published this FAQ to explain the incident and provide guidance to potentially affected users.","category":"guide","primary":false}],"body":"\u003cp\u003eNotion disclosed that a breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts from a small number of workspaces. Fireworks said an attacker accessed its development environment through a third-party cloud provider on October 23, compromising resource metadata, billing information, model weights, and datasets for some customers. Notion learned on November 2 of an exposed dataset that Fireworks initially said contained only synthetic test data, but Fireworks confirmed on November 8 that customer data, including Notion user data, had been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe exposed transcripts came from the dataset for Notion’s Insights feature, which helps workspace administrators understand how their teams use AI and has now been disabled. Notion says fewer than 1% of its users were affected, and that most impacted transcripts were not labeled with their author or source workspace and did not include tool-call results. After the initial alert, Notion cut off traffic to Fireworks, deleted its data from the vendor’s systems, and halted training runs by November 3. Affected users are advised to review the available incident information and rotate any passwords, API keys, or other credentials entered into affected chats.\u003c/p\u003e\n"},{"n":4,"title":"Log Analysis Field Guide: Tips for Spotting Patterns and Red Flags","source":"blackhillsinfosec.com","sourceColorIdx":2,"link":"https://www.blackhillsinfosec.com/log-analysis-guide/","time":"21:57","priority":"MAY READ","score":35,"tldr":"This guide explains how to analyze logs by focusing on timestamps, repetition, normal behavior baselines, and targeted filtering to identify suspicious activity. Key red flags include repeated failed logins followed by success, after-hours access, impossible travel, unexpected account changes, and unusual processes or network connections.","briefOverview":"\u003cp\u003eLog analysis involves reviewing automatically generated records of logins, file downloads, network connections, and other system activity to determine who did what, when, and where. Common log fields include timestamps, source systems, event types, users or processes, and success or failure outcomes. The article emphasizes that analysts do not need to understand every entry, but should learn to identify meaningful patterns.\u003c/p\u003e\n\n\u003cp\u003eAnalysts should establish what normal activity looks like, use filters to focus on relevant events, and document their searches. Important warning signs include repeated failed logins followed by success, unexpected after-hours access, impossible-travel indicators, account or permission changes, and unusual processes or outbound connections. Impossible-travel findings should be verified against source logs because VPN endpoints, cloud proxies, and mobile-device synchronization can produce false positives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Logs record digital activity such as logins, file downloads, and network connections, helping answer who performed an action, what happened, when it happened, and where it originated.","Core log elements commonly include a timestamp, source system, event type, user or process, and whether the activity succeeded or failed.","Analysts should look for repetition, suspicious timing, and behavior that differs from normal activity, while using filters to focus on relevant entries.","Red flags include repeated failed logins followed by a successful login, unexpected after-hours activity, impossible travel indicators, modified accounts, and unusual processes or connections.","The article recommends documenting searches, checking whether activity has occurred before, comparing it with known bad behavior, and deciding whether escalation is needed."],"insights":["A single failed login may be a typing mistake, but ten failed attempts within two minutes are a pattern worth investigating.","An impossible-travel alert can indicate compromised credentials, but VPN endpoints, cloud proxies, and mobile device synchronization can also create false positives, so the source logs should be verified.","Failed events can be more informative than successful ones because a sequence of failed attempts followed by success may show that someone guessed a password.","Establishing normal behavior, such as typical transfer volumes or scheduled maintenance access, makes unusual activity easier to identify and reduces unnecessary escalation.","Documenting searches lets an analyst retrace the investigation rather than relying on memory."],"referencedReports":[],"body":"\u003cp\u003eLog analysis involves reviewing automatically generated records of logins, file downloads, network connections, and other system activity to determine who did what, when, and where. Common log fields include timestamps, source systems, event types, users or processes, and success or failure outcomes. The article emphasizes that analysts do not need to understand every entry, but should learn to identify meaningful patterns.\u003c/p\u003e\n\n\u003cp\u003eAnalysts should establish what normal activity looks like, use filters to focus on relevant events, and document their searches. Important warning signs include repeated failed logins followed by success, unexpected after-hours access, impossible-travel indicators, account or permission changes, and unusual processes or outbound connections. Impossible-travel findings should be verified against source logs because VPN endpoints, cloud proxies, and mobile-device synchronization can produce false positives.\u003c/p\u003e\n"}]</script>
