<script type="application/json" id="dl-articles">[{"n":4,"title":"Fastjson 1.x RCE Vulnerability Targeted in Attacks With No Patched Available","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fastjson-1x-rce-vulnerability-targeted.html","time":"12:52","priority":"MUST READ","score":95,"tldr":"Attackers are targeting CVE-2026-16723, a critical Fastjson 1.x RCE affecting certain Spring Boot fat-JAR deployments, and no patched Fastjson 1.x release was available as of July 25. Organizations should migrate to Fastjson2 or enable SafeMode/use 1.2.83_noneautotype as a mitigation.","briefOverview":"\u003cp\u003eSecurity firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical flaw in Alibaba\u0026rsquo;s Fastjson library for Java. In affected Spring Boot applications, a malicious JSON request can execute code without authentication, with the privileges of the Java process. Alibaba assigned the vulnerability a CVSS score of 9.0, and the confirmed chain affects Fastjson 1.2.68 through 1.2.83 under specific deployment conditions.\u003c/p\u003e\n\n\u003cp\u003eThe exploit requires a Spring Boot executable fat-JAR, a network-reachable path that sends attacker-controlled JSON to an affected parser, and SafeMode left at its disabled default. Alibaba said AutoType can remain disabled and no classpath gadget is required, and it verified the chain on Spring Boot 2.x, 3.x, and 4.x with JDK 8, 11, 17, and 21. The issue stems from Fastjson\u0026rsquo;s type-resolution path, where an attacker-controlled @type value can lead to a class-resource lookup and loading of attacker-controlled bytecode in a compatible Spring Boot fat-JAR.\u003c/p\u003e\n\n\u003cp\u003eAs of July 25, Alibaba had not released a fixed Fastjson 1.x version, and The Hacker News found no patched Fastjson 1.x artifact in GitHub tags or Maven Central. Organizations that cannot migrate immediately should enable SafeMode with -Dfastjson.parser.safeMode=true or use com.alibaba:fastjson:1.2.83_noneautotype, while Alibaba lists migration to Fastjson2 as the long-term fix. ThreatBook reported in-the-wild exploitation and Imperva reported activity against several sectors and countries, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical remote code execution flaw in Alibaba's Fastjson library for Java.","The confirmed vulnerability chain requires Fastjson 1.2.68 through 1.2.83, a Spring Boot executable fat-JAR, a network-reachable path that sends attacker-controlled JSON to an affected parser, and SafeMode left disabled.","Alibaba had not released a fixed Fastjson 1.x version as of July 25, and organizations that cannot migrate immediately should enable SafeMode or use com.alibaba:fastjson:1.2.83_noneautotype.","Alibaba lists migration to Fastjson2 as the long-term fix, and the article states Fastjson2 is not affected because it does not use the same resource-probing or annotation-based trust path.","ThreatBook reported in-the-wild exploitation, while Imperva reported activity against several sectors, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises."],"insights":["The exploit can work even when AutoType remains disabled and no classpath gadget is present, so defenses or assessments focused only on prior Fastjson AutoType issues may miss this case.","Binding JSON input to a fixed class is not enough protection if that class contains an Object or Map field, because the payload can be nested there.","Deployment format is a major factor: Alibaba lists Spring Boot executable fat-JARs as affected, while plain non-fat JARs, generic uber-JARs, and Tomcat or Jetty WAR deployments are listed as unaffected.","There is a mismatch between vendor reports of observed exploit activity and CISA’s July 23 ADP assessment, which marked exploitation as none and did not list the flaw in the Known Exploited Vulnerabilities catalog as of July 25.","Fastjson 1.2.83, previously recommended as an upgrade for a separate 2022 AutoType bypass, is now itself within the affected range for CVE-2026-16723."],"referencedReports":[{"title":"Security Advisory: Remote Code Execution in fastjson 1.2.68–1.2.83","url":"https://github.com/alibaba/fastjson2/wiki/Security-Advisory:-Remote-Code-Execution-in-fastjson-1.2.68%E2%80%931.2.83","publisher":"Alibaba","context":"The article cites Alibaba's advisory describing the Fastjson 1.x RCE conditions and recommended mitigations.","category":"advisory","primary":true},{"title":"Fastjson 1.2.83 RCE","url":"https://fearsoff.org/research/fastjson-1-2-83-rce","publisher":"FearsOff Cybersecurity","context":"The article references Kirill Firsov's technical analysis explaining the Fastjson type-resolution path and exploit chain.","category":"research","primary":true},{"title":"Fastjson RCE 1.2.83 Active Exploitation Detected, Detection \u0026 Mitigation","url":"https://threatbook.io/blog/fastjson-rce-1.2.83-active-exploitation-detected-detection-mitigation","publisher":"ThreatBook","context":"The article cites ThreatBook's report that its platform captured in-the-wild exploitation and describes its lab reproduction results.","category":"research","primary":true},{"title":"Imperva Customers Protected Against CVE-2026-16723 Critical Fastjson 1.x Zero-Day RCE","url":"https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-16723-critical-fastjson-1-x-zero-day-rce/","publisher":"Imperva","context":"The article cites Imperva's report on observed activity against multiple sectors and countries.","category":"research","primary":true},{"title":"CVE-2026-16723 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-16723","publisher":"CISA-ADP","context":"The article references a July 23 CISA-ADP assessment on NVD that marked exploitation as none.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical flaw in Alibaba\u0026rsquo;s Fastjson library for Java. In affected Spring Boot applications, a malicious JSON request can execute code without authentication, with the privileges of the Java process. Alibaba assigned the vulnerability a CVSS score of 9.0, and the confirmed chain affects Fastjson 1.2.68 through 1.2.83 under specific deployment conditions.\u003c/p\u003e\n\n\u003cp\u003eThe exploit requires a Spring Boot executable fat-JAR, a network-reachable path that sends attacker-controlled JSON to an affected parser, and SafeMode left at its disabled default. Alibaba said AutoType can remain disabled and no classpath gadget is required, and it verified the chain on Spring Boot 2.x, 3.x, and 4.x with JDK 8, 11, 17, and 21. The issue stems from Fastjson\u0026rsquo;s type-resolution path, where an attacker-controlled @type value can lead to a class-resource lookup and loading of attacker-controlled bytecode in a compatible Spring Boot fat-JAR.\u003c/p\u003e\n\n\u003cp\u003eAs of July 25, Alibaba had not released a fixed Fastjson 1.x version, and The Hacker News found no patched Fastjson 1.x artifact in GitHub tags or Maven Central. Organizations that cannot migrate immediately should enable SafeMode with -Dfastjson.parser.safeMode=true or use com.alibaba:fastjson:1.2.83_noneautotype, while Alibaba lists migration to Fastjson2 as the long-term fix. ThreatBook reported in-the-wild exploitation and Imperva reported activity against several sectors and countries, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises.\u003c/p\u003e\n"},{"n":3,"title":"Cl0p Affiliates Target Internet-Exposed PTC Windchill and FlexPLM with Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cl0p-affiliates-target-internet-exposed.html","time":"10:14","priority":"MUST READ","score":94,"tldr":"Cl0p-linked attackers are exploiting internet-facing PTC Windchill and FlexPLM systems by chaining a FlexPLM information disclosure flaw with a Windchill unauthenticated RCE to deploy JSP web shells and steal sensitive engineering/design data. Organizations using these products should urgently investigate exposure, apply mitigations or patches, and check for the published IoCs.","briefOverview":"\u003cp\u003eThreat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments as part of a new data extortion campaign. The campaign targets manufacturing, automotive, aerospace, and retail sectors. After gaining access, the attackers have been observed enumerating file systems, staging engineering and design data, and carrying out double extortion data theft.\u003c/p\u003e\n\n\u003cp\u003eA coordinated advisory from Ransom-ISAC, eCrime.ch, and DEFUSED says the attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet. This enables unauthenticated remote code execution and deployment of hex-named JSP web shells under /Windchill/login/. The activity is suspected to involve CVE-2026-12569, a critical PTC Windchill flaw that CISA added to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ePTC said it has received continued reports of heightened threat activity and warned that unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems. Ransom-ISAC shared four IP addresses as indicators of compromise, matching those shared by PTC. The extortion emails appear to come from previously compromised accounts and are sent to hundreds of users within impacted organizations, with instructions for contacting the Cl0p ransomware crew.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments as part of a new data extortion campaign.","The attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet to enable unauthenticated remote code execution and deployment of hex-named JSP web shells under /Windchill/login/.","After gaining initial access, the attackers have been observed enumerating file systems, staging engineering and design data, and conducting double extortion data theft against manufacturing, automotive, aerospace, and retail targets.","PTC said it has received continued reports of heightened threat activity and warned that unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems.","Ransom-ISAC shared four indicators-of-compromise IP addresses that match those shared by PTC: 216.152.148.54, 216.152.151.204, 104.243.35.63, and 5.180.41.35."],"insights":["The exploitation path combines two separate issues across FlexPLM and Windchill, so organizations may need to assess both products together rather than treating the Windchill RCE in isolation.","The article identifies a specific post-exploitation location, /Windchill/login/, where attackers deploy hex-named JSP web shells, giving defenders a concrete place and file pattern to inspect.","The campaign is focused on engineering and design data, making organizations in manufacturing, automotive, aerospace, and retail especially exposed to theft of high-value product information rather than only general business data.","The extortion emails are reportedly sent from previously compromised accounts to hundreds of users inside affected organizations, indicating that employee inboxes may receive credible-looking contact attempts tied to the data theft.","The four IP addresses published by Ransom-ISAC match those shared by PTC, giving organizations a consistent set of indicators to compare against network and access logs."],"referencedReports":[{"title":"Cl0p Windchill FlexPLM Exploitation","url":"https://ransom-isac.org/blog/clop-windchill-flexplm-exploitation/","publisher":"Ransom-ISAC, eCrime.ch, and DEFUSED","context":"The article cites this as a new coordinated advisory describing how attackers chain a FlexPLM information disclosure issue with a Windchill server-side flaw to achieve unauthenticated remote code execution.","category":"advisory","primary":true}],"body":"\u003cp\u003eThreat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments as part of a new data extortion campaign. The campaign targets manufacturing, automotive, aerospace, and retail sectors. After gaining access, the attackers have been observed enumerating file systems, staging engineering and design data, and carrying out double extortion data theft.\u003c/p\u003e\n\n\u003cp\u003eA coordinated advisory from Ransom-ISAC, eCrime.ch, and DEFUSED says the attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet. This enables unauthenticated remote code execution and deployment of hex-named JSP web shells under /Windchill/login/. The activity is suspected to involve CVE-2026-12569, a critical PTC Windchill flaw that CISA added to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ePTC said it has received continued reports of heightened threat activity and warned that unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems. Ransom-ISAC shared four IP addresses as indicators of compromise, matching those shared by PTC. The extortion emails appear to come from previously compromised accounts and are sent to hundreds of users within impacted organizations, with instructions for contacting the Cl0p ransomware crew.\u003c/p\u003e\n"},{"n":2,"title":"Researcher Publishes GitLab RCE PoC Letting Authenticated Users Run Commands as Git","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html","time":"10:14","priority":"SHOULD READ","score":88,"tldr":"Researchers published a working proof-of-concept for a GitLab RCE chain that lets any authenticated user with project push access run commands as the git user on unpatched self-managed instances. The flaw was fixed in GitLab 18.10.8, 18.11.5, and 19.0.2, but it was not initially labeled as a security fix, so operators should verify and upgrade immediately.","briefOverview":"\u003cp\u003eSecurity researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10. The exploit runs commands as the \u003ccode\u003egit\u003c/code\u003e user on any self-managed GitLab \u003ccode\u003e18.11.3\u003c/code\u003e server that has not taken the update. Any authenticated user who can push to a project can use the chain, without administrator rights, CI or runner access, victim interaction, or access to anyone else’s project.\u003c/p\u003e\n\n\u003cp\u003eThe chain uses crafted Jupyter notebooks and GitLab’s notebook diff rendering to reach two memory corruption bugs in Oj, a Ruby JSON parser implemented largely in native C. One bug leaks a heap pointer through the diff, and another can overwrite a parser callback so the payload points to \u003ccode\u003esystem()\u003c/code\u003e. GitLab’s \u003ccode\u003eipynbdiff\u003c/code\u003e renderer passes repository-controlled \u003ccode\u003e.ipynb\u003c/code\u003e JSON to \u003ccode\u003eOj::Parser.usual.parse\u003c/code\u003e inside a long-lived Puma worker, placing attacker-controlled data inside the application process.\u003c/p\u003e\n\n\u003cp\u003eGitLab did not classify the fix as a security fix in the June 10 patch release, and the issue has no CVE, CVSS score, or mention of the notebook-diff chain. Affected versions include GitLab CE/EE 15.2.0 to 18.10.7, 18.11.0 to 18.11.4, and 19.0.0 to 19.0.1, with fixed versions 18.10.8, 18.11.5, and 19.0.2. The article says commands run as the account behind Puma, with possible reach including source code, Rails secrets, service credentials, CI/CD data, and internal services the application can talk to.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10.","Any authenticated user who can push to a project can exploit the issue by committing crafted Jupyter notebooks and opening their commit diffs to ultimately run commands as the git user.","GitLab did not list the Oj 3.17.3 update as a security fix in the June 10 patch release, and the issue has no CVE, CVSS score, or mention of the notebook-diff chain.","Affected versions include GitLab CE/EE 15.2.0 to 18.10.7, 18.11.0 to 18.11.4, and 19.0.0 to 19.0.1, as well as Oj gem versions 3.13.0 to 3.17.1.","The article says operators should upgrade to GitLab 18.10.8, 18.11.5, or 19.0.2, and that no workaround is offered for those who cannot upgrade."],"insights":["Operators who reviewed GitLab’s June 10 patch release only by its security-fix table may have missed the urgency, because the relevant Oj 3.17.3 update was listed under bug fixes instead of security fixes.","For Helm and Operator deployments, the article says the version that matters is the GitLab version inside the Webservice image running Puma, not the chart or Operator version.","GitLab installations on versions 15.2 through 18.9 do not receive a backport because they are outside GitLab’s security-maintained patch trains, so those deployments must move to a supported release.","The public exploit is not drop-in against arbitrary targets because it was built for GitLab 18.11.3 on x86-64 and depends on version-specific gadget offsets, register state, and jemalloc behavior.","Although the exploit can run commands as the git user, the article notes that its real-world impact depends on install isolation, with possible reach including source code, Rails secrets, service credentials, CI/CD data, and internal services accessible to the application."],"referencedReports":[{"title":"Going depthfirst: Achieving GitLab RCE via two Ruby memory corruption vulnerabilities","url":"https://depthfirst.com/research/going-depthfirst-achieving-gitlab-rce-via-two-ruby-memory-corruption-vulnerabilities","publisher":"depthfirst","context":"The article says depthfirst’s writeup contains the full exploit chain for the GitLab RCE involving two Oj memory corruption bugs.","category":"research","primary":true},{"title":"Patch release: GitLab 19.0.2 released","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-2-released/","publisher":"GitLab","context":"The article references GitLab’s June 10 patch release to note that the Oj 3.17.3 update was listed under bug fixes rather than in the security-fix table.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10. The exploit runs commands as the \u003ccode\u003egit\u003c/code\u003e user on any self-managed GitLab \u003ccode\u003e18.11.3\u003c/code\u003e server that has not taken the update. Any authenticated user who can push to a project can use the chain, without administrator rights, CI or runner access, victim interaction, or access to anyone else’s project.\u003c/p\u003e\n\n\u003cp\u003eThe chain uses crafted Jupyter notebooks and GitLab’s notebook diff rendering to reach two memory corruption bugs in Oj, a Ruby JSON parser implemented largely in native C. One bug leaks a heap pointer through the diff, and another can overwrite a parser callback so the payload points to \u003ccode\u003esystem()\u003c/code\u003e. GitLab’s \u003ccode\u003eipynbdiff\u003c/code\u003e renderer passes repository-controlled \u003ccode\u003e.ipynb\u003c/code\u003e JSON to \u003ccode\u003eOj::Parser.usual.parse\u003c/code\u003e inside a long-lived Puma worker, placing attacker-controlled data inside the application process.\u003c/p\u003e\n\n\u003cp\u003eGitLab did not classify the fix as a security fix in the June 10 patch release, and the issue has no CVE, CVSS score, or mention of the notebook-diff chain. Affected versions include GitLab CE/EE 15.2.0 to 18.10.7, 18.11.0 to 18.11.4, and 19.0.0 to 19.0.1, with fixed versions 18.10.8, 18.11.5, and 19.0.2. The article says commands run as the account behind Puma, with possible reach including source code, Rails secrets, service credentials, CI/CD data, and internal services the application can talk to.\u003c/p\u003e\n"},{"n":5,"title":"The Phish Zoom Signed With Its Own DKIM Key","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/zoom-authenticated-dkim-paypal-billing-toad-callback","time":"11:00","priority":"SHOULD READ","score":83,"tldr":"Attackers abused Zoom’s own sign-in email template by placing a PayPal callback scam in the account name field, causing Zoom to DKIM-sign a genuine-looking phishing message that passed DMARC. The key takeaway is that valid email authentication proves origin and integrity, not that the content is safe.","briefOverview":"\u003cp\u003eAn attacker created a Zoom account and set the account name to a scam message claiming a PayPal account would be auto-debited $986.37 for a Zoom monthly renewal. When the attacker triggered a Zoom sign-in verification email, Zoom inserted that account name into its standard email template and signed the finished message with its production DKIM key. The resulting email passed DKIM and DMARC because Zoom genuinely signed the content before delivery.\u003c/p\u003e\n\n\u003cp\u003eThe message was then resent to a company chief operating officer through a brand-new privacy-protected domain, mailjetstream[.]com, which had no relationship to Zoom’s mail platform and no SPF record. The email contained Zoom’s real branding and a legitimate Zoom link, but the payload was the callback number +1-805-600-1572. There was no malicious link or attachment, which left URL sandboxes, attachment detonation, and domain-reputation engines with little to detect.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that a valid DKIM signature proves the message was signed by the domain’s key and was not modified in transit, but it does not prove the content is trustworthy. It identifies the scam as a telephone-oriented attack delivery, or TOAD, designed to move the victim from email to a phone call with a live operator. The broader takeaway is that authenticated brand email can still be hostile when user-controlled fields are echoed into transactional messages, so behavioral analysis must evaluate the message content and delivery path rather than treating authentication as a verdict.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker set a Zoom account name to a scam script about a fabricated $986.37 PayPal auto-debit and then triggered a Zoom sign-in verification email.","Zoom rendered the attacker-controlled account name into its standard sign-in-code email template and signed the finished message with its production DKIM key for zoom.us.","The resent message passed DMARC because the Zoom DKIM signature was aligned, even though the envelope domain mailjetstream.com had no SPF record and no relationship to Zoom's mail platform.","The only attack payload was the callback number +1-805-600-1572, with no malicious link or attachment for URL sandboxes, attachment detonation, or domain-reputation engines to analyze.","The article states that a valid DKIM signature proves the signing key and message integrity, but not whether the message content is safe or trustworthy."],"insights":["Email defenses that allow-list messages solely because they are signed by a trusted brand such as zoom.us can miss attacks where the brand itself was tricked into signing attacker-supplied text.","Transactional emails that echo user-controlled fields such as account names, notes, or memo lines can become a vehicle for signed scam content if those fields are not constrained or context-checked.","The presence of Resent headers and a new, unrelated envelope domain can reveal weaponization even when the visible brand assets and cryptographic signature are authentic.","Callback scams can evade common email filtering because the dangerous action is moved outside the email message and into a phone call, leaving only a phone number and social pressure in the email body.","A mismatch between the expected purpose of an email and its text, such as a Zoom sign-in code email discussing PayPal auto-debits, is an important detection signal even when the message’s technical authentication passes."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for the claim that callback-style TOAD represents roughly 5% of phishing volume hitting gateways.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for the statement that this family of social-engineering fraud remains among the costliest by reported dollar loss.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker created a Zoom account and set the account name to a scam message claiming a PayPal account would be auto-debited $986.37 for a Zoom monthly renewal. When the attacker triggered a Zoom sign-in verification email, Zoom inserted that account name into its standard email template and signed the finished message with its production DKIM key. The resulting email passed DKIM and DMARC because Zoom genuinely signed the content before delivery.\u003c/p\u003e\n\n\u003cp\u003eThe message was then resent to a company chief operating officer through a brand-new privacy-protected domain, mailjetstream[.]com, which had no relationship to Zoom’s mail platform and no SPF record. The email contained Zoom’s real branding and a legitimate Zoom link, but the payload was the callback number +1-805-600-1572. There was no malicious link or attachment, which left URL sandboxes, attachment detonation, and domain-reputation engines with little to detect.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that a valid DKIM signature proves the message was signed by the domain’s key and was not modified in transit, but it does not prove the content is trustworthy. It identifies the scam as a telephone-oriented attack delivery, or TOAD, designed to move the victim from email to a phone call with a live operator. The broader takeaway is that authenticated brand email can still be hostile when user-controlled fields are echoed into transactional messages, so behavioral analysis must evaluate the message content and delivery path rather than treating authentication as a verdict.\u003c/p\u003e\n"},{"n":1,"title":"CTM360 Research Reveals How Insurance Phishing Has Evolved Into Real-Time Account Hijacking","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ctm360-research-reveals-how-insurance.html","time":"10:14","priority":"SHOULD READ","score":82,"tldr":"CTM360 found that insurance phishing campaigns are evolving from simple credential theft into real-time account hijacking, with attackers using fake portals to relay logins and OTPs to legitimate insurance sites during the victim’s session. The research highlights the InsureOTP Kit and abuse of Google Ads and disposable hosting infrastructure to run coordinated, brand-impersonation campaigns across multiple regions.","briefOverview":"\u003cp\u003eCTM360 investigated insurance-focused phishing operations that have moved beyond collecting credentials for later use. The campaigns synchronize attacker activity with victims in real time, allowing attackers to authenticate against legitimate insurance portals while victims unknowingly complete the login process. The article says this can turn a single browsing session into an active account hijacking operation.\u003c/p\u003e\n\n\u003cp\u003eInsurance providers are attractive targets because their online portals can contain personal information, identity documents, policy records, payment methods, and other sensitive customer data. The campaign reused the same operational infrastructure across multiple insurance brands, adapting language, branding, and content for local markets. Saudi Arabia appeared to be the primary target, with additional activity observed across Europe, the United States, and India.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns commonly used sponsored Google advertisements to lure users searching for insurance quotations, renewals, or price comparisons. CTM360 identified a previously undocumented phishing kit named \u003cstrong\u003eInsureOTP Kit\u003c/strong\u003e, which supports live session management, real-time data collection, backend administration, Telegram Bot integrations, direct backend API communication, and live OTP handling. The article argues that defenders need to look beyond individual phishing pages and understand the infrastructure, tooling, and workflows behind these operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CTM360 investigated insurance-focused phishing operations in which attackers synchronize their activity with victims in real time to authenticate against legitimate insurance portals during the victim’s browsing session.","The campaign used sponsored Google advertisements to lure users searching for insurance quotations, renewals, or price comparisons to phishing websites resembling genuine insurance providers.","The phishing infrastructure reused the same operational setup across multiple insurance brands and targeted Saudi Arabia primarily, with additional activity observed across Europe, the United States, and India.","CTM360 identified a previously undocumented phishing kit named InsureOTP Kit that supports live session management, real-time data collection, backend administration, Telegram Bot integrations, direct backend API communication, and live OTP handling.","The article says defenders need to look beyond individual phishing domains and monitor paid advertisement abuse, disposable cloud-hosted phishing infrastructure, and authentication patterns indicating real-time OTP interception."],"insights":["The attackers’ use of randomized domains with little or no resemblance to insurance brands reduces the effectiveness of conventional brand-monitoring approaches that focus on lookalike domains.","Because credential theft, OTP capture, and account access happen in one continuous workflow, the traditional assumption that defenders have time between stolen credentials and account abuse no longer applies in these campaigns.","Publicly accessible backend resources, including source code, SQLite databases, and operational records, allowed CTM360 to understand the phishing operation beyond the visible fake websites.","The phishing kit’s backend could request additional OTP submissions when authentication failed, showing that operators can keep interacting with victims while time-sensitive login codes are still usable.","The campaign’s reliance on legitimate website builders and free hosting platforms makes the infrastructure disposable and easier for operators to rotate quickly."],"referencedReports":[],"body":"\u003cp\u003eCTM360 investigated insurance-focused phishing operations that have moved beyond collecting credentials for later use. The campaigns synchronize attacker activity with victims in real time, allowing attackers to authenticate against legitimate insurance portals while victims unknowingly complete the login process. The article says this can turn a single browsing session into an active account hijacking operation.\u003c/p\u003e\n\n\u003cp\u003eInsurance providers are attractive targets because their online portals can contain personal information, identity documents, policy records, payment methods, and other sensitive customer data. The campaign reused the same operational infrastructure across multiple insurance brands, adapting language, branding, and content for local markets. Saudi Arabia appeared to be the primary target, with additional activity observed across Europe, the United States, and India.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns commonly used sponsored Google advertisements to lure users searching for insurance quotations, renewals, or price comparisons. CTM360 identified a previously undocumented phishing kit named \u003cstrong\u003eInsureOTP Kit\u003c/strong\u003e, which supports live session management, real-time data collection, backend administration, Telegram Bot integrations, direct backend API communication, and live OTP handling. The article argues that defenders need to look beyond individual phishing pages and understand the infrastructure, tooling, and workflows behind these operations.\u003c/p\u003e\n"}]</script>
