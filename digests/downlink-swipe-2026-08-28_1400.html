<script type="application/json" id="dl-articles">[{"n":1,"title":"Why a cryptographic inventory is key for addressing the quantum computing threat","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/why-a-cryptographic-inventory-is-key-for-addressing-the-quantum-computing-threat","time":"14:01","priority":"MAY READ","score":55,"tldr":"Organizations need to build a comprehensive cryptographic inventory now because adversaries can already harvest encrypted data and decrypt it later once quantum computers can break today’s public-key cryptography. A phased migration to post-quantum cryptography requires visibility, prioritization, remediation, and continuous verification.","briefOverview":"\u003cp\u003eThe article explains that quantum computers will threaten the public-key cryptographic algorithms that protect digitally stored and transmitted data. It says the risk is already operational because adversaries use “harvest now, decrypt later” tactics, collecting encrypted data today so they can decrypt it once quantum capabilities mature. The article argues that organizations need a comprehensive cryptographic inventory to identify, catalog, and assess cryptographic assets before they can migrate to post-quantum cryptography.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that a sufficiently powerful quantum computer running Shor’s Algorithm would break asymmetric algorithms such as RSA, ECC, Diffie-Hellman, ECDH, and ECDSA. It says symmetric encryption is more resilient, with AES-256 expected to remain secure against quantum attacks, while the immediate crisis is concentrated in asymmetric cryptography used for key exchange and digital signatures. It also describes Executive Order 14412 as requiring U.S. executive-branch federal agencies to focus on post-quantum cryptography readiness, with accelerated migration timelines and contractor requirements tied to NIST FIPS standards.\u003c/p\u003e\n\n\u003cp\u003eThe recommended operational strategy includes automated discovery, prioritization and risk assessment, remediation with crypto-agility, and continuous verification. The article says discovery should include active scanning of internet-facing services to capture the key exchanges and ciphers they negotiate, because harvest-now-decrypt-later attacks target data in transit. It also describes Tenable One’s Cryptographic Inventory view as a way to show which services use post-quantum ciphers, which do not, and where TLS, SSH, certificate, and configuration concerns exist.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Quantum computing risks are already an operational threat because adversaries use “harvest now, decrypt later” tactics to collect encrypted data today and decrypt it when quantum capabilities mature.","A sufficiently powerful quantum computer running Shor’s Algorithm would break asymmetric algorithms such as RSA, ECC, and Diffie-Hellman, while AES-256 is expected to remain secure against quantum attacks.","Executive Order 14412 requires U.S. executive-branch federal agencies to focus on post-quantum cryptography readiness and sets deadlines for transitioning high-value assets to post-quantum cryptography.","The article says organizations need a comprehensive cryptographic inventory because they cannot migrate cryptographic assets they cannot identify, catalog, and assess.","The recommended migration strategy includes automated discovery, prioritization and risk assessment, remediation with crypto-agility, and continuous verification to prevent regression."],"insights":["Executive Order 14412 reframes missing encryption or non-FIPS-approved algorithms as reportable cryptographic vulnerabilities in contractor vulnerability disclosure programs, turning crypto-hygiene into an active vulnerability management issue.","The article recommends scanning internet-facing services from the outside to see which key exchanges and ciphers they actually negotiate, because configuration review alone may not reveal the exposed services most relevant to harvest-now-decrypt-later risk.","Organizations are advised to use hybrid cryptography before becoming fully post-quantum compliant, running conventional and post-quantum approaches in parallel during the transition.","The article warns against hard-coding new post-quantum algorithms because the standards are new and organizations may need to switch algorithms without recompiling code if a weakness is later found.","Continuous verification is emphasized because a system that is quantum-safe today could become RSA-only again after a routine DevOps configuration change."],"referencedReports":[{"title":"Quantum Computing and Post-Quantum Cryptography FAQs","url":"https://media.defense.gov/2021/Aug/04/2002821837/-1/-1/1/Quantum_FAQs_20210804.PDF","publisher":"U.S. Department of Defense","context":"The article links to this FAQ when defining a cryptographically relevant quantum computer.","category":"guide","primary":false},{"title":"AI Infrastructure Post-Quantum Harvest Now Decrypt Later v1","url":"https://labs.cloudsecurityalliance.org/research/ai-infrastructure-post-quantum-harvest-now-decrypt-later-v1/","publisher":"Cloud Security Alliance","context":"The article references this research when explaining the harvest now, decrypt later threat.","category":"research","primary":false},{"title":"MAS Quantum Advisory","url":"https://www.mas.gov.sg/-/media/mas-media-library/regulation/circulars/trpd/mas-quantum-advisory/mas-quantum-advisory.pdf","publisher":"Monetary Authority of Singapore","context":"The article cites this advisory as an example of international regulatory attention to quantum readiness and cryptographic inventories.","category":"advisory","primary":false},{"title":"NIST SP 1800-38","url":"https://csrc.nist.gov/pubs/sp/1800/38/iprd-%281%29","publisher":"National Institute of Standards and Technology","context":"The article says its phased post-quantum migration strategy is based on NIST SP 1800-38 and CISA guidance.","category":"guide","primary":true},{"title":"Quantum Readiness","url":"https://www.cisa.gov/topics/risk-management/quantum","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article says its phased post-quantum migration strategy is based on NIST SP 1800-38 and CISA guidance.","category":"guide","primary":true}],"body":"\u003cp\u003eThe article explains that quantum computers will threaten the public-key cryptographic algorithms that protect digitally stored and transmitted data. It says the risk is already operational because adversaries use “harvest now, decrypt later” tactics, collecting encrypted data today so they can decrypt it once quantum capabilities mature. The article argues that organizations need a comprehensive cryptographic inventory to identify, catalog, and assess cryptographic assets before they can migrate to post-quantum cryptography.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that a sufficiently powerful quantum computer running Shor’s Algorithm would break asymmetric algorithms such as RSA, ECC, Diffie-Hellman, ECDH, and ECDSA. It says symmetric encryption is more resilient, with AES-256 expected to remain secure against quantum attacks, while the immediate crisis is concentrated in asymmetric cryptography used for key exchange and digital signatures. It also describes Executive Order 14412 as requiring U.S. executive-branch federal agencies to focus on post-quantum cryptography readiness, with accelerated migration timelines and contractor requirements tied to NIST FIPS standards.\u003c/p\u003e\n\n\u003cp\u003eThe recommended operational strategy includes automated discovery, prioritization and risk assessment, remediation with crypto-agility, and continuous verification. The article says discovery should include active scanning of internet-facing services to capture the key exchanges and ciphers they negotiate, because harvest-now-decrypt-later attacks target data in transit. It also describes Tenable One’s Cryptographic Inventory view as a way to show which services use post-quantum ciphers, which do not, and where TLS, SSH, certificate, and configuration concerns exist.\u003c/p\u003e\n"}]</script>
