<script type="application/json" id="dl-articles">[{"n":3,"title":"Attackers Exploit UnrealIRCd Flaw That Enables Server-Level Command Injection","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-exploit-unrealircd-flaw-that.html","time":"12:38","priority":"MUST READ","score":94,"tldr":"CISA added CVE-2026-114713, a critical UnrealIRCd flaw actively exploited to inject server-to-server commands with server-level privileges, to its Known Exploited Vulnerabilities catalog. Organizations should urgently upgrade to UnrealIRCd 6.2.7.1 or apply the available workaround.","briefOverview":"\u003cp\u003eCISA added CVE-2026-114713, a high-severity flaw in the open-source UnrealIRCd IRC server, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue has a CVSS score of 8.6 and affects UnrealIRCd versions 6.0.0 through versions before 6.2.7.1. CISA’s addition means Federal Civilian Executive Branch agencies must apply fixes by November 16, 2026 under Binding Operational Directive 26-04.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable labeled-response module does not safely handle the IRCv3 \u0026ldquo;label\u0026rdquo; message tag when echoing it in replies. On networks with two or more linked servers, this can allow any user to inject server-to-server commands that run with server or IRC operator privileges. UnrealIRCd released version 6.2.7.1 to fix the issue, and maintainer Bram Matthys warned that attackers began exploiting it a day after the November 7, 2026 hotfix release. He called it the most critical issue found in UnrealIRCd over the past 15 years and urged administrators to update, hot-patch, or deploy the stated spamfilter workaround.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-114713, an actively exploited high-severity UnrealIRCd flaw, to its Known Exploited Vulnerabilities catalog.","The flaw affects UnrealIRCd versions 6.0.0 through versions before 6.2.7.1 and can allow users to inject server-to-server commands with server-level privileges on networks with at least two linked servers.","UnrealIRCd released version 6.2.7.1 to address CVE-2026-114713 and other security issues.","The UnrealIRCd maintainer said exploitation began a day after the November 7, 2026 hotfix release and described it as the project’s most critical issue in 15 years.","Federal Civilian Executive Branch agencies must apply fixes by November 16, 2026 under Binding Operational Directive 26-04."],"insights":["The flaw can be triggered by any user rather than requiring administrator access, but only on UnrealIRCd networks with two or more linked servers.","The vulnerable labeled-response feature fails to safely handle a message label when it is copied into replies, allowing crafted input to be interpreted as server commands.","Active exploitation reportedly began one day after the November 7, 2026 hotfix was released, making rapid patching or use of the stated workaround especially urgent.","CISA gave federal civilian agencies until November 16, 2026 to remediate the issue after adding it to its Known Exploited Vulnerabilities catalog on November 13."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/13/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert as the source for adding the actively exploited UnrealIRCd flaw to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-114713, a high-severity flaw in the open-source UnrealIRCd IRC server, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue has a CVSS score of 8.6 and affects UnrealIRCd versions 6.0.0 through versions before 6.2.7.1. CISA’s addition means Federal Civilian Executive Branch agencies must apply fixes by November 16, 2026 under Binding Operational Directive 26-04.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable labeled-response module does not safely handle the IRCv3 \u0026ldquo;label\u0026rdquo; message tag when echoing it in replies. On networks with two or more linked servers, this can allow any user to inject server-to-server commands that run with server or IRC operator privileges. UnrealIRCd released version 6.2.7.1 to fix the issue, and maintainer Bram Matthys warned that attackers began exploiting it a day after the November 7, 2026 hotfix release. He called it the most critical issue found in UnrealIRCd over the past 15 years and urged administrators to update, hot-patch, or deploy the stated spamfilter workaround.\u003c/p\u003e\n"},{"n":1,"title":"Cursor confirms security breach led to malicious Claude Code extension","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/","time":"17:27","priority":"SHOULD READ","score":88,"tldr":"Cursor confirmed that attackers used credentials exposed through Fireworks AI and leaked coding-agent traces to access internal systems and publish trojanized Claude Code extensions that attempted to install persistent SSH backdoors. Up to 5,000 developers may have downloaded the malicious builds during their roughly 11-hour availability window.","briefOverview":"\u003cp\u003eCursor confirmed that attackers obtained an access key stored on AI infrastructure provider Fireworks AI and used it to copy data from a read-only storage bucket shared between the companies. The bucket held historical AI coding-agent traces from users who had not enabled Privacy Mode, and some traces contained unredacted API credentials. Attackers used those credentials to access additional Cursor systems and steal information from several SaaS tools, including archived non-production source code, support information, usage data, and some customer-shared credentials.\u003c/p\u003e\n\n\u003cp\u003eOn October 29, the attackers used a stolen credential to publish malicious copies of Anthropic\u0026rsquo;s Claude Code extension, versions 2.1.312 and 2.1.313, through the cache serving Cursor\u0026rsquo;s VS Code extension marketplace. The altered extensions were available for about 11 hours and attempted to collect system information, install attacker-controlled SSH keys, enable remote SSH access, and remain on affected computers. Cursor estimates that up to 5,000 users may have received the malicious builds, although researchers found coding errors that likely prevented the backdoor from working on many Windows and macOS systems where SSH was not already enabled.\u003c/p\u003e\n\n\u003cp\u003eCursor said fewer than 0.05% of users had coding-agent traces exposed and fewer than 0.01% of customers had API credentials compromised. It said its production infrastructure, official application releases, customer code repositories, and code and prompts from Privacy Mode users were not affected. Cursor revoked and rotated exposed credentials, moved inference traffic away from Fireworks, rebuilt its extension marketplace, redeployed production infrastructure, and advised affected extension users to follow its remediation guidance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cursor said attackers obtained an access key stored on Fireworks AI and used it to copy data from a read-only storage bucket shared with the provider.","Historical AI coding-agent traces in the bucket included unredacted API credentials in some cases, which attackers used to access additional Cursor systems and data from several SaaS tools.","On October 29, attackers used a stolen credential to publish malicious versions 2.1.312 and 2.1.313 of Anthropic's Claude Code extension through Cursor's marketplace cache.","The malicious extensions were available for about 11 hours and attempted to install persistent SSH backdoors, with Cursor estimating that up to 5,000 users may have received them.","Cursor said it revoked and rotated exposed credentials, moved inference traffic away from Fireworks, rebuilt its extension marketplace, and redeployed production infrastructure."],"insights":["The exposure was limited to users who had not enabled Privacy Mode, while Cursor said code and prompts from Privacy Mode users were not affected.","The attackers did not compromise Anthropic’s legitimate Claude Code extension or the Open VSX marketplace; they placed altered copies directly in the cache serving Cursor’s extension marketplace.","The malicious extension’s coding errors likely stopped the SSH backdoor from working on many Windows and macOS computers where SSH was not already enabled, but the extensions still attempted to collect system information and establish persistence.","Credentials previously shared with Cursor’s support team were among the data taken from Cursor’s SaaS tools, showing that support communications were within the scope of the incident.","Cursor linked the incident to a broader October pattern in which stolen AI-service credentials were used for unauthorized model usage, including incidents that generated substantial customer charges."],"referencedReports":[{"title":"Black October for AI Developer Platforms","url":"https://www.wiz.io/blog/black-october-for-ai-developer-platforms","publisher":"wiz","context":"The article cites Wiz's analysis describing a wave of attacks against AI developer platforms as \"Black October.\"","category":"research","primary":false}],"body":"\u003cp\u003eCursor confirmed that attackers obtained an access key stored on AI infrastructure provider Fireworks AI and used it to copy data from a read-only storage bucket shared between the companies. The bucket held historical AI coding-agent traces from users who had not enabled Privacy Mode, and some traces contained unredacted API credentials. Attackers used those credentials to access additional Cursor systems and steal information from several SaaS tools, including archived non-production source code, support information, usage data, and some customer-shared credentials.\u003c/p\u003e\n\n\u003cp\u003eOn October 29, the attackers used a stolen credential to publish malicious copies of Anthropic\u0026rsquo;s Claude Code extension, versions 2.1.312 and 2.1.313, through the cache serving Cursor\u0026rsquo;s VS Code extension marketplace. The altered extensions were available for about 11 hours and attempted to collect system information, install attacker-controlled SSH keys, enable remote SSH access, and remain on affected computers. Cursor estimates that up to 5,000 users may have received the malicious builds, although researchers found coding errors that likely prevented the backdoor from working on many Windows and macOS systems where SSH was not already enabled.\u003c/p\u003e\n\n\u003cp\u003eCursor said fewer than 0.05% of users had coding-agent traces exposed and fewer than 0.01% of customers had API credentials compromised. It said its production infrastructure, official application releases, customer code repositories, and code and prompts from Privacy Mode users were not affected. Cursor revoked and rotated exposed credentials, moved inference traffic away from Fireworks, rebuilt its extension marketplace, redeployed production infrastructure, and advised affected extension users to follow its remediation guidance.\u003c/p\u003e\n"},{"n":2,"title":"US disrupts North Korean campaign behind $400 million crypto theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-disrupts-north-korean-campaign-behind-400-million-crypto-theft/","time":"15:15","priority":"SHOULD READ","score":88,"tldr":"U.S. authorities disrupted FaceStealer, a BlueNoroff-linked North Korean social-engineering campaign that used deepfake video meetings and fake technical fixes to steal more than $400 million in cryptocurrency and compromise crypto professionals and open-source developers.","briefOverview":"\u003cp\u003eThe U.S. government disrupted cloud-based infrastructure used by FaceStealer, an 18-month North Korean social-engineering campaign that stole more than $400 million in cryptocurrency. Researchers attributed the activity to the BlueNoroff group, and the FBI said the operation targeted people in cryptocurrency and Web3 roles as well as open-source developers. The campaign affected targets worldwide, with Arctic Wolf identifying 677 targets across 58 countries, especially founders and senior executives.\u003c/p\u003e\n\n\u003cp\u003eThe attackers hijacked accounts on Telegram, LinkedIn, Slack, and Discord to invite targets to fake video meetings, using recorded footage of familiar people to make the meetings appear credible. They then claimed a technical problem and directed victims to a supposed update, installer, or other fix that installed software capable of stealing cryptocurrency data, meeting-platform credentials, contacts, communications access, and webcam recordings. The FBI also described attempts against npm and Rust crate developers, including a thwarted effort against a maintainer of a popular JavaScript library with tens of millions of weekly downloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. government disrupted the cloud-based infrastructure behind FaceStealer, an 18-month North Korean social-engineering campaign linked by researchers to the BlueNoroff group that stole more than $400 million in cryptocurrency.","FaceStealer operators hijacked Telegram, LinkedIn, Slack, and Discord accounts to invite targets to fake video meetings, where they used recorded footage of people known to the target and then presented a fake technical error.","Victims who followed links for supposed updates or installers were infected with software that could steal cryptocurrency data, meeting-platform credentials, contact lists, social-media and communication-app access, and webcam recordings.","Researchers identified 677 targets in 58 countries, primarily company founders and senior executives, while the FBI also confirmed attempts against developers in the npm and Rust crate ecosystems.","The U.S. Justice Department said that the government and private-sector companies froze more than $2.7 billion connected to the $6.4 billion Binance crypto heist, with court authorization obtained to seize or restrain more than $1.2 billion."],"insights":["The operators sometimes waited months or more than a year after compromising someone before targeting them further, apparently allowing cryptocurrency holdings to grow first.","The campaign turned victims into convincing lures by secretly recording their webcam footage and replaying it during later fake meetings with people who knew them.","The FBI described a thwarted attempt against the maintainer of a widely used JavaScript library, showing that a single targeted developer could have affected software used by tens of millions of people each week.","The article’s recommended defenses are practical behavioral checks: join meetings through official apps with an invite code, independently verify unexpected invitations, keep webcams off unless needed, and do not run scripts presented as technical fixes."],"referencedReports":[{"title":"FaceStealer Cryptocurrency Theft Scheme","url":"https://www.fbi.gov/investigate/cyber/facestealer-cryptocurrency-theft-scheme","publisher":"FBI","context":"The article relies on an FBI alert describing the campaign’s account hijacking, fake video meetings, recording of victims, malware delivery, and targeting of open-source developers.","category":"advisory","primary":true},{"title":"Still in the Meeting: BlueNoroff Six Months On","url":"http://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/","publisher":"Arctic Wolf","context":"The article cites Arctic Wolf researchers’ attribution of the campaign to BlueNoroff, its additional lures, and its identification of 677 targets across 58 countries.","category":"research","primary":false}],"body":"\u003cp\u003eThe U.S. government disrupted cloud-based infrastructure used by FaceStealer, an 18-month North Korean social-engineering campaign that stole more than $400 million in cryptocurrency. Researchers attributed the activity to the BlueNoroff group, and the FBI said the operation targeted people in cryptocurrency and Web3 roles as well as open-source developers. The campaign affected targets worldwide, with Arctic Wolf identifying 677 targets across 58 countries, especially founders and senior executives.\u003c/p\u003e\n\n\u003cp\u003eThe attackers hijacked accounts on Telegram, LinkedIn, Slack, and Discord to invite targets to fake video meetings, using recorded footage of familiar people to make the meetings appear credible. They then claimed a technical problem and directed victims to a supposed update, installer, or other fix that installed software capable of stealing cryptocurrency data, meeting-platform credentials, contacts, communications access, and webcam recordings. The FBI also described attempts against npm and Rust crate developers, including a thwarted effort against a maintainer of a popular JavaScript library with tens of millions of weekly downloads.\u003c/p\u003e\n"},{"n":4,"title":"Fake Purview Card: Three Footer Links, One Tutorial Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fake-purview-protected-message-three-footer-links-one-tutorial-page","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing email convincingly impersonated Microsoft Purview Message Encryption, but its Read the message button and legal footer links all led to the same newly created tutorial-hosted page. The key lesson is to hover footer links as well as action buttons: a genuine Purview message routes them to distinct Microsoft destinations.","briefOverview":"\u003cp\u003eA counterfeit Microsoft Purview Message Encryption email was delivered to four employees at a manufacturer of caravan and recreational-vehicle components, including the Italian general manager. It mimicked a protected-message card with a Microsoft-hosted lock icon, Purview wording, and a Redmond address in the footer. A human analyst classified the messages as malicious, and all four affected mailboxes were quarantined.\u003c/p\u003e\n\n\u003cp\u003eThe Read the message button, Privacy Statement link, and Learn More link all resolved to one public tutorial-builder page rather than separate destinations expected in a genuine Purview wrapper. The underlying destination appeared only in the platform’s preserved original-URL field because delivered links had been rewritten by receiver-side security controls. The hosted page displayed an Italian fake protected-file lure and had reportedly been created about two days earlier; the article does not establish what occurred after a recipient selected its document-viewing button.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, and ARC checks because it was sent through the sender organization’s authenticated Microsoft 365 tenant, while link reputation checks rated the tutorial-hosted URLs clean. An unrelated Italian business thread from 2016 appeared beneath the card under a subject referring to a proposal, creating another mismatch with the protected-message notice. The article’s practical lesson is to hover the privacy and help links, not only the main action button, because matching links to a non-Microsoft host can reveal a fake Purview message.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A counterfeit Microsoft Purview Message Encryption email reached four employees at a manufacturer, including the Italian general manager.","The email's Read the message button, Privacy Statement link, and Learn More link all led to the same page on a public tutorial-builder site, unlike a genuine Purview wrapper.","The message passed SPF, DKIM, DMARC, and ARC checks because it was sent from the sender organization's authenticated Microsoft 365 tenant.","The linked tutorial page displayed an Italian fake protected-file notice and a document-viewing button, and it was created about two days before capture.","A human analyst classified the email as malicious and quarantined all four affected mailboxes."],"insights":["Authentication checks can confirm that an email was sent through an authorized system without confirming that its content or destination is trustworthy, as this message passed SPF, DKIM, DMARC, and ARC validation.","A clean reputation result was not useful here because the destination was a long-lived, legitimate tutorial platform being abused to host a user-created lure rather than an attacker-owned domain.","Comparing the intended roles of links can expose impersonation: the primary action button, privacy notice, and help link should not all resolve to one non-Microsoft destination in a genuine Purview message.","The unrelated 2016 business thread and the subject line referring to a proposal provided a second structural inconsistency with the protected-message card."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's findings on phishing in the email gateway attack mix and the human element in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA's phishing guidance in support of teaching users to recognize deceptive messages.","category":"guide","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the FBI IC3 report to emphasize the scale and importance of phishing recognition.","category":"research","primary":false}],"body":"\u003cp\u003eA counterfeit Microsoft Purview Message Encryption email was delivered to four employees at a manufacturer of caravan and recreational-vehicle components, including the Italian general manager. It mimicked a protected-message card with a Microsoft-hosted lock icon, Purview wording, and a Redmond address in the footer. A human analyst classified the messages as malicious, and all four affected mailboxes were quarantined.\u003c/p\u003e\n\n\u003cp\u003eThe Read the message button, Privacy Statement link, and Learn More link all resolved to one public tutorial-builder page rather than separate destinations expected in a genuine Purview wrapper. The underlying destination appeared only in the platform’s preserved original-URL field because delivered links had been rewritten by receiver-side security controls. The hosted page displayed an Italian fake protected-file lure and had reportedly been created about two days earlier; the article does not establish what occurred after a recipient selected its document-viewing button.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, and ARC checks because it was sent through the sender organization’s authenticated Microsoft 365 tenant, while link reputation checks rated the tutorial-hosted URLs clean. An unrelated Italian business thread from 2016 appeared beneath the card under a subject referring to a proposal, creating another mismatch with the protected-message notice. The article’s practical lesson is to hover the privacy and help links, not only the main action button, because matching links to a non-Microsoft host can reveal a fake Purview message.\u003c/p\u003e\n"},{"n":5,"title":"ESLint Ends Paid Contributor Program as AI Upends Open Source Collaboration","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/eslint-ends-paid-contributor-program?utm_medium=feed","time":"17:27","priority":"MAY READ","score":55,"tldr":"ESLint has ended its five-year paid contributor program after AI-generated pull requests and disputes over disclosure made it too burdensome to determine which work deserved compensation. The move reflects a broader open-source shift toward stricter contribution controls as maintainers struggle with AI-driven review volume and low-quality submissions.","briefOverview":"\u003cp\u003eESLint has ended its paid contributor pool after five years, citing the difficulty of administering payments amid a growing volume of AI-generated issues and pull requests. The program paid outside contributors more than \u003cspan class=\"math inline\"\u003e\\(51,000 from 2022 through 2025, including \\)\u003c/span\u003e24,680 in 2025, and helped recruit several people who later joined the team. ESLint said the decision was not driven by expense, but by disputes over undisclosed AI use and the growing difficulty of determining whether work was primarily created by a person or an AI tool.\u003c/p\u003e\n\n\u003cp\u003eESLint still permits AI-assisted contributions when contributors disclose the use of AI, review the resulting work, and accept responsibility for it, but AI-generated pull requests must address issues explicitly accepted by the team. Other projects, including Rust, Godot, LLVM, Node.js, tldraw, the Linux kernel, and curl, have imposed new restrictions or changed their processes as AI-assisted submissions increase review workloads. The article warns that while tighter controls can reduce low-quality or irrelevant submissions, they may also limit opportunities for newcomers to learn, build relationships with maintainers, and become future project contributors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESLint ended its paid contributor pool after five years, citing the difficulty of handling AI-generated issues and pull requests and disputes over undisclosed AI use.","From 2022 through 2025, ESLint paid outside contributors $51,180 through the program, including $24,680 in 2025.","ESLint still permits AI-assisted contributions when their use is disclosed, the contributor reviews the work, and the contributor remains responsible for the submission.","Several open-source projects, including Godot, LLVM, tldraw, Node.js, and the Linux kernel, have introduced restrictions or additional requirements in response to the review burden created by AI-generated submissions.","A Linux Foundation study published in October found that 59% of surveyed maintainers reported growing generative-AI-related contributions, while respondents estimated that 25% of incoming pull requests were low-quality AI-generated submissions."],"insights":["AI has changed the practical value of a polished pull request because it may no longer show that its author understands the codebase or will be able to maintain the change after it is accepted.","At tldraw, one AI system generated inaccurate tasks from vague notes while other AI systems produced seemingly valid fixes for those tasks, showing that code can pass tests while solving a problem the project never intended to address.","LLVM excludes AI tools from work labeled \"good first issue\" because those tasks are intended to help newcomers learn the codebase rather than simply produce a completed change.","ESLint’s contributor-payment model became difficult to operate not because it was too expensive, but because maintainers could no longer reliably determine whether paid work was primarily produced by a person or by AI assistance.","Some projects are limiting outside pull requests even though those contributions have historically been a way to mentor newcomers and recruit future maintainers."],"referencedReports":[{"title":"2026 Octoverse Report","url":"https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/","publisher":"github","context":"The article cites GitHub's Octoverse report for statistics on the growing share and volume of pull requests started by AI agents.","category":"research","primary":false},{"title":"Linux Foundation Generative AI and Open Source Maintainer Survey","url":"https://www.linuxfoundation.org/press/new-lf-research-survey-shows-generative-ai-cuts-open-source-coding-time-in-half-but-25-of-incoming-pull-requests-are-considered-ai-slop","publisher":"linux-foundation","context":"The article cites a Linux Foundation study reporting that maintainers are seeing more generative-AI-related contributions and estimating that 25% of incoming pull requests are low quality.","category":"research","primary":false}],"body":"\u003cp\u003eESLint has ended its paid contributor pool after five years, citing the difficulty of administering payments amid a growing volume of AI-generated issues and pull requests. The program paid outside contributors more than \u003cspan class=\"math inline\"\u003e\\(51,000 from 2022 through 2025, including \\)\u003c/span\u003e24,680 in 2025, and helped recruit several people who later joined the team. ESLint said the decision was not driven by expense, but by disputes over undisclosed AI use and the growing difficulty of determining whether work was primarily created by a person or an AI tool.\u003c/p\u003e\n\n\u003cp\u003eESLint still permits AI-assisted contributions when contributors disclose the use of AI, review the resulting work, and accept responsibility for it, but AI-generated pull requests must address issues explicitly accepted by the team. Other projects, including Rust, Godot, LLVM, Node.js, tldraw, the Linux kernel, and curl, have imposed new restrictions or changed their processes as AI-assisted submissions increase review workloads. The article warns that while tighter controls can reduce low-quality or irrelevant submissions, they may also limit opportunities for newcomers to learn, build relationships with maintainers, and become future project contributors.\u003c/p\u003e\n"}]</script>
