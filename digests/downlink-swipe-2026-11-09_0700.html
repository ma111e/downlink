<script type="application/json" id="dl-articles">[{"n":4,"title":"Emerging Threat: (CVE-2026-123158) OpenSSH Password Authentication Bypass on musl Linux","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-123158-openssh-password-authentication-bypass-on-musl-linux/","time":"08:43","priority":"SHOULD READ","score":85,"tldr":"CVE-2026-123158 (“sshhole”) can let remote attackers bypass password authentication on vulnerable OpenSSH sshd instances built with musl and without PAM, especially Alpine Linux hosts. Patch to a fixed vendor package, restart sshd, and disable password authentication or restrict SSH access until remediation is confirmed.","briefOverview":"\u003cp\u003eCVE-2026-123158, known as “sshhole,” is a high-severity OpenSSH password authentication bypass affecting sshd built with the musl C library and without PAM, or with PAM disabled. An attacker able to reach an affected SSH service can log in without knowing an account password under specific conditions. The issue affects OpenSSH versions before 10.6p2 in the affected build configuration and has public reproduction labs available.\u003c/p\u003e\n\n\u003cp\u003eThe primary affected platform is Alpine Linux, whose openssh-server package is built this way by default, although some OpenWrt and Buildroot systems may also be exposed depending on their builds. Exploitation requires password authentication to be enabled, a target account password field in /etc/shadow to be exactly “*”, and another local account to have a SHA-crypt hash; accounts locked with “!” are not affected. Alpine has issued backported package fixes for supported releases 3.16 through 3.24, but defenders must restart sshd after updating. The article recommends disabling password authentication, auditing affected password fields, reviewing SSH logs, restricting TCP/22 access, and identifying musl-based OpenSSH systems with PAM disabled until patching is confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123158, also called “sshhole,” is an OpenSSH password-authentication bypass affecting sshd built with musl without PAM or with UsePAM disabled.","An attacker who can reach an affected SSH service can log in without knowing a password when password authentication is enabled, a target account’s /etc/shadow entry is exactly “*”, and another local account has a SHA-crypt hash.","Alpine Linux is the primary affected platform, while Debian, Ubuntu, Fedora, and Red Hat Enterprise Linux are outside the affected glibc-and-PAM configuration.","OpenSSH 10.6p2 fixes the flaw, and Alpine has backported patches for supported branches 3.16 through 3.24, though sshd must be restarted after updating.","Until patching is confirmed, the article recommends disabling password authentication on exposed musl-based hosts, auditing /etc/shadow for exactly “*” entries, and restricting TCP/22 access to trusted networks or a bastion host."],"insights":["A host reporting an older OpenSSH version may already be fixed because Alpine backported the patch while retaining older upstream version numbers, so package release information is more reliable than the version string alone.","Version-based exposure inventories cannot distinguish musl-based builds from glibc-based builds and therefore can both overstate and misidentify systems at risk.","The affected account condition is unusually specific: password fields containing exactly “*” are exposed under the stated conditions, while accounts locked with “!” are not affected.","CyCognito’s observed asset set was not a list of confirmed vulnerable hosts, and its dedicated active test did not confirm exploitability for any of those assets.","Installing an updated package is insufficient by itself because the running sshd service must be restarted for the fix to take effect."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-123158, known as “sshhole,” is a high-severity OpenSSH password authentication bypass affecting sshd built with the musl C library and without PAM, or with PAM disabled. An attacker able to reach an affected SSH service can log in without knowing an account password under specific conditions. The issue affects OpenSSH versions before 10.6p2 in the affected build configuration and has public reproduction labs available.\u003c/p\u003e\n\n\u003cp\u003eThe primary affected platform is Alpine Linux, whose openssh-server package is built this way by default, although some OpenWrt and Buildroot systems may also be exposed depending on their builds. Exploitation requires password authentication to be enabled, a target account password field in /etc/shadow to be exactly “*”, and another local account to have a SHA-crypt hash; accounts locked with “!” are not affected. Alpine has issued backported package fixes for supported releases 3.16 through 3.24, but defenders must restart sshd after updating. The article recommends disabling password authentication, auditing affected password fields, reviewing SSH logs, restricting TCP/22 access, and identifying musl-based OpenSSH systems with PAM disabled until patching is confirmed.\u003c/p\u003e\n"},{"n":1,"title":"LNbits Urges All Operators to Shut Down Their Bitcoin Lightning Wallet Servers Amid Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/lnbits-urges-all-operators-to-shut-down.html","time":"10:01","priority":"SHOULD READ","score":84,"tldr":"LNbits urged all operators to immediately shut down their Bitcoin Lightning wallet servers after active exploits drained funds from at least one instance. Patches were expected within 24–48 hours, while the project’s hosted my.lnbits.com service was taken offline.","briefOverview":"\u003cp\u003eLNbits urged all operators of its free, open-source Bitcoin Lightning wallet servers to shut them down amid a wave of attacks. The project said it had several security fixes to release and initially advised operators to disable its Paywall add-on while it investigated a possible bug. About 80 minutes later, it issued the broader shutdown notice covering LNbits servers, not Lightning nodes or other wallet software.\u003c/p\u003e\n\n\u003cp\u003eOne operator, Kevin Ravensberg, reported that new accounts exploited his server to withdraw 2,285,545 satoshis, or about 0.023 Bitcoin, before he could stop it. He said the attack ran from 09:22 to 14:00 UTC, beginning more than three hours before LNbits issued its first warning, and users of his BitTipBot Telegram bot could not access funds while fixes were pending. LNbits also shut down all instances on its my.lnbits.com hosted service, while a developer estimated patches would be available within 24 to 48 hours; as of 09:00 UTC, the project had not publicly identified the exact extension used or said how many servers were affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LNbits urged all operators of its open-source Bitcoin Lightning wallet servers to shut them down amid a wave of attacks while it prepares security fixes.","An operator reported that attackers used an exploit to withdraw 2,285,545 satoshis, about 0.023 Bitcoin, from his server before it was shut down.","LNbits initially told operators to disable its Paywall add-on, then issued a broader shutdown notice about 80 minutes later.","LNbits took its hosted my.lnbits.com instances offline and said services would return within 24 hours, while a developer estimated patches would be available within 24 to 48 hours.","The project had not publicly identified the exact add-on used in the reported incident or said how many servers were affected as of 09:00 UTC."],"insights":["The reported theft began more than three hours before LNbits issued its first public warning, indicating that at least one server was exposed before operators were told to take defensive action.","LNbits moved from advising operators to disable only the Paywall add-on to calling for all servers to be shut down within about 80 minutes, reflecting a rapid expansion of the response scope.","Although security testers reportedly confirmed the exact extension used in the reported incident, the project had not publicly identified it, leaving operators without confirmation of whether Paywall was the exploited component.","Users of BitTipBot could not access their funds while fixes were pending, illustrating that a security issue at the wallet-server layer could directly interrupt users’ access to digital money."],"referencedReports":[],"body":"\u003cp\u003eLNbits urged all operators of its free, open-source Bitcoin Lightning wallet servers to shut them down amid a wave of attacks. The project said it had several security fixes to release and initially advised operators to disable its Paywall add-on while it investigated a possible bug. About 80 minutes later, it issued the broader shutdown notice covering LNbits servers, not Lightning nodes or other wallet software.\u003c/p\u003e\n\n\u003cp\u003eOne operator, Kevin Ravensberg, reported that new accounts exploited his server to withdraw 2,285,545 satoshis, or about 0.023 Bitcoin, before he could stop it. He said the attack ran from 09:22 to 14:00 UTC, beginning more than three hours before LNbits issued its first warning, and users of his BitTipBot Telegram bot could not access funds while fixes were pending. LNbits also shut down all instances on its my.lnbits.com hosted service, while a developer estimated patches would be available within 24 to 48 hours; as of 09:00 UTC, the project had not publicly identified the exact extension used or said how many servers were affected.\u003c/p\u003e\n"},{"n":2,"title":"Taiwan-Based Hacker Used BOSSAI AI Agents to Steal Taipei Emergency Dispatch Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/taiwan-based-hacker-used-bossai-ai.html","time":"09:01","priority":"SHOULD READ","score":82,"tldr":"Acronis researchers say a Taiwan-based attacker used locally run, safety-stripped AI agents to steal Taipei emergency dispatch records and target poorly secured systems in Taiwan, Mexico, and Thailand. The case shows AI can scale reconnaissance and exploitation, but the compromises largely relied on exposed APIs, default credentials, SQL injection flaws, and unpatched systems.","briefOverview":"\u003cp\u003eAcronis Threat Research Unit said a single attacker based in Hualien City, Taiwan, used a 12-agent AI setup called BOSSAI to target hundreds of organizations in at least 11 countries. The most serious confirmed activity involved Taiwan, where the agents pulled emergency dispatch records for seven Taipei districts from a 119 emergency-services API. The records included incident times, response types, case status, and street-level locations, while a separate Taipei fire department platform exposed patient data from 2018, including ECG readings and ambulance video footage, without a login.\u003c/p\u003e\n\n\u003cp\u003eThe agents also accessed a fire-dispatch technology vendor\u0026rsquo;s database administration panel using default root credentials, extracted data from a Taiwanese lending firm and three Thai universities through SQL injection, and collected about 206,800 Mexican home-phone records containing names and addresses. Commercial models including Grok and MiniMax M3 generally refused direct attack requests, so the attacker primarily used locally run versions of DeepSeek, GLM, and Qwen with safety training removed. The operation also showed limitations: agents produced false positives, invented flaws, and failed against systems with enforced logins, valid-session requirements, or properly filtered endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis researchers said a single attacker based in Hualien City, Taiwan, used a setup called BOSSAI with AI agents to target hundreds of organizations in at least 11 countries.","The agents extracted emergency dispatch case records for seven Taipei districts from a public-facing 119 emergency-services API, including incident times, response types, case status, and street-level locations.","The agents found a Taipei fire department platform that exposed patient data from 2018, including ECG readings and ambulance video footage, without requiring a login.","Commercial AI models generally refused direct requests to conduct attacks, so the attacker used locally run safety-stripped versions of DeepSeek, GLM, and Qwen for most attack activity.","The confirmed compromises largely involved weak protections, including exposed data, default root credentials, SQL injection points, and unpatched Oracle databases."],"insights":["The BOSSAI agents did not communicate directly with one another; the attacker manually copied one agent's output into another, showing the operation still depended on human coordination.","AI-generated scanning results were unreliable: more than half of one tool's high- and critical-severity findings were false positives or incorrectly classified, and the main attack agent also claimed results that had not occurred.","The agents succeeded mainly against systems with existing weaknesses, but failed when login controls, valid-session requirements, or properly filtered endpoints were in place.","The attacker's operational server exposed extensive evidence of the campaign, including agent conversations, command history, credentials, tools, and victim data, which enabled Acronis's attribution work."],"referencedReports":[{"title":"BOSSAI: Inside the AI Attack Mesh That Targeted Taiwan's Emergency Services","url":"https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/","publisher":"acronis-threat-research-unit","context":"The article cites Acronis's technical analysis for details of the BOSSAI AI-agent operation and its targeting of Taiwan's emergency services.","category":"research","primary":true}],"body":"\u003cp\u003eAcronis Threat Research Unit said a single attacker based in Hualien City, Taiwan, used a 12-agent AI setup called BOSSAI to target hundreds of organizations in at least 11 countries. The most serious confirmed activity involved Taiwan, where the agents pulled emergency dispatch records for seven Taipei districts from a 119 emergency-services API. The records included incident times, response types, case status, and street-level locations, while a separate Taipei fire department platform exposed patient data from 2018, including ECG readings and ambulance video footage, without a login.\u003c/p\u003e\n\n\u003cp\u003eThe agents also accessed a fire-dispatch technology vendor\u0026rsquo;s database administration panel using default root credentials, extracted data from a Taiwanese lending firm and three Thai universities through SQL injection, and collected about 206,800 Mexican home-phone records containing names and addresses. Commercial models including Grok and MiniMax M3 generally refused direct attack requests, so the attacker primarily used locally run versions of DeepSeek, GLM, and Qwen with safety training removed. The operation also showed limitations: agents produced false positives, invented flaws, and failed against systems with enforced logins, valid-session requirements, or properly filtered endpoints.\u003c/p\u003e\n"},{"n":3,"title":"Former OpenAI Engineer Pleads Not Guilty to Planting Covert Device in Executive Meeting Room","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/former-openai-engineer-pleads-not.html","time":"07:05","priority":"MAY READ","score":68,"tldr":"Former OpenAI engineer Abdulrahman Alfozan pleaded not guilty to allegedly planting an encrypted covert recording device in an executive conference room to capture sensitive conversations. Prosecutors say he is a flight risk and faces up to five years in prison if convicted.","briefOverview":"\u003cp\u003eFormer OpenAI engineer Abdulrahman Alfozan pleaded not guilty in San Francisco federal court to a charge of intercepting oral communications. Prosecutors allege that he placed a sophisticated recording device in an executive OpenAI conference room to unlawfully capture sensitive conversations. A grand jury indicted him late last month on a single count, and his next hearing is scheduled for November 17, 2026.\u003c/p\u003e\n\n\u003cp\u003eAlfozan has been held without bail since his October 9, 2026 arrest and could face up to five years in prison, a $250,000 fine, and three years of supervised release if convicted. Court documents describe the alleged devices as bespoke and encrypted, and state that they were intended to record meetings involving senior OpenAI personnel and executives. Prosecutors also argued he was a flight risk, citing planned one-way travel by his wife and son shortly after his arrest and allegations that he had frequent WhatsApp contact with a member of the Saudi Royal Family.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former OpenAI engineer Abdulrahman Alfozan pleaded not guilty in San Francisco federal court to a charge of intercepting oral communications.","Prosecutors allege that Alfozan placed a sophisticated recording device in an OpenAI executive conference room to record sensitive conversations.","A grand jury indicted Alfozan late last month on one count of interception of oral communications.","Alfozan has been held without bail since his October 9, 2026 arrest, and his next hearing is scheduled for November 17, 2026.","If convicted, Alfozan faces up to five years in prison, a $250,000 fine, and three years of supervised release."],"insights":["Prosecutors cited the planned one-way international travel of Alfozan’s family, including Saudi government- and Saudi military-funded ticket arrangements, in arguing that he posed a flight risk.","Court filings allege that the recording devices were bespoke and encrypted, indicating that the alleged recordings were designed to be concealed and protected from easy access.","The alleged surveillance targeted senior OpenAI personnel and executives, raising the stakes because the conversations were described as sensitive.","The case includes an allegation that Alfozan was in frequent WhatsApp contact with a member of the Saudi Royal Family."],"referencedReports":[],"body":"\u003cp\u003eFormer OpenAI engineer Abdulrahman Alfozan pleaded not guilty in San Francisco federal court to a charge of intercepting oral communications. Prosecutors allege that he placed a sophisticated recording device in an executive OpenAI conference room to unlawfully capture sensitive conversations. A grand jury indicted him late last month on a single count, and his next hearing is scheduled for November 17, 2026.\u003c/p\u003e\n\n\u003cp\u003eAlfozan has been held without bail since his October 9, 2026 arrest and could face up to five years in prison, a $250,000 fine, and three years of supervised release if convicted. Court documents describe the alleged devices as bespoke and encrypted, and state that they were intended to record meetings involving senior OpenAI personnel and executives. Prosecutors also argued he was a flight risk, citing planned one-way travel by his wife and son shortly after his arrest and allegations that he had frequent WhatsApp contact with a member of the Saudi Royal Family.\u003c/p\u003e\n"}]</script>
