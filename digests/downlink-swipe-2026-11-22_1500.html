<script type="application/json" id="dl-articles">[{"n":2,"title":"Hackers exploit GL.iNet cloud flaw to infect routers, KVM devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/","time":"18:45","priority":"SHOULD READ","score":87,"tldr":"Attackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install persistent malware and reverse shells on routers and KVM devices, potentially exposing connected systems. GL.iNet has blocked the attack path and urges customers to update firmware, scan devices, preserve evidence, reset compromised systems, and rotate credentials.","briefOverview":"\u003cp\u003eGL.iNet confirmed that an unauthorized party exploited a vulnerability in its GoodCloud remote-management services to access customers’ routers and KVM devices and install malicious software. The company says it has fixed the cloud vulnerability and blocked the access path, preventing new infections through that route, but malware remains on devices that were already compromised. GL.iNet is investigating the incident, including whether computers connected to affected KVM devices were also compromised, and plans to notify identified customers through their cloud-account email addresses.\u003c/p\u003e\n\n\u003cp\u003eUsers and researchers reported custom malware, persistent backdoors, and root-level remote command access on affected devices. A malicious \u003ccode\u003eni.sh\u003c/code\u003e installer tailored to GL.iNet models downloads payloads, creates persistence through startup scripts and scheduled tasks, can install remote-access SSH keys, and replaces the legitimate \u003ccode\u003enetstat\u003c/code\u003e utility to conceal connections to a malicious server. RemoteToHome Consulting reported suspicious activity on 152 of 183 GL.iNet routers it analyzed, while some recovered malicious files had timestamps from December 2025, though the article says it is unclear whether those earlier infections were related.\u003c/p\u003e\n\n\u003cp\u003eGL.iNet recommends that customers install the latest security firmware and use the linked community-developed detection and cleanup tool, which checks for known files, processes, modified utilities, and persistence changes. The tool cannot identify every infection, and the developers warn that a firmware reinstall without retaining existing settings may be necessary because malicious configuration files can survive an ordinary update. Customers who suspect compromise are advised to preserve evidence before resetting, avoid restoring potentially infected configurations, rotate exposed credentials and access keys, and assess computers connected to affected KVM devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GL.iNet confirmed that an unauthorized party exploited a vulnerability in its cloud remote-management services to access customer routers and KVM devices and install malicious software.","GL.iNet says it blocked the attack path and fixed the cloud vulnerability, but those measures do not remove malware from devices already infected.","Researchers and users reported persistent backdoors and root-level reverse shells on affected devices, including outbound connections to 170.39.226[.]219.","A malicious ni.sh script tailored for GL.iNet devices downloads payloads, creates persistence through startup scripts and scheduled tasks, and can hide connections by replacing the legitimate netstat utility.","GL.iNet recommends installing the latest security firmware, using its linked detection and cleanup tool, preserving evidence before resets, avoiding restoration of old configurations, and rotating exposed credentials or access keys."],"insights":["A normal firmware upgrade may not fully remove the infection because malicious files stored in device configuration directories can survive if existing settings are retained.","The malware can replace the legitimate netstat utility with a script that hides connections to a malicious server, making routine network checks less reliable.","In one analysis of 183 managed GL.iNet routers, 152 showed suspicious activity, including 24 with root-level reverse shells and 47 with an older persistent backdoor.","Because compromised KVM devices may provide access to the computers they control, GL.iNet advises that connected computers also be examined for compromise.","Some recovered malicious files had timestamps from December 2025, indicating that certain infections may have existed for months, although their connection to the November incident is unconfirmed."],"referencedReports":[{"title":"GL.iNet Security Incident 2026","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026","publisher":"remotetohome-consulting","context":"RemoteToHome Consulting analyzed 183 GL.iNet routers it owns or manages and reported suspicious activity, reverse shells, persistent backdoors, and evidence of attacker-supplied commands.","category":"research","primary":false},{"title":"2026-11-20 GL.iNet Security Notice GoodCloud KVM Routers","url":"https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056/79","publisher":"gl-inet-forum-user","context":"The owner of a compromised GL-RM1 KVM shared network logs showing downloads of a malicious script and payloads, along with extensive outbound communications.","category":"research","primary":false}],"body":"\u003cp\u003eGL.iNet confirmed that an unauthorized party exploited a vulnerability in its GoodCloud remote-management services to access customers’ routers and KVM devices and install malicious software. The company says it has fixed the cloud vulnerability and blocked the access path, preventing new infections through that route, but malware remains on devices that were already compromised. GL.iNet is investigating the incident, including whether computers connected to affected KVM devices were also compromised, and plans to notify identified customers through their cloud-account email addresses.\u003c/p\u003e\n\n\u003cp\u003eUsers and researchers reported custom malware, persistent backdoors, and root-level remote command access on affected devices. A malicious \u003ccode\u003eni.sh\u003c/code\u003e installer tailored to GL.iNet models downloads payloads, creates persistence through startup scripts and scheduled tasks, can install remote-access SSH keys, and replaces the legitimate \u003ccode\u003enetstat\u003c/code\u003e utility to conceal connections to a malicious server. RemoteToHome Consulting reported suspicious activity on 152 of 183 GL.iNet routers it analyzed, while some recovered malicious files had timestamps from December 2025, though the article says it is unclear whether those earlier infections were related.\u003c/p\u003e\n\n\u003cp\u003eGL.iNet recommends that customers install the latest security firmware and use the linked community-developed detection and cleanup tool, which checks for known files, processes, modified utilities, and persistence changes. The tool cannot identify every infection, and the developers warn that a firmware reinstall without retaining existing settings may be necessary because malicious configuration files can survive an ordinary update. Customers who suspect compromise are advised to preserve evidence before resetting, avoid restoring potentially infected configurations, rotate exposed credentials and access keys, and assess computers connected to affected KVM devices.\u003c/p\u003e\n"},{"n":1,"title":"Cleverbridge warns hackers stole credit card numbers, CVVs in data breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cleverbridge-warns-hackers-stole-credit-card-numbers-cvvs-in-data-breach/","time":"15:43","priority":"SHOULD READ","score":82,"tldr":"E-commerce platform Cleverbridge says attackers stole customers’ payment card numbers, expiration dates, and CVV/CVC codes after unauthorized activity was detected on November 4, 2026. The company is notifying affected customers, offering credit monitoring, and advises them to watch for fraudulent charges and contact their card issuers.","briefOverview":"\u003cp\u003eCleverbridge, an e-commerce platform used by software and SaaS companies to process purchases and subscriptions, says attackers copied payment card data from its platform. The company detected unauthorized activity on November 4, 2026, temporarily took systems offline, and later restored them that day. It began notifying affected customers on November 20.\u003c/p\u003e\n\n\u003cp\u003eA notification shared with BleepingComputer says the stolen information includes card numbers, expiration dates, and CVV/CVC security codes, while names, contact information, and billing details were not copied. Cleverbridge has not disclosed how attackers accessed its systems, how long they remained there, how many customers were affected, or which client companies’ customers were impacted. The company says the incident was not ransomware and that attackers did not encrypt its systems.\u003c/p\u003e\n\n\u003cp\u003eCleverbridge has notified data protection authorities, law enforcement, payment card networks, and payment partners. It is working with TransUnion’s Cyberscout to provide affected customers with credit monitoring and fraud assistance. Customers are advised to review card statements for unauthorized transactions and contact their card issuers, which may decide to replace compromised cards.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cleverbridge detected unauthorized activity on November 4, 2026, temporarily took systems offline, and later determined that a third party copied payment card data stored on its platform.","A breach notification shared with BleepingComputer states that the stolen information included payment card numbers, expiration dates, and CVV/CVC security codes.","Cleverbridge says no other personal data, such as names, contact information, or billing details, were copied.","The company began notifying affected customers on November 20 and is working with TransUnion’s Cyberscout to provide credit monitoring and fraud assistance.","Cleverbridge said the incident was not ransomware and that its systems were not encrypted by the attackers."],"insights":["The inclusion of CVV/CVC codes is especially consequential because Cleverbridge notes these codes are used to verify payment card transactions.","The impact may extend across customers of multiple software and SaaS companies that use Cleverbridge, but the company has not identified which client businesses’ customers were affected.","Customers should not rely only on the absence of other stolen personal details, because Cleverbridge specifically advises reviewing card statements and contacting card issuers, which may choose to replace compromised cards.","Important details remain undisclosed, including how attackers entered the platform, how long they had access, how many customers were affected, and whether the card data was encrypted."],"referencedReports":[],"body":"\u003cp\u003eCleverbridge, an e-commerce platform used by software and SaaS companies to process purchases and subscriptions, says attackers copied payment card data from its platform. The company detected unauthorized activity on November 4, 2026, temporarily took systems offline, and later restored them that day. It began notifying affected customers on November 20.\u003c/p\u003e\n\n\u003cp\u003eA notification shared with BleepingComputer says the stolen information includes card numbers, expiration dates, and CVV/CVC security codes, while names, contact information, and billing details were not copied. Cleverbridge has not disclosed how attackers accessed its systems, how long they remained there, how many customers were affected, or which client companies’ customers were impacted. The company says the incident was not ransomware and that attackers did not encrypt its systems.\u003c/p\u003e\n\n\u003cp\u003eCleverbridge has notified data protection authorities, law enforcement, payment card networks, and payment partners. It is working with TransUnion’s Cyberscout to provide affected customers with credit monitoring and fraud assistance. Customers are advised to review card statements for unauthorized transactions and contact their card issuers, which may decide to replace compromised cards.\u003c/p\u003e\n"},{"n":3,"title":"Signal to block Siri, Gemini AI from capturing chats on iOS, Android","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/signal-to-block-siri-gemini-ai-from-capturing-chats-on-ios-android/","time":"15:15","priority":"SHOULD READ","score":78,"tldr":"Signal is adding protections on iOS and Android to prevent Siri and Gemini AI assistants from reading or capturing private chats, extending similar defenses previously introduced for Microsoft Recall. The safeguards are automatic where supported, though iOS screenshot blocking may also prevent users from taking their own Signal screenshots.","briefOverview":"\u003cp\u003eSignal announced new protections intended to stop Siri on iOS 27 and AI assistants such as Google Gemini on supported Android devices from capturing private conversations. Signal said the measures address operating-system features such as Siri’s Onscreen Awareness and Gemini Intelligence, which can access chat content displayed on screen. The company previously introduced a protection in May 2025 to block Microsoft Recall screenshots on Windows 11.\u003c/p\u003e\n\n\u003cp\u003eSignal said its engineers reverse engineered how AI systems access app data and designed protections to block verified extraction paths. On iOS, users can check Settings \u0026gt; App Security to ensure Block Siri AI is enabled, while Android automatically enables Screen Security when Signal detects an AI assistant attempting to access the screen. Signal warned that iOS protection also prevents users from taking their own Signal screenshots, and said it cannot currently provide screenshot-blocking protection on macOS; it recommends that macOS 27 users add Signal to Siri’s Excluded Apps list.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Signal announced protections intended to block Siri on iOS 27 and AI assistants such as Gemini from capturing Signal conversations on supported Android devices.","Signal said the measures are designed to prevent operating-system AI features, including Siri’s Onscreen Awareness and Google’s Gemini Intelligence, from accessing chat content displayed on screen.","On iOS, users can check Settings \u003e App Security to confirm that Block Siri AI is enabled, while Android enables Screen Security automatically when Signal detects an AI assistant attempting to access the screen.","Signal warned that the iOS protection also blocks users from taking screenshots of their own Signal conversations.","Signal said it currently cannot provide screenshot-blocking protection on macOS and recommends macOS 27 users add Signal to the Excluded Apps list in System Settings \u003e Siri."],"insights":["Signal’s protections are aimed at keeping chat content outside the reach of operating-system AI features, because those features can access what appears on screen rather than only data shared directly by the app.","The iOS safeguard has a practical privacy-versus-convenience tradeoff: blocking Siri’s access also prevents users from taking legitimate screenshots of Signal chats.","Signal says macOS currently has no equivalent screenshot-blocking protection, so macOS 27 users must manually exclude Signal from Siri in system settings.","Signal is urging Apple, Google, and Microsoft to document all ways AI systems can access screens, files, notifications, and app interfaces, and to provide developers with a clear opt-out mechanism."],"referencedReports":[],"body":"\u003cp\u003eSignal announced new protections intended to stop Siri on iOS 27 and AI assistants such as Google Gemini on supported Android devices from capturing private conversations. Signal said the measures address operating-system features such as Siri’s Onscreen Awareness and Gemini Intelligence, which can access chat content displayed on screen. The company previously introduced a protection in May 2025 to block Microsoft Recall screenshots on Windows 11.\u003c/p\u003e\n\n\u003cp\u003eSignal said its engineers reverse engineered how AI systems access app data and designed protections to block verified extraction paths. On iOS, users can check Settings \u0026gt; App Security to ensure Block Siri AI is enabled, while Android automatically enables Screen Security when Signal detects an AI assistant attempting to access the screen. Signal warned that iOS protection also prevents users from taking their own Signal screenshots, and said it cannot currently provide screenshot-blocking protection on macOS; it recommends that macOS 27 users add Signal to Siri’s Excluded Apps list.\u003c/p\u003e\n"}]</script>
