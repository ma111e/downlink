<script type="application/json" id="dl-articles">[{"n":1,"title":"FBI links $6.3 billion Binance crypto heist to North Korean hackers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-links-63-billion-binance-crypto-heist-to-north-korean-hackers/","time":"19:57","priority":"MUST READ","score":98,"tldr":"The FBI attributed the record $6.3 billion Binance cryptocurrency theft to North Korean TraderTraitor/Lazarus hackers, who allegedly gained access through a compromised DevOps engineer’s laptop. Binance says it has covered about 95% of affected assets and plans to resume withdrawals while authorities seek to block laundering addresses.","briefOverview":"\u003cp\u003eThe FBI has attributed the theft of more than \u003cspan class=\"math inline\"\u003e\\(6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor. The group is also tracked as Lazarus Group, Jade Sleet, and APT38. The theft, estimated at approximately \\)\u003c/span\u003e6.36 billion across ten blockchains, is described as the largest cryptocurrency heist on record.\u003c/p\u003e\n\n\u003cp\u003eBinance said the attackers compromised a DevOps engineer’s laptop, accessed a service container, and submitted unauthorized withdrawal transactions, with most funds transferred within 20 minutes. The FBI has observed the group converting stolen assets primarily into Ethereum and warned that the funds may be laundered through decentralized finance platforms and instant swap services; it published 628 addresses associated with the theft and asked relevant providers to block linked transactions. Binance said it has covered about 95% of the affected amount, will bear the losses rather than pass them to users, and intends to resume an initial phase of withdrawals on November 1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI attributed the theft of more than $6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor, also tracked as Lazarus Group, Jade Sleet, and APT38.","Binance said attackers used a compromised DevOps engineer’s laptop to access a service container and submit unauthorized withdrawal transactions, stealing approximately $6.36 billion across ten blockchains.","The FBI reported that the group has primarily converted the stolen assets into Ethereum and may further launder them through decentralized finance platforms and instant cryptocurrency swap services.","The FBI published 628 cryptocurrency addresses associated with the theft and asked exchanges, blockchain operators, and virtual asset service providers to block transactions linked to those addresses.","Binance said it had covered approximately 95% of the affected amount, would bear the financial losses rather than pass them to users, and planned to resume the first phase of withdrawals on November 1."],"insights":["The theft illustrates how compromising one employee device with access to operational systems can enable unauthorized withdrawals at exchange-wide scale.","Most of the approximately $6.36 billion was moved across ten blockchains within 20 minutes, highlighting the limited time available for exchanges and blockchain-service providers to respond after suspicious withdrawals begin.","The FBI’s publication of 628 laundering addresses gives cryptocurrency exchanges and related providers concrete indicators they can use to block transactions tied to the theft.","The group’s documented use of fake recruiting offers, malicious coding tests, and in-person relationship building shows that its operations rely heavily on deceiving employees rather than only targeting technical systems.","Binance said the final 5% of the affected amount is harder to replace because it consists of less-liquid tokens, indicating that recovery can depend on whether stolen assets can be acquired without readily available markets."],"referencedReports":[{"title":"North Korea Responsible for $6 Billion Binance Attack","url":"http://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack","publisher":"fbi","context":"The article cites the FBI security alert attributing the Binance theft to North Korean TraderTraitor hackers and listing cryptocurrency addresses tied to laundering activity.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe FBI has attributed the theft of more than \u003cspan class=\"math inline\"\u003e\\(6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor. The group is also tracked as Lazarus Group, Jade Sleet, and APT38. The theft, estimated at approximately \\)\u003c/span\u003e6.36 billion across ten blockchains, is described as the largest cryptocurrency heist on record.\u003c/p\u003e\n\n\u003cp\u003eBinance said the attackers compromised a DevOps engineer’s laptop, accessed a service container, and submitted unauthorized withdrawal transactions, with most funds transferred within 20 minutes. The FBI has observed the group converting stolen assets primarily into Ethereum and warned that the funds may be laundered through decentralized finance platforms and instant swap services; it published 628 addresses associated with the theft and asked relevant providers to block linked transactions. Binance said it has covered about 95% of the affected amount, will bear the losses rather than pass them to users, and intends to resume an initial phase of withdrawals on November 1.\u003c/p\u003e\n"},{"n":7,"title":"FBI Links North Korea's TraderTraitor to Record $6.43 Billion Binance Crypto Heist","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/fbi-links-north-koreas-tradertraitor-to.html","time":"07:03","priority":"MUST READ","score":98,"tldr":"The FBI attributed the record $6.43 billion Binance cryptocurrency theft to North Korea-linked TraderTraitor (Jade Sleet), with attackers converting much of the stolen assets to Ethereum for laundering. About $2.85 billion has been frozen, while Binance has begun gradually restoring withdrawals after the incident.","briefOverview":"\u003cp\u003eThe FBI attributed the theft of more than $6 billion in virtual assets from Binance to TraderTraitor, a North Korea-aligned group also tracked as Jade Sleet, Pressure Chollima, PUKCHONG, Slow Pisces, and UNC4899. The FBI, U.S. Secret Service, and IRS Criminal Investigation observed the group converting stolen assets primarily into Ethereum. The agency said the assets are expected to undergo further laundering through decentralized-finance and instant-swap services, and published wallet addresses associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(6.43 billion theft eclipsed the \\)\u003c/span\u003e1.46 billion stolen from Bybit in February 2025, making it the largest cryptocurrency theft in history. The funds were stolen across 11 blockchains, with 82% held on Ethereum and Bitcoin, and $2.85 billion has been frozen on-chain by Tether, Circle, Ripple, Arbitrum, and Optimism. Binance paused withdrawals after the incident but began progressively restoring them following security and readiness checks, while deposits remained available.\u003c/p\u003e\n\n\u003cp\u003eTraderTraitor has been active since at least 2020 and has previously been linked to cryptocurrency thefts involving DMM Bitcoin, Bybit, KelpDAO, and Bitget. Recent reporting described the group using trojanized Terraform providers and fake recruitment approaches to target people connected with cybersecurity, AI, blockchain, and recruitment companies. The malicious Terraform provider delivers a Bash loader that downloads operating-system-specific malware, including the FLATROOF information stealer and the ROOFDECK backdoor, affecting macOS, Linux, and Windows systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI attributed the theft of more than $6 billion in virtual assets from Binance to the North Korea-aligned TraderTraitor group, also known as Jade Sleet and several other names.","U.S. agencies observed the attackers converting stolen assets primarily into Ethereum, which the FBI said could be further laundered through decentralized finance and instant-swap services.","The $6.43 billion theft surpassed the $1.46 billion taken from Bybit in February 2025, making it the largest cryptocurrency theft in history according to the article.","Tether, Circle, Ripple, Arbitrum, and Optimism froze $2.85 billion of the $6.43 billion stolen assets on-chain.","Binance resumed the first phase of withdrawals after pausing them following the incident, while deposit services remained open."],"insights":["Although the theft spanned 11 blockchains, 82% of the stolen assets were on Ethereum and Bitcoin, showing that the largest share was concentrated in two major cryptocurrency ecosystems.","More than $2.85 billion of the $6.43 billion stolen was frozen on-chain by five platforms—Tether, Circle, Ripple, Arbitrum, and Optimism—demonstrating that a substantial portion of the assets could still be blocked after the theft.","TraderTraitor’s operations extend beyond cryptocurrency platforms: the group has used fake recruiting approaches and trojanized Terraform providers to target people in cybersecurity, AI, blockchain, and recruitment-related roles.","The malicious Terraform provider delivers a Bash-based downloader that selects malware for the victim’s operating system, allowing the campaign to target macOS, Linux, and Windows systems."],"referencedReports":[{"title":"North Korea Responsible for $6 Billion Binance Attack","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack","publisher":"fbi","context":"The FBI advisory attributes the Binance theft to TraderTraitor and describes the group’s apparent conversion of stolen assets into Ethereum for laundering.","category":"advisory","primary":true},{"title":"Binance: Largest Hack in History","url":"https://www.elliptic.co/insights/binance-largest-hack-in-history/","publisher":"elliptic","context":"The article cites Elliptic’s blockchain analysis on the scale of the theft and prior cryptocurrency thefts attributed to North Korea-linked actors.","category":"research","primary":false},{"title":"Suspected TraderTraitor Group Uses Trojanized Terraform Provider to Deliver Malware","url":"https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver","publisher":"zscaler-threatlabz","context":"The article references Zscaler ThreatLabz reporting that TraderTraitor used a trojanized Terraform provider as a malware-delivery method.","category":"research","primary":false},{"title":"Tracking AI Adoption in North Korean Threat Actor Tradecraft","url":"https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/","publisher":"microsoft","context":"The article cites Microsoft’s analysis of Jade Sleet using front companies, recruitment-themed targeting, and AI-assisted lures.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI attributed the theft of more than $6 billion in virtual assets from Binance to TraderTraitor, a North Korea-aligned group also tracked as Jade Sleet, Pressure Chollima, PUKCHONG, Slow Pisces, and UNC4899. The FBI, U.S. Secret Service, and IRS Criminal Investigation observed the group converting stolen assets primarily into Ethereum. The agency said the assets are expected to undergo further laundering through decentralized-finance and instant-swap services, and published wallet addresses associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(6.43 billion theft eclipsed the \\)\u003c/span\u003e1.46 billion stolen from Bybit in February 2025, making it the largest cryptocurrency theft in history. The funds were stolen across 11 blockchains, with 82% held on Ethereum and Bitcoin, and $2.85 billion has been frozen on-chain by Tether, Circle, Ripple, Arbitrum, and Optimism. Binance paused withdrawals after the incident but began progressively restoring them following security and readiness checks, while deposits remained available.\u003c/p\u003e\n\n\u003cp\u003eTraderTraitor has been active since at least 2020 and has previously been linked to cryptocurrency thefts involving DMM Bitcoin, Bybit, KelpDAO, and Bitget. Recent reporting described the group using trojanized Terraform providers and fake recruitment approaches to target people connected with cybersecurity, AI, blockchain, and recruitment companies. The malicious Terraform provider delivers a Bash loader that downloads operating-system-specific malware, including the FLATROOF information stealer and the ROOFDECK backdoor, affecting macOS, Linux, and Windows systems.\u003c/p\u003e\n"},{"n":3,"title":"Alpine Linux rebuilds GitLab after attempted RCE attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/alpine-linux-rebuilds-gitlab-after-attempted-rce-attack/","time":"15:11","priority":"MUST READ","score":92,"tldr":"Alpine Linux rebuilt its GitLab infrastructure and reset passwords after attackers attempted to exploit the critical CVE-2026-97229 GitLab RCE flaw. No compromise was confirmed, but incomplete logs meant the project could not rule out code execution or exposure of GitLab data and secrets.","briefOverview":"\u003cp\u003eAttackers attempted to exploit CVE-2026-97229 in Alpine Linux’s GitLab development infrastructure on October 20–21. The maximum-severity flaw affects GitLab’s CI/CD regular-expression compiler, Onigmo, bundled with Ruby, and can allow unauthenticated code execution through a specially crafted CI/CD configuration. The attempts caused eight GitLab worker crashes, with four described as partially successful but not apparently completing exploitation.\u003c/p\u003e\n\n\u003cp\u003eAlpine found no evidence of altered repository commits, packages, or releases through October 27, but could not rule out code execution because relevant logs and outbound-connection records were unavailable. It rebuilt the GitLab server from scratch and reset passwords because the instance hosts development repositories, code review, CI jobs, and the build recipes used for Alpine packages. Alpine initially used GitLab 19.3.4 and later 19.3.6, but its custom container image lacked the Ruby patch needed to fix the issue; it advised users to pull the October 27 alpinelinux/gitlab:19.3.6 image containing Ruby 3.3.13.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers attempted to exploit CVE-2026-97229 against Alpine Linux’s GitLab development infrastructure on October 20–21, causing eight worker-process crashes.","CVE-2026-97229 is a maximum-severity GitLab remote-code-execution flaw involving the Onigmo regular-expression compiler bundled with Ruby.","Alpine Linux initially deployed unpatched GitLab versions, and its custom container image lacked the Ruby patch required to fix the flaw even after an upgrade to GitLab 19.3.6.","Alpine found no evidence of altered commits, packages, or releases through October 27, but rebuilt its GitLab instance because missing logs prevented it from ruling out code execution.","Alpine advised GitLab users to reset their passwords and use the alpinelinux/gitlab:19.3.6 image published October 27, which includes Ruby 3.3.13 and addresses the flaw."],"insights":["Updating GitLab alone did not resolve the issue for Alpine because its custom container image lacked the required Ruby patch, unlike GitLab’s official packages.","Although Alpine found no evidence of tampering, missing logs and absent outbound-connection records prevented it from conclusively excluding a successful break-in, leading it to rebuild the server.","Alpine stated that signing keys were not stored on the GitLab server, limiting the risk that those keys were exposed during the incident.","The attackers downloaded Alpine’s GitLab container image, which Alpine said may indicate preparation for a supply-chain attack."],"referencedReports":[{"title":"GitLab security incident: CVE-2026-97229","url":"https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html","publisher":"alpine-linux","context":"Alpine Linux’s incident report explains why it rebuilt its GitLab instance after attempted exploitation of CVE-2026-97229.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers attempted to exploit CVE-2026-97229 in Alpine Linux’s GitLab development infrastructure on October 20–21. The maximum-severity flaw affects GitLab’s CI/CD regular-expression compiler, Onigmo, bundled with Ruby, and can allow unauthenticated code execution through a specially crafted CI/CD configuration. The attempts caused eight GitLab worker crashes, with four described as partially successful but not apparently completing exploitation.\u003c/p\u003e\n\n\u003cp\u003eAlpine found no evidence of altered repository commits, packages, or releases through October 27, but could not rule out code execution because relevant logs and outbound-connection records were unavailable. It rebuilt the GitLab server from scratch and reset passwords because the instance hosts development repositories, code review, CI jobs, and the build recipes used for Alpine packages. Alpine initially used GitLab 19.3.4 and later 19.3.6, but its custom container image lacked the Ruby patch needed to fix the issue; it advised users to pull the October 27 alpinelinux/gitlab:19.3.6 image containing Ruby 3.3.13.\u003c/p\u003e\n"},{"n":4,"title":"Hackers Steal About $2.7 Million From Polymarket Traders via Hijacked DebugBear Script","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-steal-about-27-million-from.html","time":"07:25","priority":"SHOULD READ","score":88,"tldr":"A DNS compromise at DebugBear caused Polymarket to load a malicious third-party script that hijacked authenticated trading sessions and stole roughly $2.7 million from users. Polymarket removed the script, paused relayer activity, reset sessions, and is refunding affected traders.","briefOverview":"\u003cp\u003eOn October 29, malicious code loaded on Polymarket through a replaced DebugBear page-speed monitoring script used some signed-in traders’ active sessions to sell positions and move funds to a hacker-controlled wallet. Polymarket said it would refund about \u003cspan class=\"math inline\"\u003e\\(2.7 million to 726 affected wallets, while blockchain records showed roughly \\)\u003c/span\u003e2.64 million reaching the attackers’ wallet in under an hour. DebugBear said its DNS records had been compromised through its domain registrar and that initial findings indicated the incident targeted one customer website.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the script read account details stored in the browser, including trading API keys, then located Polymarket’s order function and transaction signer. It did not send passwords, seed phrases, or private keys to its server; instead, it used the account’s existing signing capability and Polymarket’s relayer to submit requests. Polymarket removed the script, paused relayer actions and trading, cleared caches, reset active sessions, and referred the matter to law enforcement. The company also said it would pay an additional \u003cspan class=\"math inline\"\u003e\\(1.19 million to about 5,500 wallets affected by the trading pause or taken positions, for total returns of \\)\u003c/span\u003e3.9 million.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A compromised DebugBear script loaded by Polymarket on October 29 used signed-in traders’ existing access to sell positions or transfer assets to a hacker-controlled wallet.","Polymarket said it is refunding about $2.7 million to 726 affected wallets, while blockchain records showed about $2.64 million in crypto reached the attackers’ wallet in less than an hour.","DebugBear said its DNS records were compromised through its domain registrar and that its initial findings indicated the incident targeted one customer website.","The malicious code used Polymarket account information and the account’s own transaction-approval mechanism, rather than sending passwords, seed phrases, or private keys to its server.","Polymarket removed the script, paused relayer actions, cleared caches, reset active sessions, and referred the incident to law enforcement."],"insights":["The malicious script did not need to steal passwords, seed phrases, or private keys because it could use the transaction-approval capability already available in an authenticated Polymarket page.","Allowing a trusted content delivery address in a website security policy does not ensure the code served from that address is unchanged; the article notes that Subresource Integrity can make browsers reject altered files.","DebugBear provided separate copies of its monitoring script to customers, and researchers found that the swapped file was specifically Polymarket’s copy rather than a broadly changed script.","The attackers moved the stolen 28.6 million POL tokens to three additional addresses within about 10 minutes of the theft ending, according to the cited transaction history."],"referencedReports":[{"title":"Polymarket Breach Alert: Wallet Draining Code Found in a Third-Party Script","url":"https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/","publisher":"hudson-rock","context":"Hudson Rock analyzed the malicious DebugBear-hosted file and described how it used authenticated Polymarket sessions to drain trader assets.","category":"research","primary":true},{"title":"Polymarket DebugBear Wallet Drainer","url":"https://ohey.ca/research/polymarket-debugbear-wallet-drainer/","publisher":"ohey","context":"Ohey researchers traced the altered DebugBear infrastructure and the attacker wallet's transaction timeline.","category":"research","primary":true}],"body":"\u003cp\u003eOn October 29, malicious code loaded on Polymarket through a replaced DebugBear page-speed monitoring script used some signed-in traders’ active sessions to sell positions and move funds to a hacker-controlled wallet. Polymarket said it would refund about \u003cspan class=\"math inline\"\u003e\\(2.7 million to 726 affected wallets, while blockchain records showed roughly \\)\u003c/span\u003e2.64 million reaching the attackers’ wallet in under an hour. DebugBear said its DNS records had been compromised through its domain registrar and that initial findings indicated the incident targeted one customer website.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the script read account details stored in the browser, including trading API keys, then located Polymarket’s order function and transaction signer. It did not send passwords, seed phrases, or private keys to its server; instead, it used the account’s existing signing capability and Polymarket’s relayer to submit requests. Polymarket removed the script, paused relayer actions and trading, cleared caches, reset active sessions, and referred the matter to law enforcement. The company also said it would pay an additional \u003cspan class=\"math inline\"\u003e\\(1.19 million to about 5,500 wallets affected by the trading pause or taken positions, for total returns of \\)\u003c/span\u003e3.9 million.\u003c/p\u003e\n"},{"n":6,"title":"CVSS 10.0 LXD, MicroCloud Flaw Lets Attackers Impersonate Trusted Clients Without a Private Key","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-lxd-and-microcloud-flaw-cvss.html","time":"08:51","priority":"SHOULD READ","score":88,"tldr":"Canonical patched CVE-2026-112816, a CVSS 10.0 LXD and MicroCloud flaw that lets network-reachable attackers impersonate trusted mTLS clients using only their public certificates. Update LXD and MicroCloud immediately and restrict HTTPS API access until patched.","briefOverview":"\u003cp\u003eCanonical released fixes for CVE-2026-112816, a CVSS 10.0 flaw affecting LXD and MicroCloud. The issue could allow an attacker with network access to the HTTPS API and a trusted client’s public certificate to log in as that client without its private key. If the impersonated client has sufficient privileges, Canonical said the attacker could gain root access to the host machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from the server accepting any certificate in a supplied certificate chain that appears in its trust store, although only the first certificate is proven to belong to the connecting client. An attacker could therefore attach a trusted client’s public certificate behind their own certificate and be accepted as that trusted client. Canonical advised updating LXD and MicroCloud, verifying the installed version after refreshing snaps, and restricting network access to the API until patches are in place; there is no public evidence the flaw has been exploited.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-112816 is a CVSS 10.0 flaw in Canonical LXD and MicroCloud that can allow an attacker to impersonate a trusted client without its private key.","The issue occurs because the server checked every certificate supplied by a client against its trust store, even though the connection proves ownership only of the private key for the first certificate.","Exploitation requires network access to the HTTPS API and a public certificate for a client that the server already trusts.","Canonical released fixed LXD versions 6.10.1, 5.21.9, 5.0.11, and 4.0.15, plus MicroCloud versions 3.4.1 and 2.1.5.","There is no public evidence that the flaw has been exploited, and CISA assessed it as not known to be exploited as of October 30."],"insights":["The impersonation method does not require stealing a trusted client’s private key because its public certificate can be added behind an attacker-controlled certificate in the submitted certificate chain.","Standalone LXD installations are not exposed to this risk by default unless an administrator enables the network API with the core.https_address setting.","In MicroCloud, someone able to capture a member’s public certificate while it joins the cluster could later log in as that member.","There is no configuration-based fix for the issue; restricting access to the network listener is the only temporary risk-reduction step until updates are installed.","Because fixed LXD releases were still moving from the candidate channel to stable, administrators should verify the installed version after refreshing the snap."],"referencedReports":[{"title":"Security advisory: Critical vulnerability found in Canonical LXD and MicroCloud","url":"https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557","publisher":"canonical","context":"The article cites Canonical's advisory for the affected products, fixed versions, and mitigation guidance.","category":"advisory","primary":true},{"title":"GHSA-xg75-xf37-cph9","url":"https://github.com/lxc/incus/security/advisories/GHSA-xg75-xf37-cph9","publisher":"incus","context":"The article states that the Incus project reported the same certificate-validation flaw before Canonical confirmed that LXD was affected.","category":"advisory","primary":false}],"body":"\u003cp\u003eCanonical released fixes for CVE-2026-112816, a CVSS 10.0 flaw affecting LXD and MicroCloud. The issue could allow an attacker with network access to the HTTPS API and a trusted client’s public certificate to log in as that client without its private key. If the impersonated client has sufficient privileges, Canonical said the attacker could gain root access to the host machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from the server accepting any certificate in a supplied certificate chain that appears in its trust store, although only the first certificate is proven to belong to the connecting client. An attacker could therefore attach a trusted client’s public certificate behind their own certificate and be accepted as that trusted client. Canonical advised updating LXD and MicroCloud, verifying the installed version after refreshing snaps, and restricting network access to the API until patches are in place; there is no public evidence the flaw has been exploited.\u003c/p\u003e\n"},{"n":5,"title":"NetamLoader Malware Targets Government Windows 10 Systems in Asia via .NET Injection","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/netamloader-malware-targets-government.html","time":"07:02","priority":"SHOULD READ","score":78,"tldr":"Kaspersky uncovered NetamLoader, a sophisticated .NET-based malware chain targeting a government-only Windows 10 deployment in Asia, likely China, possibly through a supply-chain compromise. It uses AppDomainManager injection, AMSI bypasses, layered payloads, and long-delay C2 polling to run covertly in dllhost.exe.","briefOverview":"\u003cp\u003eKaspersky has detailed NetamLoader, a previously undocumented .NET loading framework discovered in an intrusion targeting a custom Windows 10 build used exclusively by government entities in Asia. The activity has not been attributed to a known threat actor, and Kaspersky identified one victim through telemetry. It is also unknown whether more systems were compromised or whether sensitive data was taken.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were contained in a CAB archive placed in a Windows Update-related directory alongside legitimate Patch My PC components. The chain uses .NET application startup settings to load malicious code, then decodes multiple layers of encrypted or compressed files, bypasses Windows antimalware scanning, and ultimately runs a plugin within dllhost.exe. That plugin collects system information, waits 20 to 40 minutes before contacting openaigpt4v[.]com, periodically retrieves further code to execute, and removes malicious files and certain execution records to conceal activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detailed a previously undocumented .NET assembly-loading framework called NetamLoader that targeted a custom Windows 10 build used exclusively by government organizations in Asia.","The NetamLoader files were packaged in a CAB archive placed in a Windows Update package directory, although the article says the exact delivery method remains unknown.","The infection chain abuses .NET's AppDomainManager mechanism to load malicious code through a legitimate Patch My PC component and uses layered encoded, compressed, or encrypted payloads.","The final .NET plugin gathers system information, waits 20 to 40 minutes before contacting the openaigpt4v[.]com command-and-control server, and periodically retrieves XAML files for execution.","Kaspersky telemetry identified one victim in Asia, and the activity has not been attributed to a known threat actor or linked conclusively to theft of sensitive information."],"insights":["The malware was placed in a Windows Update-related directory and used legitimate Patch My PC components, showing how malicious code can be made to appear alongside trusted software and update materials.","NetamLoader deletes extracted malicious files as well as CLR usage logs and Windows Prefetch cache files, indicating that its components were designed to remove records of their execution.","Its command-and-control behavior is deliberately infrequent: after an unsuccessful request, it can wait 22 to 28 hours before trying again while checking the elapsed time every 10 minutes.","The operation targeted a customized government-only Windows 10 build, underscoring Kaspersky's point that maintaining a specialized national software ecosystem also requires protecting its suppliers, updates, and operational processes."],"referencedReports":[{"title":"NetamLoader","url":"https://securelist.com/netamloader/121676/","publisher":"kaspersky","context":"The article relies on Kaspersky's technical analysis for details of the NetamLoader infection chain targeting a government-specific Windows 10 build in Asia.","category":"research","primary":true}],"body":"\u003cp\u003eKaspersky has detailed NetamLoader, a previously undocumented .NET loading framework discovered in an intrusion targeting a custom Windows 10 build used exclusively by government entities in Asia. The activity has not been attributed to a known threat actor, and Kaspersky identified one victim through telemetry. It is also unknown whether more systems were compromised or whether sensitive data was taken.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were contained in a CAB archive placed in a Windows Update-related directory alongside legitimate Patch My PC components. The chain uses .NET application startup settings to load malicious code, then decodes multiple layers of encrypted or compressed files, bypasses Windows antimalware scanning, and ultimately runs a plugin within dllhost.exe. That plugin collects system information, waits 20 to 40 minutes before contacting openaigpt4v[.]com, periodically retrieves further code to execute, and removes malicious files and certain execution records to conceal activity.\u003c/p\u003e\n"},{"n":8,"title":"The QR Link With No QR Code in a Calm Telecom Bill Lure","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/qr-service-link-no-qr-code-calm-telecom-bill-lure-landing-page-threat","time":"11:00","priority":"MAY READ","score":68,"tldr":"A calm Hebrew email impersonating Israeli carrier Pelephone hid every link behind a dynamic QR-code service URL, which redirected users to a cloned payment page threatening service suspension. The case shows defenders must follow and continuously evaluate redirect chains and compare displayed links with their real destinations, rather than relying on urgency-based email analysis alone.","briefOverview":"\u003cp\u003eA Hebrew email impersonating Israeli mobile carrier Pelephone was sent to an employee at an Israeli real-estate investment company. It claimed that a recurring payment had failed and asked the recipient to update payment details through a process described as quick, secure, and free. The calm message contained no deadline or service-blocking threat, but every clickable element pointed to a short link from a commercial dynamic QR-code service. Even a footer link displayed as \u003ccode\u003ewww[.]pelephone[.]co[.]il\u003c/code\u003e actually led to the redirector.\u003c/p\u003e\n\n\u003cp\u003eThe short link redirected to a cloned Pelephone page on a third-party Italian IT company’s development subdomain, with a path containing the misspelled name \u003ccode\u003ePelephone_Israsel\u003c/code\u003e. That page introduced the pressure absent from the email, warning that the recipient’s phone line would be blocked for calls, messages, and internet access if payment was not received. The article highlights that dynamic QR-service links can be editable redirectors even when no QR code appears in the email, so a safe verdict at delivery may not permanently describe the destination. IRONSCALES reported that its Malware and URL Protection followed the redirect, identified the final link as malicious, and automatically quarantined the affected mailbox.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Hebrew email impersonating Israeli carrier Pelephone told an employee at an Israeli real-estate investment company to refresh a payment method after a periodic charge failed.","Every clickable element in the email, including a footer link displayed as Pelephone’s real web address, pointed to a short link from a commercial dynamic QR-code service despite the message containing no QR code.","The short link redirected to a cloned Pelephone page hosted on a third-party Italian IT company’s development subdomain, where a modal warned that an unpaid account could lead to the phone line being blocked.","The email itself used calm language without a deadline or suspension threat, while the landing page contained the payment demand and service-blocking warning.","IRONSCALES reported that its Malware and URL Protection followed the redirect chain, classified the link as malicious, and automatically quarantined the affected mailbox."],"insights":["The phishing attempt split its persuasion across two stages: the email built trust with calm, routine billing language, while the redirected page introduced the threat of phone-service suspension.","A dynamic QR-code short link can function as an editable web redirect even when an email contains no QR code, meaning a delivery-time scan reflects only the destination at that moment.","The article notes that the evidence does not prove the link target changed after delivery, but the redirect service’s design permits its holder to change the destination without changing the visible short link.","A footer link that displays a legitimate brand domain but sends users elsewhere can be a strong impersonation signal, particularly because recipients may not inspect footer links as closely as main buttons.","Following redirect chains to inspect the final page was necessary in this case because the cloned branding, payment request, and service-blocking threat were absent from the email body itself."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for statistics on the human element in breaches, AI-assisted malicious email text, and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references this guidance when arguing that defenders should stop phishing early by following links to their destinations.","category":"guide","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the report to support the point that impersonation of trusted service providers remains profitable.","category":"research","primary":false}],"body":"\u003cp\u003eA Hebrew email impersonating Israeli mobile carrier Pelephone was sent to an employee at an Israeli real-estate investment company. It claimed that a recurring payment had failed and asked the recipient to update payment details through a process described as quick, secure, and free. The calm message contained no deadline or service-blocking threat, but every clickable element pointed to a short link from a commercial dynamic QR-code service. Even a footer link displayed as \u003ccode\u003ewww[.]pelephone[.]co[.]il\u003c/code\u003e actually led to the redirector.\u003c/p\u003e\n\n\u003cp\u003eThe short link redirected to a cloned Pelephone page on a third-party Italian IT company’s development subdomain, with a path containing the misspelled name \u003ccode\u003ePelephone_Israsel\u003c/code\u003e. That page introduced the pressure absent from the email, warning that the recipient’s phone line would be blocked for calls, messages, and internet access if payment was not received. The article highlights that dynamic QR-service links can be editable redirectors even when no QR code appears in the email, so a safe verdict at delivery may not permanently describe the destination. IRONSCALES reported that its Malware and URL Protection followed the redirect, identified the final link as malicious, and automatically quarantined the affected mailbox.\u003c/p\u003e\n"},{"n":2,"title":"OpenAI says it's doubling Pro usage limits and bringing Work features to Chat","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/openai-says-its-doubling-pro-usage-limits-and-bringing-work-features-to-chat/","time":"13:53","priority":"MAY READ","score":58,"tldr":"OpenAI is testing integration of ChatGPT Work features into regular Chat while unifying ChatGPT and Codex usage under a shared allowance. It has also doubled Work and Codex limits for eligible Pro subscriptions.","briefOverview":"\u003cp\u003eOpenAI says it is rolling out ChatGPT Work capabilities directly into regular Chat and will test a combined Chat and Work experience with a small group of users in the coming weeks. The integration is intended to let users move from ordinary conversations to more complex tasks without switching modes. OpenAI says users will be able to bring in files and plugins, ask ChatGPT to build a website or presentation, or have it perform tasks on the web while they review and guide its work.\u003c/p\u003e\n\n\u003cp\u003eOpenAI is also preparing to combine ChatGPT and Codex usage allowances for Pro subscribers, so activity in both services will draw from the same limit. Unlimited Instant is included in the subscription and will not count toward the shared allowance, while advanced models and complex tasks will consume more based on the work involved. Users will be able to view remaining combined usage and reset times in Settings \u0026gt; Usage, and can wait for a reset, upgrade, or buy credits for eligible features if they run out. Codex will remain a separate experience in the ChatGPT desktop app, and OpenAI has already doubled Work and Codex allowances for Pro 100, Pro 200, and Pro 500 plans, effective October 29.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI is testing a combined Chat and Work experience with a small group of users before expanding it more broadly.","The combined experience is intended to let users move from regular conversations to complex tasks, including working with files and plugins, without switching modes.","Codex will remain a separate experience in the ChatGPT desktop app.","OpenAI plans to make ChatGPT and Codex draw from a shared usage allowance, while Unlimited Instant usage will not count toward that allowance.","OpenAI doubled Work and Codex allowances for Pro 100, Pro 200, and Pro 500 subscriptions effective October 29."],"insights":["Although ChatGPT and Codex usage will be counted together, Codex will still remain a separate experience in the ChatGPT desktop app.","Not all activity will reduce the shared allowance: OpenAI says Unlimited Instant is included and does not count toward the limit.","Users who exhaust their combined allowance can wait for it to reset, upgrade their subscription, or buy credits for eligible features.","The Work-in-Chat integration is being introduced as a limited test rather than an immediate rollout to all users."],"referencedReports":[],"body":"\u003cp\u003eOpenAI says it is rolling out ChatGPT Work capabilities directly into regular Chat and will test a combined Chat and Work experience with a small group of users in the coming weeks. The integration is intended to let users move from ordinary conversations to more complex tasks without switching modes. OpenAI says users will be able to bring in files and plugins, ask ChatGPT to build a website or presentation, or have it perform tasks on the web while they review and guide its work.\u003c/p\u003e\n\n\u003cp\u003eOpenAI is also preparing to combine ChatGPT and Codex usage allowances for Pro subscribers, so activity in both services will draw from the same limit. Unlimited Instant is included in the subscription and will not count toward the shared allowance, while advanced models and complex tasks will consume more based on the work involved. Users will be able to view remaining combined usage and reset times in Settings \u0026gt; Usage, and can wait for a reset, upgrade, or buy credits for eligible features if they run out. Codex will remain a separate experience in the ChatGPT desktop app, and OpenAI has already doubled Work and Codex allowances for Pro 100, Pro 200, and Pro 500 plans, effective October 29.\u003c/p\u003e\n"}]</script>
