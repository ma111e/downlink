<script type="application/json" id="dl-articles">[{"n":2,"title":"Compromised GitHub accounts push CI secret stealer to tens of thousands of repositories","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories","time":"01:45","priority":"MUST READ","score":98,"tldr":"A threat actor used thousands of compromised GitHub accounts to inject short-lived malicious CI workflows into tens of thousands of repositories, stealing GitHub Actions secrets, cloud credentials, and other runner data. Organizations should immediately investigate the listed branches, pull requests, commits, and workflow indicators and rotate any credentials accessible to affected workflows.","briefOverview":"\u003cp\u003eStarting November 10, a threat actor used stolen GitHub credentials to open probe pull requests and push malicious payloads into tens of thousands of repositories. The campaign used compromised accounts to reach 61,764 repositories, including 10,431 repositories that the account did not own but could access through collaborator or organization permissions. The probe pull request was titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e and commonly originated from a \u003ccode\u003ewfx-docs\u003c/code\u003e branch.\u003c/p\u003e\n\n\u003cp\u003eThe malicious payload was designed to collect GitHub Actions secrets and variables, workflow tokens, cloud credentials, runner environment data, repository contents, caches, and build artifacts. The attacker generally reverted the changes within one minute and deleted workflow runs and logs, leaving a missing workflow-run number as a possible remaining trace. The article identified evidence that the payload ran in at least 1,806 repositories and advises affected organizations to assume every secret and cloud role available to their workflows was compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beginning November 10, a threat actor used stolen GitHub credentials to open probe pull requests in 61,764 repositories and then inject malicious payloads designed to steal CI secrets and cloud credentials.","The article identified evidence that the payload ran in at least 1,806 repositories, while the attacker deleted workflow runs and logs after collecting credentials.","Affected repositories may contain a wfx-docs branch, a pull request titled \"docs: dependency audit notes,\" or commits such as \"ci: refresh build cache\" and \"chore: add ci helper.\"","The payload can collect GitHub Actions secrets and variables, workflow tokens, cloud credentials, runner environment data, repository contents, caches, and build artifacts.","The campaign reached Packagist package digitalelvis/neuronai-studio version 3.14.3 and GitHub Go module github.com/onuragtas/docker-env versions v1.0.278 and v1.0.280."],"insights":["A \"docs: dependency audit notes\" pull request was used as an access probe, so its presence indicates the account was compromised even when the malicious workflow did not run.","More than 10,000 probe pull requests targeted repositories the compromised account did not own, showing that collaborator and organization access expanded the campaign beyond users' personal repositories.","The attacker typically reverted changes within one minute and deleted workflow logs, meaning a missing workflow run number may be the only remaining evidence of execution.","The identified Go module versions contain the payload only in GitHub Actions workflow files, so their source code and release binaries were unchanged and normal Go builds do not execute the malicious workflow."],"referencedReports":[],"body":"\u003cp\u003eStarting November 10, a threat actor used stolen GitHub credentials to open probe pull requests and push malicious payloads into tens of thousands of repositories. The campaign used compromised accounts to reach 61,764 repositories, including 10,431 repositories that the account did not own but could access through collaborator or organization permissions. The probe pull request was titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e and commonly originated from a \u003ccode\u003ewfx-docs\u003c/code\u003e branch.\u003c/p\u003e\n\n\u003cp\u003eThe malicious payload was designed to collect GitHub Actions secrets and variables, workflow tokens, cloud credentials, runner environment data, repository contents, caches, and build artifacts. The attacker generally reverted the changes within one minute and deleted workflow runs and logs, leaving a missing workflow-run number as a possible remaining trace. The article identified evidence that the payload ran in at least 1,806 repositories and advises affected organizations to assume every secret and cloud role available to their workflows was compromised.\u003c/p\u003e\n"},{"n":3,"title":"ARTEX and AI-Powered Red Teaming Tools: What Defenders Need to Know","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/","time":"23:00","priority":"SHOULD READ","score":84,"tldr":"Unit 42 reports that attackers are using AI-powered red-team frameworks such as ARTEX to autonomously probe exposed identity flows and APIs, rapidly validate credentials, and pursue cloud access at scale. Defenders should reduce public attack surface, protect self-service and write endpoints, remove exposed specifications and secrets, and detect the distinctive high-volume, adaptive behavior of autonomous agents.","briefOverview":"\u003cp\u003eUnit 42 reports that attackers are using AI-enabled red-teaming and penetration-testing tools, including ARTEX and CyberStrikeAI, to autonomously conduct offensive operations. The organization observed ARTEX in intrusion attempts against multiple targets, including cases where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents. ARTEX is described as an open-source, multi-agent AI penetration-testing framework that can evaluate responses, adapt after failures, and continue pursuing an objective. Unit 42 states that attackers can use it against internet-exposed identity workflows and APIs, then use obtained credentials and trust relationships to reach cloud environments.\u003c/p\u003e\n\n\u003cp\u003eAs of October 2026, Unit 42 identified 1,323 internet-facing CyberStrikeAI hosts and 609 ARTEX hosts, with 21 running both tools. Observed behavior associated with autonomous tooling included request bursts followed by 25–31 second pauses, rapid credential validation, immediate targeting of paths disclosed in OpenAPI specifications and source maps, retries after HTTP 422 errors, and repeated polling loops. Unit 42 recommends reducing public exposure by removing public attack maps and exposed tokens, authenticating every write endpoint, strengthening password-reset and registration flows, moving secrets into a secrets manager, and enforcing least privilege. It also advises detecting behavior such as canary usernames, cloud-key use from new IP addresses, write-then-delete storage tests, and early probing that precedes later intrusion activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 observed ARTEX in intrusion attempts against multiple targets and investigated intrusions where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents.","As of October 2026, Unit 42 identified 1,323 internet-facing hosts running CyberStrikeAI and 609 running ARTEX, including 21 hosts running both tools.","The article states that ARTEX can adapt after failed attempts, target internet-exposed identity workflows and APIs, and use associated credentials and trust relationships to reach cloud environments.","Observed ARTEX-like activity included brief request bursts followed by 25–31 second pauses, rapid validation of more than 200 client secrets, immediate targeting of routes found in OpenAPI specifications and source maps, and successful retries after HTTP 422 errors.","Unit 42 recommends removing public OpenAPI specifications, source maps and configuration files containing tokens or client IDs; requiring authentication for every write endpoint; hardening password-reset and registration flows; and hunting for behavior such as canary usernames, new-IP cloud-key use, and write-then-delete storage tests."],"insights":["Unit 42 found that automated ARTEX activity could turn public password-reset pages and exposed APIs into a route to cloud access without exploiting a software vulnerability.","The observed request pattern of one to 14 requests followed by 25–31 second pauses may reveal an automated system waiting for an AI model response, providing a behavioral detection opportunity even when infrastructure changes.","Current autonomous testing frameworks can be highly conspicuous: Unit 42 reported that Cairn generated hundreds of thousands of high-frequency requests across multiple edge protocols from one source IP address.","Generic error responses and silent connection throttling may hinder AI-driven tools because they rely on target responses to decide their next actions, potentially causing them to waste computing resources.","Unit 42 observed humans or browser automation still participating in sensitive stages of some operations, including password resets and initial token requests, despite the use of autonomous tooling."],"referencedReports":[],"body":"\u003cp\u003eUnit 42 reports that attackers are using AI-enabled red-teaming and penetration-testing tools, including ARTEX and CyberStrikeAI, to autonomously conduct offensive operations. The organization observed ARTEX in intrusion attempts against multiple targets, including cases where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents. ARTEX is described as an open-source, multi-agent AI penetration-testing framework that can evaluate responses, adapt after failures, and continue pursuing an objective. Unit 42 states that attackers can use it against internet-exposed identity workflows and APIs, then use obtained credentials and trust relationships to reach cloud environments.\u003c/p\u003e\n\n\u003cp\u003eAs of October 2026, Unit 42 identified 1,323 internet-facing CyberStrikeAI hosts and 609 ARTEX hosts, with 21 running both tools. Observed behavior associated with autonomous tooling included request bursts followed by 25–31 second pauses, rapid credential validation, immediate targeting of paths disclosed in OpenAPI specifications and source maps, retries after HTTP 422 errors, and repeated polling loops. Unit 42 recommends reducing public exposure by removing public attack maps and exposed tokens, authenticating every write endpoint, strengthening password-reset and registration flows, moving secrets into a secrets manager, and enforcing least privilege. It also advises detecting behavior such as canary usernames, cloud-key use from new IP addresses, write-then-delete storage tests, and early probing that precedes later intrusion activity.\u003c/p\u003e\n"},{"n":1,"title":"Baker Tilly notifies clients of data breach at third-party provider","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/baker-tilly-notifies-clients-of-data-breach-at-third-party-provider/","time":"23:01","priority":"MAY READ","score":72,"tldr":"Baker Tilly disclosed that a breach at an unnamed third-party service provider exposed client and dependent data, including names, addresses, and Social Security numbers. More than 10,000 Texans were affected, and the firm is offering 24 months of Experian credit and identity monitoring.","briefOverview":"\u003cp\u003eBaker Tilly Advisory Group is notifying certain clients that an unauthorized actor obtained data stored on a platform operated by an unnamed third-party service provider. The firm became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026. Baker Tilly said it contained the incident, engaged external experts, and notified law enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the total number of affected people, the provider involved, or the precise information exposed in its sample notice. However, the Texas Attorney General reports that 10,456 people in Texas were affected and lists Social Security numbers, full names, addresses, and other information among the exposed data types. Baker Tilly said it has no evidence of unauthorized activity on its own network and no reports of identity theft or fraud tied to the exposure, and it is offering 24 months of Experian credit and identity monitoring to affected individuals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Baker Tilly said an unauthorized actor obtained data relating to certain clients from a platform operated by a third-party service provider.","The company became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026.","Texas Attorney General data shows that 10,456 Texas residents were affected, with Social Security numbers, full names, addresses, and other information listed as exposed.","Baker Tilly said it found no evidence of unauthorized activity on its own network and had received no reports of identity theft or fraud linked to the incident.","The firm is offering affected individuals 24 months of credit and identity monitoring through Experian."],"insights":["The public customer notification leaves the specific data types as a placeholder and does not identify the third-party provider, while the Texas Attorney General portal provides more detail about the exposed information.","Baker Tilly said it found no evidence of unauthorized activity on its own network, indicating the disclosed exposure was associated with a platform operated by an outside provider used for client services.","Although the total number of affected people was not disclosed, Texas reporting alone lists 10,456 impacted individuals, showing that the incident affected a substantial number of clients or dependents.","BleepingComputer found no public ransomware-group claim for the incident at the time the article was published."],"referencedReports":[{"title":"Baker Tilly Sample Individual Notice","url":"https://www.documentcloud.org/documents/28880646-baker-tilly-sample-individual-notice/","publisher":"baker-tilly","context":"The article cites this breach notification as Baker Tilly's notice to affected customers about the third-party provider incident.","category":"advisory","primary":true}],"body":"\u003cp\u003eBaker Tilly Advisory Group is notifying certain clients that an unauthorized actor obtained data stored on a platform operated by an unnamed third-party service provider. The firm became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026. Baker Tilly said it contained the incident, engaged external experts, and notified law enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the total number of affected people, the provider involved, or the precise information exposed in its sample notice. However, the Texas Attorney General reports that 10,456 people in Texas were affected and lists Social Security numbers, full names, addresses, and other information among the exposed data types. Baker Tilly said it has no evidence of unauthorized activity on its own network and no reports of identity theft or fraud tied to the exposure, and it is offering 24 months of Experian credit and identity monitoring to affected individuals.\u003c/p\u003e\n"}]</script>
