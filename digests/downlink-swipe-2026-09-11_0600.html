<script type="application/json" id="dl-articles">[{"n":7,"title":"Cisco FMC Flaws Exploited to Steal Credentials and Deploy Qilin Ransomware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-fmc-flaws-exploited-to-steal.html","time":"06:19","priority":"MUST READ","score":97,"tldr":"Cisco warns that ransomware and state-linked threat clusters are actively exploiting two patched Secure Firewall Management Center flaws to gain access, steal credentials, deploy backdoors, and in one case launch Qilin ransomware. Organizations should immediately apply Cisco’s hotfixes for CVE-2026-20079 and CVE-2026-20316.","briefOverview":"\u003cp\u003eCisco disclosed that three threat clusters linked to ransomware and state-sponsored activity have exploited two recently patched vulnerabilities in Cisco Secure Firewall Management Center (FMC). CVE-2026-20079, rated 10.0, allows an unauthenticated remote attacker to bypass web-interface authentication, execute scripts, and obtain root access to the underlying operating system. CVE-2026-20316, rated 5.3, allows unauthenticated remote login through a low-privilege account and can be combined with other FMC flaws to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eUAT-12197 used the critical flaw to install JSP web shells and a Java-based command tool to query internal databases and obtain authentication data and credentials. UAT-11823 exploited both flaws to deploy a Netcat reverse shell, harvest managed-device configurations, and install a Cyclops Blink variant previously attributed to Sandworm. UAT-11988 used CVE-2026-20316 for initial access, conducted reconnaissance and credential collection with built-in FMC tools, and deployed Qilin ransomware on selected systems. Cisco urges affected customers to apply released hotfixes, while CISA has added both flaws to its Known Exploited Vulnerabilities catalog and requires U.S. federal civilian agencies to patch CVE-2026-20079 by September 12, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported that three threat clusters linked to ransomware and state-sponsored activity exploited two recently patched Cisco Secure Firewall Management Center vulnerabilities.","CVE-2026-20079 is a critical authentication-bypass flaw that can let an unauthenticated remote attacker execute scripts and obtain root access to the underlying operating system.","UAT-12197 used CVE-2026-20079 to deploy web shells and a Java-based command tool that queried internal databases for user authentication data and credentials.","UAT-11823 exploited both flaws to deploy a reverse shell, collect managed-device configurations, and install a Cyclops Blink variant.","UAT-11988 exploited CVE-2026-20316, used built-in FMC tools for reconnaissance and credential collection, and deployed Qilin ransomware on selected systems."],"insights":["The two flaws support different levels of access: CVE-2026-20079 can enable remote root-level access, while CVE-2026-20316 provides low-privilege access that can be combined with other FMC flaws to gain more control.","The same affected FMC platform was used for distinct attacker goals, including credential collection, harvesting managed-device configurations, deployment of a state-linked Cyclops Blink variant, and Qilin ransomware operations.","The Qilin-linked activity relied in part on legitimate built-in FMC tools to map the victim environment and identify systems for encryption, rather than relying only on externally introduced tools.","Patch urgency is reinforced by Cisco’s hotfix recommendation, its planned broader hardening release, and CISA’s requirement that U.S. federal civilian agencies remediate CVE-2026-20079 by September 12, 2026."],"referencedReports":[{"title":"FMC Ongoing Exploitation","url":"https://blog.talosintelligence.com/fmc-ongoing-exploitation/","publisher":"cisco-talos","context":"The article cites Cisco Talos's technical analysis identifying three threat clusters conducting post-compromise activity on Secure Firewall Management Center instances.","category":"research","primary":true}],"body":"\u003cp\u003eCisco disclosed that three threat clusters linked to ransomware and state-sponsored activity have exploited two recently patched vulnerabilities in Cisco Secure Firewall Management Center (FMC). CVE-2026-20079, rated 10.0, allows an unauthenticated remote attacker to bypass web-interface authentication, execute scripts, and obtain root access to the underlying operating system. CVE-2026-20316, rated 5.3, allows unauthenticated remote login through a low-privilege account and can be combined with other FMC flaws to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eUAT-12197 used the critical flaw to install JSP web shells and a Java-based command tool to query internal databases and obtain authentication data and credentials. UAT-11823 exploited both flaws to deploy a Netcat reverse shell, harvest managed-device configurations, and install a Cyclops Blink variant previously attributed to Sandworm. UAT-11988 used CVE-2026-20316 for initial access, conducted reconnaissance and credential collection with built-in FMC tools, and deployed Qilin ransomware on selected systems. Cisco urges affected customers to apply released hotfixes, while CISA has added both flaws to its Known Exploited Vulnerabilities catalog and requires U.S. federal civilian agencies to patch CVE-2026-20079 by September 12, 2026.\u003c/p\u003e\n"},{"n":4,"title":"PaperCut Replaces Emergency Patches With Fixes for Two Actively Exploited Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/papercut-replaces-emergency-patches.html","time":"06:46","priority":"MUST READ","score":96,"tldr":"PaperCut has released fully tested maintenance updates for PaperCut NG/MF that replace emergency patches for CVE-2026-81578 and CVE-2026-82078, two actively exploited flaws enabling authentication bypass and arbitrary code execution. Organizations should upgrade to versions 26.0.5, 25.0.13, or 24.1.10 immediately.","briefOverview":"\u003cp\u003ePaperCut released regular maintenance updates for PaperCut NG/MF that replace all previously issued emergency patches for two actively exploited security flaws. The available versions are 26.0.5, 25.0.13, and 24.1.10. PaperCut said the releases include fixes from Emergency Patch Releases 1, 2, and 3, additional security hardening, and complete quality-assurance and standard release testing.\u003c/p\u003e\n\n\u003cp\u003eThe flaws, CVE-2026-81578 and CVE-2026-82078, have been exploited to bypass authentication and execute arbitrary code on affected instances. GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the flaws to break into at least 395 organizations in 48 countries, with many targets in the U.S. education sector. The activity reportedly used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, and PaperCut advises customers on emergency-patch builds to move to the latest maintenance releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PaperCut released regular maintenance versions 26.0.5, 25.0.13, and 24.1.10 for PaperCut NG/MF, replacing its previous emergency patches.","The maintenance releases include the fixes from Emergency Patch Releases 1, 2, and 3, along with additional security hardening and standard quality-assurance testing.","CVE-2026-81578 and CVE-2026-82078 are being actively exploited to bypass authentication and execute arbitrary code on vulnerable PaperCut instances.","GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the two flaws to compromise at least 395 organizations in 48 countries, with many targets in the U.S. education sector.","PaperCut advises customers using an emergency patch build to move to a regular maintenance release."],"insights":["Organizations that installed PaperCut’s earlier emergency patches are still advised to upgrade, because the new maintenance releases supersede those builds and add further security hardening.","The reported campaign used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, illustrating that the actors conducted activity at scale across 48 countries.","The suspected actor reportedly avoided targets in Russia, China, Hong Kong, Thailand, Iran, and 23 additional countries, while concentrating many compromises in the U.S. education sector.","GreyNoise stated that it remains unclear whether the actor is only obtaining access for other actors or intends to use it directly for data theft or ransomware deployment."],"referencedReports":[{"title":"Security Bulletin — 27 August 2026 Urgent Security Advisory","url":"https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/","publisher":"PaperCut","context":"PaperCut’s advisory announces the tested maintenance releases that supersede the earlier emergency patches for the actively exploited flaws.","category":"advisory","primary":true}],"body":"\u003cp\u003ePaperCut released regular maintenance updates for PaperCut NG/MF that replace all previously issued emergency patches for two actively exploited security flaws. The available versions are 26.0.5, 25.0.13, and 24.1.10. PaperCut said the releases include fixes from Emergency Patch Releases 1, 2, and 3, additional security hardening, and complete quality-assurance and standard release testing.\u003c/p\u003e\n\n\u003cp\u003eThe flaws, CVE-2026-81578 and CVE-2026-82078, have been exploited to bypass authentication and execute arbitrary code on affected instances. GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the flaws to break into at least 395 organizations in 48 countries, with many targets in the U.S. education sector. The activity reportedly used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, and PaperCut advises customers on emergency-patch builds to move to the latest maintenance releases.\u003c/p\u003e\n"},{"n":5,"title":"Attackers Chain JFrog Artifactory Flaws to Gain Admin Control and Plant Backdoors","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-chain-jfrog-artifactory-flaws.html","time":"07:31","priority":"MUST READ","score":96,"tldr":"Attackers are actively chaining two patched JFrog Artifactory flaws, CVE-2026-42018 and CVE-2026-42016, to obtain administrator access and deploy persistent backdoors on unpatched self-hosted servers. Organizations should urgently upgrade, rotate join keys and tokens, and investigate for rogue admin accounts, plugins, and activity attributed to token:anonymous.","briefOverview":"\u003cp\u003eWiz observed attackers exploiting unpatched self-hosted JFrog Artifactory servers between August 15 and September 8 by chaining CVE-2026-42018 and CVE-2026-42016. The first flaw can provide an internal anonymous-user token to someone who has not logged in, while the second can let that low-privilege token be exchanged for one with administrator scope. Actions performed with the resulting token may appear in logs as \u003ccode\u003etoken:anonymous\u003c/code\u003e, despite having administrator-level permissions. Wiz saw some attackers create new administrator accounts in less than five minutes.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, attackers created persistent administrator accounts, installed malicious Groovy plugins that enabled code execution on the server, and ran shell commands to explore files. A dropper downloaded a binary over HTTP into locations such as \u003ccode\u003e/tmp\u003c/code\u003e and opened a command-and-control channel, while a custom Rust backdoor was also seen in multiple cases. Separately, CVE-2026-82329 is a critical authentication bypass that can grant unauthenticated attackers administrator privileges on its own across affected Artifactory release branches. Updating Artifactory is necessary, but it does not remove accounts, tokens, backdoors, or join keys that may already have been created or stolen, so the article recommends reviewing administrator accounts and configuration changes and rotating join keys and relevant tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wiz observed attacks from August 15 to September 8 that chained CVE-2026-42018 and CVE-2026-42016 in unpatched self-hosted JFrog Artifactory servers to obtain administrator-level access.","CVE-2026-42018 can return an internal anonymous-user token to an unauthenticated caller, while CVE-2026-42016 can allow a low-privilege token to be exchanged for one with administrator scope.","Attackers created administrator accounts, installed malicious Groovy plugins for server code execution, ran shell commands, and in some cases deployed a custom Rust backdoor.","CVE-2026-82329 is a separate critical authentication bypass that can grant unauthenticated attackers administrator privileges on affected Artifactory branches without requiring another flaw.","Patching does not remove administrator accounts, tokens, backdoors, or join keys that attackers may have already created or stolen, so affected organizations should also rotate join keys and tokens and review accounts and configuration changes."],"insights":["Administrator actions performed through the chained flaws can appear in Artifactory logs as \"token:anonymous,\" which can obscure that an attacker had elevated privileges.","Wiz observed some attackers progress from an unauthenticated request to creating a new administrator account in under five minutes.","Although the two-flaw chain does not affect certain newer Artifactory branches, the separate CVE-2026-82329 authentication bypass can still affect releases up to version 7.161.","For CVE-2026-82329, organizations unable to upgrade immediately can add a randomly generated extra join key in system.yaml so only their own keys are accepted during service registration.","Fastly recorded roughly 406,000 CVE-2026-82329 exploitation attempts on September 2, but noted that these traffic observations do not represent confirmed compromises."],"referencedReports":[{"title":"Artifactory Under Attack in the Wild: Exploitation of CVE-2026-42016 and CVE-2026-42018","url":"https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201","publisher":"wiz","context":"The article relies on Wiz's report for details of observed exploitation, attacker actions, and indicators of compromise.","category":"research","primary":true},{"title":"CVE-2026-82329: JFrog Artifactory Authentication Bypass Exploitation Activity","url":"https://www.fastly.com/blog/cve-2026-82329-jfrog-artifactory-authentication-bypass-exploitation-activity","publisher":"fastly","context":"The article cites Fastly's analysis for public exploit and scanning activity, exploitation-attempt volume, and post-compromise response guidance.","category":"research","primary":false},{"title":"JFrog Security Advisories","url":"https://docs.jfrog.com/releases/docs/jfrog-security-advisories","publisher":"jfrog","context":"The article references JFrog's advisories for affected Artifactory versions, fixed releases, and the workaround for CVE-2026-82329.","category":"advisory","primary":false}],"body":"\u003cp\u003eWiz observed attackers exploiting unpatched self-hosted JFrog Artifactory servers between August 15 and September 8 by chaining CVE-2026-42018 and CVE-2026-42016. The first flaw can provide an internal anonymous-user token to someone who has not logged in, while the second can let that low-privilege token be exchanged for one with administrator scope. Actions performed with the resulting token may appear in logs as \u003ccode\u003etoken:anonymous\u003c/code\u003e, despite having administrator-level permissions. Wiz saw some attackers create new administrator accounts in less than five minutes.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, attackers created persistent administrator accounts, installed malicious Groovy plugins that enabled code execution on the server, and ran shell commands to explore files. A dropper downloaded a binary over HTTP into locations such as \u003ccode\u003e/tmp\u003c/code\u003e and opened a command-and-control channel, while a custom Rust backdoor was also seen in multiple cases. Separately, CVE-2026-82329 is a critical authentication bypass that can grant unauthenticated attackers administrator privileges on its own across affected Artifactory release branches. Updating Artifactory is necessary, but it does not remove accounts, tokens, backdoors, or join keys that may already have been created or stolen, so the article recommends reviewing administrator accounts and configuration changes and rotating join keys and relevant tokens.\u003c/p\u003e\n"},{"n":6,"title":"China-Linked UNC3569 Exploited Sogou Input Method Flaw to Deploy GRAYRABBIT Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/china-linked-unc3569-exploited-sogou.html","time":"07:14","priority":"MUST READ","score":93,"tldr":"China-linked UNC3569 exploited a Sogou Input Method Windows flaw to use a single crafted link to launch an outdated, unsandboxed Chromium instance and install the GRAYRABBIT backdoor. Tencent patched the link-handler entry point in Sogou Input Method version 16.3.0.3498, but its embedded Chromium 80 engine and disabled browser protections remain.","briefOverview":"\u003cp\u003eGen Digital said China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to install its GRAYRABBIT backdoor. The attack used a crafted \u003ccode\u003esgbiz:\u003c/code\u003e link to pass attacker-controlled arguments to Sogou’s settings program, which opened an attacker-selected site in the application’s built-in browser. Gen said a victim clicking the link was enough to give the attacker code execution with the logged-in user’s privileges, although Tencent said social engineering would be needed to have the user authorize a browser pop-up.\u003c/p\u003e\n\n\u003cp\u003eThe exploit used CVE-2021-38003, a Chrome JavaScript-engine flaw fixed in 2021 but still present in Sogou’s Chromium 80 build from 2020. Gen found that Sogou’s browser sandbox and same-origin protection were disabled, removing a normal barrier between a compromised web page and the computer. The payload used a malicious DLL loaded through 7-Zip to install GRAYRABBIT, which provides remote command access and communicates over RC4-scrambled TCP on port 443.\u003c/p\u003e\n\n\u003cp\u003eTencent released a fix in Sogou Input Method version 16.3.0.3498 that blocks unapproved web addresses in the \u003ccode\u003esgbiz:\u003c/code\u003e link handler. However, Gen found that the product still uses Chromium 80 and retains the disabled browser security settings. The article advises updating Sogou Input Method and checking for published indicators, including files written to \u003ccode\u003eC:\\Users\\Public\\Documents\u003c/code\u003e and connections to \u003ccode\u003email.uaiubifas[.]top\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Gen Digital reported that China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to deploy the GRAYRABBIT backdoor.","A crafted sgbiz: link could pass attacker-controlled arguments to Sogou's settings program, which opened the attacker’s chosen website in its built-in browser.","The attack used CVE-2021-38003 in Sogou’s Chromium 80-based browser, whose sandbox and same-origin protections were disabled, to run code with the logged-in user’s privileges.","The attackers used a malicious DLL loaded by 7-Zip to decrypt and install GRAYRABBIT, which communicates with mail.uaiubifas[.]top over RC4-scrambled TCP traffic on port 443.","Tencent patched the link handler in Sogou Input Method version 16.3.0.3498, but Gen found that the embedded Chromium 80 engine and disabled browser security settings remained unchanged."],"insights":["Tencent’s patch restricts the web addresses accepted by the Sogou link handler, but Gen found that the product still uses Chromium 80 with its sandbox and web-security protections disabled.","The malicious loader avoided many automated analysis environments by decrypting its payload only when it detected at least 50 running processes, then removed itself using an NTFS alternate data stream.","Even though the backdoor used port 443, its communications were RC4-scrambled plain TCP rather than normal TLS-encrypted web traffic, providing a specific detection clue.","The affected input method has a very large potential reach: Citizen Lab estimated more than 455 million monthly users across Windows, Android, and iOS, although Gen’s reported flaw is in the Windows version."],"referencedReports":[{"title":"One-Click Backdoor: Exploiting Sogou Input Method to Deploy GRAYRABBIT","url":"https://www.gendigital.com/blog/insights/research/one-click-backdoor-sogou","publisher":"gen-digital","context":"The article is based on Gen Digital’s research into UNC3569’s exploitation of Sogou Input Method and its analysis of Tencent’s patch.","category":"research","primary":true},{"title":"Down the GRAYRABBIT Hole: Exposing UNC3569 and Its Modus Operandi","url":"https://www.virusbulletin.com/uploads/pdf/conference/vb2024/papers/Down-the-GRAYRABBIT-hole-exposing-UNC3569-and-its-modus-operandi.pdf","publisher":"google-threat-intelligence","context":"The article cites Google Threat Intelligence’s analysis linking UNC3569 to China and describing the group’s targeting history and use of GRAYRABBIT.","category":"research","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article references CISA’s catalog to note that CVE-2021-38003 was added as a vulnerability known to have been exploited.","category":"advisory","primary":false},{"title":"TheHole New World: How a Small Leak Will Sink a Great Browser (CVE-2021-38003)","url":"https://starlabs.sg/blog/2022/12-thehole-new-world-how-a-small-leak-will-sink-a-great-browser-cve-2021-38003/","publisher":"star-labs","context":"The article cites STAR Labs’ technical analysis and working exploit code for CVE-2021-38003.","category":"research","primary":false}],"body":"\u003cp\u003eGen Digital said China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to install its GRAYRABBIT backdoor. The attack used a crafted \u003ccode\u003esgbiz:\u003c/code\u003e link to pass attacker-controlled arguments to Sogou’s settings program, which opened an attacker-selected site in the application’s built-in browser. Gen said a victim clicking the link was enough to give the attacker code execution with the logged-in user’s privileges, although Tencent said social engineering would be needed to have the user authorize a browser pop-up.\u003c/p\u003e\n\n\u003cp\u003eThe exploit used CVE-2021-38003, a Chrome JavaScript-engine flaw fixed in 2021 but still present in Sogou’s Chromium 80 build from 2020. Gen found that Sogou’s browser sandbox and same-origin protection were disabled, removing a normal barrier between a compromised web page and the computer. The payload used a malicious DLL loaded through 7-Zip to install GRAYRABBIT, which provides remote command access and communicates over RC4-scrambled TCP on port 443.\u003c/p\u003e\n\n\u003cp\u003eTencent released a fix in Sogou Input Method version 16.3.0.3498 that blocks unapproved web addresses in the \u003ccode\u003esgbiz:\u003c/code\u003e link handler. However, Gen found that the product still uses Chromium 80 and retains the disabled browser security settings. The article advises updating Sogou Input Method and checking for published indicators, including files written to \u003ccode\u003eC:\\Users\\Public\\Documents\u003c/code\u003e and connections to \u003ccode\u003email.uaiubifas[.]top\u003c/code\u003e.\u003c/p\u003e\n"},{"n":1,"title":"Trezor: 347,000 users targeted in phishing attacks after Brevo breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/trezor-347-000-users-targeted-in-phishing-attacks-after-brevo-breach/","time":"07:55","priority":"SHOULD READ","score":82,"tldr":"A breach of Trezor’s email provider Brevo exposed its newsletter list to phishing, with attackers targeting roughly 347,000 addresses and 2,500 recipients clicking a malicious link before it was disabled. Trezor says no other internal systems were compromised, but affected users should expect further wallet-themed phishing attempts.","briefOverview":"\u003cp\u003eTrezor said attackers who breached its third-party email marketing provider, Brevo, used Trezor’s newsletter account to send phishing emails to customers. The campaign affected roughly 347,000 email addresses in Trezor’s opt-in newsletter database. The emails falsely warned of a microcontroller flaw in Trezor hardware wallets and directed recipients to a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe link prompted recipients to download an app that asked for their wallet backup. Trezor said it removed the phishing domain within 20 minutes, limiting the number of customers who clicked it before removal to 2,500. The company suspended its Brevo account, said no other Trezor systems were affected, and warned that the exposed email addresses may be used in future phishing attempts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Brevo security incident allowed an unauthorized actor to send phishing emails from Trezor’s newsletter account to customers who had opted in to receive newsletters.","The phishing emails falsely claimed a vulnerability in Trezor wallet microcontrollers and directed recipients to download an app that requested their wallet backup.","Trezor said roughly 347,000 email addresses in its opt-in newsletter database were affected, and 2,500 users clicked the malicious link before it was disabled.","Trezor said it took down the phishing domain within 20 minutes, suspended its Brevo account, and that no other Trezor systems were affected.","Trezor warned that the exposed email addresses could be used in future phishing campaigns."],"insights":["The phishing campaign used a claim about a hardware flaw to persuade recipients to provide their wallet backup, showing that the attackers’ goal was access to customers’ crypto wallets rather than merely collecting email credentials.","Trezor’s removal of the phishing domain within 20 minutes limited confirmed link clicks to 2,500, despite the campaign reaching a newsletter database of roughly 347,000 addresses.","This is Trezor’s third disclosed third-party-related customer-data incident since January 2024, following breaches involving its support portal and shipping provider ShipMonk.","The earlier ShipMonk breach exposed more than email addresses, including customers’ names, shipping addresses, and phone numbers, which could make future phishing attempts more personalized."],"referencedReports":[],"body":"\u003cp\u003eTrezor said attackers who breached its third-party email marketing provider, Brevo, used Trezor’s newsletter account to send phishing emails to customers. The campaign affected roughly 347,000 email addresses in Trezor’s opt-in newsletter database. The emails falsely warned of a microcontroller flaw in Trezor hardware wallets and directed recipients to a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe link prompted recipients to download an app that asked for their wallet backup. Trezor said it removed the phishing domain within 20 minutes, limiting the number of customers who clicked it before removal to 2,500. The company suspended its Brevo account, said no other Trezor systems were affected, and warned that the exposed email addresses may be used in future phishing attempts.\u003c/p\u003e\n"},{"n":2,"title":"Conti ransomware gang member sentenced to 4 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/conti-ransomware-gang-member-sentenced-to-four-years-in-prison/","time":"06:48","priority":"MAY READ","score":72,"tldr":"Ukrainian national Oleksii Lytvynenko was sentenced to four years in U.S. prison for helping the Conti ransomware operation steal data, send extortion demands, and develop malware used against at least 12 companies. Conti targeted more than 1,000 victims globally and collected over $150 million in ransom payments before shutting down in 2022.","briefOverview":"\u003cp\u003eUkrainian national Oleksii Oleksiyovych Lytvynenko was sentenced to four years in prison for his role in Conti ransomware attacks between 2021 and 2022. Arrested in Ireland in July 2023 at the United States’ request, he was extradited last year and pleaded guilty in June 2026 to conspiracy to commit wire fraud. He admitted to controlling stolen data from eight U.S. victims and four overseas victims and sending ransom notes as part of Conti’s extortion activity.\u003c/p\u003e\n\n\u003cp\u003eLytvynenko also admitted to coding a malware loader for a team led by another Conti conspirator, software intended to load tools needed for attacks. The Department of Justice said he personally harmed at least 12 companies, stored stolen victim data, and helped build Conti’s malicious tools. According to court documents, Conti targeted more than 1,000 victims worldwide and collected over $150 million in ransom payments before the operation shut down in 2022 amid law-enforcement pressure and leaked internal chats.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian national Oleksii Oleksiyovych Lytvynenko was sentenced to four years in prison for his role in Conti ransomware attacks between 2021 and 2022.","Lytvynenko was arrested in Ireland in July 2023 at the request of the United States and extradited last year.","He pleaded guilty in June 2026 to conspiracy to commit wire fraud, admitting that he controlled stolen data from 12 victims and sent ransom notes for Conti’s double-extortion operations.","Lytvynenko also admitted to writing a malware loader for a team operated by another Conti conspirator.","According to court documents, Conti targeted more than 1,000 victims worldwide and collected over $150 million in ransom payments while active."],"insights":["Lytvynenko’s conviction covered both direct participation in extortion and development of a malware loader, showing that Conti relied on specialized roles beyond people who deployed the ransomware.","The case involved cross-border law enforcement: Irish police arrested Lytvynenko at the United States’ request before he was extradited for prosecution.","Conti ceased operating in 2022 following law-enforcement pressure and leaked internal chats, but its members later dispersed into several other named criminal groups, including BlackCat, Black Basta, Hive, and BlackByte.","The FBI estimated that Conti-related victim payments had already exceeded $150 million by January 2022, while the group’s activity reached victims across 47 U.S. states, 31 foreign countries, Washington, D.C., and Puerto Rico."],"referencedReports":[],"body":"\u003cp\u003eUkrainian national Oleksii Oleksiyovych Lytvynenko was sentenced to four years in prison for his role in Conti ransomware attacks between 2021 and 2022. Arrested in Ireland in July 2023 at the United States’ request, he was extradited last year and pleaded guilty in June 2026 to conspiracy to commit wire fraud. He admitted to controlling stolen data from eight U.S. victims and four overseas victims and sending ransom notes as part of Conti’s extortion activity.\u003c/p\u003e\n\n\u003cp\u003eLytvynenko also admitted to coding a malware loader for a team led by another Conti conspirator, software intended to load tools needed for attacks. The Department of Justice said he personally harmed at least 12 companies, stored stolen victim data, and helped build Conti’s malicious tools. According to court documents, Conti targeted more than 1,000 victims worldwide and collected over $150 million in ransom payments before the operation shut down in 2022 amid law-enforcement pressure and leaked internal chats.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft fixes Teams, Outlook launch failures on ARM Windows PCs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-teams-outlook-launch-failures-on-arm-windows-pcs/","time":"09:39","priority":"MAY READ","score":68,"tldr":"Microsoft fixed a Windows 11 ARM bug that caused Teams and the new Outlook to fail or crash on devices such as the Surface Pro 11 and Surface Laptop 7. Affected users should install the September 8, 2026 cumulative update KB5124012 or later.","briefOverview":"\u003cp\u003eMicrosoft fixed a Windows 11 issue that prevented Microsoft Teams and the new Outlook for Windows from launching or caused them to close unexpectedly on ARM-based devices. The problem appeared after Windows security updates released on or after August 11, 2026, including KB5121003. Microsoft said it affected Windows 11 version 24H2 or later on devices such as the Surface Pro 11 and Surface Laptop 7.\u003c/p\u003e\n\n\u003cp\u003eThe issue was most likely to occur on new or freshly imaged PCs that had not yet installed Microsoft Store updates. Classic Outlook, Word, Excel, and other applications were not known to be affected, and Microsoft had initially suggested updating the Auto Super Resolution Package as a temporary workaround. Microsoft said the problem was resolved by the September 8, 2026 cumulative update KB5124012 and later Windows updates, and recommended that users install the latest update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft fixed an issue that caused Microsoft Teams and the new Outlook for Windows to fail to launch or close unexpectedly on ARM-based Windows 11 devices.","The issue affected devices running Windows 11 version 24H2 or later after security updates released on or after August 11, 2026, including KB5121003.","Microsoft said the problem was most likely on new or freshly imaged ARM-based PCs that had not installed Microsoft Store updates, while classic Outlook, Word, and Excel were not known to be affected.","Microsoft initially advised affected users to update the Auto Super Resolution Package as a temporary workaround.","Microsoft said the issue was resolved by the September 8, 2026 Windows update KB5124012 and later updates."],"insights":["The launch failures were most likely to affect newly set-up or freshly reimaged ARM-based PCs that had not yet received Microsoft Store updates, rather than all affected Windows devices equally.","Microsoft’s temporary workaround was to update the Auto Super Resolution Package, a component described as enabling smoother AI-assisted gameplay, even though the visible problem involved Teams and Outlook.","The issue was limited in known scope: Microsoft said classic Outlook, Word, Excel, and other applications were not known to be affected.","The fix was delivered through the September 2026 Windows cumulative update KB5124012, so installing a current Windows update addresses the issue rather than requiring users to replace Teams or Outlook."],"referencedReports":[{"title":"Microsoft Teams and Outlook might fail to launch on ARM-based devices","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-24h2#microsoft-teams-and-outlook-might-fail-to-launch-on-arm-based-devices","publisher":"microsoft","context":"Microsoft’s Windows release health advisory describes the ARM-based Windows 11 issue affecting Teams and the new Outlook.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft fixed a Windows 11 issue that prevented Microsoft Teams and the new Outlook for Windows from launching or caused them to close unexpectedly on ARM-based devices. The problem appeared after Windows security updates released on or after August 11, 2026, including KB5121003. Microsoft said it affected Windows 11 version 24H2 or later on devices such as the Surface Pro 11 and Surface Laptop 7.\u003c/p\u003e\n\n\u003cp\u003eThe issue was most likely to occur on new or freshly imaged PCs that had not yet installed Microsoft Store updates. Classic Outlook, Word, Excel, and other applications were not known to be affected, and Microsoft had initially suggested updating the Auto Super Resolution Package as a temporary workaround. Microsoft said the problem was resolved by the September 8, 2026 cumulative update KB5124012 and later Windows updates, and recommended that users install the latest update.\u003c/p\u003e\n"}]</script>
