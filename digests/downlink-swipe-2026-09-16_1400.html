<script type="application/json" id="dl-articles">[{"n":5,"title":"Attackers Exploit Issabel Framework Flaw Enabling Unauthenticated OS Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-issabel-framework.html","time":"15:50","priority":"MUST READ","score":96,"tldr":"Issabel Framework users should immediately apply the August 2026 patch for CVE-2026-89026, an actively exploited flaw that lets unauthenticated attackers forge JWTs and execute OS commands through Asterisk.","briefOverview":"\u003cp\u003eA critical flaw in the Issabel Framework, a web-based framework for open-source unified communications PBX software, is under active exploitation. Tracked as CVE-2026-89026, it has a CVSS v3.1 score of 9.8 and can allow unauthenticated remote attackers to execute arbitrary operating-system commands. Users are advised to apply the latest fixes.\u003c/p\u003e\n\n\u003cp\u003eThe issue was caused by a hard-coded HS256 JWT signing key in the pbxapi/index.php file that was identical across installations, enabling attackers to forge valid bearer tokens. Attackers can use those tokens with the /pbxapi/manager/originate endpoint and Asterisk\u0026rsquo;s System application to execute commands as the Asterisk user. Issabel pushed a patch on August 1, 2026, replacing the hard-coded key with a JWT key stored in /etc/issabel.conf. Shadowserver Foundation first observed exploitation on September 9, 2026, but the article says the actors, methods, and scale of the activity are currently unknown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-89026 is a critical Issabel Framework flaw that allows unauthenticated remote attackers to execute arbitrary operating-system commands.","The flaw stems from a hard-coded HS256 JWT signing key in pbxapi/index.php that was identical across Issabel installations, allowing attackers to forge bearer tokens.","Forged tokens can be used with the /pbxapi/manager/originate endpoint and Asterisk's System application to execute commands as the Asterisk user.","Issabel patched the issue on August 1, 2026, by replacing the hard-coded JWT key with one stored in /etc/issabel.conf.","Shadowserver Foundation first observed active exploitation of CVE-2026-89026 on September 9, 2026, and users are advised to apply the latest fixes."],"insights":["Because the JWT signing key was identical across every Issabel Framework installation, a token forged using that key could be valid on any unpatched installation.","The fix was released on August 1, 2026, more than a month before Shadowserver Foundation first observed exploitation on September 9, 2026.","Although active exploitation has been observed, the article states that the responsible actors, their methods, and the scale of the activity are not currently known."],"referencedReports":[{"title":"Issabel PBX Hard-Coded JWT Key RCE via PBXAPI Manager Originate","url":"https://www.vulncheck.com/advisories/issabel-pbx-hard-coded-jwt-key-rce-via-pbxapi-manager-originate","publisher":"vulncheck","context":"The article cites VulnCheck's alert for technical details on the hard-coded JWT key and the resulting unauthenticated command-execution path.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical flaw in the Issabel Framework, a web-based framework for open-source unified communications PBX software, is under active exploitation. Tracked as CVE-2026-89026, it has a CVSS v3.1 score of 9.8 and can allow unauthenticated remote attackers to execute arbitrary operating-system commands. Users are advised to apply the latest fixes.\u003c/p\u003e\n\n\u003cp\u003eThe issue was caused by a hard-coded HS256 JWT signing key in the pbxapi/index.php file that was identical across installations, enabling attackers to forge valid bearer tokens. Attackers can use those tokens with the /pbxapi/manager/originate endpoint and Asterisk\u0026rsquo;s System application to execute commands as the Asterisk user. Issabel pushed a patch on August 1, 2026, replacing the hard-coded key with a JWT key stored in /etc/issabel.conf. Shadowserver Foundation first observed exploitation on September 9, 2026, but the article says the actors, methods, and scale of the activity are currently unknown.\u003c/p\u003e\n"},{"n":9,"title":"Emerging Threat: (CVE-2026-70756) Oracle WebLogic Server Takeover via T3 and IIOP","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-70756-oracle-weblogic-server-takeover-via-t3-and-iiop/","time":"15:43","priority":"MUST READ","score":92,"tldr":"Oracle WebLogic Server CVE-2026-70756 is a critical pre-authentication flaw that can allow remote takeover through exposed T3 or IIOP services. Organizations should urgently apply Oracle’s September 2026 CPU and restrict external access to WebLogic listen ports until patching is complete.","briefOverview":"\u003cp\u003eCVE-2026-70756 is a critical Oracle WebLogic Server Core-component vulnerability with a CVSS v3.1 score of 9.8. An unauthenticated attacker with network access through T3 or IIOP can compromise an affected server and take full control of it. Oracle disclosed the issue on September 15, 2026, as part of its September 2026 Critical Security Patch Update.\u003c/p\u003e\n\n\u003cp\u003eAffected WebLogic versions are 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0. T3 and IIOP can be accessible on the same default listen ports used for HTTP traffic, including TCP/7001 and TCP/7002, meaning externally visible web application servers may also accept the vulnerable protocols. Oracle has released patches for all affected versions, while defenders are advised to inventory internet-facing instances, restrict T3 and IIOP access, disable unnecessary IIOP services, and review load balancer rules that forward full listen ports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-70756 is a critical Oracle WebLogic Server flaw with a CVSS v3.1 score of 9.8 that can allow an unauthenticated network attacker to take full control of a server through T3 or IIOP.","Oracle lists WebLogic Server versions 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0 as affected by CVE-2026-70756.","WebLogic instances can accept T3 and IIOP traffic on default HTTP listen ports such as TCP/7001 and TCP/7002, including when they appear externally as ordinary web application servers.","Oracle released fixes for all affected versions in its September 15, 2026 Critical Security Patch Update.","Until patching is confirmed, the article recommends identifying internet-facing WebLogic systems and restricting T3 and IIOP access to trusted internal sources."],"insights":["WebLogic can expose the affected T3 and IIOP services on the same default ports used for web traffic, so a server that appears to be only a normal website may still be reachable through the vulnerable interfaces.","Many affected systems may be missed by internal asset records because CyCognito identified most observed assets through service fingerprints rather than confirmed version detection.","Staging, testing, and development WebLogic instances are especially likely to remain externally reachable without the patch discipline applied to production systems.","Load balancers or reverse proxies that forward an entire WebLogic listen port, rather than limiting traffic to web requests, can unintentionally leave the affected services accessible from outside.","For older WebLogic 12.2.1.4.0 deployments, patch availability may depend on the organization’s Oracle support contract, so teams should verify eligibility rather than assume access."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-70756 is a critical Oracle WebLogic Server Core-component vulnerability with a CVSS v3.1 score of 9.8. An unauthenticated attacker with network access through T3 or IIOP can compromise an affected server and take full control of it. Oracle disclosed the issue on September 15, 2026, as part of its September 2026 Critical Security Patch Update.\u003c/p\u003e\n\n\u003cp\u003eAffected WebLogic versions are 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0. T3 and IIOP can be accessible on the same default listen ports used for HTTP traffic, including TCP/7001 and TCP/7002, meaning externally visible web application servers may also accept the vulnerable protocols. Oracle has released patches for all affected versions, while defenders are advised to inventory internet-facing instances, restrict T3 and IIOP access, disable unnecessary IIOP services, and review load balancer rules that forward full listen ports.\u003c/p\u003e\n"},{"n":11,"title":"Sensor v29.2: Behavioral Detection \u0026 AI Governance | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/sensor-v29-2","time":"15:36","priority":"MAY READ","score":35,"tldr":"Corelight announced Sensor v29.2, adding behavioral detection capabilities and AI governance features to its network monitoring platform.","briefOverview":"\u003cp\u003eThe article is titled “Sensor v29.2: Behavioral Detection \u0026amp; AI Governance” and is associated with Corelight. It concerns Corelight Sensor version 29.2. The title identifies behavioral detection and AI governance as the article’s central subjects.\u003c/p\u003e\n\n\u003cp\u003eThe article content supplied is not readable and does not provide recoverable technical detail. It does not clearly describe specific features, deployment requirements, affected organizations, or security impact. As a result, no further conclusions about Sensor v29.2 can be drawn from the article text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Corelight published an article titled “Sensor v29.2: Behavioral Detection \u0026 AI Governance.”","The article concerns version 29.2 of Corelight Sensor.","The title identifies behavioral detection as a top
