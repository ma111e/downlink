<script type="application/json" id="dl-articles">[{"n":28,"title":"Active Exploitation Attempts Target WSO2 API Manager JWT Bypass With Forged Admin Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/active-exploitation-attempts-target.html","time":"05:18","priority":"MUST READ","score":98,"tldr":"WSO2 API Manager and related products are under active exploitation for CVE-2026-5430, a critical JWT signature-validation bypass that lets attackers forge administrator tokens and potentially take over accounts. Organizations should immediately apply WSO2’s available fixes and updates.","briefOverview":"\u003cp\u003eA critical flaw in WSO2 API Manager, CVE-2026-5430, is being actively targeted, according to watchTowr. The issue involves improper verification of a cryptographic signature in JSON Web Tokens, which can allow authentication to be bypassed. WSO2 said tokens signed with unsupported algorithms may be accepted, potentially allowing unauthorized access, administrative-account compromise, and full account takeover.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr’s honeypot network captured forged JWTs with built-in administrator privileges on September 13, 2026. The affected software includes specified versions of WSO2 API Manager, API Control Plane, Traffic Manager, and Universal Gateway. Successful use of the flaw could provide access to API backend endpoints, credentials, consumer keys, and application secrets, while also allowing interception of sensitive data and interaction with internal services. WSO2 has released fixes through community pull requests and designated update levels for support subscription holders, and users are advised to apply them as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-5430 is a critical WSO2 JWT authentication flaw that allows unauthorized access when tokens are signed with unsupported algorithms but are accepted anyway.","watchTowr reported active exploitation attempts, including forged JWT tokens with administrator privileges captured by its honeypot network on September 13, 2026.","The affected products include WSO2 API Manager versions 4.1.0 through 4.6.0, along with specified versions of WSO2 API Control Plane, Traffic Manager, and Universal Gateway.","WSO2 has released fixes through community pull requests and update levels for WSO2 Support Subscription Holders.","According to watchTowr, successful exploitation could expose API backend endpoints, credentials, consumer keys, application secrets, sensitive data in transit, and internal services."],"insights":["The authentication failure is especially severe because the service accepts tokens signed with algorithms it does not support, rather than rejecting them.","The observed forged tokens already contained administrator privileges, indicating attempts to obtain high-level access rather than merely bypass a standard user login.","Because the affected software sits in the path of API requests to internal systems, a successful compromise could enable interception of sensitive data while it moves between services.","WSO2 has made fixes available both through public community pull requests and through specific update levels for support subscription holders, giving affected organizations clear remediation paths."],"referencedReports":[{"title":"WSO2-2026-5328 Security Advisory","url":"https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/","publisher":"wso2","context":"The article cites WSO2’s advisory for the description of the JWT authentication bypass and its potential for unauthorized access and account takeover.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical flaw in WSO2 API Manager, CVE-2026-5430, is being actively targeted, according to watchTowr. The issue involves improper verification of a cryptographic signature in JSON Web Tokens, which can allow authentication to be bypassed. WSO2 said tokens signed with unsupported algorithms may be accepted, potentially allowing unauthorized access, administrative-account compromise, and full account takeover.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr’s honeypot network captured forged JWTs with built-in administrator privileges on September 13, 2026. The affected software includes specified versions of WSO2 API Manager, API Control Plane, Traffic Manager, and Universal Gateway. Successful use of the flaw could provide access to API backend endpoints, credentials, consumer keys, and application secrets, while also allowing interception of sensitive data and interaction with internal services. WSO2 has released fixes through community pull requests and designated update levels for support subscription holders, and users are advised to apply them as soon as possible.\u003c/p\u003e\n"},{"n":1,"title":"Critical ScreenConnect flaw now actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-hackers-exploiting-critical-screenconnect-flaw/","time":"11:14","priority":"MUST READ","score":96,"tldr":"CISA says attackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect authorization flaw that can enable unauthorized file transfer and execution during remote sessions. Organizations should upgrade to ScreenConnect 26.6.5 or later immediately, as more than 1,000 exposed instances remain unpatched.","briefOverview":"\u003cp\u003eAttackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect flaw involving improper privilege management and missing authorization. CISA added the issue to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems within three days. The flaw affects ScreenConnect clients and can enable file transfer or execution through active remote sessions without authorization or host confirmation.\u003c/p\u003e\n\n\u003cp\u003eConnectWise issued temporary mitigation guidance on September 7, advising organizations to disable TransferFiles permissions, and later patched the flaw in ScreenConnect 26.6.5 and later. Shadowserver tracked more than 1,000 unpatched ScreenConnect instances exposed online, including 758 in North America and 180 in Europe. ScreenConnect has been repeatedly targeted: CISA has identified four actively exploited ScreenConnect flaws since 2024, and two have also been used in ransomware attacks.\u003c/p\u003e\n\n\u003cp\u003eConnectWise says its services are used by more than 100,000 IT providers worldwide, including managed service providers and IT teams that use ScreenConnect for troubleshooting, patching, and system maintenance. The article also notes that Kimsuky and several ransomware groups exploited a different ScreenConnect flaw, CVE-2024-1709, in 2024. In March, ConnectWise addressed CVE-2026-3564, a signature-verification issue that could allow attackers to hijack unpatched ScreenConnect servers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-84869, a critical ConnectWise ScreenConnect flaw, to its catalog of known exploited vulnerabilities after attackers began exploiting it in the wild.","The missing-authorization and privilege-management flaw can allow attackers with basic privileges to transfer or execute files through active remote sessions without host confirmation.","ConnectWise patched the vulnerability in ScreenConnect version 26.6.5 and later, after initially recommending that organizations disable TransferFiles permissions as a temporary mitigation.","CISA ordered U.S. federal agencies to secure affected systems within three days because of ongoing attacks.","Shadowserver tracked more than 1,000 unpatched ScreenConnect instances exposed online, including 758 in North America and 180 in Europe."],"insights":["The flaw is especially urgent because it is already being used in attacks and can be abused with only basic privileges, without requiring user interaction.","Disabling TransferFiles permissions was ConnectWise's temporary safeguard before the patch, making that setting a directly relevant control for organizations unable to upgrade immediately.","ScreenConnect is a recurring target: since 2024, CISA has listed four of its flaws as actively exploited, and two were also used in ransomware attacks.","The exposure has broad downstream implications because ScreenConnect is used by more than 100,000 IT providers worldwide, including managed service providers that maintain other organizations' systems."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's advisory states that CVE-2026-84869 was added to the Known Exploited Vulnerabilities Catalog and directs U.S. federal agencies to address it within three days.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect flaw involving improper privilege management and missing authorization. CISA added the issue to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems within three days. The flaw affects ScreenConnect clients and can enable file transfer or execution through active remote sessions without authorization or host confirmation.\u003c/p\u003e\n\n\u003cp\u003eConnectWise issued temporary mitigation guidance on September 7, advising organizations to disable TransferFiles permissions, and later patched the flaw in ScreenConnect 26.6.5 and later. Shadowserver tracked more than 1,000 unpatched ScreenConnect instances exposed online, including 758 in North America and 180 in Europe. ScreenConnect has been repeatedly targeted: CISA has identified four actively exploited ScreenConnect flaws since 2024, and two have also been used in ransomware attacks.\u003c/p\u003e\n\n\u003cp\u003eConnectWise says its services are used by more than 100,000 IT providers worldwide, including managed service providers and IT teams that use ScreenConnect for troubleshooting, patching, and system maintenance. The article also notes that Kimsuky and several ransomware groups exploited a different ScreenConnect flaw, CVE-2024-1709, in 2024. In March, ConnectWise addressed CVE-2026-3564, a signature-verification issue that could allow attackers to hijack unpatched ScreenConnect servers.\u003c/p\u003e\n"},{"n":25,"title":"Attackers Exploit WooCommerce Wholesale Lead Capture Flaw to Plant PHP Web Shells","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-woocommerce-wholesale.html","time":"05:48","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting CVE-2026-27540 in WooCommerce Wholesale Lead Capture versions through 2.0.3.1 to upload PHP web shells and take over vulnerable WordPress sites. Site owners should update immediately and check for unexpected PHP files, especially in uploads directories.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture WordPress plugin, which has more than 6,000 active installations. The issue affects all plugin versions through 2.0.3.1 and allows unauthenticated attackers to upload arbitrary files, including PHP backdoors, potentially leading to remote code execution. Wordfence said it had blocked more than 100,000 exploit attempts since June 2026.\u003c/p\u003e\n\n\u003cp\u003eObserved attacks send crafted requests to WordPress\u0026rsquo;s \u003ccode\u003e/wp-admin/admin-ajax.php\u003c/code\u003e endpoint using the \u003ccode\u003ewwlc_file_upload_handler\u003c/code\u003e action, a forged \u003ccode\u003efile_settings\u003c/code\u003e parameter, and a malicious \u003ccode\u003eshell.php\u003c/code\u003e file. The uploaded web shell reports host details and provides a browser-based form for placing more malicious files on a compromised site. Site owners are advised to look for unexpected or newly created PHP files, particularly in upload directories, and review suspicious requests using that action.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes two critical unauthenticated remote-code-execution flaw chains in The Events Calendar plugin, which is installed on more than 600,000 websites. The flaws, CVE-2026-78159 and CVE-2026-78006, require comments to be enabled on an event page and the plugin\u0026rsquo;s option to show comments on event pages to be active. Wordfence warned that the chains can be triggered through pending-comment previews and could enable site takeover, sensitive-data theft, and malware deployment; StellarWP fixed them in versions 6.17.3.1 and 6.17.4.1, respectively.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are actively exploiting CVE-2026-27540, a critical flaw in WooCommerce Wholesale Lead Capture versions through 2.0.3.1 that allows unauthenticated upload of arbitrary files, including PHP backdoors.","Wordfence said it has blocked more than 100,000 exploit attempts targeting the WooCommerce Wholesale Lead Capture flaw since June 2026.","Observed attacks submit crafted requests to the wwlc_file_upload_handler action with a forged file_settings parameter and a malicious PHP file named shell.php.","The uploaded PHP web shell reports host details and provides a browser-based form for placing additional malicious files on a compromised WordPress site.","Wordfence also disclosed two critical unauthenticated remote-code-execution flaw chains affecting The Events Calendar, which StellarWP addressed in versions 6.17.3.1 and 6.17.4.1."],"insights":["The WooCommerce Wholesale Lead Capture flaw can be abused without an account because its file-upload function does not properly validate file types.","A successful upload can provide attackers with a browser-based tool to place further malicious files on a compromised WordPress site.","Site owners can look for suspicious activity by reviewing requests to /wp-admin/admin-ajax.php that use the wwlc_file_upload_handler action and by checking for newly created PHP files in upload directories.","The two The Events Calendar attack paths can be triggered through pending-comment previews without moderator approval when comments are enabled on event pages and the relevant plugin option is active.","One The Events Calendar flaw chain can reset an administrator password, allowing an attacker to upload a malicious plugin and take complete control of the site."],"referencedReports":[{"title":"Attackers Actively Exploiting Critical Vulnerability in WooCommerce Wholesale Lead Capture Plugin","url":"https://www.wordfence.com/blog/2026/09/attackers-actively-exploiting-critical-vulnerability-in-woocommerce-wholesale-lead-capture-plugin/","publisher":"wordfence","context":"The article cites Wordfence's report on active exploitation of CVE-2026-27540 to upload PHP web shells through the WooCommerce Wholesale Lead Capture plugin.","category":"advisory","primary":true},{"title":"Wordfence Argus Identifies Two Critical Unauthenticated Vulnerability Chains Leading to Remote Code Execution in The Events Calendar Plugin","url":"https://www.wordfence.com/blog/2026/09/wordfence-argus-identifies-two-critical-unauthenticated-vulnerability-chains-leading-to-remote-code-execution-in-the-events-calendar-plugin/","publisher":"wordfence","context":"The article references Wordfence's technical analysis of two unauthenticated remote-code-execution chains affecting The Events Calendar plugin.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture WordPress plugin, which has more than 6,000 active installations. The issue affects all plugin versions through 2.0.3.1 and allows unauthenticated attackers to upload arbitrary files, including PHP backdoors, potentially leading to remote code execution. Wordfence said it had blocked more than 100,000 exploit attempts since June 2026.\u003c/p\u003e\n\n\u003cp\u003eObserved attacks send crafted requests to WordPress\u0026rsquo;s \u003ccode\u003e/wp-admin/admin-ajax.php\u003c/code\u003e endpoint using the \u003ccode\u003ewwlc_file_upload_handler\u003c/code\u003e action, a forged \u003ccode\u003efile_settings\u003c/code\u003e parameter, and a malicious \u003ccode\u003eshell.php\u003c/code\u003e file. The uploaded web shell reports host details and provides a browser-based form for placing more malicious files on a compromised site. Site owners are advised to look for unexpected or newly created PHP files, particularly in upload directories, and review suspicious requests using that action.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes two critical unauthenticated remote-code-execution flaw chains in The Events Calendar plugin, which is installed on more than 600,000 websites. The flaws, CVE-2026-78159 and CVE-2026-78006, require comments to be enabled on an event page and the plugin\u0026rsquo;s option to show comments on event pages to be active. Wordfence warned that the chains can be triggered through pending-comment previews and could enable site takeover, sensitive-data theft, and malware deployment; StellarWP fixed them in versions 6.17.3.1 and 6.17.4.1, respectively.\u003c/p\u003e\n"},{"n":20,"title":"Attackers Exploit Issabel Framework Flaw Enabling Unauthenticated OS Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-issabel-framework.html","time":"15:50","priority":"MUST READ","score":94,"tldr":"A critical Issabel Framework flaw, CVE-2026-89026, is being actively exploited to forge JWTs and remotely execute arbitrary commands as the Asterisk user without authentication. Organizations should apply Issabel’s August 2026 patch immediately.","briefOverview":"\u003cp\u003eA critical vulnerability in the Issabel Framework, CVE-2026-89026, is under active exploitation. The flaw has a CVSS v3.1 score of 9.8 and can let an unauthenticated remote attacker execute arbitrary operating-system commands. Issabel Framework is a web-based framework for open-source unified communications PBX software.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from a hard-coded HS256 JSON Web Token signing key in the \u003ccode\u003epbxapi\u003c/code\u003e \u003ccode\u003eindex.php\u003c/code\u003e file that was identical across installations. Attackers can forge valid bearer tokens and call the \u003ccode\u003e/pbxapi/manager/originate\u003c/code\u003e endpoint with Asterisk\u0026rsquo;s System application parameter, causing commands to run as the Asterisk user. Issabel released a patch on August 1, 2026, replacing the built-in key with one stored in \u003ccode\u003e/etc/issabel.conf\u003c/code\u003e, and Shadowserver Foundation first observed exploitation on September 9, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-89026 is a critical Issabel Framework vulnerability that allows unauthenticated remote attackers to execute arbitrary operating system commands.","The flaw stems from a hard-coded JWT signing key in the pbxapi index.php file that was identical across Issabel installations.","Attackers can forge bearer tokens and invoke the /pbxapi/manager/originate endpoint with Asterisk’s System application parameter to run commands as the Asterisk user.","Issabel released a patch on August 1, 2026, replacing the hard-coded JWT key with a key stored in /etc/issabel.conf.","Shadowserver Foundation first observed exploitation of the vulnerability on September 9, 2026, and users are advised to apply the latest fixes."],"insights":["Because the same built-in signing secret was used across every Issabel installation, a token forged for one vulnerable installation could be created without needing that installation’s own unique secret.","The available fix changes the signing secret from a hard-coded value to one stored locally in /etc/issabel.conf, making it specific to the installation rather than shared globally.","The patch was released on August 1, 2026, while Shadowserver Foundation first observed exploitation on September 9, 2026.","Although exploitation has been observed, the article states that the attackers, their methods, and the scale of the activity remain unknown."],"referencedReports":[{"title":"Issabel PBX Hard-Coded JWT Key RCE via PBXAPI Manager Originate","url":"https://www.vulncheck.com/advisories/issabel-pbx-hard-coded-jwt-key-rce-via-pbxapi-manager-originate","publisher":"vulncheck","context":"The article cites VulnCheck's alert for details on the hard-coded JWT key and the resulting unauthenticated command-execution path.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical vulnerability in the Issabel Framework, CVE-2026-89026, is under active exploitation. The flaw has a CVSS v3.1 score of 9.8 and can let an unauthenticated remote attacker execute arbitrary operating-system commands. Issabel Framework is a web-based framework for open-source unified communications PBX software.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from a hard-coded HS256 JSON Web Token signing key in the \u003ccode\u003epbxapi\u003c/code\u003e \u003ccode\u003eindex.php\u003c/code\u003e file that was identical across installations. Attackers can forge valid bearer tokens and call the \u003ccode\u003e/pbxapi/manager/originate\u003c/code\u003e endpoint with Asterisk\u0026rsquo;s System application parameter, causing commands to run as the Asterisk user. Issabel released a patch on August 1, 2026, replacing the built-in key with one stored in \u003ccode\u003e/etc/issabel.conf\u003c/code\u003e, and Shadowserver Foundation first observed exploitation on September 9, 2026.\u003c/p\u003e\n"},{"n":30,"title":"Google Patches Pixel Modem Flaw Amid Signs of Limited Targeted Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/google-patches-pixel-modem-flaw-amid.html","time":"11:15","priority":"MUST READ","score":94,"tldr":"Google patched CVE-2026-58704, a high-severity Pixel cellular modem privilege-escalation flaw that may be under limited targeted exploitation. Pixel users should install the September 2026 security update (patch level 2026-09-05 or later) immediately.","briefOverview":"\u003cp\u003eGoogle disclosed that CVE-2026-58704, a high-severity flaw in the Pixel Cellular Modem, may be under limited, targeted exploitation. The vulnerability has a CVSS score of 8.0 and is a privilege-escalation issue caused by a logic error. According to the NIST description cited in the article, a nearby attacker could bypass permissions and gain higher access without user interaction.\u003c/p\u003e\n\n\u003cp\u003eGoogle’s September 2026 Pixel updates fix CVE-2026-58704 along with 109 other security flaws. These include 88 privilege-escalation issues, 10 information-disclosure issues, nine remote-code-execution issues, and two denial-of-service issues. The update also addresses two high-severity Kernel privilege-escalation flaws and 46 critical-severity flaws affecting components such as BigOcean, the Bootloader, the IP Multimedia Subsystem, and the Trusted Execution Environment. Pixel devices with the 2026-09-05 security patch level or later resolve all identified issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google disclosed that CVE-2026-58704 is a high-severity privilege-escalation flaw in the Pixel Cellular Modem with a CVSS score of 8.0.","Google said it found indications that CVE-2026-58704 may be under limited, targeted exploitation in the wild.","The flaw is caused by a logic error that can permit a nearby attacker to bypass permissions and gain elevated privileges without user interaction.","Google's September 2026 Pixel updates address CVE-2026-58704 and 109 other security flaws.","Installing a Pixel security patch level of 2026-09-05 or later resolves all of the identified flaws."],"insights":["The modem flaw can be exploited by someone in nearby range without any action from the Pixel owner, making timely updates especially important despite Google describing the observed activity as limited and targeted.","The September 2026 Pixel release fixes far more than the actively exploited modem issue: it also addresses 46 critical-severity flaws in components including the bootloader, IP Multimedia Subsystem, and Trusted Execution Environment.","A Pixel device must have the 2026-09-05 security patch level or later to receive fixes for every issue identified in this update."],"referencedReports":[{"title":"Pixel Update Bulletin—September 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01","publisher":"google","context":"The article cites Google's Pixel security bulletin for its disclosure that CVE-2026-58704 may be under limited, targeted exploitation.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle disclosed that CVE-2026-58704, a high-severity flaw in the Pixel Cellular Modem, may be under limited, targeted exploitation. The vulnerability has a CVSS score of 8.0 and is a privilege-escalation issue caused by a logic error. According to the NIST description cited in the article, a nearby attacker could bypass permissions and gain higher access without user interaction.\u003c/p\u003e\n\n\u003cp\u003eGoogle’s September 2026 Pixel updates fix CVE-2026-58704 along with 109 other security flaws. These include 88 privilege-escalation issues, 10 information-disclosure issues, nine remote-code-execution issues, and two denial-of-service issues. The update also addresses two high-severity Kernel privilege-escalation flaws and 46 critical-severity flaws affecting components such as BigOcean, the Bootloader, the IP Multimedia Subsystem, and the Trusted Execution Environment. Pixel devices with the 2026-09-05 security patch level or later resolve all identified issues.\u003c/p\u003e\n"},{"n":7,"title":"Google fixes actively exploited Android zero-day on Pixel devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-fixes-actively-exploited-android-zero-day-on-pixel-devices/","time":"07:00","priority":"MUST READ","score":93,"tldr":"Google’s September 2026 Pixel update patches 110 flaws, including CVE-2026-58704, a high-severity modem authorization bug reportedly under limited targeted exploitation that can enable nearby attackers to escalate privileges.","briefOverview":"\u003cp\u003eGoogle released its September 2026 security updates for Pixel devices, fixing 110 vulnerabilities. The update includes CVE-2026-58704, a high-severity cellular modem flaw that Google says may be under limited, targeted exploitation. Google urged customers with supported devices to accept the update to the 2026-09-05 patch level.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from authorization and protection failures caused by a logic error, according to Google’s advisory. An attacker on an adjacent network with basic privileges on the targeted device could bypass permissions and gain higher privileges without user interaction. The remaining 109 issues include 12 remote-code-execution flaws and 89 privilege-escalation flaws rated critical or high severity. Pixel users can install the update through the Security update settings and restart the device to complete installation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released September 2026 security patches for Pixel devices that address 110 vulnerabilities.","Google said CVE-2026-58704, a high-severity flaw in the cellular modem, may be under limited targeted exploitation.","The modem flaw could allow an attacker on an adjacent network with basic privileges on a targeted device to gain higher privileges without user interaction.","The Pixel bulletin also lists 109 other issues, including 12 remote code execution vulnerabilities and 89 privilege-escalation vulnerabilities rated critical or high severity.","Pixel users can install the update through Settings \u003e Security \u0026 privacy \u003e System \u0026 updates \u003e Security update, then restart their devices."],"insights":["The actively exploited issue is in the cellular modem rather than an app, and Google says a nearby attacker could gain greater device access without any action from the phone’s owner.","Pixel devices receive a separate security bulletin from standard Android monthly patches because Google directly controls their hardware platform and exclusive features.","Installing the update requires both selecting the Security update option and restarting the device to complete the patching process."],"referencedReports":[{"title":"Pixel Update Bulletin—September 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01","publisher":"google","context":"The article directs readers to Google’s Pixel security bulletin for more information on the September 2026 updates and affected issues.","category":"advisory","primary":true},{"title":"Pixel Security Bulletin","url":"https://source.android.com/docs/security/bulletin/pixel/2024-06-01","publisher":"google","context":"The article cites Google’s security notice warning that CVE-2026-58704 may be under limited targeted exploitation.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released its September 2026 security updates for Pixel devices, fixing 110 vulnerabilities. The update includes CVE-2026-58704, a high-severity cellular modem flaw that Google says may be under limited, targeted exploitation. Google urged customers with supported devices to accept the update to the 2026-09-05 patch level.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from authorization and protection failures caused by a logic error, according to Google’s advisory. An attacker on an adjacent network with basic privileges on the targeted device could bypass permissions and gain higher privileges without user interaction. The remaining 109 issues include 12 remote-code-execution flaws and 89 privilege-escalation flaws rated critical or high severity. Pixel users can install the update through the Security update settings and restart the device to complete installation.\u003c/p\u003e\n"},{"n":23,"title":"Acronis cPanel Backup Plugin Vulnerability Exploited in Targeted Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/acronis-cpanel-backup-plugin.html","time":"11:08","priority":"MUST READ","score":93,"tldr":"Acronis says a high-severity local privilege-escalation flaw (CVE-2026-87886) in its cPanel/WHM Backup plugin is being exploited in limited targeted attacks. Organizations should immediately update to version 1.9.3 HF3 or later, and update the affected Plesk extension to build 1.8.11.638 or later.","briefOverview":"\u003cp\u003eAcronis has warned that CVE-2026-87886, a high-severity security flaw in its Backup plugin for cPanel and Web Host Manager (WHM), has been exploited in limited, targeted attacks. The flaw has a CVSS score of 7.8 and stems from insecure file permissions. Acronis said customers should install the available updates immediately.\u003c/p\u003e\n\n\u003cp\u003eThe issue can allow an attacker with low privileges on an affected Linux system to gain greater permissions, potentially enabling unauthorized actions or arbitrary code execution that affects application confidentiality and integrity. The cPanel and WHM Backup plugin is affected before build 1.9.3.1021 and is fixed in version 1.9.3 HF3, while the Linux Plesk Backup extension is affected before build 1.8.11.638. Acronis has not disclosed details about the vulnerability, the attackers, their objectives, or when exploitation began.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis reported that CVE-2026-87886, a high-severity flaw in its Backup plugin for cPanel and WHM, has been exploited in limited targeted attacks.","The issue is caused by insecure file permissions and can allow a low-privileged attacker on an affected Linux system to gain higher permissions.","The affected Acronis Backup plugin for cPanel and WHM is vulnerable before build 1.9.3.1021, and Acronis fixed it in version 1.9.3 HF3.","The Acronis Backup extension for Plesk on Linux is affected before build 1.8.11.638.","Acronis advised customers to install the latest updates immediately, while details about the attackers, their goals, and the timing of exploitation remain unavailable."],"insights":["Although the advisory centers on the cPanel and WHM plugin, Acronis also lists its Linux Plesk backup extension as affected and provides a separate fixed build for it.","The flaw requires an attacker to already have low-level access, but it can then enable actions that affect the confidentiality and integrity of the application.","Acronis confirmed real-world exploitation but disclosed no information about the responsible party, the attackers’ objectives, or when the activity began.","The vendor’s immediate-update recommendation indicates that applying the specified fixed versions is the primary available protection described in the article."],"referencedReports":[{"title":"SEC-10986","url":"https://security-advisory.acronis.com/advisories/SEC-10986","publisher":"acronis","context":"The article links to Acronis's security advisory for CVE-2026-87886 and its affected products.","category":"advisory","primary":true},{"title":"Acronis Backup Plugin for cPanel \u0026 WHM 1.9.3 HF3 Update","url":"https://security-advisory.acronis.com/updates/UPD-2609-3d72-20a7","publisher":"acronis","context":"The article cites Acronis's separate update advisory stating that exploitation was detected in limited, targeted attacks.","category":"advisory","primary":true}],"body":"\u003cp\u003eAcronis has warned that CVE-2026-87886, a high-severity security flaw in its Backup plugin for cPanel and Web Host Manager (WHM), has been exploited in limited, targeted attacks. The flaw has a CVSS score of 7.8 and stems from insecure file permissions. Acronis said customers should install the available updates immediately.\u003c/p\u003e\n\n\u003cp\u003eThe issue can allow an attacker with low privileges on an affected Linux system to gain greater permissions, potentially enabling unauthorized actions or arbitrary code execution that affects application confidentiality and integrity. The cPanel and WHM Backup plugin is affected before build 1.9.3.1021 and is fixed in version 1.9.3 HF3, while the Linux Plesk Backup extension is affected before build 1.8.11.638. Acronis has not disclosed details about the vulnerability, the attackers, their objectives, or when exploitation began.\u003c/p\u003e\n"},{"n":40,"title":"Emerging Threat: (CVE-2026-70756) Oracle WebLogic Server Takeover via T3 and IIOP","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-70756-oracle-weblogic-server-takeover-via-t3-and-iiop/","time":"15:43","priority":"MUST READ","score":93,"tldr":"Oracle WebLogic Server CVE-2026-70756 is a critical pre-authentication flaw (CVSS 9.8) that can allow attackers with network access to T3 or IIOP ports to fully compromise affected servers. Organizations should urgently apply Oracle’s September 2026 CPU patches and restrict external access to T3 and IIOP, especially on TCP ports 7001 and 7002.","briefOverview":"\u003cp\u003eOracle disclosed CVE-2026-70756, a critical vulnerability in the Core component of Oracle WebLogic Server, in its September 15, 2026 Critical Security Patch Update. The flaw has a CVSS v3.1 score of 9.8 and can let an unauthenticated attacker with network access use T3 or IIOP to compromise a server and take full control. Oracle lists high impacts to confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eAffected versions are 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0, with patches available for all four versions. T3 and IIOP may be reachable on the same default listen ports used for HTTP traffic, including TCP ports 7001 and 7002, so an externally visible web application server can still accept these protocol requests. Until patching is confirmed, the article recommends identifying internet-facing WebLogic instances, restricting T3 and IIOP to trusted sources, disabling unneeded IIOP, monitoring for unexpected T3 handshakes, and reviewing load balancer forwarding rules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-70756 is a critical Oracle WebLogic Server flaw with a CVSS v3.1 score of 9.8 that can allow an unauthenticated network attacker using T3 or IIOP to take full control of a server.","Oracle identifies WebLogic Server versions 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0 as affected by CVE-2026-70756.","T3 and IIOP can be reachable on WebLogic’s default HTTP listen ports, including TCP ports 7001 and 7002, even when an instance appears externally to be an ordinary web application server.","Oracle released fixes for all four affected versions in its September 15, 2026 Critical Security Patch Update.","Until patching is confirmed, the article recommends inventorying internet-facing WebLogic systems, restricting T3 and IIOP access, disabling unneeded IIOP, and reviewing load balancer rules that forward full listen ports."],"insights":["WebLogic systems may expose the risky T3 and IIOP interfaces through the same ports used for normal web traffic, meaning a server that appears to be only a web application can still accept these connections on TCP ports 7001 and 7002.","Many exposed systems were identified by their service fingerprint rather than a confirmed software version, indicating that organizations may have more potentially affected WebLogic instances than their internal records show.","Development, testing, and staging WebLogic environments are particularly likely to be externally reachable while receiving less consistent patching than production systems.","Oracle provides the fix as a cumulative patch bundle for each installed WebLogic version rather than as an upgrade to a newer release, and patch availability for older versions can depend on the organization’s support contract.","Reviewing load balancer rules is an actionable priority because rules that forward an entire WebLogic listen port can unintentionally expose T3 and IIOP instead of limiting access to web traffic."],"referencedReports":[],"body":"\u003cp\u003eOracle disclosed CVE-2026-70756, a critical vulnerability in the Core component of Oracle WebLogic Server, in its September 15, 2026 Critical Security Patch Update. The flaw has a CVSS v3.1 score of 9.8 and can let an unauthenticated attacker with network access use T3 or IIOP to compromise a server and take full control. Oracle lists high impacts to confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eAffected versions are 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0, and 15.1.1.0.0, with patches available for all four versions. T3 and IIOP may be reachable on the same default listen ports used for HTTP traffic, including TCP ports 7001 and 7002, so an externally visible web application server can still accept these protocol requests. Until patching is confirmed, the article recommends identifying internet-facing WebLogic instances, restricting T3 and IIOP to trusted sources, disabling unneeded IIOP, monitoring for unexpected T3 handshakes, and reviewing load balancer forwarding rules.\u003c/p\u003e\n"},{"n":42,"title":"Operation RapidRust: APT36 Deploys RUSTYSHADE, RUSTYMOVE, PSNATCH, and BASHNATCH","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/operation-rapidrust-apt36-deploys-rustyshade-rustymove-psnatch-and","time":"15:13","priority":"MUST READ","score":93,"tldr":"APT36’s Operation RapidRust targets government and defense organizations in India and Afghanistan with new Rust- and script-based malware that uses private GitHub repositories for encrypted command-and-control and data theft. The campaign also deploys a USB propagation tool to move malware into air-gapped networks and conducts extensive network reconnaissance and lateral-movement activity.","briefOverview":"\u003cp\u003eIn August 2026, Zscaler ThreatLabz observed Pakistan-nexus APT36 conducting Operation RapidRust against government and defense organizations in India and Afghanistan. The campaign introduced RUSTYSHADE, a Rust-based Windows backdoor; PSNATCH and BASHNATCH file-stealing tools for Windows and Linux; and RUSTYMOVE, a removable-media propagation tool. APT36 also used typosquatted domains impersonating Indian news outlets, private GitHub repositories, and Backblaze-hosted payloads to support the activity.\u003c/p\u003e\n\n\u003cp\u003eRUSTYSHADE uses the GitHub REST API to receive commands and return results through attacker-controlled private repositories, encrypting communications with AES-256-GCM. It can execute shell commands, collect system information, capture screenshots and webcam photos, enumerate drives and directories, and upload compressed files. PSNATCH and BASHNATCH scan configured folders and drives for recently modified files, while RUSTYMOVE copies pre-staged malicious files to removable drives, potentially enabling propagation to air-gapped networks.\u003c/p\u003e\n\n\u003cp\u003eObserved post-compromise activity included user, system, network, and geolocation reconnaissance; subnet sweeps; SMB-share enumeration; attempts to connect to remote IPC$ shares; scheduled-task persistence; and deletion of prior tooling. ThreatLabz observed commands only on weekdays between 4:00 a.m. and 11:00 a.m. UTC during the investigation period. The campaign demonstrates continued APT36 targeting of Indian and Afghan government and defense entities alongside updated tooling and post-compromise activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In August 2026, Zscaler ThreatLabz observed Pakistan-linked APT36 targeting government and defense organizations in India and Afghanistan in a campaign called Operation RapidRust.","APT36 used the Rust-based RUSTYSHADE backdoor to communicate through attacker-controlled private GitHub repositories, with command-and-control messages encrypted using AES-256-GCM.","The PowerShell-based PSNATCH and Linux-focused BASHNATCH tools scan configured directories for recent files and send collected files to private GitHub repositories.","RUSTYMOVE monitors for removable media and copies pre-staged malicious files to external drives, which ThreatLabz assessed could enable spread to air-gapped networks.","Observed APT36 activity included system and network discovery, scheduled-task persistence, SMB share access attempts, payload deployment, and deletion of files associated with prior tooling."],"insights":["APT36’s observed command activity was limited to weekdays between 4:00 a.m. and 11:00 a.m. UTC, providing a distinct timing pattern for the investigated period.","RUSTYSHADE derives its encryption key from a GitHub personal access token embedded in the malware, then uses that key to encrypt commands, results, screenshots, webcam images, and uploaded files.","PSNATCH creates a separate private GitHub repository for each infected machine and keeps a local record of previously uploaded files, allowing it to send only new or changed files during later runs.","RUSTYMOVE does not contain its own payload or network communications; it relies on two pre-staged files and copies them to newly detected removable drives.","APT36 registered domains resembling Indian news outlets, including theprints[.]org and indiatodays[.]org, to host PowerShell scripts and later-stage payloads."],"referencedReports":[],"body":"\u003cp\u003eIn August 2026, Zscaler ThreatLabz observed Pakistan-nexus APT36 conducting Operation RapidRust against government and defense organizations in India and Afghanistan. The campaign introduced RUSTYSHADE, a Rust-based Windows backdoor; PSNATCH and BASHNATCH file-stealing tools for Windows and Linux; and RUSTYMOVE, a removable-media propagation tool. APT36 also used typosquatted domains impersonating Indian news outlets, private GitHub repositories, and Backblaze-hosted payloads to support the activity.\u003c/p\u003e\n\n\u003cp\u003eRUSTYSHADE uses the GitHub REST API to receive commands and return results through attacker-controlled private repositories, encrypting communications with AES-256-GCM. It can execute shell commands, collect system information, capture screenshots and webcam photos, enumerate drives and directories, and upload compressed files. PSNATCH and BASHNATCH scan configured folders and drives for recently modified files, while RUSTYMOVE copies pre-staged malicious files to removable drives, potentially enabling propagation to air-gapped networks.\u003c/p\u003e\n\n\u003cp\u003eObserved post-compromise activity included user, system, network, and geolocation reconnaissance; subnet sweeps; SMB-share enumeration; attempts to connect to remote IPC$ shares; scheduled-task persistence; and deletion of prior tooling. ThreatLabz observed commands only on weekdays between 4:00 a.m. and 11:00 a.m. UTC during the investigation period. The campaign demonstrates continued APT36 targeting of Indian and Afghan government and defense entities alongside updated tooling and post-compromise activity.\u003c/p\u003e\n"},{"n":9,"title":"Malware bypasses browser checks to force install Chrome, Edge extensions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malware-bypasses-browser-checks-to-force-install-chrome-edge-extensions/","time":"18:50","priority":"MUST READ","score":92,"tldr":"KREMLIN banking malware is infecting primarily Brazilian users and covertly installing malicious Chrome and Edge extensions by modifying Chromium profile settings and recreating their integrity checks. The AVSync-branded extensions steal credentials, cookies, session data, keystrokes, screenshots, and web traffic while giving attackers browser-level control.","briefOverview":"\u003cp\u003eElastic Security Labs identified KREMLIN, a banking-malware toolkit linked to a Brazilian operation that has run at least seven campaigns since May 2025 impersonating 12 banks. The infection begins when a target opens a JavaScript file disguised as a bank receipt, invoice, payment record, or business document. After anti-sandbox checks, the malware displays a fake error while downloading Node.js, creating a scheduled task for persistence, and obtaining additional payload information from an Ethereum smart contract.\u003c/p\u003e\n\n\u003cp\u003eKREMLIN can install malicious Chrome and Edge extensions without user approval by copying them into browser profiles, enabling developer mode, and adding them to Chromium Secure Preferences. It retrieves the browser keys and regenerates the cryptographic checks needed to make the unauthorized extension appear valid. The AVSync-branded extension can steal browser data, passwords and other typed form text, screenshots, page source, cookies, session data, and HTTP request information, while also injecting content and redirecting clicks. Elastic confirmed 1,515 infected systems, almost all in Brazil, and disrupted the current campaign by registering a domain used by the malware as an anti-sandbox canary.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs identified KREMLIN, a banking-malware toolkit tied to a Brazilian operation active since mid-2025, which installs malicious Chrome and Edge extensions without user approval.","The infection begins when a target opens a JavaScript file disguised as a bank receipt, invoice, payment record, or business document; the file then downloads Node.js, creates a scheduled task, and retrieves payload information from an Ethereum smart contract.","KREMLIN copies its extension into browser profile directories, enables developer mode, and modifies Chromium Secure Preferences while regenerating the cryptographic checks needed to make the extension appear valid.","The AVSync-branded extension can steal cookies, browser storage, session data, typed form content, screenshots, page source, browsing history, and HTTP request data, and can inject content or redirect clicks.","Elastic confirmed 1,515 infected systems, almost all in Brazil, and disrupted the current campaign by registering a domain used by the malware as an anti-sandbox canary."],"insights":["KREMLIN does not merely force-load a browser add-on; it obtains Chromium’s protection keys and recreates the checks that normally reveal unauthorized preference changes, allowing the extension to appear user-approved.","The operation used Ethereum smart contracts as locations for malware payload information and hid payloads inside JPEG images hosted through the Internet Archive service.","Elastic disrupted the active campaign by registering the domain used as an anti-sandbox check, causing the malware loader to stop on systems that would otherwise have met its infection conditions.","The malicious extension combines account-data theft with the ability to alter webpages and redirect clicks, giving operators both access to browser data and influence over a victim’s web activity."],"referencedReports":[{"title":"Malicious Browser Extension KREMLIN Banking Malware","url":"https://www.elastic.co/security-labs/threat-command/malicious-browser-extension-kremlin-banking-malware","publisher":"elastic-security-labs","context":"The article relies on Elastic Security Labs' analysis of the KREMLIN banking-malware operation, its browser-extension installation method, and its disruption.","category":"research","primary":true},{"title":"The Phantom Extension: Backdooring Chrome Through Uncharted Pathways","url":"https://www.synacktiv.com/en/publications/the-phantom-extension-backdooring-chrome-through-uncharted-pathways","publisher":"synacktiv","context":"The article cites this technical analysis as documentation of the browser-extension persistence technique that KREMLIN uses.","category":"research","primary":false}],"body":"\u003cp\u003eElastic Security Labs identified KREMLIN, a banking-malware toolkit linked to a Brazilian operation that has run at least seven campaigns since May 2025 impersonating 12 banks. The infection begins when a target opens a JavaScript file disguised as a bank receipt, invoice, payment record, or business document. After anti-sandbox checks, the malware displays a fake error while downloading Node.js, creating a scheduled task for persistence, and obtaining additional payload information from an Ethereum smart contract.\u003c/p\u003e\n\n\u003cp\u003eKREMLIN can install malicious Chrome and Edge extensions without user approval by copying them into browser profiles, enabling developer mode, and adding them to Chromium Secure Preferences. It retrieves the browser keys and regenerates the cryptographic checks needed to make the unauthorized extension appear valid. The AVSync-branded extension can steal browser data, passwords and other typed form text, screenshots, page source, cookies, session data, and HTTP request information, while also injecting content and redirecting clicks. Elastic confirmed 1,515 infected systems, almost all in Brazil, and disrupted the current campaign by registering a domain used by the malware as an anti-sandbox canary.\u003c/p\u003e\n"},{"n":36,"title":"NightEagle targets Russian companies","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky reports that the NightEagle (APT-Q-95) group has expanded from Asian targets to Russian companies, using stolen VPN credentials, the GhostContainer Exchange backdoor, and legitimate tunneling tools to retain access. The group also exploits Active Directory weaknesses and BlueKeep to move laterally, steal credentials, and potentially compromise domain controllers.","briefOverview":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated several incidents involving NightEagle (APT-Q-95), a group active since at least 2023 that has expanded from targets in Asia to businesses in Russia. The attackers commonly entered corporate VPNs using compromised valid credentials, with connections traced to Russian IP addresses associated with Cloudflare WARP tunnels and European virtual infrastructure providers. They deployed the GhostContainer backdoor on Microsoft Exchange servers during initial access and later stages of the intrusion.\u003c/p\u003e\n\n\u003cp\u003eGhostContainer receives commands through Exchange request headers, can redirect network traffic, and attempts to evade Windows security monitoring by altering functions in AMSI and Windows event logging components. NightEagle used Microsoft dev tunnels, rdp2tcp, GitHub-hosted tools disguised as legitimate software, and Impacket’s atexec utility to maintain access and move through internal networks. In one incident, the group exploited the BlueKeep vulnerability, requested Kerberos tickets with unusual flags, and attempted Active Directory replication to obtain password hashes and ultimately compromise domain controllers and the victim’s Active Directory infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s Global Emergency Response Team investigated NightEagle (APT-Q-95) incidents targeting businesses in Russia, expanding beyond the group’s previously reported focus on organizations in Asia.","Attackers commonly used compromised valid credentials to access corporate VPNs, with connections originating from Russian IP addresses linked to Cloudflare WARP tunnels and European virtual infrastructure providers.","NightEagle deployed the GhostContainer backdoor on Microsoft Exchange servers, using it to process command-and-control instructions, evade security monitoring, and redirect network traffic.","The group used Microsoft dev tunnels and rdp2tcp to expose and tunnel Remote Desktop Protocol access, and used Impacket’s atexec utility to create scheduled tasks for port forwarding.","In one incident, attackers exploited CVE-2019-0708 (BlueKeep), requested Kerberos tickets with unusual flags, and attempted DCSync activity to obtain domain account password hashes and compromise Active Directory infrastructure."],"insights":["NightEagle combined Microsoft dev tunnels with rdp2tcp to preserve remote access through legitimate services while avoiding additional suspicious open ports.","Use of rdp2tcp can be identified in Windows Remote Desktop logs because virtual-channel events 132 and 148 may contain the channel name \"rdp2tcp\" or attacker-selected random alphanumeric names.","The group disguised tools in GitHub repositories and archives with legitimate-looking names, while the executable names inside the archives mimicked unrelated well-known software.","GhostContainer is designed to receive commands through Microsoft Exchange request headers and to weaken Windows security monitoring by altering functions in AMSI and Windows event logging components.","The attackers used long-lived Kerberos tickets, password-hash theft, and attempted Active Directory replication to establish persistence and potentially take control of an organization’s identity infrastructure."],"referencedReports":[],"body":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated several incidents involving NightEagle (APT-Q-95), a group active since at least 2023 that has expanded from targets in Asia to businesses in Russia. The attackers commonly entered corporate VPNs using compromised valid credentials, with connections traced to Russian IP addresses associated with Cloudflare WARP tunnels and European virtual infrastructure providers. They deployed the GhostContainer backdoor on Microsoft Exchange servers during initial access and later stages of the intrusion.\u003c/p\u003e\n\n\u003cp\u003eGhostContainer receives commands through Exchange request headers, can redirect network traffic, and attempts to evade Windows security monitoring by altering functions in AMSI and Windows event logging components. NightEagle used Microsoft dev tunnels, rdp2tcp, GitHub-hosted tools disguised as legitimate software, and Impacket’s atexec utility to maintain access and move through internal networks. In one incident, the group exploited the BlueKeep vulnerability, requested Kerberos tickets with unusual flags, and attempted Active Directory replication to obtain password hashes and ultimately compromise domain controllers and the victim’s Active Directory infrastructure.\u003c/p\u003e\n"},{"n":4,"title":"Iranian hackers use CHOSEN BRICK Windows malware to spy on targets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/iranian-hackers-use-chosen-brick-windows-malware-to-spy-on-targets/","time":"20:24","priority":"SHOULD READ","score":86,"tldr":"Iranian state-linked hackers are using CHOSEN BRICK Windows spyware, delivered through WhatsApp and Telegram social-engineering lures, to surveil dissidents, activists, and journalists internationally. The malware steals communications and other data, records audio and screenshots, and can ultimately wipe infected systems.","briefOverview":"\u003cp\u003eGovernment agencies warned that Iranian state-linked hackers are using CHOSEN BRICK, a Windows-based spying program, against dissidents, activists, and journalists worldwide. The campaign has primarily targeted people in the United States, United Kingdom, and Netherlands, according to a joint advisory published with the FBI. Attackers send WhatsApp or Telegram messages while impersonating trusted contacts or technical-support staff, then try to convince targets to open malicious files disguised as legitimate applications. Some lures are medical-related, and victims may be encouraged to use personal devices to bypass corporate security blocks.\u003c/p\u003e\n\n\u003cp\u003eThe fake applications show convincing interfaces while silently installing CHOSEN BRICK and creating a way to start automatically through Windows Registry Run keys. The malware can collect system details, list running programs, capture screenshots, record microphone audio, steal email and Telegram or WhatsApp browser data, download additional files, delete data, or wipe the entire system. It adds Microsoft Defender exclusions and uses a victim-specific Telegram bot for remote control, while stolen data can be sent through Telegram or cloud services including VultrObjects and StorjShare. Agencies said stolen material is sometimes published on pro-Iranian leak sites, contributing to harassment and increasing physical risk for dissidents abroad.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Government agencies warned that Iranian state-linked hackers are using the CHOSEN BRICK Windows malware to target dissidents, activists, and journalists worldwide.","The attackers use WhatsApp or Telegram messages that impersonate trusted contacts or technical support agents to persuade victims to open malicious files disguised as legitimate applications.","CHOSEN BRICK can collect system information, capture screenshots, record microphone audio, steal email and Telegram or WhatsApp browser data, download additional files, delete files, and wipe an infected computer.","The malware establishes persistence through Windows Registry Run keys, adds Microsoft Defender exclusions, and uses a victim-specific Telegram bot for command-and-control communications.","The agencies said stolen data is sometimes published on pro-Iranian leak sites, increasing harassment and physical risk for dissidents abroad."],"insights":["The attackers reportedly encourage targets to run the disguised applications on personal devices, specifically to avoid corporate security controls.","The malicious applications display convincing interfaces matching their stated purpose while CHOSEN BRICK installs silently in the background.","Each infection connects to a Telegram bot matched to the victim’s ID, which the attackers use to control the malware.","Investigators are advised to treat unexpected connections to Telegram’s API, Backblaze B2, VultrObjects, StorjShare, IPRoyal, and LightningProxies as suspicious indicators.","The campaign combines surveillance with the ability to erase an entire device, while stolen material may be posted to pro-Iranian leak sites as harassment."],"referencedReports":[{"title":"Iranian cyber targeting of dissidents, activists and journalists","url":"https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists","publisher":"NCSC","context":"The article cites this joint advisory, published with the FBI and cybersecurity agencies in the United States, United Kingdom, and Netherlands, as the source of findings on CHOSEN BRICK activity.","category":"advisory","primary":true}],"body":"\u003cp\u003eGovernment agencies warned that Iranian state-linked hackers are using CHOSEN BRICK, a Windows-based spying program, against dissidents, activists, and journalists worldwide. The campaign has primarily targeted people in the United States, United Kingdom, and Netherlands, according to a joint advisory published with the FBI. Attackers send WhatsApp or Telegram messages while impersonating trusted contacts or technical-support staff, then try to convince targets to open malicious files disguised as legitimate applications. Some lures are medical-related, and victims may be encouraged to use personal devices to bypass corporate security blocks.\u003c/p\u003e\n\n\u003cp\u003eThe fake applications show convincing interfaces while silently installing CHOSEN BRICK and creating a way to start automatically through Windows Registry Run keys. The malware can collect system details, list running programs, capture screenshots, record microphone audio, steal email and Telegram or WhatsApp browser data, download additional files, delete data, or wipe the entire system. It adds Microsoft Defender exclusions and uses a victim-specific Telegram bot for remote control, while stolen data can be sent through Telegram or cloud services including VultrObjects and StorjShare. Agencies said stolen material is sometimes published on pro-Iranian leak sites, contributing to harassment and increasing physical risk for dissidents abroad.\u003c/p\u003e\n"},{"n":29,"title":"Three Threat Groups Target Russian Enterprises With Backdoors, Ransomware, and Wipers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/three-threat-groups-target-russian.html","time":"15:27","priority":"SHOULD READ","score":84,"tldr":"Kaspersky reports that NightEagle, pro-Ukrainian Hacking Cat, and financially motivated Toy Ghouls are targeting Russian enterprises with backdoors, ransomware, and wipers. The campaigns use compromised VPN credentials, Exchange and Active Directory exploits, custom malware, and unusual command-and-control channels to gain persistence and disrupt victim networks.","briefOverview":"\u003cp\u003eKaspersky reported that three threat groups—NightEagle, Hacking Cat, and Toy Ghouls—have targeted Russian enterprises with backdoors, ransomware, and destructive wiper-like malware. NightEagle reportedly used compromised credentials to enter corporate VPNs and deployed the GhostContainer backdoor on Microsoft Exchange servers. It then used tunnels, RDP-related tools, and Active Directory weaknesses to move through internal networks and seek control of domain infrastructure.\u003c/p\u003e\n\n\u003cp\u003eHacking Cat, a pro-Ukrainian hacktivist group, reportedly used Exchange Server vulnerabilities to deploy Gorilla RAT and Monkey ransomware variants against Windows, Linux, and VMware ESXi systems. Some Monkey variants do not retain the encryption key, making recovery impossible despite leaving ransom notes, while other variants disable recovery tools, logs, and security protections. Toy Ghouls, a financially motivated group, deployed custom Bird Agent backdoors through Windows Remote Management, using the HiveMQ MQTT broker or the Matrix-based Element messenger to receive commands and return results.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky reported that NightEagle, Hacking Cat, and Toy Ghouls have targeted enterprises in Russia with backdoors, ransomware, and wiper malware.","NightEagle used compromised valid credentials to access corporate VPNs and deployed the GhostContainer backdoor on Microsoft Exchange servers, then used tunnels and Active Directory weaknesses for lateral movement.","Hacking Cat exploited Exchange Server vulnerabilities to deploy Gorilla RAT and multiple Monkey ransomware variants targeting Windows, Linux, and VMware ESXi systems.","Some Monkey ransomware variants do not retain encryption keys, making their file-encryption activity effectively destructive while still leaving ransom notes.","Toy Ghouls used Windows Remote Management to deploy custom Bird Agent backdoors that communicate through a HiveMQ MQTT broker or the Matrix-based Element messenger."],"insights":["NightEagle’s GhostContainer is designed to blend in as a normal server component and can operate as a traffic relay, while its configuration reportedly combines publicly available code from Neo-reGeorg, a CVE-2020-0688 exploit, and ysoserial’s GhostWebShell class.","Some Monkey ransomware variants are effectively wipers because they encrypt files without storing the decryption key, even though they still leave ransom notes.","The C++ Monkey variant includes extensive anti-recovery and anti-monitoring features, including clearing logs, disabling Windows logging and Event Tracing for Windows, bypassing AMSI, configuring Microsoft Defender exclusions, and disabling backup and recovery mechanisms.","Toy Ghouls’ Bird Agent binds its configuration to a specific Windows machine by partially encrypting it with a key derived from that machine’s MachineGuid value, and stops if it cannot decrypt the configuration on later runs.","Kaspersky observed multiple pro-Ukrainian hacktivist groups using overlapping custom tools and multi-stage infection chains, while Hacking Cat disputed that the ransomware lockers attributed to it were its own."],"referencedReports":[{"title":"NightEagle APT: GhostContainer and Tunneling","url":"https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/","publisher":"kaspersky","context":"The article relies on Kaspersky's analysis of NightEagle's use of GhostContainer, compromised VPN credentials, tunnels, and Active Directory attacks.","category":"research","primary":true},{"title":"Hacking Cat","url":"https://securelist.ru/tr/hacking-cat/117062/","publisher":"kaspersky","context":"The article cites Kaspersky's report on Hacking Cat's use of Gorilla RAT, Monkey ransomware, ClearWater, and Nemo Wiper against Russian organizations.","category":"research","primary":true},{"title":"Toy Ghouls: New HiveMQ and Element Backdoors","url":"https://securelist.com/toy-ghouls-new-hivemq-and-element-backdoors/121270/","publisher":"kaspersky","context":"The article draws on Kaspersky's analysis of Toy Ghouls deploying Bird Agent backdoors through HiveMQ MQTT and Element.","category":"research","primary":true}],"body":"\u003cp\u003eKaspersky reported that three threat groups—NightEagle, Hacking Cat, and Toy Ghouls—have targeted Russian enterprises with backdoors, ransomware, and destructive wiper-like malware. NightEagle reportedly used compromised credentials to enter corporate VPNs and deployed the GhostContainer backdoor on Microsoft Exchange servers. It then used tunnels, RDP-related tools, and Active Directory weaknesses to move through internal networks and seek control of domain infrastructure.\u003c/p\u003e\n\n\u003cp\u003eHacking Cat, a pro-Ukrainian hacktivist group, reportedly used Exchange Server vulnerabilities to deploy Gorilla RAT and Monkey ransomware variants against Windows, Linux, and VMware ESXi systems. Some Monkey variants do not retain the encryption key, making recovery impossible despite leaving ransom notes, while other variants disable recovery tools, logs, and security protections. Toy Ghouls, a financially motivated group, deployed custom Bird Agent backdoors through Windows Remote Management, using the HiveMQ MQTT broker or the Matrix-based Element messenger to receive commands and return results.\u003c/p\u003e\n"},{"n":6,"title":"Windows 11 KB5124008 update breaks domain trust for some users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5124008-update-breaks-domain-trust-for-some-users/","time":"20:39","priority":"SHOULD READ","score":82,"tldr":"Microsoft is investigating reports that Windows 11 KB5124008 can break Active Directory domain trust on some enterprise devices after reboot, preventing valid domain logins. Administrators suspect the Machine Identity Isolation/Credential Guard setting is involved, but Microsoft has not issued an official workaround.","briefOverview":"\u003cp\u003eMicrosoft is investigating reports that the Windows 11 KB5124008 security update breaks domain trust relationships on some enterprise systems after installation and reboot. Affected computers can reject valid domain credentials, preventing users from signing in, while cached credentials may continue working offline. Administrators reported that uninstalling the update and repairing the computer’s secure channel restored access, but the issue returned when KB5124008 was reinstalled.\u003c/p\u003e\n\n\u003cp\u003eReports indicate the failures may be related to the Windows Machine Identity Isolation feature, particularly when it is enabled in audit or enforcement mode. In enforcement mode, Windows moves the machine account secret into Credential Guard and removes the copy stored in LSA, which can affect the computer’s connection to Active Directory. Some administrators restored systems by setting the MachineIdentityIsolation registry value to 0, rebooting, and repairing the secure channel with PowerShell, but Microsoft has not confirmed the cause or issued an official workaround and warns that disabling the feature can also create domain-authentication problems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is investigating reports that the Windows 11 KB5124008 security update breaks Active Directory domain trust relationships on some enterprise systems after reboot.","Affected users may be unable to log in with valid domain credentials, while cached credentials can continue working when systems are offline.","Administrators reported that uninstalling KB5124008 and repairing the computer’s secure channel restored access, but reinstalling the update caused the problem to return.","Reports link the failures to the Machine Identity Isolation setting, particularly when it is enabled in audit or enforcement mode.","Microsoft has not confirmed the root cause or published an official workaround."],"insights":["The reported problem can appear as a password failure even when users’ credentials are valid, because the affected computer’s trust relationship with the domain has failed.","Offline cached sign-ins continuing to work indicates the reported failures are tied to communicating with the company domain rather than to users’ passwords.","Administrators reported that setting MachineIdentityIsolation to enforcement mode caused Windows to move the computer’s account secret into Credential Guard and remove its local copy from LSA.","Disabling Machine Identity Isolation is not a universally safe workaround: one administrator reported domain trust failures on systems that never installed KB5124008, and Microsoft warns that devices previously using enforcement mode may need to be removed from and rejoined to the domain."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is investigating reports that the Windows 11 KB5124008 security update breaks domain trust relationships on some enterprise systems after installation and reboot. Affected computers can reject valid domain credentials, preventing users from signing in, while cached credentials may continue working offline. Administrators reported that uninstalling the update and repairing the computer’s secure channel restored access, but the issue returned when KB5124008 was reinstalled.\u003c/p\u003e\n\n\u003cp\u003eReports indicate the failures may be related to the Windows Machine Identity Isolation feature, particularly when it is enabled in audit or enforcement mode. In enforcement mode, Windows moves the machine account secret into Credential Guard and removes the copy stored in LSA, which can affect the computer’s connection to Active Directory. Some administrators restored systems by setting the MachineIdentityIsolation registry value to 0, rebooting, and repairing the secure channel with PowerShell, but Microsoft has not confirmed the cause or issued an official workaround and warns that disabling the feature can also create domain-authentication problems.\u003c/p\u003e\n"},{"n":15,"title":"Coast Guard, FBI boarded tanker after attack by ‘foreign cyber actors’","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/oil-tanker-cyberattack-coast-guard-fbi","time":"18:46","priority":"SHOULD READ","score":82,"tldr":"The U.S. Coast Guard and FBI boarded a tanker in the Gulf of Mexico after its network was reportedly compromised by foreign cyber actors, though officials said there were no operational or environmental impacts. The incident is part of reports that at least two U.S.-bound tankers were targeted.","briefOverview":"\u003cp\u003eThe U.S. Coast Guard said it boarded a tanker in the Gulf of Mexico in August after indications that foreign cyber actors had compromised the vessel’s network. On August 21, Coast Guard law enforcement personnel, Cyber Protection Team members, a vessel inspector, and FBI Cyber Action Team operators conducted a cybersecurity boarding and investigation. The Coast Guard said there were no reports of operational disruption, vessel instability, danger to crew members, or environmental impacts.\u003c/p\u003e\n\n\u003cp\u003eThe Wall Street Journal reported that at least two tankers bound for the United States were targeted, and that another vessel was boarded on August 24. Bloomberg identified one vessel as VL Prosperity, while Iran-backed Mehr reported that the Liberian-flagged tanker lost communications for 30 hours during an August 7 incident near the Strait of Gibraltar and that attackers allegedly affected engine speed and fuel and engine-oil tank controls. The Coast Guard has not identified the suspected attackers, described the nature of the compromise, or confirmed whether the August 21 boarding involved VL Prosperity, but said it is working with ports, vessel owners, and local maritime stakeholders to keep port operations safe and uninterrupted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Coast Guard said it boarded a tanker transiting the Gulf of Mexico in August after indications that foreign cyber actors had compromised the vessel’s network.","On August 21, a team including Coast Guard law enforcement, cyber personnel, a vessel inspector, and FBI Cyber Action Team operators conducted a cybersecurity investigation aboard the vessel.","The Coast Guard said there were no reports of operational disruption, vessel instability, crew danger, or environmental impacts from the incident.","Reports identified one potentially affected vessel as VL Prosperity, a Liberian-flagged tanker traveling from Egypt to the United States that reportedly lost communications for 30 hours after an August 7 incident near the Strait of Gibraltar.","The Wall Street Journal reported that at least two U.S.-bound tankers were targeted and that another vessel was boarded on August 24."],"insights":["The Coast Guard’s response examined both the tanker’s operational systems and its information systems, reflecting concern that a network compromise could affect how a vessel functions as well as its communications.","The reported VL Prosperity incident involved a claimed 30-hour communications loss and alleged changes to engine speed and fuel or engine-oil tank controls, showing that the reported effects extended beyond ordinary office computer systems.","Despite the involvement of Coast Guard and FBI cyber personnel, officials had not publicly identified the attackers or confirmed whether the August 21 boarding involved VL Prosperity.","North Carolina Ports shifted to manual operations after a separate reported cyberattack one day before the alleged tanker incident, underscoring that maritime disruptions can affect both ships and port operations."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Coast Guard said it boarded a tanker in the Gulf of Mexico in August after indications that foreign cyber actors had compromised the vessel’s network. On August 21, Coast Guard law enforcement personnel, Cyber Protection Team members, a vessel inspector, and FBI Cyber Action Team operators conducted a cybersecurity boarding and investigation. The Coast Guard said there were no reports of operational disruption, vessel instability, danger to crew members, or environmental impacts.\u003c/p\u003e\n\n\u003cp\u003eThe Wall Street Journal reported that at least two tankers bound for the United States were targeted, and that another vessel was boarded on August 24. Bloomberg identified one vessel as VL Prosperity, while Iran-backed Mehr reported that the Liberian-flagged tanker lost communications for 30 hours during an August 7 incident near the Strait of Gibraltar and that attackers allegedly affected engine speed and fuel and engine-oil tank controls. The Coast Guard has not identified the suspected attackers, described the nature of the compromise, or confirmed whether the August 21 boarding involved VL Prosperity, but said it is working with ports, vessel owners, and local maritime stakeholders to keep port operations safe and uninterrupted.\u003c/p\u003e\n"},{"n":21,"title":"One Extension Could Hijack AI Assistants Across Chrome, Comet, Edge, Opera Neon and Claude","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/one-extension-could-hijack-ai.html","time":"14:36","priority":"SHOULD READ","score":82,"tldr":"Researchers found that a malicious browser extension with common permissions could hijack built-in AI assistants in Chrome, Comet, Edge, Opera Neon, and Claude in Chrome, potentially enabling actions such as file access, screenshots, and agent control. The attacks require the victim to install the extension first; Chrome and Edge have issued fixes, while users should update all affected browsers and review installed extensions.","briefOverview":"\u003cp\u003eForever Security researchers demonstrated that a malicious browser extension could hijack built-in AI assistants in Google Chrome, Perplexity Comet, Microsoft Edge, Opera Neon, and Claude in Chrome. The demonstrations require the attacker’s extension to already be installed in a victim’s browser, and the article says there is no public evidence of real-w
