<script type="application/json" id="dl-articles">[{"n":2,"title":"Yet another RCE in Gogs, but it's fixed this time!","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/fixed-rce-gogs-cve-2026-52813","time":"12:08","priority":"SHOULD READ","score":85,"tldr":"Researchers found multiple Gogs vulnerabilities, including a path traversal flaw that could be chained into remote code execution via nested Git repositories and hooks, fixed in version 0.14.3. A separate Git HTTP authorization bypass remains incompletely patched, so users should apply the manual fix or avoid exposed smart HTTP access.","briefOverview":"\u003cp\u003eThe article analyzes several vulnerabilities in Gogs, an open-source Git hosting platform similar to GitHub or GitLab. The main focus is CVE-2026-52813, a remote code execution issue that was fixed in Gogs version 0.14.3. The author also covers CVE-2026-52810, a push authorization bypass, and GHSA-6vxv-wg6j-5qwp, a stored XSS issue in Jupyter notebook rendering.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-52813 began as a path traversal bug in organization names created through the Gogs API. Because organization usernames lacked the same sanitization used for normal user registration, an attacker could create an organization name containing \u003ccode\u003e../\u003c/code\u003e sequences and cause Gogs to create bare Git repositories outside the intended repository root. The researchers chained this with a nested bare repository inside an editable worktree, modified a Git hook through a normal Git push, and triggered the hook to run commands as the \u003ccode\u003egit\u003c/code\u003e user.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-52810 involves confusion in Gogs’ Git HTTP handling between pull and push operations, allowing a crafted request to be authorized as a read operation while reaching the write endpoint. The article says the official fix is incomplete because uppercase variants such as \u003ccode\u003egit-RECEIVE-pack\u003c/code\u003e can bypass the new check, and it provides a manual source code patch. The XSS issue came from an outdated version of \u003ccode\u003enotebookjs\u003c/code\u003e, where assigning untrusted notebook Markdown HTML to a temporary element could trigger JavaScript before Gogs’ backend sanitizer processed the rendered output.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-52813 is a Gogs path traversal vulnerability in organization names created through the API that can write bare Git repositories outside the intended repository root.","The researchers chained the path traversal issue with a nested bare repository and an overwritten Git update hook to achieve remote code execution as the git user.","CVE-2026-52813 is fixed in Gogs version 0.14.3, and the article says users can check exposure by seeing whether their Gogs version is 0.14.2 or below.","CVE-2026-52810 is a Git HTTP authorization bypass in which Gogs can treat a push endpoint as a read operation when a crafted service parameter is used.","The article says the push authorization bypass fix is incomplete because uppercase variants such as git-RECEIVE-pack can bypass the check, and it provides a manual source code patch."],"insights":["The organization name validation gap was only reachable through the API, while normal user registration used stricter username rules that blocked the same path traversal pattern.","The remote code execution chain depended on a subtle Git behavior: a bare repository placed inside an editable worktree could have its hook file changed through a normal Git push, even though the Gogs web editor blocked paths containing .git.","The Git HTTP authorization bug was caused by Gogs making a permission decision from the query parameter and path string before routing the request to the actual push handler, allowing those two interpretations to differ.","The article states that the official fix for the push authorization bypass is incomplete because it does not handle case differences, while the router later treats matching as case-insensitive.","The stored XSS in Jupyter notebook rendering could trigger before Gogs’ backend sanitizer ran, because the outdated notebookjs library assigned untrusted HTML to a temporary element with innerHTML during rendering."],"referencedReports":[{"title":"Securing Developer Tools: Unpatched Code Vulnerabilities in Gogs, Part 1","url":"https://www.sonarsource.com/blog/securing-developer-tools-unpatched-code-vulnerabilities-in-gogs-1","publisher":"SonarSource","context":"The article cites this as part of the long history of remote code execution vulnerabilities in Gogs.","category":"research","primary":false},{"title":"Securing Developer Tools: Unpatched Code Vulnerabilities in Gogs, Part 2","url":"https://www.sonarsource.com/blog/securing-developer-tools-unpatched-code-vulnerabilities-in-gogs-2","publisher":"SonarSource","context":"The article cites this as another prior technical analysis in the history of Gogs remote code execution issues.","category":"research","primary":false},{"title":"Unpatched Remote Code Execution in Gogs","url":"https://fysac.github.io/posts/2024/11/unpatched-remote-code-execution-in-gogs/","publisher":"fysac","context":"The article references this as a prior public write-up about a Gogs remote code execution issue.","category":"research","primary":false},{"title":"Wiz Research: Gogs CVE-2025-8110 RCE Exploit","url":"https://www.wiz.io/blog/wiz-research-gogs-cve-2025-8110-rce-exploit","publisher":"Wiz","context":"The article cites this as part of the prior research history around Gogs remote code execution vulnerabilities.","category":"research","primary":false},{"title":"VE: Authenticated RCE via Argument Injection in Gogs, Unfixed","url":"https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/","publisher":"Rapid7","context":"The article links this as another previous technical analysis of an authenticated remote code execution issue in Gogs.","category":"research","primary":false},{"title":"Gogs Security Advisory GHSA-c39w-43gm-34h5 for CVE-2026-52813","url":"https://github.com/gogs/gogs/security/advisories/GHSA-c39w-43gm-34h5","publisher":"Gogs","context":"The article links this advisory for the remote code execution vulnerability it primarily analyzes.","category":"advisory","primary":false},{"title":"Gogs Security Advisory GHSA-wmfg-5p4h-5fw3 for CVE-2026-52810","url":"https://github.com/gogs/gogs/security/advisories/GHSA-wmfg-5p4h-5fw3","publisher":"Gogs","context":"The article links this advisory for the push authorization bypass affecting read-only repositories.","category":"advisory","primary":false},{"title":"Gogs Security Advisory GHSA-6vxv-wg6j-5qwp","url":"https://github.com/gogs/gogs/security/advisories/GHSA-6vxv-wg6j-5qwp","publisher":"Gogs","context":"The article links this advisory for the stored XSS issue in Jupyter notebook rendering.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe article analyzes several vulnerabilities in Gogs, an open-source Git hosting platform similar to GitHub or GitLab. The main focus is CVE-2026-52813, a remote code execution issue that was fixed in Gogs version 0.14.3. The author also covers CVE-2026-52810, a push authorization bypass, and GHSA-6vxv-wg6j-5qwp, a stored XSS issue in Jupyter notebook rendering.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-52813 began as a path traversal bug in organization names created through the Gogs API. Because organization usernames lacked the same sanitization used for normal user registration, an attacker could create an organization name containing \u003ccode\u003e../\u003c/code\u003e sequences and cause Gogs to create bare Git repositories outside the intended repository root. The researchers chained this with a nested bare repository inside an editable worktree, modified a Git hook through a normal Git push, and triggered the hook to run commands as the \u003ccode\u003egit\u003c/code\u003e user.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-52810 involves confusion in Gogs’ Git HTTP handling between pull and push operations, allowing a crafted request to be authorized as a read operation while reaching the write endpoint. The article says the official fix is incomplete because uppercase variants such as \u003ccode\u003egit-RECEIVE-pack\u003c/code\u003e can bypass the new check, and it provides a manual source code patch. The XSS issue came from an outdated version of \u003ccode\u003enotebookjs\u003c/code\u003e, where assigning untrusted notebook Markdown HTML to a temporary element could trigger JavaScript before Gogs’ backend sanitizer processed the rendered output.\u003c/p\u003e\n"},{"n":1,"title":"The DocuSign Button That Went to a Link-in-Bio Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/docusign-branded-lure-link-in-bio-platform-landing-page","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A DocuSign-themed phishing email spoofed a finance executive and hid its malicious call-to-action behind a legitimate Linktree page, making domain blocking and URL reputation ineffective. The key lesson is that behavioral signals, authentication gaps, and repeated template artifacts like a fake security code can be more useful indicators than infrastructure in SaaS-abuse phishing.","briefOverview":"\u003cp\u003eA message styled as a DocuSign completion notice arrived at a multi-brand staffing and workforce solutions company, claiming to come from and be addressed to its own senior finance executive. The email said a nondisclosure agreement had been executed and included a button labeled “VIEW COMPLETED DOCUMENT” plus a fabricated security code. That button did not lead to DocuSign or a lookalike domain, but to a free Linktree profile on a legitimate consumer link-in-bio platform.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that this campaign left little traditional infrastructure to block because Linktree itself was legitimate and the attacker only controlled a disposable account page. The email also contained a full unrelated airline trip confirmation and payment receipt, including genuine airline links that all scanned clean. That reused receipt content acted as filler and made the message resemble ordinary commercial mail while reducing the suspicious-to-clean link ratio.\u003c/p\u003e\n\n\u003cp\u003eAuthentication results showed SPF softfail, no DKIM signature, no DMARC policy, and an originating host with no reverse DNS entry, yet the composite authentication verdict still passed. IRONSCALES Adaptive AI scored the message at 84% confidence, classified it as phishing, and quarantined it automatically. The same template returned twice more over five weeks across affiliated brand domains, with the repeated fake security code serving as an indicator that linked the separate sends.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A DocuSign-styled completion notice sent to a multi-brand staffing company claimed to come from and be addressed to its own senior finance executive.","The “VIEW COMPLETED DOCUMENT” button resolved to a free Linktree profile rather than any DocuSign domain, lookalike domain, or attacker-owned domain.","The email body included a complete unrelated airline trip confirmation and payment receipt with eight genuine airline links that all scanned clean.","Email authentication showed SPF softfail, no DKIM signature, no DMARC policy, and an originating host with no reverse DNS entry, while the composite authentication verdict still passed.","IRONSCALES Adaptive AI scored the message at 84% confidence, quarantined it as phishing, and later detected the same template in additional mailboxes over five weeks."],"insights":["The campaign undermined a common blocking playbook because the attacker did not need to register or compromise a domain; the only destination was an account path on a legitimate SaaS platform that organizations are unlikely to block wholesale.","The unrelated airline receipt acted as link-ratio padding, making one unfamiliar destination appear less suspicious among eight reputable clean links and giving the email the shape of ordinary commercial mail.","A fabricated e-signature security code became a useful indicator because it repeated verbatim across later sends, fingerprinting the phishing kit when sender, recipient, and timing changed.","The article emphasizes that a composite authentication pass is not proof of sender legitimacy, because this message still had SPF softfail, no DKIM signature, no DMARC policy, and no reverse DNS on the originating host."],"referencedReports":[{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites CISA's phishing guidance to support the point that phishing campaigns often succeed through presentation rather than attacker-controlled infrastructure.","category":"guide","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the Verizon DBIR for statistics on the human element in breaches, credential involvement, and AI's operational role in scaling known attack techniques.","category":"research","primary":false}],"body":"\u003cp\u003eA message styled as a DocuSign completion notice arrived at a multi-brand staffing and workforce solutions company, claiming to come from and be addressed to its own senior finance executive. The email said a nondisclosure agreement had been executed and included a button labeled “VIEW COMPLETED DOCUMENT” plus a fabricated security code. That button did not lead to DocuSign or a lookalike domain, but to a free Linktree profile on a legitimate consumer link-in-bio platform.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that this campaign left little traditional infrastructure to block because Linktree itself was legitimate and the attacker only controlled a disposable account page. The email also contained a full unrelated airline trip confirmation and payment receipt, including genuine airline links that all scanned clean. That reused receipt content acted as filler and made the message resemble ordinary commercial mail while reducing the suspicious-to-clean link ratio.\u003c/p\u003e\n\n\u003cp\u003eAuthentication results showed SPF softfail, no DKIM signature, no DMARC policy, and an originating host with no reverse DNS entry, yet the composite authentication verdict still passed. IRONSCALES Adaptive AI scored the message at 84% confidence, classified it as phishing, and quarantined it automatically. The same template returned twice more over five weeks across affiliated brand domains, with the repeated fake security code serving as an indicator that linked the separate sends.\u003c/p\u003e\n"},{"n":3,"title":"Describing attacks with crime script analysis","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/describing-attacks-with-crime-script-analysis/","time":"10:00","priority":"MAY READ","score":55,"tldr":"Crime script analysis can make cyberattacks like business email compromise easier for non-technical audiences to understand by describing the attacker’s workflow as a narrative. This approach also helps defenders spot where AI may help attackers scale scams and where interventions can disrupt them.","briefOverview":"\u003cp\u003eThe article explains crime script analysis as a narrative-driven way to describe cyber attacks in everyday language. It contrasts this approach with Lockheed Martin’s Cyber Kill Chain and MITRE ATT\u0026amp;CK Attack Flow, noting that those models can be rigid or daunting for non-technical audiences. Crime script analysis decomposes an attack into actions, decisions, and situational requirements so defenders can identify points where the activity can be disrupted.\u003c/p\u003e\n\n\u003cp\u003eThe article uses business email compromise as a case study, describing a scam in which someone with financial authority receives a message that appears to come from a superior requesting an urgent payment. It highlights a previous attempted fraud against a small community sports club, where the request was plausible but the email tone raised suspicion and the scam was uncovered. The article argues that AI can automate time-consuming preparation such as identifying targets, choosing a spoofed person, shaping the lure, and personalizing urgent payment requests.\u003c/p\u003e\n\n\u003cp\u003eBy automating these early steps, attackers may be able to shift business email compromise from higher-value fraud against a few targets to lower-value fraud against many targets. The article identifies possible intervention points, including fake canary organizations, detection of repeated reconnaissance or message-generation patterns by AI providers, email delivery controls, and victim-side payment verification processes. It concludes that crime script analysis does not replace ATT\u0026amp;CK, but offers a natural-language format that helps wider teams understand attacks and where they might be stopped.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Crime script analysis is a narrative-driven technique that describes attacks in human-readable stories that non-technical audiences can understand.","The article says crime script analysis can complement or provide an alternative format to tactics, techniques, and procedures and MITRE ATT\u0026CK Attack Flow diagrams.","Using a business email compromise example, the article explains that AI can automate time-consuming preparatory work such as identifying targets and personalizing social engineering messages.","The article states that AI-assisted automation may shift business email compromise from higher-value fraud against a few targets to lower-value fraud against many targets.","The article identifies intervention points including fake canary organizations, AI provider detection of repeated reconnaissance and message generation patterns, email delivery controls, victim awareness, verified purchase orders, and payment delays."],"insights":["The article highlights that AI could make smaller organizations and low-value targets economically viable for business email compromise by reducing the manual research effort that previously limited attacker scale.","Seeding AI-discoverable public information with fake canary organizations is presented as a way to identify and block sources sending scam messages to entities that should not receive real business communications.","The article identifies AI providers as a potential disruption point because repeated reconnaissance and social-engineering message generation may leave detectable traces in large language model interactions.","The article emphasizes that the most effective intervention point remains the email delivery stage, where anomalous account behavior or unusually high outgoing mail volume can trigger rate-limiting or reputation-based blocking.","The article frames crime script analysis as a communication bridge: it does not replace MITRE ATT\u0026CK, but translates attack activity into a format that broader teams can understand and use to identify disruption points."],"referencedReports":[],"body":"\u003cp\u003eThe article explains crime script analysis as a narrative-driven way to describe cyber attacks in everyday language. It contrasts this approach with Lockheed Martin’s Cyber Kill Chain and MITRE ATT\u0026amp;CK Attack Flow, noting that those models can be rigid or daunting for non-technical audiences. Crime script analysis decomposes an attack into actions, decisions, and situational requirements so defenders can identify points where the activity can be disrupted.\u003c/p\u003e\n\n\u003cp\u003eThe article uses business email compromise as a case study, describing a scam in which someone with financial authority receives a message that appears to come from a superior requesting an urgent payment. It highlights a previous attempted fraud against a small community sports club, where the request was plausible but the email tone raised suspicion and the scam was uncovered. The article argues that AI can automate time-consuming preparation such as identifying targets, choosing a spoofed person, shaping the lure, and personalizing urgent payment requests.\u003c/p\u003e\n\n\u003cp\u003eBy automating these early steps, attackers may be able to shift business email compromise from higher-value fraud against a few targets to lower-value fraud against many targets. The article identifies possible intervention points, including fake canary organizations, detection of repeated reconnaissance or message-generation patterns by AI providers, email delivery controls, and victim-side payment verification processes. It concludes that crime script analysis does not replace ATT\u0026amp;CK, but offers a natural-language format that helps wider teams understand attacks and where they might be stopped.\u003c/p\u003e\n"}]</script>
