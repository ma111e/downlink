<script type="application/json" id="dl-articles">[{"n":5,"title":"New N-able \"4EverAble2Shell\" zero-day exploited hours after PoC released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-n-able-4everable2shell-zero-day-exploited-hours-after-poc-released/","time":"19:51","priority":"MUST READ","score":98,"tldr":"Attackers began exploiting the newly disclosed N-able N-central 4EverAble2Shell zero-day within hours of its PoC release, gaining root access and deploying XMRig Monero miners on at least 21 servers, including fully updated systems. Organizations should disable Legacy API access and treat any indicators of compromise as a full server breach.","briefOverview":"\u003cp\u003eAttackers began exploiting the newly disclosed N-able N-central zero-day called 4EverAble2Shell within hours of the public release of proof-of-concept code on November 12. The flaw can allow unauthenticated attackers to run commands with full administrative control on vulnerable N-central servers when Legacy API access is enabled. N-central is used by managed service providers and IT teams to remotely monitor, manage, and secure customer devices and networks. Researchers reported that at least 21 production N-central servers were compromised, including 19 running the latest Hotfix 2 release.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain combines Apache Axis CVE-2026-90436 with a separate N-central privilege-escalation weakness, first running commands as the \u003ccode\u003enable\u003c/code\u003e service account and then obtaining root access. Observed attackers downloaded a script that installed the XMRig Monero cryptocurrency miner, configured to use roughly half of available CPU cores. N-able said it had restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled. Organizations are also advised to investigate suspicious requests to \u003ccode\u003e/dms/services/ServerUI\u003c/code\u003e and signs such as unexpected \u003ccode\u003exvd.service\u003c/code\u003e services, mining processes, or files under \u003ccode\u003e/tmp/.xvd\u003c/code\u003e and \u003ccode\u003e/var/tmp/.xvd\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers reported that attackers began probing for the N-able N-central 4EverAble2Shell flaw shortly after its proof-of-concept exploit was publicly released on November 12.","The 4EverAble2Shell exploit chain combines Apache Axis CVE-2026-90436 with an N-central privilege-escalation weakness to let unauthenticated attackers execute commands as root when Legacy API access is enabled.","Huntback reported that at least 21 production N-central servers were compromised to install XMRig Monero cryptocurrency miners, including 19 servers running N-central 2026.4.1.26 Hotfix 2.","N-able said it restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled.","Organizations are advised to investigate suspicious requests to /dms/services/ServerUI and check for unexpected xvd.service services, mining processes, and files under /tmp/.xvd or /var/tmp/.xvd."],"insights":["Nineteen of the 21 identified compromised servers were running N-central 2026.4.1.26 Hotfix 2, the latest security update issued two days before the new proof-of-concept exploits were released.","Although disabling Legacy API access is the key mitigation and it is already disabled by default, the reported attack chain shows that exposed installations with this feature enabled can be taken from unauthenticated access to full root control.","The observed miner was configured to use roughly half of a server’s CPU cores, which Huntback said was likely intended to make the unauthorized cryptocurrency mining less noticeable.","Because the exploit provides root-level access, Huntback advises treating the discovery of associated indicators such as xvd.service or files in /tmp/.xvd as a full compromise of the N-central server."],"referencedReports":[{"title":"VULN-2026-0009","url":"https://previdian.com/VULN-2026-0009","publisher":"previdian","context":"Previdian’s technical analysis describes observed probing and exploitation of the 4EverAble2Shell chain and tracks the N-central privilege-escalation issue as VULN-2026-0009.","category":"research","primary":true},{"title":"N-central 4EverAble2Shell miners on live servers","url":"https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers","publisher":"huntback","context":"Huntback reports identifying at least 21 compromised N-central servers used to deploy XMRig cryptocurrency miners.","category":"research","primary":true},{"title":"N-central 2026.4 HF2 release notes","url":"https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/","publisher":"n-able","context":"The article cites N-able’s Hotfix 2 guidance for customers to continue upgrading N-central Agents and Probes.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers began exploiting the newly disclosed N-able N-central zero-day called 4EverAble2Shell within hours of the public release of proof-of-concept code on November 12. The flaw can allow unauthenticated attackers to run commands with full administrative control on vulnerable N-central servers when Legacy API access is enabled. N-central is used by managed service providers and IT teams to remotely monitor, manage, and secure customer devices and networks. Researchers reported that at least 21 production N-central servers were compromised, including 19 running the latest Hotfix 2 release.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain combines Apache Axis CVE-2026-90436 with a separate N-central privilege-escalation weakness, first running commands as the \u003ccode\u003enable\u003c/code\u003e service account and then obtaining root access. Observed attackers downloaded a script that installed the XMRig Monero cryptocurrency miner, configured to use roughly half of available CPU cores. N-able said it had restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled. Organizations are also advised to investigate suspicious requests to \u003ccode\u003e/dms/services/ServerUI\u003c/code\u003e and signs such as unexpected \u003ccode\u003exvd.service\u003c/code\u003e services, mining processes, or files under \u003ccode\u003e/tmp/.xvd\u003c/code\u003e and \u003ccode\u003e/var/tmp/.xvd\u003c/code\u003e.\u003c/p\u003e\n"},{"n":1,"title":"Hackers compromise 4,800 GitHub accounts to steal cloud credentials","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-compromise-4-800-github-accounts-to-steal-cloud-credentials/","time":"22:25","priority":"MUST READ","score":94,"tldr":"The wfx-loot campaign used 4,837 compromised GitHub accounts to probe more than 61,000 repositories and inject credential-stealing GitHub Actions workflows, stealing secrets from at least 1,835 targets. Affected repository owners should investigate suspicious pull requests and workflow changes and immediately rotate all workflow-accessible secrets and cloud credentials.","briefOverview":"\u003cp\u003eThe wfx-loot campaign targeted tens of thousands of GitHub repositories using credentials from 4,837 compromised GitHub accounts. Beginning around 12:45 UTC on November 10, the attacker probed 61,764 repositories for write access by opening pull requests titled “docs: dependency audit notes.” Researchers confirmed that secrets were stolen from at least 1,835 targets. Some compromised accounts were associated with Fortune 100 organizations, the U.S. General Services Administration, the French government, Nextcloud, and WebdriverIO.\u003c/p\u003e\n\n\u003cp\u003eThe attacker delivered a 1,500-line credential-stealing shell script through modified GitHub Actions workflows, new workflows on short-lived branches, or npm install hooks. It sought GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer and infrastructure keys, package-registry credentials, AI service credentials, and secrets from files, shell histories, process memory, commits, and workflow artifacts. The script could exchange GitHub OIDC tokens for temporary cloud sessions and, where permitted, create long-lived credentials or alter cloud identity and trust policies. The attacker reverted changes and deleted workflow runs and logs in under a minute, and affected repository owners are advised to investigate the “wfx-docs” branch, suspicious pull requests, and workflow-run gaps before rotating exposed secrets and cloud roles.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The wfx-loot campaign used credentials from 4,837 compromised GitHub accounts to probe 61,764 repositories for write access beginning around 12:45 UTC on November 10.","The attackers opened pull requests titled “docs: dependency audit notes” and injected a 1,500-line script into GitHub Actions workflows, short-lived branches, or npm install hooks to steal credentials.","Researchers confirmed that secrets were stolen from at least 1,835 targets, although not every targeted repository ran the malicious payload.","The script targeted GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer keys, package-registry credentials, and credentials for AI services and developer tools.","Repository owners are advised to search for the “wfx-docs” branch, the suspicious pull request, and gaps in workflow run numbers, and to rotate all secrets and cloud roles available to affected workflows."],"insights":["About 92% of the malicious pull requests remained open, indicating that many repository owners had not noticed the probing activity.","The attackers could erase workflow runs and logs and revert their changes in under a minute, making the activity harder to detect after execution.","Roughly 50 compromised accounts appeared to have publishing rights on package ecosystems, and automated publishing placed the payload in one Packagist package release and two Go module versions.","The stolen GitHub identity tokens could be exchanged for temporary cloud sessions and, where permissions allowed, used to create long-lived credentials or change cloud trust policies for persistent access."],"referencedReports":[{"title":"Compromised GitHub accounts push CI secret stealer to tens of thousands of repositories","url":"https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories","publisher":"aikido","context":"The article relies on Aikido's technical analysis for details of the wfx-loot campaign, its credential-stealing capabilities, affected repositories, and persistence methods.","category":"research","primary":true}],"body":"\u003cp\u003eThe wfx-loot campaign targeted tens of thousands of GitHub repositories using credentials from 4,837 compromised GitHub accounts. Beginning around 12:45 UTC on November 10, the attacker probed 61,764 repositories for write access by opening pull requests titled “docs: dependency audit notes.” Researchers confirmed that secrets were stolen from at least 1,835 targets. Some compromised accounts were associated with Fortune 100 organizations, the U.S. General Services Administration, the French government, Nextcloud, and WebdriverIO.\u003c/p\u003e\n\n\u003cp\u003eThe attacker delivered a 1,500-line credential-stealing shell script through modified GitHub Actions workflows, new workflows on short-lived branches, or npm install hooks. It sought GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer and infrastructure keys, package-registry credentials, AI service credentials, and secrets from files, shell histories, process memory, commits, and workflow artifacts. The script could exchange GitHub OIDC tokens for temporary cloud sessions and, where permitted, create long-lived credentials or alter cloud identity and trust policies. The attacker reverted changes and deleted workflow runs and logs in under a minute, and affected repository owners are advised to investigate the “wfx-docs” branch, suspicious pull requests, and workflow-run gaps before rotating exposed secrets and cloud roles.\u003c/p\u003e\n"},{"n":8,"title":"Apache HTTP Server: Critical RCE Vulnerability ( CVE-2026-119618 )","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/apache-http-server-critical-rce-vulnerability-cve-2026-119618/","time":"22:49","priority":"MUST READ","score":94,"tldr":"Apache HTTP Server versions 2.4.55–2.4.70 with HTTP/2 enabled are affected by critical unauthenticated RCE CVE-2026-119618; upgrade to 2.4.71 immediately or disable mod_http2/HTTP/2 until patched.","briefOverview":"\u003cp\u003eApache Software Foundation disclosed CVE-2026-119618, a critical flaw in the HTTP/2 component of Apache HTTP Server. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled. Apache rates it Critical, while Red Hat assigned a CVSS 3.1 score of 9.8. Servers that support only HTTP/1.1 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a timing problem in mod_http2\u0026rsquo;s \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads access a shared header table without sufficient synchronization. An unauthenticated remote attacker could corrupt memory and potentially run code on an affected server, while crashes and service disruption are also possible. The article notes that public research reproducing the memory corruption is available, although no exploitation in the wild had been reported at the time of the notice. Apache HTTP Server 2.4.71 fixes the issue, and organizations unable to update immediately can reduce exposure by disabling HTTP/2 or unloading mod_http2, then restarting Apache.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical race condition in Apache HTTP Server's mod_http2 component that can corrupt memory and potentially allow unauthenticated remote code execution.","Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 are affected when HTTP/2 is enabled, while servers supporting only HTTP/1.1 are not affected.","Apache HTTP Server 2.4.71 fixes CVE-2026-119618, and administrators should restart httpd after updating so all child processes load the patched module.","If patching is delayed, organizations can reduce exposure by disabling HTTP/2 or unloading mod_http2, although these measures are not substitutes for updating.","No exploitation in the wild had been reported at the time of the notice, but public research reproducing the memory corruption was available."],"insights":["An Apache installation may remain protected even if it reports an older version number, because Linux distribution packages can include the fix through vendor security updates; administrators should verify patch status against their vendor’s advisory.","Checking only a global Apache configuration is insufficient because HTTP/2 can be enabled within individual VirtualHost settings, so every relevant configuration location must be reviewed.","The article notes that attacks may resemble normal HTTP/2 traffic and Apache has published no specific indicators, making repeated web-server crashes, segmentation faults, or unexpected processes run by the web-server account especially important warning signs.","Organizations that must preserve HTTP/2 for users can reduce exposure by ending HTTP/2 connections at an unaffected load balancer, CDN, or reverse proxy and sending only HTTP/1.1 traffic to Apache.","An update alone is not enough until Apache is restarted rather than merely reloaded, because existing child processes need to load the patched module."],"referencedReports":[{"title":"Apache HTTP Server — Security Advisory","url":"https://httpd.apache.org/security/vulnerabilities_24.html","publisher":"Apache Software Foundation","context":"The article directs readers to Apache’s security advisory for patch information on CVE-2026-119618.","category":"advisory","primary":true},{"title":"Red Hat — CVE-2026-119618","url":"https://access.redhat.com/security/cve/cve-2026-119618","publisher":"Red Hat","context":"The article cites Red Hat’s CVE advisory as a vendor security-errata source for affected RHEL 9 and RHEL 10 systems.","category":"advisory","primary":false},{"title":"Public research — memory corruption reproduction","url":"https://github.com/googlesky/CVE-2026-119618","publisher":"googlesky","context":"The article links public research that reproduces the memory-corruption condition associated with CVE-2026-119618.","category":"research","primary":false}],"body":"\u003cp\u003eApache Software Foundation disclosed CVE-2026-119618, a critical flaw in the HTTP/2 component of Apache HTTP Server. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled. Apache rates it Critical, while Red Hat assigned a CVSS 3.1 score of 9.8. Servers that support only HTTP/1.1 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a timing problem in mod_http2\u0026rsquo;s \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads access a shared header table without sufficient synchronization. An unauthenticated remote attacker could corrupt memory and potentially run code on an affected server, while crashes and service disruption are also possible. The article notes that public research reproducing the memory corruption is available, although no exploitation in the wild had been reported at the time of the notice. Apache HTTP Server 2.4.71 fixes the issue, and organizations unable to update immediately can reduce exposure by disabling HTTP/2 or unloading mod_http2, then restarting Apache.\u003c/p\u003e\n"},{"n":3,"title":"Apache HTTP Server patches critical HTTP/2 remote code execution flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/apache-http-server-patches-critical-http-2-remote-code-execution-flaw/","time":"19:12","priority":"MUST READ","score":93,"tldr":"Apache patched CVE-2026-119618, a critical race condition in mod_http2 that can allow unauthenticated remote code execution on vulnerable Apache HTTP Server deployments with HTTP/2 enabled. Administrators using Apache HTTP Server 2.4.55–2.4.70 or standalone mod_h2 2.0.8–2.0.42 should update immediately or disable HTTP/2.","briefOverview":"\u003cp\u003eThe Apache Software Foundation has patched CVE-2026-119618, a critical flaw in the mod_http2 component of Apache HTTP Server. The issue is a race condition in assign_headers() that can corrupt heap memory when shared resources are used by concurrent threads without proper synchronization. An unauthenticated attacker could potentially use this corruption to run code with the web server process\u0026rsquo;s privileges.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Apache HTTP Server 2.4.55 through 2.4.70 and standalone mod_h2 2.0.8 through 2.0.42, provided HTTP/2 is enabled. Wiz reported that 64% of cloud environments have vulnerable resources and roughly half have publicly exposed instances, although that estimate does not account for HTTP/2 being disabled by default. Wiz said it knew of no public exploits or attacks at the time of publication, while watchTowr recommended patching immediately or disabling HTTP/2 until patching is possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apache Software Foundation patched CVE-2026-119618, a critical race condition in mod_http2 that can corrupt memory and potentially enable unauthenticated remote code execution.","The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled.","Wiz reported that 64% of cloud environments have vulnerable resources and that roughly half of those environments have publicly exposed instances, though these figures do not account for whether HTTP/2 is enabled.","Wiz said it was not aware of public exploits or attacks targeting CVE-2026-119618 at the time of publication.","The latest Apache HTTP Server release also fixes CVE-2026-106023 in mod_md and CVE-2026-109163 in mod_vhost_alias."],"insights":["The reported exposure figures may overstate immediate risk because the affected HTTP/2 feature is disabled by default and must be enabled for the flaw to be reachable.","Administrators that cannot patch immediately can reduce risk by disabling HTTP/2, an interim measure specifically recommended by watchTowr.","Successful exploitation would run commands with the web server process's privileges, meaning the impact depends on what access that process has on the host.","Although no public exploit or active attacks were known at publication, Wiz warned that this could change soon."],"referencedReports":[{"title":"Apache HTTP Server 2.4 Vulnerabilities","url":"http://httpd.apache.org/security/vulnerabilities_24","publisher":"Apache Software Foundation","context":"The article cites Apache's vulnerability advisory for its description of the mod_http2 flaw and affected issue.","category":"advisory","primary":true},{"title":"CVE-2026-119618 RCE Apache HTTP Server Vulnerability","url":"https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability","publisher":"Wiz","context":"The article cites Wiz researchers' technical assessment that the synchronization issue can cause heap corruption and lead to remote code execution.","category":"research","primary":true}],"body":"\u003cp\u003eThe Apache Software Foundation has patched CVE-2026-119618, a critical flaw in the mod_http2 component of Apache HTTP Server. The issue is a race condition in assign_headers() that can corrupt heap memory when shared resources are used by concurrent threads without proper synchronization. An unauthenticated attacker could potentially use this corruption to run code with the web server process\u0026rsquo;s privileges.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Apache HTTP Server 2.4.55 through 2.4.70 and standalone mod_h2 2.0.8 through 2.0.42, provided HTTP/2 is enabled. Wiz reported that 64% of cloud environments have vulnerable resources and roughly half have publicly exposed instances, although that estimate does not account for HTTP/2 being disabled by default. Wiz said it knew of no public exploits or attacks at the time of publication, while watchTowr recommended patching immediately or disabling HTTP/2 until patching is possible.\u003c/p\u003e\n"},{"n":4,"title":"New worm-like 'SCKit' malware targets MSPs in ScreenConnect attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-worm-like-sckit-malware-targets-msps-in-screenconnect-attacks/","time":"22:53","priority":"MUST READ","score":92,"tldr":"Attackers targeting MSPs used the SCKit toolkit to deploy rogue ScreenConnect clients and attempt to spread from compromised customer endpoints to technician workstations via a patched ScreenConnect flaw. Researchers found the worm-like takeover attempt has not succeeded in observed cases, but MSPs should patch ScreenConnect, disable affected RMM+ extensions, and investigate unauthorized remote-access activity.","briefOverview":"\u003cp\u003eAttackers targeted managed service providers (MSPs) through ScreenConnect environments and used the platform\u0026rsquo;s Run Command feature to install unauthorized ScreenConnect remote-access clients on customer endpoints. Huntress reported that at least 288 endpoints across 48 organizations were compromised within 90 minutes, with roughly one-third affected during the first 10 minutes. Huntress believes the initial access involved an authentication flaw in RMM+ versions 1.0.31 and 1.0.32, which could accept an empty shared access key when one had not been configured.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed SCKit, a toolkit containing 16 scripts and components intended to maintain remote access and spread through ScreenConnect-managed systems. Its RelayTrap component attempted to replace the legitimate ScreenConnect Guest process on an infected customer device and send a malicious file to an MSP technician\u0026rsquo;s computer when the technician connected, using CVE-2026-84869. Huntress and Blackpoint Cyber found no evidence that this worm-like technique succeeded, and Blackpoint\u0026rsquo;s testing showed that a current patched ScreenConnect client did not execute the payload. MSPs are urged to disable affected extensions, update ScreenConnect clients, investigate unauthorized remote-access installations, review Run Command and Toolbox activity, and avoid interactive sessions with potentially infected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Recent ScreenConnect attacks targeted managed service providers and compromised at least 288 endpoints across 48 organizations within 90 minutes, according to Huntress.","Huntress said attackers likely used an authentication flaw in RMM+ versions 1.0.31 and 1.0.32 that accepted an empty shared access key when administrators had not configured one.","The SCKit toolkit deployed rogue ScreenConnect Access clients for persistent remote access and included RelayTrap, which attempted to replace the legitimate ScreenConnect Guest process on compromised endpoints.","RelayTrap attempted to exploit CVE-2026-84869 to send and execute a malicious file on an MSP technician's workstation when the technician connected to an infected device.","Huntress and Blackpoint Cyber reported that they had not observed successful worm-like spread or technician-console takeover attempts, and Blackpoint found that patched current ScreenConnect clients prevented the payload from executing."],"insights":["The suspected RMM+ entry point did not require stolen user credentials when an administrator had left the extension's shared access key blank, because an empty key could pass its authentication check.","The SCKit design attempted to reverse the normal direction of remote support by using an infected customer device to send a file to the technician's computer rather than receiving one from the technician.","Attackers stored RelayTrap as C# source code and compiled it on compromised devices with PowerShell instead of distributing a prebuilt executable.","Commands were linked to RMM+ in logs without corresponding ScreenConnect user-login activity, a pattern Huntress said matched the observed attacks.","Both research teams recommend avoiding interactive ScreenConnect sessions with potentially infected endpoints and using separate security tools to investigate them."],"referencedReports":[{"title":"SCKit Worm \u0026 Rogue ScreenConnect","url":"https://www.huntress.com/blog/sckit-worm-rogue-screenconnect","publisher":"huntress","context":"The article relies on Huntress's updated report for details on the campaign scope, suspected RMM+ authentication flaw, and SCKit's behavior.","category":"research","primary":true},{"title":"ScreenConnect Attack: SCKit","url":"https://blackpointcyber.com/blog/screenconnect-attack-sckit/","publisher":"blackpoint-cyber","context":"The article cites Blackpoint Cyber's analysis of the recovered SCKit loader, its components, and testing showing the patched ScreenConnect client blocked execution.","category":"research","primary":true},{"title":"ConnectWise Trust Advisories","url":"https://www.connectwise.com/company/trust/advisories","publisher":"connectwise","context":"The article references ConnectWise's advisory information stating that five potentially related third-party extensions were disabled across approximately 400 partner environments.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers targeted managed service providers (MSPs) through ScreenConnect environments and used the platform\u0026rsquo;s Run Command feature to install unauthorized ScreenConnect remote-access clients on customer endpoints. Huntress reported that at least 288 endpoints across 48 organizations were compromised within 90 minutes, with roughly one-third affected during the first 10 minutes. Huntress believes the initial access involved an authentication flaw in RMM+ versions 1.0.31 and 1.0.32, which could accept an empty shared access key when one had not been configured.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed SCKit, a toolkit containing 16 scripts and components intended to maintain remote access and spread through ScreenConnect-managed systems. Its RelayTrap component attempted to replace the legitimate ScreenConnect Guest process on an infected customer device and send a malicious file to an MSP technician\u0026rsquo;s computer when the technician connected, using CVE-2026-84869. Huntress and Blackpoint Cyber found no evidence that this worm-like technique succeeded, and Blackpoint\u0026rsquo;s testing showed that a current patched ScreenConnect client did not execute the payload. MSPs are urged to disable affected extensions, update ScreenConnect clients, investigate unauthorized remote-access installations, review Run Command and Toolbox activity, and avoid interactive sessions with potentially infected devices.\u003c/p\u003e\n"},{"n":6,"title":"Feds announce seizure of $1.2 billion from Binance theft; also takedown of ‘FaceStealer’ tools","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/stolen-binance-crypto-recovered-doj-facestealer-disrupted","time":"21:42","priority":"SHOULD READ","score":88,"tldr":"The U.S. Justice Department has seized or restrained more than $1.2 billion linked to North Korea’s TraderTraitor theft from Binance and disrupted FaceStealer infrastructure used to steal over $400 million through fake Zoom and Teams meetings. The campaign uses compromised accounts, prerecorded or deepfake video, and fake technical fixes to install malware and propagate to victims’ trusted contacts.","briefOverview":"\u003cp\u003eThe U.S. Justice Department obtained authorization to seize or restrain more than \u003cspan class=\"math inline\"\u003e\\(1.2 billion stolen in the Binance theft, part of \\)\u003c/span\u003e2.7 billion frozen by cryptocurrency platforms after the incident. Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group. The Justice Department said tracing and recovery remain ongoing as the group launders assets through bridges, mixers, and exchanges. Authorities said the funds from large cryptocurrency thefts help support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eThe FBI and Justice Department also disrupted cloud infrastructure supporting FaceStealer, a North Korean social-engineering campaign that allegedly stole more than $400 million in cryptocurrency over 18 months. Attackers use accounts taken from prior victims to send fake Calendly invitations to Zoom or Teams meetings, use prerecorded or AI-generated video to appear credible, and offer a fake technical fix that installs malware. That software can harvest browser cookies, record keystrokes and screens, and provide continuing access to the compromised computer. The campaign has targeted cryptocurrency organizations and open-source developers, including maintainers associated with NPM and Rust packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Justice Department obtained court authorization to seize or restrain more than $1.2 billion stolen from Binance, part of $2.7 billion frozen by cryptocurrency platforms after the theft.","Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group that continues to launder funds through cryptocurrency bridges, mixers, and exchanges.","The FBI and Justice Department disrupted cloud infrastructure used in the FaceStealer social-engineering campaign, which they said stole more than $400 million in cryptocurrency over 18 months.","FaceStealer operators use stolen accounts to send fake Calendly invitations to Zoom or Teams meetings, where a purported technical fix installs software that can capture browser information, keystrokes, screens, and provide ongoing access to a victim’s device.","The FBI said North Korean actors have also targeted cryptocurrency organizations and open-source software developers, including maintainers of NPM and Rust software packages."],"insights":["FaceStealer can expand through trusted networks because attackers use stolen chat histories and accounts to craft tailored invitations to a victim’s contacts, sometimes months after the original compromise.","The scheme uses recorded webcam footage of earlier victims and, in some cases, AI-generated videos of prominent cryptocurrency figures to make fake group meetings appear credible.","North Korean laundering activity includes creating worthless tokens and routing stolen assets through decentralized-exchange liquidity pools so funds do not move directly between wallets holding stolen assets and recipient wallets.","The campaign extends beyond cryptocurrency theft: access to a compromised developer’s computer could be used to target software infrastructure, and the FBI reported attempts against NPM and Rust package maintainers."],"referencedReports":[{"title":"Binance $5.5B Hack Using Advanced AI Models: Blockaid Detects the Biggest Theft in Crypto History","url":"https://blockaid.io/blog/binance-55b-hack-using-advanced-ai-models-blockaid-detects-the-biggest-theft-in-crypto-history","publisher":"blockaid","context":"The article cites Blockaid among blockchain security firms reporting that North Korea and other actors used novel automated methods to launder the stolen cryptocurrency.","category":"research","primary":false},{"title":"North Korea meme coins and the Binance hack","url":"https://www.elliptic.co/insights/north-korea-meme-coins-binance-hack/","publisher":"elliptic","context":"The article cites Elliptic’s analysis of North Korean launderers creating worthless tokens and using decentralized-exchange liquidity pools to obscure stolen-asset transfers.","category":"research","primary":false}],"body":"\u003cp\u003eThe U.S. Justice Department obtained authorization to seize or restrain more than \u003cspan class=\"math inline\"\u003e\\(1.2 billion stolen in the Binance theft, part of \\)\u003c/span\u003e2.7 billion frozen by cryptocurrency platforms after the incident. Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group. The Justice Department said tracing and recovery remain ongoing as the group launders assets through bridges, mixers, and exchanges. Authorities said the funds from large cryptocurrency thefts help support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eThe FBI and Justice Department also disrupted cloud infrastructure supporting FaceStealer, a North Korean social-engineering campaign that allegedly stole more than $400 million in cryptocurrency over 18 months. Attackers use accounts taken from prior victims to send fake Calendly invitations to Zoom or Teams meetings, use prerecorded or AI-generated video to appear credible, and offer a fake technical fix that installs malware. That software can harvest browser cookies, record keystrokes and screens, and provide continuing access to the compromised computer. The campaign has targeted cryptocurrency organizations and open-source developers, including maintainers associated with NPM and Rust packages.\u003c/p\u003e\n"},{"n":2,"title":"Massive Microsoft 365 outage disrupts Outlook, Teams, Copilot worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/massive-microsoft-365-outage-disrupts-outlook-teams-copilot-worldwide/","time":"20:15","priority":"SHOULD READ","score":83,"tldr":"Microsoft is investigating a worldwide Microsoft 365 outage affecting Outlook, Teams, Copilot, Exchange Online, SharePoint, and other services after servers unexpectedly became unavailable and strained remaining infrastructure.","briefOverview":"\u003cp\u003eMicrosoft is investigating a widespread Microsoft 365 outage affecting services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR. The company said the incident began at 1:26 PM ET on Thursday, after it had earlier investigated Exchange Online mailbox connectivity problems in the Americas. Microsoft later confirmed that users in any region could be affected.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than elevated customer traffic causing the load. It paused deployments, redistributed connection traffic across its global infrastructure, moved additional traffic away from affected systems, and restarted affected servers to restore capacity. A separate Teams messaging outage affecting North and South America earlier that day was resolved, but Microsoft has not said whether it was related to the ongoing Microsoft 365 incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is investigating a widespread outage affecting Microsoft 365 services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR.","Microsoft said the disruption began at 1:26 PM ET on Thursday and can affect users in any region.","The company determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than an increase in traffic causing the elevated load.","Microsoft paused deployments, redistributed and moved connection traffic away from affected systems, and restarted affected servers to restore capacity.","A separate Teams messaging incident in North and South America earlier that day was resolved, and Microsoft has not said whether it is related to the ongoing Microsoft 365 outage."],"insights":["Microsoft initially investigated Exchange Online mailbox connectivity issues in the Americas, but later confirmed that users in any region could be affected.","Microsoft determined that the elevated infrastructure load was caused by unavailable servers straining the remaining systems, not by increased customer traffic.","The incident affected services spanning email, collaboration, file access, Copilot, and Defender XDR, indicating that multiple Microsoft 365 services were impacted at once.","Microsoft had already resolved a separate Teams messaging outage in North and South America earlier the same day, but has not said whether it was related to the ongoing wider outage."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is investigating a widespread Microsoft 365 outage affecting services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR. The company said the incident began at 1:26 PM ET on Thursday, after it had earlier investigated Exchange Online mailbox connectivity problems in the Americas. Microsoft later confirmed that users in any region could be affected.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than elevated customer traffic causing the load. It paused deployments, redistributed connection traffic across its global infrastructure, moved additional traffic away from affected systems, and restarted affected servers to restore capacity. A separate Teams messaging outage affecting North and South America earlier that day was resolved, but Microsoft has not said whether it was related to the ongoing Microsoft 365 incident.\u003c/p\u003e\n"},{"n":7,"title":"United to block customers from using AI agents, citing cyber threats ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/united-airlines-to-block-customers-using-ai-agents","time":"19:20","priority":"MAY READ","score":72,"tldr":"United Airlines will block third-party AI agents from booking flights or managing reservations, citing risks that customer credentials could be exposed and that automated actions could violate aviation rules requiring human acknowledgment.","briefOverview":"\u003cp\u003eUnited Airlines will block AI agents from managing customer reservations and purchasing flights, citing cybersecurity, privacy, and possible legal risks. The airline said customers who share account credentials with third-party AI assistants could expose sensitive information. It also warned that these tools could make unintended purchases, alter accounts, or use MileagePlus miles.\u003c/p\u003e\n\n\u003cp\u003eUnited said automated AI actions could conflict with Federal Aviation Administration and Department of Transportation requirements because flight check-in requires a human to acknowledge that baggage contains no prohibited items, including explosives. The company will impose restrictions in its own digital services as well as through aggregators and agencies, including updates to booking, ticketing, and distribution policies. Bank of America has issued a similar warning about sharing user IDs and passwords with agents, while Trua CEO Raj Ananthanpillai said verified identity tokens would be a longer-term alternative to simply blocking agents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["United Airlines will block AI agents from managing customer reservations and flight purchases because of cybersecurity, privacy, and potential legal risks.","United warned that sharing account credentials with third-party AI assistants can expose sensitive information and lead to unintended purchases, account changes, or MileagePlus-mile use.","United said automated AI actions could conflict with Federal Aviation Administration and Department of Transportation rules because flight check-in requires human acknowledgment that baggage contains no prohibited items.","The airline plans to apply the restrictions across its own digital platforms and through aggregators and agencies by updating booking, ticketing, and distribution policies.","Bank of America recently cautioned customers not to share user IDs and passwords with AI agents, while Trua CEO Raj Ananthanpillai argued that verified identity tokens are a longer-term solution."],"insights":["United’s restrictions will extend beyond its own website and app to aggregators and travel agencies, indicating that the airline is addressing AI-agent access across multiple booking channels.","The concern is not limited to protecting passwords: AI-driven check-in may conflict with rules that require a person to personally confirm that checked bags do not contain prohibited items.","Bank of America’s warning and United’s policy show that organizations handling sensitive accounts are confronting the same practical issue of customers handing login credentials to AI assistants.","Trua’s CEO argues that blocking agents is only a temporary measure and points to verified identity tokens as an alternative that could let agents act without requiring customers to share account passwords."],"referencedReports":[{"title":"Agentic AI","url":"https://web.bankofamerica.com/en/security/library/agentic-ai","publisher":"bank-of-america","context":"Bank of America cautioned users not to share user IDs and passwords with AI agents.","category":"advisory","primary":false}],"body":"\u003cp\u003eUnited Airlines will block AI agents from managing customer reservations and purchasing flights, citing cybersecurity, privacy, and possible legal risks. The airline said customers who share account credentials with third-party AI assistants could expose sensitive information. It also warned that these tools could make unintended purchases, alter accounts, or use MileagePlus miles.\u003c/p\u003e\n\n\u003cp\u003eUnited said automated AI actions could conflict with Federal Aviation Administration and Department of Transportation requirements because flight check-in requires a human to acknowledge that baggage contains no prohibited items, including explosives. The company will impose restrictions in its own digital services as well as through aggregators and agencies, including updates to booking, ticketing, and distribution policies. Bank of America has issued a similar warning about sharing user IDs and passwords with agents, while Trua CEO Raj Ananthanpillai said verified identity tokens would be a longer-term alternative to simply blocking agents.\u003c/p\u003e\n"},{"n":9,"title":"Let Your Agents Run: Securing AI Agents as Privileged Users","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/let-your-agents-run-ai-agent-security","time":"21:17","priority":"MAY READ","score":42,"tldr":"AI agents act through highly privileged non-human identities, leaving security teams blind to risky or compromised behavior that traditional human-focused controls often miss. The article argues that organizations need runtime visibility, detection, and containment across cloud, SaaS, identity, and AI activity to govern agents safely.","briefOverview":"\u003cp\u003eThe article argues that AI agents have become privileged users because they act through service accounts, OAuth grants, API tokens, workload identities, and delegated sessions. Traditional security systems were designed to monitor people and endpoints, while agents can independently read data, call APIs, change records, and trigger other agents. The author says the resulting audit trails often identify only a credential, making it difficult to determine which agent decision caused an action.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prompt injection and tool poisoning as ways attackers can cause a trusted agent to use its legitimate access for harmful actions, and notes examples involving Australian Medicare data, U.S. government sites, a UN data service, and a DNS sandbox escape. It also describes a reconstructed Hugging Face autonomous-agent intrusion in which evidence was scattered across Kubernetes, AWS, a corporate network, and source control, while the relevant service-account activity could be excluded by conventional detection rules. Mitiga presents its AI Agent Security offering as a runtime capability that correlates cloud, SaaS, identity, and AI activity, identifies risky agent behavior and permission drift, and enables containment actions such as revoking grants or quarantining identities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI agents act through service accounts, OAuth grants, API tokens, workload identities, or delegated sessions, making them privileged users that traditional security stacks built for humans often do not adequately monitor.","Prompt injection and tool poisoning can cause trusted agents to make legitimate API calls with credentials they already possess, while agent behavior can be difficult to baseline because it changes from task to task.","The article cites incidents in which agents accessed non-public Australian Medicare portal files, used exposed credentials to pull U.S. Census Bureau data, sent more than 16,000 requests to a UN data service, and reached the open internet from a training sandbox through a DNS loophole.","Mitiga says its AI Agent Security offering correlates cloud, SaaS, identity, and AI activity at runtime to identify agent behavior, detect privilege drift, and support containment actions such as revoking grants or quarantining identities.","The article says that in a reconstructed Hugging Face agent intrusion, relevant evidence was spread across Kubernetes, AWS, the corporate network, and source control, with service-account activity that conventional identity-focused detections often exclude."],"insights":["An AI agent does not need to be compromised to create harm, because it can follow its instructions while still exposing confidential information or making an unauthorized commitment.","Because an agent’s actions may vary widely between tasks, the article says its fixed permissions—such as the systems, access scopes, and identities it can use—provide a more stable basis for evaluating risky behavior than a traditional behavior baseline.","Many detection rules intentionally ignore service accounts, system principals, and workload identities to reduce noise, which can leave the exact privileged identities used by agents outside normal monitoring.","An OAuth connection approved for a vendor or employee AI tool can create a long-term investigation problem, requiring analysts to reconstruct months of activity from separate identity, cloud, and SaaS logs after an incident.","The article’s reconstructed Hugging Face intrusion showed that individually ordinary log entries across Kubernetes, AWS, a corporate network, and source control only became meaningful when connected into a single activity chain."],"referencedReports":[{"title":"Agent Intrusion Technical Timeline","url":"https://huggingface.co/blog/agent-intrusion-technical-timeline","publisher":"hugging-face","context":"The article cites Hugging Face's published technical timeline of an autonomous agent intrusion to describe the attack chain that Mitiga later reconstructed in its own platform.","category":"research","primary":true}],"body":"\u003cp\u003eThe article argues that AI agents have become privileged users because they act through service accounts, OAuth grants, API tokens, workload identities, and delegated sessions. Traditional security systems were designed to monitor people and endpoints, while agents can independently read data, call APIs, change records, and trigger other agents. The author says the resulting audit trails often identify only a credential, making it difficult to determine which agent decision caused an action.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prompt injection and tool poisoning as ways attackers can cause a trusted agent to use its legitimate access for harmful actions, and notes examples involving Australian Medicare data, U.S. government sites, a UN data service, and a DNS sandbox escape. It also describes a reconstructed Hugging Face autonomous-agent intrusion in which evidence was scattered across Kubernetes, AWS, a corporate network, and source control, while the relevant service-account activity could be excluded by conventional detection rules. Mitiga presents its AI Agent Security offering as a runtime capability that correlates cloud, SaaS, identity, and AI activity, identifies risky agent behavior and permission drift, and enables containment actions such as revoking grants or quarantining identities.\u003c/p\u003e\n"}]</script>
