the kit. Investigators estimate that about 1,800 paying customers used Kratos to run roughly 15,000 phishing campaigns per month.\u003c/p\u003e\n\n\u003cp\u003eKratos was built to steal Microsoft 365 logins and session cookies, allowing criminals to access accounts as the user and bypass two-factor authentication. ANY.RUN found that operators could choose between a PHP page that harvested credentials and a Node.js reverse proxy that relayed logins to Microsoft in real time and captured the resulting session. The service operated like a franchise, with customers paying in cryptocurrency and using a dedicated website and Telegram shop to manage accounts and campaigns.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said the number of victims since late 2024 reached the hundreds of thousands across more than 30 countries, especially in Europe and the United States. Microsoft Threat Intelligence tracks the same kit as SneakyLog and identified a tax-themed campaign that sent W-2 documents with personalized QR codes to about 100 organizations. The BKA said stolen credentials could be used for further phishing, sold to other criminals, or used to gain a foothold inside companies through Microsoft 365 environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["German and US law enforcement took more than 200 Kratos servers offline, and Indonesian authorities arrested the man they say developed and operated the phishing kit.","German investigators estimated that about 1,800 paying customers used Kratos to run around 15,000 phishing campaigns per month.","Kratos was designed to steal Microsoft 365 passwords and session cookies, allowing attackers to access accounts as the user and bypass two-factor authentication.","ANY.RUN found that Kratos offered a plain PHP credential-harvesting mode and a Node.js reverse-proxy mode that relayed Microsoft logins in real time to capture sessions.","Authorities said victims since late 2024 numbered in the hundreds of thousands across more than 30 countries, with concentrations in Europe and the United States."],"insights":["A password reset alone may not fix exposure from Kratos, because sessions stolen through its reverse-proxy mode can survive the reset and must be revoked separately.","The paired loading of barr.svg and lg.svg on fake login pages is a highly actionable hunting signal, with ANY.RUN rating it at 90% recall and near-zero false positives.","Kratos lowered the barrier for less-skilled criminals by operating through a dedicated website and Telegram shop where customers could manage accounts and organize campaigns.","The takedown stopped the core servers, but it did not affect the roughly 1,800 customers or the kit code they already possessed."],"referencedReports":[{"title":"Kratos PhaaS: Account Takeover","url":"https://any.run/cybersecurity-blog/kratos-phaas-account-takeover/","publisher":"ANY.RUN","context":"The article cites ANY.RUN’s reverse engineering of the Kratos kit to explain its PHP credential-harvesting mode, Node.js reverse-proxy mode, and detection indicators.","category":"","primary":false},{"title":"When tax season becomes cyberattack season: Phishing and malware campaigns using tax-related lures","url":"https://www.microsoft.com/en-us/security/blog/2026/03/19/when-tax-season-becomes-cyberattack-season-phishing-and-malware-campaigns-using-tax-related-lures/","publisher":"Microsoft Threat Intelligence","context":"The article cites Microsoft Threat Intelligence for its identification of Kratos as SneakyLog and for details about a tax-themed Microsoft 365 phishing campaign.","category":"","primary":false}],"body":"\u003cp\u003eGerman and US law enforcement dismantled the core infrastructure of Kratos, a criminal phishing kit described by German investigators as one of the world’s most widely used. The Frankfurt public prosecutor’s cybercrime unit and Germany’s Federal Criminal Police Office said more than 200 servers were pulled offline, while Indonesian authorities arrested the man they say developed and ran the kit. Investigators estimate that about 1,800 paying customers used Kratos to run roughly 15,000 phishing campaigns per month.\u003c/p\u003e\n\n\u003cp\u003eKratos was built to steal Microsoft 365 logins and session cookies, allowing criminals to access accounts as the user and bypass two-factor authentication. ANY.RUN found that operators could choose between a PHP page that harvested credentials and a Node.js reverse proxy that relayed logins to Microsoft in real time and captured the resulting session. The service operated like a franchise, with customers paying in cryptocurrency and using a dedicated website and Telegram shop to manage accounts and campaigns.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said the number of victims since late 2024 reached the hundreds of thousands across more than 30 countries, especially in Europe and the United States. Microsoft Threat Intelligence tracks the same kit as SneakyLog and identified a tax-themed campaign that sent W-2 documents with personalized QR codes to about 100 organizations. The BKA said stolen credentials could be used for further phishing, sold to other criminals, or used to gain a foothold inside companies through Microsoft 365 environments.\u003c/p\u003e\n"},{"n":22,"title":"Ubuntu snap-confine Flaw Could Give Local Users Root on Default Desktop Installs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ubuntu-snap-confine-flaw-could-give.html","time":"18:07","priority":"SHOULD READ","score":86,"tldr":"A high-severity snap-confine flaw, CVE-2026-8933, can let a local unprivileged user gain root access on default Ubuntu Desktop installations. Ubuntu users and organizations should apply the latest snapd updates and verify installed versions promptly.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed a high-severity local privilege escalation vulnerability in snap-confine, tracked as CVE-2026-8933 with a CVSS score of 7.8. The flaw can be triggered by an unprivileged local user to obtain root access and gain complete control of a target environment. It affects default installations of Ubuntu Desktop 24.04, 25.10, and 26.04.\u003c/p\u003e\n\n\u003cp\u003eQualys said the issue stems from a security hardening change that inadvertently introduced a race condition during sandbox initialization. During setup, snap-confine creates temporary directories and files under /tmp that are initially owned by the unprivileged user before ownership is transferred to root. Qualys identified two concurrent race conditions involving a malicious FUSE file system mounted over a temporary scratch directory and a symbolic link pointing to an arbitrary target file.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit can redirect file operations to sensitive system locations and manipulate permissions before ownership is transferred. Qualys described an AppArmor bypass that targets the /run/udev/** path, drops a malicious .rules file in /run/udev/rules.d/, and triggers systemd-udevd to execute arbitrary commands as root. Organizations are urged to apply the latest snapd updates and verify the installed snapd version, especially because affected snap-confine variants can exist on updated Ubuntu 24.04 systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers disclosed CVE-2026-8933, a high-severity local privilege escalation vulnerability in snap-confine that can let an unprivileged user obtain root access.","The flaw affects default installations of Ubuntu Desktop 24.04, 25.10, and 26.04.","Qualys said the issue stems from a security hardening change that introduced race conditions during sandbox initialization.","The exploit involves mounting a malicious FUSE file system over a temporary scratch directory and using a symbolic link to redirect file operations to sensitive system locations.","Organizations are advised to apply the latest snapd updates and verify the installed snapd version."],"insights":["Administrators should verify the installed snapd version rather than assuming a system is safe based on Ubuntu release age or previous patch status, because updated Ubuntu 24.04 systems can still carry the affected snap-confine variant.","The affected component is present on default Ubuntu Desktop installations, which expands the response scope beyond servers to employee workstations, developer systems, and administrative endpoints.","The flaw came from a security hardening change intended to reduce attack surface, showing that least-privilege changes can still introduce exploitable race conditions if temporary file handling is unsafe.","The exploit path specifically abuses permitted read-write access under /run/udev/** to bypass AppArmor confinement and get systemd-udevd to execute commands as root."],"referencedReports":[{"title":"CVE-2026-8933 snap-confine Local Privilege Escalation","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/07/21/cve-2026-8933-snap-confine-local-privilege-escalation","publisher":"Qualys","context":"The article cites Qualys’s technical disclosure as the source of details on the snap-confine local privilege escalation flaw.","category":"","primary":false},{"title":"CVE-2026-3888","url":"https://ubuntu.com/security/CVE-2026-3888","publisher":"Ubuntu","context":"The article references Ubuntu’s CVE page while noting a previous snap-confine-related vulnerability that had come to light.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed a high-severity local privilege escalation vulnerability in snap-confine, tracked as CVE-2026-8933 with a CVSS score of 7.8. The flaw can be triggered by an unprivileged local user to obtain root access and gain complete control of a target environment. It affects default installations of Ubuntu Desktop 24.04, 25.10, and 26.04.\u003c/p\u003e\n\n\u003cp\u003eQualys said the issue stems from a security hardening change that inadvertently introduced a race condition during sandbox initialization. During setup, snap-confine creates temporary directories and files under /tmp that are initially owned by the unprivileged user before ownership is transferred to root. Qualys identified two concurrent race conditions involving a malicious FUSE file system mounted over a temporary scratch directory and a symbolic link pointing to an arbitrary target file.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit can redirect file operations to sensitive system locations and manipulate permissions before ownership is transferred. Qualys described an AppArmor bypass that targets the /run/udev/** path, drops a malicious .rules file in /run/udev/rules.d/, and triggers systemd-udevd to execute arbitrary commands as root. Organizations are urged to apply the latest snapd updates and verify the installed snapd version, especially because affected snap-confine variants can exist on updated Ubuntu 24.04 systems.\u003c/p\u003e\n"},{"n":32,"title":"SQL injection isn't dead","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/sql-injection-isnt-dead","time":"15:03","priority":"SHOULD READ","score":86,"tldr":"SQL injection remains a serious, recurring risk despite decades-old fixes, as shown by the emergency WordPress patch and continued high advisory counts. The key takeaway is that teams still need layered defenses, including secure coding, scanning, and runtime protection, because frameworks, legacy code, dependencies, and AI-generated code can still introduce SQLi flaws.","briefOverview":"\u003cp\u003eWordPress shipped an emergency release on July 17 to fix an unauthenticated remote code execution flaw in the core that was reachable through SQL injection. The article says an anonymous attacker could exploit the flaw on a stock install, and WordPress.org enabled forced auto-updates because of its severity. Searchlight Cyber, which reported the issue, estimates that more than 500 million sites run WordPress, and affected users were told to move to Version 7.0.2 or 6.9.5 for the older branch.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SQL injection is not dead even though it is an old vulnerability with a well-known fix: prepared statements and parameterized queries. It cites GitHub Advisory Database figures showing SQL injection advisories rising from 2,096 in 2023 to 2,850 in 2025, while SQL injection, command injection, and path traversal together still made up more than one in ten reported issues. It also notes that OWASP moved injection from third to fifth in its 2025 Top 10, but says the overall injection category still has more reported CVEs than any other.\u003c/p\u003e\n\n\u003cp\u003eThe article says SQL injection persists because developers make mistakes, frameworks and ORMs can be bypassed through raw or unsafe methods, legacy code carries flaws forward, and WAFs do not catch everything. It highlights Django CVE-2024-42005 as an example where query methods used for JSON column fields inserted field names into SQL without cleaning them. It also says AI coding assistants can still generate injectable code, and argues for both prevention through scanning and runtime protection such as Aikido Zen as a backstop when vulnerable code or dependencies reach production.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress shipped an emergency release on July 17 to fix an unauthenticated remote code execution flaw in core that was reachable through a SQL injection, and affected users were told to move to Version 7.0.2 or 6.9.5 for the older branch.","GitHub Advisory Database counts cited in the article show SQL injection advisories rising from 2,096 in 2023 to 2,850 in 2025, while SQL injection, command injection, and path traversal together still made up more than one in ten reported issues.","The article says SQL injection persists because developers make mistakes, frameworks and ORMs can be bypassed through raw or unsafe queries, legacy code carries old flaws forward, and WAFs do not catch everything.","The article cites Django CVE-2024-42005 as an example where two query methods used for JSON column fields inserted field names into SQL without cleaning them, making attacker-controlled field names able to affect the query.","The article states that AI coding assistants can still produce SQL injection flaws, citing the 2021 “Asleep at the Keyboard” study that found about 40% of generated programs were vulnerable across common weakness scenarios."],"insights":["The article frames SQL injection as no longer mainly a technical knowledge gap, because the common fix has existed for over 25 years; the harder problem is applying it consistently across every query, endpoint, dependency, and legacy code path.","Frameworks and ORMs can create a false sense of safety, since teams may assume database access methods are protected even when raw queries, unsafe methods, or framework-level bugs remove that protection.","The WordPress flaw illustrates a gap in static scanning: the article says the issue depended on a malformed batch request disrupting internal bookkeeping, creating a cross-request path that a static scanner could not follow.","The article argues that runtime protection is still needed even when teams use secure coding practices, because SQL injection can exist in dependencies or hosted defaults that application developers do not directly control.","AI-generated code changes the risk profile because more less-trained people can put code into company codebases while being less likely to recognize SQL injection issues."],"referencedReports":[{"title":"WP2Shell: Pre-Authentication RCE in WordPress Core","url":"https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber as the entity that reported the WordPress core flaw and uses its estimate that over 500 million sites run WordPress.","category":"","primary":false},{"title":"CVE-2024-42005 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2024-42005","publisher":"National Vulnerability Database","context":"The article references Django CVE-2024-42005 as an example of unsafe framework query methods that could enable SQL injection.","category":"","primary":false},{"title":"OWASP Top 10 2025: A05 Injection","url":"https://owasp.org/Top10/2025/A05_2025-Injection/","publisher":"OWASP","context":"The article cites OWASP’s 2025 Top 10 entry to explain that injection moved from third to fifth while still accounting for many reported CVEs.","category":"","primary":false},{"title":"Asleep at the Keyboard? Assessing the Security of GitHub Copilot's Code Contributions","url":"https://arxiv.org/abs/2108.09293","publisher":"NYU and Cornell","context":"The article cites the 2021 study to support its claim that AI coding assistants can generate vulnerable code, including SQL injection and command injection.","category":"","primary":false},{"title":"Exploit Brokers Pay $500,000 for a WordPress RCE. I Found One with GPT-5.","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"Searchlight Cyber","context":"The article references this technical analysis to state that finding the WordPress vulnerability required a frontier model running four agents for six hours.","category":"","primary":false}],"body":"\u003cp\u003eWordPress shipped an emergency release on July 17 to fix an unauthenticated remote code execution flaw in the core that was reachable through SQL injection. The article says an anonymous attacker could exploit the flaw on a stock install, and WordPress.org enabled forced auto-updates because of its severity. Searchlight Cyber, which reported the issue, estimates that more than 500 million sites run WordPress, and affected users were told to move to Version 7.0.2 or 6.9.5 for the older branch.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SQL injection is not dead even though it is an old vulnerability with a well-known fix: prepared statements and parameterized queries. It cites GitHub Advisory Database figures showing SQL injection advisories rising from 2,096 in 2023 to 2,850 in 2025, while SQL injection, command injection, and path traversal together still made up more than one in ten reported issues. It also notes that OWASP moved injection from third to fifth in its 2025 Top 10, but says the overall injection category still has more reported CVEs than any other.\u003c/p\u003e\n\n\u003cp\u003eThe article says SQL injection persists because developers make mistakes, frameworks and ORMs can be bypassed through raw or unsafe methods, legacy code carries flaws forward, and WAFs do not catch everything. It highlights Django CVE-2024-42005 as an example where query methods used for JSON column fields inserted field names into SQL without cleaning them. It also says AI coding assistants can still generate injectable code, and argues for both prevention through scanning and runtime protection such as Aikido Zen as a backstop when vulnerable code or dependencies reach production.\u003c/p\u003e\n"},{"n":1,"title":"South Korea discloses data breach impacting diplomats worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/south-korea-discloses-data-breach-impacting-diplomats-worldwide/","time":"20:06","priority":"SHOULD READ","score":84,"tldr":"South Korea says hackers accessed the National Diplomatic Academy’s online education system for about ten months, stealing personal data such as IDs, names, emails, and encrypted passwords of thousands of foreign ministry staff and diplomats. Officials have blocked the system and warned affected personnel to watch for suspicious emails.","briefOverview":"\u003cp\u003eSouth Korea disclosed that hackers breached the National Diplomatic Academy\u0026rsquo;s online education system and stole personal information belonging to current and former Ministry of Foreign Affairs employees, including overseas diplomats. The incident occurred in April 2025 after an unknown threat actor exploited a vulnerability in the Academy\u0026rsquo;s server. The government said data was leaked between April 2025 and February 2026.\u003c/p\u003e\n\n\u003cp\u003eThe breach impacts at least 6,000 individuals, including 350 current government attachés dispatched abroad. The leaked information is estimated to include IDs, names, email addresses, and encrypted passwords, while the ministry said unique identification numbers, sensitive information, mobile phone numbers, photographs, and home addresses were not exposed. Korean media reported that the number of affected individuals may be as high as 10,000 and that official job titles and departmental affiliations were also exposed.\u003c/p\u003e\n\n\u003cp\u003eThe Ministry of Foreign Affairs blocked access to the online education system and implemented additional security measures. An MFA spokesperson said disclosure was delayed for five months because of the sensitivity of diplomatic and security affairs and the need for careful review and analysis. Potentially impacted individuals were advised to watch for suspicious communications, especially emails from unclear or unknown sources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["South Korea disclosed that hackers breached the National Diplomatic Academy's online education system and stole personal information belonging to current and former Ministry of Foreign Affairs employees, including overseas diplomats.","The breach began in April 2025 after an unknown threat actor exploited a vulnerability in the Academy's server, and data was leaked between April 2025 and February 2026.","The incident impacts at least 6,000 individuals, including 350 current government attachés dispatched abroad, though Korean media reported the number could be as high as 10,000.","The leaked information is estimated to include IDs, names, email addresses, and encrypted passwords, while the ministry said unique identification numbers, sensitive information, mobile phone numbers, photographs, and home addresses were not exposed.","The Ministry of Foreign Affairs blocked access to the online education system, strengthened security measures, and advised potentially affected individuals to watch for suspicious communications."],"insights":["The compromised server was reportedly excluded from regular security scrutiny because it was located inside the Ministry of Foreign Affairs headquarters, showing that internal systems can become blind spots even in sensitive government environments.","The breach was not publicly disclosed until five months after it was recognized in February 2026, because the ministry said diplomatic and security sensitivities required careful review and analysis.","Although the ministry said passwords were encrypted, it specifically warned affected people to be cautious with emails from unclear or unknown sources, indicating that the exposed names, emails, and job-related information could support targeted suspicious communications.","The affected education platform was originally created for remote training during the COVID-19 pandemic but later became a broader tool for government training and video conferencing, increasing the importance of securing temporary or pandemic-era systems that remain in use."],"referencedReports":[],"body":"\u003cp\u003eSouth Korea disclosed that hackers breached the National Diplomatic Academy\u0026rsquo;s online education system and stole personal information belonging to current and former Ministry of Foreign Affairs employees, including overseas diplomats. The incident occurred in April 2025 after an unknown threat actor exploited a vulnerability in the Academy\u0026rsquo;s server. The government said data was leaked between April 2025 and February 2026.\u003c/p\u003e\n\n\u003cp\u003eThe breach impacts at least 6,000 individuals, including 350 current government attachés dispatched abroad. The leaked information is estimated to include IDs, names, email addresses, and encrypted passwords, while the ministry said unique identification numbers, sensitive information, mobile phone numbers, photographs, and home addresses were not exposed. Korean media reported that the number of affected individuals may be as high as 10,000 and that official job titles and departmental affiliations were also exposed.\u003c/p\u003e\n\n\u003cp\u003eThe Ministry of Foreign Affairs blocked access to the online education system and implemented additional security measures. An MFA spokesperson said disclosure was delayed for five months because of the sensitivity of diplomatic and security affairs and the need for careful review and analysis. Potentially impacted individuals were advised to watch for suspicious communications, especially emails from unclear or unknown sources.\u003c/p\u003e\n"},{"n":16,"title":"Japanese food logistics giant recovers as extortion group claims cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/nichirei-japan-food-logistics-cyberattack-recovery","time":"15:40","priority":"SHOULD READ","score":84,"tldr":"Japan’s Nichirei Logistics is restoring nationwide refrigerated delivery operations after a cyberattack disrupted food supply chains, including KFC Japan. The extortion group RansomHouse has claimed responsibility and threatened to leak stolen confidential data, though Nichirei has not confirmed data theft or attributed the attack.","briefOverview":"\u003cp\u003eJapan’s largest refrigerated logistics company, Nichirei Logistics Group, is gradually restoring operations after a cyberattack disrupted food deliveries nationwide. The company said Wednesday that warehouse operations and frozen food shipments affected by last week’s system failures are expected to return to normal by the end of the week. Nichirei said it is still investigating the incident and has not attributed it to a specific threat actor.\u003c/p\u003e\n\n\u003cp\u003eRansomHouse posted Nichirei’s name on its dark web leak site and claimed responsibility for the attack. The group urged the company to make contact to prevent the release of what it described as “confidential data, projects and documents,” but did not disclose whether it had issued a ransom demand. Nichirei has not commented on the hackers’ allegations, but said some affected servers contained personal information and that it had notified the individuals concerned.\u003c/p\u003e\n\n\u003cp\u003eThe cyberattack affected Nichirei’s nationwide network of about 140 refrigerated distribution centers, disrupting food manufacturers, supermarket chains and restaurant operators that rely on its logistics services. KFC Japan said disrupted deliveries from a Nichirei subsidiary caused ingredient shortages, including Original Recipe chicken, forcing some restaurants to reduce menus and shorten operating hours. KFC Japan later said deliveries had resumed and all restaurants had returned to normal operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nichirei Logistics Group said it expects warehouse operations and frozen food shipments affected by last week’s system failures to return to normal by the end of the week.","RansomHouse posted Nichirei’s name on its dark web leak site, claimed responsibility for the attack, and threatened to release what it described as confidential data, projects, and documents.","Nichirei said some affected servers contained personal information and that it had notified the individuals concerned, but it did not confirm whether any data had been stolen.","The cyberattack disrupted operations across Nichirei’s nationwide network of about 140 refrigerated distribution centers, affecting food manufacturers, supermarket chains, and restaurant operators.","KFC Japan said disrupted deliveries from a Nichirei subsidiary caused ingredient shortages that forced some restaurants to reduce menus and shorten operating hours, but deliveries had resumed and all restaurants had returned to normal operations by Wednesday."],"insights":["The incident shows that disruption at a logistics provider can quickly affect consumer-facing businesses, as Nichirei’s system failures led to ingredient shortages and reduced operations at KFC Japan restaurants.","RansomHouse’s claim highlights a data-theft extortion model in which the group threatens public release of information rather than relying on data encryption.","Nichirei’s recovery of warehouse and frozen food shipment operations is proceeding separately from its investigation into whether data was stolen, showing that operational restoration and data exposure assessment can remain unresolved at the same time.","The article notes several recent cyberattacks against major Japanese companies across different industries, but also states there is no indication the incidents are linked."],"referencedReports":[{"title":"RansomHouse: Stolen Data Market, Influence Operations \u0026 Other Tricks Up The Sleeve","url":"https://analyst1.com/ransomhouse-stolen-data-market-influence-operations-amp-other-tricks-up-the-sleeve/","publisher":"Analyst1","context":"The article cites this analysis when stating that cybersecurity researchers have previously linked RansomHouse to Russia-aligned threat actors including Alphv/BlackCat, LockBit 3.0, and RagnarLocker.","category":"","primary":false}],"body":"\u003cp\u003eJapan’s largest refrigerated logistics company, Nichirei Logistics Group, is gradually restoring operations after a cyberattack disrupted food deliveries nationwide. The company said Wednesday that warehouse operations and frozen food shipments affected by last week’s system failures are expected to return to normal by the end of the week. Nichirei said it is still investigating the incident and has not attributed it to a specific threat actor.\u003c/p\u003e\n\n\u003cp\u003eRansomHouse posted Nichirei’s name on its dark web leak site and claimed responsibility for the attack. The group urged the company to make contact to prevent the release of what it described as “confidential data, projects and documents,” but did not disclose whether it had issued a ransom demand. Nichirei has not commented on the hackers’ allegations, but said some affected servers contained personal information and that it had notified the individuals concerned.\u003c/p\u003e\n\n\u003cp\u003eThe cyberattack affected Nichirei’s nationwide network of about 140 refrigerated distribution centers, disrupting food manufacturers, supermarket chains and restaurant operators that rely on its logistics services. KFC Japan said disrupted deliveries from a Nichirei subsidiary caused ingredient shortages, including Original Recipe chicken, forcing some restaurants to reduce menus and shorten operating hours. KFC Japan later said deliveries had resumed and all restaurants had returned to normal operations.\u003c/p\u003e\n"},{"n":19,"title":"Adobe Acrobat Extension Flaw Let Malicious Sites Read WhatsApp Web Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/adobe-acrobat-extension-flaw-let.html","time":"15:01","priority":"SHOULD READ","score":84,"tldr":"Researchers disclosed a now-patched flaw chain in Adobe’s Acrobat Chrome extension that could let a malicious website silently read a victim’s WhatsApp Web chats and profile data if they visited a crafted page. The issue, tracked as CVE-2026-48294, affected extension versions through 26.5.2.2 and enabled cross-origin data theft without stealing credentials or cookies.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of a now-patched vulnerability chain in the Adobe Acrobat Chrome extension, which has over 314 million users. The flaw, codenamed \u003cstrong\u003eHermeticReader\u003c/strong\u003e and tracked as \u003cstrong\u003eCVE-2026-48294\u003c/strong\u003e, is described as a universal cross-site scripting-class cross-origin data disclosure vulnerability. It affects all versions of the extension prior to and including 26.5.2.2.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation could bypass the browser’s same-origin policy and access data linked to the victim’s session across origins. The article says a victim would need to be convinced to visit a maliciously crafted URL or interact with a compromised web page that triggers the extension’s vulnerable code path. Guardio Labs said the attack did not require malware installation, credential phishing, or extraction of a session cookie.\u003c/p\u003e\n\n\u003cp\u003eThe attack sequence involved an attacker-controlled page loading an iframe from the extension resources, enabling the Hermes engine through a feature flag, and opening WhatsApp Web in a background browser tab. The engine then manipulated WhatsApp Web by injecting a POST form into WhatsApp’s DOM to steal rendered data. Guardio Labs said the exposed data could include the chat list, contact names, message previews, profile name, and visible text of the open conversation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers disclosed a now-patched vulnerability chain in the Adobe Acrobat Chrome extension that could allow a malicious site to hijack a user’s WhatsApp Web data.","The flaw, codenamed HermeticReader and tracked as CVE-2026-48294 with a CVSS score of 7.4, affects all versions of the extension prior to and including 26.5.2.2.","Successful exploitation requires user interaction, such as convincing a victim with the Adobe Acrobat extension installed to visit a maliciously crafted URL or interact with a compromised web page.","The vulnerability can bypass the browser’s same-origin policy and provide cross-origin read access to session-bound data, including authenticated content from third-party web applications.","Guardio Labs said exploitation could capture WhatsApp Web’s rendered chat list, contact names, message previews, profile name, and visible text of an open conversation."],"insights":["The attack chain abused an ordinary-looking attacker-controlled web page to activate a dormant WhatsApp-related engine inside the Adobe extension, rather than relying on malware installation or credential theft.","A specific feature flag named \"floodgate-add\" was central to exposing the Hermes engine behavior that handled WhatsApp integration in the extension.","The data theft depended on two web platform details working together: an option element without a value attribute submits its text content, and WhatsApp Web’s missing form-action directive allowed a form submission to any origin.","The article highlights that small implementation and standards-level behaviors in browser extensions and web pages can combine into serious cross-site data exposure when deployed at the scale of a 314-million-user extension."],"referencedReports":[{"title":"HermeticReader - The Vulnerability That Turned Adobe 300M Install Extension into a Full WhatsApp Takeover","url":"https://guard.io/labs/hermeticreader---the-vulnerability-that-turned-adobe-300m-install-extension-into-a-full-whatsapp-takeover","publisher":"Guardio Labs","context":"The article cites Guardio Labs' technical analysis as the source of the HermeticReader vulnerability details and quotes its researcher explaining the attack chain.","category":"","primary":false},{"title":"Adobe Security Acknowledgments","url":"https://helpx.adobe.com/security/acknowledgements.html","publisher":"Adobe","context":"The article links to Adobe's page when describing the vulnerability chain as now patched.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of a now-patched vulnerability chain in the Adobe Acrobat Chrome extension, which has over 314 million users. The flaw, codenamed \u003cstrong\u003eHermeticReader\u003c/strong\u003e and tracked as \u003cstrong\u003eCVE-2026-48294\u003c/strong\u003e, is described as a universal cross-site scripting-class cross-origin data disclosure vulnerability. It affects all versions of the extension prior to and including 26.5.2.2.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation could bypass the browser’s same-origin policy and access data linked to the victim’s session across origins. The article says a victim would need to be convinced to visit a maliciously crafted URL or interact with a compromised web page that triggers the extension’s vulnerable code path. Guardio Labs said the attack did not require malware installation, credential phishing, or extraction of a session cookie.\u003c/p\u003e\n\n\u003cp\u003eThe attack sequence involved an attacker-controlled page loading an iframe from the extension resources, enabling the Hermes engine through a feature flag, and opening WhatsApp Web in a background browser tab. The engine then manipulated WhatsApp Web by injecting a POST form into WhatsApp’s DOM to steal rendered data. Guardio Labs said the exposed data could include the chat list, contact names, message previews, profile name, and visible text of the open conversation.\u003c/p\u003e\n"},{"n":12,"title":"Dolphin X Stealer Targets 300+ Apps and Profiles Users with AI","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/dolphin-x-stealer","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Varonis researchers analyzed Dolphin X, an infostealer builder advertised on cybercrime forums that can target 300+ apps to steal browser data, wallets, SSH keys, cloud tokens, and DevOps credentials. Its AI Profiler helps attackers rank infected victims by value, making behavior-based detection and keeping long-lived credentials off disk especially important.","briefOverview":"\u003cp\u003eVaronis Threat Labs discovered Dolphin X advertised on a cybercrime forum by a vendor using the alias “Kontraktnik.” The listing claims the malware can target more than 300 applications and collect data beyond browser passwords, including cryptocurrency wallets, .env files, SSH keys, cloud tokens, and other DevOps credentials. A single archive can contain data from nine browsers, more than 100 wallet extensions, 65 desktop wallets, 10 password managers, and 30 cloud command-line tools.\u003c/p\u003e\n\n\u003cp\u003eThe article says Dolphin X’s collection scope could expose everything from a victim’s personal accounts to credentials used to manage an employer’s cloud environment. On a developer’s machine, locally stored .env files and SSH directories may contain over-scoped, long-lived credentials that can provide access to cloud consoles, build pipelines, and production data. Dolphin X also includes an “AI Profiler” that scores infected users based on application usage, browsing activity, and installed software, then gives attackers daily rankings to help them identify high-value victims.\u003c/p\u003e\n\n\u003cp\u003eVaronis obtained Dolphin X’s operator panel and analyzed it in an isolated lab, focusing on how the agent is built. The panel submits operator configurations to backend.thedolphinx[.]top:8443 for compilation rather than compiling on the operator’s machine, and it includes an optional mutation engine with tiers that claim to alter control flow, imports, timestamps, the Rich header, and section padding. The article recommends keeping long-lived credentials off disk wherever possible and focusing detection on behavior rather than file signatures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs discovered Dolphin X advertised on a cybercrime forum by a vendor using the alias “Kontraktnik.”","The Dolphin X listing claims the malware can target more than 300 applications, including browser logins, cryptocurrency wallets, .env files, SSH keys, cloud tokens, and other DevOps credentials.","The operator panel submits build configurations to backend.thedolphinx[.]top:8443, where compilation happens instead of on the operator’s machine.","Dolphin X includes an “AI Profiler” that scores infected users based on application usage, browsing activity, and installed software, then provides attackers with rankings in a daily summary.","Varonis says defenders should keep long-lived credentials off disk wherever possible and focus detection on behavior rather than file signatures."],"insights":["Dolphin X’s build process gives the seller ongoing control over generated malware because every build is compiled on the vendor’s backend rather than on the operator’s machine.","The panel explicitly notes that disabling the mutation engine produces the same hash across builds, making non-mutated versions more vulnerable to hash-based blocking.","The mutation tiers are aimed at weakening brittle detections by changing control flow, import hashes, timestamps, Rich headers, and section padding rather than changing the tool’s advertised behavior.","The AI Profiler turns large numbers of infected machines into a prioritized victim list, reducing the manual effort attackers need to identify the most valuable targets.","A developer workstation is especially high-risk because Dolphin X targets locally stored .env files, SSH directories, cloud tokens, and other credentials that may connect to production environments."],"referencedReports":[],"body":"\u003cp\u003eVaronis Threat Labs discovered Dolphin X advertised on a cybercrime forum by a vendor using the alias “Kontraktnik.” The listing claims the malware can target more than 300 applications and collect data beyond browser passwords, including cryptocurrency wallets, .env files, SSH keys, cloud tokens, and other DevOps credentials. A single archive can contain data from nine browsers, more than 100 wallet extensions, 65 desktop wallets, 10 password managers, and 30 cloud command-line tools.\u003c/p\u003e\n\n\u003cp\u003eThe article says Dolphin X’s collection scope could expose everything from a victim’s personal accounts to credentials used to manage an employer’s cloud environment. On a developer’s machine, locally stored .env files and SSH directories may contain over-scoped, long-lived credentials that can provide access to cloud consoles, build pipelines, and production data. Dolphin X also includes an “AI Profiler” that scores infected users based on application usage, browsing activity, and installed software, then gives attackers daily rankings to help them identify high-value victims.\u003c/p\u003e\n\n\u003cp\u003eVaronis obtained Dolphin X’s operator panel and analyzed it in an isolated lab, focusing on how the agent is built. The panel submits operator configurations to backend.thedolphinx[.]top:8443 for compilation rather than compiling on the operator’s machine, and it includes an optional mutation engine with tiers that claim to alter control flow, imports, timestamps, the Rich header, and section padding. The article recommends keeping long-lived credentials off disk wherever possible and focusing detection on behavior rather than file signatures.\u003c/p\u003e\n"},{"n":24,"title":"Trojanized Newtonsoft.Json Fork Hides Game-Rigging Code in a Working Library","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/trojanized-newtonsoftjson-fork-hides.html","time":"06:00","priority":"SHOULD READ","score":82,"tldr":"A typosquatted NuGet package masquerading as Newtonsoft.Json contained targeted code to rig Digitain’s FG-Crash betting game while otherwise functioning like a normal library. Developers should remove the package, block its C2 address, and pin Newtonsoft.Json to known-good versions.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered a NuGet typosquat named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e that masquerades as the Newtonsoft.Json library while hiding code designed to rig live game results on Digitain. Seven versions were published to the NuGet repository, and the package has been downloaded about 1,200 times. The package has been unlisted by its owner, MagicalPuff96, but the artifacts remain available for download from the registry.\u003c/p\u003e\n\n\u003cp\u003eJFrog said the trojan targets Digitain’s FG-Crash betting game and, in later versions, exfiltrates rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The malicious behavior begins after the host initializes \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e, includes a randomized delay, and only succeeds on systems exposing Digitain’s specific game backend method. The package metadata leaked an internal Digitain repository URL in every version, indicating the author had access to FG-Crash’s source code.\u003c/p\u003e\n\n\u003cp\u003eJFrog described three generations of the trojanized fork, with changes in obfuscation, rigging strategy, and exfiltration path across versions. The article says the payload has no credential theft, persistence, or lateral-movement capability, and its sole purpose is to compromise the integrity of the crash game. Developers are advised to remove the typosquat package, block the command-and-control address, and pin Newtonsoft.Json to a known-good version via \u003ccode\u003epackages.lock.json\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered a NuGet typosquat named Newtonsoftt.Json.Net that masquerades as the Newtonsoft.Json library and contains code designed to rig live game results on Digitain.","Seven versions of Newtonsoftt.Json.Net were published to NuGet between August 13 and October 10, 2025, and the package has been downloaded about 1,200 times.","JFrog said the trojan only activates after JsonConvert.DefaultSettings is assigned and only succeeds on systems exposing Digitain’s specific FG-Crash backend method.","Later versions of the package exfiltrate rigged round results to an attacker-controlled server at 185.126.237[.]64:5341 using the header X-Seq-ApiKey: theperfectheist2025.","The package metadata leaked an internal Digitain repository URL in all package versions, indicating the author had access to FG-Crash’s source code."],"insights":["The package’s malicious behavior was narrowly targeted, so non-Digitain users could install a working library and see no obvious signs of compromise, making detection by ordinary testing less likely.","The malware was triggered through JsonConvert.DefaultSettings and delayed before acting, showing that the attacker hid the payload behind normal library initialization behavior rather than obvious startup activity.","The progression across versions shows the author iteratively changed obfuscation, rigging strategy, and exfiltration, while version 11.0.11 being unobfuscated suggests an accidental clean build may have been published.","The leaked internal Digitain repository URL in every package version is especially actionable because it indicates possible access to FG-Crash source code, not just public knowledge of the platform.","Unlisting the NuGet package does not remove the artifacts from the registry, so developers may still need to actively remove it and pin Newtonsoft.Json to a known-good version."],"referencedReports":[{"title":"NuGet Typosquat Targets Betting Platform","url":"https://jfrog.com/blog/nuget-typosquat-targets-betting-platform/","publisher":"JFrog","context":"The article cites JFrog’s analysis as the source describing the trojanized NuGet package’s Digitain game-rigging behavior and exfiltration details.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered a NuGet typosquat named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e that masquerades as the Newtonsoft.Json library while hiding code designed to rig live game results on Digitain. Seven versions were published to the NuGet repository, and the package has been downloaded about 1,200 times. The package has been unlisted by its owner, MagicalPuff96, but the artifacts remain available for download from the registry.\u003c/p\u003e\n\n\u003cp\u003eJFrog said the trojan targets Digitain’s FG-Crash betting game and, in later versions, exfiltrates rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The malicious behavior begins after the host initializes \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e, includes a randomized delay, and only succeeds on systems exposing Digitain’s specific game backend method. The package metadata leaked an internal Digitain repository URL in every version, indicating the author had access to FG-Crash’s source code.\u003c/p\u003e\n\n\u003cp\u003eJFrog described three generations of the trojanized fork, with changes in obfuscation, rigging strategy, and exfiltration path across versions. The article says the payload has no credential theft, persistence, or lateral-movement capability, and its sole purpose is to compromise the integrity of the crash game. Developers are advised to remove the typosquat package, block the command-and-control address, and pin Newtonsoft.Json to a known-good version via \u003ccode\u003epackages.lock.json\u003c/code\u003e.\u003c/p\u003e\n"},{"n":28,"title":"Microsoft Azure DevOps MCP Flaw Lets Hidden PR Comments Hijack AI Review Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-azure-devops-mcp-flaw-lets.html","time":"04:57","priority":"SHOULD READ","score":82,"tldr":"Microsoft’s Azure DevOps MCP server can pass hidden pull request comments directly to AI review agents, allowing prompt injection that makes the agent use a reviewer’s broader permissions to access and leak data from other projects. The issue stems from a missing guardrail on the pull request retrieval path, and no fixed release or CVE was reported as of the article’s publication.","briefOverview":"\u003cp\u003eManifold Security detailed a flaw in Microsoft’s official Azure DevOps MCP server that can let hidden pull request comments hijack an AI review agent. Azure DevOps pull request descriptions can include HTML comments that are invisible in the web UI but returned verbatim by the REST API and handed to the agent. When a reviewer asks an agent to review the pull request, the hidden text can redirect the agent’s actions while it is using the reviewer’s own permissions.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because reviewers often have broader access than the person who opened a pull request, so the agent can reach projects and data the attacker cannot access directly. In Manifold’s proof of concept, the agent triggered a pipeline in another project, read a confidential wiki page, and posted that page back as a pull request comment. The vulnerable path is the \u003ccode\u003erepo_get_pull_request_by_id\u003c/code\u003e tool, which did not use the \u003ccode\u003ecreateExternalContentResponse\u003c/code\u003e helper that Microsoft had applied to wiki-page and build-log tools as a prompt-injection guardrail.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described the behavior as a known class of AI risk and said it requires attacker write access to a project and a second user invoking an AI tool over the content. As of July 21, the article reported no fixed release, no public CVE assignment, and no public evidence of use outside Manifold’s testing. The article recommends least-privilege tokens, limiting the MCP domains and tools available to agents, checking agent traces for cross-project activity, and scanning pull request descriptions for hidden HTML comments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manifold Security reported that Microsoft’s official Azure DevOps MCP server can return pull request descriptions containing hidden HTML comments directly to AI agents without the prompt-injection guardrail used on some other tools.","An attacker with write access to a project can place hidden instructions in a pull request description, and those instructions are invisible in the Azure DevOps web UI but returned verbatim by the REST API.","In Manifold’s proof of concept, an AI review agent using a reviewer’s credentials triggered a pipeline in another project, read a confidential wiki page the attacker could not access, and posted that page back as a pull request comment.","The vulnerable path is the repo_get_pull_request_by_id tool, which does not call the createExternalContentResponse helper that Microsoft added for wiki-page and build-log outputs.","As of July 21, the article reported no fixed release, no public CVE assignment, and no evidence that the technique had been used outside Manifold’s testing."],"insights":["The most dangerous condition is not merely broad access, but broad access combined with an auto-approve agent posture that allows tools to run without per-tool prompts.","A human review of the pull request description is not an effective safeguard in this case because the malicious instructions can be invisible in the Azure DevOps web interface.","The article highlights that prompt-injection defenses can fail unevenly when they are applied one tool response at a time, because a single unwrapped path can reopen the attack surface.","The proof of concept worked with both Copilot CLI and Claude Code, indicating that the issue is tied to the Azure DevOps MCP server’s handling of content rather than a single AI agent implementation.","Practical checks include reviewing agent tool traces for cross-project pipeline runs, wiki reads, or comments posted during reviews, and scanning open pull request descriptions for hidden HTML comments."],"referencedReports":[{"title":"Azure DevOps MCP Server Vulnerability","url":"https://www.manifold.security/blog/azure-devops-mcp-server-vulnerability","publisher":"Manifold Security","context":"The article is primarily based on Manifold Security’s disclosure and proof of concept for the Azure DevOps MCP server prompt-injection issue.","category":"","primary":false},{"title":"How Microsoft defends against indirect prompt injection attacks","url":"https://www.microsoft.com/en-us/msrc/blog/2025/07/how-microsoft-defends-against-indirect-prompt-injection-attacks","publisher":"Microsoft","context":"The article references Microsoft’s own guidance on indirect prompt injection to explain the spotlighting guardrail that was applied to some MCP server tools but not the pull request path.","category":"","primary":false},{"title":"MCP GitHub Vulnerability","url":"https://invariantlabs.ai/blog/mcp-github-vulnerability","publisher":"Invariant Labs","context":"The article cites Invariant Labs’ May 2025 research as a prior example of the same class of agent prompt-injection attack against GitHub’s MCP server.","category":"","primary":false}],"body":"\u003cp\u003eManifold Security detailed a flaw in Microsoft’s official Azure DevOps MCP server that can let hidden pull request comments hijack an AI review agent. Azure DevOps pull request descriptions can include HTML comments that are invisible in the web UI but returned verbatim by the REST API and handed to the agent. When a reviewer asks an agent to review the pull request, the hidden text can redirect the agent’s actions while it is using the reviewer’s own permissions.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because reviewers often have broader access than the person who opened a pull request, so the agent can reach projects and data the attacker cannot access directly. In Manifold’s proof of concept, the agent triggered a pipeline in another project, read a confidential wiki page, and posted that page back as a pull request comment. The vulnerable path is the \u003ccode\u003erepo_get_pull_request_by_id\u003c/code\u003e tool, which did not use the \u003ccode\u003ecreateExternalContentResponse\u003c/code\u003e helper that Microsoft had applied to wiki-page and build-log tools as a prompt-injection guardrail.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described the behavior as a known class of AI risk and said it requires attacker write access to a project and a second user invoking an AI tool over the content. As of July 21, the article reported no fixed release, no public CVE assignment, and no public evidence of use outside Manifold’s testing. The article recommends least-privilege tokens, limiting the MCP domains and tools available to agents, checking agent traces for cross-project activity, and scanning pull request descriptions for hidden HTML comments.\u003c/p\u003e\n"},{"n":31,"title":"Finding eight high-severity vulnerabilities in NodeBB in six hours","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/eight-high-severity-vulnerabilities-nodebb","time":"21:44","priority":"SHOULD READ","score":82,"tldr":"NodeBB versions before 4.14.0 contained eight high-severity vulnerabilities, including XSS, authorization bypasses, private message exposure, post hijacking, and ActivityPub-related flaws exploitable on default installations. Users should upgrade to 4.14.0 or later to receive the fixes.","briefOverview":"\u003cp\u003eAikido ran a whitebox assessment on NodeBB, a NodeJS-powered forum software, while improving its AI Pentest offering. The assessment found eight high-severity vulnerabilities in NodeBB versions prior to 4.14.0, all described as exploitable on default instances. NodeBB maintainers responded quickly to the report and fixed the issues in early July.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities included multiple cross-site scripting issues, authorization bypasses, private message exposure, post hijacking, unauthenticated access to private category content, and upvote inflation. Some issues involved NodeBB’s Federation and ActivityPub features, including malicious federated profile data, unsafe Federation Errors display in the admin panel, and inconsistent signature handling. One XSS issue came from translation sequences being interpreted after user input had already been rendered into templates.\u003c/p\u003e\n\n\u003cp\u003eThe impact ranged from attackers running JavaScript in users’ or administrators’ browsers to reading private messages, viewing hidden category content, accessing some admin-only pages, changing posts, and inflating post upvotes. The article says users should upgrade to versions newer than 4.14.0 to resolve the vulnerabilities. It also highlights that alternative routes and external integrations should be secured as carefully as the main application paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido found eight high-severity vulnerabilities in NodeBB versions prior to 4.14.0 during a whitebox assessment of the NodeJS-based forum software.","The reported issues included multiple cross-site scripting flaws, authorization bypasses, private message exposure, post hijacking through mass assignment, unauthenticated access to private category content, and upvote inflation through ActivityPub handling.","Two of the cross-site scripting vulnerabilities required interaction with a custom Federation server, including one involving a malicious federated profile icon URL and another involving stored payloads in the Federation Errors admin view.","One vulnerability allowed a regular user to access some admin routes by setting a custom homepage to an admin path because permission checks ran before homepage rewriting.","NodeBB maintainers responded quickly to Aikido’s report, fixed the issues in early July, and version 4.14.0 includes the broader translation-system changes needed to address the template injection issue."],"insights":["Several flaws appeared in NodeBB’s ActivityPub and Federation features, showing that alternative integration paths can be less protected than the main application paths even when the same sensitive data or actions are involved.","The translation template injection was a design-level issue rather than a single missed escape, because NodeBB rendered templates first and then interpreted translation markers after user input had already entered the output.","Client-side validation did not protect the custom homepage setting, because a user could bypass the browser check and send the settings request directly to reach admin routes through homepage rewriting.","The private message exposure depended on a subtle method mismatch: NodeBB verified ActivityPub signatures for POST requests, but still trusted the same signature header on GET requests to set the user identity.","Some fixes required more than blocking one payload, such as refactoring the translation system so translation sequences could be escaped safely without breaking features and plugins that relied on them."],"referencedReports":[],"body":"\u003cp\u003eAikido ran a whitebox assessment on NodeBB, a NodeJS-powered forum software, while improving its AI Pentest offering. The assessment found eight high-severity vulnerabilities in NodeBB versions prior to 4.14.0, all described as exploitable on default instances. NodeBB maintainers responded quickly to the report and fixed the issues in early July.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities included multiple cross-site scripting issues, authorization bypasses, private message exposure, post hijacking, unauthenticated access to private category content, and upvote inflation. Some issues involved NodeBB’s Federation and ActivityPub features, including malicious federated profile data, unsafe Federation Errors display in the admin panel, and inconsistent signature handling. One XSS issue came from translation sequences being interpreted after user input had already been rendered into templates.\u003c/p\u003e\n\n\u003cp\u003eThe impact ranged from attackers running JavaScript in users’ or administrators’ browsers to reading private messages, viewing hidden category content, accessing some admin-only pages, changing posts, and inflating post upvotes. The article says users should upgrade to versions newer than 4.14.0 to resolve the vulnerabilities. It also highlights that alternative routes and external integrations should be secured as carefully as the main application paths.\u003c/p\u003e\n"},{"n":46,"title":"Mitiga Security Advisory:  Abusing the SSM Agent as a Remote Access Trojan","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan","time":"16:13","priority":"SHOULD READ","score":82,"tldr":"Mitiga found that attackers with sufficient host privileges can abuse the legitimate AWS SSM Agent as a stealthy remote access tool, including registering it to an attacker-controlled AWS account or running a second agent process for persistence. Organizations should monitor SSM agent registration changes, duplicate agent processes, and unusual Systems Manager activity, and avoid blindly allowlisting the SSM binaries.","briefOverview":"\u003cp\u003eMitiga discovered a post-exploitation technique in AWS involving abuse of the AWS Systems Manager Agent as a Remote Access Trojan on Linux and Windows machines. The technique allows an attacker who already has high-privilege access on an endpoint with the SSM agent installed to maintain access and control the machine using another AWS account. Mitiga says the approach benefits from the SSM agent’s legitimacy, Amazon-signed binary, and widespread installation in default Amazon Machine Images.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two main abuse scenarios. In the first, an attacker hijacks the original SSM agent by registering it in hybrid mode with a different AWS account, causing the agent to communicate with and execute commands from the attacker-owned account. In the second, an attacker runs another SSM agent process that communicates with the attacker’s AWS account while the original agent continues working with the victim’s AWS account.\u003c/p\u003e\n\n\u003cp\u003eMitiga also found that the SSM proxy feature can be abused to route SSM traffic to an attacker-controlled server instead of AWS infrastructure by changing proxy environment variables. The article recommends monitoring for new SSM instance data directories, SSM agent registration commands, multiple amazon-ssm-agent processes, and suspicious Systems Manager activity in CloudTrail logs. It also recommends reconsidering AV or EDR allowlisting of SSM binaries and using Systems Manager through VPC endpoints with policies that restrict commands to the original AWS account or organization.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga discovered a post-exploitation technique in which AWS Systems Manager Agent can be run as a Remote Access Trojan on Linux and Windows machines and controlled from another AWS account.","The technique requires an attacker to have high-privilege access on an endpoint with the SSM agent installed, such as root on Linux or administrator on Windows for some scenarios.","One abuse scenario hijacks the original SSM agent by registering it in hybrid mode with a different AWS account, causing it to execute commands from the attacker-owned account.","Another abuse scenario runs a separate SSM agent process that communicates with the attacker’s AWS account while the original agent continues communicating with the victim’s AWS account.","Mitiga recommends monitoring for new SSM instance data directories, SSM agent registration commands, multiple amazon-ssm-agent processes, suspicious Systems Manager activity in CloudTrail logs, and reconsidering allowlisting SSM binaries in AV or EDR tools."],"insights":["Because the SSM agent binary is signed by Amazon and often trusted by AV and EDR tools, Mitiga specifically recommends removing SSM binaries from allow lists so endpoint tools can inspect their behavior.","A hijacked SSM agent may be easier to notice from the AWS side than from the host because it stops reporting as active and reachable in the victim’s AWS account.","Running a second SSM agent process can avoid disrupting the original agent’s connection to the victim’s AWS account, but it creates a clearer endpoint detection opportunity because more than one amazon-ssm-agent process should be suspicious.","Mitiga found that the SSM proxy feature can be abused so the agent communicates with an attacker-controlled server instead of AWS infrastructure by changing http_proxy and https_proxy environment variables.","AWS suggested using Systems Manager through a VPC endpoint with endpoint policies so EC2 instances in private subnets only respond to commands from principals in the original AWS account or organization."],"referencedReports":[{"title":"SSM Agent Tomfoolery","url":"https://frichetten.com/blog/ssm-agent-tomfoolery/","publisher":"frichetten.com","context":"The article says this January 2021 research, along with the public SSM agent source code, informed Mitiga’s work on a mock server for the Run Command feature.","category":"","primary":false}],"body":"\u003cp\u003eMitiga discovered a post-exploitation technique in AWS involving abuse of the AWS Systems Manager Agent as a Remote Access Trojan on Linux and Windows machines. The technique allows an attacker who already has high-privilege access on an endpoint with the SSM agent installed to maintain access and control the machine using another AWS account. Mitiga says the approach benefits from the SSM agent’s legitimacy, Amazon-signed binary, and widespread installation in default Amazon Machine Images.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two main abuse scenarios. In the first, an attacker hijacks the original SSM agent by registering it in hybrid mode with a different AWS account, causing the agent to communicate with and execute commands from the attacker-owned account. In the second, an attacker runs another SSM agent process that communicates with the attacker’s AWS account while the original agent continues working with the victim’s AWS account.\u003c/p\u003e\n\n\u003cp\u003eMitiga also found that the SSM proxy feature can be abused to route SSM traffic to an attacker-controlled server instead of AWS infrastructure by changing proxy environment variables. The article recommends monitoring for new SSM instance data directories, SSM agent registration commands, multiple amazon-ssm-agent processes, and suspicious Systems Manager activity in CloudTrail logs. It also recommends reconsidering AV or EDR allowlisting of SSM binaries and using Systems Manager through VPC endpoints with policies that restrict commands to the original AWS account or organization.\u003c/p\u003e\n"},{"n":48,"title":"More on Abusing the Amazon Web Services SSM Agent as a Remote Access Trojan","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/abusing-the-amazon-web-services-ssm-agent-as-a-remote-access-trojan","time":"16:09","priority":"SHOULD READ","score":82,"tldr":"Researchers show that attackers who gain access to a machine can repurpose the legitimate AWS Systems Manager Agent as a stealthy remote access tool, using their own AWS account or server for command and control. Defenders should not blindly allowlist SSM Agent activity and should monitor for agent re-registration, multiple agent processes, and suspicious Session Manager or Run Command use.","briefOverview":"\u003cp\u003eThe article describes research into abusing the AWS Systems Manager Agent so it functions as a Remote Access Trojan on Linux and Windows machines. The technique relies on an attacker who has already gained execution on an endpoint where the SSM Agent is installed, then uses an attacker-controlled AWS account as command and control. The author frames this as a “living off the land” technique because it uses an existing, Amazon-signed binary instead of requiring a separate backdoor or RAT.\u003c/p\u003e\n\n\u003cp\u003eThe article presents two main abuse scenarios: hijacking the original SSM Agent by registering it in hybrid mode to another AWS account, and running an additional SSM Agent process alongside the legitimate one. In the hijack scenario, the victim’s AWS account can lose communication with the agent, while in the side-by-side scenario the original agent can continue working normally as the attacker manages a second agent. The article also notes a mock-server approach that uses proxy environment variables and a malicious root certificate so SSM traffic can be routed to an attacker-controlled server instead of AWS.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that the SSM Agent is preinstalled on many AWS-provided AMIs and is often trusted because it is developed and signed by Amazon and communicates with Amazon-owned infrastructure. The article recommends not blindly allow-listing the SSM Agent, monitoring for re-registration, unexpected instance data directories, multiple amazon-ssm-agent processes, and suspicious Session Manager activity in CloudTrail. It also recommends using Systems Manager VPC endpoints with endpoint policies to restrict commands to the original AWS account or organization.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes a post-exploitation technique in which attackers can abuse the AWS Systems Manager Agent so it functions as a Remote Access Trojan on Linux and Windows machines while using an attacker-controlled AWS account as command and control.","The SSM Agent is preinstalled and running by default on many AWS-provided Amazon Machine Images, including Amazon Linux, Ubuntu Server, SUSE Linux Enterprise Server, macOS EC2, and Windows Server AMIs.","In one scenario, an attacker with root or administrator privileges can hijack the original SSM Agent by registering it in hybrid mode to the attacker’s AWS account, causing the victim’s AWS account to lose communication with the agent.","In a second scenario, an attacker can run an additional SSM Agent process side by side with the legitimate one, allowing the original agent to keep working while the attacker manages the added agent from another AWS account.","The article recommends monitoring for SSM Agent re-registration, multiple amazon-ssm-agent processes, suspicious Session Manager activity in CloudTrail, and reconsidering allow-listing the SSM Agent in security tools."],"insights":["The article emphasizes that traffic limited to Amazon-owned IP addresses and a binary signed by Amazon should not be treated as automatically benign, because the SSM Agent can still be controlled from an attacker-owned AWS account.","The side-by-side SSM Agent technique is especially stealthy from the cloud account perspective because the victim’s original SSM Agent can continue communicating normally while the attacker operates a separate agent process.","A hijacked SSM Agent can be detected by looking for unexpected new instance data directories, such as additional identifiers under /var/lib/amazon/ssm/ on Linux or C:\\ProgramData\\Amazon\\SSM\\InstanceData\\ on Windows.","The article notes that attackers may avoid AWS-managed command and control entirely by using proxy environment variables and a mock server, while still relying on the legitimate SSM Agent binary.","AWS VPC endpoints with endpoint policies can reduce exposure by restricting Systems Manager commands so instances respond only to principals from the original AWS account or organization."],"referencedReports":[{"title":"AWS SSM is a Trojan Horse: Fix It Now","url":"https://cloudonaut.io/aws-ssm-is-a-trojan-horse-fix-it-now/","publisher":"cloudonaut","context":"The article cites this blog as prior work describing how the SSM Agent can be used as a backdoor or malware-like mechanism.","category":"","primary":false},{"title":"SSM Agent Tomfoolery","url":"https://frichetten.com/blog/ssm-agent-tomfoolery/","publisher":"frichetten.com","context":"The article cites this prior research as describing SSM Agent abuse and says its mock server work was partially based on that research.","category":"","primary":false}],"body":"\u003cp\u003eThe article describes research into abusing the AWS Systems Manager Agent so it functions as a Remote Access Trojan on Linux and Windows machines. The technique relies on an attacker who has already gained execution on an endpoint where the SSM Agent is installed, then uses an attacker-controlled AWS account as command and control. The author frames this as a “living off the land” technique because it uses an existing, Amazon-signed binary instead of requiring a separate backdoor or RAT.\u003c/p\u003e\n\n\u003cp\u003eThe article presents two main abuse scenarios: hijacking the original SSM Agent by registering it in hybrid mode to another AWS account, and running an additional SSM Agent process alongside the legitimate one. In the hijack scenario, the victim’s AWS account can lose communication with the agent, while in the side-by-side scenario the original agent can continue working normally as the attacker manages a second agent. The article also notes a mock-server approach that uses proxy environment variables and a malicious root certificate so SSM traffic can be routed to an attacker-controlled server instead of AWS.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that the SSM Agent is preinstalled on many AWS-provided AMIs and is often trusted because it is developed and signed by Amazon and communicates with Amazon-owned infrastructure. The article recommends not blindly allow-listing the SSM Agent, monitoring for re-registration, unexpected instance data directories, multiple amazon-ssm-agent processes, and suspicious Session Manager activity in CloudTrail. It also recommends using Systems Manager VPC endpoints with endpoint policies to restrict commands to the original AWS account or organization.\u003c/p\u003e\n"},{"n":51,"title":"Hackers in Aisle 5: What DragonForce Taught Us About Zero Trust","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/hackers-in-aisle-5-what-dragonforce-taught-us-about-zero-trust","time":"16:11","priority":"SHOULD READ","score":82,"tldr":"DragonForce’s attacks on UK retailers show how vishing and weak help desk identity checks can let attackers bypass technical defenses, reset passwords, escalate privileges, and deploy ransomware. The key lesson is to enforce zero-trust controls around identity, least privilege, segmentation, and real-time monitoring before attackers turn trusted processes against the organization.","briefOverview":"\u003cp\u003eMultiple UK retailers were hit by an orchestrated cyber-attack by the hacking group DragonForce. The attackers did not rely on a zero-day application vulnerability or complex initial attack chain, but instead used voice phishing to impersonate employees and trick IT support into resetting internal passwords. After gaining access, they deployed ransomware, exfiltrated data, paralyzed internal systems, and caused millions in operational disruption.\u003c/p\u003e\n\n\u003cp\u003eThe article describes the attack as a failure of identity, access, operational controls, segmentation, and monitoring rather than a single missed patch. Weak help desk identity checks, excessive privileges, poor Active Directory hygiene, flat network architecture, and insufficient real-time visibility allowed the attackers to move through the environment and escalate access. Security agents such as EDR and antivirus were likely disabled through Group Policy manipulation or direct tampering before ransomware was distributed across endpoints.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends stronger controls around identity verification, including multi-factor authentication for user logins and help desk password resets. It also calls for segmented networks, Just-In-Time access, stricter controls over RDP and PowerShell, centralized monitoring, behavioral analytics, least privilege, RBAC, and regular audits. It provides example hunting approaches for suspicious password resets, privilege escalation through group changes, and attempts to disable EDR or antivirus tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DragonForce attacked multiple UK retailers by using vishing to impersonate employees and trick IT support into resetting internal passwords.","After gaining access, the attackers enumerated internal systems, escalated privileges through weak access controls and likely Active Directory misconfigurations, and moved laterally with native tools such as RDP, PsExec, or PowerShell remoting.","The attackers likely disabled EDR and antivirus tools through Group Policy manipulation or direct service and process tampering before deploying ransomware across multiple endpoints.","The article identifies inadequate help desk identity verification, excessive privileges, poor Active Directory hygiene, weak network segmentation, and insufficient real-time monitoring as major control failures.","The article recommends multi-factor authentication for password resets, network segmentation, Just-In-Time access, centralized monitoring, behavioral analytics, least privilege, RBAC, and regular audits to reduce the risk of similar attacks."],"insights":["Help desk password resets should be treated as a high-risk authentication workflow, because the article shows attackers used that process as the initial path into internal systems rather than exploiting a technical flaw.","Multi-factor authentication needs to apply after a password reset, because the article notes this would have prevented attackers from logging in with the newly reset password unless the real user approved access or was separately tricked into sharing a code.","Security monitor
