<script type="application/json" id="dl-articles">[{"n":1,"title":"Unpatched Magento and Adobe Commerce Zero-Day Exploited to Backdoor Online Stores","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/unpatched-magento-and-adobe-commerce.html","time":"20:14","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting an unpatched zero-day in Magento Open Source and Adobe Commerce, dubbed StyleSmuggler, to gain unauthenticated code execution and install persistent backdoors on online stores. With no official Adobe patch or CVE yet, admins should urgently look for the published indicators and consider temporary mitigations such as disabling GraphQL and hardening PHP execution.","briefOverview":"\u003cp\u003eAttackers are actively exploiting a new unpatched vulnerability in Magento Open Source and Adobe Commerce that Sansec named StyleSmuggler. Sansec said the flaw allows malicious code to run on an online store’s server without logging in, and attacks began on September 4. As of September 6, Adobe had not published an advisory, CVE identifier, patch, or workaround.\u003c/p\u003e\n\n\u003cp\u003eSansec said all current versions are affected, including 2.4.9, and reproduced the unauthenticated chain on clean Magento Open Source 2.4.7, 2.4.8, and 2.4.9 installations. Disrex Group separately handled two compromised Magento Open Source stores and said patch status was irrelevant for those incidents because the stores were breached before defenses for the flaw existed. The researchers’ interim advice includes temporarily disabling GraphQL for stores that can do so until Adobe releases a fix.\u003c/p\u003e\n\n\u003cp\u003eThe attack first plants PHP code in a Magento-written file and then makes Magento execute it by triggering a standard “Payment Transaction Failed Reminder” email. The backdoor has been seen as a non-root process named \u003ccode\u003e[kworker/u:8:0]\u003c/code\u003e, with a binary under \u003ccode\u003e~/.local/share/.gvfsd/gvfsd-user\u003c/code\u003e and cron entries that restart it every five minutes. Disrex said defenders should search both \u003ccode\u003evar/report/\u003c/code\u003e and \u003ccode\u003evar/log/system.log\u003c/code\u003e, preserve evidence before cleanup, remove the cron entry before killing the process, flush session storage, and rotate sensitive credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are exploiting an unpatched vulnerability dubbed StyleSmuggler in Magento Open Source and Adobe Commerce that allows unauthenticated code execution on online store servers.","Sansec said attacks began on September 4 and that, as of September 6, Adobe had not published an advisory, CVE identifier, patch, or workaround.","Sansec reported that all current versions are affected, including 2.4.9, and said it reproduced the unauthenticated chain on clean Magento Open Source 2.4.7, 2.4.8, and 2.4.9 installations.","Disrex Group handled two compromised Magento Open Source stores and said both were breached during an roughly eight-hour window before any defense for the flaw existed.","Published indicators include a non-root process named [kworker/u:8:0], a binary at ~/.local/share/.gvfsd/gvfsd-user, cron entries that restart it every five minutes, specific SHA-256 hashes, and attacker infrastructure such as 247.cdnflare[.]xyz and 99.84.67[.]186:443."],"insights":["Patch status alone did not protect the compromised stores, because one victim was running Magento Open Source 2.4.8 and another earlier victim had Adobe’s July and August 2026 security updates applied.","Sansec’s published check of var/report/ could miss infections, because Disrex found both of its cases were poisoned through var/log/system.log instead.","Scanning only the store document root can miss the implant, because Disrex said eComscan reported Store A clean while the backdoor was installed one directory above the document root under the account’s home directory.","Removing the cron entry after killing the process may fail, because Disrex said the implant re-added the cron entry within a second of removal and recommends removing the cron entry before killing the process.","Blocking only the attacker address in Sansec’s advisory would have stopped less than a quarter of the traffic Disrex observed, because Disrex recorded 26 distinct source addresses across the two stores."],"referencedReports":[{"title":"StyleSmuggler","url":"https://sansec.io/research/stylesmuggler","publisher":"Sansec","context":"The article cites Sansec’s September 5 advisory that disclosed the unpatched Magento Open Source and Adobe Commerce flaw and described active exploitation.","category":"","primary":false},{"title":"Adobe Security Bulletin APSB26-92","url":"https://helpx.adobe.com/security/products/magento/apsb26-92.html","publisher":"Adobe","context":"The article references Adobe’s August bulletin for the patch level labeling of Magento Open Source 2.4.6-2026-aug.","category":"","primary":false},{"title":"stylesmuggler-mitigation","url":"https://github.com/disrex-group/stylesmuggler-mitigation","publisher":"Disrex Group","context":"The article cites Disrex Group’s incident-response repository as independent evidence of exploitation and as the source of web-server rules, indicators, and cleanup material.","category":"","primary":false},{"title":"StyleSmuggler Magento zero-day incident write-up","url":"https://www.disrex.nl/blogs/stylesmuggler-magento-zero-day","publisher":"Disrex Group","context":"The article notes that Disrex published an incident write-up about the compromised Magento stores it handled.","category":"","primary":false},{"title":"HOW-IT-WORKS.md","url":"https://github.com/disrex-group/stylesmuggler-mitigation/blob/main/HOW-IT-WORKS.md","publisher":"Disrex Group","context":"The article references Disrex’s mechanism write-up for its reading of how the exploit chain reaches Magento dependency-injection code and launches the dropper.","category":"","primary":false},{"title":"IOC.md","url":"https://github.com/disrex-group/stylesmuggler-mitigation/blob/main/IOC.md","publisher":"Disrex Group","context":"The article cites Disrex’s indicator list alongside Sansec’s indicators for files, processes, hashes, domains, and IP addresses linked to the campaign.","category":"","primary":false},{"title":"CLEANUP.md","url":"https://github.com/disrex-group/stylesmuggler-mitigation/blob/main/CLEANUP.md","publisher":"Disrex Group","context":"The article references Disrex’s cleanup guide for recommended containment and recovery steps on already infected stores.","category":"","primary":false}],"body":"\u003cp\u003eAttackers are actively exploiting a new unpatched vulnerability in Magento Open Source and Adobe Commerce that Sansec named StyleSmuggler. Sansec said the flaw allows malicious code to run on an online store’s server without logging in, and attacks began on September 4. As of September 6, Adobe had not published an advisory, CVE identifier, patch, or workaround.\u003c/p\u003e\n\n\u003cp\u003eSansec said all current versions are affected, including 2.4.9, and reproduced the unauthenticated chain on clean Magento Open Source 2.4.7, 2.4.8, and 2.4.9 installations. Disrex Group separately handled two compromised Magento Open Source stores and said patch status was irrelevant for those incidents because the stores were breached before defenses for the flaw existed. The researchers’ interim advice includes temporarily disabling GraphQL for stores that can do so until Adobe releases a fix.\u003c/p\u003e\n\n\u003cp\u003eThe attack first plants PHP code in a Magento-written file and then makes Magento execute it by triggering a standard “Payment Transaction Failed Reminder” email. The backdoor has been seen as a non-root process named \u003ccode\u003e[kworker/u:8:0]\u003c/code\u003e, with a binary under \u003ccode\u003e~/.local/share/.gvfsd/gvfsd-user\u003c/code\u003e and cron entries that restart it every five minutes. Disrex said defenders should search both \u003ccode\u003evar/report/\u003c/code\u003e and \u003ccode\u003evar/log/system.log\u003c/code\u003e, preserve evidence before cleanup, remove the cron entry before killing the process, flush session storage, and rotate sensitive credentials.\u003c/p\u003e\n"}]</script>
