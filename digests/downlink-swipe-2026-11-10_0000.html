<script type="application/json" id="dl-articles">[{"n":36,"title":"Google Issues Chrome Security Update for Eighth Actively Exploited Zero-Day of 2026","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/google-issues-chrome-security-update.html","time":"06:52","priority":"MUST READ","score":98,"tldr":"Google released Chrome updates to fix nine flaws, including CVE-2026-125350, a high-severity XML use-after-free vulnerability actively exploited in the wild. Users should update Chrome immediately, and Chromium-based browser users should apply equivalent patches when available.","briefOverview":"\u003cp\u003eGoogle released Chrome updates to address nine security vulnerabilities, including CVE-2026-125350, a high-severity flaw that has been actively exploited in the wild. The issue is a use-after-free bug in Chrome\u0026rsquo;s XML component, meaning the software may try to use a memory location after it has been released. Such flaws can result in data corruption, browser crashes, or arbitrary code execution. An anonymous researcher reported the issue to Google on November 6, 2026.\u003c/p\u003e\n\n\u003cp\u003eGoogle said it is aware of an in-the-wild exploit but did not disclose how the flaw is being abused or who is responsible. The company may restrict bug details until most users have updated, particularly when third-party software dependencies remain unpatched. This update marks the eighth actively exploited Chrome zero-day Google has fixed since the start of 2026. Users should update Chrome to version 157.0.8103.50/.51 on Windows and macOS or 157.0.8103.50 on Linux, while users of other Chromium-based browsers should apply corresponding fixes when available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released Chrome updates that patch nine security vulnerabilities, including CVE-2026-125350, which is being actively exploited in the wild.","CVE-2026-125350 is a high-severity use-after-free flaw in Chrome's XML component that could lead to data corruption, browser crashes, or arbitrary code execution.","Google credited an anonymous researcher with reporting CVE-2026-125350 on November 6, 2026, but did not disclose details about real-world abuse or the parties responsible.","The latest update brings Google’s total number of actively exploited Chrome zero-days patched in 2026 to eight.","Google recommends updating Chrome to version 157.0.8103.50 or .51 on Windows and macOS, or 157.0.8103.50 on Linux, while users of other Chromium-based browsers should install corresponding fixes when available."],"insights":["This is the eighth Chrome zero-day confirmed as actively exploited and patched by Google in 2026, highlighting an unusually sustained need for prompt browser updates during the year.","Google is withholding technical details and related links until most users have received the fix, a measure intended to limit further abuse while updates are deployed.","The issue may also affect Chromium-based browsers such as Microsoft Edge, Brave, Opera, and Vivaldi, so Chrome’s patch does not by itself protect users of those alternatives."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_018223192.html","publisher":"google","context":"Google's Chrome Releases advisory announces the desktop updates that patch the vulnerabilities discussed in the article.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released Chrome updates to address nine security vulnerabilities, including CVE-2026-125350, a high-severity flaw that has been actively exploited in the wild. The issue is a use-after-free bug in Chrome\u0026rsquo;s XML component, meaning the software may try to use a memory location after it has been released. Such flaws can result in data corruption, browser crashes, or arbitrary code execution. An anonymous researcher reported the issue to Google on November 6, 2026.\u003c/p\u003e\n\n\u003cp\u003eGoogle said it is aware of an in-the-wild exploit but did not disclose how the flaw is being abused or who is responsible. The company may restrict bug details until most users have updated, particularly when third-party software dependencies remain unpatched. This update marks the eighth actively exploited Chrome zero-day Google has fixed since the start of 2026. Users should update Chrome to version 157.0.8103.50/.51 on Windows and macOS or 157.0.8103.50 on Linux, while users of other Chromium-based browsers should apply corresponding fixes when available.\u003c/p\u003e\n"},{"n":21,"title":"N-able Takes N-central Cloud Offline After Researcher Discloses 33 Zero-Days with PoC Exploits","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/n-able-takes-hosted-n-central-offline.html","time":"06:44","priority":"MUST READ","score":97,"tldr":"N-able took its hosted N-central service offline and urged on-premises customers to shut down servers after 33 Able2Shell zero-days with public proof-of-concept exploits were disclosed. The flaws can enable credential theft, administrator creation, and root-level remote code execution, and scanning and attempted exploitation have already been observed.","briefOverview":"\u003cp\u003eN-able temporarily took its hosted N-central environments offline and urged on-premises customers to shut down their servers after the public disclosure of more than 30 zero-day vulnerabilities collectively called Able2Shell. The disruption affects hosted and on-premises N-central services in the Americas, APAC, and Europe. N-able said Ecoverse services available through N-able Login, including Asset View, patching, vulnerability management, scripting, policies, and tagging, remained online.\u003c/p\u003e\n\n\u003cp\u003eIndependent researcher Sean Bales released proof-of-concept exploits for issues tested against N-able N-central Appliance 2026.4.0.31. The flaws include credential disclosure, arbitrary file writes, directory traversal, cross-site scripting, XML external entity injection, and remote code execution, with possible outcomes including rogue administrator access and root-level command execution. WatchTowr and Defused Cyber reported exploitation attempts and probing following publication of the code, while N-able said it had observed related scanning but had no evidence of successful exploitation in customer environments and was validating a fixed version for deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able temporarily took its hosted N-central environments offline and urged on-premises customers to shut down their servers after the public disclosure of more than 30 Able2Shell zero-day flaws.","Independent researcher Sean Bales disclosed the flaws with proof-of-concept exploits, reporting that they were tested against N-able N-central Appliance 2026.4.0.31.","The disclosed issues include credential disclosure, file-writing, directory-traversal, cross-site scripting, XML external entity injection, and remote code execution flaws that can enable administrator access and root-level command execution.","WatchTowr and Defused Cyber reported observed exploitation attempts and probing activity following the disclosure, while N-able said it had seen scanning associated with the published proof-of-concept code.","N-able said it had not found evidence of successful exploitation in customer environments and was working to validate a fixed version for deployment."],"insights":["Public proof-of-concept code was followed quickly by observed probing and exploitation attempts, including anonymous agent sessions, appliance-configuration retrieval, and unauthenticated access attempts against a remote-control endpoint.","The flaws are not limited to one attack path: the disclosed chains include misuse of XML processing and trust relationships, theft of support tokens, execution of unsigned NSP files, and a native GenericTCP stack overflow that can lead to root-level command execution.","Although hosted N-central was taken offline, N-able stated that Ecoverse services accessed through N-able Login, including Asset View, patching, vulnerability management, scripting, policies, and tagging, remained online.","N-able distinguished between observed scanning tied to the published proof-of-concept code and confirmed compromise, stating that it had not found evidence of successful exploitation in customer environments."],"referencedReports":[{"title":"Able2Shell N-central Zero-Day Vulnerability Repository","url":"https://github.com/Oracle-Security/CVEs/tree/main/0-Days/N-Central%20N-Able","publisher":"Sean Bales / Oracle-Security","context":"The article cites this repository as the researcher’s disclosure of multiple N-able N-central flaws with proof-of-concept exploits.","category":"research","primary":true}],"body":"\u003cp\u003eN-able temporarily took its hosted N-central environments offline and urged on-premises customers to shut down their servers after the public disclosure of more than 30 zero-day vulnerabilities collectively called Able2Shell. The disruption affects hosted and on-premises N-central services in the Americas, APAC, and Europe. N-able said Ecoverse services available through N-able Login, including Asset View, patching, vulnerability management, scripting, policies, and tagging, remained online.\u003c/p\u003e\n\n\u003cp\u003eIndependent researcher Sean Bales released proof-of-concept exploits for issues tested against N-able N-central Appliance 2026.4.0.31. The flaws include credential disclosure, arbitrary file writes, directory traversal, cross-site scripting, XML external entity injection, and remote code execution, with possible outcomes including rogue administrator access and root-level command execution. WatchTowr and Defused Cyber reported exploitation attempts and probing following publication of the code, while N-able said it had observed related scanning but had no evidence of successful exploitation in customer environments and was validating a fixed version for deployment.\u003c/p\u003e\n"},{"n":27,"title":"Hackers Exploit Critical Xen Orchestra Auth Bypass Flaw to Gain Admin Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-xen-orchestra.html","time":"18:12","priority":"MUST READ","score":97,"tldr":"Vates VMS warns that attackers are actively exploiting a critical Xen Orchestra authentication-bypass flaw to gain administrator access and potentially take over XCP-ng hosts as root. Organizations should urgently update to the fixed Xen Orchestra/xo-server releases and investigate for listed indicators of compromise.","briefOverview":"\u003cp\u003eVates VMS has warned that attackers are actively exploiting a critical Xen Orchestra authentication-bypass vulnerability tracked as VSA-2026-062. The flaw has no CVE identifier yet. It can allow an unauthenticated attacker to obtain administrator-level access and perform arbitrary actions.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because a specially crafted REST cookie, \u003ccode\u003eauthenticationToken=j:%7B%7D\u003c/code\u003e, is parsed as an empty object and used in an unfiltered authentication-token lookup. If the selected token is unexpired, the attacker is authenticated as that token’s owner, and an endpoint can return reusable login token IDs. Vates said this can lead to arbitrary code execution on managed pools and full root-level takeover of XCP-ng nodes.\u003c/p\u003e\n\n\u003cp\u003eThe company released fixes in Xen Orchestra 6.9.1 and 6.10.0, as well as xo-server 5.211.2 and 5.213.1. Reported indicators include requests containing the crafted token value, a virtual machine named \u003ccode\u003epivot2\u003c/code\u003e, certain VM serial settings, and suspicious cron or hidden files. Organizations that cannot patch immediately are advised to avoid exposing Xen Orchestra to the internet, block the cited IP address and Tor domain, filter the empty token pattern, and rotate passwords and secrets if compromise indicators are found.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Vates VMS warned that a critical Xen Orchestra authentication-bypass flaw, tracked as VSA-2026-062, is being actively exploited in the wild.","The flaw allows specially crafted authentication cookies to be treated as an unfiltered token lookup, potentially authenticating an attacker as the owner of a valid token.","An attacker can use the issue to perform actions with administrator privileges, potentially execute code on managed pools, and take over an XCP-ng node as root.","Vates VMS fixed the issue in Xen Orchestra 6.9.1 and 6.10.0 and in xo-server versions 5.211.2 and 5.213.1.","Reported indicators of compromise include requests containing authenticationToken=j:%7B%7D or authenticationToken=j:{}, a virtual machine named pivot2, and suspicious cron files or files named .ustar5 and .ustar6."],"insights":["A cookie value that decodes to an empty object can cause Xen Orchestra to select the first unexpired authentication token rather than require a valid token string.","After bypassing sign-in, the affected users/me authentication-tokens endpoint can expose reusable login token IDs, allowing continued access beyond the initial crafted request.","Organizations unable to patch immediately can reduce exposure by removing Xen Orchestra from the public internet or blocking the empty-token pattern at a web application firewall or reverse proxy.","The reported activity includes configuration of virtual machines with the \"hvm_serial: file\" parameter, in addition to suspicious cron entries and files."],"referencedReports":[{"title":"Vates Security Advisory VSA-2026-062","url":"https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/","publisher":"vates-vms","context":"Vates VMS issued this advisory warning that the Xen Orchestra authentication-bypass flaw is being actively exploited and providing affected versions, indicators, and mitigations.","category":"advisory","primary":true}],"body":"\u003cp\u003eVates VMS has warned that attackers are actively exploiting a critical Xen Orchestra authentication-bypass vulnerability tracked as VSA-2026-062. The flaw has no CVE identifier yet. It can allow an unauthenticated attacker to obtain administrator-level access and perform arbitrary actions.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because a specially crafted REST cookie, \u003ccode\u003eauthenticationToken=j:%7B%7D\u003c/code\u003e, is parsed as an empty object and used in an unfiltered authentication-token lookup. If the selected token is unexpired, the attacker is authenticated as that token’s owner, and an endpoint can return reusable login token IDs. Vates said this can lead to arbitrary code execution on managed pools and full root-level takeover of XCP-ng nodes.\u003c/p\u003e\n\n\u003cp\u003eThe company released fixes in Xen Orchestra 6.9.1 and 6.10.0, as well as xo-server 5.211.2 and 5.213.1. Reported indicators include requests containing the crafted token value, a virtual machine named \u003ccode\u003epivot2\u003c/code\u003e, certain VM serial settings, and suspicious cron or hidden files. Organizations that cannot patch immediately are advised to avoid exposing Xen Orchestra to the internet, block the cited IP address and Tor domain, filter the empty token pattern, and rotate passwords and secrets if compromise indicators are found.\u003c/p\u003e\n"},{"n":5,"title":"Google patches eighth Chrome zero-day exploited in attacks this year","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-patches-eighth-chrome-zero-day-exploited-in-attacks-this-year/","time":"08:51","priority":"MUST READ","score":96,"tldr":"Google released emergency Chrome updates for CVE-2026-125350, a high-severity use-after-free flaw in the browser’s XML component that is already being exploited in the wild. Users should update Chrome immediately, as this is the eighth actively exploited Chrome zero-day patched by Google in 2026.","briefOverview":"\u003cp\u003eGoogle released emergency Chrome security updates for CVE-2026-125350, a high-severity flaw in the browser\u0026rsquo;s XML component that is being exploited in the wild. The issue is a use-after-free weakness, in which Chrome\u0026rsquo;s XML parser deletes an object from memory but does not clear the reference to it. An attacker could exploit the resulting memory corruption when the browser later accesses that freed memory, potentially manipulating memory and running malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe fixes are rolling out through Chrome\u0026rsquo;s Stable Desktop channel for Windows, macOS versions 157.0.8103.50/.51, and Linux version 157.0.8103.50. Google said distribution could take days or weeks, but the update was available when BleepingComputer checked, and Chrome can also install it automatically after the next launch. This is the eighth Chrome zero-day patched in 2026 after evidence that attackers were actively exploiting it, following earlier flaws affecting components including V8, Skia, Dawn, and CSS font features.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released emergency Chrome security updates for CVE-2026-125350, a high-severity use-after-free flaw in Chrome’s XML component that is being exploited in the wild.","Google said it is restricting bug details and links until most users have received the fix, and may retain restrictions when an affected third-party library remains unpatched in other projects.","The fixes are rolling out through Chrome’s Stable Desktop channel for Windows, macOS versions 157.0.8103.50/.51, and Linux version 157.0.8103.50.","CVE-2026-125350 is the eighth Chrome zero-day Google has patched in 2026 after evidence of active exploitation.","Chrome can install the update automatically after the browser is next launched, or users can manually check for updates."],"insights":["The update was available immediately when BleepingComputer checked, even though Google said the wider rollout could take days or weeks, so users can manually check rather than wait for the automatic rollout.","This year’s actively exploited Chrome flaws have affected several distinct browser components, including XML processing, CSS font features, graphics rendering, WebGPU, and the V8 JavaScript engine.","Google is withholding technical details about the flaw while users update, a measure it says may also remain in place if an affected third-party library is still unpatched elsewhere.","Chrome users can receive the fix without manually downloading anything because the browser is designed to install updates after its next launch."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_018223192.html","publisher":"Google","context":"The article cites Google's Monday security advisory as the source confirming that an exploit for CVE-2026-125350 exists in the wild.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released emergency Chrome security updates for CVE-2026-125350, a high-severity flaw in the browser\u0026rsquo;s XML component that is being exploited in the wild. The issue is a use-after-free weakness, in which Chrome\u0026rsquo;s XML parser deletes an object from memory but does not clear the reference to it. An attacker could exploit the resulting memory corruption when the browser later accesses that freed memory, potentially manipulating memory and running malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe fixes are rolling out through Chrome\u0026rsquo;s Stable Desktop channel for Windows, macOS versions 157.0.8103.50/.51, and Linux version 157.0.8103.50. Google said distribution could take days or weeks, but the update was available when BleepingComputer checked, and Chrome can also install it automatically after the next launch. This is the eighth Chrome zero-day patched in 2026 after evidence that attackers were actively exploiting it, following earlier flaws affecting components including V8, Skia, Dawn, and CSS font features.\u003c/p\u003e\n"},{"n":6,"title":"Hackers now exploit critical Barracuda ESG flaws to gain root access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-barracuda-email-security-gateway-flaws-to-get-root-access/","time":"10:10","priority":"MUST READ","score":96,"tldr":"Barracuda warns that attackers are actively exploiting two recently patched flaws in its Email Security Gateway, which can be chained to bypass authorization and execute commands as root. Organizations should immediately apply patches and restrict Admin UI access to trusted internal networks.","briefOverview":"\u003cp\u003eBarracuda Networks warned that attackers are actively exploiting two recently patched vulnerabilities in its Email Security Gateway (ESG) appliances: CVE-2026-116606 and CVE-2026-111560. Barracuda said it has identified exploitation activity affecting a small number of organizations. The company urged customers to apply the relevant patches immediately and recommended enabling automatic patching where it has been disabled.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-116606 is an authentication weakness that can let an attacker alter an appliance’s global configuration, while CVE-2026-111560 allows unauthenticated operating-system command injection with root privileges. Barracuda said attacks require access to the affected device’s administrative interface, and that using the flaws together can bypass authorization controls and give an attacker root access. The command-injection issue also affects Barracuda Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway products, while the ESG is affected by both flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Barracuda warned that attackers are exploiting CVE-2026-116606 and CVE-2026-111560, two recently patched flaws affecting its Email Security Gateway products.","CVE-2026-116606 can allow modification of an appliance's global configuration, while CVE-2026-111560 allows unauthenticated OS command injection with root privileges.","Barracuda said successful exploitation requires access to an affected device's administrative interface, and chaining the flaws can bypass authorization controls and provide root access.","The company identified exploitation affecting a small number of organizations and urged customers to apply patches immediately or enable automatic patching.","CVE-2026-111560 also affects Barracuda Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway products."],"insights":["The risk is especially severe when the two flaws are used together, because one can bypass authorization controls while the other enables commands to run with the device's highest level of access.","Although the main Email Security Gateway is affected by both flaws, several other Barracuda products are affected only by the command-injection flaw, making patching relevant beyond email-security appliances.","Barracuda said exploitation requires access to the administrative interface, so limiting that interface to trusted internal networks is a stated mitigation alongside installing patches.","Barracuda's warning follows prior zero-day campaigns against its Email Security Gateway, including activity that the company said lasted at least seven months and involved data theft from compromised devices."],"referencedReports":[{"title":"Pre-authentication Authorization Bypass \u0026 Command Injection","url":"https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection","publisher":"barracuda-networks","context":"Barracuda's security advisory states that exploitation has affected a small number of organizations and urges customers to apply patches.","category":"advisory","primary":true}],"body":"\u003cp\u003eBarracuda Networks warned that attackers are actively exploiting two recently patched vulnerabilities in its Email Security Gateway (ESG) appliances: CVE-2026-116606 and CVE-2026-111560. Barracuda said it has identified exploitation activity affecting a small number of organizations. The company urged customers to apply the relevant patches immediately and recommended enabling automatic patching where it has been disabled.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-116606 is an authentication weakness that can let an attacker alter an appliance’s global configuration, while CVE-2026-111560 allows unauthenticated operating-system command injection with root privileges. Barracuda said attacks require access to the affected device’s administrative interface, and that using the flaws together can bypass authorization controls and give an attacker root access. The command-injection issue also affects Barracuda Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall, and Web Security Gateway products, while the ESG is affected by both flaws.\u003c/p\u003e\n"},{"n":8,"title":"Critical Xen Orchestra auth bypass flaw exploited to hijack VM servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/","time":"16:17","priority":"MUST READ","score":96,"tldr":"A critical Xen Orchestra authentication bypass flaw, VSA-2026-062, is being actively exploited to gain admin access and potentially take over XCP-ng hosts as root. Organizations should immediately update to Xen Orchestra 6.9.1 or 6.10.0 and investigate known indicators of compromise.","briefOverview":"\u003cp\u003eVates has warned that a critical Xen Orchestra authentication bypass flaw, tracked as VSA-2026-062, is being actively exploited. The issue affects Xen Orchestra and the Xen Orchestra Appliance, which are used to manage XCP-ng virtual machines, hosts, and pools. An attacker with network access to the management interface can bypass authentication and gain administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eThe flaw involves sending a specially crafted \u003ccode\u003eauthenticationToken=j:%7B%7D\u003c/code\u003e cookie containing an empty JSON object, causing Xen Orchestra to retrieve an existing authentication token and log the attacker in as its owner. Attackers can then obtain reusable login token IDs through the \u003ccode\u003e/rest/v0/users/me/authentication_tokens\u003c/code\u003e API endpoint, and a compromise can lead to arbitrary code execution on managed pools and root-level takeover of XCP-ng nodes. Vates released patched Xen Orchestra versions 6.9.1 and 6.10.0, advises immediate updates, and provided indicators including suspicious cookies, connections, VM settings, and files associated with a known campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Vates says the critical Xen Orchestra authentication bypass vulnerability VSA-2026-062 is being actively exploited.","Remote attackers with network access to the Xen Orchestra management interface can use a specially crafted authentication cookie containing an empty JSON object to log in as an existing token owner without credentials.","A successful compromise can grant administrator privileges, enable arbitrary code execution on managed pools, and lead to root-level takeover of XCP-ng nodes.","Vates released Xen Orchestra 6.9.1 and 6.10.0 with patched xo-server packages 5.211.2 and 5.213.1.","Vates recommends administrators update immediately, restrict access to dedicated management networks if they cannot update, and rotate virtualization-environment passwords and secrets if they suspect compromise."],"insights":["The crafted authentication cookie can cause Xen Orchestra to retrieve an existing authentication token and log an attacker in as that token’s owner, rather than merely bypassing a single login check.","After gaining access, an attacker can retrieve reusable login token IDs from the users/me authentication_tokens API endpoint, enabling continued access.","The malicious-cookie activity does not create identifying log entries, so Vates says it must be detected through HTTP monitoring rather than relying on standard host logs.","Vates identified unusual VM serial-port settings and specific cron and hidden files as host-level signs of the known campaign, but cautioned that these indicators may not apply to other attackers."],"referencedReports":[{"title":"Vates Security Advisory VSA-2026-062","url":"https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/","publisher":"vates","context":"The article cites Vates' security advisory for the authentication-cookie flaw, its impact, patches, and indicators of compromise.","category":"advisory","primary":true}],"body":"\u003cp\u003eVates has warned that a critical Xen Orchestra authentication bypass flaw, tracked as VSA-2026-062, is being actively exploited. The issue affects Xen Orchestra and the Xen Orchestra Appliance, which are used to manage XCP-ng virtual machines, hosts, and pools. An attacker with network access to the management interface can bypass authentication and gain administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eThe flaw involves sending a specially crafted \u003ccode\u003eauthenticationToken=j:%7B%7D\u003c/code\u003e cookie containing an empty JSON object, causing Xen Orchestra to retrieve an existing authentication token and log the attacker in as its owner. Attackers can then obtain reusable login token IDs through the \u003ccode\u003e/rest/v0/users/me/authentication_tokens\u003c/code\u003e API endpoint, and a compromise can lead to arbitrary code execution on managed pools and root-level takeover of XCP-ng nodes. Vates released patched Xen Orchestra versions 6.9.1 and 6.10.0, advises immediate updates, and provided indicators including suspicious cookies, connections, VM settings, and files associated with a known campaign.\u003c/p\u003e\n"},{"n":14,"title":"Microsoft November 2026 Patch Tuesday fixes 1,235 flaws, Outlook zero-day","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/","time":"19:07","priority":"MUST READ","score":96,"tldr":"Microsoft’s November 2026 Patch Tuesday fixes a record 1,235 vulnerabilities, including an actively exploited Outlook zero-day (CVE-2026-124194) that can leak NTLM authentication hashes through a malicious message file. Organizations should prioritize deploying the Outlook, Windows, Office, and other Microsoft security updates.","briefOverview":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday delivered security updates for 1,235 vulnerabilities, including 66 rated Critical. The fixes include 536 elevation-of-privilege issues, 296 remote-code-execution issues, 157 information-disclosure issues, and 142 Microsoft Edge issues. About 639 of the vulnerabilities affect Windows or Microsoft Windows products and components. The reported total excludes 108 flaws Microsoft fixed earlier in November.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft patched one actively exploited zero-day: CVE-2026-124194, a Microsoft Outlook spoofing vulnerability. An unauthenticated attacker could send a specially crafted message file and persuade a user to open it, causing Outlook to connect to an attacker-controlled network location without its usual external-content warning. That connection could disclose authentication information, including an NTLMv2 account hash, which an attacker may capture and potentially crack offline. Recovered credentials could then be used to gain unauthorized access to corporate accounts.\u003c/p\u003e\n\n\u003cp\u003eThe November release follows October’s record-breaking 1,411 fixes, with the article stating that Microsoft continues to use AI to find and patch vulnerabilities. Critical issues addressed this month include remote-code-execution, elevation-of-privilege, and Microsoft Edge use-after-free flaws. The article also notes security updates or advisories from vendors including Barracuda Networks, Cisco, Google, Ivanti, SAP, SonicWall, Vates, and Zyxel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s November 2026 Patch Tuesday addressed 1,235 vulnerabilities, including 66 rated Critical and approximately 639 affecting Windows or Microsoft Windows components.","The updates fix CVE-2026-124194, an actively exploited Microsoft Outlook spoofing flaw that can expose NTLM account hashes when a user opens a specially crafted message file.","Microsoft said the Outlook flaw can cause Outlook to connect to an attacker-controlled network location without the normal external-content warning, potentially disclosing authentication information.","The Patch Tuesday total excludes 108 flaws Microsoft fixed earlier in November, including one Entra Device Registration flaw, 82 Mariner flaws, and 25 Microsoft Edge flaws.","The vulnerability categories include 536 elevation-of-privilege flaws, 296 remote-code-execution flaws, 157 information-disclosure flaws, and 142 Microsoft Edge flaws."],"insights":["The reported 1,235 total is limited to vulnerabilities released on Patch Tuesday itself; including 108 fixes issued earlier in November would produce a substantially larger monthly remediation workload.","Although CVE-2026-124194 is rated Moderate, it was actively exploited and can expose NTLMv2 authentication hashes, showing that real-world urgency is not determined by severity labels alone.","Elevation-of-privilege issues account for the largest share of the updates at 536, exceeding the 296 remote-code-execution flaws.","November followed October’s then-record 1,411 fixes, and the article attributes the unusually high volumes to Microsoft’s increasing use of AI to find and patch vulnerabilities."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday delivered security updates for 1,235 vulnerabilities, including 66 rated Critical. The fixes include 536 elevation-of-privilege issues, 296 remote-code-execution issues, 157 information-disclosure issues, and 142 Microsoft Edge issues. About 639 of the vulnerabilities affect Windows or Microsoft Windows products and components. The reported total excludes 108 flaws Microsoft fixed earlier in November.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft patched one actively exploited zero-day: CVE-2026-124194, a Microsoft Outlook spoofing vulnerability. An unauthenticated attacker could send a specially crafted message file and persuade a user to open it, causing Outlook to connect to an attacker-controlled network location without its usual external-content warning. That connection could disclose authentication information, including an NTLMv2 account hash, which an attacker may capture and potentially crack offline. Recovered credentials could then be used to gain unauthorized access to corporate accounts.\u003c/p\u003e\n\n\u003cp\u003eThe November release follows October’s record-breaking 1,411 fixes, with the article stating that Microsoft continues to use AI to find and patch vulnerabilities. Critical issues addressed this month include remote-code-execution, elevation-of-privilege, and Microsoft Edge use-after-free flaws. The article also notes security updates or advisories from vendors including Barracuda Networks, Cisco, Google, Ivanti, SAP, SonicWall, Vates, and Zyxel.\u003c/p\u003e\n"},{"n":32,"title":"CISA Warns of Active Exploitation of OpenSSH, GPUStack, FreeSWITCH, and IBM Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","time":"06:31","priority":"MUST READ","score":96,"tldr":"CISA added critical flaws in OpenSSH, GPUStack, FreeSWITCH, and IBM Aspera Faspex to its KEV catalog after evidence of active exploitation. Organizations should urgently apply available patches, particularly for OpenSSH’s SSHole authentication-bypass flaw, which attackers are using for reconnaissance, persistence, botnet activity, and cryptomining.","briefOverview":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog. The flaws include authorization bypass, code injection, authentication bypass, and improper authentication issues, with CVSS scores ranging from 8.1 to 9.8. U.S. Federal Civilian Executive Branch agencies are recommended to apply fixes by November 12, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe OpenSSH issue, CVE-2026-123158 or SSHole, has faced exploitation attempts since November 6, 2026, and GreyNoise identified confirmed post-exploitation activity from six source IP addresses across 18 attack chains. Observed activity included reconnaissance, cloud metadata queries, attempts to obtain password hashes and root SSH keys, and changes to SSH authorized_keys files for persistent access. Attackers were also seen deploying TAC Agent, while watchTowr reported the flaw being used for botnet and cryptocurrency-mining activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog.","The OpenSSH flaw, CVE-2026-123158 or SSHole, is an authentication-bypass issue on Linux that was fixed in November 2026 and has faced exploitation attempts since November 6, 2026.","GreyNoise reported confirmed post-exploitation activity from six source IP addresses involving reconnaissance, cloud metadata queries, attempts to read password hashes and root SSH keys, and modification of SSH authorized_keys files.","Attackers were observed deploying TAC Agent, a Python-based remote-control tool that can execute shell commands, perform system reconnaissance, enumerate directories, transfer files, and update itself.","Federal Civilian Executive Branch agencies are recommended to apply fixes for the four vulnerabilities by November 12, 2026."],"insights":["The OpenSSH SSHole flaw was added to CISA’s catalog shortly after exploitation attempts began, with the article reporting activity from November 6 and a first GreyNoise honeypot observation on November 7.","Although Defused Cyber described SSHole activity as limited rather than widespread, GreyNoise had already confirmed 18 distinct post-exploitation attack chains from six source IP addresses.","Observed SSHole activity progressed beyond attempted access to persistence and credential collection, including changes to SSH authorized_keys files and attempts to obtain password hashes and root SSH keys.","GPUStack’s flaw can expose worker and cloud-provider secrets while also allowing persistent administrator API-key creation and code execution, creating several forms of lasting control from one issue.","The article reports active exploitation of all four flaws but provides public exploitation details only for OpenSSH and GPUStack, leaving the methods and scale affecting IBM Aspera Faspex and FreeSWITCH unknown."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's alert announced the addition of four actively exploited flaws to its Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"GHSA-gj9m-f8ph-pmhr","url":"https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr","publisher":"gpustack","context":"GPUStack's advisory describes CVE-2026-102895 and notes that active in-the-wild exploitation was reported.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog. The flaws include authorization bypass, code injection, authentication bypass, and improper authentication issues, with CVSS scores ranging from 8.1 to 9.8. U.S. Federal Civilian Executive Branch agencies are recommended to apply fixes by November 12, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe OpenSSH issue, CVE-2026-123158 or SSHole, has faced exploitation attempts since November 6, 2026, and GreyNoise identified confirmed post-exploitation activity from six source IP addresses across 18 attack chains. Observed activity included reconnaissance, cloud metadata queries, attempts to obtain password hashes and root SSH keys, and changes to SSH authorized_keys files for persistent access. Attackers were also seen deploying TAC Agent, while watchTowr reported the flaw being used for botnet and cryptocurrency-mining activity.\u003c/p\u003e\n"},{"n":16,"title":"Microsoft’s Patch Tuesday surpasses 1,000 bugs for second month in a row","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/patch-tuesday-microsoft-1000-bugs-again","time":"20:55","priority":"MUST READ","score":95,"tldr":"Microsoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday, including an actively exploited Outlook flaw (CVE-2026-124194) that can expose authentication information through a crafted message file. CISA ordered federal agencies to patch it by month-end, while also flagging exploited Barracuda bugs and prompting N-able to take hosted N-central environments offline over newly disclosed flaws.","briefOverview":"\u003cp\u003eMicrosoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, marking the second consecutive month with more than 1,000 bugs disclosed. One Outlook vulnerability, CVE-2026-124194, is being exploited in the wild, while 63 of the disclosed vulnerabilities were rated critical. Tenable’s Satnam Narang said Microsoft had disclosed more than 5,160 vulnerabilities in 2026 by this release, a total that would far surpass any previous year.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said an attacker could send a specially crafted message file that, when opened in an affected Outlook version, causes the application to connect to an attacker-controlled network location without the normal external-content warning. This could disclose authentication information that might be used to impersonate the user, and CISA gave federal agencies until the end of the month to patch the flaw. CISA also ordered agencies to address two exploited Barracuda email-security bugs and investigate possible compromises, while N-able took hosted N-central environments offline after more than 30 serious vulnerabilities were disclosed and proof-of-concept scanning activity was observed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, including 63 rated critical.","Microsoft said CVE-2026-124194, an Outlook vulnerability with a severity score of 6.5, is being exploited in the wild.","A crafted message file can cause affected Outlook versions to connect to an attacker-controlled network location without the usual warning, potentially disclosing authentication information.","CISA added CVE-2026-124194 to its Known Exploited Vulnerabilities catalog and gave federal agencies until the end of the month to patch it.","N-able took hosted N-central environments offline and told customers to turn off their servers after more than 30 serious vulnerabilities in N-Central were disclosed."],"insights":["Despite 63 critical Microsoft vulnerabilities in this release, experts identified CVE-2026-124194 as the only one reported as actively exploited.","Microsoft’s 2026 vulnerability total had already exceeded 5,160 by this release, which Tenable’s Satnam Narang said would far surpass any previous year.","Microsoft credited researcher Benoît Sevens with finding the exploited Outlook flaw using Anthropic’s Claude.","N-able reported scanning activity tied to published proof-of-concept code for N-Central flaws, but said it had no evidence that a customer environment had been successfully exploited."],"referencedReports":[{"title":"CVE-2026-124194","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-124194","publisher":"microsoft","context":"Microsoft’s security update entry describes the actively exploited Outlook flaw discussed in the article.","category":"advisory","primary":true},{"title":"Pre-authentication authorization bypass command injection","url":"https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection","publisher":"barracuda","context":"The article links Barracuda’s security advisory while reporting that CISA ordered federal agencies to address two exploited flaws affecting its email security product.","category":"advisory","primary":false},{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"ivanti","context":"The article links Ivanti’s security advisory as one of several vendor patch disclosures released alongside Microsoft’s Patch Tuesday.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, marking the second consecutive month with more than 1,000 bugs disclosed. One Outlook vulnerability, CVE-2026-124194, is being exploited in the wild, while 63 of the disclosed vulnerabilities were rated critical. Tenable’s Satnam Narang said Microsoft had disclosed more than 5,160 vulnerabilities in 2026 by this release, a total that would far surpass any previous year.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said an attacker could send a specially crafted message file that, when opened in an affected Outlook version, causes the application to connect to an attacker-controlled network location without the normal external-content warning. This could disclose authentication information that might be used to impersonate the user, and CISA gave federal agencies until the end of the month to patch the flaw. CISA also ordered agencies to address two exploited Barracuda email-security bugs and investigate possible compromises, while N-able took hosted N-central environments offline after more than 30 serious vulnerabilities were disclosed and proof-of-concept scanning activity was observed.\u003c/p\u003e\n"},{"n":4,"title":"SAP patches ICM2SHELL and PROXYGATE maximum severity flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-patches-four-maximum-severity-security-vulnerabilities/","time":"12:07","priority":"MUST READ","score":94,"tldr":"SAP’s November 2026 updates fix four CVSS 10.0 flaws in NetWeaver, Web Dispatcher, and Gateway that could let unauthenticated remote attackers fully compromise SAP systems. Organizations should urgently apply patches for the ICM2SHELL and PROXYGATE issues.","briefOverview":"\u003cp\u003eSAP’s November 2026 security updates address 35 vulnerabilities, including four maximum-severity flaws in NetWeaver Application Server ABAP, Web Dispatcher, and Gateway. SAP rated CVE-2026-76964, CVE-2026-120017, CVE-2026-89103, and CVE-2026-89126 at 10 out of 10, stating that unauthenticated attackers could remotely fully compromise affected systems. The issues include memory corruption, missing authentication, and broken access control weaknesses.\u003c/p\u003e\n\n\u003cp\u003eOnapsis, which reported three of the flaws, calls CVE-2026-76964 and CVE-2026-89126 ICM2SHELL and calls the CVE-2026-89103 pre-authentication remote-code-execution flaw PROXYGATE. According to Onapsis, ICM2SHELL can turn routine web traffic into an entry point for remote code execution without an SAP user, password, or user interaction, while PROXYGATE can make SAP Gateway treat an external attacker as an internal application server. Successful exploitation could expose business data, undermine transaction integrity, and disrupt critical business applications; CISA has identified 14 SAP flaws as actively exploited since November 2021, including three used by ransomware groups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP’s November 2026 security updates patch 35 vulnerabilities, including four flaws rated 10 out of 10 in NetWeaver, Web Dispatcher, and Gateway software.","The four maximum-severity issues include CVE-2026-76964, CVE-2026-120017, CVE-2026-89103, and CVE-2026-89126, which SAP says unauthenticated attackers can exploit remotely to fully compromise affected systems.","Onapsis calls CVE-2026-76964 and CVE-2026-89126 ICM2SHELL, and identifies CVE-2026-89103 as the pre-authentication remote-code-execution issue PROXYGATE.","SAP Gateway enables external applications to connect to SAP backend systems, while SAP Web Dispatcher is widely deployed as a load balancer and reverse proxy in enterprise SAP environments.","CISA has listed 14 SAP security flaws as actively exploited since November 2021, including three that ransomware groups abused in the wild."],"insights":["The ICM2SHELL issues affect network-facing components that process routine web traffic, making them particularly consequential because exploitation requires no SAP account, password, or user interaction.","PROXYGATE allows an external unauthenticated attacker to impersonate an internal application server to SAP Gateway, potentially gaining control under the account that owns the SAP installation.","The affected Web Dispatcher component is deployed in almost every enterprise SAP environment and serves as both a load balancer and reverse proxy, which broadens the potential relevance of CVE-2026-89126.","These patches continue a recent run of maximum-severity SAP fixes, including an August Commerce Cloud flaw that was reportedly targeted in attacks days after its patch was released.","SAP’s track record of 14 flaws listed by CISA as actively exploited since November 2021, with three abused by ransomware groups, underscores the real-world importance of promptly addressing SAP security updates."],"referencedReports":[{"title":"November 2026 SAP Security Notes","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/november-2026.html?isu_page=1","publisher":"sap","context":"The article cites SAP’s November 2026 security updates as the source for the 35 patched vulnerabilities.","category":"advisory","primary":true},{"title":"ICM2SHELL: CVE-2026-76964 and CVE-2026-89126 SAP NetWeaver and Web Dispatcher Threat Advisory","url":"https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/","publisher":"onapsis","context":"The article references Onapsis’s technical threat advisory for the two flaws collectively tracked as ICM2SHELL.","category":"advisory","primary":false},{"title":"PROXYGATE: CVE-2026-89103 SAP NetWeaver Gateway Threat Advisory","url":"https://onapsis.com/blog/proxygate-cve-2026-89103-sap-netweaver-gateway-threat-advisory/","publisher":"onapsis","context":"The article references Onapsis’s threat advisory describing CVE-2026-89103 as the PROXYGATE pre-authentication remote-code-execution issue.","category":"advisory","primary":false}],"body":"\u003cp\u003eSAP’s November 2026 security updates address 35 vulnerabilities, including four maximum-severity flaws in NetWeaver Application Server ABAP, Web Dispatcher, and Gateway. SAP rated CVE-2026-76964, CVE-2026-120017, CVE-2026-89103, and CVE-2026-89126 at 10 out of 10, stating that unauthenticated attackers could remotely fully compromise affected systems. The issues include memory corruption, missing authentication, and broken access control weaknesses.\u003c/p\u003e\n\n\u003cp\u003eOnapsis, which reported three of the flaws, calls CVE-2026-76964 and CVE-2026-89126 ICM2SHELL and calls the CVE-2026-89103 pre-authentication remote-code-execution flaw PROXYGATE. According to Onapsis, ICM2SHELL can turn routine web traffic into an entry point for remote code execution without an SAP user, password, or user interaction, while PROXYGATE can make SAP Gateway treat an external attacker as an internal application server. Successful exploitation could expose business data, undermine transaction integrity, and disrupt critical business applications; CISA has identified 14 SAP flaws as actively exploited since November 2021, including three used by ransomware groups.\u003c/p\u003e\n"},{"n":37,"title":"France Blames Iran for Sabotage Attack on Refrigeration Controllers at About 700 Retail Sites","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/france-blames-iran-for-sabotage-attack.html","time":"09:08","priority":"MUST READ","score":94,"tldr":"France has attributed an October sabotage campaign against internet-exposed refrigeration controllers at roughly 700 retail sites to the IRGC-linked Shahid Kaveh unit, causing major food losses and about 20 fires. Operators should remove affected Danfoss, Dixell, and Copeland controllers from direct internet exposure and restore access only through secured networks.","briefOverview":"\u003cp\u003eFrance has attributed an October cyberattack affecting refrigeration controllers at about 700 French retail sites to Shahid Kaveh, a cyber unit it links to Iran’s Islamic Revolutionary Guard Corps. The operation caused food losses estimated at several tens of millions of euros and about 20 fires. France called it the first offensive cyber campaign on its soil carried out purely for sabotage. Authorities plan to summon Iran’s ambassador, seek new European sanctions, and pursue international arrest warrants for the unit’s leadership.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly accessed Danfoss and Dixell refrigeration controllers through internet-facing management interfaces, started abnormal defrost cycles without time limits, and disabled temperature safety alerts. Victims included large retailers such as Casino, Leclerc, Carrefour, and Intermarché, along with smaller butcher shops, a slaughterhouse, and food plants. France’s cyber coordination center also linked the campaign’s infrastructure to reconnaissance of Schneider Electric equipment at small energy and water-production sites. CERT-FR advised operators to remove affected controllers from direct internet exposure, review configurations, update firmware, change default passwords, and use secure network access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["France attributed an October cyberattack on refrigeration controllers at about 700 retail sites to Shahid Kaveh, a cyber unit linked to Iran's Islamic Revolutionary Guard Corps.","Attackers remotely accessed Danfoss and Dixell controllers, set unlimited high-temperature defrost cycles, and disabled temperature safety alerts, causing food losses and about 20 fires.","Affected organizations included major French retailers such as Casino, Leclerc, Coopérative U, Metro, Carrefour, and Intermarché, as well as smaller food businesses.","French prosecutors opened an investigation into the unit's leadership and requested international arrest warrants, while France plans to summon Iran's ambassador and seek additional European sanctions.","CERT-FR advised operators to remove exposed refrigeration controllers from the internet, review their configurations, change default passwords, update firmware, and use secure network access instead of public interfaces."],"insights":["The sabotage did not require changing the refrigeration hardware itself: attackers used publicly reachable management pages to alter defrost settings and turn off the alarms intended to warn when temperatures became unsafe.","France described the incident as its first offensive cyber campaign on French soil conducted purely for sabotage, highlighting that the operation was intended to cause physical and economic harm rather than only collect information.","The same infrastructure was used to examine Schneider Electric equipment at small energy and water-production sites, linking the supermarket disruption to interest in other industrial systems.","For unsupported refrigeration controllers, CERT-FR warned that a factory reset removes an intruder’s continued access but does not fix the underlying exposure, making renewed compromise highly likely if the device remains online.","France’s attribution relied on several combined indicators, including the group’s usual scanning tool, Persian-language traces, Iran-linked IP addresses, a propaganda outlet’s early reporting, and an attack method investigators considered typical of the unit."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"C4","context":"The article cites this joint C4 report for details on affected organizations and the indicators used to attribute the campaign to the IRGC-linked Shahid Kaveh unit.","category":"research","primary":true},{"title":"CERTFR-2026-ALE-012","url":"https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012","publisher":"CERT-FR","context":"The article cites this incident alert for affected refrigeration-controller product families and mitigation guidance for operators.","category":"advisory","primary":false}],"body":"\u003cp\u003eFrance has attributed an October cyberattack affecting refrigeration controllers at about 700 French retail sites to Shahid Kaveh, a cyber unit it links to Iran’s Islamic Revolutionary Guard Corps. The operation caused food losses estimated at several tens of millions of euros and about 20 fires. France called it the first offensive cyber campaign on its soil carried out purely for sabotage. Authorities plan to summon Iran’s ambassador, seek new European sanctions, and pursue international arrest warrants for the unit’s leadership.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly accessed Danfoss and Dixell refrigeration controllers through internet-facing management interfaces, started abnormal defrost cycles without time limits, and disabled temperature safety alerts. Victims included large retailers such as Casino, Leclerc, Carrefour, and Intermarché, along with smaller butcher shops, a slaughterhouse, and food plants. France’s cyber coordination center also linked the campaign’s infrastructure to reconnaissance of Schneider Electric equipment at small energy and water-production sites. CERT-FR advised operators to remove affected controllers from direct internet exposure, review configurations, update firmware, change default passwords, and use secure network access.\u003c/p\u003e\n"},{"n":2,"title":"Hackers exploit trusted AWS access to breach multiple cloud environments","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/","time":"19:31","priority":"MUST READ","score":93,"tldr":"Attackers used compromised Qubole AWS IAM credentials to assume trusted cross-account roles at dozens of customer environments, steal secrets, and exfiltrate accessible S3 data. Organizations that granted Qubole access should review CloudTrail activity, revoke sessions, rotate credentials, and tighten or remove unused trust relationships.","briefOverview":"\u003cp\u003eA threat actor used compromised AWS IAM credentials associated with Qubole’s AWS account to access multiple customer AWS environments. The campaign ran between October 14 and 26 and affected tens of companies whose cross-account roles trusted Qubole’s account. Sentra confirmed dozens of victims, and reported that millions of files were stolen from one customer alone.\u003c/p\u003e\n\n\u003cp\u003eThe attackers assumed customer roles, surveyed cloud resources, collected secrets from AWS Secrets Manager and SSM Parameter Store, and read AWS Lambda environment variables. They used TruffleHog to validate discovered AWS keys, Microsoft Entra ID client secrets, and Okta client credentials, then enumerated and downloaded data from accessible Amazon S3 buckets. Potentially affected organizations are advised to review CloudTrail logs from October 1 onward, investigate secret and S3 access, rotate exposed credentials, revoke active role sessions, and restrict or remove unused third-party access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor used compromised IAM credentials for Qubole’s AWS account to access and exfiltrate data from customer AWS environments that trusted the account.","The campaign ran from October 14 to 26 and affected tens of companies, according to the report and Sentra’s confirmation.","The attacker retrieved secrets from AWS Secrets Manager and SSM Parameter Store, read Lambda environment variables, and used TruffleHog to validate discovered credentials.","After assuming trusted roles, the attacker enumerated accessible S3 buckets and downloaded data from all reachable buckets.","Potentially affected administrators are advised to review CloudTrail from October 1, rotate exposed credentials, revoke active role sessions, and restrict or remove unused integrations."],"insights":["The attackers abused customer roles that had been configured to trust Qubole’s AWS account even though the roles were otherwise unused, showing that dormant third-party access can remain a viable entry point.","The data theft was opportunistic: the attacker first checked which S3 buckets each assumed role could access and then downloaded all reachable data rather than targeting identified files.","The attacker collected passwords and keys at a reported rate of 100 secrets in seven minutes, making rapid credential rotation and session revocation particularly important after suspicious activity is found.","The article recommends reviewing CloudTrail records beginning October 1, earlier than the reported October 14–26 campaign window, to identify potentially related access."],"referencedReports":[{"title":"Qubole Cross-Account Access Abused in the Wild","url":"https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild","publisher":"wiz","context":"The article cites Wiz's technical analysis of the compromised Qubole AWS access and the attacker’s role-assumption and S3 data-exfiltration activity.","category":"research","primary":true}],"body":"\u003cp\u003eA threat actor used compromised AWS IAM credentials associated with Qubole’s AWS account to access multiple customer AWS environments. The campaign ran between October 14 and 26 and affected tens of companies whose cross-account roles trusted Qubole’s account. Sentra confirmed dozens of victims, and reported that millions of files were stolen from one customer alone.\u003c/p\u003e\n\n\u003cp\u003eThe attackers assumed customer roles, surveyed cloud resources, collected secrets from AWS Secrets Manager and SSM Parameter Store, and read AWS Lambda environment variables. They used TruffleHog to validate discovered AWS keys, Microsoft Entra ID client secrets, and Okta client credentials, then enumerated and downloaded data from accessible Amazon S3 buckets. Potentially affected organizations are advised to review CloudTrail logs from October 1 onward, investigate secret and S3 access, rotate exposed credentials, revoke active role sessions, and restrict or remove unused third-party access.\u003c/p\u003e\n"},{"n":23,"title":"Attackers Exploit AhsayCBS Flaws to Deploy Sandbox-Evading Python Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-exploit-ahsaycbs-flaws-to.html","time":"16:00","priority":"MUST READ","score":93,"tldr":"Attackers exploited two zero-day AhsayCBS flaws to compromise backup servers, deploying JSP web shells, XMRig miners, tunneling tools, and a host-bound Python backdoor designed to evade sandbox analysis. The intrusion also targeted backup infrastructure for credential theft, including attempts to extract and decrypt Veeam-stored credentials.","briefOverview":"\u003cp\u003eCybersecurity researchers at Huntress reported that attackers exploited two now-patched AhsayCBS vulnerabilities, CVE-2026-105133 and CVE-2026-105134, in early October 2026. The flaw chain allowed authentication bypass and arbitrary command execution on affected systems, and Ahsay Backup released patches in mid-October. Huntress said the vulnerabilities appeared to have been used as zero-days, initially in smash-and-grab activity involving web shells and XMRig cryptocurrency miners. The broader intrusion included multiple web-shell families, two miners, tunneling tools, and legitimate remote-access software.\u003c/p\u003e\n\n\u003cp\u003eA notable payload, a Python backdoor called main.py, was designed to run only on the machine where it was staged. It calculated the SHA-256 hash of the system\u0026rsquo;s MachineGuid, required a marker file with the matching name, and then loaded an embedded x64 DLL in memory to contact creepexplosiondarknight[.]com. The attackers also configured Microsoft Defender exclusions and used GOST, Chisel, AnyDesk, Atera, and Splashtop to maintain access. Huntress found evidence that backup infrastructure was deliberately targeted, including activity on a related Veeam server consistent with querying and decrypting stored backup credentials from the VeeamBackup PostgreSQL database.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress observed attackers exploiting CVE-2026-105133 and CVE-2026-105134 in AhsayCBS in early October 2026 to bypass authentication and run commands on affected systems.","Ahsay Backup released patches for the two AhsayCBS vulnerabilities in mid-October 2026.","The attackers deployed multiple JSP web shells, two XMRig cryptocurrency miners, tunneling tools, and remote-access software including AnyDesk, Atera, and Splashtop.","A Python backdoor named main.py checked the SHA-256 hash of the host MachineGuid against a local marker file before loading an embedded x64 DLL and contacting creepexplosiondarknight[.]com.","On a related Veeam server, Huntress observed a PowerShell command consistent with NetExec's Veeam credential-theft module querying the VeeamBackup PostgreSQL database and decrypting stored credentials with DPAPI."],"insights":["The intrusion went beyond opportunistic cryptocurrency mining: the attacker planted multiple web shells, used two miners with separate wallets and pools, and staged tunneling and remote-access tools for continued access.","The Python implant was tied to a specific machine by requiring a marker file named after the SHA-256 hash of that system's MachineGuid, preventing it from running on other hosts or typical analysis systems.","One JSP web shell concealed encrypted code in PNG image pixel data and was written to run on servlet containers using JDK 6 or later, while posing as an internal image-preview service.","The observed Veeam database query sought credentials protected with Windows DPAPI, highlighting that backup infrastructure can hold credentials for hypervisors, repositories, and domain accounts."],"referencedReports":[{"title":"AhsayCBS Web Shells","url":"https://www.huntress.com/blog/ahsaycbs-webshells","publisher":"huntress","context":"The article cites Huntress' analysis as the source for its observations of the AhsayCBS exploitation campaign and associated tools.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers at Huntress reported that attackers exploited two now-patched AhsayCBS vulnerabilities, CVE-2026-105133 and CVE-2026-105134, in early October 2026. The flaw chain allowed authentication bypass and arbitrary command execution on affected systems, and Ahsay Backup released patches in mid-October. Huntress said the vulnerabilities appeared to have been used as zero-days, initially in smash-and-grab activity involving web shells and XMRig cryptocurrency miners. The broader intrusion included multiple web-shell families, two miners, tunneling tools, and legitimate remote-access software.\u003c/p\u003e\n\n\u003cp\u003eA notable payload, a Python backdoor called main.py, was designed to run only on the machine where it was staged. It calculated the SHA-256 hash of the system\u0026rsquo;s MachineGuid, required a marker file with the matching name, and then loaded an embedded x64 DLL in memory to contact creepexplosiondarknight[.]com. The attackers also configured Microsoft Defender exclusions and used GOST, Chisel, AnyDesk, Atera, and Splashtop to maintain access. Huntress found evidence that backup infrastructure was deliberately targeted, including activity on a related Veeam server consistent with querying and decrypting stored backup credentials from the VeeamBackup PostgreSQL database.\u003c/p\u003e\n"},{"n":24,"title":"SAP Patches Four CVSS 10.0 Flaws, Including Two Enabling Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sap-patches-four-cvss-100-flaws.html","time":"10:02","priority":"MUST READ","score":93,"tldr":"SAP issued urgent patches for four unauthenticated CVSS 10.0 flaws affecting NetWeaver, Web Dispatcher, Gateway, and SAML2 components, including remote code execution and authentication-bypass risks. Organizations should prioritize applying the relevant SAP Notes and restrict exposure of ICM, Web Dispatcher, and Gateway services.","briefOverview":"\u003cp\u003eSAP fixed four vulnerabilities rated CVSS 10.0 during its November Security Patch Day. The flaws affect SAP NetWeaver AS ABAP components, SAP Web Dispatcher, SAP Gateway, and the SAML2 service provider. None requires a user to log in or take action for an attacker to exploit it. SAP strongly recommends applying the relevant security notes as a priority.\u003c/p\u003e\n\n\u003cp\u003eTwo flaws, CVE-2026-76964 in the Internet Communication Manager and CVE-2026-89126 in Web Dispatcher, involve malformed WebSocket traffic that can corrupt memory and potentially let an attacker run code. CVE-2026-120017 can let an attacker sign in as any user, including privileged users, under certain SAML2 configurations where incoming assertions were not checked for signatures. CVE-2026-89103 can let an external attacker be treated as one of the system’s own application servers through SAP Gateway and take unauthorized actions. RedRays advises organizations to patch kernels and all Web Dispatchers together, review SAML2 and Gateway settings, and ensure affected services are not directly exposed where possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released fixes for four unauthenticated vulnerabilities rated CVSS 10.0 in its November Security Patch Day bulletin.","CVE-2026-76964 in SAP NetWeaver AS ABAP's Internet Communication Manager and CVE-2026-89126 in SAP Web Dispatcher can allow remote code execution through crafted network traffic.","CVE-2026-120017 can allow an attacker to log in as any user, including privileged users, on certain affected SAML2 configurations.","CVE-2026-89103 can allow an external attacker to impersonate an SAP application server and take unauthorized actions through SAP Gateway.","SAP and RedRays advise prioritizing the relevant patches, updating kernels and Web Dispatchers together, and limiting direct network access to affected services."],"insights":["Patching a Web Dispatcher can temporarily shield an affected Internet Communication Manager only when no one can directly reach the Internet Communication Manager’s network ports.","Organizations using SAML2 browser logon for services such as Fiori Launchpad or Web GUI should treat their AS ABAP systems as affected until they confirm otherwise, because the article states there is no workaround for the SAML flaw.","For SAP Gateway, the article recommends checking that explicit secinfo and reginfo rules are present and restricting access to the gateway’s 33xx port from user networks and the internet.","RedRays recommends updating SAP kernels and all Web Dispatchers together so that a single rollout covers all 17 kernel and Web Dispatcher fixes issued that month.","Disabling WebSocket support can block the ICM and Web Dispatcher flaws temporarily, but it may disrupt dependent features including ABAP Push Channels and some Fiori functions."],"referencedReports":[{"title":"SAP Security Patch Day – November 2026","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/november-2026.html","publisher":"sap","context":"The article cites SAP's November security bulletin for affected versions and SAP Notes covering the four CVSS 10.0 flaws.","category":"advisory","primary":true},{"title":"SAP Security Patch Day November 2026","url":"https://redrays.io/blog/sap-security-patch-day-november-2026/","publisher":"redrays","context":"The article cites RedRays' Patch Day analysis for guidance on deploying the month's kernel and Web Dispatcher fixes.","category":"research","primary":true},{"title":"SAP Note 3849308: SAML2 Authentication Bypass (CVE-2026-120017)","url":"https://redrays.io/blog/sap-note-3849308-saml2-authentication-bypass-cve-2026-120017/","publisher":"redrays","context":"The article references this analysis for SAML2 exposure assessment and recommended review of trusted identity providers and audit logs.","category":"research","primary":false},{"title":"SAP Note 3798345: SAP Gateway Access Control (CVE-2026-89103)","url":"https://redrays.io/blog/sap-note-3798345-sap-gateway-access-control-cve-2026-89103/","publisher":"redrays","context":"The article references this analysis for SAP Gateway configuration checks and network-access restrictions.","category":"research","primary":false},{"title":"SAP Note 3778530: ICM WebSocket Memory Corruption (CVE-2026-76964)","url":"https://redrays.io/blog/sap-note-3778530-icm-websocket-memory-corruption-cve-2026-76964/","publisher":"redrays","context":"The article references this analysis for details on the ICM WebSocket issue and temporary exposure-reduction options.","category":"research","primary":false},{"title":"SAP Note 3778556: Web Dispatcher WebSocket Memory Corruption (CVE-2026-89126)","url":"https://redrays.io/blog/sap-note-3778556-web-dispatcher-websocket-memory-corruption-cve-2026-89126/","publisher":"redrays","context":"The article references this analysis for affected Web Dispatcher deployments and available patch paths.","category":"research","primary":false}],"body":"\u003cp\u003eSAP fixed four vulnerabilities rated CVSS 10.0 during its November Security Patch Day. The flaws affect SAP NetWeaver AS ABAP components, SAP Web Dispatcher, SAP Gateway, and the SAML2 service provider. None requires a user to log in or take action for an attacker to exploit it. SAP strongly recommends applying the relevant security notes as a priority.\u003c/p\u003e\n\n\u003cp\u003eTwo flaws, CVE-2026-76964 in the Internet Communication Manager and CVE-2026-89126 in Web Dispatcher, involve malformed WebSocket traffic that can corrupt memory and potentially let an attacker run code. CVE-2026-120017 can let an attacker sign in as any user, including privileged users, under certain SAML2 configurations where incoming assertions were not checked for signatures. CVE-2026-89103 can let an external attacker be treated as one of the system’s own application servers through SAP Gateway and take unauthorized actions. RedRays advises organizations to patch kernels and all Web Dispatchers together, review SAML2 and Gateway settings, and ensure affected services are not directly exposed where possible.\u003c/p\u003e\n"},{"n":7,"title":"Turla hackers use new Cereal malware to spy on govt Exchange servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/turla-hackers-use-new-ceral-malware-to-spy-on-govt-exchange-servers/","time":"10:04","priority":"SHOULD READ","score":89,"tldr":"Russia-linked Turla used its new Cereal malware framework to quietly spy on emails at government Microsoft Exchange servers in Kazakhstan and Romania, including correspondence involving NATO and the EU. The toolset hides inside legitimate Exchange processes, selectively collects messages and attachments, and executes commands without external command-and-control infrastructure.","briefOverview":"\u003cp\u003eESET documented a late-2025 cyberespionage campaign in which the Russia-linked Turla group used a new toolset called Cereal against Microsoft Exchange servers at government organizations. The researchers first found the malware at a government body in Kazakhstan, then identified the same toolset at a Romanian government agency compromised on December 23, 2025. In Romania, the attackers selectively collected correspondence involving representatives of NATO and the European Union.\u003c/p\u003e\n\n\u003cp\u003eCerealBox injects into Exchange’s EdgeTransport.exe process and takes over existing email-handling functions, allowing it to inspect selected messages without registering a new transport agent or disrupting mail delivery. It can target messages based on sender, recipient, subject, and attached DOC, DOCX, or PDF files. Another component, CerealNeuron, receives encrypted commands through Exchange-like web paths, executes programs in memory, and returns encrypted results; ESET observed no external command-and-control infrastructure, with the compromised Exchange server serving as the attackers’ only control point.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET identified Turla's Cereal malware toolset on Microsoft Exchange servers at a government organization in Kazakhstan in late 2025 and at a Romanian government agency compromised on December 23, 2025.","Turla used the CerealBox component to run inside Exchange's EdgeTransport.exe process and intercept email handling without registering a new email-processing component or disrupting delivery.","The malware was configured to selectively collect emails with DOC, DOCX, or PDF attachments and to match specified sender, recipient, and subject criteria.","CerealNeuron accepted encrypted web requests disguised as legitimate Exchange services, executed supplied programs in memory, and encrypted their output for return to the attackers.","ESET observed no external command-and-control infrastructure in the campaign, with the compromised Exchange server serving as the attackers' only control point."],"insights":["Cereal can inspect email content while avoiding the creation of a new Exchange transport agent, helping it blend into normal server operation without interrupting mail delivery.","The attackers used the compromised Exchange server itself as their control point rather than relying on external command-and-control infrastructure, reducing a common opportunity for defenders to detect or block communications.","ESET found numerous near-identical command-carrying programs compiled for specific tasks, which it says strongly suggests Turla has an internal system for automating command compilation and packaging.","A CerealNeuron variant named CerealHermit can read encrypted commands from files on the server rather than receiving them over the network, providing a possible alternative if the web-based command channel is unavailable."],"referencedReports":[{"title":"E
