ative updates apply across Windows 11 versions 23H2 through 26H2.","briefOverview":"\u003cp\u003eMicrosoft released mandatory November 2026 Patch Tuesday cumulative updates for Windows 11 versions 23H2, 24H2, 25H2, and 26H2. The updates include security patches for hundreds of vulnerabilities discovered in previous months, along with bug fixes and new features. Windows 11 versions 25H2 and 26H2 receive the same update as 24H2, with no exclusive changes.\u003c/p\u003e\n\n\u003cp\u003eThe release adds a faster, customizable File Explorer context menu, modernizes AutoPlay, and improves File Explorer search results, user-folder navigation, and dark-mode support in Folder Options. It also introduces Cloud rebuild, which can reinstall Windows by downloading an image and device drivers from Windows Update without requiring USB media, and Windows Recovery can reuse eligible saved Wi-Fi profiles. Additional changes include accessibility improvements for Magnifier, Live Captions, and Narrator; IPv6 CLAT support; expanded memory integrity protection; and a warning that prompt-based DPAPI operations will be retired in April 2027.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said it was not aware of any new issues with this month’s Patch Tuesday updates. The company also said the release fixes a long-standing issue that broke USB audio on some PCs. Users can install the update through Windows Update or manually download it from the Microsoft Update Catalog.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released mandatory November 2026 Patch Tuesday cumulative updates for Windows 11 versions 23H2, 24H2, 25H2, and 26H2, including security patches for hundreds of vulnerabilities.","The updates add a faster, customizable File Explorer right-click menu, allowing users to change built-in commands, app extensions, layout, and the placement of Properties.","Windows 11 now includes Cloud rebuild, a recovery option that can download a Windows image and device drivers from Windows Update to reinstall the operating system without USB media.","The updates add Windows recovery support for automatically reusing eligible saved Wi-Fi profiles, allowing devices to get online during recovery without entering Wi-Fi credentials again.","Microsoft said it was not aware of new issues with the month’s Patch Tuesday updates and that it fixed a long-standing USB audio problem affecting some PCs."],"insights":["Windows 11 versions 25H2 and 26H2 receive the same update as 24H2, with no version-exclusive changes listed.","Cloud rebuild can securely erase data using a storage device’s erase capability before reinstalling Windows, and the article warns that this sanitization choice cannot be reversed.","Microsoft is warning that prompt-based Data Protection API protection and unprotection will be retired in April 2027, so affected users and applications should migrate or decrypt existing prompt-protected data before then.","Eligible PCs may have memory integrity protection enabled during updates, while Microsoft says existing user and IT administrator choices will be respected.","Windows recovery can automatically reuse eligible saved Wi-Fi profiles, including supported certificate-based networks, to get online during recovery scenarios."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft released mandatory November 2026 Patch Tuesday cumulative updates for Windows 11 versions 23H2, 24H2, 25H2, and 26H2. The updates include security patches for hundreds of vulnerabilities discovered in previous months, along with bug fixes and new features. Windows 11 versions 25H2 and 26H2 receive the same update as 24H2, with no exclusive changes.\u003c/p\u003e\n\n\u003cp\u003eThe release adds a faster, customizable File Explorer context menu, modernizes AutoPlay, and improves File Explorer search results, user-folder navigation, and dark-mode support in Folder Options. It also introduces Cloud rebuild, which can reinstall Windows by downloading an image and device drivers from Windows Update without requiring USB media, and Windows Recovery can reuse eligible saved Wi-Fi profiles. Additional changes include accessibility improvements for Magnifier, Live Captions, and Narrator; IPv6 CLAT support; expanded memory integrity protection; and a warning that prompt-based DPAPI operations will be retired in April 2027.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said it was not aware of any new issues with this month’s Patch Tuesday updates. The company also said the release fixes a long-standing issue that broke USB audio on some PCs. Users can install the update through Windows Update or manually download it from the Microsoft Update Catalog.\u003c/p\u003e\n"},{"n":17,"title":"Cybercriminals are increasingly infecting regular people with spyware","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/spyware-cyber-crime-iverify","time":"15:45","priority":"SHOULD READ","score":82,"tldr":"iVerify reports that criminally operated iOS spyware, especially the Coruna and DarkSword exploit kits, is increasingly infecting ordinary consumers and rank-and-file employees at scale. The trend marks a shift from tightly targeted nation-state surveillance toward widespread credential and cryptocurrency theft via malicious websites and online ads.","briefOverview":"\u003cp\u003eiVerify reported that spyware infections are increasingly affecting ordinary consumers and rank-and-file enterprise employees, rather than only prominent or politically sensitive targets. Its free consumer scans found 1.07 infections per 1,000 devices, while enterprise scans found 0.7 per 1,000. The company attributed the lower enterprise rate to enforced patching, on-device detection, and network security controls.\u003c/p\u003e\n\n\u003cp\u003eAbout 75% of detections involved criminal actors using the Coruna or DarkSword iOS exploit kits, with the rest involving mercenary spyware such as Pegasus. DarkSword and Coruna can infect devices through compromised or malicious websites, including cases where simply visiting a site can trigger the attack, and they can expose messages, photos, emails, microphones, and cameras. iVerify said these campaigns are mainly aimed at credential and cryptocurrency theft, and that infected Coruna and DarkSword device owners did not receive Apple threat notifications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["iVerify reported 1.07 spyware infections per 1,000 consumer device scans, compared with 0.7 per 1,000 enterprise scans.","About 75% of iVerify’s detections involved criminal use of the Coruna or DarkSword iOS exploit kits, while the remaining 25% involved mercenary spyware such as Pegasus.","Coruna and DarkSword can infect iOS devices through web-based attacks, including compromised websites that may trigger an infection without a user clicking a link.","iVerify said devices infected with Coruna and DarkSword did not receive Apple threat notifications, despite the frameworks being capable of exposing messages, photos, emails, microphones, and cameras.","The report says these attacks are primarily used for credential and cryptocurrency theft and increasingly affect ordinary consumers and rank-and-file enterprise employees."],"insights":["iVerify expected the infection rate to fall as its free consumer scans quadrupled and included more average users, but it still found 1.07 infections per 1,000 scans.","Enterprise devices had a lower detected infection rate than consumer devices, which iVerify attributed to enforced patching, on-device detection, and network security controls.","People whose devices were infected with Coruna or DarkSword did not receive Apple threat notifications, according to the report.","The report found many infected enterprise users were rank-and-file employees rather than executives, supporting iVerify’s recommendation that businesses treat spyware as an organization-wide risk rather than a VIP-only concern."],"referencedReports":[{"title":"Advanced Mobile Threat Report 2026","url":"https://www.iverify.com/advanced-mobile-threat-report-2026","publisher":"iVerify","context":"The article is based on iVerify's report on spyware infection rates among consumer and enterprise device scans and the growing criminal use of Coruna and DarkSword.","category":"research","primary":true}],"body":"\u003cp\u003eiVerify reported that spyware infections are increasingly affecting ordinary consumers and rank-and-file enterprise employees, rather than only prominent or politically sensitive targets. Its free consumer scans found 1.07 infections per 1,000 devices, while enterprise scans found 0.7 per 1,000. The company attributed the lower enterprise rate to enforced patching, on-device detection, and network security controls.\u003c/p\u003e\n\n\u003cp\u003eAbout 75% of detections involved criminal actors using the Coruna or DarkSword iOS exploit kits, with the rest involving mercenary spyware such as Pegasus. DarkSword and Coruna can infect devices through compromised or malicious websites, including cases where simply visiting a site can trigger the attack, and they can expose messages, photos, emails, microphones, and cameras. iVerify said these campaigns are mainly aimed at credential and cryptocurrency theft, and that infected Coruna and DarkSword device owners did not receive Apple threat notifications.\u003c/p\u003e\n"},{"n":19,"title":"AI company Fireworks says hackers stole data, billing info during October breaches","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ai-company-fireworks-says-hackers-stole-data-in-oct-attacks","time":"16:08","priority":"SHOULD READ","score":82,"tldr":"AI infrastructure company Fireworks said two October breaches exposed limited customer account and billing data, credentials, and AI datasets after attackers compromised its systems and a third-party cloud provider. The incidents reflect a growing LLMJacking trend in which criminals steal cloud or model-access credentials to run unauthorized AI workloads and generate major charges.","briefOverview":"\u003cp\u003eFireworks, an AI infrastructure company, said cybercriminals carried out two breaches in October that exposed customer and internal data. The company said attackers in an October 6 incident stole account and billing information, along with confidential access credentials, from a limited number of customer accounts. Fireworks hired Palo Alto Networks Unit 42 to investigate and notified affected customers.\u003c/p\u003e\n\n\u003cp\u003eA separate October 23 incident involved a third-party cloud provider hosting Fireworks research-and-development machines; attackers used that provider to reach Fireworks development systems and run an unauthorized workload. Fireworks said this incident exposed internal data, invoices, payment history, datasets, and other AI-related data, while Notion said some of its customers may have been affected because it used Fireworks for AI-related services. The incidents were described in the context of “LLMJacking,” in which criminals steal credentials or tokens for AI services and can rapidly create fraudulent cloud charges exceeding \u003cspan class=\"math inline\"\u003e\\(100,000 in a day, with cumulative costs reaching \\)\u003c/span\u003e1 million in some cases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks said cybercriminals stole account and billing information and confidential access credentials from a limited number of customer accounts in a breach it discovered on October 6.","Fireworks reported a second incident on October 23 in which attackers compromised a third-party cloud provider hosting its research-and-development machines and used that access to reach Fireworks development systems.","The second incident exposed internal Fireworks data, billing information, invoices, payment history, datasets, and other AI-related data, and affected customers were notified.","Notion said it was notified of the Fireworks incident on November 2, disconnected its systems from Fireworks, deleted its Fireworks-hosted data, and disabled its Insights feature during its investigation.","Google Threat Intelligence Group and Mandiant said LLMJacking incidents can produce more than $100,000 in fraudulent cloud charges in one day and cumulative costs of up to $1 million before access is revoked."],"insights":["The Fireworks incidents show that customer impact can arise through both a company’s own systems and a third-party provider hosting development infrastructure.","Notion’s response—disconnecting from Fireworks, deleting data held there, and disabling the affected Insights feature—shows that a provider incident can force customers to suspend product features while they investigate.","LLMJacking differs from cryptojacking in the speed of financial damage: Mandiant observed fraudulent AI-service charges exceeding $100,000 in a single day.","Google and Mandiant reported that some criminal groups are specializing in different stages of LLMJacking, with initial-access groups handing compromised AI access to others for monetization and resale."],"referencedReports":[{"title":"October 2026 Security Incident","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident","publisher":"fireworks","context":"The article links to Fireworks' security bulletin on the breach it discovered on October 6.","category":"advisory","primary":true},{"title":"Security Incident Involving a Third-Party AI Vendor","url":"https://www.notion.com/en-gb/security/advisories/security-incident-involving-a-third-party-ai-vendor","publisher":"notion","context":"The article cites Notion's security notice describing potential effects on its customers from the Fireworks incidents.","category":"advisory","primary":false},{"title":"LLMJacking: Monetizing Compromised Cloud Models","url":"https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models","publisher":"google-threat-intelligence-group-and-mandiant","context":"The article references Google Threat Intelligence Group and Mandiant's analysis of credential theft and fraudulent use of enterprise AI-model access.","category":"research","primary":false}],"body":"\u003cp\u003eFireworks, an AI infrastructure company, said cybercriminals carried out two breaches in October that exposed customer and internal data. The company said attackers in an October 6 incident stole account and billing information, along with confidential access credentials, from a limited number of customer accounts. Fireworks hired Palo Alto Networks Unit 42 to investigate and notified affected customers.\u003c/p\u003e\n\n\u003cp\u003eA separate October 23 incident involved a third-party cloud provider hosting Fireworks research-and-development machines; attackers used that provider to reach Fireworks development systems and run an unauthorized workload. Fireworks said this incident exposed internal data, invoices, payment history, datasets, and other AI-related data, while Notion said some of its customers may have been affected because it used Fireworks for AI-related services. The incidents were described in the context of “LLMJacking,” in which criminals steal credentials or tokens for AI services and can rapidly create fraudulent cloud charges exceeding \u003cspan class=\"math inline\"\u003e\\(100,000 in a day, with cumulative costs reaching \\)\u003c/span\u003e1 million in some cases.\u003c/p\u003e\n"},{"n":31,"title":"Binance Warns of iOS Sandbox Escape That Could Expose Crypto Wallet Keys, No Fix Confirmed","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/binance-warns-of-ios-sandbox-escape.html","time":"12:15","priority":"SHOULD READ","score":82,"tldr":"Binance warned that the publicly released worse_query iOS sandbox escape may let malicious sideloaded apps access other apps’ data, potentially exposing crypto wallet seed phrases, private keys, and credentials on iOS 26 and 27. Apple’s latest updates do not confirm a fix, so users should remove untrusted apps and move funds to a new wallet if compromise is suspected.","briefOverview":"\u003cp\u003eBinance warned that a publicly released iOS sandbox escape called worse_query could allow an app to read files from other apps on iPhones running iOS 26 and 27. The exchange said this could expose cryptocurrency wallet seed phrases, private keys, and login credentials to malicious apps. No attacks or thefts involving the issue have been reported.\u003c/p\u003e\n\n\u003cp\u003eResearcher forcequit released the proof-of-concept code on GitHub, where it is described as requiring an app to set up an App Group container. Developers have used it to create WQ Files, a sideloaded file manager that can access, edit, delete, and clear other apps’ data without a jailbreak or kernel exploit. Apple’s iOS 27.2.1 and iOS 26.7.3 security notes do not mention worse_query or a sandbox fix, leaving the fix status unconfirmed.\u003c/p\u003e\n\n\u003cp\u003eBinance advised users to delete apps installed from untrusted sources, including sideloaded or manually signed apps, and to update iOS and all apps. People who suspect a breach were advised to move funds to a new wallet created on a clean device and reset active login sessions. The article notes that AltStore and SideStore can automatically create the App Group required by WQ Files when used with an Apple ID.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A researcher known as forcequit published worse_query, an iOS sandbox escape that can let an app access data containers belonging to other apps on iPhones running iOS 26 and 27.","Binance warned that exposed app data could include cryptocurrency wallet seed phrases, private keys, and login credentials, though no attacks or theft involving worse_query have been reported.","The WQ Files file manager uses worse_query to read, edit, delete, and clear other apps’ data without a jailbreak or kernel exploit, and it is installed through sideloading tools such as AltStore and SideStore.","Apple’s iOS 27.2.1 and iOS 26.7.3 security notes do not mention worse_query or an iOS sandbox fix.","Binance advised users to remove apps from untrusted sources, update iOS and apps, and move funds to a new wallet created on a clean device if they suspect compromise."],"insights":["The publicly released proof-of-concept is described by its author as not useful on its own, but other developers have already turned it into installable apps such as WQ Files.","WQ Files can gain the required App Group setup automatically when installed with AltStore or SideStore using an Apple ID, making the issue particularly relevant to users of manually installed apps.","The reported scope differs among sources: WQ Files lists specific tested iOS versions, while Erosion’s developers only said they were “pretty sure” iOS 27.2.1 is supported.","Although Apple released iOS updates after worse_query was published, the associated security notes do not confirm a sandbox fix, leaving its current patch status unconfirmed."],"referencedReports":[{"title":"Binance Security Warning","url":"https://x.com/binance/status/2120093246399430770","publisher":"binance","context":"Binance’s security warning advises users who suspect a breach to move funds to a new wallet created on a clean device and reset active login sessions.","category":"advisory","primary":true},{"title":"About the security content of iOS 27.2.1","url":"https://support.apple.com/en-us/149715","publisher":"apple","context":"Apple’s security notes for iOS 27.2.1 are cited as not mentioning worse_query or an iOS sandbox fix.","category":"advisory","primary":false},{"title":"About the security content of iOS 26.7.3","url":"https://support.apple.com/en-us/149716","publisher":"apple","context":"Apple’s security notes for iOS 26.7.3 are cited as not mentioning worse_query or an iOS sandbox fix.","category":"advisory","primary":false}],"body":"\u003cp\u003eBinance warned that a publicly released iOS sandbox escape called worse_query could allow an app to read files from other apps on iPhones running iOS 26 and 27. The exchange said this could expose cryptocurrency wallet seed phrases, private keys, and login credentials to malicious apps. No attacks or thefts involving the issue have been reported.\u003c/p\u003e\n\n\u003cp\u003eResearcher forcequit released the proof-of-concept code on GitHub, where it is described as requiring an app to set up an App Group container. Developers have used it to create WQ Files, a sideloaded file manager that can access, edit, delete, and clear other apps’ data without a jailbreak or kernel exploit. Apple’s iOS 27.2.1 and iOS 26.7.3 security notes do not mention worse_query or a sandbox fix, leaving the fix status unconfirmed.\u003c/p\u003e\n\n\u003cp\u003eBinance advised users to delete apps installed from untrusted sources, including sideloaded or manually signed apps, and to update iOS and all apps. People who suspect a breach were advised to move funds to a new wallet created on a clean device and reset active login sessions. The article notes that AltStore and SideStore can automatically create the App Group required by WQ Files when used with an Apple ID.\u003c/p\u003e\n"},{"n":12,"title":"Fireworks AI discloses new breach after cloud provider hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/","time":"07:49","priority":"SHOULD READ","score":78,"tldr":"Fireworks disclosed a second October breach after attackers exploited a security incident at a third-party cloud provider to access its development machines and expose some customer metadata, billing information, and incomplete model data. The company says payment card numbers were not exposed and has revoked credentials, isolated affected systems, and engaged Palo Alto Networks Unit 42.","briefOverview":"\u003cp\u003eFireworks disclosed a second security incident in which attackers accessed its development machines after a third-party cloud provider hosting Fireworks R\u0026amp;D systems was breached on October 23. Fireworks said the unauthorized party used that incident to reach its development machines on October 24 and run an unauthorized workload. The company detected the activity the same day and said it had not found further evidence of successful unauthorized access to the customer-facing Fireworks platform after October 25.\u003c/p\u003e\n\n\u003cp\u003eThe incident exposed resource metadata, including identifiers, display names, descriptions, and creation times, as well as billing and shipping addresses, invoice and payment history, account balances, and credit usage. Incomplete model weights and datasets belonging to some customers were also affected, while payment card numbers were not accessible because Fireworks does not store them. Fireworks revoked and replaced credentials and service accounts, isolated affected systems, restricted unauthorized network routes, tightened access to stored data, and engaged Palo Alto Networks Unit 42 to investigate and improve its defenses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks disclosed that attackers accessed its development machines on October 24 after a third-party cloud provider hosting its R\u0026D machines suffered a security incident on October 23.","The unauthorized workload run on Fireworks development machines exposed resource metadata, billing information, and incomplete model weights and datasets for some customers.","Fireworks said customer payment card numbers were not accessible because the company does not store them.","Fireworks detected the activity on October 24, revoked and replaced credentials and service accounts, restricted network pathways, isolated affected systems, and tightened access to storage and analytics systems.","Fireworks is working with Palo Alto Networks Unit 42 to investigate the incident and secure its systems."],"insights":["The incident affected more than API access: attackers accessed customer resource details, billing records, and incomplete AI model weights and datasets for some customers.","Fireworks said payment card numbers were not exposed because it does not store them, limiting one category of financial data impact.","The alleged LLMjacking activity highlights that stolen AI-service access can create significant financial exposure, with Google and Mandiant reporting cloud AI charges as high as $1 million from fraudulent API calls.","Fireworks detected the new unauthorized activity on the same day it occurred and said it found no further successful attacker access to its customer platform after October 25."],"referencedReports":[{"title":"October 2026 Security Incident","url":"http://fireworks.ai/security/bulletins/october-2026-security-incident","publisher":"fireworks","context":"Fireworks' security bulletin describes the earlier October incident involving exposed API keys and tokens and links it to financially motivated LLMjacking activity.","category":"advisory","primary":true},{"title":"October 2026 Security Incident Update","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident-update","publisher":"fireworks","context":"Fireworks' update advisory details the October 23 cloud-provider incident, subsequent access to development machines, affected customer data, and remediation actions.","category":"advisory","primary":true}],"body":"\u003cp\u003eFireworks disclosed a second security incident in which attackers accessed its development machines after a third-party cloud provider hosting Fireworks R\u0026amp;D systems was breached on October 23. Fireworks said the unauthorized party used that incident to reach its development machines on October 24 and run an unauthorized workload. The company detected the activity the same day and said it had not found further evidence of successful unauthorized access to the customer-facing Fireworks platform after October 25.\u003c/p\u003e\n\n\u003cp\u003eThe incident exposed resource metadata, including identifiers, display names, descriptions, and creation times, as well as billing and shipping addresses, invoice and payment history, account balances, and credit usage. Incomplete model weights and datasets belonging to some customers were also affected, while payment card numbers were not accessible because Fireworks does not store them. Fireworks revoked and replaced credentials and service accounts, isolated affected systems, restricted unauthorized network routes, tightened access to stored data, and engaged Palo Alto Networks Unit 42 to investigate and improve its defenses.\u003c/p\u003e\n"},{"n":20,"title":"US Army member arrested in UK over allegations of spying for Russia","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-army-member-arrested-in-uk-spying-for-russia","time":"21:13","priority":"SHOULD READ","score":78,"tldr":"A 41-year-old U.S. Army soldier was arrested near Gloucester, UK, on suspicion of espionage for Russia. British counterterrorism police are investigating with U.S. authorities, and the soldier reportedly had access to sensitive information.","briefOverview":"\u003cp\u003eA 41-year-old U.S. Army soldier was arrested in the United Kingdom on suspicion of spying for Russia. The unnamed soldier is being held at a London police station after UK counterterrorism police conducted the arrest near Gloucester. Police said the investigation is being conducted closely with U.S. authorities, including the FBI and the military.\u003c/p\u003e\n\n\u003cp\u003eThe arrest was made under provisions of the UK National Security Act covering espionage, and officers are searching two locations in Gloucestershire. U.S. Army Counterintelligence Command chief Brig. Gen. Sean Stinchon said the senior soldier had been entrusted with sensitive information. FBI Director Kash Patel said the FBI would not tolerate people who violate their oath and endanger U.S. national security or that of its partners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A 41-year-old U.S. Army soldier was arrested in the United Kingdom on suspicion of spying for Russia.","UK counterterrorism police said they worked closely with U.S. authorities, including the FBI and the military, during the investigation.","The arrest took place near Gloucester, and police searched two locations in Gloucestershire as part of the investigation.","The soldier, described as a senior soldier entrusted with sensitive information, was arrested under UK National Security Act provisions covering espionage.","GCHQ Director Anne Keast-Butler said Russia has been relentlessly targeting critical infrastructure, democratic processes, supply chains, and public trust."],"insights":["The investigation is a cross-border effort involving UK counterterrorism police, the FBI, and the U.S. military, reflecting the shared security implications of the allegations.","The suspect was described as a senior soldier entrusted with sensitive information, making the case notable for the potential insider-risk dimension.","The arrest occurred near Gloucester, close to GCHQ’s headquarters, and investigators are searching two locations in Gloucestershire.","UK authorities are using National Security Act espionage provisions, while explicitly identifying Russia as the country connected to the allegations."],"referencedReports":[],"body":"\u003cp\u003eA 41-year-old U.S. Army soldier was arrested in the United Kingdom on suspicion of spying for Russia. The unnamed soldier is being held at a London police station after UK counterterrorism police conducted the arrest near Gloucester. Police said the investigation is being conducted closely with U.S. authorities, including the FBI and the military.\u003c/p\u003e\n\n\u003cp\u003eThe arrest was made under provisions of the UK National Security Act covering espionage, and officers are searching two locations in Gloucestershire. U.S. Army Counterintelligence Command chief Brig. Gen. Sean Stinchon said the senior soldier had been entrusted with sensitive information. FBI Director Kash Patel said the FBI would not tolerate people who violate their oath and endanger U.S. national security or that of its partners.\u003c/p\u003e\n"},{"n":33,"title":"Anthropic's Claude Fable 5.2 Beats GPT-6 Cyber in Multi-Stage Cyberattack Benchmark","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/anthropics-claude-fable-52-beats-gpt-6.html","time":"08:16","priority":"MAY READ","score":72,"tldr":"Anthropic launched Claude Fable 5.2 and Mythos 5.2, claiming major gains in coding, reasoning, and cybersecurity capability. Fable 5.2 scored 76.3% on Irregular’s multi-stage CyScenarioBench, outperforming GPT-6 Cyber’s 61%, while Anthropic expanded Claude Security with continuous code scanning and fix tracking.","briefOverview":"\u003cp\u003eAnthropic released Claude Fable 5.2 and Claude Mythos 5.2, describing improvements in coding, reasoning, and vision. The company said the models assisted its engineers with software migrations, electronic-device design, robotics evaluations, black-hole physics problems, and formalizing a proof of Fermat’s Last Theorem. Anthropic also said its evaluations found high-stakes misalignment risks remained low and that the models matched or exceeded earlier Claude models on most measures of alignment, misuse resistance, honesty, and factuality.\u003c/p\u003e\n\n\u003cp\u003eOn Irregular’s CyScenarioBench, which assesses multi-stage cyber operations in realistic environments, Fable 5.2 completed 76.3% of challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber. Anthropic said Fable 5.2 scored 89.6% on its CVE Rediscovery benchmark, which evaluates whether a model can rediscover known flaws using affected source code. The company also updated Claude Security with continuous code scanning and automatic fix tracking, including severity ratings and explanations of how an attacker could reach vulnerable code.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic released Claude Fable 5.2 and Claude Mythos 5.2, reporting improvements in coding, reasoning, and vision.","On Irregular’s CyScenarioBench, Claude Fable 5.2 completed 76.3% of challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber.","Anthropic said Fable 5.2 scored 89.6% on its CVE Rediscovery benchmark, which tests whether a model can rediscover known software flaws from affected source code.","Anthropic described Claude Mythos 5.2 as its most capable model for cybersecurity engineering and said its cyber capabilities are available through the Cyber Verification Program.","Anthropic updated Claude Security with continuous code scanning and automatic fix tracking to help teams monitor and address vulnerabilities as code changes."],"insights":["Anthropic reported that Fable 5.2 was about ten times less likely than prior Claude models to publish harmful content to public package registries without encouragement, but it still did so when prompted by a simulated user.","Fable 5.2’s 76.3% CyScenarioBench result indicates a sizable improvement over Fable 5.1’s 61.7%, while exceeding GPT-6 Cyber’s reported 61% average success rate on the same multi-stage benchmark.","Claude Security’s updated findings are designed to prioritize flaws that an attacker could actually reach in a project, rather than treating every discovered issue as equally urgent."],"referencedReports":[{"title":"CyScenarioBench","url":"https://www.irregular.com/research/cyscenariobench","publisher":"irregular","context":"The article cites Irregular’s benchmark for evaluating whether models can plan and execute multi-stage cyber operations in realistic environments.","category":"research","primary":false},{"title":"Assessing Gemini 4 Argon Against Offensive Security Benchmarks","url":"https://www.irregular.com/research/assessing-gemini-4-argon-against-offensive-security-benchmarks","publisher":"irregular","context":"The article references Irregular’s report on Gemini 4 Argon’s end-to-end performance on a subset of CyScenarioBench challenges.","category":"research","primary":false},{"title":"Assessing GPT-6 Cyber Against Offensive Security Benchmarks","url":"https://www.irregular.com/research/assessing-gpt-6-cyber-against-offensive-security-benchmarks","publisher":"irregular","context":"The article cites Irregular’s analysis of GPT-6 Cyber’s CyScenarioBench and Atomic Challenges results.","category":"research","primary":false}],"body":"\u003cp\u003eAnthropic released Claude Fable 5.2 and Claude Mythos 5.2, describing improvements in coding, reasoning, and vision. The company said the models assisted its engineers with software migrations, electronic-device design, robotics evaluations, black-hole physics problems, and formalizing a proof of Fermat’s Last Theorem. Anthropic also said its evaluations found high-stakes misalignment risks remained low and that the models matched or exceeded earlier Claude models on most measures of alignment, misuse resistance, honesty, and factuality.\u003c/p\u003e\n\n\u003cp\u003eOn Irregular’s CyScenarioBench, which assesses multi-stage cyber operations in realistic environments, Fable 5.2 completed 76.3% of challenges, compared with 61.7% for Fable 5.1 and 61% for OpenAI’s GPT-6 Cyber. Anthropic said Fable 5.2 scored 89.6% on its CVE Rediscovery benchmark, which evaluates whether a model can rediscover known flaws using affected source code. The company also updated Claude Security with continuous code scanning and automatic fix tracking, including severity ratings and explanations of how an attacker could reach vulnerable code.\u003c/p\u003e\n"},{"n":18,"title":"Palantir exec nominated to lead CISA; lame-duck Senate vote is uncertain","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/michael-losapio-cisa-director-nomination","time":"14:31","priority":"MAY READ","score":70,"tldr":"President Trump nominated Palantir CIO Michael LoSapio to lead CISA, but the Senate may not vote during the lame-duck session. If unconfirmed, his nomination must be resubmitted to an incoming Democratic-controlled Senate, where Palantir ties may draw greater scrutiny.","briefOverview":"\u003cp\u003ePresident Donald Trump nominated Palantir Chief Information Officer Michael LoSapio to lead the Cybersecurity and Infrastructure Security Agency (CISA). CISA has not had a Senate-confirmed leader since Trump returned to office, and Nick Andersen has served as acting head since February after prior nominee Sean Plankey withdrew. LoSapio joined Palantir in 2017, led its infrastructure and network security group, and became CIO in late 2024.\u003c/p\u003e\n\n\u003cp\u003eThe Senate may not consider the nomination during its crowded lame-duck session, which includes government funding and defense policy legislation. If Congress adjourns without confirming LoSapio, Trump would need to submit his nomination again next year for consideration by an incoming Democratic majority. CISA has lost more than 1,000 employees—about one-third of its workforce—and billions in funding during the second Trump administration, although it still offered voluntary vulnerability scanning and operated a threat-information-sharing hub before the midterm elections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["President Donald Trump nominated Palantir Chief Information Officer Michael LoSapio to lead the Cybersecurity and Infrastructure Security Agency (CISA).","CISA has lacked a Senate-confirmed leader since Trump returned to office, with Nick Andersen serving as acting leader since February after previous nominee Sean Plankey withdrew.","During the second Trump administration, CISA lost more than 1,000 employees—about one-third of its workforce—and its budget was reduced by billions.","It is uncertain whether the Senate will consider LoSapio’s nomination during the crowded lame-duck session.","If the Senate adjourns without confirming LoSapio, Trump would need to nominate him again next year for consideration by an incoming Democratic majority."],"insights":["CISA continued providing election-related support, including free vulnerability scanning and a threat-information-sharing hub, despite operating largely behind the scenes before the midterm elections.","The nomination’s timing is consequential because a lapse into the next Congress would require a new nomination and place LoSapio before an incoming Democratic Senate majority.","LoSapio’s Palantir role could become a focus of oversight if his nomination is resubmitted, as Rep. Bennie Thompson has indicated plans for thorough oversight of DHS components including CISA.","CISA’s loss of roughly one-third of its workforce and billions in budget cuts followed years of Republican criticism over its efforts to counter election-related online disinformation."],"referencedReports":[],"body":"\u003cp\u003ePresident Donald Trump nominated Palantir Chief Information Officer Michael LoSapio to lead the Cybersecurity and Infrastructure Security Agency (CISA). CISA has not had a Senate-confirmed leader since Trump returned to office, and Nick Andersen has served as acting head since February after prior nominee Sean Plankey withdrew. LoSapio joined Palantir in 2017, led its infrastructure and network security group, and became CIO in late 2024.\u003c/p\u003e\n\n\u003cp\u003eThe Senate may not consider the nomination during its crowded lame-duck session, which includes government funding and defense policy legislation. If Congress adjourns without confirming LoSapio, Trump would need to submit his nomination again next year for consideration by an incoming Democratic majority. CISA has lost more than 1,000 employees—about one-third of its workforce—and billions in funding during the second Trump administration, although it still offered voluntary vulnerability scanning and operated a threat-information-sharing hub before the midterm elections.\u003c/p\u003e\n"},{"n":38,"title":"Fuel Card Over-Limit Notice Targets a Trucking Firm's Clerk","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fuel-card-over-limit-notice-wex-emanager-clone-trucking-accounting-clerk","time":"11:00","priority":"MAY READ","score":68,"tldr":"A newly registered lookalike domain sent a convincing WEX fuel-card over-limit notice to a trucking accounting clerk and linked to an eManager login clone, despite passing SPF, DKIM, and DMARC. Finance teams should verify card-limit notices through known provider channels rather than trusting authenticated email links.","briefOverview":"\u003cp\u003eA trucking company accounting clerk received a fuel-card over-limit notice claiming that a same-day purchase at a national truck-stop chain had pushed the company above its assigned limit. The message included the company name, a reference number, and a warning that further fuel purchases might be declined. It used a display name resembling WEX and was signed “WEX Account Support,” while directing the recipient to a plain-text link.\u003c/p\u003e\n\n\u003cp\u003eThe link opened a clone of the WEX eManager organization login page with an email field, a Continue button, and a passkey option; a second hostname displayed the same page. The attacker-controlled lookalike domain was registered about 27 minutes before the email was sent, yet SPF, DKIM, DMARC, and composite authentication passed because the attacker controlled the domain and its records. Link scanners marked the URLs clean, but a human analyst identified the message as malicious, and the article advises finance teams to verify whether the card account and referenced transaction exist by using a bookmarked provider portal rather than an email link.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A trucking company accounting clerk received a fuel-card over-limit notice that used the company name, a same-day national truck-stop purchase, and a reference number.","The email’s sole call-to-action link opened a page imitating the WEX eManager organization login, including an email field, a Continue button, and a passkey option.","The lookalike domain webwexsources[.]com was registered about 27 minutes before the email was sent, but SPF, DKIM, DMARC, and composite authentication passed because the attacker controlled the sending domain.","Mailbox filtering initially placed the message in Junk, link scanners marked both links as clean, and a human analyst later quarantined and resolved the incident as malicious.","The article recommends verifying card-limit notices through a bookmarked provider portal or other out-of-band channel to confirm whether the account and referenced transaction actually exist."],"insights":["Passing sender-authentication checks did not establish legitimacy because the attacker had registered and configured the domain they used only minutes before sending the email.","The message’s operational consequence—fuel purchases potentially being declined—created pressure tailored to a trucking company’s accounting function rather than relying on a generic payment-themed lure.","The captured fake login page showed only an email-entry form, so the article distinguishes a confirmed login-page clone from an unobserved later-stage credential capture.","The article recommends validating the underlying business claim, such as whether the company has a card account and matching transaction, instead of treating valid email headers as proof that a finance notice is real."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s statistics on the human element, phishing as an initial-access vector, and credential involvement in breaches.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the report as tracking reported losses from this class of fraud.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article links to CISA guidance for user-side phishing prevention habits.","category":"guide","primary":false}],"body":"\u003cp\u003eA trucking company accounting clerk received a fuel-card over-limit notice claiming that a same-day purchase at a national truck-stop chain had pushed the company above its assigned limit. The message included the company name, a reference number, and a warning that further fuel purchases might be declined. It used a display name resembling WEX and was signed “WEX Account Support,” while directing the recipient to a plain-text link.\u003c/p\u003e\n\n\u003cp\u003eThe link opened a clone of the WEX eManager organization login page with an email field, a Continue button, and a passkey option; a second hostname displayed the same page. The attacker-controlled lookalike domain was registered about 27 minutes before the email was sent, yet SPF, DKIM, DMARC, and composite authentication passed because the attacker controlled the domain and its records. Link scanners marked the URLs clean, but a human analyst identified the message as malicious, and the article advises finance teams to verify whether the card account and referenced transaction exist by using a bookmarked provider portal rather than an email link.\u003c/p\u003e\n"},{"n":40,"title":"Sage: AI for Assumed-Breach Operations, Built Into Mythic","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/11/10/sage-ai-for-assumed-breach-operations-built-into-mythic/","time":"17:00","priority":"MAY READ","score":58,"tldr":"SpecterOps has released Sage, an open-source AI assistant embedded in Mythic v4 that helps operators plan and execute assumed-breach operations across Mythic agents while requiring approval for each action in supervised mode. Sage uses BloodHound and a proof-backed engagement ledger to preserve operational context, with autonomous operation restricted to research labs.","briefOverview":"\u003cp\u003eSpecterOps has released Sage, an open-source AI assistant that runs as a native chat container inside Mythic v4 for assumed-breach operations. Operators can describe an objective, and Sage identifies suitable Mythic agents, callbacks, commands, and arguments while retaining operator control through approval cards. Sage is intended to reduce the burden of tracking command syntax, tool availability, and operational information across long-running assessments.\u003c/p\u003e\n\n\u003cp\u003eSage provides read-only conversation mode, supervised mode requiring approval for each guarded action, and an experimental autonomous mode intended only for lab use. It maintains operational context through BloodHound attack-path data and an Engagement State Ledger that records gains only when they are supported by evidence from Mythic tasks, files, credentials, callbacks, or BloodHound data. Sage can query installed Mythic agent schemas, validate proposed command arguments, and use programmed capabilities that generate and verify concrete actions; however, it remains beta software, with end-to-end validation primarily conducted using Mythic v4, LiteLLM, and the Apollo payload.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps released Sage as an open-source AI assistant that runs inside Mythic v4 and helps operators translate objectives into proposed actions across available Mythic agents.","Sage offers conversation, supervised, and autonomous modes; supervised mode requires approval for every guarded action, while autonomous mode is described as an experimental research capability for lab environments.","Sage stores operational context in BloodHound and an Engagement State Ledger, where claimed gains are recorded as achieved only when supported by Mythic, credential, callback, task, file, or BloodHound evidence.","Sage can learn command schemas from installed Mythic payload types, validate proposed arguments before tasking, and use built-in capabilities that convert selected actions into concrete Mythic commands.","The project is beta software validated primarily with Mythic v4, LiteLLM, and the Apollo payload, with other providers and Mythic agents supported but not yet fully validated."],"insights":["Sage separates AI decision-making from command construction for its programmed capabilities: the model selects a capability, while code generates the concrete Mythic commands and verifies their effects against actual output.","An entry in Sage’s Engagement State Ledger is not treated as achieved merely because the model says so; it must include a proof record tied to evidence such as Mythic task output, callback records, credentials, files, or BloodHound data.","Sage can work with different Mythic agents by querying Mythic’s own command schemas, checking that a command is available on the selected callback, and validating or repairing arguments before presenting an approval request.","Autonomous mode does not use the normal multi-agent conversation system; it instead uses a deterministic cycle that evaluates available capabilities, verifies results, and stops under limits for cycles, lack of progress, tokens, or elapsed time.","The article cites prior research indicating that language models handle individual penetration-testing tasks better than sustained multi-host operations, which is why Sage keeps operational memory outside the model in BloodHound and its ledger."],"referencedReports":[{"title":"PentestGPT: An LLM-empowered Automatic Penetration Testing Tool","url":"https://arxiv.org/abs/2308.06782","publisher":"arxiv","context":"The article cites this research as finding that LLMs can handle individual penetration-testing subtasks but struggle to maintain an integrated view of an entire test.","category":"research","primary":false},{"title":"Incalmo","url":"https://arxiv.org/abs/2501.16466","publisher":"arxiv","context":"The article cites this research to support its claim that separate context tracking and asset acquisition improve LLM offense-system performance across multi-host networks.","category":"research","primary":false},{"title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://arxiv.org/abs/2307.03172","publisher":"arxiv","context":"The article cites this study for evidence that models use information less reliably when it appears in the middle of a long context.","category":"research","primary":false}],"body":"\u003cp\u003eSpecterOps has released Sage, an open-source AI assistant that runs as a native chat container inside Mythic v4 for assumed-breach operations. Operators can describe an objective, and Sage identifies suitable Mythic agents, callbacks, commands, and arguments while retaining operator control through approval cards. Sage is intended to reduce the burden of tracking command syntax, tool availability, and operational information across long-running assessments.\u003c/p\u003e\n\n\u003cp\u003eSage provides read-only conversation mode, supervised mode requiring approval for each guarded action, and an experimental autonomous mode intended only for lab use. It maintains operational context through BloodHound attack-path data and an Engagement State Ledger that records gains only when they are supported by evidence from Mythic tasks, files, credentials, callbacks, or BloodHound data. Sage can query installed Mythic agent schemas, validate proposed command arguments, and use programmed capabilities that generate and verify concrete actions; however, it remains beta software, with end-to-end validation primarily conducted using Mythic v4, LiteLLM, and the Apollo payload.\u003c/p\u003e\n"},{"n":45,"title":"Railway’s Security Incident: Why CI/CD Needs Runtime Security","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/railway-security-incident-cicd-runtime-security","time":"20:39","priority":"MAY READ","score":55,"tldr":"Railway’s incident shows that a compromised CI/CD build can expose broader internal credentials and cloud access, making build isolation, egress controls, and tightly scoped OIDC trust essential. The article promotes StepSecurity Harden-Runner for runtime visibility and outbound network enforcement in GitHub Actions environments.","briefOverview":"\u003cp\u003eRailway’s November 10, 2026 incident report describes an October 20–21 attack in which an attacker partially escaped build isolation and obtained a build infrastructure credential. Railway said misplaced trust in that credential enabled access to stored build histories and its internal source. A separate OIDC configuration error later enabled cloud access and access to credentials and systems used to retrieve and decrypt customer variables. Railway estimated that up to 1.85% of workspaces, about 100,000, could potentially have had variables decrypted, while emphasizing that this was an upper-bound figure.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that CI/CD build jobs are a security boundary because they execute code, handle credentials, and can access networks, services, artifacts, and deployments. It recommends separating untrusted builds from privileged deployment jobs, using isolated disposable runner environments, restricting access to internal services, and reviewing credentials inherited from runner hosts. It also recommends observing and restricting outbound connections, validating OIDC trust and cloud permissions, and placing production credential jobs behind protected GitHub environments with required approval. The article presents StepSecurity Harden-Runner as a tool for runtime network, process, and supported file-write visibility, as well as outbound network policy enforcement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Railway reported that an attacker partially escaped build isolation, obtained a build credential, accessed build histories and internal source, and later used a separate OIDC configuration error to gain cloud access.","Railway stated that at most 1.85% of workspaces, approximately 100,000, could have had customer variables decrypted, and described this as an upper-bound estimate.","The article recommends isolating untrusted build jobs from privileged deployment jobs, using disposable execution environments, and limiting access to internal services and production credentials.","StepSecurity Harden-Runner provides runtime network and process monitoring with workflow-step context and can enforce reviewed outbound destination allowlists on supported runners.","The article recommends placing production cloud credential jobs behind GitHub environments with required reviewers and binding cloud trust policies to the intended repository and protected environment."],"insights":["A workflow can appear narrowly permissioned while still being risky if its runner host exposes inherited credentials, cached material, or access to internal services.","Network restrictions should be tested against real workflow behavior, including dependency downloads, artifact uploads, deployment endpoints, and failure-handling paths, before they are enforced.","A cloud role tied to a protected deployment environment should deny access to jobs that omit that environment, even if those jobs run in the same repository.","Moving file-change checks and other unrelated third-party Actions into a separate low-privilege job can keep them out of the job that receives production cloud credentials.","Outbound allowlists limit where a runner can connect, but they do not prevent an allowed service from being misused or govern stolen credentials used from another machine."],"referencedReports":[{"title":"Incident Report: October 21st Security Attack","url":"https://blog.railway.com/p/incident-report-october-security-incident","publisher":"railway","context":"The article relies on Railway’s incident report for its account of the October 2026 build-isolation escape, credential exposure, OIDC configuration error, and potential customer-variable impact.","category":"news","primary":true}],"body":"\u003cp\u003eRailway’s November 10, 2026 incident report describes an October 20–21 attack in which an attacker partially escaped build isolation and obtained a build infrastructure credential. Railway said misplaced trust in that credential enabled access to stored build histories and its internal source. A separate OIDC configuration error later enabled cloud access and access to credentials and systems used to retrieve and decrypt customer variables. Railway estimated that up to 1.85% of workspaces, about 100,000, could potentially have had variables decrypted, while emphasizing that this was an upper-bound figure.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that CI/CD build jobs are a security boundary because they execute code, handle credentials, and can access networks, services, artifacts, and deployments. It recommends separating untrusted builds from privileged deployment jobs, using isolated disposable runner environments, restricting access to internal services, and reviewing credentials inherited from runner hosts. It also recommends observing and restricting outbound connections, validating OIDC trust and cloud permissions, and placing production credential jobs behind protected GitHub environments with required approval. The article presents StepSecurity Harden-Runner as a tool for runtime network, process, and supported file-write visibility, as well as outbound network policy enforcement.\u003c/p\u003e\n"},{"n":39,"title":"Microsoft’s November 2026 Patch Tuesday addresses 1093 CVEs (CVE-2026-124194)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsoft-november-2026-patch-tuesday-addresses-1093-cves-cve-2026-124194","time":"19:01","priority":"MAY READ","score":40,"tldr":"Microsoft’s November 2026 Patch Tuesday fixes 1,093 CVEs, including 63 critical flaws, with urgent attention warranted for a zero-day Outlook spoofing issue (CVE-2026-124194) exploited in the wild and several more-likely-to-be-exploited remote code execution vulnerabilities in Active Directory, Exchange, and Schannel.","briefOverview":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components: 63 critical, 1,029 important, and one moderate. Elevation-of-privilege issues accounted for 48.9% of the fixes, followed by remote-code-execution issues at 27.1%. Microsoft Office Word, Excel, and SQL Server had the largest numbers of CVEs patched, with 65, 64, and 53 respectively.\u003c/p\u003e\n\n\u003cp\u003eThe moderate Outlook spoofing flaw CVE-2026-124194 was exploited in the wild as a zero-day and can allow an attacker who convinces a person to open a crafted Office file to obtain that person’s NTLMv2 hash for follow-on impersonation. Microsoft also fixed critical remote-code-execution vulnerabilities in Active Directory Domain Services, Exchange Server, and Windows Schannel, each assessed as “Exploitation More Likely.” Other notable more-likely-to-be-exploited issues include flaws in Visual Studio Code, Windows Network Address Translation, Windows Installer, the Windows kernel, and Windows Print Spooler Components.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory credited a security researcher who used Anthropic’s Claude for discovering CVE-2026-124194, without naming the Claude version. The update covers a wide range of Microsoft products, including Windows, Office, Exchange, SharePoint, SQL Server, Azure services, and Visual Studio. Tenable recommends applying patches as soon as possible and regularly scanning environments to find systems that remain unpatched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components, including 63 rated critical, 1,029 rated important, and one rated moderate.","CVE-2026-124194 is a moderate Microsoft Outlook spoofing flaw that Microsoft says was exploited in the wild and can allow an attacker to obtain a target’s NTLMv2 hash if the target opens a crafted Office file.","Critical vulnerabilities rated “Exploitation More Likely” include remote code execution flaws in Windows Active Directory Domain Services (CVE-2026-118146), Microsoft Exchange Server (CVE-2026-118207), and Windows Schannel (CVE-2026-119952).","Microsoft Office Word, Microsoft Office Excel, and SQL Server had the highest numbers of CVEs patched, with 65, 64, and 53 respectively.","Elevation of Privilege issues accounted for 48.9% of the vulnerabilities patched, while remote code execution issues accounted for 27.1%."],"insights":["The only moderate-rated issue, CVE-2026-124194 in Outlook, was already exploited in the wild, showing that severity ratings alone do not identify the most urgent patching priority.","Microsoft credited the discovery of CVE-2026-124194 to a researcher using Anthropic’s Claude, although the advisory did not identify a specific Claude version.","Several vulnerabilities assessed as “Exploitation More Likely” affect core enterprise services including Active Directory Domain Services, Exchange Server, Schannel, Windows NAT, and Visual Studio Code.","Although most fixes were rated important rather than critical, elevation-of-privilege issues made up nearly half of all patched vulnerabilities, at 48.9%.","Microsoft SharePoint Server’s CVE-2026-120002 has a CVSSv3 score of 9.9 but is rated important and assessed as “Exploitation Less Likely,” illustrating that the article distinguishes severity scores from expected exploitability."],"referencedReports":[{"title":"Microsoft’s November 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-Nov","publisher":"microsoft","context":"The article links Microsoft’s November 2026 Security Updates as the official source for the Patch Tuesday release.","category":"advisory","primary":true},{"title":"CVE-2026-124194 | Microsoft Outlook Spoofing Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-124194","publisher":"microsoft","context":"The article links Microsoft’s advisory for the Outlook zero-day that was exploited in the wild.","category":"advisory","primary":true},{"title":"CVE-2026-118146 | Windows Active Directory Domain Services Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-118146","publisher":"microsoft","context":"The article links Microsoft’s advisory for a critical Active Directory Domain Services remote code execution flaw.","category":"advisory","primary":true},{"title":"CVE-2026-120002 | Microsoft SharePoint Server Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-120002","publisher":"microsoft","context":"The article links Microsoft’s advisory for the SharePoint Server privilege elevation issue.","category":"advisory","primary":true},{"title":"CVE-2026-118207 | Microsoft Exchange Server Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-118207","publisher":"microsoft","context":"The article links Microsoft’s advisory for a critical Exchange Server remote code execution flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components: 63 critical, 1,029 important, and one moderate. Elevation-of-privilege issues accounted for 48.9% of the fixes, followed by remote-code-execution issues at 27.1%. Microsoft Office Word, Excel, and SQL Server had the largest numbers of CVEs patched, with 65, 64, and 53 respectively.\u003c/p\u003e\n\n\u003cp\u003eThe moderate Outlook spoofing flaw CVE-2026-124194 was exploited in the wild as a zero-day and can allow an attacker who convinces a person to open a crafted Office file to obtain that person’s NTLMv2 hash for follow-on impersonation. Microsoft also fixed critical remote-code-execution vulnerabilities in Active Directory Domain Services, Exchange Server, and Windows Schannel, each assessed as “Exploitation More Likely.” Other notable more-likely-to-be-exploited issues include flaws in Visual Studio Code, Windows Network Address Translation, Windows Installer, the Windows kernel, and Windows Print Spooler Components.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory credited a security researcher who used Anthropic’s Claude for discovering CVE-2026-124194, without naming the Claude version. The update covers a wide range of Microsoft products, including Windows, Office, Exchange, SharePoint, SQL Server, Azure services, and Visual Studio. Tenable recommends applying patches as soon as possible and regularly scanning environments to find systems that remain unpatched.\u003c/p\u003e\n"},{"n":41,"title":"IT threat evolution in Q3 2026. Mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q3-2026-mobile-statistics/121844/","time":"08:00","priority":"MAY READ","score":40,"tldr":"Kaspersky recorded 1.67 million blocked mobile threats in Q3 2026, with banking Trojans—especially Mamont—and packaged droppers driving much of the malicious-app activity. The quarter also saw AI-enabled Android fraud tools and iOS spyware campaigns exploiting DarkSword through compromised packages and fake App Store apps.","briefOverview":"\u003cp\u003eKaspersky blocked 1,668,368 attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in the previous quarter. It detected 378,456 malicious Android installation packages, including 119,688 mobile banking Trojan packages. Banking Trojans were the leading malicious-app category, representing 31.63% of detected malicious apps, while Mamont variants were the most active banking threats in actual attacks.\u003c/p\u003e\n\n\u003cp\u003eThe quarter included Android threats that used on-device AI models to interpret commands or examine screenshots and gallery images for banking data such as CVV codes. Attackers also continued packaging banking Trojans such as Mamont and Creduz into dropper apps, contributing to a sharp rise in that category, while Vo1d proxy Trojans could turn infected devices into internet relay nodes. On iOS, compromised Packagist PHP packages and a fake App Store crypto wallet tracker used the DarkSword exploit chain to deliver spyware that could steal keychain data, Wi-Fi passwords, SMS messages, photos, and cryptocurrency wallet recovery phrases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky blocked more than 1.66 million attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in Q2.","Trojan-Banker threats accounted for 31.63% of detected malicious mobile apps, and Kaspersky detected 119,688 mobile banking Trojan installation packages.","Kaspersky identified Android apps that used on-device AI models to interpret fraud commands or search screenshots and gallery images for banking information, including CVV codes.","The Mamont banking Trojan remained the most active banking threat in attacks, while Creduz accounted for the largest share of detected banking-Trojan packages.","iOS campaigns used the DarkSword exploit chain through infected Packagist packages and a fake App Store crypto wallet tracker, with spyware designed to steal data including keychain contents, Wi-Fi passwords, SMS messages, photos, and crypto wallet recovery phrases."],"insights":["Although total mobile-threat detections declined in Q3, the number of detected Android malware samples increased to 378,456, showing that fewer overall alerts did not mean fewer malicious apps were being identified.","The sharp increase in Trojan-Dropper detections was linked to criminals packaging known banking Trojans such as Mamont and Creduz inside delivery apps, while standalone banking Trojans still remained the largest malicious-app category.","Vo1d proxy Trojans can turn infected phones into internet relay points, consuming users’ paid data and potentially causing illegal activity or access to banned sites to appear to originate from the victim’s device.","The DarkSword campaign selectively loaded its hidden attack component on iOS devices through websites using infected Packagist PHP packages, while also injecting fraudulent casino links into affected sites.","The subscription Trojan Subscriber.bh was able to enroll victims in paid services by opening a subscription page invisibly and intercepting the text message containing the confirmation code."],"referencedReports":[{"title":"Packagist Themes: iOS Spyware","url":"https://socket.dev/blog/packagist-themes-ios-spyware","publisher":"socket","context":"Socket researchers discovered 13 infected PHP packages in Packagist that targeted iOS users with the DarkSword exploit kit and spyware.","category":"research","primary":false},{"title":"Threat Intelligence Analysis of FomoPeek App Store Poisoning and iOS Kernel Exploitation","url":"https://slowmist.medium.com/threat-intelligence-analysis-of-fomopeek-app-store-poisoning-and-ios-kernel-exploitation-e568762d11ca","publisher":"slowmist","context":"SlowMist researchers found the DarkSword exploit chain in FomoPeek, a fake App Store crypto wallet tracker designed to steal data.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky blocked 1,668,368 attacks involving mobile malware, adware, or unwanted software in Q3 2026, down from 1,996,823 in the previous quarter. It detected 378,456 malicious Android installation packages, including 119,688 mobile banking Trojan packages. Banking Trojans were the leading malicious-app category, representing 31.63% of detected malicious apps, while Mamont variants were the most active banking threats in actual attacks.\u003c/p\u003e\n\n\u003cp\u003eThe quarter included Android threats that used on-device AI models to interpret commands or examine screenshots and gallery images for banking data such as CVV codes. Attackers also continued packaging banking Trojans such as Mamont and Creduz into dropper apps, contributing to a sharp rise in that category, while Vo1d proxy Trojans could turn infected devices into internet relay nodes. On iOS, compromised Packagist PHP packages and a fake App Store crypto wallet tracker used the DarkSword exploit chain to deliver spyware that could steal keychain data, Wi-Fi passwords, SMS messages, photos, and cryptocurrency wallet recovery phrases.\u003c/p\u003e\n"},{"n":42,"title":"IT threat evolution in Q3 2026. Non-mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q3-2026-pc-iot-statistics/121843/","time":"08:00","priority":"MAY READ","score":40,"tldr":"Kaspersky’s Q3 2026 telemetry recorded more than 311 million web-based attacks, 23.7 million malicious or unwanted local objects, and ransomware targeting 81,556 users, with Qilin the most prolific extortion group by leak-site victims. The report also highlights active exploitation of enterprise product flaws, growing macOS supply-chain and stealer activity, and shifting IoT botnet attack patterns.","briefOverview":"\u003cp\u003eKaspersky’s Q3 2026 non-mobile threat report recorded more than 311 million attacks launched from online resources, with Web Anti-Virus responding to nearly 47 million unique links. File Anti-Virus blocked 23.7 million malicious and potentially unwanted objects, and 10.88% of users’ computers worldwide encountered at least one local malware threat during the quarter. Ransomware affected 81,556 unique users, while miner attacks affected 217,024 users.\u003c/p\u003e\n\n\u003cp\u003eQilin was the most prolific ransomware group by victims published on data leak sites, accounting for 15.39% of the total, and Kaspersky detected 4,470 new ransomware variants across three new families. The report notes ransomware-linked exploitation of flaws in products including Palo Alto Networks firewall software, SonicWall SMA1000 gateways, Microsoft SharePoint Server and Windows, VMware vCenter, WatchGuard Firebox, and JetBrains TeamCity. It also describes macOS threats delivered through compromised npm, PyPI, and Cargo packages, including stealers and backdoors targeting cryptocurrency wallets, service secrets, configurations, and API keys.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In Q3 2026, Kaspersky products blocked 311,083,655 attacks from online resources and Web Anti-Virus detected 46,936,926 unique URLs.","Kaspersky protected 81,556 unique users from ransomware attacks in Q3 2026 and detected 4,470 new ransomware variants across three new ransomware families.","Qilin accounted for 15.39% of victims published on ransomware groups’ data leak sites during the reporting period, making it the most prolific group in the review.","Kaspersky detected miner attacks affecting 217,024 unique users worldwide and identified 2,197 new miner variants in Q3 2026.","Kaspersky File Anti-Virus recorded 23,733,652 malicious and potentially unwanted objects, while 10.88% of users’ computers worldwide encountered a local malware threat at least once during the quarter."],"insights":["Qilin remained the leading ransomware group by victims listed on data leak sites for a second consecutive quarter, accounting for 15.39% of all published victims in Q3 2026.","Ransomware variant discovery rose to 4,470 new variants—more than 1.5 times the prior quarter’s count—even as only three new ransomware families were identified.","Turkmenistan had the highest reported local-malware exposure at 45.68% of Kaspersky users, while Bangladesh had the greatest web-malware exposure at 12.03%, showing that online and local infection risk were concentrated differently by location.","Pakistan accounted for 47.73% of Telnet attacks against Kaspersky IoT honeypots, while Bulgaria’s share of SSH attacks rose nearly fourfold from 5.50% in Q2 to 20.05% in Q3.","macOS threats during the quarter included compromised npm, PyPI, and Cargo packages that delivered tools designed to steal wallet data, service secrets, configurations, and API keys."],"referencedReports":[{"title":"Exploitation of CVE-2026-0257 Leads to Qilin Ransomware","url":"https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/","publisher":"arctic-wolf","context":"The article cites an Arctic Wolf report on Qilin exploiting CVE-2026-0257 in Palo Alto Networks firewall software to bypass authentication and compromise networks.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s Q3 2026 non-mobile threat report recorded more than 311 million attacks launched from online resources, with Web Anti-Virus responding to nearly 47 million unique links. File Anti-Virus blocked 23.7 million malicious and potentially unwanted objects, and 10.88% of users’ computers worldwide encountered at least one local malware threat during the quarter. Ransomware affected 81,556 unique users, while miner attacks affected 217,024 users.\u003c/p\u003e\n\n\u003cp\u003eQilin was the most prolific ransomware group by victims published on data leak sites, accounting for 15.39% of the total, and Kaspersky detected 4,470 new ransomware variants across three new families. The report notes ransomware-linked exploitation of flaws in products including Palo Alto Networks firewall software, SonicWall SMA1000 gateways, Microsoft SharePoint Server and Windows, VMware vCenter, WatchGuard Firebox, and JetBrains TeamCity. It also describes macOS threats delivered through compromised npm, PyPI, and Cargo packages, including stealers and backdoors targeting cryptocurrency wallets, service secrets, configurations, and API keys.\u003c/p\u003e\n"},{"n":46,"title":"Health-ISAC Daily Cyber Headlines – November 10, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-10-2026/","time":"09:14","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 10, 2026 roundup highlights multiple active cyber risks, including abuse of Qubole’s AWS access, a Fireworks AI breach, credential theft, exposed emergency records, Linux package-manager concerns, and exploitation of QNAP devices.","briefOverview":"\u003cp\u003eHealth-ISAC published its Daily Cyber Headlines for November 10, 2026. The roundup covers abuse of Qubole’s trusted AWS access, a Fireworks AI breach, and browser credential theft. It also includes exposed emergency records and Linux package-manager risk.\u003c/p\u003e\n\n\u003cp\u003eThe headlines report active exploitation targeting QNAP devices. They also cover Belgium’s warning on identity compromise. The article links to related Health-ISAC resources and news, including material on industrialized cybercrime, AI adversary assessment, and a cyberattack targeting France’s blood supply.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC published its Daily Cyber Headlines for November 10, 2026.","The roundup covers abuse of Qubole’s trusted access to AWS.","It includes a reported breach involving Fireworks AI and browser credential theft.","The headlines address exposed emergency records and Linux package-manager risk.","The roundup also covers active exploitation targeting QNAP devices and Belgium’s warning about identity compromise."],"insights":["The roundup highlights risk across several different environments at once, including cloud access, web browsers, emergency-record systems, Linux software tools, and QNAP devices.","Trusted access is specifically identified as an area of concern through the reported abuse of Qubole’s AWS access.","The inclusion of Belgium’s identity-compromise warning alongside browser credential theft points to identity-related issues as a recurring theme in the day’s headlines."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published its Daily Cyber Headlines for November 10, 2026. The roundup covers abuse of Qubole’s trusted AWS access, a Fireworks AI breach, and browser credential theft. It also includes exposed emergency records and Linux package-manager risk.\u003c/p\u003e\n\n\u003cp\u003eThe headlines report active exploitation targeting QNAP devices. They also cover Belgium’s warning on identity compromise. The article links to related Health-ISAC resources and news, including material on industrialized cybercrime, AI adversary assessment, and a cyberattack targeting France’s blood supply.\u003c/p\u003e\n"},{"n":28,"title":"Beyond the Alert: The Case for Rich Network Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/beyond-alert-case-for-rich-network-data.html","time":"11:38","priority":"MAY READ","score":35,"tldr":"Corelight argues that effective network incident response depends on rich, searchable network evidence—not just alerts—so analysts and AI can trace activity, validate findings, and understand an attack’s full scope. The sponsored article urges buyers to
