xchange for breakfast: Turla’s Cereal tricks are not for kids","url":"https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/","publisher":"eset","context":"The article relies on ESET's research report documenting Turla's use of the Cereal toolset against government Microsoft Exchange servers.","category":"research","primary":true}],"body":"\u003cp\u003eESET documented a late-2025 cyberespionage campaign in which the Russia-linked Turla group used a new toolset called Cereal against Microsoft Exchange servers at government organizations. The researchers first found the malware at a government body in Kazakhstan, then identified the same toolset at a Romanian government agency compromised on December 23, 2025. In Romania, the attackers selectively collected correspondence involving representatives of NATO and the European Union.\u003c/p\u003e\n\n\u003cp\u003eCerealBox injects into Exchange’s EdgeTransport.exe process and takes over existing email-handling functions, allowing it to inspect selected messages without registering a new transport agent or disrupting mail delivery. It can target messages based on sender, recipient, subject, and attached DOC, DOCX, or PDF files. Another component, CerealNeuron, receives encrypted commands through Exchange-like web paths, executes programs in memory, and returns encrypted results; ESET observed no external command-and-control infrastructure, with the compromised Exchange server serving as the attackers’ only control point.\u003c/p\u003e\n"},{"n":9,"title":"Railway breach leads to $740,000 in fraudulent AI charges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/apple/railway-breach-leads-to-740-000-in-fraudulent-ai-charges/","time":"22:20","priority":"SHOULD READ","score":88,"tldr":"Railway says attackers exploited two infrastructure flaws to access decrypted environment variables for up to 100,000 workspaces and generate about $740,000 in fraudulent AI usage. Customers should rotate secrets, while Railway says the attackers were removed and the vulnerabilities fixed.","briefOverview":"\u003cp\u003eRailway reported that attackers exploited two vulnerabilities in its infrastructure beginning October 20, gaining access to internal source code and credentials capable of decrypting customer environment variables. The company said up to 1.85% of its workspaces, approximately 100,000, may have been affected, although this is a maximum potential exposure estimate rather than a confirmed count of stolen secrets. Railway warned customers to rotate their secrets after detecting unauthorized access to systems that stored environment variables.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used stolen credentials to generate about $740,000 in unauthorized AI usage, and Railway said it is working with providers to reimburse customers and will cover charges providers do not refund. Railway also reset and notified 1,852 users whose linked-account tokens, including GitHub OAuth tokens and AI agent keys, were exposed. The company said the attackers were removed on October 21, the exploited flaws were remediated, and it found no evidence that customer Git repositories or databases were accessed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Railway said attackers exploited a previously unknown flaw in its build infrastructure on October 20, escaped filesystem isolation, and obtained an internal credential.","The attackers later exploited an improperly configured trust relationship to obtain credentials that could decrypt customer environment variables.","Railway estimates that decrypted environment variables for up to 1.85% of its workspaces, or about 100,000 workspaces, were potentially exposed.","Stolen credentials were used to generate approximately $740,000 in unauthorized AI usage, and Railway said it will cover charges that providers do not refund.","Railway said it removed the attackers from its systems on October 21, remediated the exploited vulnerabilities, and found no evidence of customer Git repository downloads or customer database access."],"insights":["Railway described the response as a 26-hour race in which attackers used AI-powered agents to probe multiple routes in parallel while defenders hardened those routes at the same time.","The reported 100,000-workspace figure is a maximum potential exposure estimate, not a confirmed count of workspaces whose secrets were stolen.","The attackers primarily searched for AI provider credentials, but also queried credentials for cloud, database, and payment services, showing that the potential impact extended beyond AI-service charges.","Railway linked the incident to Wiz's \"Black October\" campaign, which the article says also targeted Northflank, OpenCode, Warp, and Lightning AI.","Although Railway found no evidence of customer Git repository downloads or customer database access, it reset and notified 1,852 users whose linked-account tokens, including GitHub OAuth tokens and AI agent keys, were exposed."],"referencedReports":[{"title":"Black October for AI Developer Platforms","url":"https://www.wiz.io/blog/black-october-for-ai-developer-platforms","publisher":"wiz","context":"Railway linked the incident to Wiz's analysis of a recent campaign targeting AI developer platforms.","category":"research","primary":false}],"body":"\u003cp\u003eRailway reported that attackers exploited two vulnerabilities in its infrastructure beginning October 20, gaining access to internal source code and credentials capable of decrypting customer environment variables. The company said up to 1.85% of its workspaces, approximately 100,000, may have been affected, although this is a maximum potential exposure estimate rather than a confirmed count of stolen secrets. Railway warned customers to rotate their secrets after detecting unauthorized access to systems that stored environment variables.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used stolen credentials to generate about $740,000 in unauthorized AI usage, and Railway said it is working with providers to reimburse customers and will cover charges providers do not refund. Railway also reset and notified 1,852 users whose linked-account tokens, including GitHub OAuth tokens and AI agent keys, were exposed. The company said the attackers were removed on October 21, the exploited flaws were remediated, and it found no evidence that customer Git repositories or databases were accessed.\u003c/p\u003e\n"},{"n":22,"title":"Git Patches Flaw That Lets Malicious Repositories Execute Code During Recursive Clones","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/git-patches-flaw-that-lets-malicious.html","time":"19:23","priority":"SHOULD READ","score":88,"tldr":"Git patched CVE-2026-111760, a flaw that could let a malicious repository execute code during recursive clones by abusing an extremely long path to replace a submodule’s .git file with a symlink to attacker-controlled hooks. Users should update Git and bundled Git distributions promptly, and avoid recursively cloning untrusted repositories until patched.","briefOverview":"\u003cp\u003eGit released fixes for CVE-2026-111760, a flaw that can allow a malicious repository to run attacker-controlled code when it is recursively cloned along with its submodules. The issue is an integer truncation problem in Git’s index handling: an extremely long repository path can pass a safety check but later be written to disk under a shorter attacker-chosen name, including \u003ccode\u003e.git\u003c/code\u003e. Git 2.56.1 and maintenance releases for the 2.50 through 2.55 series reject such paths before their lengths can be truncated.\u003c/p\u003e\n\n\u003cp\u003eThe attack uses submodules because a freshly cloned submodule’s \u003ccode\u003e.git\u003c/code\u003e is a file, which can be replaced with a symbolic link to a directory containing malicious Git hooks or configuration. GitHub has applied fixes to github.com and GitHub Enterprise Cloud, and released fixed GitHub Enterprise Server versions 3.19.15, 3.20.11, 3.21.9, and 3.22.4. The releases also address five other flaws involving path traversal, a stack-memory corruption denial of service, an out-of-bounds read, heap-memory corruption during large merges, and unsafe fast-import features; until patched, GitHub advises users to avoid untrusted recursive clones, merges, binary patches, and fast-import streams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Git fixed CVE-2026-111760 in Git 2.56.1 and corresponding maintenance releases for versions 2.50 through 2.55.","The flaw allows a malicious repository with an extremely long path to bypass a safety check and cause Git to write a shortened path name chosen by an attacker, including .git.","During a recursive clone, an attacker can use the issue to replace a submodule’s .git file with a symbolic link to a directory containing malicious hooks or configuration, which can lead to code execution.","GitHub has applied the fixes to github.com and GitHub Enterprise Cloud, while fixed GitHub Enterprise Server versions include 3.19.15, 3.20.11, 3.21.9, and 3.22.4.","Until users install fixed versions, GitHub advises cloning only from trusted servers and avoiding recursive clones, merges, binary patches, and fast-import streams from untrusted sources."],"insights":["The recursive-clone flaw depends on submodules because a newly cloned submodule has a .git file, whereas Git will not replace a .git folder with a symbolic link.","Updating Git alone may not be sufficient if applications ship their own embedded copy of Git, so those applications also need updated versions.","Code-hosting servers may be exposed to the large-merge memory corruption flaw through git merge-tree when checking whether user-submitted pull or merge requests can be merged.","Servers that cannot immediately update can mitigate the conflict-marker-size issue by setting conflict-marker-size=7 in each repository’s info/attributes file or by disabling merge checks for untrusted repositories."],"referencedReports":[{"title":"Git 2.56.1 and maintenance release announcement","url":"https://lore.kernel.org/git/xmqqh5hosgw5.fsf@gitster.g/","publisher":"git-project","context":"The article cites the Git project’s release announcement for the fixed versions that reject extremely long paths before their lengths are truncated.","category":"advisory","primary":true},{"title":"Git security vulnerabilities announced","url":"https://github.blog/open-source/git/git-security-vulnerabilities-announced-7/","publisher":"github","context":"The article references GitHub’s detailed write-up explaining the fixes and advising users to update Git and applications that bundle it.","category":"advisory","primary":false}],"body":"\u003cp\u003eGit released fixes for CVE-2026-111760, a flaw that can allow a malicious repository to run attacker-controlled code when it is recursively cloned along with its submodules. The issue is an integer truncation problem in Git’s index handling: an extremely long repository path can pass a safety check but later be written to disk under a shorter attacker-chosen name, including \u003ccode\u003e.git\u003c/code\u003e. Git 2.56.1 and maintenance releases for the 2.50 through 2.55 series reject such paths before their lengths can be truncated.\u003c/p\u003e\n\n\u003cp\u003eThe attack uses submodules because a freshly cloned submodule’s \u003ccode\u003e.git\u003c/code\u003e is a file, which can be replaced with a symbolic link to a directory containing malicious Git hooks or configuration. GitHub has applied fixes to github.com and GitHub Enterprise Cloud, and released fixed GitHub Enterprise Server versions 3.19.15, 3.20.11, 3.21.9, and 3.22.4. The releases also address five other flaws involving path traversal, a stack-memory corruption denial of service, an out-of-bounds read, heap-memory corruption during large merges, and unsafe fast-import features; until patched, GitHub advises users to avoid untrusted recursive clones, merges, binary patches, and fast-import streams.\u003c/p\u003e\n"},{"n":43,"title":"Not All That Glitters Is Gold: Tracking CopperDragon’s Sparrow Framework Around the Globe","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/","time":"14:01","priority":"SHOULD READ","score":88,"tldr":"Check Point links three global espionage clusters—SilentDelivery, OceanGate, and DarkWire—to CopperDragon, a suspected China-nexus malware supplier behind the cross-platform Sparrow framework. The campaigns target telecoms, governments, military, and critical infrastructure using watering holes, compromised Linux servers, credential theft, stealthy kernel capabilities, and new backdoors including SquadC, CopperDoor, and CopperDNS.","briefOverview":"\u003cp\u003eCheck Point Research identified three intrusion clusters—SilentDelivery, OceanGate, and DarkWire—targeting high-profile organizations across Latin America, Asia, and Europe. The clusters affected telecommunications providers, government organizations, military entities, research institutions, and critical infrastructure. Researchers linked them through shared infrastructure features and malware similarities in the cross-platform Sparrow framework, and track the possible developer and supplier as CopperDragon. The report notes that shared malware or command-and-control infrastructure does not necessarily establish that separate intrusions were conducted by the same actor.\u003c/p\u003e\n\n\u003cp\u003eSilentDelivery used selectively compromised government, shipping, and IT or research websites to show visitors fake Chrome certificate warnings and offer a fraudulent “Certificate Fix” download. The installer deployed the SquadC Windows backdoor or a SparrowDoor variant, while the injected website code used status checks to decide whether to show the fake page and stopped doing so after a successful compromise. OceanGate began by exploiting an internet-facing Linux server, then deployed Linux backdoors, altered SSH components to capture credentials, and later moved into Windows systems using tools for remote access, file inventory, keylogging, and credential collection. Some Sparrow variants also included kernel-level capabilities intended to conceal files, processes, network activity, or backdoor communications.\u003c/p\u003e\n\n\u003cp\u003eDarkWire primarily targeted Latin American telecommunications operators and government entities, using CopperDoor and the DNS-tunneling CopperDNS backdoors. Its operators used DLL sideloading to load tools in memory, deployed proxies and an LSASS-dumping module for credential harvesting, and used SMB and WMI for movement across systems. The findings expand visibility into the Sparrow ecosystem and the distinct toolsets and access methods used across the three clusters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified three operational clusters—SilentDelivery, OceanGate, and DarkWire—linked by Sparrow malware code similarities and shared infrastructure features across Latin America, Asia, and Europe.","The researchers track CopperDragon as a possible developer and supplier of the cross-platform Sparrow framework used by China-nexus threat actors including FamousSparrow, Earth Estries, TropicTrooper, and UAT-9244.","SilentDelivery used compromised government, shipping, and IT or research websites to display fake Chrome certificate warnings and distribute SquadC or SparrowDoor through Trojanized MSI installers.","OceanGate began by compromising vulnerable internet-facing Linux servers, then used backdoors, Trojanized SSH software, credential theft, and lateral movement into Windows environments before deploying SparrowDoor.","DarkWire targeted telecommunications providers and government organizations, using CopperDoor and CopperDNS backdoors along with DLL sideloading, proxy tools, and LSASS memory dumping for credential harvesting."],"insights":["SilentDelivery’s injected website code checked a visitor’s IP address and location through repeated requests before showing the fake certificate warning, and it stopped showing the warning after the installed backdoor reported a successful compromise.","Some SparrowDoor versions can hide their communications behind a legitimate service on port 443 by intercepting network traffic and redirecting only connections from a specified source IP address to a concealed internal backdoor port.","OceanGate operators replaced legitimate SSH client and server components on Linux systems with altered versions that captured administrator credentials, enabling further movement to other Linux hosts.","The DarkWire CopperDNS variant used DNS MX queries for command-and-control communications, while its CopperDoor infrastructure used raw TCP wrapped in TLS rather than normal HTTPS.","The researchers caution that shared Sparrow malware or command-and-control infrastructure does not by itself prove that separate intrusions were conducted by the same operator."],"referencedReports":[{"title":"The Sparrow That Chirped Too Loud: FamousSparrow Attacks Using Updated SparrowDoor and the New","url":"https://medium.com/@dzaripova1177/the-sparrow-that-chirped-too-loud-famoussparrow-attacks-using-updated-sparrowdoor-and-the-new-29ac2d90544d","publisher":"Positive Technologies","context":"The article states that Positive Technologies reported part of the SilentDelivery cluster while this report was being finalized.","category":"research","primary":false},{"title":"Melofee","url":"https://exatrack.com/publications/melofee.html","publisher":"ExaTrack","context":"The article cites ExaTrack's publication as the source describing the Melofee backdoor, which it compares with SparrowShell.","category":"research","primary":false},{"title":"Beware of the SparroWock: Backdoor Bites Commands Catch","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/","publisher":"ESET Research","context":"The article references ESET's in-depth analysis of CopperDoor, also known as SparroWocky, and its observation that SparrowDoor was replaced by CopperDoor on compromised hosts.","category":"research","primary":false},{"title":"UAT-9244","url":"https://blog.talosintelligence.com/uat-9244/","publisher":"Cisco Talos","context":"The article references a Cisco Talos blog in connection with a TernDoor certificate used for comparison with Melofee and SparrowShell infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research identified three intrusion clusters—SilentDelivery, OceanGate, and DarkWire—targeting high-profile organizations across Latin America, Asia, and Europe. The clusters affected telecommunications providers, government organizations, military entities, research institutions, and critical infrastructure. Researchers linked them through shared infrastructure features and malware similarities in the cross-platform Sparrow framework, and track the possible developer and supplier as CopperDragon. The report notes that shared malware or command-and-control infrastructure does not necessarily establish that separate intrusions were conducted by the same actor.\u003c/p\u003e\n\n\u003cp\u003eSilentDelivery used selectively compromised government, shipping, and IT or research websites to show visitors fake Chrome certificate warnings and offer a fraudulent “Certificate Fix” download. The installer deployed the SquadC Windows backdoor or a SparrowDoor variant, while the injected website code used status checks to decide whether to show the fake page and stopped doing so after a successful compromise. OceanGate began by exploiting an internet-facing Linux server, then deployed Linux backdoors, altered SSH components to capture credentials, and later moved into Windows systems using tools for remote access, file inventory, keylogging, and credential collection. Some Sparrow variants also included kernel-level capabilities intended to conceal files, processes, network activity, or backdoor communications.\u003c/p\u003e\n\n\u003cp\u003eDarkWire primarily targeted Latin American telecommunications operators and government entities, using CopperDoor and the DNS-tunneling CopperDNS backdoors. Its operators used DLL sideloading to load tools in memory, deployed proxies and an LSASS-dumping module for credential harvesting, and used SMB and WMI for movement across systems. The findings expand visibility into the Sparrow ecosystem and the distinct toolsets and access methods used across the three clusters.\u003c/p\u003e\n"},{"n":44,"title":"Emerging Threat: (CVE-2026-89103) SAP Gateway Authentication Bypass via Default Access Control List","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-89103-sap-gateway-authentication-bypass-via-default-access-control-list/","time":"16:11","priority":"SHOULD READ","score":88,"tldr":"SAP Gateway CVE-2026-89103 is a critical pre-authentication authentication bypass that can let network-accessible attackers be treated as internal application servers, potentially enabling unauthorized actions and command execution. Organizations should urgently apply SAP Security Note 3798345, restrict TCP/33NN and TCP/48NN exposure, and replace default gateway ACL rules with explicit secinfo and reginfo controls.","briefOverview":"\u003cp\u003eCVE-2026-89103 is a critical SAP Gateway access-control flaw caused by a default access control list that can classify an external attacker as an internal application server. It has a CVSS v3.1 score of 10.0, requires only network access, and can be exploited before authentication. An attacker accepted in this way could carry out unauthorized actions in the SAP environment, with potentially severe effects on confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects SAP NetWeaver application servers and other SAP kernel-based systems with reachable gateway services, commonly on TCP/33NN and TCP/48NN. SAP released a kernel correction in Security Note 3798345, though published analysis indicates older kernels may also require the gw/acl_mode_proxy setting after patching. The article advises organizations to inventory exposed SAP gateways, block internet access to those ports, use explicit secinfo and reginfo rules, and monitor for unexpected external program registrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-89103 is a critical SAP Gateway access-control flaw with a CVSS v3.1 score of 10.0 that can allow a network-accessible attacker to be treated as an internal application server before authentication.","Affected systems include SAP NetWeaver application servers and other SAP kernel-based systems with reachable gateway ports, typically TCP/33NN and TCP/48NN.","SAP released a kernel update for the issue in SAP Security Note 3798345 during its November 2026 Security Patch Day, and published analysis indicates some older kernels may require the gw/acl_mode_proxy setting after patching.","The article recommends blocking internet access to SAP Gateway ports, replacing default gateway rules with explicit secinfo and reginfo entries, and monitoring gateway logs for unexpected external program registrations.","At the time of writing, the vulnerability was not listed in CISA's Known Exploited Vulnerabilities catalog and active exploitation had not been reported."],"insights":["A kernel update may not be sufficient by itself, because published analysis indicates older kernels may require the gw/acl_mode_proxy profile parameter to be set after patching.","Systems identified through service fingerprinting as SAP NetWeaver should be treated as potentially affected until their actual version and configuration are verified.","Public sources disagree on whether the vulnerable condition is the shipped default or depends on missing explicit secinfo and reginfo rules, making direct verification against SAP Security Note 3798345 important.","Observed exposure was concentrated in Information Technology and Communication Services, which the article links to service providers and large centrally managed SAP environments with internet-reachable application servers."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-89103 is a critical SAP Gateway access-control flaw caused by a default access control list that can classify an external attacker as an internal application server. It has a CVSS v3.1 score of 10.0, requires only network access, and can be exploited before authentication. An attacker accepted in this way could carry out unauthorized actions in the SAP environment, with potentially severe effects on confidentiality, integrity, and availability.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects SAP NetWeaver application servers and other SAP kernel-based systems with reachable gateway services, commonly on TCP/33NN and TCP/48NN. SAP released a kernel correction in Security Note 3798345, though published analysis indicates older kernels may also require the gw/acl_mode_proxy setting after patching. The article advises organizations to inventory exposed SAP gateways, block internet access to those ports, use explicit secinfo and reginfo rules, and monitor for unexpected external program registrations.\u003c/p\u003e\n"},{"n":15,"title":"Russian hackers compromised government email servers to steal NATO, EU correspondence","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-hackers-espionage-romania-kazakhstan","time":"13:00","priority":"SHOULD READ","score":86,"tldr":"ESET says the Russian FSB-linked Turla group compromised government Microsoft Exchange servers in Romania and Kazakhstan using its new Cereal toolkit to covertly intercept email, including correspondence with NATO and EU institutions.","briefOverview":"\u003cp\u003eESET attributed a campaign against government email servers in Romania and Kazakhstan to Turla, a Russian espionage group linked to Russia’s Federal Security Service. The group used a previously unknown toolkit called Cereal to monitor email traffic, steal selected messages, and maintain access to compromised Microsoft Exchange servers. ESET first found the toolkit on a Kazakh government server in November 2025 and later identified it at a Romanian government organization.\u003c/p\u003e\n\n\u003cp\u003eIn Romania, the malware was configured to collect email exchanged with NATO and European Union institutions, potentially exposing sensitive government and diplomatic correspondence. A component called CerealBox was embedded in an Exchange service that processes email, enabling attackers to identify and capture messages as they passed through the server. The attackers also used compromised Exchange servers as operational hubs instead of external control servers, a technique ESET said helps avoid detection and blocking; researchers could not determine the initial access method or how much information was taken.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET attributed a campaign targeting government email servers in Romania and Kazakhstan to Turla, a Russian espionage group linked to the Federal Security Service.","The attackers used a previously unknown toolkit called Cereal to monitor email traffic, steal selected messages, and retain access to compromised Microsoft Exchange servers.","In Romania, the malware was configured to collect emails exchanged with NATO and European Union institutions.","CerealBox was embedded in a Microsoft Exchange service that processes email traffic, allowing attackers to identify and capture messages of interest.","ESET could not determine how the attackers initially accessed the government servers or how much information they obtained."],"insights":["Turla used compromised Microsoft Exchange servers as its own command hub, reducing its reliance on outside infrastructure that defenders could detect, block, or shut down.","The Cereal toolkit was designed for long-term concealment by leaving little evidence on disk and operating within legitimate Exchange processes.","ESET said CerealBox’s method of embedding itself in an Exchange email-processing service had not previously been documented in other malware families.","ESET reported that about 70% of countries targeted by Turla since 2022 have been former Soviet republics or European countries with historical Soviet ties."],"referencedReports":[{"title":"Exchange for Breakfast: Turla’s Cereal Tricks Are Not for Kids","url":"https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/","publisher":"eset","context":"The article relies on ESET’s research attributing the government Exchange server compromises and Cereal toolkit to Turla.","category":"research","primary":true}],"body":"\u003cp\u003eESET attributed a campaign against government email servers in Romania and Kazakhstan to Turla, a Russian espionage group linked to Russia’s Federal Security Service. The group used a previously unknown toolkit called Cereal to monitor email traffic, steal selected messages, and maintain access to compromised Microsoft Exchange servers. ESET first found the toolkit on a Kazakh government server in November 2025 and later identified it at a Romanian government organization.\u003c/p\u003e\n\n\u003cp\u003eIn Romania, the malware was configured to collect email exchanged with NATO and European Union institutions, potentially exposing sensitive government and diplomatic correspondence. A component called CerealBox was embedded in an Exchange service that processes email, enabling attackers to identify and capture messages as they passed through the server. The attackers also used compromised Exchange servers as operational hubs instead of external control servers, a technique ESET said helps avoid detection and blocking; researchers could not determine the initial access method or how much information was taken.\u003c/p\u003e\n"},{"n":26,"title":"Russian Turla Hackers Use New Cereal Malware to Steal Emails From Government Exchange Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/russian-turla-hackers-use-new-cereal.html","time":"10:07","priority":"SHOULD READ","score":86,"tldr":"Russia-aligned Turla targeted government Exchange servers in Kazakhstan and Romania with its new modular Cereal toolkit, stealthily harvesting selected emails without relying on external command-and-control infrastructure.","briefOverview":"\u003cp\u003eESET reported that the Russia-aligned Turla group used a previously undocumented espionage toolkit called Cereal against two government entities in Kazakhstan and Romania in late 2025. The toolkit targets Microsoft Exchange servers to collect selected emails while avoiding external command-and-control infrastructure. ESET described Exchange servers as durable collection points, internal execution hubs, and places to conceal sophisticated .NET activity.\u003c/p\u003e\n\n\u003cp\u003eCereal consists of modular components that load and run .NET programs, receive commands, map the compromised network, and harvest emails. Its CerealBox component injects into the Exchange transport service, filters messages by hard-coded sender, recipient, subject, attachment-name, and attachment-type criteria, then compresses, encrypts, and stages selected emails for removal. In the Romanian government case, it was configured to collect emails involving NATO and European Union institutional addresses; other supported commands included querying Active Directory and WMI, extracting LSA Secrets, listing volume snapshots, and performing file operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET reported that Russia-aligned Turla used a previously undocumented toolset called Cereal against two government entities in Kazakhstan and Romania in late 2025.","Cereal operates on Microsoft Exchange servers and uses the compromised server itself for command handling rather than an external command-and-control system.","Its CerealBox component injects into the Exchange transport service to filter and collect selected email messages, including messages with DOC, DOCX, or PDF attachments.","Collected emails are compressed, encrypted, stored temporarily on disk, and later removed after being taken from the server.","In the Romanian government case, CerealBox was configured to collect emails involving NATO and European Union institutional addresses."],"insights":["Cereal minimizes obvious network indicators by using the compromised Exchange server for command handling instead of external command-and-control infrastructure.","The toolkit disguises its web-request listener as ordinary Exchange traffic and places its email collection component inside the legitimate EdgeTransport.exe process.","Turla delivers commands as separate compiled .NET programs, a design ESET said is supported by a likely internal framework that automates task-specific command compilation and packaging.","Beyond email collection, Cereal commands can enumerate Active Directory information, execute WMI queries, extract LSA Secrets, list volume snapshots, and perform file operations."],"referencedReports":[{"title":"Exchange for Breakfast: Turla's Cereal Tricks Are Not for Kids","url":"https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/","publisher":"eset","context":"The article relies on ESET's research report for its analysis of the Cereal toolset and its use against government Exchange servers.","category":"research","primary":true}],"body":"\u003cp\u003eESET reported that the Russia-aligned Turla group used a previously undocumented espionage toolkit called Cereal against two government entities in Kazakhstan and Romania in late 2025. The toolkit targets Microsoft Exchange servers to collect selected emails while avoiding external command-and-control infrastructure. ESET described Exchange servers as durable collection points, internal execution hubs, and places to conceal sophisticated .NET activity.\u003c/p\u003e\n\n\u003cp\u003eCereal consists of modular components that load and run .NET programs, receive commands, map the compromised network, and harvest emails. Its CerealBox component injects into the Exchange transport service, filters messages by hard-coded sender, recipient, subject, attachment-name, and attachment-type criteria, then compresses, encrypts, and stages selected emails for removal. In the Romanian government case, it was configured to collect emails involving NATO and European Union institutional addresses; other supported commands included querying Active Directory and WMI, extracting LSA Secrets, listing volume snapshots, and performing file operations.\u003c/p\u003e\n"},{"n":11,"title":"Japanese furniture giant Nitori says hackers stole 37.6M customer records","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japanese-furniture-giant-nitori-says-hackers-stole-376m-customer-records/","time":"20:54","priority":"SHOULD READ","score":85,"tldr":"Japanese furniture retailer Nitori says unauthorized access to its systems may have exposed up to 37.62 million customer records, including contact details and order information. Passwords and credit-card data were reportedly not affected.","briefOverview":"\u003cp\u003eNitori, a major Japanese furniture and home accessories retailer, says an unauthorized party accessed a company-managed system. The company detected the intrusion on November 6, 2026, blocked the access, and later determined that the party may have had access since mid-October. Up to 37.62 million records of personal information stored on its servers may have been leaked externally.\u003c/p\u003e\n\n\u003cp\u003eThe affected population may include individual customers, corporate members, and non-members who placed orders through Nitori stores or online shops. Potentially exposed data includes names, email and postal addresses, telephone numbers, dates of birth, gender, corporate contact details, and online order information. Nitori says registered-member passwords and credit-card information were not exposed, but warned that the data could be used in phishing and scam attempts. The company says it addressed system weaknesses, increased monitoring, notified relevant Japanese authorities, and plans to contact affected people by email or post.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nitori detected unauthorized access to a company-managed system on November 6, 2026, and its investigation indicates the intruder may have had access since mid-October.","The company says up to 37.62 million personal-information records may have been leaked externally.","Potentially exposed information includes customer and corporate-member contact details, dates of birth and gender for individual customers, and online order information.","Nitori stated that registered-member passwords and credit-card information were not exposed.","The company blocked the unauthorized access, addressed system weaknesses, increased monitoring, and warned customers to be alert for scam and phishing attempts."],"insights":["The potential exposure extends beyond registered shoppers to corporate members and non-members who placed orders, broadening the range of people who may need to watch for fraudulent contact.","Although Nitori says passwords and credit-card details were not exposed, the combination of names, contact information, and order details could still support convincing phishing or scam attempts, which the company specifically warned about.","The suspected access period began in mid-October but was detected on November 6, showing that the unauthorized access may have continued for several weeks before it was blocked."],"referencedReports":[],"body":"\u003cp\u003eNitori, a major Japanese furniture and home accessories retailer, says an unauthorized party accessed a company-managed system. The company detected the intrusion on November 6, 2026, blocked the access, and later determined that the party may have had access since mid-October. Up to 37.62 million records of personal information stored on its servers may have been leaked externally.\u003c/p\u003e\n\n\u003cp\u003eThe affected population may include individual customers, corporate members, and non-members who placed orders through Nitori stores or online shops. Potentially exposed data includes names, email and postal addresses, telephone numbers, dates of birth, gender, corporate contact details, and online order information. Nitori says registered-member passwords and credit-card information were not exposed, but warned that the data could be used in phishing and scam attempts. The company says it addressed system weaknesses, increased monitoring, notified relevant Japanese authorities, and plans to contact affected people by email or post.\u003c/p\u003e\n"},{"n":25,"title":"Three China-Nexus Espionage Campaigns Linked Through Sparrow Malware Ecosystem","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/three-china-nexus-espionage-campaigns.html","time":"17:43","priority":"SHOULD READ","score":85,"tldr":"Check Point linked three China-nexus espionage clusters—SilentDelivery, OceanGate, and DarkWire—to the CopperDragon-operated Sparrow malware ecosystem targeting telecoms, governments, and critical infrastructure across Asia, Europe, and Latin America. The campaigns use watering holes, compromised internet-facing Linux servers, and DLL sideloading to deploy modular backdoors, steal credentials, and maintain stealthy access.","briefOverview":"\u003cp\u003eCheck Point Research linked three China-nexus espionage clusters—SilentDelivery, OceanGate, and DarkWire—to the Sparrow malware ecosystem, which it attributes to a tool developer it calls CopperDragon. The campaigns targeted telecommunications providers, government organizations, military entities, research institutions, and critical infrastructure across Latin America, Asia, and Europe. Each cluster used different initial-access methods, including compromised internet-facing infrastructure and highly selective watering-hole attacks on legitimate websites.\u003c/p\u003e\n\n\u003cp\u003eSilentDelivery injected obfuscated code into compromised websites and showed selected Windows users a fake Google Chrome certificate warning that urged them to install a supposed Certificate Fix utility, which delivered SquadC or a SparrowDoor variant. OceanGate compromised Linux servers, deployed AnnobinDoor and SparrowShell, harvested credentials, and moved into Windows systems to deploy tools for reconnaissance, keylogging, credential collection, and remote access. DarkWire focused on Latin American telecommunications and government organizations, using DLL sideloading to deploy CopperDoor, CopperDNS, proxy tools, and an LSASS-dumping component while placing tools in existing system paths to reduce its footprint.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research linked the SilentDelivery, OceanGate, and DarkWire activity clusters through the Sparrow malware ecosystem and attributes its development to an entity it calls CopperDragon.","The campaigns targeted telecommunications providers, government organizations, military entities, research institutions, and critical infrastructure across Latin America, Asia, and Europe.","SilentDelivery used compromised websites to display fake Google Chrome certificate warnings and distribute SquadC or a SparrowDoor variant through a supposed Certificate Fix utility.","OceanGate compromised internet-facing Linux servers, used AnnobinDoor and SparrowShell, and then moved into Windows environments to deploy tools for remote access, reconnaissance, keystroke collection, and credential theft.","DarkWire targeted telecommunications and government organizations in Latin America using CopperDoor and CopperDNS, relying heavily on DLL sideloading and infrastructure located near victim organizations."],"insights":["SilentDelivery’s injected website code checked whether visitors used Windows, sometimes verified the intended website domain, and repeatedly contacted a control server to profile visitors by IP address and location before serving the fake certificate warning.","OceanGate used kernel-level packet interception to make a SparrowDoor backdoor appear to communicate through a legitimate externally available service port, such as port 443, while secretly redirecting selected connections to an internal high-numbered port.","DarkWire operators avoided creating new folders and instead placed their tools in existing system paths, reducing obvious traces on compromised machines.","CopperDoor command-and-control servers were often hosted on Latin American IP addresses in the same country as the targeted organization, which Check Point said could help malicious traffic blend with normal local network activity.","SparrowShell shared code and infrastructure similarities with the previously documented Mélofée Linux malware, raising the possibility that CopperDragon also developed and supplied Mélofée."],"referencedReports":[{"title":"Not All That Glitters Is Gold: Tracking CopperDragon's Sparrow Framework Around the Globe","url":"https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/","publisher":"check-point-research","context":"The article is based on Check Point Research's tracking and technical report linking SilentDelivery, OceanGate, and DarkWire to the Sparrow ecosystem.","category":"research","primary":true},{"title":"The Sparrow That Chirped Too Loud: FamousSparrow Attacks Using Updated SparrowDoor and the New SquadC","url":"https://medium.com/@dzaripova1177/the-sparrow-that-chirped-too-loud-famoussparrow-attacks-using-updated-sparrowdoor-and-the-new-29ac2d90544d","publisher":"positive-technologies","context":"The article cites this August 2026 report as indicating that the SilentDelivery method also targeted entities in Egypt and the Philippines.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research linked three China-nexus espionage clusters—SilentDelivery, OceanGate, and DarkWire—to the Sparrow malware ecosystem, which it attributes to a tool developer it calls CopperDragon. The campaigns targeted telecommunications providers, government organizations, military entities, research institutions, and critical infrastructure across Latin America, Asia, and Europe. Each cluster used different initial-access methods, including compromised internet-facing infrastructure and highly selective watering-hole attacks on legitimate websites.\u003c/p\u003e\n\n\u003cp\u003eSilentDelivery injected obfuscated code into compromised websites and showed selected Windows users a fake Google Chrome certificate warning that urged them to install a supposed Certificate Fix utility, which delivered SquadC or a SparrowDoor variant. OceanGate compromised Linux servers, deployed AnnobinDoor and SparrowShell, harvested credentials, and moved into Windows systems to deploy tools for reconnaissance, keylogging, credential collection, and remote access. DarkWire focused on Latin American telecommunications and government organizations, using DLL sideloading to deploy CopperDoor, CopperDNS, proxy tools, and an LSASS-dumping component while placing tools in existing system paths to reduce its footprint.\u003c/p\u003e\n"},{"n":34,"title":"Apple Patches iMessage Group Chat Privacy Flaws and Bluetooth Pairing Vulnerabilities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/apple-patches-imessage-group-chat.html","time":"10:16","priority":"SHOULD READ","score":85,"tldr":"Apple released updates fixing two iMessage group-chat privacy flaws that could expose messages or allow unauthorized participants, along with an actively exploited Brotli decoder vulnerability and Bluetooth/AirPlay pairing issues. Users should apply the available iOS, iPadOS, macOS, and watchOS updates where applicable.","briefOverview":"\u003cp\u003eApple released updates to address two iMessage group-chat flaws. One issue, CVE-2026-113961, could allow a remote attacker to join a group chat and receive its messages, while CVE-2026-113960 could allow a person added to a group to access messages sent before they joined. Apple did not say whether either flaw has been exploited, what an attacker would need, whether unauthorized participants would be visible to group members, or whether every member must update for protection.\u003c/p\u003e\n\n\u003cp\u003eThe updates also fix CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that could allow malicious input to corrupt memory. CISA added the Brotli flaw to its Known Exploited Vulnerabilities catalog on October 27, although Apple’s notes do not mention attacks using it. All nine updates also address Bluetooth and AirPlay flaws, including issues that could permit pairing without user interaction or bypass limits on pairing-code attempts; Apple’s iOS 18.7.12 and watchOS 26.6.1 notes do not list the iMessage or Brotli fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple released updates that fix two iMessage group-chat flaws, including one that could allow a remote attacker to join a group chat and receive its messages.","The iMessage flaws are tracked as CVE-2026-113961, an authorization issue addressed through improved validation, and CVE-2026-113960, which could expose messages sent before a person joined a group.","The affected updates also fix CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that CISA added to its Known Exploited Vulnerabilities catalog on October 27.","All nine updates address Bluetooth and AirPlay issues, including flaws that could allow pairing without user interaction or bypass limits on pairing-code attempts.","Apple’s notes do not state whether the iMessage flaws were exploited, whether all group members must update for protection, or whether certain iOS 18.7.12 and watchOS 26.6.1 devices are affected."],"insights":["Apple’s documentation leaves key protection questions unanswered, including whether an unauthorized iMessage participant would be visible to group members and whether every member must install updates to be protected.","The Brotli issue is especially notable because CISA has already listed it in its Known Exploited Vulnerabilities catalog, while Apple’s notes do not describe attacks using it.","Apple’s iOS 18.7.12 and watchOS 26.6.1 notes omit the iMessage and Brotli fixes, and Apple does not say whether devices on those versions are affected.","The Bluetooth-related fixes cover more than nearby pairing: one pairing-code attempt-limit bypass could be performed by an attacker on the same network."],"referencedReports":[{"title":"About the security content of iOS 27.2.1 and iPadOS 27.2.1","url":"https://support.apple.com/en-us/149715","publisher":"apple","context":"The article cites Apple’s security advisory as describing all three flaws, including the two iMessage issues and the Brotli flaw.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog: CVE-2026-111497","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-111497","publisher":"cisa","context":"The article cites CISA’s catalog entry to note that the Brotli decoder flaw was added to the Known Exploited Vulnerabilities catalog on October 27.","category":"advisory","primary":false}],"body":"\u003cp\u003eApple released updates to address two iMessage group-chat flaws. One issue, CVE-2026-113961, could allow a remote attacker to join a group chat and receive its messages, while CVE-2026-113960 could allow a person added to a group to access messages sent before they joined. Apple did not say whether either flaw has been exploited, what an attacker would need, whether unauthorized participants would be visible to group members, or whether every member must update for protection.\u003c/p\u003e\n\n\u003cp\u003eThe updates also fix CVE-2026-111497, an out-of-bounds write in Google’s Brotli decoder that could allow malicious input to corrupt memory. CISA added the Brotli flaw to its Known Exploited Vulnerabilities catalog on October 27, although Apple’s notes do not mention attacks using it. All nine updates also address Bluetooth and AirPlay flaws, including issues that could permit pairing without user interaction or bypass limits on pairing-code attempts; Apple’s iOS 18.7.12 and watchOS 26.6.1 notes do not list the iMessage or Brotli fixes.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft releases Windows 10 KB5131096 extended security update","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-windows-10-kb5131096-extended-security-update/","time":"20:04","priority":"SHOULD READ","score":84,"tldr":"Microsoft released the Windows 10 ESU update KB5131096, bringing systems to build 19045.7846 and delivering November 2026 security fixes. It also resolves remaining USB Audio Class 1.0 issues and fixes printer, Remote Desktop, PowerShell signing, and Cuba daylight-saving-time problems.","briefOverview":"\u003cp\u003eMicrosoft released KB5131096, a Windows 10 extended security update containing the November 2026 Patch Tuesday security fixes and several bug fixes. It is available through Windows Update for Windows 10 Enterprise LTSC users and systems enrolled in the Extended Security Updates program. After installation, Windows 10 reaches build 19045.7846, while Windows 10 Enterprise LTSC 2021 reaches build 19044.7846.\u003c/p\u003e\n\n\u003cp\u003eThe update incorporates fixes from a Patch Tuesday release that addressed 1,235 vulnerabilities across Microsoft products, including an actively exploited Outlook zero-day flaw. It fixes failures when adding Active Directory-published printers, Remote Desktop policy and shadow-connection issues, and remaining USB Audio Class 1.0 problems introduced by the September 2026 security updates. KB5131096 also updates Cuba daylight-saving-time rules and applies stricter encoding validation to signed PowerShell scripts, which may require affected scripts to be saved as valid UTF-8 with a byte order mark and signed again.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the Windows 10 KB5131096 extended security update, which updates Windows 10 to build 19045.7846 and Windows 10 Enterprise LTSC 2021 to build 19044.7846.","The update is available through Windows Update for Windows 10 Enterprise LTSC users and users enrolled in the Extended Security Updates program.","KB5131096 includes November 2026 Patch Tuesday security fixes, which addressed 1,235 vulnerabilities across Microsoft products, including an actively exploited Outlook zero-day flaw.","The update fixes printer-addition failures, certain Remote Desktop policy and shadow-connection problems, and remaining USB Audio Class 1.0 issues introduced by September 2026 security updates.","KB5131096 also changes Cuba daylight-saving-time rules and introduces stricter encoding validation for signed PowerShell scripts."],"insights":["Organizations using signed PowerShell scripts should check them for invalid UTF-8 encoding, because KB5131096 can cause previously accepted scripts to fail signature validation unless they are saved as valid UTF-8 with a byte order mark and signed again.","KB5131096 resolves the remaining USB Audio Class 1.0 problems caused by the September 2026 security updates, including devices failing to start with Code 10 errors and unresponsive volume controls.","The update changes Cuba time settings for an extended 2026–2027 daylight-saving period, keeping Cuba on UTC-04:00 until November 2027.","The update includes security fixes from a Patch Tuesday release that addressed an actively exploited Outlook zero-day flaw, making installation particularly important for eligible Windows 10 systems."],"referencedReports":[{"title":"KB5131096: Windows 10 21H2 and 22H2 security update","url":"https://support.microsoft.com/en-us/servicing/os/windows-10/2026/11/kb5131096-windows-10-21h2-22h2-security-update","publisher":"microsoft","context":"The article links Microsoft’s update advisory as the source for the KB5131096 security update and its fixes.","category":"advisory","primary":true},{"title":"Encoding Guidance for Signed PowerShell Scripts","url":"https://support.microsoft.com/en-us/help/5135999","publisher":"microsoft","context":"The article directs readers to this Microsoft guidance for resolving signed PowerShell script failures caused by stricter encoding validation.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft released KB5131096, a Windows 10 extended security update containing the November 2026 Patch Tuesday security fixes and several bug fixes. It is available through Windows Update for Windows 10 Enterprise LTSC users and systems enrolled in the Extended Security Updates program. After installation, Windows 10 reaches build 19045.7846, while Windows 10 Enterprise LTSC 2021 reaches build 19044.7846.\u003c/p\u003e\n\n\u003cp\u003eThe update incorporates fixes from a Patch Tuesday release that addressed 1,235 vulnerabilities across Microsoft products, including an actively exploited Outlook zero-day flaw. It fixes failures when adding Active Directory-published printers, Remote Desktop policy and shadow-connection issues, and remaining USB Audio Class 1.0 problems introduced by the September 2026 security updates. KB5131096 also updates Cuba daylight-saving-time rules and applies stricter encoding validation to signed PowerShell scripts, which may require affected scripts to be saved as valid UTF-8 with a byte order mark and signed again.\u003c/p\u003e\n"},{"n":13,"title":"Binance warns of iOS flaw that could leak crypto wallet secrets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/binance-warns-of-ios-flaw-that-could-leak-crypto-wallet-secrets/","time":"15:59","priority":"SHOULD READ","score":84,"tldr":"Binance warns that a publicly disclosed iOS sandbox-escape technique, “worse_query,” could let malicious sideloaded apps access other apps’ local files, including crypto seed phrases and private keys. Users should update to Apple’s latest iOS releases, remove untrusted apps, and move funds to a new wallet from a clean device if compromise is suspected.","briefOverview":"\u003cp\u003eBinance warned that a flaw affecting iOS 26.7.1, 27.0.1, and 27.2 could allow malicious third-party apps to read local files from other apps. This could expose cryptocurrency seed phrases, private keys, and login credentials, and Binance said the issue affects the broader iOS ecosystem rather than only its own app. No cryptocurrency losses have been confirmed so far.\u003c/p\u003e\n\n\u003cp\u003eThe issue is associated with the publicly disclosed “worse_query” iOS sandbox-escape technique, which can allow an app to access another app’s stored data. A proof-of-concept tool called WQ Files reportedly can browse, export, edit, and delete other apps’ data without a jailbreak, but it must be installed on the device, potentially through an untrusted sideloaded app. Apple released iOS 27.2.1, 26.7.3, and 18.7.12 to address nine flaws, including CVE-2026-113963, though it is unclear whether that CVE is the same issue Binance described.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binance warned that iOS 26.7.1, 27.0.1, and 27.2 may allow malicious third-party apps to read local files from other apps, exposing seed phrases, private keys, and login credentials.","The publicly disclosed “worse_query” technique is described as an iOS sandbox escape that can let an app access the storage of other apps.","A proof-of-concept tool named WQ Files can browse, export, edit, and delete data from other apps without a jailbreak, and has been confirmed to work on the affected iOS versions.","Apple released iOS 27.2.1, 26.7.3, and 18.7.12 on November 9 to address nine flaws, including CVE-2026-113963, which could let an app access sensitive user data.","Binance said no cryptocurrency losses have been confirmed and advised users to update iOS, remove unnecessary or untrusted apps, and move funds to a new wallet on a clean device if compromise is suspected."],"insights":["The reported risk is not limited to the Binance app: Binance says the underlying iOS issue could expose files held by other apps across the ecosystem.","The publicly available WQ Files proof of concept reportedly works without a jailbreak, but it must first be installed on the iPhone, such as through an untrusted sideloaded app.","It remains unclear whether Apple’s CVE-2026-113963 fix addresses the same issue, because the reported sensitive-data access for that CVE involved App Intents rather than App Group containers.","For suspected compromise, Binance recommends more than changing a password: it advises creating a new wallet on a clean device, transferring funds, and resetting all active login sessions."],"referencedReports":[{"title":"Apple security updates","url":"https://support.apple.com/en-us/149715","publisher":"apple","context":"The article cites Apple’s security update notice for iOS 27.2.1, 26.7.3, and 18.7.12, which addressed nine flaws including CVE-2026-113963.","category":"advisory","primary":false},{"title":"worse_query","url":"https://github.com/forcequitOS/worse_query/","publisher":"forcequitos","context":"The article links to the public disclosure of the worse_query iOS sandbox-escape technique used by the WQ Files proof-of-concept tool.","category":"research","primary":true}],"body":"\u003cp\u003eBinance warned that a flaw affecting iOS 26.7.1, 27.0.1, and 27.2 could allow malicious third-party apps to read local files from other apps. This could expose cryptocurrency seed phrases, private keys, and login credentials, and Binance said the issue affects the broader iOS ecosystem rather than only its own app. No cryptocurrency losses have been confirmed so far.\u003c/p\u003e\n\n\u003cp\u003eThe issue is associated with the publicly disclosed “worse_query” iOS sandbox-escape technique, which can allow an app to access another app’s stored data. A proof-of-concept tool called WQ Files reportedly can browse, export, edit, and delete other apps’ data without a jailbreak, but it must be installed on the device, potentially through an untrusted sideloaded app. Apple released iOS 27.2.1, 26.7.3, and 18.7.12 to address nine flaws, including CVE-2026-113963, though it is unclear whether that CVE is the same issue Binance described.\u003c/p\u003e\n"},{"n":29,"title":"SGLang RCE Exploit Breaches NEAR AI, Steals Data From 18 Agents and About 100 Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sglang-rce-exploit-breaches-near-ai.html","time":"19:19","priority":"SHOULD READ","score":84,"tldr":"An attacker exploited an SGLang remote-code-execution flaw to compromise a NEAR AI inference server, potentially exposing requests processed there and stealing account data from about 100 users plus data from 18 AI agents. NEAR AI says it patched the flaw, rotated credentials, revoked exposed API keys, and notified confirmed affected users.","briefOverview":"\u003cp\u003eAn attacker exploited a remote-code-execution flaw in the open-source SGLang inference engine and ran code on a NEAR AI inference server last Sunday. NEAR AI said the attacker could potentially have viewed requests processed by that server, including requests sent in confidential mode. Although those requests are processed inside a trusted execution environment intended to keep them private, NEAR AI said that protection does not prevent attacks against vulnerable software running within it.\u003c/p\u003e\n\n\u003cp\u003eThe attacker later accessed an internal system behind NEAR AI\u0026rsquo;s deprecated Private Chat product and downloaded names and email addresses for about 100 users, along with plan and balance details for some accounts. NEAR AI said it found no evidence that stored Private Chat conversations or uploaded files were accessed, but the attacker took chat histories, settings, and logs from 18 AI agents on an older deployment that was not inside the trusted environment. Two customers\u0026rsquo; NEAR AI Cloud API keys were exposed in logs and revoked. NEAR AI patched the SGLang flaw, rotated credentials and tokens, took Private Chat offline, restored NEAR AI Cloud access, and contacted users whose accounts or agents it confirmed were accessed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker exploited a remote-code-execution flaw in SGLang to run code on a NEAR AI inference server last Sunday.","NEAR AI said the attacker may have been able to view requests processed by the affected server, including requests sent in confidential mode.","The attacker downloaded account details, including names and email addresses, for about 100 users of the deprecated Private Chat product.","The attacker accessed 18 AI agents on an older NEAR AI Agents deployment and took data including chat histories, settings, and logs.","NEAR AI patched the SGLang flaw on its inference servers, revoked active sessions and administrator credentials, replaced agent tokens, and revoked two exposed customer API keys."],"insights":["The incident shows that confidential processing environments cannot protect data when the software running inside them contains a flaw that lets an attacker execute code.","The attacker’s path from an inference server to a deprecated Private Chat system and an older AI-agent deployment highlights that older systems remained reachable after the initial compromise.","NEAR AI confirmed specific data theft from Private Chat and 18 agents, but it did not say whether people whose requests passed through the affected inference server were notified.","The company did not identify a CVE, affected SGLang versions, or a public SGLang fix, limiting the public technical detail available about the flaw.","Two customers’ cloud API keys were exposed through logs rather than directly identified as stored account data, and NEAR AI revoked both keys."],"referencedReports":[{"title":"Browser AI E2EE","url":"https://brave.com/blog/browser-ai-e2ee/","publisher":"brave","context":"The article cites Brave's October 15 technical write-up stating that its Leo assistant runs chats with the GLM 5.3 Flash model inside a NEAR AI-operated trusted execution environment.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker exploited a remote-code-execution flaw in the open-source SGLang inference engine and ran code on a NEAR AI inference server last Sunday. NEAR AI said the attacker could potentially have viewed requests processed by that server, including requests sent in confidential mode. Although those requests are processed inside a trusted execution environment intended to keep them private, NEAR AI said that protection does not prevent attacks against vulnerable software running within it.\u003c/p\u003e\n\n\u003cp\u003eThe attacker later accessed an internal system behind NEAR AI\u0026rsquo;s deprecated Private Chat product and downloaded names and email addresses for about 100 users, along with plan and balance details for some accounts. NEAR AI said it found no evidence that stored Private Chat conversations or uploaded files were accessed, but the attacker took chat histories, settings, and logs from 18 AI agents on an older deployment that was not inside the trusted environment. Two customers\u0026rsquo; NEAR AI Cloud API keys were exposed in logs and revoked. NEAR AI patched the SGLang flaw, rotated credentials and tokens, took Private Chat offline, restored NEAR AI Cloud access, and contacted users whose accounts or agents it confirmed were accessed.\u003c/p\u003e\n"},{"n":30,"title":"Blind Eagle Uses Fake Court Notices to Deliver Remote Access Trojan Across Latin America","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/blind-eagle-uses-fake-court-notices-to.html","time":"15:58","priority":"SHOULD READ","score":84,"tldr":"Blind Eagle (APT-C-36) is running a large phishing campaign across Latin America that impersonates judicial and administrative notices to deliver an AsyncRAT/DCRat-derived remote-access trojan. The campaign uses weaponized SVG files, HTML smuggling, AMSI/ETW bypasses, and Windows Startup persistence, with Colombia a key target.","briefOverview":"\u003cp\u003eBlind Eagle, also known as APT-C-36, has launched a phishing campaign against organizations in Latin America using fake judicial and administrative notices in Spanish and Portuguese. The messages target people handling cases, contracts, and institutional service requests and use themes including court notifications, Fiscalía notices, tutela proceedings, and administrative documents. Zenox attributed the activity to a Brazilian operational cluster based on its infrastructure, operating time zone, lures, and regional targeting. Colombia remains a priority target, although the phishing wave was not limited to Colombian organizations.\u003c/p\u003e\n\n\u003cp\u003eOne identified lure used a weaponized SVG file that displayed a fake Colombian Fiscalía General de la Nación webpage and created a ZIP archive locally in the browser through HTML smuggling. The archive contained a JavaScript dropper posing as Network Configuration Auditor version 2.7.298, which collected system and network details before launching a Visual Basic Script. That script bypassed Windows AMSI and ETW monitoring, displayed a fake criminal-citation page, removed the original XHTML file and Mark of the Web metadata, and established startup-folder persistence. PowerShell then decoded and ran an AsyncRAT fork with DCRat lineage in memory.\u003c/p\u003e\n\n\u003cp\u003eThe campaign puts sensitive legal, financial, and institutional information at risk because it targets judicial, fiscal, administrative, and educational organizations. Zenox observed nearly 3,300 malicious emails in a targeted wave between late October and early November 2026, but could not confirm successful compromises. The article notes that uneven security maturity in portions of Colombia\u0026rsquo;s public, financial, critical, and private-sector infrastructure may increase opportunities for compromise, data theft, fund theft, or credential reuse.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blind Eagle, also known as APT-C-36, is using judicial and administrative phishing lures in Portuguese and Spanish to target organizations in Latin America.","The campaign uses a weaponized SVG attachment impersonating Colombia’s Fiscalía General de la Nación to create a ZIP file in the victim’s browser.","The ZIP archive contains a JavaScript dropper that gathers system information before launching scripts that bypass Windows security monitoring and establish startup persistence.","The final payload is an AsyncRAT fork with DCRat lineage that is decoded and launched in memory using PowerShell.","Zenox observed nearly 3,300 malicious emails from late October to early November 2026 but could not confirm successful compromises."],"insights":["The use of an SVG attachment to build a password-protected ZIP archive inside the browser is designed to avoid email security controls that may inspect conventional attachments.","The JavaScript dropper checks for Portuguese- and Spanish-localized directories while collecting system and network details, indicating that language and regional environment are part of its host profiling.","The malware displays a fake criminal-citation page while it disables Windows security monitoring and installs itself to run at startup, combining distraction with persistence.","Zenox linked the activity to a Brazilian operational cluster based on its infrastructure, operating time zone, Portuguese and Spanish lures, and regional targeting.","The campaign’s focus on judicial, fiscal, administrative, and educational organizations places legal, financial, and institutional information at particular risk."],"referencedReports":[{"title":"Last Heist: New APT-C-36 Infection Wave in LATAM","url":"https://zenox.ai/en/last-heist-new-apt-c-36-infection-wave-in-latam/","publisher":"zenox","context":"The article relies on Zenox's report for details of Blind Eagle's phishing campaign, infection chain, targeting, and attribution to a Brazilian operational cluster.","category":"research","primary":true}],"body":"\u003cp\u003eBlind Eagle, also known as APT-C-36, has launched a phishing campaign against organizations in Latin America using fake judicial and administrative notices in Spanish and Portuguese. The messages target people handling cases, contracts, and institutional service requests and use themes including court notifications, Fiscalía notices, tutela proceedings, and administrative documents. Zenox attributed the activity to a Brazilian operational cluster based on its infrastructure, operating time zone, lures, and regional targeting. Colombia remains a priority target, although the phishing wave was not limited to Colombian organizations.\u003c/p\u003e\n\n\u003cp\u003eOne identified lure used a weaponized SVG file that displayed a fake Colombian Fiscalía General de la Nación webpage and created a ZIP archive locally in the browser through HTML smuggling. The archive contained a JavaScript dropper posing as Network Configuration Auditor version 2.7.298, which collected system and network details before launching a Visual Basic Script. That script bypassed Windows AMSI and ETW monitoring, displayed a fake criminal-citation page, removed the original XHTML file and Mark of the Web metadata, and established startup-folder persistence. PowerShell then decoded and ran an AsyncRAT fork with DCRat lineage in memory.\u003c/p\u003e\n\n\u003cp\u003eThe campaign puts sensitive legal, financial, and institutional information at risk because it targets judicial, fiscal, administrative, and educational organizations. Zenox observed nearly 3,300 malicious emails in a targeted wave between late October and early November 2026, but could not confirm successful compromises. The article notes that uneven security maturity in portions of Colombia\u0026rsquo;s public, financial, critical, and private-sector infrastructure may increase opportunities for compromise, data theft, fund theft, or credential reuse.\u003c/p\u003e\n"},{"n":35,"title":"Fireworks AI Breach Widens to Expose Customer Billing Data and Incomplete Model Weights","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/fireworks-ai-breach-widens-to-expose.html","time":"15:33","priority":"SHOULD READ","score":84,"tldr":"Fireworks AI says a broader security breach exposed some customers’ billing data, resource metadata, and incomplete model weights and datasets after attackers accessed its development environment. The LLMjacking-related incident also affected fewer than 1% of Notion workspaces, potentially exposing some Notion AI Insights chat transcripts.","briefOverview":"\u003cp\u003eFireworks AI said its investigation into an October 2026 security incident found a wider impact than initially reported. The company first identified unauthorized use of internal credentials that gave a third party access to environment variables used in evaluation jobs for a limited number of customer accounts. It later said the attackers reached its development environment through an unnamed third-party cloud provider hosting research and development machines, and ran an unauthorized workload that caused additional customer-data impact.\u003c/p\u003e\n\n\u003cp\u003eThe expanded impact included Fireworks resource metadata, billing and shipping addresses, invoice and payment history, account balances, credit usage, and a subset of incomplete model weights and datasets for certain customers. Fireworks AI said payment-card numbers were not stored by the company and were not affected, and it is notifying impacted customers. The company linked the activity to financially motivated actors seeking to sell unauthorized access to large language models, while Notion said fewer than 1% of its workspaces were affected and that some Notion AI Insights chat transcripts may have been involved.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fireworks AI said its investigation found that unauthorized activity exposed account and billing information, secrets, datasets, and incomplete models for a limited set of customer accounts.","The company said attackers accessed its development environment through an unnamed third-party cloud provider hosting its research and development machines, then ran an unauthorized workload that caused additional customer-data impact.","Exposed information may include Fireworks resource metadata, billing and shipping addresses, invoice and payment history, account balances, credit usage, and a subset of incomplete model weights and datasets.","Fireworks AI said payment-card numbers are not stored by the company and were not affected, and it is notifying impacted customers.","Notion said the incident affected fewer than 1% of its workspaces and may have exposed Notion AI Insights chat transcripts, prompting it to disable the Insights feature."],"insights":["The incident’s assessed impact expanded from stolen environment variables and secrets to include billing records and portions of customer model weights and datasets, illustrating that the initial findings did not capture the full scope.","Notion said that most affected AI chat transcripts could not be tied to a specific author or workspace and did not include tool-call results, although the records could still contain customer-provided content.","Fireworks AI linked the activity to financially motivated actors seeking to sell unauthorized access to large language models through illicit routing gateways, meaning abuse can impose service costs on the legitimate account owner.","Customers who entered passwords, API keys, or other credentials into affected Notion AI chats during the incident window are advised to rotate those credentials immediately."],"referencedReports":[{"title":"October 2026 Security Incident","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident","publisher":"fireworks-ai","context":"Fireworks AI’s security bulletin describes the initially identified unauthorized access to customer environment variables and secrets.","category":"advisory","primary":true},{"title":"October 2026 Security Incident Update","url":"https://fireworks.ai/security/bulletins/october-2026-security-incident-update","publisher":"fireworks-ai","context":"Fireworks AI’s updated bulletin reports the expanded impact involving development machines, billing data, and some model weights and datasets.","category":"advisory","primary":true},{"title":"Security Incident Involving a Third-Party AI Vendor","url":"https://www.notion.com/en-us/security/advisories/security-incident-involving-a-third-party-ai-vendor","publisher":"notion","context":"Notion’s advisory states that the Fireworks AI incident affected fewer than 1% of Notion workspaces and may have involved AI chat transcripts.","category":"advisory","primary":false}],"body":"\u003cp\u003eFireworks AI said its investigation into an October 2026 security incident found a wider impact than initially reported. The company first identified unauthorized use of internal credentials that gave a third party access to environment variables used in evaluation jobs for a limited number of customer accounts. It later said the attackers reached its development environment through an unnamed third-party cloud provider hosting research and development machines, and ran an unauthorized workload that caused additional customer-data impact.\u003c/p\u003e\n\n\u003cp\u003eThe expanded impact included Fireworks resource metadata, billing and shipping addresses, invoice and payment history, account balances, credit usage, and a subset of incomplete model weights and datasets for certain customers. Fireworks AI said payment-card numbers were not stored by the company and were not affected, and it is notifying impacted customers. The company linked the activity to financially motivated actors seeking to sell unauthorized access to large language models, while Notion said fewer than 1% of its workspaces were affected and that some Notion AI Insights chat transcripts may have been involved.\u003c/p\u003e\n"},{"n":10,"title":"Windows 11 KB5132061 \u0026 KB5131087 cumulative updates released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5132061-and-kb5131087-cumulative-updates-released/","time":"18:33","priority":"SHOULD READ","score":82,"tldr":"Microsoft’s November 2026 Patch Tuesday updates for Windows 11 deliver security fixes along with new File Explorer context-menu customization, recovery features, accessibility improvements, and IPv6 CLAT support. The mandatory cumul
