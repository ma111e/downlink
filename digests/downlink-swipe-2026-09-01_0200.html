<script type="application/json" id="dl-articles">[{"n":1,"title":"From a Stolen Login to a Ransomware Leak Site: What Our Telemetry Shows About the Path Threat Actors Take","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/from-a-stolen-login-to-a-ransomware-leak-site/","time":"05:00","priority":"SHOULD READ","score":82,"tldr":"Constella links Fairlife’s public Anubis ransomware leak to a broader pattern where stolen credentials from infostealer-infected vendor laptops can give attackers access to corporate CMS, cloud, SSO, and internal systems. The key takeaway is that third-party credential exposure, including cookies and browser autofill data, must be monitored as seriously as a company’s own endpoints because it can become the first step toward ransomware.","briefOverview":"\u003cp\u003eAnubis added Fairlife, the dairy brand owned by The Coca-Cola Company, to its dark web extortion portal, and Coca-Cola publicly confirmed the ransomware incident. The group claimed it exfiltrated close to a terabyte of internal data before triggering encryption and said it used an optional wipe mode against part of the victim’s virtualization infrastructure. The leak site organized the stolen data into engineering and OT documentation, production and formulation data, and HR and people data, including employee directories, payroll-related files, disciplinary records, and some identity documents.\u003c/p\u003e\n\n\u003cp\u003eThe article pairs that public ransomware disclosure with a separate credential package Constella observed through an unrelated channel, while stating that it cannot prove the package was the entry point used by Anubis. The package is described as belonging to an employee of a third-party digital agency contracted to build and maintain staging and production websites for several Coca-Cola brands. It contained 789 saved credential pairs, 540 browser session cookies, a local password manager vault store, and extensive evidence of password reuse across content management, cloud infrastructure, DevOps, source control, corporate identity, and SSO environments.\u003c/p\u003e\n\n\u003cp\u003eA major technical point is that the package exposed more than passwords and cookies, because browser autofill data also revealed client-side identity details, internal document references, network information, cloud activity, and deployment environment names. The article says the package included hundreds of credentials for Adobe Experience Manager environments, public IP-based admin consoles, AWS sign-ins across four regions, and evidence that the same vendor employee had access connected to more than one enterprise client. Constella uses the case to argue that third-party credential exposure can create a ransomware pathway outside the victim’s own endpoints, especially when stolen logins surface in infostealer logs, credential compilations, and broker marketplaces before a public leak appears.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anubis added Fairlife, a dairy brand owned by The Coca-Cola Company, to its dark web extortion portal, and Coca-Cola publicly confirmed the ransomware incident.","Anubis claimed it exfiltrated close to a terabyte of internal data and used an optional wipe mode against part of the victim’s virtualization infrastructure.","The leaked data was organized into engineering and OT documentation, production and formulation data, and HR and people data.","Constella analyzed a separate credential package believed to belong to a third-party digital agency employee that contained 789 saved credential pairs, 540 browser session cookies, and a local password manager vault store.","The credential package included hundreds of credentials for brand site content management environments, plus credentials for cloud infrastructure, DevOps, source control, corporate identity, and SSO providers."],"insights":["The article highlights that browser autofill data can reveal internal documents, environment names, infrastructure actions, and client identities, making it a valuable exposure source that many credential monitoring tools may miss.","The credential package showed heavy password reuse, with 789 credential pairs protected by only 118 unique passwords and the most common password reused 146 times across 87 hosts.","A single vendor employee’s infected laptop can blur third-party and internal risk when the person has both vendor identities and a client-issued email account tied to internal documents and systems.","Session cookies in stolen browser data can matter as much as passwords because, if still valid, they may allow access to already authenticated sessions without triggering a password entry or multi-factor prompt.","The article emphasizes that credentials may appear first in generic compiled lists before being verified and repackaged by initial access brokers, making early monitoring of compilations potentially important before a public ransomware disclosure occurs."],"referencedReports":[],"body":"\u003cp\u003eAnubis added Fairlife, the dairy brand owned by The Coca-Cola Company, to its dark web extortion portal, and Coca-Cola publicly confirmed the ransomware incident. The group claimed it exfiltrated close to a terabyte of internal data before triggering encryption and said it used an optional wipe mode against part of the victim’s virtualization infrastructure. The leak site organized the stolen data into engineering and OT documentation, production and formulation data, and HR and people data, including employee directories, payroll-related files, disciplinary records, and some identity documents.\u003c/p\u003e\n\n\u003cp\u003eThe article pairs that public ransomware disclosure with a separate credential package Constella observed through an unrelated channel, while stating that it cannot prove the package was the entry point used by Anubis. The package is described as belonging to an employee of a third-party digital agency contracted to build and maintain staging and production websites for several Coca-Cola brands. It contained 789 saved credential pairs, 540 browser session cookies, a local password manager vault store, and extensive evidence of password reuse across content management, cloud infrastructure, DevOps, source control, corporate identity, and SSO environments.\u003c/p\u003e\n\n\u003cp\u003eA major technical point is that the package exposed more than passwords and cookies, because browser autofill data also revealed client-side identity details, internal document references, network information, cloud activity, and deployment environment names. The article says the package included hundreds of credentials for Adobe Experience Manager environments, public IP-based admin consoles, AWS sign-ins across four regions, and evidence that the same vendor employee had access connected to more than one enterprise client. Constella uses the case to argue that third-party credential exposure can create a ransomware pathway outside the victim’s own endpoints, especially when stolen logins surface in infostealer logs, credential compilations, and broker marketplaces before a public leak appears.\u003c/p\u003e\n"},{"n":2,"title":"pnpm 12’s Rust Rewrite Cuts Install Times by Up to 90%","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/pnpm-12?utm_medium=feed","time":"02:52","priority":"MAY READ","score":68,"tldr":"pnpm 12 is now stable with a Rust rewrite that keeps pnpm 11 compatibility while delivering major install-time and storage improvements in early real-world testing. Its maintainers have narrowed public benchmark claims after flawed cross-package-manager comparisons, emphasizing faster pnpm performance rather than claiming overall market leadership.","briefOverview":"\u003cp\u003epnpm 12 is now stable and replaces the package manager’s Node.js and TypeScript foundation with a Rust rewrite while preserving the commands, settings, lockfile format, CLI, configuration, and content-addressable store used by pnpm 11. The release is intended to be a major implementation change without becoming a migration project for users, and the same documentation applies to pnpm 11 and 12. As of publication, npm’s \u003ccode\u003elatest\u003c/code\u003e tag still points to pnpm 11, so pnpm 12 must be installed from \u003ccode\u003enext-12\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe Rust rewrite moves performance-sensitive work into a native binary to reduce JavaScript runtime startup and filesystem overhead. In Vercel’s 21-project Turborepo workspace with 1,670 packages, pnpm 12 reduced median install times by 64.4% to 90.5% compared with pnpm 10.28 across six tested combinations of cache, \u003ccode\u003enode_modules\u003c/code\u003e, and lifecycle-script conditions. The largest reduction occurred when \u003ccode\u003enode_modules\u003c/code\u003e already existed, while a full install with no store or \u003ccode\u003enode_modules\u003c/code\u003e and lifecycle scripts enabled fell from 9.850 seconds to 3.472 seconds.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that pnpm narrowed its public benchmark claims after flaws made cross-tool comparisons with Bun and Yarn unreliable, and its website now compares the Rust rewrite with npm and pnpm’s previous JavaScript implementation. Beyond performance, pnpm 12 adds supply chain security and reproducibility changes including project-aware global bins, direct package manager provisioning, registry revisions, signed remote build artifacts, and deterministic cyclic lockfiles. Teams upgrading should review behavioral changes such as the removal of \u003ccode\u003epnpm install --resolution-only\u003c/code\u003e, canonical HTTPS Git dependency URLs for GitHub, GitLab, and Bitbucket, stricter reporting of unknown workspace settings, and refusal to run global pnpm-modifying commands under \u003ccode\u003esudo\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["pnpm 12 is now stable and replaces pnpm’s Node.js and TypeScript foundation with a Rust rewrite while preserving the commands, settings, and lockfile format used by pnpm 11.","In Vercel’s 21-project Turborepo workspace, pnpm 12 reduced median install times by 64.4% to 90.5% compared with pnpm 10.28 across six tested scenarios.","pnpm removed Bun and Yarn from the comparison displayed on its benchmark page after bugs made published cross-tool package manager rankings unreliable.","pnpm 12 adds supply chain security-related features including project-aware global bins, direct package manager provisioning, registry revisions, signed remote build artifacts, and deterministic cyclic lockfiles.","The upgrade has behavioral changes that may affect workflows, including removal of `pnpm install --resolution-only`, canonical HTTPS resolution for Git dependencies on GitHub, GitLab, and Bitbucket, and warnings for unknown settings in `pnpm-workspace.yaml`."],"insights":["Teams may not get pnpm 12 by default yet because npm’s `latest` tag still points to pnpm 11, so users must install it from `next-12` or run `pnpm self-update next-12` from pnpm 11.10 or newer.","The biggest measured speedup in Vercel’s testing occurred when `node_modules` already existed, where install time fell from about 1.4 seconds to about 0.14 seconds, showing the rewrite has especially large benefits for repeated installs in an existing workspace.","The Rust rewrite introduces a distribution tradeoff: pnpm 12’s native Corepack artifact is much larger than pnpm 10.28’s artifact and made uncached Corepack startup slower, even though cached startup was much faster.","pnpm 12’s stricter handling of unknown `pnpm-workspace.yaml` settings is security-relevant because it can reveal misspelled controls such as `minimumReleaseAge` that were previously ignored silently.","Organizations using SSH-based private Git dependencies may need machine-level Git URL rewriting because pnpm 12 records GitHub, GitLab, and Bitbucket dependencies using canonical HTTPS URLs in the lockfile."],"referencedReports":[{"title":"Vlt benchmark suite","url":"https://benchmarks.vlt.sh/#/package-managers/average","publisher":"Vlt","context":"The article says the Vlt benchmark suite had a parsing bug that affected pnpm 12 package-count measurements and made cross-tool rankings unreliable until a fix was merged.","category":"research","primary":false}],"body":"\u003cp\u003epnpm 12 is now stable and replaces the package manager’s Node.js and TypeScript foundation with a Rust rewrite while preserving the commands, settings, lockfile format, CLI, configuration, and content-addressable store used by pnpm 11. The release is intended to be a major implementation change without becoming a migration project for users, and the same documentation applies to pnpm 11 and 12. As of publication, npm’s \u003ccode\u003elatest\u003c/code\u003e tag still points to pnpm 11, so pnpm 12 must be installed from \u003ccode\u003enext-12\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe Rust rewrite moves performance-sensitive work into a native binary to reduce JavaScript runtime startup and filesystem overhead. In Vercel’s 21-project Turborepo workspace with 1,670 packages, pnpm 12 reduced median install times by 64.4% to 90.5% compared with pnpm 10.28 across six tested combinations of cache, \u003ccode\u003enode_modules\u003c/code\u003e, and lifecycle-script conditions. The largest reduction occurred when \u003ccode\u003enode_modules\u003c/code\u003e already existed, while a full install with no store or \u003ccode\u003enode_modules\u003c/code\u003e and lifecycle scripts enabled fell from 9.850 seconds to 3.472 seconds.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that pnpm narrowed its public benchmark claims after flaws made cross-tool comparisons with Bun and Yarn unreliable, and its website now compares the Rust rewrite with npm and pnpm’s previous JavaScript implementation. Beyond performance, pnpm 12 adds supply chain security and reproducibility changes including project-aware global bins, direct package manager provisioning, registry revisions, signed remote build artifacts, and deterministic cyclic lockfiles. Teams upgrading should review behavioral changes such as the removal of \u003ccode\u003epnpm install --resolution-only\u003c/code\u003e, canonical HTTPS Git dependency URLs for GitHub, GitLab, and Bitbucket, stricter reporting of unknown workspace settings, and refusal to run global pnpm-modifying commands under \u003ccode\u003esudo\u003c/code\u003e.\u003c/p\u003e\n"}]</script>
