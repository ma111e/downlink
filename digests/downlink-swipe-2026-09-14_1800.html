<script type="application/json" id="dl-articles">[{"n":4,"title":"Microsoft releases emergency Windows updates to fix RDS failures","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-emergency-windows-updates-to-fix-rds-failures/","time":"20:52","priority":"SHOULD READ","score":88,"tldr":"Microsoft released emergency out-of-band Windows updates to fix Remote Desktop Services failures caused by September 2026 security updates across affected Windows 10, Windows 11, and Windows Server systems. The updates also address certain Hyper-V shared-folder and multichannel USB audio issues, though some USB Audio Class 1.0 problems remain unresolved.","briefOverview":"\u003cp\u003eMicrosoft released emergency out-of-band Windows updates on September 14 to fix Remote Desktop Services failures caused by the September 2026 security updates. Affected systems experienced Remote Desktop connection and sign-in failures, and some servers became unresponsive. Microsoft had previously acknowledged the issue after administrators reported widespread problems, and uninstalling the September updates could restore Remote Desktop functionality but also remove their security fixes.\u003c/p\u003e\n\n\u003cp\u003eThe new updates cover Windows 10, Windows 11, and Windows Server versions, with Windows Server fixes addressing issues introduced by KB5122871 on Windows Server 2025 and KB5122882 on Windows Server 2022. The Windows 11 updates also resolve a Hyper-V issue that could make shared Windows host folders unavailable in Linux virtual machines. They additionally fix some multichannel USB Audio Class 1.0 failures, but Microsoft says it is still working on a solution for remaining cases in which affected USB audio devices cannot start or produce sound.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released emergency out-of-band Windows updates on September 14 to address Remote Desktop Services failures caused by September security updates.","Affected systems experienced Remote Desktop connection and sign-in failures, and some servers became unresponsive; related tools such as Microsoft Management Console, File Explorer, and Windows Update could also stop responding.","The updates include KB5129236 for Windows 10 21H2 and 22H2, KB5129195 for Windows 11 24H2 and 25H2, KB5129194 for Windows 11 26H1, and separate updates for Windows Server 2019, 2022, and 2025.","The Windows 11 out-of-band updates also fix a Hyper-V folder-sharing issue involving Linux virtual machines and certain multichannel USB audio failures.","Microsoft says some USB Audio Class 1.0 devices may still fail to start or produce audio after the September 8 security update, and it is working on a further fix."],"insights":["Administrators who removed the September security updates could restore Remote Desktop functionality, but doing so also removed the security fixes delivered by those updates, making Microsoft’s emergency patches the safer remediation path described in the article.","The emergency updates have different distribution paths: Windows 11 26H1 is available through Windows Update, Windows Update for Business, the Microsoft Update Catalog, and WSUS, while the Windows Server updates are available through the Microsoft Update Catalog.","The fixes cover more than remote connections: they also address inaccessible or missing shared folders in Linux virtual machines and multichannel audio failures, showing that the September updates affected several unrelated Windows functions.","The USB audio remediation is incomplete, because the emergency updates fix multichannel audio issues but Microsoft says some USB Audio Class 1.0 devices can still fail entirely, show a Code 10 error, or have unresponsive sound controls."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft released emergency out-of-band Windows updates on September 14 to fix Remote Desktop Services failures caused by the September 2026 security updates. Affected systems experienced Remote Desktop connection and sign-in failures, and some servers became unresponsive. Microsoft had previously acknowledged the issue after administrators reported widespread problems, and uninstalling the September updates could restore Remote Desktop functionality but also remove their security fixes.\u003c/p\u003e\n\n\u003cp\u003eThe new updates cover Windows 10, Windows 11, and Windows Server versions, with Windows Server fixes addressing issues introduced by KB5122871 on Windows Server 2025 and KB5122882 on Windows Server 2022. The Windows 11 updates also resolve a Hyper-V issue that could make shared Windows host folders unavailable in Linux virtual machines. They additionally fix some multichannel USB Audio Class 1.0 failures, but Microsoft says it is still working on a solution for remaining cases in which affected USB audio devices cannot start or produce sound.\u003c/p\u003e\n"},{"n":5,"title":"Hackers hijack HBO Max Reddit account to push malware in ClickFix ads","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-hijack-hbo-max-reddit-account-to-push-malware-in-clickfix-ads/","time":"18:34","priority":"SHOULD READ","score":84,"tldr":"Hackers hijacked HBO Max’s verified Reddit account to run more than 100 malicious ads that used ClickFix social engineering to trick Windows and macOS users into installing information-stealing malware. The campaign, linked to PasteSwitch, also promoted fake AI, developer, and cryptocurrency-wallet software.","briefOverview":"\u003cp\u003eHackers compromised HBO Max’s verified u/hbomax Reddit account and used it to launch 108 malicious advertisements over about 48 hours. Researchers at Hudson Rock and ADAMnetworks linked the activity to a broader campaign called PasteSwitch. The ads impersonated HBO Max and also promoted fake AI tools, developer software, and macOS utilities, extending the campaign beyond streaming-service users.\u003c/p\u003e\n\n\u003cp\u003eThe advertisements led visitors to convincing fake download sites that used ClickFix instructions, telling them to paste attacker-provided commands into Windows Run, PowerShell, or macOS Terminal. One macOS command downloaded and ran a script from infrastructure previously associated with PasteSwitch, while Windows chains used mshta and PowerShell and could disable Microsoft’s Antimalware Scan Interface. The campaign has delivered MacSync, AMOS helper, Amatera Stealer, and cryptocurrency clipboard hijackers, enabling theft of browser credentials, macOS passwords, Telegram data, wallet recovery phrases, and other information. Reddit paused the ads after they were reported, but it remains unclear how the HBO Max account was accessed or whether other HBO or Warner Bros. Discovery accounts or systems were affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers compromised HBO Max’s verified u/hbomax Reddit account and used it to launch 108 malicious advertisements over roughly 48 hours.","The ads used ClickFix instructions that persuaded visitors to copy and paste commands into Windows Run, PowerShell, or macOS Terminal instead of downloading legitimate software.","Researchers at Hudson Rock and ADAMnetworks linked the activity to the PasteSwitch campaign, which has distributed information stealers, loaders, cryptocurrency clippers, and fake cryptocurrency wallet applications.","One fake HBO Max site directed macOS users to run a command that downloaded and executed a script from attacker-controlled infrastructure.","Researchers identified ads directing users to fake HBO Max, AI/developer software, macOS utility, and code-desktop websites, and Reddit paused the ads after they were reported."],"insights":["A verified Reddit account can make malicious advertisements appear trustworthy even when they direct users to fake software-download sites.","The ClickFix approach avoids a conventional malware download by convincing victims to run the attacker’s commands themselves through built-in Windows or macOS tools.","PasteSwitch can alter its campaigns, target platform, delivered software, and cryptocurrency theft method depending on the visitor.","The same compromised HBO Max account was used to target audiences beyond streaming customers by advertising fake AI tools, developer software, and macOS utilities."],"referencedReports":[{"title":"HBO Max ads on a compromised Reddit account exposed a massive PasteSwitch ClickFix operation","url":"https://www.hudsonrock.com/blog/hbo-max-ads-on-a-compromised-reddit-account-exposed-a-massive-pasteswitch-clickfix-operation","publisher":"hudson-rock","context":"Hudson Rock analyzed the compromised HBO Max Reddit account and linked the malicious advertisements to the PasteSwitch operation.","category":"research","primary":true},{"title":"HBO Max ads exposed the PasteSwitch ClickFix operation","url":"https://adamnet.works/blog/hbo-max-ads-exposed-the-pasteswitch-clickfix-operation/","publisher":"adamnetworks","context":"ADAMnetworks analyzed the malicious advertising campaign and its ClickFix delivery activity.","category":"research","primary":true}],"body":"\u003cp\u003eHackers compromised HBO Max’s verified u/hbomax Reddit account and used it to launch 108 malicious advertisements over about 48 hours. Researchers at Hudson Rock and ADAMnetworks linked the activity to a broader campaign called PasteSwitch. The ads impersonated HBO Max and also promoted fake AI tools, developer software, and macOS utilities, extending the campaign beyond streaming-service users.\u003c/p\u003e\n\n\u003cp\u003eThe advertisements led visitors to convincing fake download sites that used ClickFix instructions, telling them to paste attacker-provided commands into Windows Run, PowerShell, or macOS Terminal. One macOS command downloaded and ran a script from infrastructure previously associated with PasteSwitch, while Windows chains used mshta and PowerShell and could disable Microsoft’s Antimalware Scan Interface. The campaign has delivered MacSync, AMOS helper, Amatera Stealer, and cryptocurrency clipboard hijackers, enabling theft of browser credentials, macOS passwords, Telegram data, wallet recovery phrases, and other information. Reddit paused the ads after they were reported, but it remains unclear how the HBO Max account was accessed or whether other HBO or Warner Bros. Discovery accounts or systems were affected.\u003c/p\u003e\n"},{"n":7,"title":"3BB Attacker Used MeshCentral Backdoor for Root Access, Targeted Subscriber Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/3bb-attacker-used-meshcentral-backdoor.html","time":"18:01","priority":"SHOULD READ","score":84,"tldr":"Hunt.io found evidence that an attacker had root-level access inside Thai broadband provider 3BB and used a covert MeshCentral deployment to maintain control while targeting subscriber RADIUS credentials. The intrusion may have involved an unpatched FortiGate SSL-VPN vulnerable to CVE-2024-21762, but the initial access method and any data theft remain unconfirmed.","briefOverview":"\u003cp\u003eHunt.io found evidence that an attacker had active, root-level control of internal systems at 3BB, a major Thai broadband provider. Researchers captured an exposed attacker server on June 3, 2026, while the operation was still active, and found tools run from within 3BB\u0026rsquo;s network. The attacker used MeshCentral, a legitimate remote-management tool, as a concealed backdoor connected to www.ayuthayatech[.]com under a group named TH-3BB.\u003c/p\u003e\n\n\u003cp\u003eRecovered scripts sprayed passwords over SSH against more than 55 internal systems, searched for stored credentials and SSH keys, and could install web shells and additional SSH keys. The toolkit also targeted 3BB RADIUS databases that contain subscriber login credentials, although Hunt.io found no confirmation that data was taken. The server contained a FortiGate SSL-VPN exploit for CVE-2024-21762 against a vulnerable 3BB gateway, but the researchers could not establish whether that flaw was used for the initial intrusion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hunt.io captured an exposed attacker server on June 3, 2026, and found evidence that the attacker had obtained root-level access to internal systems at Thai broadband provider 3BB.","The attacker configured MeshCentral as a concealed remote-access backdoor, with agents reporting to www.ayuthayatech[.]com in a device group named TH-3BB.","Recovered scripts targeted more than 55 internal computers with SSH password spraying, searched for stored credentials and SSH keys, and could install web shells and additional SSH keys.","The toolkit included scripts designed to copy 3BB RADIUS databases containing subscriber login credentials, although Hunt.io found evidence of targeting rather than confirmed data theft.","The attacker also had tooling for CVE-2024-21762 against a vulnerable 3BB FortiGate SSL-VPN gateway, but Hunt.io could not confirm that this flaw was used for initial access."],"insights":["The attacker’s cleanup script was designed to remove logs and other tooling while intentionally leaving the MeshCentral agent installed, indicating that the remote-control access was meant to persist after cleanup.","Several enrolled MeshCentral systems were connected and running with root privileges when the recovered device list was created, providing evidence of active administrative control rather than only attempted access.","A valid 3BB VPN certificate and active Jasmine-network service sessions on the attacker server linked the activity to shared 3BB-Jasmine infrastructure, although Hunt.io did not confirm a Jasmine breach.","The FortiGate exploit toolkit was the attacker’s most developed tooling, but the available evidence supports only capability and targeting intent, not confirmed initial access through CVE-2024-21762."],"referencedReports":[{"title":"Hunt.io report on the 3BB MeshCentral intrusion","url":"https://hunt.io/blog/thai-broadband-fortigate-sslvpn-meshcentral-intrusion","publisher":"hunt.io","context":"The article is based on Hunt.io's analysis of an exposed attacker server and directs readers to its full technical report and indicators.","category":"research","primary":true},{"title":"FG-IR-24-015","url":"https://fortiguard.fortinet.com/psirt/FG-IR-24-015","publisher":"fortinet","context":"The article cites Fortinet's advisory for patching guidance and mitigations for CVE-2024-21762 affecting FortiGate SSL-VPN.","category":"advisory","primary":false}],"body":"\u003cp\u003eHunt.io found evidence that an attacker had active, root-level control of internal systems at 3BB, a major Thai broadband provider. Researchers captured an exposed attacker server on June 3, 2026, while the operation was still active, and found tools run from within 3BB\u0026rsquo;s network. The attacker used MeshCentral, a legitimate remote-management tool, as a concealed backdoor connected to www.ayuthayatech[.]com under a group named TH-3BB.\u003c/p\u003e\n\n\u003cp\u003eRecovered scripts sprayed passwords over SSH against more than 55 internal systems, searched for stored credentials and SSH keys, and could install web shells and additional SSH keys. The toolkit also targeted 3BB RADIUS databases that contain subscriber login credentials, although Hunt.io found no confirmation that data was taken. The server contained a FortiGate SSL-VPN exploit for CVE-2024-21762 against a vulnerable 3BB gateway, but the researchers could not establish whether that flaw was used for the initial intrusion.\u003c/p\u003e\n"},{"n":2,"title":"Japan's Digital Agency says VPN flaw exposed 246,000 personnel records","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japans-digital-agency-says-vpn-flaw-exposed-246-000-personnel-records/","time":"20:36","priority":"SHOULD READ","score":78,"tldr":"Japan’s Digital Agency says attackers exploited a known, medium-severity VPN flaw to access a government system, potentially exposing roughly 246,000 personnel-data records. The agency contained the intrusion and reports no confirmed misuse or impact on public-facing government services.","briefOverview":"\u003cp\u003eJapan’s Digital Agency said an attacker exploited a vulnerability in a VPN device used by the Government Solution Service (GSS) to gain unauthorized access to a system. The agency began investigating on June 25 after detecting large-scale file access from a maintenance and operations staff account, and confirmed the unauthorized access on July 9. It suspended the account, cut off the compromised equipment’s external communications, and said this prevented further unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe potentially exposed data includes approximately 236,000 names, 231,000 email addresses, 94,000 telephone numbers, and 1,000 physical addresses, affecting government employees, public officials, and associated businesses and individuals using GSS. The agency said the exploited flaw was medium severity and not a zero-day, but did not identify the VPN product or vulnerability. It reported no confirmed misuse of the data, no exposure of My Number identifiers, bank details, or pension numbers, and no impact on government service availability, while warning affected people about impersonation and phishing risks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan’s Digital Agency said an attacker exploited a known, medium-severity flaw in a VPN device used by the Government Solution Service to gain unauthorized system access.","The agency’s investigation began on June 25 after it detected large-scale file access from a maintenance and operations staff member’s account, and it identified the unauthorized access on July 9.","Potentially exposed information included about 236,000 names, 231,000 email addresses, 94,000 telephone numbers, and 1,000 physical addresses.","The affected people include government employees, public officials, and associated businesses and individuals using the Government Solution Service, while the agency said general-public data, My Number identifiers, bank details, and pension numbers were not exposed.","The agency reported no detected misuse of the information, contained the incident on July 9, and said government service availability was not affected."],"insights":["The agency characterized the exploited issue as medium severity and not a zero-day, showing that an already known, non-critical weakness in a remote-access device was sufficient to enable unauthorized access.","The number of potentially exposed record rows, about 246,000, differs from the counts for each data type, indicating that the exposure assessment covers records with varying combinations of personal details rather than one identical data set for every person.","The agency detected the incident through unusually large file access from a staff account, then isolated the affected equipment and suspended that account on the day it confirmed unauthorized access.","Although the incident was reported to Japan’s Personal Information Protection Commission on July 15, public disclosure was delayed while the agency worked to establish the intrusion path, affected information, and affected individuals.","The agency specifically warned of impersonation and phishing risk despite finding no confirmed misuse, and stated it will contact affected individuals directly rather than request passwords or credit-card details by email or phone."],"referencedReports":[],"body":"\u003cp\u003eJapan’s Digital Agency said an attacker exploited a vulnerability in a VPN device used by the Government Solution Service (GSS) to gain unauthorized access to a system. The agency began investigating on June 25 after detecting large-scale file access from a maintenance and operations staff account, and confirmed the unauthorized access on July 9. It suspended the account, cut off the compromised equipment’s external communications, and said this prevented further unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe potentially exposed data includes approximately 236,000 names, 231,000 email addresses, 94,000 telephone numbers, and 1,000 physical addresses, affecting government employees, public officials, and associated businesses and individuals using GSS. The agency said the exploited flaw was medium severity and not a zero-day, but did not identify the VPN product or vulnerability. It reported no confirmed misuse of the data, no exposure of My Number identifiers, bank details, or pension numbers, and no impact on government service availability, while warning affected people about impersonation and phishing risks.\u003c/p\u003e\n"},{"n":3,"title":"Twitch extension with 30K installs exposes users’ OAuth tokens","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/twitch-extension-with-30k-installs-exposes-users-oauth-tokens/","time":"19:03","priority":"SHOULD READ","score":78,"tldr":"The Twitch Enhanced Viewer | JeetBot browser extension, installed by more than 30,000 users, exposes Twitch OAuth session tokens by forwarding them through JeetBot proxy servers in URL parameters. Users should remove the extension and revoke all Twitch sessions to invalidate potentially compromised tokens.","briefOverview":"\u003cp\u003eSocket reported that Twitch Enhanced Viewer | JeetBot, a browser extension available in the official Chrome and Firefox stores, captures Twitch OAuth session tokens and sends them through proxy servers operated by JeetBot. The extension has more than 30,000 installs and advertises functions including ad blocking, forcing 1080p playback, bypassing region restrictions, and collecting channel points. JeetBot is described as a commercial Russian-language streaming and chatbot service offering tools for Twitch, Kick, and VK Live.\u003c/p\u003e\n\n\u003cp\u003eThe extension redirects Twitch video playlist requests through a proxy and appends the user token as an \u003ccode\u003eauth=\u003c/code\u003e URL parameter, causing it to be recorded in clear text in proxy-server request logs. Socket said this occurred for every channel a user watched except ten Russian-language channels hardcoded into the extension. Earlier versions included more explicit token-transmission mechanisms, and the Firefox listing contained a developer disclaimer acknowledging that prior versions sent Twitch OAuth tokens to its server. Socket recommends users remove the extension, disconnect all Twitch sessions, and sign in again to invalidate any forwarded tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Twitch Enhanced Viewer | JeetBot browser extension, available through the official Chrome and Firefox stores, has more than 30,000 installs.","Socket found that the extension captures Twitch web-client authorization information and sends users’ Twitch OAuth tokens through JeetBot-operated proxy servers.","The extension appends tokens to redirected proxy request URLs, causing the credentials to be recorded in proxy-server request logs in clear text.","Earlier versions explicitly transmitted users’ Twitch OAuth tokens to the developer’s server, according to a disclaimer in the Firefox Add-ons listing.","Socket recommends that users remove the extension, disconnect all Twitch sessions, and re-authenticate to invalidate tokens that may have been forwarded."],"insights":["The extension’s Chrome privacy disclosure said the developer would not collect or use user data, despite the extension forwarding Twitch OAuth tokens through its proxy infrastructure.","Putting authentication tokens in URL parameters makes them available in routine proxy request logs, creating a direct retrieval path for the proxy operator.","The token-forwarding behavior reportedly occurred for every channel watched except ten Russian-language channels hardcoded into the extension.","The Firefox listing included a developer disclaimer acknowledging that previous versions transmitted users’ Twitch OAuth tokens to its server."],"referencedReports":[{"title":"Malicious Twitch browser extension","url":"https://socket.dev/blog/malicious-twitch-browser-extension#Recommendations","publisher":"socket","context":"The article relies on Socket's analysis of the Twitch Enhanced Viewer | JeetBot extension's handling and exposure of Twitch OAuth tokens.","category":"research","primary":true}],"body":"\u003cp\u003eSocket reported that Twitch Enhanced Viewer | JeetBot, a browser extension available in the official Chrome and Firefox stores, captures Twitch OAuth session tokens and sends them through proxy servers operated by JeetBot. The extension has more than 30,000 installs and advertises functions including ad blocking, forcing 1080p playback, bypassing region restrictions, and collecting channel points. JeetBot is described as a commercial Russian-language streaming and chatbot service offering tools for Twitch, Kick, and VK Live.\u003c/p\u003e\n\n\u003cp\u003eThe extension redirects Twitch video playlist requests through a proxy and appends the user token as an \u003ccode\u003eauth=\u003c/code\u003e URL parameter, causing it to be recorded in clear text in proxy-server request logs. Socket said this occurred for every channel a user watched except ten Russian-language channels hardcoded into the extension. Earlier versions included more explicit token-transmission mechanisms, and the Firefox listing contained a developer disclaimer acknowledging that prior versions sent Twitch OAuth tokens to its server. Socket recommends users remove the extension, disconnect all Twitch sessions, and sign in again to invalidate any forwarded tokens.\u003c/p\u003e\n"},{"n":6,"title":"Members of ‘Black Axe’ cybercriminal group extradited from South Africa","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/members-of-black-axe-cybercrime-group-extradited-south-africa","time":"19:40","priority":"SHOULD READ","score":78,"tldr":"Five alleged Black Axe leaders were extradited from South Africa to the United States to face wire fraud and money laundering charges tied to decade-long romance scams that targeted more than 100 victims.","briefOverview":"\u003cp\u003eFive alleged members of the Black Axe cybercriminal organization were extradited from South Africa to the United States and are due to appear in federal court in Trenton, New Jersey. A 2021 indictment charges Perry Osagiede, Franklyn Edosa Osagiede, Osariemen Eric Clement, Collins Owhofasa Otughwor, and Musa Mudashiru with wire fraud and money laundering. The charges, each carrying a maximum sentence of 20 years, stem from alleged romance scams run between 2011 and 2021 that stole money from more than 100 people.\u003c/p\u003e\n\n\u003cp\u003eProsecutors allege the men led Black Axe\u0026rsquo;s Cape Town branch, with Perry Osagiede founding the chapter and directing efforts to scam U.S. residents. The group allegedly used aliases on social-media and dating platforms to persuade victims to send money, sometimes threatening to disclose sensitive photographs when they refused. Prosecutors also say South African companies were used to launder proceeds, which were traced to both romance scams and business email compromise schemes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five alleged members of the Black Axe cybercriminal organization were extradited from South Africa and are scheduled to appear in U.S. District Court in Trenton, New Jersey.","A 2021 indictment accuses Perry Osagiede, Franklyn Edosa Osagiede, Osariemen Eric Clement, Collins Owhofasa Otughwor, and Musa Mudashiru of wire fraud and money laundering connected to romance scams conducted from 2011 to 2021.","Prosecutors say the group used aliases on social-media and dating platforms to target victims, sometimes threatening to release sensitive photographs when victims refused to send money.","The indictment alleges that Perry Osagiede founded and led Black Axe's Cape Town branch and used South African companies to help launder scam proceeds.","The FBI described Black Axe as a notoriously violent transnational criminal organization, while recent international operations have also resulted in arrests of suspected members and associated service providers."],"insights":["The alleged scheme combined romance scams with threats to expose sensitive photographs, showing that victims were pressured through both emotional deception and blackmail.","Prosecutors traced some laundered funds to business email compromise schemes as well as romance scams, indicating that the alleged money-laundering activity was not limited to one fraud method.","The indictment reportedly contains examples of scam messages and fake identities, which could help potential victims recognize whether they interacted with the group.","Recent international enforcement actions targeted not only suspected Black Axe members but also people who allegedly provided money-laundering services and website domains to the group."],"referencedReports":[],"body":"\u003cp\u003eFive alleged members of the Black Axe cybercriminal organization were extradited from South Africa to the United States and are due to appear in federal court in Trenton, New Jersey. A 2021 indictment charges Perry Osagiede, Franklyn Edosa Osagiede, Osariemen Eric Clement, Collins Owhofasa Otughwor, and Musa Mudashiru with wire fraud and money laundering. The charges, each carrying a maximum sentence of 20 years, stem from alleged romance scams run between 2011 and 2021 that stole money from more than 100 people.\u003c/p\u003e\n\n\u003cp\u003eProsecutors allege the men led Black Axe\u0026rsquo;s Cape Town branch, with Perry Osagiede founding the chapter and directing efforts to scam U.S. residents. The group allegedly used aliases on social-media and dating platforms to persuade victims to send money, sometimes threatening to disclose sensitive photographs when they refused. Prosecutors also say South African companies were used to launder proceeds, which were traced to both romance scams and business email compromise schemes.\u003c/p\u003e\n"},{"n":1,"title":"Homebrew 7.0.0 gets built-in GUI, better security controls","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/homebrew-700-gets-built-in-gui-better-security-controls/","time":"19:51","priority":"MAY READ","score":72,"tldr":"Homebrew 7.0.0 adds a native macOS BrewUI, built-in vulnerability scanning backed by OSV.dev and a Homebrew advisory database, plus stronger sandboxing and faster concurrent installations.","briefOverview":"\u003cp\u003eHomebrew 7.0.0 has been released with BrewUI, a native graphical interface for macOS 26 Tahoe and later. BrewUI lets users browse and search packages and inspect and manage their dependencies. The release also adds stronger security controls and faster package installation and upgrades.\u003c/p\u003e\n\n\u003cp\u003eA new \u003ccode\u003ebrew vulns\u003c/code\u003e command checks installed formulae, individual formulae, or formulae and dependencies listed in a Brewfile for known vulnerabilities. It queries OSV.dev using upstream repository and version information, verifies matches, can apply severity filters, and checks whether Homebrew has already backported a security fix. Homebrew also publishes a reusable OSV-format advisory database and now blocks access to users’ home directories by default while separating network-enabled downloads from offline installation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Homebrew 7.0.0 introduces BrewUI, a native graphical interface for macOS 26 Tahoe and later that lets users browse, search, inspect, and manage packages and dependencies.","The new brew vulns command checks installed formulae, individual formulae, or formulae and dependencies listed in a Brewfile for known vulnerabilities.","Homebrew queries OSV.dev using upstream repository and version information, verifies possible matches, applies optional severity filters, and determines whether a Homebrew security patch has already addressed an issue.","Homebrew now publishes an OSV-format advisory database covering vulnerabilities in Homebrew formula versions and revisions, including fixes backported without an upstream version change.","Version 7.0.0 blocks access to users' home directories by default, separates network-enabled downloads from offline installation, and supports concurrent package downloading, preparation, and installation."],"insights":["Homebrew’s advisory data can distinguish an unresolved upstream issue from one that Homebrew has already fixed through a backport, even when the upstream software version has not changed.","The vulnerability check is designed to evaluate not only directly installed packages but also their declared dependencies in a Brewfile, expanding visibility beyond a single selected formula.","Homebrew’s new security model separates network-enabled dependency downloads from offline installation and blocks access to users’ home directories by default, limiting what installation activity can access.","The project makes its Homebrew-specific advisory records available in the reusable OSV format under CC0, allowing other tools and security teams to use the same data source."],"referencedReports":[],"body":"\u003cp\u003eHomebrew 7.0.0 has been released with BrewUI, a native graphical interface for macOS 26 Tahoe and later. BrewUI lets users browse and search packages and inspect and manage their dependencies. The release also adds stronger security controls and faster package installation and upgrades.\u003c/p\u003e\n\n\u003cp\u003eA new \u003ccode\u003ebrew vulns\u003c/code\u003e command checks installed formulae, individual formulae, or formulae and dependencies listed in a Brewfile for known vulnerabilities. It queries OSV.dev using upstream repository and version information, verifies matches, can apply severity filters, and checks whether Homebrew has already backported a security fix. Homebrew also publishes a reusable OSV-format advisory database and now blocks access to users’ home directories by default while separating network-enabled downloads from offline installation.\u003c/p\u003e\n"},{"n":8,"title":"Responsible AI: Governance, Risk, and Security with Daniel Wallance, McKinsey","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/responsible-ai-governance-risk-and-security-with-daniel-wallance-mckinsey/","time":"20:41","priority":"MAY READ","score":25,"tldr":"A Bishop Fox webcast featuring McKinsey’s Daniel Wallance discusses how organizations can scale AI adoption while embedding responsible governance, security, risk management, and human accountability from the outset.","briefOverview":"\u003cp\u003eHealth-ISAC promotes an on-demand webcast by Bishop Fox featuring Daniel Wallance of McKinsey on responsible AI governance, risk, and security. The discussion examines enterprise AI adoption as organizations move from experimentation to deployment at enterprise scale. It covers trends across industries and in the United States, Europe, and the Middle East.\u003c/p\u003e\n\n\u003cp\u003eThe webcast addresses managing risks associated with generative AI, machine learning, and AI agents. It highlights organizational guardrails, human oversight, and accountability for AI-generated outputs. It also discusses building security, governance, and risk management into AI initiatives from the beginning, with attention to financial services, healthcare, critical infrastructure, and governance guidance from NIST and ISO.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article promotes an on-demand Bishop Fox webcast featuring Daniel Wallance of McKinsey on responsible AI governance, risk, and security.","Wallance discusses enterprise AI adoption trends across industries and in the United States, Europe, and the Middle East.","The webcast addresses risk management for generative AI, machine learning, and AI agents.","It covers responsible AI governance, organizational guardrails, human oversight, and accountability for AI-generated outputs.","The discussion includes AI governance frameworks and guidance from NIST and ISO, as well as challenges for financial services, healthcare, and critical infrastructure."],"insights":["The article frames the central challenge as AI adoption outpacing the governance needed to manage it, rather than a lack of interest in AI itself.","It treats responsible AI as an enterprise-wide issue spanning generative AI, machine learning, and AI agents, rather than a concern limited to one type of AI tool.","The discussion emphasizes building security, governance, and risk management into AI initiatives from the beginning, alongside human review and clear accountability for AI-generated outputs.","The article highlights that AI governance needs may differ across financial services, healthcare, and critical infrastructure."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC promotes an on-demand webcast by Bishop Fox featuring Daniel Wallance of McKinsey on responsible AI governance, risk, and security. The discussion examines enterprise AI adoption as organizations move from experimentation to deployment at enterprise scale. It covers trends across industries and in the United States, Europe, and the Middle East.\u003c/p\u003e\n\n\u003cp\u003eThe webcast addresses managing risks associated with generative AI, machine learning, and AI agents. It highlights organizational guardrails, human oversight, and accountability for AI-generated outputs. It also discusses building security, governance, and risk management into AI initiatives from the beginning, with attention to financial services, healthcare, critical infrastructure, and governance guidance from NIST and ISO.\u003c/p\u003e\n"}]</script>
