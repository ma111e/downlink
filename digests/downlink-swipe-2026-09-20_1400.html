<script type="application/json" id="dl-articles">[{"n":1,"title":"Malicious npm packages evade install-script defenses at runtime","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-npm-packages-evade-install-script-defenses-at-runtime/","time":"14:11","priority":"SHOULD READ","score":88,"tldr":"Malicious npm packages led by indexed-btree evaded install-script protections by embedding a runtime loader in a commonly used library method, allowing malware to execute only when triggered by application behavior. Developers who installed the affected packages should rotate secrets and restore affected environments from known-safe backups.","briefOverview":"\u003cp\u003eCheckmarx researchers identified an npm malware campaign involving indexed-btree, a package that impersonates the legitimate sorted-btree library and has amassed 2 million weekly downloads. The package avoids npm\u0026rsquo;s install-script approval protections by hiding a malicious loader in the normal BTree.prototype.set() method rather than using preinstall, install, or postinstall scripts. This means installation appears clean, while the malicious code can run later when an application calls the method with a specific key value.\u003c/p\u003e\n\n\u003cp\u003eOnce triggered, the malware gathers system details such as architecture, hostname, CPU, memory, and uptime and sends them through hardcoded Slack and Telegram channels. It also polls an Ethereum Sepolia test-network smart contract for command-and-control information, using X25519 key exchange and AES decryption to retrieve a second-stage payload. Checkmarx linked nine additional removed npm packages to the operation, and advises anyone who installed the affected packages to rotate all secrets and restore their development environment from a safe backup.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Checkmarx identified indexed-btree as a malicious npm package impersonating the legitimate sorted-btree library, with roughly 2 million weekly downloads.","The package avoids npm install-script protections by placing its loader in the BTree.prototype.set() function, where it runs only when the application calls the function with a specific key value.","After execution, the malware collects system details and sends them through hardcoded Slack and Telegram channels, then retrieves command-and-control information from an Ethereum Sepolia test-network smart contract.","Checkmarx linked nine additional npm packages to the operation, and npm has removed them.","Developers who installed indexed-btree or the related packages are advised to rotate all secrets and restore their development environments from safe backups."],"insights":["Blocking installation scripts alone did not stop this campaign because the malicious code was embedded in a normal library function and activated during ordinary runtime use.","The runtime trigger was placed in BTree.prototype.set(), described by Checkmarx as the library's main function that users would call frequently, increasing the likelihood that affected applications would activate the loader.","The operators used an Ethereum Sepolia test-network smart contract to hold encrypted second-stage payload information, while X25519 key exchange and AES were used to decrypt it.","The malware includes a cleanup capability that can delete its files and remove the malicious package trigger, making it possible for operators to erase traces when ending the operation.","The campaign's apparently legitimate GitHub repository, fabricated commit history, and curated developer account show that package reputation signals can be deliberately constructed to appear trustworthy."],"referencedReports":[{"title":"NPM BTree Malware Campaign Affects Millions of Downloads, No Need for Install Script","url":"https://checkmarx.com/zero-post/npm-btree-malware-campaign-affects-millions-of-downloads-no-need-for-install-script/","publisher":"checkmarx","context":"The article relies on Checkmarx researchers' technical analysis of the malicious indexed-btree npm package and its runtime loader.","category":"research","primary":true}],"body":"\u003cp\u003eCheckmarx researchers identified an npm malware campaign involving indexed-btree, a package that impersonates the legitimate sorted-btree library and has amassed 2 million weekly downloads. The package avoids npm\u0026rsquo;s install-script approval protections by hiding a malicious loader in the normal BTree.prototype.set() method rather than using preinstall, install, or postinstall scripts. This means installation appears clean, while the malicious code can run later when an application calls the method with a specific key value.\u003c/p\u003e\n\n\u003cp\u003eOnce triggered, the malware gathers system details such as architecture, hostname, CPU, memory, and uptime and sends them through hardcoded Slack and Telegram channels. It also polls an Ethereum Sepolia test-network smart contract for command-and-control information, using X25519 key exchange and AES decryption to retrieve a second-stage payload. Checkmarx linked nine additional removed npm packages to the operation, and advises anyone who installed the affected packages to rotate all secrets and restore their development environment from a safe backup.\u003c/p\u003e\n"}]</script>
