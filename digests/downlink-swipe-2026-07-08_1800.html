<script type="application/json" id="dl-articles">[{"n":3,"title":"Hackers exploit Roundcube flaw to spy on academic researchers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-roundcube-flaw-to-spy-on-academic-researchers/","time":"18:56","priority":"MUST READ","score":94,"tldr":"A likely China-aligned threat cluster is exploiting unpatched Roundcube servers at U.S. and Canadian universities to steal credentials and deploy backdoors, with a focus on physics, engineering, and national security-related research. Administrators should urgently patch CVE-2024-42009 and CVE-2025-49113 and treat exposed mail servers as critical remote-access infrastructure.","briefOverview":"\u003cp\u003eA China-linked threat cluster has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities to steal credentials and deploy backdoor malware. Proofpoint tracks the activity as UNK_MassTraction and says it has been observed since May. The campaign focuses on physics and engineering departments, administrators and professors, and organizations involved in astrophysics, particle physics, or national security-related research.\u003c/p\u003e\n\n\u003cp\u003eThe attack starts with a malicious email sent from compromised accounts or spoofed domains using a generic lure. When opened in a vulnerable Roundcube webmail client, the email triggers CVE-2024-42009, a cross-site scripting flaw that runs JavaScript in the victim’s browser and loads a payload called IceCube. Proofpoint describes IceCube as a fully featured Roundcube stealer that can collect usernames, passwords, cookies, two-factor authentication data, and browser information.\u003c/p\u003e\n\n\u003cp\u003eProofpoint says IceCube uses helpers to exploit CVE-2025-49113, a Roundcube deserialization flaw, and tries to install SquareShell, a PHP webshell with remote code execution capabilities. If that fails, the malware downloads a shell script that loads VShell, a Go-based backdoor, directly in memory. Proofpoint assesses UNK_MassTraction is likely a China-aligned espionage actor but says the attribution is not high-confidence, and administrators are advised to apply the latest Roundcube security updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A China-linked threat cluster tracked by Proofpoint as UNK_MassTraction has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities since May.","The campaign targets physics and engineering departments, administrators, professors, and organizations involved in astrophysics, particle physics, or national security-related research.","The attack starts with a malicious email that triggers CVE-2024-42009 in vulnerable Roundcube clients and loads IceCube, a stealer that can harvest usernames, passwords, cookies, two-factor authentication data, and browser information.","Proofpoint says IceCube uses helpers to exploit CVE-2025-49113 and attempts to install the SquareShell PHP webshell, while failed attempts may lead to the in-memory loading of the VShell backdoor.","Proofpoint assesses that UNK_MassTraction is likely a China-aligned espionage actor, but emphasizes that the attribution is not high-confidence."],"insights":["UNK_MassTraction appears to have targeted servers that were previously identified as vulnerable to both CVE-2024-42009 and CVE-2025-49113, indicating reconnaissance before the attacks.","The campaign can begin with a generic-looking email, but simply opening it in a vulnerable Roundcube webmail client can trigger the malicious JavaScript execution.","Proofpoint highlights that internet-facing mail servers should be treated with the same diligence as VPNs and other remote access nodes because attackers are using them as footholds into internal networks.","The attribution is based on overlapping infrastructure, Chinese-language artifacts in earlier phishing emails, and tactics associated with Chinese attacks, but Proofpoint explicitly says it is not a high-confidence assessment."],"referencedReports":[{"title":"One Email Closer to the Edge: UNK_MassTraction Physics Exploitation","url":"https://www.proofpoint.com/us/blog/threat-insight/one-email-closer-edge-unkmasstraction-physics-exploitation","publisher":"Proofpoint","context":"The article cites Proofpoint’s research as the source for details on the UNK_MassTraction campaign, IceCube, and exploitation of Roundcube flaws.","category":"research","primary":true}],"body":"\u003cp\u003eA China-linked threat cluster has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities to steal credentials and deploy backdoor malware. Proofpoint tracks the activity as UNK_MassTraction and says it has been observed since May. The campaign focuses on physics and engineering departments, administrators and professors, and organizations involved in astrophysics, particle physics, or national security-related research.\u003c/p\u003e\n\n\u003cp\u003eThe attack starts with a malicious email sent from compromised accounts or spoofed domains using a generic lure. When opened in a vulnerable Roundcube webmail client, the email triggers CVE-2024-42009, a cross-site scripting flaw that runs JavaScript in the victim’s browser and loads a payload called IceCube. Proofpoint describes IceCube as a fully featured Roundcube stealer that can collect usernames, passwords, cookies, two-factor authentication data, and browser information.\u003c/p\u003e\n\n\u003cp\u003eProofpoint says IceCube uses helpers to exploit CVE-2025-49113, a Roundcube deserialization flaw, and tries to install SquareShell, a PHP webshell with remote code execution capabilities. If that fails, the malware downloads a shell script that loads VShell, a Go-based backdoor, directly in memory. Proofpoint assesses UNK_MassTraction is likely a China-aligned espionage actor but says the attribution is not high-confidence, and administrators are advised to apply the latest Roundcube security updates.\u003c/p\u003e\n"},{"n":6,"title":"Malicious Go Module Exposes GitHub Malware Lure Network Spanning 222 Repositories","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/malicious-go-module-exposes-github-malware-lure-network?utm_medium=feed","time":"20:23","priority":"MUST READ","score":92,"tldr":"A malicious Go module posing as a DNS/subdomain scanner exposed Operation Muck and Load, a GitHub-based malware lure network of 222 repositories across 190 accounts. The campaign used fake active projects, hidden PowerShell loaders, public dead drops, password-protected archives, and RAT/infostealer payloads to target developers and users likely to run untrusted tools.","briefOverview":"\u003cp\u003eResearchers investigated a malicious Go module, \u003ccode\u003egithub[.]com/kaleidora/dnsub-scanning-tool\u003c/code\u003e, that posed as a DNS and subdomain scanner. The module impersonated the expectations of a legitimate developer utility while embedding Windows malware-staging logic. The investigation exposed Operation Muck and Load, a broader GitHub-based lure network of 222 confirmed repositories across 190 accounts.\u003c/p\u003e\n\n\u003cp\u003eThe Go module launched hidden PowerShell before any meaningful scanner logic could run. It downloaded content from \u003ccode\u003emuckcoding[.]com\u003c/code\u003e, saved it as \u003ccode\u003eapi.db\u003c/code\u003e, decoded it with \u003ccode\u003ecertutil\u003c/code\u003e into \u003ccode\u003eL.ps1\u003c/code\u003e, and executed it with PowerShell execution-policy bypass. The decoded loader used public dead-drop locations, encrypted resolver material, and a hardcoded key to resolve a GitHub release URL for the password-protected \u003ccode\u003eQuixo.7z\u003c/code\u003e archive, which was extracted into a fake Microsoft Photos directory and launched as \u003ccode\u003eMicrosoft.exe\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe GitHub infrastructure used synthetic GitHub Actions commit activity to make deceptive projects look active and recently maintained. Across analyzed threat actor-controlled repositories, researchers confirmed at least 14 malware files, including loaders, downloaders, Vidar infostealer, spyware/dropper payloads, trojan-downloader activity, and Monero cryptominers related to XMRig and BitMiner. The researchers reported the confirmed GitHub infrastructure to GitHub and the malicious Go module to the Go security team, which blocked the module from the Go module proxy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers began with a malicious Go module, github[.]com/kaleidora/dnsub-scanning-tool, that posed as a DNS/subdomain scanner while embedding Windows malware-staging logic.","The Go module launched hidden PowerShell that downloaded content from muckcoding[.]com, saved it as api.db, decoded it into L.ps1 with certutil, and executed it with PowerShell execution-policy bypass.","The decoded PowerShell loader used public dead-drop locations, encrypted resolver material, and a hardcoded key to resolve a GitHub release URL for the password-protected Quixo.7z archive.","The extracted archive launched current\\Microsoft.exe from C:\\ProgramData\\Windows.Microsoft.Photos\\current\\, a fake Microsoft Photos path, and the post-staging payload set was associated with RAT and infostealer-like behavior.","Pivoting from the module revealed 222 confirmed threat actor-workflow GitHub repositories across 190 accounts, using synthetic GitHub Actions commit activity to make lure projects look active and recently maintained."],"insights":["The article treats abnormal version volume as a detection signal: the Go module had more than 1,200 versions, over 700 malicious, likely because automated GitHub Actions timestamp commits were surfacing as Go pseudo-versions.","The strongest GitHub clustering signal was not repository names but a workflow pattern that paired the reused email ischhfd83@rambler[.]ru with owner-specific commit names, allowing the actor to appear as many different maintainers while retaining a common pivot.","The loader’s use of multiple public dead-drop platforms meant the actor could update encrypted payload-location data without changing the first-stage Go module, making simple blocking of one URL or service insufficient.","The confirmed 222-repository count is intentionally conservative because the researchers only included repositories where the threat actor email and synthetic commit-farming workflow appeared together, not every suspicious or lure-themed repository.","Some repositories in the lure network directly hosted malware, including a repeated byte-identical Loader.exe across four repositories and a separate loader associated with Vidar in a similar lure theme, showing the network was used for both credibility-building and payload delivery."],"referencedReports":[{"title":"The strange tale of ischhfd83: When cybercriminals eat their own","url":"https://www.sophos.com/en-us/blog/the-strange-tale-of-ischhfd83-when-cybercriminals-eat-their-own","publisher":"Sophos","context":"The article cites Sophos researchers Matt Wixey and Andrew O’Donnell as previously reporting related ischhfd83-linked repository-backdoor activity with overlapping lure themes, staging methods, and payload behavior.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers investigated a malicious Go module, \u003ccode\u003egithub[.]com/kaleidora/dnsub-scanning-tool\u003c/code\u003e, that posed as a DNS and subdomain scanner. The module impersonated the expectations of a legitimate developer utility while embedding Windows malware-staging logic. The investigation exposed Operation Muck and Load, a broader GitHub-based lure network of 222 confirmed repositories across 190 accounts.\u003c/p\u003e\n\n\u003cp\u003eThe Go module launched hidden PowerShell before any meaningful scanner logic could run. It downloaded content from \u003ccode\u003emuckcoding[.]com\u003c/code\u003e, saved it as \u003ccode\u003eapi.db\u003c/code\u003e, decoded it with \u003ccode\u003ecertutil\u003c/code\u003e into \u003ccode\u003eL.ps1\u003c/code\u003e, and executed it with PowerShell execution-policy bypass. The decoded loader used public dead-drop locations, encrypted resolver material, and a hardcoded key to resolve a GitHub release URL for the password-protected \u003ccode\u003eQuixo.7z\u003c/code\u003e archive, which was extracted into a fake Microsoft Photos directory and launched as \u003ccode\u003eMicrosoft.exe\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe GitHub infrastructure used synthetic GitHub Actions commit activity to make deceptive projects look active and recently maintained. Across analyzed threat actor-controlled repositories, researchers confirmed at least 14 malware files, including loaders, downloaders, Vidar infostealer, spyware/dropper payloads, trojan-downloader activity, and Monero cryptominers related to XMRig and BitMiner. The researchers reported the confirmed GitHub infrastructure to GitHub and the malicious Go module to the Go security team, which blocked the module from the Go module proxy.\u003c/p\u003e\n"},{"n":1,"title":"Mount Royal University confirms breach as hackers claim attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/mount-royal-university-confirms-breach-as-hackers-claim-attack/","time":"21:26","priority":"SHOULD READ","score":82,"tldr":"Mount Royal University confirmed that attackers stole data from certain H drive folders and deleted files from both H and J drives, disrupting recovery. The CMD Organization extortion group claims responsibility and is demanding 30 BTC while threatening to leak stolen sensitive documents.","briefOverview":"\u003cp\u003eMount Royal University in Calgary confirmed that hackers breached its network in a June 17 cyberattack and stole data from its file storage systems. The incident disrupted a broad range of university systems, including online services, internet access, and certain internal systems. The university has engaged technical teams and external cybersecurity experts to investigate the incident and support recovery efforts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that data in certain folders on the university’s “H drive” was accessed and taken by an unauthorized actor, and the original copies were wiped to disrupt recovery. The affected folders contained information related to current and former students, current and former employees, and other individuals. A separate “J” drive containing departmental data was also wiped, though MRU says there is currently no evidence that J drive data was accessed or copied before deletion.\u003c/p\u003e\n\n\u003cp\u003eThe threat group CMD Organization claimed the attack and published samples of allegedly stolen data, including passport scans and other sensitive documents. The group demanded a 30 BTC ransom, about $1.9 million, and gave the university six days to respond before leaking the full set of stolen information. MRU says recovery may take several weeks to months, has reported the incident to the Alberta Information and Privacy Commissioner and law enforcement, and will notify impacted individuals once they are identified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mount Royal University in Calgary says hackers stole data from certain folders on its H drive and deleted original copies to disrupt recovery operations.","The June 17 cyberattack disrupted a broad range of university systems, including online services, internet access, and certain internal systems.","The affected H drive folders contained information related to current and former students, current and former university employees, and other individuals.","Mount Royal University says a separate J drive containing departmental data was wiped, but there is currently no evidence that its data was accessed or copied before deletion.","The CMD Organization threat group claimed the attack, published samples of allegedly stolen data, and demanded a 30 BTC ransom before leaking the full stolen dataset."],"insights":["Because the stolen H drive data was deleted, Mount Royal University says identifying exactly which individuals were affected is complicated and will take time.","CMD Organization is not only demanding a ransom from the university but also uses an auction-style system that offers stolen data exclusively to the highest bidder.","Mount Royal University is offering two years of credit monitoring and identity theft protection to current employees and people employed by the university in the past five years.","The university says recovery of affected systems may take several weeks to months, and full recovery of deleted J drive data may not be possible."],"referencedReports":[],"body":"\u003cp\u003eMount Royal University in Calgary confirmed that hackers breached its network in a June 17 cyberattack and stole data from its file storage systems. The incident disrupted a broad range of university systems, including online services, internet access, and certain internal systems. The university has engaged technical teams and external cybersecurity experts to investigate the incident and support recovery efforts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that data in certain folders on the university’s “H drive” was accessed and taken by an unauthorized actor, and the original copies were wiped to disrupt recovery. The affected folders contained information related to current and former students, current and former employees, and other individuals. A separate “J” drive containing departmental data was also wiped, though MRU says there is currently no evidence that J drive data was accessed or copied before deletion.\u003c/p\u003e\n\n\u003cp\u003eThe threat group CMD Organization claimed the attack and published samples of allegedly stolen data, including passport scans and other sensitive documents. The group demanded a 30 BTC ransom, about $1.9 million, and gave the university six days to respond before leaking the full set of stolen information. MRU says recovery may take several weeks to months, has reported the incident to the Alberta Information and Privacy Commissioner and law enforcement, and will notify impacted individuals once they are identified.\u003c/p\u003e\n"},{"n":2,"title":"Fake Paysafe, Skrill SDKs on NPM and PyPi steal credentials","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fake-paysafe-skrill-sdks-on-npm-and-pypi-steal-credentials/","time":"19:54","priority":"SHOULD READ","score":82,"tldr":"Malicious npm and PyPI packages impersonating Paysafe, Skrill, and Neteller SDKs were used to steal API keys, tokens, passwords, and other secrets from developer environments. Anyone who installed the listed packages should remove them, audit dependency trees, and rotate all secrets on affected systems.","briefOverview":"\u003cp\u003eMalicious packages on npm and PyPI impersonated Paysafe, Skrill, and Neteller payment SDKs and delivered stealer malware to developers and users of those payment applications. Socket reported that the threat actor published at least 17 malicious packages at the same time, all designed to exfiltrate credentials and access tokens to a command-and-control server hosted on Amazon Web Services. The affected payment platforms are used by e-commerce sites, online marketplaces, gaming platforms, travel businesses, financial services, SaaS providers, online betting, cryptocurrency exchanges, and Forex trading platforms.\u003c/p\u003e\n\n\u003cp\u003eThe fake packages exposed expected APIs but returned fake success responses instead of communicating with Paysafe’s backend services. Socket said the malicious code searched compromised environments for secrets including Paysafe API keys, AWS keys, GitHub tokens, npm tokens, hostnames, usernames, and API usage metadata. The npm packages attempted exfiltration only when a Paysafe API key was present and the fake SDK was called, while the PyPI packages activated the theft routine during initialization without requiring a Paysafe API key.\u003c/p\u003e\n\n\u003cp\u003eSocket’s analysis found basic anti-analysis checks that stopped execution if fewer than two CPU cores were detected or if the hostname or username suggested a virtualized environment. The researchers said the actor’s ability to pivot between npm and PyPI may make defense harder for organizations with visibility into only one ecosystem. Developers who installed any listed package were advised to rotate all secrets on any machine that imported or executed it, search dependency trees for the package names, deny requests for them at the registry proxy level, and check CI logs for PAYSAFE_API_KEY alongside the malicious package names.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious packages on npm and PyPI impersonated Paysafe, Skrill, and Neteller payment SDKs and delivered stealer malware to developers and users of those payment applications.","The threat actor published at least 17 malicious packages that exfiltrated credentials and access tokens to a command-and-control server hosted on Amazon Web Services.","The fake packages exposed expected APIs and returned fake success responses instead of communicating with Paysafe’s backend services.","Socket reported that the malware searched compromised environments for secrets including Paysafe API keys, AWS keys, GitHub tokens, npm tokens, hostnames, usernames, and API usage metadata.","Developers who installed any of the listed packages were advised to rotate all secrets on any machine that imported or executed them and to search dependency trees and CI logs for indicators of the campaign."],"insights":["The npm malware only attempted exfiltration when a Paysafe API key was present and the fake SDK was called, so merely checking for package installation may not fully indicate whether data theft occurred.","The PyPI versions were more aggressive than the npm versions because they automatically ran the theft routine during initialization and did not require a Paysafe API key to be present.","The packages exposed expected APIs and returned fake success responses, which could make integrations appear to work while secretly avoiding Paysafe’s real backend services.","Socket advised checking CI logs for PAYSAFE_API_KEY together with the malicious package names, making build-system logs a specific place to investigate potential exposure.","The campaign crossed both npm and PyPI, which Socket warned can make defense harder for teams that only monitor one software package ecosystem."],"referencedReports":[{"title":"npm/PyPI Campaign Typosquats Popular Secure Payment Apps","url":"https://socket.dev/blog/npm-pypi-campaign-typosquats-popular-secure-payment-apps","publisher":"Socket","context":"The article cites Socket’s report and analysis as the source for details on the malicious npm and PyPI packages, their behavior, and the campaign’s implications.","category":"research","primary":true}],"body":"\u003cp\u003eMalicious packages on npm and PyPI impersonated Paysafe, Skrill, and Neteller payment SDKs and delivered stealer malware to developers and users of those payment applications. Socket reported that the threat actor published at least 17 malicious packages at the same time, all designed to exfiltrate credentials and access tokens to a command-and-control server hosted on Amazon Web Services. The affected payment platforms are used by e-commerce sites, online marketplaces, gaming platforms, travel businesses, financial services, SaaS providers, online betting, cryptocurrency exchanges, and Forex trading platforms.\u003c/p\u003e\n\n\u003cp\u003eThe fake packages exposed expected APIs but returned fake success responses instead of communicating with Paysafe’s backend services. Socket said the malicious code searched compromised environments for secrets including Paysafe API keys, AWS keys, GitHub tokens, npm tokens, hostnames, usernames, and API usage metadata. The npm packages attempted exfiltration only when a Paysafe API key was present and the fake SDK was called, while the PyPI packages activated the theft routine during initialization without requiring a Paysafe API key.\u003c/p\u003e\n\n\u003cp\u003eSocket’s analysis found basic anti-analysis checks that stopped execution if fewer than two CPU cores were detected or if the hostname or username suggested a virtualized environment. The researchers said the actor’s ability to pivot between npm and PyPI may make defense harder for organizations with visibility into only one ecosystem. Developers who installed any listed package were advised to rotate all secrets on any machine that imported or executed it, search dependency trees for the package names, deny requests for them at the registry proxy level, and check CI logs for PAYSAFE_API_KEY alongside the malicious package names.\u003c/p\u003e\n"},{"n":4,"title":"Cash App owner to pay $45 million to settle allegations of lax security","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cash-app-owner-to-pay-45-million-security-allegations","time":"20:14","priority":"SHOULD READ","score":78,"tldr":"Block, the owner of Cash App, will pay $45 million to 46 states to settle allegations that it misled users about the app’s security and failed to protect or support fraud victims. The settlement also requires Cash App to maintain live customer support and reinforces related federal restitution obligations.","briefOverview":"\u003cp\u003eBlock, Inc., the owner of Cash App, will pay $45 million to settle allegations from dozens of states that it misled users about the payment app’s security and exposed them to fraud. State attorneys general said the company incorrectly promised users that Cash App offered the same protections as a bank. New York Attorney General Letitia James said Block failed to help users when they were scammed and failed to provide promised fraud protection and resolution required by law.\u003c/p\u003e\n\n\u003cp\u003eThe agreement involved 46 states, with Texas set to receive \u003cspan class=\"math inline\"\u003e\\(5 million and New York set to receive \\)\u003c/span\u003e1.6 million. Texas Attorney General Ken Paxton said lax verification standards, a years-long absence of phone support, and deceptive social media promotions left users exposed to scammers. He also said Cash App delayed internal fraud investigations and used unwarranted account lockouts that left victims with no way to recover stolen funds.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that Cash App had no customer support phone number, causing users to search online and call fake numbers set up by scammers. They also found that the app did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open, allowing one bad actor to operate a network of scam accounts. The consent judgment requires Block to maintain 24-hour live support, with at least 13.5 hours covered by a real person, and reaffirms a related federal agreement for Block to distribute between \u003cspan class=\"math inline\"\u003e\\(75 million and \\)\u003c/span\u003e120 million to states.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Block, Inc., the owner of Cash App, will pay $45 million to settle allegations from 46 states that it misled users about the payment app’s security and exposed them to fraud.","State attorneys general said Cash App falsely promised users protections similar to a bank and failed to provide promised fraud protection and resolution required by law.","Investigators found that Cash App had no customer support phone number for years, leading users to find and call fake support numbers set up by scammers.","Investigators said Cash App did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open, allowing bad actors to operate networks of scam accounts.","The consent judgments require Block to maintain 24-hour live support, including at least 13.5 hours covered by a real person, and reaffirm a related federal agreement for Block to distribute $75 million to $120 million to states."],"insights":["The lack of an official Cash App support phone number created a separate fraud pathway because users searching online for help were directed to fake numbers run by scammers.","The settlement treats customer support availability as a security control by requiring 24-hour live support and at least 13.5 hours of coverage by a real person.","The allegations show that marketing a payment app as having bank-like protections can become a legal issue when users do not receive the fraud protection and resolution they were promised.","The state settlement is tied to a separate federal CFPB order, showing that Block faces overlapping obligations from both state attorneys general and federal regulators over the same fraud-related failures."],"referencedReports":[],"body":"\u003cp\u003eBlock, Inc., the owner of Cash App, will pay $45 million to settle allegations from dozens of states that it misled users about the payment app’s security and exposed them to fraud. State attorneys general said the company incorrectly promised users that Cash App offered the same protections as a bank. New York Attorney General Letitia James said Block failed to help users when they were scammed and failed to provide promised fraud protection and resolution required by law.\u003c/p\u003e\n\n\u003cp\u003eThe agreement involved 46 states, with Texas set to receive \u003cspan class=\"math inline\"\u003e\\(5 million and New York set to receive \\)\u003c/span\u003e1.6 million. Texas Attorney General Ken Paxton said lax verification standards, a years-long absence of phone support, and deceptive social media promotions left users exposed to scammers. He also said Cash App delayed internal fraud investigations and used unwarranted account lockouts that left victims with no way to recover stolen funds.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that Cash App had no customer support phone number, causing users to search online and call fake numbers set up by scammers. They also found that the app did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open, allowing one bad actor to operate a network of scam accounts. The consent judgment requires Block to maintain 24-hour live support, with at least 13.5 hours covered by a real person, and reaffirms a related federal agreement for Block to distribute between \u003cspan class=\"math inline\"\u003e\\(75 million and \\)\u003c/span\u003e120 million to states.\u003c/p\u003e\n"},{"n":8,"title":"DHS Revives Critical Infrastructure Threat Sharing, Without the Legal Shield Industry Wants","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/dhs-revives-critical-infrastructure-threat-sharing-without-the-legal-shield-industry-wants/","time":"18:32","priority":"SHOULD READ","score":78,"tldr":"DHS has launched ANCHOR-CI to restore formal cyber and physical threat-sharing between government and critical infrastructure sectors, but it does not include the liability protections industry had under CIPAC. Health-ISAC warned that the missing legal shield may limit candid discussions about sensitive cyber incidents and vulnerabilities.","briefOverview":"\u003cp\u003eThe Department of Homeland Security has created the Alliance of National Councils for Homeland Operational Resilience – Critical Infrastructure, known as ANCHOR-CI. The article describes ANCHOR-CI as a successor to the critical infrastructure partnership system DHS dismantled 15 months earlier. The new structure restores a formal channel for government and industry to discuss cyber and physical threats.\u003c/p\u003e\n\n\u003cp\u003eA major difference from the former Critical Infrastructure Partnership Advisory Council, or CIPAC, is that ANCHOR-CI does not include liability protections that industry valued. The article says those protections gave executives confidence to discuss incidents in group settings without antitrust or regulatory exposure. The DHS filing establishing ANCHOR-CI omits those protections.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, flagged the missing legal protections as a concern. He said the government must address the legal exposures that keep companies from discussing sensitive cyber incidents. He also noted that industry leaders relied on CIPAC’s protections to have candid, strategic conversations about vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Department of Homeland Security has created ANCHOR-CI as a successor to the critical infrastructure partnership system it dismantled 15 months ago.","ANCHOR-CI restores a formal channel for government and industry to discuss cyber and physical threats.","The charter establishing ANCHOR-CI omits the liability protections that participants had under the former CIPAC council.","Industry valued CIPAC’s liability protections because they gave executives confidence to discuss incidents in group settings without antitrust or regulatory exposure.","Errol Weiss of Health-ISAC said the government must address legal exposures that prevent companies from discussing sensitive cyber incidents and vulnerabilities."],"insights":["The restored threat-sharing channel may be less useful to industry than the former system because the article identifies legal protection, not access to meetings, as the feature companies valued most.","The omission of liability protections creates a practical barrier to candid discussion even though ANCHOR-CI formally reopens government-industry communication.","Health-ISAC’s concern highlights that healthcare security leaders see legal exposure as a blocker to sharing sensitive cyber incident details in group settings.","The article frames the ANCHOR-CI charter as a partial revival of the old partnership model rather than a full replacement for CIPAC."],"referencedReports":[],"body":"\u003cp\u003eThe Department of Homeland Security has created the Alliance of National Councils for Homeland Operational Resilience – Critical Infrastructure, known as ANCHOR-CI. The article describes ANCHOR-CI as a successor to the critical infrastructure partnership system DHS dismantled 15 months earlier. The new structure restores a formal channel for government and industry to discuss cyber and physical threats.\u003c/p\u003e\n\n\u003cp\u003eA major difference from the former Critical Infrastructure Partnership Advisory Council, or CIPAC, is that ANCHOR-CI does not include liability protections that industry valued. The article says those protections gave executives confidence to discuss incidents in group settings without antitrust or regulatory exposure. The DHS filing establishing ANCHOR-CI omits those protections.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, flagged the missing legal protections as a concern. He said the government must address the legal exposures that keep companies from discussing sensitive cyber incidents. He also noted that industry leaders relied on CIPAC’s protections to have candid, strategic conversations about vulnerabilities.\u003c/p\u003e\n"},{"n":5,"title":"Greek victims file lawsuit against Intellexa over Predator spyware","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/greek-victims-file-lawsuit-against-intellexa-spyware","time":"20:20","priority":"MAY READ","score":68,"tldr":"Eight Greeks allegedly targeted with Predator spyware are suing Intellexa and 13 associated individuals for about €7.6 million in damages over privacy and communications violations. The case follows Greece’s Predator scandal, prior prison sentences for Intellexa’s founder and associates, and claims by the founder that the Greek government was responsible for targeting.","briefOverview":"\u003cp\u003eEight Greeks who were snooped on by Predator spyware sued surveillance technology manufacturer Intellexa on Tuesday, along with 13 individuals tied to the company. Their lawyer, Zacharias Kesses, said the victims are seeking about €7.6 million in total compensation. The damages are meant to address alleged moral harm from illegal violations of privacy, communications confidentiality, and personal data after spyware was confirmed on their devices.\u003c/p\u003e\n\n\u003cp\u003eThe Predator spyware scandal became public in 2022, when traces of the spyware were found on dozens of phones. The scandal led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff. Plaintiffs in the lawsuit include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris, and a former intelligence and law enforcement official.\u003c/p\u003e\n\n\u003cp\u003eA trial is scheduled to start in April 2027. Intellexa founder Tal Dilian and three associates were previously sentenced to more than 126 years in prison for their role in the scandal, but under Greek law they will serve only 8 years and remain free until the appeals process ends. Dilian has said Intellexa sold Predator only to government customers, including the Greek government and its national intelligence agency, and accused them of using the case to hide their own wrongdoing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Eight Greeks who were snooped on by Predator spyware sued Intellexa and 13 individuals tied to the company on Tuesday.","The victims are seeking about €7.6 million in total compensation for alleged moral damage from violations of their privacy, communications confidentiality and personal data.","The Predator spyware scandal became public in 2022 after traces were found on dozens of phones and led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff.","Plaintiffs include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris and a former intelligence and law enforcement official.","Intellexa founder Tal Dilian and three associates were sentenced to more than 126 years in prison, but under Greek law they will serve only 8 years and remain free until appeals end."],"insights":["The civil lawsuit targets not only Intellexa but also 13 individuals tied to the company, indicating the plaintiffs are pursuing accountability across the alleged company and personal network behind Predator rather than only the corporate entity.","The lawsuit is framed as a step toward accountability at both national and European levels, showing the case may have significance beyond compensation for the eight named victims.","Tal Dilian’s public defense shifts responsibility to the Greek government and national intelligence agency, creating a direct conflict between the spyware vendor’s account and the accountability process described by the victims’ lawyer.","Although Intellexa’s founder and associates received sentences totaling more than 126 years, the article notes they would serve only 8 years under Greek law and remain free during appeals, highlighting a major gap between headline sentences and immediate consequences."],"referencedReports":[],"body":"\u003cp\u003eEight Greeks who were snooped on by Predator spyware sued surveillance technology manufacturer Intellexa on Tuesday, along with 13 individuals tied to the company. Their lawyer, Zacharias Kesses, said the victims are seeking about €7.6 million in total compensation. The damages are meant to address alleged moral harm from illegal violations of privacy, communications confidentiality, and personal data after spyware was confirmed on their devices.\u003c/p\u003e\n\n\u003cp\u003eThe Predator spyware scandal became public in 2022, when traces of the spyware were found on dozens of phones. The scandal led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff. Plaintiffs in the lawsuit include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris, and a former intelligence and law enforcement official.\u003c/p\u003e\n\n\u003cp\u003eA trial is scheduled to start in April 2027. Intellexa founder Tal Dilian and three associates were previously sentenced to more than 126 years in prison for their role in the scandal, but under Greek law they will serve only 8 years and remain free until the appeals process ends. Dilian has said Intellexa sold Predator only to government customers, including the Greek government and its national intelligence agency, and accused them of using the case to hide their own wrongdoing.\u003c/p\u003e\n"},{"n":7,"title":"Introducing Secret Exfiltration Protection for GitHub Actions","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/introducing-secret-exfiltration-protection-for-github-actions","time":"19:46","priority":"MAY READ","score":68,"tldr":"Recent supply chain campaigns show attackers are using stolen GitHub tokens to add malicious GitHub Actions workflows that dump repository secrets from CI runners. StepSecurity is introducing controls to block unreviewed workflows from accessing secrets and detect exfiltration attempts when they run.","briefOverview":"\u003cp\u003eStepSecurity describes recent supply chain campaigns in which attackers used stolen GitHub tokens to commit malicious GitHub Actions workflows into repositories. The workflows caused CI runners to read repository secrets and exfiltrate them before the run finished. The article highlights GhostAction, Megalodon, Miasma, and Hades as campaigns that used or evolved toward this pattern.\u003c/p\u003e\n\n\u003cp\u003eGhostAction reached 327 users across 817 repositories and stole 3,325 secrets, while Megalodon injected backdoored workflow files into more than 5,500 repositories in a six-hour window. Hades planted a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, and then deleted evidence such as the run and branch. The article says branch protection and code review often miss this activity because attackers can push workflows to temporary non-default branches without opening pull requests.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity presents two defenses for this problem: a Secret Exfiltration Policy and a Secret Exfiltration Attempt detection in Harden-Runner. The policy blocks unreviewed modified workflows in non-default branches from using secrets unless explicitly approved. The detection flags runs that combine indicators such as known malicious workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts, and notifications can be enabled for these detections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says recent supply chain campaigns used stolen GitHub tokens to commit malicious GitHub Actions workflows that allowed CI runners to read and exfiltrate repository secrets.","The GhostAction campaign reached 327 users across 817 repositories and stole 3,325 secrets, including npm, PyPI, and DockerHub tokens.","The Megalodon campaign injected backdoored workflow files into more than 5,500 repositories in a six-hour window by targeting repositories where branch protection did not require review.","The Hades campaign committed a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, then deleted the run and branch.","StepSecurity’s Secret Exfiltration Policy blocks unreviewed workflows from using secrets, while Harden-Runner’s Secret Exfiltration Attempt detection flags runs with indicators such as known workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts."],"insights":["Branch protection and code review can be bypassed when attackers push malicious workflows to temporary non-default branches, because no pull request is opened and the default branch is not changed.","Workflow files can look hardened while still being malicious, as the Hades payload used ordinary names, pinned GitHub Actions by commit SHA, and hid the secret-dumping behavior in an environment variable.","The CI runner is a high-value exfiltration point because it is described as the one place that legitimately holds every repository secret at once.","Detecting secret theft attempts is more effective when multiple signals appear together in one run, such as a known malicious workflow name, toJSON(secrets), a known commit message, and an exfiltration artifact.","The article emphasizes that prevention and detection serve different roles: blocking unreviewed workflow secret access stops the payoff, while detections help identify targeted repositories and guide follow-up actions such as secret rotation and token compromise investigation."],"referencedReports":[],"body":"\u003cp\u003eStepSecurity describes recent supply chain campaigns in which attackers used stolen GitHub tokens to commit malicious GitHub Actions workflows into repositories. The workflows caused CI runners to read repository secrets and exfiltrate them before the run finished. The article highlights GhostAction, Megalodon, Miasma, and Hades as campaigns that used or evolved toward this pattern.\u003c/p\u003e\n\n\u003cp\u003eGhostAction reached 327 users across 817 repositories and stole 3,325 secrets, while Megalodon injected backdoored workflow files into more than 5,500 repositories in a six-hour window. Hades planted a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, and then deleted evidence such as the run and branch. The article says branch protection and code review often miss this activity because attackers can push workflows to temporary non-default branches without opening pull requests.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity presents two defenses for this problem: a Secret Exfiltration Policy and a Secret Exfiltration Attempt detection in Harden-Runner. The policy blocks unreviewed modified workflows in non-default branches from using secrets unless explicitly approved. The detection flags runs that combine indicators such as known malicious workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts, and notifications can be enabled for these detections.\u003c/p\u003e\n"},{"n":9,"title":"From Days to Minutes: AI-Assisted Rule Writing for Threat Hunters | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/ai-assisted-rule-writing","time":"20:00","priority":"MAY READ","score":35,"tldr":"Corelight argues that AI-assisted rule writing can help threat hunters turn detection ideas into usable rules in minutes instead of days, speeding up investigation and response workflows.","briefOverview":"\u003cp\u003eCorelight’s article is titled “From Days to Minutes: AI-Assisted Rule Writing for Threat Hunters.” The readable information indicates that it focuses on using AI assistance to help threat hunters write rules. The title frames the main benefit as reducing that work from days to minutes.\u003c/p\u003e\n\n\u003cp\u003eThe article’s significance is presented around speed in threat-hunting work. By emphasizing AI-assisted rule writing, it points to a workflow where security teams create detection rules more quickly. The key technical detail available from the provided article text is the use of AI assistance in the rule-writing process.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is from Corelight and focuses on AI-assisted rule writing for threat hunters.","The article presents AI assistance as a way to reduce rule-writing time from days to minutes.","The article’s title frames faster rule creation as useful for threat hunters."],"insights":["The article frames AI assistance as a way to compress a specific threat-hunting workflow, rule writing, rather than replacing threat hunters outright.","The title suggests the practical value of AI is measured by operational speed, reducing work from days to minutes."],"referencedReports":[],"body":"\u003cp\u003eCorelight’s article is titled “From Days to Minutes: AI-Assisted Rule Writing for Threat Hunters.” The readable information indicates that it focuses on using AI assistance to help threat hunters write rules. The title frames the main benefit as reducing that work from days to minutes.\u003c/p\u003e\n\n\u003cp\u003eThe article’s significance is presented around speed in threat-hunting work. By emphasizing AI-assisted rule writing, it points to a workflow where security teams create detection rules more quickly. The key technical detail available from the provided article text is the use of AI assistance in the rule-writing process.\u003c/p\u003e\n"}]</script>
