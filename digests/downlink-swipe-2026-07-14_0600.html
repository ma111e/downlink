<script type="application/json" id="dl-articles">[{"n":8,"title":"Coordinated AsyncAPI Supply Chain Attack: Miasma RAT Delivered via Compromised CI/CD Pipelines in Two Repositories","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","time":"09:55","priority":"MUST READ","score":95,"tldr":"Attackers compromised push access to two AsyncAPI GitHub repositories and used legitimate GitHub Actions release workflows with npm OIDC provenance to publish malicious package versions containing a Miasma RAT dropper. The key lesson is that valid provenance proves a trusted pipeline built the package, but it does not prove the triggering commit was legitimate.","briefOverview":"\u003cp\u003eOn July 14, 2026, a coordinated supply chain attack affected two AsyncAPI GitHub repositories and led to malicious npm releases of four packages. The affected versions were @asyncapi/generator@3.3.1, @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, and @asyncapi/specs@6.11.2, with @asyncapi/specs@6.11.2-alpha.1 also published during the incident. The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release workflows to publish the packages via npm’s GitHub OIDC trusted-publisher integration, with no npm token stolen.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the packages carried legitimate SLSA provenance attestations, but those attestations only proved that the authorized project workflow produced them. They did not prove that the commits triggering the workflows were legitimate. Both repository compromises used the same placeholder git identity, shared the same Miasma RAT second-stage payload infrastructure, and showed the same drop behavior.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was an obfuscated dropper that ran when the poisoned library was loaded, not during package installation. It spawned a hidden detached Node.js process, fetched an IPFS-hosted sync.js payload, wrote it to an OS-specific hidden “NodeJS” directory, and launched it. Static analysis identified the decrypted payload as “Miasma v3,” with capabilities including multiple command-and-control channels, credential harvesting, AI tool poisoning, local network movement, persistence, shell execution, and self-destruct functionality.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A coordinated supply chain attack on July 14, 2026 compromised two AsyncAPI GitHub repositories and produced malicious npm package versions for @asyncapi/generator, @asyncapi/generator-helpers, @asyncapi/generator-components, and @asyncapi/specs.","The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release pipelines with npm GitHub OIDC trusted-publisher integration, so no npm token was stolen.","The malicious packages carried an obfuscated dropper that executed when the library was loaded during normal use, not during npm installation.","Static analysis showed the dropper fetched an IPFS-hosted second-stage sync.js payload and installed it in hidden OS-specific NodeJS directories before launching it detached and hidden.","The decrypted second-stage payload was identified as Miasma v3 and included multiple command-and-control channels, credential harvesting, persistence, lateral movement, shell execution, and self-destruct capabilities."],"insights":["The packages had legitimate SLSA provenance attestations, but the article emphasizes that this only proved the authorized workflow published them and did not prove the triggering commits were legitimate.","The dropper did not use npm install scripts, so defenses focused only on install-time behavior could miss it because it ran when the poisoned library was loaded during normal use.","The malicious code was padded with roughly a thousand leading spaces to push it off-screen in GitHub’s diff view, making human review of the commit less likely to notice it.","The same placeholder git identity, second-stage infrastructure, and drop behavior across two separate repositories showed the incidents were coordinated rather than isolated package compromises.","The Miasma payload included several fallback communication methods, including HTTP, Nostr, IPFS, BitTorrent DHT, libp2p GossipSub, and Ethereum, meaning blocking only the primary C2 endpoint would not fully cut off the implant."],"referencedReports":[],"body":"\u003cp\u003eOn July 14, 2026, a coordinated supply chain attack affected two AsyncAPI GitHub repositories and led to malicious npm releases of four packages. The affected versions were @asyncapi/generator@3.3.1, @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, and @asyncapi/specs@6.11.2, with @asyncapi/specs@6.11.2-alpha.1 also published during the incident. The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release workflows to publish the packages via npm’s GitHub OIDC trusted-publisher integration, with no npm token stolen.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the packages carried legitimate SLSA provenance attestations, but those attestations only proved that the authorized project workflow produced them. They did not prove that the commits triggering the workflows were legitimate. Both repository compromises used the same placeholder git identity, shared the same Miasma RAT second-stage payload infrastructure, and showed the same drop behavior.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was an obfuscated dropper that ran when the poisoned library was loaded, not during package installation. It spawned a hidden detached Node.js process, fetched an IPFS-hosted sync.js payload, wrote it to an OS-specific hidden “NodeJS” directory, and launched it. Static analysis identified the decrypted payload as “Miasma v3,” with capabilities including multiple command-and-control channels, credential harvesting, AI tool poisoning, local network movement, persistence, shell execution, and self-destruct functionality.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft Maps Three Salesforce Attack Paths Tied to a Year of ShinyHunters Activity","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-maps-year-long-shinyhunters.html","time":"06:19","priority":"MUST READ","score":92,"tldr":"Microsoft says ShinyHunters-linked actors spent a year stealing data from Salesforce environments by abusing trusted access rather than Salesforce flaws, including malicious OAuth consent, stolen vendor OAuth tokens, and misconfigured guest access. The key defense is to monitor and govern connected apps, OAuth scopes, API activity, and guest permissions, not just user logins.","briefOverview":"\u003cp\u003eMicrosoft reported that attackers whose methods align with ShinyHunters spent from mid-2025 into mid-2026 accessing corporate Salesforce environments without exploiting a Salesforce platform flaw. The activity relied on trust that organizations had already granted through OAuth connections, third-party integrations, and guest access settings. Microsoft mapped the campaigns to three paths: vishing that led employees to approve malicious connected apps, stolen OAuth tokens from compromised vendors, and misconfigured guest access to Salesforce sites.\u003c/p\u003e\n\n\u003cp\u003eThe article says this activity is difficult to detect because access can come from a real user-approved app or an integration the organization already trusts. Sign-in and authentication monitoring may show little because the important signal is what the app or account does after it gains access. Microsoft linked the patterns to incidents involving Salesloft Drift, Gainsight, and Klue, and said activity affected tenants in industries including retail, education, and manufacturing.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft and Salesforce added capabilities in Defender for Cloud Apps to surface Salesforce Real-Time Event Monitoring data, connected-app attribution, OAuth scopes, session context, and API activity. Microsoft also added governance features to identify highly privileged connected apps, unused apps inactive for 90 days or more, and app risk scores. The article’s guidance centers on inventorying connected apps, removing unused integrations, applying least privilege, monitoring Salesforce event logs, locking down Experience Cloud guest access, and revoking or rotating tokens when integrations behave unusually.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that attackers whose methods align with ShinyHunters accessed corporate Salesforce environments from mid-2025 into mid-2026 without exploiting a Salesforce platform flaw.","Microsoft mapped the activity to three intrusion paths: vishing that tricked employees into approving a malicious connected app, stolen OAuth tokens from compromised software vendors, and misconfigured guest access to Salesforce sites.","The vishing campaign involved attackers posing as IT support and persuading employees to authorize an attacker-controlled connected app disguised as Salesforce’s Data Loader tool.","In vendor-related incidents involving Salesloft Drift, Gainsight, and Klue, attackers used trusted integrations or stolen tokens to access Salesforce customer environments and export data.","Microsoft and Salesforce added Defender for Cloud Apps capabilities to surface Salesforce Real-Time Event Monitoring data, connected-app attribution, OAuth scopes, API context, and governance features for risky or unused connected apps."],"insights":["The article highlights that sign-in and authentication monitoring can miss these campaigns because the activity may come from a real user-approved app or a trusted integration rather than from a suspicious login.","The Salesloft Drift and Klue incidents show that a compromise at one software vendor can become a path into many downstream Salesforce customer environments through existing app connections.","Microsoft’s recommended detection focus shifts from who signed in to what a connected app did after access, including which app made API calls, what permissions it held, and whether its querying behavior was normal.","Unused integrations remain a concrete risk because Microsoft added a feature to surface connected apps that have been inactive for 90 days or more while still retaining live permissions.","The guest-access cases show that attackers could retrieve more data than intended from Salesforce Experience Cloud sites without credentials when guest-user permissions were left too broad."],"referencedReports":[{"title":"Defending SaaS-based applications against ShinyHunters OAuth abuse","url":"https://www.microsoft.com/en-us/security/blog/2026/07/13/defending-saas-based-applications-against-shinyhunters-oauth-abuse/","publisher":"Microsoft","context":"The article says Microsoft published research on July 13 mapping the Salesforce campaigns to three intrusion techniques and describing related detection and governance tooling.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft reported that attackers whose methods align with ShinyHunters spent from mid-2025 into mid-2026 accessing corporate Salesforce environments without exploiting a Salesforce platform flaw. The activity relied on trust that organizations had already granted through OAuth connections, third-party integrations, and guest access settings. Microsoft mapped the campaigns to three paths: vishing that led employees to approve malicious connected apps, stolen OAuth tokens from compromised vendors, and misconfigured guest access to Salesforce sites.\u003c/p\u003e\n\n\u003cp\u003eThe article says this activity is difficult to detect because access can come from a real user-approved app or an integration the organization already trusts. Sign-in and authentication monitoring may show little because the important signal is what the app or account does after it gains access. Microsoft linked the patterns to incidents involving Salesloft Drift, Gainsight, and Klue, and said activity affected tenants in industries including retail, education, and manufacturing.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft and Salesforce added capabilities in Defender for Cloud Apps to surface Salesforce Real-Time Event Monitoring data, connected-app attribution, OAuth scopes, session context, and API activity. Microsoft also added governance features to identify highly privileged connected apps, unused apps inactive for 90 days or more, and app risk scores. The article’s guidance centers on inventorying connected apps, removing unused integrations, applying least privilege, monitoring Salesforce event logs, locking down Experience Cloud guest access, and revoking or rotating tokens when integrations behave unusually.\u003c/p\u003e\n"},{"n":7,"title":"Compromised npm Packages in the AsyncAPI Namespace Deliver Miasma Botnet Loader","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/asyncapi-supply-chain-attack?utm_medium=feed","time":"08:20","priority":"SHOULD READ","score":88,"tldr":"Three compromised npm packages in the @asyncapi namespace were found delivering a multi-stage Miasma botnet loader that runs when the packages are required and persists as a disguised NodeJS sync.js file. Users should avoid the affected versions, upgrade when patched, investigate developer and CI systems, and rotate exposed credentials.","briefOverview":"\u003cp\u003eSocket\u0026rsquo;s Threat Research Team identified three compromised npm packages in the \u003ccode\u003e@asyncapi\u003c/code\u003e namespace distributing a multi-stage botnet loader. The affected packages are \u003ccode\u003e@asyncapi/generator-helpers\u003c/code\u003e v1.1.1, \u003ccode\u003e@asyncapi/generator-components\u003c/code\u003e v0.7.1, and \u003ccode\u003e@asyncapi/generator\u003c/code\u003e v3.3.1. The packages are used in tooling workflows that generate API documentation and client code from AsyncAPI definitions, so the malicious payload may run during normal development or CI execution.\u003c/p\u003e\n\n\u003cp\u003eCurrent analysis indicates that the first-stage payload was injected into \u003ccode\u003esrc/utils.js\u003c/code\u003e, hidden behind a large block of leading whitespace, and executed at \u003ccode\u003erequire()\u003c/code\u003e time. Stage 1 launches a detached Node.js child process that downloads an encrypted second-stage payload from IPFS, with the observed IPFS target listed as \u003ccode\u003ehxxps://ipfs[.]io/ipfs/QmQobZSp1wRPrpSEQ56qnyq7ecZh5Bg5k1fnjt4SUwwHb9\u003c/code\u003e. The second stage persists as \u003ccode\u003esync.js\u003c/code\u003e in platform-specific directories disguised as NodeJS on macOS, Linux, and Windows.\u003c/p\u003e\n\n\u003cp\u003eThe decrypted second-stage payload is identified as Miasma and is described as a botnet framework with capabilities for shell command execution, file operations, credential harvesting, evasion checks, persistence, and multi-protocol command and control. Users are advised to avoid the affected versions, upgrade to patched releases when available, and review developer and CI environments for signs of compromise. The article also recommends rotating credentials exposed to systems where the packages were installed and monitoring for detached Node.js child processes, connections to \u003ccode\u003e85[.]137[.]53[.]71\u003c/code\u003e, and unexpected modifications in listed directories such as \u003ccode\u003e.claude\u003c/code\u003e, \u003ccode\u003e.vscode\u003c/code\u003e, \u003ccode\u003e.cursorrules\u003c/code\u003e, and NodeJS application data paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket's Threat Research Team identified three compromised npm packages in the @asyncapi namespace distributing a multi-stage botnet loader.","The affected packages are @asyncapi/generator-helpers version 1.1.1, @asyncapi/generator-components version 0.7.1, and @asyncapi/generator version 3.3.1.","The first-stage payload was injected into src/utils.js, hidden behind leading whitespace, executed at require() time, launched a detached Node.js child process, and downloaded a second-stage payload from IPFS.","The second-stage payload persists as sync.js in platform-specific directories disguised as NodeJS on macOS, Linux, and Windows.","Users are advised to avoid the affected versions, upgrade to patched releases when available, review developer and CI environments for compromise, and rotate credentials exposed to systems where the packages were installed."],"insights":["The malicious code can run during normal development or CI use because it executes when the package is imported, not through a separate install hook.","The payload was concealed inside a legitimate source file using a large block of leading whitespace, making a simple file review less likely to spot the injected code.","The persistence path is disguised as a normal-looking NodeJS location across macOS, Linux, and Windows, giving defenders specific directories to inspect.","The article specifically prioritizes rotating npm tokens, GitHub tokens, cloud credentials, SSH keys, and CI secrets for any systems where the affected packages were installed."],"referencedReports":[],"body":"\u003cp\u003eSocket\u0026rsquo;s Threat Research Team identified three compromised npm packages in the \u003ccode\u003e@asyncapi\u003c/code\u003e namespace distributing a multi-stage botnet loader. The affected packages are \u003ccode\u003e@asyncapi/generator-helpers\u003c/code\u003e v1.1.1, \u003ccode\u003e@asyncapi/generator-components\u003c/code\u003e v0.7.1, and \u003ccode\u003e@asyncapi/generator\u003c/code\u003e v3.3.1. The packages are used in tooling workflows that generate API documentation and client code from AsyncAPI definitions, so the malicious payload may run during normal development or CI execution.\u003c/p\u003e\n\n\u003cp\u003eCurrent analysis indicates that the first-stage payload was injected into \u003ccode\u003esrc/utils.js\u003c/code\u003e, hidden behind a large block of leading whitespace, and executed at \u003ccode\u003erequire()\u003c/code\u003e time. Stage 1 launches a detached Node.js child process that downloads an encrypted second-stage payload from IPFS, with the observed IPFS target listed as \u003ccode\u003ehxxps://ipfs[.]io/ipfs/QmQobZSp1wRPrpSEQ56qnyq7ecZh5Bg5k1fnjt4SUwwHb9\u003c/code\u003e. The second stage persists as \u003ccode\u003esync.js\u003c/code\u003e in platform-specific directories disguised as NodeJS on macOS, Linux, and Windows.\u003c/p\u003e\n\n\u003cp\u003eThe decrypted second-stage payload is identified as Miasma and is described as a botnet framework with capabilities for shell command execution, file operations, credential harvesting, evasion checks, persistence, and multi-protocol command and control. Users are advised to avoid the affected versions, upgrade to patched releases when available, and review developer and CI environments for signs of compromise. The article also recommends rotating credentials exposed to systems where the packages were installed and monitoring for detached Node.js child processes, connections to \u003ccode\u003e85[.]137[.]53[.]71\u003c/code\u003e, and unexpected modifications in listed directories such as \u003ccode\u003e.claude\u003c/code\u003e, \u003ccode\u003e.vscode\u003c/code\u003e, \u003ccode\u003e.cursorrules\u003c/code\u003e, and NodeJS application data paths.\u003c/p\u003e\n"},{"n":2,"title":"U.S. Sanctions First VPN Service and Malware Cryptor Seller Over Ransomware Support","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/us-sanctions-first-vpn-service-and.html","time":"08:02","priority":"SHOULD READ","score":86,"tldr":"The U.S. sanctioned First VPN Service and two individuals for allegedly helping ransomware groups hide their activity and evade detection, while the U.K. and E.U. also imposed sanctions on Russian-linked cyber networks. The actions highlight governments’ efforts to disrupt infrastructure and services that enable ransomware, malware concealment, and state-backed cyber operations.","briefOverview":"\u003cp\u003eThe U.S. Treasury Department’s Office of Foreign Assets Control designated First VPN Service, also known as 1VPNS, and two individuals for enabling ransomware actors and other cybercriminals. The sanctioned individuals are Dmytro Rashevskyi, a Ukrainian administrator of the VPN service, and Yegeniy Vladimirovich Silayev, a Belarusian national accused of selling cryptors that helped disguise ransomware and other malware as safe programs. U.S. officials said ransomware groups using services supplied by the designated parties caused billions of dollars in losses to American businesses and critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eFirst VPN Service was dismantled in May 2026 during a joint law enforcement operation by European and North American authorities. The service had operated since 2014 and advertised that it did not keep logs of user identities or activities and did not cooperate with law enforcement over illegal activity from its rented servers. The Treasury said several ransomware groups used First VPN to attack U.S. businesses, financial services companies, hospitals, and municipal governments while hiding their true origins, deploying malware, and managing stolen data.\u003c/p\u003e\n\n\u003cp\u003eThe article also reports that the U.K. and E.U. sanctioned 24 Russian-linked individuals and entities tied to destructive cyber and hybrid operations, including GRU leaders, FSB Centre 16, and actors connected to Lumma Stealer. Separately, the FBI issued an advisory stating that FSB Center 16 actors scan for poorly configured networking devices, mainly routers with active SNMP agents that accept common or default community strings. The activity includes SNMP Set-Requests that direct devices to copy configurations to attacker-controlled or compromised servers, as well as abuse of Cisco vulnerabilities CVE-2018-0171 and CVE-2008-4128.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department’s Office of Foreign Assets Control designated First VPN Service, its Ukrainian administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware actors and other cybercriminals.","First VPN Service was dismantled in May 2026 during a joint European and North American law enforcement operation after operating since 2014 and advertising that it did not keep user logs or cooperate with law enforcement.","The Treasury said several ransomware groups used First VPN Service to attack U.S. companies and institutions, including businesses, financial services companies, hospitals, and municipal governments.","The U.K. and E.U. sanctioned 24 Russian-linked individuals and entities tied to destructive cyber and hybrid operations, including GRU leaders, FSB Centre 16, and individuals behind Lumma Stealer.","The FBI said FSB Center 16 actors scan for poorly configured networking devices, mainly routers with active SNMP agents using common or default community strings, and also abuse Cisco device vulnerabilities including CVE-2018-0171 and CVE-2008-4128."],"insights":["The article shows that authorities are targeting not only ransomware operators but also the supporting services that make attacks harder to trace, including VPN infrastructure and malware cryptors.","First VPN Service’s advertised refusal to keep user logs or cooperate with law enforcement was presented as a feature that helped attract criminal use over a long period, with the service operating from 2014 until its 2026 takedown.","Rashevskyi allegedly used false identities to buy infrastructure from companies that might otherwise have refused him because of abuse complaints tied to 1VPNS servers.","The FBI advisory highlights that basic router misconfigurations, such as SNMP agents accepting common or default community strings, are being used by Russian FSB Center 16 actors to access and copy device configurations.","CISA’s addition of CVE-2008-4128 to its Known Exploited Vulnerabilities catalog creates an immediate remediation deadline for U.S. federal agencies, requiring fixes by July 16, 2026."],"referencedReports":[{"title":"FBI advisory on FSB Center 16 exploitation of vulnerable networking devices","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-194a","publisher":"U.S. Federal Bureau of Investigation","context":"The article cites this new advisory for details on FSB Center 16 actors scanning for poorly configured routers and exploiting vulnerable networking devices.","category":"advisory","primary":false},{"title":"FBI advisory on FSB Center 16 exploitation of vulnerable networking devices","url":"https://www.ic3.gov/CSA/2026/260713.pdf","publisher":"U.S. Federal Bureau of Investigation","context":"The article links to this PDF version of the advisory while describing FSB Center 16 activity against routers and other networking devices.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe U.S. Treasury Department’s Office of Foreign Assets Control designated First VPN Service, also known as 1VPNS, and two individuals for enabling ransomware actors and other cybercriminals. The sanctioned individuals are Dmytro Rashevskyi, a Ukrainian administrator of the VPN service, and Yegeniy Vladimirovich Silayev, a Belarusian national accused of selling cryptors that helped disguise ransomware and other malware as safe programs. U.S. officials said ransomware groups using services supplied by the designated parties caused billions of dollars in losses to American businesses and critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eFirst VPN Service was dismantled in May 2026 during a joint law enforcement operation by European and North American authorities. The service had operated since 2014 and advertised that it did not keep logs of user identities or activities and did not cooperate with law enforcement over illegal activity from its rented servers. The Treasury said several ransomware groups used First VPN to attack U.S. businesses, financial services companies, hospitals, and municipal governments while hiding their true origins, deploying malware, and managing stolen data.\u003c/p\u003e\n\n\u003cp\u003eThe article also reports that the U.K. and E.U. sanctioned 24 Russian-linked individuals and entities tied to destructive cyber and hybrid operations, including GRU leaders, FSB Centre 16, and actors connected to Lumma Stealer. Separately, the FBI issued an advisory stating that FSB Center 16 actors scan for poorly configured networking devices, mainly routers with active SNMP agents that accept common or default community strings. The activity includes SNMP Set-Requests that direct devices to copy configurations to attacker-controlled or compromised servers, as well as abuse of Cisco vulnerabilities CVE-2018-0171 and CVE-2008-4128.\u003c/p\u003e\n"},{"n":3,"title":"148 npm Packages Disguised as Student Proxies Turned Browsers Into a DDoS Botnet","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/148-npm-packages-disguised-as-student.html","time":"07:08","priority":"SHOULD READ","score":84,"tldr":"JFrog found 148 npm packages masquerading as student proxy sites that secretly turned visitors’ browsers into a DDoS botnet using HTTP and WebSocket floods. The campaign abused npm as free hosting rather than targeting developers at install time, and its remote loader means the operators could re-enable the attack without publishing new packages.","briefOverview":"\u003cp\u003eJFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May. The packages were presented as proxy apps branded “Lucide” and dressed as tutoring landing pages such as Riverbend Tutoring or Northstar Tutoring. They did not target developers at install time and had no lifecycle hooks or native build scripts; instead, they used npm as free hosting for proxy sites that students visited to bypass school web filters.\u003c/p\u003e\n\n\u003cp\u003eThe proxy pages worked on the surface, but hidden modules loaded before the React interface rendered. One module fetched remote JavaScript from a mutable GitHub branch through jsDelivr without pinning or Subresource Integrity checks, and an archived payload sent repeated large no-cors POST requests to cdn.caan.edu, which JFrog identified as the public domain of a nursing school in Matteson, Illinois. Another module fetched a WebSocket configuration and opened connections to a Wisp endpoint on lunaron[.]top, repeatedly sending valid Wisp CONNECT and CLOSE frames that could exhaust file descriptors, flood logs, and drop affected Wisp proxy servers.\u003c/p\u003e\n\n\u003cp\u003eJFrog traced the infrastructure to a GitHub organization named lucideproxy, accounts registered seconds apart, a commit email at geeked[.]wtf, a Discord handle, and deployment hostnames mostly resolving to 92.38.177[.]17 at G-Core Labs. The project started as adware in March, added the remote loader and Wisp generator in mid-May, ran the live flood at the end of May, and then removed the malicious modules as reporting began. A second July 8 wave shipped a cleaned-up adware-only build, but JFrog said the mutable loader still gives the operators the ability to re-arm the DDoS capability without publishing new npm package versions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May.","The packages did not run malicious code at install time; instead, they hosted a proxy web app that loaded hidden browser-side modules when users visited the pages.","One hidden module fetched remote JavaScript from a mutable GitHub branch through jsDelivr, allowing the operators to change code running in visitors’ browsers without updating the npm packages.","An archived payload from May 30 sent repeated no-cors POST requests with large data bodies to cdn.caan.edu, which JFrog identified as the public domain of a nursing school in Matteson, Illinois.","A second module opened multiple WebSocket connections to a Wisp endpoint on lunaron[.]top and repeatedly sent valid Wisp CONNECT and CLOSE frames, which JFrog described as a control-plane attack against Wisp proxy servers."],"insights":["The campaign bypassed defenses focused on install-time package behavior because the packages had no lifecycle hooks or native build scripts and only activated when people visited the hosted proxy pages in a browser.","The DDoS capability could be re-enabled without publishing new npm versions because the proxy app’s loader fetched code from a mutable GitHub branch through jsDelivr without pinning or integrity checks.","Blocking the current monetization and script hosts, including woofbeginner[.]com and c.vipersfutbol[.]com, is a more relevant mitigation for school and corporate networks than only scanning build pipelines for malicious npm installs.","The WebSocket component targeted weaknesses in Wisp proxy servers by forcing rapid connection allocation, teardown, and logging rather than relying only on high-volume traffic.","The article highlights a registry-abuse gap: npm allowed one account to publish 116 packages in under 35 minutes, and many of the dangerous packages were intended as hosted web apps rather than software dependencies."],"referencedReports":[{"title":"Lucide Proxy npm Malware Campaign","url":"https://research.jfrog.com/post/lucide-proxy-npm-malware-campaign/","publisher":"JFrog","context":"The article is primarily based on JFrog’s research, which deobfuscated the proxy app, recovered archived payloads, and reconstructed the campaign timeline.","category":"research","primary":true},{"title":"Malicious NPM Terminal3Airport Proxy Adware Spam","url":"https://safedep.io/malicious-npm-terminal3airport-proxy-adware-spam/","publisher":"SafeDep","context":"The article cites SafeDep’s earlier advisory as cataloging 141 of the packages in May and initially describing the operation as adware and registry abuse.","category":"advisory","primary":false}],"body":"\u003cp\u003eJFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May. The packages were presented as proxy apps branded “Lucide” and dressed as tutoring landing pages such as Riverbend Tutoring or Northstar Tutoring. They did not target developers at install time and had no lifecycle hooks or native build scripts; instead, they used npm as free hosting for proxy sites that students visited to bypass school web filters.\u003c/p\u003e\n\n\u003cp\u003eThe proxy pages worked on the surface, but hidden modules loaded before the React interface rendered. One module fetched remote JavaScript from a mutable GitHub branch through jsDelivr without pinning or Subresource Integrity checks, and an archived payload sent repeated large no-cors POST requests to cdn.caan.edu, which JFrog identified as the public domain of a nursing school in Matteson, Illinois. Another module fetched a WebSocket configuration and opened connections to a Wisp endpoint on lunaron[.]top, repeatedly sending valid Wisp CONNECT and CLOSE frames that could exhaust file descriptors, flood logs, and drop affected Wisp proxy servers.\u003c/p\u003e\n\n\u003cp\u003eJFrog traced the infrastructure to a GitHub organization named lucideproxy, accounts registered seconds apart, a commit email at geeked[.]wtf, a Discord handle, and deployment hostnames mostly resolving to 92.38.177[.]17 at G-Core Labs. The project started as adware in March, added the remote loader and Wisp generator in mid-May, ran the live flood at the end of May, and then removed the malicious modules as reporting began. A second July 8 wave shipped a cleaned-up adware-only build, but JFrog said the mutable loader still gives the operators the ability to re-arm the DDoS capability without publishing new npm package versions.\u003c/p\u003e\n"},{"n":4,"title":"Grok Build Uploads Entire Git Repositories to xAI Storage, Not Just Files It Reads","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html","time":"09:02","priority":"SHOULD READ","score":84,"tldr":"xAI’s Grok Build CLI was found uploading entire tracked Git repositories, including commit history and some secrets, to xAI-controlled Google Cloud storage even when the model only needed specific files and model-improvement was turned off. xAI appears to have disabled the uploads server-side, but users who ran the tool should rotate any credentials that may have been read, tracked, or present in Git history.","briefOverview":"\u003cp\u003exAI\u0026rsquo;s Grok Build coding CLI was found uploading entire tracked Git repositories, including full commit history, to a Google Cloud Storage bucket run by xAI. Researcher cereblab tested version 0.2.93, captured an upload, cloned the Git bundle from the intercepted request, and recovered a file the agent had been explicitly told not to open. The article says the evidence establishes transmission, acceptance, and storage, but does not claim xAI trained on the code or that staff read it.\u003c/p\u003e\n\n\u003cp\u003eThe upload used a separate storage channel from the model itself, with one 12 GB test repository sending about 192 KB to the model endpoint while 5.10 GiB went to \u003ccode\u003e/v1/storage\u003c/code\u003e in 73 chunks. The bucket name \u003ccode\u003egrok-code-session-traces\u003c/code\u003e appeared in the binary and in staged metadata, and the upload volume tracked total repository size across the researcher\u0026rsquo;s tests. The article also says tracked \u003ccode\u003e.env\u003c/code\u003e contents read by Grok went unredacted into the model turn and a storage-bound \u003ccode\u003esession_state\u003c/code\u003e archive.\u003c/p\u003e\n\n\u003cp\u003eTurning off “Improve the model” did not stop the repository upload during testing, because the article says that setting governed training rather than whether code left the machine. On July 13, the same 0.2.93 client stopped making storage requests after server-side settings changed to \u003ccode\u003edisable_codebase_upload: true\u003c/code\u003e and \u003ccode\u003etrace_upload_enabled: false\u003c/code\u003e, though xAI had not confirmed whether the change was universal or permanent. The article advises users who already ran the tool to rotate credentials Grok could have read, that were in tracked files, or that existed in Git history.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A researcher testing xAI’s Grok Build CLI version 0.2.93 found it uploaded entire tracked Git repositories, including full commit history, to an xAI-controlled Google Cloud Storage bucket rather than only files needed for a coding task.","In one test on a 12 GB repository, traffic to the model endpoint was about 192 KB while the storage channel sent 5.10 GiB in 73 chunks of about 75 MB each.","The researcher cloned a captured Git bundle from the upload and recovered a file the agent had been explicitly told not to open, along with the repository’s full commit history.","Turning off the “Improve the model” setting did not stop the repository upload, and the server continued to return trace_upload_enabled: true during testing.","On July 13, the same 0.2.93 client stopped making storage requests after server-side settings changed to disable_codebase_upload: true and trace_upload_enabled: false, but xAI had not confirmed whether the change applied to every account or was permanent."],"insights":["Users should treat any secret that was ever committed to a repository as potentially exposed if they ran Grok Build, because the captured upload included full Git history, not just the current working files.","The “Improve the model” opt-out was not a control for whether code left the machine, because the article says it governed training while repository trace uploads continued through a separate setting.","The apparent fix was server-side rather than a new client release, meaning the same installed binary stopped uploading only after xAI changed returned settings.","The upload code was reportedly still present in build 0.2.99 and merely held off by a server flag, so users cannot rely only on having a newer binary to know whether repository uploads are impossible.","A gitignored file that was never committed stayed out of the captured bundle, while a committed file could still be included through history even after deletion from the working tree."],"referencedReports":[{"title":"Research on Grok Build 0.2.93 repository uploads","url":"https://gist.github.com/cereblab/dc9a40bc26120f4540e4e09b75ffb547","publisher":"cereblab","context":"The article says researcher cereblab tested Grok Build 0.2.93, captured repository uploads, and recovered a file the agent was told not to open.","category":"research","primary":true},{"title":"Grok Build exfiltration reproduction comparison","url":"https://github.com/cereblab/grok-build-exfil-repro/blob/main/COMPARISON.md","publisher":"cereblab","context":"The article references cereblab's cross-tool comparison showing Claude Code and Codex sent no repository bundle, while Gemini sent none in an idle test.","category":"research","primary":false},{"title":"grok-network-monitor analysis of Grok Build 0.2.99","url":"https://github.com/weklund/grok-network-monitor","publisher":"weklund","context":"The article cites a separate analysis of build 0.2.99 that found the upload code still present in the binary but held off by a server flag.","category":"research","primary":false}],"body":"\u003cp\u003exAI\u0026rsquo;s Grok Build coding CLI was found uploading entire tracked Git repositories, including full commit history, to a Google Cloud Storage bucket run by xAI. Researcher cereblab tested version 0.2.93, captured an upload, cloned the Git bundle from the intercepted request, and recovered a file the agent had been explicitly told not to open. The article says the evidence establishes transmission, acceptance, and storage, but does not claim xAI trained on the code or that staff read it.\u003c/p\u003e\n\n\u003cp\u003eThe upload used a separate storage channel from the model itself, with one 12 GB test repository sending about 192 KB to the model endpoint while 5.10 GiB went to \u003ccode\u003e/v1/storage\u003c/code\u003e in 73 chunks. The bucket name \u003ccode\u003egrok-code-session-traces\u003c/code\u003e appeared in the binary and in staged metadata, and the upload volume tracked total repository size across the researcher\u0026rsquo;s tests. The article also says tracked \u003ccode\u003e.env\u003c/code\u003e contents read by Grok went unredacted into the model turn and a storage-bound \u003ccode\u003esession_state\u003c/code\u003e archive.\u003c/p\u003e\n\n\u003cp\u003eTurning off “Improve the model” did not stop the repository upload during testing, because the article says that setting governed training rather than whether code left the machine. On July 13, the same 0.2.93 client stopped making storage requests after server-side settings changed to \u003ccode\u003edisable_codebase_upload: true\u003c/code\u003e and \u003ccode\u003etrace_upload_enabled: false\u003c/code\u003e, though xAI had not confirmed whether the change was universal or permanent. The article advises users who already ran the tool to rotate credentials Grok could have read, that were in tracked files, or that existed in Git history.\u003c/p\u003e\n"},{"n":1,"title":"US sanctions VPN, malware providers for enabling ransomware attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-sanctions-vpn-malware-providers-linked-to-ransomware-gangs/","time":"09:40","priority":"SHOULD READ","score":82,"tldr":"The U.S. Treasury sanctioned First VPN Service, its administrator, and a Belarusian cryptor seller for providing infrastructure and tools that helped ransomware groups hide identities, evade detection, and attack U.S. organizations. The action follows an international law enforcement takedown of 1VPNS infrastructure tied to cybercrime worldwide.","briefOverview":"\u003cp\u003eThe U.S. Treasury Department’s Office of Foreign Assets Control sanctioned First VPN Service, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations. First VPN Service sold services to ransomware groups and advertised on cybercriminal forums that it kept no logs of user activity or identities and would not cooperate with law enforcement. Silayev sold cryptors, tools used to help ransomware and other malware evade detection by security software.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions followed a May law enforcement takedown of First VPN Service’s website and infrastructure by European authorities with support from the FBI’s Boston Field Office. The operation, called Operation Saffron, was led by French and Dutch authorities and began with an investigation in December 2021. Authorities infiltrated the VPN’s infrastructure, collected its user database, seized 33 servers across 27 countries, arrested its administrator, and exposed thousands of users linked to ransomware, fraud, and other malicious activity.\u003c/p\u003e\n\n\u003cp\u003eVictims of ransomware attacks involving First VPN Service infrastructure included U.S. businesses, hospitals, financial services firms, and municipal governments. Officials estimated that ransomware operations using First VPN Service and Silayev cryptors caused billions of dollars in losses to businesses and critical infrastructure providers across the United States. Under the sanctions, property of the designated individuals and entities within U.S. jurisdiction is blocked, and U.S. persons and businesses are barred from transactions involving them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department’s Office of Foreign Assets Control sanctioned First VPN Service, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations.","First VPN Service advertised on cybercriminal forums that it kept no logs of user activity or identities and would not cooperate with law enforcement.","European law enforcement took down First VPN Service’s website and infrastructure in May with support from the FBI’s Boston Field Office as part of Operation Saffron.","Authorities seized 33 servers linked to First VPN Service across 27 countries, arrested its administrator, and exposed thousands of users associated with ransomware, fraud, and other malicious activity.","Ransomware operations using First VPN Service and Silayev cryptors have caused billions of dollars in losses to businesses and critical infrastructure providers across the United States."],"insights":["The sanctions show that U.S. and partner governments are targeting the support ecosystem behind ransomware, including anonymity services and tools that disguise malicious software, rather than only the groups carrying out the attacks.","Law enforcement had infiltrated First VPN Service’s infrastructure and collected its user database before the takedown, meaning the operation was designed to identify users as well as dismantle the service.","First VPN Service’s importance to cybercrime was unusually broad, with Europol saying its name had surfaced in nearly every major cybercrime investigation it supported.","The article highlights how service providers can sustain abuse even after complaints by using false identities to obtain infrastructure from companies that would otherwise refuse service."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Treasury Department’s Office of Foreign Assets Control sanctioned First VPN Service, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations. First VPN Service sold services to ransomware groups and advertised on cybercriminal forums that it kept no logs of user activity or identities and would not cooperate with law enforcement. Silayev sold cryptors, tools used to help ransomware and other malware evade detection by security software.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions followed a May law enforcement takedown of First VPN Service’s website and infrastructure by European authorities with support from the FBI’s Boston Field Office. The operation, called Operation Saffron, was led by French and Dutch authorities and began with an investigation in December 2021. Authorities infiltrated the VPN’s infrastructure, collected its user database, seized 33 servers across 27 countries, arrested its administrator, and exposed thousands of users linked to ransomware, fraud, and other malicious activity.\u003c/p\u003e\n\n\u003cp\u003eVictims of ransomware attacks involving First VPN Service infrastructure included U.S. businesses, hospitals, financial services firms, and municipal governments. Officials estimated that ransomware operations using First VPN Service and Silayev cryptors caused billions of dollars in losses to businesses and critical infrastructure providers across the United States. Under the sanctions, property of the designated individuals and entities within U.S. jurisdiction is blocked, and U.S. persons and businesses are barred from transactions involving them.\u003c/p\u003e\n"},{"n":6,"title":"Introducing the Silent Push Partner Program","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/news/introducing-the-silent-push-partner-program/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=introducing-the-silent-push-partner-program","time":"09:11","priority":"MAY READ","score":25,"tldr":"Silent Push launched its Partner Portal and formal Channel Partner Program to support its 55+ global partners with sales, marketing, and co-sell resources for its preemptive threat intelligence offering. The program aims to accelerate partner-led adoption across EMEA, APJ, and other regions.","briefOverview":"\u003cp\u003eSilent Push is launching the Silent Push Partner Portal and officially announcing its Channel Partner Program. The company says security teams in the Philippines, Japan, Finland, Australia, the UK, and across EMEA have been working to get ahead of threats before they land, with partners driving that outcome. Silent Push says it already has more than 55 partners globally, including distributors, MSSPs, systems integrators, and technology resellers.\u003c/p\u003e\n\n\u003cp\u003eThe portal is intended to give partners a dedicated place for branded assets, product collateral, white papers, datasheets, campaign assets, co-sell resources, and access to the Silent Push team. Silent Push says the goal is to help partners represent the company accurately without waiting for materials to be turned around. The company frames the program around demand from enterprises and government organizations for preemptive cyber defense.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says its offering gives security teams visibility into adversary infrastructure before it is weaponized through proprietary Indicators of Future Attack data. Partner comments in the article highlight activity in AU/NZ, EMEA, and integration work with ThreatConnect. Silent Push says it will add partner spotlights, onboard new regional partners, and continue adding training and enablement content to the portal over the coming weeks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push is launching the Silent Push Partner Portal and officially announcing its Channel Partner Program.","Silent Push says it already has more than 55 global partners, including distributors, MSSPs, systems integrators, and technology resellers.","The Partner Portal provides branded assets, product collateral, white papers, datasheets, campaign assets, co-sell resources, and a direct line to the Silent Push team.","Silent Push says its proprietary Indicators of Future Attack data gives security teams visibility into adversary infrastructure before it is weaponized.","Silent Push plans to roll out partner spotlights, onboard new regional partners, and add training and enablement content to the portal over the coming weeks."],"insights":["Silent Push is emphasizing partner self-service by making accurate, ready-to-use materials available in the portal instead of requiring partners to wait for the company to prepare them.","The company is positioning preemptive cyber defense as a channel-led sales opportunity, citing partner-built pipeline across EMEA and APJ as a reason for formalizing the program now.","The program is not limited to new sales partners, because Silent Push also highlights an existing integration partner, ThreatConnect, as part of the partner ecosystem.","Silent Push is prioritizing continued enablement after launch, with planned additions of training content, partner spotlights, and new regional partner onboarding."],"referencedReports":[],"body":"\u003cp\u003eSilent Push is launching the Silent Push Partner Portal and officially announcing its Channel Partner Program. The company says security teams in the Philippines, Japan, Finland, Australia, the UK, and across EMEA have been working to get ahead of threats before they land, with partners driving that outcome. Silent Push says it already has more than 55 partners globally, including distributors, MSSPs, systems integrators, and technology resellers.\u003c/p\u003e\n\n\u003cp\u003eThe portal is intended to give partners a dedicated place for branded assets, product collateral, white papers, datasheets, campaign assets, co-sell resources, and access to the Silent Push team. Silent Push says the goal is to help partners represent the company accurately without waiting for materials to be turned around. The company frames the program around demand from enterprises and government organizations for preemptive cyber defense.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says its offering gives security teams visibility into adversary infrastructure before it is weaponized through proprietary Indicators of Future Attack data. Partner comments in the article highlight activity in AU/NZ, EMEA, and integration work with ThreatConnect. Silent Push says it will add partner spotlights, onboard new regional partners, and continue adding training and enablement content to the portal over the coming weeks.\u003c/p\u003e\n"}]</script>
