<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers arrested over €30M bank fraud exploiting service provider flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-arrested-over-30m-bank-fraud-exploiting-service-provider-flaw/","time":"18:04","priority":"SHOULD READ","score":82,"tldr":"Brazilian and European authorities arrested or charged suspects accused of exploiting a service-provider software flaw to trigger unauthorized direct debits from Commerzbank customer accounts, causing about €30 million in losses. Commerzbank said affected customers did not suffer financial losses.","briefOverview":"\u003cp\u003eFour cybercriminals were arrested in Brazil and three others were charged in Europe over allegations that they exploited a vulnerability at a service provider to withdraw funds from Commerzbank customers’ bank accounts. The theft was investigated by Brazilian and German federal police agencies and occurred over four days in November 2023. Authorities said the fraud caused losses of around €30 million.\u003c/p\u003e\n\n\u003cp\u003eCommerzbank confirmed that its clients were impacted by the fraudulent activity but said customers suffered no financial losses. The bank said the unauthorized direct debits were caused by technical issues at a service provider and that it cooperated closely with authorities. German authorities said the attackers exploited a software vulnerability introduced by a faulty software update at the payment and transaction-processing system of a financial institution.\u003c/p\u003e\n\n\u003cp\u003eInvestigators said the attackers routed stolen funds to Brazil through a larger network designed to conceal their origin, with the largest portion withdrawn in Brazil and a smaller share cashed out in four European countries. They also found that proceeds were moved through pass-through accounts, companies, payment institutions, virtual-asset platforms, and payment cards issued without the beneficiaries’ consent. Brazil’s Federal Police launched Operation Klonen with support from Germany’s BKA, executing 21 search-and-seizure warrants and arresting four suspects under preventive detention warrants.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Four cybercriminals were arrested in Brazil and three others were charged in Europe over allegations that they exploited a vulnerability at a service provider to withdraw funds from Commerzbank customers’ bank accounts.","The theft occurred over four days in November 2023 and caused losses of around €30 million, according to the investigation by Brazilian and German federal police agencies.","Commerzbank confirmed that its clients were impacted by unauthorized direct debits caused by technical issues at a service provider, but said customers suffered no financial loss.","German authorities said the attackers exploited a software vulnerability introduced by a faulty software update at the payment and transaction-processing system of a financial institution.","Investigators said the stolen funds were moved and concealed through pass-through accounts, companies, payment institutions, virtual-asset platforms, and payment cards issued without the beneficiaries’ consent."],"insights":["The fraud stemmed from technical issues at a service provider rather than a stated compromise of Commerzbank’s own systems, showing how third-party software failures can directly affect bank customers.","A faulty software update allegedly introduced the weakness that enabled the withdrawals, making routine software maintenance the triggering point for a major financial fraud case.","The stolen funds were routed through Brazil, four European countries, pass-through accounts, companies, payment institutions, virtual-asset platforms, and payment cards, indicating a deliberately layered cash-out and laundering operation.","One suspect allegedly used part of the illicit proceeds to support a 2024 political campaign, extending the impact of the bank fraud beyond financial crime into public elections."],"referencedReports":[],"body":"\u003cp\u003eFour cybercriminals were arrested in Brazil and three others were charged in Europe over allegations that they exploited a vulnerability at a service provider to withdraw funds from Commerzbank customers’ bank accounts. The theft was investigated by Brazilian and German federal police agencies and occurred over four days in November 2023. Authorities said the fraud caused losses of around €30 million.\u003c/p\u003e\n\n\u003cp\u003eCommerzbank confirmed that its clients were impacted by the fraudulent activity but said customers suffered no financial losses. The bank said the unauthorized direct debits were caused by technical issues at a service provider and that it cooperated closely with authorities. German authorities said the attackers exploited a software vulnerability introduced by a faulty software update at the payment and transaction-processing system of a financial institution.\u003c/p\u003e\n\n\u003cp\u003eInvestigators said the attackers routed stolen funds to Brazil through a larger network designed to conceal their origin, with the largest portion withdrawn in Brazil and a smaller share cashed out in four European countries. They also found that proceeds were moved through pass-through accounts, companies, payment institutions, virtual-asset platforms, and payment cards issued without the beneficiaries’ consent. Brazil’s Federal Police launched Operation Klonen with support from Germany’s BKA, executing 21 search-and-seizure warrants and arresting four suspects under preventive detention warrants.\u003c/p\u003e\n"},{"n":2,"title":"Investigation of banking hack leads to arrests in Germany, Brazil","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/investigation-into-banking-hack-leads-to-arrests-germany-brazil","time":"20:31","priority":"SHOULD READ","score":78,"tldr":"Authorities in Germany and Brazil arrested suspects tied to a late-2023 banking hack that stole about €30 million from German online banking accounts by exploiting a payment provider and using cloned payment cards. Police say the funds were laundered through Brazil and Europe, with assets worth over $20 million seized.","briefOverview":"\u003cp\u003eGerman and Brazilian authorities reported multiple arrests tied to a late-2023 banking hack that drained an estimated €30 million from German bank accounts. Germany’s BKA said three suspects were arrested in Europe and charged with fraud, while Brazil’s federal police said four others were arrested in Brazil as part of Operação Klonen. Brazilian authorities also executed 21 search and seizure warrants nationwide.\u003c/p\u003e\n\n\u003cp\u003eThe BKA said the hackers made numerous unauthorized withdrawals from German online banking users over four days in November 2023 by exploiting a vulnerability in a payment provider. Brazilian authorities said cloned payment cards were involved, and police said the criminals moved and laundered the money through networks in Brazil and four European countries. Neither police agency named the affected bank, but Brazilian media reported it was Commerzbank, and German media had reported in late 2023 that Commerzbank suffered a €30 million hack.\u003c/p\u003e\n\n\u003cp\u003eThe suspects detained in Europe will be prosecuted in Spain and Bulgaria, according to the BKA, which said Spanish and Bulgarian authorities assisted in the investigation along with the Frankfurt public prosecutor’s office. Brazilian authorities said courts ordered the seizure of financial assets, vehicles, and real estate worth more than $20 million. Brazilian police also said one person identified in the investigation had been a 2024 election candidate and used part of the illicitly obtained money in his campaign, and they seized a 3-D printer used to make weapons.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["German and Brazilian authorities reported multiple arrests related to a late-2023 hack that drained an estimated €30 million from German bank accounts.","Germany’s BKA said three suspects were arrested in Europe and charged with fraud, while Brazil’s federal police said four others were arrested in Brazil as part of Operation Klonen.","The BKA said hackers made numerous unauthorized withdrawals from German online banking users over four days in November 2023 by exploiting a vulnerability in a payment provider, and Brazilian authorities said cloned payment cards were involved.","Neither police agency named the affected bank, but Brazilian media reported it was Commerzbank, and German media had reported in late 2023 that Commerzbank suffered a €30 million hack.","Brazilian authorities said courts ordered the seizure of financial assets, vehicles, and real estate worth more than $20 million, and police said one person identified in the investigation used part of the illicit money in a 2024 election campaign."],"insights":["The case shows that a weakness at a payment provider can translate into large-scale unauthorized withdrawals from bank customers, even when the affected bank itself is not named by authorities.","The investigation required coordination across Germany, Brazil, Spain, and Bulgaria, with suspects in Europe set to be prosecuted in Spain and Bulgaria rather than Germany.","Brazilian police said part of the stolen money was used in a 2024 election campaign, linking the banking fraud investigation to possible political financing concerns.","Authorities targeted assets beyond bank accounts, including vehicles and real estate worth more than $20 million, indicating the laundering network had converted stolen funds into physical property."],"referencedReports":[],"body":"\u003cp\u003eGerman and Brazilian authorities reported multiple arrests tied to a late-2023 banking hack that drained an estimated €30 million from German bank accounts. Germany’s BKA said three suspects were arrested in Europe and charged with fraud, while Brazil’s federal police said four others were arrested in Brazil as part of Operação Klonen. Brazilian authorities also executed 21 search and seizure warrants nationwide.\u003c/p\u003e\n\n\u003cp\u003eThe BKA said the hackers made numerous unauthorized withdrawals from German online banking users over four days in November 2023 by exploiting a vulnerability in a payment provider. Brazilian authorities said cloned payment cards were involved, and police said the criminals moved and laundered the money through networks in Brazil and four European countries. Neither police agency named the affected bank, but Brazilian media reported it was Commerzbank, and German media had reported in late 2023 that Commerzbank suffered a €30 million hack.\u003c/p\u003e\n\n\u003cp\u003eThe suspects detained in Europe will be prosecuted in Spain and Bulgaria, according to the BKA, which said Spanish and Bulgarian authorities assisted in the investigation along with the Frankfurt public prosecutor’s office. Brazilian authorities said courts ordered the seizure of financial assets, vehicles, and real estate worth more than $20 million. Brazilian police also said one person identified in the investigation had been a 2024 election candidate and used part of the illicitly obtained money in his campaign, and they seized a 3-D printer used to make weapons.\u003c/p\u003e\n"}]</script>
