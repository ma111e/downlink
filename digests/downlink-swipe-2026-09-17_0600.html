<script type="application/json" id="dl-articles">[{"n":2,"title":"Cisco warns of max severity ISE zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-identity-service-engine-zero-day-exploited-in-attacks/","time":"07:20","priority":"MUST READ","score":98,"tldr":"Cisco is urging customers to immediately patch Cisco Identity Services Engine and ISE-PIC for CVE-2026-76460, a maximum-severity authentication-bypass flaw that is actively being exploited. No workaround is available, and suspected compromises may require node reimaging and restoration from backups.","briefOverview":"\u003cp\u003eCisco released security updates for CVE-2026-76460, a maximum-severity flaw in Cisco Identity Services Engine (ISE) and Cisco ISE Passive Identity Connector (ISE-PIC) that is being actively exploited. The issue allows remote attackers to bypass authentication through a vulnerable API endpoint and gain unauthorized access by getting around the web-based management interface. Cisco said the flaw is present regardless of configuration and that no workaround exists.\u003c/p\u003e\n\n\u003cp\u003eCisco recommends upgrading affected systems to fixed releases, including ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4. It also advised administrators to inspect access.log files on every node for suspicious usernames and, if malicious activity is suspected, to reimage nodes and restore them from backups. CISA added CVE-2026-76460 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to patch affected systems within three days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco released security updates for CVE-2026-76460, a maximum-severity authentication-bypass flaw in Cisco Identity Services Engine and Cisco ISE Passive Identity Connector that is actively exploited in attacks.","The flaw stems from insufficient authentication controls on an API endpoint and can allow a remote attacker to bypass the web-based management interface and gain unauthorized access.","No workaround is available; Cisco recommends upgrading to fixed releases, including ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4.","Cisco advised administrators to check access.log files for suspicious usernames and to reimage affected nodes and restore backups if malicious activity is suspected.","CISA added CVE-2026-76460 to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to patch affected systems within three days."],"insights":["The authentication bypass affects Cisco ISE and ISE-PIC regardless of configuration, so changing settings is not presented as a way to reduce exposure.","Cisco advises reviewing access.log files on every node for suspicious usernames, indicating that investigation must cover the full deployment rather than a single system.","Attackers may remove evidence after gaining root-level command execution, so Cisco recommends checking firewall and network logs for suspicious external uploads and downloads as well.","For suspected compromise, Cisco strongly recommends reimaging affected nodes and restoring from backups rather than relying only on cleanup."],"referencedReports":[{"title":"Cisco Identity Services Engine and Cisco ISE Passive Identity Connector Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5","publisher":"cisco","context":"The article cites Cisco's security advisory for technical details on CVE-2026-76460 and Cisco's warning that it is actively exploited.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article references CISA's alert announcing that CVE-2026-76460 was added to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco released security updates for CVE-2026-76460, a maximum-severity flaw in Cisco Identity Services Engine (ISE) and Cisco ISE Passive Identity Connector (ISE-PIC) that is being actively exploited. The issue allows remote attackers to bypass authentication through a vulnerable API endpoint and gain unauthorized access by getting around the web-based management interface. Cisco said the flaw is present regardless of configuration and that no workaround exists.\u003c/p\u003e\n\n\u003cp\u003eCisco recommends upgrading affected systems to fixed releases, including ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4. It also advised administrators to inspect access.log files on every node for suspicious usernames and, if malicious activity is suspected, to reimage nodes and restore them from backups. CISA added CVE-2026-76460 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to patch affected systems within three days.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft shares workaround for Windows domain login issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-workaround-for-windows-domain-login-authentication-issues/","time":"08:24","priority":"SHOULD READ","score":84,"tldr":"Microsoft confirmed that September 2026 Windows 11 security updates can break domain trust and prevent valid domain logins when Machine Identity Isolation enforcement is configured on unsupported domain environments. Administrators should disable the feature through its original management method, restart affected devices, and repair the secure channel while Microsoft develops a permanent fix.","briefOverview":"\u003cp\u003eMicrosoft confirmed that September 2026 Windows 11 security updates can prevent some users from signing in with valid domain credentials. Reports from users and IT administrators indicate that affected enterprise systems may lose their domain trust relationship and display domain trust or credential errors. The issue is linked to Machine Identity Isolation enforcement after installation of KB5124008 for Windows 11 24H2/25H2 or KB5124012 for Windows 11 26H1.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the updates do not directly enable Machine Identity Isolation enforcement, but cause Windows to honor existing policy or registry settings that enable it. The feature is supported only in environments connected to domain controllers running at the Windows Server 2025 Domain Functional Level or higher, and Microsoft says it should be disabled elsewhere. As a temporary workaround, administrators should disable the feature through the method used to enable it, restart the device, and repair its secure channel; Microsoft is working on an update to temporarily prevent enforcement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that September 2026 Windows 11 security updates can cause domain-joined devices to lose their secure trust relationship with the domain and reject valid login credentials.","The issue occurs when the updates begin honoring existing or policy-provisioned Machine Identity Isolation enforcement settings.","Microsoft says Machine Identity Isolation enforcement is supported only in environments connected to domain controllers running at the Windows Server 2025 Domain Functional Level or higher.","Microsoft’s temporary workaround is to disable Machine Identity Isolation using the same management method that enabled it, restart the device, and repair its secure channel.","Microsoft is developing a future Windows update to temporarily prevent Machine Identity Isolation enforcement."],"insights":["The September updates do not directly turn on Machine Identity Isolation enforcement; they cause Windows to honor enforcement settings that were already configured through policy or the registry.","The feature is supported only when devices connect to domain controllers at the Windows Server 2025 Domain Functional Level or above, so Microsoft says it should be disabled in other environments.","For registry-configured systems, Microsoft’s workaround specifically requires changing the MachineIdentityIsolation value from 2 to 0, restarting the device, and then repairing its secure channel.","The same month’s security updates also prompted separate emergency fixes for Remote Desktop Services, Hyper-V shared-folder access in Linux virtual machines, and some USB audio issues."],"referencedReports":[{"title":"Domain-joined devices might lose their secure trust relationship with the domain","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-26h1#domain-joined-devices-might-lose-their-secure-trust-relationship-with-the-domain","publisher":"microsoft","context":"Microsoft’s Windows release health dashboard update confirms that September 2026 security updates can trigger domain trust and sign-in problems when existing Machine Identity Isolation enforcement settings are honored.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that September 2026 Windows 11 security updates can prevent some users from signing in with valid domain credentials. Reports from users and IT administrators indicate that affected enterprise systems may lose their domain trust relationship and display domain trust or credential errors. The issue is linked to Machine Identity Isolation enforcement after installation of KB5124008 for Windows 11 24H2/25H2 or KB5124012 for Windows 11 26H1.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the updates do not directly enable Machine Identity Isolation enforcement, but cause Windows to honor existing policy or registry settings that enable it. The feature is supported only in environments connected to domain controllers running at the Windows Server 2025 Domain Functional Level or higher, and Microsoft says it should be disabled elsewhere. As a temporary workaround, administrators should disable the feature through the method used to enable it, restart the device, and repair its secure channel; Microsoft is working on an update to temporarily prevent enforcement.\u003c/p\u003e\n"},{"n":3,"title":"Chinese hackers use SparroWocky malware in govt espionage attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chinese-hackers-use-sparrowocky-malware-in-govt-espionage-attacks/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"China-linked espionage group FamousSparrow has deployed the new SparroWocky backdoor against government organizations across Latin America, replacing its older SparrowDoor malware. The modular tool uses DLL side-loading and advanced Windows evasion techniques to steal intelligence, capture screens, execute commands, and move data.","briefOverview":"\u003cp\u003eChina-linked espionage group FamousSparrow has used a new C++ backdoor called SparroWocky in attacks against government organizations in Latin America for more than a year. The malware replaces the group’s previously used SparrowDoor custom backdoor. ESET observed affected organizations in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, and believes the campaign sought intelligence on governments’ responses to increased U.S. pressure on Chinese economic interests.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can run commands and programs, collect system and user details, manage files, take screenshots, create processes in another logged-in user’s session, and act as a TCP proxy. It is deployed through DLL side-loading, with a loader decrypting an RC4-encoded payload from a .dat file and loading it directly into memory. The backdoor also uses several methods to evade detection, including making security products see a legitimate Windows function, AnimateWindow, as the start of threads created by the malware.\u003c/p\u003e\n\n\u003cp\u003eFor persistence, SparroWocky can create a Windows service named ProcAuditManager or add a SnapCart registry key, depending on available privileges. ESET identified at least 18 command-and-control addresses used by the malware, communicating directly over ports 443 or 8080 or through HTTP and SOCKS5 proxies. ESET’s telemetry indicates that FamousSparrow’s activity has focused primarily on Latin America since mid-2025, and its report provides technical details and indicators of compromise for the campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET reported that the China-linked espionage group FamousSparrow has used the SparroWocky backdoor against government organizations in Latin America for more than a year.","ESET observed targets in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, with telemetry showing a primary focus on Latin America from mid-2025.","SparroWocky can execute commands and files, gather system and user information, manage files, capture screenshots, create processes in other logged-in users' sessions, and act as a TCP proxy.","The malware is deployed through DLL side-loading after a loader decrypts an RC4-encoded payload from a .dat file and maps it directly into memory.","SparroWocky can persist through a Windows service named ProcAuditManager or a SnapCart registry key, and ESET identified at least 18 command-and-control addresses associated with the activity."],"insights":["SparroWocky reduces screenshot data after the first capture by taking images every 500 milliseconds but sending only the screen regions that changed.","The backdoor hooks Windows thread creation so that security products may see AnimateWindow, a legitimate Windows function, as the thread’s starting point instead of the malware’s real code.","Its persistence method changes with available permissions: it can use the ProcAuditManager Windows service or create a SnapCart registry entry under either the machine-wide or current-user registry area.","ESET identified at least 18 command-and-control addresses, with the malware communicating directly over ports 443 or 8080 or through HTTP and SOCKS5 proxy connections."],"referencedReports":[{"title":"Beware, SparroWocky: Backdoor bites, commands catch","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/","publisher":"eset","context":"The article relies on ESET's technical analysis of the SparroWocky backdoor, including its thread-creation evasion method and campaign indicators.","category":"research","primary":true}],"body":"\u003cp\u003eChina-linked espionage group FamousSparrow has used a new C++ backdoor called SparroWocky in attacks against government organizations in Latin America for more than a year. The malware replaces the group’s previously used SparrowDoor custom backdoor. ESET observed affected organizations in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, and believes the campaign sought intelligence on governments’ responses to increased U.S. pressure on Chinese economic interests.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can run commands and programs, collect system and user details, manage files, take screenshots, create processes in another logged-in user’s session, and act as a TCP proxy. It is deployed through DLL side-loading, with a loader decrypting an RC4-encoded payload from a .dat file and loading it directly into memory. The backdoor also uses several methods to evade detection, including making security products see a legitimate Windows function, AnimateWindow, as the start of threads created by the malware.\u003c/p\u003e\n\n\u003cp\u003eFor persistence, SparroWocky can create a Windows service named ProcAuditManager or add a SnapCart registry key, depending on available privileges. ESET identified at least 18 command-and-control addresses used by the malware, communicating directly over ports 443 or 8080 or through HTTP and SOCKS5 proxies. ESET’s telemetry indicates that FamousSparrow’s activity has focused primarily on Latin America since mid-2025, and its report provides technical details and indicators of compromise for the campaign.\u003c/p\u003e\n"},{"n":4,"title":"MedTech Security Baselines","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/medtech-security-baselines/","time":"08:00","priority":"MAY READ","score":55,"tldr":"Health-ISAC’s Medical Device Security Council outlines baseline cybersecurity capabilities that healthcare organizations should expect from medical device manufacturers during evaluation, procurement, and deployment. Where devices cannot support controls natively, risks should be addressed through documented, context-specific compensating controls and HDO governance.","briefOverview":"\u003cp\u003eHealth-ISAC’s Medical Device Security Council published a paper describing baseline cybersecurity capabilities that healthcare delivery organizations commonly expect medical device manufacturers to support. The paper is intended to help align product evaluation, procurement, and intake decisions while supporting safe, reliable patient care. It covers nine survey-selected capability domains and is a decision-support resource rather than a certification standard or mandatory procurement checklist.\u003c/p\u003e\n\n\u003cp\u003eThe guidance distinguishes between devices that run full operating systems and devices built on embedded, real-time, or otherwise constrained platforms, because their capabilities and operating constraints can differ significantly. When a device cannot provide security controls natively, organizations should use documented compensating controls tailored to clinical context, threat model, patient-safety impact, and operational burden. Controls that depend on healthcare delivery organization infrastructure require explicit agreement with the manufacturer, and final risk acceptance remains with an authorized healthcare delivery organization decision-maker without removing manufacturer responsibilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The paper identifies baseline cybersecurity capabilities that healthcare delivery organizations commonly expect medical device manufacturers to support during product evaluation, procurement, and intake.","The guidance distinguishes devices running full operating systems from those using embedded, real-time, or otherwise constrained platforms because their technical and operational limitations differ.","The document is a decision-support resource rather than a certification standard or mandatory procurement checklist.","When a device cannot provide security controls natively, organizations should assess documented compensating controls based on clinical context, threat model, patient-safety impact, and operational burden.","Controls dependent on healthcare delivery organization infrastructure require explicit agreement with the manufacturer, while final risk acceptance remains with an authorized healthcare delivery organization decision-maker."],"insights":["The paper explicitly rejects treating compensating controls as automatically acceptable; their suitability must be weighed against patient safety, the device’s clinical use, likely threats, and the operational work they create.","A healthcare delivery organization can make the final decision to accept risk, but that decision does not remove the manufacturer’s responsibilities.","Security measures that depend on hospital infrastructure require explicit agreement between the healthcare delivery organization and the medical device manufacturer.","The guidance is designed to support exception reviews as well as routine evaluation, procurement, and deployment decisions."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Medical Device Security Council published a paper describing baseline cybersecurity capabilities that healthcare delivery organizations commonly expect medical device manufacturers to support. The paper is intended to help align product evaluation, procurement, and intake decisions while supporting safe, reliable patient care. It covers nine survey-selected capability domains and is a decision-support resource rather than a certification standard or mandatory procurement checklist.\u003c/p\u003e\n\n\u003cp\u003eThe guidance distinguishes between devices that run full operating systems and devices built on embedded, real-time, or otherwise constrained platforms, because their capabilities and operating constraints can differ significantly. When a device cannot provide security controls natively, organizations should use documented compensating controls tailored to clinical context, threat model, patient-safety impact, and operational burden. Controls that depend on healthcare delivery organization infrastructure require explicit agreement with the manufacturer, and final risk acceptance remains with an authorized healthcare delivery organization decision-maker without removing manufacturer responsibilities.\u003c/p\u003e\n"}]</script>
