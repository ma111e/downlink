<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers exploit critical Atlassian flaw after public PoC release","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-atlassian-flaw-after-public-poc-release/","time":"12:49","priority":"MUST READ","score":98,"tldr":"Attackers began probing the critical unauthenticated Atlassian file-access flaw CVE-2026-21589 within hours of a public proof of concept, potentially enabling Jira, Confluence, and Bitbucket compromise through exposed Crowd credentials. Organizations running affected self-hosted Atlassian products should patch immediately or apply mitigations to restrict access and block traversal patterns.","briefOverview":"\u003cp\u003eA critical unauthenticated file-access flaw, CVE-2026-21589, affecting self-hosted Atlassian products is being exploited shortly after public technical details and a proof of concept were released. Previdian detected exploitation attempts on its honeypot network within two hours of watchTowr publishing its research. The affected products include Bitbucket Data Center, Confluence Data Center, Jira Service Management Data Center, Jira Software Data Center, Bamboo Data Center, Crowd Data Center, Crucible, and Fisheye. A Nuclei template has also been released to automate scans for vulnerable systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from a shared web-resource library converting double colons into forward slashes, enabling directory-traversal requests through plugin resource endpoints to read protected files in an application\u0026rsquo;s web root without authentication. watchTowr confirmed file reads in Jira, Confluence, and Bitbucket, although its technique could not traverse outside the Tomcat application context. In certain Crowd-integrated deployments, attackers could read plaintext credentials from the crowd.properties file and use Crowd\u0026rsquo;s API to create a Jira administrator account. The article notes that restricting Crowd access to allowed IP addresses can make this escalation significantly more difficult.\u003c/p\u003e\n\n\u003cp\u003eAtlassian urged administrators to apply available security updates as soon as possible, while noting it cannot determine whether individual customer instances were compromised. Recommended mitigations include restricting external network access, using WAF or proxy rules to block specified traversal patterns, and applying product-specific rewrite rules. Previdian expects attempts to increase due to the public proof of concept, automated scanning support, and the broad set of affected products.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-21589 is a critical unauthenticated file-access flaw affecting self-hosted Atlassian products including Jira, Confluence, Bitbucket, Bamboo, Crowd, Crucible, Fisheye, and Jira Service Management Data Center.","Previdian observed attempts to exploit CVE-2026-21589 on its honeypot network within two hours of watchTowr publishing technical research and a public proof of concept.","The flaw involves a shared web-resource library converting double colons into forward slashes, which can enable directory-traversal requests through plugin resource endpoints to retrieve protected application files.","In certain Crowd-integrated Jira, Confluence, and Bitbucket deployments, attackers may be able to read credentials from crowd.properties and use Crowd’s API to create administrator accounts.","Atlassian recommends installing security updates as soon as possible or applying mitigations such as restricting external access and blocking specified traversal patterns."],"insights":["Although watchTowr’s file-reading technique could not move outside the Tomcat application context, it could still lead to administrator access by exposing Crowd credentials stored within affected applications.","Restricting which IP addresses can reach Crowd can significantly complicate administrator-account creation, because an attacker would otherwise need to reach Crowd directly or use another system to do so.","A publicly released Nuclei template makes it easier to automatically scan for exposed vulnerable systems, increasing the practical risk soon after the proof of concept was published.","Atlassian’s mitigation options differ by product, with Tomcat RewriteValve rules recommended for Confluence, Jira Service Management, Jira, Bamboo, and Crowd, and a URL rewrite rule recommended for Bitbucket."],"referencedReports":[{"title":"You Won't Hear About These Even In Myths — Atlassian Jira, Confluence, And More Pre-Auth Arbitrary File Read CVE-2026-21589","url":"https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/#file-read-to-jira-administrator-through-crowd-full-poc","publisher":"watchtowr","context":"The article cites watchTowr's technical report and public proof of concept showing how the flaw could enable administrator-level access in certain Crowd-integrated deployments.","category":"research","primary":true},{"title":"CVE-2026-21589: Arbitrary file access vulnerability impacts multiple products","url":"https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html","publisher":"atlassian","context":"The article directs administrators to Atlassian's bulletin for fixed versions and mitigation instructions.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical unauthenticated file-access flaw, CVE-2026-21589, affecting self-hosted Atlassian products is being exploited shortly after public technical details and a proof of concept were released. Previdian detected exploitation attempts on its honeypot network within two hours of watchTowr publishing its research. The affected products include Bitbucket Data Center, Confluence Data Center, Jira Service Management Data Center, Jira Software Data Center, Bamboo Data Center, Crowd Data Center, Crucible, and Fisheye. A Nuclei template has also been released to automate scans for vulnerable systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from a shared web-resource library converting double colons into forward slashes, enabling directory-traversal requests through plugin resource endpoints to read protected files in an application\u0026rsquo;s web root without authentication. watchTowr confirmed file reads in Jira, Confluence, and Bitbucket, although its technique could not traverse outside the Tomcat application context. In certain Crowd-integrated deployments, attackers could read plaintext credentials from the crowd.properties file and use Crowd\u0026rsquo;s API to create a Jira administrator account. The article notes that restricting Crowd access to allowed IP addresses can make this escalation significantly more difficult.\u003c/p\u003e\n\n\u003cp\u003eAtlassian urged administrators to apply available security updates as soon as possible, while noting it cannot determine whether individual customer instances were compromised. Recommended mitigations include restricting external network access, using WAF or proxy rules to block specified traversal patterns, and applying product-specific rewrite rules. Previdian expects attempts to increase due to the public proof of concept, automated scanning support, and the broad set of affected products.\u003c/p\u003e\n"},{"n":25,"title":"Atlassian Data Center Flaw Draws Exploitation Attempts Within Two Hours of Public Details","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/atlassian-data-center-flaw-draws.html","time":"11:49","priority":"MUST READ","score":96,"tldr":"Attackers began probing CVE-2026-21589 within two hours of public technical details, targeting an unauthenticated arbitrary-file-read flaw affecting multiple Atlassian Data Center products. Organizations should immediately apply Atlassian’s fixed releases or isolate exposed instances and deploy the recommended mitigations.","briefOverview":"\u003cp\u003eThreat actors began attempting to exploit CVE-2026-21589, a critical Atlassian Data Center flaw with a CVSS score of 9.3, within two hours of public technical details becoming available. The issue affects Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo, Crowd, Crucible, and Fisheye Data Center products. It allows an unauthenticated attacker to access specific files in an affected application’s web root directory when the attacker knows the file’s exact name and path.\u003c/p\u003e\n\n\u003cp\u003ePrevidian recorded 15 exploitation attempts against its honeypots from three IP addresses in Japan and the United States. WatchTowr said the issue stems from web-resource handling that can convert specially formatted path components into directory-traversal sequences, allowing requests to reach files such as \u003ccode\u003eWEB-INF/web.xml\u003c/code\u003e. In Crowd and Jira, attackers could potentially retrieve \u003ccode\u003ecrowd.properties\u003c/code\u003e, obtain Crowd credentials, and use them to gain administrative access, create users, or change privileges. Atlassian has released fixed versions and recommends removing vulnerable instances from the public internet or applying temporary request-blocking mitigations until they are patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-21589 is a critical arbitrary-file-access flaw with a CVSS score of 9.3 that affects several Atlassian Data Center products, including Bitbucket, Confluence, Jira, Bamboo, Crowd, Crucible, and Fisheye.","The flaw can allow an unauthenticated attacker who knows a target file’s exact name and location to retrieve specific files from an affected application’s web directory.","Previdian detected 15 exploitation attempts from three IP addresses in Japan and the United States, beginning two hours after watchTowr published additional technical details.","In Atlassian Crowd and Jira, attackers could access a file containing Crowd credentials and potentially use them to gain administrative access, create users, and change privileges.","Atlassian has released fixed versions for affected products and recommends removing instances from the public internet or using temporary request-blocking protections until systems are patched."],"insights":["Although the flaw does not let attackers browse folders freely, knowing the exact location of a sensitive file is enough to retrieve it from the application’s web directory.","For Crowd and Jira, the issue can become an account-takeover path because a readable configuration file may contain Crowd credentials that enable administrative access.","The first honeypot activity appeared just two hours after technical details were released, illustrating how quickly public vulnerability research was followed by probing attempts.","Atlassian’s temporary mitigations differ by product: Bitbucket uses a urlrewrite.xml rule, while Confluence, Jira Service Management, Jira Software, Bamboo, and Crowd can use Tomcat RewriteValve blocking."],"referencedReports":[{"title":"You Won't Hear About These Even In Myths: Atlassian Jira, Confluence, And More Pre-Auth Arbitrary File Read (CVE-2026-21589)","url":"https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/","publisher":"watchtowr","context":"The article cites watchTowr's technical details explaining the unauthenticated file-read issue and its path-resolution behavior.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors began attempting to exploit CVE-2026-21589, a critical Atlassian Data Center flaw with a CVSS score of 9.3, within two hours of public technical details becoming available. The issue affects Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo, Crowd, Crucible, and Fisheye Data Center products. It allows an unauthenticated attacker to access specific files in an affected application’s web root directory when the attacker knows the file’s exact name and path.\u003c/p\u003e\n\n\u003cp\u003ePrevidian recorded 15 exploitation attempts against its honeypots from three IP addresses in Japan and the United States. WatchTowr said the issue stems from web-resource handling that can convert specially formatted path components into directory-traversal sequences, allowing requests to reach files such as \u003ccode\u003eWEB-INF/web.xml\u003c/code\u003e. In Crowd and Jira, attackers could potentially retrieve \u003ccode\u003ecrowd.properties\u003c/code\u003e, obtain Crowd credentials, and use them to gain administrative access, create users, or change privileges. Atlassian has released fixed versions and recommends removing vulnerable instances from the public internet or applying temporary request-blocking mitigations until they are patched.\u003c/p\u003e\n"},{"n":8,"title":"FBI: Ongoing FortiBleed attacks lock out FortiGate VPN admins","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-ongoing-fortibleed-attacks-lock-out-fortigate-vpn-admins/","time":"21:28","priority":"MUST READ","score":94,"tldr":"The FBI warns that attackers are continuing to use leaked FortiGate SSL VPN credentials in the FortiBleed campaign to seize administrator access, lock out legitimate admins, and enable ransomware activity. Organizations should restrict external access, terminate active VPN sessions, reset credentials, enforce MFA, and review devices for persistence or unauthorized account changes.","briefOverview":"\u003cp\u003eThe FBI warns that FortiBleed attacks remain active against exposed Fortinet FortiGate firewalls and SSL VPN gateways. Attackers use previously leaked credentials, infostealer-derived logins, credential stuffing, and password spraying to gain access. In some incidents, they create administrator accounts, delete legitimate admin accounts or change their passwords, and lock victims out of their devices.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising a device, the attackers extract further authentication data and use distributed GPU systems running Hashcat and Hashtopolis to crack stolen password hashes offline. The FBI says the FortiBleed chain has been used as an entry point for ransomware affiliates, including INC/Lynx and Payload ransomware. The agency recommends restricting external access, ending all active VPN sessions, enforcing MFA, reviewing logs for unauthorized activity, and using PBKDF2 for administrator password storage rather than legacy SHA-256 hashes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI warns that FortiBleed attacks continue to target exposed Fortinet FortiGate firewalls and SSL VPN gateways, sometimes locking legitimate administrators out of their devices.","Attackers use leaked, stolen, or guessed credentials to access exposed endpoints, extract additional authentication data, and crack stolen password hashes with a distributed GPU setup using Hashcat and Hashtopolis.","The FBI says the FortiBleed attack chain has been observed as an initial entry point for ransomware affiliates, including groups associated with INC/Lynx and Payload ransomware.","In some incidents, attackers create administrator accounts, delete existing admin accounts or change their passwords, establish persistence, and attempt to move laterally through the victim environment.","The FBI recommends restricting external access, terminating all active VPN sessions, enforcing MFA, reviewing logs for unauthorized changes, and using PBKDF2 for administrator password storage."],"insights":["The exposed attacker backend indicated that compromised FortiGate access was being packaged for sale, supported by working VPN configurations and target lists.","The attackers’ tooling reportedly filtered out honeypots and prioritized targets based on revenue and network structure, showing a deliberate target-selection process rather than indiscriminate scanning alone.","Changing Fortinet passwords may not be sufficient because attackers have been observed creating replacement administrator accounts, removing legitimate accounts, and establishing ongoing access.","The FBI specifically recommends PBKDF2 for administrator password storage because the legacy SHA-256 hashes used in some cases can be cracked offline in practice."],"referencedReports":[],"body":"\u003cp\u003eThe FBI warns that FortiBleed attacks remain active against exposed Fortinet FortiGate firewalls and SSL VPN gateways. Attackers use previously leaked credentials, infostealer-derived logins, credential stuffing, and password spraying to gain access. In some incidents, they create administrator accounts, delete legitimate admin accounts or change their passwords, and lock victims out of their devices.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising a device, the attackers extract further authentication data and use distributed GPU systems running Hashcat and Hashtopolis to crack stolen password hashes offline. The FBI says the FortiBleed chain has been used as an entry point for ransomware affiliates, including INC/Lynx and Payload ransomware. The agency recommends restricting external access, ending all active VPN sessions, enforcing MFA, reviewing logs for unauthorized activity, and using PBKDF2 for administrator password storage rather than legacy SHA-256 hashes.\u003c/p\u003e\n"},{"n":19,"title":"FBI, Secret Service add to warnings of FortiBleed credential stealing campaign","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/fortibleed-warning-fbi-secret-service","time":"12:50","priority":"MUST READ","score":94,"tldr":"The FBI and Secret Service warn that the FortiBleed campaign has compromised more than 86,000 internet-exposed Fortinet FortiGate devices across 194 countries by abusing leaked or reused credentials. The stolen access is being used or sold to ransomware affiliates, prompting organizations to audit accounts, reset credentials, terminate admin sessions, and restrict external device management.","briefOverview":"\u003cp\u003eThe FBI and Secret Service warned that the ongoing FortiBleed campaign has compromised more than 86,000 internet-facing Fortinet FortiGate firewalls and VPN gateways in 194 countries. The attackers use reused or leaked credentials to collect and crack authentication data at scale. Federal agencies said the campaign has continued for months and that affected organizations may be locked out if attackers disable accounts or change passwords. The activity has also been observed as an initial entry point for ransomware affiliates.\u003c/p\u003e\n\n\u003cp\u003eAttackers scan exposed FortiGate SSL VPN portals with automated scripts, then use credential stuffing and password spraying to gather credentials and other authentication artifacts. They validate and organize stolen access according to factors including a victim organization’s revenue or network structure, and create new accounts on firewall devices to retain access. Access is either sold by initial access brokers or used directly by affiliates tied to INC/Lynx and Payload ransomware. The FBI and Secret Service urged organizations to review all Fortinet accounts, reset credentials, end all administrative VPN sessions, and restrict or eliminate external device administration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and Secret Service warned that the FortiBleed campaign has compromised more than 86,000 internet-facing Fortinet FortiGate firewalls and VPN gateways across 194 countries.","Attackers scan exposed FortiGate SSL VPN portals and use leaked or reused credentials, credential stuffing, and password spraying to collect and validate authentication data at scale.","The campaign has been used as an initial entry point for ransomware affiliates linked to the INC/Lynx and Payload ransomware operations, while initial access brokers also sell access.","Attackers create new accounts on compromised firewall devices to retain access, and victims may be locked out when accounts are disabled or passwords are changed.","The agencies urged organizations to review Fortinet accounts, reset credentials, terminate all administrative VPN sessions, and restrict or remove external device administration."],"insights":["The operation became visible after the attackers exposed their own backend server, giving cybersecurity firms and law enforcement an unusual end-to-end view of how targets were selected, credentials were checked, and access was expanded.","The attackers reportedly sorted and prioritized stolen credentials using details such as an organization’s revenue or network structure, indicating that access was assessed for value before being used or sold.","Simply patching devices or resetting passwords may not be sufficient because attackers have created additional accounts on compromised Fortinet devices to maintain access.","A tracking file identified more than 20 affiliates with defined roles scanning thousands of FortiGate portals in over 150 countries, and at least 12 organizations were later encrypted with ransomware."],"referencedReports":[{"title":"FortiBleed Credential Stealing Campaign Advisory","url":"https://www.ic3.gov/CSA/2026/261006.pdf","publisher":"fbi-and-us-secret-service","context":"The article is based on this joint FBI and Secret Service advisory warning that FortiBleed compromises have continued globally.","category":"advisory","primary":true},{"title":"Active FortiBleed Campaign Impacting Fortinet Devices Across 194 Countries","url":"https://arcticwolf.com/resources/blog/active-fortibleed-campaign-impacting-fortinet-devices-across-194-countries/","publisher":"arctic-wolf","context":"The article cites Arctic Wolf as having warned for months about the FortiBleed campaign.","category":"research","primary":false},{"title":"FortiBleed: 75,000 Fortinet Firewalls Compromised, Global Enterprises Exposed","url":"https://www.hudsonrock.com/blog/fortibleed-75000-fortinet-firewalls-compromised-global-enterprises-exposed-claim-your-ethical-disclosure","publisher":"hudson-rock","context":"The article links to Hudson Rock's prior warning about the FortiBleed campaign.","category":"research","primary":false},{"title":"FortiBleed Unmasked: Inside the Lynx and INC Ransomware Operation","url":"https://socradar.io/resources/whitepapers/fortibleed-unmasked-inside-the-lynx-and-inc-ransomware-operation/","publisher":"socradar","context":"The article cites SOCRadar's July study detailing INC and Lynx affiliates' involvement in the campaign.","category":"research","primary":false},{"title":"CISA Urges Hardening Fortinet Devices After Reports of Credential Exposure","url":"https://www.cisa.gov/news-events/alerts/2026/06/18/cisa-urges-hardening-fortinet-devices-after-reports-credential-exposure","publisher":"cisa","context":"The article notes that CISA issued its own warning about the FortiBleed campaign three months earlier.","category":"advisory","primary":false},{"title":"Advice Following Global Targeting of Fortinet Firewalls and VPN Gateways","url":"https://www.ncsc.gov.uk/news/advice-following-global-targeting-of-fortinet-firewalls-and-vpn-gateways","publisher":"uk-ncsc","context":"The article references advice issued by U.K. officials alongside CISA's warning.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI and Secret Service warned that the ongoing FortiBleed campaign has compromised more than 86,000 internet-facing Fortinet FortiGate firewalls and VPN gateways in 194 countries. The attackers use reused or leaked credentials to collect and crack authentication data at scale. Federal agencies said the campaign has continued for months and that affected organizations may be locked out if attackers disable accounts or change passwords. The activity has also been observed as an initial entry point for ransomware affiliates.\u003c/p\u003e\n\n\u003cp\u003eAttackers scan exposed FortiGate SSL VPN portals with automated scripts, then use credential stuffing and password spraying to gather credentials and other authentication artifacts. They validate and organize stolen access according to factors including a victim organization’s revenue or network structure, and create new accounts on firewall devices to retain access. Access is either sold by initial access brokers or used directly by affiliates tied to INC/Lynx and Payload ransomware. The FBI and Secret Service urged organizations to review all Fortinet accounts, reset credentials, end all administrative VPN sessions, and restrict or eliminate external device administration.\u003c/p\u003e\n"},{"n":21,"title":"FBI Warns FortiBleed Remains Active After Amassing 86,644 Fortinet Device Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fbi-warns-fortibleed-remains-active.html","time":"11:56","priority":"MUST READ","score":94,"tldr":"The FBI and U.S. Secret Service warn that the FortiBleed campaign is still actively using stolen and reused credentials to compromise internet-exposed Fortinet FortiGate devices, with more than 86,000 credentials reportedly harvested worldwide. Organizations should reset administrative and VPN passwords, enable phishing-resistant authentication, review logs, and isolate affected appliances.","briefOverview":"\u003cp\u003eThe FBI and U.S. Secret Service warned that the FortiBleed credential-harvesting campaign remains active against internet-facing Fortinet FortiGate firewalls and SSL VPN gateways. The agencies said attackers exploit reused or leaked credentials and legacy SHA-256 password storage to collect and crack authentication data at scale. The Russian-speaking operation reportedly obtained more than 86,644 working device credentials across 194 countries as of June 19, 2026. Attackers continue scanning exposed Fortinet firewalls with previously compromised credentials.\u003c/p\u003e\n\n\u003cp\u003eFortiBleed conducts reconnaissance, credential stuffing, and password spraying before deploying the Go-based FortigateSniffer tool to passively capture authentication traffic across 24 protocols. Harvested password hashes are sent to GPU-accelerated cracking infrastructure, and recovered credentials are used for network enumeration, Active Directory and Kerberos checks, SMB authentication, and data theft from network shares. The attackers have also created new administrator accounts for continued access and may delete or alter original accounts, potentially locking victims out of their own devices. The agencies advised organizations that detect possible compromise to isolate affected devices, collect logs and other evidence, report the incident, and apply relevant mitigation measures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and U.S. Secret Service warned that the FortiBleed credential-harvesting campaign remains active against internet-facing Fortinet FortiGate firewalls and SSL VPN gateways.","The campaign reportedly obtained more than 86,644 working Fortinet device credentials across 194 countries as of June 19, 2026.","Attackers use previously leaked or reused credentials for credential stuffing and password spraying, then deploy the Go-based FortigateSniffer tool to collect authentication traffic and password hashes.","The stolen password hashes are sent to a GPU-based cracking cluster, and recovered credentials are used for network discovery, Active Directory enumeration, Kerberos validation, SMB authentication, and data theft.","The agencies said attackers may create new firewall accounts for continued access and, in some cases, delete or change existing accounts to lock victims out of their Fortinet devices."],"insights":["The campaign does not rely only on login attempts: after gaining access, it uses FortigateSniffer to passively collect authentication traffic across 24 protocols, expanding the pool of credentials available for later cracking.","Legacy SHA-256 password storage increases the campaign’s impact because harvested hashes can be sent to GPU-powered cracking infrastructure and converted into usable passwords.","Organizations may lose access to their own Fortinet appliances because attackers have reportedly created replacement administrator accounts and, in some cases, deleted or changed the passwords of original accounts.","The suspected operators appear to act as an initial-access broker, with reported overlaps to INC and Lynx ransomware operations suggesting that stolen Fortinet access may be passed to other criminal groups.","The article lists several suspicious account names, including forticloud-sync, fgtsecure, support_fortinet, and adminsslvpn, that organizations can review for on affected devices."],"referencedReports":[{"title":"FortiBleed Credential Harvesting Campaign Advisory","url":"https://www.ic3.gov/CSA/2026/261006.pdf","publisher":"fbi-and-us-secret-service","context":"The article cites this joint FBI and U.S. Secret Service advisory for its warning that FortiBleed remains active and for details on the campaign's tactics and persistence methods.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe FBI and U.S. Secret Service warned that the FortiBleed credential-harvesting campaign remains active against internet-facing Fortinet FortiGate firewalls and SSL VPN gateways. The agencies said attackers exploit reused or leaked credentials and legacy SHA-256 password storage to collect and crack authentication data at scale. The Russian-speaking operation reportedly obtained more than 86,644 working device credentials across 194 countries as of June 19, 2026. Attackers continue scanning exposed Fortinet firewalls with previously compromised credentials.\u003c/p\u003e\n\n\u003cp\u003eFortiBleed conducts reconnaissance, credential stuffing, and password spraying before deploying the Go-based FortigateSniffer tool to passively capture authentication traffic across 24 protocols. Harvested password hashes are sent to GPU-accelerated cracking infrastructure, and recovered credentials are used for network enumeration, Active Directory and Kerberos checks, SMB authentication, and data theft from network shares. The attackers have also created new administrator accounts for continued access and may delete or alter original accounts, potentially locking victims out of their own devices. The agencies advised organizations that detect possible compromise to isolate affected devices, collect logs and other evidence, report the incident, and apply relevant mitigation measures.\u003c/p\u003e\n"},{"n":37,"title":"Emerging Threat: (CVE-2026-21589) Atlassian Data Center Arbitrary File Access via Path Traversal","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-21589-atlassian-data-center-arbitrary-file-access-via-path-traversal/","time":"10:11","priority":"MUST READ","score":93,"tldr":"CVE-2026-21589 is a critical unauthenticated path-traversal flaw in self-hosted Atlassian Data Center products that can expose predictable configuration files and the credentials they contain. Organizations should identify internet-facing Data Center instances, upgrade to the appropriate patched branch, and rotate potentially exposed secrets.","briefOverview":"\u003cp\u003eCVE-2026-21589 is a critical arbitrary-file-access flaw affecting Atlassian’s self-hosted Data Center product line, including Jira, Confluence, Bitbucket, Crowd, Bamboo, Crucible, and Fisheye. An unauthenticated remote attacker can read specific files within the web application root directory if they already know the exact file name and path. The issue has a CVSS v4.0 score of 9.3, and Atlassian published fixes for supported product branches on October 5, 2026. Atlassian Cloud instances are not in scope.\u003c/p\u003e\n\n\u003cp\u003eThe main concern is that predictable configuration or property files may contain database passwords, service-account tokens, or signing keys that can enable access to other systems. Although the flaw cannot list directories or discover files, default file locations remain meaningful targets in widely deployed products. Organizations should inventory internet-facing Atlassian instances, confirm the product edition and release branch, apply the corresponding update, and rotate credentials stored in potentially exposed files. The article also recommends restricting unnecessary public access and reviewing web logs for repeated requests targeting configuration and property-file paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-21589 is a critical unauthenticated flaw affecting Atlassian self-hosted Data Center products that can allow remote attackers to read specific files in the web application’s root directory.","An attacker must know the exact name and path of a target file because the flaw does not allow directory listing or file enumeration.","Affected products include Jira Software, Jira Service Management, Confluence, Bitbucket, Crowd, Bamboo, Crucible, and Fisheye, with fixes released for supported branches on October 5, 2026.","The main risk is disclosure of configuration files containing database passwords, service-account tokens, or signing keys, which could enable access to other systems.","Organizations should inventory internet-facing Atlassian instances, confirm their edition and release branch, apply the appropriate update, and rotate credentials stored in potentially exposed configuration files."],"insights":["The practical first step is asset inventory rather than immediate blanket patching, because external fingerprints often identify an Atlassian product but do not reliably reveal whether it is the affected Data Center edition or which release branch it runs.","Patching may not fully resolve the risk for previously internet-facing instances, because predictable configuration files could already have exposed passwords, tokens, or signing keys that should be rotated.","The flaw cannot list folders or discover files, which limits attackers to predictable file locations; however, default configuration and property-file paths remain meaningful targets in widely deployed products.","The observed exposure is distributed across sectors and organizations rather than concentrated in one industry, reflecting the broad use of developer and collaboration tools such as Jira and Confluence."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-21589 is a critical arbitrary-file-access flaw affecting Atlassian’s self-hosted Data Center product line, including Jira, Confluence, Bitbucket, Crowd, Bamboo, Crucible, and Fisheye. An unauthenticated remote attacker can read specific files within the web application root directory if they already know the exact file name and path. The issue has a CVSS v4.0 score of 9.3, and Atlassian published fixes for supported product branches on October 5, 2026. Atlassian Cloud instances are not in scope.\u003c/p\u003e\n\n\u003cp\u003eThe main concern is that predictable configuration or property files may contain database passwords, service-account tokens, or signing keys that can enable access to other systems. Although the flaw cannot list directories or discover files, default file locations remain meaningful targets in widely deployed products. Organizations should inventory internet-facing Atlassian instances, confirm the product edition and release branch, apply the corresponding update, and rotate credentials stored in potentially exposed files. The article also recommends restricting unnecessary public access and reviewing web logs for repeated requests targeting configuration and property-file paths.\u003c/p\u003e\n"},{"n":39,"title":"DarkSword/Coruna Open Directory Finding Report","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/darksword-coruna-open-directory-finding-report/","time":"16:03","priority":"MUST READ","score":93,"tldr":"Censys researchers found live open directories exposing DarkSword/Coruna, a Chinese-speaking iOS exploitation-as-a-service platform that uses iOS exploit chains and wallet-injection modules to steal cryptocurrency recovery phrases and other device data. The operators are also developing, but have not deployed, an unfinished iOS 26 JavaScriptCore exploit chain tracked as CVE-2026-31001.","briefOverview":"\u003cp\u003eCensys identified five live open directories exposing deployment, staging, telemetry, analysis, and command-and-control components for the DarkSword/Coruna iOS exploit-and-harvest platform. The material included a packaged DS-Fusion release, an active beacon server, a developer workspace, a Coruna watering-hole staging host, and a full C2 platform with an agent/reseller administration panel. Researchers assessed with high confidence that the cluster uses the same DarkSword/Coruna kit previously documented by Google Threat Intelligence Group, based on byte-identical payload modules and shared infrastructure characteristics.\u003c/p\u003e\n\n\u003cp\u003eThe platform targets cryptocurrency wallets through 18 app-specific injection modules coordinated through SpringBoard, and its implant searches photos and Notes for checksum-valid BIP39 recovery phrases. A production-server capture contained 11 victim recovery phrases, 179 device loot directories, 75 control-plane accounts, and wallet-harvesting components, while telemetry on one exposed host showed two Chinese iOS devices polling a beacon page every three seconds for hours. The operators are also developing an iOS 26 chain involving CVE-2026-31001, but the article states that its kernel and sandbox-escape stages are placeholders and that it has not been deployed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five publicly accessible directories exposed components of the DarkSword/Coruna iOS exploit-and-harvest platform, including delivery bundles, live beacon telemetry, an analysis workspace, staging files, and a C2 administration platform.","The exposed platform uses a SpringBoard coordinator and 18 wallet-specific modules to target cryptocurrency wallet apps, while its implant searches photos and Notes for checksum-valid BIP39 recovery phrases.","A production-server capture contained 11 victim recovery phrases, 179 device loot directories, and a 75-account agent and reseller roster.","Telemetry from 166.88.95[.]90 recorded two Chinese iOS devices polling a watering-hole beacon page every three seconds for hours on September 6, 2026.","The operators have iOS 26 development files for CVE-2026-31001, but the companion kernel and sandbox-escape stages are placeholders and the article states that the chain is not deployed."],"insights":["The exposed administrative platform shows an agent-and-reseller business model with commission rates, device quotas, and a 75-account roster, indicating that the kit is operated as a commercial service rather than solely by a single intrusion team.","The production delivery system uses five hash-distinct variant sets, short-lived IP-bound download tokens, prior-visit checks, and iOS-style user-agent checks, making leaked payload links unusable within minutes and reducing reliance on fixed file hashes for detection.","Twenty-two wallet-module samples found in the wild use the separate 66ds[.]lol C2 and differ from the production code primarily by replacing the fallback C2 string, showing that a separate operator reused the same core kit without modifying its broader framework.","The gooll kernel stage does not rely on preloaded device-specific memory-address tables; it fingerprints the phone at runtime and uses multiple fallback paths, which the article identifies as a design difference from older DarkSword chains."],"referencedReports":[{"title":"The Proliferation of DarkSword: iOS Exploit Chain Adopted by Multiple Threat Actors","url":"https://cloud.google.com/blog/topics/threat-intelligence/darksword-ios-exploit-chain/","publisher":"google-threat-intelligence-group","context":"The article relies on GTIG's prior documentation of the DarkSword iOS exploit chain and its adoption by multiple threat actors.","category":"research","primary":true}],"body":"\u003cp\u003eCensys identified five live open directories exposing deployment, staging, telemetry, analysis, and command-and-control components for the DarkSword/Coruna iOS exploit-and-harvest platform. The material included a packaged DS-Fusion release, an active beacon server, a developer workspace, a Coruna watering-hole staging host, and a full C2 platform with an agent/reseller administration panel. Researchers assessed with high confidence that the cluster uses the same DarkSword/Coruna kit previously documented by Google Threat Intelligence Group, based on byte-identical payload modules and shared infrastructure characteristics.\u003c/p\u003e\n\n\u003cp\u003eThe platform targets cryptocurrency wallets through 18 app-specific injection modules coordinated through SpringBoard, and its implant searches photos and Notes for checksum-valid BIP39 recovery phrases. A production-server capture contained 11 victim recovery phrases, 179 device loot directories, 75 control-plane accounts, and wallet-harvesting components, while telemetry on one exposed host showed two Chinese iOS devices polling a beacon page every three seconds for hours. The operators are also developing an iOS 26 chain involving CVE-2026-31001, but the article states that its kernel and sandbox-escape stages are placeholders and that it has not been deployed.\u003c/p\u003e\n"},{"n":7,"title":"PoeLLM malware infects exposed AI servers in cryptomining attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/poellm-malware-infects-exposed-ai-servers-in-cryptomining-attacks/","time":"15:04","priority":"SHOULD READ","score":88,"tldr":"PoeLLM cryptomining malware has compromised more than 3,400 exposed AI and developer-service servers, using infected hosts to scan for and exploit additional targets. It covertly derives its command-and-control address from a GitHub-hosted poem and targets services including LiteLLM and Gotenberg.","briefOverview":"\u003cp\u003eBlack Lotus Labs reports that the PoeLLM cryptomining malware has compromised more than 3,400 servers, with as many as 800 infected systems active on a single day. The campaign has been active since at least April and has targeted systems in the United States and Western Europe. Many affected systems run exposed AI-related services such as LiteLLM and Ollama, as well as Gotenberg and Gitea.\u003c/p\u003e\n\n\u003cp\u003ePoeLLM is an ELF file named \u003ccode\u003elibgcrypt\u003c/code\u003e that retrieves words or phrases from a poem in a GitHub-hosted file and converts them into an IPv4 address for its command server. The malware includes remote-shell access, XMRig and Iron cryptocurrency miners, web scanning, and exploit-deployment capabilities. Infected servers scan ports associated with Gotenberg and LiteLLM and attempt to exploit CVE-2026-42271, which Horizon3.ai researchers said can be chained with CVE-2026-48710 for unauthenticated remote code execution.\u003c/p\u003e\n\n\u003cp\u003eResearchers found signs that several command servers used vulnerable router administration interfaces, suggesting reused compromised routers may support the operation. Black Lotus Labs could not confidently identify the operator but assessed with moderate confidence that the operator is Italian, based on malware comments and an Italy-based server hosting an administrative interface. Administrators are advised to apply updates, limit public exposure and access to trusted IPs, and check network logs for the published indicators of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Black Lotus Labs reports that the PoeLLM cryptomining malware has compromised more than 3,400 servers, with up to 800 infected systems active on a single day.","PoeLLM targets exposed services including LiteLLM, Ollama, Gotenberg, and Gitea, and it can turn compromised servers into systems that scan for and attempt to infect additional targets.","The malware retrieves words or phrases from a poem hosted in a GitHub repository and converts them through a hard-coded dictionary into an IPv4 command-and-control address.","PoeLLM scans ports 3000 and 4000 associated with Gotenberg and LiteLLM and attempts to exploit CVE-2026-42271, which researchers said can be chained with CVE-2026-48710 for unauthenticated remote code execution.","Researchers observed victim communications with the Russian crypto-mining service Kryptex and assessed with moderate confidence that the operator may be Italian."],"insights":["PoeLLM can change its command-and-control destination without updating the malware by changing the words in a poem hosted on GitHub; researchers observed 11 such poem modifications.","Compromised servers are used not only for cryptocurrency mining but also as launchpads that scan ports 3000 and 4000 and attempt to spread to additional Gotenberg and LiteLLM systems.","Although CVE-2026-42271 was originally disclosed as requiring authentication, researchers reported that chaining it with CVE-2026-48710 enables unauthenticated remote code execution.","Several PoeLLM command-and-control servers had vulnerable router administration interfaces, which Black Lotus Labs said suggests the operator may have reused compromised routers as infrastructure.","The campaign particularly targets exposed AI and LLM deployments, whose powerful GPU clusters can be attractive for cryptocurrency mining."],"referencedReports":[{"title":"Canto Incognito: Tracking the PoeLLM Malware","url":"https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware","publisher":"black-lotus-labs","context":"The article relies on Black Lotus Labs' report for its findings on the PoeLLM botnet, its victims, command-and-control method, and infrastructure.","category":"research","primary":true},{"title":"CVE-2026-42271 Chained with CVE-2026-48710","url":"https://horizon3.ai/attack-research/vulnerabilities/cve-2026-42271-chained-with-cve-2026-48710/","publisher":"horizon3-ai","context":"The article cites Horizon3.ai research confirming that the two LiteLLM issues can be chained for unauthenticated remote code execution.","category":"research","primary":false}],"body":"\u003cp\u003eBlack Lotus Labs reports that the PoeLLM cryptomining malware has compromised more than 3,400 servers, with as many as 800 infected systems active on a single day. The campaign has been active since at least April and has targeted systems in the United States and Western Europe. Many affected systems run exposed AI-related services such as LiteLLM and Ollama, as well as Gotenberg and Gitea.\u003c/p\u003e\n\n\u003cp\u003ePoeLLM is an ELF file named \u003ccode\u003elibgcrypt\u003c/code\u003e that retrieves words or phrases from a poem in a GitHub-hosted file and converts them into an IPv4 address for its command server. The malware includes remote-shell access, XMRig and Iron cryptocurrency miners, web scanning, and exploit-deployment capabilities. Infected servers scan ports associated with Gotenberg and LiteLLM and attempt to exploit CVE-2026-42271, which Horizon3.ai researchers said can be chained with CVE-2026-48710 for unauthenticated remote code execution.\u003c/p\u003e\n\n\u003cp\u003eResearchers found signs that several command servers used vulnerable router administration interfaces, suggesting reused compromised routers may support the operation. Black Lotus Labs could not confidently identify the operator but assessed with moderate confidence that the operator is Italian, based on malware comments and an Italy-based server hosting an administrative interface. Administrators are advised to apply updates, limit public exposure and access to trusted IPs, and check network logs for the published indicators of compromise.\u003c/p\u003e\n"},{"n":18,"title":"Arizona courts say hackers stole info on more than 1.3 million people","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/arizona-courts-say-hackers-stole-info-on-over-1-million","time":"18:31","priority":"SHOULD READ","score":88,"tldr":"A phishing-led breach of Arizona’s court system exposed backup files containing names, Social Security numbers, and case data for more than 1.3 million people, plus sensitive foster-care and protective-order records.","briefOverview":"\u003cp\u003eArizona’s court system said criminal hackers accessed and copied backup court files in a cyberattack that began on September 24. Investigators believe the incident started when a court employee clicked a malicious link in a phishing email. The court’s IT team shut down the system entirely, and federal and state investigators are involved in the response.\u003c/p\u003e\n\n\u003cp\u003eThe breach included the Fines/Fees and Restitution Enforcement Program, exposing names, Social Security numbers, and case numbers for more than 1.3 million people in records spanning 30 years. It also affected more than 150,000 Foster Care Review Board reports dating to 2010, including records involving 8,000 children currently in foster care, as well as active and inactive protective-order records. Arizona courts said the copied backup files may be difficult for the hackers to read, have begun notifications, and urged affected FARE participants to place holds on their credit lines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arizona court officials said investigators confirmed that criminal hackers accessed and copied backup court files in a cyberattack on the state court system.","The breach of the Fines/Fees and Restitution Enforcement Program exposed names, Social Security numbers, and case numbers for more than 1.3 million people in records dating back 30 years.","Hackers also accessed more than 150,000 Foster Care Review Board reports dating to 2010, including records involving 8,000 children currently in foster care.","Investigators believe the incident began when a court employee clicked a malicious link in a phishing email.","Arizona’s court system said the attackers had not made ransom demands, and no hacking group had claimed responsibility as of Wednesday."],"insights":["The exposure spans records dating back 30 years, greatly extending the number of potentially affected people beyond current court-system participants.","Although investigators confirmed the backup files were copied, Arizona courts said their format may make them difficult for the attackers to read.","The incident affected especially sensitive child-welfare material, including more than 150,000 Foster Care Review Board reports and records concerning 8,000 children currently in foster care.","The court system is using text messages to notify people affected through the Fines/Fees and Restitution Enforcement Program and has urged them to place holds on their credit lines.","The attackers copied data without issuing ransom demands, and the court system said the incident did not involve ransomware."],"referencedReports":[{"title":"Cybersecurity Alert FAQ","url":"https://www.azcourts.gov/cybersecurityalert","publisher":"Arizona Judicial Branch","context":"The article cites an updated FAQ from Arizona court officials describing investigators' findings that hackers accessed and copied backup court files.","category":"advisory","primary":true}],"body":"\u003cp\u003eArizona’s court system said criminal hackers accessed and copied backup court files in a cyberattack that began on September 24. Investigators believe the incident started when a court employee clicked a malicious link in a phishing email. The court’s IT team shut down the system entirely, and federal and state investigators are involved in the response.\u003c/p\u003e\n\n\u003cp\u003eThe breach included the Fines/Fees and Restitution Enforcement Program, exposing names, Social Security numbers, and case numbers for more than 1.3 million people in records spanning 30 years. It also affected more than 150,000 Foster Care Review Board reports dating to 2010, including records involving 8,000 children currently in foster care, as well as active and inactive protective-order records. Arizona courts said the copied backup files may be difficult for the hackers to read, have begun notifications, and urged affected FARE participants to place holds on their credit lines.\u003c/p\u003e\n"},{"n":36,"title":"Malicious PostgreSQL Extensions in the Wild | Cyera","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/malicious-postgresql-extensions-in-the-wild","time":"13:34","priority":"SHOULD READ","score":88,"tldr":"Cyera uncovered a Tor2Mine campaign that disguises cryptomining malware as PostgreSQL extensions for Windows and Linux, enabling code execution inside database processes. The Linux extensions evaded all tested antivirus engines and persist by modifying PostgreSQL configuration files to reload themselves.","briefOverview":"\u003cp\u003eCyera researchers identified 20 malicious PostgreSQL extensions linked to the Tor2Mine cryptomining group: 16 targeting Windows and four targeting Linux. The extensions use PostgreSQL’s binary-extension capability to execute code within the database process, and the campaign’s infrastructure dates back to at least 2018. Windows and Linux samples share three command-and-control domains, supporting the assessment that they are part of one cross-platform operation. The researchers reported that one campaign domain, \u003ccode\u003ed1.pool4883.pw\u003c/code\u003e, remained live during their research.\u003c/p\u003e\n\n\u003cp\u003eOn Windows, the extension decrypts an embedded payload, uses process hollowing to run a downloader, and retrieves an XMRigCC cryptocurrency miner. On Linux, the extension activates when unloaded, extracts and runs a compressed downloader, copies itself near PostgreSQL configuration files, and adds itself to PostgreSQL preload settings for persistence. The Linux extension samples received no detections from 65 antivirus engines in VirusTotal, although the extracted downloader was detected by four of 66 engines. The same infrastructure was also linked to a separate \u003ccode\u003epatch.exe\u003c/code\u003e campaign that disabled Windows defenses and delivered the AZORult credential-stealing tool.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera identified 20 malicious PostgreSQL extensions linked to the Tor2Mine cryptomining group: 16 for Windows and four for Linux.","The Windows extensions use an encrypted embedded payload and process hollowing to download and run an XMRigCC cryptocurrency miner.","The Linux extensions execute their payload when unloaded, copy themselves near PostgreSQL configuration files, add themselves to preload settings, and signal PostgreSQL to reload the changed configuration.","The Linux extension samples had a 0/65 VirusTotal detection rate, while their separately extracted downloader was detected by 4/66 engines.","The campaign shared command-and-control domains across Windows and Linux, and its infrastructure dates back to at least June 2018."],"insights":["The Linux extensions execute their malicious routine when they are unloaded rather than when they are loaded, then alter PostgreSQL preload settings to arrange for themselves to be loaded again.","The malicious code runs inside the PostgreSQL process itself, meaning there may be no separate executable process for security tools to flag.","Although the embedded Linux downloader was detected by 4 of 66 antivirus engines when examined separately, the extension carrying it received no detections from 65 engines.","Tor2Mine’s shared infrastructure also supported a separate patch.exe campaign that disabled Windows defenses and delivered the AZORult credential-stealing tool, combining compute monetization and credential theft.","The PostgreSQL extensions appeared years after some of the campaign’s command-and-control domains were registered, indicating reuse of long-standing infrastructure."],"referencedReports":[{"title":"2025 Stack Overflow Developer Survey","url":"https://survey.stackoverflow.co/2025/technology#1-databases","publisher":"stack-overflow","context":"The article cites this developer survey to state that PostgreSQL has been the most popular database in the survey since 2023.","category":"research","primary":false},{"title":"State of PostgreSQL 2024","url":"https://assets.tigerdata.com/state-of-postgresql/Report_State_of_PostgreSQL_2024.pdf","publisher":"tigerdata","context":"The article cites this 2024 survey for its finding that 41.3% of the PostgreSQL community hosted PostgreSQL as a database service.","category":"research","primary":false},{"title":"Tor2Mine Is Up to Their Old Tricks and Is Now More Dangerous Than Ever","url":"https://blog.talosintelligence.com/tor2mine-is-up-to-their-old-tricks-and_11/","publisher":"cisco-talos","context":"The article references Cisco Talos's analysis as prior documentation of Tor2Mine using AZORult alongside cryptocurrency mining.","category":"research","primary":false}],"body":"\u003cp\u003eCyera researchers identified 20 malicious PostgreSQL extensions linked to the Tor2Mine cryptomining group: 16 targeting Windows and four targeting Linux. The extensions use PostgreSQL’s binary-extension capability to execute code within the database process, and the campaign’s infrastructure dates back to at least 2018. Windows and Linux samples share three command-and-control domains, supporting the assessment that they are part of one cross-platform operation. The researchers reported that one campaign domain, \u003ccode\u003ed1.pool4883.pw\u003c/code\u003e, remained live during their research.\u003c/p\u003e\n\n\u003cp\u003eOn Windows, the extension decrypts an embedded payload, uses process hollowing to run a downloader, and retrieves an XMRigCC cryptocurrency miner. On Linux, the extension activates when unloaded, extracts and runs a compressed downloader, copies itself near PostgreSQL configuration files, and adds itself to PostgreSQL preload settings for persistence. The Linux extension samples received no detections from 65 antivirus engines in VirusTotal, although the extracted downloader was detected by four of 66 engines. The same infrastructure was also linked to a separate \u003ccode\u003epatch.exe\u003c/code\u003e campaign that disabled Windows defenses and delivered the AZORult credential-stealing tool.\u003c/p\u003e\n"},{"n":22,"title":"SonicWall Patches CVSS 10.0 Pre-Authentication SSRF Flaw in SMA1000 Appliances","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html","time":"16:17","priority":"SHOULD READ","score":86,"tldr":"SonicWall released hotfixes for SMA1000 appliances to fix four flaws, led by CVE-2026-102255, a critical 10.0 pre-authentication SSRF bug in the WorkPlace portal. Organizations should update to the fixed platform-hotfix versions immediately, as no workaround is available.","briefOverview":"\u003cp\u003eSonicWall released hotfixes for four vulnerabilities in SMA1000 remote-access appliances, affecting models 6210, 7210, and 8200v. The most severe issue, CVE-2026-102255, is a CVSS 10.0 server-side request forgery flaw in the pre-login WorkPlace portal. SonicWall said an unauthenticated attacker could use it to reach internal functionality and perform unauthorized operations, although it has no evidence that any of the four flaws are being exploited.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include 12.4.3-03526 and earlier and 12.5.0-02952 and earlier; fixed versions are 12.4.3-03670 or later and 12.5.0-03082 or later. The other flaws require login and include OS command injection, a Zip Slip issue that could lead to remote code execution, and stored cross-site scripting in the Appliance Management Console. The hotfix is available through MySonicWall, requires an appliance restart, and has no listed workaround; SSL-VPN on SonicWall firewalls and SMA 100 Series devices are not affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall released hotfixes for four vulnerabilities affecting SMA1000 models 6210, 7210, and 8200v.","CVE-2026-102255 is a CVSS 10.0 pre-authentication server-side request forgery flaw in the WorkPlace portal that could allow unauthorized access to internal functionality.","The affected releases are platform-hotfix versions 12.4.3-03526 and earlier and 12.5.0-02952 and earlier; fixed releases are 12.4.3-03670 and later and 12.5.0-03082 and later.","The other three vulnerabilities require login and include an OS command injection issue, a Zip Slip issue that could lead to remote code execution, and stored cross-site scripting in the Appliance Management Console.","SonicWall said it has no evidence that any of the four newly disclosed vulnerabilities is being exploited in attacks, and it listed no workaround besides installing the hotfix."],"insights":["Organizations that previously updated to the September fixes, including versions 12.4.3-03526 or 12.5.0-02952, still need to install this newer hotfix.","This is the third time in the same year that SonicWall has fixed a maximum-severity, no-login SSRF issue in the SMA1000 WorkPlace portal.","The new hotfix requires an appliance restart and SonicWall has not provided a workaround, making installation the only listed remediation.","Unlike its advisories for exploited flaws in July and September, SonicWall did not tell customers to check for compromise indicators or reset credentials for these four newly disclosed issues."],"referencedReports":[{"title":"SNWLID-2026-0017","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017","publisher":"sonicwall","context":"SonicWall's security advisory describes CVE-2026-102255 and states that it could allow unauthorized access to internal functionality.","category":"advisory","primary":true},{"title":"Rapid7 MDR Team Discovers New SonicWall SMA1000 Zero-Days Being Actively Exploited: CVE-2026-15409, CVE-2026-15410","url":"https://www.rapid7.com/blog/post/etr-rapid7-mdr-team-discovers-new-sonicwall-sma1000-zero-days-being-actively-exploited-cve-2026-15409-cve-2026-15410","publisher":"rapid7","context":"The article cites Rapid7's analysis of July attacks involving earlier SonicWall SMA1000 flaws.","category":"research","primary":false}],"body":"\u003cp\u003eSonicWall released hotfixes for four vulnerabilities in SMA1000 remote-access appliances, affecting models 6210, 7210, and 8200v. The most severe issue, CVE-2026-102255, is a CVSS 10.0 server-side request forgery flaw in the pre-login WorkPlace portal. SonicWall said an unauthenticated attacker could use it to reach internal functionality and perform unauthorized operations, although it has no evidence that any of the four flaws are being exploited.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include 12.4.3-03526 and earlier and 12.5.0-02952 and earlier; fixed versions are 12.4.3-03670 or later and 12.5.0-03082 or later. The other flaws require login and include OS command injection, a Zip Slip issue that could lead to remote code execution, and stored cross-site scripting in the Appliance Management Console. The hotfix is available through MySonicWall, requires an appliance restart, and has no listed workaround; SSL-VPN on SonicWall firewalls and SMA 100 Series devices are not affected.\u003c/p\u003e\n"},{"n":30,"title":"Attackers Hijack .gh, .sl, and .as Registries to Obtain Certificates for Google Domains","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html","time":"18:48","priority":"SHOULD READ","score":86,"tldr":"Attackers hijacked DNS for the .gh, .sl, and .as registries, enabling unauthorized certificates for Google and YouTube domains that could support HTTPS impersonation. Google blocked the certificates in Chrome and worked with certificate authorities to revoke them, while urging domain owners to monitor Certificate Transparency logs and enforce strict CAA records.","briefOverview":"\u003cp\u003eAttackers compromised the registries for the .gh, .sl, and .as country-code domains and changed authoritative DNS records, allowing them to obtain unauthorized HTTPS certificates for Google and YouTube domain names. Google said its own systems were not breached, but the incident put any domain under those endings at risk. Such certificates could allow an attacker to impersonate a legitimate encrypted website and read private information submitted by visitors.\u003c/p\u003e\n\n\u003cp\u003eCertificate Transparency logs showed at least 12 domain-validated certificates for seven Google and YouTube domains, logged from September 22 through September 27; Let’s Encrypt issued 11 and ZeroSSL issued one. Google blocked known unauthorized certificates in Chrome through CRLSets and worked with the issuing certificate authorities to revoke them, although it warned that protections may not extend reliably to other browsers and apps. Google advised domain owners to monitor certificate logs, use strict CAA records after regaining DNS control, and report unrequested certificates to the issuing certificate authority.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers compromised the .gh, .sl, and .as country-code domain registries and changed authoritative DNS records, enabling them to obtain unauthorized HTTPS certificates for Google and YouTube domain names.","Certificate Transparency logs showed at least 12 unauthorized domain-validated certificates for seven Google and YouTube domains issued between September 22 and September 27, with Let’s Encrypt issuing 11 and ZeroSSL issuing one.","Google said its own systems were not breached, blocked the unauthorized certificates in Chrome through CRLSets, and worked with the issuing certificate authorities to have the certificates revoked.","Google warned that its analysis may not have identified every affected domain and said that Chrome’s certificate blocks do not reliably protect users of other browsers or applications.","Google advised domain owners to monitor Certificate Transparency logs, publish strict CAA records, and report unrequested certificates to the issuing certificate authority."],"insights":["A DNS takeover can let an attacker pass a certificate authority’s normal proof-of-domain-control check without the certificate authority necessarily doing anything wrong.","The known certificates remained active from roughly a day and a half to nearly a week before revocation, and a certificate for .as was logged after the .gh certificates had already been revoked.","CAA records cannot prevent certificate issuance during an active DNS hijack because an attacker controlling DNS can alter them, but strict records can block additional certificates requested later using a previously completed domain check.","Certificate authorities may reuse a completed domain-control check for up to 200 days under current rules, making post-incident DNS recovery and restrictive CAA records important."],"referencedReports":[{"title":"Chrome’s Response to Recent ccTLD Registry Hijacks","url":"https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/","publisher":"google","context":"The article relies on Google’s October 6 response describing the ccTLD registry hijacks, Chrome certificate blocks, revocations, and recommended actions for domain owners.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers compromised the registries for the .gh, .sl, and .as country-code domains and changed authoritative DNS records, allowing them to obtain unauthorized HTTPS certificates for Google and YouTube domain names. Google said its own systems were not breached, but the incident put any domain under those endings at risk. Such certificates could allow an attacker to impersonate a legitimate encrypted website and read private information submitted by visitors.\u003c/p\u003e\n\n\u003cp\u003eCertificate Transparency logs showed at least 12 domain-validated certificates for seven Google and YouTube domains, logged from September 22 through September 27; Let’s Encrypt issued 11 and ZeroSSL issued one. Google blocked known unauthorized certificates in Chrome through CRLSets and worked with the issuing certificate authorities to revoke them, although it warned that protections may not extend reliably to other browsers and apps. Google advised domain owners to monitor certificate logs, use strict CAA records after regaining DNS control, and report unrequested certificates to the issuing certificate authority.\u003c/p\u003e\n"},{"n":28,"title":"Unpatched Critical LMCache Flaw Lets Unauthenticated Attackers Run Code Remotely","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/unpatched-critical-lmcache-flaw-lets.html","time":"15:34","priority":"SHOULD READ","score":85,"tldr":"LMCache versions 0.3.9 through 0.5.5 contain an unpatched critical flaw that allows unauthenticated remote code execution when its multiprocess ZeroMQ server is exposed on a routable network address. Operators should keep the service bound to localhost or a trusted internal network, as no fixed release is available.","briefOverview":"\u003cp\u003eA critical, unpatched flaw in LMCache can allow an unauthenticated attacker to execute code on an LMCache cache server in multiprocess deployments. JFrog disclosed the issue as CVE-2026-105192 and rated it 9.8 when the server is exposed on a routable network address. The affected versions span LMCache 0.3.9 through 0.5.5, as well as 0.5.6 release candidates and the development branch.\u003c/p\u003e\n\n\u003cp\u003eThe multiprocess server uses ZeroMQ for worker communication and accepts a message type that is decoded with Python pickle before its type is validated. A crafted network message can therefore execute commands with the permissions of the LMCache process, which JFrog says runs as root in the project’s official container images. The server is local-only by default, but it becomes reachable from other machines when configured with a routable address; LMCache’s Kubernetes example listens on all network interfaces.\u003c/p\u003e\n\n\u003cp\u003eNo patched LMCache version is available, and JFrog recommends keeping the multiprocess server bound to localhost or a trusted cluster network. Firewall restrictions reduce exposure but do not prevent code execution by any host that is still allowed to connect. The article also notes unconfirmed additional LMCache reports and a separate vLLM denial-of-service issue, CVE-2026-105756, that was fixed in vLLM 0.30.0 and does not allow code execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LMCache versions 0.3.9 through 0.5.5, along with 0.5.6 release candidates and the development branch, are affected by CVE-2026-105192, an unpatched critical remote code execution flaw.","The flaw affects LMCache multiprocess deployments whose ZeroMQ cache server is bound to a routable address, allowing an unauthenticated attacker to send a crafted message that executes code.","LMCache uses Python pickle to unpack one type of network message before validating its type, enabling malicious data to run code with the permissions of the LMCache process.","LMCache’s official container images run the LMCache process as root, according to JFrog, increasing the potential impact of successful exploitation.","Until a patched release is available, JFrog recommends keeping the LMCache multiprocess server on localhost or a trusted cluster network; firewall restrictions reduce but do not eliminate the risk."],"insights":["The vulnerability is not remotely reachable in LMCache’s default configuration because the multiprocess server listens only on the local machine, but the project’s own Kubernetes example binds it to every network interface.","Restricting the port with a firewall lowers exposure but does not fully mitigate the issue, because any system still permitted to connect can execute code on the LMCache server.","Operators have no vendor-provided method to determine whether an LMCache server was already compromised, according to JFrog’s advisory.","The related vLLM flaw is distinct from the LMCache code-execution issue: it could crash affected deployments using the multiprocess connector but was fixed in vLLM 0.30.0 and does not permit code execution.","Six additional LMCache security reports were filed by one GitHub account, but they remain unconfirmed by maintainers and have no assigned CVEs or fixes."],"referencedReports":[{"title":"LMCache Is Vulnerable to Unauthenticated Remote Code Execution via Pickle Deserialization on the Multiprocess ZMQ Transport (CVE-2026-105192)","url":"https://research.jfrog.com/vulnerabilities/lmcache-is-vulnerable-to-unauthenticated-remote-code-execution-via-pickle-deserialization-on-the-multiprocess-zmq-transport-cve-2026-105192-jfsa-2026-001694382/","publisher":"jfrog","context":"JFrog disclosed and analyzed the critical unauthenticated remote code execution flaw affecting LMCache multiprocess deployments.","category":"research","primary":true},{"title":"CVE-2026-105756","url":"https://github.com/vllm-project/vllm/security/advisories/GHSA-2823-qmq8-rwvj","publisher":"vllm-project","context":"The article references this security advisory for a related, fixed vLLM denial-of-service flaw involving the LMCache multiprocess connector.","category":"advisory","primary":false}],"body":"\u003cp\u003eA critical, unpatched flaw in LMCache can allow an unauthenticated attacker to execute code on an LMCache cache server in multiprocess deployments. JFrog disclosed the issue as CVE-2026-105192 and rated it 9.8 when the server is exposed on a routable network address. The affected versions span LMCache 0.3.9 through 0.5.5, as well as 0.5.6 release candidates and the development branch.\u003c/p\u003e\n\n\u003cp\u003eThe multiprocess server uses ZeroMQ for worker communication and accepts a message type that is decoded with Python pickle before its type is validated. A crafted network message can therefore execute commands with the permissions of the LMCache process, which JFrog says runs as root in the project’s official container images. The server is local-only by default, but it becomes reachable from other machines when configured with a routable address; LMCache’s Kubernetes example listens on all network interfaces.\u003c/p\u003e\n\n\u003cp\u003eNo patched LMCache version is available, and JFrog recommends keeping the multiprocess server bound to localhost or a trusted cluster network. Firewall restrictions reduce exposure but do not prevent code execution by any host that is still allowed to connect. The article also notes unconfirmed additional LMCache reports and a separate vLLM denial-of-service issue, CVE-2026-105756, that was fixed in vLLM 0.30.0 and does not allow code execution.\u003c/p\u003e\n"},{"n":4,"title":"SonicWall warns of max severity SSRF flaw in SMA1000 gateways","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/","time":"11:37","priority":"SHOULD READ","score":84,"tldr":"SonicWall released hotfixes for CVE-2026-102255, a maximum-severity unauthenticated SSRF flaw in SMA1000 appliances that could let remote attackers access internal functionality and perform unauthorized operations. The flaw is not currently known to be exploited, but organizations should patch promptly given recent attacks on SMA1000 gateways.","briefOverview":"\u003cp\u003eSonicWall has released hotfixes for CVE-2026-102255, a maximum-severity server-side request forgery flaw affecting the Appliance WorkPlace interface in SMA1000 6210, 7210, and 8200v appliances. The flaw is an unintended alternate access path that a remote attacker without privileges could use with low complexity. An attacker could potentially cause an affected appliance to send requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003eSonicWall said it has no evidence that the issues addressed by the release are being exploited in the wild and urged SMA1000 customers to upgrade to the fixed version. The issue does not affect the SMA 100 Series or SSL-VPN services running on SonicWall firewalls, while Shadowserver tracks more than 400 internet-exposed SMA1000 appliances. The warning is significant because several SMA1000 zero-days have been exploited this year to install Sou5, OrangeTail, and RootRun malware, with CISA linking some of those attacks to ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall released hotfixes for CVE-2026-102255, a maximum-severity server-side request forgery flaw in the Appliance WorkPlace interface of SMA1000 6210, 7210, and 8200v appliances.","A remote attacker without authentication could potentially abuse the flaw to make an affected appliance issue requests on their behalf, reach internal functions, and perform unauthorized operations.","SonicWall said there is currently no evidence that CVE-2026-102255 or the other issues addressed in the release are being exploited in the wild.","The flaw does not affect the SMA 100 Series product line or SSL-VPN running on SonicWall firewalls.","Shadowserver tracks more than 400 Internet-exposed SMA1000 appliances, although some may already have been patched."],"insights":["The affected SMA1000 systems are enterprise remote-access gateways used by government agencies, managed service providers, and large corporations, so a flaw in them can provide a path toward internal organizational functions.","More than 400 SMA1000 appliances are currently visible on the internet according to Shadowserver, creating a substantial pool of systems that may need the hotfix.","Recent SMA1000 zero-day flaws were used for weeks to install Sou5, OrangeTail, and RootRun malware, and CISA linked those attacks to ransomware gangs, making prompt patching particularly important even though this newer flaw has not been observed in use.","CISA has added 19 SonicWall vulnerabilities to its actively exploited catalog over the past four years, including 13 that were also used in ransomware attacks."],"referencedReports":[{"title":"SNWLID-2026-0017","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017","publisher":"sonicwall","context":"SonicWall's security advisory explains that an unauthenticated remote attacker could direct an affected appliance to make requests and access internal functionality.","category":"advisory","primary":true}],"body":"\u003cp\u003eSonicWall has released hotfixes for CVE-2026-102255, a maximum-severity server-side request forgery flaw affecting the Appliance WorkPlace interface in SMA1000 6210, 7210, and 8200v appliances. The flaw is an unintended alternate access path that a remote attacker without privileges could use with low complexity. An attacker could potentially cause an affected appliance to send requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003eSonicWall said it has no evidence that the issues addressed by the release are being exploited in the wild and urged SMA1000 customers to upgrade to the fixed version. The issue does not af
