<script type="application/json" id="dl-articles">[{"n":2,"title":"Emerging Threat: (CVE-2026-56291) Balbooa Forms Remote Code Execution via Unauthenticated File Upload","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-56291-balbooa-forms-remote-code-execution-via-unauthenticated-file-upload/","time":"18:48","priority":"MUST READ","score":95,"tldr":"CVE-2026-56291 is a critical, actively exploited unauthenticated file upload flaw in Balbooa Forms for Joomla that can let attackers upload and run PHP files for full remote code execution. Sites using Balbooa Forms 2.4.0 or earlier should update to 2.4.1 immediately and check for compromise.","briefOverview":"\u003cp\u003eCVE-2026-56291 is an unauthenticated arbitrary file upload vulnerability in Balbooa Forms, a commercial drag-and-drop form builder for Joomla installed as the com_baforms component. The flaw affects Balbooa Forms up to and including version 2.4.0 and is classified as CWE-434. It has a CVSS v3.1 base score of 9.8 and a CVSS v4.0 base score of 10.0, and the article says it is listed in CISA’s Known Exploited Vulnerabilities catalog and is being actively exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable frontend attachment upload accepts files from anonymous visitors without a login, CSRF token, or extension allow-list. Because the upload handler trusts the caller-supplied filename and Joomla’s built-in filename cleaner does not strip a .php extension, an attacker can upload a PHP file into a web-served directory and then request it in a browser. By default, uploaded files land under images/baforms/uploads/ inside the web root, where they can be served and executed directly. The article states that the practical impact is full remote code execution, which can enable data theft, defacement, backdoors, or pivoting to other systems.\u003c/p\u003e\n\n\u003cp\u003eBalbooa fixed the vulnerability in Balbooa Forms 2.4.1, released on 9 July 2026, and any installation on 2.4.0 or earlier should be treated as vulnerable until updated. The article says updating alone is not sufficient because the flaw was exploited before the patch shipped, so exposed sites should be checked for compromise, including unexpected files in the upload directory and unfamiliar administrator accounts. Recommended actions include inventorying internet-facing Joomla sites, identifying Balbooa Forms installations, restricting upload endpoints where feasible, blocking script execution in upload directories, monitoring relevant POST requests, auditing Super User accounts, and scanning for unexpected PHP files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-56291 is an unauthenticated arbitrary file upload vulnerability in Balbooa Forms, the com_baforms component for Joomla, and is classified as CWE-434.","The vulnerability affects Balbooa Forms up to and including version 2.4.0 and can allow an anonymous attacker to upload a PHP file into a web-served directory and execute it for remote code execution.","The flaw has a CVSS v3.1 base score of 9.8 and a CVSS v4.0 base score of 10.0, is listed in CISA’s Known Exploited Vulnerabilities catalog, and is being actively exploited in the wild.","Balbooa fixed the vulnerability in Balbooa Forms 2.4.1, released on 9 July 2026, but sites that ran affected versions while exposed should also be checked for signs of compromise.","Recommended actions include inventorying internet-facing Joomla sites, identifying Balbooa Forms installations, blocking script execution in upload directories, monitoring relevant POST requests, auditing Super User accounts, and scanning upload directories for unexpected PHP files."],"insights":["Updating to Balbooa Forms 2.4.1 is not enough by itself because the flaw was exploited before the patch was released, so previously exposed sites need compromise checks as well.","The exposed assets may be difficult to identify externally because Joomla can be detected from the internet but extensions such as Balbooa Forms are not always fingerprintable.","Risk is concentrated in forgotten or loosely governed public web properties such as campaign sites, registration pages, localized microsites, and older brand or regional sites rather than only in core applications.","A practical mitigation before all upgrades are confirmed is to block script execution specifically in upload directories such as images/baforms/uploads/.","The upload endpoint can be reachable to any visitor even without a published form or guest setting being enabled, which makes simple assumptions about form visibility unreliable."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-56291 is an unauthenticated arbitrary file upload vulnerability in Balbooa Forms, a commercial drag-and-drop form builder for Joomla installed as the com_baforms component. The flaw affects Balbooa Forms up to and including version 2.4.0 and is classified as CWE-434. It has a CVSS v3.1 base score of 9.8 and a CVSS v4.0 base score of 10.0, and the article says it is listed in CISA’s Known Exploited Vulnerabilities catalog and is being actively exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable frontend attachment upload accepts files from anonymous visitors without a login, CSRF token, or extension allow-list. Because the upload handler trusts the caller-supplied filename and Joomla’s built-in filename cleaner does not strip a .php extension, an attacker can upload a PHP file into a web-served directory and then request it in a browser. By default, uploaded files land under images/baforms/uploads/ inside the web root, where they can be served and executed directly. The article states that the practical impact is full remote code execution, which can enable data theft, defacement, backdoors, or pivoting to other systems.\u003c/p\u003e\n\n\u003cp\u003eBalbooa fixed the vulnerability in Balbooa Forms 2.4.1, released on 9 July 2026, and any installation on 2.4.0 or earlier should be treated as vulnerable until updated. The article says updating alone is not sufficient because the flaw was exploited before the patch shipped, so exposed sites should be checked for compromise, including unexpected files in the upload directory and unfamiliar administrator accounts. Recommended actions include inventorying internet-facing Joomla sites, identifying Balbooa Forms installations, restricting upload endpoints where feasible, blocking script execution in upload directories, monitoring relevant POST requests, auditing Super User accounts, and scanning for unexpected PHP files.\u003c/p\u003e\n"},{"n":1,"title":"Claude Fable 5 stays free for paid users until July 19 as Anthropic buys more time","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/claude-fable-5-stays-free-for-paid-users-until-july-19-as-anthropic-buys-more-time/","time":"19:39","priority":"MAY READ","score":25,"tldr":"Anthropic has extended free Claude Fable 5 access for paid subscribers until July 19, giving Pro, Max, Team, and eligible Enterprise users another week before usage credits are required beyond the promotional allowance.","briefOverview":"\u003cp\u003eAnthropic has extended access to Claude Fable 5 for paid subscribers until July 19, 2026 at 11:59:59 PM PT. The model was previously included in Pro, Max, Team, and premium Enterprise subscriptions only through July 7, then extended to July 12 before this latest extension. Anthropic also extended the 50% increase to Claude Code weekly usage limits through the same date.\u003c/p\u003e\n\n\u003cp\u003eThe promotion lets eligible paid users use Fable 5 for up to 50% of their weekly subscription limits at no extra cost. Fable 5 uses the same weekly usage pool as other Claude models, and Anthropic warns that it uses that weekly limit faster than other models. Once users hit the 50% weekly Fable 5 allowance, they can either continue with separately billed usage credits or switch to another Claude model within their remaining plan limits.\u003c/p\u003e\n\n\u003cp\u003eThe extension applies to Claude Pro, Max, Team, and premium seats on seat-based Enterprise plans where enabled by the organization. Fable 5 is available across Claude on the web, Claude Mobile, Claude Desktop, Claude Cowork, Claude Code, Claude Design, Claude for Microsoft 365, Claude for Teams, and Claude Tag, with Claude Code requiring version 2.1.170 or later. The promotion does not apply to Free users, standard seats on seat-based Enterprise plans, usage-based Enterprise plans, or API usage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic has extended paid subscriber access to Claude Fable 5 until July 19, 2026 at 11:59:59 PM PT.","The promotion applies to Claude Pro, Max, Team, and premium seats on seat-based Enterprise plans where enabled by the organization.","Paid users can use Fable 5 for up to 50% of their weekly subscription limits at no extra cost, but Anthropic says it uses the weekly limit faster than other Claude models.","Once users reach the 50% weekly Fable 5 allowance, they can continue using Fable 5 with separately billed usage credits or switch to another Claude model within their remaining plan limits.","The promotion does not apply to Free users, standard seats on seat-based Enterprise plans, usage-based Enterprise plans, or API usage."],"insights":["The promotion is not a separate free quota because Fable 5 draws from the same weekly usage pool as other Claude models and can consume that pool faster.","API users are excluded even though Fable 5 remains available across many Claude apps and products, so the extension only helps users working through eligible Claude subscription interfaces.","Anthropic has extended the Fable 5 subscription promotion multiple times and says the model is not permanently leaving subscriptions, with restoration planned when the company has enough compute.","The same July 19 deadline also applies to the 50% increase in Claude Code weekly usage limits, making that date important for users who rely on Claude Code as well as Fable 5."],"referencedReports":[],"body":"\u003cp\u003eAnthropic has extended access to Claude Fable 5 for paid subscribers until July 19, 2026 at 11:59:59 PM PT. The model was previously included in Pro, Max, Team, and premium Enterprise subscriptions only through July 7, then extended to July 12 before this latest extension. Anthropic also extended the 50% increase to Claude Code weekly usage limits through the same date.\u003c/p\u003e\n\n\u003cp\u003eThe promotion lets eligible paid users use Fable 5 for up to 50% of their weekly subscription limits at no extra cost. Fable 5 uses the same weekly usage pool as other Claude models, and Anthropic warns that it uses that weekly limit faster than other models. Once users hit the 50% weekly Fable 5 allowance, they can either continue with separately billed usage credits or switch to another Claude model within their remaining plan limits.\u003c/p\u003e\n\n\u003cp\u003eThe extension applies to Claude Pro, Max, Team, and premium seats on seat-based Enterprise plans where enabled by the organization. Fable 5 is available across Claude on the web, Claude Mobile, Claude Desktop, Claude Cowork, Claude Code, Claude Design, Claude for Microsoft 365, Claude for Teams, and Claude Tag, with Claude Code requiring version 2.1.170 or later. The promotion does not apply to Free users, standard seats on seat-based Enterprise plans, usage-based Enterprise plans, or API usage.\u003c/p\u003e\n"}]</script>
