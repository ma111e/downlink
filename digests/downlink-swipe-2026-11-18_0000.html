ncy, allowing the framework to continue functioning normally while credential theft occurred in the background.","The credential stealer ran during normal Python startup through .pth files, meaning it could execute even when developers did not import the compromised Agent Framework package.","The attacker published a second malicious version about 2.5 minutes after PyPI quarantined the first, showing that the publishing access remained active after the initial response.","Investigators can use the specific webhook URL path in outbound network logs to determine whether data theft attempts were blocked or successfully completed."],"referencedReports":[{"title":"Agent Framework PyPI package compromised with credential stealer","url":"https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer","publisher":"socket","context":"The article identifies Socket as one of the security firms that discovered and documented the compromised Agent Framework releases.","category":"research","primary":true},{"title":"Microsoft Agent Framework PyPI package compromised","url":"https://www.stepsecurity.io/blog/microsoft-agent-framework-pypi-package-compromised","publisher":"step-security","context":"The article cites StepSecurity’s technical documentation of the malicious PyPI releases and their Python startup execution method.","category":"research","primary":true},{"title":"Breaking: Hijacked releases of Microsoft’s official Agent Framework steals Azure and CI credentials","url":"https://www.ox.security/blog/breaking-hijacked-releases-of-microsofts-official-agent-framework-steals-azure-and-ci-credentials/","publisher":"ox-security","context":"The article cites Ox Security’s analysis and uses its attack-overview and data-collection illustrations.","category":"research","primary":true}],"body":"\u003cp\u003eHackers compromised Microsoft’s official Agent Framework package on PyPI and published malicious versions 1.26.1 and 1.26.2 on November 17, 2026. Agent Framework is an open-source toolkit for building and coordinating AI agents, with roughly 200,000 monthly PyPI downloads. The malicious releases contained a credential stealer designed to collect cloud and developer secrets. They retained the legitimate \u003ccode\u003eagent-framework-core\u003c/code\u003e 1.26.0 dependency, allowing the framework to continue working while the malicious activity ran in the background.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executed automatically during normal Python startup through \u003ccode\u003e.pth\u003c/code\u003e files, including in environments where Agent Framework was not imported. Version 1.26.1 used \u003ccode\u003eagent_framework_meta.pth\u003c/code\u003e to execute code in \u003ccode\u003eagent_framework_meta/_telemetry.py\u003c/code\u003e, while version 1.26.2 used \u003ccode\u003eaf_runtime_diag.pth\u003c/code\u003e and \u003ccode\u003eaf_runtime_diag.py\u003c/code\u003e. The stealer sought secrets in environment variables, local configuration files, and accessible running processes, targeting services including Azure, AWS, GitHub, Docker, Hugging Face, and OpenAI. It also attempted to obtain Azure managed identity tokens, Azure DevOps OIDC tokens, and, in version 1.26.2, GitHub Actions OIDC tokens and data from GitHub runner directories.\u003c/p\u003e\n\n\u003cp\u003eBoth releases sent collected data to the same attacker-controlled webhook endpoint. PyPI quarantined the first release, but another malicious version was uploaded about 2.5 minutes later and was quarantined roughly eight minutes afterward; how the attacker obtained publishing access remains unclear. Developers who installed either version should isolate affected environments, avoid running Python or pip until they are secured, rebuild from a known-clean environment with version 1.26.0, and rotate credentials that may have been exposed. Investigators are advised to search egress logs for the specified webhook path and determine whether attempted transfers were blocked or completed.\u003c/p\u003e\n"},{"n":23,"title":"F5 Warns 6 Critical BIG-IP Flaws Can Crash Traffic in Specific Setups, May Allow RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/f5-warns-6-critical-big-ip-flaws-can.html","time":"18:15","priority":"MUST READ","score":92,"tldr":"F5 disclosed six critical BIG-IP flaws that can let unauthenticated attackers crash traffic-processing services—and may permit remote code execution—when affected iRules or APM policy configurations are present. Organizations should obtain and deploy F5 engineering hotfixes, as no general workaround is available.","briefOverview":"\u003cp\u003eF5 disclosed six critical vulnerabilities in BIG-IP that can allow an unauthenticated attacker to crash the Traffic Management Microkernel (TMM), interrupting traffic until the service restarts. F5 says the flaws may also enable remote code execution, though none of its advisories reports active exploitation. All six are rated 9.8 under CVSS v3.1 and are stack-based buffer overflows in BIG-IP\u0026rsquo;s traffic-processing data plane.\u003c/p\u003e\n\n\u003cp\u003eThe issues require specific virtual-server configurations, including particular iRule commands or an APM per-request policy containing Client Information and Endpoint Security agents. Affected offerings include BIG-IP modules, BIG-IP APM, PEM, DNS, BIG-IP Next for Kubernetes, and, for certain flaws, BIG-IP Cloud-Native Edition. F5 has released engineering hotfixes as the only fix for the critical issues and provides no workaround until those hotfixes are installed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 disclosed six critical BIG-IP flaws, each rated 9.8 under CVSS v3.1, that can allow unauthenticated attackers to crash the Traffic Management Microkernel (TMM) in specific virtual-server configurations.","F5 said the six stack-based buffer overflows in the BIG-IP data plane may also allow remote code execution, although its advisories do not report exploitation of these flaws.","Five flaws require particular iRule commands and one requires an APM per-request policy containing both Client Information and Endpoint Security agents.","Affected products include BIG-IP modules, BIG-IP APM, BIG-IP PEM, BIG-IP DNS, BIG-IP Next for Kubernetes, and, for certain flaws, BIG-IP Cloud-Native Edition (CNF).","F5 provides engineering hotfixes as the only fix for the six critical flaws and lists no workaround until those hotfixes are installed."],"insights":["Exposure to the six critical flaws is configuration-dependent: each requires a particular traffic rule or access-policy setup on a virtual server, rather than affecting every BIG-IP deployment by default.","The only available remediation is an engineering hotfix, which F5 says does not receive the extensive quality testing of normal scheduled releases and carries no warranty or assurance that it will work.","Organizations running unsupported BIG-IP versions cannot assume they are unaffected, because F5 only evaluated releases that remain within technical support.","F5's advisory and the CVE record disagree on whether BIG-IP CNF is affected by CVE-2026-120722, with the advisory listing CNF as not vulnerable while the updated CVE record lists it as affected.","One additional lower-rated iControl SOAP flaw can permit a network-connected user with only the Guest role to issue unauthorized management requests that may run system commands, modify files, or disable services."],"referencedReports":[{"title":"F5 Security Notification K000164058","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"f5","context":"F5's security notification lists the 22 advisories the company published, including the BIG-IP issues covered by the article.","category":"advisory","primary":true},{"title":"iControl SOAP Advisory K000163936","url":"https://my.f5.com/manage/s/article/K000163936","publisher":"f5","context":"The article references this advisory for mitigation guidance to restrict iControl SOAP access to trusted networks until CVE-2026-125274 is patched.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 disclosed six critical vulnerabilities in BIG-IP that can allow an unauthenticated attacker to crash the Traffic Management Microkernel (TMM), interrupting traffic until the service restarts. F5 says the flaws may also enable remote code execution, though none of its advisories reports active exploitation. All six are rated 9.8 under CVSS v3.1 and are stack-based buffer overflows in BIG-IP\u0026rsquo;s traffic-processing data plane.\u003c/p\u003e\n\n\u003cp\u003eThe issues require specific virtual-server configurations, including particular iRule commands or an APM per-request policy containing Client Information and Endpoint Security agents. Affected offerings include BIG-IP modules, BIG-IP APM, PEM, DNS, BIG-IP Next for Kubernetes, and, for certain flaws, BIG-IP Cloud-Native Edition. F5 has released engineering hotfixes as the only fix for the critical issues and provides no workaround until those hotfixes are installed.\u003c/p\u003e\n"},{"n":28,"title":"OpenJDK Base64 Decoder Critical Memory Corruption ( CVE-2026-114938 )","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/openjdk-base64-decoder-critical-memory-corruption-cve-2026-114938/","time":"18:34","priority":"MUST READ","score":92,"tldr":"CVE-2026-114938 (Java4Shell) is a high-severity OpenJDK Base64 decoder memory-corruption flaw that can potentially enable unauthenticated remote code execution on susceptible x86-64 systems with AVX-512 VBMI. Organizations should promptly patch affected JDK 17, 21, 25, and 27 deployments or temporarily disable Base64 intrinsics/AVX-512 if patching is delayed.","briefOverview":"\u003cp\u003eCVE-2026-114938, nicknamed Java4Shell, is a critical memory-corruption flaw in OpenJDK’s optimized Base64 decoder. On compatible x86-64 systems with AVX-512 VBMI support, attacker-controlled Base64 input can cause the decoder to write beyond its allocated memory before Java rejects malformed input. Oracle assigned the issue a CVSS 3.1 score of 8.1 and described exploitation as difficult, while Calif Research assigned a CVSS 4.0 score of 9.2. Researchers demonstrated pre-authentication remote code execution against default installations of Keycloak, Jira, Confluence, Jenkins, Artifactory, and PingFederate.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects OpenJDK release lines 17, 21, 25, and 27, including several distributions built from OpenJDK, while ARM64, standard Java 8, Java 11, and Java 17.0.0 through 17.0.5 are not affected according to the article. Successful exploitation depends on the Java version, processor capabilities, and whether an application passes untrusted Base64 data to the vulnerable decoder. Oracle and OpenJDK released fixes on November 17, 2026, and organizations are advised to update affected Java runtimes, including bundled runtimes in containers and appliances. If patching is delayed, the article recommends temporarily disabling Base64 hardware acceleration with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e or disabling AVX-512 on x86-64 with \u003ccode\u003e-XX:UseAVX=2\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-114938, also called Java4Shell, is a heap-based buffer overflow in OpenJDK’s optimized Base64 decoder that can corrupt JVM memory when specially crafted input ending in padding characters is processed.","The issue affects compatible x86-64 systems with AVX-512 VBMI support and is not reported to affect ARM64 systems, standard Java 8, Java 11, or Java 17.0.0 through 17.0.5.","Oracle and OpenJDK released fixes on November 17, 2026, and Oracle assigned the flaw a CVSS 3.1 score of 8.1 with network access, no privileges, and no user interaction required.","Researchers demonstrated pre-authentication remote code execution against default installations of Keycloak, Jira, Confluence, Jenkins, Artifactory, and PingFederate.","If patching is delayed, the article recommends temporarily disabling Base64 hardware acceleration with -XX:-UseBASE64Intrinsics or disabling AVX-512 on x86-64 systems with -XX:UseAVX=2."],"insights":["Malformed Base64 input may still corrupt memory before Java rejects it, because the vulnerable decoder can write a full 64-byte block beyond its allocated output buffer.","External exposure scanning may not be sufficient to determine risk because both the precise Java runtime and the host processor’s capabilities may not be visible externally.","Having the required Linux CPU flags—avx512f, avx512bw, avx512vbmi, and bmi2—does not by itself establish that an application is exploitable; the application must also decode untrusted Base64 data through an affected JDK.","A public proof of concept reproduces the memory corruption, but the article reports no known exploitation in the wild and no CISA KEV listing as of November 18, 2026."],"referencedReports":[{"title":"Oracle Critical Patch Update Advisory — November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"Oracle","context":"The article cites Oracle’s November 2026 advisory for affected Oracle Java SE and GraalVM versions and patch guidance.","category":"advisory","primary":true},{"title":"OpenJDK Vulnerability Advisory — 2026-11-17","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"OpenJDK","context":"The article cites the OpenJDK advisory identifying CVE-2026-114938 as a HotSpot Compiler vulnerability affecting JDK release lines 17, 21, 25, and 27.","category":"advisory","primary":true},{"title":"Java4Shell technical write-up","url":"https://calif.io/java4shell","publisher":"Calif Research","context":"The article references Calif Research’s disclosure for technical details, its CVSS 4.0 assessment, affected OpenJDK versions, and reported proof-of-concept results.","category":"research","primary":true},{"title":"Red Hat CVE-2026-114938 Security Advisory","url":"https://access.redhat.com/security/vulnerabilities/RHSB-2026-018","publisher":"Red Hat","context":"The article lists Red Hat’s security advisory as an additional resource for CVE-2026-114938.","category":"advisory","primary":false}],"body":"\u003cp\u003eCVE-2026-114938, nicknamed Java4Shell, is a critical memory-corruption flaw in OpenJDK’s optimized Base64 decoder. On compatible x86-64 systems with AVX-512 VBMI support, attacker-controlled Base64 input can cause the decoder to write beyond its allocated memory before Java rejects malformed input. Oracle assigned the issue a CVSS 3.1 score of 8.1 and described exploitation as difficult, while Calif Research assigned a CVSS 4.0 score of 9.2. Researchers demonstrated pre-authentication remote code execution against default installations of Keycloak, Jira, Confluence, Jenkins, Artifactory, and PingFederate.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects OpenJDK release lines 17, 21, 25, and 27, including several distributions built from OpenJDK, while ARM64, standard Java 8, Java 11, and Java 17.0.0 through 17.0.5 are not affected according to the article. Successful exploitation depends on the Java version, processor capabilities, and whether an application passes untrusted Base64 data to the vulnerable decoder. Oracle and OpenJDK released fixes on November 17, 2026, and organizations are advised to update affected Java runtimes, including bundled runtimes in containers and appliances. If patching is delayed, the article recommends temporarily disabling Base64 hardware acceleration with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e or disabling AVX-512 on x86-64 with \u003ccode\u003e-XX:UseAVX=2\u003c/code\u003e.\u003c/p\u003e\n"},{"n":36,"title":"Java4Shell (CVE-2026-114938): Who’s Exposed and How to Fix It","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/java4shell-cve-2026-114938-bug/","time":"13:06","priority":"MUST READ","score":90,"tldr":"Java4Shell (CVE-2026-114938) is an urgent OpenJDK Base64-decoder heap overflow that can enable pre-authentication crashes and potentially code execution, but only on vulnerable Java builds running on x86-64 CPUs with AVX-512 VBMI. Patch to the November 2026 fixed releases immediately, or temporarily disable Base64 intrinsics with -XX:-UseBASE64Intrinsics.","briefOverview":"\u003cp\u003eJava4Shell, tracked as CVE-2026-114938, is a heap overflow in Java’s hardware-accelerated Base64 decoder. Researchers at Calif reported that it can enable unauthenticated code execution in applications including Jira, Jenkins, Keycloak, Confluence, Artifactory, and PingFederate under default settings. Oracle and the OpenJDK project released fixes on November 17, 2026, while CISA urged organizations to patch immediately. As of November 18, 2026, the article reports no known exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eA system is exposed only if it uses an affected Java build, runs on an x86-64 processor supporting AVX-512 VBMI, and processes attacker-controlled malformed Base64 through Java’s standard decoder. The affected fast-processing routine can write 62 or 63 bytes past an output buffer when Base64 data ends with an unexpected equals sign, before Java rejects the malformed input. Independent testing reproduced crashes and memory reads, while Calif demonstrated code execution, although reliable exploitation requires target-specific work. Organizations should install fixed Java releases and restart affected services; if patching is delayed, they can disable the vulnerable Base64 optimization with the \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e JVM option.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Java4Shell (CVE-2026-114938) is a heap overflow in Java’s hardware-accelerated Base64 decoder that can cause a JVM crash and has been demonstrated for code execution in certain Java applications.","Exposure requires a vulnerable Java build, an x86-64 processor with AVX-512 VBMI support, and a reachable path through Java’s standard Base64 decoder.","The article reports demonstrated pre-authentication code execution under default settings in Keycloak, Jira, Confluence, Artifactory, Jenkins, and PingFederate, while other listed products require a login.","Oracle and OpenJDK released fixes on November 17, 2026, and organizations can temporarily disable the vulnerable path with the JVM option -XX:-UseBASE64Intrinsics if they cannot patch immediately.","As of November 18, 2026, the article states that no exploitation in the wild had been reported, although independent labs reproduced memory corruption, crashes, and memory reads."],"insights":["A single container image can be vulnerable on one host and unaffected on another because exposure depends on the host processor’s AVX-512 VBMI support as well as the Java version.","Java rejects the malformed Base64 input only after the decoder has already written past the allocated memory, so validation performed inside an application cannot prevent the underlying write.","Products that include their own Java runtime require an update from the product vendor; updating only the system-wide Java installation may leave them exposed.","A failed exploitation attempt commonly crashes the Java process, meaning even unsuccessful attempts can cause service outages and can often be retried.","The article warns that using -XX:DisableIntrinsic=_base64_decodeBlock alone prevents Java from starting, while -XX:-UseBASE64Intrinsics is the recommended temporary workaround."],"referencedReports":[{"title":"Critical Java Vulnerability Requires Immediate Patching","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/critical-java-vulnerability-requires-immediate-patching","publisher":"cisa","context":"The article cites CISA's alert urging organizations to patch the vulnerability immediately.","category":"advisory","primary":false},{"title":"Critical Security Patch Update Advisory, November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article cites Oracle's patch advisory for the fixed Java releases.","category":"advisory","primary":true},{"title":"Vulnerability advisory, Nov. 17, 2026","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"openjdk","context":"The article cites OpenJDK's vulnerability advisory covering the flaw and its fixes.","category":"advisory","primary":true},{"title":"Java4Shell technical write-up","url":"https://calif.io/java4shell","publisher":"calif","context":"The article relies on Calif's technical write-up for the disclosure details and demonstrations of code execution against affected applications.","category":"research","primary":true},{"title":"CVE-2026-114938 OpenJDK RCE (Java4Shell): Everything You Need to Know","url":"https://www.wiz.io/blog/cve-2026-114938-rce-java4shell-openjdk","publisher":"wiz","context":"The article references Wiz's technical analysis for an example malformed Base64 input that triggers the overflow.","category":"research","primary":false},{"title":"Java4Shell test results","url":"https://blackpointcyber.com/blog/java4shell-cve-2026-114938-java-base64-decoder-flaw/","publisher":"blackpoint-cyber","context":"The article cites Blackpoint Cyber's testing, which reproduced crashes and memory reads but not remote code execution.","category":"research","primary":false},{"title":"Java4Shell: what we know now and what comes next","url":"https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next","publisher":"upwind","context":"The article cites Upwind's analysis, including its reproduction of memory corruption and warning about an unsafe JVM workaround.","category":"research","primary":false},{"title":"AL26-029: Critical vulnerability impacting Oracle Java","url":"https://www.cyber.gc.ca/en/alerts-advisories/al26-029-critical-vulnerability-impacting-oracle-java-cve-2026-114938","publisher":"canadian-centre-for-cyber-security","context":"The article cites the Canadian Centre for Cyber Security advisory stating it was not aware of exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eJava4Shell, tracked as CVE-2026-114938, is a heap overflow in Java’s hardware-accelerated Base64 decoder. Researchers at Calif reported that it can enable unauthenticated code execution in applications including Jira, Jenkins, Keycloak, Confluence, Artifactory, and PingFederate under default settings. Oracle and the OpenJDK project released fixes on November 17, 2026, while CISA urged organizations to patch immediately. As of November 18, 2026, the article reports no known exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eA system is exposed only if it uses an affected Java build, runs on an x86-64 processor supporting AVX-512 VBMI, and processes attacker-controlled malformed Base64 through Java’s standard decoder. The affected fast-processing routine can write 62 or 63 bytes past an output buffer when Base64 data ends with an unexpected equals sign, before Java rejects the malformed input. Independent testing reproduced crashes and memory reads, while Calif demonstrated code execution, although reliable exploitation requires target-specific work. Organizations should install fixed Java releases and restart affected services; if patching is delayed, they can disable the vulnerable Base64 optimization with the \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e JVM option.\u003c/p\u003e\n"},{"n":45,"title":"nginx2root: A simple test for the HTTP/2 flaw and three use-after-free reproductions","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/nginx2root-a-simple-test-for-the-http-2-flaw-and-three-use-after-free-reproductions/","time":"23:18","priority":"SHOULD READ","score":89,"tldr":"Censys confirmed several nginx2root memory-safety flaws in lab testing, including an HTTP/2 flow-control issue and three use-after-free conditions, though it did not reproduce RCE. Organizations should promptly upgrade nginx to 1.30.7+ or 1.31.9+ (or the corresponding NGINX Plus releases), as disabling HTTP/2 mitigates only some affected paths.","briefOverview":"\u003cp\u003eCensys ARC tested the five disclosed nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in vulnerable nginx 1.31.8. Its compact cleartext HTTP/2 test produced different results on vulnerable 1.31.8 and patched 1.31.9, with the patched version rejecting the sequence. Censys also reproduced use-after-free memory conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810 or achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities require particular nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication. Disabling HTTP/2 addresses only two of the five CVEs, so the article recommends upgrading nginx Open Source to 1.30.7 or later or 1.31.9 or later, updating NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restarting the service. Network detection is limited because the relevant HTTP/2 control frames are hidden by TLS encryption, and the article advises combining any network indicators with server logs, package versions, and active configuration details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys tested five nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in nginx 1.31.8 that nginx 1.31.9 rejected.","Researchers reproduced use-after-free conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810.","The CVEs require different nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication.","Organizations should upgrade nginx Open Source to 1.30.7 or later or 1.31.9 or later, or update NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restart the service afterward.","Disabling HTTP/2 addresses only two of the five CVEs, and Censys reported no known in-the-wild exploitation as of November 18, 2026."],"insights":["A 5.69 MB cleartext HTTP/2 test distinguished vulnerable nginx 1.31.8 from patched 1.31.9, offering a much smaller patch-validation option than the 60–119 GiB traffic volume reported for later Rapid7 exploit stages.","Network signatures require decrypted HTTP/2 telemetry or cleartext HTTP/2 because TLS hides the relevant control frames, while high traffic volume, resets, and worker disconnects alone are not specific indicators.","The tested Suricata rule fired once on the vulnerable capture and zero times on the patched comparison capture, but the article cautions that this validates only that traffic pair rather than making it a general exploit detector.","A configuration reload does not replace nginx binaries already running in memory, so organizations must fully restart nginx after applying updates.","Version checks alone cannot establish exposure because each CVE depends on specific enabled features such as proxying, runtime DNS resolution with subrequests, or mail proxy authentication."],"referencedReports":[{"title":"NGINX2Root: New Remote Code Execution Vulnerabilities in nginx Require Urgent Patching","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article cites Xint's disclosure of five nginx vulnerabilities and its claim that they can enable unauthenticated command execution.","category":"research","primary":true},{"title":"CVE-2026-123007: Critical nginx HTTP/2 Integer Underflow Leads to RCE (FIXED)","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"rapid7","context":"The article references Rapid7's report for the large traffic volume associated with later crash and remote-code-execution stages.","category":"research","primary":false}],"body":"\u003cp\u003eCensys ARC tested the five disclosed nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in vulnerable nginx 1.31.8. Its compact cleartext HTTP/2 test produced different results on vulnerable 1.31.8 and patched 1.31.9, with the patched version rejecting the sequence. Censys also reproduced use-after-free memory conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810 or achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities require particular nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication. Disabling HTTP/2 addresses only two of the five CVEs, so the article recommends upgrading nginx Open Source to 1.30.7 or later or 1.31.9 or later, updating NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restarting the service. Network detection is limited because the relevant HTTP/2 control frames are hidden by TLS encryption, and the article advises combining any network indicators with server logs, package versions, and active configuration details.\u003c/p\u003e\n"},{"n":1,"title":"Apache warns of Roller RCE vulnerability exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/apache-warns-of-roller-rce-vulnerability-exploited-in-attacks/","time":"10:35","priority":"SHOULD READ","score":88,"tldr":"Apache warns that attackers are actively exploiting CVE-2026-129448, a critical unauthenticated deserialization flaw in Apache Roller that enables remote code execution. Organizations should upgrade to Roller 6.1.6 or later immediately, or apply the documented XML-RPC mitigations.","briefOverview":"\u003cp\u003eApache has released security updates for CVE-2026-129448, a critical flaw in Apache Roller that the organization says is being actively exploited. Apache Roller is an open-source, Java-based group-blogging server. Apache has not disclosed who is conducting the attacks or how many servers have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Roller versions 4.0.0 through 6.1.4 and can allow an unauthenticated remote attacker to execute arbitrary code. Roller’s XML-RPC endpoint accepts vendor extension types and processes them before authenticating the requester. Apache recommends upgrading to Roller 6.1.6 or later; organizations unable to update can apply configuration changes that disable extensions and remove the XML-RPC servlet mapping, then restart Roller.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apache has released security updates for CVE-2026-129448, a critical Apache Roller flaw that is being actively exploited in attacks.","The flaw affects Apache Roller versions 4.0.0 through 6.1.4 and allows an unauthenticated remote attacker to run arbitrary code because the XML-RPC endpoint processes certain data before verifying the requester.","Apache recommends upgrading immediately to Apache Roller 6.1.6 or later, which disables the affected extension types and rejects malicious XML-RPC requests.","Organizations unable to upgrade immediately can mitigate the issue by disabling extensions, removing the XML-RPC servlet mapping, and restarting Roller.","Disabling XML-RPC through Roller’s administration interface alone does not prevent attacks because vulnerable versions process the request before checking that setting."],"insights":["Turning off XML-RPC in Roller’s administration interface is insufficient because vulnerable versions deserialize XML-RPC requests before checking whether the feature is enabled.","The issue was previously tracked as CVE-2026-82384, which identified only Roller 6.1.5 as affected, while the updated advisory identifies versions 4.0.0 through 6.1.4.","For organizations that cannot upgrade immediately, Apache’s workaround requires configuration and servlet-mapping changes followed by a Roller restart.","Apache has not disclosed who is behind the ongoing attacks or how many Roller servers have been compromised."],"referencedReports":[{"title":"Apache Roller CVE-2026-129448 Security Advisory","url":"https://lists.apache.org/thread/lnz4s26tv6hdo03wngtdbpfj4hg4gtds","publisher":"Apache Software Foundation","context":"The article cites Apache's Tuesday security advisory describing the actively exploited unauthenticated remote code execution flaw in Apache Roller.","category":"advisory","primary":true}],"body":"\u003cp\u003eApache has released security updates for CVE-2026-129448, a critical flaw in Apache Roller that the organization says is being actively exploited. Apache Roller is an open-source, Java-based group-blogging server. Apache has not disclosed who is conducting the attacks or how many servers have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Roller versions 4.0.0 through 6.1.4 and can allow an unauthenticated remote attacker to execute arbitrary code. Roller’s XML-RPC endpoint accepts vendor extension types and processes them before authenticating the requester. Apache recommends upgrading to Roller 6.1.6 or later; organizations unable to update can apply configuration changes that disable extensions and remove the XML-RPC servlet mapping, then restart Roller.\u003c/p\u003e\n"},{"n":18,"title":"Russian COLD RELIC Hackers Use Stolen Google Workspace Data to Breach Second U.S. Organization","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/russian-cold-relic-hackers-use-stolen.html","time":"05:58","priority":"SHOULD READ","score":88,"tldr":"Russia-linked Cold Relic used data and identities stolen from one U.S. organization's Google Workspace tenant to convincingly impersonate employees and breach a second U.S. organization. The campaign relied on MFA fatigue, attacker-enrolled MFA devices and passkeys, and credential/token phishing to maintain access and steal cloud data.","briefOverview":"\u003cp\u003eRussia-linked Cold Relic, also known as COLDRIVER and UNC4057, used information stolen during a late-2025 compromise of one U.S. organization to breach a second U.S. organization in 2026. Google said the group harvested corporate data, employee-directory information, and identities from the first victim, then impersonated employees to create credible phishing pretexts against people in the same professional network. The activity illustrates how access to one organization’s cloud environment can be used to target trusted partners and contacts.\u003c/p\u003e\n\n\u003cp\u003eAt the first organization, Cold Relic used stolen Super Admin credentials and MFA push-notification fatigue to gain access after a victim accepted an MFA request. The attackers registered their own device, passkeys, and MFA backup codes for persistence, downloaded cloud-storage data, exported employee lists and domain-wide data through Google Takeout, and modified or deleted security alerts. To compromise the second organization, which used Microsoft Entra ID for single sign-on to Google Workspace, the group sent phishing links through a secure messaging app to steal Entra ID credentials and authentication tokens, registered a new MFA device, and downloaded files accessible to the compromised user.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google reported that Russia-linked Cold Relic used information stolen from a U.S. organization compromised in late 2025 to breach a second U.S. organization in 2026.","The group gained access to the first organization’s Google Workspace environment using stolen Super Admin credentials and an MFA push-notification fatigue attack after the victim accepted a request.","Cold Relic registered attacker-controlled devices, passkeys, and MFA backup codes to retain access, then downloaded organization-wide cloud-storage data and employee lists.","The attackers accessed administrative logs and altered or deleted Alert Center notifications in the first victim’s Google Workspace tenant.","Cold Relic impersonated an employee from the first organization to send phishing links to a user at the second organization, stealing Microsoft Entra ID credentials and authentication tokens before downloading accessible cloud-drive files."],"insights":["Attacker-enrolled passkeys remained usable even after password and session resets, allowing Cold Relic to bypass device-registration controls and regain access.","A compromised Super Admin account enabled organization-wide data collection through Google Takeout, mass file sharing, and direct downloads rather than limiting theft to a single user’s files.","Cold Relic checked administrative security and email audit logs, then modified or deleted alerts, showing that the group actively tried to measure and reduce evidence of its intrusion.","Information taken from the first victim, including employee identities and communications, made impersonation of a known professional contact more credible when phishing the second victim.","After compromising the second organization, the messaging account used for the initial contact was renamed to a different persona, which Google said was likely intended for targeting additional organizations in the same professional network."],"referencedReports":[{"title":"Cold Relic: A Case Study in Impersonation and Compromise","url":"https://cloud.google.com/blog/topics/threat-intelligence/cold-relic-a-case-study-in-impersonation-and-compromise","publisher":"google-cloud","context":"The article relies on Google’s account of Cold Relic compromising one U.S. organization and using stolen data to target a second.","category":"research","primary":true}],"body":"\u003cp\u003eRussia-linked Cold Relic, also known as COLDRIVER and UNC4057, used information stolen during a late-2025 compromise of one U.S. organization to breach a second U.S. organization in 2026. Google said the group harvested corporate data, employee-directory information, and identities from the first victim, then impersonated employees to create credible phishing pretexts against people in the same professional network. The activity illustrates how access to one organization’s cloud environment can be used to target trusted partners and contacts.\u003c/p\u003e\n\n\u003cp\u003eAt the first organization, Cold Relic used stolen Super Admin credentials and MFA push-notification fatigue to gain access after a victim accepted an MFA request. The attackers registered their own device, passkeys, and MFA backup codes for persistence, downloaded cloud-storage data, exported employee lists and domain-wide data through Google Takeout, and modified or deleted security alerts. To compromise the second organization, which used Microsoft Entra ID for single sign-on to Google Workspace, the group sent phishing links through a secure messaging app to steal Entra ID credentials and authentication tokens, registered a new MFA device, and downloaded files accessible to the compromised user.\u003c/p\u003e\n"},{"n":21,"title":"CISA Urges Immediate Patching of Java4Shell Flaw That Could Allow Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-urges-immediate-patching-of.html","time":"08:24","priority":"SHOULD READ","score":88,"tldr":"CISA is urging organizations to immediately patch Java4Shell (CVE-2026-114938), a critical out-of-bounds write flaw in the HotSpot JVM Base64 decoder that could enable unauthenticated remote code execution or denial of service. Organizations should inventory Java runtimes—including bundled and containerized installations—and apply Oracle, OpenJDK, and vendor patches.","briefOverview":"\u003cp\u003eCISA has urged organizations to immediately patch Java4Shell, a critical Oracle Java flaw tracked as CVE-2026-114938 and rated 8.1 on the CVSS scale. The issue is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot Java Virtual Machine, part of the Java Development Kit. Specially crafted Base64 input could crash the JVM or, in certain conditions, enable unauthenticated remote code execution. Oracle and OpenJDK have released patches, and the article states there is no evidence of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eUnder default settings, the flaw can reportedly allow attackers without accounts to execute arbitrary code on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate. Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker are also listed as affected where an attacker has a login. Blackpoint Cyber reported that about 28,000 unauthenticated requests with malformed Base64 authentication values caused a local Spring Boot application’s JVM to terminate after roughly 20 seconds, while additional testing showed nearby Java-object corruption and changes to live application data without an immediate crash.\u003c/p\u003e\n\n\u003cp\u003eCISA recommends identifying all affected Java installations, including runtimes bundled with third-party applications, container images, and appliances, and applying Java and vendor patches as soon as possible. Where patching cannot happen immediately, CISA advises restricting and validating Base64 input at the application boundary, enforcing input-size limits, and limiting unauthenticated access. Numerous security and software vendors have also published advisories or analyses of the flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA urged organizations to immediately patch Java4Shell, tracked as CVE-2026-114938, a critical Oracle Java flaw with a CVSS score of 8.1.","The flaw is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot JVM that can cause a denial of service or, under certain conditions, unauthenticated remote code execution.","Oracle and OpenJDK have released patches, and the article states that there is no evidence of exploitation in the wild as of publication.","Under default settings, the flaw can allow unauthenticated code execution on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate.","CISA recommends identifying all affected Java installations, including Java bundled with third-party applications, container images, and appliances, and applying available Java and vendor patches promptly."],"insights":["The practical risk differs by application: the article says attackers can run code without an account on several products under default settings, while Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker require a login.","Blackpoint Cyber reported that roughly 28,000 unauthenticated requests containing malformed Base64 authentication data terminated a local Spring Boot application's Java process after about 20 seconds of sustained traffic.","Testing cited in the article found that the flaw could corrupt nearby Java objects and alter live application data without immediately crashing the affected application.","Organizations may overlook affected systems because Java runtimes can be bundled inside third-party applications, container images, and appliances rather than installed separately."],"referencedReports":[{"title":"Critical Java Vulnerability Requires Immediate Patching","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/critical-java-vulnerability-requires-immediate-patching","publisher":"cisa","context":"CISA issued an alert urging organizations to promptly patch the Java4Shell flaw and use compensating controls if patching is delayed.","category":"advisory","primary":true},{"title":"Oracle Critical Security Patch Update, November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article states that Oracle released patches for CVE-2026-114938.","category":"advisory","primary":true},{"title":"OpenJDK CVE-2026-114938 Advisory","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"openjdk","context":"The article states that OpenJDK released patches and an advisory for the Java4Shell flaw.","category":"advisory","primary":true},{"title":"Java 17 RCE Vulnerability: CVE-2026-114938","url":"https://www.aikido.dev/blog/java-17-rce-vulnerability-cve-2026-114938","publisher":"aikido","context":"The article lists Aikido among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938","url":"https://explore.alas.aws.amazon.com/CVE-2026-114938.html","publisher":"amazon-linux","context":"The article lists Amazon Linux among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: CVE-2026-114938 Java Base64 Decoder Flaw","url":"https://blackpointcyber.com/blog/java4shell-cve-2026-114938-java-base64-decoder-flaw/","publisher":"blackpoint-cyber","context":"The article cites Blackpoint Cyber testing showing malformed Base64 authentication requests could terminate a Spring Boot application's JVM and corrupt nearby objects.","category":"research","primary":false},{"title":"Java4Shell: How a Malformed Base64 String Breaks the JVM on AVX-512","url":"https://www.chainguard.dev/unchained/java4shell-how-a-malformed-base64-string-breaks-the-jvm-on-avx-512","publisher":"chainguard","context":"The article lists Chainguard among vendors that published analysis or an advisory for the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://blog.talosintelligence.com/java4shell/","publisher":"cisco-talos","context":"The article lists Cisco Talos among entities that released an advisory or analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://cycode.com/blog/java4shell-cve-2026-114938/","publisher":"cycode","context":"The article lists Cycode among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: Remote Code Execution in OpenJDK CVE-2026-114938","url":"https://securitylabs.datadoghq.com/articles/java4shell-remote-code-execution-in-openjdk-cve-2026-114938/","publisher":"datadog","context":"The article lists Datadog among entities that published technical analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell: Unauthenticated RCE Reported in OpenJDK 17 CVE-2026-114938","url":"https://www.endorlabs.com/learn/java4shell-unauthenticated-rce-reported-in-openjdk-17-cve-2026-114938","publisher":"endor-labs","context":"The article lists Endor Labs among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Oracle Critical Security Patch Update Java 17 RCE Claims","url":"https://hadrian.io/vulnerability-alerts/oracle-critical-security-patch-update-java-17-rce-claims","publisher":"hadrian","context":"The article lists Hadrian among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938","url":"https://horizon3.ai/attack-research/vulnerabilities/cve-2026-114938/","publisher":"horizon3-ai","context":"The article lists Horizon3.ai among entities that released technical vulnerability research.","category":"research","primary":false},{"title":"Java4Shell","url":"https://www.miggo.io/post/java4shell","publisher":"miggo","context":"The article lists Miggo among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: Critical OpenJDK Base64 Decoder Flaw Could Allow Unauthenticated Remote Code Execution","url":"https://orca.security/resources/research/java4shell-critical-openjdk-base64-decoder-flaw-could-allow-unauthenticated-remote-code-execution/","publisher":"orca-security","context":"The article lists Orca Security among entities that published research on the flaw.","category":"research","primary":false},{"title":"How to Find, Mitigate, and Patch the Critical Java4Shell Flaw CVE-2026-114938","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/11/17/how-to-find-mitigate-and-patch-the-critical-java4shell-flaw-cve-2026-114938-now","publisher":"qualys","context":"The article lists Qualys among vendors that published guidance and an advisory for the flaw.","category":"guide","primary":false},{"title":"CVE-2026-114938: Reported Critical Pre-Authentication Remote Code Execution in Java 17","url":"https://www.rapid7.com/blog/post/etr-cve-2026-114938-reported-critical-pre-authentication-remote-code-execution-java-17/","publisher":"rapid7","context":"The article lists Rapid7 among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"RHSB-2026-018","url":"https://access.redhat.com/security/vulnerabilities/RHSB-2026-018","publisher":"red-hat","context":"The article lists Red Hat among vendors that released an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell Vulnerability in OpenJDK Enables RCE on AVX-512 CPUs","url":"https://www.sentinelone.com/blog/java4shell-vulnerability-in-openjdk-enables-rce-on-avx-512-cpus/","publisher":"sentinelone","context":"The article lists SentinelOne among entities that published analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell Could Allow Remote Code Execution","url":"https://www.sophos.com/en-us/blog/java4shell-could-allow-remote-code-execution","publisher":"sophos","context":"The article lists Sophos among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell CVE-2026-114938: Find Every Java Runtime","url":"https://www.tanium.com/blog/java4shell-cve-2026-114938-find-every-java-runtime","publisher":"tanium","context":"The article lists Tanium among vendors that published guidance related to the flaw.","category":"guide","primary":false},{"title":"CVE-2026-114938 Frequently Asked Questions About OpenJDK RCE Vulnerability","url":"https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability","publisher":"tenable","context":"The article lists Tenable among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: What We Know Now and What Comes Next","url":"https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next","publisher":"upwind","context":"The article lists Upwind among vendors that published analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://www.vulncheck.com/blog/java4shell","publisher":"vulncheck","context":"The article lists VulnCheck among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell CVE-2026-114938 FAQ","url":"https://watchtowr.com/intelligence/java4shell-cve-2026-114938-faq/","publisher":"watchtowr","context":"The article lists watchTowr among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938 RCE Java4Shell OpenJDK","url":"https://www.wiz.io/blog/cve-2026-114938-rce-java4shell-openjdk","publisher":"wiz","context":"The article lists Wiz among vendors that published analysis or an advisory for the flaw.","category":"research","primary":false}],"body":"\u003cp\u003eCISA has urged organizations to immediately patch Java4Shell, a critical Oracle Java flaw tracked as CVE-2026-114938 and rated 8.1 on the CVSS scale. The issue is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot Java Virtual Machine, part of the Java Development Kit. Specially crafted Base64 input could crash the JVM or, in certain conditions, enable unauthenticated remote code execution. Oracle and OpenJDK have released patches, and the article states there is no evidence of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eUnder default settings, the flaw can reportedly allow attackers without accounts to execute arbitrary code on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate. Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker are also listed as affected where an attacker has a login. Blackpoint Cyber reported that about 28,000 unauthenticated requests with malformed Base64 authentication values caused a local Spring Boot application’s JVM to terminate after roughly 20 seconds, while additional testing showed nearby Java-object corruption and changes to live application data without an immediate crash.\u003c/p\u003e\n\n\u003cp\u003eCISA recommends identifying all affected Java installations, including runtimes bundled with third-party applications, container images, and appliances, and applying Java and vendor patches as soon as possible. Where patching cannot happen immediately, CISA advises restricting and validating Base64 input at the application boundary, enforcing input-size limits, and limiting unauthenticated access. Numerous security and software vendors have also published advisories or analyses of the flaw.\u003c/p\u003e\n"},{"n":31,"title":"PHP schedules a critical security release for 19 November, including CVE-2026-115560","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/php-security-release-19-november-2026-cve-2026-115560","time":"19:28","priority":"SHOULD READ","score":88,"tldr":"PHP planned critical security releases for all supported versions on 19 November 2026, including a fix for CVE-2026-115560, a session upload-progress RCE vector affecting uncommon runtime session-serialization configurations. Administrators should immediately disable session upload progress, restart PHP workers, check for runtime serialize-handler changes, and upgrade once patches are available.","briefOverview":"\u003cp\u003ePHP said it would release security updates for all supported versions on 19 November 2026 between 14:00 and 14:30 UTC. The PHP security team rated the highest-severity issue in the planned release as critical, while stating that critical issues affect only non-default configurations or uncommon setups. Full CVE details and fixed version numbers were not yet published at the time of the article. One expected issue, CVE-2026-115560, had already been disclosed in an informational advisory.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-115560 is described as a remote code execution vector involving PHP session upload progress. Exposure requires session upload progress to be enabled and an application to use \u003ccode\u003ephp_binary\u003c/code\u003e or \u003ccode\u003ephp_serialize\u003c/code\u003e for \u003ccode\u003esession.serialize_handler\u003c/code\u003e, then change that handler to \u003ccode\u003ephp\u003c/code\u003e with \u003ccode\u003eini_set()\u003c/code\u003e before calling \u003ccode\u003esession_start()\u003c/code\u003e. PHP advised disabling \u003ccode\u003esession.upload_progress.enabled\u003c/code\u003e in a setting that applies before request parsing, restarting PHP workers, and checking code for runtime changes to the session serialization handler. The article also notes that the October PHP2Shell fixes for CVE-2026-109618 and CVE-2026-109619 did not include a fix for CVE-2026-115560.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP planned security releases for all supported versions on 19 November 2026 between 14:00 and 14:30 UTC, and said the highest-severity issue was critical.","CVE-2026-115560 is a remote code execution vector in PHP session upload progress, with its full advisory expected alongside the 19 November releases.","An application is exposed to CVE-2026-115560 only when it uses the php_binary or php_serialize session serialization handler, switches it to php with ini_set() before session_start(), and has session upload progress enabled.","PHP advised administrators to set session.upload_progress.enabled=0 before request parsing, restart PHP workers, and search for runtime code that switches session.serialize_handler to php.","PHP2Shell, comprising CVE-2026-109618 and CVE-2026-109619, was fixed on 21 October in PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35."],"insights":["The recommended mitigation must be applied in php.ini, an FPM pool, or server configuration before PHP parses a request; changing it with ini_set() or an FPM .user.ini file is not effective.","Sites that already disabled session upload progress as mitigation for CVE-2026-109619 can keep that setting in place and, according to PHP, do not need to take further action for this mitigation.","Applications that never change the session serialization handler while running can leave session upload progress enabled, because the known CVE-2026-115560 exposure requires such a runtime change.","The PHP releases issued on 21 October for PHP2Shell did not fix CVE-2026-115560, so updating only to those versions does not address this separate issue."],"referencedReports":[{"title":"PHP informational advisory for CVE-2026-115560","url":"https://www.php.net/archive/2026.php#2026-10-23-1","publisher":"php","context":"The article cites PHP's informational advisory describing CVE-2026-115560 as a remote code execution vector involving session upload progress.","category":"advisory","primary":true},{"title":"PHP October guidance for session.upload_progress.enabled","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php","context":"The article references PHP's guidance to disable session upload progress before request parsing as a mitigation.","category":"advisory","primary":true}],"body":"\u003cp\u003ePHP said it would release security updates for all supported versions on 19 November 2026 between 14:00 and 14:30 UTC. The PHP security team rated the highest-severity issue in the planned release as critical, while stating that critical issues affect only non-default configurations or uncommon setups. Full CVE details and fixed version numbers were not yet published at the time of the article. One expected issue, CVE-2026-115560, had already been disclosed in an informational advisory.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-115560 is described as a remote code execution vector involving PHP session upload progress. Exposure requires session upload progress to be enabled and an application to use \u003ccode\u003ephp_binary\u003c/code\u003e or \u003ccode\u003ephp_serialize\u003c/code\u003e for \u003ccode\u003esession.serialize_handler\u003c/code\u003e, then change that handler to \u003ccode\u003ephp\u003c/code\u003e with \u003ccode\u003eini_set()\u003c/code\u003e before calling \u003ccode\u003esession_start()\u003c/code\u003e. PHP advised disabling \u003ccode\u003esession.upload_progress.enabled\u003c/code\u003e in a setting that applies before request parsing, restarting PHP workers, and checking code for runtime changes to the session serialization handler. The article also notes that the October PHP2Shell fixes for CVE-2026-109618 and CVE-2026-109619 did not include a fix for CVE-2026-115560.\u003c/p\u003e\n"},{"n":32,"title":"Aikido's Deep Review finds Java4Shell in the PR that introduced it","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/deep-review-finds-java4shell-in-pr","time":"19:04","priority":"SHOULD READ","score":88,"tldr":"Aikido says its Deep Review tool would have detected the Java4Shell flaw in the 2021 OpenJDK pull request that introduced it, identifying the integer-underflow path and recommending essentially the same fix later adopted upstream. Organizations running affected AVX-512-capable x86-64 Java systems should upgrade to patched Java releases.","briefOverview":"\u003cp\u003eJava4Shell, tracked as CVE-2026-114938, was publicly disclosed on November 17, 2026 as a critical memory-corruption issue in OpenJDK’s hardware-accelerated Base64 decoder. The article states that the vulnerable code originated in an AVX-512 performance optimization merged into OpenJDK in June 2021. It affects only x86-64 CPUs that support AVX-512 VBMI; ARM systems are not affected. Oracle’s listed fixed releases are 17.0.21.1, 21.0.13.1, 25.0.5.1, and 27.0.1.1.\u003c/p\u003e\n\n\u003cp\u003eAikido reconstructed the original OpenJDK pull request and ran its Deep Review product against it, reporting three high-severity findings. One finding identified the Java4Shell issue: malformed Base64 input with invalid padding could trigger an integer underflow, produce an incorrect output mask, and cause a 64-byte write beyond the allocated destination buffer. The tool recommended falling back to a safer decoder when fewer than four input bytes remain, which the article says is essentially the same as the eventual upstream fix. Deep Review also identified an oversized vectorized write and an incomplete invalid-character check, both of which were subsequently corrected upstream.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Java4Shell (CVE-2026-114938) is a critical memory-corruption flaw in OpenJDK’s hardware-accelerated Base64 decoder that may enable remote code execution on affected systems.","The vulnerable code was introduced by an AVX-512 performance optimization merged into OpenJDK in June 2021 and was publicly disclosed on November 17, 2026.","According to the article, the vulnerable decoding path runs only on x86-64 CPUs supporting AVX-512 VBMI, while ARM systems are not affected.","Aikido recreated the original OpenJDK pull request and says its Deep Review tool identified the Java4Shell integer-underflow bug and proposed essentially the same mitigation later used upstream.","Oracle’s listed fixed Java releases are 17.0.21.1, 21.0.13.1, 25.0.5.1, and 27.0.1.1."],"insights":["A single extra “=” after 128 otherwise valid Base64 characters could cause the AVX-512 decoder to calculate a negative value and then write a full 64-byte block where it should write nothing.","Deep Review reported two additional defects in the same original implementation: a 64-byte write into space intended for 48 decoded bytes and an invalid-character check that omitted one of four input lanes.","The article states that the recommended mitigation was to send inputs with fewer than four remaining bytes to a safer decoding path, matching the upstream fix except for an equivalent instruction comparison.","Aikido says its Deep Review system was isolated from the internet while analyzing the recreated pull request, so it did not rely on the later public fix to produce its findings."],"referencedReports":[],"body":"\u003cp\u003eJava4Shell, tracked as CVE-2026-114938, was publicly disclosed on November 17, 2026 as a critical memory-corruption issue in OpenJDK’s hardware-accelerated Base64 decoder. The article states that the vulnerable code originated in an AVX-512 performance optimization merged into OpenJDK in June 2021. It affects only x86-64 CPUs that support AVX-512 VBMI; ARM systems are not affected. Oracle’s listed fixed releases are 17.0.21.1, 21.0.13.1, 25.0.5.1, and 27.0.1.1.\u003c/p\u003e\n\n\u003cp\u003eAikido reconstructed the original OpenJDK pull request and ran its Deep Review product against it, reporting three high-severity findings. One finding identified the Java4Shell issue: malformed Base64 input with invalid padding could trigger an integer underflow, produce an incorrect output mask, and cause a 64-byte write beyond the allocated destination buffer. The tool recommended falling back to a safer decoder when fewer than four input bytes remain, which the article says is essentially the same as the eventual upstream fix. Deep Review also identified an oversized vectorized write and an incomplete invalid-character check, both of which were subsequently corrected upstream.\u003c/p\u003e\n"},{"n":37,"title":"CVE-2026-114938 (Java4Shell): Heap overflow in OpenJDK’s Base64 decoder","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/java4shell-cve-2026-114938/","time":"15:41","priority":"SHOULD READ","score":88,"tldr":"CVE-2026-114938 (Java4Shell) is a high-severity heap overflow in OpenJDK’s AVX-512 Base64 decoder that can cause unauthenticated JVM crashes and potentially remote code execution on affected x86-64 systems. Update vulnerable Java runtimes immediately or temporarily disable Base64 intrinsics with -XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics.","briefOverview":"\u003cp\u003eOpenJDK and Oracle released fixes on November 17, 2026, for CVE-2026-114938, also called Java4Shell, a heap overflow in HotSpot’s accelerated Base64 decoder. The issue affects certain Java 17, 21, 25, and 27 builds on x86-64 processors that support AVX-512 VBMI and related instruction features. A specially malformed Base64 value can cause the decoder to write beyond the end of a Java memory buffer before Java rejects the input. Oracle rates the issue CVSS 3.1 8.1 (High).\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable code is a hand-written assembly optimization used after the JVM’s C2 compiler makes Base64 decoding a frequently used path. It mishandles the final padded Base64 characters and can overwrite up to 62 bytes beyond the intended buffer in Calif’s reproducer. The basic and URL-safe Base64 decoders are affected, while the MIME decoder uses a different path. ARM64 systems, x86-64 systems without AVX-512 VBMI, OpenJDK 8 and 11, and Java 17.0.0 through 17.0.5 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe immediate consequence can be an unauthenticated JVM crash, while Calif reports that application-specific memory manipulation can potentially lead to information disclosure and remote code execution. The researchers reported pre-authentication remote code execution in default installations of several products, including Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, but product-specific exploit chains remain undisclosed. Organizations should update all Java runtimes, including bundled and containerized copies, restart running JVMs, and rebuild container images. Where patching is delayed, the article recommends disabling Base64 intrinsics with \u003ccode\u003e-XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-114938, dubbed Java4Shell, is a heap overflow in OpenJDK’s accelerated Base64 decoder that can write past a Java heap buffer before rejecting malformed input.","The flaw affects specified Java 17, 21, 25, and 27 builds only on x86-64 CPUs exposing AVX-512 VBMI and related instruction-set features; OpenJDK 8 and 11, Java 17.0.0 through 17.0.5, ARM64 systems, and CPUs without AVX-512 VBMI are not affected.","The bug can cause unauthenticated denial of service through JVM crashes and may enable remote code execution after application-specific heap manipulation, according to researchers at Calif.","Organizations should update to vendor-fixed Java releases, restart all JVMs and rebuild container images, or temporarily disable the accelerated path with -XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics.","As of November 18, 2026, the article states that no exploitation in the wild had been confirmed."],"insights":["A malformed Base64 value can trigger the out-of-bounds write even though Java subsequently throws an IllegalArgumentException, meaning application logs may show a normal-looking decode error after memory has already been corrupted.","The vulnerable decoder path is used only after the JVM has processed enough valid Base64 data for its compiler to optimize the method, so a one-off request to a newly started service may not reproduce the issue.","Hardware is a decisive exposure condition: ARM64 hosts and x86-64 systems lacking AVX-512 VBMI do not run the vulnerable routine, even if they use an otherwise affected Java version.","Disabling only the Base64 optimization with -XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics is a narrower temporary mitigation than disabling AVX-512 with -XX:UseAVX=2.","Updating a Java installation alone is insufficient if services continue running old JVM processes or use older Java runtimes embedded in third-party products or container images."],"referencedReports":[{"title":"OpenJDK Vulnerability Advisory 2026-11-17","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"OpenJDK","context":"The article cites this advisory for the coordinated disclosure and fixed OpenJDK builds for CVE-2026-114938.","category":"advisory","primary":true},{"title":"Oracle Critical Security Patch Update, November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"Oracle","context":"The article cites Oracle’s security update for its CVSS assessment and patched Oracle Java releases.","category":"advisory","primary":true},{"title":"CERT-EU Security Advisory 2026-021","url":"https://cert.europa.eu/publications/security-advisories/2026-021/","publisher":"CERT-EU","context":"The article references this advisory as part of the public disclosure timeline for Java4Shell.","category":"advisory","primary":false},{"title":"Red Hat RHSB-2026-018","url":"https://access.redhat.com/security/vulnerabilities/RHSB-2026-018","publisher":"Red Hat","context":"The article cites Red Hat’s security bulletin for vendor-specific information about affected and fixed Java builds.","category":"advisory","primary":false},{"title":"Java4Shell","url":"https://calif.io/java4shell","publisher":"Calif","context":"The article relies on Calif’s technical write-up and reproducer for details of the Base64 decoder overflow and reported application-specific exploit chains.","category":"research","primary":true}],"body":"\u003cp\u003eOpenJDK and Oracle released fixes on November 17, 2026, for CVE-2026-114938, also called Java4Shell, a heap overflow in HotSpot’s accelerated Base64 decoder. The issue affects certain Java 17, 21, 25, and 27 builds on x86-64 processors that support AVX-512 VBMI and related instruction features. A specially malformed Base64 value can cause the decoder to write beyond the end of a Java memory buffer before Java rejects the input. Oracle rates the issue CVSS 3.1 8.1 (High).\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable code is a hand-written assembly optimization used after the JVM’s C2 compiler makes Base64 decoding a frequently used path. It mishandles the final padded Base64 characters and can overwrite up to 62 bytes beyond the intended buffer in Calif’s reproducer. The basic and URL-safe Base64 decoders are affected, while the MIME decoder uses a different path. ARM64 systems, x86-64 systems without AVX-512 VBMI, OpenJDK 8 and 11, and Java 17.0.0 through 17.0.5 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe immediate consequence can be an unauthenticated JVM crash, while Calif reports that application-specific memory manipulation can potentially lead to information disclosure and remote code execution. The researchers reported pre-authentication remote code execution in default installations of several products, including Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, but product-specific exploit chains remain undisclosed. Organizations should update all Java runtimes, including bundled and containerized copies, restart running JVMs, and rebuild container images. Where patching is delayed, the article recommends disabling Base64 intrinsics with \u003ccode\u003e-XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics\u003c/code\u003e.\u003c/p\u003e\n"},{"n":39,"title":"CVE-2026-114938: Critical vulnerability in OpenJDK JAVA","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/java4shell/","time":"01:53","priority":"SHOULD READ","score":88,"tldr":"Cisco Talos warns that CVE-2026-114938 (“Java4Shell”) is a critical OpenJDK Java flaw that may allow unauthenticated remote code execution through malformed Base64 input on AVX-512 VBMI-capable x86-64 systems. Organizations should apply the vendor update immediately or temporarily disable AVX-512 using -XX:UseAVX=2 where appropriate.","briefOverview":"\u003cp\u003eCisco Talos is tracking CVE-2026-114938, also called Java4Shell, a critical OpenJDK Java vulnerability with a CVSS 4.0 score of 9.2. The flaw may permit unauthenticated remote code execution when affected Java virtual machines receive malformed Base64 input. Talos says the issue has been successfully tested against a suite of Java applications, though the full attack surface may expand as additional targets are confirmed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects OpenJDK Java 17.0.6 and later on x86-64 systems where AVX-512 VBMI support is enabled, including commonly deployed Intel and AMD processors in on-premise and cloud environments. Talos had not observed exploitation in the wild but expects probing may increase after public disclosure. It recommends applying the software update, or temporarily disabling AVX-512 with the JVM option \u003ccode\u003e-XX:UseAVX=2\u003c/code\u003e on x86-64 systems; this option is not suitable for ARM-based processors. Snort rules are available to detect malformed Base64 data in certain HTTP request fields associated with the issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos is tracking CVE-2026-114938, dubbed Java4Shell, a critical OpenJDK Java vulnerability with a CVSS 4.0 score of 9.2 that may enable unauthenticated remote code execution through malformed Base64 input.","The issue affects OpenJDK Java 17.0.6 and later on x86-64 systems with AVX-512 VBMI support enabled, including certain Intel and AMD processors.","Talos had not observed in-the-wild exploitation at the time of publication but anticipated that probing attempts could increase after public disclosure.","Talos recommends applying the software update, or, if patching cannot happen immediately, starting affected x86-64 JVMs with AVX-512 disabled using -XX:UseAVX=2.","Snort rules 1:67502 through 1:67513 are available to detect malformed Base64 data in specific HTTP request fields associated with the vulnerability."],"insights":["Exposure is determined not only by the OpenJDK version but also by whether an x86-64 processor supports AVX-512 VBMI and has that capability enabled, which narrows the affected population while still encompassing commonly deployed Intel and AMD systems.","The suggested temporary mitigation is platform-specific: the AVX-512-disabling JVM option is intended for x86-64 systems and may prevent an application from starting on ARM-based systems.","The available Snort detections focus on malformed Base64 in particular HTTP request fields and are implementation-specific, so they are not presented as universal coverage for every potentially vulnerable Java application.","Talos states that its rules cover identified common vulnerable applications and attack paths, while noting that the overall attack surface may be larger as further targets are tested and confirmed."],"referencedReports":[{"title":"Oracle public disclosure for CVE-2026-114938","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"Cisco Talos links to Oracle's public disclosure as the source of the vulnerability's public release.","category":"advisory","primary":true}],"body":"\u003cp\u003eCisco Talos is tracking CVE-2026-114938, also called Java4Shell, a critical OpenJDK Java vulnerability with a CVSS 4.0 score of 9.2. The flaw may permit unauthenticated remote code execution when affected Java virtual machines receive malformed Base64 input. Talos says the issue has been successfully tested against a suite of Java applications, though the full attack surface may expand as additional targets are confirmed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects OpenJDK Java 17.0.6 and later on x86-64 systems where AVX-512 VBMI support is enabled, including commonly deployed Intel and AMD processors in on-premise and cloud environments. Talos had not observed exploitation in the wild but expects probing may increase after public disclosure. It recommends applying the software update, or temporarily disabling AVX-512 with the JVM option \u003ccode\u003e-XX:UseAVX=2\u003c/code\u003e on x86-64 systems; this option is not suitable for ARM-based processors. Snort rules are available to detect malformed Base64 data in certain HTTP request fields associated with the issue.\u003c/p\u003e\n"},{"n":43,"title":"Optimizely Supply Chain Attack Distributes Malware Across Global Brands","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/optimizely-supply-chain-attack?utm_medium=feed","time":"00:17","priority":"SHOULD READ","score":88,"tldr":"An attacker exploited Optimizely Web Experimentation’s account signup flow to inject malicious JavaScript into trusted snippets used by 178 organizations, exposing visitors to cryptocurrency address replacement and an iOS exploit-kit loader. Optimizely removed the injected code, patched the flaw, revoked tokens, and reset affected account access.","briefOverview":"\u003cp\u003eAn attacker exploited a vulnerability in Optimizely Web Experimentation’s account signup flow on November 16, 2026, injecting malicious JavaScript into website snippets served through Optimizely’s trusted infrastructure. Report URI identified 188 infected snippets associated with 178 organizations, including the BBC, CNN, Zoom, GitLab, IKEA, and HSBC. The affected organizations did not need to have their own websites or servers compromised for visitors to receive the malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe injected code could load \u003ccode\u003etrack.js\u003c/code\u003e from 1688360[.]cc, and the analyzed sample contained a cryptocurrency wallet-address replacement component plus an iOS-only loader for \u003ccode\u003eboot.js\u003c/code\u003e from 5vobauua3ojpklx[.]icu. The wallet clipper scanned page text, inputs, textareas, and copied text, potentially replacing cryptocurrency addresses during a user-initiated copy action. Optimizely said it patched the issue, removed injected code, revoked tokens, reset affected account access, and notified organizations; Report URI confirmed its observed infected snippets were cleaned by 23:11 UTC on November 16.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker exploited a vulnerability in Optimizely Web Experimentation’s account signup flow on November 16, 2026, injecting malicious JavaScript into customer website snippets.","Report URI identified 188 infected Optimizely JavaScript snippets linked to 178 organizations, including the BBC, CNN, Zoom, GitLab, IKEA, and HSBC.","The injected code could load track.js from 1688360[.]cc, which contained a cryptocurrency wallet-address replacement component and an iOS-only loader for boot.js from 5vobauua3ojpklx[.]icu.","Optimizely said it patched the signup-flow vulnerability, removed injected code, revoked tokens, reset access for affected accounts, and notified involved organizations.","Report URI confirmed that all infected snippets in its observed set had been cleaned by November 16 at 23:11 UTC."],"insights":["The affected organizations’ own websites and servers did not need to be compromised, because the harmful code was delivered through Optimizely’s trusted website-testing infrastructure.","The wallet-address replacement code could alter text during a user-initiated copy action without a separate permission prompt, making copied cryptocurrency addresses a specific risk.","The analyzed track.js sample contained both a cryptocurrency address clipper and an iOS-only loader, whil
