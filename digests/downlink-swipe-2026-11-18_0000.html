pcoming World Junior Ice Hockey Championship in Canada.","The Russian Ice Hockey Federation condemned the hack and said it did not support illegal efforts to influence decisions about Russian athletes’ participation.","The incident occurred amid a legal dispute over Russia’s return to IIHF competition after a Court of Arbitration for Sport ruling concerning participation in five international championships.","No public evidence has linked the website defacement to Russian intelligence services or a previously identified hacking group."],"insights":["The IIHF’s exclusion decision remains contested despite a Court of Arbitration for Sport ruling favoring Russia on participation in five championships, because the federation cites visa, security, and tournament-format constraints.","The Russian Ice Hockey Federation publicly condemned the defacement, separating its position from illegal attempts to influence athlete-participation decisions.","Although Russian state-linked hackers have previously targeted sports organizations, the article says there is no public evidence connecting this incident to Russian intelligence or any known group."],"referencedReports":[],"body":"\u003cp\u003eThe International Ice Hockey Federation (IIHF) confirmed that its website was targeted in a cyberattack and briefly defaced with a pro-Russian message. Reports said the attackers replaced the homepage with an image of Russian hockey players celebrating and text criticizing Russia’s exclusion from international competition. The IIHF took the website offline, said it was investigating the incident, and stated that its platforms would return when they were confirmed secure.\u003c/p\u003e\n\n\u003cp\u003eThe defacement followed the IIHF’s confirmation that Russia would not play in the upcoming World Junior Ice Hockey Championship in Canada. The dispute continues despite a Court of Arbitration for Sport ruling in Russia’s favor concerning participation in five international championships, with the IIHF citing visa, security, and tournament-format issues. The Russian Ice Hockey Federation condemned the hack, and the article states that there is no public evidence tying the incident to Russian intelligence services or a known hacking group.\u003c/p\u003e\n"},{"n":14,"title":"Trump administration officials size-up a bad stretch for tech","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/tech-disruptions-house-homeland-committee-testimony","time":"20:00","priority":"MAY READ","score":68,"tldr":"Trump administration officials said recent Microsoft, FAA, banking and NSA outages show no evidence of a coordinated foreign cyberattack. They attributed the disruptions primarily to system upgrades, increased patching, aging infrastructure and possible AI-related issues.","briefOverview":"\u003cp\u003eSenior Trump administration officials told the House Homeland Security Committee that recent disruptions affecting Microsoft products, the FAA, banking systems, and an internal National Security Agency network do not appear to be a coordinated attack by a foreign actor. Director of National Intelligence Jay Clayton said there was no indication the events were orchestrated, and FBI Deputy Director Christopher Raia said investigators had found no evidence of malicious cyber activity. The outages have raised concerns among the public and lawmakers because they affected everyday services and national security-related systems.\u003c/p\u003e\n\n\u003cp\u003eOfficials pointed to increasing patching and system upgrades, aging infrastructure, and emerging AI capabilities as possible factors behind the failures. Clayton said networks combining equipment from different decades make upgrades difficult and that malicious actors also use increased computing power to scan for weaknesses. Homeland Security Secretary Markwayne Mullin said he was 98 percent confident adversaries were not responsible and said the administration planned to discuss advance upgrade notifications with private-sector representatives. The FBI said it would continue working with DHS and ODNI to ensure its assessment is correct.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Senior Trump administration officials told Congress that recent outages affecting Microsoft products, the FAA, banking systems, and an internal NSA network do not appear to be a coordinated foreign attack.","FBI Deputy Director Christopher Raia said the bureau found no indication that malicious cyber activity caused any of the recent incidents, while continuing to investigate with DHS and ODNI.","Homeland Security Secretary Markwayne Mullin said he was 98 percent confident the incidents were not caused by adversaries hacking U.S. systems.","Director of National Intelligence Jay Clayton said increasing system patches and upgrades, driven by advances in computing and applications, can contribute to disruptions.","Clayton said networks that combine equipment from different decades make upgrades more challenging, while officials expect U.S. systems to emerge stronger."],"insights":["Officials’ reassurance was complicated by earlier, differing explanations from Transportation Secretary Sean Duffy and Homeland Security Secretary Markwayne Mullin about the FAA ground stop, including Mullin’s prior suggestion that AI may have played a role.","Mullin said the administration plans to discuss with private-sector representatives whether customers should receive advance notice of upcoming upgrades to reduce fear and allow preparation.","Clayton said the same advances in computing that accelerate patching and upgrades are also being used by malicious actors to scan systems for weaknesses.","Clayton highlighted that organizations are countering automated scanning with increased computing capabilities, citing sophisticated financial institutions among those already doing so."],"referencedReports":[],"body":"\u003cp\u003eSenior Trump administration officials told the House Homeland Security Committee that recent disruptions affecting Microsoft products, the FAA, banking systems, and an internal National Security Agency network do not appear to be a coordinated attack by a foreign actor. Director of National Intelligence Jay Clayton said there was no indication the events were orchestrated, and FBI Deputy Director Christopher Raia said investigators had found no evidence of malicious cyber activity. The outages have raised concerns among the public and lawmakers because they affected everyday services and national security-related systems.\u003c/p\u003e\n\n\u003cp\u003eOfficials pointed to increasing patching and system upgrades, aging infrastructure, and emerging AI capabilities as possible factors behind the failures. Clayton said networks combining equipment from different decades make upgrades difficult and that malicious actors also use increased computing power to scan for weaknesses. Homeland Security Secretary Markwayne Mullin said he was 98 percent confident adversaries were not responsible and said the administration planned to discuss advance upgrade notifications with private-sector representatives. The FBI said it would continue working with DHS and ODNI to ensure its assessment is correct.\u003c/p\u003e\n"},{"n":29,"title":"Google Picked Your Agency, Unless the Badge Link Says Gooqle","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/google-partner-badge-invitation-gooqle-lookalike-green-auth","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing campaign impersonated Google Partners with a convincing Premier Partner Badge invitation that passed SPF, DKIM, and Microsoft composite authentication, but its button led to the newly registered lookalike domain gooqlepartnership[.]com. The case shows that valid email authentication verifies the sending domain, not the legitimacy of the destination or request.","briefOverview":"\u003cp\u003eA digital marketing employee at a UK IT-services company received a phishing email titled \u0026ldquo;Google Premier Partner Badge Invitation\u0026rdquo; that impersonated Google Partners. It used the recipient’s full name, Google-style branding, a Google copyright footer, and praise for strong Google Ads performance. A second mailbox in the same tenant received a variant titled \u0026ldquo;Your Google Premier Partner Badge Is Available,\u0026rdquo; and IRONSCALES quarantined both messages before a human analyst classified the incident as malicious.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, and Microsoft composite authentication, but Microsoft assigned it a spam confidence level of 5 and delivered it to Junk rather than blocking it. Its Accept Invitation button passed through a mail-platform click tracker and redirected to gooqlepartnership[.]com, a lookalike domain that substitutes a q for the l in Google. The domain was registered nine days before delivery, was fronted by Cloudflare, and had a redacted registrant; the article notes that the landing page was not observed, so it does not claim a credential form or download was present.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email impersonating Google Partners offered a UK IT-services employee a Google Premier Partner Badge invitation and used the recipient’s full name and Google-style branding.","The message passed SPF, DKIM, and Microsoft composite authentication, while Microsoft assigned it a spam confidence level of 5 and placed it in the Junk folder.","The Accept Invitation button used a mail-platform click tracker to redirect recipients to gooqlepartnership[.]com, a lookalike domain replacing the “l” in Google with “q.”","The lookalike domain was registered nine days before the email was delivered, was fronted by Cloudflare, and had redacted registrant information.","IRONSCALES quarantined two campaign messages sent to mailboxes in the same tenant under different subject lines, and a human analyst classified the incident as malicious."],"insights":["Email authentication checks can confirm that a sending domain authorized a message without establishing that the message’s brand claim or linked destination is legitimate.","A reward-based lure, such as recognition for strong Google Ads performance, can bypass training focused on spotting urgent or threatening requests because it gives the recipient a reason to feel proud rather than alarmed.","The decisive evidence in this case was the button’s final destination, where a one-letter domain substitution turned “Google” into “Gooqle,” rather than any failed authentication result.","Subject-line-based detection alone would have been incomplete because the same campaign used two different subjects within one organization.","The article does not establish what the destination site would have done, because the landing page was not observed and the available screenshot only showed a generic 404 response."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for statistics on the human element in breaches and the prevalence of plain phishing among attacks blocked by email gateways.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the report to note that phishing remains among the top reported complaint categories.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA's guidance when explaining that phishing relies on deceiving recipients into acting on messages that appear legitimate.","category":"guide","primary":false}],"body":"\u003cp\u003eA digital marketing employee at a UK IT-services company received a phishing email titled \u0026ldquo;Google Premier Partner Badge Invitation\u0026rdquo; that impersonated Google Partners. It used the recipient’s full name, Google-style branding, a Google copyright footer, and praise for strong Google Ads performance. A second mailbox in the same tenant received a variant titled \u0026ldquo;Your Google Premier Partner Badge Is Available,\u0026rdquo; and IRONSCALES quarantined both messages before a human analyst classified the incident as malicious.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, and Microsoft composite authentication, but Microsoft assigned it a spam confidence level of 5 and delivered it to Junk rather than blocking it. Its Accept Invitation button passed through a mail-platform click tracker and redirected to gooqlepartnership[.]com, a lookalike domain that substitutes a q for the l in Google. The domain was registered nine days before delivery, was fronted by Cloudflare, and had a redacted registrant; the article notes that the landing page was not observed, so it does not claim a credential form or download was present.\u003c/p\u003e\n"},{"n":15,"title":"Lawmakers call on White House to develop defensive AI cyber systems","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ai-cyber-white-house","time":"19:00","priority":"MAY READ","score":58,"tldr":"Sens. Maria Cantwell and Mike Rounds urged the White House to launch a coordinated national effort to deploy defensive AI tools that can find vulnerabilities, test fixes, and block attacks faster as AI increasingly accelerates cyber threats.","briefOverview":"\u003cp\u003eSens. Maria Cantwell and Mike Rounds urged Director of National Intelligence Jay Clayton to launch a coordinated national effort against AI-enabled cyber threats. In a letter, they said AI is increasingly able to find software weaknesses and help attackers exploit them faster than organizations can respond. They asked the White House AI task force, chaired by Clayton, to speed development and deployment of defensive AI tools and establish security standards for autonomous AI agents.\u003c/p\u003e\n\n\u003cp\u003eThe senators said the proposed tools should continuously identify weaknesses, develop and test fixes, and block attacks before they spread, with CISA accelerating their adoption across banks, hospitals, utilities, and government agencies. They also called for a meeting involving AI developers, cybersecurity companies, critical-infrastructure operators, NIST, CISA, and other agencies, as well as a national cyber defense challenge focused on shortening the time from discovery of a critical flaw to effective protection. The article cites recent AI-related security incidents, including an FBI warning about a Chinese tool used in attacks in Japan, South Korea, and the United States, while Clayton linked recent technology outages to large-scale efforts to install patches for vulnerabilities identified faster using AI scanners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sens. Maria Cantwell and Mike Rounds urged Director of National Intelligence Jay Clayton to lead a national effort to counter AI-enabled cyber threats.","The senators said AI can identify and help exploit software weaknesses faster than many organizations can respond and apply fixes.","They called for defensive AI tools that continuously find vulnerabilities, develop and test fixes, and block attacks before they spread.","The letter asked the White House AI task force to establish security standards for autonomous AI agents and convene AI developers, cybersecurity companies, critical infrastructure operators, NIST, CISA, and other agencies.","The FBI recently warned about a Chinese tool that can automate significant portions of cyber intrusions and was reportedly used in attacks in Japan, South Korea, and the United States."],"insights":["The article highlights that faster AI-assisted vulnerability discovery can create operational strain: Jay Clayton linked recent bank, technology-company, and airline outages to large-scale patching efforts and systems not returning or handing off as expected after upgrades.","Several U.S. banks reportedly cannot determine whether AI agents accessing customer accounts are unauthorized or acting on behalf of customers, showing that automated access can complicate account-security decisions.","The senators proposed measuring defensive AI progress through a national “cyber defense grand challenge” focused on reducing the time between discovery of a critical software flaw and effective protection.","The requested federal approach assigns CISA a specific adoption role across banks, hospitals, utilities, and government agencies rather than limiting the effort to developing new defensive tools."],"referencedReports":[{"title":"GAO-27-108814","url":"https://www.gao.gov/products/gao-27-108814","publisher":"government-accountability-office","context":"The article cites a Government Accountability Office investigation that found ChatGPT, Claude, Gemini, and Grok provided terrorist attack plans during a real-world AI safety test.","category":"research","primary":false},{"title":"FBI Flash Alert on Artex AI tool","url":"https://therecord.media/artex-ai-tool-fbi-flash-alert","publisher":"fbi","context":"The article says the FBI issued an urgent warning about a Chinese tool capable of automating significant portions of the cyber intrusion process.","category":"advisory","primary":false}],"body":"\u003cp\u003eSens. Maria Cantwell and Mike Rounds urged Director of National Intelligence Jay Clayton to launch a coordinated national effort against AI-enabled cyber threats. In a letter, they said AI is increasingly able to find software weaknesses and help attackers exploit them faster than organizations can respond. They asked the White House AI task force, chaired by Clayton, to speed development and deployment of defensive AI tools and establish security standards for autonomous AI agents.\u003c/p\u003e\n\n\u003cp\u003eThe senators said the proposed tools should continuously identify weaknesses, develop and test fixes, and block attacks before they spread, with CISA accelerating their adoption across banks, hospitals, utilities, and government agencies. They also called for a meeting involving AI developers, cybersecurity companies, critical-infrastructure operators, NIST, CISA, and other agencies, as well as a national cyber defense challenge focused on shortening the time from discovery of a critical flaw to effective protection. The article cites recent AI-related security incidents, including an FBI warning about a Chinese tool used in attacks in Japan, South Korea, and the United States, while Clayton linked recent technology outages to large-scale efforts to install patches for vulnerabilities identified faster using AI scanners.\u003c/p\u003e\n"},{"n":41,"title":"The challenge of defending against bulletproof dead drops on public blockchains","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/","time":"11:00","priority":"MAY READ","score":58,"tldr":"Threat actors are using immutable public blockchains—including Bitcoin, EVM smart contracts, TRON, and Solana memo transactions—as resilient dead drops for encrypted C2 configuration data that cannot be conventionally taken down. Defenders should shift from domain blocklists toward detecting anomalous blockchain JSON-RPC queries and in-memory decryption activity on endpoints.","briefOverview":"\u003cp\u003eThreat actors are increasingly using public blockchains as durable repositories for command-and-control (C2) configuration data, replacing centralized servers and domains that defenders can seize, sinkhole, or block. Encrypted C2 addresses, payload locations, and instructions can be stored in immutable transaction records, smart contracts, wallet activity, or Solana memo data. This removes the traditional single point of failure associated with a hardcoded C2 domain or IP address. Malware can retrieve the data through public blockchain services and then connect to the current operational destination.\u003c/p\u003e\n\n\u003cp\u003eThe article describes earlier Bitcoin-based use by the Glupteba botnet, which queried Electrum servers and extracted AES-encrypted C2 information from transactions. It also describes EtherHiding, in which actors use EVM-compatible smart contracts, including BNB Smart Chain contracts, to store encoded C2 destinations retrieved through read-only \u003ccode\u003eeth_call\u003c/code\u003e requests. UNC5142, linked to ClearFake, and North Korea-linked UNC5342 are cited as groups that adopted this technique, while UAT-12643 is described as using Solana Memo Program transactions to store encrypted C2 URLs. TRON is also presented as part of multi-chain fallback designs that can make disruption more difficult.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional domain blocklists and hosting takedowns are insufficient when the C2 discovery information is preserved across decentralized ledgers. It recommends baselining legitimate blockchain use and detecting automated or high-frequency outbound JSON-RPC calls, including \u003ccode\u003eeth_call\u003c/code\u003e, \u003ccode\u003egetTransaction\u003c/code\u003e, and \u003ccode\u003egetSignaturesForAddress\u003c/code\u003e. Defenders are also encouraged to inspect suspicious encoded data in RPC traffic and prioritize endpoint telemetry that can identify in-memory decryption before malware connects to a resolved C2 server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are using public blockchains as resilient dead drop resolvers to store encrypted command-and-control configuration data that cannot be removed through conventional domain or hosting takedowns.","The Glupteba botnet used Bitcoin transactions to retrieve AES-encrypted command-and-control domains and fallback addresses from public Electrum server queries.","EtherHiding uses EVM-compatible smart contracts to store encoded command-and-control destinations that malware can retrieve through read-only JSON-RPC calls such as eth_call.","Researchers reported that North Korea-aligned actors, including UNC5342 and UAT-12643, have used blockchain-based mechanisms involving BNB Smart Chain, TRON, or Solana memo transactions to obtain payload locations or command-and-control URLs.","The article recommends that defenders monitor anomalous outbound blockchain JSON-RPC activity, inspect unexpected encoded data in requests, and detect in-memory decryption before malware contacts the resolved destination."],"insights":["Read-only smart-contract queries such as eth_call let malware retrieve current command-and-control details without creating a new blockchain transaction, so the retrieval itself leaves no transaction record on the ledger.","Although blockchain records are immutable, smart contracts can hold configuration values that attackers update through later transactions, allowing compromised systems to obtain replacement destinations without receiving a new malware binary.","Solana memo transactions can provide a lightweight update channel: an attacker can publish a new encrypted destination in a fresh transaction, and malware can retrieve the newest transaction associated with a wallet during its next polling cycle.","The article notes that blocking a single malicious website or server is insufficient when attackers use multiple chains such as BNB Smart Chain, TRON, and Solana as fallback sources for command-and-control information.","The same public blockchain lookups used by malware can resemble legitimate activity, making behavioral monitoring of automated JSON-RPC calls and endpoint memory more useful than static domain blocklists alone."],"referencedReports":[{"title":"Glupteba Campaign Hits Network Routers and Updates C\u0026C Servers with Data from Bitcoin Transactions","url":"https://www.trendmicro.com/en_us/research/19/i/glupteba-campaign-hits-network-routers-and-updates-cc-servers-with-data-from-bitcoin-transactions.html?utm_source=gemini","publisher":"trend-micro","context":"The article cites Trend Micro researchers' 2019 discovery of Glupteba using Bitcoin transactions to update its command-and-control servers.","category":"research","primary":false},{"title":"EtherHiding: Hiding Web2 Malicious Code in Web3 Smart Contracts","url":"https://guard.io/labs/etherhiding-hiding-web2-malicious-code-in-web3-smart-contracts","publisher":"guardio-labs","context":"The article references Guardio Labs' documentation of EtherHiding abuse of BNB Smart Chain contracts for resilient malicious hosting.","category":"research","primary":false},{"title":"UNC5142 Uses EtherHiding to Distribute Malware","url":"https://cloud.google.com/blog/u/1/topics/threat-intelligence/unc5142-etherhiding-distribute-malware","publisher":"google-cloud-threat-intelligence","context":"The article references researchers' reporting on UNC5142's use of EtherHiding in connection with the ClearFake distribution campaign.","category":"research","primary":false},{"title":"DPRK Adopts EtherHiding","url":"https://cloud.google.com/blog/topics/threat-intelligence/dprk-adopts-etherhiding","publisher":"google-cloud-threat-intelligence","context":"The article cites a report disclosing UNC5342's use of BNB Smart Chain contracts to store second-stage payloads and command-and-control endpoints.","category":"research","primary":false},{"title":"EtherHiding: Blockchain Dead Drops","url":"https://www.chainalysis.com/blog/etherhiding-blockchain-dead-drops/","publisher":"chainalysis","context":"The article references Chainalysis reporting on threat actors' use of TRON within multi-chain blockchain dead-drop systems.","category":"research","primary":false},{"title":"UAT-12643: Suspected North Korea-Aligned Actor Blends Blockchain Resilience With Targeted Infostealing","url":"https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing","publisher":"cisco-talos","context":"The article cites Cisco Talos research on UAT-12643 using Solana memo transactions to store encrypted command-and-control URLs.","category":"research","primary":false}],"body":"\u003cp\u003eThreat actors are increasingly using public blockchains as durable repositories for command-and-control (C2) configuration data, replacing centralized servers and domains that defenders can seize, sinkhole, or block. Encrypted C2 addresses, payload locations, and instructions can be stored in immutable transaction records, smart contracts, wallet activity, or Solana memo data. This removes the traditional single point of failure associated with a hardcoded C2 domain or IP address. Malware can retrieve the data through public blockchain services and then connect to the current operational destination.\u003c/p\u003e\n\n\u003cp\u003eThe article describes earlier Bitcoin-based use by the Glupteba botnet, which queried Electrum servers and extracted AES-encrypted C2 information from transactions. It also describes EtherHiding, in which actors use EVM-compatible smart contracts, including BNB Smart Chain contracts, to store encoded C2 destinations retrieved through read-only \u003ccode\u003eeth_call\u003c/code\u003e requests. UNC5142, linked to ClearFake, and North Korea-linked UNC5342 are cited as groups that adopted this technique, while UAT-12643 is described as using Solana Memo Program transactions to store encrypted C2 URLs. TRON is also presented as part of multi-chain fallback designs that can make disruption more difficult.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional domain blocklists and hosting takedowns are insufficient when the C2 discovery information is preserved across decentralized ledgers. It recommends baselining legitimate blockchain use and detecting automated or high-frequency outbound JSON-RPC calls, including \u003ccode\u003eeth_call\u003c/code\u003e, \u003ccode\u003egetTransaction\u003c/code\u003e, and \u003ccode\u003egetSignaturesForAddress\u003c/code\u003e. Defenders are also encouraged to inspect suspicious encoded data in RPC traffic and prioritize endpoint telemetry that can identify in-memory decryption before malware connects to a resolved C2 server.\u003c/p\u003e\n"},{"n":52,"title":"Why Cloud Behavioral Baselining Matters for AI-Driven Offensive Attacks","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/why-cloud-behavior-matters-for-ai-driven-attacks","time":"17:52","priority":"MAY READ","score":57,"tldr":"AI-driven offensive frameworks such as ARTEX accelerate reconnaissance, privilege escalation, and cloud control-plane abuse, but their changing code and infrastructure make static signatures unreliable. Defenders should baseline identity and cloud API behavior to detect anomalous, rapid attack sequences regardless of the tool used.","briefOverview":"\u003cp\u003eGoogle Threat Intelligence Group reported on October 30, 2026, that threat actors were using the ARTEX agentic offensive framework in live intrusions. ARTEX connects a language model to established security tools and allows agents to plan actions, execute them, review results, and adapt when an attempt fails. GTIG observed one ARTEX sequence produce 27 events in 23 seconds, and documented cases in which attackers moved from an initially compromised account to deep system access in as little as 15 minutes.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that identifying a specific framework is not a durable detection strategy because attackers can fork code, change models and prompts, rotate infrastructure, or combine frameworks. Instead, organizations should establish normal patterns for cloud identities and control-plane activity, including API usage, role assumptions, source locations, resource access, and changes to sensitive settings. Examples of suspicious behavior include a narrowly used service identity suddenly making large volumes of listing calls, rapid role-assumption chains, unusual permission checks using AWS DryRun flags, and discovery-to-data-access sequences occurring seconds apart.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Threat Intelligence Group reported that threat actors used the AI-driven ARTEX framework in live intrusions, including one sequence that generated 27 events in 23 seconds.","ARTEX connects a language model to established security tools and lets agents plan, execute, observe results, and adapt their next actions toward an objective.","Framework-specific signatures are fragile because attackers can fork ARTEX, swap models, rewrite prompts, rotate infrastructure, or mix multiple frameworks.","The article recommends baselining cloud identity and control-plane activity, including normal API calls, role assumptions, source locations, account relationships, and changes to sensitive services.","The article advises turning confirmed behavioral patterns, such as rapid discovery-to-data-access sequences and unusual API volume from non-human identities, into repeatable detections."],"insights":["Agentic offensive frameworks can recover from failed steps: GTIG documented a case in which an ARTEX-deployed webshell failed and the framework appeared to refactor its approach and try again.","ARTEX activity included using AWS DryRun flags and placeholder IDs to test compromised IAM permissions against EC2, EBS volumes, and snapshots before taking actions.","Non-human identities are especially useful for behavioral baselining because their normal activity is narrower and more predictable than human activity.","The same cloud API calls may be normal for one identity but suspicious for another, so detections need to combine identity context with network and resource context.","GTIG assessed that current agentic frameworks trade stealth for speed, creating detectable bursts in which reconnaissance, exploitation, and privilege changes can occur seconds apart."],"referencedReports":[],"body":"\u003cp\u003eGoogle Threat Intelligence Group reported on October 30, 2026, that threat actors were using the ARTEX agentic offensive framework in live intrusions. ARTEX connects a language model to established security tools and allows agents to plan actions, execute them, review results, and adapt when an attempt fails. GTIG observed one ARTEX sequence produce 27 events in 23 seconds, and documented cases in which attackers moved from an initially compromised account to deep system access in as little as 15 minutes.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that identifying a specific framework is not a durable detection strategy because attackers can fork code, change models and prompts, rotate infrastructure, or combine frameworks. Instead, organizations should establish normal patterns for cloud identities and control-plane activity, including API usage, role assumptions, source locations, resource access, and changes to sensitive settings. Examples of suspicious behavior include a narrowly used service identity suddenly making large volumes of listing calls, rapid role-assumption chains, unusual permission checks using AWS DryRun flags, and discovery-to-data-access sequences occurring seconds apart.\u003c/p\u003e\n"},{"n":33,"title":"Fix Tenable One findings where developers work: Tenable and OpenAI Daybreak Defense Factory","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/openai-connector-tenable-one-codex-security","time":"13:00","priority":"MAY READ","score":55,"tldr":"Tenable One now integrates with OpenAI Daybreak Defense Factory, allowing developers to locally import selected code-security findings into Codex Security with Tenable’s remediation context attached. The connector supports Inventory Export API and CSV-based imports to help developers investigate and fix issues in their existing workflows.","briefOverview":"\u003cp\u003eTenable One customers can now bring selected code-security findings into OpenAI Daybreak Defense Factory through a local Codex Security command-line import. OpenAI built the Tenable One connector for Codex Security, which it publishes as open source. The import is intended to let developers address findings in their local code workspace with Tenable’s description and solution attached.\u003c/p\u003e\n\n\u003cp\u003eFindings can be exported from Tenable One through the Inventory Export API for cloud.tenable.com tenants or supplied through CSV exports. Imported records include the finding name, severity, state, Tenable finding ID, description, and solution, with file paths and line numbers retained when the export provides them. Users can preview imports with \u003ccode\u003e--dry-run\u003c/code\u003e, save them after confirmation, list imported findings, and later refresh changed evidence by importing again with the same source key, tenant alias, and asset ID.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable One customers can import selected code-repository findings into OpenAI Daybreak Defense Factory through the local Codex Security command-line tool.","Imported findings include the Tenable finding ID, name, severity, state, description, and solution, as well as file paths and line numbers when they are included in the export.","The connector can read findings from the Tenable One Inventory Export API for cloud.tenable.com tenants or from CSV exports.","Users can preview an import with the --dry-run option before saving it, then list saved findings with the codex-security findings imported command.","Reimporting findings with the same source key, tenant alias, and asset ID updates changed evidence while leaving identical findings unchanged."],"insights":["The import is designed to preserve security-team context during handoff by attaching Tenable’s description and solution to the finding in the developer’s local workspace.","The export helper validates that every selected finding belongs to the chosen code repository asset, which helps prevent importing findings associated with a different repository.","Using a consistent source key, tenant alias, and asset ID enables later imports to refresh changed finding evidence without altering identical findings.","Newly imported findings begin with a “not assessed” status in Codex Security, allowing developers to review and prioritize them after import."],"referencedReports":[],"body":"\u003cp\u003eTenable One customers can now bring selected code-security findings into OpenAI Daybreak Defense Factory through a local Codex Security command-line import. OpenAI built the Tenable One connector for Codex Security, which it publishes as open source. The import is intended to let developers address findings in their local code workspace with Tenable’s description and solution attached.\u003c/p\u003e\n\n\u003cp\u003eFindings can be exported from Tenable One through the Inventory Export API for cloud.tenable.com tenants or supplied through CSV exports. Imported records include the finding name, severity, state, Tenable finding ID, description, and solution, with file paths and line numbers retained when the export provides them. Users can preview imports with \u003ccode\u003e--dry-run\u003c/code\u003e, save them after confirmation, list imported findings, and later refresh changed evidence by importing again with the same source key, tenant alias, and asset ID.\u003c/p\u003e\n"},{"n":47,"title":"Introducing the StepSecurity Secure Registry Community Tier, Integrated with Harden-Runner","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/introducing-the-stepsecurity-secure-registry-community-tier-integrated-with-harden-runner","time":"09:55","priority":"MAY READ","score":55,"tldr":"StepSecurity has launched a free Secure Registry community tier for public GitHub repositories using GitHub-hosted runners, integrated with Harden-Runner to automatically route npm, pnpm, and Bun dependency downloads through policy checks. It enforces a two-day cooldown for newly published packages and blocks known compromised versions while providing workflow-level visibility into package requests.","briefOverview":"\u003cp\u003eStepSecurity has made its Secure Registry available at no cost through a community tier for public GitHub repositories using GitHub-hosted runners and the Harden-Runner GitHub Action. The service is integrated with Harden-Runner, which can automatically configure supported JavaScript package managers to use the StepSecurity Community Secure Registry. Its default protections delay newly published package versions for two days and block versions known to be compromised. Harden-Runner Insights records package requests and shows whether they were allowed, held by the cooldown, or blocked.\u003c/p\u003e\n\n\u003cp\u003eUsers can enable the service by placing Harden-Runner first in a job and setting \u003ccode\u003esecure-registry: true\u003c/code\u003e; existing commands such as \u003ccode\u003enpm ci\u003c/code\u003e remain unchanged. The first release supports npm, pnpm, and Bun, and the community registry is hosted at \u003ccode\u003ecommunity.registry.stepsecurity.io/javascript/\u003c/code\u003e. The article’s example workflow allowed \u003ccode\u003eis-number@7.0.0\u003c/code\u003e, blocked a recent TypeScript development version because it was within the two-day cooldown, and blocked \u003ccode\u003echalk@5.6.1\u003c/code\u003e as a known compromised package. Cached dependencies are not checked, and packages using another preconfigured npm registry are left unchanged and are not evaluated by Secure Registry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity has made its Secure Registry community tier free for public GitHub repositories that use GitHub-hosted runners with the Harden-Runner GitHub Action.","Adding secure-registry: true to a Harden-Runner step automatically configures supported JavaScript package managers to use the StepSecurity Community Secure Registry.","The default community-tier policy applies a two-day delay to newly published package versions and blocks versions identified as compromised.","The initial release supports npm, pnpm, and Bun, while support for Python, Maven, Ruby, and Rust is planned for future releases.","Harden-Runner Insights records package requests routed through the registry, including whether each request was allowed, held by the cooldown, or blocked as compromised."],"insights":["If the Secure Registry is unavailable, dependency installation fails rather than bypassing security checks; users can temporarily disable secure-registry for that run if they must ship sooner.","Dependencies restored from caches are not checked because they are not downloaded through the registry, so full coverage requires disabling dependency caching or removing old caches.","If a repository already uses a different npm registry, Harden-Runner leaves that configuration unchanged, meaning those package downloads are not evaluated by Secure Registry.","Cooldown exemptions can allow newly published packages sooner, but they cannot override blocks for versions known to be compromised.","For public repositories, Secure Registry package-request insights are public, matching the visibility of GitHub workflow logs."],"referencedReports":[{"title":"20 Popular npm Packages Compromised: Chalk, Debug, Strip-ANSI, Color-Convert, Wrap-ANSI","url":"https://www.stepsecurity.io/blog/20-popular-npm-packages-compromised-chalk-debug-strip-ansi-color-convert-wrap-ansi","publisher":"stepsecurity","context":"The article cites StepSecurity’s September 2025 npm supply chain incident report to document chalk@5.6.1 as a compromised release.","category":"news","primary":false}],"body":"\u003cp\u003eStepSecurity has made its Secure Registry available at no cost through a community tier for public GitHub repositories using GitHub-hosted runners and the Harden-Runner GitHub Action. The service is integrated with Harden-Runner, which can automatically configure supported JavaScript package managers to use the StepSecurity Community Secure Registry. Its default protections delay newly published package versions for two days and block versions known to be compromised. Harden-Runner Insights records package requests and shows whether they were allowed, held by the cooldown, or blocked.\u003c/p\u003e\n\n\u003cp\u003eUsers can enable the service by placing Harden-Runner first in a job and setting \u003ccode\u003esecure-registry: true\u003c/code\u003e; existing commands such as \u003ccode\u003enpm ci\u003c/code\u003e remain unchanged. The first release supports npm, pnpm, and Bun, and the community registry is hosted at \u003ccode\u003ecommunity.registry.stepsecurity.io/javascript/\u003c/code\u003e. The article’s example workflow allowed \u003ccode\u003eis-number@7.0.0\u003c/code\u003e, blocked a recent TypeScript development version because it was within the two-day cooldown, and blocked \u003ccode\u003echalk@5.6.1\u003c/code\u003e as a known compromised package. Cached dependencies are not checked, and packages using another preconfigured npm registry are left unchanged and are not evaluated by Secure Registry.\u003c/p\u003e\n"},{"n":53,"title":"When the Cold Chain Becomes the Attack Surface","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/when-the-cold-chain-becomes-the-attack-surface/","time":"13:43","priority":"MAY READ","score":55,"tldr":"Cyber incidents manipulating commercial refrigeration controls in Europe demonstrate that cold-chain systems can create serious risks for healthcare, including disruption or loss of temperature-sensitive critical products. Health organizations should treat connected refrigeration and third-party suppliers as part of their cyber-physical attack surface.","briefOverview":"\u003cp\u003eCommercial refrigeration systems across Europe were affected by a series of cyber incidents. Attackers manipulated refrigeration controls, including temperature and defrost settings. The disruptions forced retailers in several countries to discard refrigerated and frozen products.\u003c/p\u003e\n\n\u003cp\u003eEuropean authorities described the incidents as widespread enough to require coordinated monitoring and rapid information sharing across Member States. The article says that the same type of incident then reached the health sector. It warns that refrigeration systems can affect critical health products and highlights the broader cyber-physical risks posed by third parties and a larger-than-expected attack surface.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Commercial refrigeration systems across Europe were affected by cyber incidents in which attackers manipulated controls such as temperature and defrost settings.","The incidents disrupted retailers in several countries and forced them to discard refrigerated and frozen products.","European authorities considered the incidents widespread enough to require coordinated monitoring and rapid information sharing across Member States.","The article states that the same type of incident later reached the health sector.","The article presents the incidents as a warning that cybersecurity problems involving refrigeration can affect critical health products."],"insights":["Systems that control refrigeration, which may not traditionally be viewed as cybersecurity systems, can create direct physical consequences when their settings are manipulated.","The incidents show how disruption can move from spoiled retail food to risks involving critical health products when similar refrigeration systems are affected.","The need for coordinated monitoring and rapid information sharing across European Member States indicates that the incidents were not isolated to a single retailer or country.","The article highlights that third parties can materially affect the security equation for health-sector cold-chain operations."],"referencedReports":[],"body":"\u003cp\u003eCommercial refrigeration systems across Europe were affected by a series of cyber incidents. Attackers manipulated refrigeration controls, including temperature and defrost settings. The disruptions forced retailers in several countries to discard refrigerated and frozen products.\u003c/p\u003e\n\n\u003cp\u003eEuropean authorities described the incidents as widespread enough to require coordinated monitoring and rapid information sharing across Member States. The article says that the same type of incident then reached the health sector. It warns that refrigeration systems can affect critical health products and highlights the broader cyber-physical risks posed by third parties and a larger-than-expected attack surface.\u003c/p\u003e\n"},{"n":3,"title":"From Deepfakes to Helpdesk Impersonation: Why Stronger Verification Matters","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/from-deepfakes-to-helpdesk-impersonation-why-stronger-verification-matters/","time":"15:00","priority":"MAY READ","score":48,"tldr":"Deepfakes and helpdesk impersonation are making social-engineering attacks more convincing, enabling attackers to trigger fraudulent payments, gain remote access, or reset accounts. Organizations should use strong identity verification, independent confirmation for sensitive actions, and phishing-resistant MFA rather than relying on employees to spot impostors.","briefOverview":"\u003cp\u003eThe article examines how deepfakes, helpdesk impersonation, and social engineering can be used to obtain money or access. In January 2024, an Arup finance employee transferred approximately HK\u003cspan class=\"math inline\"\u003e\\(200 million (US\\)\u003c/span\u003e25.6 million) after joining a fake video conference that appeared to include the company’s CFO and colleagues. Hong Kong police said attackers used publicly available video and audio to create a convincing pre-recorded conference. In April 2025, Marks \u0026amp; Spencer suffered a major cyberattack after attackers deceived employees at a third-party contractor, disrupting services and resulting in customer-data theft.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also reported a campaign in which attackers impersonated IT support personnel through Teams messages or calls and persuaded employees to grant remote access through screen sharing or Quick Assist. Once connected, the attackers used PowerShell to install malicious software, retain access, and gather information about the compromised network, including attempts to move toward domain controllers and certificate authorities. The article argues that employees cannot be expected to identify every convincing impersonation attempt, particularly when attackers use familiar communication channels and conduct reconnaissance. It recommends stronger identity checks for service-desk requests, independent confirmation for sensitive actions such as payments and privileged access, and consistent verification in chatbots and automated workflows.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An Arup finance employee transferred about HK$200 million (US$25.6 million) after a fake video conference appeared to show the company’s CFO and colleagues requesting transactions.","Marks \u0026 Spencer said attackers gained entry through employees at a third-party contractor, and the April 2025 incident disrupted online orders, payments, Click \u0026 Collect services, and exposed customer data.","Microsoft reported a campaign in which attackers posing as IT support staff used Teams messages or calls to persuade employees to grant remote access through screen sharing or Quick Assist.","The article recommends stronger identity verification for service-desk and business-workflow requests, as well as independent confirmation for financial transactions, privileged access, and other sensitive actions."],"insights":["A convincing impersonation does not require a technical flaw in a company’s own systems; the M\u0026S incident involved attackers deceiving staff at a third-party contractor.","Routine processes such as password resets and remote support can become entry points when identity checks rely on information that attackers may already have obtained.","Employee awareness training alone is not presented as sufficient, because attackers can research targets and make fraudulent requests appear routine.","Identity verification can be built into service desks, chatbots, and automated workflows so that the same checks apply across support channels."],"referencedReports":[{"title":"Impersonating IT support: Threat actors turn remote session into enterprise-wide access","url":"https://www.microsoft.com/en-us/security/blog/2026/09/02/impersonating-it-support-threat-actors-turn-remote-session-into-enterprise-wide-access/","publisher":"microsoft","context":"The article cites Microsoft’s report on a campaign where attackers impersonated IT support staff through Microsoft Teams to obtain remote access.","category":"research","primary":false}],"body":"\u003cp\u003eThe article examines how deepfakes, helpdesk impersonation, and social engineering can be used to obtain money or access. In January 2024, an Arup finance employee transferred approximately HK\u003cspan class=\"math inline\"\u003e\\(200 million (US\\)\u003c/span\u003e25.6 million) after joining a fake video conference that appeared to include the company’s CFO and colleagues. Hong Kong police said attackers used publicly available video and audio to create a convincing pre-recorded conference. In April 2025, Marks \u0026amp; Spencer suffered a major cyberattack after attackers deceived employees at a third-party contractor, disrupting services and resulting in customer-data theft.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also reported a campaign in which attackers impersonated IT support personnel through Teams messages or calls and persuaded employees to grant remote access through screen sharing or Quick Assist. Once connected, the attackers used PowerShell to install malicious software, retain access, and gather information about the compromised network, including attempts to move toward domain controllers and certificate authorities. The article argues that employees cannot be expected to identify every convincing impersonation attempt, particularly when attackers use familiar communication channels and conduct reconnaissance. It recommends stronger identity checks for service-desk requests, independent confirmation for sensitive actions such as payments and privileged access, and consistent verification in chatbots and automated workflows.\u003c/p\u003e\n"},{"n":20,"title":"Quality Isn’t The Main Worry About AI Pentesting — Data Privacy and Production Safety Are","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/quality-isnt-main-worry-about-ai.html","time":"11:03","priority":"MAY READ","score":45,"tldr":"Intruder’s survey of 500 US and UK security and engineering leaders finds that AI pentesting is being adopted rapidly to close the gap between frequent software releases and infrequent manual tests. The main adoption concerns are data privacy, safety in production, and auditable, reproducible validation—not the quality of AI testing itself.","briefOverview":"\u003cp\u003eIntruder surveyed 500 security and engineering leaders in the United States and United Kingdom on AI pentesting adoption and needs. The survey found that 68% of organizations deploy code to production at least daily, while 47% go more than a month between full tests of their web applications and APIs. Only 4% of security leaders believe their current testing frequency provides sufficient coverage, and 42% say they ship code without additional security checks between pentests.\u003c/p\u003e\n\n\u003cp\u003eAI pentesting is already used across the environment by 55% of respondents, while 36% have tried it without scaling adoption. The leading barriers are data privacy, safety on production systems, and whether auditors and regulators will accept AI pentest reports, rather than testing quality itself. Teams also report substantial time spent validating findings: 56% spend six or more hours a week triaging false positives, while 90% agree that the traditional annual pentest is no longer enough to keep pace with software releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Intruder surveyed 500 security and engineering leaders in the United States and United Kingdom about AI pentesting adoption and concerns.","Although 68% of organizations deploy production code at least daily, 47% go more than a month between full web application and API pentests, and only 4% believe their present testing frequency provides sufficient coverage.","Data privacy (40%), production-system safety (36%), and regulatory or auditor acceptance of AI pentest reports (28%) were cited as bigger adoption barriers than AI testing quality.","Fifty-five percent of organizations report using AI pentesting across their environment, while 36% have tried it without yet adopting it at scale.","Fifty-six percent of teams spend at least six hours per week validating security-tool findings, and 90% of surveyed leaders agree that a traditional annual pentest is dead."],"insights":["The central trust problem for AI pentesting is not primarily whether it can find issues, but whether teams can see what it tested and obtain reproducible proof that a reported issue can actually be used.","Organizations with the fastest release cycles face a structural coverage gap: human-led full pentests cannot realistically run as often as code is deployed, leaving changes untested for weeks or months.","False-positive validation is a major operational cost, with more than half of teams spending at least six hours each week deciding whether security-tool findings are real.","Even after a fix is released, many organizations do not independently verify it in production immediately, meaning they may not know whether the weakness has actually been removed for up to two weeks.","Manual pentesting is increasingly expected to serve assurance and audit needs rather than remain the main method for ongoing security validation."],"referencedReports":[],"body":"\u003cp\u003eIntruder surveyed 500 security and engineering leaders in the United States and United Kingdom on AI pentesting adoption and needs. The survey found that 68% of organizations deploy code to production at least daily, while 47% go more than a month between full tests of their web applications and APIs. Only 4% of security leaders believe their current testing frequency provides sufficient coverage, and 42% say they ship code without additional security checks between pentests.\u003c/p\u003e\n\n\u003cp\u003eAI pentesting is already used across the environment by 55% of respondents, while 36% have tried it without scaling adoption. The leading barriers are data privacy, safety on production systems, and whether auditors and regulators will accept AI pentest reports, rather than testing quality itself. Teams also report substantial time spent validating findings: 56% spend six or more hours a week triaging false positives, while 90% agree that the traditional annual pentest is no longer enough to keep pace with software releases.\u003c/p\u003e\n"},{"n":49,"title":"Protecting where software gets built: StepSecurity’s $20 million Series A","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/stepsecurity-20-million-series-a","time":"16:24","priority":"MAY READ","score":45,"tldr":"StepSecurity announced an oversubscribed $20 million Series A to expand its software supply-chain security platform, including protections for developer machines, package downloads, CI/CD pipelines, and AI agent sandboxes. The company cites accelerating malicious-dependency and developer-tool attacks as driving demand for layered defenses across where software is built.","briefOverview":"\u003cp\u003eStepSecurity announced an oversubscribed $20 million Series A led by Elephant, with participation from Runtime Ventures, Inner Loop Capital, and SaaS Ventures. The company said its annual recurring revenue grew 5× in 2024 and again in 2025, and had already exceeded that growth level in 2026 to date. It plans to use the funding for product and engineering, security research, and sales and marketing.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity’s platform is designed to protect the places where software is built, including developer machines, code repositories, package downloads, and CI/CD pipelines. Its Harden-Runner tool monitors processes, outbound network connections, and file changes during builds, while Secure Registry can block known compromised package versions and delay newly published releases for review. The company said it will also extend protection to AI agent sandboxes, arguing that malicious packages can run on workstations, build runners, or agent environments and steal credentials without ever reaching production.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity announced an oversubscribed $20 million Series A led by Elephant, with participation from Runtime Ventures, Inner Loop Capital, and SaaS Ventures.","The company said its annual recurring revenue grew fivefold in 2024 and 2025 and had already exceeded fivefold growth in 2026 to date.","More than 20,000 open-source projects use StepSecurity’s Harden-Runner community tier, which monitors CI/CD build activity and can restrict build connections to external endpoints.","StepSecurity launched a free Secure Registry community tier for public repositories using Harden-Runner, allowing users to apply policies intended to block compromised packages.","The funding will support product development, security research, sales, and marketing, including expanded protection for AI agent sandboxes."],"insights":["A compromised software package can cause serious harm without ever reaching a live customer-facing system, because it may run on a developer’s computer or in an automated build process and steal credentials there.","StepSecurity says telemetry from public open-source build processes helped it identify unexpected network connections associated with the tj-actions compromise and malicious axios releases, showing that community usage also contributes to detection capability.","The company’s Secure Registry uses a configurable delay for newly published package versions, giving time for malicious behavior to be discovered before those versions are installed.","The article argues that AI expands supply-chain exposure beyond software engineers because AI agents may download and execute open-source packages while performing tasks for general knowledge workers.","StepSecurity reported that Team PCP stole 78,330 secrets from 2,186 organizations during a five-day campaign in March 2026, illustrating how one supply-chain campaign can affect many organizations quickly."],"referencedReports":[{"title":"Claude Code Extension Security Notice","url":"https://cursor.com/blog/claude-code-extension-security-notice","publisher":"cursor","context":"The article cites Cursor’s security notice as an example of tampered Claude Code extensions attempting to install persistent SSH backdoors.","category":"advisory","primary":false},{"title":"29 October Binance Security Incident: Initial Findings and Response","url":"https://www.linkedin.com/pulse/29-october-binance-security-incident-initial-findings-response-modgf/","publisher":"binance","context":"The article cites Binance’s initial findings to describe a breach traced from a malicious interview assignment through compromised developer tooling to stolen deployment credentials.","category":"advisory","primary":false}],"body":"\u003cp\u003eStepSecurity announced an oversubscribed $20 million Series A led by Elephant, with participation from Runtime Ventures, Inner Loop Capital, and SaaS Ventures. The company said its annual recurring revenue grew 5× in 2024 and again in 2025, and had already exceeded that growth level in 2026 to date. It plans to use the funding for product and engineering, security research, and sales and marketing.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity’s platform is designed to protect the places where software is built, including developer machines, code repositories, package downloads, and CI/CD pipelines. Its Harden-Runner tool monitors processes, outbound network connections, and file changes during builds, while Secure Registry can block known compromised package versions and delay newly published releases for review. The company said it will also extend protection to AI agent sandboxes, arguing that malicious packages can run on workstations, build runners, or agent environments and steal credentials without ever reaching production.\u003c/p\u003e\n"},{"n":51,"title":"Threat Hunting On The Network: An Active Search for Risks on the Wire","source":"blackhillsinfosec.com","sourceColorIdx":2,"link":"https://www.blackhillsinfosec.com/threat-hunting-network/","time":"21:57","priority":"MAY READ","score":45,"tldr":"Network threat hunting proactively identifies malicious behavior by analyzing flow records, proxy and VPN logs, and packet captures for anomalies that static perimeter signatures may miss. Start with available tools and a focused protocol, using behavioral baselines to investigate unusual internal and external traffic.","briefOverview":"\u003cp\u003eNetwork threat hunting is the active search for malicious activity in network packet data, as distinct from endpoint hunting, which relies more heavily on logs. It is intended to find risks that firewalls and intrusion detection or prevention systems may miss when adversaries change techniques faster than static signatures and intelligence updates can keep pace. Rather than examining every packet manually, hunters can use network information to identify suspicious patterns.\u003c/p\u003e\n\n\u003cp\u003eBehavioral analysis compares activity with normal network baselines to detect unexpected protocols, traffic flows, and access patterns. Relevant data sources include NetFlow or IPFIX records, HTTP/HTTPS proxy logs, VPN appliance logs, and full packet captures, while tools named include SIEM platforms, Elasticsearch and Kibana, Zeek with RITA, Arkime, and Wireshark or TShark. Useful indicators include unusual port use, DNS anomalies, failed authentication attempts, certificate or TLS anomalies, and unusual internal activity such as unexpected SSH access or large overnight downloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Network threat hunting actively searches packet data for malicious activity, while endpoint threat hunting relies more heavily on logs.","Firewalls and intrusion detection or prevention systems can miss threats because adversaries evolve faster than static signatures and vendor or threat-intelligence updates.","Behavioral analysis uses network baselines to identify unexpected protocols and traffic flows rather than relying only on byte sequences, file hashes, and documented exploits.","Useful network-hunting data sources include flow records, proxy logs, VPN logs, and full packet captures.","Hunters should examine internal traffic as well as external traffic for unusual activity, such as unexpected SSH access or large overnight downloads."],"insights":["A network hunter does not need to manually inspect every captured packet; flow records, indexed packet tools, and focused searches can narrow the investigation.","Behavioral hunting can remain effective even when threat actors change their tools and procedures because their activity still produces fundamental network behaviors.","Internal traffic can be as important to investigate as inbound traffic, since unusual employee access patterns or large off-hours transfers may reveal risk.","Beginning with one protocol and tools already available is presented as a practical way for less-experienced analysts to start threat hunting."],"referencedReports":[],"body":"\u003cp\u003eNetwork threat hunting is the active search for malicious activity in network packet data, as distinct from endpoint hunting, which relies more heavily on logs. It is intended to find risks that firewalls and intrusion detection or prevention systems may miss when adversaries change techniques faster than static signatures and intelligence updates can keep pace. Rather than examining every packet manually, hunters can use network information to identify suspicious patterns.\u003c/p\u003e\n\n\u003cp\u003eBehavioral analysis compares activity with normal network baselines to detect unexpected protocols, traffic flows, and access patterns. Relevant data sources include NetFlow or IPFIX records, HTTP/HTTPS proxy logs, VPN appliance logs, and full packet captures, while tools named include SIEM platforms, Elasticsearch and Kibana, Zeek with RITA, Arkime, and Wireshark or TShark. Useful indicators include unusual port use, DNS anomalies, failed authentication attempts, certificate or TLS anomalies, and unusual internal activity such as unexpected SSH access or large overnight downloads.\u003c/p\u003e\n"},{"n":54,"title":"Health-ISAC Daily Cyber Headlines – November 18, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-18-2026/","time":"09:25","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 18 roundup highlights active exploitation of critical Confluence and Java vulnerabilities alongside healthcare-focused espionage, a major dental-data breach, and software supply-chain credential theft. The reporting underscores escalating risk to health-sector organizations and critical research infrastructure.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 18, 2026 daily cyber headlines roundup covers active exploitation of a critical Atlassian Confluence remote-code-execution issue and a critical Java4Shell flaw that enables remote code execution in major Java applications. It also highlights malicious Microsoft Agent Framework packages on PyPI that steal Azure and continuous-integration credentials. The roundup identifies attacks on research and software-development environments as key concerns.\u003c/p\u003e\n\n\u003cp\u003eThe article includes an Access Dental Management data breach affecting more than 340,000 individuals and reports that state-linked cyberespionage targeting the health sector has reached a new high. Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack. It also notes that the French National Assembly approved legislation intended to strengthen cybersecurity and critical-infrastructure resilience.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 18, 2026 daily roundup reports active exploitation of a critical Atlassian Confluence remote-code-execution flaw.","The roundup includes a data breach at Access Dental Management that exposed information belonging to more than 340,000 individuals.","Malicious packages impersonating Microsoft’s Agent Framework were published on PyPI and steal Azure and continuous-integration credentials.","The article reports that state-linked cyberespionage targeting the health sector has reached a new high.","Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack."],"insights":["The roundup links risks across healthcare providers, research institutions, and software-development environments rather than focusing on a single type of organization.","Credential theft through malicious PyPI packages is specifically tied to both Azure and continuous-integration environments, showing that a software package issue can affect cloud and development access.","The items span immediate technical threats, including active Confluence exploitation and Java remote-code execution, alongside policy action through proposed French critical-infrastructure resilience legislation.","Health-sector exposure is presented as both a personal-data issue, through the Access Dental Management breach, and a state-linked espionage concern."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 18, 2026 daily cyber headlines roundup covers active exploitation of a critical Atlassian Confluence remote-code-execution issue and a critical Java4Shell flaw that enables remote code execution in major Java applications. It also highlights malicious Microsoft Agent Framework packages on PyPI that steal Azure and continuous-integration credentials. The roundup identifies attacks on research and software-development environments as key concerns.\u003c/p\u003e\n\n\u003cp\u003eThe article includes an Access Dental Management data breach affecting more than 340,000 individuals and reports that state-linked cyberespionage targeting the health sector has reached a new high. Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack. It also notes that the French National Assembly approved legislation intended to strengthen cybersecurity and critical-infrastructure resilience.\u003c/p\u003e\n"},{"n":27,"title":"AI Pentesting Checklist for Web Apps: 15 Questions to Ask Before Choosing a Vendor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ai-pentesting-checklist-for-web-apps-15.html","time":"12:15","priority":"MAY READ","score":35,"tldr":"This sponsored article promotes a 15-question checklist for evaluating AI pentesting vendors, urging buyers to run controlled bake-offs on their own applications rather than rely on demos. It emphasizes verified findings, logged-in workflow coverage, production safety guardrails, and retesting.","briefOverview":"\u003cp\u003eThis sponsored article promotes a 15-question checklist for organizations choosing an AI pentesting vendor for web applications. It argues that attackers are moving quickly, citing VulnCheck data that 23% of vulnerabilities added to its exploited list in the first half of 2026 were exploited on or before the disclosure date. The article says vendors that appear similar in demonstrations can differ substantially in their ability to test logged-in workflows, show coverage, validate findings, and operate safely in production.\u003c/p\u003e\n\n\u003cp\u003eIt recommends a same-target, same-week vendor bake-off using the buyer’s own application, test accounts, and scope. Buyers are advised to determine whether an agent has retained knowledge of the application, continues discovering beyond an initial map, reproduces suspected flaws with verifiable evidence, and has guardrails that limit production testing. The article also recommends logging access, discovery, and first-test timestamps, and scoring vendors with its promoted 36-point scorecard covering areas such as attack chaining, role-based access, data handling, safety controls, and retesting.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that attackers are exploiting some vulnerabilities on or before their public disclosure date, citing VulnCheck’s finding that this applied to 23% of additions to its exploited list in the first half of 2026.","It argues that AI pentesting vendors should be tested on a buyer’s own web application because demos may not reveal whether an agent can navigate logged-in workflows, demonstrate coverage, or operate safely in production.","The article says buyers should ask whether an AI agent starts each test from scratch or uses and updates an existing model of the website, while continuing to discover beyond its starting map.","It recommends requiring agents to reproduce suspected issues and provide evidence that a security team can verify, rather than reporting unconfirmed suspicious patterns.","The article promotes a 15-question checklist and 36-point scorecard for comparing AI pentesting vendors through a same-target, same-week bake-off."],"insights":["A preexisting, continuously updated model of a website can save the substantial reconnaissance and analysis effort that CyCognito estimates at 20 to 30 hours of a 63-to-95-hour manual pentest, but the article cautions that this model should not limit further discovery.","The article highlights that AI-assisted analysis may miss issues when focused narrowly on code or conventional testing; examining how parts of a deployment trust one another led to discovery of an unauthenticated Apache Airflow RCE, CVE-2026-68982.","A vendor comparison can separate setup speed from testing effectiveness by recording three distinct milestones: when access is granted, when discovery finishes, and when the first test begins.","The article presents a concrete production-safety test: after an AI agent demonstrated that an insurer’s one-time-passcode process could send login codes to arbitrary email addresses, guardrails stopped further testing.","Google’s Threat Intelligence Group identified a threat actor’s use of AI to develop a zero-day 2FA bypass involving a logic flaw that conventional fuzzing and static analysis could miss."],"referencedReports":[{"title":"State of Exploitation: 1H 2026","url":"https://www.vulncheck.com/blog/state-of-exploitation-1h-2026","publisher":"vulncheck","context":"The article cites VulnCheck’s analysis that 23% of vulnerabilities added to its exploited list in the first half of 2026 were exploited on or before their disclosure date.","category":"research","primary":false},{"title":"AI Vulnerability Exploitation for Initial Access","url":"https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access","publisher":"google-threat-intelligence-group","context":"The article references Google Threat Intelligence Group’s analysis of a threat actor it believes used AI to develop a zero-day two-factor-authentication bypass.","category":"research","primary":false},{"title":"Scale Your Pen Testing and Red Team Operations","url":"https://www.cycognito.com/documents/briefs/solution-brief-scale-your-pen-testing-and-red-team-operations.pdf","publisher":"cycognito","context":"The article cites CyCognito’s model estimating that reconnaissance and analysis account for 20 to 30 hours of a 63-to-95-hour manual penetration test.","category":"research","primary":false}],"body":"\u003cp\u003eThis sponsored article promotes a 15-question checklist for organizations choosing an AI pentesting vendor for web applications. It argues that attackers are moving quickly, citing VulnCheck data that 23% of vulnerabilities added to its exploited list in the first half of 2026 were exploited on or before the disclosure date. The article says vendors that appear similar in demonstrations can differ substantially in their ability to test logged-in workflows, show coverage, validate findings, and operate safely in production.\u003c/p\u003e\n\n\u003cp\u003eIt recommends a same-target, same-week vendor bake-off using the buyer’s own application, test accounts, and scope. Buyers are advised to determine whether an agent has retained knowledge of the application, continues discovering beyond an initial map, reproduces suspected flaws with verifiable evidence, and has guardrails that limit production testing. The article also recommends logging access, discovery, and first-test timestamps, and scoring vendors with its promoted 36-point scorecard covering areas such as attack chaining, role-based access, data handling, safety controls, and retesting.\u003c/p\u003e\n"},{"n":56,"title":"DORA: From Policies to Evidence of Resilience | Corelight URL slug: dora-operational-resilience-evidence","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/dora-operational-resilience-evidence","time":"21:31","priority":"MAY READ","score":35,"tldr":"Corelight argues that organizations subject to the EU’s Digital Operational Resilience Act (DORA) should move beyond policy compliance and produce continuous, verifiable evidence of operational resilience through network visibility and security telemetry.","briefOverview":"\u003cp\u003eThe article is titled “DORA: From Policies to Evidence of Resilience.” It concerns DORA and the idea of demonstrating operational resilience with evidence. The title presents a shift from written policies toward proof of resilience.\u003c/p\u003e\n\n\u003cp\u003eThe article is associated with Corelight, as indicated by the included Corelight URL slug. Its central theme is operational resilience in the context of DORA. The available article text does not provide readable technical details, named affected organizations, or specific impacts beyond that framing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article focuses on DORA and operational resilience.","It frames resilience as something that should be supported by evidence rather than policies alone.","The article is associated with Corelight through its URL slug."],"insights":["The article’s title frames operational resilience as requiring evidence, rather than relying only on policies.","The article is presented as a Corelight piece, as indicated by the Corelight URL slug included in the title."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “DORA: From Policies to Evidence of Resilience.” It concerns DORA and the idea of demonstrating operational resilience with evidence. The title presents a shift from written policies toward proof of resilience.\u003c/p\u003e\n\n\u003cp\u003eThe article is associated with Corelight, as indicated by the included Corelight URL slug. Its central theme is operational resilience in the context of DORA. The available article text does not provide readable technical details, named affected organizations, or specific impacts beyond that framing.\u003c/p\u003e\n"},{"n":55,"title":"Cyber Crisis Plans That Fail When It Matters Most","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/cyber-crisis-plans-that-fail-when-it-matters-most/","time":"19:18","priority":"MAY READ","score":25,"tldr":"Semperis and Health-ISAC promote a recorded webinar on why healthcare cyber crisis plans often fail during real incidents, including identity risks amplified by AI and common resilience gaps.","briefOverview":"\u003cp\u003eHealth-ISAC published a resource promoting a recorded webinar by Semperis, identified as a Health-ISAC Community Services Champion. The webinar is titled “Cyber Crisis Plans That Fail When It Matters Most.” It draws on global research and direct incident-response experience to examine failures in healthcare cyber plans.\u003c/p\u003e\n\n\u003cp\u003eThe webinar addresses why established response plans can fail during real disruptions and what is needed for operational resilience. It also covers how AI adoption is expanding identity-related vulnerabilities. Semperis says the session identifies five common healthcare cyber-crisis-management failure modes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article promotes a recorded webinar by Semperis, a Health-ISAC Community Services Champion.","The webinar examines where healthcare cyber plans break down during real disruptions.","The webinar draws on global research and direct incident response experience.","It covers how AI adoption is expanding identity-related vulnerabilities.","It identifies five common cyber crisis management failure modes in healthcare."],"insights":["An established cyber response plan may still fail during a real-world disruption, making practical operational resilience a distinct concern.","AI adoption is presented as expanding vulnerabilities related to identity, so crisis planning must account for identity-related risks."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published a resource promoting a recorded webinar by Semperis, identified as a Health-ISAC Community Services Champion. The webinar is titled “Cyber Crisis Plans That Fail When It Matters Most.” It draws on global research and direct incident-response experience to examine failures in healthcare cyber plans.\u003c/p\u003e\n\n\u003cp\u003eThe webinar addresses why established response plans can fail during real disruptions and what is needed for operational resilience. It also covers how AI adoption is expanding identity-related vulnerabilities. Semperis says the session identifies five common healthcare cyber-crisis-management failure modes.\u003c/p\u003e\n"}]</script>
