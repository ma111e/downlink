<script type="application/json" id="dl-articles">[{"n":17,"title":"Critical Apache Roller RCE Flaw Under Active Exploitation, No Authentication Required","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-apache-roller-rce-flaw-under.html","time":"17:10","priority":"MUST READ","score":96,"tldr":"Apache Roller versions 4.0.0 through 6.1.4 contain a critical, actively exploited unauthenticated XML-RPC deserialization flaw (CVE-2026-129448) that enables remote code execution. Organizations should upgrade to Roller 6.1.6 or later, or immediately disable the XML-RPC extension endpoint.","briefOverview":"\u003cp\u003eA critical Apache Roller vulnerability, CVE-2026-129448, is under active exploitation, according to the Apache Software Foundation. The issue has a CVSS score of 9.8 and affects Apache Roller versions 4.0.0 through 6.1.4. It allows an unauthenticated remote attacker to execute arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is located in the XML-RPC endpoint, which accepts and processes vendor extension types before authenticating the requester. Apache said the issue is the same as CVE-2026-82384, which was previously patched in September 2026 with only Roller 6.1.5 listed as affected. Users should upgrade to Apache Roller 6.1.6 or later, or, if patching is not immediately possible, disable extension types or remove the XML-RPC servlet mapping and restart Roller.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apache Roller versions 4.0.0 through 6.1.4 are affected by CVE-2026-129448, a critical unauthenticated deserialization flaw with a CVSS score of 9.8.","The XML-RPC endpoint accepts vendor extension types and processes them before verifying the requester, allowing an unauthenticated remote attacker to execute arbitrary code.","The Apache Software Foundation said the issue is being actively exploited, but did not disclose exploitation details or targets.","Apache Roller 6.1.6 and later disable extension types and reject XML-RPC requests when XML-RPC is disabled.","As temporary mitigations, Apache recommends setting enabledForExtensions to false in WEB-INF/web.xml or removing the /roller-services/xmlrpc servlet mapping and restarting Roller."],"insights":["Turning off XML-RPC through Apache Roller's administration interface does not protect older versions, because they process the malicious request before checking that setting.","The issue was previously tracked as CVE-2026-82384 with only Roller 6.1.5 listed as affected, but Apache now says it is the same flaw and that versions 4.0.0 through 6.1.4 are vulnerable.","Organizations unable to patch immediately can reduce exposure by disabling extension types in WEB-INF/web.xml or removing the XML-RPC servlet mapping, then restarting Roller."],"referencedReports":[{"title":"Apache Roller CVE-2026-129448 security advisory","url":"https://lists.apache.org/thread/lnz4s26tv6hdo03wngtdbpfj4hg4gtds","publisher":"apache-software-foundation","context":"Apache Roller maintainers describe the unauthenticated deserialization issue, affected versions, and mitigation guidance in this linked advisory notice.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical Apache Roller vulnerability, CVE-2026-129448, is under active exploitation, according to the Apache Software Foundation. The issue has a CVSS score of 9.8 and affects Apache Roller versions 4.0.0 through 6.1.4. It allows an unauthenticated remote attacker to execute arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is located in the XML-RPC endpoint, which accepts and processes vendor extension types before authenticating the requester. Apache said the issue is the same as CVE-2026-82384, which was previously patched in September 2026 with only Roller 6.1.5 listed as affected. Users should upgrade to Apache Roller 6.1.6 or later, or, if patching is not immediately possible, disable extension types or remove the XML-RPC servlet mapping and restart Roller.\u003c/p\u003e\n"},{"n":25,"title":"Hackers Exploiting Critical Puppet RCE Flaw Affecting Enterprise Management Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploiting-critical-puppet-rce.html","time":"08:24","priority":"MUST READ","score":96,"tldr":"CISA has added actively exploited CVE-2026-115731, a critical Puppet deserialization flaw that enables remote code execution on Puppet servers, to its KEV catalog. Organizations using affected Puppet Enterprise, Puppet Core, or OpenVox versions should upgrade immediately, as compromise could enable control of managed infrastructure.","briefOverview":"\u003cp\u003eCISA added CVE-2026-115731, a critical Perforce Puppet flaw with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue affects Puppet\u0026rsquo;s report-processing code and can allow a client with a certificate signed by the certificate authority to execute arbitrary code on a Puppet Server under the service account. If certificate requests are automatically approved without strong verification, an unauthenticated network attacker may be able to obtain a valid certificate and use the flaw.\u003c/p\u003e\n\n\u003cp\u003eAffected software includes specified Puppet Enterprise, Puppet Core, and OpenVox releases, and fixes are available from Perforce and OpenVox. Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox. Neodyme said that control of a Puppet Server could enable theft of certificate-authority signing keys and impersonation of other hosts, while Puppet\u0026rsquo;s central access to corporate systems could make ransomware deployment, mass data theft, and movement across a network possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-115731, a critical Puppet vulnerability with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","The flaw is caused by unsafe handling of untrusted data in Puppet report processing and can allow a client with a CA-signed agent certificate to run arbitrary code on the Puppet Server service account.","Affected releases include Puppet Enterprise, Puppet Core, and OpenVox, and fixes are available in Puppet Enterprise 2026.0.1, 2025.12.1, and 2023.8.13; Puppet Core 9.1.3 and 8.22.2; and specified OpenVox releases.","Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox.","CISA directed U.S. Federal Civilian Executive Branch agencies to apply fixes for CVE-2026-115731 by December 1, 2026."],"insights":["A Puppet certificate authority that automatically approves requests without strong checks can allow an unauthenticated network attacker to obtain the certificate needed to exploit CVE-2026-115731.","Successful code execution on a Puppet Server could allow an attacker to steal the certificate-authority signing keys and impersonate other managed hosts.","The reported impact depends on the Puppet Server configuration and whether orchestration protocols are enabled, but code execution on the server remains serious in any configuration.","A Reddit user reported tracing an intrusion involving CVE-2026-115731 after finding a severely misconfigured certificate authority shortly after the vulnerability’s public disclosure."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites this CISA alert for the addition of CVE-2026-115731 to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Report Deserialization Code Execution","url":"https://portal.perforce.com/s/cve/a91Qi000003IaHpIAK/report-deserialization-code-execution","publisher":"perforce","context":"The article links to Perforce's vulnerability advisory for affected Puppet versions and available fixes for CVE-2026-115731.","category":"advisory","primary":true},{"title":"Critical CVE Updates","url":"https://voxpupuli.org/blog/2026/11/03/critical-cve-updates/","publisher":"voxpupuli","context":"The article references this OpenVox update regarding the impact of the issues and resolved OpenVox releases.","category":"advisory","primary":false},{"title":"Certificate Name Authorization Bypass","url":"https://portal.perforce.com/s/cve/a91Qi000003IaJRIA0/certificate-name-authorization-bypass","publisher":"perforce","context":"The article links to Perforce's advisory for CVE-2026-115732, a certificate-name authorization bypass.","category":"advisory","primary":false},{"title":"Puppet RCE","url":"https://neodyme.io/en/blog/puppet_rce/","publisher":"neodyme-ag","context":"The article cites Neodyme's technical report for its assessment of the potential effects of code execution on a Puppet Server.","category":"research","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-115731, a critical Perforce Puppet flaw with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue affects Puppet\u0026rsquo;s report-processing code and can allow a client with a certificate signed by the certificate authority to execute arbitrary code on a Puppet Server under the service account. If certificate requests are automatically approved without strong verification, an unauthenticated network attacker may be able to obtain a valid certificate and use the flaw.\u003c/p\u003e\n\n\u003cp\u003eAffected software includes specified Puppet Enterprise, Puppet Core, and OpenVox releases, and fixes are available from Perforce and OpenVox. Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox. Neodyme said that control of a Puppet Server could enable theft of certificate-authority signing keys and impersonation of other hosts, while Puppet\u0026rsquo;s central access to corporate systems could make ransomware deployment, mass data theft, and movement across a network possible.\u003c/p\u003e\n"},{"n":48,"title":"Microsoft agent-framework PyPI Package Compromised","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/microsoft-agent-framework-pypi-package-compromised","time":"02:57","priority":"MUST READ","score":96,"tldr":"Microsoft's PyPI agent-framework versions 1.26.1 and 1.26.2 were compromised with a Python .pth startup-hook credential stealer that runs on every Python launch, harvests secrets, mints CI/CD and cloud identity tokens, and exfiltrates them to webhook.site. Organizations that installed either version should remove it, pin to 1.26.0, investigate webhook.site egress, and treat all credentials and federated trust available on affected hosts or CI runners as compromised.","briefOverview":"\u003cp\u003eMicrosoft’s \u003ccode\u003eagent-framework\u003c/code\u003e versions 1.26.1 and 1.26.2 were uploaded to PyPI on November 17, 2026 with credential-stealing code and were later quarantined. Version 1.26.2 was uploaded after version 1.26.1 had already been quarantined, indicating that the publishing access used for the releases remained available. The article identifies version 1.26.0, released November 12, as the last clean release. The affected releases were distributed as wheels only and used RestSharp rather than PyPI trusted publishing.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was installed as a Python \u003ccode\u003e.pth\u003c/code\u003e startup hook, causing it to execute whenever Python starts without requiring an import of the affected framework. It collected host details, sensitive environment variables, credential files, and secrets from other running processes, then sent the data to a specified webhook.site endpoint. It also requested fresh identity tokens from GitHub Actions, Azure DevOps, and Azure managed identity services, increasing the potential impact beyond stolen static credentials. The article advises affected organizations to remove the malicious versions, pin to 1.26.0, rotate exposed secrets, review federated cloud trust relationships, and search network logs for connections to webhook.site.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PyPI quarantined Microsoft agent-framework versions 1.26.1 and 1.26.2 after they were found to contain credential-stealing code, while version 1.26.0 is identified as the last clean release.","The malicious packages used a Python startup configuration file that caused the payload to run whenever Python started, without requiring users to import agent-framework.","The payload collected environment variables, credential files, and secrets from other running processes, then sent collected data to a webhook.site endpoint.","Version 1.26.2 added the ability to request fresh identity tokens from GitHub Actions and also targeted Azure DevOps and Azure managed identity token services.","The article advises organizations that installed either affected version to remove the package, pin to version 1.26.0, rotate secrets, review cloud trust relationships, and search network logs for webhook.site connections."],"insights":["The attacker uploaded version 1.26.2 only 2 minutes and 23 seconds after PyPI quarantined version 1.26.1, showing that the publishing access used for the malicious releases remained available after the first response.","Because the payload was installed as a Python startup hook, it could run during any later Python command, such as testing or build tooling, even when agent-framework was never imported.","The payload detached its collection process from the program that launched Python, so it could continue sending data without appearing in CI job output and may outlive the job that triggered it.","The malware could request new short-lived identity tokens from GitHub Actions, Azure DevOps, and Azure managed identity services, meaning changing previously exposed passwords or keys alone does not remove all risk.","The malicious wheels closely copied the legitimate package metadata and changed only the version string, while being uploaded as wheels without source distributions, making ordinary package-page review less likely to reveal the tampering."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft’s \u003ccode\u003eagent-framework\u003c/code\u003e versions 1.26.1 and 1.26.2 were uploaded to PyPI on November 17, 2026 with credential-stealing code and were later quarantined. Version 1.26.2 was uploaded after version 1.26.1 had already been quarantined, indicating that the publishing access used for the releases remained available. The article identifies version 1.26.0, released November 12, as the last clean release. The affected releases were distributed as wheels only and used RestSharp rather than PyPI trusted publishing.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was installed as a Python \u003ccode\u003e.pth\u003c/code\u003e startup hook, causing it to execute whenever Python starts without requiring an import of the affected framework. It collected host details, sensitive environment variables, credential files, and secrets from other running processes, then sent the data to a specified webhook.site endpoint. It also requested fresh identity tokens from GitHub Actions, Azure DevOps, and Azure managed identity services, increasing the potential impact beyond stolen static credentials. The article advises affected organizations to remove the malicious versions, pin to 1.26.0, rotate exposed secrets, review federated cloud trust relationships, and search network logs for connections to webhook.site.\u003c/p\u003e\n"},{"n":46,"title":"MCH and Caishen: supply chain poisoning pushes iOS exploits","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/mch-and-caishen-supply-chain-poisoning-pushes-ios-exploits/","time":"00:33","priority":"MUST READ","score":95,"tldr":"A supply-chain compromise of third-party web scripts, including Optimizely, exposed visitors to major sites such as BBC, Zoom, and CNN to card skimming, crypto-address clipping, page-data theft, and an iOS exploit chain. Researchers linked the operation to the widely deployed MCH/Caishen infrastructure and found the operators rapidly rebuilt hosting after disclosure.","briefOverview":"\u003cp\u003eOn November 16, 2026, poisoned third-party scripts delivered malicious code to visitors of major websites including BBC, Zoom, CNN, DoorDash, Zillow, Fox News, and GitLab. Censys confirmed affected sites through sinkhole referrers and found that an Optimizely script on Zoom loaded \u003ccode\u003etrack.js\u003c/code\u003e from \u003ccode\u003e1688360[.]cc\u003c/code\u003e. Optimizely said an unauthorized party exploited a vulnerability in its Experimentation product to add malicious JavaScript to some customer projects, and said it fixed the issue, removed the injected code, and secured affected accounts.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003etrack.js\u003c/code\u003e payload collected payment-card details, replaced copied cryptocurrency addresses with attacker-controlled wallets, and sent page URLs, cookies, and browser-rendered page images to collection endpoints. It delivered further iOS stages to iPhone, iPad, and touch-screen Mac visitors, while non-iOS visitors received the skimmer, clipper, and page-data collection code without the exploit chain. Censys linked the infrastructure to MCH control panels, a Caishen iOS exploit backend, and cryptocurrency energy-rental storefronts, but noted that the shared channel code was a hard-coded kit default and did not identify a specific operator.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s two staging hosts and implant command-and-control host went offline on November 17, shortly after disclosure, while five new MCH panel hosts appeared within about a day. Blockchain records showed cryptocurrency payments arriving on November 16, with some Tron and Ethereum proceeds moving through commercial services within hours. Censys assessed that the operator likely rented the loader and used existing tooling rather than developing bespoke infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Poisoned third-party scripts delivered a card skimmer, cryptocurrency clipper, page-data collection code, and an iOS payload chain to visitors of sites including BBC, Zoom, CNN, DoorDash, Zillow, Fox News, and GitLab on November 16, 2026.","Optimizely stated that an unauthorized party exploited a flaw in its Experimentation product to add malicious JavaScript to some customer projects, and that it fixed the issue, removed the injected code, and secured affected accounts.","Censys linked the campaign infrastructure to an MCH control panel, a Caishen iOS exploit backend, and cryptocurrency energy-rental storefronts, while noting that the shared channel code was a kit default rather than an identifier of a specific operator.","The campaign’s staging hosts and implant command-and-control host went offline on November 17, 2026, but five new MCH panel hosts appeared on NETSEC-HK within about a day.","Blockchain records cited by Censys show that cryptocurrency received by the campaign’s wallets on November 16 was moved through commercial services within hours in some cases."],"insights":["The 29 KB track.js ran on every page where it was loaded rather than only checkout pages, but captured card data only when relevant payment fields were submitted and passed its Luhn validation check.","The campaign used different behavior by device: desktop visitors received the skimmer, clipboard replacement, and page-data collection, while iPhone, iPad, and touch-screen Mac visitors could be routed to the iOS payload chain.","The shared channel code 02111110 links components to the same kit configuration but cannot identify a particular operator because it is the generator’s hard-coded default and appears across more than a hundred deployments.","The affected delivery route had an embedded fallback payload that could run when the delivery host was blocked, so blocking the known delivery domain alone may not remove the injected code.","The MCH panel and Caishen backend were broadly deployed across unrelated hosts and registrants, indicating that title matches alone are insufficient to attribute a specific deployment to this campaign."],"referencedReports":[{"title":"Poisoned Scripts on BBC, Zoom and Other Major Websites Linked to iPhone Exploit Loaders","url":"https://www.hudsonrock.com/blog/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders","publisher":"hudson-rock","context":"The article identifies Hudson Rock as providing the first report on malicious code delivered through multiple third-party libraries and later cites its description of the iOS stage-loader structure.","category":"news","primary":true},{"title":"CNN, Zoom, Fox News Served Visitors a Crypto-Stealing Skimmer – OPTIMJACK","url":"https://amirulcyber.com/2026/11/16/optimjack-optimizely-skimmer/","publisher":"amirul-cyber","context":"The article says Amirul Cyber tracked the same malicious injection under the name OPTIMJACK.","category":"news","primary":false}],"body":"\u003cp\u003eOn November 16, 2026, poisoned third-party scripts delivered malicious code to visitors of major websites including BBC, Zoom, CNN, DoorDash, Zillow, Fox News, and GitLab. Censys confirmed affected sites through sinkhole referrers and found that an Optimizely script on Zoom loaded \u003ccode\u003etrack.js\u003c/code\u003e from \u003ccode\u003e1688360[.]cc\u003c/code\u003e. Optimizely said an unauthorized party exploited a vulnerability in its Experimentation product to add malicious JavaScript to some customer projects, and said it fixed the issue, removed the injected code, and secured affected accounts.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003etrack.js\u003c/code\u003e payload collected payment-card details, replaced copied cryptocurrency addresses with attacker-controlled wallets, and sent page URLs, cookies, and browser-rendered page images to collection endpoints. It delivered further iOS stages to iPhone, iPad, and touch-screen Mac visitors, while non-iOS visitors received the skimmer, clipper, and page-data collection code without the exploit chain. Censys linked the infrastructure to MCH control panels, a Caishen iOS exploit backend, and cryptocurrency energy-rental storefronts, but noted that the shared channel code was a hard-coded kit default and did not identify a specific operator.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s two staging hosts and implant command-and-control host went offline on November 17, shortly after disclosure, while five new MCH panel hosts appeared within about a day. Blockchain records showed cryptocurrency payments arriving on November 16, with some Tron and Ethereum proceeds moving through commercial services within hours. Censys assessed that the operator likely rented the loader and used existing tooling rather than developing bespoke infrastructure.\u003c/p\u003e\n"},{"n":30,"title":"nginx2root: Critical nginx vulnerabilities, including one RCE [CVE-2026-123007, CVE-2026-123634, CVE-2026-123633, CVE-2026-121810, CVE-2026-113425]","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/nginx2root-critical-nginx-rce-vulnerabilities","time":"17:11","priority":"MUST READ","score":94,"tldr":"Five critical nginx flaws collectively dubbed nginx2root reportedly allow unauthenticated remote command execution in affected configurations, with one impacting HTTP/2-enabled nginx releases from 1.9.5 through 1.31.8. Upgrade to nginx 1.31.9 or 1.30.7 promptly; if patching is delayed, disable the affected HTTP/2, HTTP/3, dynamic proxy, or mail-proxy configurations.","briefOverview":"\u003cp\u003eThe article describes nginx2root, a set of five critical nginx vulnerabilities disclosed on November 18, 2026. It states that each flaw can allow an unauthenticated attacker to run commands on an affected server. The most broadly affected issue, CVE-2026-123007, reportedly affects reachable nginx instances with HTTP/2 enabled in releases from 1.9.5 through 1.31.8.\u003c/p\u003e\n\n\u003cp\u003eThe five flaws affect different configurations, including HTTP/2 or HTTP/3 traffic forwarded to backend servers, dynamic proxy destinations using the DNS resolver, and mail proxy deployments using \u003ccode\u003eproxy on\u003c/code\u003e with \u003ccode\u003eauth_http\u003c/code\u003e. The article says the underlying issues include an integer overflow that can write outside allocated memory and several cases where nginx may continue using data after it has been freed. It recommends upgrading to nginx 1.31.9 or 1.30.7, while warning that Linux distributions may apply fixes without changing the version shown by nginx.\u003c/p\u003e\n\n\u003cp\u003eAs temporary mitigations, the article recommends disabling HTTP/2 for CVE-2026-123007 and CVE-2026-123633, disabling HTTP/3 for CVE-2026-121810, using fixed upstream groups for CVE-2026-123634, and restricting mail proxy listeners for CVE-2026-113425. It also says a Linux SCTP send-path flaw can be chained with any of the nginx flaws to obtain root access on the host, including from a Docker container. Because nginx commonly handles incoming website traffic, the article emphasizes that successful exploitation could give an attacker access to the server rather than only to public web pages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes nginx2root as five critical nginx vulnerabilities disclosed on November 18, 2026, each of which it says can let an unauthenticated attacker run commands on a server.","CVE-2026-123007 affects reachable nginx instances with HTTP/2 enabled from version 1.9.5 through 1.31.8, according to the article.","The article recommends updating nginx to version 1.31.9 on the mainline branch or 1.30.7 on the stable branch, while noting that Linux distributions may backport fixes without changing the displayed nginx version.","Disabling HTTP/2 mitigates CVE-2026-123007 and CVE-2026-123633, but the article states that the other vulnerabilities require different configuration changes or an update.","The article states that a Linux SCTP send-path flaw can be chained with any of the five nginx vulnerabilities to obtain root access on the host, including from within a Docker container."],"insights":["Checking only the nginx version number can be misleading on Ubuntu and Debian because their packages may include backported fixes while still reporting an older upstream version.","For CVE-2026-123634, turning off the mirror feature alone may not be enough because other features that create internal requests, including Server Side Includes, may reach the same DNS resolver flaw.","The article says ingress-nginx is affected by CVE-2026-123633 and will not receive a patch, making disabling HTTP/2 and planning a migration or a fixed nginx build especially important.","After a configuration change, nginx should be reloaded and any remaining old worker processes restarted, or vulnerable workers may still be running.","Blocking the SCTP kernel module with a modprobe rule does not remove it if it is already loaded and does not help when SCTP is built directly into the kernel."],"referencedReports":[{"title":"nginx2root: Remote Code Execution","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article cites Xint's technical write-up as a source for the nginx2root vulnerabilities and notes that Xint researchers reported the five nginx flaws to F5.","category":"research","primary":true}],"body":"\u003cp\u003eThe article describes nginx2root, a set of five critical nginx vulnerabilities disclosed on November 18, 2026. It states that each flaw can allow an unauthenticated attacker to run commands on an affected server. The most broadly affected issue, CVE-2026-123007, reportedly affects reachable nginx instances with HTTP/2 enabled in releases from 1.9.5 through 1.31.8.\u003c/p\u003e\n\n\u003cp\u003eThe five flaws affect different configurations, including HTTP/2 or HTTP/3 traffic forwarded to backend servers, dynamic proxy destinations using the DNS resolver, and mail proxy deployments using \u003ccode\u003eproxy on\u003c/code\u003e with \u003ccode\u003eauth_http\u003c/code\u003e. The article says the underlying issues include an integer overflow that can write outside allocated memory and several cases where nginx may continue using data after it has been freed. It recommends upgrading to nginx 1.31.9 or 1.30.7, while warning that Linux distributions may apply fixes without changing the version shown by nginx.\u003c/p\u003e\n\n\u003cp\u003eAs temporary mitigations, the article recommends disabling HTTP/2 for CVE-2026-123007 and CVE-2026-123633, disabling HTTP/3 for CVE-2026-121810, using fixed upstream groups for CVE-2026-123634, and restricting mail proxy listeners for CVE-2026-113425. It also says a Linux SCTP send-path flaw can be chained with any of the nginx flaws to obtain root access on the host, including from a Docker container. Because nginx commonly handles incoming website traffic, the article emphasizes that successful exploitation could give an attacker access to the server rather than only to public web pages.\u003c/p\u003e\n"},{"n":34,"title":"Java4Shell (CVE-2026-114938): Frequently asked questions about OpenJDK remote code execution vulnerability","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability","time":"02:49","priority":"MUST READ","score":94,"tldr":"CVE-2026-114938 (“Java4Shell”) is a high-severity OpenJDK Base64 decoder memory-corruption flaw that can enable application-specific remote code execution on vulnerable Java deployments running AVX-512 VBMI-capable x86-64 CPUs. Organizations should urgently update to vendor-fixed Java builds or temporarily disable Base64 intrinsics where patching is not immediately possible.","briefOverview":"\u003cp\u003eCVE-2026-114938, known as Java4Shell, is an OpenJDK memory-corruption flaw in Base64 decoding that Oracle scored 8.1 under CVSS 3.1. Calif reported that attackers may be able to read application memory or run code on affected applications without logging in when untrusted data reaches the vulnerable Java interface. Oracle, OpenJDK, CISA, and the Canadian Centre for Cyber Security issued information or fixes on November 17, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable code is a performance optimization used only on affected Java releases running on x86-64 processors with AVX-512 VBMI support; Calif says ARM64 systems are not affected. Calif\u0026rsquo;s testing reported pre-login code execution in default configurations of Keycloak, Atlassian Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, among other application-specific results. Oracle released fixed builds, while Calif and Keycloak identified \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e as an interim option to disable the affected optimization; GreyNoise reported exploitation attempts but had not confirmed successful exploitation against its sensors as of November 18.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-114938, called Java4Shell, is an OpenJDK Base64 decoding memory-corruption vulnerability that Oracle rates 8.1 under CVSS 3.1.","According to Calif, exploitation requires an affected Java version running on an x86-64 processor with AVX-512 VBMI support and an application that passes untrusted data to affected Java APIs.","Calif reported that its testing achieved pre-login code execution in default configurations of Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate under affected conditions.","Oracle released fixed Java builds on November 17, 2026, including 17.0.21.1, 21.0.13.1, 25.0.5.1, and 27.0.1.1 for the respective Java release lines.","GreyNoise reported exploitation attempts as of November 18 but had not confirmed successful exploitation against its sensors."],"insights":["Exposure is constrained not only by Java version but also by hardware: the affected fast-decoding code runs only on x86-64 processors reporting AVX-512 VBMI-related capabilities, while ARM64 systems are not affected according to Calif.","Organizations unable to patch immediately can disable the affected Java performance shortcut with the startup option -XX:-UseBASE64Intrinsics; Keycloak specifically recommended this as an interim measure.","A generic exploit is not sufficient for reliable code execution: Calif, Kevin Breen, and VulnCheck each indicated that exploitation must be adapted to the target application, although causing an application crash may be easier.","The issue may affect Java programs that do not expose a service themselves, because Calif said a Java client can be compromised when it connects over TLS to an attacker-controlled server.","Version-based detection alone can overstate practical exposure because Tenable plugin detections do not account for the processor requirement."],"referencedReports":[{"title":"Java4Shell: Write once, RCE everywhere","url":"https://calif.io/java4shell/","publisher":"calif","context":"The article relies on Calif's technical write-up for details about the flaw, affected processors, application testing, and proof-of-concept behavior.","category":"research","primary":true},{"title":"Oracle Critical Security Patch Update Advisory - November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article cites Oracle's advisory for the November 2026 Java fixes and affected and fixed Oracle and GraalVM builds.","category":"advisory","primary":true},{"title":"OpenJDK Vulnerability Advisory: November 17, 2026","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"openjdk-vulnerability-group","context":"The article references the OpenJDK Vulnerability Group advisory for affected Java release lines and disclosure information.","category":"advisory","primary":true},{"title":"Critical Java Vulnerability Requires Immediate Patching","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/critical-java-vulnerability-requires-immediate-patching","publisher":"cisa","context":"The article notes that CISA issued an alert on November 17 urging immediate patching for Java4Shell.","category":"advisory","primary":false},{"title":"AL26-029 Critical vulnerability impacting Oracle Java (CVE-2026-114938)","url":"https://www.cyber.gc.ca/en/alerts-advisories/al26-029-critical-vulnerability-impacting-oracle-java-cve-2026-114938","publisher":"canadian-centre-for-cyber-security","context":"The article cites the Canadian Centre for Cyber Security advisory for its alert and fixed GraalVM build information.","category":"advisory","primary":false},{"title":"Java4Shell: What Keycloak admins need to do","url":"https://www.keycloak.org/2026/11/java4shell-vulnerability-cve-2026-114938","publisher":"keycloak-project","context":"The article references Keycloak's guidance recommending an interim Java startup option to disable the affected Base64 optimization.","category":"advisory","primary":false},{"title":"Java4Shell","url":"https://www.vulncheck.com/blog/java4shell","publisher":"vulncheck","context":"The article cites VulnCheck's analysis that a working code-execution exploit is available to its customers and that application-specific exploitation is substantially harder than triggering a crash.","category":"research","primary":false}],"body":"\u003cp\u003eCVE-2026-114938, known as Java4Shell, is an OpenJDK memory-corruption flaw in Base64 decoding that Oracle scored 8.1 under CVSS 3.1. Calif reported that attackers may be able to read application memory or run code on affected applications without logging in when untrusted data reaches the vulnerable Java interface. Oracle, OpenJDK, CISA, and the Canadian Centre for Cyber Security issued information or fixes on November 17, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable code is a performance optimization used only on affected Java releases running on x86-64 processors with AVX-512 VBMI support; Calif says ARM64 systems are not affected. Calif\u0026rsquo;s testing reported pre-login code execution in default configurations of Keycloak, Atlassian Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, among other application-specific results. Oracle released fixed builds, while Calif and Keycloak identified \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e as an interim option to disable the affected optimization; GreyNoise reported exploitation attempts but had not confirmed successful exploitation against its sensors as of November 18.\u003c/p\u003e\n"},{"n":38,"title":"Microsoft agent-framework on PyPI: .pth hook steals Azure and CI credentials","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/microsoft-agent-framework-pypi-credential-stealer/","time":"08:53","priority":"MUST READ","score":94,"tldr":"Malicious PyPI releases agent-framework 1.26.1 and 1.26.2 used Python .pth startup hooks to silently steal environment secrets, cloud credentials, and Azure/GitHub Actions OIDC tokens from affected systems. Remove the hooks before running pip, reinstall version 1.26.0, and rotate potentially exposed credentials.","briefOverview":"\u003cp\u003eMalicious versions 1.26.1 and 1.26.2 of Microsoft’s \u003ccode\u003eagent-framework\u003c/code\u003e package were published to PyPI on November 17, 2026, before being removed. Both releases added code that automatically ran during normal Python startup, even if an application did not import the package. The code collected credentials and other sensitive information and sent it to a \u003ccode\u003ewebhook[.]site\u003c/code\u003e URL. Version 1.26.0 does not contain the malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe releases used \u003ccode\u003e.pth\u003c/code\u003e files in \u003ccode\u003esite-packages\u003c/code\u003e to trigger the collector whenever Python starts normally. The collector gathered secret-related environment variables, credentials from files and other processes, and Azure managed-identity tokens; version 1.26.2 additionally requested GitHub Actions OIDC tokens. Affected environments may include system Python installations, virtual environments, Conda environments, containers, and CI caches. The article advises removing the malicious \u003ccode\u003e.pth\u003c/code\u003e hooks before running \u003ccode\u003epip\u003c/code\u003e, reinstalling and pinning \u003ccode\u003eagent-framework==1.26.0\u003c/code\u003e, blocking the known upload destination, rotating exposed secrets, and reviewing Microsoft Entra ID activity for unusual token use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious versions 1.26.1 and 1.26.2 of Microsoft’s agent-framework package were published to PyPI on November 17, 2026, and have since been removed.","Both releases used a .pth startup file that caused their credential-collection code to run during normal Python startup without an application explicitly importing the package.","The code collected secret-related environment variables, credential files, data from other processes, and Azure managed-identity tokens, while version 1.26.2 also requested GitHub Actions OIDC tokens.","Collected data was compressed, encoded, and sent through HTTPS to a webhook[.]site URL.","Affected users should remove the malicious .pth hooks before running pip, reinstall and pin agent-framework version 1.26.0, and rotate potentially exposed secrets."],"insights":["Version 1.26.2 placed its collector in a new top-level module, leaving the agent_framework_meta package byte-identical to version 1.26.0, so a comparison limited to that package would miss the malicious change.","The malicious code can run when tools such as pip start Python, so the article advises deleting the .pth startup hooks before using pip to remove the package.","The collector sets the _AF_TEL environment variable so it generally runs once per process tree, then continues to execute again when a new Python process tree starts while the package remains installed.","Rotating stored passwords and keys alone may not address the exposure, because the code also requested temporary Azure managed-identity and CI/CD identity tokens that require review of Microsoft Entra ID activity logs."],"referencedReports":[],"body":"\u003cp\u003eMalicious versions 1.26.1 and 1.26.2 of Microsoft’s \u003ccode\u003eagent-framework\u003c/code\u003e package were published to PyPI on November 17, 2026, before being removed. Both releases added code that automatically ran during normal Python startup, even if an application did not import the package. The code collected credentials and other sensitive information and sent it to a \u003ccode\u003ewebhook[.]site\u003c/code\u003e URL. Version 1.26.0 does not contain the malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe releases used \u003ccode\u003e.pth\u003c/code\u003e files in \u003ccode\u003esite-packages\u003c/code\u003e to trigger the collector whenever Python starts normally. The collector gathered secret-related environment variables, credentials from files and other processes, and Azure managed-identity tokens; version 1.26.2 additionally requested GitHub Actions OIDC tokens. Affected environments may include system Python installations, virtual environments, Conda environments, containers, and CI caches. The article advises removing the malicious \u003ccode\u003e.pth\u003c/code\u003e hooks before running \u003ccode\u003epip\u003c/code\u003e, reinstalling and pinning \u003ccode\u003eagent-framework==1.26.0\u003c/code\u003e, blocking the known upload destination, rotating exposed secrets, and reviewing Microsoft Entra ID activity for unusual token use.\u003c/p\u003e\n"},{"n":50,"title":"How Cloudflare WAF helps protect against Java4Shell (CVE-2026-114938)","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/java4shell-waf-protection/","time":"14:52","priority":"MUST READ","score":94,"tldr":"Cloudflare released managed WAF rules to detect Java4Shell (CVE-2026-114938), a critical OpenJDK Base64-decoding flaw that can enable remote code execution on affected AVX-512-capable x86-64 systems. The WAF rules provide temporary defense-in-depth, but organizations must update all Java runtimes and restart affected services to fully remediate the issue.","briefOverview":"\u003cp\u003eJava4Shell (CVE-2026-114938) is a critical memory-corruption vulnerability in OpenJDK’s Base64 decoder, disclosed by Calif on November 17, 2026. It affects OpenJDK 17.0.6 and newer when attacker-controlled Base64 data is decoded on supported x86-64 processors with AVX-512 VBMI; ARM64 systems are not affected. Calif demonstrated pre-authentication remote code execution against several products in default configurations, including Keycloak, Jira, Confluence, Artifactory, Jenkins, and PingFederate.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs in the optimized Base64 code used on certain processors, where malformed padding can produce a negative output length and cause a 64-byte write beyond the allocated output array. Java later rejects the input and throws an exception, but the adjacent memory has already been overwritten. OpenJDK and Oracle released patched builds on the day of disclosure, and organizations must update every Java runtime—including bundled and containerized copies—and restart affected services.\u003c/p\u003e\n\n\u003cp\u003eCloudflare released managed WAF rules to detect Java4Shell-related malformed Base64 input for paid plans, with the rules enabled in Log mode by default because legitimate traffic can resemble exploitation attempts. Customers can review matching requests and change the rules to Block, while Business and Enterprise customers can also use WAF Attack Score for additional detection of exploit-chain payloads. Cloudflare emphasizes that the WAF is only a defense-in-depth measure because it cannot cover paths such as non-HTTP traffic, internal traffic, encoded data, or malicious outbound connections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Java4Shell (CVE-2026-114938) is a critical memory-corruption flaw in OpenJDK's Base64 decoder that can enable heap-memory disclosure and remote code execution.","The issue affects OpenJDK 17.0.6 and later on x86-64 systems with AVX-512 VBMI support when an application decodes attacker-controlled Base64 data; ARM64 systems are not affected.","Cloudflare added managed WAF rules for paid plans to detect malformed Base64 patterns associated with Java4Shell, but enables them in Log mode by default because legitimate traffic can resemble exploit attempts.","Updating every affected Java runtime and restarting its services is the complete remediation, while disabling Base64 intrinsics or AVX-512 can provide a temporary mitigation.","Cloudflare states that its WAF cannot cover all attack paths, including non-HTTP traffic, internal traffic that bypasses Cloudflare, encoded data, and malicious outbound connections."],"insights":["The malformed input is eventually rejected by Java, but the memory overwrite occurs before the error is raised, so application-level validation cannot prevent the corruption.","A simple trigger can be 64 \"A\" characters followed by \"=\"; on OpenJDK 17, the article says the fast decoding path requires 128 characters followed by \"=\" instead.","The managed WAF rules are set to Log rather than Block by default because benign application-specific token formats can resemble the malformed Base64 patterns.","Updating a system-wide Java package may not fix applications that bundle their own Java runtime or use container images, and each updated service must be restarted.","Cloudflare says its machine-learning RCE scoring may be more useful for accompanying exploit stages and later command traffic than for the initial malformed Base64 trigger alone."],"referencedReports":[{"title":"Java4Shell (CVE-2026-114938)","url":"https://calif.io/java4shell/","publisher":"calif","context":"The article identifies Calif as the security research company that disclosed Java4Shell and documents its exploit demonstrations and mitigations.","category":"research","primary":true},{"title":"OpenJDK security advisory","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"openjdk","context":"The article cites OpenJDK's security advisory for details on the vulnerability and patched releases.","category":"advisory","primary":false},{"title":"November 2026 Critical Patch Update","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article cites Oracle's Critical Patch Update for patched builds and the exact list of affected Oracle Java releases.","category":"advisory","primary":false}],"body":"\u003cp\u003eJava4Shell (CVE-2026-114938) is a critical memory-corruption vulnerability in OpenJDK’s Base64 decoder, disclosed by Calif on November 17, 2026. It affects OpenJDK 17.0.6 and newer when attacker-controlled Base64 data is decoded on supported x86-64 processors with AVX-512 VBMI; ARM64 systems are not affected. Calif demonstrated pre-authentication remote code execution against several products in default configurations, including Keycloak, Jira, Confluence, Artifactory, Jenkins, and PingFederate.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs in the optimized Base64 code used on certain processors, where malformed padding can produce a negative output length and cause a 64-byte write beyond the allocated output array. Java later rejects the input and throws an exception, but the adjacent memory has already been overwritten. OpenJDK and Oracle released patched builds on the day of disclosure, and organizations must update every Java runtime—including bundled and containerized copies—and restart affected services.\u003c/p\u003e\n\n\u003cp\u003eCloudflare released managed WAF rules to detect Java4Shell-related malformed Base64 input for paid plans, with the rules enabled in Log mode by default because legitimate traffic can resemble exploitation attempts. Customers can review matching requests and change the rules to Block, while Business and Enterprise customers can also use WAF Attack Score for additional detection of exploit-chain payloads. Cloudflare emphasizes that the WAF is only a defense-in-depth measure because it cannot cover paths such as non-HTTP traffic, internal traffic, encoded data, or malicious outbound connections.\u003c/p\u003e\n"},{"n":19,"title":"10-Year-Old NGINX HTTP/2 Flaw Lets Unauthenticated Attackers Execute Code on Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/10-year-old-nginx-http2-flaw-lets.html","time":"18:31","priority":"MUST READ","score":93,"tldr":"NGINX fixed a critical, decade-old HTTP/2 flaw (CVE-2026-123007) that can let unauthenticated remote attackers execute code as an NGINX worker, with public proof-of-concept code available. Organizations should upgrade to NGINX 1.31.9 or 1.30.7 immediately, or temporarily disable HTTP/2 where upgrading is not possible.","briefOverview":"\u003cp\u003eA decade-old flaw in NGINX\u0026rsquo;s HTTP/2 support, CVE-2026-123007 and dubbed \u0026ldquo;nginx2root,\u0026rdquo; can allow unauthenticated attackers to execute code on servers with HTTP/2 enabled. The issue has been present in NGINX open-source code since version 1.9.5, released in 2015, and affects releases through 1.31.8. Code execution runs with NGINX worker-process permissions, although researchers demonstrated that it could be combined with a separate Linux SCTP flaw to obtain root access in testing. No exploitation in the wild had been reported, but public proof-of-concept code is available.\u003c/p\u003e\n\n\u003cp\u003eF5 released NGINX Open Source 1.31.9 and 1.30.7 to fix CVE-2026-123007 and four additional flaws that can also lead to code execution under particular configurations. The HTTP/2 flaw can be temporarily mitigated by disabling HTTP/2, but this does not address the separate HTTP/3, resolver, and mail-proxy issues. After patching, organizations need a full NGINX restart or a live binary upgrade, because a configuration reload can leave the old executable and worker processes running. CIRCL also advises watching for abnormal worker behavior, core dumps, unusual outbound activity, and long-lived HTTP/2 connections with heavy traffic but few logged requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123007, nicknamed nginx2root, is a decade-old NGINX HTTP/2 flaw that can allow unauthenticated attackers to execute code with NGINX worker-process permissions.","The flaw affects NGINX Open Source releases from 1.9.5 through 1.31.8 and is fixed in versions 1.31.9 and 1.30.7.","F5 also fixed four additional high-severity flaws affecting particular NGINX configurations, including HTTP/2, HTTP/3, proxy resolver, and mail-proxy setups.","Public proof-of-concept code is available, but F5, Wiz, and Rapid7 had not reported observed exploitation and CISA had not listed the flaw in its Known Exploited Vulnerabilities catalog as of the article's publication.","Organizations that cannot immediately upgrade can temporarily disable HTTP/2 to mitigate CVE-2026-123007, but must fully restart NGINX because a configuration reload alone can leave the old executable running."],"insights":["A normal NGINX configuration reload is insufficient after patching because it can leave the vulnerable executable and existing worker processes running; a full restart or live binary upgrade is required.","NGINX access logs may remain clean during an attempted HTTP/2 exploit because HTTP/2 control frames do not normally appear as logged web requests.","Rapid7's demonstrated method required roughly 128 GB of HTTP/2 traffic and depended on specific AVX-512 CPU capabilities, while slower links could exceed NGINX's default one-hour connection limit and cause the attempt to fail.","Disabling HTTP/2 temporarily mitigates the two HTTP/2-related flaws but does not address the separate HTTP/3, resolver, or mail-proxy flaws fixed in the same releases.","The reported code execution initially runs with NGINX worker-process permissions rather than full host control, although Xint demonstrated that it could be combined with a separate Linux SCTP issue to reach root access."],"referencedReports":[{"title":"NGINX Security Advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article cites NGINX security advisories to identify the affected open-source release range.","category":"advisory","primary":true},{"title":"K000163926","url":"https://my.f5.com/manage/s/article/K000163926","publisher":"f5","context":"The article cites F5's vendor advisory for affected NGINX Plus releases and fixed builds.","category":"advisory","primary":true},{"title":"CIRCL Response Guidance TR-105","url":"https://www.circl.lu/pub/tr-105/","publisher":"computer-incident-response-center-luxembourg","context":"The article references CIRCL guidance for mitigations, SCTP hardening, and signs of possible exploitation.","category":"advisory","primary":false},{"title":"CVE-2026-123007: Critical NGINX HTTP/2 Integer Underflow Leads to RCE, Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"rapid7","context":"The article cites Rapid7's technical analysis for its demonstration's traffic volume, duration, bandwidth constraints, and CPU-feature dependency.","category":"research","primary":true},{"title":"NGINX HTTP/2 RCE Vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"wiz","context":"The article references Wiz's disclosure post describing successful ASLR bypass and code-execution testing against official NGINX builds.","category":"research","primary":true},{"title":"nginx2root: Remote Code Execution","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article cites Xint's research report on testing the attack over public cloud infrastructure and combining it with a Linux SCTP issue to obtain root access.","category":"research","primary":true}],"body":"\u003cp\u003eA decade-old flaw in NGINX\u0026rsquo;s HTTP/2 support, CVE-2026-123007 and dubbed \u0026ldquo;nginx2root,\u0026rdquo; can allow unauthenticated attackers to execute code on servers with HTTP/2 enabled. The issue has been present in NGINX open-source code since version 1.9.5, released in 2015, and affects releases through 1.31.8. Code execution runs with NGINX worker-process permissions, although researchers demonstrated that it could be combined with a separate Linux SCTP flaw to obtain root access in testing. No exploitation in the wild had been reported, but public proof-of-concept code is available.\u003c/p\u003e\n\n\u003cp\u003eF5 released NGINX Open Source 1.31.9 and 1.30.7 to fix CVE-2026-123007 and four additional flaws that can also lead to code execution under particular configurations. The HTTP/2 flaw can be temporarily mitigated by disabling HTTP/2, but this does not address the separate HTTP/3, resolver, and mail-proxy issues. After patching, organizations need a full NGINX restart or a live binary upgrade, because a configuration reload can leave the old executable and worker processes running. CIRCL also advises watching for abnormal worker behavior, core dumps, unusual outbound activity, and long-lived HTTP/2 connections with heavy traffic but few logged requests.\u003c/p\u003e\n"},{"n":22,"title":"Java4Shell (CVE-2026-114938) Enables Pre-Auth RCE in Jira, Jenkins, Keycloak on Java 17+ AVX-512 VBMI Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/java4shell-cve-2026-114938-enables-pre.html","time":"04:27","priority":"MUST READ","score":93,"tldr":"Java4Shell (CVE-2026-114938) is a critical pre-auth Java Base64 decoder flaw that can enable memory corruption and potentially remote code execution on AVX-512 VBMI-capable x86-64 systems running affected Java 17+ builds. Organizations should promptly update to fixed JDK releases or temporarily disable the vulnerable Base64 intrinsic with -XX:-UseBASE64Intrinsics.","briefOverview":"\u003cp\u003eResearchers disclosed Java4Shell, tracked as CVE-2026-114938, a flaw in Java’s accelerated Base64 decoder that can cause memory corruption and may allow remote code execution. Calif said attacks can work without a login against default deployments of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate. Other researchers reproduced crashes, memory leaks, and local memory reads, but had not reproduced remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Java 17.0.6 and later Java 17 builds, plus Java 21, 25, and 27, only on x86-64 Intel and AMD processors supporting AVX-512 VBMI. A malformed Base64 string ending in an extra equals sign can write 62 or 63 bytes beyond its intended output before Java rejects it. Oracle, OpenJDK, Amazon Corretto, Azul Zulu, and SAP released fixes, while Red Hat was still preparing updates; organizations that cannot update can temporarily disable the affected Base64 speed-up feature with a JVM option.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Java4Shell, tracked as CVE-2026-114938, is a flaw in Java’s accelerated Base64 decoder that can write 62 or 63 bytes past an output buffer before rejecting malformed input.","The vulnerable code affects Java 17.0.6 and later on supported Java 17 builds, as well as Java 21, 25, and 27, but only on x86-64 Intel or AMD processors with AVX-512 VBMI support.","Calif reported pre-authentication attacks against default deployments of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, although other labs had reproduced crashes and memory leaks rather than remote code execution.","Oracle, OpenJDK, Amazon Corretto, Azul Zulu, and SAP released fixed Java builds, while Red Hat had not yet released fixes for its affected OpenJDK and RHEL packages.","Organizations unable to update can temporarily disable the affected fast Base64 code with -XX:-UseBASE64Intrinsics or disable AVX-512 on x86-64 systems with -XX:UseAVX=2."],"insights":["Whether a deployment is exposed can vary between servers running the same container image, because the vulnerable decoder runs only on x86-64 processors with four required CPU features, including AVX-512 VBMI.","The malformed Base64 input is rejected only after it writes beyond its intended memory area, meaning error handling does not prevent the memory corruption.","A proxy that waits for complete requests, such as nginx in its default configuration, can block some reported attack paths but does not protect against all of them.","The article says a Java program that merely opens a TLS connection to a malicious server may also be at risk, even if it does not provide a network service itself.","Failed exploitation attempts can crash the Java process, and public tests showed repeated malformed login requests could cause a Spring Boot application to crash."],"referencedReports":[{"title":"Java4Shell Technical Write-Up","url":"https://calif.io/java4shell","publisher":"Calif","context":"The article relies on Calif's technical write-up for its account of affected applications, attack conditions, and the JavaBleed technique.","category":"research","primary":true},{"title":"Java4Shell: What We Know Now and What Comes Next","url":"https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next","publisher":"Upwind","context":"The article cites Upwind's lab results reproducing memory corruption and JVM crashes on an affected AWS server.","category":"research","primary":false},{"title":"Java4Shell CVE-2026-114938 Java Base64 Decoder Flaw","url":"https://blackpointcyber.com/blog/java4shell-cve-2026-114938-java-base64-decoder-flaw/","publisher":"Blackpoint Cyber","context":"The article cites Blackpoint Cyber's test results showing application crashes and local JavaBleed memory reads, but not remote code execution.","category":"research","primary":false},{"title":"CVE-2026-114938 Vulnerability Advisory","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"OpenJDK Project","context":"The article cites the OpenJDK advisory for the fixed releases.","category":"advisory","primary":false},{"title":"Oracle Critical Patch Update Security Alert","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"Oracle","context":"The article cites Oracle's security advisory for affected Java builds and fixes.","category":"advisory","primary":false},{"title":"Critical Vulnerability Impacting Oracle Java (CVE-2026-114938)","url":"https://www.cyber.gc.ca/en/alerts-advisories/al26-029-critical-vulnerability-impacting-oracle-java-cve-2026-114938","publisher":"Canadian Centre for Cyber Security","context":"The article cites the Canadian government alert describing the flaw as remotely exploitable without authentication.","category":"advisory","primary":false},{"title":"Red Hat Security Bulletin RHSB-2026-018","url":"https://access.redhat.com/security/vulnerabilities/RHSB-2026-018","publisher":"Red Hat","context":"The article cites Red Hat's security bulletin stating that fixes for affected RHEL and OpenJDK builds were not yet available.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed Java4Shell, tracked as CVE-2026-114938, a flaw in Java’s accelerated Base64 decoder that can cause memory corruption and may allow remote code execution. Calif said attacks can work without a login against default deployments of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate. Other researchers reproduced crashes, memory leaks, and local memory reads, but had not reproduced remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Java 17.0.6 and later Java 17 builds, plus Java 21, 25, and 27, only on x86-64 Intel and AMD processors supporting AVX-512 VBMI. A malformed Base64 string ending in an extra equals sign can write 62 or 63 bytes beyond its intended output before Java rejects it. Oracle, OpenJDK, Amazon Corretto, Azul Zulu, and SAP released fixes, while Red Hat was still preparing updates; organizations that cannot update can temporarily disable the affected Base64 speed-up feature with a JVM option.\u003c/p\u003e\n"},{"n":24,"title":"Attackers Compromise Microsoft's Agent Framework PyPI Package to Steal Cloud Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-compromise-microsofts-agent.html","time":"06:45","priority":"MUST READ","score":93,"tldr":"Malicious releases 1.26.1 and 1.26.2 of Microsoft’s agent-framework PyPI package installed Python startup hooks that stole cloud credentials and CI/CD tokens, then exfiltrated them to a webhook.site endpoint. Users who installed the versions should isolate affected systems, rebuild from clean environments, and rotate exposed credentials.","briefOverview":"\u003cp\u003eAttackers compromised Microsoft’s agent-framework package on PyPI and published malicious versions 1.26.1 and 1.26.2 on November 17, 2026, 33 minutes apart. The releases were designed to steal credentials, cloud identity tokens, and environment information, then send the data to a hard-coded webhook.site endpoint. Both versions have been quarantined, although it is unclear how the attackers obtained publishing access. Agent-framework is Microsoft’s open-source Python framework for building and orchestrating AI agents and receives roughly 190,000 downloads per month.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package wheels installed .pth files in the Python site-packages directory, causing the stealer to execute whenever Python starts, including when pip runs, without the package being explicitly imported. The code targeted Azure CLI files, .npmrc, pip.conf, .netrc, Git credentials, Docker configuration, Hugging Face files, Azure DevOps and GitHub Actions OIDC tokens, Azure managed-identity tokens, and Azure instance metadata. Affected users are advised to isolate impacted hosts and runners, pin agent-framework to safe version 1.26.0 from a clean environment, search logs for requests to the identified webhook.site address, rotate exposed credentials from a clean system, and audit Azure identities and GitHub Actions workflows that deploy to Azure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers published malicious versions 1.26.1 and 1.26.2 of Microsoft’s agent-framework package on PyPI on November 17, 2026, and both releases were later quarantined.","The malicious package versions placed files in Python’s installed-package directory that caused credential-stealing code to run whenever Python started, including when pip ran.","The code collected selected environment variables, credential files, Azure DevOps OIDC tokens, Azure managed-identity tokens, and Azure virtual-machine metadata.","The stolen data was compressed, encoded, and sent by HTTPS to a hard-coded webhook.site address.","Users who installed the malicious releases are advised to isolate affected hosts, use the safe 1.26.0 version from a clean environment, investigate exposure, and rotate credentials from a clean system."],"insights":["The malicious code could execute on every Python launch without anyone importing Agent Framework, because it used Python startup configuration files placed in the installed-package directory.","The stealer did not only read credentials already stored on disk; it could ask Azure services to issue new identity tokens, so rotating existing saved secrets alone may not address all exposure.","Version 1.26.2 expanded collection to GitHub Actions identity tokens and additional credential-related environment variables, increasing risk for automated deployment workflows.","Network and DNS logs can be checked for connections to the hard-coded webhook.site address, providing a concrete way to identify possible data theft."],"referencedReports":[{"title":"Two Malicious Agent-Framework Releases Hit PyPI in 33 Minutes","url":"https://www.aikido.dev/blog/two-malicious-agent-framework-releases-hit-pypi-in-33-minutes","publisher":"aikido","context":"The article cites Aikido as reporting on the malicious agent-framework releases on PyPI.","category":"research","primary":true},{"title":"Microsoft Agent Framework Compromised on PyPI","url":"https://www.chainguard.dev/unchained/microsoft-agent-framework-compromised-on-pypi-november-2026","publisher":"chainguard","context":"The article cites Chainguard as a source reporting that Microsoft’s Agent Framework package was compromised.","category":"research","primary":true},{"title":"Agent Framework Compromised: Software Supply Chain Attack","url":"https://www.endorlabs.com/learn/agent-framework-compromised-software-supply-chain-attack","publisher":"endor-labs","context":"The article cites Endor Labs’ analysis and quotes its explanation of how the malicious .pth files execute on Python startup.","category":"research","primary":true},{"title":"Hijacked Releases of Microsoft's Official Agent Framework Steal Azure and CI Credentials","url":"https://www.ox.security/blog/breaking-hijacked-releases-of-microsofts-official-agent-framework-steals-azure-and-ci-credentials/","publisher":"ox-security","context":"The article cites OX Security’s report and quotes its assessment that the attackers may have hijacked the wheel creation flow.","category":"research","primary":true},{"title":"Microsoft Agent Framework PyPI Compromise","url":"https://safedep.io/blog/microsoft-agent-framework-pypi-compromise","publisher":"safedep","context":"The article cites SafeDep’s report and quotes its analysis of the malware requesting new Azure identity tokens.","category":"research","primary":true},{"title":"Agent-Framework PyPI Package Compromised With Credential Stealer","url":"https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer","publisher":"socket","context":"The article cites Socket’s report and quotes its description of the credential collection and exfiltration behavior.","category":"research","primary":true},{"title":"Microsoft Agent Framework PyPI Package Compromised","url":"https://www.stepsecurity.io/blog/microsoft-agent-framework-pypi-package-compromised","publisher":"stepsecurity","context":"The article cites StepSecurity as reporting on the compromise of the PyPI package.","category":"research","primary":true},{"title":"Malicious Version of Microsoft's Agent Framework Published to PyPI","url":"https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi","publisher":"wiz","context":"The article cites Wiz as reporting on a malicious version of Microsoft’s Agent Framework package being published to PyPI.","category":"research","primary":true}],"body":"\u003cp\u003eAttackers compromised Microsoft’s agent-framework package on PyPI and published malicious versions 1.26.1 and 1.26.2 on November 17, 2026, 33 minutes apart. The releases were designed to steal credentials, cloud identity tokens, and environment information, then send the data to a hard-coded webhook.site endpoint. Both versions have been quarantined, although it is unclear how the attackers obtained publishing access. Agent-framework is Microsoft’s open-source Python framework for building and orchestrating AI agents and receives roughly 190,000 downloads per month.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package wheels installed .pth files in the Python site-packages directory, causing the stealer to execute whenever Python starts, including when pip runs, without the package being explicitly imported. The code targeted Azure CLI files, .npmrc, pip.conf, .netrc, Git credentials, Docker configuration, Hugging Face files, Azure DevOps and GitHub Actions OIDC tokens, Azure managed-identity tokens, and Azure instance metadata. Affected users are advised to isolate impacted hosts and runners, pin agent-framework to safe version 1.26.0 from a clean environment, search logs for requests to the identified webhook.site address, rotate exposed credentials from a clean system, and audit Azure identities and GitHub Actions workflows that deploy to Azure.\u003c/p\u003e\n"},{"n":35,"title":"The forced audit: how AuditTeam’s OpsAgent framework masks ransomware as consulting","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/auditteam-opsagent-forced-audit/122031/","time":"07:00","priority":"MUST READ","score":93,"tldr":"AuditTeam is using its evolving OpsAgent malware framework to conduct ransomware-style extortion while posing as a security consultancy, with victims across multiple countries. The toolkit combines defense evasion via a signed antivirus driver, credential and surveillance capabilities, lateral movement, and file encryption, while using GitHub and CloudFront for resilient C2 infrastructure.","briefOverview":"\u003cp\u003eAuditTeam used its OpsAgent framework to compromise dozens of organizations across at least seven countries between January and October 2026. The group presents its extortion as an “Audit \u0026amp; Consulting fee,” promising a vulnerability report in exchange for payment while threatening to publish stolen data. Observed victims were in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia, while its leak site claimed additional victims in other countries.\u003c/p\u003e\n\n\u003cp\u003eOpsAgent provides remote control capabilities including file and process management, privilege escalation, keylogging, screenshot capture, shellcode injection, and movement between compromised systems. Specialized modules can disable security products using a digitally signed Beijing Jiangmin Antivirus driver, terminate database and backup services, encrypt files, remove shadow copies, and leave a ransom note. The framework evolved from C++ to Rust, used Amazon CloudFront subdomains for command-and-control communications, and could retrieve its server address through a public GitHub repository.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AuditTeam used the OpsAgent framework in attacks against dozens of organizations, with observed victims in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia between January and October 2026.","The group’s ransom note demands an “Audit \u0026 Consulting fee” and says a paid victim will receive a vulnerability report instead of having stolen data publicly released.","OpsAgent provides capabilities including file management, process injection, privilege escalation, keylogging, screenshot capture, network pivoting, and remote command execution.","A specialized AV/EDR killer module uses a digitally signed Beijing Jiangmin Antivirus driver to terminate security products, while the cryptor module encrypts files and removes shadow copies.","OpsAgent used Amazon CloudFront subdomains for command-and-control infrastructure and could retrieve C2 addresses from a public GitHub repository."],"insights":["A victim who finds AuditTeam’s ransom note has already had files encrypted, even though the note itself focuses on payment for an “Audit \u0026 Consulting fee” and data-disclosure threats.","Blocking the listed C2 IP addresses alone is not a reliable defense because OpsAgent uses shared Amazon CloudFront infrastructure that also serves legitimate traffic.","Removing the public GitHub repository may not stop every OpsAgent infection, because the latest Rust implants contained configurations with GitHub-based C2 discovery disabled.","OpsAgent’s remote payload delivery keeps functions such as credential theft and pass-the-hash execution out of the main implant, allowing operators to send those payloads through named pipes when needed.","The Rust version changed command-and-control from initial HTTP POST polling to an optional persistent encrypted WebSocket connection after an upgrade command."],"referencedReports":[],"body":"\u003cp\u003eAuditTeam used its OpsAgent framework to compromise dozens of organizations across at least seven countries between January and October 2026. The group presents its extortion as an “Audit \u0026amp; Consulting fee,” promising a vulnerability report in exchange for payment while threatening to publish stolen data. Observed victims were in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia, while its leak site claimed additional victims in other countries.\u003c/p\u003e\n\n\u003cp\u003eOpsAgent provides remote control capabilities including file and process management, privilege escalation, keylogging, screenshot capture, shellcode injection, and movement between compromised systems. Specialized modules can disable security products using a digitally signed Beijing Jiangmin Antivirus driver, terminate database and backup services, encrypt files, remove shadow copies, and leave a ransom note. The framework evolved from C++ to Rust, used Amazon CloudFront subdomains for command-and-control communications, and could retrieve its server address through a public GitHub repository.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft’s Agent Framework PyPI package compromised to steal credentials","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsofts-agent-framework-pypi-package-compromised-to-steal-credentials/","time":"16:58","priority":"MUST READ","score":92,"tldr":"Microsoft’s Agent Framework PyPI package was compromised with two malicious releases that automatically stole cloud, CI/CD, and developer credentials during Python startup. Developers who installed versions 1.26.1 or 1.26.2 should isolate affected systems, rebuild using 1.26.0, and rotate potentially exposed secrets immediately.","briefOverview":"\u003cp\u003eHackers compromised Microsoft’s official Agent Framework package on PyPI and published malicious versions 1.26.1 and 1.26.2 on November 17, 2026. Agent Framework is an open-source toolkit for building and coordinating AI agents, with roughly 200,000 monthly PyPI downloads. The malicious releases contained a credential stealer designed to collect cloud and developer secrets. They retained the legitimate \u003ccode\u003eagent-framework-core\u003c/code\u003e 1.26.0 dependency, allowing the framework to continue working while the malicious activity ran in the background.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executed automatically during normal Python startup through \u003ccode\u003e.pth\u003c/code\u003e files, including in environments where Agent Framework was not imported. Version 1.26.1 used \u003ccode\u003eagent_framework_meta.pth\u003c/code\u003e to execute code in \u003ccode\u003eagent_framework_meta/_telemetry.py\u003c/code\u003e, while version 1.26.2 used \u003ccode\u003eaf_runtime_diag.pth\u003c/code\u003e and \u003ccode\u003eaf_runtime_diag.py\u003c/code\u003e. The stealer sought secrets in environment variables, local configuration files, and accessible running processes, targeting services including Azure, AWS, GitHub, Docker, Hugging Face, and OpenAI. It also attempted to obtain Azure managed identity tokens, Azure DevOps OIDC tokens, and, in version 1.26.2, GitHub Actions OIDC tokens and data from GitHub runner directories.\u003c/p\u003e\n\n\u003cp\u003eBoth releases sent collected data to the same attacker-controlled webhook endpoint. PyPI quarantined the first release, but another malicious version was uploaded about 2.5 minutes later and was quarantined roughly eight minutes afterward; how the attacker obtained publishing access remains unclear. Developers who installed either version should isolate affected environments, avoid running Python or pip until they are secured, rebuild from a known-clean environment with version 1.26.0, and rotate credentials that may have been exposed. Investigators are advised to search egress logs for the specified webhook path and determine whether attempted transfers were blocked or completed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s official Agent Framework package on PyPI was compromised through malicious versions 1.26.1 and 1.26.2, published on November 17, 2026.","The malicious releases used Python startup files to run a credential stealer automatically, including when the Agent Framework package was not imported.","The stealer targeted secrets in environment variables, local configuration files, and accessible running processes, including credentials for Azure, AWS, GitHub, Docker, Hugging Face, and OpenAI.","PyPI quarantined the first malicious release, but a second malicious version was published about 2.5 minutes later and quarantined roughly eight minutes afterward.","Developers who installed either affected version are advised to isolate the environment, rebuild from a known-clean environment using version 1.26.0, and rotate potentially exposed credentials."],"insights":["The malicious packages retained the legitimate agent-framework-core 1.26.0 depende
