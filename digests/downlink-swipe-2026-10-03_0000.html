<script type="application/json" id="dl-articles">[{"n":5,"title":"Warlock Exploits SharePoint Flaws to Disable Security Tools and Deploy Ransomware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/warlock-exploits-sharepoint-flaws-to.html","time":"14:36","priority":"MUST READ","score":92,"tldr":"China-linked Warlock is exploiting unpatched Microsoft SharePoint Server flaws to gain access to organizations in Portuguese- and Spanish-speaking regions, then disable security tools and deploy ransomware across networks. The campaign uses web shells, BYOVD via K7RKScan.sys, SYSVOL staging, and VS Code tunnels to expand and maintain control.","briefOverview":"\u003cp\u003eSuspected China-linked threat actor Warlock, also known as Gold Salem, Longlegs, and Storm-2603, is continuing to exploit Microsoft SharePoint Server flaws to deploy ransomware. Symantec and Carbon Black observed attacks against critical infrastructure, government, and education organizations in Portuguese- and Spanish-speaking countries across Europe, Africa, and Latin America. In the past two months, the group reportedly targeted at least four organizations, including a water utility, a telecommunications provider, a regional government body, and a university.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SharePoint, the attackers deploy web shells to obtain ASP.NET machine keys and create signed payloads that run within the SharePoint application pool. They have also used DLL sideloading, cloud storage services such as catbox.moe and wasabisys.com, Visual Studio Code tunnels, and the vulnerable K7RKScan.sys driver (CVE-2025-1055) to disable security software. In one critical-infrastructure incident, attackers pushed a security-disabling tool to at least 40 hosts in about two hours and deployed Warlock ransomware to at least 33 systems through the domain SYSVOL share. The activity indicates that unpatched or otherwise unmitigated SharePoint deployments remain a viable entry point for these attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The suspected China-linked Warlock group is exploiting Microsoft SharePoint Server flaws to target organizations in Portuguese- and Spanish-speaking countries across Europe, Africa, and Latin America.","Symantec and Carbon Black reported attacks against at least four organizations in the previous two months, including water, telecommunications, government, and university entities.","Warlock has used SharePoint web shells to obtain ASP.NET machine keys and execute code within the SharePoint application environment.","The group used the vulnerable K7RKScan.sys driver, tracked as CVE-2025-1055, to disable security software and used Visual Studio Code tunnels for remote connections to compromised systems.","In one critical-infrastructure intrusion, attackers distributed a security-disabling tool to at least 40 hosts and deployed Warlock ransomware to at least 33 hosts through the domain SYSVOL share."],"insights":["Warlock used the compromised domain's SYSVOL share to distribute ransomware through normal domain replication, allowing it to reach at least 33 hosts in one incident without separately delivering the payload to each machine.","The attackers obtained SharePoint ASP.NET machine keys through web shells, enabling them to create signed payloads that executed within the SharePoint application pool.","In one critical-infrastructure intrusion, a tool to disable security software was pushed to at least 40 hosts in roughly two hours before ransomware deployment.","Warlock combined legitimate services and tools, including catbox.moe, wasabisys.com, Velociraptor, and Visual Studio Code tunnels, with malicious payload delivery and remote access activity.","The group abused the legitimate but vulnerable K7RKScan.sys driver (CVE-2025-1055), a driver also previously used by DragonForce actors, to disable security software."],"referencedReports":[{"title":"Warlock Ransomware Targets Critical Infrastructure","url":"https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure","publisher":"symantec-and-carbon-black-threat-hunter-team","context":"The article relies on this Symantec and Carbon Black threat analysis for details of Warlock's recent intrusions against critical infrastructure, government, and education targets.","category":"research","primary":true}],"body":"\u003cp\u003eSuspected China-linked threat actor Warlock, also known as Gold Salem, Longlegs, and Storm-2603, is continuing to exploit Microsoft SharePoint Server flaws to deploy ransomware. Symantec and Carbon Black observed attacks against critical infrastructure, government, and education organizations in Portuguese- and Spanish-speaking countries across Europe, Africa, and Latin America. In the past two months, the group reportedly targeted at least four organizations, including a water utility, a telecommunications provider, a regional government body, and a university.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SharePoint, the attackers deploy web shells to obtain ASP.NET machine keys and create signed payloads that run within the SharePoint application pool. They have also used DLL sideloading, cloud storage services such as catbox.moe and wasabisys.com, Visual Studio Code tunnels, and the vulnerable K7RKScan.sys driver (CVE-2025-1055) to disable security software. In one critical-infrastructure incident, attackers pushed a security-disabling tool to at least 40 hosts in about two hours and deployed Warlock ransomware to at least 33 systems through the domain SYSVOL share. The activity indicates that unpatched or otherwise unmitigated SharePoint deployments remain a viable entry point for these attacks.\u003c/p\u003e\n"},{"n":3,"title":"ShinyHunters hacker reportedly detained in Jordan, aiding FBI","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-hacker-reportedly-detained-in-jordan-aiding-fbi/","time":"19:09","priority":"SHOULD READ","score":84,"tldr":"Jordanian authorities reportedly detained alleged ShinyHunters member Saif al-Din Khader (“Rey”), who is said to be cooperating with the FBI to identify and locate other members of the extortion group.","briefOverview":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, known online as “Rey,” whom sources identified as a suspected ShinyHunters member. Reuters sources said Khader is cooperating with the FBI and international law enforcement, including by reviewing his devices and digital communications to help identify alleged co-conspirators. The reported detention follows a Dutch arrest connected to the ShinyHunters investigation and an FBI public warning urging remaining members to turn themselves in.\u003c/p\u003e\n\n\u003cp\u003eThe same day Khader was reportedly detained, a ShinyHunters-linked messaging account shut down, the group’s data-leak site went offline, and its main representative stopped responding to media, though a new leak site later appeared. The article says it is unclear whether these disruptions were related to the detention. ShinyHunters has been linked to data theft and extortion operations against organizations including Google, Cisco, PornHub, and Instructure Canvas, often by compromising third-party integration companies and using stolen authentication tokens to access connected cloud software environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jordanian authorities reportedly detained Saif al-Din Khader, known online as “Rey,” and sources told Reuters that he is cooperating with the FBI and international law enforcement to identify other ShinyHunters members.","Sources said Khader is helping investigators examine his electronic devices and digital communications as part of efforts to locate alleged co-conspirators.","The detention followed a Dutch police arrest of a 24-year-old Amsterdam man in a ShinyHunters investigation and an FBI public call for other group members to surrender.","After Khader’s reported detention, a ShinyHunters-linked messaging account was shut down, the group’s leak site briefly went offline, and its main representative stopped responding to media, although a new leak site later appeared.","ShinyHunters has been linked to data theft and extortion campaigns targeting cloud software environments and organizations including Google, Cisco, PornHub, and Instructure Canvas."],"insights":["The reported detention appears to have caused at least a temporary operational disruption: a ShinyHunters-linked contact account shut down, the group’s leak site went offline, and its primary media contact stopped responding before a replacement leak site appeared.","ShinyHunters’ reported pattern of compromising third-party integration companies and using stolen login tokens means a breach at one service provider can expose connected customers’ cloud accounts and data.","The group’s alleged FBI breach remains only partially confirmed: the FBI acknowledged investigating unauthorized activity but did not confirm ShinyHunters’ claims of a PeopleSoft zero-day flaw, access to AWS GovCloud, or theft of 2–3 TB of data.","Rey had been publicly associated with several overlapping groups and campaigns, including HellCat and Scattered Lapsus$ Hunters, illustrating that the article links the same online actor to multiple cybercrime operations over time."],"referencedReports":[{"title":"Key ShinyHunters hacker detained in Jordan, is cooperating, sources say","url":"https://www.reuters.com/world/middle-east/key-shinyhunters-hacker-detained-jordan-is-cooperating-sources-say-2026-10-03/","publisher":"reuters","context":"The article cites Reuters as reporting that Jordanian authorities detained Rey and that he is cooperating with law enforcement.","category":"news","primary":true},{"title":"Meet Rey, the Admin of Scattered Lapsus Hunters","url":"http://krebsonsecurity.com/2025/11/meet-rey-the-admin-of-scattered-lapsus-hunters/","publisher":"krebsonsecurity","context":"The article cites Brian Krebs’ report identifying Rey as Saif Al-Din Khader and describing Khader’s claimed cooperation with law enforcement.","category":"news","primary":false}],"body":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, known online as “Rey,” whom sources identified as a suspected ShinyHunters member. Reuters sources said Khader is cooperating with the FBI and international law enforcement, including by reviewing his devices and digital communications to help identify alleged co-conspirators. The reported detention follows a Dutch arrest connected to the ShinyHunters investigation and an FBI public warning urging remaining members to turn themselves in.\u003c/p\u003e\n\n\u003cp\u003eThe same day Khader was reportedly detained, a ShinyHunters-linked messaging account shut down, the group’s data-leak site went offline, and its main representative stopped responding to media, though a new leak site later appeared. The article says it is unclear whether these disruptions were related to the detention. ShinyHunters has been linked to data theft and extortion operations against organizations including Google, Cisco, PornHub, and Instructure Canvas, often by compromising third-party integration companies and using stolen authentication tokens to access connected cloud software environments.\u003c/p\u003e\n"},{"n":1,"title":"Danish university DTU breach exposes data of up to 200,000 people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/danish-university-dtu-breach-exposes-data-of-up-to-200-000-people/","time":"14:35","priority":"SHOULD READ","score":82,"tldr":"Hackers used compromised credentials to access DTU’s IAM system, potentially exposing personal data for up to 200,000 current and former users dating back to 2003. Exposed data may include Danish CPR numbers, contact details, employment information, and next-of-kin details, creating identity-fraud and phishing risks.","briefOverview":"\u003cp\u003eThe Technical University of Denmark (DTU) says hackers accessed DTUBasen, its identity and access management system, using compromised credentials and downloaded a large amount of data. DTU cannot determine precisely what data was taken or how many people were affected. The system holds information for nearly 40,000 active users and around 160,000 former users, potentially exposing records dating back more than two decades.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed data for current users includes Danish civil registration numbers, names, home addresses, profile pictures, work email addresses, job titles, office locations, and other employment details. Names, relationships, and telephone numbers for next of kin may also have been exposed where users had supplied them, although certain former-user information is deleted after six months. DTU warned that the data could enable identity fraud and more convincing phishing, and advised potentially affected people to treat unexpected messages, calls, and login requests with caution, change reused passwords, and consider placing a credit alert on an affected CPR number.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Technical University of Denmark said hackers used compromised credentials to access DTUBasen, its identity and access management system, and download a large amount of data.","DTU said it cannot determine exactly what information was downloaded or how many people were affected, but DTUBasen contains records for nearly 40,000 active users and about 160,000 former users.","Potentially exposed information for current users includes Danish civil registration numbers, names, home addresses, profile pictures, work email addresses, job titles, office locations, and other employment-related details.","DTU said next-of-kin names, relationships, and telephone numbers may also have been exposed when active users had provided them.","The university warned that the exposed personal data could be used for identity fraud and more convincing phishing attempts, and advised affected people to be cautious of unexpected communications."],"insights":["The potential exposure spans more than two decades of DTU records, meaning former employees, students, guests, and external partners dating back to 2003 may be affected.","DTU cannot determine precisely which data was downloaded or how many people were affected, so it is using a public disclosure to reach people it cannot contact directly.","Next-of-kin information may have been included for active users, but DTU says former users’ home addresses, profile pictures, and next-of-kin details are automatically deleted after six months.","DTU specifically advises people to change passwords reused on other services and to place a credit alert on an affected Danish CPR number, reflecting risks beyond the DTU account itself."],"referencedReports":[],"body":"\u003cp\u003eThe Technical University of Denmark (DTU) says hackers accessed DTUBasen, its identity and access management system, using compromised credentials and downloaded a large amount of data. DTU cannot determine precisely what data was taken or how many people were affected. The system holds information for nearly 40,000 active users and around 160,000 former users, potentially exposing records dating back more than two decades.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed data for current users includes Danish civil registration numbers, names, home addresses, profile pictures, work email addresses, job titles, office locations, and other employment details. Names, relationships, and telephone numbers for next of kin may also have been exposed where users had supplied them, although certain former-user information is deleted after six months. DTU warned that the data could enable identity fraud and more convincing phishing, and advised potentially affected people to treat unexpected messages, calls, and login requests with caution, change reused passwords, and consider placing a credit alert on an affected CPR number.\u003c/p\u003e\n"},{"n":4,"title":"MI5 Says China’s MSS Funded Research Involving 100+ U.K.-Linked Academics","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/mi5-says-chinas-mss-funded-research.html","time":"14:38","priority":"SHOULD READ","score":82,"tldr":"MI5 warns that China’s MSS allegedly used the CGTRI front organization to fund research involving more than 100 U.K.-linked academics, advancing espionage capabilities in areas such as AI, cybersecurity, covert communications, and steganography. U.K. universities are urged to review collaborations and funding sources, as continued involvement could risk prosecution under the National Security Act 2023.","briefOverview":"\u003cp\u003eMI5 issued a Security Service Espionage Alert stating that the China General Technology Research Institute (CGTRI), also known as the China Academy of General Technology, funds research that directly improves the technical espionage capabilities of China’s Ministry of State Security (MSS). MI5 assesses CGTRI to be an MSS front company and said more than 100 U.K.-linked academics have contributed to projects it funded. Some contributors may not have known that CGTRI was financially backing the Chinese projects.\u003c/p\u003e\n\n\u003cp\u003eThe projects include artificial intelligence, cybersecurity, covert communications systems, and steganography, which MI5 said support MSS espionage and threaten U.K. national security. MI5 urged U.K. institutions to review existing and planned CGTRI collaborations and to trace funding sources in research partnerships with Chinese organizations. It also warned that institutions, staff, and researchers that continue to collaborate could face prosecution under the National Security Act 2023 for materially assisting a foreign intelligence service in U.K.-related activities.\u003c/p\u003e\n\n\u003cp\u003eChina’s embassy in the U.K. rejected the allegations as fabricated, saying academic cooperation between the two countries is voluntary, lawful, and mutually beneficial. U.K.-China Transparency said CGTRI has identifiable staffing overlaps with China’s University of International Relations, which it described as closely affiliated with the MSS. The group also said CGTRI specializes in cybersecurity, signals intelligence, and AI-enabled tools relevant to strategic national objectives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["MI5 issued a September 30, 2026 espionage alert stating that the China General Technology Research Institute (CGTRI) funds research that it says directly improves China’s Ministry of State Security’s technical espionage capabilities.","MI5 assesses CGTRI, also known as the China Academy of General Technology, to be a front company for China’s Ministry of State Security and says it funds research into artificial intelligence, cybersecurity, covert communications, and steganography.","According to MI5, more than 100 U.K.-linked academics contributed to CGTRI-funded research projects, and some may not have known the organization was backing the work.","MI5 urged U.K. academic institutions to review collaborations with CGTRI and trace funding sources for research partnerships with Chinese institutions.","The Chinese embassy in the U.K. rejected the allegations as fabricated and said U.K.-China academic exchanges are voluntary, lawful, and mutually beneficial."],"insights":["MI5’s warning indicates that researchers can contribute to a state-security-linked project without knowing that CGTRI is the source of its funding, making funding-trace reviews particularly important.","The alert makes continued collaboration a potential legal issue, warning that institutions, staff, and researchers could face prosecution under the National Security Act 2023 for materially assisting a foreign intelligence service.","UK-China Transparency said CGTRI has identifiable staffing overlaps with China’s University of International Relations, an institution it describes as uniquely closely affiliated with China’s Ministry of State Security.","The research areas cited—including artificial intelligence, cybersecurity, covert communications, and steganography—combine capabilities for gathering information, concealing it, and communicating it covertly."],"referencedReports":[{"title":"MI5 Issues Espionage Alert: CGTRI 中国通用技术研究院","url":"https://www.mi5.gov.uk/mi5-issues-espionage-alert-cgtri-%E4%B8%AD%E5%9B%BD%E9%80%9A%E7%94%A8%E6%8A%80%E6%9C%AF%E7%A0%94%E7%A9%B6%E9%99%A2","publisher":"mi5","context":"The article is based on MI5’s Security Service Espionage Alert warning that CGTRI allegedly funds research that improves Chinese Ministry of State Security espionage capabilities.","category":"advisory","primary":true}],"body":"\u003cp\u003eMI5 issued a Security Service Espionage Alert stating that the China General Technology Research Institute (CGTRI), also known as the China Academy of General Technology, funds research that directly improves the technical espionage capabilities of China’s Ministry of State Security (MSS). MI5 assesses CGTRI to be an MSS front company and said more than 100 U.K.-linked academics have contributed to projects it funded. Some contributors may not have known that CGTRI was financially backing the Chinese projects.\u003c/p\u003e\n\n\u003cp\u003eThe projects include artificial intelligence, cybersecurity, covert communications systems, and steganography, which MI5 said support MSS espionage and threaten U.K. national security. MI5 urged U.K. institutions to review existing and planned CGTRI collaborations and to trace funding sources in research partnerships with Chinese organizations. It also warned that institutions, staff, and researchers that continue to collaborate could face prosecution under the National Security Act 2023 for materially assisting a foreign intelligence service in U.K.-related activities.\u003c/p\u003e\n\n\u003cp\u003eChina’s embassy in the U.K. rejected the allegations as fabricated, saying academic cooperation between the two countries is voluntary, lawful, and mutually beneficial. U.K.-China Transparency said CGTRI has identifiable staffing overlaps with China’s University of International Relations, which it described as closely affiliated with the MSS. The group also said CGTRI specializes in cybersecurity, signals intelligence, and AI-enabled tools relevant to strategic national objectives.\u003c/p\u003e\n"},{"n":7,"title":"Salesforce Sites Phishing: The Attacker Owned Nothing","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/salesforce-sites-phishing-attacker-owned-nothing","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing campaign abused legitimate subscription-billing email infrastructure, Salesforce Sites hosting, and Wikimedia branding, so SPF, DKIM, and DMARC all appeared valid despite a credential-harvesting lure. The key detection signal was behavioral: a first-time sender impersonating Salesforce in the From local part and requesting login credentials or an Organization ID by reply.","briefOverview":"\u003cp\u003eA UK consumer fintech received a malicious email claiming that its Salesforce organization had been temporarily deactivated. The email was sent through a subscription billing platform’s legitimate production transactional mail service and carried valid DKIM, SPF, and DMARC results at the organization’s inbound gateway. A human analyst confirmed the message was malicious and quarantined it.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page was hosted on a genuine Salesforce Sites organization, and the Salesforce logo was loaded from Wikimedia Commons, leaving the attacker without an obvious malicious domain or image host. The organization’s secure email gateway rewrote URLs for click protection, which caused DKIM to fail later at Microsoft 365 even though ARC records preserved the original authentication passes. The message also offered a no-click route by asking the recipient to reply with an Organization ID, bypassing link rewriting, sandboxing, and click-event monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that sender authentication and reputation systems cannot determine whether a legitimate sender is making a deceptive request. It identifies behavioral signals as more useful in this case, including a first-time sender using a major SaaS brand in the sender’s local part while sending from an unrelated domain. It recommends hunting for that sender pattern and using phishing-resistant MFA and conditional access to reduce the impact of stolen credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A UK consumer fintech received a malicious email impersonating Salesforce that was delivered through a subscription billing platform’s legitimate transactional email service with valid sender authentication.","The credential-harvesting page was hosted on a genuine Salesforce Sites organization, while the impersonated Salesforce logo was loaded from Wikimedia Commons.","The organization’s secure email gateway rewrote body URLs for click protection, causing the original DKIM signature to fail at Microsoft 365 even though the inbound gateway’s ARC records preserved the original passing authentication results.","The email also asked the recipient to reply with an Organization ID, creating a no-click path that would not trigger URL rewriting, sandboxing, or click-event monitoring.","The article concludes that behavioral signals, such as a first-time sender using a major SaaS brand in the sender name and requesting account access or identifiers, are important when attackers abuse legitimate third-party infrastructure."],"insights":["Valid email authentication can confirm that a legitimate vendor’s mail system sent a message without validating the truthfulness of the sender’s local part or the request made in the email.","URL rewriting by a recipient’s own email gateway can break downstream DKIM verification, so final-hop authentication failures may reflect defensive processing rather than a forged message.","A reply-based request for an Organization ID bypasses link-focused controls because it produces no rewritten URL, sandbox detonation, or click event.","A practical hunt proposed by the article is to identify first-time senders whose local part uses a major SaaS brand while their domain has no legitimate business relationship to that brand.","Shared platforms such as Salesforce Sites and Wikimedia Commons reduce the usefulness of domain and image reputation because blocking the entire legitimate service is impractical."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites this report for statistics on pretexting, phishing, credential use, the human element in breaches, and blocked-attack gateway mix.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA guidance when recommending phishing-resistant MFA and conditional access controls.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites this report alongside CISA guidance to support phishing-resistant MFA and conditional access.","category":"research","primary":false},{"title":"Cost of a Data Breach Report 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article references IBM's report to argue that investment in preventative controls is preferable to the costs of a data breach.","category":"research","primary":false}],"body":"\u003cp\u003eA UK consumer fintech received a malicious email claiming that its Salesforce organization had been temporarily deactivated. The email was sent through a subscription billing platform’s legitimate production transactional mail service and carried valid DKIM, SPF, and DMARC results at the organization’s inbound gateway. A human analyst confirmed the message was malicious and quarantined it.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page was hosted on a genuine Salesforce Sites organization, and the Salesforce logo was loaded from Wikimedia Commons, leaving the attacker without an obvious malicious domain or image host. The organization’s secure email gateway rewrote URLs for click protection, which caused DKIM to fail later at Microsoft 365 even though ARC records preserved the original authentication passes. The message also offered a no-click route by asking the recipient to reply with an Organization ID, bypassing link rewriting, sandboxing, and click-event monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that sender authentication and reputation systems cannot determine whether a legitimate sender is making a deceptive request. It identifies behavioral signals as more useful in this case, including a first-time sender using a major SaaS brand in the sender’s local part while sending from an unrelated domain. It recommends hunting for that sender pattern and using phishing-resistant MFA and conditional access to reduce the impact of stolen credentials.\u003c/p\u003e\n"},{"n":2,"title":"Google Gemini could soon get full access to your Mac’s files, apps and the web","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/google/google-gemini-could-soon-get-full-access-to-your-macs-files-apps-and-the-web/","time":"23:12","priority":"MAY READ","score":68,"tldr":"Google is reportedly testing Gemini Desktop options that could let the AI access and modify files, control Mac apps, and browse the web with fewer permission prompts. Sensitive actions such as purchases, money transfers, account creation, and legal agreements would still require confirmation.","briefOverview":"\u003cp\u003eGoogle is reportedly testing desktop-control capabilities for Gemini through a hidden “Additional sandbox options” setting in the Gemini Desktop app. The feature is not live, and Google has not confirmed it. If enabled, it could allow Gemini to access files across a macOS device, open apps, browse the web, and perform actions without requesting permission every time.\u003c/p\u003e\n\n\u003cp\u003eThe reported access could let Gemini read, create, modify, or delete files outside folders users explicitly connected to the service. A pop-up in Gemini Desktop also indicates the AI could communicate with Mail, Safari, and Messages to take actions through those apps. Google says Gemini would still seek confirmation before purchases, money transfers, account creation, accepting legal terms, or modifying sensitive personal information, though it is unclear when the feature may roll out or which Gemini model would power it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google is reportedly testing desktop-control capabilities for Gemini, including a hidden “Additional sandbox options” setting in the Gemini Desktop app.","If enabled, the setting could allow Gemini to read, create, modify, or delete files anywhere on a macOS device, including outside folders explicitly connected to Gemini.","Gemini could also communicate with apps such as Mail, Safari, and Messages and perform actions through them.","Google’s hidden interface says that some enabled settings may permit Gemini to take actions without asking for permission first.","Gemini would still request confirmation before purchases, money transfers, online account creation, accepting legal terms, or modifying sensitive personal information."],"insights":["The proposed access would extend beyond folders users explicitly connect to Gemini, marking a broader level of file access than the app’s existing connected-folder model.","The hidden interface indicates that permission requirements may vary by enabled setting, so Gemini could perform some actions without a prompt while still requiring confirmation for designated sensitive activities.","Google has not confirmed the feature or a rollout date, and the article says Apple may make access to personal Mac files and data more difficult for AI agents.","The reported safeguards specifically reserve user confirmation for purchases, money transfers, account creation, legal agreements, and changes to sensitive personal information."],"referencedReports":[],"body":"\u003cp\u003eGoogle is reportedly testing desktop-control capabilities for Gemini through a hidden “Additional sandbox options” setting in the Gemini Desktop app. The feature is not live, and Google has not confirmed it. If enabled, it could allow Gemini to access files across a macOS device, open apps, browse the web, and perform actions without requesting permission every time.\u003c/p\u003e\n\n\u003cp\u003eThe reported access could let Gemini read, create, modify, or delete files outside folders users explicitly connected to the service. A pop-up in Gemini Desktop also indicates the AI could communicate with Mail, Safari, and Messages to take actions through those apps. Google says Gemini would still seek confirmation before purchases, money transfers, account creation, accepting legal terms, or modifying sensitive personal information, though it is unclear when the feature may roll out or which Gemini model would power it.\u003c/p\u003e\n"},{"n":6,"title":"The State of Cybersecurity in 2026: Key Segments, Insights, and Innovations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/the-state-of-cybersecurity-in-2026key.html","time":"11:00","priority":"MAY READ","score":35,"tldr":"This sponsored 2026 cybersecurity report argues that organizations must shift to continuous, integrated risk management across identities, telemetry, endpoints, cloud environments, connected devices, and human threats. It highlights vendor perspectives on using automation and AI to improve visibility, remediation, and security operations at scale.","briefOverview":"\u003cp\u003eThe report examines how cybersecurity is changing as organizations expand their use of cloud infrastructure, AI, distributed systems, and connected environments. It says security teams must manage more identities, devices, data, and internet-facing infrastructure, with threats increasingly moving across systems rather than targeting a single point of failure. The report focuses on continuous visibility, control, and the ability to respond to risk at scale.\u003c/p\u003e\n\n\u003cp\u003eIt covers identity security, telemetry and data management, endpoint management, human risk intelligence, exposure management, human security, email and domain security, connected devices, AI-native security operations, and cloud security. Key themes include least-privilege access, automated patching and remediation, managing security data for reuse, and reducing exposures by identifying ownership and safe corrective actions. It also highlights risks from AI-enabled phishing, voice cloning, deepfakes, impersonation, fraudulent domains, and identity-driven cloud attacks, while presenting AI as a way to support investigations rather than replace human judgment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The report says cybersecurity is being reshaped by expanded cloud infrastructure, AI, distributed systems, and more complex digital environments.","It argues that identity security is becoming more important as cloud services, remote work, automation, and AI agents increase the number of human and non-human identities that need access.","The report states that collecting more security data alone does not ensure better visibility, and organizations are focusing on how data is routed, structured, retained, and reused.","It says AI-powered social engineering is making phishing, voice cloning, deepfakes, and impersonation easier to create and scale, driving a shift toward continuous and personalized human-security programs.","The report describes cloud environments as a major target for attacks driven by stolen or misused identities, credentials, configurations, and cloud controls."],"insights":["The report emphasizes that the value of security telemetry is not its volume but the ability to route, reshape, and reuse it when needed.","It frames exposure management as a process of connecting individual weaknesses to ownership and safe risk-reduction actions, rather than merely finding vulnerabilities.","It treats digital impersonation as a broader public-infrastructure issue involving domains, DNS, certificates, websites, and email rather than an email-only problem.","For connected devices, the report says risk identification must result in controls that are enforced and remain effective as the device fleet grows.","The report presents AI in security operations as a tool to speed investigations and connect evidence while retaining human judgment."],"referencedReports":[],"body":"\u003cp\u003eThe report examines how cybersecurity is changing as organizations expand their use of cloud infrastructure, AI, distributed systems, and connected environments. It says security teams must manage more identities, devices, data, and internet-facing infrastructure, with threats increasingly moving across systems rather than targeting a single point of failure. The report focuses on continuous visibility, control, and the ability to respond to risk at scale.\u003c/p\u003e\n\n\u003cp\u003eIt covers identity security, telemetry and data management, endpoint management, human risk intelligence, exposure management, human security, email and domain security, connected devices, AI-native security operations, and cloud security. Key themes include least-privilege access, automated patching and remediation, managing security data for reuse, and reducing exposures by identifying ownership and safe corrective actions. It also highlights risks from AI-enabled phishing, voice cloning, deepfakes, impersonation, fraudulent domains, and identity-driven cloud attacks, while presenting AI as a way to support investigations rather than replace human judgment.\u003c/p\u003e\n"}]</script>
