<script type="application/json" id="dl-articles">[{"n":2,"title":"Check Point gateways hacked via PHP2Shell to deploy VMware ESXi wiper","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-gateways-hacked-via-php2shell-to-deploy-vmware-esxi-wiper/","time":"16:21","priority":"MUST READ","score":96,"tldr":"Attackers exploited PHP2Shell flaws and a Check Point privilege-escalation zero-day to compromise internet-facing Security Gateway Mobile Access portals, move to VMware ESXi hosts, and deploy a data-wiping payload. Organizations should urgently apply Check Point’s November Jumbo Hotfix and investigate exposed gateways for compromise indicators.","briefOverview":"\u003cp\u003eAttackers targeted vulnerable Check Point Security Gateway systems in PHP2Shell attacks, initially affecting Israeli organizations from October 30 and later companies across several countries and sectors on November 2. They gained entry through Mobile Access portals, then used CVE-2026-123039 to obtain root-level privileges. Check Point said the same actor conducted the campaign from initial access through lateral movement and installation of PHP webshells. The activity followed exploitation of PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, which PHP patched on October 21.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining control of the gateways, the attackers installed PHP webshells and the TSGA backdoor, which includes TSProxy to receive commands hidden in normal traffic. In attacks against Israeli organizations, they used the gogo network reconnaissance tool to find VMware ESXi hosts and deployed the destroy_v6 wiper, which recursively deletes data and can overwrite it with zeros first to make recovery harder. A note named DREAM_ANNEXATION.txt containing political messages was left on affected ESXi hosts, although Check Point said the messages raise the possibility of a false flag and the activity cannot be confidently attributed. Check Point tentatively linked TSGA and TSProxy to the PhiliKit framework, previously associated by ESET with UNC5221.\u003c/p\u003e\n\n\u003cp\u003eThe second wave did not include observed destructive activity, and researchers said the attackers’ subsequent actions remain unclear. Check Point recommends deploying its November Jumbo Hotfix to Management Servers and Security Gateways, especially internet-facing Mobile Access portals, because it addresses PHP2Shell and the DynamicCLI privilege-escalation flaw. It also advises checking exposed gateways for upload_progress_pwn session files, unexpected CPconfigdaemon processes or binaries, firewall-log gaps, and unauthorized SSH activity to internal VMware ESXi hosts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited PHP2Shell flaws through Check Point Security Gateway Mobile Access portals and then used CVE-2026-123039 to obtain root-level control.","The first wave began on October 30 and targeted Israeli organizations, while a second wave on November 2 affected companies in multiple countries and sectors.","In attacks against Israeli organizations, the attackers used the gogo network scanner to locate VMware ESXi hosts and deployed the destroy_v6 data wiper.","The destroy_v6 wiper recursively deletes data and first attempts to overwrite it with zeros to make recovery more difficult.","Check Point recommends installing the November Jumbo Hotfix and checking previously exposed gateways for indicators such as upload_progress_pwn session files, unexpected CPconfigdaemon processes, firewall-log gaps, and unauthorized SSH connections to ESXi hosts."],"insights":["Exploitation attempts began four days before PHP issued emergency patches, showing that organizations could have been exposed before fixes were available.","The attackers combined access through the Mobile Access portal with a separate privilege-escalation flaw to gain full control of the gateway, then used that position to reach internal VMware ESXi hosts.","Political messages left alongside the wiper may not reliably identify the attackers, as Check Point said they raised the possibility of a false-flag operation and could not attribute the campaign with confidence.","The second wave affected organizations in multiple countries and sectors but did not include observed destructive activity, leaving the attackers’ follow-on actions unclear.","Unexplained firewall-log gaps and SSH connections from a gateway to internal ESXi hosts are specific warning signs that a gateway may already have been compromised."],"referencedReports":[{"title":"PHP2Shell Exploitation on Check Point Gateway","url":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","publisher":"check-point","context":"Check Point’s research is the primary basis for the article’s account of PHP2Shell exploitation, gateway compromise, lateral movement, and ESXi wiping activity.","category":"research","primary":true},{"title":"ESET APT Activity Report Q4 2025–Q1 2026","url":"https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q4-2025-q1-2026/","publisher":"eset","context":"The article cites ESET’s report for its prior association of the PhiliKit malware framework with the UNC5221 threat cluster.","category":"research","primary":false}],"body":"\u003cp\u003eAttackers targeted vulnerable Check Point Security Gateway systems in PHP2Shell attacks, initially affecting Israeli organizations from October 30 and later companies across several countries and sectors on November 2. They gained entry through Mobile Access portals, then used CVE-2026-123039 to obtain root-level privileges. Check Point said the same actor conducted the campaign from initial access through lateral movement and installation of PHP webshells. The activity followed exploitation of PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, which PHP patched on October 21.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining control of the gateways, the attackers installed PHP webshells and the TSGA backdoor, which includes TSProxy to receive commands hidden in normal traffic. In attacks against Israeli organizations, they used the gogo network reconnaissance tool to find VMware ESXi hosts and deployed the destroy_v6 wiper, which recursively deletes data and can overwrite it with zeros first to make recovery harder. A note named DREAM_ANNEXATION.txt containing political messages was left on affected ESXi hosts, although Check Point said the messages raise the possibility of a false flag and the activity cannot be confidently attributed. Check Point tentatively linked TSGA and TSProxy to the PhiliKit framework, previously associated by ESET with UNC5221.\u003c/p\u003e\n\n\u003cp\u003eThe second wave did not include observed destructive activity, and researchers said the attackers’ subsequent actions remain unclear. Check Point recommends deploying its November Jumbo Hotfix to Management Servers and Security Gateways, especially internet-facing Mobile Access portals, because it addresses PHP2Shell and the DynamicCLI privilege-escalation flaw. It also advises checking exposed gateways for upload_progress_pwn session files, unexpected CPconfigdaemon processes or binaries, firewall-log gaps, and unauthorized SSH activity to internal VMware ESXi hosts.\u003c/p\u003e\n"},{"n":3,"title":"Check Point warns of zero-day flaw exploited for root access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-patches-zero-day-that-lets-hackers-get-root-access/","time":"10:44","priority":"MUST READ","score":96,"tldr":"Check Point released emergency hotfixes for CVE-2026-123039, an actively exploited Gaia OS flaw that lets authenticated local users execute commands as root through the DynamicCLI socket. Attackers reportedly chained it with PHP2Shell access to compromise gateways, deploy backdoors, and pivot to VMware ESXi hosts.","briefOverview":"\u003cp\u003eCheck Point released emergency hotfixes for CVE-2026-123039, a high-severity Gaia OS flaw that it says attackers have actively exploited against a couple of dozen customers since late October. The issue affects the DynamicCLI service, which runs with root-level permissions and accepts commands through a world-writable local socket without authenticating the process connecting to it. An authenticated local user can therefore send commands through the socket and have them executed with full system privileges. Affected products include Check Point Firewall, Security Gateway, Security Management Server, Multi-Domain Security Management Server, and Scalable Platforms.\u003c/p\u003e\n\n\u003cp\u003eAccording to Check Point, attackers first accessed Mobile Access portals through PHP2Shell vulnerabilities and then used CVE-2026-123039 to gain root access. They subsequently deployed webshells, TSGA and TSProxy malware, moved from the compromised gateway to a VMware ESXi host, and installed destructive wiper malware. Organizations that cannot immediately apply the hotfixes can temporarily stop the dynamic_server process and prevent it from restarting. Check Point also provided indicators and advised investigating unusual system() use and commands that bypass the normal Clish wrapper.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point released emergency hotfixes for CVE-2026-123039, a high-severity Gaia OS flaw that has been actively exploited to obtain root-level access on vulnerable devices.","The vulnerability affects the DynamicCLI service because it accepts requests through a local socket that any local process can access without verifying who sent the request.","Check Point said attackers exploited PHP2Shell flaws to access Mobile Access portals, then used CVE-2026-123039 to gain full control and establish persistence.","The attackers deployed webshells, TSGA and TSProxy malware, moved from compromised gateways to VMware ESXi hosts, and deployed destructive wiper malware.","Organizations unable to immediately apply the hotfixes can temporarily stop the dynamic_server process and prevent it from restarting, according to Check Point."],"insights":["Although CVE-2026-123039 requires authenticated local access, attackers reportedly paired it with PHP2Shell flaws in the Mobile Access portal, showing how an initial gateway compromise could be escalated to full device control.","The vulnerable DynamicCLI service runs as root while accepting requests through a world-writable local socket without checking the requesting process, making it a direct route from local access to root-level command execution.","Check Point says defenders can look for unusual use of the system() function and commands that bypass the normal Clish wrapper, which may indicate commands were run through the vulnerable socket with root privileges.","If patching cannot happen immediately, Check Point recommends stopping the dynamic_server process and preventing it from restarting as a temporary measure.","The reported intrusion path extended beyond the Check Point gateway to VMware ESXi hosts and ended with destructive data-wiping malware, increasing the potential impact beyond the originally compromised device."],"referencedReports":[{"title":"Check Point security advisory for CVE-2026-123039","url":"https://support.checkpoint.com/results/sk/sk1000362","publisher":"check-point","context":"The article cites Check Point's advisory warning that the DynamicCLI flaw was actively exploited and providing mitigation and compromise-detection guidance.","category":"advisory","primary":true},{"title":"PHP2Shell Exploitation on Check Point Gateway","url":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","publisher":"check-point","context":"The article cites Check Point's research report for details of the attack chain, including initial Mobile Access portal compromise, privilege escalation, and malware deployment.","category":"research","primary":true}],"body":"\u003cp\u003eCheck Point released emergency hotfixes for CVE-2026-123039, a high-severity Gaia OS flaw that it says attackers have actively exploited against a couple of dozen customers since late October. The issue affects the DynamicCLI service, which runs with root-level permissions and accepts commands through a world-writable local socket without authenticating the process connecting to it. An authenticated local user can therefore send commands through the socket and have them executed with full system privileges. Affected products include Check Point Firewall, Security Gateway, Security Management Server, Multi-Domain Security Management Server, and Scalable Platforms.\u003c/p\u003e\n\n\u003cp\u003eAccording to Check Point, attackers first accessed Mobile Access portals through PHP2Shell vulnerabilities and then used CVE-2026-123039 to gain root access. They subsequently deployed webshells, TSGA and TSProxy malware, moved from the compromised gateway to a VMware ESXi host, and installed destructive wiper malware. Organizations that cannot immediately apply the hotfixes can temporarily stop the dynamic_server process and prevent it from restarting. Check Point also provided indicators and advised investigating unusual system() use and commands that bypass the normal Clish wrapper.\u003c/p\u003e\n"},{"n":18,"title":"Hackers Exploit PHP2Shell Flaws in Check Point Gateways to Deploy TSGA Backdoor and Wipe ESXi Files","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-php2shell-flaws-in.html","time":"08:05","priority":"MUST READ","score":96,"tldr":"Attackers exploited unpatched PHP2Shell flaws and a Gaia OS privilege-escalation bug in Check Point gateways to install the TSGA backdoor, then in some cases pivoted to VMware ESXi hosts and deployed the destroy_v6 wiper. Organizations should urgently apply Check Point fixes and investigate gateway and ESXi activity for signs of compromise.","briefOverview":"\u003cp\u003eAn unknown threat actor targeted unpatched Check Point Security Gateways starting on October 30, 2026, initially focusing on Israeli organizations before expanding to organizations in multiple countries on November 2. The attackers used PHP2Shell vulnerabilities for initial access and CVE-2026-123039, a Gaia OS DynamicCLI authorization flaw, to elevate privileges from a portal service account to root. Check Point said it observed active exploitation of the local privilege-escalation issue against a couple of dozen customers.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining control, the attackers installed PHP web shells and the TSGA backdoor with its TSProxy component. Check Point described TSGA as a Linux gateway implant capable of encrypted remote access, configuration theft, persistence through backups and snapshots, process injection, and firewall-log tampering. In some cases, the attackers used SSH and the vpxuser service account to reach VMware ESXi hosts, execute the destroy_v6 file wiper, and leave DREAM_ANNEXATION.txt notes; while TSGA and TSProxy resemble the PhiliKit toolkit, Check Point said the evidence was insufficient for confident attribution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unknown threat actor targeted unpatched Check Point Security Gateways beginning on October 30, 2026, using PHP2Shell vulnerabilities for initial access.","The attackers used CVE-2026-123039, a local privilege-escalation flaw in Gaia OS DynamicCLI, to move from a portal service account to root access.","The campaign deployed PHP web shells and the TSGA backdoor, including its TSProxy component, to maintain access and manipulate network connections through appliance processes.","In some incidents, the attackers moved over SSH from the compromised gateway to VMware ESXi hosts, deployed the destroy_v6 wiper, and left DREAM_ANNEXATION.txt notes.","Check Point said the TSGA and TSProxy components resemble the PhiliKit toolkit but that available evidence is insufficient to confidently attribute the campaign to Armory Castle or another China-linked group."],"insights":["The attackers combined a publicly exposed entry point with a separate local flaw that required existing code execution, showing how chained weaknesses on a gateway can lead to full administrative control.","TSGA and TSProxy provided two forms of persistence: a standalone hidden program and concealed connections routed through existing appliance processes, while normal network traffic continued to work.","The destructive activity extended beyond the compromised gateway because the attackers used the vpxuser service account to log in to a VMware ESXi host and run a file-wiping program.","Check Point observed active exploitation against a couple of dozen customers about a week after a security fix became available, underscoring the short window between patch release and abuse.","Although some components resembled a toolkit previously linked to a China-nexus group, Check Point said the wiper use and Israel-focused political note prevented confident attribution."],"referencedReports":[{"title":"PHP2Shell Exploitation on Check Point Gateway","url":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","publisher":"check-point","context":"Check Point detailed the observed campaign targeting its Security Gateways, including the TSGA backdoor and destructive activity against VMware ESXi hosts.","category":"research","primary":true},{"title":"CVE-2026-123039","url":"https://support.checkpoint.com/results/sk/sk1000362","publisher":"check-point","context":"The article links to Check Point’s advisory information for the DynamicCLI local privilege-escalation flaw used in the campaign.","category":"advisory","primary":false}],"body":"\u003cp\u003eAn unknown threat actor targeted unpatched Check Point Security Gateways starting on October 30, 2026, initially focusing on Israeli organizations before expanding to organizations in multiple countries on November 2. The attackers used PHP2Shell vulnerabilities for initial access and CVE-2026-123039, a Gaia OS DynamicCLI authorization flaw, to elevate privileges from a portal service account to root. Check Point said it observed active exploitation of the local privilege-escalation issue against a couple of dozen customers.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining control, the attackers installed PHP web shells and the TSGA backdoor with its TSProxy component. Check Point described TSGA as a Linux gateway implant capable of encrypted remote access, configuration theft, persistence through backups and snapshots, process injection, and firewall-log tampering. In some cases, the attackers used SSH and the vpxuser service account to reach VMware ESXi hosts, execute the destroy_v6 file wiper, and leave DREAM_ANNEXATION.txt notes; while TSGA and TSProxy resemble the PhiliKit toolkit, Check Point said the evidence was insufficient for confident attribution.\u003c/p\u003e\n"},{"n":20,"title":"Hackers Exploit N-central Flaws to Infect 21 Servers, Including 19 Running Hotfix 2","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-n-central-flaws-to.html","time":"05:43","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the 4EverAble2Shell chain in N-able N-central to gain root access and deploy XMRig miners, including against servers already running Hotfix 2. Organizations should upgrade both N-central Agents and Probes to 2026.4 HF1 or later, disable Legacy API access, and investigate any suspected compromise as a full server breach.","briefOverview":"\u003cp\u003eN-able has restricted certain N-central features after disclosure of the 4EverAble2Shell and Agent2Shell flaws. In hosted environments, the company turned off the Legacy API by default and temporarily disabled Intune integration while it implements and validates additional protections. It advised customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later; on-premises customers should also ensure Legacy API access is disabled.\u003c/p\u003e\n\n\u003cp\u003eThe 4EverAble2Shell chain combines Apache Axis vulnerability CVE-2026-90436 with an N-central privilege-escalation weakness, allowing unauthenticated attackers to execute operating-system commands with root privileges. Researchers observed attackers using a shell script hosted at 157.20.241[.]16 to install XMRig Monero miners on 21 N-central servers across the United States, South Africa, Canada, the United Kingdom, Germany, France, and Sweden. Huntback reported that 19 of the affected servers were already running Hotfix 2 and warned that a successful intrusion should be handled as a full compromise because the server manages customer endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able restricted certain N-central features and integrations after disclosure of the 4EverAble2Shell and Agent2Shell flaws, including disabling the Legacy API by default and temporarily turning off Intune integration in hosted environments.","The 4EverAble2Shell exploit chain combines Apache Axis flaw CVE-2026-90436 with an N-central privilege-escalation weakness to let unauthenticated attackers run operating-system commands with root privileges.","Threat actors have actively exploited 4EverAble2Shell to download a shell script from 157.20.241[.]16 and deploy XMRig Monero miners on 21 N-central servers.","Huntback reported that 19 of the 21 compromised N-central servers were already running Hotfix 2, and warned that applying the hotfix alone is insufficient.","N-able advised hosted and on-premises customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later, while on-premises customers should also ensure Legacy API access is disabled."],"insights":["Installing Hotfix 2 alone did not stop the observed intrusions: 19 of the 21 affected servers were already running it, making the additional Agent and Probe upgrade guidance particularly important.","The observed cryptocurrency miner deliberately uses only half of a server’s available CPU cores, apparently to make its activity less noticeable.","N-able temporarily disabled its Intune integration and turned off the Legacy API by default in hosted environments while it develops and validates further protections.","Because a compromised N-central server manages customer endpoints, Huntback says an intrusion should be treated as a full compromise rather than simply removing the miner."],"referencedReports":[{"title":"VULN-2026-0009","url":"https://previdian.com/VULN-2026-0009","publisher":"previdian","context":"Previdian's technical analysis describes the 4EverAble2Shell chain as an unauthenticated route to root-level command execution through Apache Axis SOAP fault processing.","category":"research","primary":false},{"title":"N-central 4EverAble2Shell Miners on Live Servers","url":"https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers","publisher":"huntback","context":"Huntback reported active exploitation that used the flaw to deploy XMRig Monero miners on 21 N-central servers, including systems running Hotfix 2.","category":"research","primary":false}],"body":"\u003cp\u003eN-able has restricted certain N-central features after disclosure of the 4EverAble2Shell and Agent2Shell flaws. In hosted environments, the company turned off the Legacy API by default and temporarily disabled Intune integration while it implements and validates additional protections. It advised customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later; on-premises customers should also ensure Legacy API access is disabled.\u003c/p\u003e\n\n\u003cp\u003eThe 4EverAble2Shell chain combines Apache Axis vulnerability CVE-2026-90436 with an N-central privilege-escalation weakness, allowing unauthenticated attackers to execute operating-system commands with root privileges. Researchers observed attackers using a shell script hosted at 157.20.241[.]16 to install XMRig Monero miners on 21 N-central servers across the United States, South Africa, Canada, the United Kingdom, Germany, France, and Sweden. Huntback reported that 19 of the affected servers were already running Hotfix 2 and warned that a successful intrusion should be handled as a full compromise because the server manages customer endpoints.\u003c/p\u003e\n"},{"n":21,"title":"FBI Says North Korean Hackers Stole Over $400 Million in Crypto Using Deepfake Video Calls","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/fbi-says-north-korean-hackers-stole.html","time":"14:28","priority":"MUST READ","score":94,"tldr":"The FBI says North Korea-linked BlueNoroff actors stole more than $400 million in cryptocurrency through FaceStealer, a self-propagating social-engineering campaign using deepfake video calls, compromised trusted accounts, and ClickFix-style malware lures. U.S. authorities seized supporting infrastructure and restrained over $1.2 billion in crypto linked to DPRK theft operations.","briefOverview":"\u003cp\u003eThe FBI says North Korea-linked actors, associated with BlueNoroff, stole more than \u003cspan class=\"math inline\"\u003e\\(400 million in cryptocurrency over the last 18 months through a social-engineering operation called FaceStealer. U.S. authorities seized cloud infrastructure used in the campaign and more than 900 webcam recordings used to impersonate victims. Separately, the Justice Department announced the seizure and restraint of more than \\)\u003c/span\u003e1.2 billion in cryptocurrency allegedly stolen by North Korea-linked TraderTraitor actors following the Binance hack. U.S. officials said the proceeds support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eFaceStealer begins with attackers using a compromised person’s communications account to invite their contacts to a supposed Zoom or Microsoft Teams meeting about an investment opportunity. In the fake meeting, attackers play recorded video of the trusted contact and may use deepfake videos or AI-generated avatars to make the participants appear real. They then claim there is an audio or technical problem and direct the target to a link, script, or command that installs malware capable of stealing cryptocurrency, sensitive information, and access to additional systems. The cycle repeats when the newly compromised victim’s accounts, contacts, and video recordings are used to target more people.\u003c/p\u003e\n\n\u003cp\u003eThe campaign has primarily targeted people in cryptocurrency, Web3, finance, and software development, including founders, executives, and open-source maintainers. Researchers reported that the operation expanded to 677 identified targets in 58 countries, with more than 80% of targets being founders or C-suite executives. The article also distinguishes FaceStealer from the related Contagious Interview campaign, which uses fake recruiter outreach and malicious coding assignments, repositories, VS Code settings, Git hooks, and trojanized macOS installers to persuade job seekers to run malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI says North Korea-linked actors stole more than $400 million in cryptocurrency over the past 18 months through the FaceStealer social-engineering scheme.","FaceStealer uses compromised accounts, recorded victim video, and deepfake footage to impersonate trusted contacts during fake Zoom or Microsoft Teams meetings.","Victims are told to fix a fabricated technical problem by clicking a link or running commands, which installs malware that steals cryptocurrency and sensitive data.","The FBI seized infrastructure used in the campaign and more than 900 webcam recordings that attackers used to impersonate victims in follow-on attacks.","The U.S. Department of Justice also announced the seizure and restraint of more than $1.2 billion in cryptocurrency allegedly stolen by North Korea-linked TraderTraitor actors after the Binance hack."],"insights":["FaceStealer is designed as a self-propagating cycle: after compromising one person, attackers use that person’s communications accounts, contacts, and recorded video to make the next set of lures more convincing.","The attackers can create convincing fake meeting participants from public YouTube interviews and conference talks, allowing them to imitate founders or executives without first compromising those individuals.","More than 80% of the campaign’s identified targets were founders or C-suite executives, reflecting a focus on people who may control funds, signing keys, sensitive information, or trusted business relationships.","The operation also targets software maintainers and developers, as shown by the attempted compromise of an Axios npm package maintainer to distribute a trojanized software release.","The related Contagious Interview campaign has used job assessments, VS Code workspace settings, Git hooks, and fake macOS installers to make victims run malicious code under the appearance of a legitimate recruiting process."],"referencedReports":[{"title":"FaceStealer Cryptocurrency Theft Scheme","url":"https://www.fbi.gov/investigate/cyber/facestealer-cryptocurrency-theft-scheme","publisher":"fbi","context":"The article cites the FBI’s material on the FaceStealer campaign and the seizure of its cloud infrastructure.","category":"advisory","primary":true},{"title":"IC3 Cybersecurity Advisory 261112","url":"https://www.ic3.gov/CSA/2026/261112.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references this advisory for the detailed step-by-step FaceStealer attack flow.","category":"advisory","primary":true},{"title":"BlueNoroff Zoom Phishing Kit Profiles","url":"https://thehackernews.com/2026/07/bluenoroff-zoom-phishing-kit-profiles.html","publisher":"jumpsec","context":"The article cites JUMPSEC’s extensive report describing FaceStealer as a victim-acquisition platform built on fake Zoom and Microsoft Teams phishing pages.","category":"research","primary":false},{"title":"BlueNoroff Uses ClickFix, Fileless PowerShell, and AI-Generated Zoom Meetings to Target Web3 Sector","url":"https://arcticwolf.com/resources/blog/bluenoroff-uses-clickfix-fileless-powershell-and-ai-generated-zoom-meetings-to-target-web3-sector/","publisher":"arctic-wolf","context":"The article cites Arctic Wolf’s report on the campaign’s victims, geographic reach, and focus on cryptocurrency and finance executives.","category":"research","primary":false},{"title":"Still in the Meeting: BlueNoroff Six Months On","url":"https://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/","publisher":"arctic-wolf","context":"The article references Arctic Wolf’s follow-up analysis of expanded targeting, new lures, and use of AI-generated meeting media.","category":"research","primary":false},{"title":"INC-2026-002 Root Cause Analysis","url":"https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002","publisher":"sophos","context":"The article cites Sophos’s analysis of a corporate macOS compromise caused by a weaponized VS Code workspace in a fake job-interview repository.","category":"research","primary":false},{"title":"AccuraSoftHire Fake Interview Campaign","url":"https://research.jfrog.com/post/accurasofthire-fake-interview/","publisher":"jfrog-security-research","context":"The article references JFrog research describing the AccuraSoftHire decoy company and its fake recruiting process for delivering malware.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI says North Korea-linked actors, associated with BlueNoroff, stole more than \u003cspan class=\"math inline\"\u003e\\(400 million in cryptocurrency over the last 18 months through a social-engineering operation called FaceStealer. U.S. authorities seized cloud infrastructure used in the campaign and more than 900 webcam recordings used to impersonate victims. Separately, the Justice Department announced the seizure and restraint of more than \\)\u003c/span\u003e1.2 billion in cryptocurrency allegedly stolen by North Korea-linked TraderTraitor actors following the Binance hack. U.S. officials said the proceeds support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eFaceStealer begins with attackers using a compromised person’s communications account to invite their contacts to a supposed Zoom or Microsoft Teams meeting about an investment opportunity. In the fake meeting, attackers play recorded video of the trusted contact and may use deepfake videos or AI-generated avatars to make the participants appear real. They then claim there is an audio or technical problem and direct the target to a link, script, or command that installs malware capable of stealing cryptocurrency, sensitive information, and access to additional systems. The cycle repeats when the newly compromised victim’s accounts, contacts, and video recordings are used to target more people.\u003c/p\u003e\n\n\u003cp\u003eThe campaign has primarily targeted people in cryptocurrency, Web3, finance, and software development, including founders, executives, and open-source maintainers. Researchers reported that the operation expanded to 677 identified targets in 58 countries, with more than 80% of targets being founders or C-suite executives. The article also distinguishes FaceStealer from the related Contagious Interview campaign, which uses fake recruiter outreach and malicious coding assignments, repositories, VS Code settings, Git hooks, and trojanized macOS installers to persuade job seekers to run malware.\u003c/p\u003e\n"},{"n":28,"title":"Critical Apache HTTP Server vulnerability can allow remote code execution (CVE-2026-119618)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/cve-2026-119618-apache-http-server-rce","time":"08:49","priority":"MUST READ","score":93,"tldr":"CVE-2026-119618 is a critical unauthenticated remote-code-execution flaw in Apache HTTP Server’s HTTP/2 module affecting versions 2.4.55–2.4.70; upgrade to 2.4.71 or later, or disable HTTP/2 until patching is possible.","briefOverview":"\u003cp\u003eCVE-2026-119618 is a critical flaw in the HTTP/2 module, mod_http2, of Apache HTTP Server versions 2.4.55 through 2.4.70. The flaw can allow an unauthenticated remote attacker to run arbitrary code on a server with HTTP/2 enabled. As of publication, the article states that there were no reports of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue is a race condition in the \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads improperly share resources and can cause heap corruption. Apache HTTP Server 2.4.71 and later fix the problem, while standalone mod_h2 builds should be upgraded to versions newer than 2.0.42. Organizations that cannot patch immediately can disable HTTP/2 and restrict Apache to HTTP/1.1, although this only reduces exposure rather than fixing the underlying issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical race condition in Apache HTTP Server’s mod_http2 module that can allow an unauthenticated remote attacker to execute arbitrary code.","Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 are affected when HTTP/2 is enabled.","Upgrading Apache HTTP Server to version 2.4.71 or later, or using a mod_h2 version newer than 2.0.42, fixes the issue.","Organizations that cannot patch immediately can reduce exposure by disabling HTTP/2 and restricting Apache to HTTP/1.1.","As of publication, there were no reports that the flaw was being exploited in the wild."],"insights":["A server can be vulnerable even if a vendor package scanner does not mark it as affected when the operating system vendor has not yet published a fixed package, so distribution-specific trackers should also be checked.","Standard HTTP load balancers usually prevent the normal exposure scenario described in the article, meaning the network setup in front of Apache materially changes risk.","Because successful code execution runs with the web server process’s privileges, a compromised Apache server in cloud environments could provide a path toward adjacent services or cloud metadata endpoints.","Disabling HTTP/2 reduces exposure by removing the attack path, but it is only a temporary mitigation and does not correct the underlying software flaw."],"referencedReports":[{"title":"Apache HTTP Server 2.4 Vulnerabilities","url":"https://httpd.apache.org/security/vulnerabilities_24.html","publisher":"apache-software-foundation","context":"The article identifies this Apache security advisory as listing CVE-2026-119618.","category":"advisory","primary":true}],"body":"\u003cp\u003eCVE-2026-119618 is a critical flaw in the HTTP/2 module, mod_http2, of Apache HTTP Server versions 2.4.55 through 2.4.70. The flaw can allow an unauthenticated remote attacker to run arbitrary code on a server with HTTP/2 enabled. As of publication, the article states that there were no reports of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue is a race condition in the \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads improperly share resources and can cause heap corruption. Apache HTTP Server 2.4.71 and later fix the problem, while standalone mod_h2 builds should be upgraded to versions newer than 2.0.42. Organizations that cannot patch immediately can disable HTTP/2 and restrict Apache to HTTP/1.1, although this only reduces exposure rather than fixing the underlying issue.\u003c/p\u003e\n"},{"n":34,"title":"The Take-Home Test That Runs on Your Work Laptop: Inside the AccuraSoftHire Fake Interview Campaign","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines","time":"17:04","priority":"MUST READ","score":92,"tldr":"A fake-job-interview campaign dubbed AccuraSoftHire used malicious npm look-alike packages, a fake camera driver, and a browser extension to infect developers with the PolinRider loader, which retrieves changing C2 addresses from Ethereum transactions and steals credentials. Organizations should search developer devices and network logs for the listed packages, artifacts, wallet-linked IPs, and immediately rotate credentials on any affected machine.","briefOverview":"\u003cp\u003eJFrog documented AccuraSoftHire, a fake hiring company that used job listings, recruiter profiles, coding assignments, a supposed camera driver, and a manually installed browser extension to persuade candidates to run malicious code. The article connects this tactic to Binance’s report that a developer ran a fake interview assignment on a work laptop before attackers ultimately reached its internal wallet signing service and stole about $6.34 billion on October 29. The article says the risk is not limited to job seekers: a compromised developer machine can expose employer credentials, deployment tokens, and source-code repositories.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s PolinRider loader runs during a project build rather than during package installation, retrieves its server address from Ethereum wallet transactions, and downloads later stages over unencrypted HTTP on port 443. The article found that some malicious npm look-alike packages remained available for months and recorded more than 4,000 combined downloads for two of them in 2026. It recommends searching developer machines and network logs for the listed packages, automatic VS Code tasks, browser-extension artifacts, and server addresses, then rotating all credentials and checking repositories if an infection is found.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog documented a fake company called AccuraSoftHire that used job listings, verified-looking recruiter profiles, coding assignments, a supposed camera driver, and a manually loaded browser extension to induce candidates to run malicious code.","The campaign’s PolinRider loader retrieves its command server address from transactions sent by Ethereum wallet 0xa322E5f3D311D3080e6f0121063e9aDC2490Ef1a, allowing the operator to change servers without updating the malicious package.","Two malicious npm packages used by the interview tasks, tailwind-lines-clamps and tailwind-lineclamp, remained available for about 211 and 169 days respectively, with npm recording more than 4,000 combined downloads in 2026.","Binance reported that an engineer ran a fake interview assignment on a work computer in September, and the attacker later used compromised systems and a deployment token to reach its internal wallet signing service before the October 29 theft.","The article advises organizations to search developer devices for the listed npm packages, automatic VS Code tasks, and the job-new-alerts browser-extension folder, then rotate all credentials from any affected machine and inspect repositories for malicious changes."],"insights":["Blocking only newly published software packages would not have stopped this campaign’s oldest look-alike packages, because tailwind-lines-clamps and tailwind-lineclamp remained available for roughly five to seven months.","The malicious package code did not run when the package was installed; it ran during the project’s CSS build, meaning defenses focused only on installation-time scripts could miss it.","The attacker’s server-address history is publicly recoverable from Ethereum transactions, allowing defenders to search for connections to all previously used server addresses rather than only the latest one.","Reinstalling or wiping an infected developer laptop may not be sufficient if the malware has already inserted its loader into the developer’s code repositories, where it can run again when projects are reopened.","A work laptop used for an external interview can expose an employer’s credentials and internal systems even when the employee, rather than the company, is the apparent target of the recruiting scam."],"referencedReports":[{"title":"Contagious Interview: One Interview Away From Infection","url":"https://research.jfrog.com/post/accurasofthire-fake-interview/","publisher":"jfrog-security-research","context":"The article builds on JFrog’s research into the AccuraSoftHire fake-company campaign and its malicious interview-task delivery methods.","category":"research","primary":true},{"title":"29 October 2026 Binance Security Incident: Initial Findings and Response Update","url":"https://www.binance.com/en/blog/community/3229153443759566763","publisher":"binance","context":"The article cites Binance’s incident report describing how a fake job interview contributed to the compromise preceding the October 29 theft.","category":"research","primary":true},{"title":"NullReceiver","url":"https://opensourcemalware.com/blog/nullreceiver-dprk-c2-technique","publisher":"opensourcemalware","context":"The article references this technical analysis for its description of the Ethereum-transaction technique used to publish changing command-server addresses.","category":"research","primary":false},{"title":"A Developer's Guide to Getting Rid of PolinRider","url":"https://opensourcemalware.com/blog/developer-guide-getting-over-polinrider","publisher":"opensourcemalware","context":"The article cites this analysis for details on PolinRider credential theft and its spread into victims’ git repositories.","category":"guide","primary":false}],"body":"\u003cp\u003eJFrog documented AccuraSoftHire, a fake hiring company that used job listings, recruiter profiles, coding assignments, a supposed camera driver, and a manually installed browser extension to persuade candidates to run malicious code. The article connects this tactic to Binance’s report that a developer ran a fake interview assignment on a work laptop before attackers ultimately reached its internal wallet signing service and stole about $6.34 billion on October 29. The article says the risk is not limited to job seekers: a compromised developer machine can expose employer credentials, deployment tokens, and source-code repositories.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s PolinRider loader runs during a project build rather than during package installation, retrieves its server address from Ethereum wallet transactions, and downloads later stages over unencrypted HTTP on port 443. The article found that some malicious npm look-alike packages remained available for months and recorded more than 4,000 combined downloads for two of them in 2026. It recommends searching developer machines and network logs for the listed packages, automatic VS Code tasks, browser-extension artifacts, and server addresses, then rotating all credentials and checking repositories if an infection is found.\u003c/p\u003e\n"},{"n":23,"title":"PostgreSQL Patches 52 Flaws, Including 22-Year-Old Bug Enabling Authenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/postgresql-patches-52-flaws-including.html","time":"16:53","priority":"MUST READ","score":91,"tldr":"PostgreSQL has patched CVE-2026-6460, a 22-year-old type-confusion flaw that can allow authenticated users able to create database objects to execute code as the PostgreSQL OS account. Administrators should promptly update supported versions and rebuild all C-language extensions, as old extension builds may remain vulnerable.","briefOverview":"\u003cp\u003ePostgreSQL released updates addressing 52 security flaws, including CVE-2026-6460, a type-confusion issue rated CVSS 8.8. The flaw affects releases before PostgreSQL 18.7, 17.12, 16.16, 15.20, and 14.25. It can allow a database user who can create objects to run code with the operating-system permissions of the account running PostgreSQL. The project and CISA had not reported known exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs when a field type in a composite type is changed while the server still holds older values, which can cause an old value to be interpreted as the new type. Researcher Mehmet Ince demonstrated an exploit against PostgreSQL 18.6 that can crash an unpatched server and leak memory addresses, though the command-execution SQL was not published. Administrators should update the server, rebuild or update C-language extensions, restart PostgreSQL where necessary, update client tools, and follow the release\u0026rsquo;s reindexing and backup guidance. PostgreSQL 14.25 is the last release for PostgreSQL 14, while older affected major versions received no update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PostgreSQL released updates that fix 52 security flaws, including CVE-2026-6460, a type-confusion issue with a CVSS score of 8.8.","CVE-2026-6460 affects PostgreSQL versions before 18.7, 17.12, 16.16, 15.20, and 14.25 and can allow a database user able to create objects to run code with the operating-system permissions of the PostgreSQL service account.","The flaw involves changing a field type in a composite type while older values are still held by the server, causing the server to interpret an old value as the new type.","Administrators should update PostgreSQL, rebuild or update all C-language extensions, restart deployments that run outside the package service unit, and update client tools such as pg_dump, pg_restore, reindexdb, and vacuumdb.","CVE-2026-116322 can allow an unauthenticated client to trigger a restart of PostgreSQL 18 servers."],"insights":["Updating PostgreSQL alone may not fully protect a server, because C-language extensions built against older releases can still load but may not receive the release's vulnerability protections.","The published exploit demonstrates a crash and memory-address leak, but its final command-execution SQL was not published, and the article says it is unclear whether a default-privilege account can progress from crashing the server to running code.","PostgreSQL 14.25 is the final release for PostgreSQL 14, while older affected major versions received no update, leaving upgrade as the practical path for systems on unsupported versions.","After updating, administrators are instructed to perform reindexing and to create a new full backup before continuing incremental backups.","The new composite_type_mismatch setting can disable the added checks, but PostgreSQL warns that doing so creates security risks."],"referencedReports":[{"title":"How I Ended Up Turning a 22-Year-Old PostgreSQL Type Confusion Primitive into RCE (CVE-2026-6460)","url":"https://mehmetince.net/part-3-6-how-i-ended-up-turning-a-22-year-old-postgresql-type-confusion-primitive-into-rce-cve-2026-6460/","publisher":"mehmet ince","context":"The article cites this technical writeup for a working exploit demonstrated against PostgreSQL 18.6, including a crash and memory-address leak.","category":"research","primary":true},{"title":"CVE-2026-6460","url":"https://www.postgresql.org/support/security/CVE-2026-6460/","publisher":"postgresql global development group","context":"The article cites PostgreSQL's security advisory for its description of the required attacker access and the vulnerability's impact.","category":"advisory","primary":true},{"title":"CVE-2026-6460","url":"https://access.redhat.com/security/cve/cve-2026-6460","publisher":"red hat","context":"The article cites Red Hat's CVE assessment for its statement that an attacker needs a database login able to create or modify objects.","category":"advisory","primary":false}],"body":"\u003cp\u003ePostgreSQL released updates addressing 52 security flaws, including CVE-2026-6460, a type-confusion issue rated CVSS 8.8. The flaw affects releases before PostgreSQL 18.7, 17.12, 16.16, 15.20, and 14.25. It can allow a database user who can create objects to run code with the operating-system permissions of the account running PostgreSQL. The project and CISA had not reported known exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs when a field type in a composite type is changed while the server still holds older values, which can cause an old value to be interpreted as the new type. Researcher Mehmet Ince demonstrated an exploit against PostgreSQL 18.6 that can crash an unpatched server and leak memory addresses, though the command-execution SQL was not published. Administrators should update the server, rebuild or update C-language extensions, restart PostgreSQL where necessary, update client tools, and follow the release\u0026rsquo;s reindexing and backup guidance. PostgreSQL 14.25 is the last release for PostgreSQL 14, while older affected major versions received no update.\u003c/p\u003e\n"},{"n":35,"title":"ARTEX: Attackers Adopted This AI Pentesting Tool in Three Months. Leaked Secrets Are Its Fastest Way In.","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/artex-ai-pentesting-tool-attackers-leaked-secrets","time":"15:22","priority":"SHOULD READ","score":89,"tldr":"ARTEX, an AI-driven penetration-testing framework, was adopted by state-linked and criminal actors within months, enabling fast, scalable intrusions that often began with exposed secrets, weak development credentials, or trusted application tokens. Organizations should rotate leaked credentials, replace long-lived CI/CD keys with short-lived OIDC tokens, remove development access from internet-facing systems, and check for compromised ARTEX Docker images.","briefOverview":"\u003cp\u003eARTEX is an AI-assisted penetration-testing framework that assigns agents to plan attacks, scan targets, run tools, and record findings under human direction. Published on GitHub on July 26, 2026, it was reportedly adopted within months by China-linked groups, criminal crews, and a researcher whose agent accessed a WorkOS internal tool. Reports described targeting of hundreds of organizations, including financial firms, government and defense organizations, technology companies, and organizations in South Korea, Southeast Asia, India, and other countries. The original ARTEX repository was removed on October 8 after its author said the tool had been abused, but numerous copies and forks remained available.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central finding is that ARTEX agents often gain access fastest through exposed credentials, such as secrets found in public GitHub repositories, predictable development passwords deployed to production, and trusted application credentials. Microsoft reported one case in which an agent moved from searching GitHub to stealing data from Azure Key Vault in five minutes, while GitGuardian found agents could independently search code and git history for secrets even though ARTEX lacked a dedicated secret-hunting feature. A malicious ARTEX copy also redirected users to a backdoored Docker image that could run commands as root before checking a password; the image was pulled about 9,131 times. The article recommends rotating exposed secrets, using short-lived OIDC credentials in CI/CD systems, eliminating development credentials from internet-facing services, checking ARTEX installations for the malicious Docker images, and hunting for listed network indicators such as ARTEX user agents and exposed consoles on port 8787.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ARTEX is an AI-assisted penetration-testing framework that uses agents to plan actions, run scanning and exploit tools, and record findings against a target chosen by an operator.","Microsoft reported that AI agents searched public GitHub repositories for exposed credentials and, in at least one case, used a found secret to steal data from an Azure Key Vault within five minutes.","Threat groups including Storm-0940, VAPOR PANDA, Storm-3358, Crafty Falcon, and a South Korean criminal ring used ARTEX or related AI attack tooling against organizations in multiple countries.","A GitHub copy of ARTEX redirected installations to backdoored Docker images, which were downloaded about 9,131 times and could run commands as root before checking the login password.","The article recommends rotating exposed secrets, replacing long-lived CI/CD cloud keys with short-lived OIDC tokens, removing development credentials from internet-facing systems, and investigating ARTEX indicators such as its listed user agents and port 8787 consoles."],"insights":["GitGuardian found that ARTEX had no built-in secret-hunting feature, yet agents in a sealed test environment independently searched code and git history and found eight of nine planted secrets, including an AWS key in history.","The backdoored ARTEX source copy differed from the original by only one Docker image reference, while the malicious code was contained solely in the prebuilt image, making a source-code review insufficient to detect the compromise.","Microsoft observed an agent correct a malformed Azure request within about 28 seconds, illustrating how automated agents can rapidly adapt without human intervention.","The WorkOS incident showed that an internet-exposed internal tool, a predictable development credential, no rate limits, and delayed detection allowed an agent to collect internal customer-related records without exploiting a software flaw.","Storm-0940 used credentials from a trusted ConnectWise Cloud Backup application to attempt access across more than 2,250 customer Microsoft 365 environments, showing how one application credential can create broad downstream exposure."],"referencedReports":[{"title":"From Penetration Testing to Cyber Threat: Beware of ARTEX","url":"https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex","publisher":"cert-eu","context":"The article cites CERT-EU's technical assessment that ARTEX has no hard technical enforcement of target scope.","category":"research","primary":true},{"title":"Storm-0940 Uses ARTEX Agentic AI in ConnectWise Supply Chain Compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/","publisher":"microsoft","context":"The article relies on Microsoft's report describing Storm-0940's ARTEX use and compromise of ConnectWise Cloud Backup credentials.","category":"research","primary":true},{"title":"ARTEX in the Wild: Storm-0940 Expands Targeting of IT and Software Vendors","url":"https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors","publisher":"wiz","context":"The article cites Wiz's research on Storm-0940 targeting technology and software vendors with ARTEX.","category":"research","primary":true},{"title":"VAPOR PANDA Uses ARTEX to Scale Global Campaign","url":"https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/","publisher":"crowdstrike","context":"The article cites CrowdStrike's report on VAPOR PANDA targeting more than 200 organizations across 14 countries.","category":"research","primary":true},{"title":"Unknown Threat Actor Uses ARTEX to Target South Korean Finance","url":"https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/","publisher":"crowdstrike","context":"The article cites CrowdStrike's reporting on ARTEX-linked intrusions affecting South Korean financial organizations.","category":"research","primary":true},{"title":"ARTEX Agentic Asbestos","url":"https://censys.com/blog/artex-agentic-asbestos/","publisher":"censys","context":"The article cites Censys analysis of exposed ARTEX infrastructure and the South Korean finance incidents.","category":"research","primary":true},{"title":"ARTEX and Friends Enter Agentic Offensive Frameworks","url":"https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks","publisher":"google-threat-intelligence","context":"The article cites Google's threat-intelligence analysis placing ARTEX among several AI-enabled offensive frameworks.","category":"research","primary":true},{"title":"AI Pentesting Tools Beyond ARTEX","url":"https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/","publisher":"gitguardian","context":"The article cites GitGuardian's code review and controlled testing of ARTEX's ability to locate planted secrets.","category":"research","primary":true},{"title":"Threat Actors Use Agentic AI Tooling to Find and Abuse Exposed Secrets","url":"https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/","publisher":"microsoft","context":"The article relies on Microsoft's report that AI agents searched GitHub for exposed secrets and accessed Azure Key Vault data.","category":"research","primary":true},{"title":"Update for October 30th 2026 Data Security Incident","url":"https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident","publisher":"workos","context":"The article cites WorkOS's incident report on an ARTEX agent accessing an internet-facing internal tool with a weak development credential.","category":"news","primary":true},{"title":"ARTEX Backdoor Docker Image","url":"https://badbyte.io/artex-backdoor-docker-image/","publisher":"badbyte","context":"The article cites BadByte's technical analysis of backdoored ARTEX Docker images and the altered GitHub copy that distributed them.","category":"research","primary":true},{"title":"ARTEX Abuse Expands as Cybercriminals Target Financial Sector","url":"https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/","publisher":"microsoft","context":"The article cites Microsoft's report on Storm-3358 using ARTEX against Southeast Asian financial firms.","category":"research","primary":true},{"title":"ARTEX and AI-Powered Red Teaming Tools","url":"https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/","publisher":"palo-alto-networks-unit-42","context":"The article cites Unit 42's technical analysis of ARTEX traffic patterns, user agents, and detection indicators.","category":"research","primary":true}],"body":"\u003cp\u003eARTEX is an AI-assisted penetration-testing framework that assigns agents to plan attacks, scan targets, run tools, and record findings under human direction. Published on GitHub on July 26, 2026, it was reportedly adopted within months by China-linked groups, criminal crews, and a researcher whose agent accessed a WorkOS internal tool. Reports described targeting of hundreds of organizations, including financial firms, government and defense organizations, technology companies, and organizations in South Korea, Southeast Asia, India, and other countries. The original ARTEX repository was removed on October 8 after its author said the tool had been abused, but numerous copies and forks remained available.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central finding is that ARTEX agents often gain access fastest through exposed credentials, such as secrets found in public GitHub repositories, predictable development passwords deployed to production, and trusted application credentials. Microsoft reported one case in which an agent moved from searching GitHub to stealing data from Azure Key Vault in five minutes, while GitGuardian found agents could independently search code and git history for secrets even though ARTEX lacked a dedicated secret-hunting feature. A malicious ARTEX copy also redirected users to a backdoored Docker image that could run commands as root before checking a password; the image was pulled about 9,131 times. The article recommends rotating exposed secrets, using short-lived OIDC credentials in CI/CD systems, eliminating development credentials from internet-facing services, checking ARTEX installations for the malicious Docker images, and hunting for listed network indicators such as ARTEX user agents and exposed consoles on port 8787.\u003c/p\u003e\n"},{"n":22,"title":"SilentAir Hijacks Asian Telecom Networks to Intercept SMS 2FA Codes and Spy on Taiwanese Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/silentair-hijacks-asian-telecom.html","time":"11:10","priority":"SHOULD READ","score":88,"tldr":"Enea uncovered SilentAir, a suspected state-backed espionage group that compromised equipment at Asian telecom operators to hijack SS7 and Diameter signaling, divert SMS messages, and intercept 2FA codes—primarily targeting users in Taiwan. The activity may be linked to China and overlaps in places with Liminal Panda telecom intrusions, though attribution remains unconfirmed.","briefOverview":"\u003cp\u003eEnea identified a suspected state-level spying group called SilentAir that compromised equipment at mobile operators in at least six Asian countries. The group primarily targeted people in Taiwan, including political and government VIPs, while also targeting users in other Southeast and East Asian networks and occasionally networks in East Africa, Central Asia, the Middle East, and Europe. Enea assessed a link to China with low confidence and described possible but unconfirmed connections to Liminal Panda.\u003c/p\u003e\n\n\u003cp\u003eSilentAir used mobile-network routing messages to falsely claim that compromised equipment was serving a target’s phone, which could divert that person’s calls and text messages to the attackers. Enea observed some diverted targets’ SMS two-factor authentication codes being intercepted immediately, although it did not confirm account takeovers or provide comparable evidence of intercepted voice calls. The group also sent large volumes of hidden text messages, mostly to Taiwanese subscribers, apparently in part to test whether message diversion remained active; Enea advises operators to treat the shared mobile-operator network as untrusted and connect defenses across their signaling and broader IT environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Enea identified a group it calls SilentAir that used compromised equipment at mobile operators in at least six Asian countries to intercept selected calls and text messages, primarily targeting people in Taiwan.","SilentAir used mobile-network routing messages to falsely claim it was serving a target’s phone, allowing calls and texts to be diverted when the target’s home network accepted the request.","Enea observed two-factor authentication codes being intercepted immediately after some diversions, although it found no similar evidence for voice-call interception and did not confirm any account takeovers.","SilentAir sent large volumes of silent text messages, mostly to Taiwanese subscribers, apparently in part to verify whether diverted messages were reaching the compromised equipment.","Enea assessed with high confidence that SilentAir is a state-level actor and linked it to China with low confidence; it also identified possible but unconfirmed ties to Liminal Panda."],"insights":["SilentAir devoted 18.3% of its observed activity to interception, far above the 2.1% share Enea previously observed for typical signaling-surveillance firms.","The group used ordinary-looking motivational or promotional text in silent messages so that, if a network removed the hidden-message setting, recipients would likely dismiss the visible text as spam.","Enea confirmed that the activity originated from compromised equipment inside an operator after observing that equipment both receive and send attack commands, rather than merely seeing forged network addresses.","SilentAir’s activity followed a UTC+8 workday, largely stopped on weekends, and slowed around Chinese holidays, but Enea characterized a China connection only as low confidence.","Enea recommends that operators treat the shared network used to exchange mobile-routing traffic as untrusted and correlate defenses for mobile data traffic with defenses for call and text routing traffic."],"referencedReports":[{"title":"The Enemy Within: Tracking Liminal Panda and SilentAir Through Mobile Networks","url":"https://www.enea.com/insights/the-enemy-within-tracking-liminal-panda-and-silentair-through-mobile-networks/","publisher":"enea","context":"Enea's technical report provides the underlying analysis of SilentAir's telecom-network activity and its possible relationship with Liminal Panda.","category":"research","primary":true},{"title":"SIGweaver Government Advisory","url":"https://www.imda.gov.sg/assets/23f23bba-57ca-42b6-92f8-90e207bf8c46.pdf","publisher":"singapore-infocomm-media-development-authority","context":"The article cites an IMDA government advisory describing a related tool as SIGweaver and noting CrowdStrike's moderate-confidence link to Liminal Panda.","category":"advisory","primary":false}],"body":"\u003cp\u003eEnea identified a suspected state-level spying group called SilentAir that compromised equipment at mobile operators in at least six Asian countries. The group primarily targeted people in Taiwan, including political and government VIPs, while also targeting users in other Southeast and East Asian networks and occasionally networks in East Africa, Central Asia, the Middle East, and Europe. Enea assessed a link to China with low confidence and described possible but unconfirmed connections to Liminal Panda.\u003c/p\u003e\n\n\u003cp\u003eSilentAir used mobile-network routing messages to falsely claim that compromised equipment was serving a target’s phone, which could divert that person’s calls and text messages to the attackers. Enea observed some diverted targets’ SMS two-factor authentication codes being intercepted immediately, although it did not confirm account takeovers or provide comparable evidence of intercepted voice calls. The group also sent large volumes of hidden text messages, mostly to Taiwanese subscribers, apparently in part to test whether message diversion remained active; Enea advises operators to treat the shared mobile-operator network as untrusted and connect defenses across their signaling and broader IT environments.\u003c/p\u003e\n"},{"n":11,"title":"FBI flash alert says Artex tool automating cyberattacks at ‘machine speed’","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/artex-ai-tool-fbi-flash-alert","time":"21:32","priority":"SHOULD READ","score":86,"tldr":"The FBI warns that Artex, an open-source AI agent framework, is enabling criminals and state-backed groups to automate end-to-end cyber intrusions at machine speed with minimal expertise. Although its original GitHub repository was removed, forks and commercial variants continue to support campaigns targeting critical sectors worldwide.","briefOverview":"\u003cp\u003eThe FBI issued a flash alert warning that the open-source Artex AI framework is being used by cybercriminals and nation-state actors to automate cyber intrusions from reconnaissance through data exfiltration. The agency said Artex can reduce the time needed to chain attack techniques, with some intrusions moving from target selection to privileged access in under three hours. It also enables actors with limited technical expertise to conduct complex operations against multiple targets simultaneously.\u003c/p\u003e\n\n\u003cp\u003eArtex was released on GitHub in August and later removed by its developer after reported abuse, but the FBI said forks, localized variants, archived copies, and a commercial version remain available. Censys research cited by the article found more than 1,600 publicly exposed Artex console instances, while the actual number of deployments may be higher. The framework has been linked to attacks on South Korean and Japanese financial institutions and campaigns affecting sectors including government, finance, technology, defense, energy, healthcare, manufacturing, telecommunications, and legal services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI issued a flash alert warning that the open-source Artex framework can automate multiple phases of cyber intrusions, from reconnaissance through data exfiltration, at machine speed.","According to the FBI, Artex can allow threat actors with minimal technical expertise to run complex, simultaneous operations, with some intrusions reaching privileged access in under three hours.","Although its original GitHub repository was removed, the FBI said Artex continues to spread through forks, localized variants, archived copies, and a commercial version.","Censys identified more than 1,600 publicly exposed Artex console instances, while noting that total deployments are likely higher because some systems are private or behind firewalls.","The article says Artex has been linked to attacks on South Korean and Japanese financial institutions and to campaigns targeting sectors including government, financial services, technology, defense, energy, health care, manufacturing, telecommunications, and legal services."],"insights":["Artex’s availability persists despite removal of its original GitHub repository because forks, localized variants, archives, and a commercial edition continue to circulate.","The FBI said attacker-controlled Artex installations most often use Chinese AI models, particularly the DeepSeek Flash family, because of their capability, low cost, and lack of observable safeguards when prompts are framed as penetration testing.","Amazon observed a self-sustaining credential-theft operation in which stolen AI-model access keys funded the AI processing used to find additional credentials.","Artex agents have been observed mapping trust relationships between organizations and seeking weaker third-party systems, such as supplier portals, mobile backends, legacy services, and third-party integrations.","Although Artex activity can generate enough attempts to trigger defensive sensors, the FBI said its speed can still make response difficult."],"referencedReports":[{"title":"Artex Agentic Asbestos","url":"https://censys.com/blog/artex-agentic-asbestos/","publisher":"censys","context":"The article cites Censys research that identified more than 1,600 publicly exposed Artex console instances.","category":"research","primary":false},{"title":"Amazon Threat Intelligence Observes Threat Actors Running Cybercrime Campaigns With Artex AI Agents","url":"https://aws.amazon.com/blogs/security/amazon-threat-intelligence-observes-threat-actors-running-cybercrime-campaigns-with-artex-ai-agents/","publisher":"amazon","context":"The article cites Amazon's study of Chinese-nexus groups using Artex for credential theft and cryptocurrency-exchange identity-verification bypass.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI issued a flash alert warning that the open-source Artex AI framework is being used by cybercriminals and nation-state actors to automate cyber intrusions from reconnaissance through data exfiltration. The agency said Artex can reduce the time needed to chain attack techniques, with some intrusions moving from target selection to privileged access in under three hours. It also enables actors with limited technical expertise to conduct complex operations against multiple targets simultaneously.\u003c/p\u003e\n\n\u003cp\u003eArtex was released on GitHub in August and later removed by its developer after reported abuse, but the FBI said forks, localized variants, archived copies, and a commercial version remain available. Censys research cited by the article found more than 1,600 publicly exposed Artex console instances, while the actual number of deployments may be higher. The framework has been linked to attacks on South Korean and Japanese financial institutions and campaigns affecting sectors including government, finance, technology, defense, energy, healthcare, manufacturing, telecommunications, and legal services.\u003c/p\u003e\n"},{"n":12,"title":"City of Osaka warns of data breach impacting 1 million as Japan reels from dozens of cyber incidents ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/city-of-osaka-japan-email-data-breach","time":"19:43","priority":"SHOULD READ","score":86,"tldr":"A breach of Arara’s email distribution service exposed more than 1 million email addresses linked to Osaka’s administrative platform and potentially 77 million addresses across nearly 400 Japanese organizations. The incident is part of a wider surge in cyberattacks prompting Japan to fund stronger national cyber defenses and faster breach reporting.","briefOverview":"\u003cp\u003eOsaka said hackers accessed Arara’s email distribution service, which TKC Corporation uses to maintain the city’s online administrative services platform. More than 1 million email addresses belonging to people who received messages from the system between July 2026 and October 31 were exposed. The city warned its 2.8 million residents to avoid opening links or attachments in suspicious emails claiming to be from Osaka.\u003c/p\u003e\n\n\u003cp\u003eArara said a November 2 cyberattack exposed 77 million email addresses across nearly 400 customers, including TKC and Sega, and that the service was used to send millions of malicious messages impersonating credit card companies and financial institutions. The Osaka incident occurred amid a wider increase in Japanese cyber incidents affecting organizations including Japan Airlines, Sony Network Communications, and Capcom. Japan announced emergency measures including greater use of AI for cyber defense, stronger information gathering, offensive cyberattacks, support for breach victims, and about $62 million in emergency funding.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Osaka said that hackers accessed Arara’s email distribution service, used by TKC Corporation for the city’s online administrative services platform, exposing more than 1 million email addresses.","The city said the leaked addresses belonged to people who received emails from its system between July 2026 and October 31, and warned residents not to open suspicious links or attachments in messages claiming to be from Osaka.","Arara said a November 2 cyberattack exposed 77 million email addresses from nearly 400 customers, including TKC and Sega, and was used to send millions of malicious emails impersonating credit card companies and financial institutions.","Japan’s prime minister announced emergency cybersecurity measures, including increased use of AI for defense, stronger information gathering, offensive cyber operations, victim support, and about $62 million in emergency funding.","Mihoko Matsubara of NTT said October accounted for 58% of Japan’s reported cyber incidents this year and that about 380 million pieces of personal data had been stolen so far this year."],"insights":["A compromise at a single third-party email provider created a cascading impact across nearly 400 customers, including municipal services, major businesses, and other organizations.","The incident did not only expose email addresses: Arara said its service was used to send millions of fraudulent messages impersonating credit card companies and financial institutions, creating a direct risk of deception for recipients.","The scale of Japan’s reported incidents was highly concentrated in October, which NTT’s Mihoko Matsubara said accounted for 58% of all incidents reported in the country that year.","Matsubara warned that personal information already traded on the dark web has been used for fraudulent securities transactions and could be combined into detailed profiles of Japanese citizens.","Japan’s emergency response explicitly treats cyber incidents as a broader national problem rather than something individual affected organizations can manage alone."],"referencedReports":[{"title":"Web API Attacks","url":"https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html","publisher":"jpcert-coordination-center","context":"Japan's national incident response team published a study finding evidence that attackers used AI to scan for known weaknesses before carrying out attacks in Japan.","category":"research","primary":false}],"body":"\u003cp\u003eOsaka said hackers accessed Arara’s email distribution service, which TKC Corporation uses to maintain the city’s online administrative services platform. More than 1 million email addresses belonging to people who received messages from the system between July 2026 and October 31 were exposed. The city warned its 2.8 million residents to avoid opening links or attachments in suspicious emails claiming to be from Osaka.\u003c/p\u003e\n\n\u003cp\u003eArara said a November 2 cyberattack exposed 77 million email addresses across nearly 400 customers, including TKC and Sega, and that the service was used to send millions of malicious messages impersonating credit card companies and financial institutions. The Osaka incident occurred amid a wider increase in Japanese cyber incidents affecting organizations including Japan Airlines, Sony Network Communications, and Capcom. Japan announced emergency measures including greater use of AI for cyber defense, stronger information gathering, offensive cyberattacks, support for breach victims, and about $62 million in emergency funding.\u003c/p\u003e\n"},{"n":26,"title":"Operation Endgame Takes Down Gootloader, CastleRAT and StealC Servers, Seizes 6.4M Stolen Logins","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/operation-endgame-takes-down-gootloader.html","time":"10:55","priority
