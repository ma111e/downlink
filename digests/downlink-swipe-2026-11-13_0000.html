":"SHOULD READ","score":86,"tldr":"Operation Endgame dismantled infrastructure supporting Gootloader, CastleRAT, and StealC, seizing 235 servers, 257 domains, and 6.4 million stolen credentials. Authorities are notifying victims and urging affected WordPress site owners to reset credentials, enable MFA, remove backdoors, and patch their sites.","briefOverview":"\u003cp\u003eInternational authorities disrupted infrastructure behind Gootloader, CastleRAT, and StealC as part of Operation Endgame. Europol said the action seized 235 servers and 257 domains, while Germany’s Federal Criminal Police Office said about 6.4 million stolen login records belonging to more than 40,000 victims were secured. No arrests were announced, though Dutch police said further investigations targeted Gootloader’s main suspect.\u003c/p\u003e\n\n\u003cp\u003eGootloader spread through fake legal documents hosted on compromised websites, often WordPress sites boosted in search results, and was used to download further malware, including ransomware. U.S. authorities said it infected at least 25,000 computers worldwide since 2018 and was involved in ransomware attacks against at least 44 U.S. victims, causing about $28.8 million in losses. Authorities removed Gootloader from more than 100 servers and helped clean malware from 681 websites. Victims and site owners are urged to check for exposure, change passwords, enable multi-factor authentication, remove unauthorized accounts and hidden access code, and update WordPress, themes, and plugins.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation Endgame disrupted infrastructure used by Gootloader, CastleRAT, and StealC, with authorities seizing 235 servers and 257 domains.","German police said they secured about 6.4 million stolen login records associated with more than 40,000 victims.","Gootloader spread through fake legal documents hosted on compromised websites, often WordPress sites promoted in search results, and was used to install additional malware including ransomware.","Authorities removed Gootloader from more than 100 servers, including compromised WordPress sites, and Denmark’s National Special Crime Unit helped clean malware from 681 websites.","Dutch police added CastleRAT-stolen data to their Check your hack service, while authorities warned that criminals may still hold stolen credentials or continue collecting passwords from infected computers."],"insights":["The StealC operators rebuilt their infrastructure after a June disruption, showing that taking down servers alone did not prevent the service from returning.","Even though authorities seized stolen login data, victims remain at risk because criminals may still possess the credentials and may continue collecting new passwords from infected computers.","Investigators believe attackers accessed more than 600 websites using stolen passwords obtained through criminal channels, then installed hidden access mechanisms on the sites.","Gootloader used compromised websites and manipulated search rankings to make fake legal documents easier for victims to find, rather than relying only on direct messages to spread."],"referencedReports":[{"title":"6.4 Million Victim Datasets Secured in International Operation Against Malware Networks","url":"https://www.europol.europa.eu/media-press/newsroom/news/64-million-victim-datasets-secured-in-international-operation-against-malware-networks","publisher":"europol","context":"The article cites Europol's operation summary for the total of 235 seized servers and 257 seized domains.","category":"news","primary":false},{"title":"Dutch Advice Sheet for WordPress Site Owners","url":"https://www.politie.nl/binaries/content/assets/politie/nieuws/2026/november/67e23014-cf5f-4970-be59-aeff916c15f1.pdf","publisher":"dutch-national-police","context":"The article references this advice sheet for recommended steps to secure compromised WordPress sites.","category":"guide","primary":false}],"body":"\u003cp\u003eInternational authorities disrupted infrastructure behind Gootloader, CastleRAT, and StealC as part of Operation Endgame. Europol said the action seized 235 servers and 257 domains, while Germany’s Federal Criminal Police Office said about 6.4 million stolen login records belonging to more than 40,000 victims were secured. No arrests were announced, though Dutch police said further investigations targeted Gootloader’s main suspect.\u003c/p\u003e\n\n\u003cp\u003eGootloader spread through fake legal documents hosted on compromised websites, often WordPress sites boosted in search results, and was used to download further malware, including ransomware. U.S. authorities said it infected at least 25,000 computers worldwide since 2018 and was involved in ransomware attacks against at least 44 U.S. victims, causing about $28.8 million in losses. Authorities removed Gootloader from more than 100 servers and helped clean malware from 681 websites. Victims and site owners are urged to check for exposure, change passwords, enable multi-factor authentication, remove unauthorized accounts and hidden access code, and update WordPress, themes, and plugins.\u003c/p\u003e\n"},{"n":33,"title":"ARTEX and beyond: AI-enabled penetration testing platforms","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/artex-and-beyond/","time":"20:57","priority":"SHOULD READ","score":86,"tldr":"Cisco Talos reports that ARTEX, an AI-enabled penetration-testing framework, is being abused by criminal and China-linked actors to automate reconnaissance, credential attacks, cloud abuse, and post-compromise activity at machine speed. Organizations should prioritize identity and secrets protection, monitoring for rapid anomalous activity, and preplanned containment measures.","briefOverview":"\u003cp\u003eCisco Talos reports growing in-the-wild use of AI-enabled penetration-testing frameworks, including ARTEX, which can automate reconnaissance, vulnerability testing, and follow-on actions with little operator input. ARTEX uses planner and worker agents, supports different large language models, and records assets, findings, and progress in a shared graph. Although designed for authorized security testing, reporting and Talos observations associate its use with financially motivated cybercriminals and China-nexus threat actors.\u003c/p\u003e\n\n\u003cp\u003eReported ARTEX campaigns have included password spraying, use of exposed or stolen credentials, exploitation of application and authorization flaws, cloud-resource enumeration, privilege changes, web-shell deployment, and remote-access tool deployment. Targets have included government, financial, telecommunications, defense, pharmaceutical, semiconductor, and technology organizations across multiple regions, with reported outcomes including data exfiltration and downstream cloud access. Talos identified more than 2,500 ARTEX-associated C2 IP addresses and recommends organizations protect credentials and secrets, harden public-facing and cloud systems, monitor rapid unusual activity, and prepare for fast containment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reports that ARTEX is an AI-enabled penetration-testing framework that can use planner and worker agents to automate reconnaissance, vulnerability testing, and follow-on actions with limited operator input.","Public reporting and Talos observations associate ARTEX activity with financially motivated cybercriminals and China-nexus actors, including VAPOR PANDA, Storm-0940, and Storm-3358.","Reported ARTEX campaigns have used password spraying, exposed or stolen credentials, and application or authorization flaws to target organizations in sectors including government, finance, telecommunications, defense, pharmaceuticals, semiconductors, and technology.","Talos identified more than 2,500 ARTEX-associated C2 IP addresses and observed overlapping infrastructure with tools including VShell, AdaptixC2, Mimikatz, Cobalt Strike, GoPhish, and Fscan.","Talos recommends protecting credentials and exposed secrets, hardening public-facing systems and cloud resources, monitoring for rapid unusual activity, and preparing procedures for fast containment."],"insights":["In one reported case, an ARTEX agent progressed from searching public GitHub repositories for exposed credentials to exfiltrating data from Azure Key Vault within five minutes.","Dosu reported a separate ARTEX-related incident in which an attacker generated more than 80,000 requests in 90 minutes after moving from account creation and an authorization flaw into connected systems.","Talos found more than 2,500 ARTEX-associated C2 IP addresses, but cautioned that tools found on the same infrastructure do not prove ARTEX invoked them or that a single actor operated all of them.","ARTEX is not shipped with a traditional command-and-control framework, yet its extensibility can allow operators to connect compatible tool servers, helping explain its deployment alongside VShell, GoPhish, and AdaptixC2.","Talos found more than 700 internet-reachable PentAGI instances, highlighting that related AI-enabled testing platforms are already broadly exposed online."],"referencedReports":[{"title":"VAPOR PANDA Uses ARTEX to Scale Global Campaign","url":"https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/","publisher":"crowdstrike","context":"The article cites CrowdStrike's attribution of an ARTEX-enabled espionage campaign to VAPOR PANDA.","category":"research","primary":false},{"title":"Storm-0940 Uses ARTEX Agentic AI in ConnectWise Supply Chain Compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/","publisher":"microsoft","context":"The article cites Microsoft's reporting on Storm-0940 using ARTEX after compromised ConnectWise application credentials were used against downstream Microsoft 365 tenants.","category":"research","primary":false},{"title":"ARTEX Abuse Expands as Cybercriminals Target Financial Sector","url":"https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/","publisher":"microsoft","context":"The article cites Microsoft's report on Cambodia-based, financially motivated Storm-3358 activity targeting financial organizations.","category":"research","primary":false},{"title":"Unknown Threat Actor Uses ARTEX to Target South Korean Finance","url":"https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/","publisher":"crowdstrike","context":"The article references CrowdStrike's report on an unidentified Chinese-speaking, financially motivated group targeting South Korean financial organizations and exfiltrating data.","category":"research","primary":false},{"title":"Hacking on Autopilot: Inside ARTEX Cybercrime Campaigns","url":"https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/","publisher":"check-point-research","context":"The article cites Check Point Research's documentation of criminal ARTEX operators and its review of ARTEX operator consoles.","category":"research","primary":false},{"title":"Threat Actors Use Agentic AI Tooling to Find and Abuse Exposed Secrets","url":"https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/","publisher":"microsoft","context":"The article cites Microsoft's report on ARTEX agents searching public GitHub repositories for exposed credentials and using them for follow-on activity.","category":"research","primary":false},{"title":"ARTEX Agentic Attacks in AWS Environments","url":"https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/","publisher":"datadog-security-labs","context":"The article references Datadog's observations of ARTEX activity in AWS environments involving compromised access keys, public Cognito user pools, and cloud log searches.","category":"research","primary":false},{"title":"Dosu Security Incident 2026-11-02","url":"https://dosu.dev/security/incident-2026-11-02","publisher":"dosu","context":"The article cites Dosu's disclosure of an ARTEX-related incident involving an authorization flaw and more than 80,000 requests in 90 minutes.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco Talos reports growing in-the-wild use of AI-enabled penetration-testing frameworks, including ARTEX, which can automate reconnaissance, vulnerability testing, and follow-on actions with little operator input. ARTEX uses planner and worker agents, supports different large language models, and records assets, findings, and progress in a shared graph. Although designed for authorized security testing, reporting and Talos observations associate its use with financially motivated cybercriminals and China-nexus threat actors.\u003c/p\u003e\n\n\u003cp\u003eReported ARTEX campaigns have included password spraying, use of exposed or stolen credentials, exploitation of application and authorization flaws, cloud-resource enumeration, privilege changes, web-shell deployment, and remote-access tool deployment. Targets have included government, financial, telecommunications, defense, pharmaceutical, semiconductor, and technology organizations across multiple regions, with reported outcomes including data exfiltration and downstream cloud access. Talos identified more than 2,500 ARTEX-associated C2 IP addresses and recommends organizations protect credentials and secrets, harden public-facing and cloud systems, monitor rapid unusual activity, and prepare for fast containment.\u003c/p\u003e\n"},{"n":8,"title":"German military drone operations disrupted by cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/german-military-drone-operations-disrupted-by-cyberattack/","time":"17:31","priority":"SHOULD READ","score":84,"tldr":"Quantum Systems, whose drones are used by Germany and Ukraine, says it contained a cyberattack after attackers reportedly compromised its QBase software update server and distributed a malicious update. Germany reportedly grounded the company’s drones as a precaution while authorities investigate.","briefOverview":"\u003cp\u003eQuantum Systems, a German defense technology company, said it detected an active cyberattack by hostile actors in late October and worked with authorities to restore safe operation of its unmanned systems. The company builds reconnaissance and interceptor drones, as well as the software used to control them. Its drones are used by Germany’s military, and Germany recently announced funding for tens of thousands of its interceptor drones for Ukrainian forces.\u003c/p\u003e\n\n\u003cp\u003eAccording to Der Spiegel and the Financial Times, citing internal sources, the attackers compromised Quantum Systems’ update distribution server and sent customers a malicious update for QBase, its ground-control and mission-planning software. QBase is used to plan missions for drones including the Vector reconnaissance drone, known as Falke in German military service, though it is unclear how many customers installed the unexpected update. German armed forces reportedly grounded Quantum Systems drones and excluded them from a recent exercise as a precaution, while MAD, BfV, and BSI were reportedly involved in the response.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Quantum Systems said it detected and responded to an active cyberattack by hostile actors in late October, working with authorities to restore safe unmanned-system operations.","Reports citing internal sources said attackers compromised Quantum Systems’ update distribution server and delivered a malicious QBase update file to customers.","QBase is Quantum Systems’ ground-control and mission-planning software, including for the Vector reconnaissance drone used by the German military as the Falke.","It is unclear how many customers installed the unscheduled update, which Quantum Systems reportedly identified as suspicious.","German armed forces reportedly grounded Quantum Systems drones and excluded the company’s systems from a recent military exercise while authorities investigated."],"insights":["The reported compromise targeted the software-update channel rather than a single drone, creating the potential for impact across customers that use QBase for mission planning.","The precautionary grounding of Quantum Systems drones shows that suspected compromise of supporting software can interrupt military operations even when the number of customers who installed the update is unknown.","Quantum Systems linked its targeting to its public support for Ukraine, while noting that European defense companies have faced persistent cyberattacks for years.","Multiple German security and intelligence bodies, including MAD, BfV, and BSI, were reportedly involved in the response, reflecting the national-security significance of the incident."],"referencedReports":[],"body":"\u003cp\u003eQuantum Systems, a German defense technology company, said it detected an active cyberattack by hostile actors in late October and worked with authorities to restore safe operation of its unmanned systems. The company builds reconnaissance and interceptor drones, as well as the software used to control them. Its drones are used by Germany’s military, and Germany recently announced funding for tens of thousands of its interceptor drones for Ukrainian forces.\u003c/p\u003e\n\n\u003cp\u003eAccording to Der Spiegel and the Financial Times, citing internal sources, the attackers compromised Quantum Systems’ update distribution server and sent customers a malicious update for QBase, its ground-control and mission-planning software. QBase is used to plan missions for drones including the Vector reconnaissance drone, known as Falke in German military service, though it is unclear how many customers installed the unexpected update. German armed forces reportedly grounded Quantum Systems drones and excluded them from a recent exercise as a precaution, while MAD, BfV, and BSI were reportedly involved in the response.\u003c/p\u003e\n"},{"n":14,"title":"DOJ: Gootloader used in at least 44 ransomware attacks costing $29 million since 2018","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/gootloader-ransomware-doj-details","time":"15:59","priority":"SHOULD READ","score":84,"tldr":"An international Operation Endgame effort disrupted Gootloader infrastructure, which the DOJ says infected 25,000 devices and enabled at least 44 U.S. ransomware incidents causing $28.8 million in losses since 2018.","briefOverview":"\u003cp\u003eAn international coalition of law enforcement agencies and cybersecurity companies disrupted infrastructure used by the Gootloader, StealC, and CastleRAT malware strains. The operation dismantled more than 100 StealC servers and disrupted 235 servers and 257 domains overall. The U.S. Justice Department said it removed Gootloader from more than 100 servers, including compromised websites, and seized domains used to distribute and control it. The action was part of the long-running Operation Endgame initiative.\u003c/p\u003e\n\n\u003cp\u003eThe DOJ said Gootloader has operated since 2018 and infected 25,000 devices globally, often when victims downloaded it accidentally. Operators added infected devices to a network of compromised computers and sold access to ransomware groups. At least 44 U.S.-based ransomware victims were initially infected by Gootloader, resulting in $28.8 million in losses. The FBI, Shadowserver Foundation, internet service providers, and incident-response teams supported victim identification, notification, and remediation, while compromised domains now display seizure banners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An international law-enforcement and cybersecurity coalition disrupted 235 servers and 257 domains used by Gootloader and CastleRAT, including more than 100 servers used by the StealC password-stealing malware.","The U.S. Justice Department said Gootloader has operated since 2018 and infected 25,000 devices globally, typically after victims downloaded it accidentally.","According to the DOJ, criminals sold access to Gootloader-infected devices to ransomware groups, and at least 44 U.S.-based ransomware victims suffered combined losses of $28.8 million.","The FBI said it disrupted the Gootloader network through coordinated technical operations, victim notifications, and remediation, while Shadowserver worked with internet service providers and incident-response teams to identify infected systems.","The action was part of Operation Endgame, an international initiative that has previously targeted malware and botnets including DanaBot, IcedID, SystemBC, Pikabot, SmokeLoader, Bumblebee, Trickbot, Rhadamanthys, VenomRAT, and Elysium."],"insights":["Gootloader functioned as an access-enabling service: after devices were infected, the operators sold that access to ransomware groups rather than necessarily conducting the ransomware incidents themselves.","The operation addressed both the infrastructure used to distribute and control Gootloader and the already infected devices through victim notifications and remediation efforts.","Compromised legitimate websites were part of Gootloader’s delivery network, showing that the infrastructure included sites taken over by the operators rather than only attacker-owned systems.","The reported targets included the U.S. Department of War and the Defense Industrial Base, alongside broader global infections."],"referencedReports":[{"title":"Gootloader Malware Disrupted in International Cyber Operation","url":"https://www.justice.gov/opa/pr/gootloader-malware-disrupted-international-cyber-operation","publisher":"u-s-department-of-justice","context":"The article cites this Justice Department notice for details of the Gootloader disruption, including server removals and domain seizures.","category":"advisory","primary":true}],"body":"\u003cp\u003eAn international coalition of law enforcement agencies and cybersecurity companies disrupted infrastructure used by the Gootloader, StealC, and CastleRAT malware strains. The operation dismantled more than 100 StealC servers and disrupted 235 servers and 257 domains overall. The U.S. Justice Department said it removed Gootloader from more than 100 servers, including compromised websites, and seized domains used to distribute and control it. The action was part of the long-running Operation Endgame initiative.\u003c/p\u003e\n\n\u003cp\u003eThe DOJ said Gootloader has operated since 2018 and infected 25,000 devices globally, often when victims downloaded it accidentally. Operators added infected devices to a network of compromised computers and sold access to ransomware groups. At least 44 U.S.-based ransomware victims were initially infected by Gootloader, resulting in $28.8 million in losses. The FBI, Shadowserver Foundation, internet service providers, and incident-response teams supported victim identification, notification, and remediation, while compromised domains now display seizure banners.\u003c/p\u003e\n"},{"n":19,"title":"New Mior and Skyfall Attacks Let Rogue Cloud Hosts Steal Secrets From AMD SEV-SNP VMs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-mior-and-skyfall-attacks-let-rogue.html","time":"15:27","priority":"SHOULD READ","score":84,"tldr":"Researchers disclosed Mior and Skyfall flaws that let a malicious cloud host potentially extract secrets from AMD SEV-SNP confidential VMs, with Mior also enabling memory modification and attestation spoofing when BIOS control is available. AMD has released or planned firmware and microcode fixes, so cloud providers and server owners should apply vendor BIOS/platform updates.","briefOverview":"\u003cp\u003eResearchers disclosed Mior and Skyfall, two attacks that can let a malicious cloud host read secrets from AMD SEV-SNP-protected virtual machines. SEV-SNP is intended to protect a virtual machine’s memory even from the server operator and its hypervisor. Mior can additionally modify VM memory and falsify the signed attestation report used to show which software a VM runs, while Skyfall can expose saved register data and limited memory data.\u003c/p\u003e\n\n\u003cp\u003eMior requires control of the hypervisor, BIOS or UEFI, and a PCIe device, and was demonstrated on an AMD EPYC 9135 Zen 5 processor. Skyfall requires a malicious host but no hardware tampering, and researchers demonstrated it on Zen 3 and Zen 4 EPYC chips, including recovery of a disk-encryption key from a test VM. AMD tracks the flaws as CVE-2026-0462 and CVE-2026-40671 and has released or planned firmware, microcode, and BIOS-related updates; customers renting confidential VMs depend on their cloud providers to deploy them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers disclosed Mior and Skyfall, two attacks that can allow a malicious host or hypervisor to read data from AMD SEV-SNP-protected virtual machines.","Mior requires control of the hypervisor, BIOS or UEFI, and a PCIe device, and it can enable VM debugging, read and write VM memory, and make a malicious VM’s attestation report appear to describe a harmless image.","Skyfall exploits data left in processor cache after a deliberately failed VM startup to recover saved register values and, in testing, a disk-encryption key; it was demonstrated on AMD Zen 3 and Zen 4 EPYC processors.","AMD tracks Mior as CVE-2026-0462 and Skyfall’s VM register-data leak as CVE-2026-40671, with firmware, microcode, and platform updates released or planned for affected EPYC systems.","Cloud customers using confidential VMs depend on their cloud providers and server vendors to deploy the required BIOS and platform firmware updates."],"insights":["Mior was demonstrated even when ciphertext hiding was enabled, meaning that this optional feature did not prevent the researchers from enabling debugging and accessing VM memory after corrupting the memory-protection table.","Mior can undermine remote trust checks by copying the measurement of a harmless VM into a malicious one, causing signed attestation reports to identify the malicious VM as the harmless image.","Skyfall’s demonstrated VM-memory access is limited to three fixed cache-line locations within a targeted memory page, while its register-data leak was used to recover a disk-encryption key in a test setup.","The Skyfall program committee noted that a practical VM attack would require demanding conditions, including an otherwise idle processor core, rapid failed VM starts and performance-counter reads, and a VM that remains available during the process.","Although AMD lists updated SEV firmware and Skyfall microcode, the advisories do not clarify whether these updates are sufficient by themselves or require corresponding BIOS updates, leaving cloud customers dependent on provider deployment details."],"referencedReports":[{"title":"Mior: Breaking AMD SEV-SNP via RMP Initialization","url":"https://xca-attacks.github.io/mior/mior_ccs26.pdf","publisher":"eth-zurich","context":"The article cites the Mior paper for the attack prerequisites and technical details of manipulating SEV-SNP memory protections and attestation.","category":"research","primary":true},{"title":"Skyfall","url":"https://skyfall-attack.github.io/assets/skyfall.pdf","publisher":"eth-zurich-and-google","context":"The article cites the Skyfall paper describing leakage of VM register data and limited VM memory data through transient scheduler attacks.","category":"research","primary":true},{"title":"AMD-SB-3059: Mior Vulnerability in AMD SEV-SNP","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3059.html","publisher":"amd","context":"AMD’s advisory tracks Mior as CVE-2026-0462 and lists affected EPYC product lines and planned or released firmware fixes.","category":"advisory","primary":true},{"title":"AMD-SB-3061: Skyfall Vulnerability","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3061.html","publisher":"amd","context":"AMD’s advisory tracks Skyfall’s VM register-data exposure as CVE-2026-40671 and provides affected-product and firmware update information.","category":"advisory","primary":true},{"title":"AMD-SB-7072: EDK II Firmware Missing TSA Mitigations","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7072.html","publisher":"amd","context":"AMD’s EDK II bulletin attributes the Skyfall-related SMM leak to missing transient scheduler attack mitigations in EDK II firmware code.","category":"advisory","primary":false},{"title":"AMD-SB-3059 BIOS Fix List","url":"https://www.supermicro.com/en/support/security_AMD-SB-3059","publisher":"supermicro","context":"Supermicro’s security page lists BIOS and BMC firmware updates for affected H12, H13, and H14 motherboards.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed Mior and Skyfall, two attacks that can let a malicious cloud host read secrets from AMD SEV-SNP-protected virtual machines. SEV-SNP is intended to protect a virtual machine’s memory even from the server operator and its hypervisor. Mior can additionally modify VM memory and falsify the signed attestation report used to show which software a VM runs, while Skyfall can expose saved register data and limited memory data.\u003c/p\u003e\n\n\u003cp\u003eMior requires control of the hypervisor, BIOS or UEFI, and a PCIe device, and was demonstrated on an AMD EPYC 9135 Zen 5 processor. Skyfall requires a malicious host but no hardware tampering, and researchers demonstrated it on Zen 3 and Zen 4 EPYC chips, including recovery of a disk-encryption key from a test VM. AMD tracks the flaws as CVE-2026-0462 and CVE-2026-40671 and has released or planned firmware, microcode, and BIOS-related updates; customers renting confidential VMs depend on their cloud providers to deploy them.\u003c/p\u003e\n"},{"n":31,"title":"Ransomware at the hypervisor layer: how attackers use ESXi and vCenter features for malicious purposes","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/esxi-ransomware/121959/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"A BlackNevas ransomware operation destroyed a virtualized environment by compromising vCenter and abusing legitimate VMware management features to enable ESXi SSH access, disrupt backups, and wipe virtual-machine data without exploiting a hypervisor vulnerability. The key defense is to treat vCenter, ESXi administration, and backup recovery as separate high-trust security boundaries with isolated identities, restricted access, and remotely retained telemetry.","briefOverview":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated a BlackNevas ransomware campaign that destroyed four ESXi hosts, every virtual machine on them, two vCenter Server Appliances, and connected backup infrastructure over 10 days. The attackers did not exploit an ESXi or vCenter vulnerability; instead, they used legitimate VMware management interfaces after obtaining privileged access through systems inside the organization’s perimeter. The case shows how compromise of the virtualization management plane can allow an attacker to affect many systems at once.\u003c/p\u003e\n\n\u003cp\u003eAfter logging in to a vCenter appliance through SSH as root, the attackers installed MeshAgent and a Ligolo-ng reverse tunnel disguised as a VMware-related systemd service. They used vCenter Host Profiles to enable SSH on ESXi hosts, delivered an ESXi payload through SFTP, tested it, and later ran it against the \u003ccode\u003e/vmfs/\u003c/code\u003e storage path, while virtual machines were rapidly stopped. Backup defenses and recovery infrastructure were disrupted before the ESXi impact, reinforcing the article’s recommendation to isolate vCenter administration, hypervisor identities, backup systems, and log collection from the wider production environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A BlackNevas ransomware campaign destroyed four ESXi hosts, all virtual machines on them, two vCenter Server Appliances, and connected backup infrastructure over a 10-day period.","The attackers used legitimate VMware management interfaces rather than exploiting a hypervisor vulnerability, enabling ESXi SSH through vCenter Host Profiles before directly accessing target hosts.","After accessing a vCenter appliance through SSH as root, the attackers deployed MeshAgent and later installed a Ligolo-ng reverse tunnel as a persistent systemd service disguised as vmware-vdma.","The ransomware payload was delivered to ESXi through SFTP, staged under /tmp, tested roughly three hours before detonation, and then executed against the /vmfs virtual-machine storage path.","The attackers disrupted backup infrastructure before the ESXi impact by disabling antivirus protection, stopping backup services, encrypting recovery systems, and disrupting administrative access."],"insights":["A fully patched ESXi environment can still face catastrophic impact if attackers compromise vCenter, because vCenter can legitimately change host settings and enable direct access to managed hosts.","The combination of a Host Profile change that enables SSH and a new SSH connection from vCenter to the same ESXi host is a higher-confidence warning than either event alone.","Guest-based security software may only see the effects of hypervisor-side disk modification, not the ESXi process that performed it, making vCenter and ESXi logs essential for investigation.","Backups are not protected merely because stored data is immutable; recovery also depends on separate identities, management systems, network access, and tested restoration procedures.","Rebooting an affected ESXi host before collecting logs can erase evidence because ESXi may store logs on temporary memory-backed storage unless persistent scratch space or remote logging is configured."],"referencedReports":[{"title":"Global report on cybersecurity services 2026","url":"https://securelist.com/global-report-security-services-2026/119233/","publisher":"kaspersky","context":"The article cites this report for GERT incident statistics showing ransomware accounted for 39.4% of cases handled in 2025.","category":"research","primary":false},{"title":"The state of ransomware in 2026","url":"https://securelist.com/state-of-ransomware-in-2026/119761/","publisher":"kaspersky","context":"The article references this research as evidence that ransomware remained a major threat at the beginning of 2026.","category":"research","primary":false},{"title":"Hypervisor ransomware: Multiple threat actor groups hop on leaked Babuk code to build ESXi lockers","url":"https://www.sentinelone.com/labs/hypervisor-ransomware-multiple-threat-actor-groups-hop-on-leaked-babuk-code-to-build-esxi-lockers/","publisher":"sentinelone","context":"The article cites SentinelOne's technical analysis documenting ransomware families that used ESXi lockers derived from leaked Babuk source code.","category":"research","primary":false},{"title":"Twelve group: Unified kill chain","url":"https://securelist.com/twelve-group-unified-kill-chain/113877/","publisher":"kaspersky","context":"The article references this technical analysis as an example of the Twelve group chaining vCenter vulnerabilities to deploy a web shell and establish persistence.","category":"research","primary":false},{"title":"Ransomware operators exploit ESXi hypervisor vulnerability for mass encryption","url":"https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/","publisher":"microsoft","context":"The article cites Microsoft's analysis of ransomware operators abusing CVE-2024-37085 to obtain full ESXi administration through Active Directory integration.","category":"research","primary":false},{"title":"ESXi hypervisors malware persistence","url":"https://cloud.google.com/blog/topics/threat-intelligence/esxi-hypervisors-malware-persistence","publisher":"mandiant","context":"The article references Mandiant's technical analysis documenting malicious vSphere Installation Bundles used for persistent access on compromised ESXi hosts.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated a BlackNevas ransomware campaign that destroyed four ESXi hosts, every virtual machine on them, two vCenter Server Appliances, and connected backup infrastructure over 10 days. The attackers did not exploit an ESXi or vCenter vulnerability; instead, they used legitimate VMware management interfaces after obtaining privileged access through systems inside the organization’s perimeter. The case shows how compromise of the virtualization management plane can allow an attacker to affect many systems at once.\u003c/p\u003e\n\n\u003cp\u003eAfter logging in to a vCenter appliance through SSH as root, the attackers installed MeshAgent and a Ligolo-ng reverse tunnel disguised as a VMware-related systemd service. They used vCenter Host Profiles to enable SSH on ESXi hosts, delivered an ESXi payload through SFTP, tested it, and later ran it against the \u003ccode\u003e/vmfs/\u003c/code\u003e storage path, while virtual machines were rapidly stopped. Backup defenses and recovery infrastructure were disrupted before the ESXi impact, reinforcing the article’s recommendation to isolate vCenter administration, hypervisor identities, backup systems, and log collection from the wider production environment.\u003c/p\u003e\n"},{"n":25,"title":"Trezor Confirms Hidden Implants in CryptoBilis-Sold Wallets That Can Steal Recovery Phrases","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/trezor-confirms-hidden-hardware.html","time":"13:54","priority":"SHOULD READ","score":83,"tldr":"Trezor confirmed that three Safe 5 wallets sold by former reseller CryptoBilis contained hidden implants that can capture recovery phrases from the screen and transmit them to attackers. Affected buyers should move funds to a newly generated wallet immediately, as firmware 2.13.1 cannot protect phrases captured before updating.","briefOverview":"\u003cp\u003eTrezor confirmed that three Safe 5 hardware wallets sold by former reseller CryptoBilis contained hidden circuit-board implants capable of copying recovery phrases. The affected devices were purchased between August 20 and September 23, and Trezor said it has received no reports of lost funds from their owners. The company removed CryptoBilis as an official reseller on October 9 and is continuing to investigate reports from customers who bought devices from the reseller.\u003c/p\u003e\n\n\u003cp\u003eTrezor found that the implant sits between the wallet\u0026rsquo;s main board and screen, allowing it to capture recovery phrases during backup creation or restoration, as well as passphrases shown on the display. It encrypts the captured information and sends it over the mobile network to an attacker-controlled server, retaining it and retrying if it cannot connect. Firmware version 2.13.1 blocks the identified implants from capturing new data, but cannot protect phrases exposed before the update; Trezor advises affected customers to move funds to a newly created wallet with a new recovery phrase.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor confirmed that three Safe 5 wallets sold by CryptoBilis contained hidden circuit-board implants that can capture recovery phrases displayed during wallet setup or restoration.","The implants sit between the Safe 5 main board and screen, can also capture a displayed passphrase, encrypt the collected data, and send it to an attacker-controlled server over the mobile network.","Trezor firmware version 2.13.1 prevents the identified implants from capturing data on updated wallets, but cannot protect a recovery phrase that was captured before the update.","Trezor advises CryptoBilis customers to move funds to a newly created wallet with a new recovery phrase, rather than restoring the old phrase on another device.","The affected wallets were purchased between August 20 and September 23, and Trezor said it had not received reports that the three identified owners lost funds."],"insights":["Updating to firmware 2.13.1 is preventive rather than corrective: anyone whose recovery phrase may have been displayed before updating must use a newly generated phrase and move their funds.","Opening or weighing a wallet is not a dependable way to determine whether it contains an implant, so affected buyers are advised to retain the device and contact Trezor instead.","The implant did not alter the Safe 5 firmware or Secure Element; it intercepted information through an added board placed between the main board and the screen.","Trezor had identified implants only in Safe 5 devices sold by CryptoBilis, while continuing to inspect devices from the reseller after 48 customers contacted the company."],"referencedReports":[{"title":"Our CryptoBilis Investigation: What We Found and What We've Changed","url":"https://trezor.io/blog/news/our-cryptobilis-investigation-what-we-found-and-what-weve-changed","publisher":"trezor","context":"The article cites Trezor's investigation update for its findings on the Safe 5 implant and the company's decision not to publish technical details.","category":"advisory","primary":true},{"title":"Response to Hardware Implant Attack","url":"https://www.ledger.com/blog-response-hardware-implant-attack","publisher":"ledger","context":"The article cites Ledger's incident statement describing hidden components in CryptoBilis-sold Ledger devices and coordinated theft of customer funds.","category":"advisory","primary":false}],"body":"\u003cp\u003eTrezor confirmed that three Safe 5 hardware wallets sold by former reseller CryptoBilis contained hidden circuit-board implants capable of copying recovery phrases. The affected devices were purchased between August 20 and September 23, and Trezor said it has received no reports of lost funds from their owners. The company removed CryptoBilis as an official reseller on October 9 and is continuing to investigate reports from customers who bought devices from the reseller.\u003c/p\u003e\n\n\u003cp\u003eTrezor found that the implant sits between the wallet\u0026rsquo;s main board and screen, allowing it to capture recovery phrases during backup creation or restoration, as well as passphrases shown on the display. It encrypts the captured information and sends it over the mobile network to an attacker-controlled server, retaining it and retrying if it cannot connect. Firmware version 2.13.1 blocks the identified implants from capturing new data, but cannot protect phrases exposed before the update; Trezor advises affected customers to move funds to a newly created wallet with a new recovery phrase.\u003c/p\u003e\n"},{"n":7,"title":"Trezor confirms crypto-stealing implants in three wallets, releases fix","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/cryptocurrency/trezor-confirms-crypto-stealing-implants-in-three-wallets-releases-fix/","time":"19:38","priority":"SHOULD READ","score":82,"tldr":"Trezor confirmed that three Safe 5 wallets sold by Indonesian reseller CryptoBilis contained cellular-connected hardware implants that could steal recovery phrases and passphrases. Firmware 2.13.1 blocks the known implants, but affected buyers should move funds to a new wallet because previously captured recovery phrases remain exposed.","briefOverview":"\u003cp\u003eTrezor confirmed that three Safe 5 hardware wallets sold by Indonesian reseller CryptoBilis contained malicious physical implants designed to steal wallet recovery phrases and passphrases. The confirmed devices were purchased between August 20 and September 23, 2026, and Trezor identified two of the cases through owner-submitted internal photographs after examining the original device in its laboratory. Trezor said 48 CryptoBilis customers contacted the company after its October warning, while checks of devices from other regional resellers found no evidence of tampering.\u003c/p\u003e\n\n\u003cp\u003eThe implant was an extra circuit board placed between the Safe 5’s main board and display, allowing it to observe information shown or entered on the screen without changing the legitimate firmware or Secure Element. It could encrypt captured recovery words or passphrases and transmit them through a mobile network to an attacker-controlled server, retaining the data and retrying if no connection was available. Trezor’s firmware version 2.13.1, released November 11, blocks the identified implants from capturing new information, but cannot protect secrets that may have been captured earlier; the company advises CryptoBilis buyers to move funds to a newly created wallet and is offering replacements for devices purchased from that reseller since March 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor confirmed that three Safe 5 wallets sold by Indonesian reseller CryptoBilis contained malicious hardware implants designed to capture recovery phrases and passphrases.","The implants used an extra circuit board between the wallet’s main board and display to monitor screen activity, encrypt captured information, and send it through a mobile network to an attacker-controlled server.","Trezor released firmware version 2.13.1 on November 11, which it says prevents the identified implants from capturing information on updated devices.","The update cannot protect recovery phrases that may have been captured before installation, and Trezor advises CryptoBilis customers to move cryptocurrency to a newly created wallet with a new recovery phrase.","Trezor reduced its global reseller network by about 80% and is offering replacement devices to customers who purchased a Trezor wallet from CryptoBilis since March 2026."],"insights":["The implants could steal secrets without altering Trezor’s legitimate firmware or Secure Element, showing that a device can be physically compromised even when its normal software remains unchanged.","Trezor’s firmware 2.13.1 can make the identified implants unable to capture new information, but it cannot undo exposure of recovery phrases or passphrases collected before the update.","Although only three compromised Safe 5 devices have been confirmed and no affected Trezor customer has reported lost funds, Trezor is offering replacements to all CryptoBilis buyers since March 2026 rather than only to confirmed cases.","Trezor found no evidence of tampering in devices inspected from other regional resellers, while still cutting its reseller network by about 80% to impose stricter supply-chain controls."],"referencedReports":[{"title":"Our CryptoBilis investigation: What we found and what we’ve changed","url":"https://trezor.io/blog/news/our-cryptobilis-investigation-what-we-found-and-what-weve-changed","publisher":"trezor","context":"The article relies on Trezor’s investigation update for its confirmation of the implants, their capabilities, and the firmware protections released in response.","category":"advisory","primary":true}],"body":"\u003cp\u003eTrezor confirmed that three Safe 5 hardware wallets sold by Indonesian reseller CryptoBilis contained malicious physical implants designed to steal wallet recovery phrases and passphrases. The confirmed devices were purchased between August 20 and September 23, 2026, and Trezor identified two of the cases through owner-submitted internal photographs after examining the original device in its laboratory. Trezor said 48 CryptoBilis customers contacted the company after its October warning, while checks of devices from other regional resellers found no evidence of tampering.\u003c/p\u003e\n\n\u003cp\u003eThe implant was an extra circuit board placed between the Safe 5’s main board and display, allowing it to observe information shown or entered on the screen without changing the legitimate firmware or Secure Element. It could encrypt captured recovery words or passphrases and transmit them through a mobile network to an attacker-controlled server, retaining the data and retrying if no connection was available. Trezor’s firmware version 2.13.1, released November 11, blocks the identified implants from capturing new information, but cannot protect secrets that may have been captured earlier; the company advises CryptoBilis buyers to move funds to a newly created wallet and is offering replacements for devices purchased from that reseller since March 2026.\u003c/p\u003e\n"},{"n":10,"title":"German parliament passes law giving spy agencies hacking, sabotage powers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/german-parliament-passes-law-giving-spy-agencies-hacking-power","time":"16:32","priority":"SHOULD READ","score":82,"tldr":"Germany’s Bundestag passed a major intelligence-law overhaul granting the BND authority to conduct foreign cyber operations, including hacking and sabotage, while giving the domestic BfV limited covert powers. The law adds AI and biometric-analysis authority and requires oversight approval for hacking operations, amid concerns over safeguards and Germany’s historical sensitivity to surveillance.","briefOverview":"\u003cp\u003eGermany’s Bundestag passed a major overhaul of intelligence laws by 308 votes to 190, with 71 abstentions. The legislation gives the foreign intelligence service, the BND, authority to act against threats abroad rather than only report on them. Its permitted cyber operations can include hacking foreign systems, disrupting adversaries’ supply chains, and disabling servers operated by hostile state-backed hackers.\u003c/p\u003e\n\n\u003cp\u003eThe domestic intelligence service, the BfV, receives more limited covert powers within Germany, including the ability to block or reroute data traffic, but it cannot use force against people. Both agencies gain authority to analyze large datasets with artificial intelligence and compare images with material found online, while hacking operations and active measures in Germany require advance approval from the Independent Control Council. Amendments also permit agencies to require telecommunications providers to preserve certain traffic data, extend BND bulk-surveillance metadata retention to 13 months, and add protections for Germans’ chatbot and search-engine communications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Germany’s Bundestag passed an intelligence-law overhaul by 308 votes to 190, with 71 abstentions.","The law authorizes the BND to act against foreign threats through cyber operations, including hacking systems, disrupting supply chains, and disabling servers used by hostile state-backed hackers.","The domestic BfV receives limited powers to block or reroute data traffic in Germany but remains prohibited from using force against people.","Both agencies gain a legal basis to analyze large datasets using artificial intelligence and to compare images against material found online.","Hacking operations and active measures inside Germany require advance approval from the Independent Control Council, whose court-like panel was expanded from six to twelve members."],"insights":["The BND’s authority is framed as a shift from reporting on foreign threats to actively disrupting them, but the law explicitly forbids measures intended to endanger a person’s life or physical safety.","Amendments allow intelligence agencies to require telecommunications providers to preserve expected-to-be-needed traffic data until legal conditions for access are met, while the BND may retain bulk-collected metadata for 13 months.","Messages and searches sent by Germans to chatbots and search engines receive the same BND-surveillance protections as person-to-person communications under the amendments.","The BfV may restrict information-sharing with individual state intelligence offices when concrete security risks exist, with urgent action possible without prior majority agreement from state offices.","Although protections for doctors and other medical professionals were strengthened, critics said journalists and lawyers received weaker safeguards."],"referencedReports":[],"body":"\u003cp\u003eGermany’s Bundestag passed a major overhaul of intelligence laws by 308 votes to 190, with 71 abstentions. The legislation gives the foreign intelligence service, the BND, authority to act against threats abroad rather than only report on them. Its permitted cyber operations can include hacking foreign systems, disrupting adversaries’ supply chains, and disabling servers operated by hostile state-backed hackers.\u003c/p\u003e\n\n\u003cp\u003eThe domestic intelligence service, the BfV, receives more limited covert powers within Germany, including the ability to block or reroute data traffic, but it cannot use force against people. Both agencies gain authority to analyze large datasets with artificial intelligence and compare images with material found online, while hacking operations and active measures in Germany require advance approval from the Independent Control Council. Amendments also permit agencies to require telecommunications providers to preserve certain traffic data, extend BND bulk-surveillance metadata retention to 13 months, and add protections for Germans’ chatbot and search-engine communications.\u003c/p\u003e\n"},{"n":4,"title":"Police arrest 354 suspects in dark web cybercrime crackdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-arrest-354-vendors-buyers-in-global-cybercrime-crackdown/","time":"08:34","priority":"SHOULD READ","score":78,"tldr":"Operation TorNado, a 14-country law-enforcement crackdown on dark-web drug marketplaces, resulted in 354 arrests and major seizures of drugs, firearms, cash, and cryptocurrency. The operation targeted vendors and buyers linked to Archetyp, Nemesis, Tor2Door, Bohemia, and Kingdom markets.","briefOverview":"\u003cp\u003eOperation TorNado was a joint law-enforcement operation that ran from May 2025 through October 2026 and involved agencies from 14 countries. Authorities arrested 354 suspects allegedly connected to vendors and buyers on the Archetyp, Nemesis, Tor2Door, Bohemia, and Kingdom dark web marketplaces. Investigators also targeted people active on forums, single-vendor shops, and encrypted messaging services, supported by Europol cross-checks and forensic analysis.\u003c/p\u003e\n\n\u003cp\u003eAuthorities in Europe seized more than €60 million in cash and cryptocurrency, 950 kilograms of illicit drugs, and 57 firearms. In the United States, authorities seized more than 4.8 metric tonnes of illicit drugs, 152 firearms, and over €150 million. Europol said the operation demonstrated that dark web marketplaces continue to adapt despite takedowns, while the U.S. Department of Justice said intelligence from previous marketplace takedowns and investigations helped identify alleged drug traffickers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation TorNado ran from May 2025 through October 2026 and involved law-enforcement agencies from 14 countries.","Authorities arrested 354 suspects linked to vendors and buyers on Archetyp, Nemesis, Tor2Door, Bohemia, and Kingdom dark web marketplaces.","The operation targeted people active on dark web forums, single-vendor shops, and encrypted messaging services in addition to the named marketplaces.","Authorities in Europe seized more than €60 million in cash and cryptocurrency, 950 kilograms of illicit drugs, and 57 firearms.","In the United States, law enforcement seized more than 4.8 metric tonnes of illicit drugs, 152 firearms, and over €150 million."],"insights":["The operation did not focus only on major dark web marketplaces; investigators also pursued vendors and buyers using forums, single-vendor shops, and encrypted messaging services.","U.S. and international agencies used intelligence obtained after prior marketplace takedowns and vendor investigations to identify additional alleged dark web drug traffickers.","The article describes a continuing pattern of multinational operations, including DisrupTor, Dark Huntor, SpecTor, and RapTor, indicating that arrests and marketplace seizures have continued across several years.","Despite repeated takedowns, Europol said dark web marketplaces continue to adapt, highlighting their resilience after enforcement actions."],"referencedReports":[],"body":"\u003cp\u003eOperation TorNado was a joint law-enforcement operation that ran from May 2025 through October 2026 and involved agencies from 14 countries. Authorities arrested 354 suspects allegedly connected to vendors and buyers on the Archetyp, Nemesis, Tor2Door, Bohemia, and Kingdom dark web marketplaces. Investigators also targeted people active on forums, single-vendor shops, and encrypted messaging services, supported by Europol cross-checks and forensic analysis.\u003c/p\u003e\n\n\u003cp\u003eAuthorities in Europe seized more than €60 million in cash and cryptocurrency, 950 kilograms of illicit drugs, and 57 firearms. In the United States, authorities seized more than 4.8 metric tonnes of illicit drugs, 152 firearms, and over €150 million. Europol said the operation demonstrated that dark web marketplaces continue to adapt despite takedowns, while the U.S. Department of Justice said intelligence from previous marketplace takedowns and investigations helped identify alleged drug traffickers.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft confirms Windows activation failures after November updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-confirms-windows-activation-failures-after-november-updates/","time":"09:36","priority":"SHOULD READ","score":78,"tldr":"Microsoft confirmed that November Windows security updates can break automated activation and licensing tasks, producing error 0x80041008 when organizations use Slmgr.vbs to configure KMS or install product keys. Already activated systems and devices that do not run the affected Slmgr commands are not expected to be impacted; a fix is pending.","briefOverview":"\u003cp\u003eMicrosoft confirmed that its November Patch Tuesday security updates can cause Windows activation and licensing failures with error 0x80041008. The issue affects organizations that automate Windows activation and licensing or use the Slmgr.vbs command-line tool. Microsoft said the error can occur when activating Windows, configuring Key Management Service (KMS), or managing product keys.\u003c/p\u003e\n\n\u003cp\u003eThe failures have been reported after running \u003ccode\u003eslmgr.vbs /skms-domain \u0026lt;domain\u0026gt;\u003c/code\u003e and \u003ccode\u003eslmgr.vbs /ipk \u0026lt;key\u0026gt;\u003c/code\u003e on Windows 10 21H2/22H2, Windows 11 23H2, and Windows Server 2019, 2022, and 2025. Devices that are already activated are expected to remain activated, and systems with the appropriate KMS client key and configuration that do not need the affected commands are not expected to be affected. Microsoft said a fix will be available in the coming days and advised organizations needing immediate mitigation to contact Microsoft Support for business.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that November Patch Tuesday security updates can cause Windows activation and licensing failures with error 0x80041008.","The issue affects organizations that automate Windows activation or licensing and those using the Slmgr.vbs command-line tool to activate Windows, configure Key Management Service, or manage product keys.","Affected commands include \"slmgr.vbs /skms-domain \u003cdomain\u003e\" and \"slmgr.vbs /ipk \u003ckey\u003e\" on Windows 10 21H2/22H2, Windows 11 23H2, and Windows Server 2019, 2022, and 2025.","Devices that are already activated should remain activated, and customers that already have the correct KMS client key and configuration without needing the affected commands are not expected to be impacted.","Microsoft said a fix will be available in the coming days and advised organizations needing immediate mitigation to contact Microsoft Support for business."],"insights":["The problem is concentrated in deployment and license-management workflows rather than on all Windows devices, because systems that are already activated are expected to remain activated.","Organizations whose standard device image already includes the appropriate KMS client key and that do not use the affected Slmgr.vbs commands are specifically identified as unaffected.","Even where KMS activation attempts fail, devices previously activated through KMS typically remain activated for up to 180 days after their last successful activation.","Microsoft has not provided a general workaround in the article; organizations needing an immediate mitigation are directed to Microsoft Support for business while a fix is prepared."],"referencedReports":[{"title":"Windows release health issue WI1549486","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1549486","publisher":"microsoft","context":"The article cites Microsoft's Wednesday service alert as confirmation that November updates can cause Windows activation and licensing errors.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that its November Patch Tuesday security updates can cause Windows activation and licensing failures with error 0x80041008. The issue affects organizations that automate Windows activation and licensing or use the Slmgr.vbs command-line tool. Microsoft said the error can occur when activating Windows, configuring Key Management Service (KMS), or managing product keys.\u003c/p\u003e\n\n\u003cp\u003eThe failures have been reported after running \u003ccode\u003eslmgr.vbs /skms-domain \u0026lt;domain\u0026gt;\u003c/code\u003e and \u003ccode\u003eslmgr.vbs /ipk \u0026lt;key\u0026gt;\u003c/code\u003e on Windows 10 21H2/22H2, Windows 11 23H2, and Windows Server 2019, 2022, and 2025. Devices that are already activated are expected to remain activated, and systems with the appropriate KMS client key and configuration that do not need the affected commands are not expected to be affected. Microsoft said a fix will be available in the coming days and advised organizations needing immediate mitigation to contact Microsoft Support for business.\u003c/p\u003e\n"},{"n":16,"title":"University of Texas at Arlington warns personal information stolen during cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/university-of-texas-arlington-warns-data-breach","time":"17:26","priority":"SHOULD READ","score":78,"tldr":"The University of Texas at Arlington confirmed that hackers stole personal information in a recent cyberattack, with the Qilin ransomware group claiming responsibility. The university is investigating the scope of affected data and has kept its MachForms portal offline.","briefOverview":"\u003cp\u003eThe University of Texas at Arlington confirmed that personal information was stolen during a cybersecurity incident last month. The university is still determining whose information was involved and the nature and extent of the accessed data. It said it will contact affected individuals directly after identifying them and provide information on protective steps and university support.\u003c/p\u003e\n\n\u003cp\u003eFollowing the initial announcement, UTA took its MachForms portal offline; the portal, used for event registration, service requests, and surveys, remains unavailable. The university said it continues monitoring for further effects on its systems and operations. The Qilin ransomware group claimed the incident, while other universities, including York University and Vanderbilt University, are also dealing with recent incidents involving stolen information or major operational disruption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The University of Texas at Arlington confirmed that personal information was stolen during a cybersecurity incident last month.","The university is determining whose information was involved and what data was accessed, and says it will contact affected individuals directly once identified.","UTA took its MachForms portal offline after initially announcing the incident, and the portal remains unavailable while the university monitors for additional effects.","The Qilin ransomware group claimed responsibility for the attack on UTA.","Other universities, including York University and Vanderbilt University, are also addressing recent incidents involving stolen data or disrupted operations."],"insights":["The university has confirmed that data was taken but has not yet determined the people affected or the types and extent of information accessed, showing that the investigation remains incomplete.","MachForms, a portal used for event registration, service requests, and surveys, remains offline after the incident, meaning the effects include disruption to routine university services as well as possible exposure of personal information.","The article describes several universities facing recent incidents attributed to different groups, including Qilin and BYOD, indicating that higher-education institutions are experiencing multiple separate cyber incidents at the same time.","Qilin’s claimed involvement follows the group’s reported claims against other organizations, including the Bureau of Alcohol, Tobacco, Firearms and Explosives, and one of its leading affiliates was recently arrested and extradited to Germany."],"referencedReports":[{"title":"Ransomware Evolution Report: Q3 2026","url":"https://www.halcyon.ai/ransomware-evolution-report/q3-2026","publisher":"Halcyon Ransomware Research Center","context":"The article cites Halcyon data stating that Qilin accounted for 344 alleged ransomware attacks from July through September 2026.","category":"research","primary":false}],"body":"\u003cp\u003eThe University of Texas at Arlington confirmed that personal information was stolen during a cybersecurity incident last month. The university is still determining whose information was involved and the nature and extent of the accessed data. It said it will contact affected individuals directly after identifying them and provide information on protective steps and university support.\u003c/p\u003e\n\n\u003cp\u003eFollowing the initial announcement, UTA took its MachForms portal offline; the portal, used for event registration, service requests, and surveys, remains unavailable. The university said it continues monitoring for further effects on its systems and operations. The Qilin ransomware group claimed the incident, while other universities, including York University and Vanderbilt University, are also dealing with recent incidents involving stolen information or major operational disruption.\u003c/p\u003e\n"},{"n":17,"title":"TSMC confirms employee data breach tied to cloud service provider","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/tsmc-confirms-employee-data-breach-cloud-provider","time":"15:06","priority":"SHOULD READ","score":78,"tldr":"TSMC confirmed that a breach at an unnamed cloud service provider exposed data on current and former employees, potentially including contact, identification, and banking details. The company said its own systems, operations, and customer data were not affected.","briefOverview":"\u003cp\u003eTSMC confirmed that an unnamed cloud service provider was breached, exposing information on current and former employees. The company said its investigation found that TSMC systems were not compromised. It said the exposed information matched data held in the cloud provider’s services and was unrelated to TSMC operations or customer data.\u003c/p\u003e\n\n\u003cp\u003eA hacker had advertised 6.9 GB of alleged employee data on a cybercriminal forum on November 8, claiming it included contact, identification, and banking information and seeking 3 BTC for it. TSMC said it is notifying affected personnel and working with the cloud provider, authorities, and a third-party cybersecurity agency. The incident affects a major semiconductor manufacturer that supplies companies including Nvidia, Apple, Broadcom, and Qualcomm, though TSMC said customer-related data was not involved.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TSMC said a breach at an unnamed cloud service provider exposed information about current and former employees.","The company said its own systems were not compromised and that the affected information was unrelated to its operations or customer data.","A hacker advertised 6.9 GB of alleged TSMC employee data on November 8 and sought 3 BTC for it.","TSMC said it is notifying affected personnel and working with the cloud vendor, authorities, and a third-party cybersecurity agency.","TSMC has previously faced a 2023 ransomware incident involving an IT hardware supplier and fired two employees last year over suspected trade-secret theft."],"insights":["The incident shows that employee information held by an outside cloud provider can be exposed even when TSMC’s own systems are not compromised.","TSMC said the exposed data was separate from operational and customer information, limiting the reported impact to current and former personnel rather than chip production or customer records.","The alleged sale of 6.9 GB of employee data for 3 BTC indicates that the stolen information was being marketed publicly rather than only used privately.","Because TSMC supplies major technology companies and controls more than 70% of the semiconductor market, the company’s statement that operations and customer data were unaffected is especially significant."],"referencedReports":[],"body":"\u003cp\u003eTSMC confirmed that an unnamed cloud service provider was breached, exposing information on current and former employees. The company said its investigation found that TSMC systems were not compromised. It said the exposed information matched data held in the cloud provider’s services and was unrelated to TSMC operations or customer data.\u003c/p\u003e\n\n\u003cp\u003eA hacker had advertised 6.9 GB of alleged employee data on a cybercriminal forum on November 8, claiming it included contact, identification, and banking information and seeking 3 BTC for it. TSMC said it is notifying affected personnel and working with the cloud provider, authorities, and a third-party cybersecurity agency. The incident affects a major semiconductor manufacturer that supplies companies including Nvidia, Apple, Broadcom, and Qualcomm, though TSMC said customer-related data was not involved.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft says November security updates cause printing issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-says-november-security-updates-cause-printing-issues/","time":"12:27","priority":"MAY READ","score":72,"tldr":"Microsoft says November 2026 Windows security updates can cause printing failures for complex documents containing zero-dimension images, particularly in Word documents printed through GDI. The issue affects Windows 10 and later clients and Windows Server 2016 and later systems.","briefOverview":"\u003cp\u003eMicrosoft warned that the November 2026 Windows security updates may cause printing failures for documents with complex formatting. The issue affects Windows 10 and later client devices and Windows Server 2016 and later server devices. According to Microsoft, printing can fail when a document contains an image rendered with a height or width of zero at the selected printing resolution.\u003c/p\u003e\n\n\u003cp\u003eSuch zero-size images may be used as invisible watermarks, layout anchors, or objects inserted by document-generation tools when no graphic is present. Microsoft said the issue mainly affects Microsoft Word documents printed through the Windows Graphics Device Interface, although other applications may also experience failures. The warning follows other Microsoft-confirmed update-related problems involving Windows activation and licensing, SQL Server performance and stability, and Windows 11 update installation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft warned that November 2026 Windows security updates may cause printing failures for documents with complex formatting.","The issue affects documents containing images rendered with a height or width of zero at the selected printing resolution on Windows 10 or later and Windows Server 2016 or later.","Zero-size images may be used as invisible watermarks, layout anchors, or inserted by document-generation tools when no graphic is present.","The problem mainly affects Microsoft Word documents printed through the Windows Graphics Device Interface, though other applications may also be affected.","Microsoft also reported other recent update-related issues involving Windows activation, SQL Server performance and stability, and Windows 11 update installation."],"insights":["Documents can fail to print because of images that are not visibly part of their content, such as zero-size objects used for watermarks, layout positioning, or created by document-generation tools.","Although Microsoft Word printing through the Windows Graphics Device Interface is the main reported scenario, Microsoft says the issue can also affect printing from other applications.","The printing problem is one of several issues Microsoft acknowledged around recent Windows updates, alongside activation failures, SQL Server problems, and Windows 11 installation errors."],"referencedReports":[{"title":"Windows release health service alert WI1549472","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1549472","publisher":"microsoft","context":"Microsoft's service alert describes the known printing issue caused by the November 2026 Windows security updates.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft warned that the November 2026 Windows security updates may cause printing failures for documents with complex formatting. The issue affects Windows 10 and later client devices and Windows Server 2016 and later server devices. According to Microsoft, printing can fail when a document contains an image rendered with a height or width of zero at the selected printing resolution.\u003c/p\u003e\n\n\u003cp\u003eSuch zero-size images may be used as invisible watermarks, layout anchors, or objects inserted by document-generation tools when no graphic is present. Microsoft said the issue mainly affects Microsoft Word documents printed through the Windows Graphics Device Interface, although other applications may also experience failures. The warning follows other Microsoft-confirmed update-related problems involving Windows activation and licensing, SQL Server performance and stability, and Windows 11 update installation.\u003c/p\u003e\n"},{"n":13,"title":"Ransomware attack on Belarusian cloud firm disrupts businesses for days","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/belarus-cloud-provider-activecloud-ransomware-attack","time":"14:28","priority":"MAY READ","score":70,"tldr":"A ransomware attack on Belarusian cloud provider ActiveCloud disrupted hosted websites, corporate email, and virtual servers for days, affecting customers including Smartpress and Domino’s Belarus. ActiveCloud says core services are restored and it found no evidence of customer data theft, though some recovery issues remain.","briefOverview":"\u003cp\u003eBelarusian cloud services provider ActiveCloud said it was hit by a ransomware attack that encrypted parts of its cloud infrastructure. The incident disrupted customer websites, corporate email, virtual servers, and customer support channels across Belarus. ActiveCloud first disclosed the attack on Tuesday and said that, while key infrastructure was restored by Wednesday, full recovery for customers would take longer than expected.\u003c/p\u003e\n\n\u003cp\u003eBy Friday, ActiveCloud said its main services had been restored, although some customers could still have difficulty restoring virtual machines. The company said it found no evidence that customer data was stolen, but it has not identified the attackers or explained how they accessed its systems. Smartpress and Domino’s Pizza in Belarus were among affected organizations, and the incident followed recent attacks on Russian hosting providers ESTT and Beget, though no public evidence links the three attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Belarusian cloud services provider ActiveCloud said hackers encrypted parts of its cloud infrastructure, disrupting customer websites, corporate email, virtual servers, and support channels.","ActiveCloud disclosed the incident on Tuesday and said on Friday that it had restored its main services, though some customers were still having difficulty restoring virtual machines.","The company said its investigation found no evidence that customer data was stolen, and it has not identified the attackers or explained how they accessed its systems.","Smartpress and Domino’s Pizza in Belarus were among organizations affected by outages linked to ActiveCloud’s disruption.","The incident followed recent attacks on Russian hosting providers ESTT and Beget, but there is no publicly confirmed evidence connecting the three incidents."],"insights":["The disruption affected unrelated organizations, including a news outlet and a pizza chain, illustrating that an outage at one cloud provider can interrupt many types of customer-facing services simultaneously.","Restoring ActiveCloud’s main services did not immediately restore every customer environment, as the company warned that some customers could still have difficulty bringing virtual machines back online.","The recent incidents differed in impact: ActiveCloud and ESTT reported no evidence of customer data theft, while Beget said destructive scripts wiped data and caused some virtual-server backups to be lost.","Although hosting providers in Belarus and Russia were hit in close succession, the article states that there is no publicly confirmed evidence that the ActiveCloud, ESTT, and Beget incidents were connected."],"referencedReports":[],"body":"\u003cp\u003eBelarusian cloud services provider ActiveCloud said it was hit by a ransomware attack that encrypted parts of its cloud infrastructure. The incident disrupted customer websites, corporate email, virtual servers, and customer support channels across Belarus. ActiveCloud first disclosed the attack on Tuesday and said that, while key infrastructure was restored by Wednesday, full recovery for customers would take longer than expected.\u003c/p\u003e\n\n\u003cp\u003eBy Friday, ActiveCloud said its main services had been restored, although some customers could still have difficulty re
