<script type="application/json" id="dl-articles">[{"n":43,"title":"CVE-2026-114938: OpenJDK Base64 Decoder Vulnerable To Pre-Authentication RCE (Java4Shell)","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/cve-2026-114938-openjdk-base64-decoder-vulnerable-pre-authentication-rce","time":"02:39","priority":"MUST READ","score":95,"tldr":"CVE-2026-114938 (“Java4Shell”) is a critical OpenJDK Base64 intrinsic flaw that can enable pre-authentication RCE on AVX-512 VBMI-capable x86-64 systems when applications decode attacker-controlled malformed Base64 input. Patch affected JDKs immediately and, if patching is delayed, restart JVMs with -XX:-UseBASE64Intrinsics to disable the vulnerable path.","briefOverview":"\u003cp\u003eCVE-2026-114938, known as Java4Shell, is a critical heap memory-corruption flaw in OpenJDK’s hardware-accelerated Base64 decoder that was publicly disclosed on November 17, 2026. The flaw affects certain x86-64 systems and can be reached when applications send attacker-controlled data to the affected decoder. Calif.io demonstrated pre-authentication remote code execution in default configurations of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, while other products were shown vulnerable after authentication.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable routine is produced by the HotSpot C2 compiler on processors supporting avx512f, avx512bw, avx512vbmi, and bmi2, including newer Intel Xeon and AMD EPYC and Ryzen systems. Malformed Base64 input can trigger an arithmetic underflow that leads to a 62-byte out-of-bounds heap write; ARM64 systems and older x86-64 processors without AVX-512 VBMI are not affected. Organizations are advised to update to patched JDK builds and restart JVMs, or temporarily start affected JVMs with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e to disable the vulnerable optimized code path.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-114938, also called Java4Shell, is a critical OpenJDK Base64 decoder flaw disclosed on November 17, 2026 that can cause a 62-byte heap out-of-bounds write on certain x86-64 processors.","The vulnerable code path requires x86-64 CPUs with avx512f, avx512bw, avx512vbmi, and bmi2 support, while ARM64 processors and older x86-64 CPUs without AVX-512 VBMI are not affected.","Researchers demonstrated pre-authentication remote code execution in default configurations of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate.","Organizations should upgrade to patched JDK builds and restart JVM processes and containers; where upgrades are delayed, they can use -XX:-UseBASE64Intrinsics to disable the affected optimized Base64 code path.","The article identifies indicators including Base64 warm-up request floods, partial HTTP requests used for heap grooming, malformed Base64 padding tails, spikes in IllegalArgumentException errors, and HotSpot crash logs."],"insights":["The issue is limited to a specific high-performance decoder path on x86-64 CPUs with four AVX-512-related capabilities, so affected organizations can assess exposure by checking for avx512f, avx512bw, avx512vbmi, and bmi2 in Linux /proc/cpuinfo.","A temporary mitigation can disable the vulnerable Base64 optimization with -XX:-UseBASE64Intrinsics, but the alternative -XX:UseAVX=2 workaround must not be used on ARM64 systems because those JVMs will fail to start.","Reverse-proxy request buffering can disrupt exploitation methods that rely on several partially sent HTTP requests arriving at coordinated times, but it does not fully protect against single-request exploit chains or WebSocket tunnels.","The article describes a client-side TLS scenario in which a Java client connecting to a malicious server may be affected, extending the risk beyond publicly exposed Java servers."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-114938, known as Java4Shell, is a critical heap memory-corruption flaw in OpenJDK’s hardware-accelerated Base64 decoder that was publicly disclosed on November 17, 2026. The flaw affects certain x86-64 systems and can be reached when applications send attacker-controlled data to the affected decoder. Calif.io demonstrated pre-authentication remote code execution in default configurations of Keycloak, Jira, Confluence, JFrog Artifactory, Jenkins, and PingFederate, while other products were shown vulnerable after authentication.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable routine is produced by the HotSpot C2 compiler on processors supporting avx512f, avx512bw, avx512vbmi, and bmi2, including newer Intel Xeon and AMD EPYC and Ryzen systems. Malformed Base64 input can trigger an arithmetic underflow that leads to a 62-byte out-of-bounds heap write; ARM64 systems and older x86-64 processors without AVX-512 VBMI are not affected. Organizations are advised to update to patched JDK builds and restart JVMs, or temporarily start affected JVMs with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e to disable the vulnerable optimized code path.\u003c/p\u003e\n"},{"n":6,"title":"Drupal patches critical RCE flaw, warns exploits may surface quickly","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/drupal-patches-critical-rce-flaw-warns-exploits-may-surface-quickly/","time":"13:08","priority":"MUST READ","score":94,"tldr":"Drupal has patched CVE-2026-132165, a critical unauthenticated flaw that can allow attackers to reinstall Drupal and potentially take over vulnerable sites. Administrators should upgrade immediately or block access to /core/install.php until they can patch.","briefOverview":"\u003cp\u003eDrupal has patched CVE-2026-132165, a critical remote code execution flaw discovered by Anthropic\u0026rsquo;s OSS Scanner. Under specific conditions, anonymous attackers can use Drupal\u0026rsquo;s install.php installer to attempt to reinstall the CMS, which can lead to a site takeover or remote code execution. Drupal warned that exploit methods could be developed within hours or days.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should update to Drupal 10.6.22, 11.3.22, or 11.4.13, while those unable to patch immediately can block access to /core/install.php through web server settings or the site\u0026rsquo;s .htaccess file. Some attack paths are mitigated when the web server cannot write to or change permissions on settings.php, and Drupal Steward WAF customers are protected against known attack vectors but are still advised to update. Drupal also fixed CVE-2026-132166, a moderately critical gadget chain issue that could enable remote code execution for attackers with administrator privileges when untrusted data is deserialized because of another flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal patched CVE-2026-132165, a critical flaw that can allow anonymous attackers to attempt to reinstall Drupal and potentially take over a vulnerable site or run code remotely.","Drupal released fixed versions 10.6.22, 11.3.22, and 11.4.13, and advises organizations that cannot immediately update to block access to /core/install.php.","The Drupal Security Team warned that exploits could be developed within hours or days and said at least one of the critical issues can be exploited by anonymous users.","Drupal also fixed CVE-2026-132166, a moderately critical issue that administrators could use to run code remotely if the application processes untrusted data because of another flaw.","The article notes that CISA has listed five Drupal flaws as exploited in the wild since November 2021, including two used in ransomware attacks."],"insights":["Restricting the web server's ability to write to or change permissions on settings.php can mitigate some paths for the critical installer flaw.","Organizations unable to patch immediately can reduce exposure by blocking access to /core/install.php through their web server configuration or the site's .htaccess file.","Drupal Steward WAF customers are protected from known attack paths, but Drupal still recommends upgrading because additional attack paths may be found.","The separate CVE-2026-132166 issue requires administrative access and another flaw that causes untrusted data to be processed, making it dependent on additional conditions."],"referencedReports":[{"title":"SA-CORE-2026-017","url":"https://www.drupal.org/sa-core-2026-017","publisher":"Drupal Security Team","context":"The article cites this Drupal Security Team advisory for details of the critical installer flaw and its mitigation.","category":"advisory","primary":true},{"title":"Securing the installer (install.php)","url":"https://www.drupal.org/docs/administering-a-drupal-site/security-in-drupal/securing-the-installer-installphp","publisher":"Drupal","context":"The article links to Drupal guidance for blocking access to the installer when an immediate update is not possible.","category":"guide","primary":false}],"body":"\u003cp\u003eDrupal has patched CVE-2026-132165, a critical remote code execution flaw discovered by Anthropic\u0026rsquo;s OSS Scanner. Under specific conditions, anonymous attackers can use Drupal\u0026rsquo;s install.php installer to attempt to reinstall the CMS, which can lead to a site takeover or remote code execution. Drupal warned that exploit methods could be developed within hours or days.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should update to Drupal 10.6.22, 11.3.22, or 11.4.13, while those unable to patch immediately can block access to /core/install.php through web server settings or the site\u0026rsquo;s .htaccess file. Some attack paths are mitigated when the web server cannot write to or change permissions on settings.php, and Drupal Steward WAF customers are protected against known attack vectors but are still advised to update. Drupal also fixed CVE-2026-132166, a moderately critical gadget chain issue that could enable remote code execution for attackers with administrator privileges when untrusted data is deserialized because of another flaw.\u003c/p\u003e\n"},{"n":7,"title":"PHP security updates fix 18 flaws, including critical RCE bugs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/php-security-updates-fix-18-flaws-including-critical-rce-bugs/","time":"16:28","priority":"MUST READ","score":94,"tldr":"PHP released updates for all supported branches fixing 18 security flaws, including critical remote code execution risks in PHP-FPM and session handling. Administrators should upgrade to PHP 8.5.13, 8.4.28, 8.3.37, or 8.2.36 immediately, and disable persistent PHP-FPM connections if patching is delayed.","briefOverview":"\u003cp\u003ePHP released security updates for 18 vulnerabilities across all supported branches: PHP 8.5.13, 8.4.28, 8.3.37, and 8.2.36. The flaws affect PHP’s core engine, session handling, PHP-FPM, CGI, and other components, and include issues that could allow unauthenticated remote code execution. Additional fixes address memory corruption, information disclosure, cross-site scripting, denial-of-service problems, and potentially unsafe handling of HTTPS and FTPS URLs.\u003c/p\u003e\n\n\u003cp\u003eThe most serious issue, CVE-2026-129289, is a PHP-FPM request-smuggling flaw rated 9.2 that can allow remote execution of PHP code when certain nginx, Apache, HAProxy, or LSAPI configurations reuse backend connections. Standard nginx and Apache configurations that do not reuse those connections are not affected by this specific attack. Other notable fixes include multiple use-after-free and session-related flaws that could also lead to remote code execution, plus a PHP-FPM issue that could allow local privilege escalation.\u003c/p\u003e\n\n\u003cp\u003eAdministrators are urged to upgrade to the newly released versions. If an immediate update is not possible, persistent connections between web servers and PHP-FPM can be disabled to mitigate CVE-2026-129289, while disabling session upload progress and restarting PHP workers was recommended for the session-related CVE-2026-115560. These measures do not address all vulnerabilities, and administrators should ensure PHP-FPM and LSAPI listeners are not directly exposed to untrusted networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP released security updates for supported branches 8.5, 8.4, 8.3, and 8.2, with versions 8.5.13, 8.4.28, 8.3.37, and 8.2.36 addressing 18 vulnerabilities.","CVE-2026-129289 is a critical PHP-FPM request-smuggling flaw with a CVSS score of 9.2 that can allow unauthenticated remote PHP code execution in certain configurations that reuse backend connections.","Standard nginx and Apache configurations that do not reuse backend connections are not affected by the CVE-2026-129289 attack.","The updates also fix several flaws that could lead to remote code execution, including CVE-2026-129474, CVE-2026-129496, CVE-2026-126714, and CVE-2026-115560.","Administrators unable to immediately patch CVE-2026-129289 can mitigate it by disabling persistent connections between web servers and PHP-FPM, but this does not address all vulnerabilities fixed in the updates."],"insights":["The highest-severity PHP-FPM flaw depends on connection reuse in specific nginx, Apache, HAProxy, or LSAPI configurations, so standard nginx and Apache deployments that close backend connections after each request are not affected by that particular attack.","Disabling persistent backend connections can reduce exposure to CVE-2026-129289 when immediate patching is not possible, but it does not protect against the other vulnerabilities fixed in the release.","PHP’s temporary mitigation for the session-related CVE-2026-115560 is to disable session upload progress and restart PHP workers.","While official fixes cover only supported PHP branches, patched packages and hardened container images with backported fixes are available for several unsupported PHP versions dating back to PHP 5.6.","Administrators should also ensure PHP-FPM and LSAPI listeners are not directly reachable from untrusted networks."],"referencedReports":[{"title":"PHP Security Release – 19 November 2026 (CVE-2026-115560)","url":"https://www.aikido.dev/blog/php-security-release-19-november-2026-cve-2026-115560","publisher":"aikido","context":"The article cites Aikido's report for details on the 18 fixed CVEs, including the critical PHP-FPM request-smuggling issue and mitigations.","category":"research","primary":true},{"title":"PHP security advisory, October 23, 2026","url":"https://www.php.net/archive/2026.php#2026-10-23-1","publisher":"php-security-team","context":"The article references this informational advisory as the earlier disclosure of the session-related CVE-2026-115560 flaw.","category":"advisory","primary":false},{"title":"PHP security warning, November 18, 2026","url":"https://www.php.net/archive/2026.php#2026-11-18-1","publisher":"php-security-team","context":"The article cites this warning announcing that upcoming PHP updates would address critical issues affecting all supported versions.","category":"advisory","primary":false}],"body":"\u003cp\u003ePHP released security updates for 18 vulnerabilities across all supported branches: PHP 8.5.13, 8.4.28, 8.3.37, and 8.2.36. The flaws affect PHP’s core engine, session handling, PHP-FPM, CGI, and other components, and include issues that could allow unauthenticated remote code execution. Additional fixes address memory corruption, information disclosure, cross-site scripting, denial-of-service problems, and potentially unsafe handling of HTTPS and FTPS URLs.\u003c/p\u003e\n\n\u003cp\u003eThe most serious issue, CVE-2026-129289, is a PHP-FPM request-smuggling flaw rated 9.2 that can allow remote execution of PHP code when certain nginx, Apache, HAProxy, or LSAPI configurations reuse backend connections. Standard nginx and Apache configurations that do not reuse those connections are not affected by this specific attack. Other notable fixes include multiple use-after-free and session-related flaws that could also lead to remote code execution, plus a PHP-FPM issue that could allow local privilege escalation.\u003c/p\u003e\n\n\u003cp\u003eAdministrators are urged to upgrade to the newly released versions. If an immediate update is not possible, persistent connections between web servers and PHP-FPM can be disabled to mitigate CVE-2026-129289, while disabling session upload progress and restarting PHP workers was recommended for the session-related CVE-2026-115560. These measures do not address all vulnerabilities, and administrators should ensure PHP-FPM and LSAPI listeners are not directly exposed to untrusted networks.\u003c/p\u003e\n"},{"n":10,"title":"Critical NGINX ‘NGINX2Root’ bugs let attackers hijack servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-nginx-nginx2root-bugs-let-attackers-hijack-servers/","time":"14:57","priority":"MUST READ","score":94,"tldr":"Critical HTTP/2 flaws in NGINX can enable unauthenticated remote code execution and, when chained with a Linux kernel SCTP bug, potential root-level host compromise. Administrators should immediately upgrade to NGINX Open Source 1.30.7/1.31.9 or NGINX Plus 37.0.8.1/37.3.0.1; disabling HTTP/2 is a temporary mitigation for the two nginx2root flaws.","briefOverview":"\u003cp\u003eResearchers disclosed two critical NGINX HTTP/2 flaws dubbed “nginx2root” that can allow unauthenticated remote code execution on vulnerable web servers. CVE-2026-123007 is a flow-control memory-corruption issue affecting NGINX 1.9.5 through 1.31.8, while CVE-2026-123633 is a use-after-free issue affecting versions 1.19.7 through 1.31.8 when NGINX proxies requests to a backend. Wiz demonstrated remote code execution for both issues, and Xint demonstrated root access by combining the first flaw with a Linux kernel SCTP issue that can escape an NGINX Docker container.\u003c/p\u003e\n\n\u003cp\u003eF5 fixed the reported issues in NGINX Open Source 1.30.7 stable and 1.31.9 mainline; NGINX Plus users should update to 37.0.8.1 or 37.3.0.1. Administrators are advised to upgrade immediately, or temporarily disable HTTP/2 if an upgrade cannot yet be performed, although that measure covers only the two nginx2root flaws. Exposure cannot be determined from NGINX version numbers alone, because the main flaws require reachable HTTP/2 and may have been fixed through backports; Censys estimated 8.8 million potentially exposed services based on visible version data and HTTP/2 support.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two critical NGINX HTTP/2 vulnerabilities, CVE-2026-123007 and CVE-2026-123633, can allow unauthenticated remote code execution on affected servers.","CVE-2026-123007 affects NGINX versions 1.9.5 through 1.31.8, while CVE-2026-123633 affects versions 1.19.7 through 1.31.8 when NGINX proxies requests to a backend.","Researchers demonstrated remote code execution against NGINX serving static files over HTTP/2 with TLS, and Xint demonstrated root access by chaining CVE-2026-123007 with a Linux kernel SCTP flaw.","F5 fixed the reported flaws in NGINX Open Source 1.30.7 stable and 1.31.9 mainline, and NGINX Plus users should update to 37.0.8.1 or 37.3.0.1.","Administrators are advised to upgrade immediately or temporarily disable HTTP/2, although disabling HTTP/2 only mitigates the two nginx2root flaws."],"insights":["NGINX version numbers alone cannot confirm exposure because the two main flaws require reachable HTTP/2 to be enabled, and fixes may have been backported without changing the reported version.","The second critical flaw has a narrower but important condition: it applies when NGINX both accepts HTTP/2 connections and forwards requests to a backend service.","Disabling HTTP/2 is only a temporary measure for the two nginx2root issues and does not address the three other reported flaws or the separate TLS 1.3 denial-of-service issue.","Censys estimated that 8.8 million services were potentially exposed based on visible versions and HTTP/2 support, but 104 million services did not disclose their NGINX version, limiting internet-wide exposure estimates."],"referencedReports":[{"title":"NGINX2Root: Remote Code Execution","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article cites Xint's technical research on the NGINX flaws and its demonstration of root access by chaining one flaw with a Linux kernel SCTP issue.","category":"research","primary":true},{"title":"NGINX HTTP/2 RCE Vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"wiz","context":"The article cites Wiz's research and its demonstrations of unauthenticated remote code execution through the two critical HTTP/2 flaws.","category":"research","primary":true},{"title":"NGINX2Root: A Simple Test","url":"https://censys.com/blog/nginx2root-simple-test/","publisher":"censys","context":"The article references Censys lab testing that reproduced memory-corruption conditions in four of the five reported flaws without achieving remote code execution.","category":"research","primary":false},{"title":"NGINX Security Advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"f5","context":"The article links F5's security advisory page for the updates that fix the reported flaws and five additional vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed two critical NGINX HTTP/2 flaws dubbed “nginx2root” that can allow unauthenticated remote code execution on vulnerable web servers. CVE-2026-123007 is a flow-control memory-corruption issue affecting NGINX 1.9.5 through 1.31.8, while CVE-2026-123633 is a use-after-free issue affecting versions 1.19.7 through 1.31.8 when NGINX proxies requests to a backend. Wiz demonstrated remote code execution for both issues, and Xint demonstrated root access by combining the first flaw with a Linux kernel SCTP issue that can escape an NGINX Docker container.\u003c/p\u003e\n\n\u003cp\u003eF5 fixed the reported issues in NGINX Open Source 1.30.7 stable and 1.31.9 mainline; NGINX Plus users should update to 37.0.8.1 or 37.3.0.1. Administrators are advised to upgrade immediately, or temporarily disable HTTP/2 if an upgrade cannot yet be performed, although that measure covers only the two nginx2root flaws. Exposure cannot be determined from NGINX version numbers alone, because the main flaws require reachable HTTP/2 and may have been fixed through backports; Censys estimated 8.8 million potentially exposed services based on visible version data and HTTP/2 support.\u003c/p\u003e\n"},{"n":18,"title":"CISA Warns of 4 Exploited Flaws Linked to Ransomware, Cryptomining, and LLMjacking Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-warns-of-4-exploited-flaws-linked.html","time":"08:00","priority":"MUST READ","score":94,"tldr":"CISA added four actively exploited flaws in Synology DSM, LiteLLM, Apache Axis, and REDCap to its KEV catalog, linking them to ransomware, cryptomining, and LLMjacking activity. Organizations should urgently patch or mitigate the affected systems, especially because Apache Axis 1.x is end-of-life and lacks an official fix.","briefOverview":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt University REDCap to its Known Exploited Vulnerabilities catalog. The flaws include three remote code execution issues with CVSS scores of 9.8 and a LiteLLM issue rated 8.8 that can enable code execution through a guardrails testing endpoint. CISA said the REDCap flaw can be triggered through crafted HTTP requests in a public survey context when an attacker knows a valid survey hash.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Axis flaw has reportedly been used alongside N-able N-central vulnerabilities to install cryptocurrency miners, but Axis 1.x is end-of-life and has no official patch. Separately, Safe Security observed REDCap exploitation that deployed a temporary web shell, loaded XMRig disguised as image files, and established persistence through cron and an added SSH key. The LiteLLM flaw has been used in LLMjacking activity to turn limited-access inference keys into administrator credentials, while the Synology DSM flaw has been linked to C3RB3R ransomware attacks on network-attached storage devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt REDCap to its Known Exploited Vulnerabilities catalog.","The Apache Axis flaw CVE-2026-90436 has been used with N-able N-central vulnerabilities to deploy cryptocurrency miners, and Axis 1.x is end-of-life without an official patch.","Attackers have abused the REDCap flaw CVE-2026-90817 to deploy a temporary web shell and retrieve XMRig cryptocurrency-mining software disguised as image files.","Threat actors used the LiteLLM flaw CVE-2026-40217 to turn limited AI-service access keys into full administrator credentials and maintain access in LLMjacking campaigns.","Synology disclosed that CVE-2024-10441 in DiskStation Manager has been exploited to deploy C3RB3R ransomware on network-attached storage devices."],"insights":["Apache Axis 1.x presents an unusual remediation problem because it is end-of-life and has no official patch; users are advised to migrate to Axis 2/Java or apply a build containing a specific July 2026 commit.","The REDCap exploitation described was designed to be less visible: attackers used a temporary web shell, loaded XMRig into memory, disguised it as image files, and made it appear as the syslog-ng service.","The LiteLLM flaw can turn a limited-access inference key into full administrator credentials, meaning a credential intended for restricted AI use can provide much broader control.","The four flaws are associated with distinct criminal outcomes—cryptocurrency mining, persistence in AI-service environments, and C3RB3R ransomware—rather than a single type of misuse.","CISA set different remediation deadlines, requiring action for the DSM, REDCap, and Axis flaws by November 21, 2026, while allowing until December 2, 2026 for the LiteLLM flaw."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's advisory announcing the addition of four actively exploited vulnerabilities to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"This Week in CVEs: The Week Defenders Lost the Head Start","url":"https://safe.security/resources/blog/this-week-in-cves-the-week-defenders-lost-the-head-start/","publisher":"safe-security","context":"The article references Safe Security's report describing observed exploitation of the REDCap flaw to deploy XMRig cryptocurrency-mining software.","category":"research","primary":false},{"title":"Agentic Threat Activity Crosses a Significant Threshold","url":"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold","publisher":"google-threat-intelligence-group","context":"The article cites Google's threat intelligence report on actors exploiting the LiteLLM flaw to escalate inference keys into administrator credentials in LLMjacking activity.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt University REDCap to its Known Exploited Vulnerabilities catalog. The flaws include three remote code execution issues with CVSS scores of 9.8 and a LiteLLM issue rated 8.8 that can enable code execution through a guardrails testing endpoint. CISA said the REDCap flaw can be triggered through crafted HTTP requests in a public survey context when an attacker knows a valid survey hash.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Axis flaw has reportedly been used alongside N-able N-central vulnerabilities to install cryptocurrency miners, but Axis 1.x is end-of-life and has no official patch. Separately, Safe Security observed REDCap exploitation that deployed a temporary web shell, loaded XMRig disguised as image files, and established persistence through cron and an added SSH key. The LiteLLM flaw has been used in LLMjacking activity to turn limited-access inference keys into administrator credentials, while the Synology DSM flaw has been linked to C3RB3R ransomware attacks on network-attached storage devices.\u003c/p\u003e\n"},{"n":22,"title":"phpAfterShell Explained: How Hackers Could Turn a PHP Session Flaw Into Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/phpaftershell-explained-how-hackers.html","time":"16:59","priority":"MUST READ","score":94,"tldr":"PHP has patched the critical phpAfterShell session-file flaw (CVE-2026-126714), which can let attackers manipulate interrupted session writes to deserialize attacker-controlled objects and potentially achieve code execution. Update to PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, or later; disabling upload-progress tracking is only a temporary, incomplete mitigation.","briefOverview":"\u003cp\u003ePHP released fixes for phpAfterShell, a critical file-based session handling flaw tracked as CVE-2026-126714 and rated 9.2 out of 10 by PHP maintainers. The issue affects PHP 8.2 before 8.2.36, PHP 8.3 before 8.3.37, PHP 8.4 before 8.4.28, and PHP 8.5 before 8.5.13; PHP 8.6.0 also includes the fix. Servers that installed the October 21 PHP2Shell patches remain affected until they install these newer releases, although no attacks using phpAfterShell have been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can occur when a PHP session-file write stops partway through, leaving a mix of new and old data that an attacker may shape so PHP later treats it as a separately stored object. In the tested route, PHP upload-progress tracking writes information into a user session before the application\u0026rsquo;s own code runs, and a later request that starts the session can load the planted object. Code execution also requires a suitable additional weakness, such as an application gadget chain, but the technique can also alter session values including login status, permissions, and CSRF tokens.\u003c/p\u003e\n\n\u003cp\u003ePHP\u0026rsquo;s fixed releases clear the session file before writing and stop if that clearing step fails, preventing an interrupted write from retaining old data in this way. They also disable upload-progress tracking by default, though the article notes that configuration files or hosting panels can switch it back on and that disabling it alone is not a complete fix. Operators are advised to update PHP, rebuild and redeploy container images where applicable, and verify that the PHP version serving web requests includes the patch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP patched phpAfterShell, tracked as CVE-2026-126714 and rated 9.2 out of 10 by PHP maintainers, in PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, and 8.6.0.","The flaw affects PHP’s default file-based session handler, where an interrupted session-file write can combine new and old data so that later requests load attacker-selected objects.","Attackers can use PHP upload-progress tracking to write to a session before an application’s own code runs, although disabling this feature does not fully address other ways untrusted data may enter sessions.","Successful code execution requires an additional suitable gadget chain in the application or another bug, while the flaw can also change session values such as login status, permissions, or CSRF tokens.","PHP switched upload-progress tracking off by default in the fixed releases, and site operators are advised to update, redeploy rebuilt containers, and verify the version serving web requests."],"insights":["Servers that installed the October 21 PHP2Shell emergency patches can still be affected, because those fixes restricted class loading during upload progress but did not address the interrupted session-file write itself.","An application does not need to offer a visible upload page for the tested upload-progress path to be reachable; a multipart upload can cause PHP to write session data before the application’s code runs.","Moving sessions to a storage system that replaces records in a single step avoids this specific file-handler defect, although updating PHP remains the recommended remedy for sites using file-based sessions.","Linux distribution packages may include the fix without changing the reported PHP version number, so checking the version alone may not reliably establish whether a server is patched."],"referencedReports":[{"title":"PHP Security Advisory GHSA-fm2m-fjf5-v3cp","url":"https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp","publisher":"php","context":"The article cites PHP's security advisory for the affected PHP versions and temporary mitigation guidance.","category":"advisory","primary":true},{"title":"phpAfterShell Technical Analysis","url":"https://depthfirst.com/research/phpaftershell","publisher":"depthfirst","context":"The article relies on Depthfirst researchers' technical analysis to explain the interrupted session-write technique and its proof of concept.","category":"research","primary":true},{"title":"phpAfterShell Remediation Guidance","url":"https://depthfirst.com/phpaftershell","publisher":"depthfirst","context":"The article references this guidance for recommended upgrade, redeployment, and verification steps.","category":"guide","primary":false}],"body":"\u003cp\u003ePHP released fixes for phpAfterShell, a critical file-based session handling flaw tracked as CVE-2026-126714 and rated 9.2 out of 10 by PHP maintainers. The issue affects PHP 8.2 before 8.2.36, PHP 8.3 before 8.3.37, PHP 8.4 before 8.4.28, and PHP 8.5 before 8.5.13; PHP 8.6.0 also includes the fix. Servers that installed the October 21 PHP2Shell patches remain affected until they install these newer releases, although no attacks using phpAfterShell have been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can occur when a PHP session-file write stops partway through, leaving a mix of new and old data that an attacker may shape so PHP later treats it as a separately stored object. In the tested route, PHP upload-progress tracking writes information into a user session before the application\u0026rsquo;s own code runs, and a later request that starts the session can load the planted object. Code execution also requires a suitable additional weakness, such as an application gadget chain, but the technique can also alter session values including login status, permissions, and CSRF tokens.\u003c/p\u003e\n\n\u003cp\u003ePHP\u0026rsquo;s fixed releases clear the session file before writing and stop if that clearing step fails, preventing an interrupted write from retaining old data in this way. They also disable upload-progress tracking by default, though the article notes that configuration files or hosting panels can switch it back on and that disabling it alone is not a complete fix. Operators are advised to update PHP, rebuild and redeploy container images where applicable, and verify that the PHP version serving web requests includes the patch.\u003c/p\u003e\n"},{"n":23,"title":"PHP Fixes 7 Critical Flaws, Including Bugs That Could Allow Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/php-fixes-7-critical-flaws-including.html","time":"15:18","priority":"MUST READ","score":94,"tldr":"The PHP Foundation released updates for seven critical flaws, many rated CVSS 9.2, that can enable remote code execution, memory corruption, session corruption, or denial of service in affected PHP deployments. Organizations should upgrade to PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, or 8.6.0 immediately; if patching is delayed, disable session upload progress where applicable.","briefOverview":"\u003cp\u003eThe PHP Foundation released security updates for multiple critical PHP flaws that can enable remote code execution, memory corruption, session corruption, denial of service, or local privilege escalation in affected deployments. Seven of the listed flaws carry a CVSS score of 9.2, including CVE-2026-115560, several use-after-free issues, and CVE-2026-126714. Patches are available in PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, and 8.6.0, and users of existing supported branches are advised to update.\u003c/p\u003e\n\n\u003cp\u003eDepthfirst named CVE-2026-126714 “phpAfterShell” and described how an interrupted write to a file-based PHP session can leave a mixture of old and new session data on disk. When the application later calls \u003ccode\u003esession_start()\u003c/code\u003e, PHP may interpret leftover bytes as serialized objects, which can lead to remote code execution when combined with a suitable deserialization gadget chain. The issue affects applications using affected PHP versions with file-based sessions; if immediate patching is not possible, the article recommends disabling session upload progress.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The PHP Foundation released security updates for multiple critical flaws that can lead to remote code execution, session corruption, memory corruption, denial of service, or local privilege escalation under certain conditions.","Seven of the disclosed vulnerabilities have CVSS scores of 9.2, including CVE-2026-115560, CVE-2026-126714, and several use-after-free flaws.","Depthfirst named CVE-2026-126714 “phpAfterShell” and said it can allow remote code execution in applications using affected PHP versions with file-based sessions.","CVE-2026-129289 can allow attacker-controlled PHP code to run when persistent backend connections are enabled and an application opens php://input without reading it fully.","The fixes are available in PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, and 8.6.0, and users are advised to update to the latest applicable release."],"insights":["The phpAfterShell flaw can arise when a session file write is interrupted, leaving a mixture of new and old session data that PHP may later treat as legitimate serialized objects.","Exploiting CVE-2026-126714 requires several conditions beyond an affected version, including attacker influence over session data, a useful interruption during the write, and an application with a suitable deserialization gadget chain.","CVE-2026-129289 is specifically relevant to deployments using persistent FastCGI-style backend connections, such as nginx with fastcgi_keep_conn enabled, Apache mod_proxy_fcgi with enablereuse enabled, HAProxy FastCGI applications retaining backend connections, or LSAPI.","If organizations cannot immediately update PHP, the article recommends disabling session upload progress as a mitigation for the file-based session issue."],"referencedReports":[{"title":"CVE-2026-115560 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx","publisher":"php","context":"The article links this PHP security advisory for details of the improper input-validation flaw fixed across supported PHP releases.","category":"advisory","primary":true},{"title":"CVE-2026-129182 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-2fjv-p558-g82m","publisher":"php","context":"The article links this PHP security advisory for the use-after-free issue affecting PHP 8.5 and later.","category":"advisory","primary":true},{"title":"CVE-2026-126714 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp","publisher":"php","context":"The article links this PHP security advisory for the TOCTOU session-data flaw known as phpAfterShell.","category":"advisory","primary":true},{"title":"CVE-2026-129289 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6","publisher":"php","context":"The article links this PHP security advisory for the inconsistent HTTP request interpretation issue involving persistent backend connections.","category":"advisory","primary":true},{"title":"CVE-2026-129474 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-8mjj-2r7p-4hg2","publisher":"php","context":"The article links this PHP security advisory for a use-after-free issue that can result in remote code execution on PHP 8.5 and later.","category":"advisory","primary":true},{"title":"CVE-2026-129481 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7","publisher":"php","context":"The article links this PHP security advisory for a use-after-free flaw affecting session cleanup and potentially reused PHP workers.","category":"advisory","primary":true},{"title":"CVE-2026-129496 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-gr4f-wgx5-jpfv","publisher":"php","context":"The article links this PHP security advisory for a use-after-free issue that can crash PHP workers or permit arbitrary code execution.","category":"advisory","primary":true},{"title":"CVE-2026-129291 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-jm4m-qfqx-967m","publisher":"php","context":"The article links this PHP security advisory for the local privilege-escalation issue involving PHP-FPM worker output handling.","category":"advisory","primary":true},{"title":"phpAfterShell","url":"https://depthfirst.com/phpaftershell","publisher":"depthfirst","context":"The article cites Depthfirst's technical research naming CVE-2026-126714 phpAfterShell and explaining how interrupted session-file writes can lead to remote code execution.","category":"research","primary":true}],"body":"\u003cp\u003eThe PHP Foundation released security updates for multiple critical PHP flaws that can enable remote code execution, memory corruption, session corruption, denial of service, or local privilege escalation in affected deployments. Seven of the listed flaws carry a CVSS score of 9.2, including CVE-2026-115560, several use-after-free issues, and CVE-2026-126714. Patches are available in PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, and 8.6.0, and users of existing supported branches are advised to update.\u003c/p\u003e\n\n\u003cp\u003eDepthfirst named CVE-2026-126714 “phpAfterShell” and described how an interrupted write to a file-based PHP session can leave a mixture of old and new session data on disk. When the application later calls \u003ccode\u003esession_start()\u003c/code\u003e, PHP may interpret leftover bytes as serialized objects, which can lead to remote code execution when combined with a suitable deserialization gadget chain. The issue affects applications using affected PHP versions with file-based sessions; if immediate patching is not possible, the article recommends disabling session upload progress.\u003c/p\u003e\n"},{"n":28,"title":"NGINX ( HTTP/2 ) – Critical Remote Code Execution Vulnerability (CVE-2026-123007)","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/nginx-http-2-critical-remote-code-execution-vulnerability-cve-2026-123007/","time":"00:29","priority":"MUST READ","score":94,"tldr":"F5 disclosed CVE-2026-123007, a critical unauthenticated remote code execution flaw in nginx HTTP/2 that affects vulnerable nginx and NGINX Plus releases when HTTP/2 is enabled. Organizations should immediately upgrade to fixed releases or disable HTTP/2 until patching is complete.","briefOverview":"\u003cp\u003eF5 disclosed CVE-2026-123007, a critical vulnerability in nginx’s HTTP/2 implementation, rated 9.2 under CVSS 4.0. The flaw can allow an unauthenticated remote attacker to read and overwrite memory in an nginx worker process and potentially achieve remote code execution. It affects nginx Open Source versions 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, as well as several NGINX Plus releases, when HTTP/2 is enabled.\u003c/p\u003e\n\n\u003cp\u003eThe underlying issue is an integer underflow in HTTP/2 flow-control accounting that can cause out-of-bounds memory reads and writes after queued data frames are cleaned up. The article states that researchers confirmed working unauthenticated remote code execution against affected builds, although no exploitation in the wild had been reported as of November 18, 2026. F5 fixed the flaw in nginx Open Source 1.31.9 and 1.30.7 and in NGINX Plus 37.3.0.1 and 37.0.8.1; organizations unable to patch immediately can disable HTTP/2, but must also address other vulnerabilities included in the same release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 disclosed CVE-2026-123007, a critical integer-underflow flaw in nginx HTTP/2 flow-control accounting that can allow an unauthenticated remote attacker to read and overwrite memory in an nginx worker process.","The issue affects nginx Open Source 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, along with specified NGINX Plus releases, only when HTTP/2 is enabled.","F5 fixed the issue in nginx Open Source 1.31.9 and 1.30.7, and in NGINX Plus 37.3.0.1 and 37.0.8.1.","Servers that support only HTTP/1.1 are not affected, and organizations that cannot immediately patch can mitigate exposure by disabling HTTP/2.","The article states that no exploitation in the wild had been reported as of November 18, 2026, although researchers confirmed working unauthenticated remote code execution against affected builds."],"insights":["A reported nginx version alone may not determine exposure because Linux distribution packages can include the fix without changing the displayed nginx version, so organizations should compare their full package version with their distribution’s security advisory.","A configuration reload does not replace the vulnerable nginx executable; nginx must be restarted or undergo a supported live binary upgrade, and existing HTTP/2 connections can remain on old worker processes.","Although researchers demonstrated unauthenticated remote code execution, the article notes that a code-execution exploit may require substantial HTTP/2 traffic over one connection and may be less reliable on slower networks or through proxied HTTP/2 connections.","The same updates address several other serious flaws in HTTP/2, HTTP/3, DNS resolution, and mail proxy functionality, so disabling HTTP/2 alone does not address all issues covered by the release."],"referencedReports":[{"title":"nginx Security Advisories","url":"http://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article cites nginx Security Advisories as an additional resource for the disclosed vulnerability and remediation information.","category":"advisory","primary":true}],"body":"\u003cp\u003eF5 disclosed CVE-2026-123007, a critical vulnerability in nginx’s HTTP/2 implementation, rated 9.2 under CVSS 4.0. The flaw can allow an unauthenticated remote attacker to read and overwrite memory in an nginx worker process and potentially achieve remote code execution. It affects nginx Open Source versions 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, as well as several NGINX Plus releases, when HTTP/2 is enabled.\u003c/p\u003e\n\n\u003cp\u003eThe underlying issue is an integer underflow in HTTP/2 flow-control accounting that can cause out-of-bounds memory reads and writes after queued data frames are cleaned up. The article states that researchers confirmed working unauthenticated remote code execution against affected builds, although no exploitation in the wild had been reported as of November 18, 2026. F5 fixed the flaw in nginx Open Source 1.31.9 and 1.30.7 and in NGINX Plus 37.3.0.1 and 37.0.8.1; organizations unable to patch immediately can disable HTTP/2, but must also address other vulnerabilities included in the same release.\u003c/p\u003e\n"},{"n":30,"title":"Ruby2Shell: critical Ruby RCE, affected versions and how to fix it (GHSA-34m4-m9fh-gqp5)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/ruby2shell","time":"09:42","priority":"MUST READ","score":94,"tldr":"Ruby2Shell (GHSA-34m4-m9fh-gqp5) is a critical unauthenticated Ruby RCE affecting Ruby 2.4.0 through 3.3.13, 3.4.12, and 4.0.9 when applications case-convert untrusted legacy-encoded strings, including default Rails and classic Sinatra setups. Upgrade immediately to Ruby 3.3.14, 3.4.13, or 4.0.10; Ruby 3.2 and older require migration, while affected self-hosted products should be restricted until vendor patches arrive.","briefOverview":"\u003cp\u003eRuby2Shell, identified as GHSA-34m4-m9fh-gqp5, is a critical Ruby flaw that may allow an unauthenticated attacker to run code on a server. The issue is a one-byte heap overflow in Ruby’s handling of string case changes for certain legacy single-byte encodings, including ISO-8859-1. UTF-8 strings are not affected, but Rails and classic-style Sinatra applications are exposed by default because they perform relevant case changes on untrusted strings.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Ruby 2.4.0 through 3.3.13, 3.4.0 through 3.4.12, and 4.0.0 through 4.0.9. Ruby fixed the problem in versions 3.3.14, 3.4.13, and 4.0.10, while Ruby 3.2 and older are end of life and have no fix. The article says current releases of GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot still bundle affected Ruby versions, and recommends restricting access to those servers until vendors release fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby2Shell, tracked as GHSA-34m4-m9fh-gqp5, is a critical one-byte heap overflow in Ruby’s handling of case changes for strings using certain legacy single-byte encodings.","The flaw affects Ruby 2.4.0 through 3.3.13, Ruby 3.4.0 through 3.4.12, and Ruby 4.0.0 through 4.0.9; UTF-8 strings are not affected.","Rails and classic-style Sinatra applications are exposed by default because they change the case of untrusted strings in affected encodings.","Ruby fixed the issue in versions 3.3.14, 3.4.13, and 4.0.10, while Ruby 3.2 and older are end of life and have no fix.","The article states that GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot still bundled affected Ruby versions as of November 19, 2026."],"insights":["The flaw is tied to legacy encodings such as ISO-8859-x and Windows-125x rather than UTF-8, so the risk depends on how an application handles incoming text as well as its Ruby version.","Updating a host’s system Ruby may not protect self-hosted products that ship with their own Ruby runtime, including the listed GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot releases.","Ruby lists no workaround for the issue, making an upgrade to a fixed supported release or a move off Ruby 3.2 and older necessary.","For affected self-hosted software without a vendor patch, the article recommends immediately making the server private through measures such as a VPN or IP allowlist.","Although no attacks had been reported, Ruby maintainers were aware of proof-of-concept exploits and the researchers planned to publish theirs in about a week."],"referencedReports":[{"title":"AIKIDO-2026-151885","url":"https://intel.aikido.dev/cve/AIKIDO-2026-151885","publisher":"aikido-intel","context":"The article identifies this Aikido Intel advisory as its tracking entry for the Ruby2Shell flaw and directs readers to it for details.","category":"advisory","primary":true}],"body":"\u003cp\u003eRuby2Shell, identified as GHSA-34m4-m9fh-gqp5, is a critical Ruby flaw that may allow an unauthenticated attacker to run code on a server. The issue is a one-byte heap overflow in Ruby’s handling of string case changes for certain legacy single-byte encodings, including ISO-8859-1. UTF-8 strings are not affected, but Rails and classic-style Sinatra applications are exposed by default because they perform relevant case changes on untrusted strings.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Ruby 2.4.0 through 3.3.13, 3.4.0 through 3.4.12, and 4.0.0 through 4.0.9. Ruby fixed the problem in versions 3.3.14, 3.4.13, and 4.0.10, while Ruby 3.2 and older are end of life and have no fix. The article says current releases of GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot still bundle affected Ruby versions, and recommends restricting access to those servers until vendors release fixes.\u003c/p\u003e\n"},{"n":33,"title":"NGINX2Root (CVE-2026-123007): Frequently asked questions about five critical NGINX vulnerabilities","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/nginx2root-cve-2026-123007-frequently-asked-questions-about-five-critical-nginx","time":"00:18","priority":"MUST READ","score":94,"tldr":"F5 released out-of-band patches for five critical NGINX RCE flaws, led by CVE-2026-123007 in HTTP/2, plus five additional vulnerabilities; organizations should upgrade NGINX Open Source to 1.30.7/1.31.9 or the applicable NGINX Plus fixed release and restart the service.","briefOverview":"\u003cp\u003eF5 issued an out-of-band security release on November 18, 2026, fixing ten NGINX vulnerabilities in NGINX Open Source and NGINX Plus. Five of these flaws, referred to by Xint as NGINX2Root, are critical remote code execution issues affecting HTTP/2, HTTP/3, the resolver, and the mail proxy module. The most urgent, CVE-2026-123007, is an unauthenticated HTTP/2 flaw that requires only HTTP/2 over TLS to be enabled and has a public proof of concept.\u003c/p\u003e\n\n\u003cp\u003eThe public exploit for CVE-2026-123007 was demonstrated against NGINX 1.31.8, but Rapid7 describes it as constrained because it requires substantial HTTP/2 traffic, heap-address recovery, and a specific x86-64 glibc memory-copy routine. The article reported no evidence that the five critical flaws had been exploited as zero-days or by threat actors as of November 18. Organizations should upgrade NGINX Open Source to 1.30.7 or 1.31.9, or move NGINX Plus to the applicable fixed 37.x releases, and restart NGINX because a configuration reload does not replace the running executable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5’s November 18 out-of-band release fixed five critical NGINX remote code execution vulnerabilities and five additional NGINX flaws.","CVE-2026-123007 is an unauthenticated NGINX HTTP/2 remote code execution flaw that requires HTTP/2 over TLS to be enabled, and a public proof of concept is available.","The five critical NGINX2Root vulnerabilities affect NGINX HTTP/2, HTTP/3, the resolver, and the mail proxy module, depending on which features are enabled.","NGINX Open Source users should upgrade to 1.30.7 or 1.31.9, while NGINX Plus users should move to applicable fixed 37.x releases and restart NGINX after upgrading.","As of November 18, the article reported no evidence that the five NGINX vulnerabilities had been exploited as zero-days or by threat actors."],"insights":["Disabling HTTP/2 only mitigates the two HTTP/2 flaws and does not protect against the resolver, HTTP/3, or mail proxy vulnerabilities.","A configuration reload is insufficient after upgrading NGINX because it does not replace the running executable; NGINX must be restarted.","NGINX Plus R33 through R36 have no patch available, so affected customers must move to a fixed 37.x release.","The public CVE-2026-123007 exploit is constrained by its need for roughly 128 GB of HTTP/2 traffic, recovery of heap addresses to overcome address randomization, and an x86-64-specific glibc memory-copy routine."],"referencedReports":[{"title":"NGINX2Root: Remote Code Execution","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"Xint (Theori)","context":"The article relies on Xint’s disclosure and research describing the five NGINX flaws and the separate unpatched Linux kernel escalation issue.","category":"research","primary":true},{"title":"F5 Out-of-Band Security Notification K000164058","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"F5","context":"The article cites F5’s out-of-band security notification for the November 18 fixes affecting NGINX Open Source and NGINX Plus.","category":"advisory","primary":true},{"title":"CVE-2026-123007 Critical NGINX HTTP/2 Integer Underflow Leads to RCE, Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"Rapid7","context":"The article states that Rapid7 published a technical analysis of CVE-2026-123007 and released a public proof of concept.","category":"research","primary":false},{"title":"NGINX HTTP/2 RCE Vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"Wiz","context":"The article references Wiz research confirming code execution against an NGINX server serving only static content.","category":"research","primary":false},{"title":"NGINX2root FAQ","url":"https://watchtowr.com/intelligence/nginx-nginx2root-cve-2026-123633-faq/","publisher":"watchTowr","context":"The article includes watchTowr’s NGINX2root FAQ as additional information about the vulnerabilities.","category":"research","primary":false}],"body":"\u003cp\u003eF5 issued an out-of-band security release on November 18, 2026, fixing ten NGINX vulnerabilities in NGINX Open Source and NGINX Plus. Five of these flaws, referred to by Xint as NGINX2Root, are critical remote code execution issues affecting HTTP/2, HTTP/3, the resolver, and the mail proxy module. The most urgent, CVE-2026-123007, is an unauthenticated HTTP/2 flaw that requires only HTTP/2 over TLS to be enabled and has a public proof of concept.\u003c/p\u003e\n\n\u003cp\u003eThe public exploit for CVE-2026-123007 was demonstrated against NGINX 1.31.8, but Rapid7 describes it as constrained because it requires substantial HTTP/2 traffic, heap-address recovery, and a specific x86-64 glibc memory-copy routine. The article reported no evidence that the five critical flaws had been exploited as zero-days or by threat actors as of November 18. Organizations should upgrade NGINX Open Source to 1.30.7 or 1.31.9, or move NGINX Plus to the applicable fixed 37.x releases, and restart NGINX because a configuration reload does not replace the running executable.\u003c/p\u003e\n"},{"n":19,"title":"Critical VMware vCenter Flaw (CVSS 9.8) Lets Network Attackers Bypass Authentication","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-vmware-vcenter-flaw-cvss-98.html","time":"15:11","priority":"MUST READ","score":93,"tldr":"Broadcom has issued emergency patches for CVE-2026-123890, a CVSS 9.8 VMware vCenter Directory Service authentication-bypass flaw that network attackers could use to gain unauthorized access. Organizations using vCenter 8.0, 9.0, 9.1, or affected VMware Cloud Foundation deployments should update immediately, as no vendor workaround is available.","briefOverview":"\u003cp\u003eBroadcom has released fixes for CVE-2026-123890, a critical VMware vCenter authentication-bypass flaw in the VMware Directory Service with a CVSS score of 9.8. An attacker with network access could bypass authentication and gain unauthorized access to vCenter, which organizations use to manage ESX hosts and virtual machines. Broadcom says the issue qualifies as an emergency change under ITIL methodologies and advises organizations to consult security staff immediately on patch timing.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects vCenter 8.0, 9.0, and 9.1, including builds bundled with VMware Cloud Foundation, vSphere Foundation, Telco Cloud Platform, and Telco Cloud Infrastructure. Broadcom lists no workaround, and unsupported vSphere 6.5 and 6.7 systems should be presumed affected; vSphere 7.0 customers may request a patch through extended support. The updates are cumulative and cannot be installed through vCenter Quick Patch, but virtual machines continue running during installation while vCenter management access is briefly unavailable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Broadcom released fixes for CVE-2026-123890, a CVSS 9.8 authentication-bypass flaw in VMware vCenter's Directory Service that can be exploited by an attacker with network access.","The flaw affects VMware vCenter 8.0, 9.0, and 9.1, including vCenter builds supplied with VMware Cloud Foundation, vSphere Foundation, Telco Cloud Platform, and Telco Cloud Infrastructure.","Broadcom lists no workaround for the issue and says the updates cannot be installed using vCenter Quick Patch.","Broadcom has not reported active exploitation or public exploit code for CVE-2026-123890, and Mandiant reported the vulnerability.","The advisory also addresses four lower-severity issues in SDDC Manager and VMware Tools for Windows, including SQL injection, command injection, root privilege escalation, and a SAML token signature bypass."],"insights":["The update can be installed while virtual machines remain running, although vCenter management access is briefly unavailable and certain encryption operations using a Standard Key Provider pause until vCenter returns online.","Organizations already planning to move to VMware Cloud Foundation 9.1.1 should account for a documented upgrade conflict: vCenter 8.0 U3m or 9.0.2.0200 prevents a later upgrade to VCF 9.1.1.","Although the flaw is critical, Broadcom says it does not enable code execution on an ESX host from within a virtual machine, and ESX itself is not affected.","The new issue is the second critical VMware Directory Service authentication flaw disclosed that year, and attacks against a separate July directory-traversal flaw began five days after disclosure.","Unsupported vSphere 6.5 and 6.7 deployments should be presumed affected, while vSphere 7.0 customers need an extended-support contract to request a patch."],"referencedReports":[{"title":"VMSA-2026-0009 Advisory FAQ","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md","publisher":"Broadcom","context":"The article cites this advisory FAQ for details on affected products, the lack of a workaround, ESX impact, and update behavior.","category":"advisory","primary":true},{"title":"July VMware Security Advisory","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017","publisher":"Broadcom","context":"The article references this July advisory for the earlier critical VMware Directory Service authentication-bypass flaw, CVE-2026-59309.","category":"advisory","primary":false}],"body":"\u003cp\u003eBroadcom has released fixes for CVE-2026-123890, a critical VMware vCenter authentication-bypass flaw in the VMware Directory Service with a CVSS score of 9.8. An attacker with network access could bypass authentication and gain unauthorized access to vCenter, which organizations use to manage ESX hosts and virtual machines. Broadcom says the issue qualifies as an emergency change under ITIL methodologies and advises organizations to consult security staff immediately on patch timing.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects vCenter 8.0, 9.0, and 9.1, including builds bundled with VMware Cloud Foundation, vSphere Foundation, Telco Cloud Platform, and Telco Cloud Infrastructure. Broadcom lists no workaround, and unsupported vSphere 6.5 and 6.7 systems should be presumed affected; vSphere 7.0 customers may request a patch through extended support. The updates are cumulative and cannot be installed through vCenter Quick Patch, but virtual machines continue running during installation while vCenter management access is briefly unavailable.\u003c/p\u003e\n"},{"n":26,"title":"Everything Is a Web Application, Including Your Firewall","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/everything-is-web-application-including.html","time":"11:52","priority":"MUST READ","score":93,"tldr":"The PHP2Shell flaws show that internet-exposed firewall and appliance management interfaces are high-risk web applications: attackers can pre-profile identical firmware builds and chain exploits despite mitigations such as ASLR. Organizations should identify these interfaces, patch affected PHP/PAN-OS systems, and restrict management access to trusted internal networks.","briefOverview":"\u003cp\u003eAttackers exploited the unauthenticated PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, against internet-exposed PAN-OS management interfaces. Palo Alto Networks confirmed the activity on October 28 after details of the flaws leaked ahead of coordinated disclosure and PHP issued an emergency patch. The incident highlights that firewalls and other network appliances often expose web applications that control critical systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaws require skill and target-specific knowledge to exploit reliably, but appliances make that work more practical because identical software versions run across many devices. Investigators found that the attacker obtained and decrypted PAN-OS firmware, extracted PHP libraries, and built memory profiles for nine versions. The attacker then chained PHP2Shell with the Fragnesia Linux kernel flaw, CVE-2026-46300, to obtain root access on 25 systems, including 24 firewalls and one management server in the United States, Japan, Taiwan, and South Korea.\u003c/p\u003e\n\n\u003cp\u003ePHP2Shell uses crafted multipart uploads that exhaust PHP memory while a request is being parsed, before application code executes. Deeply nested empty file fields can consume far more memory than the request size suggests, allowing a request below PHP\u0026rsquo;s default 8 MB upload limit to exhaust its default 128 MB memory limit. Protections such as ASLR made exploitation harder, and nginx buffering disrupted some public exploit chains, but Palo Alto advised removing internet access from management interfaces and restricting them to trusted internal IP addresses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited the unauthenticated PHP flaws CVE-2026-109618 and CVE-2026-109619 against internet-exposed PAN-OS management interfaces.","The attackers obtained and decrypted PAN-OS firmware, extracted PHP libraries, created memory profiles for nine versions, and chained PHP2Shell with CVE-2026-46300 to gain root access on 25 systems.","PHP2Shell uses crafted multipart uploads to exhaust PHP memory during request parsing, leaving uninitialized memory or a pointer to memory that has already been freed.","Public exploit attempts were often unreliable because protections such as address space layout randomization made exploitation more difficult, though appliance software versions can be studied in advance.","Palo Alto Networks advised removing internet access from management interfaces and limiting access to trusted internal IP addresses."],"insights":["Appliance software can be a softer target even when protections such as address space layout randomization are enabled, because attackers can obtain identical firmware and calculate version-specific memory details in advance.","A PHP2Shell request can be much smaller than PHP's default 8 MB upload-size limit while still exhausting its 128 MB memory limit by using deeply nested empty file fields.","An nginx proxy in front of PAN-OS buffered chunked request bodies and disrupted public PHP2Shell exploit chains, illustrating that intermediary systems can alter exploit behavior unexpectedly.","A high volume of PHP2Shell attempts in logs did not reliably indicate that a server was vulnerable, because many public proof-of-concept exploits did not work against all targets."],"referencedReports":[{"title":"PHP2Shell Vulnerabilities","url":"https://www.vulncheck.com/blog/php2shell-vulnerabilities","publisher":"vulncheck","context":"The article cites VulnCheck's exploit research showing that a memory leak could be chained with the flaws to achieve code execution despite ASLR.","category":"research","primary":false},{"title":"Chained PHP2Shell Exploit Roots 25 Servers","url":"https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers","publisher":"dream","context":"The article references Dream's investigation into attackers chaining PHP2Shell with CVE-2026-46300 to obtain root access on 25 systems.","category":"research","primary":false},{"title":"PHP2Shell: Critical Vulnerabilities in PHP","url":"https://securitylabs.datadoghq.com/articles/php2shell-critical-vulnerabilities-in-php/","publisher":"datadog-security-labs","context":"The article cites Datadog Security Labs' technical explanation of how crafted multipart uploads can exhaust PHP memory during request parsing.","category":"research","primary":false},{"title":"CVE-2026-109618 and CVE-2026-109619","url":"https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/","publisher":"palo-alto-networks-unit-42","context":"The article references Unit 42's analysis of the uninitialized-memory and use-after-free conditions left after PHP aborts request processing.","category":"research","primary":false},{"title":"How Exploitable Is PHP2Shell?","url":"https://www.intruder.io/research/how-exploitable-is-php2shell","publisher":"intruder","context":"The article cites Intruder's research finding that nginx buffering of chunked request bodies disrupted public exploit chains against PAN-OS.","category":"research","primary":false},{"title":"CVE-2026-109618","url":"https://security.paloaltonetworks.com/CVE-2026-109618","publisher":"palo-alto-networks","context":"The article references Palo Alto Networks' advisory, which raised the issue's severity to Critical and assigned the highest urgency.","category":"advisory","primary":false},{"title":"PHP2Shell","url":"https://www.praetorian.com/blog/php2shell/","publisher":"praetorian","context":"The article cites Praetorian's technical assessment that many public proofs of concept did not work reliably.","category":"research","primary":false},{"title":"PHP2Shell","url":"https://sansec.io/research/php2shell","publisher":"sansec","context":"The article references Sansec's research noting that disabling session upload progress alone was not a sufficient workaround.","category":"research","primary":false}],"body":"\u003cp\u003eAttackers exploited the unauthenticated PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, against internet-exposed PAN-OS management interfaces. Palo Alto Networks confirmed the activity on October 28 after details of the flaws leaked ahead of coordinated disclosure and PHP issued an emergency patch. The incident highlights that firewalls and other network appliances often expose web applications that control critical systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaws require skill and target-specific knowledge to exploit reliably, but appliances make that work more practical because identical software versions run across many devices. Investigators found that the attacker obtained and decrypted PAN-OS firmware, extracted PHP libraries, and built memory profiles for nine versions. The attacker then chained PHP2Shell with the Fragnesia Linux kernel flaw, CVE-2026-46300, to obtain root access on 25 systems, including 24 firewalls and one management server in the United States, Japan, Taiwan, and South Korea.\u003c/p\u003e\n\n\u003cp\u003ePHP2Shell uses crafted multipart uploads that exhaust PHP memory while a request is being parsed, before application code executes. Deeply nested empty file fields can consume far more memory than the request size suggests, allowing a request below PHP\u0026rsquo;s default 8 MB upload limit to exhaust its default 128 MB memory limit. Protections such as ASLR made exploitation harder, and nginx buffering disrupted some public exploit chains, but Palo Alto advised removing internet access from management interfaces and restricting them to trusted internal IP addresses.\u003c/p\u003e\n"},{"n":42,"title":"Attackers Exploit Optimizely Flaw To Inject Malicious JavaScript","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/attackers-exploit-optimizely-flaw-inject-malicious-javascript","time":"00:45","priority":"MUST READ","score":93,"tldr":"Attackers abused a flaw in Optimizely Web Experimentation’s signup flow to inject malicious JavaScript into customer snippets, potentially exposing visitors across hundreds of sites to crypto-wallet replacement, payment-card skimming, cookie theft, and iOS exploit delivery. Organizations should urgently audit Optimizely Project JavaScript, rotate affected credentials and tokens, and restrict third-party scripts with CSP and monitoring.","briefOverview":"\u003cp\u003eOn November 16, 2026, an attacker exploited a vulnerability in Optimizely Web Experimentation’s account signup flow that allowed unauthorized modification of the Project JavaScript field in customer projects. Because this field runs custom code on pages loading an Optimizely snippet, the attacker injected malicious JavaScript that was delivered to visitors through legitimate Optimizely snippets, including CDN-hosted copies. Optimizely said it blocked the vulnerable route, deployed a fix, removed injected code, ended active sessions, revoked tokens, reset affected access, and notified customers. ThreatLabz identified more than 450 unique domains and more than 3,000 URLs serving the malicious script across industries including banking, e-commerce, travel, retail, media, and technology.\u003c/p\u003e\n\n\u003cp\u003eIn most affected snippets, an injected loader fetched a second-stage payload called track.js from attacker-controlled infrastructure, including 1688360[.]cc. The payload monitored for cryptocurrency wallet addresses and attempted to replace them with attacker-controlled addresses; after a visible replacement, it could collect a screenshot, the page URL, accessible cookies, and related metadata. Later versions also monitored page inputs, form submissions, keyboard activity, and web requests for payment-card details, although they could not read data entered in secure cross-origin payment frames. On iPhones and iPads, the code attempted to load the Coruna and DarkSword exploit kits and, for selected operating-system versions, could add a hidden iframe for a further delivery path.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that most observed script behavior remained within the affected website’s browser page, rather than providing direct access to unrelated sites, tabs, local files, or browser-wide activity. It recommends that organizations audit Optimizely Project JavaScript and administrative activity, rotate credentials and tokens, enforce multi-factor authentication, verify approved snippet versions, and use Content Security Policy controls and third-party script monitoring. Visitors to affected sites are advised to review banking and cryptocurrency activity, update iOS and iPadOS, and change reused passwords for potentially affected accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On November 16, 2026, an attacker exploited a flaw in Optimizely Web Experimentation’s account signup flow to gain unauthorized ability to modify the Project JavaScript field in customer projects.","The injected code was delivered through legitimate Optimizely snippets and could load a second-stage script, track.js, from attacker-controlled infrastructure including 1688360[.]cc.","The payload could replace cryptocurrency wallet addresses, collect cookies and page screenshots after a visible wallet replacement, and later versions attempted to collect payment-card details entered on affected websites.","For iPhone and iPad visitors, the payload attempted to load the Coruna and DarkSword exploit kits and sometimes inserted a hidden iframe for selected iOS and iPadOS versions.","ThreatLabz identified more than 450 unique domains and more than 3,000 URLs serving the malicious script, spanning industries such as banking, e-commerce, travel, media, retail, and technology."],"insights":["The malicious code was delivered through Optimizely’s normal snippet delivery paths, including its CDN, meaning affected websites could serve it from infrastructure they already trusted.","The script only captured screenshots and sent cookies after it had replaced a valid cryptocurrency wallet address in a visible page element, tying this data collection to apparent wallet-replacement activity.","The payment-card collection capability could monitor fields and requests on the compromised page, but it could not read payment details entered in secure payment fields hosted in separate cross-origin frames such as Stripe or Adyen fields.","Most of the observed behavior was limited to the affected website’s browser page and could not directly access unrelated tabs, other sites’ cookies, local files, or browser-wide activity unless an iOS or iPadOS exploit chain succeeded.","Optimizely reported that it blocked the vulnerable path, removed injected code, ended active sessions, revoked tokens, reset affected account access, and notified impacted customers."],"referencedReports":[],"body":"\u003cp\u003eOn November 16, 2026, an attacker exploited a vulnerability in Optimizely Web Experimentation’s account signup flow that allowed unauthorized modification of the Project JavaScript field in customer projects. Because this field runs custom code on pages loading an Optimizely snippet, the attacker injected malicious JavaScript that was delivered to visitors through legitimate Optimizely snippets, including CDN-hosted copies. Optimizely said it blocked the vulnerable route, deployed a fix, removed injected code, ended active sessions, revoked tokens, reset affected access, and notified customers. ThreatLabz identified more than 450 unique domains and more than 3,000 URLs serving the malicious script across industries including banking, e-commerce, travel, retail, media, and technology.\u003c/p\u003e\n\n\u003cp\u003eIn most affected snippets, an injected loader fetched a second-stage payload called track.js from attacker-controlled infrastructure, including 1688360[.]cc. The payload monitored for cryptocurrency wallet addresses and attempted to replace them with attacker-controlled addresses; after a visible replacement, it could collect a screenshot, the page URL, accessible cookies, and related metadata. Later versions also monitored page inputs, form submissions, keyboard activity, and web requests for payment-card details, although they could not read data entered in secure cross-origin payment frames. On iPhones and iPads, the code attempted to load the Coruna and DarkSword exploit kits and, for selected operating-system versions, could add a hidden iframe for a further delivery path.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that most observed script behavior remained within the affected website’s browser page, rather than providing direct access to unrelated sites, tabs, local files, or browser-wide activity. It recommends that o
