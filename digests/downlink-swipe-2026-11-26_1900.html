iscounted ongoing usage, although OpenAI says both models remain more usage-efficient than GPT-6 Astra and GPT-6.1 Sol.\u003c/p\u003e\n"},{"n":2,"title":"ThreatsDay: 10M NGINX Services at Risk, 250+ Malicious Extensions, AI Server Hijacking + 17 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/threatsday-250-rogue-extensions-10m.html","time":"19:39","priority":"MAY READ","score":40,"tldr":"This week’s threat roundup highlights how ordinary weaknesses—stolen credentials, exposed AI services, unmonitored infrastructure software, and misconfigured applications—are enabling major compromises. Notable developments include 10 million potentially vulnerable NGINX services, more than 250 malicious browser extensions, rising ransomware activity, and AI infrastructure abuse.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers a range of November 2026 security developments, with many incidents stemming from stolen credentials, internet-exposed services, and unsafe configurations rather than novel technical exploits. Todoist said an attacker used a stolen version-control credential to access production systems and retrieve some customer information affecting 6% of users. Censys reported that more than 10 million exposed NGINX services run affected HTTP/2 versions associated with NGINX2Root flaws, while Rapid7 identified thousands of accessible AI and notebook servers that could be misused without authentication.\u003c/p\u003e\n\n\u003cp\u003eThe report also highlights threats that can evade ordinary checks. Microsoft documented more than 250 browser extensions whose data collection, advertising injection, and shopping-link changes were activated when installations came through paid search advertisements, and a WordPress malware campaign served harmful JavaScript only to logged-out visitors. Ransomware activity rose 23% in October 2026 to 1,049 claimed incidents, with attacks affecting critical services such as hospitals and universities; one group’s activity reportedly led to ambulance diversions, clinic closures, and campus-wide device shutdowns. Other cases involved malicious Minecraft mods, phishing pages hosted through AI website-building services, compromised online shops, and attackers abusing power-management or banking middleware to run commands and access sensitive systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Todoist said an attacker used a stolen version-control credential to access production systems, obtain additional credentials, and retrieve customer information affecting 6% of its users.","Microsoft documented more than 250 browser extensions that behaved normally unless installed through paid search advertisements, which activated browsing-data collection, ad injection, and shopping-link changes.","Rapid7 found thousands of internet-facing AI and notebook service hosts without authentication, including exposed Ollama servers that could let others use an owner’s paid AI subscription.","Censys reported that more than 10 million exposed NGINX services running affected HTTP/2 versions could be vulnerable to NGINX2Root flaws under specific feature configurations.","NCC Group reported 1,049 claimed ransomware incidents in October 2026, a 23% increase from September."],"insights":["Some malicious browser extensions activated harmful behavior only when users arrived through paid search ads, meaning an extension could appear legitimate during ordinary testing or review.","Rapid7 found that more than half of exposed Ollama servers had already been accessed by someone other than their owner, and 79% listed at least one cloud model that could use the owner’s paid subscription.","A WordPress malware campaign deliberately stayed inactive for logged-in users while serving arbitrary JavaScript to anonymous visitors, making a compromised site appear normal to its administrators.","An attacker used CyberPower PowerPanel Business event scripts to run commands as the highest-privileged Windows account, extract Active Directory secrets, and establish a persistent implant.","Ransomware activity became more fragmented in Q3 2026: the ten most active groups accounted for 49% of victims, down from 71% in Q1."],"referencedReports":[{"title":"SleeperWidget: How Ad-Driven Installs Activate Hidden Browser Extension Behavior","url":"https://microsoftedge.github.io/edgevr/posts/SleeperWidget-How-Ad-Driven-Installs-Activate-Hidden-Browser-Extension-Behavior/","publisher":"microsoft-edge-extensions-security-team","context":"The article cites Microsoft's documentation of SleeperWidget extensions whose harmful behavior activates after installation through paid-search advertisements.","category":"research","primary":true},{"title":"Internet-Exposed Hosts Could Become Targets for AI Abuse","url":"https://www.rapid7.com/blog/post/tr-self-hosted-ai-renting-compute-exposed-servers/","publisher":"rapid7","context":"The article relies on Rapid7's analysis of 20,354 internet-facing hosts running accessible AI services or notebook APIs.","category":"research","primary":true},{"title":"Fake Minecraft Mod Uses the Polygon Blockchain to Deliver a Python Infostealer","url":"https://www.sonicwall.com/blog/fake-minecraft-mod-uses-the-polygon-blockchain-to-deliver-a-python-infostealer","publisher":"sonicwall-capture-labs","context":"The article references SonicWall's technical analysis of a SilentNet loader masquerading as a Minecraft mod.","category":"research","primary":true},{"title":"Hugging Face AI Used to Host Phishing Pages","url":"https://www.aikido.dev/blog/hugging-face-phishing-pages","publisher":"aikido","context":"The article cites Aikido's research identifying phishing pages on Hugging Face Spaces, including pages created with DeepSite.","category":"research","primary":true},{"title":"Credential Harvesting","url":"https://www.vulncheck.com/blog/credential-harvesting","publisher":"vulncheck","context":"The article references VulnCheck's honeypot-based analysis of credential-harvesting attempts across exploited CVEs.","category":"research","primary":true},{"title":"October 2026 Cyber Threat Intelligence Report","url":"https://insights.nccgroup.com/l/898251/2026-11-19/31p6lv6/898251/1795085578SO8oe8pJ/October_2026_Cyber_Threat_Intelligence_Report.pdf","publisher":"ncc-group","context":"The article cites this report for the 23% month-over-month increase in claimed ransomware incidents during October 2026.","category":"research","primary":true},{"title":"The State of Ransomware Q3 2026","url":"https://research.checkpoint.com/2026/the-state-of-ransomware-q3-2026/","publisher":"check-point-research","context":"The article uses Check Point Research's report for Q3 2026 ransomware victim and group activity statistics.","category":"research","primary":true},{"title":"CartJacked: One in 195 Online Shops We Scanned Was Hijacked","url":"https://guard.io/labs/cartjacked---one-in-195-online-shops-we-scanned-was-hijacked","publisher":"guardio-labs","context":"The article cites Guardio Labs' analysis estimating that about 12,200 online stores were hijacked in October 2026.","category":"research","primary":true},{"title":"NGINX2Root Advisory","url":"https://censys.com/advisory/nginx2root/","publisher":"censys","context":"The article references Censys' advisory that more than 10 million exposed NGINX services may be affected by the NGINX2Root flaws.","category":"advisory","primary":true},{"title":"Power Management Software Attack Vector","url":"https://www.security.com/threat-intelligence/power-management-software-attack-vector","publisher":"symantec","context":"The article cites Symantec's technical account of an intrusion that abused CyberPower PowerPanel Business event-script functionality.","category":"research","primary":true},{"title":"BankWeaver Campaign Abuses Digital Banking Middleware to Deploy Web Shells","url":"https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-ban
