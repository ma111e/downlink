<script type="application/json" id="dl-articles">[{"n":2,"title":"AI Security Report 2026","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/ai-security-report-2026/","time":"00:51","priority":"SHOULD READ","score":80,"tldr":"Check Point Research’s AI Security Report 2026 warns that AI has evolved from helping attackers prepare campaigns to actively operating live intrusions, building malware, scaling phishing/vishing, and enabling convincing identity fraud. The report also highlights growing enterprise risks from prompt injection and sensitive data leakage through GenAI tools.","briefOverview":"\u003cp\u003eCheck Point Research’s Annual AI Security Report 2026 describes a shift in which AI has moved from helping attackers prepare operations to performing hands-on work inside live intrusions. The article says AI has been observed in activity ranging from China-nexus espionage campaigns to a criminal breach of multiple Mexican government agencies. It states that this use has spread from nation states to ordinary cyber criminals.\u003c/p\u003e\n\n\u003cp\u003eThe report says AI can now build deployment-ready malware and attack suites, including VoidLink, an 88,000-line command-and-control offensive framework reportedly produced in under a week using an AI environment. It also says attackers often prefer jailbroken commercial models and increasingly abuse agentic architecture through planted configuration files that agents load and trust across sessions. The article describes a matured AI-enabled criminal tooling market, including phishing-as-a-service kits with built-in language models and conversational AI voice-agent services used for vishing and one-time-passcode theft.\u003c/p\u003e\n\n\u003cp\u003eThe article says virtual identity is no longer a reliable trust anchor because voice, face, documents, and live video are now cheap to forge convincingly. It also highlights AI as an expanding attack surface, citing models’ difficulty separating data from instructions, ordinary software vulnerabilities in the surrounding stack, and supply-chain risk. Enterprise data leakage through GenAI is described as persistent and growing, with high-risk prompts doubling from 2% to 4% over the last year and Business Services recording the highest rate at 5.91%.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research’s Annual AI Security Report 2026 says AI has moved from being an assistant that helps attackers prepare to an operator that performs hands-on work inside live intrusions.","The report says AI has been used in live intrusions ranging from China-nexus espionage campaigns to a criminal breach of multiple Mexican government agencies.","The report says AI can build deployment-ready malware and attack suites, citing VoidLink, an 88,000-line command-and-control offensive framework produced in under a week using an AI environment.","The report says attackers often favor jailbroken mainstream commercial models and increasingly abuse agentic architecture through planted configuration files that agents load and trust across sessions.","The report says enterprise data leakage through GenAI is a persistent and growing risk, with high-risk prompts doubling from 2% to 4% during the last year."],"insights":["The report highlights a shift in bypass tactics from one-off jailbreak prompts to planted configuration files that AI agents load and trust across sessions, making the abuse more durable.","AI involvement may be hard to detect from the final tool itself, as shown by the VoidLink example where an 88,000-line offensive framework was produced in under a week using an AI environment.","The rise in longer malicious prompt payloads, which increased roughly fivefold between March and May 2026 and approached 1% of observed prompts in May, suggests content-borne and agent-based attacks are becoming more operationally relevant.","Business Services had the highest measured rate of risky GenAI use, with 5.91% of prompts carrying significant sensitive-data exposure risk, showing that AI data leakage is concentrated unevenly across sectors.","The report connects fake voice, face, document, and live video capabilities into a single trust problem, saying virtual identity can no longer be treated as a reliable anchor."],"referencedReports":[],"body":"\u003cp\u003eCheck Point Research’s Annual AI Security Report 2026 describes a shift in which AI has moved from helping attackers prepare operations to performing hands-on work inside live intrusions. The article says AI has been observed in activity ranging from China-nexus espionage campaigns to a criminal breach of multiple Mexican government agencies. It states that this use has spread from nation states to ordinary cyber criminals.\u003c/p\u003e\n\n\u003cp\u003eThe report says AI can now build deployment-ready malware and attack suites, including VoidLink, an 88,000-line command-and-control offensive framework reportedly produced in under a week using an AI environment. It also says attackers often prefer jailbroken commercial models and increasingly abuse agentic architecture through planted configuration files that agents load and trust across sessions. The article describes a matured AI-enabled criminal tooling market, including phishing-as-a-service kits with built-in language models and conversational AI voice-agent services used for vishing and one-time-passcode theft.\u003c/p\u003e\n\n\u003cp\u003eThe article says virtual identity is no longer a reliable trust anchor because voice, face, documents, and live video are now cheap to forge convincingly. It also highlights AI as an expanding attack surface, citing models’ difficulty separating data from instructions, ordinary software vulnerabilities in the surrounding stack, and supply-chain risk. Enterprise data leakage through GenAI is described as persistent and growing, with high-risk prompts doubling from 2% to 4% over the last year and Business Services recording the highest rate at 5.91%.\u003c/p\u003e\n"},{"n":1,"title":"How Aikido Intel detects malware and vulnerabilities first","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-intel-detects-malware-vulnerabilities-first","time":"22:12","priority":"MAY READ","score":45,"tldr":"Aikido Intel is a real-time supply-chain intelligence feed that monitors open-source package ecosystems to detect both malicious packages and undisclosed vulnerabilities within minutes. Its pipeline combines deobfuscation, static and sandbox analysis, AI review, and human researcher validation to reduce false positives and catch novel attacks quickly.","briefOverview":"\u003cp\u003eAikido Intel is described as a real-time supply chain intelligence feed that tracks both malware and undisclosed vulnerabilities across open-source ecosystems. It monitors more than four million packages and analyzes new releases as they go live, with the goal of catching harmful package versions within minutes. The article says Aikido Intel analyzed around 7.5 million package versions in the second quarter of 2026 and confirmed 19,500 malicious packages.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that open-source software users are affected because attackers can distribute malware through dependencies, while registry maintainers and CVE databases may not catch or document these issues quickly. Aikido says its researchers were among the first to surface major npm supply chain campaigns including the s1ngularity Nx attack and the Shai-Hulud worm. It also says Intel protects Packagist by allowing Composer downloads to be checked against Aikido’s malware database and blocked when a package is flagged as malicious.\u003c/p\u003e\n\n\u003cp\u003eTechnically, Aikido Intel pulls in new package versions, extracts and deobfuscates their contents, then applies static rules and, for npm, sandbox analysis to observe behavior. Harder cases are reviewed by an AI layer that follows signals across files, and cases that cannot be cleanly ruled safe are reviewed by human security researchers before publication. The article recommends delaying adoption of brand-new releases by a day or two and mentions Aikido Safe Chain as a tool that blocks confirmed malicious npm packages or packages less than 24 hours old.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido Intel is a real-time open feed that tracks both malware and undisclosed vulnerabilities across open-source ecosystems.","In the second quarter of 2026, Aikido Intel analyzed around 7.5 million package versions and confirmed 19,500 malicious packages.","Aikido Intel monitors new package releases, extracts and deobfuscates package contents, applies static rules and npm sandbox analysis, and uses AI plus human review for harder cases.","Aikido’s researchers were among the first to report major npm supply chain campaigns including the s1ngularity Nx attack and the Shai-Hulud worm.","Aikido recommends waiting a day or two before adopting brand-new package releases and using Aikido Safe Chain to block confirmed malware or npm packages less than 24 hours old."],"insights":["Aikido argues that delaying adoption of a brand-new package release by one or two days can be more protective than trying to react faster to every malicious package after publication.","The article says many malicious packages cause damage during installation, making the short period between publication and detection the most important exposure window.","Aikido Intel’s workflow is designed to publish clear-cut detections quickly while reserving human review for ambiguous cases, which the article presents as the way it balances speed with accuracy.","The article says Aikido Intel has detected attacker testing activity before a broader campaign launched, showing that package monitoring can sometimes provide warning before real-world spread begins.","Aikido’s protection of Packagist means Composer downloads from the PHP registry can be blocked when Intel has already flagged a package as malicious."],"referencedReports":[{"title":"2026 AppSec report","url":"https://pulse.latio.tech/p/the-2026-latio-application-security","publisher":"Latio","context":"The article says the independent analyst Latio named Aikido a platform leader in its 2026 AppSec report and highlighted Intel’s work surfacing open-source vulnerabilities before public databases.","category":"","primary":false}],"body":"\u003cp\u003eAikido Intel is described as a real-time supply chain intelligence feed that tracks both malware and undisclosed vulnerabilities across open-source ecosystems. It monitors more than four million packages and analyzes new releases as they go live, with the goal of catching harmful package versions within minutes. The article says Aikido Intel analyzed around 7.5 million package versions in the second quarter of 2026 and confirmed 19,500 malicious packages.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that open-source software users are affected because attackers can distribute malware through dependencies, while registry maintainers and CVE databases may not catch or document these issues quickly. Aikido says its researchers were among the first to surface major npm supply chain campaigns including the s1ngularity Nx attack and the Shai-Hulud worm. It also says Intel protects Packagist by allowing Composer downloads to be checked against Aikido’s malware database and blocked when a package is flagged as malicious.\u003c/p\u003e\n\n\u003cp\u003eTechnically, Aikido Intel pulls in new package versions, extracts and deobfuscates their contents, then applies static rules and, for npm, sandbox analysis to observe behavior. Harder cases are reviewed by an AI layer that follows signals across files, and cases that cannot be cleanly ruled safe are reviewed by human security researchers before publication. The article recommends delaying adoption of brand-new releases by a day or two and mentions Aikido Safe Chain as a tool that blocks confirmed malicious npm packages or packages less than 24 hours old.\u003c/p\u003e\n"}]</script>
