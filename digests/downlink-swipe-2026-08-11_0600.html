<script type="application/json" id="dl-articles">[{"n":1,"title":"US and South Korea warn of Gunra ransomware targeting govt agencies","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-warns-of-gunra-ransomware-attacks-against-government-critical-infrastructure/","time":"09:47","priority":"MUST READ","score":94,"tldr":"U.S. and South Korean agencies warned that Gunra ransomware is targeting government and critical infrastructure organizations worldwide, exploiting Fortinet flaws and exposed remote access to gain entry. Defenders are urged to patch internet-facing systems, segment networks, and keep offline backups as the group expands through a RaaS affiliate program.","briefOverview":"\u003cp\u003eU.S. federal agencies and South Korea\u0026rsquo;s National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks. The joint advisory says Gunra first emerged in April 2025 as a double-extortion ransomware variant derived from the leaked Conti ransomware source code. The group has targeted sectors including healthcare and public health, financial services, and government services.\u003c/p\u003e\n\n\u003cp\u003eThe advisory says Gunra actors have attacked Fortinet firewalls by exploiting two critical authentication vulnerabilities, CVE-2024-55591 and CVE-2025-24472, in FortiOS and FortiProxy software. The group also exploits credential-exposure and SSH access control flaws in internet-facing VPN gateways to gain remote access to victims\u0026rsquo; systems. Although its attacks first focused on Windows environments, Gunra moved to cross-platform campaigns after introducing a Linux variant in mid-2025.\u003c/p\u003e\n\n\u003cp\u003eSince January 2026, Gunra has launched a ransomware-as-a-service platform and begun recruiting initial access brokers to expand operations. The FBI observed the group using new branding aliases, including Golden Community, and attempting to contact victim company management directly by email to solicit ransom payments with limited success. U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and make offline backups of their data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. federal agencies and South Korea's National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks.","The joint advisory said Gunra first emerged in April 2025 as a double-extortion ransomware variant derived from leaked Conti ransomware source code.","Gunra actors have attacked Fortinet firewalls by exploiting CVE-2024-55591 and CVE-2025-24472 in FortiOS and FortiProxy software.","Since January 2026, Gunra has launched a ransomware-as-a-service affiliate program and recruited initial access brokers, penetration testers, and ethical hackers.","The U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and make offline backups of their data."],"insights":["Gunra’s shift from Windows-focused attacks to cross-platform campaigns after introducing a Linux variant means organizations cannot treat the threat as limited to Windows environments.","The advisory highlights internet-facing Fortinet devices and VPN gateways as priority exposure points because Gunra has used both Fortinet authentication flaws and credential-exposure or SSH access control weaknesses for initial access.","Gunra’s direct emails to victim company management had limited success, suggesting its extortion attempts have included pressure on executives beyond technical ransom notes.","Gunra’s use of the Golden Community alias shows the group is rebranding while expanding its ransomware-as-a-service operation, which may complicate tracking activity by name alone."],"referencedReports":[{"title":"Gunra Ransomware","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a","publisher":"CISA, FBI, and South Korea's National Police Agency","context":"The article is based on a joint advisory warning government and critical infrastructure organizations about Gunra ransomware activity and recommended defenses.","category":"advisory","primary":true},{"title":"Gunra Ransomware Advisory","url":"https://asec.ahnlab.com/en/94696/","publisher":"AhnLab and South Korean government agencies","context":"The article cites a separate AhnLab advisory, issued with South Korean government agencies, that preceded the U.S. and South Korean joint alert.","category":"advisory","primary":false},{"title":"Operation Double Barrel","url":"https://image.ahnlab.com/atip/content/file/20260730/%5BAhnLab%5DOperation%20Double%20Barrel%28ENG%29%282026.07.30%29.pdf","publisher":"AhnLab","context":"The article references this report as exposing links between the Gunra ransomware gang and Lazarus Group.","category":"research","primary":false}],"body":"\u003cp\u003eU.S. federal agencies and South Korea\u0026rsquo;s National Policy Agency warned government and critical infrastructure organizations worldwide to secure their systems against Gunra ransomware attacks. The joint advisory says Gunra first emerged in April 2025 as a double-extortion ransomware variant derived from the leaked Conti ransomware source code. The group has targeted sectors including healthcare and public health, financial services, and government services.\u003c/p\u003e\n\n\u003cp\u003eThe advisory says Gunra actors have attacked Fortinet firewalls by exploiting two critical authentication vulnerabilities, CVE-2024-55591 and CVE-2025-24472, in FortiOS and FortiProxy software. The group also exploits credential-exposure and SSH access control flaws in internet-facing VPN gateways to gain remote access to victims\u0026rsquo; systems. Although its attacks first focused on Windows environments, Gunra moved to cross-platform campaigns after introducing a Linux variant in mid-2025.\u003c/p\u003e\n\n\u003cp\u003eSince January 2026, Gunra has launched a ransomware-as-a-service platform and begun recruiting initial access brokers to expand operations. The FBI observed the group using new branding aliases, including Golden Community, and attempting to contact victim company management directly by email to solicit ransom payments with limited success. U.S. and South Korean agencies advised defenders to patch known exploited vulnerabilities in internet-facing systems, segment networks, and make offline backups of their data.\u003c/p\u003e\n"},{"n":2,"title":"Hackers Breach Polish Power Plant Controls via Private Cellular Network and Shut Turbine","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/hackers-breach-polish-power-plant.html","time":"06:55","priority":"MUST READ","score":93,"tldr":"Attackers breached a Polish heat and power plant through a misconfigured private cellular APN, pivoting from a compromised wind farm to industrial controllers and shutting down a turbine and water treatment system. CERT Polska says the incident shows private APNs must not be treated as trusted isolation and should use client isolation, segmentation, and hardened credentials.","briefOverview":"\u003cp\u003eAttackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment. The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity. CERT Polska disclosed the December 2025 incident on August 8 after an investigation lasting more than three months.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the route ran through a private APN that allowed arbitrary devices on the network to communicate with one another. The attacker pivoted from a compromised wind-farm network to a controller at the CHP plant, even though the wind farm and the plant were separate facilities and neither operated the network that linked them. CERT said this was, to the best of its knowledge, the first observed real-world cyberattack using a private APN to reach an industrial control network.\u003c/p\u003e\n\n\u003cp\u003eThe attack path involved a FortiGate device at the wind farm, a Teltonika RUTX50 router, and a WAGO PFC200 controller reachable through the APN with default admin credentials. On December 29, plant personnel said Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses. CERT said none of the destructive actions required malware and described no single software patch to apply, recommending APN client isolation, traffic segmentation, removal of unnecessary management services, and changed default credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment.","The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity.","CERT Polska said the attacker pivoted from a compromised wind-farm network to a controller at the CHP plant because the private APN allowed arbitrary devices on the network to communicate with one another.","The WAGO controller reachable through the APN still had default admin credentials, and CERT Polska recommended auditing private APN configurations, enabling client isolation, segmenting traffic, and changing default credentials.","According to plant personnel, Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses."],"insights":["CERT Polska said this was, to its knowledge, the first real-world cyberattack observed using a private APN as a route into an industrial control network.","The incident did not rely on malware or a confirmed software vulnerability; the destructive actions used supported device functions over the plant’s normal industrial protocols.","A security requirement for serial DNP3.0 communications was not enough because it did not cover how the cellular router’s separate management interface was administered.","CERT Polska found that Polish organizations using private APNs commonly allow any device on the network to reach any other device, and it believes similar configurations are widely deployed in other countries.","The plant initially treated the disruption as probable contractor error because maintenance was underway, and CERT opened an incident only because it already knew of similar events."],"referencedReports":[{"title":"Incident Follow-up Report: Energy Sector 2025","url":"https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/","publisher":"CERT Polska","context":"The article is based on CERT Polska's disclosure and investigation of the December 2025 Polish energy-sector incident.","category":"research","primary":true},{"title":"CERT Polska Energy Sector Incident Follow-up Report 2025","url":"https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf","publisher":"CERT Polska","context":"The article links to the report when describing the attack path through the wind farm, FortiGate device, Teltonika router, private APN, and CHP plant controllers.","category":"research","primary":true},{"title":"CISA ICS Advisory ICSA-23-131-08","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-23-131-08","publisher":"CISA","context":"The article cites CISA's 2023 Teltonika advisory when discussing published RUT-series vulnerabilities CVE-2023-32349 and CVE-2023-32350.","category":"advisory","primary":false},{"title":"Incident Report: Energy Sector 2025","url":"https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/","publisher":"CERT Polska","context":"The article references this as one of four January assessments of the wider December campaign, while noting it does not address this specific intrusion.","category":"research","primary":false},{"title":"DynoWiper Update: Technical Analysis and Attribution","url":"https://www.welivesecurity.com/en/eset-research/dynowiper-update-technical-analysis-attribution/","publisher":"ESET","context":"The article references ESET's technical analysis as one of the January assessments of the wider December campaign and the wiper malware used against other targets.","category":"research","primary":false},{"title":"Poland Power Grid Attack: ELECTRUM Targets Distributed Energy 2025","url":"https://www.dragos.com/blog/poland-power-grid-attack-electrum-targets-distributed-energy-2025","publisher":"Dragos","context":"The article references Dragos's analysis as one of the January assessments of the wider December campaign's broader shape.","category":"research","primary":false},{"title":"Malicious Cyber Actors Targeting Water and Wastewater Sector Internet-Facing Programmable Logic Controllers Causing Operational Disruptions","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/malicious-cyber-actors-targeting-water-and-wastewater-sector-internet--facing-programmable-logic-controllers-causing-operational-disruptions","publisher":"FBI and EPA","context":"The article cites this advisory because it lists a private APN as an isolated architecture option for reaching operational technology equipment over cellular links.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers shut down a steam turbine and the process-water treatment system at a Polish combined heat and power plant by entering through a private cellular network used by the local grid operator to reach remote equipment. The plant supplies heat to roughly 50,000 residents, but recovery began while the intruders were still active and customers lost neither heat nor electricity. CERT Polska disclosed the December 2025 incident on August 8 after an investigation lasting more than three months.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the route ran through a private APN that allowed arbitrary devices on the network to communicate with one another. The attacker pivoted from a compromised wind-farm network to a controller at the CHP plant, even though the wind farm and the plant were separate facilities and neither operated the network that linked them. CERT said this was, to the best of its knowledge, the first observed real-world cyberattack using a private APN to reach an industrial control network.\u003c/p\u003e\n\n\u003cp\u003eThe attack path involved a FortiGate device at the wind farm, a Teltonika RUTX50 router, and a WAGO PFC200 controller reachable through the APN with default admin credentials. On December 29, plant personnel said Siemens S7-300, S7-1200, and S7-1500 controllers were switched to STOP mode and password-protected, while Moxa serial device servers and switches were factory-reset, given changed passwords, and assigned unreachable IP addresses. CERT said none of the destructive actions required malware and described no single software patch to apply, recommending APN client isolation, traffic segmentation, removal of unnecessary management services, and changed default credentials.\u003c/p\u003e\n"}]</script>
