<script type="application/json" id="dl-articles">[{"n":1,"title":"Hermes AI agent used to automate attack on Thai Finance Ministry","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hermes-ai-agent-used-to-automate-attack-on-thai-finance-ministry/","time":"19:09","priority":"SHOULD READ","score":86,"tldr":"Attackers reportedly used the open-source Hermes AI agent in unattended “YOLO” mode to automate post-exploitation activity against Thailand’s Ministry of Finance, including privilege-escalation checks, service enumeration, and file system searches. Exposed attacker directories revealed tools, logs, credentials, web shells, and implants, though the ministry has not confirmed a breach.","briefOverview":"\u003cp\u003eA threat actor used the open-source Hermes AI agent in unattended “YOLO” mode to automate post-exploitation activity during an alleged breach of Thailand’s Ministry of Finance. Hunt.io and security researcher Bob Diachenko uncovered the activity after finding exposed web directories containing hundreds of files tied to the operation. The Ministry of Finance has not confirmed a breach, and some recovered artifacts only show that specific systems were targeted rather than successfully compromised.\u003c/p\u003e\n\n\u003cp\u003eThe exposed directories were found on a Hong Kong-hosted server between July 9 and July 13 and contained 585 files totaling about 470 MB. The files included exploit code, web shells, HTTP tunneling tools, custom scripts, stolen credentials, compiled payloads, and Hermes AI agent logs. They referenced Ministry of Finance systems by name, hostname, and internal IP address, and included scripts aimed at services such as Hadoop, Apache Ambari, GlassFish, and an administrative web panel.\u003c/p\u003e\n\n\u003cp\u003eRecovered Hermes logs showed the operator enabled YOLO mode, allowing the agent to execute commands without human approval at each step. The agent was used to look for privilege escalation paths, scan for kernel vulnerabilities, enumerate services, inspect containers, search SUID and SGID binaries, and traverse file systems. Hunt.io said the artifacts depicted an active intrusion with staged tools and expanding access, but researchers could not determine how the attackers initially gained access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hunt.io and researcher Bob Diachenko found exposed web directories containing hundreds of files tied to an alleged operation against Thailand’s Ministry of Finance.","The exposed files included exploit code, web shells, HTTP tunneling tools, custom scripts, stolen credentials, compiled payloads, and Hermes AI agent logs.","Recovered Hermes logs showed the operator enabled YOLO mode, allowing the AI agent to run commands without human approval at each step.","The Hermes agent was used for post-exploitation tasks including privilege-escalation checks, kernel vulnerability scanning, service enumeration, SUID and SGID binary searches, container inspection, and file system traversal.","Thailand’s Ministry of Finance has not confirmed a breach, and Hunt.io said some artifacts only showed that systems were targeted rather than successfully compromised."],"insights":["Hermes did not independently choose the target; the exposed logs showed a human operator supplied objectives and tools while YOLO mode removed repeated approval prompts for routine commands.","The exposed attacker infrastructure provided unusually broad visibility into the operation, including session files, deployed web shells, credentials, compiled payloads, and AI agent output logs.","Hunt.io linked additional attacker-controlled servers using shared TLS certificate characteristics, including a JA4X fingerprint, and later tied one server to a command-and-control address embedded in a recovered implant.","The agent cataloged older personnel and performance documents from a finance office web directory, but Hunt.io said it found no evidence that those files were exfiltrated."],"referencedReports":[{"title":"Thailand Ministry of Finance Targeted with Hermes AI Agent","url":"https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent","publisher":"Hunt.io","context":"The article cites Hunt.io’s report as the source of the discovery of exposed attacker directories and analysis of Hermes AI agent use against Thailand’s Ministry of Finance.","category":"","primary":false}],"body":"\u003cp\u003eA threat actor used the open-source Hermes AI agent in unattended “YOLO” mode to automate post-exploitation activity during an alleged breach of Thailand’s Ministry of Finance. Hunt.io and security researcher Bob Diachenko uncovered the activity after finding exposed web directories containing hundreds of files tied to the operation. The Ministry of Finance has not confirmed a breach, and some recovered artifacts only show that specific systems were targeted rather than successfully compromised.\u003c/p\u003e\n\n\u003cp\u003eThe exposed directories were found on a Hong Kong-hosted server between July 9 and July 13 and contained 585 files totaling about 470 MB. The files included exploit code, web shells, HTTP tunneling tools, custom scripts, stolen credentials, compiled payloads, and Hermes AI agent logs. They referenced Ministry of Finance systems by name, hostname, and internal IP address, and included scripts aimed at services such as Hadoop, Apache Ambari, GlassFish, and an administrative web panel.\u003c/p\u003e\n\n\u003cp\u003eRecovered Hermes logs showed the operator enabled YOLO mode, allowing the agent to execute commands without human approval at each step. The agent was used to look for privilege escalation paths, scan for kernel vulnerabilities, enumerate services, inspect containers, search SUID and SGID binaries, and traverse file systems. Hunt.io said the artifacts depicted an active intrusion with staged tools and expanding access, but researchers could not determine how the attackers initially gained access.\u003c/p\u003e\n"},{"n":2,"title":"OnTrac notifies customers of data breach after network hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ontrac-notifies-customers-of-data-breach-after-network-hack/","time":"19:55","priority":"SHOULD READ","score":78,"tldr":"OnTrac says hackers breached its corporate network in March and may have accessed customer personal information, though it has not disclosed exactly what data or how many people were affected. The company is offering 12 months of credit monitoring and says it has no evidence the stolen information has been published or misused.","briefOverview":"\u003cp\u003eOnTrac is notifying customers that hackers breached its corporate network and may have accessed personal details belonging to customers. The incident was detected on March 23, and an internal investigation found that the attacker accessed certain files between March 20 and March 22. Apart from names, it is unclear what information was exposed because the company redacted the data elements in the notification sample shared with authorities.\u003c/p\u003e\n\n\u003cp\u003eOnTrac is a private American parcel-delivery company specializing in last-mile e-commerce deliveries, formed in 2021 from the merger of OnTrac Logistics and LaserShip. The company operates at 102 locations across 35 states, covers roughly 70% of the U.S. population, and works with more than 7,000 independent delivery contractors. In response to the incident, OnTrac hired a third-party specialist to help determine the scope of the breach and said it took steps to ensure the data was re-secured and not distributed.\u003c/p\u003e\n\n\u003cp\u003eOnTrac says it is not aware of any fraud or publication of stolen information resulting from the incident and has no reason to believe misuse will occur. The company is offering affected customers 12 months of free credit monitoring and identity protection through CyberScout, with a 90-day enrollment deadline. BleepingComputer contacted OnTrac for more details about the attack, the number of affected clients, and whether a ransom was paid, but had not received a response by publication time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OnTrac says hackers breached its corporate network and may have accessed personal details belonging to its customers.","The incident was detected on March 23, and OnTrac’s investigation found that the attacker accessed certain files between March 20 and March 22.","Apart from names, the types of exposed information are unclear because OnTrac redacted the data elements in the notification sample shared with authorities.","OnTrac is offering affected customers 12 months of free credit monitoring and identity protection through CyberScout, with a 90-day enrollment deadline.","At the time of publication, no ransomware or data extortion group had claimed responsibility for the attack."],"insights":["OnTrac’s statement that it took steps to ensure the data was “re-secured and not distributed” is notable because the article says this suggests a possible agreement with the attackers, typically a ransom payment.","The public notification sample does not reveal the specific data elements involved beyond names, which limits what can be independently understood about the sensitivity of the exposed information.","Affected customers have a limited 90-day window to enroll in the free 12-month credit monitoring and identity protection service offered through CyberScout.","Although the article notes signs consistent with data extortion, no ransomware or data extortion group had claimed responsibility at the time of writing."],"referencedReports":[],"body":"\u003cp\u003eOnTrac is notifying customers that hackers breached its corporate network and may have accessed personal details belonging to customers. The incident was detected on March 23, and an internal investigation found that the attacker accessed certain files between March 20 and March 22. Apart from names, it is unclear what information was exposed because the company redacted the data elements in the notification sample shared with authorities.\u003c/p\u003e\n\n\u003cp\u003eOnTrac is a private American parcel-delivery company specializing in last-mile e-commerce deliveries, formed in 2021 from the merger of OnTrac Logistics and LaserShip. The company operates at 102 locations across 35 states, covers roughly 70% of the U.S. population, and works with more than 7,000 independent delivery contractors. In response to the incident, OnTrac hired a third-party specialist to help determine the scope of the breach and said it took steps to ensure the data was re-secured and not distributed.\u003c/p\u003e\n\n\u003cp\u003eOnTrac says it is not aware of any fraud or publication of stolen information resulting from the incident and has no reason to believe misuse will occur. The company is offering affected customers 12 months of free credit monitoring and identity protection through CyberScout, with a 90-day enrollment deadline. BleepingComputer contacted OnTrac for more details about the attack, the number of affected clients, and whether a ransom was paid, but had not received a response by publication time.\u003c/p\u003e\n"},{"n":3,"title":"Ground Truth for Every Security Function","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/triage-investigate-hunt-defend/","time":"19:10","priority":"MAY READ","score":35,"tldr":"Censys argues that modern security teams need a live, first-party map of Internet infrastructure to make faster decisions across triage, investigation, threat hunting, and defense. The article positions Censys Internet Map, Platform, ARC, and related signals as the shared “ground truth” layer for those workflows.","briefOverview":"\u003cp\u003eCensys presents its work as building a live, comprehensive map of the Internet rather than a stale feed, secondhand vendor summary, or partial view assembled from logs and assumptions. The article says the Internet is now part of every security workflow, where employees authenticate, adversaries stage infrastructure, vulnerabilities become reachable, AI systems expose new surfaces, and third-party risk becomes operational reality. It frames the recurring question for security teams as: what is this thing on the Internet, and should we care?\u003c/p\u003e\n\n\u003cp\u003eThe article describes the Censys Internet Map as first-party observation of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure churn. It says Censys Platform lets practitioners search, enrich, pivot, automate, monitor, and act on that map in existing tools and workflows. It also describes Censys ARC, Censys Reputation Score, and Active DNS as ways to add expert judgment, faster risk decisions, and live relationships between names and infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCensys says its data is used by SOC analysts for triage, incident responders for infrastructure reconstruction, threat hunters for pivoting from indicators into campaigns, detection engineers for building logic, network defenders for enforcement, and exposure teams for understanding reachable systems. The article argues these are not separate stories but connected moments across triage, investigation, hunting, and defense. Its conclusion is that modern security teams need first-party Internet observation, expert judgment, and workflows that help practitioners move from signal to decision faster.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys built the Censys Internet Map as a first-party view of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure changes on the Internet.","Censys Platform is intended to let practitioners search, enrich, pivot, automate, monitor, and act on Internet Map data within their existing tools and workflows.","Censys ARC adds expert judgment to raw Internet observations, such as identifying commodity hosting, adversary-like infrastructure, risky service exposure, and urgent findings.","The article says SOC analysts, incident responders, threat hunters, detection engineers, network defenders, and vulnerability teams use Censys data across triage, investigation, hunting, and defense workflows.","Censys argues that triage, investigation, hunting, and defense are connected parts of modern security work that all depend on the same external Internet data."],"insights":["Censys frames the same Internet data as useful across multiple security roles, noting that SOC triage, incident response, threat hunting, detection engineering, network defense, and exposure management were “the same” story viewed from different seats.","The article emphasizes that an alert is not an answer but the start of a question, making external Internet context a decision aid for whether to close, escalate, or further enrich a case.","Censys argues that defenders need live DNS relationships because infrastructure now appears, changes, resolves, disappears, and reappears faster than older workflows can tolerate.","The article positions threat hunting as a process of finding patterns beneath single indicators by pivoting across shared Internet traits such as certificates, fingerprints, services, hosting, DNS relationships, and threat context.","Censys presents defense as continuous rather than divided into “before” and “after,” because signals can come from alerts, exposed services, new domain-to-host relationships, or vulnerability findings that need Internet context."],"referencedReports":[],"body":"\u003cp\u003eCensys presents its work as building a live, comprehensive map of the Internet rather than a stale feed, secondhand vendor summary, or partial view assembled from logs and assumptions. The article says the Internet is now part of every security workflow, where employees authenticate, adversaries stage infrastructure, vulnerabilities become reachable, AI systems expose new surfaces, and third-party risk becomes operational reality. It frames the recurring question for security teams as: what is this thing on the Internet, and should we care?\u003c/p\u003e\n\n\u003cp\u003eThe article describes the Censys Internet Map as first-party observation of hosts, services, certificates, DNS, web properties, software, protocols, exposures, and infrastructure churn. It says Censys Platform lets practitioners search, enrich, pivot, automate, monitor, and act on that map in existing tools and workflows. It also describes Censys ARC, Censys Reputation Score, and Active DNS as ways to add expert judgment, faster risk decisions, and live relationships between names and infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCensys says its data is used by SOC analysts for triage, incident responders for infrastructure reconstruction, threat hunters for pivoting from indicators into campaigns, detection engineers for building logic, network defenders for enforcement, and exposure teams for understanding reachable systems. The article argues these are not separate stories but connected moments across triage, investigation, hunting, and defense. Its conclusion is that modern security teams need first-party Internet observation, expert judgment, and workflows that help practitioners move from signal to decision faster.\u003c/p\u003e\n"}]</script>
