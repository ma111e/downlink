<script type="application/json" id="dl-articles">[{"n":2,"title":"Hackers exploit critical auth bypass in Gitea Docker image","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-auth-bypass-in-gitea-docker-image/","time":"15:48","priority":"MUST READ","score":96,"tldr":"Hackers are actively exploiting CVE-2026-20896, a critical authentication bypass in default Gitea Docker images that lets unauthenticated attackers impersonate any user, including admins, by spoofing a trusted reverse-proxy header. Gitea users should upgrade to version 1.26.4 or restrict REVERSE_PROXY_TRUSTED_PROXIES to trusted IPs and review logs for compromise.","briefOverview":"\u003cp\u003eHackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service. The flaw allows attackers to impersonate any user, including administrators. Security researcher Michael Clark at Sysdig said exploitation started less than two weeks before the vulnerability was publicly disclosed.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects official Gitea Docker images up to and including version 1.26.2 in the default configuration. Gitea’s official Docker image ships with \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES=*\u003c/code\u003e, and with reverse-proxy authentication enabled, Gitea trusts the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header from any source IP. This means an unauthenticated internet client can become whichever user it claims to be if it can reach the Gitea container’s HTTP port directly.\u003c/p\u003e\n\n\u003cp\u003eGitea released versions 1.26.3 and 1.26.4 to address CVE-2026-20896 and advised users to upgrade directly to the most recent release. Singapore’s cybersecurity agency also warned that the flaw is being actively exploited. If upgrading is not possible, the agency recommended restricting \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e to specific trusted IP addresses and reviewing access logs for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service.","The flaw affects official Gitea Docker images up to and including version 1.26.2 in the default configuration, where reverse proxy authentication headers such as X-WEBAUTH-USER are enabled.","The default setting REVERSE_PROXY_TRUSTED_PROXIES=* causes Gitea to trust the X-WEBAUTH-USER header from any source IP, allowing unauthenticated attackers to impersonate arbitrary users, including administrators.","Gitea released versions 1.26.3 and 1.26.4 to address CVE-2026-20896 and advised users to upgrade directly to the most recent release.","Singapore’s cybersecurity agency warned that CVE-2026-20896 is being actively exploited and recommended restricting REVERSE_PROXY_TRUSTED_PROXIES to specific trusted IP addresses if upgrading is not possible."],"insights":["The vulnerability is especially dangerous because the official Docker image’s default setting trusts identity headers from any source IP, so exposure of the container’s HTTP port directly can turn a configuration default into full user impersonation.","Sysdig observed the first in-the-wild exploitation 13 days after the advisory, showing that attackers moved quickly after public disclosure.","Gitea advised users to upgrade directly to the latest release rather than stopping at version 1.26.3 because version 1.26.4 fixes an additional issue and a regression introduced in 1.26.3.","Even without an immediate upgrade, organizations can reduce exposure by replacing the wildcard REVERSE_PROXY_TRUSTED_PROXIES setting with specific trusted IP addresses.","Because attackers can impersonate known or guessable accounts such as “admin” or “gitea_admin,” access log review is important to determine whether compromise has already occurred."],"referencedReports":[{"title":"GHSA-f75j-4cw6-rmx4 / CVE-2026-20896 security advisory","url":"https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4","publisher":"Gitea","context":"The article cites this security advisory for details on the critical CVE-2026-20896 bug affecting official Gitea Docker images up to version 1.26.2.","category":"","primary":false},{"title":"CSA alert on CVE-2026-20896","url":"http://www.csa.gov.sg/alerts-and-advisories/alerts/al-2026-083/","publisher":"Cyber Security Agency of Singapore","context":"The article says Singapore’s cybersecurity agency issued a warning that CVE-2026-20896 is being actively exploited and recommended mitigation steps.","category":"","primary":false}],"body":"\u003cp\u003eHackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service. The flaw allows attackers to impersonate any user, including administrators. Security researcher Michael Clark at Sysdig said exploitation started less than two weeks before the vulnerability was publicly disclosed.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects official Gitea Docker images up to and including version 1.26.2 in the default configuration. Gitea’s official Docker image ships with \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES=*\u003c/code\u003e, and with reverse-proxy authentication enabled, Gitea trusts the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header from any source IP. This means an unauthenticated internet client can become whichever user it claims to be if it can reach the Gitea container’s HTTP port directly.\u003c/p\u003e\n\n\u003cp\u003eGitea released versions 1.26.3 and 1.26.4 to address CVE-2026-20896 and advised users to upgrade directly to the most recent release. Singapore’s cybersecurity agency also warned that the flaw is being actively exploited. If upgrading is not possible, the agency recommended restricting \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e to specific trusted IP addresses and reviewing access logs for suspicious activity.\u003c/p\u003e\n"},{"n":4,"title":"Progress urges ShareFile admins to shut down servers over “credible” threat","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/progress-urges-sharefile-customers-to-shut-down-servers-over-credible-threat/","time":"16:26","priority":"MUST READ","score":90,"tldr":"Progress Software is telling ShareFile customers using on-premises Storage Zone Controllers to immediately shut down those servers due to a credible external security threat. The company says it has temporarily disabled affected ShareFile access and has not yet confirmed any unauthorized access or data compromise.","briefOverview":"\u003cp\u003eProgress Software emailed ShareFile customers using Storage Zone Controllers and urged them to immediately shut down the servers hosting those controllers. The company said it has reason to believe there is a credible external security threat targeting ShareFile Storage Zone Controllers. Progress said it has no indication of unauthorized access to any Progress ShareFile accounts or data, but it temporarily disabled access to affected ShareFile accounts as a precaution.\u003c/p\u003e\n\n\u003cp\u003eShareFile Storage Zone Controllers are used in hybrid deployments where organizations keep files on their own on-premises Windows servers while using ShareFile’s cloud platform for authentication, user management, sharing, and collaboration. Because these controllers handle file transfers between the cloud platform and customer-managed storage, they are typically Internet-accessible servers. Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised, and the ShareFile status page says customers with Storage Zone Controllers are not operational at this time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software emailed ShareFile customers using Storage Zone Controllers and urged them to immediately shut down their servers due to a “credible external security threat.”","Progress said it has no indication of unauthorized access to any ShareFile accounts or data, but it temporarily disabled access to ShareFile accounts using Storage Zone Controllers as a precaution.","Progress instructed customers to manually shut down the Windows servers hosting Storage Zone Controllers, stating that this is a critical additional step to ensure data safety.","The ShareFile status page states that ShareFile customers with Storage Zone Controllers are not operational at this time.","Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised."],"insights":["Progress’s instruction to manually shut down Storage Zone Controller servers shows that disabling access through the ShareFile cloud platform was not considered sufficient to address the threat.","The affected ShareFile deployments are hybrid setups where customer-managed, typically Internet-accessible Windows servers handle file transfers while ShareFile’s cloud platform manages authentication and collaboration.","Progress applied service restrictions before disclosing whether any compromise occurred, indicating the response was based on a credible threat rather than confirmed unauthorized access.","The article draws a direct parallel to prior attacks on enterprise file transfer and file-sharing platforms, including the 2023 Clop exploitation of Progress MOVEit Transfer to steal data from thousands of organizations."],"referencedReports":[],"body":"\u003cp\u003eProgress Software emailed ShareFile customers using Storage Zone Controllers and urged them to immediately shut down the servers hosting those controllers. The company said it has reason to believe there is a credible external security threat targeting ShareFile Storage Zone Controllers. Progress said it has no indication of unauthorized access to any Progress ShareFile accounts or data, but it temporarily disabled access to affected ShareFile accounts as a precaution.\u003c/p\u003e\n\n\u003cp\u003eShareFile Storage Zone Controllers are used in hybrid deployments where organizations keep files on their own on-premises Windows servers while using ShareFile’s cloud platform for authentication, user management, sharing, and collaboration. Because these controllers handle file transfers between the cloud platform and customer-managed storage, they are typically Internet-accessible servers. Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised, and the ShareFile status page says customers with Storage Zone Controllers are not operational at this time.\u003c/p\u003e\n"},{"n":6,"title":"Police suspects Dutch hackers were involved in Odido breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-suspects-dutch-hackers-were-involved-in-odido-breach/","time":"16:37","priority":"SHOULD READ","score":88,"tldr":"Dutch police say they have strong indications that Dutch hackers were involved in Odido’s February data breach, including a vishing call in which a Dutch-speaking man impersonated an IT employee before phishing led to data theft. The breach exposed personal data of millions of customers and was claimed by the ShinyHunters extortion gang.","briefOverview":"\u003cp\u003eDutch National Police said it has found “strong indications” that Dutch hackers were involved in a February breach at telecommunications provider Odido. Police cited a telephone conversation shortly before the hack in which a Dutch-speaking man posed as an Odido IT employee during a call with customer service. The company was then misled through phishing, after which the data theft took place.\u003c/p\u003e\n\n\u003cp\u003eOdido disclosed the breach on February 12 and said attackers accessed its customer contact system on February 7. The company told local media that the breach affected 6.2 million customers and that the attackers claimed to have stolen millions of user records. Exposed information may include names, addresses, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details, while call details, location data, billing data, identity document scans, and Mijn Odido passwords were not exposed.\u003c/p\u003e\n\n\u003cp\u003eOdido has not attributed the incident, but the ShinyHunters extortion gang claimed responsibility on its dark web leak site. The group released an 88GB archive containing over 15 million records, including data Odido had already disclosed as exposed. The article says ShinyHunters has been behind widespread vishing campaigns that impersonate IT support staff to obtain credentials and multi-factor authentication codes, and it links the group to numerous breaches involving major organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Dutch National Police said it found strong indications that Dutch hackers were involved in a February breach at telecommunications provider Odido.","Police said a Dutch-speaking man posed as an Odido IT employee during a call with customer service shortly before the hack, after which the company was misled through phishing and data theft occurred.","Odido disclosed on February 12 that attackers accessed its customer contact system on February 7 and downloaded personal data affecting 6.2 million customers.","The exposed information may include names, addresses, cities of residence, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details, but not call details, location data, billing data, identity document scans, or Mijn Odido passwords.","The ShinyHunters extortion gang claimed responsibility for the breach and released an 88GB archive containing over 15 million records on its dark web leak site."],"insights":["The evidence cited by Dutch police shows that a single impersonation call to customer service can be important enough to connect a major data breach investigation to local suspects.","Odido’s breach aligns with ShinyHunters’ described pattern of impersonating IT support staff to obtain credentials and multi-factor authentication codes before stealing data from business applications.","Although Odido said Mijn Odido passwords, call details, location data, billing data, and identity document scans were not exposed, the disclosed data still included enough personal and financial identifiers to affect millions of customers.","The police statement that traces were secured at several points during the investigation highlights that cybercriminal investigations can rely on evidence collected across multiple stages rather than a single technical clue."],"referencedReports":[],"body":"\u003cp\u003eDutch National Police said it has found “strong indications” that Dutch hackers were involved in a February breach at telecommunications provider Odido. Police cited a telephone conversation shortly before the hack in which a Dutch-speaking man posed as an Odido IT employee during a call with customer service. The company was then misled through phishing, after which the data theft took place.\u003c/p\u003e\n\n\u003cp\u003eOdido disclosed the breach on February 12 and said attackers accessed its customer contact system on February 7. The company told local media that the breach affected 6.2 million customers and that the attackers claimed to have stolen millions of user records. Exposed information may include names, addresses, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details, while call details, location data, billing data, identity document scans, and Mijn Odido passwords were not exposed.\u003c/p\u003e\n\n\u003cp\u003eOdido has not attributed the incident, but the ShinyHunters extortion gang claimed responsibility on its dark web leak site. The group released an 88GB archive containing over 15 million records, including data Odido had already disclosed as exposed. The article says ShinyHunters has been behind widespread vishing campaigns that impersonate IT support staff to obtain credentials and multi-factor authentication codes, and it links the group to numerous breaches involving major organizations.\u003c/p\u003e\n"},{"n":11,"title":"Injective Labs GitHub Compromise Pushes Wallet-Key-Stealing npm Packages","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/injective-labs-github-compromise-pushes.html","time":"17:29","priority":"SHOULD READ","score":88,"tldr":"Attackers compromised Injective Labs’ GitHub/npm release process to publish malicious @injectivelabs packages that stole crypto wallet private keys and mnemonic seed phrases when used. Anyone who installed the affected 1.20.21 packages should upgrade to a clean version and treat any keys or seed phrases processed by them as compromised.","briefOverview":"\u003cp\u003eUnknown threat actors compromised the Injective Labs SDK project\u0026rsquo;s GitHub repository and used it to publish a malicious npm package. The compromised version, \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e, was released on July 8, 2026, and included fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases. The version has since been deprecated on npm, but the article says its release artifacts were still available for download from GitHub at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eSocket said the malicious functionality was introduced through commits submitted by a GitHub account belonging to a developer with an established history of contributions to the repository. The threat actor also published version 1.20.21 across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages that depended on and pinned the malicious SDK version. This meant users could be affected through transitive dependencies even if they did not directly install the SDK package.\u003c/p\u003e\n\n\u003cp\u003eThe malware avoided lifecycle scripts and did not run during installation, instead triggering when affected library functionality was used. It modified legitimate functions used to generate private keys by invoking a \u003ccode\u003etrackKeyDerivation()\u003c/code\u003e function disguised as anonymized usage metrics, while passing along sensitive material needed to regenerate private keys. The exfiltration mechanism queued multiple key derivations over a two-second window and sent them via HTTPS POST to \u003ccode\u003etestnet.archival.chain.grpc-web.injective[.]network\u003c/code\u003e, and users are advised to update to version 1.20.23, treat exposed keys or phrases as compromised, rotate them, and check transitive dependencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown threat actors compromised the Injective Labs SDK project's GitHub repository and used it to publish the malicious npm package @injectivelabs/sdk-ts@1.20.21.","The malicious version contained fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases when affected library functionality was used.","The threat actor also published version 1.20.21 across 17 additional @injectivelabs scoped packages that depended on and pinned the malicious SDK version, affecting potential transitive users.","The exfiltration mechanism queued multiple key derivations over a two-second window and sent them in an HTTPS POST request to testnet.archival.chain.grpc-web.injective[.]network.","Users who installed the malicious version are advised to update to the clean version 1.20.23, treat any private key or mnemonic phrase passed through the package as compromised, rotate them, and check for transitive dependencies."],"insights":["Deprecating the malicious npm release did not fully remove exposure because the release artifacts for version 1.20.21 were still available for download from GitHub at the time of writing.","The malware avoided npm lifecycle scripts and only triggered when library functionality was used, making install-time security checks less likely to detect it.","The malicious release was pushed through the repository’s own trusted-publisher OIDC pipeline under an existing maintainer identity, showing that a trusted release path can still distribute compromised code if the source repository or maintainer account is abused.","The attacker increased downstream exposure by publishing 17 additional @injectivelabs packages that pinned the malicious SDK version, putting users at risk even if they did not directly install @injectivelabs/sdk-ts.","The fake telemetry function was designed to look like performance measurement while receiving enough sensitive wallet material for the attacker to regenerate private keys."],"referencedReports":[{"title":"Compromised Injective SDK npm Package","url":"https://socket.dev/blog/compromised-injective-sdk-npm-package","publisher":"Socket","context":"The article cites Socket’s analysis that malicious functionality was introduced through commits from a GitHub account with an established contribution history and describes the compromised npm releases.","category":"","primary":false},{"title":"InjectiveLabs NPM Package Hijacked Impacting 87 Dependent Packages","url":"https://www.ox.security/blog/injectivelabs-npm-package-hijacked-impacting-87-dependent-packages/","publisher":"OX Security","context":"The article quotes OX Security’s analysis describing how the malware reads mnemonic phrases and sends them to a remote server.","category":"","primary":false},{"title":"Injective NPM Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","url":"https://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","publisher":"StepSecurity","context":"The article cites StepSecurity’s technical analysis of the exfiltration mechanism and the trusted-publisher OIDC pipeline used in the malicious release.","category":"","primary":false}],"body":"\u003cp\u003eUnknown threat actors compromised the Injective Labs SDK project\u0026rsquo;s GitHub repository and used it to publish a malicious npm package. The compromised version, \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e, was released on July 8, 2026, and included fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases. The version has since been deprecated on npm, but the article says its release artifacts were still available for download from GitHub at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eSocket said the malicious functionality was introduced through commits submitted by a GitHub account belonging to a developer with an established history of contributions to the repository. The threat actor also published version 1.20.21 across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages that depended on and pinned the malicious SDK version. This meant users could be affected through transitive dependencies even if they did not directly install the SDK package.\u003c/p\u003e\n\n\u003cp\u003eThe malware avoided lifecycle scripts and did not run during installation, instead triggering when affected library functionality was used. It modified legitimate functions used to generate private keys by invoking a \u003ccode\u003etrackKeyDerivation()\u003c/code\u003e function disguised as anonymized usage metrics, while passing along sensitive material needed to regenerate private keys. The exfiltration mechanism queued multiple key derivations over a two-second window and sent them via HTTPS POST to \u003ccode\u003etestnet.archival.chain.grpc-web.injective[.]network\u003c/code\u003e, and users are advised to update to version 1.20.23, treat exposed keys or phrases as compromised, rotate them, and check transitive dependencies.\u003c/p\u003e\n"},{"n":9,"title":"Six New U-Boot Flaws Could Let Malicious Images Crash Devices or Run Code at Boot","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/six-new-u-boot-flaws-could-let.html","time":"15:57","priority":"SHOULD READ","score":86,"tldr":"Binarly found six U-Boot flaws in FIT image signature verification, including two that could allow code execution before a device verifies boot software. Vendors using U-Boot should pull the upstream patches now because no fixed stable release is available yet.","briefOverview":"\u003cp\u003eResearchers at Binarly found six new flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips. Four of the bugs can crash a device, while two could let an attacker run their own code if a malicious image reaches the boot path. The flaws are reached while U-Boot is still reading an untrusted image, before it has checked the image signature.\u003c/p\u003e\n\n\u003cp\u003eThe two most serious issues are BRLY-2026-037 and BRLY-2026-038, which stem from U-Boot using unchecked values returned by fdt_get_name. One can lead to a stack buffer overflow on devices where address zero is mapped, and the other can overwrite a saved return address through negative-length pointer arithmetic. The remaining four issues can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.\u003c/p\u003e\n\n\u003cp\u003eBinarly published proof-of-concept images and reproduction steps for each flaw, and no exploitation in real attacks has been reported. U-Boot merged six patches in June, but the July v2026.07 release shipped without them because it had already frozen, and the next release is expected in October as v2026.10. Vendors and maintainers are advised to pull the upstream fixes now, while users of U-Boot-based products must wait for firmware updates from their product vendors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binarly found six flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips.","The flaws affect U-Boot’s handling of FIT images during signature verification and are reachable while U-Boot is still reading an untrusted image before checking the signature.","Two flaws, BRLY-2026-037 and BRLY-2026-038, could allow attacker-supplied code to run at boot because U-Boot uses unchecked values returned by fdt_get_name.","Four flaws, BRLY-2026-039, BRLY-2026-040, BRLY-2026-041, and BRLY-2026-042, can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.","U-Boot merged patches for the six flaws in June, but there is no stable release containing the fixes yet, so vendors and maintainers are advised to pull the upstream fixes now."],"insights":["The most urgent fixes are BRLY-2026-037 and BRLY-2026-038 because the article distinguishes them from the crash-only bugs as potential boot-time code execution issues that could subvert the chain of trust.","Vendors cannot rely on the latest stable U-Boot release for these fixes because v2026.07 shipped without the June patches, and the next fixed release is not expected until v2026.10 in October.","Tracking remediation may be harder than usual because the six issues currently have Binarly advisory IDs but no CVE identifiers assigned.","The risky pattern may extend beyond U-Boot because the unchecked fdt_get_name helper comes from libfdt, which is shared with the Linux kernel, barebox, and other software.","The article highlights that delivery is the main attacker constraint, but earlier Binarly work showed a remote management interface could be used to flash a malicious image through a device’s own update process."],"referencedReports":[{"title":"UnFIT to Boot: Breaking U-Boot's FIT Signature Verification","url":"https://www.binarly.io/blog/unfit-to-boot-breaking-u-boots-fit-signature-verification","publisher":"Binarly","context":"The article cites Binarly’s technical research as the source for details on six U-Boot FIT signature verification flaws and their long-standing presence across U-Boot releases.","category":"","primary":false},{"title":"BRLY-2026-037 through BRLY-2026-042 Advisories","url":"https://www.binarly.io/advisories","publisher":"Binarly","context":"The article says the six U-Boot bugs are tracked as Binarly advisories BRLY-2026-037 through BRLY-2026-042 and references the advisory page for commit links and details.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Binarly found six new flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips. Four of the bugs can crash a device, while two could let an attacker run their own code if a malicious image reaches the boot path. The flaws are reached while U-Boot is still reading an untrusted image, before it has checked the image signature.\u003c/p\u003e\n\n\u003cp\u003eThe two most serious issues are BRLY-2026-037 and BRLY-2026-038, which stem from U-Boot using unchecked values returned by fdt_get_name. One can lead to a stack buffer overflow on devices where address zero is mapped, and the other can overwrite a saved return address through negative-length pointer arithmetic. The remaining four issues can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.\u003c/p\u003e\n\n\u003cp\u003eBinarly published proof-of-concept images and reproduction steps for each flaw, and no exploitation in real attacks has been reported. U-Boot merged six patches in June, but the July v2026.07 release shipped without them because it had already frozen, and the next release is expected in October as v2026.10. Vendors and maintainers are advised to pull the upstream fixes now, while users of U-Boot-based products must wait for firmware updates from their product vendors.\u003c/p\u003e\n"},{"n":10,"title":"Researcher Details WhatsApp-to-Host Attack Chain Using Three OpenClaw Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-details-whatsapp-to-host.html","time":"14:19","priority":"SHOULD READ","score":80,"tldr":"Three now-patched OpenClaw flaws could let attackers trigger credential theft, privilege escalation, sandbox escape, and host code execution, reportedly even from an external WhatsApp message. Users should upgrade to OpenClaw 2026.6.6 and restrict risky tool access such as exec for untrusted or channel-facing agents.","briefOverview":"\u003cp\u003eDetails have emerged about three now-patched security flaws in the OpenClaw personal AI assistant. If successfully exploited, the flaws could enable credential theft, privilege escalation, and arbitrary code execution on the host. The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, with CVSS scores of 8.8, 8.8, and 8.4 respectively. All three issues were addressed in OpenClaw version 2026.6.6.\u003c/p\u003e\n\n\u003cp\u003eOpenClaw maintainers said the practical impact depends on the operator\u0026rsquo;s configuration and whether lower-trust input can reach the affected path. Security researcher Chinmohan Nayak, who discovered and reported the issues, said they can be used to trigger host code execution from an external message sent via WhatsApp. The article says these newly identified bugs differ from the earlier Claw Chain vulnerabilities because they do not require an attacker to establish a prior foothold. Potential outcomes include extracting sensitive data, dropping a persistent backdoor, obtaining arbitrary remote code execution, and escaping to the host.\u003c/p\u003e\n\n\u003cp\u003eOne flaw, GHSA-575v-8hfq-m3mc, involves path traversal and link following that could allow sandbox bind mounts to bypass parent-directory denylist checks. Nayak said the bind mount denylist blocks directories such as \u0026ldquo;\u003cem\u003e/.ssh,\u0026rdquo; \u0026ldquo;\u003c/em\u003e/.aws,\u0026rdquo; and \u0026ldquo;~/.gnupg,\u0026rdquo; but allows mounting parent directories such as \u0026ldquo;/home\u0026rdquo; or \u0026ldquo;/var,\u0026rdquo; undermining those blocks. The article recommends updating OpenClaw, enabling sandbox mode for all non-main sessions, removing \u0026ldquo;exec\u0026rdquo; from the tool allowlist for channel-facing agents, and monitoring for git clone commands containing the \u0026ldquo;ext::\u0026rdquo; external protocol helper.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three now-patched high-severity flaws in the OpenClaw personal AI assistant could enable credential theft, privilege escalation, and arbitrary code execution on the host.","The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, and all three were fixed in OpenClaw version 2026.6.6.","Security researcher Chinmohan Nayak said the flaws can be used to trigger host code execution from an external message sent via WhatsApp.","GHSA-575v-8hfq-m3mc involves a path traversal and link following issue that could allow sandbox bind mounts to bypass parent-directory denylist checks.","The article recommends upgrading OpenClaw, enabling sandbox mode for all non-main sessions, removing exec from the tool allowlist for channel-facing agents, and monitoring for git clone commands using the ext:: external protocol helper."],"insights":["The researcher’s reported WhatsApp-to-host chain shows that lower-trust external messages can become dangerous when they are allowed to reach AI agent paths with host execution capabilities.","The bind mount issue was not just about blocked sensitive folders, because mounting a broader parent directory such as /home or /var could undermine blocks on specific paths like ~/.ssh, ~/.aws, and ~/.gnupg.","The article highlights Docker socket exposure through /var as especially consequential, because it could allow a full host escape from inside the sandbox.","The recommended mitigations focus on limiting what channel-facing agents can do, showing that OpenClaw risk depends heavily on tool allowlists, shared Gateway use, and whether untrusted users can reach affected features."],"referencedReports":[{"title":"GHSA-hjr6-g723-hmfm","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-hjr6-g723-hmfm","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory as one of three high-severity flaws fixed in OpenClaw version 2026.6.6.","category":"","primary":false},{"title":"GHSA-9969-8g9h-rxwm","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-9969-8g9h-rxwm","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory as one of three high-severity flaws affecting the host execution environment filtering mechanism.","category":"","primary":false},{"title":"GHSA-575v-8hfq-m3mc","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-575v-8hfq-m3mc","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory for a path traversal and link following issue involving sandbox bind mounts.","category":"","primary":false},{"title":"I Sent a WhatsApp Message to an AI Agent. It Ran My Code on the Host.","url":"https://medium.com/@chinmohannayak/i-sent-a-whatsapp-message-to-an-ai-agent-it-ran-my-code-on-the-host-adbbcbb0e0ad","publisher":"Chinmohan Nayak","context":"The article says researcher Chinmohan Nayak shared this report detailing how the flaws can trigger host code execution from an external WhatsApp message.","category":"","primary":false}],"body":"\u003cp\u003eDetails have emerged about three now-patched security flaws in the OpenClaw personal AI assistant. If successfully exploited, the flaws could enable credential theft, privilege escalation, and arbitrary code execution on the host. The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, with CVSS scores of 8.8, 8.8, and 8.4 respectively. All three issues were addressed in OpenClaw version 2026.6.6.\u003c/p\u003e\n\n\u003cp\u003eOpenClaw maintainers said the practical impact depends on the operator\u0026rsquo;s configuration and whether lower-trust input can reach the affected path. Security researcher Chinmohan Nayak, who discovered and reported the issues, said they can be used to trigger host code execution from an external message sent via WhatsApp. The article says these newly identified bugs differ from the earlier Claw Chain vulnerabilities because they do not require an attacker to establish a prior foothold. Potential outcomes include extracting sensitive data, dropping a persistent backdoor, obtaining arbitrary remote code execution, and escaping to the host.\u003c/p\u003e\n\n\u003cp\u003eOne flaw, GHSA-575v-8hfq-m3mc, involves path traversal and link following that could allow sandbox bind mounts to bypass parent-directory denylist checks. Nayak said the bind mount denylist blocks directories such as \u0026ldquo;\u003cem\u003e/.ssh,\u0026rdquo; \u0026ldquo;\u003c/em\u003e/.aws,\u0026rdquo; and \u0026ldquo;~/.gnupg,\u0026rdquo; but allows mounting parent directories such as \u0026ldquo;/home\u0026rdquo; or \u0026ldquo;/var,\u0026rdquo; undermining those blocks. The article recommends updating OpenClaw, enabling sandbox mode for all non-main sessions, removing \u0026ldquo;exec\u0026rdquo; from the tool allowlist for channel-facing agents, and monitoring for git clone commands containing the \u0026ldquo;ext::\u0026rdquo; external protocol helper.\u003c/p\u003e\n"},{"n":1,"title":"Ryuk ransomware member pleads guilty in the US, faces 15 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ryuk-ransomware-member-pleads-guilty-in-the-us-faces-15-years-in-prison/","time":"17:46","priority":"SHOULD READ","score":78,"tldr":"Karen Serobovich Vardanyan, an Armenian Ryuk ransomware operator extradited to the U.S., pleaded guilty to helping hack and encrypt U.S. organizations’ networks between 2019 and 2020. He faces up to 15 years in prison and agreed to pay more than $1.1 million in restitution.","briefOverview":"\u003cp\u003eKaren Serobovich Vardanyan, a 34-year-old Armenian man, pleaded guilty in the United States to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems. He was extradited to the United States after being arrested in Kyiv in April 2025 for providing initial access to corporate networks. According to court documents, he helped deploy Ryuk ransomware on multiple U.S. organizations’ networks between November 2019 and April 2020 after illegally accessing their systems.\u003c/p\u003e\n\n\u003cp\u003eOne cited attack involved a Michigan company that paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also noted attacks on a technology company in Wilsonville, Oregon, and a school in Texas. The U.S. Department of Justice said Vardanyan and his co-conspirators deployed ransomware on hundreds of compromised servers and workstations. The DoJ also said they received about 1,610 bitcoins in ransom payments, valued at around \\)\u003c/span\u003e15 million at the time.\u003c/p\u003e\n\n\u003cp\u003eRyuk was active from 2018 until mid-2020 and carried out high-profile attacks against organizations across nearly every sector, including healthcare providers during the COVID-19 pandemic. At its peak, the Ryuk gang was estimated to have hacked around 20 organizations every week and made more than \u003cspan class=\"math inline\"\u003e\\(150 million. Vardanyan was indicted in February 2024 by a federal grand jury in Portland, is scheduled to be sentenced in September 2026, faces up to 15 years in prison and fines, and agreed to pay more than \\)\u003c/span\u003e1.1 million in restitution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Serobovich Vardanyan, a 34-year-old Armenian man, pleaded guilty in the United States to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems.","Vardanyan was extradited to the United States after being arrested in Kyiv in April 2025 for providing initial access to corporate networks.","According to the U.S. Department of Justice, Vardanyan and his co-conspirators received about 1,610 bitcoins in ransom payments, valued at around $15 million at the time.","The Ryuk ransomware operation was active from 2018 until mid-2020 and targeted organizations across nearly every sector, including healthcare providers during the COVID-19 pandemic.","Vardanyan is scheduled to be sentenced in September 2026 and faces a maximum sentence of 15 years in prison, fines of $250,000 for each charge, and more than $1.1 million in restitution."],"insights":["The case shows that people who provided initial access to victim networks can face major criminal penalties even if the article does not describe them as the sole operators of the ransomware scheme.","The prosecution covers attacks from 2019 and 2020, but Vardanyan was not indicted until 2024 and is scheduled for sentencing in 2026, showing that ransomware cases can continue for years after an operation shuts down.","Ryuk’s shutdown did not end the threat from its members, as the article says many transitioned to Conti and later splintered into other cybercrime groups that remain active today.","The ransom figures show how quickly payments accumulated: prosecutors cited about 1,610 bitcoins worth around $15 million from Vardanyan and co-conspirators, while the broader Ryuk operation is estimated to have made more than $150 million."],"referencedReports":[],"body":"\u003cp\u003eKaren Serobovich Vardanyan, a 34-year-old Armenian man, pleaded guilty in the United States to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems. He was extradited to the United States after being arrested in Kyiv in April 2025 for providing initial access to corporate networks. According to court documents, he helped deploy Ryuk ransomware on multiple U.S. organizations’ networks between November 2019 and April 2020 after illegally accessing their systems.\u003c/p\u003e\n\n\u003cp\u003eOne cited attack involved a Michigan company that paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also noted attacks on a technology company in Wilsonville, Oregon, and a school in Texas. The U.S. Department of Justice said Vardanyan and his co-conspirators deployed ransomware on hundreds of compromised servers and workstations. The DoJ also said they received about 1,610 bitcoins in ransom payments, valued at around \\)\u003c/span\u003e15 million at the time.\u003c/p\u003e\n\n\u003cp\u003eRyuk was active from 2018 until mid-2020 and carried out high-profile attacks against organizations across nearly every sector, including healthcare providers during the COVID-19 pandemic. At its peak, the Ryuk gang was estimated to have hacked around 20 organizations every week and made more than \u003cspan class=\"math inline\"\u003e\\(150 million. Vardanyan was indicted in February 2024 by a federal grand jury in Portland, is scheduled to be sentenced in September 2026, faces up to 15 years in prison and fines, and agreed to pay more than \\)\u003c/span\u003e1.1 million in restitution.\u003c/p\u003e\n"},{"n":8,"title":"Ryuk operator pleads guilty; Blackcat/AlphV conspirator gets nearly 6-year sentence","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ryuk-operator-pleads-guilty-alphv-conspirator-sentenced","time":"17:01","priority":"SHOULD READ","score":78,"tldr":"U.S. prosecutors advanced major ransomware cases as a Ryuk operator pleaded guilty to deploying ransomware against organizations, while a former ransomware negotiator received a nearly six-year sentence for helping BlackCat/AlphV extort victims.","briefOverview":"\u003cp\u003eU.S. prosecutors announced developments in two cases involving major ransomware groups. Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in Oregon federal court to conspiracy and computer fraud tied to deploying Ryuk ransomware. Angelo Martino, a 41-year-old from Land O’Lakes, Florida, was sentenced to 70 months in federal prison for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan accessed companies’ computer networks for about six months beginning in November 2019 to deploy Ryuk ransomware. He was extradited from Ukraine to the United States in June 2025 after being arrested in Kyiv in April, and he faces up to 15 years in prison, up to \u003cspan class=\"math inline\"\u003e\\(500,000 in fines, and more than \\)\u003c/span\u003e1.1 million in restitution. Prosecutors said Vardanyan and co-conspirators attacked a Michigan company that paid 200 bitcoin, or more than $1.1 million at the time, as well as a company in Wilsonville, Oregon, and a school in Texas.\u003c/p\u003e\n\n\u003cp\u003eMartino pleaded guilty in April after surrendering to U.S. Marshals in March, and prosecutors said he provided BlackCat attackers with confidential information about his employer’s clients’ negotiating positions and strategies. Two other men connected to the same case, Ryan Goldberg and Kevin Martin, also pleaded guilty to extortion charges and received four-year prison sentences in May. DigitalMint, where Martin and Martino worked as ransomware negotiators, has added controls requiring negotiations to occur on auditable, logged cloud-based platforms, with one founder personally overseeing all negotiations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in Oregon federal court to conspiracy and computer fraud for accessing company networks to deploy Ryuk ransomware beginning in November 2019.","Vardanyan was extradited from Ukraine to the United States in June 2025 after being arrested in Kyiv in April, and he faces up to 15 years in prison, up to $500,000 in fines, and more than $1.1 million in restitution.","Prosecutors said Vardanyan and co-conspirators attacked a Michigan company that paid 200 bitcoin, a company in Wilsonville, Oregon, and a school in Texas in February 2020.","Angelo Martino of Land O’Lakes, Florida, was sentenced to 70 months in federal prison for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.","Prosecutors said Martino, a ransomware negotiator, provided BlackCat attackers with confidential information about his employer’s clients’ negotiating positions and strategies to help maximize ransom payments."],"insights":["The BlackCat/AlphV case shows that ransomware groups sought value not only from technical access, but also from insider knowledge of victims’ negotiation strategies.","DigitalMint’s response indicates that auditable, logged negotiation platforms and direct executive oversight were considered necessary controls after negotiators were implicated in extortion schemes.","The Ryuk case demonstrates that ransomware prosecutions can remain active for years, with conduct from 2019 and 2020 still leading to extradition and guilty pleas in 2025.","The article links Ryuk to Conti and Trickbot, showing that law enforcement views major ransomware cases as part of a broader connected cybercrime ecosystem rather than isolated groups."],"referencedReports":[],"body":"\u003cp\u003eU.S. prosecutors announced developments in two cases involving major ransomware groups. Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in Oregon federal court to conspiracy and computer fraud tied to deploying Ryuk ransomware. Angelo Martino, a 41-year-old from Land O’Lakes, Florida, was sentenced to 70 months in federal prison for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan accessed companies’ computer networks for about six months beginning in November 2019 to deploy Ryuk ransomware. He was extradited from Ukraine to the United States in June 2025 after being arrested in Kyiv in April, and he faces up to 15 years in prison, up to \u003cspan class=\"math inline\"\u003e\\(500,000 in fines, and more than \\)\u003c/span\u003e1.1 million in restitution. Prosecutors said Vardanyan and co-conspirators attacked a Michigan company that paid 200 bitcoin, or more than $1.1 million at the time, as well as a company in Wilsonville, Oregon, and a school in Texas.\u003c/p\u003e\n\n\u003cp\u003eMartino pleaded guilty in April after surrendering to U.S. Marshals in March, and prosecutors said he provided BlackCat attackers with confidential information about his employer’s clients’ negotiating positions and strategies. Two other men connected to the same case, Ryan Goldberg and Kevin Martin, also pleaded guilty to extortion charges and received four-year prison sentences in May. DigitalMint, where Martin and Martino worked as ransomware negotiators, has added controls requiring negotiations to occur on auditable, logged cloud-based platforms, with one founder personally overseeing all negotiations.\u003c/p\u003e\n"},{"n":12,"title":"Laser Attack Resets Tangem Wallet Passwords on Cards That Can't Be Patched","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/laser-attack-resets-tangem-wallet.html","time":"14:51","priority":"MAY READ","score":72,"tldr":"Ledger Donjon researchers showed that a costly, invasive laser fault-injection attack can reset passwords on Tangem wallet cards without the old password or backup card, potentially letting someone with physical possession move funds. The risk is low for most users because it requires a specialized lab and visibly destroys the card, but lost or stolen cards holding significant value should be treated as unsafe.","briefOverview":"\u003cp\u003eLedger’s Donjon security team showed that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card’s password to a value chosen by an attacker. Once reset, the attacker can control the wallet and move the coins out without knowing the old password or using a backup card. The attack requires physical possession of the card, cutting it open, specialized equipment estimated at about $250,000, and cannot be done over the internet.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is tied to Tangem’s password reset process, where the card checks whether it is in recovery mode before accepting a new password. Donjon found that a laser pulse can disturb the chip at the exact moment of that check, making the card behave as if it were in recovery mode when it is not. Turning recovery off does not help because the same check still runs on every card.\u003c/p\u003e\n\n\u003cp\u003eThe issue cannot be patched because Tangem cards do not support firmware updates, a design Tangem presents as protection against remote tampering. Tangem said the practical risk is virtually non-existent for everyday users because the method is lab-only, costly, invasive, and gives an attacker no easy way to know whether a stolen card holds significant value. The article says the main affected group is anyone whose Tangem card is lost or stolen and holds serious value, and advises moving funds using another card in the set or a seed phrase if one was set up.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ledger's Donjon security team demonstrated that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card's password to an attacker-chosen value.","The attack requires physical possession of the card, cutting it open to expose the chip, specialized equipment estimated at about $250,000, and cannot be performed over the internet.","Tangem cards cannot receive firmware updates, so cards already sold cannot be patched against this flaw.","Tangem said the method is a lab-only physical attack, noted that Donjon belongs to rival Ledger, and argued that the practical risk for everyday users is virtually non-existent.","The article advises users whose Tangem card is lost or stolen and holds serious value to move their funds using another card in the set or a seed phrase if available."],"insights":["Turning off Tangem’s recovery feature does not mitigate the issue, because the same recovery-mode check still runs on every card.","Tangem’s no-update design prevents remote tampering, but it also means firmware-level flaws such as this laser-reset issue cannot be corrected after cards are sold.","The practical danger is concentrated in a narrow scenario: a lost, stolen, or seized Tangem card that an attacker already has reason to believe holds enough value to justify an expensive invasive attack.","The attack targets wallet-maker code layered on top of a certified secure chip, showing that the chip’s EAL6+ certification does not cover all security decisions in the finished wallet product.","Unlike Tangem, Trezor and Tropic Square were able to respond to a related laser fault-injection finding with a stopgap for current chips and hardening for the next silicon version."],"referencedReports":[{"title":"Bypassing Tangem Card Security with Laser Attack","url":"https://donjon.ledger.com/blog/bypassing-tangem-card-security-with-laser-attack/","publisher":"Ledger Donjon","context":"The article relies on Donjon’s report describing the laser fault-injection method used to reset Tangem card passwords.","category":"","primary":false},{"title":"Trezor response: TROPIC01 chip disclosure, no impact to your funds","url":"https://trezor.io/blog/news/Trezor-response-TROPIC01-chip-disclosure-no-impact-to-your-funds","publisher":"Trezor","context":"The article cites this disclosure as a related laser fault-injection finding involving the TROPIC01 chip in the Trezor Safe 7.","category":"","primary":false},{"title":"Unfixable Key Extraction Attack on Trezor","url":"https://www.ledger.com/blog/unfixable-key-extraction-attack-on-trezor","publisher":"Ledger","context":"The article references this earlier Ledger work as an example of cheaper physical attacks against older Trezor wallets.","category":"","primary":false},{"title":"Tangem Genuine Check Bypass on Android Application","url":"https://www.ledger.com/tangem-genuine-check-bypass-on-android-application","publisher":"Ledger","context":"The article cites this as a prior Ledger finding on Tangem’s Android app that could be patched in software.","category":"","primary":false},{"title":"Brute Force Attack: Tangem","url":"https://www.ledger.com/blog-brute-force-attack-tangem","publisher":"Ledger","context":"The article cites this as an earlier Tangem password brute-force method that sits in the card firmware and cannot be changed.","category":"","primary":false}],"body":"\u003cp\u003eLedger’s Donjon security team showed that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card’s password to a value chosen by an attacker. Once reset, the attacker can control the wallet and move the coins out without knowing the old password or using a backup card. The attack requires physical possession of the card, cutting it open, specialized equipment estimated at about $250,000, and cannot be done over the internet.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is tied to Tangem’s password reset process, where the card checks whether it is in recovery mode before accepting a new password. Donjon found that a laser pulse can disturb the chip at the exact moment of that check, making the card behave as if it were in recovery mode when it is not. Turning recovery off does not help because the same check still runs on every card.\u003c/p\u003e\n\n\u003cp\u003eThe issue cannot be patched because Tangem cards do not support firmware updates, a design Tangem presents as protection against remote tampering. Tangem said the practical risk is virtually non-existent for everyday users because the method is lab-only, costly, invasive, and gives an attacker no easy way to know whether a stolen card holds significant value. The article says the main affected group is anyone whose Tangem card is lost or stolen and holds serious value, and advises moving funds using another card in the set or a seed phrase if one was set up.\u003c/p\u003e\n"},{"n":7,"title":"License plate cameras may be next target after Supreme Court reins in location tracking","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/license-plate-cameras-may-be-next-target-after-supreme-court-reins-in-location-tracking","time":"16:50","priority":"MAY READ","score":68,"tldr":"A recent Supreme Court ruling requiring warrants for cell phone geofence location searches could strengthen legal challenges to warrantless automated license plate reader searches. Experts say the decision may force courts to scrutinize ALPR networks as broad, retrospective surveillance systems, while Flock Safety argues its cameras are legally distinct because they capture vehicles in public view.","briefOverview":"\u003cp\u003eA recent Supreme Court ruling in Chatrie v. United States found that searches of cell phone location history require a warrant. The case involved Google providing police with a list of phones inside a geofence around a crime scene during a specific time period. Legal scholars and opponents of automated license plate readers say the ruling could affect how police use ALPR databases.\u003c/p\u003e\n\n\u003cp\u003eExperts quoted in the article say the ruling is significant because the court focused on the retrospective and indiscriminate nature of location surveillance, as well as the overall capabilities of the database. Flock Safety, the leading ALPR vendor in the United States, says it has between 90,000 and 100,000 cameras on public roadways and collects data on about 20 billion license plates each month. If courts ultimately require warrants for ALPR searches, experts say it would sharply limit how those camera networks are used and change modern policing.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety said the ruling is not relevant to its technology because Google location history comes from mobile devices and can show continuous movement across public and private places, while ALPR captures point-in-time images of vehicles in public view. The Supreme Court opinion said even a few hours of location history can reveal visits to private places such as a psychiatrist, abortion clinic, AIDS treatment center, strip club, or by-the-hour motel. Andrew Guthrie Ferguson said modern ALPR systems connect to broader police and public databases that may include social media activity, surveillance video, body camera footage, drone video, gunshot sensor data, and dashboard camera footage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Supreme Court’s Chatrie v. United States ruling found that searches of cell phone location history require a warrant and addressed law enforcement use of private location data.","Legal scholars and opponents of automated license plate readers say the Chatrie ruling could affect how police use ALPR databases because such systems collect retrospective and indiscriminate location information.","Flock Safety says it has between 90,000 and 100,000 cameras installed on public roadways and collects data on about 20 billion license plates per month.","Flock Safety said the Supreme Court decision is not relevant to its technology because ALPR captures point-in-time images of vehicles in public view, unlike Google location history from mobile devices.","Andrew Guthrie Ferguson said modern ALPR systems connect to larger police and public databases that can include social media activity, surveillance video, body camera footage, drone footage, gunshot sensor data, and dashboard camera footage."],"insights":["The Chatrie ruling may matter beyond geofence searches because the court emphasized the overall capabilities and contents of a surveillance database, not only the specific data police accessed in one case.","Even short time windows of location data were treated as potentially revealing private information, which undercuts arguments that brief or limited searches are automatically less sensitive.","The legal debate over ALPRs may turn on whether courts view license plate scans as isolated public-road snapshots or as part of a larger system that can reconstruct personal travel patterns and link to other police-held data.","A warrant requirement for ALPR searches would not merely change paperwork; experts quoted in the article say it would radically limit how camera networks are used and alter modern policing."],"referencedReports":[],"body":"\u003cp\u003eA recent Supreme Court ruling in Chatrie v. United States found that searches of cell phone location history require a warrant. The case involved Google providing police with a list of phones inside a geofence around a crime scene during a specific time period. Legal scholars and opponents of automated license plate readers say the ruling could affect how police use ALPR databases.\u003c/p\u003e\n\n\u003cp\u003eExperts quoted in the article say the ruling is significant because the court focused on the retrospective and indiscriminate nature of location surveillance, as well as the overall capabilities of the database. Flock Safety, the leading ALPR vendor in the United States, says it has between 90,000 and 100,000 cameras on public roadways and collects data on about 20 billion license plates each month. If courts ultimately require warrants for ALPR searches, experts say it would sharply limit how those camera networks are used and change modern policing.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety said the ruling is not relevant to its technology because Google location history comes from mobile devices and can show continuous movement across public and private places, while ALPR captures point-in-time images of vehicles in public view. The Supreme Court opinion said even a few hours of location history can reveal visits to private places such as a psychiatrist, abortion clinic, AIDS treatment center, strip club, or by-the-hour motel. Andrew Guthrie Ferguson said modern ALPR systems connect to broader police and public databases that may include social media activity, surveillance video, body camera footage, drone video, gunshot sensor data, and dashboard camera footage.\u003c/p\u003e\n"},{"n":3,"title":"Money launderer accused of stealing seized crypto while in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/money-launderer-accused-of-stealing-seized-crypto-while-in-prison/","time":"15:30","priority":"MAY READ","score":65,"tldr":"Bulgarian national Rossen Iossifov, already imprisoned for laundering funds from online auction fraud victims, has been charged with stealing $290,000 in government-seized cryptocurrency from behind bars. Prosecutors say he routed the funds through exchanges and mixing services to evade forfeiture, and he faces up to 25 more years if convicted.","briefOverview":"\u003cp\u003eBulgarian national Rossen G. Iossifov has been charged with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence. He appeared in federal court in the Eastern District of Kentucky on charges of removal of property to prevent seizure and conspiracy to commit money laundering. The U.S. Secret Service said the alleged attempt to remove and launder seized funds challenged the justice system and disregarded victims’ rights.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said that in January 2024, Iossifov allegedly conspired with others to move cryptocurrency from a seized account. The funds were allegedly routed through multiple crypto exchanges and mixing services to keep them out of the government’s hands. The cryptocurrency at issue was ordered forfeited, and Iossifov had also been ordered to pay more than $2.6 million in restitution to victims of his earlier scheme.\u003c/p\u003e\n\n\u003cp\u003eIossifov’s earlier conviction was tied to his ownership and operation of RG Coins, a cryptocurrency exchange in Sofia, Bulgaria. Prosecutors said clients included Romanian members of the Alexandria Online Auction Fraud Network, which posted fake Craigslist and eBay ads for high-value goods and victimized at least 900 Americans. Evidence showed Iossifov accommodated criminal clients by offering favorable exchange rates and allowing cash-for-cryptocurrency trades without identification or documentation of the source of funds. If convicted of the new charges, he faces a maximum of 25 years in prison.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bulgarian national Rossen G. Iossifov has been charged with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence.","Prosecutors allege that in January 2024, Iossifov conspired with others to move the cryptocurrency from a seized account through multiple crypto exchanges and mixing services.","Iossifov’s earlier conviction was tied to his operation of RG Coins, a cryptocurrency exchange in Sofia, Bulgaria, used by Romanian members of the Alexandria Online Auction Fraud Network.","The Alexandria Online Auction Fraud Network posted fake Craigslist and eBay ads for high-value goods, often vehicles, and victimized at least 900 Americans.","If convicted on the new charges of removal of property to prevent seizure and conspiracy to commit money laundering, Iossifov faces up to 25 years in prison."],"insights":["The case shows that government-seized cryptocurrency can remain a target for laundering attempts even after a defendant is already incarcerated and after the assets are subject to forfeiture.","Iossifov’s earlier exchange business allegedly enabled fraud by letting criminal clients trade cash for cryptocurrency without identification or proof of where the money came from.","The alleged use of multiple crypto exchanges and mixing services highlights how moving digital funds across services was central to the attempt to keep seized money out of government control.","The earlier fraud scheme combined ordinary consumer platforms, including Craigslist and eBay, with cryptocurrency conversion to move proceeds from victims to foreign money launderers."],"referencedReports":[],"body":"\u003cp\u003eBulgarian national Rossen G. Iossifov has been charged with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence. He appeared in federal court in the Eastern District of Kentucky on charges of removal of property to prevent seizure and conspiracy to commit money laundering. The U.S. Secret Service said the alleged attempt to remove and launder seized funds challenged the justice system and disregarded victims’ rights.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said that in January 2024, Iossifov allegedly conspired with others to move cryptocurrency from a seized account. The funds were allegedly routed through multiple crypto exchanges and mixing services to keep them out of the government’s hands. The cryptocurrency at issue was ordered forfeited, and Iossifov had also been ordered to pay more than $2.6 million in restitution to victims of his earlier scheme.\u003c/p\u003e\n\n\u003cp\u003eIossifov’s earlier conviction was tied to his ownership and operation of RG Coins, a cryptocurrency exchange in Sofia, Bulgaria. Prosecutors said clients included Romanian members of the Alexandria Online Auction Fraud Network, which posted fake Craigslist and eBay ads for high-value goods and victimized at least 900 Americans. Evidence showed Iossifov accommodated criminal clients by offering favorable exchange rates and allowing cash-for-cryptocurrency trades without identification or documentation of the source of funds. If convicted of the new charges, he faces a maximum of 25 years in prison.\u003c/p\u003e\n"},{"n":5,"title":"The Replicant in Your Directory: AI Agents and the Identity Security Gap","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-replicant-in-your-directory-ai-agents-and-the-identity-security-gap/","time":"14:00","priority":"MAY READ","score":55,"tldr":"AI agents and other machine identities are rapidly expanding enterprise identity footprints faster than traditional governance can manage, creating trusted access paths that attackers can abuse. Organizations need continuous ownership, access, and lifecycle controls for non-human identities, not just visibility.","briefOverview":"\u003cp\u003eThe article argues that security programs were built around human identity patterns, while AI agents and other machine identities do not follow the same lifecycle. It says AI agents, service accounts, OAuth applications, workload identities, and other machine identities already have accounts, permissions, and access to sensitive data. The article cites the Non-Human Identity Management Group as saying machine identities can outnumber human users by as much as 50 to one in many environments.\u003c/p\u003e\n\n\u003cp\u003eThe article uses a 2025 incident involving UNC6395 as an example of the risk created by trusted non-human identities. UNC6395 obtained an OAuth token associated with Salesloft\u0026rsquo;s Drift chat integration and used it to move through Salesforce environments across hundreds of organizations. The article says attackers then reached AWS credentials, Snowflake tokens, and other secrets stored where they should not have been.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI agents accelerate an existing identity security problem by creating identities, inheriting permissions, interacting across systems, and expanding the number of trusted credentials inside an environment. Netwrix’s 2026 Data and Identity Security Report found a 43% breach rate among organizations where AI significantly expanded identity counts, compared with 11% where AI had not significantly changed the identity footprint. The article concludes that security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that identity security programs were originally built around human lifecycle events, while AI agents, service accounts, OAuth applications, workload identities, and other machine identities often do not follow those patterns.","The Non-Human Identity Management Group says machine identities now outnumber human users by as much as 50 to one in many environments.","In 2025, the threat actor UNC6395 obtained an OAuth token associated with Salesloft's Drift chat integration and used it to move through Salesforce environments across hundreds of organizations.","Netwrix reported that organizations where AI significantly expanded the number of identities had a 43% breach rate over the previous year, compared with 11% among organizations where AI had not significantly changed their identity footprint.","The article says security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist."],"insights":["The article emphasizes that trusted tokens and machine identities can be dangerous even without a software vulnerability, because attackers can abuse access that systems already accept as legitimate.","The Netwrix report finding is counterintuitive: organizations that said AI greatly expanded their identity counts also reported stronger governance practices, yet still had a much higher breach rate.","AI agents increase risk not just by adding more accounts, but by creating identities, inheriting permissions, interacting across systems, and potentially generating additional downstream identities faster than traditional review processes can handle.","The article frames ownership as a central control gap, because an AI agent’s chain of accountability can disappear when it operates at machine speed across multiple systems."],"referencedReports":[{"title":"The Ultimate Guide to Non-Human Identities","url":"https://nhimg.org/the-ultimate-guide-to-non-human-identities#key-research-and-survey-results","publisher":"Non-Human Identity Management Group","context":"The article cites this source for the claim that machine identities can outnumber human users by as much as 50 to one in many environments.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that security programs were built around human identity patterns, while AI agents and other machine identities do not follow the same lifecycle. It says AI agents, service accounts, OAuth applications, workload identities, and other machine identities already have accounts, permissions, and access to sensitive data. The article cites the Non-Human Identity Management Group as saying machine identities can outnumber human users by as much as 50 to one in many environments.\u003c/p\u003e\n\n\u003cp\u003eThe article uses a 2025 incident involving UNC6395 as an example of the risk created by trusted non-human identities. UNC6395 obtained an OAuth token associated with Salesloft\u0026rsquo;s Drift chat integration and used it to move through Salesforce environments across hundreds of organizations. The article says attackers then reached AWS credentials, Snowflake tokens, and other secrets stored where they should not have been.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI agents accelerate an existing identity security problem by creating identities, inheriting permissions, interacting across systems, and expanding the number of trusted credentials inside an environment. Netwrix’s 2026 Data and Identity Security Report found a 43% breach rate among organizations where AI significantly expanded identity counts, compared with 11% where AI had not significantly changed the identity footprint. The article concludes that security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist.\u003c/p\u003e\n"}]</script>
