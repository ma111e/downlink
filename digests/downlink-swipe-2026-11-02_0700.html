<script type="application/json" id="dl-articles">[{"n":1,"title":"Ivanti patches two more Connect Secure zero-days chained in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ivanti-patches-two-more-connect-secure-zero-days-chained-in-attacks/","time":"09:33","priority":"MUST READ","score":96,"tldr":"Ivanti patched two additional Connect Secure zero-days, CVE-2026-111357 and CVE-2026-118527, that attackers chained with a previously patched authentication bypass to obtain unauthenticated root-level access. Administrators should urgently update exposed appliances, as exploitation has been observed since early October.","briefOverview":"\u003cp\u003eIvanti released updates for two Connect Secure flaws, CVE-2026-111357 and CVE-2026-118527, that attackers had chained in zero-day attacks since at least October 1. CVE-2026-111357 is a high-severity privilege-escalation issue, while CVE-2026-118527 allows authenticated attackers to upload files to an unpatched device. The flaws were used alongside CVE-2026-104935, an authentication-bypass vulnerability Ivanti patched the previous month.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that UTA0576 had chained the three flaws since at least October 3 to gain root-level code execution on fully patched Connect Secure devices without logging in. According to Volexity, the actor did not deploy malware or a web shell, instead re-exploiting devices for each command and tampering with logs to evade Ivanti\u0026rsquo;s Integrity Checker Tool. CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and ordered U.S. federal agencies to patch by Friday, while Shadowserver tracks more than 5,000 Internet-exposed Connect Secure instances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ivanti released patches for CVE-2026-111357, a high-severity privilege-escalation flaw, and CVE-2026-118527, which allows authenticated attackers to upload files to unpatched Connect Secure devices.","Attackers chained these two flaws with the previously patched CVE-2026-104935 authentication bypass to obtain unauthenticated root-level code execution on fully patched Connect Secure devices.","Volexity reported that the threat actor UTA0576 had used the vulnerability chain since at least October 3 and repeatedly re-exploited devices for commands while tampering with logs.","CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and directed U.S. federal agencies to patch affected systems by Friday.","Shadowserver tracks more than 5,000 Internet-exposed Ivanti Connect Secure instances, although the number secured against the ongoing attacks is unknown."],"insights":["Patching CVE-2026-104935 first removed the primary attack path, but Ivanti later disclosed that attackers had been combining it with two additional flaws, showing why organizations should apply the full set of Connect Secure updates rather than treating the earlier patch as sufficient.","UTA0576 reportedly did not deploy malware or a web shell; instead, it re-exploited the device for each command and altered logs, a method that Volexity said evaded Ivanti's Integrity Checker Tool.","The scale of potential exposure remains significant: Shadowserver observed more than 5,000 Internet-exposed Connect Secure instances, while the article says it is unknown how many have been secured.","CISA's addition of CVE-2026-104935 to its actively exploited vulnerabilities catalog and its deadline for federal agencies indicate that the issue is being treated as an urgent, active risk."],"referencedReports":[{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"ivanti","context":"Ivanti's updated security advisory explains that the company initially prioritized a fix for CVE-2026-104935 because it addressed the primary exploitation path.","category":"advisory","primary":true},{"title":"A Series of Unauthenticated Events: Chained Exploitation of Ivanti Connect Secure Zero-Days","url":"https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/","publisher":"volexity","context":"The article cites Volexity's technical analysis of UTA0576 chaining three Ivanti Connect Secure flaws for unauthenticated root-level code execution.","category":"research","primary":true}],"body":"\u003cp\u003eIvanti released updates for two Connect Secure flaws, CVE-2026-111357 and CVE-2026-118527, that attackers had chained in zero-day attacks since at least October 1. CVE-2026-111357 is a high-severity privilege-escalation issue, while CVE-2026-118527 allows authenticated attackers to upload files to an unpatched device. The flaws were used alongside CVE-2026-104935, an authentication-bypass vulnerability Ivanti patched the previous month.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that UTA0576 had chained the three flaws since at least October 3 to gain root-level code execution on fully patched Connect Secure devices without logging in. According to Volexity, the actor did not deploy malware or a web shell, instead re-exploiting devices for each command and tampering with logs to evade Ivanti\u0026rsquo;s Integrity Checker Tool. CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and ordered U.S. federal agencies to patch by Friday, while Shadowserver tracks more than 5,000 Internet-exposed Connect Secure instances.\u003c/p\u003e\n"},{"n":2,"title":"Critical Linux kernel TCP vulnerability can allow remote code execution (CVE-2026-98432)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/linux-kernel-tcp-rce-vulnerability-cve-2026-98432","time":"09:00","priority":"MUST READ","score":95,"tldr":"CVE-2026-98432 is a critical Linux kernel IPv4 TCP use-after-free flaw that may enable unauthenticated remote code execution on reachable MPTCP-enabled services. Install your vendor’s patched kernel and reboot immediately; disabling MPTCP and filtering IPv4 IP options are only temporary mitigations.","briefOverview":"\u003cp\u003eCVE-2026-98432 is a critical flaw in Linux kernel IPv4 TCP connection handling that affects kernel 4.4 and later. The Linux kernel CVE team rates it 9.8 out of 10, while vendor assessments vary because the issue relies on winning a timing race. Anthropic reported that an unreleased Claude research model produced an exploit that gained root-level command execution on a Linux server with an MPTCP listener. No vendor advisory had reported exploitation in the wild as of October 29, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when the kernel can free connection-related IP-options memory while another processor is still using it, potentially allowing memory disclosure, memory corruption, or a crash. Internet-reachable Linux hosts with IPv4 TCP ports are affected, including cloud virtual machines and the underlying nodes that run containers; a proxy on the same host does not prevent the kernel from handling the connection. The complete remediation is to install the vendor-patched kernel and reboot into it, while disabling MPTCP or dropping IPv4 packets carrying IP options are temporary measures. Operators should verify the running kernel with \u003ccode\u003euname -r\u003c/code\u003e, because installing an update without rebooting does not activate the fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-98432 is a Linux kernel IPv4 TCP use-after-free flaw affecting kernel version 4.4 and later, which the kernel CVE team rates 9.8 out of 10.","Anthropic reported that an unreleased Claude research model produced an exploit that achieved root-level command execution on a Linux server with an MPTCP listener.","Installing a vendor-patched kernel and rebooting is the complete remediation, while disabling MPTCP or dropping IPv4 packets with IP options are temporary exposure-reduction measures.","Internet-reachable Linux hosts, including EC2 instances, ECS container instances, and EKS nodes, are affected when they expose an IPv4 TCP port; the container host kernel is what matters for containers.","No vendor advisory had reported exploitation in the wild as of October 29, 2026."],"insights":["Go 1.24 and later programs request MPTCP listeners by default where the kernel permits it, which can expose a Go server even if its operator did not intentionally enable that feature.","A proxy running on the same Linux host does not protect that host, because its kernel still processes the incoming TCP connection before the proxy handles application traffic.","An installed kernel update is not sufficient until the machine restarts into it; the article notes that a host may appear fixed in scanning results even though it is still running the old kernel.","According to Anthropic, a failed attempt at the timing-dependent exploit only fails that connection attempt rather than crashing the target, allowing an attacker to keep retrying.","For containers, the relevant software to patch is the Linux kernel on the underlying node, not the container image itself."],"referencedReports":[{"title":"Discovering Vulnerabilities with Claude","url":"https://www.anthropic.com/research/discovering-vulnerabilities-with-claude","publisher":"anthropic","context":"The article cites Anthropic's research for its report that an unreleased Claude model produced an exploit achieving root-level command execution against a Linux server with an MPTCP listener.","category":"research","primary":true},{"title":"AWS Security Bulletin 2026-160","url":"https://aws.amazon.com/security/security-bulletins/2026-160-aws/","publisher":"aws","context":"The article relies on AWS's advisory for remediation guidance, affected AWS services, interim mitigations, and exposure details.","category":"advisory","primary":true},{"title":"CVE-2026-98432","url":"https://ubuntu.com/security/CVE-2026-98432","publisher":"canonical","context":"The article cites Ubuntu's CVE tracker for distribution fix status and its listed CVSS 4.0 severity vector.","category":"advisory","primary":false},{"title":"CVE-2026-98432 Linux Kernel IPv4 TCP Flaw Status for CloudLinux","url":"https://blog.cloudlinux.com/cve-2026-98432-linux-kernel-ipv4-tcp-flaw-status-for-cloudlinux","publisher":"cloudlinux","context":"The article references CloudLinux's kernel-team analysis stating that it could not reproduce Anthropic's exploit claim.","category":"research","primary":false}],"body":"\u003cp\u003eCVE-2026-98432 is a critical flaw in Linux kernel IPv4 TCP connection handling that affects kernel 4.4 and later. The Linux kernel CVE team rates it 9.8 out of 10, while vendor assessments vary because the issue relies on winning a timing race. Anthropic reported that an unreleased Claude research model produced an exploit that gained root-level command execution on a Linux server with an MPTCP listener. No vendor advisory had reported exploitation in the wild as of October 29, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when the kernel can free connection-related IP-options memory while another processor is still using it, potentially allowing memory disclosure, memory corruption, or a crash. Internet-reachable Linux hosts with IPv4 TCP ports are affected, including cloud virtual machines and the underlying nodes that run containers; a proxy on the same host does not prevent the kernel from handling the connection. The complete remediation is to install the vendor-patched kernel and reboot into it, while disabling MPTCP or dropping IPv4 packets carrying IP options are temporary measures. Operators should verify the running kernel with \u003ccode\u003euname -r\u003c/code\u003e, because installing an update without rebooting does not activate the fix.\u003c/p\u003e\n"},{"n":3,"title":"CyberStrikeAI in the wild: the use of AI in real-world attacks on organizations","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/cyberstrikeai-attacks/121715/","time":"08:00","priority":"SHOULD READ","score":85,"tldr":"Kaspersky documented a real-world campaign against education-sector organizations in Africa and Latin America in which attackers used the open-source CyberStrikeAI framework to have a server-side LLM orchestrate post-exploitation actions through conventional C2 implants. The AI did not introduce novel on-host techniques, but accelerated familiar domain-compromise steps including reconnaissance, credential dumping, lateral movement, and data collection.","briefOverview":"\u003cp\u003eKaspersky identified a campaign targeting education-sector organizations in several countries across Africa and Latin America that used the open-source CyberStrikeAI framework during post-exploitation. Attackers initially gained access through a compromised SQL Server, conducted manual reconnaissance, and later deployed a CyberStrikeAI implant. The framework uses a large language model on the command-and-control server to plan actions, select tools, and generate commands, while the implant executes those commands on compromised hosts.\u003c/p\u003e\n\n\u003cp\u003eIn the observed incident, the attackers established persistence and performed local reconnaissance within minutes, conducted domain reconnaissance over several hours, and later performed lateral movement, credential dumping, and database export. They used familiar techniques including PowerShell, scheduled tasks, WMI, SMB, LSASS dumping through comsvcs.dll, DCSync, Golden Ticket attacks, and SQL and LDAP queries. Kaspersky concluded that AI orchestration can make these activities faster and lower the skill barrier for operators, but the on-host behaviors remain recognizable through established endpoint and network detection methods.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a campaign targeting education-sector organizations in several countries across Africa and Latin America that used the open-source CyberStrikeAI framework during post-exploitation.","CyberStrikeAI uses a server-side large language model to plan actions, select tools, and generate commands, while a conventional implant on compromised hosts executes those commands.","In one incident, attackers moved from deploying the CyberStrikeAI agent to persistence and local reconnaissance within two minutes, domain reconnaissance over five hours, and lateral movement, credential dumping, and database export within about one hour during the final stage.","The attackers used familiar techniques including scheduled tasks, PowerShell, WMI, SMB, LSASS memory dumping, DCSync, Golden Ticket attacks, and SQL and LDAP queries.","Kaspersky could not link the activity to a known threat group, although Chinese-language script comments, use of Chinese services, and server restart timing suggested a possible Chinese-speaking operator."],"insights":["The AI component operated entirely on the attackers’ control server, so infected computers showed conventional command-and-control activity rather than local AI-service requests or unusual resource use.","Because the framework’s LLM can generate different forms of the same command and can remove an individual operator’s stylistic patterns, command behavior is less useful for attribution than build metadata and network artifacts.","A CyberStrikeAI server generates a new self-signed TLS certificate at every startup, making its certificate not_before value useful for reconstructing server restart chronology from scan history.","The implant’s fixed X-Implant-Token HTTP header is embedded at build time and can link payloads and network activity to the same command-and-control server.","The article concludes that established detection for scheduled tasks, LSASS dumping, WMI-based remote execution, LDAP reconnaissance, and similar behaviors remains effective because the AI orchestrator uses familiar post-compromise techniques."],"referencedReports":[],"body":"\u003cp\u003eKaspersky identified a campaign targeting education-sector organizations in several countries across Africa and Latin America that used the open-source CyberStrikeAI framework during post-exploitation. Attackers initially gained access through a compromised SQL Server, conducted manual reconnaissance, and later deployed a CyberStrikeAI implant. The framework uses a large language model on the command-and-control server to plan actions, select tools, and generate commands, while the implant executes those commands on compromised hosts.\u003c/p\u003e\n\n\u003cp\u003eIn the observed incident, the attackers established persistence and performed local reconnaissance within minutes, conducted domain reconnaissance over several hours, and later performed lateral movement, credential dumping, and database export. They used familiar techniques including PowerShell, scheduled tasks, WMI, SMB, LSASS dumping through comsvcs.dll, DCSync, Golden Ticket attacks, and SQL and LDAP queries. Kaspersky concluded that AI orchestration can make these activities faster and lower the skill barrier for operators, but the on-host behaviors remain recognizable through established endpoint and network detection methods.\u003c/p\u003e\n"}]</script>
