<script type="application/json" id="dl-articles">[{"n":1,"title":"OpenMandriva Linux says contributor tried to sabotage the project","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/openmandriva-linux-says-contributor-tried-to-sabotage-the-project/","time":"22:14","priority":"MAY READ","score":72,"tldr":"OpenMandriva says a former contributor attempted to sabotage the Linux distribution by deleting GitHub repositories and pushing an empty package that could have disrupted GNOME and Cosmic desktop packages for users. The contributor denies intending harm, while the project is restoring affected repositories and auditing for further unauthorized changes.","briefOverview":"\u003cp\u003eThe OpenMandriva Linux project said it was targeted by an attempted act of internal sabotage after a dispute among contributors. According to OpenMandriva maintainer AngryPenguin, the incident followed abusive behavior toward certain users and project members that caused some people to leave. The project said the attempted destructive action included wiping GitHub repositories and pushing an empty package that could have damaged users’ systems.\u003c/p\u003e\n\n\u003cp\u003eAngryPenguin said Davide Beatrici, the lead developer of the Mumble instant messaging app and a friend of the alleged attacker, deleted part of a repository the OpenMandriva team had worked on for almost a decade. Beatrici had administrative privileges because he had previously helped migrate and mirror project repositories to his private OneDev instance. The article says he also published an empty package in the Cooker repository that obsoleted the packages for the Gnome and Cosmic desktop environments.\u003c/p\u003e\n\n\u003cp\u003eThe OpenMandriva team said it is restoring deleted repositories and packages and conducting a full system audit to identify any other unauthorized changes. Beatrici rejected the sabotage claims in a statement to The Lunduke Journal, saying he did not intend to harm the OpenMandriva community or its users. AngryPenguin said the team considers Beatrici’s actions a criminal offense but has decided not to pursue legal action.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The OpenMandriva Linux project said it was targeted by an attempted internal sabotage following a dispute among contributors.","OpenMandriva maintainer AngryPenguin said Davide Beatrici deleted part of a repository the team had worked on for almost a decade after previously receiving administrative privileges to help migrate and mirror repositories to his private OneDev instance.","AngryPenguin said Beatrici also published an empty package in the Cooker repository that obsoleted packages for the GNOME and Cosmic desktop environments.","The OpenMandriva team said it is restoring deleted repositories and packages and conducting a full system audit for other unauthorized changes.","Beatrici rejected the sabotage claims in a statement to The Lunduke Journal, saying he did not intend to harm OpenMandriva or its users."],"insights":["The alleged sabotage was possible because a contributor retained administrative privileges after helping migrate and mirror OpenMandriva repositories to a private OneDev instance.","The action was not limited to deleting source repositories; it also involved publishing an empty package in the development repository that could have affected desktop environment packages.","OpenMandriva is responding with both restoration work and a full system audit, indicating the team is treating the incident as potentially broader than the already identified repository and package changes.","Although OpenMandriva said the actions constitute a criminal offense, the team stated it will not pursue legal action against the former contributor."],"referencedReports":[],"body":"\u003cp\u003eThe OpenMandriva Linux project said it was targeted by an attempted act of internal sabotage after a dispute among contributors. According to OpenMandriva maintainer AngryPenguin, the incident followed abusive behavior toward certain users and project members that caused some people to leave. The project said the attempted destructive action included wiping GitHub repositories and pushing an empty package that could have damaged users’ systems.\u003c/p\u003e\n\n\u003cp\u003eAngryPenguin said Davide Beatrici, the lead developer of the Mumble instant messaging app and a friend of the alleged attacker, deleted part of a repository the OpenMandriva team had worked on for almost a decade. Beatrici had administrative privileges because he had previously helped migrate and mirror project repositories to his private OneDev instance. The article says he also published an empty package in the Cooker repository that obsoleted the packages for the Gnome and Cosmic desktop environments.\u003c/p\u003e\n\n\u003cp\u003eThe OpenMandriva team said it is restoring deleted repositories and packages and conducting a full system audit to identify any other unauthorized changes. Beatrici rejected the sabotage claims in a statement to The Lunduke Journal, saying he did not intend to harm the OpenMandriva community or its users. AngryPenguin said the team considers Beatrici’s actions a criminal offense but has decided not to pursue legal action.\u003c/p\u003e\n"}]</script>
