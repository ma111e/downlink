<script type="application/json" id="dl-articles">[{"n":1,"title":"A Valid DKIM Signature Over an Unauthorized Message","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/tenant-resigning-launders-failed-origin-hop-nested-eml-qr-phish","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing email passed SPF, DKIM, DMARC, and Microsoft composite authentication because it was accepted into a legitimate Microsoft 365 tenant and re-signed before delivery, despite originating from an unauthenticated host. The case shows that clean email authentication proves custody by trusted infrastructure, not that the message was authorized or safe.","briefOverview":"\u003cp\u003eA senior executive at a mid-size food and beverage products company received a spearphishing email that passed SPF, DKIM, DMARC, and Microsoft composite authentication. The message claimed to concern a quarterly earnings reconciliation and benefits update, but its only payload was an attached message file named \u003ccode\u003eEarnings_Adjustment.eml\u003c/code\u003e. The attachment scanned clean and contained a fake compensation-update notice with a QR code leading to a credential-harvesting page.\u003c/p\u003e\n\n\u003cp\u003eThe significant issue was that one earlier hop had failed authentication completely. The originating host had no reverse DNS, used the HELO string \u003ccode\u003espeedy-negotiation\u003c/code\u003e, was not authorized to send for the claimed domain, failed SPF, had no DKIM signature, and failed DMARC. The message was then accepted into the claimed sending domain’s Microsoft 365 tenant and relayed outbound through Exchange Online, where Microsoft infrastructure applied a genuine DKIM signature and produced a genuine SPF pass.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the final authentication pass proved a real tenant relayed the message, but did not prove the tenant authorized it or that the content was safe. The ARC chain preserved the original failing result, but the recipient’s clean pass came from a freshly generated signature over the malicious content, not from ARC. Detection was difficult because the visible links were Microsoft links, the attachment scanned clean, and the QR-code destination existed only as image data inside an HTML body inside the attached message file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A senior executive at a mid-size food and beverage products company received a message that passed SPF, DKIM, DMARC, and Microsoft composite authentication cleanly.","One hop earlier, the message came from a host with no reverse DNS, the HELO string “speedy-negotiation,” and failed SPF, DKIM, and DMARC checks.","The message was accepted into the claimed sending domain’s Microsoft 365 tenant and then relayed outbound through Exchange Online, where it received a legitimate DKIM signature and SPF pass.","The payload was a clean-scanning attachment named “Earnings_Adjustment.eml” that rendered a fake compensation-update notice containing a QR code for a credential-harvesting site.","The article states that clean email authentication proved a real tenant relayed the message, but did not prove the tenant authorized it or that the message was safe."],"insights":["The earliest authentication results and the ARC result set at index one preserved the original failing verdict even though the final delivered message showed clean authentication passes.","The case was not an ARC trust issue because the recipient’s pass came from a newly generated legitimate DKIM signature by the sending tenant, not from a downstream system vouching for earlier results.","QR-code payloads can evade normal link extraction when the destination exists only as image data inside an HTML body inside an attached message file.","The article frames clean authentication as evidence of custody rather than intent, meaning it can show that real infrastructure handled a message without showing that the message was supposed to be sent.","Detection depended mainly on behavioral and language signals plus the recipient’s seniority because the attachment scanned clean, the visible links belonged to Microsoft, and authentication appeared flawless."],"referencedReports":[{"title":"RFC 9989","url":"https://datatracker.ietf.org/doc/html/rfc9989","publisher":"IETF","context":"The article cites RFC 9989 to explain that DMARC evaluates alignment between authenticated identifiers and the visible From domain, not whether the infrastructure was supposed to send the message.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance to support treating a clean authentication pass as evidence of message custody rather than sender intent.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior executive at a mid-size food and beverage products company received a spearphishing email that passed SPF, DKIM, DMARC, and Microsoft composite authentication. The message claimed to concern a quarterly earnings reconciliation and benefits update, but its only payload was an attached message file named \u003ccode\u003eEarnings_Adjustment.eml\u003c/code\u003e. The attachment scanned clean and contained a fake compensation-update notice with a QR code leading to a credential-harvesting page.\u003c/p\u003e\n\n\u003cp\u003eThe significant issue was that one earlier hop had failed authentication completely. The originating host had no reverse DNS, used the HELO string \u003ccode\u003espeedy-negotiation\u003c/code\u003e, was not authorized to send for the claimed domain, failed SPF, had no DKIM signature, and failed DMARC. The message was then accepted into the claimed sending domain’s Microsoft 365 tenant and relayed outbound through Exchange Online, where Microsoft infrastructure applied a genuine DKIM signature and produced a genuine SPF pass.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the final authentication pass proved a real tenant relayed the message, but did not prove the tenant authorized it or that the content was safe. The ARC chain preserved the original failing result, but the recipient’s clean pass came from a freshly generated signature over the malicious content, not from ARC. Detection was difficult because the visible links were Microsoft links, the attachment scanned clean, and the QR-code destination existed only as image data inside an HTML body inside the attached message file.\u003c/p\u003e\n"},{"n":2,"title":"Good riddance, TeamPCP. Now for the hard part.","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/teampcp-arrested-supply-chain","time":"11:40","priority":"SHOULD READ","score":78,"tldr":"Australian and U.S. authorities have arrested two men allegedly behind TeamPCP, bringing relief after months of damaging supply-chain attacks. The author argues the bigger challenge remains: small, immature groups can now use modern tooling and LLMs to cause harm faster than institutions can respond.","briefOverview":"\u003cp\u003eThe article reacts to news from the Australian Federal Police, the Federal Bureau of Investigation, and the Western Australia Police Force that two men in their early 20s were arrested and alleged to be behind TeamPCP. The author says the past six months of attacks, especially from TeamPCP, caused significant harm and disruption to companies and individuals. The piece frames the arrests as a relief, while stressing that the damage caused by the attacks should not be treated as a good thing.\u003c/p\u003e\n\n\u003cp\u003eThe author clarifies that there are no indications TeamPCP was behind the original S1ngularity and Shai-Hulud attacks from the summer of 2025. According to the article, TeamPCP cloned the worm, which contributed to reports that they were behind Shai-Hulud attacks, but the original attacks remain distinct and unattributed. The author also describes TeamPCP as a strange actor that mixed money, politics, disruption, ego, and attention-seeking rather than fitting neatly into categories like state actor, organized cybercrime, or ideology.\u003c/p\u003e\n\n\u003cp\u003eA central point is that TeamPCP was not especially sophisticated, but was dangerous because it could quickly turn public exploits, techniques, research, and malware ideas into operations. The article says LLMs appear to have helped close the gap between seeing an attack technique and deploying it at scale. The author argues that technical defenses can contain incidents but cannot create accountability on their own, making institutions and law enforcement important even though they move much more slowly than attackers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Australian Federal Police, the FBI, and the Western Australia Police Force announced the arrest of two men in their early 20s who they allege are behind TeamPCP.","The article states there are no indications that TeamPCP was behind the original S1ngularity and Shai-Hulud attacks, although TeamPCP did clone the worm.","The author says TeamPCP caused significant harm and disruption to companies and individuals over the last six months.","The article describes TeamPCP as a strange threat actor that mixed money, politics, disruption, ego, and attention-seeking, while relying on public exploits, techniques, research, and malware ideas rather than exceptional sophistication.","The author argues that LLMs can help relatively immature actors gain and use harmful capabilities faster, while law enforcement and institutions require much longer timelines to build evidence and impose consequences."],"insights":["The article emphasizes that attackers do not need exceptional sophistication to be dangerous if they can rapidly turn public research, exploit ideas, and malware concepts into large-scale operations.","The author separates long-term ecosystem improvements from the attacks themselves, arguing that even if damaging incidents force better defenses, the harm to companies and individuals should not be treated as beneficial.","The article highlights a timing mismatch as a core security problem: small groups can move from idea to campaign in hours or days, while cross-border investigations and durable legal outcomes can take months or years.","The author frames unwanted attention from criminal groups as a real operational and personal risk rather than a form of status or validation.","The article argues that technical defenses alone are insufficient because they can contain incidents but cannot create accountability without functioning institutions."],"referencedReports":[],"body":"\u003cp\u003eThe article reacts to news from the Australian Federal Police, the Federal Bureau of Investigation, and the Western Australia Police Force that two men in their early 20s were arrested and alleged to be behind TeamPCP. The author says the past six months of attacks, especially from TeamPCP, caused significant harm and disruption to companies and individuals. The piece frames the arrests as a relief, while stressing that the damage caused by the attacks should not be treated as a good thing.\u003c/p\u003e\n\n\u003cp\u003eThe author clarifies that there are no indications TeamPCP was behind the original S1ngularity and Shai-Hulud attacks from the summer of 2025. According to the article, TeamPCP cloned the worm, which contributed to reports that they were behind Shai-Hulud attacks, but the original attacks remain distinct and unattributed. The author also describes TeamPCP as a strange actor that mixed money, politics, disruption, ego, and attention-seeking rather than fitting neatly into categories like state actor, organized cybercrime, or ideology.\u003c/p\u003e\n\n\u003cp\u003eA central point is that TeamPCP was not especially sophisticated, but was dangerous because it could quickly turn public exploits, techniques, research, and malware ideas into operations. The article says LLMs appear to have helped close the gap between seeing an attack technique and deploying it at scale. The author argues that technical defenses can contain incidents but cannot create accountability on their own, making institutions and law enforcement important even though they move much more slowly than attackers.\u003c/p\u003e\n"},{"n":3,"title":"Threat landscape for industrial automation systems. Q2 2026","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/industrial-threat-report-q2-2026/121159/","time":"10:05","priority":"MAY READ","score":58,"tldr":"Kaspersky reports that the share of ICS computers blocking malicious objects fell to 19.15% in Q2 2026, the lowest level since 2022, though email threats and several categories including ransomware, worms, malicious documents, and AutoCAD malware increased. Biometrics remained the most affected sector, while Africa and East Asia showed notable regional risk growth.","briefOverview":"\u003cp\u003eIn Q2 2026, the percentage of ICS computers on which malicious objects were blocked continued to decrease, falling to 19.15%, the lowest level since 2022. Regionally, the percentages ranged from 8.1% in Northern Europe to 27.9% in Africa. The figures increased in five regions over the quarter, most notably in East Asia and Africa.\u003c/p\u003e\n\n\u003cp\u003eKaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems during the quarter. The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats. In biometrics, unlike other industries, the percentage of affected ICS computers for email threats exceeded that for internet threats.\u003c/p\u003e\n\n\u003cp\u003eSeveral threat categories increased over the quarter, including denylisted internet resources, malicious documents, worms, ransomware, and malware for AutoCAD. Among main threat sources, only email increased, reaching 2.84%, while internet threats decreased to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%. Miners reached their lowest levels since 2021 for both Windows executable miners and browser-based web miners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In Q2 2026, the percentage of ICS computers on which malicious objects were blocked fell to 19.15%, its lowest level since 2022.","Regionally, the share of attacked ICS computers ranged from 8.1% in Northern Europe to 27.9% in Africa, with increases over the quarter in five regions including East Asia and Africa.","The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for several categories including malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats.","Kaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems in Q2 2026.","Among main threat sources, only email increased in Q2 2026, while internet threats fell to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%."],"insights":["The biometrics sector stands out because its email-threat rate exceeds its internet-threat rate, unlike other surveyed industries, and it also has the highest overall share of affected ICS computers.","East Asia’s risk profile broadened in Q2 2026, with increases across all threat categories except miners and leading growth in malicious scripts and phishing pages, spyware, viruses, and internet-sourced threats.","Denylisted internet resources rose globally for the second consecutive quarter and increased in every region, even as the overall percentage of attacked ICS computers continued to decline.","Ransomware increased in nearly all regions despite remaining a low-percentage category globally, and Russia’s biometric systems reached the highest ransomware level reported across all industries and regions at 1.22%.","Miners reached their lowest levels since 2021 in both Windows executable and browser-based forms, while the oil and gas industry still led all selected industries for both miner categories."],"referencedReports":[],"body":"\u003cp\u003eIn Q2 2026, the percentage of ICS computers on which malicious objects were blocked continued to decrease, falling to 19.15%, the lowest level since 2022. Regionally, the percentages ranged from 8.1% in Northern Europe to 27.9% in Africa. The figures increased in five regions over the quarter, most notably in East Asia and Africa.\u003c/p\u003e\n\n\u003cp\u003eKaspersky security solutions blocked malware from 10,904 different malware families on industrial automation systems during the quarter. The biometrics sector had the highest percentage of ICS computers with blocked malicious objects at 26.44% and led among industries for malicious scripts and phishing pages, malicious documents, spyware, ransomware, worms, and email threats. In biometrics, unlike other industries, the percentage of affected ICS computers for email threats exceeded that for internet threats.\u003c/p\u003e\n\n\u003cp\u003eSeveral threat categories increased over the quarter, including denylisted internet resources, malicious documents, worms, ransomware, and malware for AutoCAD. Among main threat sources, only email increased, reaching 2.84%, while internet threats decreased to 7.61%, removable media threats fell to 0.24%, and network-folder threats fell to 0.023%. Miners reached their lowest levels since 2021 for both Windows executable miners and browser-based web miners.\u003c/p\u003e\n"},{"n":4,"title":"JavaScript obfuscation: From party trick to phishing kit","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/javascript-obfuscation-from-party-trick-to-phishing-kit/","time":"10:00","priority":"MAY READ","score":55,"tldr":"Obfuscated JavaScript often hides phishing, malware, or supply-chain behavior behind encoded strings, runtime code generation, confusing control flow, and anti-analysis tricks. The key is to analyze it safely and methodically: preserve the original, beautify only as a first step, extract strings, capture generated payloads, and observe behavior in a controlled environment.","briefOverview":"\u003cp\u003eThe article explains how obfuscated JavaScript preserves execution while making intent difficult to understand. It describes code that replaces clear logic with string arrays, encoded URLs, runtime decoders, strangely named functions, and execution through mechanisms such as \u003ccode\u003eeval()\u003c/code\u003e. The author frames this as a recurring problem in phishing pages, malware loaders, compromised sites, suspicious browser scripts, and some legitimate software protection.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that suspicious JavaScript should be treated as hostile before analysis begins. Analysts should preserve the original, work on a safe copy, and avoid running unknown code on a normal machine, browser profile, or environment containing credentials, tokens, clipboard contents, SSH agents, cloud credentials, or corporate proxy details. It also warns that AI tools can help explain isolated snippets and recovered payloads, but they are not sandboxes or evidence sources by themselves.\u003c/p\u003e\n\n\u003cp\u003eTechnically, the article walks through common techniques such as string hiding, lookup tables, dynamic property access, runtime code generation, control-flow flattening, anti-debugging checks, dead code, JSFuck, and output from tools like \u003ccode\u003ejavascript-obfuscator\u003c/code\u003e or \u003ccode\u003eobfuscator.io\u003c/code\u003e. It emphasizes that beautifying code is only a first step because it does not recover original names, decode runtime strings, or restore hidden control flow. The recommended workflow is to extract strings, identify execution sinks, capture generated payloads, observe behavior in a controlled environment, and repeat until the hidden behavior becomes observable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Obfuscated JavaScript preserves execution while obscuring intent by stripping context, ruining names, hiding strings, and pushing real behavior into runtime.","The article says suspicious JavaScript samples should be treated as hostile, copied safely, and not run on a normal machine, browser profile, or environment containing credentials or tokens.","Beautifying JavaScript can restore indentation and readability, but it cannot recover original variable names, decode runtime strings, rebuild removed structure, or reverse hostile control flow.","Common obfuscation techniques include hidden strings, lookup tables, dynamic property access, runtime code generation, control-flow flattening, anti-debugging checks, and dead code.","The recommended workflow is to preserve the original, work on a safe copy, beautify as a first pass, extract strings, identify execution sinks, capture generated payloads, observe behavior in a controlled environment, and repeat until hidden behavior is exposed."],"insights":["The article emphasizes that analysts should not spend too long studying an obfuscation wrapper; they should find the unpacking step, replace the execution sink, log the payload, and analyze the next layer.","AI tools are useful for decoding small blocks, renaming variables, collapsing lookup tables, and summarizing recovered payloads, but the article warns that they are neither a sandbox nor an evidence source by themselves.","The npm context raises the stakes because obfuscated JavaScript can run during install or build steps and access environment variables, files, tokens, SSH keys, and CI secrets rather than only browser data.","Anti-analysis code does not need to be unbeatable to be effective; the article notes that it may only need to outlast the first five minutes of inspection.","The article advises focusing on what obfuscated constructs produce at runtime, especially for JSFuck and generated code, rather than treating the strange encoding itself as the main subject of analysis."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how obfuscated JavaScript preserves execution while making intent difficult to understand. It describes code that replaces clear logic with string arrays, encoded URLs, runtime decoders, strangely named functions, and execution through mechanisms such as \u003ccode\u003eeval()\u003c/code\u003e. The author frames this as a recurring problem in phishing pages, malware loaders, compromised sites, suspicious browser scripts, and some legitimate software protection.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that suspicious JavaScript should be treated as hostile before analysis begins. Analysts should preserve the original, work on a safe copy, and avoid running unknown code on a normal machine, browser profile, or environment containing credentials, tokens, clipboard contents, SSH agents, cloud credentials, or corporate proxy details. It also warns that AI tools can help explain isolated snippets and recovered payloads, but they are not sandboxes or evidence sources by themselves.\u003c/p\u003e\n\n\u003cp\u003eTechnically, the article walks through common techniques such as string hiding, lookup tables, dynamic property access, runtime code generation, control-flow flattening, anti-debugging checks, dead code, JSFuck, and output from tools like \u003ccode\u003ejavascript-obfuscator\u003c/code\u003e or \u003ccode\u003eobfuscator.io\u003c/code\u003e. It emphasizes that beautifying code is only a first step because it does not recover original names, decode runtime strings, or restore hidden control flow. The recommended workflow is to extract strings, identify execution sinks, capture generated payloads, observe behavior in a controlled environment, and repeat until the hidden behavior becomes observable.\u003c/p\u003e\n"}]</script>
