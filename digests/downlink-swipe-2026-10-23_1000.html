<script type="application/json" id="dl-articles">[{"n":1,"title":"Go With the Flow: Taking a Shadow Dependency in GCP Dataflow Cross Tenant","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/shadow-dependency-in-gcp-dataflow-cross-tenant","time":"13:18","priority":"SHOULD READ","score":82,"tldr":"Varonis found that attackers could squat predictable Google Cloud Dataflow staging buckets and, by replacing a Python pickled session artifact, achieve cross-tenant code execution on victim Dataflow workers. Google has globally mitigated the issue with bucket ownership validation and staged-artifact integrity checks.","briefOverview":"\u003cp\u003eVaronis Threat Labs found a cross-tenant Google Cloud Dataflow issue involving predictable default staging-bucket names in Apache Beam’s Python SDK. An attacker who knew a target’s GCP project ID and likely region could create the corresponding bucket first in an attacker-controlled project. If the victim later ran its first eligible Dataflow job in that region without specifying a staging location, Beam could reuse the attacker-owned bucket.\u003c/p\u003e\n\n\u003cp\u003eThe attack also required a Python pipeline using \u003ccode\u003e--save_main_session\u003c/code\u003e, which stages a pickled session file for Dataflow workers. An attacker with write access to the squatted bucket could detect the legitimate file, replace it with a malicious pickle, and cause workers to run attacker-controlled code when they loaded it. Google has rolled out Python SDK ownership checks, server-side validation for default staging buckets, and SHA-256 integrity checks for staged artifacts, while warning that explicitly configured buckets must still be secured because they remain part of the code supply chain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs identified a cross-tenant Google Cloud Dataflow issue in which predictable default staging-bucket names could be squatted by an attacker.","The attack required a Beam Python SDK pipeline using --save_main_session, no explicitly configured staging bucket, and the project’s first default-bucket Dataflow job in the relevant region.","An attacker could replace the staged pickled_main_session file with a malicious Python pickle that executes code when Dataflow workers deserialize it.","Successful exploitation could expose the Dataflow worker service account’s identity and access token and enable code execution on workers, including autoscaled workers.","Google globally deployed default-bucket ownership validation and SHA-256 integrity verification for staged artifacts, including protections for older or pinned Beam SDK versions."],"insights":["A target’s GCP project ID, which is often publicly visible or guessable, was sufficient to calculate the future default staging-bucket name because the naming scheme used the project ID and region deterministically.","The exposure was limited to a project’s first Dataflow use of the default bucket in a region: once the project had created that bucket, another party could no longer claim the name.","Beam’s Java SDK already verified bucket ownership, while the Python SDK did not perform that check before the reported fix.","Google’s server-side ownership enforcement protects customers using older or pinned Beam SDK versions, rather than requiring every affected customer to upgrade first.","Explicitly configured staging and temporary buckets remain outside the automatic ownership checks, so their write permissions must be treated like control over the pipeline’s source code."],"referencedReports":[],"body":"\u003cp\u003eVaronis Threat Labs found a cross-tenant Google Cloud Dataflow issue involving predictable default staging-bucket names in Apache Beam’s Python SDK. An attacker who knew a target’s GCP project ID and likely region could create the corresponding bucket first in an attacker-controlled project. If the victim later ran its first eligible Dataflow job in that region without specifying a staging location, Beam could reuse the attacker-owned bucket.\u003c/p\u003e\n\n\u003cp\u003eThe attack also required a Python pipeline using \u003ccode\u003e--save_main_session\u003c/code\u003e, which stages a pickled session file for Dataflow workers. An attacker with write access to the squatted bucket could detect the legitimate file, replace it with a malicious pickle, and cause workers to run attacker-controlled code when they loaded it. Google has rolled out Python SDK ownership checks, server-side validation for default staging buckets, and SHA-256 integrity checks for staged artifacts, while warning that explicitly configured buckets must still be secured because they remain part of the code supply chain.\u003c/p\u003e\n"},{"n":3,"title":"Infostealer riding the AI Train","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Check Point researchers identified Aokigahara, an infostealer that expands traditional browser, wallet, and credential theft to target AI application sessions, developer tools, cloud credentials, Git data, and SSH keys. Stolen tokens from tools such as Claude, ChatGPT Desktop, Cursor, GitHub Copilot, and Gemini CLI could enable unauthorized access to AI services, source code, and cloud environments.","briefOverview":"\u003cp\u003eCheck Point Research identified Aokigahara, a newly observed information-stealing program that may previously have been known as Kamidere or Stygian. It collects browser credentials and cookies, cryptocurrency wallet data, screenshots, clipboard contents, email and VPN information, and selected files from Windows systems. Its most notable capability is dedicated collection of authentication files, session data, and configuration files associated with AI applications and developer tools.\u003c/p\u003e\n\n\u003cp\u003eAokigahara targets Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant, as well as AWS credentials and single sign-on data. Its developer-focused collection also includes Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credentials and configuration files. The malware establishes communication with its command-and-control server using an X25519 key exchange and sends AES-256-GCM-encrypted ZIP archives through \u003ccode\u003e/gate/handshake\u003c/code\u003e, \u003ccode\u003e/gate/chunk\u003c/code\u003e, and \u003ccode\u003e/gate/complete\u003c/code\u003e endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified Aokigahara, an infostealer that may previously have been known as Kamidere or Stygian.","Aokigahara collects browser credentials and cookies, cryptocurrency wallet data, screenshots, clipboard contents, email and VPN data, and selected files from infected systems.","Its aisessions component targets authentication, session, and configuration data for AI and developer tools including Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant.","The malware also collects Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credential and configuration files.","Aokigahara establishes a command-and-control session using X25519 key exchange and uploads ZIP archives encrypted with AES-256-GCM through /gate/handshake, /gate/chunk, and /gate/complete endpoints."],"insights":["Aokigahara keeps all of its collection capabilities embedded in the executable even when configuration settings disable some of them, so a sample’s available code may exceed the functions it is currently configured to run.","The malware’s uploads can be distinguished by its use of the /gate/handshake, /gate/chunk, and /gate/complete paths, along with headers such as X-Build-ID, X-Session, X-HWID, and X-Chunk.","Its encrypted uploads include the collection-module label in the X-Chunk header, which can identify whether data such as browser information, screenshots, or AI-session files is being sent.","The malware uses configuration-controlled language and analysis-environment checks, meaning these anti-analysis behaviors do not necessarily run in every sample or deployment.","Aokigahara’s AI-focused collection includes cloud sign-in data and local developer secrets such as Git credentials and SSH private-key-related files, extending its reach beyond AI application accounts alone."],"referencedReports":[],"body":"\u003cp\u003eCheck Point Research identified Aokigahara, a newly observed information-stealing program that may previously have been known as Kamidere or Stygian. It collects browser credentials and cookies, cryptocurrency wallet data, screenshots, clipboard contents, email and VPN information, and selected files from Windows systems. Its most notable capability is dedicated collection of authentication files, session data, and configuration files associated with AI applications and developer tools.\u003c/p\u003e\n\n\u003cp\u003eAokigahara targets Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant, as well as AWS credentials and single sign-on data. Its developer-focused collection also includes Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credentials and configuration files. The malware establishes communication with its command-and-control server using an X25519 key exchange and sends AES-256-GCM-encrypted ZIP archives through \u003ccode\u003e/gate/handshake\u003c/code\u003e, \u003ccode\u003e/gate/chunk\u003c/code\u003e, and \u003ccode\u003e/gate/complete\u003c/code\u003e endpoints.\u003c/p\u003e\n"},{"n":2,"title":"A Summons Stamped 2018 That Ends at a OneDrive Login","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/localized-south-african-court-summons-bunnycdn-onedrive-password-form","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing campaign impersonated South African courts with a localized summons PDF that linked to a BunnyCDN-hosted fake OneDrive login page designed to steal Microsoft credentials. The key warning sign was the impossible eight-year-old court stamp and the demand to sign in to view a supposed legal document.","briefOverview":"\u003cp\u003eA South African financial services firm received a one-page PDF called “Summons” that impersonated the Special Tribunal and the Master of the Western Cape High Court. The document alleged a default court order and threatened execution proceedings, using local details including a bilingual English-Afrikaans stamp and references to the tribunal’s mandate. Its most visible inconsistency was a stamp dated October 2018 on a document dated September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained one live link behind a “VIEW COURT SUMMONS HERE” button, which led to an attacker-controlled BunnyCDN pull zone named \u003ccode\u003ehicourtsummons.b-cdn.net\u003c/code\u003e. Rather than showing a court document, the site displayed a OneDrive-style page requesting a Microsoft email address and password, with South African B-BBEE compliance files in the blurred background. IRONSCALES automatically identified the message as phishing and quarantined it; the article records no victim click or credential submission.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A South African financial services firm received a one-page PDF styled as a court summons that impersonated the Special Tribunal and the Master of the Western Cape High Court.","The PDF contained one link, behind a “VIEW COURT SUMMONS HERE” button, that opened a BunnyCDN-hosted page at hicourtsummons.b-cdn.net.","The linked page displayed a OneDrive-style form requesting a Microsoft email address and password, with South African B-BBEE compliance files used as background decoys.","The court stamp was dated October 2018 while the document was dated September 2026, an eight-year discrepancy highlighted as a clear warning sign.","IRONSCALES automatically classified the email as phishing and quarantined it, although no victim click or credential submission was recorded."],"insights":["The attachment itself appeared clean because it had no scripts, embedded files, launch actions, or auto-actions; its only active element was a link to the credential-harvesting page.","The attacker used a legitimate BunnyCDN shared domain, where the deceptive “hicourtsummons” subdomain was attacker-selected even though the broader b-cdn.net domain belonged to the CDN.","The email authenticated cleanly because it was sent from a real South African company’s Microsoft 365 tenant, which the article says may indicate a hijacked account but does not prove it.","Localized details such as real government agencies, Afrikaans wording, and B-BBEE compliance-file decoys added plausibility but did not establish authenticity, while the request for a Microsoft sign-in to view a legal document exposed the fraud."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's statistics on credentials, phishing as an initial access vector, and the human element in breaches.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article links to the FBI IC3 report as background on phishing.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article links to CISA's phishing guidance as background material.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites Microsoft's Digital Defense Report as background on the phishing threat landscape.","category":"research","primary":false}],"body":"\u003cp\u003eA South African financial services firm received a one-page PDF called “Summons” that impersonated the Special Tribunal and the Master of the Western Cape High Court. The document alleged a default court order and threatened execution proceedings, using local details including a bilingual English-Afrikaans stamp and references to the tribunal’s mandate. Its most visible inconsistency was a stamp dated October 2018 on a document dated September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained one live link behind a “VIEW COURT SUMMONS HERE” button, which led to an attacker-controlled BunnyCDN pull zone named \u003ccode\u003ehicourtsummons.b-cdn.net\u003c/code\u003e. Rather than showing a court document, the site displayed a OneDrive-style page requesting a Microsoft email address and password, with South African B-BBEE compliance files in the blurred background. IRONSCALES automatically identified the message as phishing and quarantined it; the article records no victim click or credential submission.\u003c/p\u003e\n"},{"n":4,"title":"Belden and Radiflow Partner to Close the Gap Between OT Threat Detection and Network Response","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/news/belden-and-radiflow-partner/","time":"13:00","priority":"MAY READ","score":45,"tldr":"Radiflow and Belden announced an integration of Radiflow’s CIARA and iSID OT risk intelligence platforms with Belden’s macmon NAC to automatically restrict network access when an asset’s risk posture changes. The partnership targets industrial and critical-infrastructure operators seeking machine-speed responses to OT threats.","briefOverview":"\u003cp\u003eRadiflow and Belden announced a strategic partnership to connect OT risk detection with automated network-access enforcement. The companies launched an integrated solution combining Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC. They said the integration is intended to eliminate manual handoffs between identifying an exposure and restricting access.\u003c/p\u003e\n\n\u003cp\u003eCIARA maps OT network topology and applies AI-driven threat intelligence to identify critical exposures as they emerge. iSID provides real-time OT event context, while CIARA supplies macmon with current risk scores for individual assets and network zones. macmon can then automatically adjust access rights when an asset or zone’s risk posture changes.\u003c/p\u003e\n\n\u003cp\u003eThe partnership is aimed at industrial operators in manufacturing, energy, transportation, and critical infrastructure. Radiflow and Belden said the combined offering is designed to reduce response times and limit cyber risk while avoiding disruption to operations. The companies cited Radiflow’s deployments at more than 20,000 sites and said the partnership will serve joint customers across Europe, APAC, and North America.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Radiflow and Belden announced a strategic partnership to integrate Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC.","The integrated solution is intended to connect OT risk and exposure detection with automated network-access enforcement without a manual handoff.","CIARA maps OT network topology and uses AI-driven threat intelligence to identify critical exposures, while iSID provides real-time OT event context.","The integration supplies macmon NAC with current risk scores for individual assets and network zones, enabling automatic access-right adjustments when risk posture changes.","The companies said the partnership serves industrial operators in manufacturing, energy, transportation, and critical infrastructure across Europe, APAC, and North America."],"insights":["The integration is designed to make access-control decisions using risk scores for both individual assets and network zones, rather than relying only on broad network-wide policies.","The partnership addresses a stated operational gap in which identifying OT risks does not automatically lead to a network response and enforcement is often manual.","Radiflow says its existing deployment across more than 20,000 sites gives the partnership an established operational footprint for customers in industrial and critical-infrastructure sectors."],"referencedReports":[],"body":"\u003cp\u003eRadiflow and Belden announced a strategic partnership to connect OT risk detection with automated network-access enforcement. The companies launched an integrated solution combining Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC. They said the integration is intended to eliminate manual handoffs between identifying an exposure and restricting access.\u003c/p\u003e\n\n\u003cp\u003eCIARA maps OT network topology and applies AI-driven threat intelligence to identify critical exposures as they emerge. iSID provides real-time OT event context, while CIARA supplies macmon with current risk scores for individual assets and network zones. macmon can then automatically adjust access rights when an asset or zone’s risk posture changes.\u003c/p\u003e\n\n\u003cp\u003eThe partnership is aimed at industrial operators in manufacturing, energy, transportation, and critical infrastructure. Radiflow and Belden said the combined offering is designed to reduce response times and limit cyber risk while avoiding disruption to operations. The companies cited Radiflow’s deployments at more than 20,000 sites and said the partnership will serve joint customers across Europe, APAC, and North America.\u003c/p\u003e\n"}]</script>
