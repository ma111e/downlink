<script type="application/json" id="dl-articles">[{"n":1,"title":"Public Exploits Released for Four Linux Kernel Flaws That Enable Local Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/public-exploits-released-for-four-linux.html","time":"18:02","priority":"SHOULD READ","score":85,"tldr":"Public proof-of-concept exploits for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—can allow local users to gain root access on unpatched systems. Organizations should install distribution updates containing all four fixes, as disabling unprivileged user namespaces only mitigates three of the flaws.","briefOverview":"\u003cp\u003eSecurity researcher Asim Manizada released working exploit code for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access. Linux kernel maintainers fixed all four flaws in recent weeks, but systems running older kernels remain at risk now that public exploit code is available. The exploits are tuned to specific kernel builds, may crash systems, and have not been reported as used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eDirtyAH6, TUNderflow, and PPPoEject can be reached by ordinary users when unprivileged user namespaces are enabled, while DiagSpill needs no user namespaces or special privileges if the SCTP networking module is available. Two flaws can be triggered remotely only in narrow scenarios and mainly to crash a host: DirtyAH6 on certain IPv6 routers or gateways, and DiagSpill when non-default SCTP options are enabled. Users should update to kernels containing all four fixes and consult their Linux distribution\u0026rsquo;s security advisories, while disabling unprivileged user namespaces or unused affected features can reduce some exposure when patching is delayed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researcher Asim Manizada released working proof-of-concept exploits for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access.","All four flaws have been fixed by Linux kernel maintainers, but systems running older kernels remain exposed now that exploit code is public.","DirtyAH6, TUNderflow, and PPPoEject require unprivileged user namespaces for an ordinary user to reach them, while DiagSpill requires no user namespaces if the SCTP networking module is available.","The first stable Linux kernel versions stated to contain the complete set of fixes are 5.10.270, 5.15.221, 6.1.188, 6.6.157, 6.12.109, 6.18.50, and 7.2.4.","The article says there are no reports that these flaws have been used in real-world attacks, and the released exploits are tuned to specific kernel builds and may crash systems."],"insights":["Disabling unprivileged user namespaces can reduce exposure to three of the four flaws, but it does not mitigate DiagSpill or protect against processes that already have network-administration privileges.","Two flaws have narrow network-triggered crash scenarios: DirtyAH6 can affect IPv6 routers or gateways adding an Authentication Header in transport mode, while DiagSpill requires non-default SCTP options to be enabled.","Although all four bugs are in different networking components, their underlying coding mistakes are longstanding memory-safety issues ranging from 10 to 21 years old.","The public exploits were deliberately released after a coordinated hold with Linux distributions, but users must check their distribution advisories because distributions may backport fixes without using the upstream kernel version numbers."],"referencedReports":[{"title":"LPE Quartet","url":"https://heyitsas.im/posts/lpe-quartet/","publisher":"Asim Manizada","context":"The article cites Manizada's technical write-up containing working exploits and analysis of the four Linux kernel flaws.","category":"research","primary":true}],"body":"\u003cp\u003eSecurity researcher Asim Manizada released working exploit code for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access. Linux kernel maintainers fixed all four flaws in recent weeks, but systems running older kernels remain at risk now that public exploit code is available. The exploits are tuned to specific kernel builds, may crash systems, and have not been reported as used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eDirtyAH6, TUNderflow, and PPPoEject can be reached by ordinary users when unprivileged user namespaces are enabled, while DiagSpill needs no user namespaces or special privileges if the SCTP networking module is available. Two flaws can be triggered remotely only in narrow scenarios and mainly to crash a host: DirtyAH6 on certain IPv6 routers or gateways, and DiagSpill when non-default SCTP options are enabled. Users should update to kernels containing all four fixes and consult their Linux distribution\u0026rsquo;s security advisories, while disabling unprivileged user namespaces or unused affected features can reduce some exposure when patching is delayed.\u003c/p\u003e\n"},{"n":2,"title":"Happy Birthday, Shai-Hulud","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/happy-birthday-shai-hulud?utm_medium=feed","time":"18:46","priority":"SHOULD READ","score":85,"tldr":"One year after the first npm Shai-Hulud compromise, its credential-stealing, self-propagating supply-chain technique has evolved into repeated waves run by multiple actors, aided by publicly released code and CI token hijacking. Although two alleged TeamPCP members were arrested, the original worm’s authors remain unidentified and the threat persists across the npm ecosystem.","briefOverview":"\u003cp\u003eA malicious version of @ctrl/tinycolor published to npm in September 2025 launched the first known self-propagating worm in the npm ecosystem. The Shai-Hulud payload used TruffleHog to search for npm tokens, GitHub credentials, and cloud keys, sent stolen secrets to attacker-controlled locations, and used stolen npm tokens to infect and republish other packages. It also created a GitHub Actions workflow for persistence, and researchers ultimately counted compromised packages in the hundreds.\u003c/p\u003e\n\n\u003cp\u003eLater waves expanded the threat through pre-install execution, new payloads, and a destructive fallback that could attempt to wipe a user’s home directory. In 2026, TeamPCP released source code for a Shai-Hulud worm framework, while multiple operators began running similar campaigns; one May burst pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI. Australian police arrested two alleged TeamPCP members in August 2026, but the original authors of the September and November 2025 attacks remain unidentified, and the publicly copied code continues to enable new campaigns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A malicious version of @ctrl/tinycolor published to npm in September 2025 initiated the first known self-propagating worm in the npm ecosystem, which spread into dozens of packages and CrowdStrike’s npm namespace.","The Shai-Hulud payload used TruffleHog to find npm tokens, GitHub credentials, and cloud keys, sent discovered secrets to attacker-controlled locations, added a GitHub Actions workflow for persistence, and republished itself using stolen npm tokens.","A November 2025 wave moved execution to the pre-install step, introduced setup_bun.js and bun_environment.js, and included a fallback that could attempt to wipe a user’s home directory.","Later 2026 campaigns used publicly released Shai-Hulud source code, including a May burst that pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI.","Australian Federal Police arrested two men in Western Australia on August 26, 2026 over alleged TeamPCP involvement, but the original authors of the September and November 2025 Shai-Hulud attacks remain unidentified."],"insights":["The threat evolved beyond stolen long-lived credentials: one May 2026 wave spread through hijacked short-lived OIDC tokens from CI systems, showing that short-lived access tokens did not prevent that campaign.","Moving malicious code to the pre-install step in November 2025 expanded exposure from package users to developer machines and automated build pipelines before installation completed.","TeamPCP’s release of the worm’s source code in May 2026 lowered the barrier for other operators, and the article reports that multiple actors were running Shai-Hulud-style campaigns by mid-2026.","Arrests of alleged TeamPCP operators do not resolve attribution for the original Shai-Hulud incidents, because the September and November 2025 attacks were never definitively linked to TeamPCP."],"referencedReports":[],"body":"\u003cp\u003eA malicious version of @ctrl/tinycolor published to npm in September 2025 launched the first known self-propagating worm in the npm ecosystem. The Shai-Hulud payload used TruffleHog to search for npm tokens, GitHub credentials, and cloud keys, sent stolen secrets to attacker-controlled locations, and used stolen npm tokens to infect and republish other packages. It also created a GitHub Actions workflow for persistence, and researchers ultimately counted compromised packages in the hundreds.\u003c/p\u003e\n\n\u003cp\u003eLater waves expanded the threat through pre-install execution, new payloads, and a destructive fallback that could attempt to wipe a user’s home directory. In 2026, TeamPCP released source code for a Shai-Hulud worm framework, while multiple operators began running similar campaigns; one May burst pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI. Australian police arrested two alleged TeamPCP members in August 2026, but the original authors of the September and November 2025 attacks remain unidentified, and the publicly copied code continues to enable new campaigns.\u003c/p\u003e\n"}]</script>
