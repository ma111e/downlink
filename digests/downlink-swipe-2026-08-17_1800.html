<script type="application/json" id="dl-articles">[{"n":1,"title":"Threat Actor Playbook: Conversational Social Engineering in Care Settings","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/threat-actor-playbook-conversational-social-engineering-in-care-settings/","time":"18:31","priority":"MAY READ","score":55,"tldr":"Healthcare help desks and frontline staff are increasingly vulnerable to AI-enabled social engineering, including voice cloning and urgent impersonation scenarios that pressure workers into resetting credentials or MFA. The article argues healthcare CISOs should move beyond annual compliance training to real-time human risk management with cross-channel testing, just-in-time training, and dynamic risk scoring.","briefOverview":"\u003cp\u003eThe article argues that healthcare front lines and IT help desks are increasingly exposed to conversational social engineering powered by generative AI. It says healthcare systems operate in high-velocity, life-critical environments, making administrative and IT support perimeters attractive targets. It contrasts annual compliance videos and generic email-only phishing tests with a Human Risk Management approach that measures and changes staff behavior in real time.\u003c/p\u003e\n\n\u003cp\u003eThe article describes threat groups such as Scattered Spider using public networks like LinkedIn to map health system organizational charts and identify targets or people to impersonate. Attackers may use AI voice mimicry to pose as locked-out physicians or executives and pressure help desk staff into resetting passwords or changing multi-factor authentication settings. They also fabricate clinical urgency, including background noise and urgent care scenarios, to push staff to bypass identity verification protocols.\u003c/p\u003e\n\n\u003cp\u003eThe article says healthcare has specific vulnerabilities, including high workforce turnover, a patient-care mindset that prioritizes speed and helpfulne
