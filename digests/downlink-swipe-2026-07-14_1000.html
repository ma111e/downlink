<script type="application/json" id="dl-articles">[{"n":9,"title":"OAuth Client ID Spoofing Lets Attackers Validate Stolen Microsoft Entra Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/oauth-client-id-spoofing-lets-attackers.html","time":"11:21","priority":"MUST READ","score":94,"tldr":"Proofpoint says threat actors are abusing OAuth client ID spoofing in Microsoft Entra ID to enumerate accounts and validate stolen passwords without generating normal successful sign-in telemetry. The technique fragments attempts across fake application IDs, helping campaigns targeting millions of users evade application-based detections, rate limits, and some Conditional Access policies.","briefOverview":"\u003cp\u003eProofpoint reported that at least two distinct threat actors are using a technique called OAuth client ID spoofing in cloud campaigns targeting Microsoft Entra ID environments. The activity lets attackers enumerate user accounts and validate stolen credentials without generating a successful sign-in event that would normally alert defenders. Proofpoint said this creates a blind spot because Entra ID returns different error responses depending on whether a supplied OAuth client ID is valid.\u003c/p\u003e\n\n\u003cp\u003eThe technique involves sending spoofed client IDs in HTTP POST requests to Microsoft’s OAuth 2.0 token endpoint using the Resource Owner Password Credentials flow. In these scenarios, Entra sign-in logs may record only the application ID without a corresponding application name, so detections based on surges against a specific application name may miss the activity. Proofpoint said spoofed client IDs also will not trigger Conditional Access policies scoped to a specific application.\u003c/p\u003e\n\n\u003cp\u003eProofpoint identified two large campaigns that adopted the technique toward the end of December 2025. UNK_pyreq2323 used more than 700,000 spoofed client IDs from AWS infrastructure to target more than 1 million accounts across nearly 4,000 tenants between January and March 2026, causing lockouts for roughly 28% of targeted users. UNK_OutFlareAZ used Cloudflare infrastructure starting in December 2025 to target over 2 million users with 3.7 million randomized spoofed application IDs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint said at least two threat actors are using OAuth client ID spoofing in cloud campaigns to enumerate Microsoft Entra ID user accounts and validate stolen credentials without generating successful sign-in events.","The technique uses spoofed client IDs in HTTP POST requests to Microsoft’s OAuth 2.0 token endpoint with the Resource Owner Password Credentials flow, allowing attackers to infer account and password validity from AADSTS error responses.","When a spoofed client ID is used, Entra sign-in logs record only the application ID without a corresponding application name, which can cause detections based on specific application names to miss the activity.","Proofpoint identified UNK_pyreq2323 as targeting more than 1 million accounts across nearly 4,000 tenants from AWS infrastructure between January and March 2026, causing lockouts for roughly 28% of targeted users.","Proofpoint identified UNK_OutFlareAZ as starting in December 2025 and using Cloudflare infrastructure to target over 2 million users with 3.7 million randomized spoofed application IDs."],"insights":["Detections that group activity by application name may fail because spoofed client IDs can leave the application name field blank in Entra sign-in logs.","Conditional Access policies scoped only to commonly targeted applications may not mitigate this technique because spoofed client IDs will not trigger policies tied to a specific application.","Fragmenting attempts across many fictional applications can make authentication activity harder to correlate and may evade per-application detections and rate limiting.","The two observed campaigns used different spoofing patterns, with UNK_pyreq2323 modifying trailing digits of a known application ID and reusing spoofed IDs, while UNK_OutFlareAZ generated a unique client ID for each request."],"referencedReports":[{"title":"OAuth Client ID Spoofing: Why Fake Client IDs Are Gaining Traction","url":"https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy","publisher":"Proofpoint","context":"The article is based on Proofpoint research by Rachel Rabin describing OAuth client ID spoofing against Microsoft Entra ID environments.","category":"","primary":false}],"body":"\u003cp\u003eProofpoint reported that at least two distinct threat actors are using a technique called OAuth client ID spoofing in cloud campaigns targeting Microsoft Entra ID environments. The activity lets attackers enumerate user accounts and validate stolen credentials without generating a successful sign-in event that would normally alert defenders. Proofpoint said this creates a blind spot because Entra ID returns different error responses depending on whether a supplied OAuth client ID is valid.\u003c/p\u003e\n\n\u003cp\u003eThe technique involves sending spoofed client IDs in HTTP POST requests to Microsoft’s OAuth 2.0 token endpoint using the Resource Owner Password Credentials flow. In these scenarios, Entra sign-in logs may record only the application ID without a corresponding application name, so detections based on surges against a specific application name may miss the activity. Proofpoint said spoofed client IDs also will not trigger Conditional Access policies scoped to a specific application.\u003c/p\u003e\n\n\u003cp\u003eProofpoint identified two large campaigns that adopted the technique toward the end of December 2025. UNK_pyreq2323 used more than 700,000 spoofed client IDs from AWS infrastructure to target more than 1 million accounts across nearly 4,000 tenants between January and March 2026, causing lockouts for roughly 28% of targeted users. UNK_OutFlareAZ used Cloudflare infrastructure starting in December 2025 to target over 2 million users with 3.7 million randomized spoofed application IDs.\u003c/p\u003e\n"},{"n":1,"title":"SAP warns of critical flaws in NetWeaver and Commerce Cloud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-warns-of-critical-flaws-in-netweaver-and-commerce-cloud/","time":"11:42","priority":"MUST READ","score":92,"tldr":"SAP’s July 2026 security updates fix 16 vulnerabilities, including three critical flaws in NetWeaver AS ABAP, SAP Approuter, and SAP Commerce Cloud that could enable data access, modification, denial of service, or abuse of default credentials. SAP says it has not seen evidence of exploitation yet, but customers should patch promptly.","briefOverview":"\u003cp\u003eSAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates. The fixes include three critical flaws affecting NetWeaver, Commerce Cloud, and AppRouter. SAP says it has not found evidence that the vulnerabilities patched in this update have been exploited in attacks.\u003c/p\u003e\n\n\u003cp\u003eOne critical issue, CVE-2026-44747, is a memory corruption flaw in SAP NetWeaver Application Server ABAP caused by an out-of-bounds write weakness. SAP says an authenticated attacker could use logical errors in memory management to cause unauthorized data access, data modification, or system unavailability. Another critical issue, CVE-2026-27690, is an HTTP Request Smuggling vulnerability in SAP Approuter that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe third critical flaw, CVE-2026-44761, affects SAP Commerce Cloud and stems from default credentials that can let attackers obtain valid access tokens and read or modify data through certain APIs. SAP’s July 2026 advisory also lists fixes for high-, medium-, and low-severity issues including DLL hijacking, open redirect, missing authorization checks, remote code execution, cross-site scripting, path traversal, SQL injection, denial-of-service, information disclosure, and security misconfigurations. The article notes that CISA has added 14 SAP security flaws to its Known Exploited Vulnerabilities catalog since November 2021, including two abused by ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates, including three critical flaws in NetWeaver, Commerce Cloud, and AppRouter.","CVE-2026-44747 is a critical memory corruption issue in SAP NetWeaver Application Server ABAP caused by an out-of-bounds write weakness that could affect confidentiality, integrity, and availability.","CVE-2026-27690 is a critical HTTP Request Smuggling vulnerability in SAP Approuter that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.","CVE-2026-44761 is a critical SAP Commerce Cloud flaw caused by default credentials that can let attackers obtain valid access tokens and read or modify data through certain APIs.","SAP says it has not found evidence that the vulnerabilities patched in the July 2026 updates have been exploited in attacks."],"insights":["The absence of known exploitation should not be treated as low risk, because CISA has added 14 SAP flaws to its Known Exploited Vulnerabilities catalog since November 2021, including two abused by ransomware gangs.","The three critical flaws affect different parts of SAP environments: core NetWeaver application infrastructure, cloud application middleware on SAP BTP, and the Commerce Cloud e-commerce platform.","SAP security updates are arriving amid repeated recent exposure, with the company fixing 15 vulnerabilities in June 2026 and separately dealing with compromised official SAP npm packages aimed at stealing developer credentials.","The potential business impact is broad because SAP says its software serves 99 of the 100 largest companies worldwide."],"referencedReports":[{"title":"July 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/july-2026.html","publisher":"SAP","context":"The article cites SAP's July 2026 advisory as the source listing fixes for critical, high-severity, medium-severity, and low-severity vulnerabilities.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A835","publisher":"CISA","context":"The article references CISA's catalog to note that 14 SAP security flaws have been added since November 2021, including two abused by ransomware gangs.","category":"","primary":false}],"body":"\u003cp\u003eSAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates. The fixes include three critical flaws affecting NetWeaver, Commerce Cloud, and AppRouter. SAP says it has not found evidence that the vulnerabilities patched in this update have been exploited in attacks.\u003c/p\u003e\n\n\u003cp\u003eOne critical issue, CVE-2026-44747, is a memory corruption flaw in SAP NetWeaver Application Server ABAP caused by an out-of-bounds write weakness. SAP says an authenticated attacker could use logical errors in memory management to cause unauthorized data access, data modification, or system unavailability. Another critical issue, CVE-2026-27690, is an HTTP Request Smuggling vulnerability in SAP Approuter that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe third critical flaw, CVE-2026-44761, affects SAP Commerce Cloud and stems from default credentials that can let attackers obtain valid access tokens and read or modify data through certain APIs. SAP’s July 2026 advisory also lists fixes for high-, medium-, and low-severity issues including DLL hijacking, open redirect, missing authorization checks, remote code execution, cross-site scripting, path traversal, SQL injection, denial-of-service, information disclosure, and security misconfigurations. The article notes that CISA has added 14 SAP security flaws to its Known Exploited Vulnerabilities catalog since November 2021, including two abused by ransomware gangs.\u003c/p\u003e\n"},{"n":8,"title":"11 Old Microsoft-Signed Linux UEFI Shims Could Let Attackers Bypass Secure Boot","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/11-old-microsoft-signed-linux-uefi.html","time":"12:46","priority":"SHOULD READ","score":86,"tldr":"Researchers found 11 old Microsoft-signed Linux UEFI shim bootloaders that can still be abused to bypass Secure Boot and run malicious code before the operating system starts. Microsoft has revoked the affected shims, but systems remain at risk if revocation updates are not applied.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered 11 old, Microsoft-signed UEFI shim applications that could be abused to bypass Secure Boot on most systems using UEFI. ESET said an attacker exploiting one of these vulnerable applications can execute untrusted code during system boot. The affected shims expose any UEFI-based machine that trusts Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.\u003c/p\u003e\n\n\u003cp\u003eThe shim is a lightweight, open-source UEFI bootloader used to help Linux distributions boot when Secure Boot is enabled. The article explains that UEFI firmware validates the shim against the Microsoft CA, the shim validates a second-stage bootloader such as GRUB 2 using its embedded vendor certificate, and GRUB 2 validates the kernel using the same vendor certificate. ESET said outdated but still trusted shims can be used to execute arbitrary code at boot, enabling UEFI bootkits such as Bootkitty, HybridPetya, or BlackLotus even when Secure Boot is enabled.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft revoked the impacted bootloaders as part of its June 2026 Patch Tuesday update after responsible disclosure in February. CERT/CC said vendor-specific bootloaders had not been updated after upstream vulnerabilities became public and fixed, leaving vulnerable components signed and trusted because they had not been revoked through the Microsoft-signed DBX revocation list. ESET warned that expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless bootloaders signed with the expired certificate are explicitly revoked by hash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered 11 old Microsoft-signed UEFI shim applications that could be abused to bypass Secure Boot on most systems using UEFI.","The vulnerable shim bootloaders expose any UEFI-based machine that trusts Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.","An attacker with administrative privileges or the ability to modify the boot process could use the affected shims to execute arbitrary code before the operating system loads.","Microsoft revoked the impacted shim bootloaders as part of its June 2026 Patch Tuesday update following responsible disclosure to the company in February.","ESET warned that expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless bootloaders signed with the expired certificate are explicitly revoked by hash."],"insights":["The risk comes from old shim binaries still being trusted, not from a new vulnerability, meaning an attacker only needs a copy of an unrevoked Microsoft-signed shim to undermine Secure Boot.","The expiration of the Microsoft Corporation UEFI CA 2011 certificate does not by itself stop previously signed bootloaders from working; explicit revocation by hash is still required.","The attack can bypass both the MOK denylist and Secure Boot Advanced Targeting by replacing an up-to-date shim with an older signed shim that does not enforce newer protections.","Because the malicious code can run before the operating system and security tools start, it can evade built-in controls and EDR products while enabling persistence across reboots and, in some cases, operating system reinstallation."],"referencedReports":[{"title":"Forgotten UEFI shims undermining Secure Boot","url":"https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/","publisher":"ESET","context":"The article cites ESET’s report as the source of the findings about old Microsoft-signed UEFI shim bootloaders that can bypass Secure Boot.","category":"","primary":false},{"title":"CERT/CC Vulnerability Note VU#616257","url":"https://www.kb.cert.org/vuls/id/616257","publisher":"CERT Coordination Center","context":"The article references a CERT/CC advisory stating that vendor-specific bootloaders remained signed and trusted because they had not been revoked through the Microsoft-signed DBX revocation list.","category":"","primary":false},{"title":"CVE-2026-8863","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-8863","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s vulnerability entry for CVE-2026-8863 when identifying the issues associated with the affected shim bootloaders.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered 11 old, Microsoft-signed UEFI shim applications that could be abused to bypass Secure Boot on most systems using UEFI. ESET said an attacker exploiting one of these vulnerable applications can execute untrusted code during system boot. The affected shims expose any UEFI-based machine that trusts Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.\u003c/p\u003e\n\n\u003cp\u003eThe shim is a lightweight, open-source UEFI bootloader used to help Linux distributions boot when Secure Boot is enabled. The article explains that UEFI firmware validates the shim against the Microsoft CA, the shim validates a second-stage bootloader such as GRUB 2 using its embedded vendor certificate, and GRUB 2 validates the kernel using the same vendor certificate. ESET said outdated but still trusted shims can be used to execute arbitrary code at boot, enabling UEFI bootkits such as Bootkitty, HybridPetya, or BlackLotus even when Secure Boot is enabled.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft revoked the impacted bootloaders as part of its June 2026 Patch Tuesday update after responsible disclosure in February. CERT/CC said vendor-specific bootloaders had not been updated after upstream vulnerabilities became public and fixed, leaving vulnerable components signed and trusted because they had not been revoked through the Microsoft-signed DBX revocation list. ESET warned that expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless bootloaders signed with the expired certificate are explicitly revoked by hash.\u003c/p\u003e\n"},{"n":2,"title":"New phishing kits target Microsoft 365 accounts, evade MFA","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-phishing-kits-target-microsoft-365-accounts-evade-mfa/","time":"12:49","priority":"SHOULD READ","score":85,"tldr":"Two new phishing kits, Jalisco and OmegaLord, are targeting Microsoft 365 accounts with methods designed to bypass MFA, including real-time device-code phishing and harvesting phone numbers alongside credentials. ReliaQuest recommends restricting device-code authentication and tightening device registration limits to reduce account takeover risk.","briefOverview":"\u003cp\u003eTwo new phishing kits, Jalisco and OmegaLord, have been discovered in attacks targeting Microsoft 365 accounts. ReliaQuest researchers found that both toolkits use methods intended to defeat multi-factor authentication. Jalisco uses device-code phishing, while OmegaLord masquerades as a PDF reader to collect login credentials and phone numbers.\u003c/p\u003e\n\n\u003cp\u003eJalisco abuses the OAuth 2.0 Device Authorization Grant flow by tricking victims into entering an authorization code on the legitimate Microsoft login page. The toolkit generates fresh Microsoft OAuth device codes automatically when a victim opens the phishing page, bypassing Microsoft’s 15-minute validity limit for device codes. ReliaQuest said attackers have registered multiple rogue devices on compromised accounts, sometimes using names containing “Microsoft” or “Windows” to lower suspicion.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, attackers search SharePoint and other SaaS services for sensitive data such as customer or employee personally identifiable information, financial records, and internal communications. ReliaQuest said exfiltration can occur in as little as six minutes before defenders identify the breach, followed by extortion demands and threats to leak the data. The firm recommends reducing the Entra ID device-registration limit, blocking device code authentication through Microsoft Entra Conditional Access, restricting the OAuth Device Authorization grant in Okta, and removing unnecessary app registrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ReliaQuest researchers discovered two phishing kits, Jalisco and OmegaLord, being used to target Microsoft 365 accounts and evade multi-factor authentication.","Jalisco uses device-code phishing by generating fresh Microsoft OAuth device codes when victims open the phishing page, allowing attackers to authorize attacker-controlled devices without needing the victim’s username or password.","ReliaQuest observed attackers registering multiple rogue devices on compromised accounts, sometimes using names containing “Microsoft” or “Windows” to appear less suspicious.","After compromising accounts, attackers search SharePoint and other SaaS services for valuable data, exfiltrate it in as little as six minutes, and follow up with extortion demands.","OmegaLord uses a fake PDF Reader login page to steal email addresses, passwords, and phone numbers, which could help attackers bypass MFA protections."],"insights":["Jalisco’s real-time generation of Microsoft OAuth device codes is specifically designed to work around Microsoft’s 15-minute device-code expiration control.","ReliaQuest’s recommendation to reduce the Entra ID device-registration limit from the default value of 50 to one or two directly targets the observed behavior of attackers adding multiple rogue devices to compromised accounts.","Attackers sometimes name rogue devices with terms like “Microsoft” or “Windows,” making device inventory review more difficult if defenders rely only on familiar-looking device names.","The article highlights that data theft can happen in as little as six minutes after account compromise, making delayed detection and response especially costly.","OmegaLord’s collection of phone numbers shows that even conventional credential phishing is evolving to gather information that may help attackers work around MFA protections."],"referencedReports":[{"title":"Threat Spotlight: Jalisco Toolkit and AI-Powered Phishing Surge","url":"https://reliaquest.com/blog/threat-spotlight-jalisco-toolkit-and-ai-powered-phishing-surge","publisher":"ReliaQuest","context":"The article cites ReliaQuest researchers’ analysis of the Jalisco and OmegaLord phishing kits and quotes their findings on data exfiltration and MFA-targeting techniques.","category":"","primary":false}],"body":"\u003cp\u003eTwo new phishing kits, Jalisco and OmegaLord, have been discovered in attacks targeting Microsoft 365 accounts. ReliaQuest researchers found that both toolkits use methods intended to defeat multi-factor authentication. Jalisco uses device-code phishing, while OmegaLord masquerades as a PDF reader to collect login credentials and phone numbers.\u003c/p\u003e\n\n\u003cp\u003eJalisco abuses the OAuth 2.0 Device Authorization Grant flow by tricking victims into entering an authorization code on the legitimate Microsoft login page. The toolkit generates fresh Microsoft OAuth device codes automatically when a victim opens the phishing page, bypassing Microsoft’s 15-minute validity limit for device codes. ReliaQuest said attackers have registered multiple rogue devices on compromised accounts, sometimes using names containing “Microsoft” or “Windows” to lower suspicion.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, attackers search SharePoint and other SaaS services for sensitive data such as customer or employee personally identifiable information, financial records, and internal communications. ReliaQuest said exfiltration can occur in as little as six minutes before defenders identify the breach, followed by extortion demands and threats to leak the data. The firm recommends reducing the Entra ID device-registration limit, blocking device code authentication through Microsoft Entra Conditional Access, restricting the OAuth Device Authorization grant in Okta, and removing unnecessary app registrations.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft Entra ID gets passkeys default authentication starting September","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-entra-id-gets-passkeys-default-authentication-starting-september/","time":"12:49","priority":"SHOULD READ","score":82,"tldr":"Microsoft will make passkeys the default authentication method for Entra ID starting in September 2026 and will retire native SMS and voice MFA on February 1, 2027. Organizations should move users to phishing-resistant authentication methods to avoid sign-in disruptions and reduce credential theft risk.","briefOverview":"\u003cp\u003eMicrosoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026. Users who currently use phone-based SMS and voice authentication will be automatically enabled for passkeys and prompted to register a passkey the next time they perform multifactor authentication. Users already signing in with passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods can continue using those methods.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027, and will no longer offer SMS and voice as a native Microsoft Entra capability. Organizations are advised to ensure all users are using a phishing-resistant method before that date to avoid sign-in disruptions. Organizations that still need phone-based authentication will need to configure third-party telecom providers through the Microsoft Security Store.\u003c/p\u003e\n\n\u003cp\u003eAdmins with the global reader, Authentication policy administrator, or Security reader roles can identify SMS or voice authentication users by running Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script. Microsoft said the change is intended to reduce reliance on phishable authentication methods and strengthen protection against credential theft and phishing. The article notes that Microsoft Entra single sign-on accounts have been heavily targeted in recent SaaS data-theft attacks using stolen credentials, including activity linked to the ShinyHunters extortion gang.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026.","Entra ID users who currently use phone-based SMS or voice authentication will be automatically enabled for passkeys and prompted to register one the next time they perform multifactor authentication.","Microsoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027, and will no longer offer SMS and voice as a native Microsoft Entra capability.","Users already signing in with passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods will be able to continue using those methods.","Microsoft said organizations should ensure all users move to phishing-resistant authentication before the SMS and voice retirement date to avoid sign-in disruptions."],"insights":["Organizations can identify users still relying on SMS or voice authentication by running Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script, but only admins with the global reader, Authentication policy administrator, or Security reader roles can use it for this purpose.","Organizations that still require phone-based authentication after Microsoft retires native SMS and voice support will need to configure third-party telecom providers through the Microsoft Security Store.","Microsoft tied the move to a sharp phishing risk, stating that its threat intelligence has seen AI-enabled phishing campaigns reach click-through rates as high as 54%, compared with roughly 12% for more traditional campaigns.","The transition is aimed specifically at users enabled for SMS or voice authentication, while users already using phishing-resistant sign-in methods such as Windows Hello for Business, FIDO2 security keys, or smart cards are not being forced to change methods."],"referencedReports":[{"title":"Plan a phishing-resistant passwordless authentication deployment in Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-plan-prerequisites-phishing-resistant-passwordless-authentication","publisher":"Microsoft","context":"The article says Microsoft provides step-by-step guidance on deploying and managing Entra ID phishing-resistant passwordless authentication on this documentation page.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026. Users who currently use phone-based SMS and voice authentication will be automatically enabled for passkeys and prompted to register a passkey the next time they perform multifactor authentication. Users already signing in with passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods can continue using those methods.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027, and will no longer offer SMS and voice as a native Microsoft Entra capability. Organizations are advised to ensure all users are using a phishing-resistant method before that date to avoid sign-in disruptions. Organizations that still need phone-based authentication will need to configure third-party telecom providers through the Microsoft Security Store.\u003c/p\u003e\n\n\u003cp\u003eAdmins with the global reader, Authentication policy administrator, or Security reader roles can identify SMS or voice authentication users by running Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script. Microsoft said the change is intended to reduce reliance on phishable authentication methods and strengthen protection against credential theft and phishing. The article notes that Microsoft Entra single sign-on accounts have been heavily targeted in recent SaaS data-theft attacks using stolen credentials, including activity linked to the ShinyHunters extortion gang.\u003c/p\u003e\n"},{"n":6,"title":"Study of 85 Crypto Wallet Extensions Finds Address Leaks and Cross-Site Tracking Risks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/study-of-85-crypto-wallet-extensions.html","time":"11:55","priority":"SHOULD READ","score":82,"tldr":"KU Leuven researchers found that many popular crypto wallet browser extensions leak wallet addresses in ways that can link a user’s separate addresses, persist after logout, and enable cross-site tracking or real-world identity matching. The issue is largely built into how wallets interact with websites, and several major wallet vendors declined to treat it as a serious bug.","briefOverview":"\u003cp\u003eResearchers at KU Leuven tested 85 popular crypto wallet browser extensions and found that the wallets can leak enough information to link and track users. The extensions together have about 35 million users listed on the Chrome Web Store. The team, from the university’s DistriNet security group, posted the paper this month and will present it at the PETS 2026 privacy conference in Calgary in late July.\u003c/p\u003e\n\n\u003cp\u003eThe researchers identified five privacy weaknesses in how wallets and websites interact. Seventeen wallets exposed connections between a user’s separate addresses, either by putting multiple addresses in one request or by sending separate requests within milliseconds of each other. Thirty-six wallets announced themselves to any page they loaded, creating an installed-wallet fingerprint that can work even if the user never connects a wallet and blocks cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says logout and disconnect flows often do not remove access, because many sites do not send a real revoke command and many wallets ignore it even when sent. In 22 of the 36 wallets, a site could still read the user’s address after revocation, cookie clearing, and browser restart, while 23 wallets could hand out an address from inside an embedded frame loaded by another site. The researchers reported the cross-site issue to affected wallet makers, but several vendors declined to treat it as a bug, while Coinbase Wallet, Coin98, and Hana Wallet fixed it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["KU Leuven researchers tested 85 popular crypto wallet browser extensions with about 35 million Chrome Web Store users and found privacy weaknesses that can link and track the people using them.","Seventeen wallets exposed connections between a user’s separate wallet addresses, either by bundling multiple addresses into one server request or by sending separate requests within milliseconds of each other.","Thirty-six of the 85 wallets announce themselves to any page they load, creating an installed-wallet fingerprint that works even if the user never connects a wallet and blocks cookies.","In 22 of those 36 wallets, a site could still read the user’s address after asking the wallet to revoke access, with that access surviving cookie clearing and browser restarts.","The researchers reported the cross-site issue to affected wallet makers, but several vendors declined to treat it as a bug, while Coinbase Wallet, Coin98, and Hana Wallet fixed it."],"insights":["Clearing browser cookies or restarting the browser may not stop tracking because stale wallet permissions can remain inside the extension until the user removes the site from the wallet’s “Connected Sites” list.","A privacy leak can happen even without theft or a software bug, because the wallets are exposing information through behavior that was intentionally built into how they work with websites.","The cross-site tracking risk depends on ordinary web features, such as a shared tracking script and an embedded page, rather than requiring a direct wallet compromise or user click at the time of tracking.","Users can reduce some risk by clearing old wallet site permissions and separating activities across different wallets or browser profiles, but the article says broader fixes require wallet and ecosystem changes.","Several wallet makers treated address exposure as informational, low-risk, out of scope, or a known issue, showing a gap between researchers’ privacy concerns and some vendors’ bug-severity decisions."],"referencedReports":[{"title":"KU Leuven paper on crypto wallet privacy weaknesses","url":"https://arxiv.org/abs/2607.06141","publisher":"KU Leuven DistriNet security group","context":"The article says KU Leuven researchers posted this paper after testing 85 popular crypto wallet browser extensions and will present it at PETS 2026.","category":"","primary":false},{"title":"2023 research on browser wallets leaking addresses to outside servers","url":"https://arxiv.org/abs/2306.08170","publisher":"Christof Ferreira Torres and colleagues","context":"The article says the KU Leuven study builds on this 2023 research, which first showed browser wallets leaking addresses to outside servers.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at KU Leuven tested 85 popular crypto wallet browser extensions and found that the wallets can leak enough information to link and track users. The extensions together have about 35 million users listed on the Chrome Web Store. The team, from the university’s DistriNet security group, posted the paper this month and will present it at the PETS 2026 privacy conference in Calgary in late July.\u003c/p\u003e\n\n\u003cp\u003eThe researchers identified five privacy weaknesses in how wallets and websites interact. Seventeen wallets exposed connections between a user’s separate addresses, either by putting multiple addresses in one request or by sending separate requests within milliseconds of each other. Thirty-six wallets announced themselves to any page they loaded, creating an installed-wallet fingerprint that can work even if the user never connects a wallet and blocks cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says logout and disconnect flows often do not remove access, because many sites do not send a real revoke command and many wallets ignore it even when sent. In 22 of the 36 wallets, a site could still read the user’s address after revocation, cookie clearing, and browser restart, while 23 wallets could hand out an address from inside an embedded frame loaded by another site. The researchers reported the cross-site issue to affected wallet makers, but several vendors declined to treat it as a bug, while Coinbase Wallet, Coin98, and Hana Wallet fixed it.\u003c/p\u003e\n"},{"n":10,"title":"A Fake Malwarebytes Renewal, Signed by Google","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/malwarebytes-renewal-calendar-invite-vishing","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A fake Malwarebytes renewal invoice was sent via a legitimate Google Calendar invite from a newly registered Google Workspace domain, using phone numbers instead of malicious links or files to push a vishing scam. Because Google signed the message and all links were legitimate, detection depended on behavioral signals like the unknown organizer domain, brand mismatch, callback numbers, and user reporting.","briefOverview":"\u003cp\u003eA senior executive at a hospitality company received a Google Calendar invite posing as a Malwarebytes Security Operations renewal invoice. The invite claimed a $598.75 four-year Premium Family Plan charge and included two phone numbers to dispute it. The article describes this as a callback phishing or vishing attempt, where the email’s purpose was to get the recipient to call an attacker-controlled number rather than click a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe attack was significant because it used legitimate Google infrastructure and contained little for traditional scanning tools to block. The RSVP links resolved to calendar.google.com, the attached invite.ics file carried no code, and DKIM passed because Google signed the message. The organizer address, however, came from an unrelated and newly registered domain, betskl[.]com, with no SPF or DMARC records.\u003c/p\u003e\n\n\u003cp\u003eThe executive reported the invite as an unknown sender instead of calling the listed numbers. Themis had also scored the message as suspicious, citing a vishing attack against a VIP recipient, the freshly registered return-path domain, and language patterns in the invite. The message was approved for action, quarantined, and permanently deleted from the mailbox.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker registered betskl[.]com, created a Google Workspace account on it, and used Google Calendar to send a fake Malwarebytes Security Operations renewal invoice to a senior executive at a hospitality company.","The calendar invite claimed a $598.75 four-year Malwarebytes Premium Family Plan charge and provided two phone numbers for the recipient to call to dispute the supposed unauthorized charge.","The message contained no malicious links or code-bearing attachment, because its links resolved to calendar.google.com and the invite.ics attachment was a plain Google-generated iCalendar file.","DKIM and composite authentication passed because Google sent and signed the message, while the organizer address was an unrelated newly registered domain with no SPF or DMARC records.","The executive reported the message as an unknown sender, Themis identified it as suspicious vishing targeting a VIP recipient, and the message was quarantined and permanently deleted."],"insights":["Passing DKIM from a trusted provider can confirm that Google sent a message, but it does not validate that the sender’s claimed brand identity is legitimate.","Callback phishing can evade controls that focus on URLs and attachments because the harmful action is placed outside the email channel as a phone call.","Calendar invitations create a useful disguise for financial scams because recipients are accustomed to seeing Google Calendar formatting, RSVP controls, and organizer fields in routine work messages.","Fresh domain registration, missing SPF and DMARC records, and a mismatch between the organizer domain and the claimed vendor were more useful warning signs than link or attachment scanning in this case.","Security awareness for senior staff directly affected the outcome because the executive’s decision to report the invite supplied the decisive signal for removal."],"referencedReports":[{"title":"Tech Support Scams","url":"https://www.malwarebytes.com/tech-support-scams","publisher":"Malwarebytes","context":"The article cites Malwarebytes guidance stating that legitimate vendors do not cold-call users about charges and that support should go through official help channels.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report for its discussion of growing misuse of legitimate services and impersonation of trusted brands to deliver fraud.","category":"","primary":false},{"title":"2024 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report as tracking callback and tech-support fraud as a persistent and underreported category relying on urgency and impersonation.","category":"","primary":false},{"title":"Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the report for its finding that social engineering and the human element remain leading paths into organizations.","category":"","primary":false}],"body":"\u003cp\u003eA senior executive at a hospitality company received a Google Calendar invite posing as a Malwarebytes Security Operations renewal invoice. The invite claimed a $598.75 four-year Premium Family Plan charge and included two phone numbers to dispute it. The article describes this as a callback phishing or vishing attempt, where the email’s purpose was to get the recipient to call an attacker-controlled number rather than click a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe attack was significant because it used legitimate Google infrastructure and contained little for traditional scanning tools to block. The RSVP links resolved to calendar.google.com, the attached invite.ics file carried no code, and DKIM passed because Google signed the message. The organizer address, however, came from an unrelated and newly registered domain, betskl[.]com, with no SPF or DMARC records.\u003c/p\u003e\n\n\u003cp\u003eThe executive reported the invite as an unknown sender instead of calling the listed numbers. Themis had also scored the message as suspicious, citing a vishing attack against a VIP recipient, the freshly registered return-path domain, and language patterns in the invite. The message was approved for action, quarantined, and permanently deleted from the mailbox.\u003c/p\u003e\n"},{"n":13,"title":"J-Space: The Logs AI Security Has Never Had","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/j-space-ai-agent-detection","time":"10:00","priority":"MAY READ","score":72,"tldr":"Anthropic’s J-space research suggests AI agents may have an internal “intent” signal that can reveal deception, prompt injection awareness, or manipulation before actions occur. The key takeaway is that frontier labs should expose this workspace telemetry to enterprise security teams as a new class of logs for detecting and responding to agentic AI risks.","briefOverview":"\u003cp\u003eAnthropic published interpretability research describing a structure inside Claude called the J-space, which the article says functions like a small mental workspace. The J-space holds only a few dozen concepts at a time and accounts for less than a tenth of internal activity, but it carries deliberate multi-step reasoning. Anthropic’s J-lens technique reads this space by identifying internal activity patterns tied to words that the model may say later, whether or not those words appear in the output.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that J-space telemetry could become a third layer of monitoring for AI agents, alongside what an agent says and what it does. In Anthropic’s examples, terms such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” appeared in the workspace during scenarios involving bugs, prompt injection, staged tests, falsified scores, and sabotage-trained models. The article says this could help detection teams correlate internal signals with later actions, such as file writes or tool use, while noting that false positives would be real.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that only providers can perform inline prevention before the next token is generated, but enterprises may still interrupt multi-step agent workflows at the tool layer. It calls on Anthropic and other frontier labs to expose workspace telemetry to enterprise customers in some usable form, such as raw readouts, derived signals, or alerts. It compares the current moment for agentic AI to the pre-CloudTrail period in cloud computing, arguing that logs must come before stronger controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic published interpretability research describing a small internal structure in Claude called the J-space, which the article says acts like a mental workspace for deliberate multi-step reasoning.","The article says the J-lens technique can read the J-space by identifying words associated with internal activity patterns, including concepts that may not appear in the model’s output.","In Anthropic’s examples, words such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” appeared in the J-space during scenarios involving bugs, prompt injection, staged tests, falsified scores, or sabotage-trained models.","The article argues that J-space telemetry would add a third layer of AI agent monitoring beyond what an agent says and what it does, potentially helping teams correlate internal signals with actions like file writes or external content consumption.","The article calls on Anthropic and other frontier labs to expose workspace telemetry to enterprise customers, while noting objections such as model intellectual property, compute cost, adversarial evasion, and false positives."],"insights":["The article separates real-time prevention from later interruption, arguing that only model providers can block harmful output before the next token, while enterprises may still be able to stop later tool actions in multi-step agent workflows.","The J-space examples suggest that some security-relevant signals may appear before visible misconduct, such as “fake” while the model is still reading a prompt or “fraud” at the start of a coding session.","The article frames workspace telemetry as comparable to CloudTrail for cloud computing, implying that useful AI agent security controls may depend first on providers exposing basic investigable logs.","The article highlights staging as a practical use case with no latency requirement, where an agent’s workspace could be screened before it receives production credentials.","The article notes that J-space signals are not direct proof of intent, because a term like “blackmail” could appear simply because the model understood a report, so the feed would need correlation with actions and context."],"referencedReports":[{"title":"Global Workspace","url":"https://www.anthropic.com/research/global-workspace","publisher":"Anthropic","context":"The article says Anthropic published interpretability research describing the J-space inside Claude and uses it as the foundation for the discussion.","category":"","primary":false},{"title":"Workspace paper","url":"https://transformer-circuits.pub/2026/workspace/index.html","publisher":"Anthropic / Transformer Circuits","context":"The article links to the technical paper as the source for observations about J-space signals such as “manipulation,” “injection,” and “fraud.”","category":"","primary":false},{"title":"Reasoning models don’t say what they think","url":"https://www.anthropic.com/research/reasoning-models-dont-say-think","publisher":"Anthropic","context":"The article cites Anthropic’s faithfulness research to support the claim that reasoning models often omit the real drivers of their answers from written reasoning.","category":"","primary":false}],"body":"\u003cp\u003eAnthropic published interpretability research describing a structure inside Claude called the J-space, which the article says functions like a small mental workspace. The J-space holds only a few dozen concepts at a time and accounts for less than a tenth of internal activity, but it carries deliberate multi-step reasoning. Anthropic’s J-lens technique reads this space by identifying internal activity patterns tied to words that the model may say later, whether or not those words appear in the output.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that J-space telemetry could become a third layer of monitoring for AI agents, alongside what an agent says and what it does. In Anthropic’s examples, terms such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” appeared in the workspace during scenarios involving bugs, prompt injection, staged tests, falsified scores, and sabotage-trained models. The article says this could help detection teams correlate internal signals with later actions, such as file writes or tool use, while noting that false positives would be real.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that only providers can perform inline prevention before the next token is generated, but enterprises may still interrupt multi-step agent workflows at the tool layer. It calls on Anthropic and other frontier labs to expose workspace telemetry to enterprise customers in some usable form, such as raw readouts, derived signals, or alerts. It compares the current moment for agentic AI to the pre-CloudTrail period in cloud computing, arguing that logs must come before stronger controls.\u003c/p\u003e\n"},{"n":11,"title":"The serpent’s tongue: Luring the Python out of its den","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/","time":"10:00","priority":"MAY READ","score":58,"tldr":"Python packages can execute malicious code during installation or later through abused features like setup.py hooks, .pth files, sitecustomize modules, PYTHONPATH changes, entry points, and import-time payloads. Developers should reduce supply-chain risk with dependency auditing, pinned versions and hashes, isolated builds, cooldown periods for new releases, and SBOM/trusted publishing practices.","briefOverview":"\u003cp\u003ePython’s popularity, readable syntax, and extensive third-party library ecosystem make it an attractive target for threat actors seeking to compromise developer devices and infrastructure. The article explains that malicious packages and supply-chain attacks can abuse trust in Python’s packaging ecosystem to execute payloads during installation, without requiring the victim to import or run the package. It frames Python package installation across three layers: hosting, distribution, and installation.\u003c/p\u003e\n\n\u003cp\u003eThe article examines how packages can be hosted on PyPI, version control systems, or custom web servers, and how they are distributed as source distributions or wheel files. It highlights that source distributions can rely on \u003ccode\u003esetup.py\u003c/code\u003e, which may execute arbitrary code during installation or download, while modern \u003ccode\u003epyproject.toml\u003c/code\u003e files can also be used with build backends. It also explains that virtual environments isolate packages and binaries, but they still share the same file system and network interfaces.\u003c/p\u003e\n\n\u003cp\u003eThe technical analysis groups malicious techniques into build hook abuses and package content abuses. Examples include abusing \u003ccode\u003esetup.py\u003c/code\u003e command classes, \u003ccode\u003e.pth\u003c/code\u003e files, \u003ccode\u003esitecustomize\u003c/code\u003e and \u003ccode\u003eusercustomize\u003c/code\u003e hooks, \u003ccode\u003ePYTHONPATH\u003c/code\u003e, import-time code in \u003ccode\u003e__init__.py\u003c/code\u003e, \u003ccode\u003e__main__.py\u003c/code\u003e scripts, entry point hijacking, and overriding legitimate package contents. The article recommends layered defenses such as package scanning with tools like \u003ccode\u003epip-audit\u003c/code\u003e, lock files and cryptographic hashes, isolated build environments, dependency cooldowns, SBOMs, and PyPI Trusted Publishing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Python’s readable syntax, broad capabilities, and extensive package ecosystem make it an attractive target for malicious packages and supply-chain attacks.","A Python package can execute malicious code simply during installation, without requiring the victim to import the package, run its entry point, or otherwise interact with the infected code.","The article groups malicious Python package techniques into build hook abuses, such as setup.py command classes, .pth files, site hook modules, and PYTHONPATH manipulation, and package content abuses, such as import-time payloads, __main__.py scripts, entry point hijacking, and overriding legitimate package contents.","Persistent techniques described in the article include .pth files and sitecustomize or usercustomize hooks, which can run payloads every time Python is invoked in the affected environment.","Recommended defenses include scanning packages with tools such as pip-audit, using lock files and cryptographic hashes, installing packages in isolated environments, applying dependency cooldowns, generating SBOMs, and using PyPI Trusted Publishing."],"insights":["Virtual environments isolate Python packages and binaries, but the article stresses that they are not containerized because they still share the same file system and network interfaces.","A malicious .pth file placed directly under site-packages or dist-packages can execute with every Python invocation, including failed Python runs.","Running routine Python-based commands such as pip freeze can trigger malicious site hook code because pip uses the Python environment in the background.","Python distribution names and package directory names do not have to match, which allows a malicious distribution to place files into the same package folder as a legitimate library and override functions there.","Using an extra package index can expand the places pip searches for dependencies, making repository configuration itself part of the supply-chain risk described in the article."],"referencedReports":[{"title":"Stack Overflow Developer Survey 2025","url":"https://survey.stackoverflow.co/2025/technology#most-popular-technologies-language-language","publisher":"Stack Overflow","context":"The article cites the survey to support the claim that Python usage is rapidly growing among developers.","category":"","primary":false},{"title":"A year of open source vulnerability trends: CVEs, advisories, and malware","url":"https://github.blog/security/supply-chain-security/a-year-of-open-source-vulnerability-trends-cves-advisories-and-malware/","publisher":"GitHub","context":"The article cites GitHub’s 2025 security data for statistics on malware advisories and Python/Pip ecosystem targeting.","category":"","primary":false},{"title":"Unit 42 Incident Response Report","url":"https://www.paloaltonetworks.com/resources/research/unit-42-incident-response-report","publisher":"Palo Alto Networks Unit 42","context":"The article references the report when discussing how quickly exfiltration can occur after payload execution.","category":"","primary":false},{"title":"Infostealer Lifecycle: 48 Hours","url":"https://whiteintel.io/blog/infostealer-lifecycle-48-hours","publisher":"WhiteIntel","context":"The article cites this analysis to support the claim that stolen assets can be operationalized within a few days.","category":"","primary":false},{"title":"M-Trends","url":"https://cloud.google.com/security/resources/m-trends","publisher":"Google Cloud","context":"The article references M-Trends for recent dwell-time figures after compromise.","category":"","primary":false},{"title":"FortiGuard AI Detects Malicious Packages in PyPI","url":"https://www.fortinet.com/blog/threat-research/fortiguard-ai-detects-malicious-packages-in-pypi","publisher":"Fortinet","context":"The article cites this threat research as an example of setup.py install command class abuse observed in the wild.","category":"","primary":false},{"title":"TeamPCP Isn’t Done","url":"https://www.endorlabs.com/learn/teampcp-isnt-done","publisher":"Endor Labs","context":"The article references this analysis when describing TeamPCP’s use of .pth files in the litellm supply-chain compromise.","category":"","primary":false},{"title":"VIPERTUNNEL Python Backdoor Analysis","url":"https://socprime.com/active-threats/vipertunnel-python-backdoor-analysis/","publisher":"SOC Prime","context":"The article cites this analysis for VIPERTUNNEL backdoor abuse of Python site hooks to trigger DLL execution.","category":"","primary":false},{"title":"Needrestart Local Privilege Escalation Vulnerabilities","url":"https://www.qualys.com/2024/11/19/needrestart/needrestart.txt","publisher":"Qualys","context":"The article links to this vulnerability write-up while discussing security issues arising from misuse of the PYTHONPATH variable.","category":"","primary":false},{"title":"Lightning PyPI Compromise: Bun-Based Credential Stealer","url":"https://snyk.io/blog/lightning-pypi-compromise-bun-based-credential-stealer/","publisher":"Snyk","context":"The article cites this research as an in-the-wild example of malicious code hidden in __init__.py files.","category":"","primary":false},{"title":"This New Supply Chain Attack Technique Can Trojanize All Your CLI Commands","url":"https://checkmarx.com/blog/this-new-supply-chain-attack-technique-can-trojanize-all-your-cli-commands/","publisher":"Checkmarx","context":"The article references this research when describing search-order hijacking through Python package entry points.","category":"","primary":false}],"body":"\u003cp\u003ePython’s popularity, readable syntax, and extensive third-party library ecosystem make it an attractive target for threat actors seeking to compromise developer devices and infrastructure. The article explains that malicious packages and supply-chain attacks can abuse trust in Python’s packaging ecosystem to execute payloads during installation, without requiring the victim to import or run the package. It frames Python package installation across three layers: hosting, distribution, and installation.\u003c/p\u003e\n\n\u003cp\u003eThe article examines how packages can be hosted on PyPI, version control systems, or custom web servers, and how they are distributed as source distributions or wheel files. It highlights that source distributions can rely on \u003ccode\u003esetup.py\u003c/code\u003e, which may execute arbitrary code during installation or download, while modern \u003ccode\u003epyproject.toml\u003c/code\u003e files can also be used with build backends. It also explains that virtual environments isolate packages and binaries, but they still share the same file system and network interfaces.\u003c/p\u003e\n\n\u003cp\u003eThe technical analysis groups malicious techniques into build hook abuses and package content abuses. Examples include abusing \u003ccode\u003esetup.py\u003c/code\u003e command classes, \u003ccode\u003e.pth\u003c/code\u003e files, \u003ccode\u003esitecustomize\u003c/code\u003e and \u003ccode\u003eusercustomize\u003c/code\u003e hooks, \u003ccode\u003ePYTHONPATH\u003c/code\u003e, import-time code in \u003ccode\u003e__init__.py\u003c/code\u003e, \u003ccode\u003e__main__.py\u003c/code\u003e scripts, entry point hijacking, and overriding legitimate package contents. The article recommends layered defenses such as package scanning with tools like \u003ccode\u003epip-audit\u003c/code\u003e, lock files and cryptographic hashes, isolated build environments, dependency cooldowns, SBOMs, and PyPI Trusted Publishing.\u003c/p\u003e\n"},{"n":15,"title":"The State of Enterprise Cyber Crisis Readiness (report)","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/the-state-of-enterprise-cyber-crisis-readiness-report/","time":"13:55","priority":"MAY READ","score":55,"tldr":"A global survey of 1,000 organizations found that while many have cyber incident response plans and run exercises, most still face major blockers because teams are not practicing and coordinating holistically. The key gap is cross-team communication and coordination, not simply a lack of staffing.","briefOverview":"\u003cp\u003eThe article presents a report titled “The State of Enterprise Cyber Crisis Readiness,” published July 14, 2026. It describes a global study of 1,000 organizations across the US, UK, Europe, and the Asia-Pacific region. The study examines how organizations prepare for cyber threats and where they struggle in real-world crisis response.\u003c/p\u003e\n\n\u003cp\u003eThe report finds a disconnect between organizations’ perceived readiness and their actual performance during cyber incidents. It says cyber incident response plans are being implemented and regularly tested, but not holistically. In real-world crises, too many teams operate in silos, and less than 50% of organizations conduct tabletop exercises that include all the teams commonly involved in an actual crisis.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights major business impacts despite reported preparation. It states that 90% of organizations struggle with serious blockers to effective cyber response, 71% experienced at least one high-impact cyber incident that disrupted critical business functions in the past year, and 36% suffered multiple damaging incidents. The report concludes that resilience requires fixing gaps in cross-team communication and coordination rather than simply hiring more people.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The report is based on a global study of 1,000 organizations across the US, UK, Europe, and the Asia-Pacific region.","The study found a disconnect between organizations’ perceived cyber crisis readiness and their actual performance in cyber crisis response.","Ninety percent of organizations reported serious blockers to effective cyber response.","Less than 50% of organizations conduct tabletop exercises that include all the teams commonly involved in an actual crisis.","Seventy-one percent of organizations experienced at least one high-impact cyber incident that disrupted critical business functions in the past year, and 36% suffered multiple damaging incidents."],"insights":["Regularly testing incident response plans does not necessarily translate into crisis readiness if the exercises do not include all teams that would be involved in a real event.","The report identifies siloed response efforts as a central weakness, meaning the main readiness gap is coordination across teams rather than the mere existence of plans.","The finding that many organizations experienced business-disrupting incidents despite having plans and practice suggests that preparedness claims can mask operational weaknesses during real crises.","The report explicitly argues that hiring more people is not the primary fix; organizations need to improve cross-team communication and coordination to build resilience."],"referencedReports":[],"body":"\u003cp\u003eThe article presents a report titled “The State of Enterprise Cyber Crisis Readiness,” published July 14, 2026. It describes a global study of 1,000 organizations across the US, UK, Europe, and the Asia-Pacific region. The study examines how organizations prepare for cyber threats and where they struggle in real-world crisis response.\u003c/p\u003e\n\n\u003cp\u003eThe report finds a disconnect between organizations’ perceived readiness and their actual performance during cyber incidents. It says cyber incident response plans are being implemented and regularly tested, but not holistically. In real-world crises, too many teams operate in silos, and less than 50% of organizations conduct tabletop exercises that include all the teams commonly involved in an actual crisis.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights major business impacts despite reported preparation. It states that 90% of organizations struggle with serious blockers to effective cyber response, 71% experienced at least one high-impact cyber incident that disrupted critical business functions in the past year, and 36% suffered multiple damaging incidents. The report concludes that resilience requires fixing gaps in cross-team communication and coordination rather than simply hiring more people.\u003c/p\u003e\n"},{"n":5,"title":"Varonis Atlas Extends Coverage Across the Claude Enterprise Suite — From Claude Cowork to Claude Code","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/claude-coverage","time":"12:55","priority":"MAY READ","score":45,"tldr":"Varonis announced that its Atlas AI Security Platform now covers the full Claude enterprise suite, adding support for Claude Code and Claude Cowork alongside existing Claude Enterprise and Platform coverage. The update gives security teams runtime guardrails, monitoring, investigation, and posture management across Anthropic’s increasingly agentic tools.","briefOverview":"\u003cp\u003eVaronis announced that its Atlas AI Security Platform now secures the entire Claude enterprise suite. The release extends existing support for Claude Enterprise and Claude Platform to Claude Code and Claude Cowork. Varonis says this gives Atlas coverage across Anthropic assistants, developer tools, and infrastructure used to build and deploy Claude agents, including Microsoft Foundry and AWS Bedrock.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that Anthropic’s agents now do more than answer questions, including writing to local files, running terminal commands, and editing code. Varonis argues that fragmented coverage creates blind spots because risks can move across surfaces, such as a Claude Cowork task touching files related to a Claude Enterprise chat. The company positions Atlas as a way to apply visibility and control across these agentic environments.\u003c/p\u003e\n\n\u003cp\u003eFor Claude Code, Atlas provides runtime guardrails, AI Detection and Response, AI Security Posture Management, and activity monitoring across prompts, LLM calls, tool calls, MCP interactions, command execution, and agent actions. For Claude Cowork, Atlas supports a dedicated runtime integration that sends activity to Atlas so policies can evaluate events as they happen. The article says Cowork and Code can have separate policies, logging, and audit trails, and that Atlas can block, modify, alert on, or log activity depending on the event type.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Atlas now secures the entire Claude enterprise suite, extending existing support for Claude Enterprise and Claude Platform to Claude Code and Claude Cowork.","The article says Anthropic’s agents have expanded from answering questions to taking actions such as writing to local files, running terminal commands, and editing code.","For Claude Code, Atlas provides runtime guardrails, AI Detection and Response, AI Security Posture Management, and activity monitoring across prompts, LLM calls, tool calls, MCP interactions, command execution, and agent actions.","For Claude Cowork, Atlas supports a dedicated runtime integration that sends Cowork activity to Atlas so policies can evaluate events as they happen and apply separate policies, logging, and audit trails from Claude Code.","Varonis says comprehensive coverage means visibility follows Anthropic’s agents across Claude surfaces and connects back to the data context, permissions, and risk signals in the Varonis Data Security Platform."],"insights":["The article frames Claude Code as a security concern outside traditional CI/CD controls because it operates directly in the developer’s terminal and IDE with access to source code, environment variables, package managers, and shell execution.","Varonis separates Claude Cowork and Claude Code into distinct Guardrail Integration resources, allowing security teams to apply different policies, logging, and audit trails to each surface instead of using one shared control model.","Atlas is positioned to reconstruct Claude Code sessions at a granular level, including prompts, LLM calls, tool calls, MCP server activity, command execution, and agent actions, which makes investigations focus on the full agent workflow rather than only final outputs.","The article highlights that risks can cross Claude surfaces, such as a Cowork task touching the same sensitive files that a Claude Enterprise chat retrieved earlier, making fragmented visibility a specific blind spot."],"referencedReports":[],"body":"\u003cp\u003eVaronis announced that its Atlas AI Security Platform now secures the entire Claude enterprise suite. The release extends existing support for Claude Enterprise and Claude Platform to Claude Code and Claude Cowork. Varonis says this gives Atlas coverage across Anthropic assistants, developer tools, and infrastructure used to build and deploy Claude agents, including Microsoft Foundry and AWS Bedrock.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that Anthropic’s agents now do more than answer questions, including writing to local files, running terminal commands, and editing code. Varonis argues that fragmented coverage creates blind spots because risks can move across surfaces, such as a Claude Cowork task touching files related to a Claude Enterprise chat. The company positions Atlas as a way to apply visibility and control across these agentic environments.\u003c/p\u003e\n\n\u003cp\u003eFor Claude Code, Atlas provides runtime guardrails, AI Detection and Response, AI Security Posture Management, and activity monitoring across prompts, LLM calls, tool calls, MCP interactions, command execution, and agent actions. For Claude Cowork, Atlas supports a dedicated runtime integration that sends activity to Atlas so policies can evaluate events as they happen. The article says Cowork and Code can have separate policies, logging, and audit trails, and that Atlas can block, modify, alert on, or log activity depending on the event type.\u003c/p\u003e\n"},{"n":14,"title":"Human Risk Management 90-Day Playbook","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/human-risk-management-90-day-playbook/","time":"13:13","priority":"MAY READ","score":45,"tldr":"Living Security’s 90-Day Human Risk Management Playbook outlines a data-driven approach for moving beyond generic security awareness training to identify high-risk employees and deliver targeted microlearning. It promises measurable improvements such as fewer repeat phishing clickers and higher reporting rates within one quarter.","briefOverview":"\u003cp\u003eThe article presents the Human Risk Management 90-Day Playbook from Living Security, a Health-ISAC Community Champion. It describes the playbook as a modular, outcome-oriented roadmap for changing generic training into a data-driven engine for risk reduction. The article says most awareness programs are stuck in a “compliance loop” and see only 12% of actual human risk.\u003c/p\u003e\n\n\u003cp\u003eThe playbook focuses on helping organizations surface the riskiest 10% of their workforce and automate targeted microlearning. It frames this approach as a way to move beyond broad awareness training toward measurable risk reduction. The article highlights expected outcomes such as cutting repeat clickers by 40% and increasing report rates by 15% in one quarter.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Living Security, a Health-ISAC Community Champion, released a 90-Day Human Risk Management Playbook.","The article says most awareness programs are stuck in a compliance loop and see only 12% of actual human risk.","The playbook provides a modular, outcome-oriented roadmap for turning generic training into a data-driven engine for risk reduction.","The playbook describes how to identify the riskiest 10% of the workforce and automate targeted microlearning.","The article says the playbook can support measurable wins such as cutting repeat clickers by 40% and increasing report rates by 15% in one quarter."],"insights":["The playbook treats employee security risk as something to be prioritized by workforce segment, focusing attention on the riskiest 10% rather than applying the same training to everyone.","The article implies that compliance-based awareness programs may give organizations a misleadingly narrow view because they capture only 12% of actual human risk.","The article emphasizes short-term, measurable outcomes, presenting one quarter as enough time to track changes such as fewer repeat clickers and higher report rates."],"referencedReports":[],"body":"\u003cp\u003eThe article presents the Human Risk Management 90-Day Playbook from Living Security, a Health-ISAC Community Champion. It describes the playbook as a modular, outcome-oriented roadmap for changing generic training into a data-driven engine for risk reduction. The article says most awareness programs are stuck in a “compliance loop” and see only 12% of actual human risk.\u003c/p\u003e\n\n\u003cp\u003eThe playbook focuses on helping organizations surface the riskiest 10% of their workforce and automate targeted microlearning. It frames this approach as a way to move beyond broad awareness training toward measurable risk reduction. The article highlights expected outcomes such as cutting repeat clickers by 40% and increasing report rates by 15% in one quarter.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft starts testing cleaner Windows Search without ads","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-starts-testing-cleaner-windows-search-without-ads/","time":"10:47","priority":"MAY READ","score":35,"tldr":"Microsoft is testing a cleaner Windows Search for Insiders that prioritizes relevant local results over ads and promotional suggestions, with clearer result sources and new controls for web and Store suggestions. The update also improves file/app search reliability, typo tolerance, and two-character file queries.","briefOverview":"\u003cp\u003eMicrosoft is testing a cleaner and faster version of Windows Search that is designed to prioritize relevant results over ads and promotional content. The changes are part of a broader effort to improve Windows search across the Start menu, taskbar, File Explorer, and Settings. Microsoft said the work focuses on making results more dependable, easier to scan, and clearer before users click.\u003c/p\u003e\n\n\u003cp\u003eThe updates are available to Windows Insiders in the Experimental channel through Windows Search Box updates that began rolling out on Monday. The rollout is being handled through a Controlled Feature Rollout, so not all Insiders will see the changes immediately, though users can reboot to check for access and the features are also available through feature flags. A new setting under Settings \u0026gt; Privacy \u0026amp; Security \u0026gt; Search lets users choose whether Microsoft Store and web suggestions appear alongside local results.\u003c/p\u003e\n\n\u003cp\u003eThe updated Search experience more clearly labels whether results come from an app, Windows setting, file, web result, or Store suggestion. Microsoft said local content is now more reliably prioritized when it is the stronger match, file search supports two-character queries, and cloud files have improved visibility in results. The company also improved typo and partial-word handling for app searches and made reliability changes aimed at reducing crashes and loading issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is testing a cleaner and faster version of Windows Search that is intended to prioritize relevant results over ads and promotional content.","The Windows Search changes are available to Windows Insiders in the Experimental channel through Windows Search Box updates that began rolling out on Monday.","The rollout is being done through a Controlled Feature Rollout, so not all Insiders will see the new Windows Search immediately.","The updated Search results more clearly identify whether each result comes from an app, Windows setting, file, web result, or Microsoft Store suggestion.","Microsoft added a setting under Settings \u003e Privacy \u0026 Security \u003e Search that lets users choose whether Microsoft Store and web suggestions appear alongside local results."],"insights":["Windows 11 Insiders who do not immediately see the new Search experience can reboot to check for access, and the article says the features
