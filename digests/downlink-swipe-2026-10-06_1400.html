<script type="application/json" id="dl-articles">[{"n":2,"title":"Atlassian warns of critical file-access flaw in Jira, Confluence","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/atlassian-warns-of-critical-file-access-flaw-in-jira-confluence/","time":"17:34","priority":"MUST READ","score":94,"tldr":"Atlassian has issued patches for CVE-2026-21589, a critical unauthenticated arbitrary file-access flaw affecting multiple self-hosted Data Center products including Jira, Confluence, and Bitbucket. Administrators should update immediately or restrict external access and deploy the recommended temporary URL-filtering mitigations.","briefOverview":"\u003cp\u003eAtlassian has warned of CVE-2026-21589, a critical arbitrary file-access flaw affecting several self-hosted Data Center products, including Confluence, Jira, and Bitbucket. The issue allows an unauthenticated attacker to access specific files within an affected application\u0026rsquo;s web root directory. Exploitation requires knowing the target file\u0026rsquo;s exact name and path, and the flaw cannot be used to enumerate directory contents.\u003c/p\u003e\n\n\u003cp\u003eAffected products include Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo, Crowd, Crucible, and Fisheye, with Atlassian publishing fixed releases for each. The company urges administrators of self-hosted instances to install updates immediately; cloud customers require no action because Atlassian has already patched cloud products. Where patching cannot happen immediately, Atlassian recommends limiting external access and applying the specified WAF, proxy, or URL-rewrite mitigations across all cluster nodes, including Bitbucket mirrors. Atlassian said it has no evidence of active exploitation but advises customers to review access logs for the traversal patterns listed in its advisory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Atlassian has disclosed CVE-2026-21589, a critical arbitrary file-access vulnerability affecting multiple self-hosted Data Center products, including Confluence, Jira, and Bitbucket.","The flaw can allow an unauthenticated attacker to access specific files in an affected application's web root directory, but requires prior knowledge of the exact file name and path.","Atlassian released fixed versions for affected Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo, Crowd, Crucible, and Fisheye Data Center products.","Cloud customers do not need to take action because Atlassian has automatically patched its cloud products, while self-hosted administrators are urged to install updates immediately.","Atlassian said it has no evidence that CVE-2026-21589 is being exploited and recommends that customers review access logs for the traversal patterns described in its advisory."],"insights":["Although the flaw is unauthenticated, an attacker must already know the exact file name and location because the issue cannot be used to browse or list directories.","Organizations unable to patch immediately have several temporary options, including restricting external access and using web filtering or proxy rules to block the specified file-path patterns.","Mitigations must be deployed across every node in a cluster, including Bitbucket mirrors and mirror farm nodes, or unprotected systems may remain exposed.","Atlassian cannot determine whether individual customer installations were compromised, so self-hosted customers are advised to involve their local security teams and review relevant access logs."],"referencedReports":[{"title":"CVE-2026-21589 Arbitrary File Access Vulnerability Impacts Multiple Products","url":"https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html","publisher":"Atlassian","context":"The article cites Atlassian's security advisory for details on the arbitrary file-access flaw, affected product versions, patches, and temporary mitigations.","category":"advisory","primary":true}],"body":"\u003cp\u003eAtlassian has warned of CVE-2026-21589, a critical arbitrary file-access flaw affecting several self-hosted Data Center products, including Confluence, Jira, and Bitbucket. The issue allows an unauthenticated attacker to access specific files within an affected application\u0026rsquo;s web root directory. Exploitation requires knowing the target file\u0026rsquo;s exact name and path, and the flaw cannot be used to enumerate directory contents.\u003c/p\u003e\n\n\u003cp\u003eAffected products include Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo, Crowd, Crucible, and Fisheye, with Atlassian publishing fixed releases for each. The company urges administrators of self-hosted instances to install updates immediately; cloud customers require no action because Atlassian has already patched cloud products. Where patching cannot happen immediately, Atlassian recommends limiting external access and applying the specified WAF, proxy, or URL-rewrite mitigations across all cluster nodes, including Bitbucket mirrors. Atlassian said it has no evidence of active exploitation but advises customers to review access logs for the traversal patterns listed in its advisory.\u003c/p\u003e\n"},{"n":5,"title":"You Won’t Hear About These, Even In Myths (Atlassian Jira, Confluence (and more) Pre-Auth Arbitrary File Read CVE-2026-21589)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/","time":"17:01","priority":"MUST READ","score":94,"tldr":"CVE-2026-21589 is a critical pre-authentication arbitrary file-read flaw in shared Atlassian web-resource code affecting Jira, Confluence, Bitbucket, and other Data Center products. Attackers can use encoded path traversal to read application files such as Crowd credentials, potentially enabling administrative takeover where Crowd integration is exposed.","briefOverview":"\u003cp\u003eAtlassian issued an out-of-band critical advisory for CVE-2026-21589, an arbitrary file-access issue described in the article as a pre-authentication arbitrary file-read vulnerability. It affects versions prior to listed fixes across Bitbucket Data Center, Confluence Data Center, Jira Software and Jira Service Management Data Center, Bamboo Data Center, Crowd Data Center, Crucible, and Fisheye. The article attributes the broad impact to shared Atlassian web-resource functionality used by these products.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that shared code converts double colons (\u003ccode\u003e::\u003c/code\u003e) into forward slashes, allowing path-traversal-style requests to reach files within an application\u0026rsquo;s Tomcat context. They demonstrated reading protected \u003ccode\u003eWEB-INF\u003c/code\u003e files, including Jira\u0026rsquo;s \u003ccode\u003eweb.xml\u003c/code\u003e, through a resource-download route. In Jira environments integrated with Atlassian Crowd, the readable \u003ccode\u003eWEB-INF/classes/crowd.properties\u003c/code\u003e file can contain a plaintext Crowd application password and server details; the article shows that those credentials can be used to perform Crowd user-management actions, including creating a user and adding it to the \u003ccode\u003ejira-administrators\u003c/code\u003e group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Atlassian disclosed CVE-2026-21589 as an arbitrary file-access issue that the article describes as a pre-authentication arbitrary file-read vulnerability affecting multiple products.","The issue affects versions before specified fixes for Bitbucket Data Center, Confluence Data Center, Jira Software and Jira Service Management Data Center, Bamboo Data Center, Crowd Data Center, Crucible, and Fisheye.","The researchers identified shared web-resource code that replaces double colons with forward slashes, enabling path traversal payloads using sequences such as \"..::\".","The researchers demonstrated reading protected application files such as Jira's WEB-INF/web.xml, while noting that traversal was limited to the Tomcat application context.","In Jira deployments integrated with Atlassian Crowd, reading WEB-INF/classes/crowd.properties can expose a plaintext Crowd application password that can be used to access Crowd user-management functions."],"insights":["The unusual use of double colons in Atlassian's suggested filtering rule directly reflected the vulnerable shared code's conversion of \"::\" into forward slashes.","Although the demonstrated file reading was limited to the Tomcat application context, it could still reach normally protected WEB-INF files, including configuration files.","The severity can vary by deployment: Jira instances configured to use Atlassian Crowd may store a Crowd application name, password, and server URL in a plaintext crowd.properties file under WEB-INF/classes.","Leaked Crowd application credentials can enable user-management actions such as listing users, creating a user, and adding that user to the jira-administrators group, though Crowd IP allowlisting may make direct access harder."],"referencedReports":[{"title":"CVE-2026-21589 Arbitrary File Access Vulnerability Impacts Multiple Products","url":"https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html","publisher":"atlassian","context":"The article cites Atlassian's out-of-band security advisory as the disclosure of the critical vulnerability and its affected-product fix versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eAtlassian issued an out-of-band critical advisory for CVE-2026-21589, an arbitrary file-access issue described in the article as a pre-authentication arbitrary file-read vulnerability. It affects versions prior to listed fixes across Bitbucket Data Center, Confluence Data Center, Jira Software and Jira Service Management Data Center, Bamboo Data Center, Crowd Data Center, Crucible, and Fisheye. The article attributes the broad impact to shared Atlassian web-resource functionality used by these products.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that shared code converts double colons (\u003ccode\u003e::\u003c/code\u003e) into forward slashes, allowing path-traversal-style requests to reach files within an application\u0026rsquo;s Tomcat context. They demonstrated reading protected \u003ccode\u003eWEB-INF\u003c/code\u003e files, including Jira\u0026rsquo;s \u003ccode\u003eweb.xml\u003c/code\u003e, through a resource-download route. In Jira environments integrated with Atlassian Crowd, the readable \u003ccode\u003eWEB-INF/classes/crowd.properties\u003c/code\u003e file can contain a plaintext Crowd application password and server details; the article shows that those credentials can be used to perform Crowd user-management actions, including creating a user and adding it to the \u003ccode\u003ejira-administrators\u003c/code\u003e group.\u003c/p\u003e\n"},{"n":4,"title":"ASOS confirms data breach after “HACKED” in-app notifications","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/asos-confirms-data-breach-after-hacked-in-app-notifications/","time":"16:33","priority":"SHOULD READ","score":84,"tldr":"ASOS confirmed unauthorized access to third-party customer communications platforms after attackers sent “ASOS HACKED” push notifications through its app and claimed to have compromised its Snowflake environment. Names and contact details may have been exposed, while ASOS says it does not believe passwords or payment-card data were affected.","briefOverview":"\u003cp\u003eASOS confirmed that third-party platforms it uses to communicate with customers were accessed without authorization. The incident became public after attackers sent unauthorized “ASOS HACKED” push notifications through the retailer’s official mobile app. ASOS says basic personal information, including names and contact details, may have been exposed, but it does not believe account passwords or payment-card information were affected.\u003c/p\u003e\n\n\u003cp\u003eThe notification directed ASOS to a Telegram channel run by a group calling itself the Xuanye group, which claimed it had fully compromised the company’s Snowflake environment and threatened to leak data. ASOS has not confirmed that Snowflake was compromised, and the group did not provide evidence or disclose what data it allegedly stole or how many customers were affected. ASOS is displaying an in-app warning telling customers to disregard the unauthorized alert and not click or engage with the external link it contained.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ASOS confirmed that third-party platforms it uses to communicate with customers were accessed without authorization, and that names and contact details may have been exposed.","Unauthorized push notifications reading “ASOS HACKED” were sent through the official ASOS mobile app at approximately 5:00 a.m. ET on Tuesday.","The attackers, calling themselves the Xuanye group, claimed to have fully compromised ASOS’s Snowflake instance and threatened to leak data, but provided no evidence in the article.","ASOS has not confirmed that its Snowflake environment was compromised or disclosed how many customers may have been affected.","ASOS said it does not believe payment-card information or account passwords were impacted and instructed customers not to click or engage with the external link in the unauthorized notification."],"insights":["The incident let attackers use ASOS’s official app to distribute their own message, making the malicious alert appear through a trusted customer channel.","ASOS confirmed unauthorized access to third-party communication platforms, but has not confirmed the attackers’ separate claim that its Snowflake environment was compromised.","The article reports that the alert reached many, and possibly all, ASOS mobile-app users, while the number of customers whose personal information may have been exposed remains undisclosed.","ASOS’s immediate customer guidance is narrowly focused on avoiding the external link in the unauthorized notification, and the company says it does not believe passwords or payment-card details were affected."],"referencedReports":[],"body":"\u003cp\u003eASOS confirmed that third-party platforms it uses to communicate with customers were accessed without authorization. The incident became public after attackers sent unauthorized “ASOS HACKED” push notifications through the retailer’s official mobile app. ASOS says basic personal information, including names and contact details, may have been exposed, but it does not believe account passwords or payment-card information were affected.\u003c/p\u003e\n\n\u003cp\u003eThe notification directed ASOS to a Telegram channel run by a group calling itself the Xuanye group, which claimed it had fully compromised the company’s Snowflake environment and threatened to leak data. ASOS has not confirmed that Snowflake was compromised, and the group did not provide evidence or disclose what data it allegedly stole or how many customers were affected. ASOS is displaying an in-app warning telling customers to disregard the unauthorized alert and not click or engage with the external link it contained.\u003c/p\u003e\n"},{"n":3,"title":"Fake ChatGPT, Gemini Sites steal advertising accounts, MFA codes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fake-chatgpt-gemini-sites-steal-advertising-accounts-mfa-codes/","time":"15:16","priority":"SHOULD READ","score":82,"tldr":"A phishing campaign is impersonating AI tools such as ChatGPT, Gemini, Claude, Perplexity, and Meta Muse to steal advertising-account credentials and MFA codes through convincing browser-in-the-browser fake login popups. The operator-driven kit supports Google, Meta, TikTok, and Okta sign-in flows and has reportedly collected hundreds of victim submissions.","briefOverview":"\u003cp\u003eA phishing operation is using fake websites impersonating ChatGPT, Gemini, Claude, Perplexity, and Meta’s Muse AI agent to target advertising agency staff, media buyers, and account administrators. The sites claim to help with advertising tasks such as reaching buyers, obtaining ad briefs, and auditing campaign spending. Victims are prompted to connect an account, which opens a convincing but fraudulent Google login window within the web page.\u003c/p\u003e\n\n\u003cp\u003eThe embedded login window is designed to steal credentials and multi-factor authentication codes, while a human operator controls the victim’s prompts in real time. Operators can request passwords, SMS or authenticator codes, Google approvals, Okta push requests, or QR-code scans, and can reject codes or hold victims on waiting screens. Island researchers linked the activity to a broader operation using advertising, refund, and recruitment lures, with shared Next.js and Socket.IO infrastructure; compromised advertising accounts may provide access to downstream clients, enable fraudulent ad spending, or be resold to other criminals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing campaign uses fake ChatGPT, Gemini, Claude, Perplexity, and Meta Muse sites to target advertising agency staff, media buyers, and administrators with advertising-account access.","The fraudulent sites use a fake Google sign-in window embedded inside the page to collect account credentials and multi-factor authentication codes.","After a victim enters the sign-in flow, a human operator can request passwords, SMS or authenticator codes, approval prompts, or QR-code scans and can control the flow in real time.","Researchers at Island linked the activity to a broader operation using fake advertising, refund, and recruitment lures that shared infrastructure and exposed source code in public GitHub repositories.","Compromised advertising accounts can provide access to downstream client accounts, allow fraudulent spending of account balances, or be resold to other cybercriminals."],"insights":["A fake sign-in popup can be detected by trying to move or resize it, because the embedded fake window cannot leave or resize beyond the browser page like a real login window can.","The phishing kit adapts its appearance for Windows, macOS, iOS, and Android, including browser styling and dark-mode support, making the deception work across device types.","Human operators can reject submitted verification codes, keep victims on a waiting screen, or stop the process, allowing them to manage the theft attempt in real time.","The platform recreates login pages locally and sends stolen credentials and verification information through its own application interfaces, making its traffic appear to come from an AI product communicating with an unrelated backend."],"referencedReports":[{"title":"Behind the Connect Button: The Fake AI Ads Campaign","url":"https://www.island.io/blog/behind-the-connect-button-the-fake-ai-ads-campaign","publisher":"island","context":"The article relies on Island researchers' report detailing the fake AI advertising sites, browser-in-the-browser credential theft flow, and supporting phishing infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eA phishing operation is using fake websites impersonating ChatGPT, Gemini, Claude, Perplexity, and Meta’s Muse AI agent to target advertising agency staff, media buyers, and account administrators. The sites claim to help with advertising tasks such as reaching buyers, obtaining ad briefs, and auditing campaign spending. Victims are prompted to connect an account, which opens a convincing but fraudulent Google login window within the web page.\u003c/p\u003e\n\n\u003cp\u003eThe embedded login window is designed to steal credentials and multi-factor authentication codes, while a human operator controls the victim’s prompts in real time. Operators can request passwords, SMS or authenticator codes, Google approvals, Okta push requests, or QR-code scans, and can reject codes or hold victims on waiting screens. Island researchers linked the activity to a broader operation using advertising, refund, and recruitment lures, with shared Next.js and Socket.IO infrastructure; compromised advertising accounts may provide access to downstream clients, enable fraudulent ad spending, or be resold to other criminals.\u003c/p\u003e\n"},{"n":8,"title":"South Korean officials believe AI agents were used to hack several banks","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/south-korean-bank-hacks-ai-agents","time":"15:29","priority":"SHOULD READ","score":82,"tldr":"South Korean authorities are investigating breaches at at least seven financial institutions that exposed data on roughly 68,000 people, with officials suspecting the Chinese AI cybersecurity tool Artex AI was used. The case is being described as a potentially early example of AI agents being used to compromise the financial sector.","briefOverview":"\u003cp\u003eSouth Korean authorities are investigating breaches at at least seven financial institutions that reportedly exposed the personal data of at least 68,000 people. The affected companies include Hana Bank, KB Kookmin Bank, and Shinhan Bank, which said data belonging to about 25,000 customers was exposed. Reportedly exposed information included customers’ names, phone numbers, incomes, and borrowing histories.\u003c/p\u003e\n\n\u003cp\u003eOfficials believe the Chinese cybersecurity tool Artex AI was used against the banks, and President Lee Jae Myung said signs indicated AI agents were deployed in at least some of the incidents. Authorities have identified 33 IP addresses associated with the activity, linked to at least 12 countries, including Japan, the United States, Thailand, Vietnam, and Hong Kong. The National Office of Investigation formed a 28-person team, while Lee pledged staffing and funding to limit the damage from what officials described as the first known AI-agent hacking of the financial sector.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["South Korean authorities are investigating breaches at at least seven financial institutions that reportedly exposed the personal data of at least 68,000 people.","Officials believe the Chinese cybersecurity tool Artex AI was used in the bank intrusions, and President Lee Jae Myung said signs suggest AI agents were deployed in at least some incidents.","The exposed information reportedly included customers’ names, phone numbers, incomes, and borrowing histories; Shinhan Bank said data for about 25,000 customers was affected.","South Korea’s Financial Supervisory Service said investigators identified 33 IP addresses linked to the incidents, with connections to at least 12 countries including Japan, the United States, Thailand, Vietnam, and Hong Kong.","South Korea’s National Office of Investigation formed a 28-person investigative team to examine the incidents."],"insights":["Officials described the incidents as the first known example of AI agents hacking the financial sector, highlighting a possible new risk for financial institutions.","The investigation spans 33 IP addresses linked to at least 12 countries, illustrating the cross-border scope of the activity being examined.","The article places the South Korean incidents alongside reported AI-agent-related compromises involving Australia’s Medicare database and Hugging Face, indicating that such reports have recently extended beyond a single target type.","Following criticism over the Australian incident, OpenAI said it changed its process to require quicker notification of organizations suspected to have been breached by its agents."],"referencedReports":[],"body":"\u003cp\u003eSouth Korean authorities are investigating breaches at at least seven financial institutions that reportedly exposed the personal data of at least 68,000 people. The affected companies include Hana Bank, KB Kookmin Bank, and Shinhan Bank, which said data belonging to about 25,000 customers was exposed. Reportedly exposed information included customers’ names, phone numbers, incomes, and borrowing histories.\u003c/p\u003e\n\n\u003cp\u003eOfficials believe the Chinese cybersecurity tool Artex AI was used against the banks, and President Lee Jae Myung said signs indicated AI agents were deployed in at least some of the incidents. Authorities have identified 33 IP addresses associated with the activity, linked to at least 12 countries, including Japan, the United States, Thailand, Vietnam, and Hong Kong. The National Office of Investigation formed a 28-person team, while Lee pledged staffing and funding to limit the damage from what officials described as the first known AI-agent hacking of the financial sector.\u003c/p\u003e\n"},{"n":6,"title":"Alleged ATM malware creator appears in Nebraska court after arrest","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/atm-malware-creator-appears-in-nebraska-court","time":"15:53","priority":"SHOULD READ","score":78,"tldr":"Alleged Ploutus ATM-malware developer Anibal Alexander Canelon Aguirre has appeared in a Nebraska federal court and pleaded not guilty after being returned to the United States. Prosecutors say his ATM-jackpotting operation stole more than $5.4 million and had links to Venezuela’s Tren de Aragua criminal group.","briefOverview":"\u003cp\u003eAnibal Alexander Canelon Aguirre, a Venezuelan national known as “Prometheus” and “The Engineer,” pleaded not guilty in a Nebraska federal court to charges connected to ATM jackpotting and will remain detained pending trial. U.S. authorities allege he was a key architect of Ploutus, software used to make ATMs dispense their cash after criminals opened the machines and connected personal devices. He faces charges including bank fraud conspiracy, bank burglary conspiracy, computer-related fraud, money laundering, and providing material support to terrorists, with up to 70 years in prison if convicted.\u003c/p\u003e\n\n\u003cp\u003eThe FBI added Aguirre to its Top 10 Most Wanted Fugitives list in March, making him the first cybercriminal placed on the list. The Justice Department did not explain how he was returned to the United States, saying he was not extradited; Fox News reported that he was arrested in Venezuela last month. Officials say 1,500 ATM jackpotting attacks have caused \u003cspan class=\"math inline\"\u003e\\(40.7 million in losses, while Aguirre and others allegedly carried out 117 attacks between February 2024 and December 2025 that generated more than \\)\u003c/span\u003e5.4 million.\u003c/p\u003e\n\n\u003cp\u003eAuthorities allege that proceeds from the ATM thefts were transferred to members of the Venezuelan criminal group Tren de Aragua and concealed through cryptocurrency or companies in Mexico and elsewhere. People involved in the operation allegedly traveled to remote ATMs, opened them, and retained part of the proceeds before sending the rest to Aguirre and other senior figures. Although U.S. officials call Aguirre the mastermind behind Ploutus, cybersecurity researchers who have followed the software for more than a decade have not verified that he was its actual developer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anibal Alexander Canelon Aguirre pleaded not guilty in a Nebraska federal court and will remain detained pending trial on charges tied to ATM jackpotting.","U.S. authorities allege Aguirre was a key architect of Ploutus, software used to make ATMs dispense their cash after criminals physically accessed the machines and installed it.","Aguirre faces charges including conspiracy to commit bank fraud, bank burglary, computer-related fraud, money laundering, and providing material support to terrorists, with a potential sentence of up to 70 years if convicted.","Prosecutors allege Aguirre and others carried out 117 ATM jackpotting incidents from February 2024 through December 2025, stealing more than $5.4 million.","U.S. officials have recorded at least 1,500 ATM jackpotting attacks causing $40.7 million in losses and have alleged links between the scheme and the Venezuelan criminal group Tren de Aragua."],"insights":["Although U.S. authorities describe Aguirre as the Ploutus mastermind, cybersecurity researchers who have tracked the software for more than a decade have not been able to verify that he actually developed it.","The Justice Department declined to explain how Aguirre was brought back to the United States, stating that he was not extradited despite having been outside the country.","The alleged operation relied on people physically opening ATMs while Aguirre remotely installed the software, showing that the theft method combined in-person access with remote control.","Aguirre was the first cybercriminal added to the FBI’s Top 10 Most Wanted Fugitives list, underscoring the priority U.S. authorities placed on the case."],"referencedReports":[{"title":"New Ploutus variant","url":"https://cloud.google.com/blog/topics/threat-intelligence/new-ploutus-variant","publisher":"google-cloud","context":"The article links to this technical analysis while describing Ploutus as one of the most advanced malware strains designed to target ATMs.","category":"research","primary":false}],"body":"\u003cp\u003eAnibal Alexander Canelon Aguirre, a Venezuelan national known as “Prometheus” and “The Engineer,” pleaded not guilty in a Nebraska federal court to charges connected to ATM jackpotting and will remain detained pending trial. U.S. authorities allege he was a key architect of Ploutus, software used to make ATMs dispense their cash after criminals opened the machines and connected personal devices. He faces charges including bank fraud conspiracy, bank burglary conspiracy, computer-related fraud, money laundering, and providing material support to terrorists, with up to 70 years in prison if convicted.\u003c/p\u003e\n\n\u003cp\u003eThe FBI added Aguirre to its Top 10 Most Wanted Fugitives list in March, making him the first cybercriminal placed on the list. The Justice Department did not explain how he was returned to the United States, saying he was not extradited; Fox News reported that he was arrested in Venezuela last month. Officials say 1,500 ATM jackpotting attacks have caused \u003cspan class=\"math inline\"\u003e\\(40.7 million in losses, while Aguirre and others allegedly carried out 117 attacks between February 2024 and December 2025 that generated more than \\)\u003c/span\u003e5.4 million.\u003c/p\u003e\n\n\u003cp\u003eAuthorities allege that proceeds from the ATM thefts were transferred to members of the Venezuelan criminal group Tren de Aragua and concealed through cryptocurrency or companies in Mexico and elsewhere. People involved in the operation allegedly traveled to remote ATMs, opened them, and retained part of the proceeds before sending the rest to Aguirre and other senior figures. Although U.S. officials call Aguirre the mastermind behind Ploutus, cybersecurity researchers who have followed the software for more than a decade have not verified that he was its actual developer.\u003c/p\u003e\n"},{"n":7,"title":"Osaka Metropolitan University cancels classes after suspected ransomware attack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/osaka-university-cancels-classes-ransomware","time":"14:52","priority":"SHOULD READ","score":78,"tldr":"Osaka Metropolitan University canceled classes and took much of its IT infrastructure offline after a suspected ransomware attack disabled roughly 500 servers. The university is investigating a possible exposure of data belonging to at least 130,000 people, though it has not confirmed data theft.","briefOverview":"\u003cp\u003eOsaka Metropolitan University canceled classes and shut down much of its IT infrastructure after a suspected ransomware incident that began late last week. The disruption made the internal network, email, websites, and systems for academic administration, education support, accounting, payroll, human resources, and library services unavailable. The university said it is investigating with outside cybersecurity specialists and has not identified the attackers or confirmed a ransom demand.\u003c/p\u003e\n\n\u003cp\u003eJapanese media reported that about 500 servers stopped operating and that information belonging to at least 130,000 current and former students, faculty, and other associated people may have been exposed. OMU has not confirmed that personal data was stolen, but it reported the incident to Japan’s data protection authority and other government agencies. Entrance-exam and enrollment systems hosted externally remained available, while the university hospital’s electronic medical record system and veterinary clinical center continued operating.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Osaka Metropolitan University canceled classes and shut down much of its IT infrastructure after a suspected ransomware incident began late last week.","The outage made the university’s internal network, email, and systems for academic administration, educational support, accounting, payroll, human resources, library services, and websites unavailable.","Japanese media reported that approximately 500 servers stopped operating and that data associated with at least 130,000 current and former students, faculty, and others may have been exposed.","The university has not confirmed that personal information was stolen, is investigating with external cybersecurity specialists, and has reported the incident to Japan’s data protection authority and other government agencies.","OMU planned to resume in-person classes on Friday, while online-class resumption depends on system recovery; its entrance application systems and university hospital electronic medical records remained operational."],"insights":["Externally hosted entrance-exam application and enrollment systems remained available despite the wider university outage, unlike many internally operated services.","The university hospital’s electronic medical record system and the veterinary clinical center continued operating, limiting the disruption to medical and veterinary services.","Potentially affected records may include data from Osaka Prefecture University and Osaka City University, which merged to form Osaka Metropolitan University in 2022.","The incident affected both teaching functions and back-office operations, including payroll, financial accounting, human resources, and library services."],"referencedReports":[],"body":"\u003cp\u003eOsaka Metropolitan University canceled classes and shut down much of its IT infrastructure after a suspected ransomware incident that began late last week. The disruption made the internal network, email, websites, and systems for academic administration, education support, accounting, payroll, human resources, and library services unavailable. The university said it is investigating with outside cybersecurity specialists and has not identified the attackers or confirmed a ransom demand.\u003c/p\u003e\n\n\u003cp\u003eJapanese media reported that about 500 servers stopped operating and that information belonging to at least 130,000 current and former students, faculty, and other associated people may have been exposed. OMU has not confirmed that personal data was stolen, but it reported the incident to Japan’s data protection authority and other government agencies. Entrance-exam and enrollment systems hosted externally remained available, while the university hospital’s electronic medical record system and veterinary clinical center continued operating.\u003c/p\u003e\n"},{"n":9,"title":"How to mitigate the risk from AI-generated apps built by your 'citizen coder' employees","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-to-secure-mitigate-ai-risk-vibe-coding-ai-apps-citizen-coders","time":"15:00","priority":"MAY READ","score":45,"tldr":"AI-enabled citizen developers can rapidly create useful workplace apps, but unmanaged apps introduce shadow AI, insecure code, data exposure, and compliance risks. Tenable recommends structured AI governance, departmental AI leaders, approved tools, and mandatory security training instead of blanket bans.","briefOverview":"\u003cp\u003eAI tools are enabling non-technical employees to build workplace applications quickly using natural-language prompts. While these applications can automate workflows and reduce pressure on professional developers, unsanctioned apps can become shadow AI assets when they bypass IT and security oversight. The article says these apps may contain untested code, dangerous misconfigurations, risky open-source components, insecure access to critical systems, and poorly protected sensitive data. They may also lack patching, monitoring, logging, backups, disaster-recovery coverage, and appropriate identity and access controls.\u003c/p\u003e\n\n\u003cp\u003eTenable argues that blanket bans on AI-aided development may drive employees to conceal their work, so it advocates structured governance instead. Its five-tier model includes executive strategy, governance boards and technical councils, departmental AI Functional Leaders, enablement teams, and employee support communities. AI Functional Leaders oversee departmental requests for skills, connectors, and data access, helping identify unvetted external AI components before applications reach production. Tenable also ties AI-tool access to mandatory security and responsible-use training, supplemented by webinars, courses, tool-specific instruction, and regular peer sessions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI tools allow non-technical employees to create workplace applications quickly, but unsanctioned apps can bypass testing and security oversight and become shadow AI assets.","Citizen-built applications may contain critical vulnerabilities, risky open-source components, excessive permissions, insecure access to company systems, and sensitive data that is not properly protected.","Tenable states that blanket bans on AI-aided development can backfire because employees may hide their application-building activities.","Tenable uses a five-tier AI governance model spanning executive strategy, governance boards, departmental execution, enablement groups, and employee communities.","Tenable ties AI tool access to mandatory security and responsible-use training and assigns AI Functional Leaders to oversee departmental requests for skills, connectors, and data access."],"insights":["The governance challenge is not limited to unauthorized apps: even approved citizen-developed apps can overwhelm IT and security teams because of the volume requiring review, deployment, and ongoing maintenance.","Citizen coders may use their legitimate business-application access to create local data lakes for AI-powered apps, creating both escalating AI-token costs and dangerous data sprawl.","Tenable gives departmental AI Functional Leaders direct responsibility for AI skill approvals, operational queues, and adoption, enabling them to identify unvetted external AI components before an app reaches production.","Tenable makes access to AI tools conditional on mandatory security and responsible-use training, then reinforces it with webinars, tool-specific instruction, and peer-support sessions."],"referencedReports":[{"title":"OWASP Citizen Development Top 10 Security Risks","url":"https://owasp.github.io/www-project-citizen-development-top10-security-risks/#div-main","publisher":"Open Worldwide Application Security Project","context":"The article cites this OWASP list as documentation of security and compliance risks associated with citizen-developed applications.","category":"guide","primary":false}],"body":"\u003cp\u003eAI tools are enabling non-technical employees to build workplace applications quickly using natural-language prompts. While these applications can automate workflows and reduce pressure on professional developers, unsanctioned apps can become shadow AI assets when they bypass IT and security oversight. The article says these apps may contain untested code, dangerous misconfigurations, risky open-source components, insecure access to critical systems, and poorly protected sensitive data. They may also lack patching, monitoring, logging, backups, disaster-recovery coverage, and appropriate identity and access controls.\u003c/p\u003e\n\n\u003cp\u003eTenable argues that blanket bans on AI-aided development may drive employees to conceal their work, so it advocates structured governance instead. Its five-tier model includes executive strategy, governance boards and technical councils, departmental AI Functional Leaders, enablement teams, and employee support communities. AI Functional Leaders oversee departmental requests for skills, connectors, and data access, helping identify unvetted external AI components before applications reach production. Tenable also ties AI-tool access to mandatory security and responsible-use training, supplemented by webinars, courses, tool-specific instruction, and regular peer sessions.\u003c/p\u003e\n"},{"n":1,"title":"How to secure RMM software: 8 controls MSPs should test","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/how-to-secure-rmm-software-8-controls-msps-should-test/","time":"14:00","priority":"MAY READ","score":35,"tldr":"Sponsored by Acronis, the article advises MSPs to test eight RMM security controls—including discovery, patching, least-privilege access, safe automation, recovery, and tenant isolation—because RMM platforms create a high-value administrative attack surface. It promotes Acronis RMM as an integrated option for managing these workflows.","briefOverview":"\u003cp\u003eThis sponsored Acronis article argues that remote monitoring and management (RMM) software is a major attack surface for managed service providers because it gives technicians unattended administrative access across many customer devices. It cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, a maximum-severity pre-authentication remote-code-execution flaw in N-central, and Microsoft SharePoint “ToolShell” zero-days exploited before a patch was available. The article also cites CISA’s warning that ransomware actors abuse legitimate RMM tools to reach downstream customer networks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that MSPs evaluate RMM products by testing eight controls: endpoint discovery, risk-based patching, privileged-access restrictions, alert prioritization, secure scripting, security-operations integration, recovery readiness, and tenant separation with audit trails. It advises testing difficult scenarios such as an unmanaged device, failed patch, unauthorized script, compromised test device, restricted technician account, and a restored system that still requires updates. Acronis presents its RMM offering, part of Acronis Cyber Platform, as an integrated option for RMM, cybersecurity, backup, and recovery, while noting that capabilities and licensing depend on the service package.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["RMM platforms give technicians unattended administrative access to many customer devices, so a compromised privileged account or management server can affect far more than one endpoint.","The article cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, a maximum-severity pre-authentication remote-code-execution flaw in N-central, and notes that about 1,500 servers were exposed online.","It recommends that MSPs test eight RMM control areas: device discovery, risk-based patching, access controls, alert handling, secure scripting, security-operation integration, recovery readiness, and tenant separation with audit trails.","The article recommends testing difficult scenarios such as an unmanaged device, a failed update, an unauthorized script, a compromised test device, restricted technician access, and a restored system that still needs updates.","The sponsored article presents Acronis RMM as part of Acronis Cyber Platform and says capabilities and licensing vary by service package."],"insights":["The article recommends evaluating RMM products by deliberately introducing failures and risky conditions into a test environment, rather than relying on demonstrations or feature-list comparisons.","A recovery test should confirm not only that a system can be restored, but also that the restored system is intact, scanned for malicious software where available, and brought fully up to date before returning online.","For managed service providers, tenant separation should be tested across policies, permissions, reports, and administrator actions, not treated as a single configuration setting.","The article argues that a unified platform is not automatically preferable: organizations with mature integrations should weigh reduced console switching and reconciliation work against the flexibility and specialist capabilities of separate tools.","The practical measure of integration is whether technicians can move from device discovery through patching, investigation, containment, and recovery without losing the customer, device, or incident context."],"referencedReports":[{"title":"AA23-025A: Understanding Ransomware Threat Actors: LockBit","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a","publisher":"cisa","context":"The article cites this CISA advisory to note that ransomware actors abuse legitimate RMM software to access downstream customer networks.","category":"advisory","primary":false}],"body":"\u003cp\u003eThis sponsored Acronis article argues that remote monitoring and management (RMM) software is a major attack surface for managed service providers because it gives technicians unattended administrative access across many customer devices. It cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, a maximum-severity pre-authentication remote-code-execution flaw in N-central, and Microsoft SharePoint “ToolShell” zero-days exploited before a patch was available. The article also cites CISA’s warning that ransomware actors abuse legitimate RMM tools to reach downstream customer networks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that MSPs evaluate RMM products by testing eight controls: endpoint discovery, risk-based patching, privileged-access restrictions, alert prioritization, secure scripting, security-operations integration, recovery readiness, and tenant separation with audit trails. It advises testing difficult scenarios such as an unmanaged device, failed patch, unauthorized script, compromised test device, restricted technician account, and a restored system that still requires updates. Acronis presents its RMM offering, part of Acronis Cyber Platform, as an integrated option for RMM, cybersecurity, backup, and recovery, while noting that capabilities and licensing depend on the service package.\u003c/p\u003e\n"}]</script>
