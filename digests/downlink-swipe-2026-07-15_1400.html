<script type="application/json" id="dl-articles">[{"n":7,"title":"CVE-2026-15409, CVE-2026-15410: SonicWall SMA 1000 zero-day vulnerabilities exploited in the wild","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/cve-2026-15409-cve-2026-15410-sonicwall-sma-1000-zero-day-vulnerabilities-exploited-in-the","time":"17:14","priority":"MUST READ","score":96,"tldr":"SonicWall patched two actively exploited SMA 1000 zero-day vulnerabilities that could be chained for unauthenticated remote code execution on internet-facing appliances. Organizations should urgently upgrade to the fixed versions and review SonicWall’s indicators of compromise for signs of exploitation.","briefOverview":"\u003cp\u003eSonicWall patched two recently exploited zero-day vulnerabilities in its SMA 1000 Series secure remote access appliances. The flaws are CVE-2026-15409, a server-side request forgery vulnerability in the SMA 1000 Workplace interface, and CVE-2026-15410, a code injection vulnerability in the Appliance Management Console. SonicWall confirmed that exploitation of these vulnerabilities has been observed in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article says the vulnerabilities may have been chained together to allow fully remote, unauthenticated arbitrary OS command execution on affected appliances. This is significant because SMA 1000 appliances are internet-facing remote access gateways that can contain administrator credentials, VPN session tokens, and information about internal network architecture. SonicWall has not provided attribution for the threat actors behind the attacks.\u003c/p\u003e\n\n\u003cp\u003eSonicWall released fixed versions for affected SMA1000 models 6210, 7210, and 8200v, and the article recommends urgent patching. CISA added both CVE-2026-15409 and CVE-2026-15410 to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17. The SonicWall advisory does not provide workarounds, but it includes indicators of compromise for threat hunters to review.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall disclosed and patched CVE-2026-15409 and CVE-2026-15410, two zero-day vulnerabilities in SMA 1000 Series secure remote access appliances that have been exploited in the wild.","CVE-2026-15409 is a server-side request forgery flaw in the SMA 1000 Workplace interface, and CVE-2026-15410 is a code injection flaw in the Appliance Management Console.","The article says the two flaws may be chained together to allow fully remote, unauthenticated arbitrary OS command execution on affected appliances.","CISA added both CVE-2026-15409 and CVE-2026-15410 to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17.","SonicWall released fixed versions for affected SMA1000 models 6210, 7210, and 8200v, and its advisory includes indicators of compromise for threat hunters."],"insights":["The two vulnerabilities are especially urgent because the article says they may combine into an unauthenticated path to arbitrary OS command execution, even though CVE-2026-15410 by itself requires authentication.","CISA’s remediation deadline was set for July 17 even though the vulnerabilities were added to the KEV Catalog on July 14, giving organizations only a very short window to remediate.","The article highlights that SonicWall SMA appliances are high-value targets because they can contain administrator credentials, VPN session tokens, and information about internal network architecture.","No public proof-of-concept code was available when the article was published, but the article warns that exploitation is expected to increase if one becomes available.","SonicWall did not provide workarounds in the advisory, making patching and reviewing the provided indicators of compromise the main actions identified in the article."],"referencedReports":[{"title":"SonicWall Security Advisory SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall","context":"The article says SonicWall disclosed the two exploited SMA 1000 vulnerabilities in this advisory and later points readers to it for patches and indicators of compromise.","category":"","primary":false},{"title":"CISA Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article notes that both CVE-2026-15409 and CVE-2026-15410 were added to CISA’s Known Exploited Vulnerabilities Catalog with a July 17 remediation date.","category":"","primary":false}],"body":"\u003cp\u003eSonicWall patched two recently exploited zero-day vulnerabilities in its SMA 1000 Series secure remote access appliances. The flaws are CVE-2026-15409, a server-side request forgery vulnerability in the SMA 1000 Workplace interface, and CVE-2026-15410, a code injection vulnerability in the Appliance Management Console. SonicWall confirmed that exploitation of these vulnerabilities has been observed in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe article says the vulnerabilities may have been chained together to allow fully remote, unauthenticated arbitrary OS command execution on affected appliances. This is significant because SMA 1000 appliances are internet-facing remote access gateways that can contain administrator credentials, VPN session tokens, and information about internal network architecture. SonicWall has not provided attribution for the threat actors behind the attacks.\u003c/p\u003e\n\n\u003cp\u003eSonicWall released fixed versions for affected SMA1000 models 6210, 7210, and 8200v, and the article recommends urgent patching. CISA added both CVE-2026-15409 and CVE-2026-15410 to its Known Exploited Vulnerabilities Catalog with a remediation date of July 17. The SonicWall advisory does not provide workarounds, but it includes indicators of compromise for threat hunters to review.\u003c/p\u003e\n"},{"n":1,"title":"AsyncAPI npm packages infected with credential-stealing malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/-asyncapi-npm-packages-infected-with-credential-stealing-malware/","time":"15:37","priority":"MUST READ","score":92,"tldr":"Attackers compromised AsyncAPI GitHub Actions workflows to publish five malicious npm package versions that delivered a credential-stealing remote access trojan, affecting packages with over 2.25 million weekly downloads. The malicious versions have been removed, but developers should check lock files and existing installs, remove payloads, kill suspicious processes, and rotate credentials on affected systems.","briefOverview":"\u003cp\u003eFive malicious versions of AsyncAPI packages were published to npm in a supply-chain attack that delivered a remote access trojan with information-stealing capabilities. The threat actor exploited a misconfigured GitHub Actions workflow and pushed trojanized packages in the @asyncapi namespace. The affected packages had a cumulative weekly download count of more than 2.25 million.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacks were CI/CD pipeline compromises, not stolen npm tokens or malicious maintainers. The attacker used the repositories’ real release workflows through npm’s GitHub OIDC trusted-publisher integration, which caused the packages to have legitimate SLSA provenance attestations. The malicious packages included @asyncapi/generator, @asyncapi/generator-helpers, @asyncapi/generator-components, and @asyncapi/specs versions 6.11.2-alpha.1 and 6.11.2.\u003c/p\u003e\n\n\u003cp\u003eThe malware used an obfuscated first-stage JavaScript implant, retrieved a second-stage script from IPFS, and deployed a third-stage malware framework that communicated over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network. Its apparent purpose was to steal secrets such as credentials, authentication keys, tokens, browser data, CI/CD and AI developer tool information, cryptocurrency wallets, and database data. All five malicious versions have been removed from npm, but developers are advised to check existing installations and lock files from the July 14 exposure window, remove the hidden NodeJS/sync.js payload, terminate malicious processes, and rotate credentials on impacted systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five malicious versions of AsyncAPI npm packages were published in a supply-chain attack after a threat actor exploited a misconfigured GitHub Actions workflow.","The trojanized packages in the @asyncapi namespace had a cumulative weekly download count of more than 2.25 million.","Researchers said the attack used the repositories’ legitimate release workflows and npm’s GitHub OIDC trusted-publisher integration, resulting in packages with legitimate SLSA provenance attestations.","The malware retrieved additional payloads from IPFS, established persistence, and communicated with command-and-control infrastructure over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network.","All five malicious package versions have been removed from npm, but developers are advised to check existing installations and lock files, remove the hidden NodeJS/sync.js payload, terminate malicious processes, and rotate credentials on impacted systems."],"insights":["The malicious packages could appear trustworthy because the attacker used AsyncAPI’s real release workflows, producing legitimate SLSA provenance attestations despite the packages being trojanized.","Removing the malicious versions from npm is not enough to eliminate risk, because existing installations and lock files created during the exposure window may still reference or contain the infected releases.","The compromise did not require stolen npm tokens or malicious maintainers, showing that a misconfigured GitHub Actions workflow can be enough to turn a legitimate publishing pipeline into a malware delivery path.","The malware included a local Russia check that caused it to terminate if there was a match.","Although the malware contained functions for stealing secrets, Aikido reported that those functions did not work and that the data harvesting tool exited before collecting anything."],"referencedReports":[{"title":"Compromised next branch pushes malicious AsyncAPI generator, generator-helpers, and generator-components to npm","url":"http://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","publisher":"Step Security","context":"The article cites Step Security’s report for the conclusion that the incidents were CI/CD pipeline compromises rather than stolen npm tokens or malicious maintainers.","category":"","primary":false},{"title":"AsyncAPI Supply Chain Attack","url":"https://socket.dev/blog/asyncapi-supply-chain-attack#Stage-1:-Primary-implant-in-the-published-packages","publisher":"Socket","context":"The article references Socket’s analysis of the first-stage implant in the published packages and how it triggered a downloader when imported.","category":"","primary":false},{"title":"AsyncAPI Supply Chain Compromise via GitHub Actions","url":"https://www.wiz.io/blog/m-red-team-asyncapi-supply-chain-compromise-via-github-actions","publisher":"Wiz","context":"The article cites Wiz’s analysis describing the third-stage payload as a 92,000-line malware framework with multiple command-and-control channels.","category":"","primary":false},{"title":"AsyncAPI Generator Supply Chain Attack: Miasma RAT","url":"https://safedep.io/asyncapi-generator-supply-chain-attack-miasma-rat/","publisher":"SafeDep","context":"The article references SafeDep researchers’ assessment that the malware may be a private parallel build by the same operators or a separate group using the Miasma brand.","category":"","primary":false},{"title":"AsyncAPI npm packages backdoored via GitHub Actions","url":"https://www.aikido.dev/blog/asyncapi-npm-packages-backdoored-via-github-actions","publisher":"Aikido","context":"The article cites Aikido’s report that the malware’s data harvesting functions did not work and exited before collecting anything.","category":"","primary":false},{"title":"AsyncAPI npm organization compromised, 2M weekly downloads affected","url":"https://www.ox.security/blog/asyncapi-npm-organization-compromised-2m-weekly-downloads-affected/","publisher":"Ox Security","context":"The article references Ox Security’s finding that the malware checks for Russia locally and terminates if there is a match.","category":"","primary":false}],"body":"\u003cp\u003eFive malicious versions of AsyncAPI packages were published to npm in a supply-chain attack that delivered a remote access trojan with information-stealing capabilities. The threat actor exploited a misconfigured GitHub Actions workflow and pushed trojanized packages in the @asyncapi namespace. The affected packages had a cumulative weekly download count of more than 2.25 million.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacks were CI/CD pipeline compromises, not stolen npm tokens or malicious maintainers. The attacker used the repositories’ real release workflows through npm’s GitHub OIDC trusted-publisher integration, which caused the packages to have legitimate SLSA provenance attestations. The malicious packages included @asyncapi/generator, @asyncapi/generator-helpers, @asyncapi/generator-components, and @asyncapi/specs versions 6.11.2-alpha.1 and 6.11.2.\u003c/p\u003e\n\n\u003cp\u003eThe malware used an obfuscated first-stage JavaScript implant, retrieved a second-stage script from IPFS, and deployed a third-stage malware framework that communicated over HTTP, Nostr relays, Ethereum smart contracts, and a libp2p mesh network. Its apparent purpose was to steal secrets such as credentials, authentication keys, tokens, browser data, CI/CD and AI developer tool information, cryptocurrency wallets, and database data. All five malicious versions have been removed from npm, but developers are advised to check existing installations and lock files from the July 14 exposure window, remove the hidden NodeJS/sync.js payload, terminate malicious processes, and rotate credentials on impacted systems.\u003c/p\u003e\n"},{"n":5,"title":"OkoBot Malware Framework Injects Seed Phrase Phishing Into Ledger and Trezor Apps","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/okobot-malware-framework-injects-seed.html","time":"15:30","priority":"MUST READ","score":92,"tldr":"OkoBot is a Windows malware framework that injects fake seed-phrase recovery pages directly into legitimate Ledger and Trezor desktop apps, sometimes waiting for a real device to be connected before phishing the user. The wallets themselves are not broken; the compromise is on the endpoint, so users should treat any desktop prompt asking for a recovery phrase as malicious unless it is explicitly required on the hardware device screen.","briefOverview":"\u003cp\u003eOkoBot is a malware framework that has been running on Windows machines since April 2025, and one of its modules, SeedHunter, is designed to steal recovery phrases from hardware wallet users. Kaspersky\u0026rsquo;s GReAT team reported hundreds of victims across more than 25 countries, with the largest shares in Brazil, Vietnam, Canada, Mexico, and Türkiye. The report does not say how many victims entered a recovery phrase, and OkoBot was still active as of the July 15 report.\u003c/p\u003e\n\n\u003cp\u003eSeedHunter watches for Trezor Suite, Ledger Wallet, and Ledger Live, injects into the wallet software, and hooks the apps\u0026rsquo; Electron internals. If its server sets a \u003ccode\u003eWait\u003c/code\u003e flag, it scans USB identifiers and waits until a real Ledger or Trezor device is connected before showing a hard-coded recovery page for that brand. The article emphasizes that the hardware wallet itself is not broken; the malicious prompt appears inside the real desktop app on an infected computer.\u003c/p\u003e\n\n\u003cp\u003eThe article says OkoBot commonly arrives through ClickFix lures and trojanized software on GitHub, including a repository that advertised SQL Server Management Studio but delivered a maliciously modified Audacity build. Its broader toolkit includes TookPS, reverse SSH tunneling, RDP setup, a VMProtect-packed launcher, a Volume2-based payload chain, spyware, keylogging, screenshots, window recording, and hidden Chromium extensions such as Rilide. The article lists huntable signs including a scheduled task named \u003ccode\u003eApple Sync\u003c/code\u003e, \u003ccode\u003e%PROGRAMDATA%\\hwid.dat\u003c/code\u003e, \u003ccode\u003e%PROGRAMDATA%\\HDVideo\\HDUtil.exe\u003c/code\u003e, \u003ccode\u003e%USERPROFILE%\\.ssh\\go.bat\u003c/code\u003e, altered \u003ccode\u003etermsrv.dll\u003c/code\u003e, unexpected Remote Desktop Users accounts, outbound SSH, and hidden browser extension settings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky's GReAT team reported that the OkoBot malware framework has been active on Windows machines since April 2025 and counted hundreds of victims across more than 25 countries.","OkoBot's SeedHunter module injects into Trezor Suite, Ledger Wallet, and Ledger Live, hooks the Electron internals, and displays a fake recovery phrase page inside the legitimate wallet application.","SeedHunter can wait until a real Ledger or Trezor device is plugged in before showing its malicious recovery page, then sends the typed phrase to its command-and-control server.","Kaspersky identified ClickFix lures and trojanized GitHub software as two main infection paths, including a repository that advertised SQL Server Management Studio but shipped a maliciously modified Audacity build.","The OkoBot toolkit also includes surveillance and theft components that collect wallet files, cookies, browser profiles, credentials, keystrokes, screenshots, and recordings of selected application windows."],"insights":["The phishing prompt is more convincing because SeedHunter draws it inside the legitimate Ledger or Trezor desktop app instead of replacing the app or opening a separate fake window.","A recovery phrase prompt that appears after plugging in a device is still suspicious if there is no matching instruction on the hardware wallet's own screen.","The campaign leaves huntable endpoint artifacts, including a scheduled task named Apple Sync, altered termsrv.dll, unexpected Remote Desktop Users accounts, and outbound SSH from user machines.","The infection chain can begin with software that appears unrelated to cryptocurrency, such as a GitHub repository advertising SQL Server Management Studio that actually delivered a maliciously modified Audacity build.","The operators appear to be actively maintaining the framework, as the article says a March 2026 rebuild removed older components and folded their functions into a single dispatcher plugin."],"referencedReports":[{"title":"OkoBot framework targets cryptocurrency wallets","url":"https://securelist.com/okobot-framework-targets-cryptocurrency-wallets/120660/","publisher":"Kaspersky GReAT","context":"The article is based on Kaspersky GReAT's teardown of the OkoBot framework and its SeedHunter module.","category":"","primary":false},{"title":"Anti-Ledger malware","url":"https://moonlock.com/anti-ledger-malware","publisher":"Moonlock Lab","context":"The article cites Moonlock Lab as having tracked macOS stealers that used a related Ledger Live replacement tactic.","category":"","primary":false},{"title":"Backdoors and stealers prey on DeepSeek and Grok","url":"https://securelist.com/backdoors-and-stealers-prey-on-deepseek-and-grok/115801/","publisher":"Kaspersky","context":"The article references Kaspersky's earlier tracking of the TookPS PowerShell downloader when it was distributed through fake DeepSeek pages.","category":"","primary":false},{"title":"TookPS","url":"https://securelist.com/tookps/116019/","publisher":"Kaspersky","context":"The article cites Kaspersky research on TookPS being distributed through fake business-software download sites.","category":"","primary":false},{"title":"Calling Local Windows RPC Servers from 0x3","url":"https://googleprojectzero.blogspot.com/2019/12/calling-local-windows-rpc-servers-from.html","publisher":"Google Project Zero","context":"The article cites Project Zero's 2019 technical analysis of the Windows RPC UAC bypass used by OkoBot's launcher.","category":"","primary":false}],"body":"\u003cp\u003eOkoBot is a malware framework that has been running on Windows machines since April 2025, and one of its modules, SeedHunter, is designed to steal recovery phrases from hardware wallet users. Kaspersky\u0026rsquo;s GReAT team reported hundreds of victims across more than 25 countries, with the largest shares in Brazil, Vietnam, Canada, Mexico, and Türkiye. The report does not say how many victims entered a recovery phrase, and OkoBot was still active as of the July 15 report.\u003c/p\u003e\n\n\u003cp\u003eSeedHunter watches for Trezor Suite, Ledger Wallet, and Ledger Live, injects into the wallet software, and hooks the apps\u0026rsquo; Electron internals. If its server sets a \u003ccode\u003eWait\u003c/code\u003e flag, it scans USB identifiers and waits until a real Ledger or Trezor device is connected before showing a hard-coded recovery page for that brand. The article emphasizes that the hardware wallet itself is not broken; the malicious prompt appears inside the real desktop app on an infected computer.\u003c/p\u003e\n\n\u003cp\u003eThe article says OkoBot commonly arrives through ClickFix lures and trojanized software on GitHub, including a repository that advertised SQL Server Management Studio but delivered a maliciously modified Audacity build. Its broader toolkit includes TookPS, reverse SSH tunneling, RDP setup, a VMProtect-packed launcher, a Volume2-based payload chain, spyware, keylogging, screenshots, window recording, and hidden Chromium extensions such as Rilide. The article lists huntable signs including a scheduled task named \u003ccode\u003eApple Sync\u003c/code\u003e, \u003ccode\u003e%PROGRAMDATA%\\hwid.dat\u003c/code\u003e, \u003ccode\u003e%PROGRAMDATA%\\HDVideo\\HDUtil.exe\u003c/code\u003e, \u003ccode\u003e%USERPROFILE%\\.ssh\\go.bat\u003c/code\u003e, altered \u003ccode\u003etermsrv.dll\u003c/code\u003e, unexpected Remote Desktop Users accounts, outbound SSH, and hidden browser extension settings.\u003c/p\u003e\n"},{"n":9,"title":"ClaudeFix: Shared Claude Chats Meet ClickFix","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/claudefix-shared-claude-chats-meet-clickfix","time":"14:39","priority":"SHOULD READ","score":84,"tldr":"Zscaler found a MacSync Stealer campaign that used Google malvertising to send Mac users searching for Claude to shared Claude chats containing ClickFix paste-and-run commands. The commands launched a multi-stage macOS infection chain that stole credentials, files, and cryptocurrency wallet data while abusing trusted AI platform features for legitimacy.","briefOverview":"\u003cp\u003eZscaler Threat Hunting identified a ClickFix campaign that abused Anthropic’s Claude platform by using shared Claude chats to host malicious paste-and-run instructions. The campaign targeted Mac users searching for Claude-related terms and used paid Google ads to redirect them to shared Claude chat links. The chats appeared more legitimate because they were hosted on the official Claude domain, and one was labeled “Shared by Apple Support” after the threat actors likely set their Claude display name to that phrase.\u003c/p\u003e\n\n\u003cp\u003eThe instructions told victims to run a curl command with a Base64-obfuscated URL, which downloaded and executed a multi-stage infection chain for MacSync Stealer. The first stage returned a zsh script, the second stage downloaded AppleScript content and handled data exfiltration, and the third stage performed the main stealing functions. MacSync Stealer can collect keychain files, browser data, password manager extension data, Telegram files, shell history, cloud keys, sensitive documents, and cryptocurrency wallet information.\u003c/p\u003e\n\n\u003cp\u003eZscaler observed that the malvertising campaign ran from June 12–19, 2026, used Google as the ad source, and included 22 unique campaign IDs and seven Claude-related search terms. The malware attempted to hide activity by redirecting output to /dev/null, piping downloaded content directly to osascript, deleting collected archives after exfiltration, and removing temporary collection directories. Zscaler also observed Russian-language comments in the third-stage AppleScript payload and provided detections and indicators of compromise related to the campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler Threat Hunting identified a ClickFix campaign that abused Anthropic’s Claude platform by using shared Claude chats to host commands that led to MacSync Stealer infections.","The campaign used paid Google ads to lure Mac users searching for terms such as “claude download” into shared Claude chats that appeared more legitimate because they were hosted on the official Claude domain.","Victims were instructed to run a curl command with a Base64-obfuscated URL, which launched a multi-stage macOS infection chain using zsh and osascript.","MacSync Stealer can steal keychain files, browser credentials and cookies, sensitive files, Telegram data, shell history, cloud keys, and cryptocurrency wallet data from affected systems.","Zscaler observed the malvertising campaign running from June 12–19, 2026, and noted Russian-language comments in the third-stage AppleScript payload."],"insights":["The attackers increased the credibility of the lure by setting the Claude display name to “Apple Support,” causing shared chats to appear as if they were shared by Apple Support.","The first command shown to victims hid the staging URL with Base64 encoding, making the pasted instruction less obviously suspicious while still downloading and executing a remote script.","MacSync Stealer used a fileless third stage by piping downloaded content directly into osascript, and later deleted the collected archive after exfiltration to reduce traces on the system.","The malware modified ~/.zshrc for persistence only when it lacked access to ~/Library/Cookies/, then removed that persistence entry after access was successful.","Zscaler’s traffic observations showed the campaign was short-lived, running from June 12–19, 2026, while using 22 unique campaign IDs and multiple Claude-related search terms."],"referencedReports":[],"body":"\u003cp\u003eZscaler Threat Hunting identified a ClickFix campaign that abused Anthropic’s Claude platform by using shared Claude chats to host malicious paste-and-run instructions. The campaign targeted Mac users searching for Claude-related terms and used paid Google ads to redirect them to shared Claude chat links. The chats appeared more legitimate because they were hosted on the official Claude domain, and one was labeled “Shared by Apple Support” after the threat actors likely set their Claude display name to that phrase.\u003c/p\u003e\n\n\u003cp\u003eThe instructions told victims to run a curl command with a Base64-obfuscated URL, which downloaded and executed a multi-stage infection chain for MacSync Stealer. The first stage returned a zsh script, the second stage downloaded AppleScript content and handled data exfiltration, and the third stage performed the main stealing functions. MacSync Stealer can collect keychain files, browser data, password manager extension data, Telegram files, shell history, cloud keys, sensitive documents, and cryptocurrency wallet information.\u003c/p\u003e\n\n\u003cp\u003eZscaler observed that the malvertising campaign ran from June 12–19, 2026, used Google as the ad source, and included 22 unique campaign IDs and seven Claude-related search terms. The malware attempted to hide activity by redirecting output to /dev/null, piping downloaded content directly to osascript, deleting collected archives after exfiltration, and removing temporary collection directories. Zscaler also observed Russian-language comments in the third-stage AppleScript payload and provided detections and indicators of compromise related to the campaign.\u003c/p\u003e\n"},{"n":2,"title":"We built a vulnerability vending machine: AI tokens in, zero-days out","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/we-built-a-vulnerability-vending-machine-ai-tokens-in-zero-days-out/","time":"14:01","priority":"SHOULD READ","score":82,"tldr":"Intruder says it built an AI-assisted vulnerability research pipeline that uses code slicing and LLMs to find and exploit real bugs, including a blind SQL injection zero-day in the Creative Mail WordPress plugin affecting sites that also run WooCommerce. The key takeaway is that current AI models, when given focused code context, can already automate meaningful vulnerability discovery and exploit development.","briefOverview":"\u003cp\u003eIntruder describes an AI-assisted vulnerability research pipeline that combines the Joern code scanning engine with LLMs to find, assess, and exploit vulnerabilities in production software. The team says pointing an LLM at an entire codebase leads to high token cost and poor accuracy, so it instead generates focused program slices containing code relevant to each finding. The pipeline was tested against the top 200 WordPress plugins, focusing on unauthenticated attack surface such as REST routes, template hooks, and nopriv AJAX calls.\u003c/p\u003e\n\n\u003cp\u003eThe first vulnerability produced by the pipeline was CVE-2026-3985, a blind SQL injection in the Creative Mail WordPress plugin. Intruder says the bug is high impact because it can give an attacker read access to database contents, including admin password hashes and secret tokens. Exploitation requires WooCommerce to be installed alongside Creative Mail, but the article notes WooCommerce has more than 7 million active installs and that the combination is common.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit required multiple chained requests and that the exploitation agent generated a working proof of concept capable of confirming the issue and extracting password hashes from the database. It also says the root cause was hidden from the developer’s own static analysis tooling by a mistake in the code. The Creative Mail plugin has been pulled from the WordPress store pending review, and the article advises users running Creative Mail with WooCommerce to disable it until a patch is available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Intruder built a pipeline that uses Joern to scan codebases, generate focused program slices, and pass relevant context to LLMs for triage, exploitability assessment, and exploit development.","The pipeline was tested against the top 200 WordPress plugins, with an emphasis on unauthenticated attack surface such as REST routes, template hooks, and nopriv AJAX calls.","The first vulnerability found by the pipeline was CVE-2026-3985, a blind SQL injection in the Creative Mail WordPress plugin that requires WooCommerce to be installed alongside it.","Intruder says the exploitation agent produced a working proof of concept capable of confirming the issue and extracting password hashes from the database.","The Creative Mail plugin has been pulled from the WordPress store pending review, and the article advises users running Creative Mail with WooCommerce to disable it until a patch is available."],"insights":["The article’s main technical lesson is that narrowing the code shown to the model with program slices was more effective than asking an LLM to review an entire codebase, because it reduced irrelevant context and improved focus on exploitable paths.","Intruder deliberately used loose scanning rules and relied on later LLM triage to filter false positives, showing that the pipeline was designed to favor not missing candidate bugs over producing clean initial results.","The Creative Mail flaw was harder for traditional tooling to catch because exploitation required multiple chained requests and because a coding mistake hid the root cause from the developer’s own static analysis tooling.","The affected real-world population is narrower than all Creative Mail users because exploitation requires WooCommerce to be installed too, but the article notes that this pairing is common due to WooCommerce’s more than 7 million active installs.","The pipeline found a serious issue in the top 200 WordPress plugins, which the article characterizes as code already heavily reviewed by bug bounty researchers, making the result notable as a comparison point against skilled human review."],"referencedReports":[{"title":"Slice","url":"https://noperator.dev/posts/slice/","publisher":"nooperator","context":"The article says Intruder’s pipeline design was inspired by nooperator’s work on Slice, while noting that Intruder used Joern rather than CodeQL and designed its slicing algorithm differently.","category":"","primary":false}],"body":"\u003cp\u003eIntruder describes an AI-assisted vulnerability research pipeline that combines the Joern code scanning engine with LLMs to find, assess, and exploit vulnerabilities in production software. The team says pointing an LLM at an entire codebase leads to high token cost and poor accuracy, so it instead generates focused program slices containing code relevant to each finding. The pipeline was tested against the top 200 WordPress plugins, focusing on unauthenticated attack surface such as REST routes, template hooks, and nopriv AJAX calls.\u003c/p\u003e\n\n\u003cp\u003eThe first vulnerability produced by the pipeline was CVE-2026-3985, a blind SQL injection in the Creative Mail WordPress plugin. Intruder says the bug is high impact because it can give an attacker read access to database contents, including admin password hashes and secret tokens. Exploitation requires WooCommerce to be installed alongside Creative Mail, but the article notes WooCommerce has more than 7 million active installs and that the combination is common.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit required multiple chained requests and that the exploitation agent generated a working proof of concept capable of confirming the issue and extracting password hashes from the database. It also says the root cause was hidden from the developer’s own static analysis tooling by a mistake in the code. The Creative Mail plugin has been pulled from the WordPress store pending review, and the article advises users running Creative Mail with WooCommerce to disable it until a patch is available.\u003c/p\u003e\n"},{"n":3,"title":"Dutch police dismantle global crypto investment scam, arrest alleged mastermind","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/dutch-police-dismantle-global-crypto-investment-scam","time":"14:14","priority":"SHOULD READ","score":82,"tldr":"Dutch police dismantled a global fake cryptocurrency investment network that allegedly used call centers and bogus trading platforms to steal more than €100 million a month from tens of thousands of victims. The alleged mastermind, described as a well-known hacker with Israeli and Polish citizenship, was arrested and extradited to the Netherlands.","briefOverview":"\u003cp\u003eDutch police have dismantled a large international investment fraud network that allegedly tricked tens of thousands of people into fake cryptocurrency schemes. Authorities said the group had operated since at least 2021, running about two dozen call centers across several countries with more than 700 employees posing as professional financial advisers. Police said the operation generated more than €100 million a month by building relationships with victims over the phone and online before persuading them to invest.\u003c/p\u003e\n\n\u003cp\u003eThe investigation centers on a 46-year-old man with Israeli and Polish citizenship whom Dutch police described as a “well-known hacker.” He was arrested in May at a Polish airport after arriving from Dubai and has been extradited to the Netherlands, where a judge ordered him held in pretrial detention. Authorities also arrested suspects in Cyprus, Belgium and Greece, and said the investigation is ongoing with more arrests possible.\u003c/p\u003e\n\n\u003cp\u003ePolice said the organization was carefully structured to avoid detection, with employees using fake names, concealing their locations and relying on technical tools to hide their identities. Victims were shown fictitious profits on bogus trading platforms, but investigators said the money was never invested and instead flowed to the criminal organization, often through cryptocurrency payments. Dutch police estimate victims in the Netherlands alone lost nearly €25 million, while victims described severe financial and emotional consequences, including losing life savings, being unable to afford food and considering suicide.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dutch police dismantled an international investment fraud network that allegedly tricked tens of thousands of people into investing in fake cryptocurrency schemes.","Authorities said the group had operated since at least 2021, running about two dozen call centers across several countries and employing more than 700 people posing as professional financial advisers.","Police said the operation generated more than €100 million per month by persuading victims to invest through bogus trading platforms after building relationships with them by phone and online.","A 46-year-old man with Israeli and Polish citizenship, described by Dutch police as a well-known hacker, was arrested in May at a Polish airport after arriving from Dubai and extradited to the Netherlands.","Dutch police estimate that victims in the Netherlands alone lost nearly €25 million, and they said many victims did not know they had been scammed until investigators contacted them."],"insights":["The scheme’s fake returns were effective enough that many victims did not realize they had been scammed until investigators contacted them.","The organization combined a legitimate-business appearance, including hundreds of employees and multiple call centers, with deliberate concealment measures such as fake names, hidden locations, and technical tools to mask identities.","Police intervention did not only support arrests; it also prevented some victims from sending additional money to the fraud network.","The harm extended beyond financial losses, with victims describing food insecurity, suicidal thoughts, and the collapse of life plans after losing their savings."],"referencedReports":[],"body":"\u003cp\u003eDutch police have dismantled a large international investment fraud network that allegedly tricked tens of thousands of people into fake cryptocurrency schemes. Authorities said the group had operated since at least 2021, running about two dozen call centers across several countries with more than 700 employees posing as professional financial advisers. Police said the operation generated more than €100 million a month by building relationships with victims over the phone and online before persuading them to invest.\u003c/p\u003e\n\n\u003cp\u003eThe investigation centers on a 46-year-old man with Israeli and Polish citizenship whom Dutch police described as a “well-known hacker.” He was arrested in May at a Polish airport after arriving from Dubai and has been extradited to the Netherlands, where a judge ordered him held in pretrial detention. Authorities also arrested suspects in Cyprus, Belgium and Greece, and said the investigation is ongoing with more arrests possible.\u003c/p\u003e\n\n\u003cp\u003ePolice said the organization was carefully structured to avoid detection, with employees using fake names, concealing their locations and relying on technical tools to hide their identities. Victims were shown fictitious profits on bogus trading platforms, but investigators said the money was never invested and instead flowed to the criminal organization, often through cryptocurrency payments. Dutch police estimate victims in the Netherlands alone lost nearly €25 million, while victims described severe financial and emotional consequences, including losing life savings, being unable to afford food and considering suicide.\u003c/p\u003e\n"},{"n":4,"title":"23andMe reaches $18 million settlement with states for massive breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/genetic-testing-settlement-data-breach","time":"17:45","priority":"SHOULD READ","score":82,"tldr":"23andMe agreed to an $18 million settlement with 42 state attorneys general over cybersecurity failures tied to its 2023 breach that exposed data on 6.9 million people, including genetic ancestry information. The deal also imposes new security oversight and preserves customers’ rights to delete personal data and destroy genetic samples.","briefOverview":"\u003cp\u003eA coalition of 42 state attorneys general reached an $18 million settlement with 23andMe over cybersecurity failings linked to a breach that exposed information on 6.9 million people, including genetic ancestry data. The breach occurred in October 2023, but 23andMe did not learn of it until months later. Some of the stolen data had been posted on the dark web.\u003c/p\u003e\n\n\u003cp\u003eThe settlement also requires new data protection measures from the 23andMe Research Institute, a nonprofit founded in May 2025 by 23andMe CEO Anne Wojcicki. The institute absorbed 23andMe’s assets, including genetic data, after paying $305 million for them in July 2025. The agreement requires risk assessments, a special board to oversee data security, and an indefinite right for customers to destroy genetic samples and delete personal data.\u003c/p\u003e\n\n\u003cp\u003eNew York Attorney General Letitia James’ office said 23andMe initially denied that a breach occurred and later blamed consumers for account configurations and password use. The multistate investigation found that the company lacked protections against hacks using stolen credentials, had insufficient intrusion prevention, failed to log or monitor breaches, did not fix known vulnerabilities, and did not investigate atypical login patterns or test new design features. The institute has pledged to follow 23andMe’s privacy policy, while continuing the practice of sharing and selling de-identified customer data for biomedical research.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A coalition of 42 state attorneys general reached an $18 million settlement with 23andMe over cybersecurity failings tied to a breach that exposed information on 6.9 million people, including genetic ancestry data.","The settlement requires new data protection measures from the 23andMe Research Institute, including risk assessments and a special board to oversee data security.","The settlement requires that 23andMe customers continue to have the right to destroy their genetic samples and delete personal data indefinitely.","New York Attorney General Letitia James’ office said 23andMe lacked protections against hacks using stolen credentials, had insufficient intrusion prevention, failed to log or monitor breaches, and did not fix known vulnerabilities.","The 23andMe Research Institute bought 23andMe’s assets in July 2025, including genetic data for customers who had not requested that their information be destroyed."],"insights":["The settlement reaches beyond 23andMe itself by imposing data protection requirements on the 23andMe Research Institute, the nonprofit that later absorbed 23andMe’s assets, including genetic data.","The breach response drew criticism because 23andMe initially denied that a breach had occurred and later blamed consumers for account and password configurations after confirming it.","The incident had a long detection gap, as 23andMe did not learn of the October 2023 breach until months after it occurred, by which time some stolen data had appeared on the dark web.","Even after the asset sale and settlement, the institute continues 23andMe’s practice of sharing and selling de-identified customer data for biomedical research."],"referencedReports":[],"body":"\u003cp\u003eA coalition of 42 state attorneys general reached an $18 million settlement with 23andMe over cybersecurity failings linked to a breach that exposed information on 6.9 million people, including genetic ancestry data. The breach occurred in October 2023, but 23andMe did not learn of it until months later. Some of the stolen data had been posted on the dark web.\u003c/p\u003e\n\n\u003cp\u003eThe settlement also requires new data protection measures from the 23andMe Research Institute, a nonprofit founded in May 2025 by 23andMe CEO Anne Wojcicki. The institute absorbed 23andMe’s assets, including genetic data, after paying $305 million for them in July 2025. The agreement requires risk assessments, a special board to oversee data security, and an indefinite right for customers to destroy genetic samples and delete personal data.\u003c/p\u003e\n\n\u003cp\u003eNew York Attorney General Letitia James’ office said 23andMe initially denied that a breach occurred and later blamed consumers for account configurations and password use. The multistate investigation found that the company lacked protections against hacks using stolen credentials, had insufficient intrusion prevention, failed to log or monitor breaches, did not fix known vulnerabilities, and did not investigate atypical login patterns or test new design features. The institute has pledged to follow 23andMe’s privacy policy, while continuing the practice of sharing and selling de-identified customer data for biomedical research.\u003c/p\u003e\n"},{"n":6,"title":"Understanding Claude Tag’s access model in Slack and how to configure it securely","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/claude-tag-slack-access-model","time":"15:08","priority":"MAY READ","score":65,"tldr":"Claude Tag in Slack uses admin-configured shared access bundles rather than the credentials of the user who tags it, making channel membership and bundle scope part of the access-control boundary. Organizations should keep bundles least-privileged, restrict sensitive bundles to private channels, and use Claude Enterprise login/RBAC controls to limit who can direct the agent.","briefOverview":"\u003cp\u003eAnthropic’s Claude Tag is a multiplayer AI assistant for Slack that lets channel members tag @Claude to hand off tasks, run autonomous jobs, and watch the work unfold in-thread. In shared channels, Claude Tag does not act using the credentials of the person who tagged it. Instead, it uses shared credentials in an admin-configured access bundle for a workspace or specific private channel.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that Claude Tag follows a service-identity pattern similar to deploy bots, workflow automations, and incoming webhooks, rather than per-user OAuth delegation. One access bundle can serve everyone in a channel, while organization-level Claude Enterprise controls such as required claude.ai login and role-based access control can limit who may interact with Claude. Adding someone to a channel where Claude Tag is present lets them converse with Claude and see its output there, but it does not change the permissions configured in the bundle.\u003c/p\u003e\n\n\u003cp\u003eThe security significance is that Slack channel membership and bundle scope must be reviewed together as part of access control. The article recommends auditing access bundles, restricting sensitive bundles to private channels, scoping bundles minimally, managing channel invite policies, and using per-user delegation where the use case allows it. Tenable Research worked with Anthropic’s security team through coordinated disclosure, and Anthropic said feedback about the admin configuration experience was shared with the relevant product team.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Claude Tag acts on connected services in shared Slack channels using admin-configured shared credentials, not the credentials of the user who tags it.","Access bundles group connector credentials and can be attached to a workspace or specific channel, allowing channel members to direct Claude within the scope configured by an administrator.","Organizations can require claude.ai login and role-based access control so that only qualifying users can start Claude sessions or interact with Claude in existing threads.","The article recommends auditing access bundles, reviewing channel membership and bundle scope together, using minimum-privilege bundles, and managing channel invite policies for sensitive channels.","Tenable Research worked with Anthropic’s security team through coordinated disclosure, and Anthropic said feedback about the admin configuration experience was shared with the relevant product team."],"insights":["Slack channel configuration becomes part of the access-control surface because the channel determines who can converse with Claude while the access bundle determines what Claude can reach.","Public channels are especially risky for elevated bundles because Anthropic’s documentation warns that anyone who joins a public channel can use the access granted by a bundle attached to that channel.","Claude Tag can reduce some user-driven sprawl because users cannot bring their own privileges through the agent; writes occur only where the admin-scoped agent is allowed to write.","Different connectors behave differently inside bundles: GitHub uses a Claude GitHub App installation scoped to a repository allowlist, while non-GitHub OAuth connectors such as Google Drive reuse the credential of the admin or owner who connected them.","Anthropic’s planned just-in-time credential grants and identity-aware overlay are described as additional layers on top of the channel-scoped agent model, not replacements for careful bundle scoping and channel membership control."],"referencedReports":[],"body":"\u003cp\u003eAnthropic’s Claude Tag is a multiplayer AI assistant for Slack that lets channel members tag @Claude to hand off tasks, run autonomous jobs, and watch the work unfold in-thread. In shared channels, Claude Tag does not act using the credentials of the person who tagged it. Instead, it uses shared credentials in an admin-configured access bundle for a workspace or specific private channel.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that Claude Tag follows a service-identity pattern similar to deploy bots, workflow automations, and incoming webhooks, rather than per-user OAuth delegation. One access bundle can serve everyone in a channel, while organization-level Claude Enterprise controls such as required claude.ai login and role-based access control can limit who may interact with Claude. Adding someone to a channel where Claude Tag is present lets them converse with Claude and see its output there, but it does not change the permissions configured in the bundle.\u003c/p\u003e\n\n\u003cp\u003eThe security significance is that Slack channel membership and bundle scope must be reviewed together as part of access control. The article recommends auditing access bundles, restricting sensitive bundles to private channels, scoping bundles minimally, managing channel invite policies, and using per-user delegation where the use case allows it. Tenable Research worked with Anthropic’s security team through coordinated disclosure, and Anthropic said feedback about the admin configuration experience was shared with the relevant product team.\u003c/p\u003e\n"},{"n":8,"title":"There and Back Again: An Operators Guide on NTLM Relaying Egress","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/15/there-and-back-again-an-operators-guide-on-ntlm-relaying-egress/","time":"16:00","priority":"MAY READ","score":60,"tldr":"SpecterOps describes a practical NTLM relay technique that coerces SMB or WebDAV authentication out to an internet-facing cloud host, tunnels it back through red team infrastructure, and relays it into the target network to achieve privilege escalation. The key defense is enforcing LDAP signing/LDAPS channel binding, enabling EPA on ADCS web enrollment, and restricting outbound SMB and unnecessary inbound traffic.","briefOverview":"\u003cp\u003eSpecterOps describes “There and Back Again,” a technique for coercing NTLM authentication outbound to the internet, catching it with a cloud host, forwarding it back to red team infrastructure, and proxying it into the target environment for NTLM relay. The article frames the method as useful during assessments where operators have only low-privilege command-and-control access and cannot bind locally to port 445/TCP or perform more traditional local relay setups. It notes that the technique can be used to relay coerced authentication to services such as ADCS web enrollment endpoints or LDAP/LDAPS for identity or computer takeover.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the main requirement is for at least one internal system to reach an attacker-controlled cloud host over the needed outbound path. It describes cases where domain controllers and obvious sensitive systems could not send outbound SMB traffic, but another reachable Windows server in a different network segment could be coerced and relayed. It also highlights WebDAV over port 443/TCP as a practical option when SMB egress is blocked or local firewall rules prevent receiving WebDAV traffic on a high port.\u003c/p\u003e\n\n\u003cp\u003eThe walkthrough covers provisioning an Azure VM, redirecting port 443/TCP to 8443/TCP, using SSH forwarding, and routing traffic back through a SOCKS5 proxy tied to a ceded-access agent. It then demonstrates a local privilege escalation flow involving DNS record creation, EFS and WebClient preparation, PetitPotam coercion, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution. The defensive guidance recommends LDAP signing and LDAPS channel binding, Extended Protection for Authentication on ADCS web enrollment, restricting outbound SMB to public IPs, and local firewall rules that allow only necessary inbound ports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps describes “There and Back Again” as a technique that coerces outbound NTLM authentication to an internet-facing cloud host, forwards it back to red team infrastructure, and proxies it into the target environment to relay to services such as ADCS web enrollment or LDAP/LDAPS.","The technique is useful when operators only have low-privilege command-and-control access and cannot bind locally to port 445/TCP or when firewall rules prevent more traditional WebDAV relays inside the environment.","The article states that vulnerable ADCS web enrollment endpoints lacking Extended Protection for Authentication are still seen in nearly 70–80% of client environments with an Active Directory presence.","The article demonstrates a local privilege escalation flow using WebDAV coercion over port 443/TCP, DNS record creation, EFS and WebClient service preparation, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution.","The defensive guidance recommends enabling LDAP signing and LDAPS channel binding, enabling Extended Protection for Authentication on ADCS web enrollment endpoints, restricting outbound SMB to public IPs, and deploying local firewall rules that allow only necessary inbound ports."],"insights":["Blocking obvious high-value systems such as domain controllers from outbound SMB is not sufficient, because the article describes finding a less obvious Windows server in a different network segment whose coerced outbound authentication could still be relayed for escalation.","WebDAV over port 443/TCP is highlighted as a practical way to bypass common firewall restrictions that block SMB egress or local high-port WebDAV relays.","The article notes that setting LDAPS channel binding to “When Supported” can preserve compatibility with legacy systems while still preventing NTLM relay to LDAPS because the default Windows WebDAV client includes the channel binding token.","Low-privilege domain users can add the DNS record needed for the WebDAV coercion flow, so the article treats DNS record creation as an expected part of the attack path rather than an administrative barrier.","Even when Credential Guard is in use, the article states that operators can extract an LDAP service ticket from the current logon session without touching LSASS, which can still support the demonstrated DNS modification step."],"referencedReports":[{"title":"NTLM relaying over SOCKS","url":"https://tw1sm.github.io/2021-02-15-socks-relay/","publisher":"Matt Creel","context":"The article cites Matt Creel’s blog as prior guidance on NTLM relaying over SOCKS that this tradecraft builds on.","category":"","primary":false}],"body":"\u003cp\u003eSpecterOps describes “There and Back Again,” a technique for coercing NTLM authentication outbound to the internet, catching it with a cloud host, forwarding it back to red team infrastructure, and proxying it into the target environment for NTLM relay. The article frames the method as useful during assessments where operators have only low-privilege command-and-control access and cannot bind locally to port 445/TCP or perform more traditional local relay setups. It notes that the technique can be used to relay coerced authentication to services such as ADCS web enrollment endpoints or LDAP/LDAPS for identity or computer takeover.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the main requirement is for at least one internal system to reach an attacker-controlled cloud host over the needed outbound path. It describes cases where domain controllers and obvious sensitive systems could not send outbound SMB traffic, but another reachable Windows server in a different network segment could be coerced and relayed. It also highlights WebDAV over port 443/TCP as a practical option when SMB egress is blocked or local firewall rules prevent receiving WebDAV traffic on a high port.\u003c/p\u003e\n\n\u003cp\u003eThe walkthrough covers provisioning an Azure VM, redirecting port 443/TCP to 8443/TCP, using SSH forwarding, and routing traffic back through a SOCKS5 proxy tied to a ceded-access agent. It then demonstrates a local privilege escalation flow involving DNS record creation, EFS and WebClient preparation, PetitPotam coercion, ntlmrelayx relay to LDAPS, shadow credentials, Certipy authentication, S4U2Self, and WMI execution. The defensive guidance recommends LDAP signing and LDAPS channel binding, Extended Protection for Authentication on ADCS web enrollment, restricting outbound SMB to public IPs, and local firewall rules that allow only necessary inbound ports.\u003c/p\u003e\n"},{"n":10,"title":"A Trivia Game at Black Hat Asia \u0026 the Case for Network Visibility | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/black-hat-asia-2026-trivia-game","time":"14:30","priority":"MAY READ","score":35,"tldr":"Corelight used a trivia game at Black Hat Asia to illustrate why stron
