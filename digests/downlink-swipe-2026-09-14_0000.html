<script type="application/json" id="dl-articles">[{"n":5,"title":"CISA: Hackers now exploit max severity GitLab flaw in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-hackers-now-exploit-max-severity-gitlab-flaw-in-attacks/","time":"07:06","priority":"MUST READ","score":98,"tldr":"CISA has added CVE-2026-85706, a maximum-severity GitLab path traversal flaw that enables unauthenticated arbitrary file reads, to its Known Exploited Vulnerabilities catalog after attacks began. Organizations should immediately upgrade GitLab CE/EE to versions 19.3.2, 19.2.6, or 19.1 and review logs for suspicious repository commits API requests.","briefOverview":"\u003cp\u003eCISA warned that attackers are exploiting CVE-2026-85706, a maximum-severity GitLab vulnerability, and added it to its Known Exploited Vulnerabilities catalog. The flaw affects GitLab\u0026rsquo;s repository commits API because authentication is not properly enforced and file paths are not sufficiently restricted. An unauthenticated attacker can use it to read credentials, secrets, and other sensitive information from vulnerable GitLab servers. GitLab\u0026rsquo;s platform is used by more than half of Fortune 100 companies and has over 30 million registered users worldwide.\u003c/p\u003e\n\n\u003cp\u003eGitLab released fixes for Community Edition and Enterprise Edition in versions 19.3.2, 19.2.6, and 19.1, urging customers to patch immediately. watchTowr reported observing Internet-wide probes for the flaw one day after the fixes were released and said arbitrary files could be read with a single HTTP request. It advised defenders to examine logs for HTTP POST requests to repository commits API URLs containing \u003ccode\u003efile.path\u003c/code\u003e parameters. Federal agencies were given three days to address the issue under Binding Operational Directive 26-04, while CISA urged all organizations to prioritize remediation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-85706, a maximum-severity GitLab flaw, to its Known Exploited Vulnerabilities catalog after it was observed being used in attacks.","The flaw affects GitLab's repository commits API and can allow unauthenticated attackers to read credentials, secrets, and other sensitive files from vulnerable servers.","GitLab fixed the issue in Community Edition and Enterprise Edition versions 19.3.2, 19.2.6, and 19.1, and urged users to patch immediately.","CISA gave federal agencies three days to secure affected systems under Binding Operational Directive 26-04 and encouraged all organizations to prioritize remediation.","watchTowr advised defenders to review logs for HTTP POST requests to repository commits API addresses containing file.path parameters as potential signs of attempted exploitation."],"insights":["Internet-wide probing for the flaw was observed only one day after GitLab released fixes, indicating that unpatched systems were being targeted almost immediately.","The issue can allow an unauthenticated attacker to read arbitrary files with a single HTTP request, potentially exposing credentials and other secrets without needing an account.","Organizations can look for possible exploitation attempts by checking logs for HTTP POST requests to repository commits API URLs containing file.path parameters.","Although GitLab had not yet labeled the flaw as actively exploited, CISA added it to its actively exploited catalog and imposed a three-day remediation deadline for federal agencies."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/11/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing that CVE-2026-85706 was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Patch release: GitLab 19.3.2 released","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/#cve-2026-85706---path-traversal-issue-in-repository-commits-api-impacts-gitlab-ceee","publisher":"gitlab","context":"The article links to GitLab's patch-release advisory describing CVE-2026-85706 and the affected GitLab CE and EE versions.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA warned that attackers are exploiting CVE-2026-85706, a maximum-severity GitLab vulnerability, and added it to its Known Exploited Vulnerabilities catalog. The flaw affects GitLab\u0026rsquo;s repository commits API because authentication is not properly enforced and file paths are not sufficiently restricted. An unauthenticated attacker can use it to read credentials, secrets, and other sensitive information from vulnerable GitLab servers. GitLab\u0026rsquo;s platform is used by more than half of Fortune 100 companies and has over 30 million registered users worldwide.\u003c/p\u003e\n\n\u003cp\u003eGitLab released fixes for Community Edition and Enterprise Edition in versions 19.3.2, 19.2.6, and 19.1, urging customers to patch immediately. watchTowr reported observing Internet-wide probes for the flaw one day after the fixes were released and said arbitrary files could be read with a single HTTP request. It advised defenders to examine logs for HTTP POST requests to repository commits API URLs containing \u003ccode\u003efile.path\u003c/code\u003e parameters. Federal agencies were given three days to address the issue under Binding Operational Directive 26-04, while CISA urged all organizations to prioritize remediation.\u003c/p\u003e\n"},{"n":20,"title":"Red Heron Exploits Gitea RCE to Compromise 13 Organizations Across Six Countries","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/red-heron-exploits-gitea-rce-to.html","time":"16:56","priority":"MUST READ","score":94,"tldr":"China-linked Red Heron rapidly weaponized the critical Gitea RCE flaw CVE-2026-60004 to compromise 13 organizations across six countries, stealing repositories and credentials before moving laterally into victim infrastructure. The campaign deployed the JITTERLY Linux backdoor and SIXZUT LD_PRELOAD rootkit for persistent, stealthy access.","briefOverview":"\u003cp\u003eAcronis Threat Research Unit attributed a multinational campaign to Red Heron, a suspected China-linked threat actor that rapidly exploited CVE-2026-60004, a critical remote code execution flaw in internet-facing Gitea instances. The campaign led to confirmed compromises of 13 organizations in Canada, Argentina, Taiwan, the United States, Qatar, and Sri Lanka. Targeted sectors included defense, elections, energy, aerospace, telecommunications, government, public safety, and research.\u003c/p\u003e\n\n\u003cp\u003eWithin days of the flaw’s July 2026 disclosure, Red Heron turned public proof-of-concept code into an automated Python framework that could register accounts, exploit servers, steal repositories, and remove selected traces. The actor progressed from source-code theft to credential collection, persistent access, and lateral movement, including root-level access to a three-node Proxmox cluster in one Taiwanese environment. Researchers also identified the JITTERLY Linux implant for post-compromise activity and the SIXZUT LD_PRELOAD rootkit, which hides files, processes, and network connections and can relaunch after being terminated or removed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis attributed a multinational campaign to the suspected China-linked Red Heron threat actor, which exploited CVE-2026-60004 in internet-facing Gitea instances.","The campaign resulted in confirmed compromises of 13 organizations in Canada, Argentina, Taiwan, the United States, Qatar, and Sri Lanka.","Red Heron converted a public proof-of-concept exploit into an automated Python framework that could register accounts, exploit Gitea servers, steal repositories, and remove selected traces.","The actor used a C++ Linux implant called JITTERLY for post-compromise tasks including command execution, file transfer, network tunneling, interactive access, and internal pivoting.","Researchers identified an LD_PRELOAD rootkit named SIXZUT that hides files, processes, and network connections and can relaunch after termination or removal."],"insights":["Red Heron operationalized a public Gitea exploit within days of the flaw’s July 2026 disclosure, demonstrating how quickly publicly available proof-of-concept code can be turned into automated large-scale targeting.","In one Taiwanese environment, the group moved from a compromised Gitea server to root-level administrative access across a three-node Proxmox cluster, showing that a code-hosting server compromise can lead to broader infrastructure control.","The group’s target dataset used Simplified Chinese labels and treated Taiwan as part of China, while its targeting included defense, elections, energy, government, and research organizations.","SIXZUT attempts to conceal files, processes, and network connections while restarting itself after removal or termination, making attacker persistence and cleanup more difficult.","The same attacker infrastructure was also used to target Joomla websites in 10 countries before it was used for the Gitea campaign."],"referencedReports":[{"title":"Red Heron Exploits Gitea N-Day Flaw in Multinational Campaign, Exposing New Linux Rootkit","url":"https://www.acronis.com/en/tru/posts/red-heron-exploits-gitea-n-day-flaw-in-multinational-campaign-exposing-new-linux-rootkit/","publisher":"acronis-threat-research-unit","context":"The article relies on Acronis TRU's analysis for attribution of the Red Heron campaign, its victim scope, tooling, and post-compromise activity.","category":"research","primary":true},{"title":"Unattributed Linux Implant","url":"https://dmpdump.github.io/posts/Unattributed_Linux_Implant/","publisher":"dmpdump","context":"The article cites this earlier researcher analysis as prior documentation of the JITTERLY Linux implant and its overlaps with AdaptixC2.","category":"research","primary":false}],"body":"\u003cp\u003eAcronis Threat Research Unit attributed a multinational campaign to Red Heron, a suspected China-linked threat actor that rapidly exploited CVE-2026-60004, a critical remote code execution flaw in internet-facing Gitea instances. The campaign led to confirmed compromises of 13 organizations in Canada, Argentina, Taiwan, the United States, Qatar, and Sri Lanka. Targeted sectors included defense, elections, energy, aerospace, telecommunications, government, public safety, and research.\u003c/p\u003e\n\n\u003cp\u003eWithin days of the flaw’s July 2026 disclosure, Red Heron turned public proof-of-concept code into an automated Python framework that could register accounts, exploit servers, steal repositories, and remove selected traces. The actor progressed from source-code theft to credential collection, persistent access, and lateral movement, including root-level access to a three-node Proxmox cluster in one Taiwanese environment. Researchers also identified the JITTERLY Linux implant for post-compromise activity and the SIXZUT LD_PRELOAD rootkit, which hides files, processes, and network connections and can relaunch after being terminated or removed.\u003c/p\u003e\n"},{"n":10,"title":"Hackers target exposed Vite dev servers to steal AWS, Azure secrets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-target-exposed-vite-dev-servers-to-steal-aws-azure-secrets/","time":"16:15","priority":"MUST READ","score":93,"tldr":"Attackers are mass-scanning internet-exposed, unpatched Vite development servers to exploit CVE-2026-39364 and steal AWS, Azure, Terraform, and environment-file secrets. Organizations should update Vite, restrict public access, and rotate credentials if an exposed vulnerable server may have been accessed.","briefOverview":"\u003cp\u003eA mass-scanning campaign is targeting internet-exposed Vite development servers to steal cloud credentials and configuration data from AWS and Azure deployments. The activity exploits CVE-2026-39364, a high-severity flaw affecting Vite 7.1.0 through 7.3.2 and versions before 8.0.5 in the 8.x branch. F5 detected more than 800 attacks and approximately 32,000 raw events over one month through honeypot sensors.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to append query parameters such as \u003ccode\u003e?raw\u003c/code\u003e, \u003ccode\u003e?import\u0026amp;raw\u003c/code\u003e, or \u003ccode\u003e?import\u0026amp;url\u0026amp;inline\u003c/code\u003e to bypass file-access filtering and retrieve otherwise protected files. Attackers searched for environment files, AWS and Azure credentials, Terraform files, Serverless data, process environment files, and \u003ccode\u003e/etc/passwd\u003c/code\u003e, while also using encoded traversal variants. F5 recommends updating Vite, preventing public exposure through port 5173, blocking suspicious \u003ccode\u003e/@fs/\u003c/code\u003e requests, and rotating all secrets accessible to any publicly exposed unpatched server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A mass-scanning campaign is targeting internet-exposed Vite development servers to retrieve AWS, Azure, Terraform, and environment-file secrets.","The campaign exploits CVE-2026-39364, which affects Vite versions 7.1.0 through 7.3.2 and versions in the 8.x branch before 8.0.5.","F5 observed more than 800 attacks and about 32,000 raw events over a month through its honeypot sensors.","Attackers appended parameters such as ?raw, ?import\u0026raw, and ?import\u0026url\u0026inline to requests to bypass Vite file-access filtering and obtain files with HTTP 200 responses.","F5 recommends updating Vite, blocking access through port 5173 and suspicious /@fs/ requests, and rotating secrets if an unpatched Vite server was publicly exposed."],"insights":["Vite normally binds only to the local machine, but use of the --host flag, server.host setting, or incorrect Docker port mappings can make a development server reachable from the internet.","The file-access bypass can be triggered by appending specific query parameters such as ?raw or ?import\u0026raw, causing Vite to return protected files with a successful HTTP 200 response.","The scanning included double-encoded directory-traversal variants, apparently to bypass how reverse proxies or web application firewalls normalize requests.","The same highly active source addresses also attempted to use three earlier Vite access-control flaws: CVE-2025-30208, CVE-2025-31125, and CVE-2024-45811.","Public exposure of an unpatched server requires more than installing an update: F5 recommends rotating every secret that the server could access."],"referencedReports":[{"title":"Cloud Takeover: Mass Scanning for Exposed Vite Endpoints (CVE-2026-39364)","url":"https://www.f5.com/labs/articles/cloud-takeover-mass-scanning-for-exposed-vite-endpoints-cve-2026-39364","publisher":"f5-labs","context":"The article cites F5's analysis of the mass-scanning activity, its file-access bypass requests, and traversal variants.","category":"research","primary":true}],"body":"\u003cp\u003eA mass-scanning campaign is targeting internet-exposed Vite development servers to steal cloud credentials and configuration data from AWS and Azure deployments. The activity exploits CVE-2026-39364, a high-severity flaw affecting Vite 7.1.0 through 7.3.2 and versions before 8.0.5 in the 8.x branch. F5 detected more than 800 attacks and approximately 32,000 raw events over one month through honeypot sensors.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to append query parameters such as \u003ccode\u003e?raw\u003c/code\u003e, \u003ccode\u003e?import\u0026amp;raw\u003c/code\u003e, or \u003ccode\u003e?import\u0026amp;url\u0026amp;inline\u003c/code\u003e to bypass file-access filtering and retrieve otherwise protected files. Attackers searched for environment files, AWS and Azure credentials, Terraform files, Serverless data, process environment files, and \u003ccode\u003e/etc/passwd\u003c/code\u003e, while also using encoded traversal variants. F5 recommends updating Vite, preventing public exposure through port 5173, blocking suspicious \u003ccode\u003e/@fs/\u003c/code\u003e requests, and rotating all secrets accessible to any publicly exposed unpatched server.\u003c/p\u003e\n"},{"n":33,"title":"Emerging Threat: (CVE-2026-78006) The Events Calendar Remote Code Execution via PHP Object Injection","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-78006-the-events-calendar-remote-code-execution-via-php-object-injection/","time":"09:38","priority":"SHOULD READ","score":88,"tldr":"CVE-2026-78006 is a critical pre-authentication remote code execution flaw in The Events Calendar WordPress plugin affecting versions through 6.17.4, exploitable through malicious comments when event-page comments are enabled. Update immediately to 6.17.4.1 and disable or restrict event comments until patching is verified.","briefOverview":"\u003cp\u003eCVE-2026-78006 is a critical PHP object injection flaw in StellarWP’s The Events Calendar WordPress plugin, with a CVSS v3.1 score of 9.8. The issue can allow remote code execution on the underlying host when an attacker bypasses the plugin’s object-data safety check using a forged \u003ccode\u003ewp_hash\u003c/code\u003e value. Public proof-of-concept code is available, although the article states that observed exploitation was low at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires comments to be enabled and visible on event pages, but it does not require an account, credentials, or administrator action. An unauthenticated visitor can submit malicious block markup as an event-page comment, and WordPress renders the commenter’s pending comment through a moderation-hash URL before a moderator reviews it. All The Events Calendar versions through 6.17.4 are affected, and StellarWP released version 6.17.4.1 on September 10, 2026; organizations should verify exact installed versions, inventory public WordPress properties, and disable or restrict event comments until patching is confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-78006 is a critical vulnerability in The Events Calendar WordPress plugin that can allow remote code execution through unsafe handling of attacker-supplied data.","The flaw can be exploited without authentication through malicious comments submitted to event pages when comments are enabled and visible.","All versions of The Events Calendar through 6.17.4 are affected, while version 6.17.4.1 fixes the issue.","Organizations should inventory internet-facing WordPress sites, including agency-managed, acquired, staging, and pre-production properties, to identify exposed installations.","Until patching is confirmed, organizations can reduce the unauthenticated route by disabling event comments or requiring users to sign in before submitting comments."],"insights":["A malicious comment can execute before moderation because WordPress provides the commenter a URL that immediately displays their own pending comment.","The patch version must be checked to four decimal places: 6.17.4 remains vulnerable, while 6.17.4.1 is fixed.","The article’s observed asset set reflects sites fingerprinted as running The Events Calendar and potentially exposed, rather than confirmed vulnerable or exploitable systems.","The article attributes much of the exposure risk to fragmented ownership of secondary public websites, including agency-managed, acquired, staging, and pre-production sites that organizations may not know they own."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-78006 is a critical PHP object injection flaw in StellarWP’s The Events Calendar WordPress plugin, with a CVSS v3.1 score of 9.8. The issue can allow remote code execution on the underlying host when an attacker bypasses the plugin’s object-data safety check using a forged \u003ccode\u003ewp_hash\u003c/code\u003e value. Public proof-of-concept code is available, although the article states that observed exploitation was low at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires comments to be enabled and visible on event pages, but it does not require an account, credentials, or administrator action. An unauthenticated visitor can submit malicious block markup as an event-page comment, and WordPress renders the commenter’s pending comment through a moderation-hash URL before a moderator reviews it. All The Events Calendar versions through 6.17.4 are affected, and StellarWP released version 6.17.4.1 on September 10, 2026; organizations should verify exact installed versions, inventory public WordPress properties, and disable or restrict event comments until patching is confirmed.\u003c/p\u003e\n"},{"n":11,"title":"Hackers hijack HBO Max Reddit account to push malware in ClickFix ads","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-hijack-hbo-max-reddit-account-to-push-malware-in-clickfix-ads/","time":"18:34","priority":"SHOULD READ","score":84,"tldr":"Hackers hijacked HBO Max’s verified Reddit account to run more than 100 malicious ads that used ClickFix social engineering to trick Windows and macOS users into executing commands that install information-stealing malware. The ads were linked to the PasteSwitch campaign and also promoted fake AI, developer, and cryptocurrency-wallet software.","briefOverview":"\u003cp\u003eHackers compromised HBO Max’s verified Reddit account and used it to run 108 malicious advertisements over about 48 hours, according to Hudson Rock and ADAMnetworks. The ads promoted fake HBO Max downloads as well as counterfeit AI tools, developer software, and macOS utilities. Reddit paused the ads after they were reported and referred them to its Security and Safety teams. It remains unclear how the account was accessed or whether other HBO or Warner Bros. Discovery accounts or systems were affected.\u003c/p\u003e\n\n\u003cp\u003eThe advertisements sent visitors to convincing fake sites that used ClickFix prompts, telling users to copy and paste commands into Windows Run, PowerShell, or macOS Terminal to supposedly install software or fix an issue. Researchers linked the activity to the PasteSwitch operation, which has distributed information stealers, loaders, cryptocurrency clipboard hijackers, and fake cryptocurrency wallet applications. On macOS, the campaign deployed malware including MacSync, which can steal browser credentials, Firefox profiles, Telegram data, Apple Notes, and macOS passwords. On Windows, one observed chain used mshta and PowerShell, attempted to disable Microsoft’s Antimalware Scan Interface, and loaded the Amatera Stealer directly into memory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers compromised HBO Max’s verified Reddit account and used it to publish 108 malicious advertisements over roughly 48 hours, according to Hudson Rock and ADAMnetworks.","The advertisements directed users to fake HBO Max, AI, developer, and macOS utility websites that used ClickFix prompts to persuade victims to paste commands into Windows or macOS command tools.","Researchers linked the activity to the PasteSwitch campaign, which has distributed information stealers, loaders, cryptocurrency clipboard hijackers, and fake cryptocurrency wallet applications.","One macOS malware family used in the campaign, MacSync, can steal browser credentials, Firefox profiles, Telegram data, Apple Notes, and macOS passwords.","Reddit paused the reported malicious advertisements and referred them to its Security and Safety teams, while the method used to access the HBO Max account remains unclear."],"insights":["The attackers used a verified brand account to advertise several unrelated lures, including fake AI tools, developer software, macOS utilities, and cryptocurrency wallets, expanding the potential victim pool beyond HBO Max users.","The ClickFix method relies on victims manually pasting commands into built-in Windows or macOS tools, which can help avoid defenses focused on detecting suspicious downloaded files.","PasteSwitch infrastructure can change its campaign, platform-specific payload, and cryptocurrency theft method based on the visitor, allowing one operation to support multiple types of fraud.","One observed Windows chain loaded the Amatera Stealer directly into memory rather than first saving the final payload to disk, while also attempting to disable Microsoft’s malware-scanning interface."],"referencedReports":[{"title":"HBO Max Ads on a Compromised Reddit Account Exposed a Massive PasteSwitch ClickFix Operation","url":"https://www.hudsonrock.com/blog/hbo-max-ads-on-a-compromised-reddit-account-exposed-a-massive-pasteswitch-clickfix-operation","publisher":"Hudson Rock","context":"The article relies on Hudson Rock's analysis linking the compromised HBO Max Reddit account advertisements to the PasteSwitch operation.","category":"research","primary":true},{"title":"HBO Max Ads Exposed the PasteSwitch ClickFix Operation","url":"https://adamnet.works/blog/hbo-max-ads-exposed-the-pasteswitch-clickfix-operation/","publisher":"ADAMnetworks","context":"The article cites ADAMnetworks' technical analysis of the malicious advertisements run through HBO Max's compromised Reddit account.","category":"research","primary":true}],"body":"\u003cp\u003eHackers compromised HBO Max’s verified Reddit account and used it to run 108 malicious advertisements over about 48 hours, according to Hudson Rock and ADAMnetworks. The ads promoted fake HBO Max downloads as well as counterfeit AI tools, developer software, and macOS utilities. Reddit paused the ads after they were reported and referred them to its Security and Safety teams. It remains unclear how the account was accessed or whether other HBO or Warner Bros. Discovery accounts or systems were affected.\u003c/p\u003e\n\n\u003cp\u003eThe advertisements sent visitors to convincing fake sites that used ClickFix prompts, telling users to copy and paste commands into Windows Run, PowerShell, or macOS Terminal to supposedly install software or fix an issue. Researchers linked the activity to the PasteSwitch operation, which has distributed information stealers, loaders, cryptocurrency clipboard hijackers, and fake cryptocurrency wallet applications. On macOS, the campaign deployed malware including MacSync, which can steal browser credentials, Firefox profiles, Telegram data, Apple Notes, and macOS passwords. On Windows, one observed chain used mshta and PowerShell, attempted to disable Microsoft’s Antimalware Scan Interface, and loaded the Amatera Stealer directly into memory.\u003c/p\u003e\n"},{"n":12,"title":"Microsoft: September updates cause RDS failures on Windows Server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-updates-cause-rds-failures-on-windows-server/","time":"09:50","priority":"SHOULD READ","score":84,"tldr":"Microsoft confirmed that September 2026 security updates can cause Remote Desktop Services failures, hanging RDP connections and server instability on Windows Server 2012 and later, as well as Windows 10 and 11. Administrators can deploy Microsoft’s Known Issue Rollback Group Policy or temporarily restart affected virtual machines while a permanent fix is developed.","briefOverview":"\u003cp\u003eMicrosoft confirmed that September 2026 security updates can cause Remote Desktop Services failures on Windows Server 2012 and later, as well as Windows 10 and Windows 11. Reports from Windows administrators indicated that the updates can prevent users from connecting remotely and may require a hard reset to restore functionality. Microsoft said affected environments can experience failed Remote Desktop connections after several minutes, sign-in problems, and servers hanging at “Please wait for the Remote Desktop Configuration.”\u003c/p\u003e\n\n\u003cp\u003eThe issue can also leave Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page unresponsive. Existing remote sessions may not disconnect or log off properly, while new connection attempts can hang and fail. Microsoft has issued version-specific Group Policy Known Issue Rollback packages for enterprise-managed devices and is working on a permanent fix. Restarting an affected virtual machine may temporarily restore connectivity, while uninstalling the updates can restore Remote Desktop functionality but removes that month’s security fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the September 2026 security updates can cause Remote Desktop Services failures on Windows Server 2012 and later, as well as Windows 10 and Windows 11 devices.","Affected systems may experience failed Remote Desktop connections after several minutes, sign-in problems, servers hanging at the Remote Desktop Configuration screen, and unresponsive management tools.","Existing remote sessions may fail to disconnect or log off properly, while new connection attempts can hang and fail.","Microsoft has released version-specific Group Policy Known Issue Rollback packages to mitigate the issue on enterprise-managed devices.","Restarting an affected virtual machine may temporarily restore Remote Desktop Services connectivity, while uninstalling the updates can restore functionality but removes that month’s security fixes."],"insights":["The issue extends beyond remote connections: Microsoft says Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and even the Windows Update page can become unresponsive on affected systems.","Microsoft’s mitigation is delivered through separate Known Issue Rollback Group Policy packages for specific Windows and Windows Server versions, so administrators must use the package that matches their environment.","Restarting an affected virtual machine may temporarily restore remote access, but uninstalling the update creates a security tradeoff because it also removes the month’s Patch Tuesday fixes.","The article notes a similar Remote Desktop and Remote Desktop Services connection issue caused by Windows updates was fixed by Microsoft in March 2025."],"referencedReports":[{"title":"Remote Desktop Services might stop responding after September 2026 security update","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#remote-desktop-services-might-stop-responding-after-sept--2026-security-update","publisher":"microsoft","context":"Microsoft's release health update confirms the known issue affecting Remote Desktop Services after the September 2026 security updates and provides mitigation information.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that September 2026 security updates can cause Remote Desktop Services failures on Windows Server 2012 and later, as well as Windows 10 and Windows 11. Reports from Windows administrators indicated that the updates can prevent users from connecting remotely and may require a hard reset to restore functionality. Microsoft said affected environments can experience failed Remote Desktop connections after several minutes, sign-in problems, and servers hanging at “Please wait for the Remote Desktop Configuration.”\u003c/p\u003e\n\n\u003cp\u003eThe issue can also leave Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page unresponsive. Existing remote sessions may not disconnect or log off properly, while new connection attempts can hang and fail. Microsoft has issued version-specific Group Policy Known Issue Rollback packages for enterprise-managed devices and is working on a permanent fix. Restarting an affected virtual machine may temporarily restore connectivity, while uninstalling the updates can restore Remote Desktop functionality but removes that month’s security fixes.\u003c/p\u003e\n"},{"n":19,"title":"3BB Attacker Used MeshCentral Backdoor for Root Access, Targeted Subscriber Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/3bb-attacker-used-meshcentral-backdoor.html","time":"18:01","priority":"SHOULD READ","score":84,"tldr":"Researchers found an active intrusion at Thai broadband provider 3BB where an attacker used a MeshCentral backdoor to retain root-level access and targeted subscriber RADIUS credentials. The attacker also possessed tooling for the unpatched FortiGate SSL-VPN flaw CVE-2024-21762, though its use as the initial access method was not confirmed.","briefOverview":"\u003cp\u003eHunt.io reported that an attacker had active access inside Thai broadband provider 3BB’s network and used an exposed internet server to manage compromised internal machines. Recovered evidence showed root-level control of at least one internal server and a MeshCentral remote-management deployment configured as a hidden backdoor. The attacker’s MeshCentral agents reported to www.ayuthayatech[.]com under a device group called TH-3BB, and several listed machines were connected with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used scripts to try passwords against more than 55 internal systems, search for stored credentials and SSH keys, probe 3BB’s internal sales portal, and establish additional access through web shells and SSH keys. Scripts also targeted 3BB’s RADIUS databases, which store subscriber login credentials, although Hunt.io found no evidence that the data was taken. The server contained a complete exploit for CVE-2024-21762 against 3BB’s affected FortiGate SSL-VPN gateway, but the researchers could not confirm that this flaw was used to obtain initial access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hunt.io found an exposed attacker-controlled server on June 3, 2026, containing tools and a list of machines under control within Thai broadband provider 3BB’s network.","Recovered files showed the attacker had obtained root-level access to an internal 3BB server and used MeshCentral, configured to communicate with www.ayuthayatech[.]com, as a persistent remote-control backdoor.","The attacker’s scripts attempted passwords against more than 55 internal systems, searched for stored credentials and SSH keys, and probed 3BB’s internal sales portal at agent.3bb.co[.]th.","The attacker’s toolkit included scripts designed to copy 3BB RADIUS databases containing subscriber login credentials, but Hunt.io found evidence that the databases were targeted rather than proof that data was taken.","The exposed server contained a complete exploit for CVE-2024-21762 targeting 3BB’s FortiGate SSL-VPN gateway, but the researchers could not confirm that this flaw was used to gain initial access."],"insights":["The attacker’s cleanup script was designed to remove logs and other tools while leaving the MeshCentral agent installed, showing that simply removing obvious malicious files could fail to eliminate the attacker’s continued access.","Several machines in the recovered MeshCentral device list were connected and running with root privileges, indicating the attacker had active administrative control when the list was created rather than only historical access.","Although the attacker had a complete CVE-2024-21762 exploit and the targeted FortiGate device used an affected firmware version, the report does not establish that the flaw was successfully used for the initial intrusion.","The presence of a valid 3BB VPN certificate and active Jasmine service sessions on the attacker’s server suggests the operation extended beyond a single 3BB system, while not confirming that Jasmine was breached."],"referencedReports":[{"title":"Thai Broadband FortiGate SSL-VPN MeshCentral Intrusion","url":"https://hunt.io/blog/thai-broadband-fortigate-sslvpn-meshcentral-intrusion","publisher":"hunt.io","context":"The article is based on Hunt.io's investigation of the intrusion and directs readers to its full technical report and indicators.","category":"research","primary":true},{"title":"FG-IR-24-015: FortiOS SSL VPN Out-of-Bound Write Vulnerability","url":"https://fortiguard.fortinet.com/psirt/FG-IR-24-015","publisher":"fortinet","context":"The article cites Fortinet's advisory for mitigation guidance for CVE-2024-21762.","category":"advisory","primary":false}],"body":"\u003cp\u003eHunt.io reported that an attacker had active access inside Thai broadband provider 3BB’s network and used an exposed internet server to manage compromised internal machines. Recovered evidence showed root-level control of at least one internal server and a MeshCentral remote-management deployment configured as a hidden backdoor. The attacker’s MeshCentral agents reported to www.ayuthayatech[.]com under a device group called TH-3BB, and several listed machines were connected with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used scripts to try passwords against more than 55 internal systems, search for stored credentials and SSH keys, probe 3BB’s internal sales portal, and establish additional access through web shells and SSH keys. Scripts also targeted 3BB’s RADIUS databases, which store subscriber login credentials, although Hunt.io found no evidence that the data was taken. The server contained a complete exploit for CVE-2024-21762 against 3BB’s affected FortiGate SSL-VPN gateway, but the researchers could not confirm that this flaw was used to obtain initial access.\u003c/p\u003e\n"},{"n":22,"title":"New DDRop Attack Breaks Intel TDX and AMD SEV-SNP Confidential Computing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-ddrop-attack-breaks-intel-tdx-and.html","time":"16:58","priority":"SHOULD READ","score":84,"tldr":"Researchers demonstrated DDRop, a low-cost physical interposer attack that silently drops DDR5 memory writes and exploits missing freshness protections to undermine Intel TDX, Scalable SGX, and AMD SEV-SNP confidential computing. The attack requires prior software control and brief physical access to install hardware, and fully fixing the underlying flaw would require redesigned memory-encryption hardware.","briefOverview":"\u003cp\u003eResearchers disclosed DDRop, a hardware attack that silently drops DDR5 memory writes, causing a processor to read older encrypted data as though it were current. It affects Intel TDX, Intel Scalable SGX, and AMD SEV-SNP confidential-computing technologies, which encrypt server memory but omit checks that confirm data is the newest version. The attack requires an adversary who already controls server software and can briefly access the system physically to install a small interposer board between the processor and a memory module. The researchers estimate the hardware parts cost about $159 and say it can be installed in minutes.\u003c/p\u003e\n\n\u003cp\u003eThe interposer forces an error on the memory command bus and then prevents the memory module from reporting that error, causing the memory module to discard a write without the processor knowing. On Intel TDX, researchers used this capability to manipulate page-table setup, access protected virtual-machine memory, enable debug mode, and alter launch measurements used for remote attestation. On AMD SEV-SNP, they demonstrated copying one victim memory page into another during page relocation. The researchers said there is no simple patch because fully addressing the missing freshness protection would require new memory-encryption hardware, although software changes may raise the difficulty of exploitation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers disclosed DDRop, an active DDR5 memory interposer attack that silently drops writes so processors can read older encrypted memory contents as if they were current.","DDRop affects Intel TDX, Intel Scalable SGX, and AMD SEV-SNP, and requires an attacker to control server software and briefly gain physical access to install an interposer between the processor and a memory module.","On Intel TDX, the researchers used dropped page-table writes to read and modify protected virtual-machine memory, enable debug mode, and alter launch measurements used for remote attestation.","On AMD SEV-SNP, the researchers used dropped writes during page relocation to copy the contents of one victim memory page into another.","The researchers said there is no simple patch because the underlying weakness is the lack of a memory freshness check, and a complete fix would require new memory-encryption hardware with integrity and freshness protections."],"insights":["DDRop bypasses DDR5’s defenses against earlier address-swapping interposer attacks by causing a memory command error and then preventing the memory module from reporting that error to the processor.","Intel TDX’s optional cryptographic-integrity mode would block some demonstrated cross-virtual-machine attacks, but the researchers argue it would not prevent an attacker from forging its own machine’s attestation because stale data can still be reused.","The attack hardware is estimated to cost about $159 in parts, can be installed in minutes, and can then be operated entirely through software.","Intel Client SGX is not affected because it uses a hardware integrity tree that detects stale memory contents, while NVIDIA confidential-computing GPUs are out of reach because their memory is inside the chip package."],"referencedReports":[{"title":"DDRop Research Paper","url":"https://ddropattack.eu/ddrop.pdf","publisher":"KU Leuven, ETH Zurich, Durham University, and Google","context":"The article cites the researchers' technical paper describing the DDRop attack and its impact on Intel TDX, Scalable SGX, and AMD SEV-SNP.","category":"research","primary":true},{"title":"Intel Security Announcement 2026-08-11-001","url":"https://intel.com/content/www/us/en/security-center/announcement/intel-security-announcement-2026-08-11-001.html","publisher":"Intel","context":"The article links to Intel's security announcement concerning the coordinated disclosure of DDRop.","category":"advisory","primary":false},{"title":"AMD-SB-3048","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3048.html","publisher":"AMD","context":"The article links to AMD's product-security bulletin for DDRop, which AMD said would be published on the disclosure date.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed DDRop, a hardware attack that silently drops DDR5 memory writes, causing a processor to read older encrypted data as though it were current. It affects Intel TDX, Intel Scalable SGX, and AMD SEV-SNP confidential-computing technologies, which encrypt server memory but omit checks that confirm data is the newest version. The attack requires an adversary who already controls server software and can briefly access the system physically to install a small interposer board between the processor and a memory module. The researchers estimate the hardware parts cost about $159 and say it can be installed in minutes.\u003c/p\u003e\n\n\u003cp\u003eThe interposer forces an error on the memory command bus and then prevents the memory module from reporting that error, causing the memory module to discard a write without the processor knowing. On Intel TDX, researchers used this capability to manipulate page-table setup, access protected virtual-machine memory, enable debug mode, and alter launch measurements used for remote attestation. On AMD SEV-SNP, they demonstrated copying one victim memory page into another during page relocation. The researchers said there is no simple patch because fully addressing the missing freshness protection would require new memory-encryption hardware, although software changes may raise the difficulty of exploitation.\u003c/p\u003e\n"},{"n":1,"title":"Revolut discloses data breach exposing financial info, passports","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/revolut-discloses-data-breach-exposing-financial-info-passports/","time":"08:48","priority":"SHOULD READ","score":82,"tldr":"Revolut disclosed that attackers impersonating a government agency used a spoofed, authenticated email request to obtain highly sensitive customer data, including identity documents, selfies, account statements, and transaction histories. The company says customer funds and systems were not affected and that only a limited, potentially high-net-worth group was targeted.","briefOverview":"\u003cp\u003eRevolut disclosed a data breach in which it shared customer information with a threat actor impersonating a government agency. The request arrived from an unauthorized email account using the agency’s official domain and carried valid domain-authentication credentials, so Revolut fulfilled it believing it was legitimate. Revolut operates in more than 160 countries and regions and serves over 80 million customers, but said this incident affected a \u0026ldquo;very limited\u0026rdquo; number of people without providing an exact count.\u003c/p\u003e\n\n\u003cp\u003eThe disclosed data may include names, dates of birth, occupations, addresses, email addresses, phone numbers, passport or driver’s-license copies, and facial-verification selfies. It also includes account statements with IBAN numbers, withdrawal records, and full transaction histories, including Bitcoin transactions. Revolut said its systems and customer funds were not affected; after detecting the incident, it blocked the email address and notified the relevant government agency, law-enforcement bodies, data-protection authorities, and financial regulators.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Revolut disclosed that it shared customer information with a threat actor who impersonated a government agency through an unauthorized email account using the agency’s official domain.","The company said the email carried valid domain-authentication credentials, leading it to fulfill the request under the belief that it was legitimate.","The disclosed data includes identity and contact details, passport or driver’s-license copies, facial-verification images, account statements with IBANs, withdrawal records, and full transaction histories including Bitcoin transactions.","Revolut said the incident affected a very limited number of customers, although it did not disclose the exact number, and stated that its systems and customer funds were unaffected.","Revolut said it blocked the email address after detecting the incident and notified the relevant government agency, law enforcement, data-protection authorities, and financial regulators."],"insights":["The fraudulent request appeared credible because it was sent from an unauthorized mailbox using an official government domain and carried valid domain-authentication credentials.","The information disclosed combined identity-document copies and facial-verification selfies with detailed banking and transaction records, including Bitcoin transactions.","Although Revolut described the affected population as very limited, crypto fraud investigator ZachXBT said the apparent targeting was focused on high-net-worth users.","This is Revolut’s second disclosed customer-data breach in four years, following a September 2022 incident affecting 50,150 customers."],"referencedReports":[],"body":"\u003cp\u003eRevolut disclosed a data breach in which it shared customer information with a threat actor impersonating a government agency. The request arrived from an unauthorized email account using the agency’s official domain and carried valid domain-authentication credentials, so Revolut fulfilled it believing it was legitimate. Revolut operates in more than 160 countries and regions and serves over 80 million customers, but said this incident affected a \u0026ldquo;very limited\u0026rdquo; number of people without providing an exact count.\u003c/p\u003e\n\n\u003cp\u003eThe disclosed data may include names, dates of birth, occupations, addresses, email addresses, phone numbers, passport or driver’s-license copies, and facial-verification selfies. It also includes account statements with IBAN numbers, withdrawal records, and full transaction histories, including Bitcoin transactions. Revolut said its systems and customer funds were not affected; after detecting the incident, it blocked the email address and notified the relevant government agency, law-enforcement bodies, data-protection authorities, and financial regulators.\u003c/p\u003e\n"},{"n":8,"title":"Twitch extension with 30K installs exposes users’ OAuth tokens","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/twitch-extension-with-30k-installs-exposes-users-oauth-tokens/","time":"19:03","priority":"SHOULD READ","score":82,"tldr":"The Twitch Enhanced Viewer | JeetBot browser extension, installed by more than 30,000 users, reportedly sends Twitch OAuth session tokens to JeetBot-controlled proxy servers by placing them in logged URL parameters. Users should remove the extension and revoke all active Twitch sessions to invalidate potentially exposed tokens.","briefOverview":"\u003cp\u003eA browser extension called Twitch Enhanced Viewer | JeetBot, available in the official Chrome and Firefox stores, has more than 30,000 installs and claims to block ads, enable 1080p playback, bypass region restrictions, and collect channel points. Socket reported that the extension captures the authorization header used by Twitch’s web client, extracts the user’s OAuth session token, and sends it through proxy servers operated by JeetBot. JeetBot is described as a commercial Russian-language streaming and chatbot service for Twitch, Kick, and VK Live.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket, current versions append the token as an \u003ccode\u003eauth=\u003c/code\u003e parameter when redirecting Twitch video playlist requests through a proxy. Because the token is included in the web address, it is written in clear text to the proxy server’s request logs, where the software vendor can retrieve it. The behavior reportedly occurs for every channel a user watches except ten Russian-language channels hardcoded into the extension. Socket recommends removing the extension, disconnecting all Twitch sessions, and signing in again to invalidate any tokens that may have been forwarded.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Twitch Enhanced Viewer | JeetBot extension, available through the official Chrome and Firefox stores, has more than 30,000 installs and advertises ad blocking, 1080p playback, region restriction bypassing, and channel-point collection.","Socket reported that the extension captures the Twitch web client’s authorization header, extracts the user’s OAuth token, and sends it through proxy servers operated by JeetBot.","The current extension versions append the token as an auth URL parameter on redirected Twitch video playlist requests, causing the token to be recorded in proxy-server request logs.","The extension performs this token-forwarding process for every Twitch channel watched except ten Russian-language channels hardcoded into its code.","Socket recommends that affected users remove the extension, disconnect all Twitch sessions, and re-authenticate to invalidate tokens that may have been forwarded."],"insights":["The extension’s Chrome Web Store privacy disclosure says the developer will not collect or use user data, despite Socket’s finding that Twitch OAuth tokens are sent through JeetBot-operated proxy servers.","Putting OAuth tokens in URL parameters makes them available in ordinary proxy request logs, meaning the service operator can retrieve them without needing a separate token-collection system.","The extension excludes ten hardcoded Russian-language channels from the token-forwarding behavior, indicating that the behavior is not applied uniformly to every viewed channel.","The developer’s Firefox Add-ons description acknowledges that earlier versions transmitted users’ Twitch OAuth tokens to its server and described this as necessary for higher-resolution streaming.","Despite the reported risks, the extension remained available in both the Chrome Web Store and Firefox Add-Ons store at the time of publication."],"referencedReports":[{"title":"Malicious Twitch browser extension","url":"https://socket.dev/blog/malicious-twitch-browser-extension#Recommendations","publisher":"socket","context":"The article relies on Socket's analysis that the Twitch Enhanced Viewer | JeetBot extension captures OAuth tokens and exposes them in proxy request logs.","category":"research","primary":true}],"body":"\u003cp\u003eA browser extension called Twitch Enhanced Viewer | JeetBot, available in the official Chrome and Firefox stores, has more than 30,000 installs and claims to block ads, enable 1080p playback, bypass region restrictions, and collect channel points. Socket reported that the extension captures the authorization header used by Twitch’s web client, extracts the user’s OAuth session token, and sends it through proxy servers operated by JeetBot. JeetBot is described as a commercial Russian-language streaming and chatbot service for Twitch, Kick, and VK Live.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket, current versions append the token as an \u003ccode\u003eauth=\u003c/code\u003e parameter when redirecting Twitch video playlist requests through a proxy. Because the token is included in the web address, it is written in clear text to the proxy server’s request logs, where the software vendor can retrieve it. The behavior reportedly occurs for every channel a user watches except ten Russian-language channels hardcoded into the extension. Socket recommends removing the extension, disconnecting all Twitch sessions, and signing in again to invalidate any tokens that may have been forwarded.\u003c/p\u003e\n"},{"n":9,"title":"Microsoft releases emergency Windows updates to fix RDS failures","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-emergency-windows-updates-to-fix-rds-failures/","time":"20:52","priority":"SHOULD READ","score":82,"tldr":"Microsoft released emergency out-of-band Windows updates to fix Remote Desktop Services failures caused by September 2026 security patches across affected Windows client and Server versions. The updates also address a Hyper-V shared-folder issue and some multichannel USB Audio Class 1.0 problems, though Microsoft is still working on a fix for remaining USB audio failures.","briefOverview":"\u003cp\u003eMicrosoft released emergency out-of-band updates on September 14 to fix Remote Desktop Services (RDS) failures caused by the September 2026 Windows security updates. Affected systems experienced Remote Desktop Protocol connection and sign-in failures, and some servers became unresponsive. Related tools, including Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page, could also stop responding. Administrators had previously reported that uninstalling the September updates restored Remote Desktop functionality, but removed the security fixes included with them.\u003c/p\u003e\n\n\u003cp\u003eThe updates cover Windows 10 21H2 and 22H2, Windows 11 24H2, 25H2, and 26H1, and Windows Server 2019, 2022, and 2025. The Windows Server fixes address RDS failures introduced by KB5122871 on Windows Server 2025 and KB5122882 on Windows Server 2022. Microsoft had supplied Group Policy mitigations while developing the permanent fixes, and the Server out-of-band updates are available through the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe Windows 11 out-of-band updates also resolve a Hyper-V issue in which shared Windows host folders could be missing or inaccessible in Linux virtual machines. They additionally address multichannel audio failures involving some USB Audio Class 1.0 devices, including 8-channel and 3D audio modes. However, Microsoft said it is still working on a fix for other USB Audio Class 1.0 problems that can cause devices to fail to start, produce no audio, or show a Code 10 error in Device Manager.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released out-of-band Windows updates on September 14 to address Remote Desktop Services failures caused by September 2026 security updates.","The affected Remote Desktop Services issue caused Remote Desktop Protocol connection and sign-in failures and could leave some servers unresponsive.","The emergency updates cover Windows 10 21H2 and 22H2, Windows 11 24H2, 25H2, and 26H1, and Windows Server 2019, 2022, and 2025.","The Windows 11 updates also fix a Hyper-V shared-folder problem affecting Linux virtual machines and some multichannel USB Audio Class 1.0 issues.","Microsoft said it is still working on a fix for remaining USB Audio Class 1.0 device failures introduced by the September security update."],"insights":["Administrators who uninstall the problematic September security updates may restore remote desktop access, but doing so also removes the security fixes included in those updates.","The emergency fixes are distributed through different channels: Windows 11 26H1 is available through Windows Update, Windows Update for Business, the Microsoft Update Catalog, and WSUS, while the listed Windows Server fixes are available through the Microsoft Update Catalog.","The out-of-band updates resolve only some USB Audio Class 1.0 problems, specifically multichannel audio failures, while Microsoft continues to work on remaining cases where devices fail to start or produce any sound.","The Remote Desktop Services issue affected more than remote connections, with management tools such as MMC, RDS Licensing Diagnoser, File Explorer, and the Windows Update page also potentially becoming unresponsive."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft released emergency out-of-band updates on September 14 to fix Remote Desktop Services (RDS) failures caused by the September 2026 Windows security updates. Affected systems experienced Remote Desktop Protocol connection and sign-in failures, and some servers became unresponsive. Related tools, including Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page, could also stop responding. Administrators had previously reported that uninstalling the September updates restored Remote Desktop functionality, but removed the security fixes included with them.\u003c/p\u003e\n\n\u003cp\u003eThe updates cover Windows 10 21H2 and 22H2, Windows 11 24H2, 25H2, and 26H1, and Windows Server 2019, 2022, and 2025. The Windows Server fixes address RDS failures introduced by KB5122871 on Windows Server 2025 and KB5122882 on Windows Server 2022. Microsoft had supplied Group Policy mitigations while developing the permanent fixes, and the Server out-of-band updates are available through the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe Windows 11 out-of-band updates also resolve a Hyper-V issue in which shared Windows host folders could be missing or inaccessible in Linux virtual machines. They additionally address multichannel audio failures involving some USB Audio Class 1.0 devices, including 8-channel and 3D audio modes. However, Microsoft said it is still working on a fix for other USB Audio Class 1.0 problems that can cause devices to fail to start, produce no audio, or show a Code 10 error in Device Manager.\u003c/p\u003e\n"},{"n":13,"title":"Revolut handed customer data to fraudsters using government email account","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/revolut-scam-crypto-impersonation","time":"12:00","priority":"SHOULD READ","score":82,"tldr":"Revolut disclosed sensitive customer data after fraudsters used a legitimate government email domain to submit fake emergency information requests, reportedly targeting high-net-worth and crypto-linked customers. Exposed information reportedly included identity documents, contact details, bank records, and transaction histories.","briefOverview":"\u003cp\u003eRevolut confirmed that fraudsters obtained sensitive customer information by submitting fraudulent emergency data requests from a legitimate government agency email domain. The company described the incident as a sophisticated external impersonation scam and said it had blocked the address after detecting it. Revolut said a limited number of customers were affected and that it notified them directly.\u003c/p\u003e\n\n\u003cp\u003eThe perpetrators reportedly targeted high-net-worth individuals, including people involved in crypto asset businesses, and demanded an extortion payment to avoid releasing the data. Customer notices reportedly listed exposed information including birth dates, contact details, passport and driver’s license copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity. Revolut said it alerted the relevant government agency, law enforcement, data-protection authorities, and financial regulators; the FBI has previously warned about fraudulent emergency data requests sent using compromised email accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Revolut said an unauthorized third party used a legitimate government agency email domain to submit fraudulent requests for customer information.","Revolut stated that only a limited number of customers were affected and that it notified them directly.","Affected customers reported that the exposed data included dates of birth, contact details, identity-document copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity.","The perpetrators reportedly sought an extortion payment from Revolut to prevent customer data from being released.","Revolut said it blocked the email address and alerted the relevant government agency, law enforcement, data-protection authorities, and financial regulators."],"insights":["The scam succeeded by using a legitimate government email domain, showing that requests appearing to come from an official address can still be fraudulent.","The reported exposure included both identity documents and detailed financial and cryptocurrency transaction information, creating a broader set of sensitive data than basic contact information alone.","The incident resembles earlier cases in 2021 and 2022 in which attackers linked to Lapsus$ used compromised law-enforcement accounts or forged emergency requests to obtain data from technology companies.","The FBI had previously warned that compromised email accounts were being offered on criminal forums for sending fraudulent emergency data requests."],"referencedReports":[{"title":"FBI alert on fraudulent emergency data requests","url":"https://www.ic3.gov/CSA/2024/241104.pdf","publisher":"fbi","context":"The article cites an FBI alert warning of increased criminal-forum postings offering compromised email accounts for submitting fraudulent emergency data requests.","category":"advisory","primary":false}],"body":"\u003cp\u003eRevolut confirmed that fraudsters obtained sensitive customer information by submitting fraudulent emergency data requests from a legitimate government agency email domain. The company described the incident as a sophisticated external impersonation scam and said it had blocked the address after detecting it. Revolut said a limited number of customers were affected and that it notified them directly.\u003c/p\u003e\n\n\u003cp\u003eThe perpetrators reportedly targeted high-net-worth individuals, including people involved in crypto asset businesses, and demanded an extortion payment to avoid releasing the data. Customer notices reportedly listed exposed information including birth dates, contact details, passport and driver’s license copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity. Revolut said it alerted the relevant government agency, law enforcement, data-protection authorities, and financial regulators; the FBI has previously warned about fraudulent emergency data requests sent using compromised email accounts.\u003c/p\u003e\n"},{"n":14,"title":"Pro-Ukraine Hacking Cat group deploying new malware against Russian targets","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-malware-russia-ransomware","time":"16:15","priority":"SHOULD READ","score":82,"tldr":"Kaspersky reports that the pro-Ukraine Hacking Cat group has escalated attacks on Russian targets, using Gorilla RAT and evolving Monkey Ransomware variants to gain remote access and encrypt or destroy data. The group disputes Kaspersky’s attribution of the ransomware, highlighting the difficulty of tracking shared tools among Ukraine-linked hacktivist groups.","briefOverview":"\u003cp\u003eKaspersky reported that the pro-Ukraine hacktivist group Hacking Cat has evolved from website defacements and data leaks into more destructive operations against Russian targets. Active against Russian organizations since around February 2024, the group reportedly shifted by summer 2025 toward encrypting and destroying data. Kaspersky identified two malware families in attacks linked to the group: Gorilla RAT and Monkey Ransomware.\u003c/p\u003e\n\n\u003cp\u003eSome intrusions reportedly exploited weaknesses in Microsoft Exchange servers before deploying Gorilla RAT, which can tunnel network traffic and enable remote access to systems inside a victim network. Kaspersky found multiple Monkey Ransomware variants written in different programming languages, with rapid development that could reflect generative-AI assistance or experimentation. Shared tools and identical multi-stage infection chains among Ukraine-linked hacktivist groups complicate attribution, while Hacking Cat has disputed Kaspersky’s claim that the data-locking malware was its own.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky linked the pro-Ukraine Hacking Cat group to Gorilla RAT, a previously undocumented tool that can tunnel network traffic for remote access inside a victim’s network.","Kaspersky also found multiple variants of Monkey Ransomware, which encrypts user data and appends the \".monkey\" extension to affected files.","Hacking Cat has targeted Russian organizations since about February 2024 and shifted toward operations intended to encrypt and destroy data by summer 2025.","The group has claimed or been linked to operations involving a Rosatom contractor and Donbassteploenergo in Russian-occupied Donetsk.","Hacking Cat disputed Kaspersky’s attribution of the data-locking malware, saying some tools were theirs but the lockers were not."],"insights":["The same custom tools and even identical multi-step intrusion sequences have appeared across different Ukraine-linked hacktivist groups, making group-level attribution substantially less certain.","Monkey Ransomware changed rapidly across several programming languages in the months after it emerged, which Kaspersky said could reflect generative-AI assistance or experimentation by its operators.","Some intrusions reportedly began by exploiting Microsoft Exchange server weaknesses, after which Gorilla RAT was used to create a path for remote access into internal systems.","The reported use of Nemo Wiper in a joint operation points to an intent to destroy data and disrupt infrastructure rather than seek payment."],"referencedReports":[{"title":"Hacking Cat","url":"https://securelist.ru/tr/hacking-cat/117062/","publisher":"kaspersky","context":"The article relies on Kaspersky’s report for its findings on Gorilla RAT, Monkey Ransomware, and Hacking Cat’s operations.","category":"research","primary":true},{"title":"Weekly Intelligence Report - 07 November 2025","url":"https://www.cyfirma.com/news/weekly-intelligence-report-07-november-2025/","publisher":"cyfirma","context":"The article cites this prior report for information that Monkey Ransomware encrypts files and adds the .monkey extension.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky reported that the pro-Ukraine hacktivist group Hacking Cat has evolved from website defacements and data leaks into more destructive operations against Russian targets. Active against Russian organizations since around February 2024, the group reportedly shifted by summer 2025 toward encrypting and destroying data. Kaspersky identified two malware families in attacks linked to the group: Gorilla RAT and Monkey Ransomware.\u003c/p\u003e\n\n\u003cp\u003eSome intrusions reportedly exploited weaknesses in Microsoft Exchange servers before deploying Gorilla RAT, which can tunnel network traffic and enable remote access to systems inside a victim network. Kaspersky found multiple Monkey Ransomware variants written in different programming languages, with rapid development that could reflect generative-AI assistance or experimentation. Shared tools and identical multi-stage infection chains among Ukraine-linked hacktivist groups complicate attribution, while Hacking Cat has disputed Kaspersky’s claim that the data-locking malware was its own.\u003c/p\u003e\n"},{"n":23,"title":"Malicious Twitch Browser Extension Leaks OAuth Tokens From Nearly 31,000 Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/malicious-twitch-browser-extension.html","time":"07:24","priority":"SHOULD READ","score":82,"tldr":"The Twitch Enhanced Viewer | JeetBot browser extension exposed OAuth session tokens from nearly 31,000 Chrome and Firefox users by forwarding them through operator-controlled proxies, potentially enabling account actions such as reading or sending private messages. Users should disable or update the extension immediately and revoke affected Twitch sessions, as prior token exposure is not undone by updating.","briefOverview":"\u003cp\u003eA cross-store browser extension named Twitch Enhanced Viewer | JeetBot leaked Twitch OAuth tokens associated with nearly 31,000 Chrome and Firefox users to proxy servers operated by a Russian commercial bot service. The Chrome extension had about 30,000 users and the Firefox add-on had 604 users when the article was written. Socket researcher Kush Pandya said the tokens were forwarded for every channel watched except a hardcoded allowlist of ten Twitch channels, most of them Russian-language streamers.\u003c/p\u003e\n\n\u003cp\u003eThe extension redirected Twitch video-playlist requests through operator-controlled proxies and included the user’s token as an \u003ccode\u003e\u0026amp;auth=\u003c/code\u003e URL parameter. Because the token was in the URL, it was written in cleartext to the proxy servers’ request logs; the token could provide access to chat, private messages, account settings, and channel points. JeetBot’s documentation says Firefox version 85.8.7 no longer sends tokens to its proxies and advises users to update or disable older versions, but it warns that doing so does not revoke tokens already transmitted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Twitch Enhanced Viewer | JeetBot extensions for Chrome and Firefox exposed OAuth tokens associated with nearly 31,000 users by forwarding them through proxy servers operated by the JeetBot service.","Current v85.x builds sent users' Twitch tokens as an auth query parameter when redirecting video playlist requests through operator-controlled proxies, except for a hardcoded list of ten Twitch channels.","A Twitch OAuth token can allow its holder to access chat, private messages, and account settings, and Socket said it can also enable posting in chat and spending channel points.","JeetBot’s documentation says Firefox version 85.8.7 no longer sends users' Twitch OAuth tokens to its proxies and advises users to update or temporarily disable the extension.","The developer warned that updating or disabling the extension does not cancel tokens that were previously transmitted."],"insights":["Because the extension placed Twitch access tokens directly in URL parameters, the tokens were recorded in cleartext in the proxy servers’ request logs.","The extension exempted a hardcoded list of ten mostly Russian-language streamer channels from token forwarding, while sending tokens for viewers of other channels.","Earlier version 4.x builds reportedly sent tokens to a dedicated operator endpoint and used backup endpoints on deno.dev and deno.net.","Updating or disabling the extension stops further token transmission but does not invalidate tokens that were already sent to the operator’s infrastructure."],"referencedReports":[{"title":"Malicious Twitch Browser Extension Leaks OAuth Tokens From Nearly 31,000 Users","url":"https://socket.dev/blog/malicious-twitch-browser-extension","publisher":"socket","context":"Socket researcher Kush Pandya’s technical analysis identified the extension’s OAuth-token forwarding behavior and estimated that approximately 31,000 users were affected.","category":"research","primary":true},{"title":"JeetBot Extension Documentation Alert","url":"https://docs.jeetbot.cc/en/base-stuff/extension/","publisher":"jeetbot","context":"JeetBot’s documentation alert states that Firefox version 85.8.7 stops sending users’ Twitch OAuth tokens to its proxies and advises users to update or disable older versions.","category":"advisory","primary":false}],"body":"\u003cp\u003eA cross-store browser extension named Twitch Enhanced Viewer | JeetBot leaked Twitch OAuth tokens associated with nearly 31,000 Chrome and Firefox users to proxy servers operated by a Russian commercial bot service. The Chrome extension had about 30,000 users and the Firefox add-on had 604 users when the article was written. Socket researcher Kush Pandya said the tokens were forwarded for every channel watched except a hardcoded allowlist of ten Twitch channels, most of them Russian-language streamers.\u003c/p\u003e\n\n\u003cp\u003eThe extension redirected Twitch video-playlist requests through operator-controlled proxies and included the user’s token as an \u003ccode\u003e\u0026amp;auth=\u003c/code\u003e URL parameter. Because the token was in the URL, it was written in cleartext to the proxy servers’ request logs; the token could provide access to chat, private messages, account settings, and channel points. JeetBot’s documentation says Firefox version 85.8.7 no longer sends tokens to its proxies and advises users to update or disable older versions, but it warns that doing so does not revoke tokens already transmitted.\u003c/p\u003e\n"},{"n":24,"title":"WordPress Adds Automated Plugin Reviews to Block High-Risk Updates Before Distribution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/wordpress-adds-automated-plugin-reviews.html","time":"16:00","priority":"SHOULD READ","score":82,"tldr":"WordPress now automatically scans every plugin and theme update during a six-hour cooldown period, blocking releases with high-risk security scores before they reach users through the WordPress.org update API.","briefOverview":"\u003cp\u003eWordPress is launching an automated security review for every plugin release before it is distributed through the WordPress.org update API. The system is intended to address the gap between a developer committing an update and the update reaching downstream users, where a previously safe plugin could introduce a security flaw or harmful code. Plugin and theme releases already undergo a cooldown period before automatic distribution under the Protect The Shire initiative, which is currently set to six hours.\u003c/p\u003e\n\n\u003cp\u003eDuring that cooldown period, WordPress analyzes release changes using AI models and Jetpack Scan, cross-checks the results, and assigns a security risk score. Releases above the high-risk threshold are automatically blocked without Plugins Team involvement, while lower-risk releases continue through the normal process; committers are emailed only when their release is blocked. WordPress said this process detected a backdoor in a July 28, 2026 release for a plugin with about 20,000 active installations, preventing the compromised version from being distributed through the update API.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress is launching automated security reviews for every plugin release before distribution through the WordPress.org update API.","During a six-hour cooldown period, WordPress analyzes plugin and theme release changes using AI models and Jetpack Scan, then combines results into a security score.","Releases with high-risk scores are automatically blocked, and plugin committers receive an email describing the findings.","WordPress said its automated review detected a backdoor in a July 28, 2026 plugin release affecting a plugin with about 20,000 active installations, and the compromised version was not distributed through the update API.","Developers can address a blocked release by fixing the identified issues and publishing a new version that scores below the high-risk threshold."],"insights":["WordPress’s prior review process covered new plugins entering the directory, but not the continuous updates released afterward, creating an opportunity for a previously safe plugin to later distribute harmful code.","A high-risk score can result from accidental security mistakes as well as deliberately harmful code, so an automatic block is not necessarily an accusation of malicious intent.","The six-hour delay before automatic distribution was reduced from the initiative’s original 24-hour period, balancing time for checks against the speed at which developers can deliver updates.","For blocked releases, publishing a corrected version is usually faster for developers than requesting a manual review from the Plugins Team.","The automated review can block a risky release without Plugins Team involvement, allowing potentially dangerous updates to be stopped before they are distributed."],"referencedReports":[],"body":"\u003cp\u003eWordPress is launching an automated security review for every plugin release before it is distributed through the WordPress.org update API. The system is intended to address the gap between a developer committing an update and the update reaching downstream users, where a previously safe plugin could introduce a security flaw or harmful code. Plugin and theme releases already undergo a cooldown period before automatic distribution under the Protect The Shire initiative, which is currently set to six hours.\u003c/p\u003e\n\n\u003cp\u003eDuring that cooldown period, WordPress analyzes release changes using AI models and Jetpack Scan, cross-checks the results, and assigns a security risk score. Releases above the high-risk threshold are automatically blocked without Plugins Team involvement, while lower-risk releases continue through the normal process; committers are emailed only when their release is blocked. WordPress said this pr
