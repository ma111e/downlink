<script type="application/json" id="dl-articles">[{"n":1,"title":"Spyware found on phone of European Parliament member probing it","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/pegasus-spyware-european-parliament-pega-committee-member","time":"05:00","priority":"SHOULD READ","score":82,"tldr":"Citizen Lab says former European Parliament member Stelios Kouloglou was infected with Pegasus spyware while serving on the committee investigating spyware abuse, including during key periods of its work. Researchers linked the targeting to the same Pegasus operator behind attacks on Russian and Belarusian journalists and opposition figures, underscoring concerns that commercial spyware is being used against democratic oversight.","briefOverview":"\u003cp\u003eCitizen Lab reported that the phone of former European Parliament member Stelios Kouloglou was infected with Pegasus spyware in October 2022 and again in March 2023. At the time, Kouloglou was serving on the PEGA Committee, which was investigating misuse of commercial spyware and preparing recommendations for addressing abuse in Europe. Kouloglou, also a longtime investigative reporter, told Recorded Future News he believes the Greek government was responsible, but Citizen Lab said it has no indications that this is true.\u003c/p\u003e\n\n\u003cp\u003eThe infections occurred during sensitive periods for the PEGA Committee, including less than a week before hearings and as members prepared a draft report, and later during intense discussions about the final report. Hannah Neumann, a German Green Party representative and PEGA Committee negotiator, said the incident showed disregard for parliamentarians’ scrutiny role and for European democracy. The committee released recommendations in May 2023, but the article says the European Commission has largely ignored them.\u003c/p\u003e\n\n\u003cp\u003ePegasus is described in the article as powerful zero-click spyware, and Citizen Lab linked the Kouloglou incidents to attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023. Citizen Lab said the same email used against Kouloglou was also deployed in those attacks, and that targeting emails are unique to specific operators. Kouloglou brought his phone to Citizen Lab in May 2026, and researchers found evidence that he had received three Apple threat notifications about potential spyware, though he said he never saw them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citizen Lab reported that former European Parliament member Stelios Kouloglou’s phone was infected with Pegasus spyware in October 2022 and again in March 2023 while he served on the PEGA Committee investigating spyware misuse.","The PEGA Committee was working on recommendations to address abuse of commercial spyware in Europe when the infections occurred, and it released those recommendations in May 2023.","Citizen Lab believes the same Pegasus customer was responsible for the Kouloglou infections and for attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023.","Kouloglou told Recorded Future News he believes the Greek government is responsible for the hacks, but Citizen Lab said it has no indications that this is true.","Hannah Neumann, a Green Party representative from Germany and PEGA Committee negotiator, said spying on a member of the European Parliament while he was investigating spyware abuse showed disregard for European democracy."],"insights":["The timing of both infections was especially sensitive because they occurred shortly before major PEGA Committee hearings and during intense discussions over the committee’s draft and final spyware reports.","Citizen Lab’s finding that the same targeting email was used in both Kouloglou’s case and the Russian and Belarusian cases provides a concrete operational link between otherwise separate spyware campaigns.","Kouloglou had received three Apple threat notifications about possible spyware in recent years but said he never saw them, showing that even official warnings may fail to reach or alert intended targets.","The reported operator appears to have had Pegasus licensing that allowed targeting in multiple countries, which Citizen Lab said narrows the pool of possible government customers.","The European Commission’s lack of action on the PEGA Committee’s May 2023 recommendations is presented by multiple cited experts and politicians as a continuing policy failure despite direct evidence of spyware use against a committee member."],"referencedReports":[{"title":"Member of Committee Investigating Spyware Hacked with Pegasus","url":"https://citizenlab.ca/research/member-of-committee-investigating-spyware-hacked-with-pegasus/","publisher":"Citizen Lab","context":"The article is based on Citizen Lab’s report asserting that Stelios Kouloglou’s phone was infected with Pegasus spyware in October 2022 and March 2023.","category":"research","primary":true},{"title":"Pegasus Spyware Targeted Russian and Belarusian-speaking Opposition and Media in Europe","url":"https://citizenlab.ca/research/pegasus-russian-belarusian-speaking-opposition-media-europe/","publisher":"Citizen Lab","context":"The article cites this May 2024 Citizen Lab report to link the Kouloglou infections to earlier spyware attacks on Russian and Belarusian-speaking journalists and opposition figures.","category":"research","primary":false}],"body":"\u003cp\u003eCitizen Lab reported that the phone of former European Parliament member Stelios Kouloglou was infected with Pegasus spyware in October 2022 and again in March 2023. At the time, Kouloglou was serving on the PEGA Committee, which was investigating misuse of commercial spyware and preparing recommendations for addressing abuse in Europe. Kouloglou, also a longtime investigative reporter, told Recorded Future News he believes the Greek government was responsible, but Citizen Lab said it has no indications that this is true.\u003c/p\u003e\n\n\u003cp\u003eThe infections occurred during sensitive periods for the PEGA Committee, including less than a week before hearings and as members prepared a draft report, and later during intense discussions about the final report. Hannah Neumann, a German Green Party representative and PEGA Committee negotiator, said the incident showed disregard for parliamentarians’ scrutiny role and for European democracy. The committee released recommendations in May 2023, but the article says the European Commission has largely ignored them.\u003c/p\u003e\n\n\u003cp\u003ePegasus is described in the article as powerful zero-click spyware, and Citizen Lab linked the Kouloglou incidents to attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023. Citizen Lab said the same email used against Kouloglou was also deployed in those attacks, and that targeting emails are unique to specific operators. Kouloglou brought his phone to Citizen Lab in May 2026, and researchers found evidence that he had received three Apple threat notifications about potential spyware, though he said he never saw them.\u003c/p\u003e\n"}]</script>
