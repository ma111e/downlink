<script type="application/json" id="dl-articles">[{"n":1,"title":"ShinyHunters Suspect Rey Reportedly Detained in Jordan, Helping FBI Identify Group Members","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/shinyhunters-suspect-rey-reportedly.html","time":"07:22","priority":"SHOULD READ","score":84,"tldr":"Jordanian authorities reportedly detained alleged ShinyHunters member Saif al-Din Khader (“Rey”), who is said to be cooperating with the FBI to identify other members of the extortion group. The arrest may generate further leads and arrests amid an ongoing international investigation into ShinyHunters’ large-scale breaches and extortion activity.","briefOverview":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey” or “ReyXBF,” on September 29, 2026. Reuters, citing sources familiar with the matter, reported that he is cooperating with the FBI and other law-enforcement agencies to identify additional group members. Khader had previously been identified as an administrator associated with Hellcat’s data-leak site, BreachForums, and Scattered LAPSUS\u003cspan class=\"math inline\"\u003e\\( Hunters, an alleged combination of Scattered Spider, LAPSUS\\)\u003c/span\u003e, and ShinyHunters.\u003c/p\u003e\n\n\u003cp\u003eThe detention follows the recent arrest of a 24-year-old man in Amsterdam in connection with ShinyHunters’ operations, and the FBI has said more arrests may follow. The FBI alleges that the group and its co-conspirators breached more than 140 organizations since the prior year and received at least $70 million in extortion payments, often by targeting third-party cloud-platform providers and threatening to publish stolen data. Recent allegations involving the group include taking over Cl0p’s darknet site through an unpatched Grav CMS flaw and stealing roughly three terabytes of data from the FBI’s apply.fbijobs[.]gov portal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey,” on September 29, 2026.","Reuters reported that Khader is cooperating with the FBI and other law-enforcement agencies to identify other members of ShinyHunters.","ShinyHunters has been linked to the Scattered LAPSUS$ Hunters group, described as an amalgamation of Scattered Spider, LAPSUS$, and ShinyHunters.","The FBI said the group and its alleged co-conspirators breached more than 140 organizations since the previous year and received at least $70 million in extortion payments.","The case follows the recent arrest in Amsterdam of a 24-year-old man in connection with ShinyHunters’ cyber operations."],"insights":["ShinyHunters is described by researchers as a durable brand and operating model rather than a single fixed group, allowing it to persist through arrests, indictments, and seized online forums.","The group allegedly relies on a division of labor in which social engineers obtain initial access, adjacent actors help recruit and amplify activity, and a shared brand is used to monetize stolen data.","According to the FBI, the group often targets third-party providers of cloud-based platforms, meaning a compromise at one provider can expose sensitive data belonging to multiple organizations.","ShinyHunters said its alleged theft of roughly three terabytes of data from an FBI jobs portal was intended to pressure the FBI to change what it called false claims about the group, rather than to obtain money.","Khader reportedly told journalist Brian Krebs that he had been cooperating with law enforcement since at least June 2025, before his reported detention in Jordan."],"referencedReports":[{"title":"Gainsight Expands Impacted Customer List","url":"https://thehackernews.com/2025/11/gainsight-expands-impacted-customer.html","publisher":"the-hacker-news","context":"The article cites this November 2025 report as the source in which journalist Brian Krebs identified Rey as one of three administrators of Scattered LAPSUS$ Hunters.","category":"news","primary":false},{"title":"Gotta Breach ’Em All: The Journey of ShinyHunters","url":"https://www.sekoia.com/blog/gotta-breach-em-all-the-journey-of-shinyhunters","publisher":"sekoia-and-beazley-security","context":"The article cites this deep-dive analysis for its account of ShinyHunters’ origins, evolution, and modular operating model.","category":"research","primary":false}],"body":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey” or “ReyXBF,” on September 29, 2026. Reuters, citing sources familiar with the matter, reported that he is cooperating with the FBI and other law-enforcement agencies to identify additional group members. Khader had previously been identified as an administrator associated with Hellcat’s data-leak site, BreachForums, and Scattered LAPSUS\u003cspan class=\"math inline\"\u003e\\( Hunters, an alleged combination of Scattered Spider, LAPSUS\\)\u003c/span\u003e, and ShinyHunters.\u003c/p\u003e\n\n\u003cp\u003eThe detention follows the recent arrest of a 24-year-old man in Amsterdam in connection with ShinyHunters’ operations, and the FBI has said more arrests may follow. The FBI alleges that the group and its co-conspirators breached more than 140 organizations since the prior year and received at least $70 million in extortion payments, often by targeting third-party cloud-platform providers and threatening to publish stolen data. Recent allegations involving the group include taking over Cl0p’s darknet site through an unpatched Grav CMS flaw and stealing roughly three terabytes of data from the FBI’s apply.fbijobs[.]gov portal.\u003c/p\u003e\n"},{"n":2,"title":"China-Aligned TA419 Targets U.S. AI Policy Experts With Microsoft AitM Phishing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/china-aligned-ta419-targets-us-ai.html","time":"07:20","priority":"SHOULD READ","score":82,"tldr":"China-aligned espionage group TA419 is targeting U.S. AI policy experts with convincing Microsoft credential-phishing campaigns that use adversary-in-the-middle proxies and Frameless Browser-in-the-Browser pages to steal session cookies. Organizations should deploy phishing-resistant authentication such as passkeys and verify unsolicited professional outreach.","briefOverview":"\u003cp\u003eProofpoint attributed several credential-phishing campaigns against U.S. artificial-intelligence policy experts to the China-aligned, espionage-motivated group TA419. The group has targeted individuals at U.S. think tanks, universities, and legal organizations, impersonating prominent economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official. One February 2026 message used the subject line “Request for Feedback on Military Integration of Claude.” Proofpoint said the activity likely supports Chinese intelligence objectives to understand developments in U.S. AI policy and regulation.\u003c/p\u003e\n\n\u003cp\u003eTA419 begins with seemingly harmless invitations intended to establish trust and sends a shortened link only after a recipient responds. The link redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page that uses a frameless Browser-in-the-Browser technique to mimic a trusted login window. A customized adversary-in-the-middle proxy tracks the Microsoft sign-in process, relays it to real Microsoft infrastructure, and captures credentials and session cookies while making the login appear successful. Proofpoint recommends phishing-resistant authentication such as passkeys and advises recipients to verify unsolicited subject-matter outreach before proceeding.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint attributed credential-phishing campaigns targeting U.S. AI policy experts to the China-aligned, espionage-motivated threat actor TA419.","TA419 impersonated economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official to build trust with targets.","After a target responds to an initial outreach email, TA419 sends a shortened link that redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page.","The phishing pages use a frameless Browser-in-the-Browser technique and an adversary-in-the-middle proxy to capture Microsoft credentials and session cookies while relaying the login to legitimate Microsoft infrastructure.","Proofpoint recommends phishing-resistant authentication methods such as passkeys and cautions targets to verify unsolicited subject-matter outreach before proceeding."],"insights":["TA419 waits for a recipient to respond to a seemingly harmless invitation before sending the phishing link, using the interaction to establish trust before attempting credential theft.","The fake sign-in process can appear successful to the victim because the attackers relay the login to real Microsoft infrastructure while secretly capturing session cookies.","TA419’s use of Frameless Browser-in-the-Browser pages avoids the iframe-based approach normally associated with this type of fake login window.","The campaign’s focus on AI policy specialists is described as an expansion of TA419’s existing interest in defense, national security, energy, international relations, and foreign policy targets connected to the United States and Japan."],"referencedReports":[{"title":"Hallucinating Credibility: China-Aligned TA419 Impersonates Its Way into U.S. AI Policy","url":"https://www.proofpoint.com/us/blog/threat-insight/hallucinating-credibility-china-aligned-ta419-impersonates-its-way-us-ai-policy","publisher":"proofpoint","context":"The article relies on Proofpoint's technical analysis attributing the credential-phishing campaigns against U.S. AI policy experts to TA419.","category":"research","primary":true}],"body":"\u003cp\u003eProofpoint attributed several credential-phishing campaigns against U.S. artificial-intelligence policy experts to the China-aligned, espionage-motivated group TA419. The group has targeted individuals at U.S. think tanks, universities, and legal organizations, impersonating prominent economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official. One February 2026 message used the subject line “Request for Feedback on Military Integration of Claude.” Proofpoint said the activity likely supports Chinese intelligence objectives to understand developments in U.S. AI policy and regulation.\u003c/p\u003e\n\n\u003cp\u003eTA419 begins with seemingly harmless invitations intended to establish trust and sends a shortened link only after a recipient responds. The link redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page that uses a frameless Browser-in-the-Browser technique to mimic a trusted login window. A customized adversary-in-the-middle proxy tracks the Microsoft sign-in process, relays it to real Microsoft infrastructure, and captures credentials and session cookies while making the login appear successful. Proofpoint recommends phishing-resistant authentication such as passkeys and advises recipients to verify unsolicited subject-matter outreach before proceeding.\u003c/p\u003e\n"}]</script>
