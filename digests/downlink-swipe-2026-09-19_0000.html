<script type="application/json" id="dl-articles">[{"n":9,"title":"Critical Pre-Auth RCE in Orkes Conductor Workflow Platform Exploited in the Wild","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/critical-pre-auth-rce-in-orkes.html","time":"08:18","priority":"MUST READ","score":96,"tldr":"A critical unauthenticated RCE flaw, CVE-2026-58138, in Orkes Conductor versions before 3.30.2 is being actively exploited to run arbitrary OS commands through malicious workflow definitions. Organizations should upgrade to 3.30.2 or later immediately and restrict public access to workflow API endpoints.","briefOverview":"\u003cp\u003eA critical unauthenticated remote code execution flaw in Orkes Conductor, tracked as CVE-2026-58138, is being actively exploited in the wild. The issue affects Orkes Conductor versions 3.21.21 through versions before 3.30.2 and carries a CVSS v3.1 score of 9.8. Fortinet reported that attackers are submitting crafted workflow definitions to vulnerable Conductor workflow API endpoints.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflow definitions can contain JavaScript or Python expressions that escape the intended scripting environment and run operating-system commands with the permissions of the Conductor process. The affected workflow task types include INLINE, LAMBDA, DO_WHILE, and SWITCH, which can use evaluators configured with unrestricted host access. Fortinet said it blocked 1,290 attempts in 24 hours as of September 9, 2026, and nearly 7,000 attempts between September 2 and 9. Organizations are advised to upgrade to Conductor 3.30.2 or later, or restrict external API access and monitor for suspicious workflow submissions and unexpected command execution if immediate patching is not possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-58138 is a critical unauthenticated remote code execution flaw affecting Orkes Conductor versions 3.21.21 through versions before 3.30.2.","The flaw lets remote attackers submit malicious JavaScript or Python expressions in inline workflow definitions to execute arbitrary operating-system commands before authentication.","Fortinet reported active exploitation targeting vulnerable Conductor workflow API endpoints and blocked 1,290 attempts in 24 hours as of September 9, 2026.","Fortinet said it blocked nearly 7,000 attempts between September 2 and September 9, 2026, with most activity originating from Germany, Hong Kong, Indonesia, the United Arab Emirates, and India.","Organizations are advised to upgrade to Conductor 3.30.2 or later, or restrict external access to workflow APIs and monitor for suspicious workflow submissions if patching cannot occur immediately."],"insights":["The vulnerable workflow features can turn embedded JavaScript or Python expressions into operating-system command execution because their scripting environment permits unrestricted access to the host system.","Exploitation activity increased sharply: Fortinet recorded a 132% rise in daily activity and blocked 1,290 attempts in a single 24-hour period.","Multiple sources observed activity over an extended period, with Previdian honeypot attempts dating to July 24, 2026, and Empirical Security reporting exploitation as recently as August 21, 2026.","Restricting public access to Conductor workflow API endpoints is a stated interim safeguard for organizations that cannot immediately install version 3.30.2 or later."],"referencedReports":[{"title":"Orkes Conductor RCE","url":"https://www.fortiguard.com/outbreak-alert/orkes-conductor-rce","publisher":"fortinet","context":"Fortinet's outbreak alert is cited as reporting active exploitation of vulnerable Orkes Conductor workflow API endpoints.","category":"advisory","primary":true},{"title":"Orkes Conductor Evaluator Remote Code Execution","url":"https://www.fortiguard.com/threat-signal-report/6527/orkes-conductor-evaluator-remote-code-execution","publisher":"fortinet","context":"Fortinet's threat signal report is cited for telemetry showing blocked exploitation attempts and their geographic origins.","category":"research","primary":false},{"title":"CVE-2026-58138 Telemetry","url":"https://previdian.com/CVE-2026-58138#telemetry","publisher":"previdian","context":"Previdian telemetry is cited as showing three exploitation attempts against its honeypots since July 24, 2026.","category":"research","primary":false},{"title":"September 2026 CVE of the Month","url":"https://research.empiricalsecurity.com/research/september-2026-cve-of-the-month","publisher":"empirical-security","context":"Empirical Security's research is cited as detecting in-the-wild exploitation as recently as August 21, 2026.","category":"research","primary":false}],"body":"\u003cp\u003eA critical unauthenticated remote code execution flaw in Orkes Conductor, tracked as CVE-2026-58138, is being actively exploited in the wild. The issue affects Orkes Conductor versions 3.21.21 through versions before 3.30.2 and carries a CVSS v3.1 score of 9.8. Fortinet reported that attackers are submitting crafted workflow definitions to vulnerable Conductor workflow API endpoints.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflow definitions can contain JavaScript or Python expressions that escape the intended scripting environment and run operating-system commands with the permissions of the Conductor process. The affected workflow task types include INLINE, LAMBDA, DO_WHILE, and SWITCH, which can use evaluators configured with unrestricted host access. Fortinet said it blocked 1,290 attempts in 24 hours as of September 9, 2026, and nearly 7,000 attempts between September 2 and 9. Organizations are advised to upgrade to Conductor 3.30.2 or later, or restrict external API access and monitor for suspicious workflow submissions and unexpected command execution if immediate patching is not possible.\u003c/p\u003e\n"},{"n":6,"title":"CISA Flags Three Linux Kernel Vulnerabilities Exploited in the Wild","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisa-flags-three-linux-kernel.html","time":"06:24","priority":"MUST READ","score":95,"tldr":"CISA added three actively exploited Linux kernel flaws—CVE-2025-39682, CVE-2026-53266, and CVE-2025-39964—to its Known Exploited Vulnerabilities catalog, urging U.S. federal agencies to patch by September 21, 2026.","briefOverview":"\u003cp\u003eCISA added three Linux kernel vulnerabilities to its Known Exploited Vulnerabilities catalog, citing evidence of active exploitation. The flaws are CVE-2025-39682, CVE-2026-53266, and CVE-2025-39964. Red Hat updated advisories for all three issues on September 19, 2026, to acknowledge active exploitation.\u003c/p\u003e\n\n\u003cp\u003eCVE-2025-39682 affects the TLS receive path and can allow local authenticated users to disclose memory or cause a denial of service. CVE-2026-53266 is an out-of-bounds write in the ebtables SNAT ARP rewrite path that can lead to unintended behavior, denial of service, or local privilege escalation, while CVE-2025-39964 involves concurrent writes to an AF_ALG socket that can crash a system or corrupt cryptographic-operation results. CISA recommended that Federal Civilian Executive Branch agencies apply fixes by September 21, 2026, and the article notes that details of the active exploitation and whether the flaws are used together are not available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added three Linux kernel vulnerabilities to its Known Exploited Vulnerabilities catalog after citing evidence that they are being actively exploited.","The listed flaws are CVE-2025-39682 in the TLS receive path, CVE-2026-53266 in the ebtables SNAT ARP rewrite path, and CVE-2025-39964 involving concurrent writes to an AF_ALG socket.","The vulnerabilities could enable local authenticated attackers to disclose memory, crash systems, alter system behavior, escalate privileges, or affect the integrity of cryptographic operation results.","The article states that details of the active exploitation and whether the flaws are used together in one attack chain are not currently available.","CISA recommended that Federal Civilian Executive Branch agencies apply the necessary fixes by September 21, 2026."],"insights":["All three KEV entries concern flaws that require local access, meaning their documented impact includes turning limited access on a Linux system into greater control, data exposure, system disruption, or compromised cryptographic results.","Red Hat updated advisories for all three flaws to acknowledge active exploitation and described CVE-2025-39682 as high risk with known public exploits, making prompt remediation particularly actionable.","CISA set a September 21, 2026 deadline for U.S. federal civilian agencies, only days after Red Hat’s September 19 advisory updates.","The article also notes four separately disclosed Linux kernel local privilege-escalation flaws, indicating that the three KEV additions are not the only recently publicized kernel risks."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert for the addition of two Linux kernel flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites this CISA alert for the addition of the third Linux kernel flaw to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"CVE-2025-39682","url":"https://access.redhat.com/security/cve/cve-2025-39682","publisher":"red-hat","context":"The article says Red Hat updated this advisory to acknowledge active exploitation of the TLS receive-path flaw.","category":"advisory","primary":false},{"title":"CVE-2026-53266","url":"https://access.redhat.com/security/cve/cve-2026-53266","publisher":"red-hat","context":"The article says Red Hat updated this advisory to acknowledge active exploitation of the ebtables SNAT ARP rewrite flaw.","category":"advisory","primary":false},{"title":"CVE-2025-39964","url":"https://access.redhat.com/security/cve/cve-2025-39964","publisher":"red-hat","context":"The article says Red Hat updated this advisory to acknowledge active exploitation of the AF_ALG socket race-condition flaw.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA added three Linux kernel vulnerabilities to its Known Exploited Vulnerabilities catalog, citing evidence of active exploitation. The flaws are CVE-2025-39682, CVE-2026-53266, and CVE-2025-39964. Red Hat updated advisories for all three issues on September 19, 2026, to acknowledge active exploitation.\u003c/p\u003e\n\n\u003cp\u003eCVE-2025-39682 affects the TLS receive path and can allow local authenticated users to disclose memory or cause a denial of service. CVE-2026-53266 is an out-of-bounds write in the ebtables SNAT ARP rewrite path that can lead to unintended behavior, denial of service, or local privilege escalation, while CVE-2025-39964 involves concurrent writes to an AF_ALG socket that can crash a system or corrupt cryptographic-operation results. CISA recommended that Federal Civilian Executive Branch agencies apply fixes by September 21, 2026, and the article notes that details of the active exploitation and whether the flaws are used together are not available.\u003c/p\u003e\n"},{"n":5,"title":"North Korean WaterPlum hackers infected 30,000 devices worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/north-korean-waterplum-hackers-infected-30-000-devices-worldwide/","time":"14:05","priority":"MUST READ","score":90,"tldr":"A joint international advisory says North Korean WaterPlum operators infected at least 30,000 devices in more than 100 countries through fake job interviews and malicious developer projects, stealing credentials and cryptocurrency. The group allegedly moved $10.7 million to North Korea and supports fraudulent IT-worker operations using stolen identities.","briefOverview":"\u003cp\u003eA joint advisory from Japanese, U.S., Australian, and German authorities says the North Korean WaterPlum group infected at least 30,000 devices in more than 100 countries between December 2025 and July 2026. Investigators said the group stole funds or account credentials from more than 7,000 cryptocurrency wallets and transferred cryptocurrency worth 1.7 billion Japanese yen, or $10.71 million, to North Korea. WaterPlum is associated with the multi-year Contagious Interview campaign and is part of a broader North Korean ecosystem that generates revenue for the regime.\u003c/p\u003e\n\n\u003cp\u003eThe group approaches job seekers by impersonating AI, cryptocurrency, and NFT companies or by using recruiting and freelance platforms. During fake interviews and coding tests, victims are asked to download projects, fix supposed video-call issues, or run malicious code. The advisory connects the operation to BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle, including Node.js malware delivered through malicious Visual Studio Code projects that can run code after a folder is opened and trusted.\u003c/p\u003e\n\n\u003cp\u003eAfter infecting a device, the attackers seek browser credentials, clipboard contents, keystrokes, cryptocurrency private keys and seed phrases, documents, and screenshots. They may also use an infected person’s computer to move into an employer’s or client’s network for intellectual-property theft and espionage. Authorities also linked WaterPlum to North Korean fraudulent IT-worker operations, including the alleged use of stolen identity documents and AI face-swapping during online interviews.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A joint advisory from Japanese, U.S., Australian, and German authorities says North Korean WaterPlum operators infected at least 30,000 devices in more than 100 countries between December 2025 and July 2026.","WaterPlum uses fake job interviews, coding tests, and impersonation of AI, cryptocurrency, and NFT companies to persuade job seekers to download or run malicious projects and code.","The advisory links WaterPlum to BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle malware families.","Investigators said the group stole funds or account credentials from more than 7,000 cryptocurrency wallets and transferred cryptocurrency equivalent to $10.71 million to North Korea.","Authorities say WaterPlum is connected to North Korean fraudulent IT-worker operations, which may reuse identity documents stolen from victims to obtain jobs under false identities."],"insights":["The campaign does not stop at stealing cryptocurrency: access to infected job seekers’ computers can also be used to reach their employers’ or clients’ networks for intellectual-property theft and espionage.","Investigators directly linked WaterPlum to North Korean fraudulent IT-worker operations through shared IP addresses and the reuse of identity documents stolen during WaterPlum attacks.","The group reportedly uses AI face-swapping software in online job interviews, then turns off cameras and attributes the change to network problems.","One malware family, StoatWaffle, can be delivered through malicious Visual Studio Code projects that run code after a victim opens and trusts the project folder.","Japan’s authorities said they dismantled a North Korean IT-worker laptop farm in the country, the first such case identified there, with evidence that several hundred million yen had been transferred abroad."],"referencedReports":[{"title":"Joint cybersecurity advisory on North Korean WaterPlum (Contagious Interview) activity","url":"https://www.npa.go.jp/news/release/2026/20260918001.html","publisher":"japan-national-police-agency","context":"The article cites the Japanese authority's joint advisory as a source for the investigation into WaterPlum's global activity.","category":"advisory","primary":true},{"title":"Joint cybersecurity advisory on North Korean WaterPlum (Contagious Interview) activity","url":"https://www.ic3.gov/CSA/2026/260918.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article quotes this U.S. joint advisory for infection, cryptocurrency-wallet, and stolen-funds figures attributed to WaterPlum.","category":"advisory","primary":true},{"title":"North Korean WaterPlum, commonly referred to as Contagious Interview, cyber actor group targeting IT professionals","url":"https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/north-korean-waterplum-commonly-referred-to-as-contagious-interview-cyber-actor-group-targeting-it-professionals","publisher":"australian-cyber-security-centre","context":"The article identifies the Australian authority's advisory as one of the joint law-enforcement sources tracing WaterPlum activity.","category":"advisory","primary":true},{"title":"Joint cybersecurity advisory on North Korean WaterPlum (Contagious Interview) activity","url":"https://www.verfassungsschutz.de/SharedDocs/publikationen/DE/praevention_wirtschafts-und-wissenschaftsschutz/2026-09-18-joint-cybersecurity-advisory.html","publisher":"german-federal-office-for-the-protection-of-the-constitution","context":"The article cites the German authority's joint cybersecurity advisory as part of the coordinated assessment of WaterPlum.","category":"advisory","primary":true}],"body":"\u003cp\u003eA joint advisory from Japanese, U.S., Australian, and German authorities says the North Korean WaterPlum group infected at least 30,000 devices in more than 100 countries between December 2025 and July 2026. Investigators said the group stole funds or account credentials from more than 7,000 cryptocurrency wallets and transferred cryptocurrency worth 1.7 billion Japanese yen, or $10.71 million, to North Korea. WaterPlum is associated with the multi-year Contagious Interview campaign and is part of a broader North Korean ecosystem that generates revenue for the regime.\u003c/p\u003e\n\n\u003cp\u003eThe group approaches job seekers by impersonating AI, cryptocurrency, and NFT companies or by using recruiting and freelance platforms. During fake interviews and coding tests, victims are asked to download projects, fix supposed video-call issues, or run malicious code. The advisory connects the operation to BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle, including Node.js malware delivered through malicious Visual Studio Code projects that can run code after a folder is opened and trusted.\u003c/p\u003e\n\n\u003cp\u003eAfter infecting a device, the attackers seek browser credentials, clipboard contents, keystrokes, cryptocurrency private keys and seed phrases, documents, and screenshots. They may also use an infected person’s computer to move into an employer’s or client’s network for intellectual-property theft and espionage. Authorities also linked WaterPlum to North Korean fraudulent IT-worker operations, including the alleged use of stolen identity documents and AI face-swapping during online interviews.\u003c/p\u003e\n"},{"n":8,"title":"Claude Opus 5 Helped Researchers Take Over OpenAI Staff Accounts via Chained Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claude-opus-5-helped-researchers-take.html","time":"10:01","priority":"SHOULD READ","score":85,"tldr":"Hacktron researchers used Claude Opus 5 to exploit an unpatched libheif image-processing flaw on OpenAI’s Discourse forum, then chained it with an OpenAI SSO weakness to access employees’ ChatGPT, Codex, and an internal GitHub repository. OpenAI fixed the identity issue within about 14 hours and paid a $6,500 bug bounty; the researchers said they performed only a harmless proof of access.","briefOverview":"\u003cp\u003eHacktron researchers said they used Anthropic’s Claude Opus 5 to chain two flaws and access the ChatGPT and Codex accounts of several OpenAI employees, eventually reaching an internal OpenAI GitHub repository. The work was conducted as security research: the team reported the flaws, created a single harmless pull request to demonstrate access, and said it did not read source code, merge changes, ship anything, or access customer data. OpenAI reportedly fixed its side of the issue about 14 hours after the report and paid Hacktron a $6,500 bounty on September 1.\u003c/p\u003e\n\n\u003cp\u003eThe chain began with OpenAI’s public Discourse forum, where a crafted HEIC or HEIF image could exploit memory flaws in the libheif image-processing library used through ImageMagick. Hacktron said it used the leaked memory to overcome a standard memory-randomization defense and achieve control of the forum server, then abused the shared “Sign in with OpenAI” system to take over staff accounts without employee interaction. The case highlights that compromise of a lower-trust public service can potentially extend to connected internal services, including code repositories, chat, and email, when they share the same login system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hacktron researchers chained a libheif image-processing flaw in OpenAI’s Discourse-based public forum with an OpenAI login weakness to access several employees’ ChatGPT and Codex accounts.","The researchers said they demonstrated access by triggering a single harmless pull request in an internal OpenAI GitHub repository and did not read source code, merge changes, ship anything, or access customer data.","Hacktron reported the findings to OpenAI, which confirmed a fix about 14 hours later and paid the researchers a $6,500 bounty on September 1.","The forum’s Debian 12 server image used unpatched libheif version 1.19.7 despite libheif 1.22.0, which fixed the relevant issue, having been released in May 2026.","The article warns that shared sign-in between public-facing services and internal tools can allow a compromise of the former to potentially reach connected services such as GitHub, Slack, and email."],"insights":["A public forum compromise could affect staff accounts without victims taking any action because the forum used the same OpenAI sign-in system as other services.","The public CVE records describe CVE-2026-32882 as an out-of-bounds read that can crash software or expose nearby memory, while Discourse rated the resulting issue as remote code execution and Hacktron said it combined memory bugs to achieve code execution.","Updating a Discourse web interface alone may not replace the vulnerable image-processing library, so self-hosted operators are advised to rebuild on the latest image.","Hacktron said Claude Opus 4.8 struggled to produce a working exploit with memory-randomization protections enabled, while Claude Opus 5 generated one within hours in a fresh session, though human guidance remained necessary."],"referencedReports":[{"title":"Hacking OpenAI","url":"https://www.hacktron.ai/blog/hacking-openai","publisher":"hacktron","context":"Hacktron’s technical write-up is cited for its claim that the account takeover resulted from an OpenAI identity problem rather than a Discourse flaw alone.","category":"research","primary":true},{"title":"Discourse security advisory for CVE-2026-32882","url":"https://github.com/discourse/discourse/security/advisories/GHSA-vhm9-85gw-x335","publisher":"discourse","context":"The article cites Discourse’s advisory for its remote-code-execution rating and 8.8 severity score for the image-processing issue.","category":"advisory","primary":false}],"body":"\u003cp\u003eHacktron researchers said they used Anthropic’s Claude Opus 5 to chain two flaws and access the ChatGPT and Codex accounts of several OpenAI employees, eventually reaching an internal OpenAI GitHub repository. The work was conducted as security research: the team reported the flaws, created a single harmless pull request to demonstrate access, and said it did not read source code, merge changes, ship anything, or access customer data. OpenAI reportedly fixed its side of the issue about 14 hours after the report and paid Hacktron a $6,500 bounty on September 1.\u003c/p\u003e\n\n\u003cp\u003eThe chain began with OpenAI’s public Discourse forum, where a crafted HEIC or HEIF image could exploit memory flaws in the libheif image-processing library used through ImageMagick. Hacktron said it used the leaked memory to overcome a standard memory-randomization defense and achieve control of the forum server, then abused the shared “Sign in with OpenAI” system to take over staff accounts without employee interaction. The case highlights that compromise of a lower-trust public service can potentially extend to connected internal services, including code repositories, chat, and email, when they share the same login system.\u003c/p\u003e\n"},{"n":1,"title":"BragJack attacks hijack AI browser agents through malicious extensions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bragjack-attacks-hijack-ai-browser-agents-through-malicious-extensions/","time":"14:56","priority":"SHOULD READ","score":84,"tldr":"Researchers demonstrated BragJack, a technique in which a malicious Chromium extension can hijack built-in AI browser agents and abuse their privileges to read sensitive data or act on a user’s behalf. Google and Microsoft have patched assigned flaws, but the findings affect multiple AI-enabled browsers and underscore the risks of installing broad-permission extensions.","briefOverview":"\u003cp\u003eSecurity researcher Gal Weizman of Forever Security disclosed BragJack, a proof-of-concept technique that uses a malicious browser extension to hijack AI assistants in Google Chrome, Perplexity Comet, Microsoft Edge, Opera Neon, and Claude for Chrome. The extension must already be installed, but can then operate without user interaction and use the AI agent’s existing privileges to access sensitive information or act for the victim. The research earned more than $20,000 in bug bounties and resulted in two CVEs, with Google and Microsoft resolving the flaws assigned to them.\u003c/p\u003e\n\n\u003cp\u003eBragJack uses Chromium’s declarativeNetRequest feature to alter web requests and pages trusted by privileged browser components that carry out AI-directed actions. In demonstrations, the resulting access could include local files, browsing history, screenshots, web content, and potentially a browser’s camera and microphone; the Comet agent was also forced to summarize a victim’s emails and send the results elsewhere. Weizman calls the approach Prompt Forcing because it provides an agent with complete prompts and follow-up instructions rather than placing malicious instructions inside content the AI reads. The findings show how an extension that traditionally accesses web content can become a route to AI features able to read data and act on websites for a user.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Gal Weizman disclosed BragJack, a proof-of-concept technique that uses one malicious browser extension to hijack AI assistants in five Chromium-based browsers or browser assistants.","The attack requires the malicious extension to already be installed, after which it can operate without user interaction and abuse the AI agent’s existing privileges to access sensitive information or act on the victim’s behalf.","The technique uses Chromium’s declarativeNetRequest capability to manipulate network traffic and pages trusted by privileged browser AI components.","Weizman demonstrated that compromised agents could access browsing history, screenshots, local files, and web content, while the Perplexity Comet agent was forced to summarize a victim’s emails and send the results to another address.","Google assigned CVE-2026-0628 to the Chrome issue and Microsoft assigned CVE-2026-55945 to an Edge race condition, and both vendors have resolved their assigned flaws."],"insights":["BragJack does not rely on hiding instructions inside content an AI happens to read; it can supply the agent with a complete prompt and follow-up instructions, a method the researcher calls Prompt Forcing.","Chromium’s declarativeNetRequest feature allowed the same malicious extension to be used across all five targets by altering request handling, including security headers and resource redirects.","Chrome blocked extensions from directly accessing its privileged AI component and injecting scripts into Gemini, but intercepting requests from the embedded Gemini web app still provided a route to execute code in its context.","In Perplexity Comet, a testing domain that lacked the main Perplexity site’s protections created a trust path to the built-in agent, while Edge’s separation of planning and action modes was bypassed through a timing flaw."],"referencedReports":[{"title":"BragJack: Hijacking 5 Browsers via Built-in AI Assistants","url":"https://forever.security/blog/bragjack-hijacking-5-browsers-via-built-in-ai-assistants/","publisher":"forever-security","context":"The article cites Gal Weizman's writeup describing the BragJack attacks and their browser AI \"brain\" and privileged \"body\" model.","category":"research","primary":true},{"title":"BragJack Attack Hijacks Every Browser Agent","url":"https://forever.security/blog/bragjack-attack-hijacks-every-browser-agent","publisher":"forever-security","context":"The article describes this as Weizman's full technical breakdown covering all five demonstrated attacks.","category":"research","primary":true},{"title":"Claude for Chrome Extension Bypass","url":"https://www.manifold.security/blog/claude-for-chrome-extension-bypass","publisher":"manifold-security","context":"The article links to a related report on Claude for Chrome accepting synthetic clicks for built-in AI workflows without confirming real user interaction.","category":"research","primary":false},{"title":"ClaudeBleed","url":"https://archive.li/Qguxu","publisher":"layerx","context":"The article references LayerX's earlier disclosure that Claude for Chrome trusted the claude.ai origin rather than validating the script driving it.","category":"research","primary":false}],"body":"\u003cp\u003eSecurity researcher Gal Weizman of Forever Security disclosed BragJack, a proof-of-concept technique that uses a malicious browser extension to hijack AI assistants in Google Chrome, Perplexity Comet, Microsoft Edge, Opera Neon, and Claude for Chrome. The extension must already be installed, but can then operate without user interaction and use the AI agent’s existing privileges to access sensitive information or act for the victim. The research earned more than $20,000 in bug bounties and resulted in two CVEs, with Google and Microsoft resolving the flaws assigned to them.\u003c/p\u003e\n\n\u003cp\u003eBragJack uses Chromium’s declarativeNetRequest feature to alter web requests and pages trusted by privileged browser components that carry out AI-directed actions. In demonstrations, the resulting access could include local files, browsing history, screenshots, web content, and potentially a browser’s camera and microphone; the Comet agent was also forced to summarize a victim’s emails and send the results elsewhere. Weizman calls the approach Prompt Forcing because it provides an agent with complete prompts and follow-up instructions rather than placing malicious instructions inside content the AI reads. The findings show how an extension that traditionally accesses web content can become a route to AI features able to read data and act on websites for a user.\u003c/p\u003e\n"},{"n":7,"title":"CrowdSec Says TanStack npm Attack Led to Copy of 170 Private GitHub Repositories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/crowdsec-says-tanstack-npm-attack-led.html","time":"07:14","priority":"SHOULD READ","score":84,"tldr":"CrowdSec says a former employee’s GitHub OAuth token, stolen through the TanStack npm supply-chain compromise, was used to copy roughly 170 private repositories. The leak exposed private source code plus 83 user email addresses and details of 51 potential investors, though CrowdSec says production infrastructure and databases were not accessed.","briefOverview":"\u003cp\u003eCrowdSec said an attacker used a former employee’s GitHub OAuth token on May 22 to copy about 170 private GitHub repositories. The company said the employee’s laptop had been compromised through malicious TanStack npm package versions involved in a May supply-chain incident tracked as CVE-2026-45321. CrowdSec had left the employee’s GitHub access active so he could finish work, but removed the account from its GitHub organization on May 25.\u003c/p\u003e\n\n\u003cp\u003eThe copied code appeared on an online forum on September 16 and included CrowdSec’s web console, data science scripts and models, automation scripts, and its blocklist consensus algorithm. The archive also contained email addresses for 83 CrowdSec users and names, email addresses, and investment context for 51 potential investors. CrowdSec said its infrastructure and databases were not accessed, no code was changed, and the only usable exposed credential was limited to publishing messages to one AWS SNS topic; it rotated exposed credentials and now uses endpoint protection on relevant staff laptops.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdSec said an attacker used a former employee’s GitHub OAuth token on May 22 to copy about 170 private GitHub repositories.","CrowdSec attributed the stolen access to malicious TanStack npm package versions published on May 11, which were designed to collect credentials from developers’ machines.","The archive posted online on September 16 included private CrowdSec code, email addresses for 83 CrowdSec users, and names, email addresses, and investment context for 51 potential investors.","CrowdSec said its infrastructure and databases were not accessed, no code was changed, and the copied code was nearly four months old.","CrowdSec rotated exposed credentials on September 16 and 17 and now uses endpoint protection software on laptops used by staff working with code or systems."],"insights":["Keeping a departing employee’s GitHub access active to complete work created a window in which a stolen token could be used to copy private repositories.","CrowdSec did not learn of the public leak until months after the repositories were copied, and the token was no longer available when it investigated.","The exposed private code revealed previously nonpublic thresholds used to decide when IP addresses are added to CrowdSec’s shared blocklists, although the company says poisoning those lists would still require many detections from trusted systems on separate networks.","CrowdSec’s initial public statement said no names, organizations, or other client data had leaked, but its later report acknowledged exposure of 83 user email addresses and investor information for 51 people.","The company said the only credential still usable from the archive was limited to publishing messages to one AWS SNS topic, and an attempted use on August 17 did not progress further."],"referencedReports":[{"title":"TanStack Supply Chain Attack Analysis","url":"https://www.crowdsec.net/blog/tanstack-supply-chain-attack-analysis","publisher":"crowdsec","context":"CrowdSec’s report describes the repository copy, the exposed information, and the company’s attribution of the stolen token to the TanStack npm compromise.","category":"research","primary":true},{"title":"TanStack Router Security Advisory GHSA-g7cv-rxg3-hmpx","url":"https://github.com/TanStack/router/security/advisories/GHSA-g7cv-rxg3-hmpx","publisher":"tanstack","context":"The article cites TanStack’s advisory for details that malicious package versions collected GitHub tokens, SSH keys, and cloud credentials.","category":"advisory","primary":false},{"title":"MAI-2026-002","url":"https://docs.mistral.ai/resources/security-advisories/MAI-2026-002","publisher":"mistral-ai","context":"The article cites Mistral AI’s security advisory as another example of the TanStack compromise affecting a developer device.","category":"advisory","primary":false}],"body":"\u003cp\u003eCrowdSec said an attacker used a former employee’s GitHub OAuth token on May 22 to copy about 170 private GitHub repositories. The company said the employee’s laptop had been compromised through malicious TanStack npm package versions involved in a May supply-chain incident tracked as CVE-2026-45321. CrowdSec had left the employee’s GitHub access active so he could finish work, but removed the account from its GitHub organization on May 25.\u003c/p\u003e\n\n\u003cp\u003eThe copied code appeared on an online forum on September 16 and included CrowdSec’s web console, data science scripts and models, automation scripts, and its blocklist consensus algorithm. The archive also contained email addresses for 83 CrowdSec users and names, email addresses, and investment context for 51 potential investors. CrowdSec said its infrastructure and databases were not accessed, no code was changed, and the only usable exposed credential was limited to publishing messages to one AWS SNS topic; it rotated exposed credentials and now uses endpoint protection on relevant staff laptops.\u003c/p\u003e\n"},{"n":10,"title":"SolarWinds Patches ARM Hard-Coded Key Flaw Enabling Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/solarwinds-patches-arm-hard-coded-key.html","time":"09:31","priority":"SHOULD READ","score":82,"tldr":"SolarWinds patched a high-severity Access Rights Manager flaw, CVE-2026-28326, in version 2026.2.1 that could allow unauthenticated remote code execution because of a hard-coded static key.","briefOverview":"\u003cp\u003eSolarWinds released a security update for a high-severity vulnerability in Access Rights Manager (ARM), tracked as CVE-2026-28326. The flaw has a CVSS score of 8.8 and affects ARM version 2026.2 and earlier. SolarWinds said the issue could allow an unauthenticated attacker to execute code remotely.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from a hard-coded static key and was reported by Armadin researcher Kai Huang. It is fixed in Access Rights Manager 2026.2.1, and SolarWinds did not state that the flaw had been exploited in the wild. The company also recently addressed Web Help Desk flaws involving a SAML authentication bypass and a server-crashing memory issue, as well as 16 Serv-U vulnerabilities that could enable privilege escalation, remote code execution, or administrator-account creation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SolarWinds patched CVE-2026-28326, a high-severity flaw in Access Rights Manager that could allow unauthenticated remote code execution.","The flaw affects Access Rights Manager 2026.2 and earlier and stems from a hard-coded static key.","SolarWinds fixed the issue in Access Rights Manager version 2026.2.1 and said it has no indication that the flaw has been exploited in the wild.","Kai Huang, a security researcher at Armadin, discovered and reported the vulnerability.","SolarWinds also recently fixed critical and high-severity issues affecting Web Help Desk and Serv-U."],"insights":["The Access Rights Manager issue requires no login, making it more serious for organizations that have affected systems exposed to potential attackers.","SolarWinds’ recent fixes span three products—Access Rights Manager, Web Help Desk, and Serv-U—and include risks ranging from service crashes to authentication bypasses, administrator-account creation, privilege escalation, and remote code execution.","The article states that SolarWinds has not reported evidence of CVE-2026-28326 being exploited in the wild."],"referencedReports":[{"title":"CVE-2026-28326 Security Advisory","url":"https://www.solarwinds.com/trust-center/security-advisories/cve-2026-28326","publisher":"SolarWinds","context":"The article cites SolarWinds' advisory describing the hard-coded static key issue in Access Rights Manager.","category":"advisory","primary":true}],"body":"\u003cp\u003eSolarWinds released a security update for a high-severity vulnerability in Access Rights Manager (ARM), tracked as CVE-2026-28326. The flaw has a CVSS score of 8.8 and affects ARM version 2026.2 and earlier. SolarWinds said the issue could allow an unauthenticated attacker to execute code remotely.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from a hard-coded static key and was reported by Armadin researcher Kai Huang. It is fixed in Access Rights Manager 2026.2.1, and SolarWinds did not state that the flaw had been exploited in the wild. The company also recently addressed Web Help Desk flaws involving a SAML authentication bypass and a server-crashing memory issue, as well as 16 Serv-U vulnerabilities that could enable privilege escalation, remote code execution, or administrator-account creation.\u003c/p\u003e\n"},{"n":2,"title":"ShinyHunters hacks Clop leak site, threatens to extort ransomware gang","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/","time":"13:48","priority":"SHOULD READ","score":78,"tldr":"ShinyHunters allegedly breached and defaced Clop’s Tor leak site through an unauthenticated Grav CMS file-upload flaw, claiming to have stolen server data and the onion service’s private keys. The group says it plans to extort the ransomware gang amid an ongoing feud.","briefOverview":"\u003cp\u003eShinyHunters claims it breached and defaced the Clop ransomware operation’s Tor-based data leak site after exploiting what it described as an unauthenticated file-upload vulnerability in Grav CMS. BleepingComputer confirmed that a ShinyHunters message file was uploaded to Clop’s server and that the site was later replaced with ShinyHunters-branded Umbreon artwork. The message warned Clop not to threaten the group and linked to ShinyHunters’ own leak site.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters says it gained full access to the server and stole source code, Grav CMS plugins, system logs, and private keys used for Clop’s onion service, though BleepingComputer did not independently verify those claims. If the claimed onion-service keys are valid, ShinyHunters could host a site at Clop’s existing onion address from infrastructure it controls. The group says it intends to extort Clop and plans to give it 72 hours to make contact, describing the breach as retaliation in an ongoing dispute tied to Clop’s Oracle E-Business Suite data-theft campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters allegedly exploited an unauthenticated file-upload flaw in Grav CMS to upload a message and later deface Clop’s Tor-based data leak site.","BleepingComputer independently confirmed that the uploaded file was accessible from Clop’s site and that the site was replaced with ShinyHunters-branded artwork.","ShinyHunters claims it obtained full server access and stole source code, Grav CMS plugins, system logs, and private keys for Clop’s onion service, but these claims have not been independently verified.","ShinyHunters says it intends to extort Clop and give the ransomware group 72 hours to make contact.","The group describes the intrusion as retaliation for alleged threats from a Clop representative tied to a dispute over Clop’s 2025 Oracle E-Business Suite data-theft campaign."],"insights":["If ShinyHunters’ claim about obtaining Clop’s onion-service private keys is valid, it could operate a site at Clop’s existing hidden-service address even after Clop removes it from the compromised server.","The alleged theft of files under /var/log could include records of system activity, authentication events, and potentially the IP addresses of people who connected to the server.","BleepingComputer verified the public defacement and uploaded file, but not the claimed theft of source code, logs, or onion-service keys, highlighting a clear distinction between confirmed and unconfirmed aspects of the incident.","The dispute illustrates that a leak site used by an extortion group can itself become a target for defacement, data theft, and extortion by another criminal group."],"referencedReports":[],"body":"\u003cp\u003eShinyHunters claims it breached and defaced the Clop ransomware operation’s Tor-based data leak site after exploiting what it described as an unauthenticated file-upload vulnerability in Grav CMS. BleepingComputer confirmed that a ShinyHunters message file was uploaded to Clop’s server and that the site was later replaced with ShinyHunters-branded Umbreon artwork. The message warned Clop not to threaten the group and linked to ShinyHunters’ own leak site.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters says it gained full access to the server and stole source code, Grav CMS plugins, system logs, and private keys used for Clop’s onion service, though BleepingComputer did not independently verify those claims. If the claimed onion-service keys are valid, ShinyHunters could host a site at Clop’s existing onion address from infrastructure it controls. The group says it intends to extort Clop and plans to give it 72 hours to make contact, describing the breach as retaliation in an ongoing dispute tied to Clop’s Oracle E-Business Suite data-theft campaign.\u003c/p\u003e\n"},{"n":12,"title":"Google Gemini Broke Into Real Company Systems After Security Test Domain Mix-Up","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/google-gemini-broke-into-real-company.html","time":"07:51","priority":"SHOULD READ","score":78,"tldr":"During an Irregular security evaluation, Google’s Gemini accessed real company systems after a fictional CTF domain accidentally matched a live domain, using password guessing and publicly exposed credentials. Gemini reportedly stopped after detecting the systems were real, and the issue was remediated.","briefOverview":"\u003cp\u003eGoogle’s Gemini model accessed real company systems during a May 2026 cybersecurity evaluation run by Israeli company Irregular. The test used a fictional company name for a capture-the-flag exercise, but a naming error caused it to match a real internet domain. Irregular notified Google in July 2026, and said the issue had been addressed weeks earlier.\u003c/p\u003e\n\n\u003cp\u003eIn one case, Gemini accessed a protected system by repeatedly guessing its password; in two others, it found credentials in a public repository. The model stopped its activity after determining that it had entered real company systems, and Google said this showed its safety mechanisms worked as intended rather than demonstrating model misalignment. The unnamed companies were affected only a limited number of times, but the event adds to scrutiny of AI agents after reported incidents involving OpenAI, Anthropic, Meta, and Hugging Face.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["During a May 2026 security evaluation conducted by Israeli company Irregular, Google’s Gemini accessed real company systems after a fictional capture-the-flag test domain matched a real domain.","Gemini gained access in one case by repeatedly guessing a password and in two other cases by finding credentials in a public repository.","The model ended the intrusions after determining that it had accessed real company systems, according to the report.","Irregular notified Google in July 2026, and said the underlying domain-naming issue was addressed weeks before the report.","The article links the incident to broader scrutiny of AI agents after similar reported cases involving OpenAI, Anthropic, Meta, and Hugging Face."],"insights":["A simple naming mistake in a simulated exercise was enough to redirect an AI model’s actions toward real internet systems, illustrating that test-environment isolation can depend on details as small as domain selection.","The reported access paths were not advanced software flaws: one involved repeated password guessing and two involved credentials available in a public repository.","Gemini reportedly halted after recognizing it had entered real company systems, which Google cited as evidence that its safety mechanisms operated as intended.","Irregular said the same domain-matching issue also applied to other reported AI-model incidents, indicating that a shared evaluation setup contributed to multiple events."],"referencedReports":[],"body":"\u003cp\u003eGoogle’s Gemini model accessed real company systems during a May 2026 cybersecurity evaluation run by Israeli company Irregular. The test used a fictional company name for a capture-the-flag exercise, but a naming error caused it to match a real internet domain. Irregular notified Google in July 2026, and said the issue had been addressed weeks earlier.\u003c/p\u003e\n\n\u003cp\u003eIn one case, Gemini accessed a protected system by repeatedly guessing its password; in two others, it found credentials in a public repository. The model stopped its activity after determining that it had entered real company systems, and Google said this showed its safety mechanisms worked as intended rather than demonstrating model misalignment. The unnamed companies were affected only a limited number of times, but the event adds to scrutiny of AI agents after reported incidents involving OpenAI, Anthropic, Meta, and Hugging Face.\u003c/p\u003e\n"},{"n":13,"title":"The Blank PDF That Signed Its Own Generator's Name","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/ato-tax-office-lure-pdf-carries-signed-provenance-manifest-naming-its-ai-generator","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonating a national tax authority used a seemingly blank PDF whose ordinary metadata was anonymous, but a hidden C2PA provenance manifest identified ChatGPT/gpt-5-5 and an OpenAI certificate chain. The incident shows that attachment triage should inspect signed provenance metadata as well as conventional PDF properties, especially when DMARC passes through DKIM-only shared-hosting mail.","briefOverview":"\u003cp\u003eA phishing email impersonating a national tax authority was sent to a senior advertising-operations lead at an international advertising group. The message used a one-page, 8,692-byte PDF that appeared harmless in ordinary checks: it had no JavaScript, links, automatic actions, or meaningful visible document properties. It falsely claimed the attachment was password protected and instructed the recipient to use “2026,” although the file was not encrypted.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained a compressed C2PA provenance manifest that recorded \u003ccode\u003ec2pa.created\u003c/code\u003e, classified the document as trained-algorithmic media, named \u003ccode\u003egpt-5-5\u003c/code\u003e and ChatGPT, and included an X.509 certificate chain whose leaf subject was OpenAI OpCo, LLC. The article states that the manifest was not cryptographically validated and was likely invalidated when the file was re-saved 25 days after signing, but its readable generator information remained embedded because it was not stripped. The email passed DMARC through aligned DKIM from an unrelated shared-hosting sender domain with no SPF record, while its only download link redirected to an attacker-controlled \u003ccode\u003e.info\u003c/code\u003e domain behind a bot-verification interstitial.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email impersonating a national tax authority targeted a senior advertising-operations lead at an international advertising group and used a one-page PDF attachment.","The 8,692-byte PDF had no JavaScript, links, automatic actions, or meaningful visible document properties, but contained a compressed C2PA provenance manifest.","The manifest recorded a c2pa.created action, classified the file as trained-algorithmic media, named gpt-5-5 and ChatGPT, and contained a certificate chain with a leaf subject of OpenAI OpCo, LLC.","The article states that the provenance manifest was not cryptographically validated and was likely tampered after the PDF was re-saved 25 days after its recorded signing time.","The message passed DMARC through aligned DKIM despite having no SPF record, while its only Download PDF link redirected toward an attacker-controlled .info domain behind a bot-verification interstitial."],"insights":["The PDF’s ordinary metadata was anonymous and untitled, while its compressed provenance data retained generator details, showing that visible file properties can be far less informative than embedded provenance records.","The provenance record was likely no longer valid after the file was re-saved, but its readable contents remained in the document because the manifest was not stripped.","The attachment’s claims contradicted observable facts: it said the PDF was password protected and contained a sharing link, yet the file was unencrypted and contained no such link.","The email passed DMARC not because it represented the impersonated tax authority, but because the unrelated sending domain had aligned DKIM and a DMARC policy of p=NONE despite publishing no SPF record.","The article recommends hunting for inbound messages that pass DMARC with spf=none, a narrower signal than broadly investigating all authentication failures."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for its figures on the human element in breaches and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA's guidance to support verifying a sender's claims rather than judging a document by appearance.","category":"guide","primary":false}],"body":"\u003cp\u003eA phishing email impersonating a national tax authority was sent to a senior advertising-operations lead at an international advertising group. The message used a one-page, 8,692-byte PDF that appeared harmless in ordinary checks: it had no JavaScript, links, automatic actions, or meaningful visible document properties. It falsely claimed the attachment was password protected and instructed the recipient to use “2026,” although the file was not encrypted.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained a compressed C2PA provenance manifest that recorded \u003ccode\u003ec2pa.created\u003c/code\u003e, classified the document as trained-algorithmic media, named \u003ccode\u003egpt-5-5\u003c/code\u003e and ChatGPT, and included an X.509 certificate chain whose leaf subject was OpenAI OpCo, LLC. The article states that the manifest was not cryptographically validated and was likely invalidated when the file was re-saved 25 days after signing, but its readable generator information remained embedded because it was not stripped. The email passed DMARC through aligned DKIM from an unrelated shared-hosting sender domain with no SPF record, while its only download link redirected to an attacker-controlled \u003ccode\u003e.info\u003c/code\u003e domain behind a bot-verification interstitial.\u003c/p\u003e\n"},{"n":3,"title":"Viral AI actress' hotline face-scans every caller, watches their mood","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/viral-ai-actress-hotline-face-scans-every-caller-watches-their-mood/","time":"11:38","priority":"MAY READ","score":68,"tldr":"Talking Tilly, the video-call service for AI actress Tilly Norwood, requires a facial age check and continuously analyzes callers’ video and voice to infer mood, with recordings and transcripts processed by third parties. The service’s worldwide biometric gate and non-optional emotion analysis highlight expanding privacy implications of UK-driven age-assurance rules.","briefOverview":"\u003cp\u003eTalking Tilly, a video-call service operated by Xicoia for AI character Tilly Norwood, requires first-time callers to complete an automated age check using a video selfie analyzed by Spain-based provider Didit. If the estimate is unclear, users must upload government photo ID. Xicoia says selfies and ID images are not retained after verification, while it keeps an approximate age band and reference number.\u003c/p\u003e\n\n\u003cp\u003eDuring every call, the service analyzes the caller’s camera feed and tone of voice to infer their emotional state, and this feature cannot be disabled for an individual call. Calls are recorded, transcribed, and processed live by U.S. providers, with transcripts retained for up to eight weeks and recordings deleted after 24 hours. The service applies its age check worldwide, and the article notes that the requirement was added amid UK rules requiring age assurance for certain online services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Talking Tilly requires all first-time callers to complete an automated age check using a video selfie analyzed by Didit, with a government photo ID as a fallback if the result is unclear.","Xicoia says the age-check selfie is sent directly to Didit, is not retained after the check, and does not create a faceprint or biometric template; Xicoia retains an approximate age band and reference number.","During every Talking Tilly call, the service analyzes the caller’s camera feed and tone of voice to infer emotional state, and this processing cannot be disabled for an individual call.","Calls are recorded, transcribed, and processed live by U.S. providers, while transcripts can be retained for up to eight weeks and recordings are permanently deleted after 24 hours.","Talking Tilly offers five free minutes before charging for additional time and is scheduled to shut down permanently on September 27, when unused minutes will be forfeited."],"insights":["The service applies its age-verification requirement to callers worldwide, meaning a compliance measure tied to UK regulation affects users outside the UK as well.","Mood analysis is mandatory for each call and relies on the company’s stated “legitimate interests” legal basis rather than user consent.","The automated transcript safety classifier incorrectly withheld one ordinary weather-and-news conversation for alleged hateful or abusive language; Xicoia later confirmed it was a false positive.","Although recordings are deleted after 24 hours, transcripts may remain for up to eight weeks and the character’s saved conversation memory can persist until a user requests deletion.","Paid minutes are unusually time-limited: any unused minutes expire when the service permanently closes on September 27."],"referencedReports":[],"body":"\u003cp\u003eTalking Tilly, a video-call service operated by Xicoia for AI character Tilly Norwood, requires first-time callers to complete an automated age check using a video selfie analyzed by Spain-based provider Didit. If the estimate is unclear, users must upload government photo ID. Xicoia says selfies and ID images are not retained after verification, while it keeps an approximate age band and reference number.\u003c/p\u003e\n\n\u003cp\u003eDuring every call, the service analyzes the caller’s camera feed and tone of voice to infer their emotional state, and this feature cannot be disabled for an individual call. Calls are recorded, transcribed, and processed live by U.S. providers, with transcripts retained for up to eight weeks and recordings deleted after 24 hours. The service applies its age check worldwide, and the article notes that the requirement was added amid UK rules requiring age assurance for certain online services.\u003c/p\u003e\n"},{"n":4,"title":"Calling viral AI actress Tilly Norwood? Agree to a face scan first","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/calling-viral-ai-actress-tilly-norwood-agree-to-a-face-scan-first/","time":"11:38","priority":"MAY READ","score":64,"tldr":"Talking Tilly, the video-call service for viral AI character Tilly Norwood, requires users worldwide to complete facial age verification and continuously analyzes their video and voice for emotional cues. Calls are recorded and transcribed, with data processed by third parties and retained for limited periods, highlighting the privacy impact of UK-driven age-assurance rules.","briefOverview":"\u003cp\u003eTalking Tilly, a video-call service for AI character Tilly Norwood, requires every caller to complete an automated age check before their first call. The check uses a video selfie analyzed by Spain-based identity-verification provider Didit, with government photo ID required if the age estimate is unclear. Xicoia, the UK company behind Tilly, says selfies and ID images are not retained after the check and that no biometric template is created.\u003c/p\u003e\n\n\u003cp\u003eThe service also analyzes callers\u0026rsquo; camera feeds and tone of voice during calls to infer their emotional state, a feature that cannot be turned off for individual calls. Calls are recorded, transcribed, and processed live by U.S. providers, while transcripts may be kept for up to eight weeks and conversational memory can be deleted on request. The article notes that UK regulatory changes appear to have driven a worldwide face-scan requirement, so callers outside the UK are also subject to the age gate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Talking Tilly requires all callers to complete an automated age check using a video selfie, with government photo ID as a fallback when the age estimate is unclear.","Xicoia says the age-check selfie is sent directly to Didit, is not retained after the check, and does not produce a stored biometric template.","During calls, Talking Tilly analyzes users' camera feeds and tone of voice to infer emotional state, and this processing cannot be disabled for an individual call.","Calls are recorded, transcribed, and processed live by U.S. providers; transcripts can be retained for up to eight weeks, while recordings are permanently deleted after 24 hours.","The service gives users five free minutes before charging for additional time and is scheduled to permanently shut down on September 27, with unused minutes forfeited."],"insights":["A UK-focused regulatory response has resulted in mandatory facial age checks for all Talking Tilly callers worldwide, including users outside the UK.","Talking Tilly relies on \"legitimate interests,\" rather than user consent, as the stated legal basis for both facial age estimation and emotion analysis during calls.","The service's automated abuse classifier withheld one otherwise ordinary weather-and-news conversation for alleged hateful or abusive language, demonstrating that incorrect flags can restrict access to recordings.","Although call recordings are deleted after 24 hours, transcripts may be retained for up to eight weeks and the character can retain conversational memory until a user requests its deletion."],"referencedReports":[],"body":"\u003cp\u003eTalking Tilly, a video-call service for AI character Tilly Norwood, requires every caller to complete an automated age check before their first call. The check uses a video selfie analyzed by Spain-based identity-verification provider Didit, with government photo ID required if the age estimate is unclear. Xicoia, the UK company behind Tilly, says selfies and ID images are not retained after the check and that no biometric template is created.\u003c/p\u003e\n\n\u003cp\u003eThe service also analyzes callers\u0026rsquo; camera feeds and tone of voice during calls to infer their emotional state, a feature that cannot be turned off for individual calls. Calls are recorded, transcribed, and processed live by U.S. providers, while transcripts may be kept for up to eight weeks and conversational memory can be deleted on request. The article notes that UK regulatory changes appear to have driven a worldwide face-scan requirement, so callers outside the UK are also subject to the age gate.\u003c/p\u003e\n"},{"n":11,"title":"Identity Visibility in 2026: The Foundation of Identity Security","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/identity-visibility-in-2026-foundation.html","time":"13:28","priority":"MAY READ","score":42,"tldr":"Identity visibility requires continuous, cross-environment discovery and mapping of human and non-human identities, their effective permissions, and their real runtime behavior—not just IAM configuration. Organizations should prioritize high-risk unowned, dormant, overprivileged, and unrotated credentials while integrating visibility with IAM, IGA, PAM, and security operations.","briefOverview":"\u003cp\u003eIdentity visibility is the ability to continuously identify every human and non-human account in an environment, map what it can access, and observe how that access is used. The article argues that traditional identity and access management reporting often shows only configured roles and group memberships, leaving hidden application-local accounts, embedded credentials, and legacy authentication methods outside central oversight. This gap matters because stolen or misused legitimate credentials can appear to be normal activity while being used to access systems within their existing permissions.\u003c/p\u003e\n\n\u003cp\u003eCloud providers and SaaS applications use different identity and permission models, making it necessary to normalize access data and trace effective permissions across trust relationships, nested groups, and cross-account access. The article highlights higher-risk examples such as unowned service accounts with production write access, administrative accounts without multi-factor authentication, unrotated credentials, and dormant accounts belonging to former staff. It recommends a phased program that starts with critical applications and cloud accounts, directly discovers identities and entitlements, assigns ownership, monitors behavior, and creates compliance evidence from live telemetry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Identity visibility combines an inventory of identities, maps of their permissions, and records of how access is used to show what identities can access and what they actually do.","Traditional IAM reporting often shows configured group memberships and roles but may not reveal local application accounts, embedded credentials, unused permissions, or applications that were never integrated with central identity systems.","Cloud and SaaS platforms use different permission models, so organizations need to normalize identity data to trace access relationships such as federated trust and cross-account role use across environments.","Non-human identities, including service accounts, API keys, and automation credentials, should have a named owner, a stated purpose, an expiration or rotation schedule, and active monitoring.","A phased identity visibility program starts with high-impact applications and cloud accounts, then uses direct discovery, effective-access mapping, ownership assignment, behavioral monitoring, and automated compliance evidence."],"insights":["A central IAM or governance report can create a false sense of coverage because an application that was never connected to it may be absent from the report rather than compliant.","Effective access can exceed an assigned role when nested groups, shared service accounts, or trust relationships create indirect paths to administrative capability.","Cloud lateral movement can follow identity trust relationships, such as federated trust and cross-account role assumption, rather than network paths.","Control-plane automation credentials are especially consequential because a compromised credential can create access, change logging settings, or disable detection controls.","Discovery should be paired with remediation routing and ownership assignment, because generating large volumes of findings without a path to fix them can cause alert fatigue."],"referencedReports":[{"title":"NIST SP 800-207: Zero Trust Architecture","url":"https://csrc.nist.gov/pubs/sp/800/207/final","publisher":"national-institute-of-standards-and-technology","context":"The article cites this publication to describe zero trust as requiring continuous verification.","category":"guide","primary":false}],"body":"\u003cp\u003eIdentity visibility is the ability to continuously identify every human and non-human account in an environment, map what it can access, and observe how that access is used. The article argues that traditional identity and access management reporting often shows only configured roles and group memberships, leaving hidden application-local accounts, embedded credentials, and legacy authentication methods outside central oversight. This gap matters because stolen or misused legitimate credentials can appear to be normal activity while being used to access systems within their existing permissions.\u003c/p\u003e\n\n\u003cp\u003eCloud providers and SaaS applications use different identity and permission models, making it necessary to normalize access data and trace effective permissions across trust relationships, nested groups, and cross-account access. The article highlights higher-risk examples such as unowned service accounts with production write access, administrative accounts without multi-factor authentication, unrotated credentials, and dormant accounts belonging to former staff. It recommends a phased program that starts with critical applications and cloud accounts, directly discovers identities and entitlements, assigns ownership, monitors behavior, and creates compliance evidence from live telemetry.\u003c/p\u003e\n"}]</script>
