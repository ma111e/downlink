<script type="application/json" id="dl-articles">[{"n":1,"title":"Citrix warns admins to patch new NetScaler RCE flaw immediately","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/citrix-warns-admins-to-patch-new-netscaler-rce-flaw-immediately/","time":"08:27","priority":"MUST READ","score":92,"tldr":"Citrix urges immediate patching of CVE-2026-107406, a critical NetScaler ADC and Gateway SAML memory-overflow flaw that can enable remote code execution or denial of service. No active exploitation is known yet, but exposed and SAML-configured appliances should be upgraded to the recommended fixed releases immediately.","briefOverview":"\u003cp\u003eCitrix has urged administrators to immediately patch CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC appliances and NetScaler Gateway remote-access solutions. An attacker could use the flaw to run code remotely on a targeted device or cause it to crash. Citrix said it was not aware of any unmitigated exploitation when it published its bulletin.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler ADC and Gateway systems configured as a SAML identity provider or service provider. Citrix advised upgrading affected appliances to fixed 14.1, 13.1, FIPS, or NDcPP releases, including version 14.1-73.46 or later for standard 14.1 deployments and 13.1-64.29 or later for standard 13.1 deployments. Shadowserver tracks more than 21,000 internet-exposed IP addresses with NetScaler fingerprints, though the article says it is unknown how many are patched, are honeypots, or use a vulnerable configuration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix urged customers to immediately patch CVE-2026-107406, a critical memory-overflow flaw in NetScaler ADC and NetScaler Gateway that can enable remote code execution or cause denial of service.","The flaw affects NetScaler ADC and Gateway appliances only when they are configured as a SAML identity provider or service provider.","Citrix recommended upgrading affected systems to NetScaler ADC and Gateway 14.1-73.46 or later, 13.1-64.29 or later, and the corresponding fixed FIPS and NDcPP releases.","Citrix said it was not aware of any unmitigated exploitation of CVE-2026-107406 when its bulletin was published.","Shadowserver tracks more than 21,000 internet-exposed IP addresses with NetScaler fingerprints, although it is unknown how many are vulnerable or already patched."],"insights":["Exposure is configuration-dependent: the flaw applies only to NetScaler ADC and Gateway appliances configured to act in the SAML sign-in process, so organizations can prioritize reviewing those deployments.","Citrix had not identified unmitigated exploitation when it published the bulletin, but the article notes that attackers began abusing two previously disclosed NetScaler flaws only days after Citrix urged customers to patch them.","The number of internet-visible NetScaler systems does not directly indicate the number at risk, because the article says it is unknown how many are honeypots, already patched, or using a vulnerable configuration.","The urgency is reinforced by Citrix’s recent history: other NetScaler zero-days were used to deploy web shells and tunneling malware, steal credentials, obtain root access, and move into internal networks."],"referencedReports":[{"title":"CVE-2026-107406 Security Bulletin","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697191","publisher":"citrix","context":"Citrix's advisory identifies the affected NetScaler products, configuration requirement, and fixed versions for CVE-2026-107406.","category":"advisory","primary":true}],"body":"\u003cp\u003eCitrix has urged administrators to immediately patch CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC appliances and NetScaler Gateway remote-access solutions. An attacker could use the flaw to run code remotely on a targeted device or cause it to crash. Citrix said it was not aware of any unmitigated exploitation when it published its bulletin.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler ADC and Gateway systems configured as a SAML identity provider or service provider. Citrix advised upgrading affected appliances to fixed 14.1, 13.1, FIPS, or NDcPP releases, including version 14.1-73.46 or later for standard 14.1 deployments and 13.1-64.29 or later for standard 13.1 deployments. Shadowserver tracks more than 21,000 internet-exposed IP addresses with NetScaler fingerprints, though the article says it is unknown how many are patched, are honeypots, or use a vulnerable configuration.\u003c/p\u003e\n"},{"n":4,"title":"Citrix Patches Critical NetScaler Flaw That Could Enable RCE in SAML Deployments","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/citrix-patches-critical-netscaler-flaw.html","time":"08:11","priority":"MUST READ","score":92,"tldr":"Citrix patched CVE-2026-107406, a critical NetScaler ADC and Gateway memory-overflow flaw that can enable remote code execution or denial of service when SAML IdP or SP functionality is configured. Organizations should upgrade affected NetScaler appliances to the latest fixed releases; no active exploitation has been reported.","briefOverview":"\u003cp\u003eCitrix released patches for CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC and NetScaler Gateway. The vulnerability has a CVSS score of 9.5 and may allow remote code execution or denial of service under specific configuration conditions. Citrix said there is no evidence that the flaw has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler deployments configured as a SAML identity provider or service provider. Customers can check for relevant SAML configuration entries, including \u0026ldquo;add authentication samlAction\u0026rdquo; for SAML service-provider configurations and \u0026ldquo;add authentication samlIdPProfile\u0026rdquo; for identity-provider configurations. Secure Private Access Hybrid deployments using NetScaler instances are also affected.\u003c/p\u003e\n\n\u003cp\u003eCitrix addressed the flaw in NetScaler ADC and Gateway 14.1-73.46 and later, 13.1-64.29 and later, and corresponding fixed FIPS and NDcPP releases. The company recommends that affected customers upgrade their NetScaler instances to the recommended versions. The article also notes that three separate NetScaler ADC and Gateway flaws have recently been actively exploited in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released patches for CVE-2026-107406, a critical memory-overflow flaw in NetScaler ADC and NetScaler Gateway with a CVSS score of 9.5.","Under specific configurations, CVE-2026-107406 may allow remote code execution or denial of service.","The flaw affects NetScaler deployments configured as a SAML identity provider or service provider, including Secure Private Access Hybrid deployments that use NetScaler instances.","Citrix recommends upgrading to NetScaler ADC and Gateway 14.1-73.46 or later, 13.1-64.29 or later, or the corresponding fixed FIPS and NDcPP releases.","Citrix said there is no evidence that CVE-2026-107406 has been exploited in the wild."],"insights":["Exposure is configuration-dependent: NetScaler instances are affected only when configured as a SAML identity provider or service provider, which customers can check through specific SAML configuration entries.","The fixed releases skip beyond some affected version ranges, so organizations should upgrade to the explicitly recommended versions rather than relying on being near the upper end of an affected range.","Secure Private Access Hybrid deployments that use NetScaler instances are also affected and require upgrades to the recommended NetScaler versions.","Although Citrix reported no known exploitation of CVE-2026-107406, the article notes that three separate NetScaler flaws have recently been actively exploited in the wild."],"referencedReports":[{"title":"Citrix NetScaler ADC and Citrix NetScaler Gateway Security Bulletin for CVE-2026-107406","url":"https://support.citrix.com/external/article/CTX697191/citrix-netscaler-adc-and-citrix-netscale.html","publisher":"citrix","context":"The article cites Citrix's security bulletin for affected versions and the releases that fix CVE-2026-107406.","category":"advisory","primary":true},{"title":"Protecting Customers: Immediate Guidance for CVE-2026-107406 in NetScaler ADC and NetScaler Gateway","url":"https://community.citrix.com/techzone-blogs/110_security-updates/protecting-customers-immediate-guidance-for-cve-2026-107406-in-netscaler-adc-and-netscaler-gateway-r1631/","publisher":"citrix","context":"The article cites Citrix guidance stating that Secure Private Access Hybrid deployments using NetScaler instances are also affected and should be upgraded.","category":"advisory","primary":false}],"body":"\u003cp\u003eCitrix released patches for CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC and NetScaler Gateway. The vulnerability has a CVSS score of 9.5 and may allow remote code execution or denial of service under specific configuration conditions. Citrix said there is no evidence that the flaw has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler deployments configured as a SAML identity provider or service provider. Customers can check for relevant SAML configuration entries, including \u0026ldquo;add authentication samlAction\u0026rdquo; for SAML service-provider configurations and \u0026ldquo;add authentication samlIdPProfile\u0026rdquo; for identity-provider configurations. Secure Private Access Hybrid deployments using NetScaler instances are also affected.\u003c/p\u003e\n\n\u003cp\u003eCitrix addressed the flaw in NetScaler ADC and Gateway 14.1-73.46 and later, 13.1-64.29 and later, and corresponding fixed FIPS and NDcPP releases. The company recommends that affected customers upgrade their NetScaler instances to the recommended versions. The article also notes that three separate NetScaler ADC and Gateway flaws have recently been actively exploited in the wild.\u003c/p\u003e\n"},{"n":5,"title":"FBI Seizes 7 Domains, Disrupts Flax Typhoon Tools Used in Critical Infrastructure Intrusions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fbi-seizes-7-domains-disrupts-flax.html","time":"06:39","priority":"SHOULD READ","score":88,"tldr":"The FBI and DOJ seized seven domains used by China-linked Flax Typhoon and Integrity Technology Group to operate reconnaissance and spear-phishing tools targeting U.S. and foreign critical infrastructure. The action follows disruption of the group’s Raptor Train IoT botnet and highlights its continued use of large-scale scanning, botnets, and credential theft.","briefOverview":"\u003cp\u003eThe FBI and U.S. Department of Justice seized seven domains and blocked access to platforms allegedly used by China-linked Flax Typhoon to scan for weaknesses and, in some cases, infiltrate U.S. critical infrastructure. Flax Typhoon, also tracked as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which authorities say contracts with the Chinese government. The seized domains included c0cc[.]cc, 98aiblog[.]com, outlook3650[.]com, and linkedinns[.]net.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege that Integrity Technology Group operated the Raptor Train botnet using a Mirai variant and managed it through an application called Sparrow. A server associated with the botnet held records for more than 1.2 million infected devices as of June 5, 2024, including more than 385,000 unique U.S. devices, while more than 260,000 devices were actively infected. The group also allegedly used MicroScan, a tool with more than 1,300 penetration-testing scripts, and FishHub for spear-phishing, remote access, and collecting selected files from victim networks.\u003c/p\u003e\n\n\u003cp\u003eReported targets included a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power organizations, and Taiwanese universities. Authorities said the actors also used cross-site scripting for credential harvesting, SoftEther VPN clients for persistence, EBurst to target Microsoft 365 accounts, and office-cli to access mailbox data. A joint advisory from agencies in several countries said Integrity Technology Group enabled China-linked actors to target organizations worldwide by acquiring or developing cyber tools and compromising networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and U.S. Department of Justice seized seven domains used by China-linked Flax Typhoon to support vulnerability scanning, spear-phishing, and, in some cases, intrusions targeting critical infrastructure.","Flax Typhoon, also known as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which U.S. authorities say contracted with the Chinese government.","Integrity Technology Group allegedly operated the Raptor Train IoT botnet using a Mirai variant; as of June 5, 2024, records showed more than 1.2 million infected devices, including more than 385,000 unique U.S. devices.","The group’s MicroScan tool included more than 1,300 penetration-testing scripts and was used alongside other tools to identify weaknesses in networks and web applications.","Authorities said the group targeted organizations including a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power companies, and Taiwanese universities."],"insights":["Integrity Technology Group’s infrastructure reportedly tracked more than 1.2 million infected devices, including over 385,000 unique U.S. devices, showing the scale available to support its operations.","MicroScan was reportedly in use as early as 2017 and contained more than 1,300 scripts for checking specific software weaknesses, indicating a long-running and broad reconnaissance capability.","The article describes both automated scanning through botnets and hands-on methods such as credential harvesting and Microsoft 365 account brute-forcing, rather than reliance on a single intrusion method.","Although the Raptor Train botnet was disrupted in September 2024, authorities said related scanning infrastructure remained accessible through at least September 9, 2026.","FishHub-related activity was confirmed at 20 Taiwanese universities, where the tool could provide remote access or search for and send selected files to Integrity Technology Group-controlled servers."],"referencedReports":[{"title":"Joint Cybersecurity Advisory AA26-281A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-281a","publisher":"cisa and international cybersecurity and intelligence agencies","context":"The article cites a joint advisory from agencies in the United States, United Kingdom, Australia, Canada, Japan, New Zealand, and Spain that identifies Integrity Technology Group as enabling malicious cyber activity worldwide.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI and U.S. Department of Justice seized seven domains and blocked access to platforms allegedly used by China-linked Flax Typhoon to scan for weaknesses and, in some cases, infiltrate U.S. critical infrastructure. Flax Typhoon, also tracked as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which authorities say contracts with the Chinese government. The seized domains included c0cc[.]cc, 98aiblog[.]com, outlook3650[.]com, and linkedinns[.]net.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege that Integrity Technology Group operated the Raptor Train botnet using a Mirai variant and managed it through an application called Sparrow. A server associated with the botnet held records for more than 1.2 million infected devices as of June 5, 2024, including more than 385,000 unique U.S. devices, while more than 260,000 devices were actively infected. The group also allegedly used MicroScan, a tool with more than 1,300 penetration-testing scripts, and FishHub for spear-phishing, remote access, and collecting selected files from victim networks.\u003c/p\u003e\n\n\u003cp\u003eReported targets included a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power organizations, and Taiwanese universities. Authorities said the actors also used cross-site scripting for credential harvesting, SoftEther VPN clients for persistence, EBurst to target Microsoft 365 accounts, and office-cli to access mailbox data. A joint advisory from agencies in several countries said Integrity Technology Group enabled China-linked actors to target organizations worldwide by acquiring or developing cyber tools and compromising networks.\u003c/p\u003e\n"},{"n":2,"title":"Three Teams Demonstrate Remote Hacks of Fully Patched Google Pixel 10 at Pwn2Own","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/three-teams-demonstrate-remote-hacks-of.html","time":"08:26","priority":"SHOULD READ","score":82,"tldr":"Three teams remotely compromised fully patched Google Pixel 10 phones at Pwn2Own Ireland, earning a combined $562,500 and exposing flaws that Google will receive for patching. Technical details remain undisclosed during the vendor remediation period.","briefOverview":"\u003cp\u003eThree teams remotely compromised fully patched Google Pixel 10 phones at Pwn2Own Ireland on October 8. Xint received \u003cspan class=\"math inline\"\u003e\\(150,000 for an entry involving one previously known issue, Ikotas Labs earned the full \\)\u003c/span\u003e300,000 prize for a chain of issues, and Dimitrios Valsamaras, Ken Gannon, and Tenia Valsamara received \u003cspan class=\"math inline\"\u003e\\(112,500 for a two-issue chain. Together, the three Pixel 10 wins paid \\)\u003c/span\u003e562,500. Ikotas Labs was also named Master of Pwn after four wins totaling $361,000 and 42.5 points.\u003c/p\u003e\n\n\u003cp\u003eThe contest classified all three Pixel entries as remote, meaning the phone was targeted through web content in its default browser or through NFC, Wi-Fi, Bluetooth, or baseband connections. ZDI had not disclosed which route the teams used or what their exploits did on the phones, and at least two of the three entries involved a bug already known before the attempt. Contest winners provide their exploits and write-ups to ZDI, which passes the bugs to vendors; vendors then have 90 days to release patches before full technical details are published. Google\u0026rsquo;s October Pixel bulletin, released before the demonstrations, did not mention the contest findings or list an action for Pixel owners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three teams demonstrated remote compromises of fully patched Google Pixel 10 phones at Pwn2Own Ireland on October 8.","Ikotas Labs received $300,000 and 30 points for its Pixel 10 exploit chain and was named Master of Pwn after four contest wins.","Xint received $150,000 for a Pixel 10 entry involving a single previously known issue, while Dimitrios Valsamaras, Ken Gannon, and Tenia Valsamara received $112,500 for a two-bug chain containing one previously known issue and one newly discovered issue.","The technical details and attack routes for the Pixel 10 demonstrations had not been published as of October 9, and vendors have 90 days to release patches before ZDI publishes full details.","All seven Galaxy S26 attempts succeeded, and 51 of the 63 scheduled attempts across the contest succeeded."],"insights":["At least two of the three successful Pixel 10 entries used an issue already known before the contest attempt, despite the event’s normal requirement that submitted bugs be unknown to both the vendor and organizer.","Ikotas Labs’ Pixel 10 entry was labeled as a collision but still received the full $300,000 prize, while Xint’s collision received half the listed award; ZDI did not explain the difference.","Pixel 10 owners had no listed fix or recommended action after the contest, because Google’s October security bulletin was published before the demonstrations and did not mention the findings.","Every product on the contest schedule was compromised at least once, with 51 of 63 scheduled attempts succeeding."],"referencedReports":[{"title":"Pwn2Own Ireland 2026: Day Three Results and Master of Pwn","url":"https://www.zerodayinitiative.com/blog/2026/10/8/pwn2own-ireland-2026-day-three-results-amp-master-of-pwn","publisher":"zero-day-initiative","context":"ZDI's contest-results report provides the awards and outcomes for the Pixel 10 demonstrations and other final-day entries.","category":"news","primary":true},{"title":"Pixel Update Bulletin—October 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-10-01","publisher":"google","context":"The article cites Google's October Pixel security bulletin to note that it was published before the contest demonstrations and did not mention them.","category":"advisory","primary":false},{"title":"Pixel Update Bulletin—September 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01","publisher":"google","context":"The article cites Google's September Pixel security bulletin regarding the patch for CVE-2026-58704, which Google said may have faced limited targeted exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eThree teams remotely compromised fully patched Google Pixel 10 phones at Pwn2Own Ireland on October 8. Xint received \u003cspan class=\"math inline\"\u003e\\(150,000 for an entry involving one previously known issue, Ikotas Labs earned the full \\)\u003c/span\u003e300,000 prize for a chain of issues, and Dimitrios Valsamaras, Ken Gannon, and Tenia Valsamara received \u003cspan class=\"math inline\"\u003e\\(112,500 for a two-issue chain. Together, the three Pixel 10 wins paid \\)\u003c/span\u003e562,500. Ikotas Labs was also named Master of Pwn after four wins totaling $361,000 and 42.5 points.\u003c/p\u003e\n\n\u003cp\u003eThe contest classified all three Pixel entries as remote, meaning the phone was targeted through web content in its default browser or through NFC, Wi-Fi, Bluetooth, or baseband connections. ZDI had not disclosed which route the teams used or what their exploits did on the phones, and at least two of the three entries involved a bug already known before the attempt. Contest winners provide their exploits and write-ups to ZDI, which passes the bugs to vendors; vendors then have 90 days to release patches before full technical details are published. Google\u0026rsquo;s October Pixel bulletin, released before the demonstrations, did not mention the contest findings or list an action for Pixel owners.\u003c/p\u003e\n"},{"n":3,"title":"GoBalance Flaw Lets Attackers Hijack .onion Addresses by Recovering Tor-Format Keys","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/gobalance-flaw-lets-attackers-hijack.html","time":"09:03","priority":"SHOULD READ","score":82,"tldr":"A flaw in GoBalance can expose a Tor hidden service’s long-term private key from a public descriptor, allowing attackers to hijack its .onion address and redirect visitors. Affected operators must migrate to a newly generated address because patching cannot revoke keys already exposed.","briefOverview":"\u003cp\u003eA flaw in GoBalance, a Go rewrite of Tor’s Onionbalance load balancer used with the EndGame toolkit, can let attackers recover the private key that controls an affected .onion address from public information. Searchlight Cyber disclosed the issue on October 8 and said a recovered key can be used to publish valid records that redirect visitors to an attacker-controlled copy of a site. The takeover does not provide access to the target site’s servers, databases, or stored user data.\u003c/p\u003e\n\n\u003cp\u003eThe problem occurred because GoBalance supplied only the first 32 bytes of a 64-byte Tor private key during signing, making a secret signature value predictable and allowing recovery of the long-term master key from one public descriptor. Dread said both of its .onion addresses were taken over between October 5 and 7, while Omega publicly moved away from its old address because of the GoBalance bug. Tor and the original Onionbalance are not affected, and not all GoBalance deployments are exposed; however, sites that used the vulnerable setup must generate a new .onion address because patching cannot make an already exposed key safe again.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A flaw in GoBalance can allow someone to recover the private key controlling a Tor .onion address from a single publicly available service descriptor and redirect visitors to an attacker-controlled site.","The issue stems from GoBalance passing only the first 32 bytes of a 64-byte Tor private key to its signing process, making a normally secret signature value predictable.","The original Onionbalance software and Tor itself are not affected, and GoBalance sites using the safer key format created by its setup tool are not exposed.","Dread reported that both of its .onion addresses were taken over between October 5 and 7, while Omega said it moved away from its old address because of the GoBalance bug.","Patching GoBalance cannot protect a key that was already exposed, so affected operators must generate and migrate to a new .onion address."],"insights":["A single public Tor service descriptor can be sufficient to recover an affected service’s long-term address-control key, meaning an attacker does not need access to the site’s servers.","The exposed key is a long-term master key rather than a temporary key, so an attacker who recovers it can create valid records for the compromised address well into the future.","Not every GoBalance deployment is affected: the risk is limited to sites using Tor’s own key format, while keys created by GoBalance’s setup tool use a safer format.","Dread’s second address takeover was viewed as stronger evidence of exploitation of the GoBalance flaw, while its first takeover may have resulted from a separate accidental private-key upload.","Replacing or patching the software alone is insufficient after exposure, because operators must abandon the old .onion address and establish a new one."],"referencedReports":[{"title":"Leaking the Keys to the Kingdom: How a Single Slip Handed Over a Darknet Empire","url":"https://www.slcyber.io/research/leaking-the-keys-to-the-kingdom-how-a-single-slip-handed-over-a-darknet-empire","publisher":"searchlight-cyber","context":"Searchlight Cyber disclosed the GoBalance flaw and assessed that attackers could recover affected .onion address private keys from public descriptors.","category":"research","primary":true}],"body":"\u003cp\u003eA flaw in GoBalance, a Go rewrite of Tor’s Onionbalance load balancer used with the EndGame toolkit, can let attackers recover the private key that controls an affected .onion address from public information. Searchlight Cyber disclosed the issue on October 8 and said a recovered key can be used to publish valid records that redirect visitors to an attacker-controlled copy of a site. The takeover does not provide access to the target site’s servers, databases, or stored user data.\u003c/p\u003e\n\n\u003cp\u003eThe problem occurred because GoBalance supplied only the first 32 bytes of a 64-byte Tor private key during signing, making a secret signature value predictable and allowing recovery of the long-term master key from one public descriptor. Dread said both of its .onion addresses were taken over between October 5 and 7, while Omega publicly moved away from its old address because of the GoBalance bug. Tor and the original Onionbalance are not affected, and not all GoBalance deployments are exposed; however, sites that used the vulnerable setup must generate a new .onion address because patching cannot make an already exposed key safe again.\u003c/p\u003e\n"}]</script>
