<script type="application/json" id="dl-articles">[{"n":3,"title":"Windows 11 KB5101650 \u0026 KB5099414 cumulative updates released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5101650-and-kb5099414-cumulative-updates-released/","time":"17:41","priority":"SHOULD READ","score":88,"tldr":"Microsoft released mandatory Windows 11 cumulative updates KB5101650 and KB5099414 for versions 25H2/24H2 and 23H2, delivering July 2026 Patch Tuesday security fixes for 571 vulnerabilities. The updates also add minor improvements such as Bluetooth/AirPods pairing fixes, Point-in-Time restore, Widgets and accessibility changes, and File Explorer performance fixes.","briefOverview":"\u003cp\u003eMicrosoft released the mandatory Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2. The updates include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months. They also fix bugs and add new features across Windows 11.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 25H2 changes to build 26200.8875, Windows 11 24H2 changes to build 26100.8875, and Windows 11 23H2 changes to build 22631.7376. Microsoft says the 25H2 update is based on 24H2, so both versions receive the same fixes with no exclusive or special changes. Users can install the update through Windows Update or manually through the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe update includes Bluetooth fixes, including faster and more reliable AirPods pairing, improved Beats Studio Pro microphone reliability, and better Bluetooth audio stability. It also adds Point-in-Time restore for everyone, with greater control for enterprise customers, and includes changes for Widgets, Accessibility, File Explorer, networking, printing, WSL, display, location services, Search, and input. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the mandatory Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2 to fix security vulnerabilities, bugs, and add new features.","The updates include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months.","After installation, Windows 11 25H2 will move to build 26200.8875, Windows 11 24H2 will move to build 26100.8875, and Windows 11 23H2 will move to build 22631.7376.","The update includes Bluetooth-related fixes such as faster AirPods pairing, improved Beats Studio Pro microphone reliability, and more reliable Bluetooth audio connections.","Microsoft said it is not aware of any new issues with this month’s Patch Tuesday update."],"insights":["Windows 11 25H2 receives the same update as 24H2 because this Patch Tuesday release is based on 24H2, so there are no version-exclusive fixes or features between those two releases.","Microsoft is expanding Point-in-Time restore to everyone, but enterprise customers will have greater control over the feature.","New printer installations now use Internet Printing Protocol by default when supported, and Microsoft provides a settings toggle to control this Windows Ready Print behavior.","Microsoft is testing larger Windows 11 changes such as a movable taskbar and clutter-free Windows Search, but those changes are not included in this update."],"referencedReports":[{"title":"KB5101650","url":"http://support.microsoft.com/en-us/help/5101650","publisher":"Microsoft","context":"The article links Microsoft’s KB5101650 page as the support document for the Windows 11 25H2/24H2 July 2026 cumulative update.","category":"","primary":false},{"title":"KB5099414","url":"https://support.microsoft.com/help/5099414","publisher":"Microsoft","context":"The article links Microsoft’s KB5099414 page as the support document for the Windows 11 23H2 July 2026 cumulative update.","category":"","primary":false},{"title":"End of Servicing Plan for Third-Party Printer Drivers on Windows","url":"https://learn.microsoft.com/windows-hardware/drivers/print/end-of-servicing-plan-for-third-party-printer-drivers-on-windows","publisher":"Microsoft","context":"The article references this Microsoft document for details about third-party printer driver deprecation related to the new default printer installation behavior.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released the mandatory Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2. The updates include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months. They also fix bugs and add new features across Windows 11.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 25H2 changes to build 26200.8875, Windows 11 24H2 changes to build 26100.8875, and Windows 11 23H2 changes to build 22631.7376. Microsoft says the 25H2 update is based on 24H2, so both versions receive the same fixes with no exclusive or special changes. Users can install the update through Windows Update or manually through the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe update includes Bluetooth fixes, including faster and more reliable AirPods pairing, improved Beats Studio Pro microphone reliability, and better Bluetooth audio stability. It also adds Point-in-Time restore for everyone, with greater control for enterprise customers, and includes changes for Widgets, Accessibility, File Explorer, networking, printing, WSL, display, location services, Search, and input. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday release.\u003c/p\u003e\n"},{"n":2,"title":"Progress confirms ShareFile zero-day flaw behind Storage Zone shutdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/progress-confirms-sharefile-zero-day-flaw-behind-storage-zone-shutdown/","time":"16:08","priority":"SHOULD READ","score":85,"tldr":"Progress Software confirmed a high-severity zero-day path traversal flaw in ShareFile Storage Zone Controllers caused last week’s emergency shutdown and has released patches in versions 5.12.5 and 6.0.2. The company says it has no evidence of customer data access or active exploitation but urges customers to update before bringing servers back online.","briefOverview":"\u003cp\u003eProgress Software confirmed that a high-severity zero-day vulnerability was behind the emergency shutdown of ShareFile Storage Zone Controllers last week. The company had urged customers using the controllers to immediately shut down their Windows servers after receiving a warning about a credible external security threat. Progress also temporarily disabled access to all ShareFile accounts using Storage Zone Controllers while it investigated the incident with cybersecurity experts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation identified a path traversal vulnerability affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller. Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout. A CVE identifier has been reserved for the issue and is expected to be published in two weeks.\u003c/p\u003e\n\n\u003cp\u003eProgress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates as soon as possible before bringing controllers back online. The company said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat. Storage Zone Controllers are customer-managed Windows servers that let organizations keep files on-premises while using ShareFile’s cloud platform, making them valuable targets for data theft extortion attacks because they contain files transferred using the system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software confirmed that a high-severity zero-day vulnerability caused the emergency shutdown of ShareFile Storage Zone Controllers last week.","The vulnerability is a path traversal flaw affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller.","Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout.","Progress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates before bringing controllers back online.","Progress said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat."],"insights":["Progress says the vulnerability requires an authenticated administrative user, yet the company still treated the threat seriously enough to disable access to all ShareFile accounts using Storage Zone Controllers during the investigation.","The flaw affects both major supported branches mentioned in the article, 5.x and 6.x, so customers cannot avoid exposure simply by being on the newer 6.x line unless they install the patched 6.0.2 release.","Progress has reserved a CVE but will not publish it for two weeks, meaning customers are being asked to patch before full public vulnerability details are available.","Storage Zone Controllers are especially sensitive targets because they hold customer-managed on-premises files while still connecting to ShareFile’s cloud platform for authentication, permissions, auditing, and collaboration."],"referencedReports":[],"body":"\u003cp\u003eProgress Software confirmed that a high-severity zero-day vulnerability was behind the emergency shutdown of ShareFile Storage Zone Controllers last week. The company had urged customers using the controllers to immediately shut down their Windows servers after receiving a warning about a credible external security threat. Progress also temporarily disabled access to all ShareFile accounts using Storage Zone Controllers while it investigated the incident with cybersecurity experts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation identified a path traversal vulnerability affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller. Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout. A CVE identifier has been reserved for the issue and is expected to be published in two weeks.\u003c/p\u003e\n\n\u003cp\u003eProgress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates as soon as possible before bringing controllers back online. The company said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat. Storage Zone Controllers are customer-managed Windows servers that let organizations keep files on-premises while using ShareFile’s cloud platform, making them valuable targets for data theft extortion attacks because they contain files transferred using the system.\u003c/p\u003e\n"},{"n":1,"title":"LastPass, Bitwarden users targeted with fake security alerts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lastpass-bitwarden-users-targeted-with-fake-security-alerts/","time":"15:31","priority":"SHOULD READ","score":78,"tldr":"LastPass and Bitwarden users are being targeted by phishing emails that impersonate security policy updates and lead to fake DocuSign-style sites on lookalike domains. Users should avoid clicking these messages, never enter master passwords on linked sites, and change credentials immediately if they interacted with the phishing pages.","briefOverview":"\u003cp\u003eLastPass is warning users about an ongoing phishing campaign that uses fake security notices to direct recipients to fraudulent websites. The emails are designed to look like legitimate corporate communications and claim there are updated LastPass security policies. LastPass says its systems have not been compromised and that the phishing emails did not come from its infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe messages sent from \u003ccode\u003ehello@lastpassnewsletter.com\u003c/code\u003e tell users about alleged service policy changes, including enhanced SaaS monitoring, master password reset options for administrators, and admin console improvements. Clicking the “Review \u0026amp; Access Terms” button takes users to a site impersonating DocuSign, but the domain used is \u003ccode\u003elastpasscompliance[.]com\u003c/code\u003e, which Microsoft Defender for Office 365 and Cloudflare flagged as malicious. LastPass could not confirm the campaign’s goal, but said the fake site prompts users to download a file claiming to support Windows and macOS.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer found that Bitwarden users are also being targeted with similar emails from \u003ccode\u003ehello@bitwardennewsletter.com\u003c/code\u003e that redirect to \u003ccode\u003ebitwardencompliance[.]com\u003c/code\u003e. The article notes that LastPass users were previously targeted by fake unauthorized access alerts in March and fake vault backup alerts in January. LastPass says it will never ask users for their master password and advises anyone who entered credentials on phishing sites to change their master password immediately from a trusted device and review their vault for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LastPass is warning users about a phishing campaign that uses fake security notices to direct recipients to fraudulent websites.","The phishing emails sent from hello@lastpassnewsletter.com claim there are LastPass service policy changes and lead users to a fake DocuSign-style page on lastpasscompliance[.]com.","LastPass says its systems have not been compromised and that the phishing emails did not originate from its infrastructure.","BleepingComputer found that Bitwarden users are targeted by similar emails sent from hello@bitwardennewsletter.com and redirected to bitwardencompliance[.]com.","LastPass advises users who entered credentials on phishing sites to change their master passwords immediately from a trusted device and review their vaults for suspicious activity."],"insights":["The lure does not immediately imitate a LastPass login page; it first impersonates a DocuSign document review flow, which makes checking the destination domain especially important before clicking or downloading anything.","The campaign reused the same pattern against both LastPass and Bitwarden users, with similar “newsletter” sender addresses and “compliance” domains tailored to each brand.","The fake site prompted users to download a file claiming to support both Windows and macOS, so the risk described in the article is not limited to users entering credentials.","LastPass specifically says it will never ask for a master password, making any message or site requesting it a clear warning sign for users."],"referencedReports":[],"body":"\u003cp\u003eLastPass is warning users about an ongoing phishing campaign that uses fake security notices to direct recipients to fraudulent websites. The emails are designed to look like legitimate corporate communications and claim there are updated LastPass security policies. LastPass says its systems have not been compromised and that the phishing emails did not come from its infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe messages sent from \u003ccode\u003ehello@lastpassnewsletter.com\u003c/code\u003e tell users about alleged service policy changes, including enhanced SaaS monitoring, master password reset options for administrators, and admin console improvements. Clicking the “Review \u0026amp; Access Terms” button takes users to a site impersonating DocuSign, but the domain used is \u003ccode\u003elastpasscompliance[.]com\u003c/code\u003e, which Microsoft Defender for Office 365 and Cloudflare flagged as malicious. LastPass could not confirm the campaign’s goal, but said the fake site prompts users to download a file claiming to support Windows and macOS.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer found that Bitwarden users are also being targeted with similar emails from \u003ccode\u003ehello@bitwardennewsletter.com\u003c/code\u003e that redirect to \u003ccode\u003ebitwardencompliance[.]com\u003c/code\u003e. The article notes that LastPass users were previously targeted by fake unauthorized access alerts in March and fake vault backup alerts in January. LastPass says it will never ask users for their master password and advises anyone who entered credentials on phishing sites to change their master password immediately from a trusted device and review their vault for suspicious activity.\u003c/p\u003e\n"},{"n":7,"title":"LabubaRAT Masquerades as NVIDIA Software to Control Windows Hosts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/labubarat-masquerades-as-nvidia.html","time":"16:52","priority":"SHOULD READ","score":78,"tldr":"Researchers identified LabubaRAT, a previously undocumented Rust-based remote access trojan that disguises itself as NVIDIA software while giving attackers control over Windows hosts. It supports host profiling, command execution, file transfer, screenshots, SOCKS5 proxying, and multiple C2 channels including HTTPS, WebView2, and DNS tunneling.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a previously undocumented Rust-based remote access trojan called LabubaRAT that masquerades as NVIDIA software to blend into Windows environments. Blackpoint Cyber researchers said the malware creates a reusable foothold for hands-on activity after deployment. The implant can profile hosts, identify security tools, receive operator commands, move files, capture screenshots, and proxy traffic through an affected system.\u003c/p\u003e\n\n\u003cp\u003eLabubaRAT supports multiple communication methods, including HTTPS, WebView2, and DNS tunneling, which can help attackers maintain access if one pathway is detected and closed. The attack chain begins with an executable named \u0026ldquo;nvidia-sysruntime.exe,\u0026rdquo; which impersonates NVIDIA\u0026rsquo;s container runtime toolkit. Instead of hard-coding command-and-control details, the sample accepts runtime configuration through command-line arguments or a single Base64-encoded argument, allowing the same compiled binary to be reused with different infrastructure or campaign groupings.\u003c/p\u003e\n\n\u003cp\u003eThe malware stores its configuration in a local SQLite database and inventories browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state. It specifically checks for products including Google Chrome, Mozilla Firefox, Microsoft Edge, Brave, Microsoft Defender, CrowdStrike, SentinelOne, Carbon Black, Sophos, Malwarebytes, Bitdefender, ESET, Kaspersky, McAfee, Symantec, and Trend Micro. Once launched, LabubaRAT can execute commands, run PowerShell and JavaScript, capture screenshots, upload and download files, handle archives, and support SOCKS5 proxying.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blackpoint Cyber researchers reported a previously undocumented Rust-based remote access trojan called LabubaRAT that masquerades as NVIDIA software on Windows hosts.","LabubaRAT supports HTTPS, WebView2, and DNS tunneling for communication, allowing attackers to maintain access if one communication path is detected and closed.","The attack chain begins with an executable named nvidia-sysruntime.exe, which impersonates NVIDIA's container runtime toolkit and accepts command-and-control configuration through command-line arguments.","LabubaRAT stores its configuration in a local SQLite database and inventories browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state.","The malware can execute commands, run PowerShell and JavaScript, capture screenshots, upload and download files, handle archives, and provide SOCKS5 proxy support."],"insights":["LabubaRAT’s command-and-control details are supplied at launch rather than hard-coded, which lets the same compiled binary be reused across different infrastructure, organizations, or campaign groupings.","The malware’s checks for specific browsers and security products indicate that operator actions or available RAT functionality may be adjusted based on the defenses present on each host.","LabubaRAT’s multiple communication options make blocking a single channel insufficient, because the implant can use HTTPS, WebView2, or DNS tunneling to maintain access.","The LabubaPanel branding and Labubu-themed favicon provided the clearest external clue for naming the malware, while the underlying design shows a framework-like RAT built for repeated deployment."],"referencedReports":[{"title":"LabubaRAT: A Rust-Based Remote Access Tool Masquerading as NVIDIA Software","url":"https://blackpointcyber.com/blog/labubarat-a-rust-based-remote-access-tool-masquerading-as-nvidia-software/","publisher":"Blackpoint Cyber","context":"The article cites Blackpoint Cyber researchers Sam Decker and Nevan Beal's analysis as the source for details on LabubaRAT's capabilities, configuration, communications, and branding.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a previously undocumented Rust-based remote access trojan called LabubaRAT that masquerades as NVIDIA software to blend into Windows environments. Blackpoint Cyber researchers said the malware creates a reusable foothold for hands-on activity after deployment. The implant can profile hosts, identify security tools, receive operator commands, move files, capture screenshots, and proxy traffic through an affected system.\u003c/p\u003e\n\n\u003cp\u003eLabubaRAT supports multiple communication methods, including HTTPS, WebView2, and DNS tunneling, which can help attackers maintain access if one pathway is detected and closed. The attack chain begins with an executable named \u0026ldquo;nvidia-sysruntime.exe,\u0026rdquo; which impersonates NVIDIA\u0026rsquo;s container runtime toolkit. Instead of hard-coding command-and-control details, the sample accepts runtime configuration through command-line arguments or a single Base64-encoded argument, allowing the same compiled binary to be reused with different infrastructure or campaign groupings.\u003c/p\u003e\n\n\u003cp\u003eThe malware stores its configuration in a local SQLite database and inventories browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state. It specifically checks for products including Google Chrome, Mozilla Firefox, Microsoft Edge, Brave, Microsoft Defender, CrowdStrike, SentinelOne, Carbon Black, Sophos, Malwarebytes, Bitdefender, ESET, Kaspersky, McAfee, Symantec, and Trend Micro. Once launched, LabubaRAT can execute commands, run PowerShell and JavaScript, capture screenshots, upload and download files, handle archives, and support SOCKS5 proxying.\u003c/p\u003e\n"},{"n":6,"title":"Finland issues wanted notice for hacker behind massive psychotherapy data breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/finland-issues-wanted-notice-for-hacker-vastaamo-breach","time":"17:28","priority":"MAY READ","score":70,"tldr":"Finnish police have issued a wanted notice for convicted Vastaamo hacker Aleksanteri Kivimäki after the Supreme Court declined to hear his appeal, making his nearly seven-year sentence final. Authorities are seeking to return him to prison for the massive psychotherapy data breach and extortion of thousands of patients.","briefOverview":"\u003cp\u003eFinnish police have reportedly issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal. The decision leaves in place a February Court of Appeal ruling sentencing him to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients. Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.\u003c/p\u003e\n\n\u003cp\u003eThe Court of Appeal convicted Kivimäki of aggravated data breach, attempted extortion, and unlawfully distributing private information. The judges said the crimes were carefully planned, financially motivated, and caused exceptional harm to a large number of especially vulnerable victims. Kivimäki has denied carrying out the attack, challenged the digital evidence linking him to the hack, and disputed allegations involving cryptocurrency transactions tied to the extortion scheme.\u003c/p\u003e\n\n\u003cp\u003eThe Vastaamo breach occurred in 2018 but became public in 2020, when the attacker first tried to extort the company and then demanded money directly from thousands of patients. When many victims refused to pay, confidential therapy notes and other highly sensitive records were published online. The stolen database contained information on about 33,000 patients, more than 24,000 people reported receiving extortion demands, and the case became the largest criminal case in Finnish history by number of victims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Finnish police issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal.","The Supreme Court’s decision leaves in place a February Court of Appeal ruling sentencing Kivimäki to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients.","Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.","Kivimäki has denied carrying out the attack and argued that prosecutors relied largely on circumstantial evidence and disputed digital and cryptocurrency evidence.","The Vastaamo breach exposed information on about 33,000 patients, and more than 24,000 people reported receiving extortion demands."],"insights":["The court said the crimes would normally have justified the maximum sentence, but Kivimäki’s prison term was reduced by one month because he reached compensation agreements with some victims.","Kivimäki was released from pretrial detention in September 2025 because the appeals court found he had already spent enough time in custody that continued detention could violate his rights.","The case became the largest criminal case in Finnish history by number of victims, showing how one data theft involving highly sensitive records can create an unusually large legal proceeding.","The breach occurred in 2018 but did not become public until 2020, meaning victims were not publicly aware of the incident for about two years."],"referencedReports":[],"body":"\u003cp\u003eFinnish police have reportedly issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal. The decision leaves in place a February Court of Appeal ruling sentencing him to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients. Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.\u003c/p\u003e\n\n\u003cp\u003eThe Court of Appeal convicted Kivimäki of aggravated data breach, attempted extortion, and unlawfully distributing private information. The judges said the crimes were carefully planned, financially motivated, and caused exceptional harm to a large number of especially vulnerable victims. Kivimäki has denied carrying out the attack, challenged the digital evidence linking him to the hack, and disputed allegations involving cryptocurrency transactions tied to the extortion scheme.\u003c/p\u003e\n\n\u003cp\u003eThe Vastaamo breach occurred in 2018 but became public in 2020, when the attacker first tried to extort the company and then demanded money directly from thousands of patients. When many victims refused to pay, confidential therapy notes and other highly sensitive records were published online. The stolen database contained information on about 33,000 patients, more than 24,000 people reported receiving extortion demands, and the case became the largest criminal case in Finnish history by number of victims.\u003c/p\u003e\n"},{"n":8,"title":"Frontier AI in the Health Sector: Managing Supply Chain and Vendor Risk","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/frontier-ai-in-the-health-sector-managing-supply-chain-and-vendor-risk/","time":"14:42","priority":"MAY READ","score":55,"tldr":"Frontier AI is accelerating vulnerability discovery, forcing healthcare organizations to shrink remediation timelines from weeks to days or hours. The paper urges healthcare entities to update vendor contracts, improve third-party visibility, and build contingency plans to manage AI-driven supply chain risk.","briefOverview":"\u003cp\u003eHealth-ISAC published a white paper titled “Frontier AI in the Health Sector: Managing Supply Chain and Vendor Risk” on July 14, 2026. The article says frontier AI models, including new large language models, are changing cybersecurity because they can find vulnerabilities at a pace not seen before. This creates risks for systems and data in the health sector.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that health sector organizations need to adapt because the same cybersecurity fundamentals still apply, but the timelines are much shorter. Vulnerability management, patching, and checking that patches work need to become priorities, with remediation moving from weeks to days or even hours. This shift is especially complicated when organizations depend on third-party suppliers, because existing contracts and service-level agreements may not match the changing threat model.\u003c/p\u003e\n\n\u003cp\u003eThe paper focuses on how health sector organizations should work with supply chains and third-party partners as frontier AI models evolve. Its key takeaways include modernizing supplier agreements, requiring faster remediation windows, gaining better visibility into vendor security practices, maintaining an inventory of third-party software, and developing contingency strategies to protect clinical workflows. The article also says roughly 80% of Health-ISAC members are increasing budgets for AI-powered security solutions or proactively scanning their networks for weaknesses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Frontier AI models can identify vulnerabilities at unprecedented speed, creating new risks for systems and data in the health sector.","The article says health sector organizations must move vulnerability remediation from multi-week timelines to days or hours, with patching and patch validation prioritized.","The paper focuses on how health sector organizations should work with supply chains and third-party partners as frontier AI changes the threat model.","The article recommends revisiting supplier contracts to require faster remediation windows and greater visibility into vendor security practices.","The article says organizations should maintain a complete inventory of third-party software, develop contingency strategies, map external digital assets, adopt zero-trust principles, and communicate transparently with supply chain partners."],"insights":["The article frames frontier AI as compressing the practical response window for healthcare security teams, making patch verification as urgent as patch deployment itself.","The paper treats vendor contracts and service-level agreements as security controls that may need to change because existing timelines may no longer match AI-accelerated risk.","Health-ISAC presents the paper as a living document, acknowledging that recommendations will need to evolve as new frontier AI models are released.","The article connects vendor security failures directly to clinical continuity, emphasizing that third-party software inventories and contingency plans are needed to prevent disruption of healthcare workflows.","Survey data cited in the article indicates that about 80% of Health-ISAC members are already increasing budgets for AI-powered security tools or proactively scanning their networks for weaknesses."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published a white paper titled “Frontier AI in the Health Sector: Managing Supply Chain and Vendor Risk” on July 14, 2026. The article says frontier AI models, including new large language models, are changing cybersecurity because they can find vulnerabilities at a pace not seen before. This creates risks for systems and data in the health sector.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that health sector organizations need to adapt because the same cybersecurity fundamentals still apply, but the timelines are much shorter. Vulnerability management, patching, and checking that patches work need to become priorities, with remediation moving from weeks to days or even hours. This shift is especially complicated when organizations depend on third-party suppliers, because existing contracts and service-level agreements may not match the changing threat model.\u003c/p\u003e\n\n\u003cp\u003eThe paper focuses on how health sector organizations should work with supply chains and third-party partners as frontier AI models evolve. Its key takeaways include modernizing supplier agreements, requiring faster remediation windows, gaining better visibility into vendor security practices, maintaining an inventory of third-party software, and developing contingency strategies to protect clinical workflows. The article also says roughly 80% of Health-ISAC members are increasing budgets for AI-powered security solutions or proactively scanning their networks for weaknesses.\u003c/p\u003e\n"},{"n":5,"title":"AI Agents Are Creating a New Class of Employee Risk","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/agentic-ai-security-risk","time":"15:47","priority":"MAY READ","score":48,"tldr":"AI agents are becoming a new source of enterprise security risk because they can autonomously access sensitive data and take damaging actions at machine speed. Organizations need data-centric controls that evaluate actions and intent, not just access permissions, to adopt AI safely.","briefOverview":"\u003cp\u003eThe article argues that AI agents are creating a new class of digital employee risk by increasing the number of non-human identities that access sensitive data. It says these agents can work autonomously, interact with enterprise data systems, and take actions without enough supervision. The article presents this as a shift in cybersecurity risk from controlling access alone to controlling actions and intent.\u003c/p\u003e\n\n\u003cp\u003eA key example in the article is PocketOS, where the founder reportedly woke up to find that Cursor, a coding tool, had deleted the business, including the database and all backups. The article says Cursor was not acting maliciously, but made a damaging decision while performing a routine task after finding a discrepancy. This example is used to show how autonomous tools can create serious consequences when they have the initiative and authority to act.\u003c/p\u003e\n\n\u003cp\u003eThe article says traditional static controls are not sufficient when AI agents act at machine speed and scale. It argues that organizations need data-level controls that enforce policy in real time across identities and systems, rather than relying only on model safeguards. It also says effective AI security requires visibility into data access and a data-centric approach that connects data sensitivity, permissions, identity, and activity to decide whether an action should be allowed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI agents are creating a new digital workforce that rapidly increases the number of non-human identities accessing sensitive data.","The article cites PocketOS as an example where Cursor deleted the business, including the database and all backups, while performing a routine task.","AI agents can act autonomously on enterprise data and take actions at machine speed and scale, which can make small mistakes or misconfigurations have large impacts.","The article says model safeguards alone are not enough because AI agents do not inherently understand risk or policy.","Organizations need data-level controls that connect data sensitivity, permissions, identity, and activity to determine whether an action should be allowed."],"insights":["The PocketOS example shows that severe damage from AI agents can happen without malicious intent, simply because an autonomous tool has enough authority to act on a mistaken decision.","The article frames AI agent risk as a shift from managing human error to managing non-human identities that can operate continuously and unsupervised.","The article argues that measuring AI risk depends on knowing what data an agent can reach and how it uses that data, not just whether the agent is allowed into a system.","A practical control change highlighted by the article is to move security checks closer to the data so decisions can account for sensitivity, permissions, identity, and activity in real time."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that AI agents are creating a new class of digital employee risk by increasing the number of non-human identities that access sensitive data. It says these agents can work autonomously, interact with enterprise data systems, and take actions without enough supervision. The article presents this as a shift in cybersecurity risk from controlling access alone to controlling actions and intent.\u003c/p\u003e\n\n\u003cp\u003eA key example in the article is PocketOS, where the founder reportedly woke up to find that Cursor, a coding tool, had deleted the business, including the database and all backups. The article says Cursor was not acting maliciously, but made a damaging decision while performing a routine task after finding a discrepancy. This example is used to show how autonomous tools can create serious consequences when they have the initiative and authority to act.\u003c/p\u003e\n\n\u003cp\u003eThe article says traditional static controls are not sufficient when AI agents act at machine speed and scale. It argues that organizations need data-level controls that enforce policy in real time across identities and systems, rather than relying only on model safeguards. It also says effective AI security requires visibility into data access and a data-centric approach that connects data sensitivity, permissions, identity, and activity to decide whether an action should be allowed.\u003c/p\u003e\n"},{"n":4,"title":"You Don't Have to Run an Exploit to Know If You're Vulnerable","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/you-dont-have-to-run-an-exploit-to-know-if-youre-vulnerable/","time":"14:00","priority":"MAY READ","score":45,"tldr":"The article argues that security teams can no longer rely on patching every new CVE fast enough and should instead validate which flaws are actually exploitable in their own environments. It promotes Picus’s approach of testing attacker behavior chains safely, without firing real exploits, to prioritize the exposures that matter most.","briefOverview":"\u003cp\u003eThe article argues that vulnerability management has changed because new CVEs are arriving faster and AI has reduced the time between public disclosure and working exploitation. It says the first half of 2026 produced more CVEs than any full year before 2024, at about one every 7.4 minutes. It also says the Zero Day Clock puts the 2026 median time-to-exploit at well under a day, making it unrealistic for teams to rely only on patching speed.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main claim is that organizations need to prove which vulnerabilities are actually exploitable in their own environments without always launching live exploits. It says automated pentesting with real exploits is limited to places where testing is safe and where usable exploits already exist, covering only 10 to 15% of many enterprise attack surfaces. Picus Platform is presented as a way to test the required steps in an attack chain against deployed defenses, so teams can decide whether a chain would succeed or fail without firing the original exploit.\u003c/p\u003e\n\n\u003cp\u003eThe article uses Nightmare-Eclipse as an example involving Windows zero-day releases called BlueHammer, RedSun, and UnDefend. It describes BlueHammer as abusing Windows Defender behavior and Volume Shadow Copy access to read registry hives and escalate privileges, RedSun as redirecting a privileged write into System32, and UnDefend as disrupting Defender updates while appearing healthy. Picus’s TTP-chaining example maps these behaviors into safer tests such as creating a harmless service, accessing SAM-related hives through Volume Shadow Copy, and stopping Windows Defender to see whether defenses break the chain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says the first half of 2026 produced more CVEs than any full year on record before 2024, at a rate of about one new CVE every 7.4 minutes.","The article says AI has reduced the time between a public advisory and a working exploit, with the Zero Day Clock putting the 2026 median time-to-exploit at well under a day.","The article argues that live exploit testing is limited because it can only be used where it is safe and where a usable exploit already exists, which the article says covers only 10 to 15% of most enterprise attack surfaces.","The article describes Picus Platform’s TTP-chaining approach as testing the required steps of an exploit against deployed defenses to determine whether the full attack chain would succeed without firing the real exploit.","The article uses Nightmare-Eclipse as an example, describing BlueHammer, RedSun, and UnDefend as Windows zero-day releases that can be modeled through safe actions such as creating a test service, accessing registry hives through Volume Shadow Copy, and stopping Windows Defender."],"insights":["The article’s core prioritization idea is that an unpatched flaw may be less urgent on a specific asset if one required step in its attack chain is blocked by existing controls.","The article presents TTP-chaining as a way to evaluate high-risk systems that traditional automated pentesting may exclude, such as regulated, air-gapped, or business-critical assets.","The Nightmare-Eclipse example shows that defenders can test for dangerous outcomes like SYSTEM-level execution, credential hive access, and Defender disruption using harmless substitute actions rather than the original exploit code.","The article argues that exploitability decisions should be continuously rechecked because a control that previously blocked an attack chain may stop doing so after an environment or configuration change."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that vulnerability management has changed because new CVEs are arriving faster and AI has reduced the time between public disclosure and working exploitation. It says the first half of 2026 produced more CVEs than any full year before 2024, at about one every 7.4 minutes. It also says the Zero Day Clock puts the 2026 median time-to-exploit at well under a day, making it unrealistic for teams to rely only on patching speed.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main claim is that organizations need to prove which vulnerabilities are actually exploitable in their own environments without always launching live exploits. It says automated pentesting with real exploits is limited to places where testing is safe and where usable exploits already exist, covering only 10 to 15% of many enterprise attack surfaces. Picus Platform is presented as a way to test the required steps in an attack chain against deployed defenses, so teams can decide whether a chain would succeed or fail without firing the original exploit.\u003c/p\u003e\n\n\u003cp\u003eThe article uses Nightmare-Eclipse as an example involving Windows zero-day releases called BlueHammer, RedSun, and UnDefend. It describes BlueHammer as abusing Windows Defender behavior and Volume Shadow Copy access to read registry hives and escalate privileges, RedSun as redirecting a privileged write into System32, and UnDefend as disrupting Defender updates while appearing healthy. Picus’s TTP-chaining example maps these behaviors into safer tests such as creating a harmless service, accessing SAM-related hives through Volume Shadow Copy, and stopping Windows Defender to see whether defenses break the chain.\u003c/p\u003e\n"},{"n":9,"title":"10 Black Hat NOCs and Counting: Corelight Sees It All | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/black-hat-asia-2026-noc-lessons","time":"17:50","priority":"MAY READ","score":30,"tldr":"Corelight highlights its decade-long role supporting the Black Hat network operations center, emphasizing how its network visibility helps detect, investigate, and understand activity on one of the world’s most challenging conference networks.","briefOverview":"\u003cp\u003eThe article is titled “10 Black Hat NOCs and Counting: Corelight Sees It All.” It identifies Corelight as the organization associated with the piece. The title states that Corelight has been involved with 10 Black Hat NOCs and counting.\u003c/p\u003e\n\n\u003cp\u003eThe readable information indicates that the article centers on Corelight’s visibility or role in Black Hat NOC activity. Beyond the title and the association with Corelight, the article body provided here is not readable as normal text. No specific technical details, incidents, impacts, or affected parties are explicitly available from the readable article content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “10 Black Hat NOCs and Counting: Corelight Sees It All.”","The article identifies Corelight as the organization associated with the piece.","The title states that Corelight has been involved with 10 Black Hat NOCs and counting."],"insights":["Corelight presents its Black Hat NOC involvement as a long-running engagement rather than a one-time participation, using “10 Black Hat NOCs and Counting” to emphasize continuity.","The phrase “Corelight Sees It All” shows that the article’s central claim is about broad visibility into Black Hat NOC activity."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “10 Black Hat NOCs and Counting: Corelight Sees It All.” It identifies Corelight as the organization associated with the piece. The title states that Corelight has been involved with 10 Black Hat NOCs and counting.\u003c/p\u003e\n\n\u003cp\u003eThe readable information indicates that the article centers on Corelight’s visibility or role in Black Hat NOC activity. Beyond the title and the association with Corelight, the article body provided here is not readable as normal text. No specific technical details, incidents, impacts, or affected parties are explicitly available from the readable article content.\u003c/p\u003e\n"}]</script>
