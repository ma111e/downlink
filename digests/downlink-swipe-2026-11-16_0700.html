<script type="application/json" id="dl-articles">[{"n":4,"title":"SANSAR Linux Cryptomining Malware Uses Modified NVIDIA Library to Hide GPU Activity","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sansar-linux-cryptomining-malware-uses.html","time":"09:32","priority":"SHOULD READ","score":88,"tldr":"Elastic Security Labs reports that the REF3364 cryptomining operation uses the Rust-based SANSAR toolkit, a Linux kernel rootkit, and a modified NVIDIA NVML library to mine cryptocurrency while hiding processes, files, network activity, and GPU utilization. The attackers reportedly gain access through exposed Ray job agents and maintain control via TOR-based C2 and an Ethereum smart-contract-assisted backdoor.","briefOverview":"\u003cp\u003eElastic Security Labs attributed a Linux cryptocurrency-mining operation to the financially motivated REF3364 cluster. The operation uses SANSAR, a Rust-based tool that receives commands through the TOR network and manages CPU and GPU mining software. Attackers were observed gaining access through an exposed Ray job agent, running commands to collect GPU inventory, and then deploying a Python reverse shell. They added an SSH key to maintain access and, after obtaining root privileges, staged their toolkit under \u003ccode\u003e/opt/vadi_\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attackers installed the \u003ccode\u003eacpi_thermal_mgr\u003c/code\u003e kernel rootkit through DKMS along with an initramfs loader, allowing it to load again at boot. The rootkit uses ftrace to hide selected processes, directories, files, and socket entries, and it can make requests for concealed items return messages such as \u0026ldquo;No such file or directory.\u0026rdquo; A modified NVIDIA Management Library wrapper also alters data shown by monitoring tools such as \u003ccode\u003envidia-smi\u003c/code\u003e, reporting zero GPU utilization and replacing temperature and power readings with randomized values.\u003c/p\u003e\n\n\u003cp\u003eSANSAR contacts a TOR onion service for command-and-control and can launch or stop miners, update their settings, open interactive shells, and maintain the GPU-monitoring hook. The toolkit uses XMRig for CPU mining and SRBMiner-MULTI for GPU mining, while a separate \u003ccode\u003enetns\u003c/code\u003e backdoor retrieves a controller address from an Ethereum smart contract and connects over TCP port 8080. Elastic warned that organizations operating GPU infrastructure for AI and large language model workloads should review who can submit jobs and whether GPU monitoring libraries have been altered, as concealed mining can consume legitimate compute resources and raise costs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs attributed a Linux-focused cryptocurrency-mining operation to a financially motivated cluster tracked as REF3364, which uses a Rust-based toolkit named SANSAR.","The documented attack chain began with an exposed Ray job agent, which attackers used to run commands, inventory GPUs, establish a reverse shell, and add an SSH key for persistent access.","After obtaining root access, the attackers installed the acpi_thermal_mgr kernel module through DKMS and an initramfs loader so the rootkit could reload when the host booted.","A modified NVIDIA Management Library wrapper causes tools such as nvidia-smi to report zero GPU utilization and replaces temperature and power readings with randomized values.","SANSAR uses a TOR onion service for command-and-control, while the netns backdoor obtains a controller address from an Ethereum smart contract and connects to it on TCP port 8080."],"insights":["GPU monitoring alone may not reveal this mining activity because the modified NVIDIA library makes tools such as nvidia-smi report 0% utilization while supplying plausible-looking random temperature and power values.","The rootkit’s use of an initramfs loader makes its persistence more durable than a running-process-only infection, because it can be loaded again during system boot before the normal Linux filesystem is used.","The operation uses two separate control paths: SANSAR communicates through a TOR onion service, while the netns backdoor retrieves a controller address from an Ethereum smart contract before opening a TCP connection.","The attackers’ initial GPU inventory collection through Ray jobs indicates that exposed job-management services can provide both remote command execution and reconnaissance of valuable GPU resources.","Organizations using GPU infrastructure for AI and large language model workloads risk losing legitimate compute capacity and incurring higher operating costs when cryptomining activity is concealed."],"referencedReports":[{"title":"SANSAR Linux Cryptomining Malware","url":"https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware","publisher":"elastic-security-labs","context":"The article relies on an Elastic Security Labs report for its analysis of the REF3364 operation, the SANSAR toolkit, the rootkit, and GPU-telemetry manipulation.","category":"research","primary":true}],"body":"\u003cp\u003eElastic Security Labs attributed a Linux cryptocurrency-mining operation to the financially motivated REF3364 cluster. The operation uses SANSAR, a Rust-based tool that receives commands through the TOR network and manages CPU and GPU mining software. Attackers were observed gaining access through an exposed Ray job agent, running commands to collect GPU inventory, and then deploying a Python reverse shell. They added an SSH key to maintain access and, after obtaining root privileges, staged their toolkit under \u003ccode\u003e/opt/vadi_\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attackers installed the \u003ccode\u003eacpi_thermal_mgr\u003c/code\u003e kernel rootkit through DKMS along with an initramfs loader, allowing it to load again at boot. The rootkit uses ftrace to hide selected processes, directories, files, and socket entries, and it can make requests for concealed items return messages such as \u0026ldquo;No such file or directory.\u0026rdquo; A modified NVIDIA Management Library wrapper also alters data shown by monitoring tools such as \u003ccode\u003envidia-smi\u003c/code\u003e, reporting zero GPU utilization and replacing temperature and power readings with randomized values.\u003c/p\u003e\n\n\u003cp\u003eSANSAR contacts a TOR onion service for command-and-control and can launch or stop miners, update their settings, open interactive shells, and maintain the GPU-monitoring hook. The toolkit uses XMRig for CPU mining and SRBMiner-MULTI for GPU mining, while a separate \u003ccode\u003enetns\u003c/code\u003e backdoor retrieves a controller address from an Ethereum smart contract and connects over TCP port 8080. Elastic warned that organizations operating GPU infrastructure for AI and large language model workloads should review who can submit jobs and whether GPU monitoring libraries have been altered, as concealed mining can consume legitimate compute resources and raise costs.\u003c/p\u003e\n"},{"n":3,"title":"Amazon Uncovers AI Agent Campaign Targeting LiteLLM, Dify, and Other Apps for API Keys","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/amazon-uncovers-ai-agent-campaign.html","time":"07:34","priority":"SHOULD READ","score":86,"tldr":"Amazon observed attackers using ARTEX AI agents to rapidly scan exposed AI application platforms such as LiteLLM, Dify, and RAGFlow for default credentials, unpatched flaws, and leaked API keys. The campaign highlights that internet-facing AI gateways and static CI/CD tokens can expose high-value provider credentials unless organizations patch systems, rotate secrets, and enforce strong access controls.","briefOverview":"\u003cp\u003eAmazon Threat Intelligence captured records from decoy AI services showing attackers’ agents searching internet-exposed AI applications, including LiteLLM, One API, and Dify, for AI-provider API keys. Amazon assessed with moderate confidence that the activity used ARTEX, an open-source AI penetration-testing tool, but said it could not verify outcomes the agents reported for systems outside its decoy network. The records suggest that working stolen keys were pooled and reportedly used to run the AI models that supported further searches for credentials.\u003c/p\u003e\n\n\u003cp\u003eThe agents’ playbook covered default administrator credentials, incomplete installations, unauthenticated settings pages, the \u003ccode\u003eisCliRequest\u003c/code\u003e authentication bypass in One API family systems, server-side request forgery routes to cloud metadata services, and exposed secrets in code and public files. Cloudflare separately reported an ARTEX-related incident involving a compromised CI/CD API token with no IP restrictions or rate limiting, followed by Worker-script creation and 400 database-dump requests in an hour. Amazon advised organizations to change default credentials, patch affected products, find and rotate exposed secrets, restrict tokens, and monitor for unusual usage or spending.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Amazon Threat Intelligence captured records from AI agents that targeted internet-exposed AI applications, including LiteLLM, One API, and Dify, to obtain stored AI-provider keys.","Amazon assessed with moderate confidence that the agents used ARTEX, an open-source AI penetration-testing tool, although it could not verify the outcomes the agents reported from systems outside its decoy network.","The captured playbook included default administrator credentials, unfinished installations, unauthenticated management endpoints, an isCliRequest-header authentication bypass in One API family systems, and server-side request forgery paths to cloud metadata services.","Cloudflare investigated an ARTEX-related incident involving a compromised account-level API token used for CI/CD, followed by the creation of Worker scripts and roughly 400 database-dump requests within an hour.","Amazon recommended that organizations change default credentials, remove and rotate exposed secrets, patch affected software, and monitor AI services for unexpected spending or unusual usage."],"insights":["The captured records indicate that stolen AI-provider keys were reportedly used to run the models that helped agents search for additional keys, creating a feedback loop in which compromised accounts could support further targeting.","AI gateways and application builders are especially high-value targets because a single exposed administrative interface can store credentials for multiple AI providers and accounts.","Cloudflare found that static CI/CD tokens with no expiration, IP restrictions, or rate limiting enabled broad account activity, including hundreds of database-dump requests in one hour.","Cloudflare’s newer API-token prefix, `cfut_`, can help secret-scanning tools identify exposed tokens, while the article also lists distinctive `artex-*` Worker-script names defenders can search for."],"referencedReports":[{"title":"Amazon Threat Intelligence Observes Threat Actors Running Cybercrime Campaigns with ARTEX AI Agents","url":"https://aws.amazon.com/blogs/security/amazon-threat-intelligence-observes-threat-actors-running-cybercrime-campaigns-with-artex-ai-agents/","publisher":"amazon-threat-intelligence","context":"Amazon's captured decoy-server records are the article's central source for the ARTEX campaigns targeting AI applications and credentials.","category":"research","primary":true},{"title":"Threat Actors Use Agentic AI Tooling to Find and Abuse Exposed Secrets","url":"https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/","publisher":"microsoft","context":"The article cites Microsoft's report that attackers used agentic tools including ARTEX to hunt GitHub for exposed credentials.","category":"research","primary":false},{"title":"When AI Infrastructure Becomes Target: Securing Gateways, Control Points","url":"https://www.microsoft.com/en-us/security/blog/2026/08/26/when-ai-infrastructure-becomes-target-securing-gateways-control-points/","publisher":"microsoft","context":"The article references Microsoft's RAGFlow case study about a hidden hook that captured AI-provider keys and a LiteLLM gateway compromise.","category":"research","primary":false},{"title":"Adapting to AI Penetration Testing Orchestrators","url":"https://blog.cloudflare.com/adapting-to-ai-penetration-testing-orchestrators/","publisher":"cloudflare","context":"The article cites Cloudflare's incident findings on ARTEX activity using a compromised API token and creating Worker scripts.","category":"research","primary":false},{"title":"FBI FLASH Alert 2026-261113","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"fbi","context":"The article cites the FBI alert stating that attackers have used ARTEX against organizations in multiple sectors since at least August.","category":"advisory","primary":false},{"title":"ARTEX and Beyond","url":"https://blog.talosintelligence.com/artex-and-beyond/","publisher":"cisco-talos","context":"The article references Cisco Talos research that provides ARTEX detection rules and links thousands of associated IP addresses.","category":"research","primary":false},{"title":"RAGFlow Server-Side Template Injection Vulnerability","url":"https://github.com/infiniflow/ragflow/security/advisories/GHSA-vvwj-fvwh-4whx","publisher":"infiniflow","context":"The article cites this security advisory for details on CVE-2026-28797, which permits logged-in users to run operating-system commands.","category":"advisory","primary":false}],"body":"\u003cp\u003eAmazon Threat Intelligence captured records from decoy AI services showing attackers’ agents searching internet-exposed AI applications, including LiteLLM, One API, and Dify, for AI-provider API keys. Amazon assessed with moderate confidence that the activity used ARTEX, an open-source AI penetration-testing tool, but said it could not verify outcomes the agents reported for systems outside its decoy network. The records suggest that working stolen keys were pooled and reportedly used to run the AI models that supported further searches for credentials.\u003c/p\u003e\n\n\u003cp\u003eThe agents’ playbook covered default administrator credentials, incomplete installations, unauthenticated settings pages, the \u003ccode\u003eisCliRequest\u003c/code\u003e authentication bypass in One API family systems, server-side request forgery routes to cloud metadata services, and exposed secrets in code and public files. Cloudflare separately reported an ARTEX-related incident involving a compromised CI/CD API token with no IP restrictions or rate limiting, followed by Worker-script creation and 400 database-dump requests in an hour. Amazon advised organizations to change default credentials, patch affected products, find and rotate exposed secrets, restrict tokens, and monitor for unusual usage or spending.\u003c/p\u003e\n"},{"n":2,"title":"New NoisyTCP vulnerability lets attackers crash Linux servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/linux/new-noisytcp-linux-kernel-flaw-lets-attackers-crash-servers/","time":"09:30","priority":"SHOULD READ","score":84,"tldr":"Researchers disclosed NoisyTCP (CVE-2026-99288), an 11-year-old Linux kernel flaw that lets unauthenticated remote attackers crash affected Linux servers by triggering a TCP race condition. A mainline kernel fix is available; organizations should patch promptly or mitigate by disabling SYN cookies or using a single RX queue if patching is not immediately possible.","briefOverview":"\u003cp\u003eResearchers disclosed NoisyTCP, tracked as CVE-2026-99288, an 11-year-old Linux kernel vulnerability affecting almost all Linux distributions. The pre-authentication remote flaw can allow attackers to crash Linux systems running Nginx, Apache, or SSH services with default configurations. It is a denial-of-service issue that causes a kernel panic and host outage, but it does not allow data modification or arbitrary code execution.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from a race condition in the kernel\u0026rsquo;s TCP networking subsystem that can access recycled socket memory before it is initialized and properly hashed, resulting in a NULL pointer dereference. Exploitation requires specifically timed packet processing across different receive contexts, and may be possible on systems with at least two RX queues or packet distribution across multiple CPUs; the researcher noted that crashing quiet bare-metal servers can take a long time. A fix has been merged into the mainline Linux kernel, while organizations unable to patch immediately can disable SYN cookies or use a single RX queue, although disabling SYN cookies reduces protection against SYN flood attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NoisyTCP, tracked as CVE-2026-99288, is an 11-year-old Linux kernel flaw that can allow unauthenticated remote attackers to crash affected systems using crafted TCP packets.","The flaw is caused by a race condition involving SYN cookie handling and socket hashing that can lead to a NULL pointer dereference and a kernel panic.","Linux systems that receive TCP packets directly and run Nginx, Apache, or an SSH server may be affected, especially systems with two or more receive queues or traffic distributed across multiple CPUs.","The reported impact is denial of service: the vulnerability can crash the host but does not allow attackers to alter data or execute arbitrary code.","A fix has been merged into the mainline Linux kernel, and temporary mitigations include disabling SYN cookies or using a single receive queue when immediate patching is not possible."],"insights":["Successful exploitation depends on a narrow timing window, so crashing a quiet bare-metal server may take a long time.","The attack requires packet processing across different receive contexts, meaning systems with two or more receive queues or traffic distributed across multiple CPUs are susceptible to the required race condition.","Disabling SYN cookies can mitigate the issue when patching is delayed, but doing so reduces the server's protection against SYN flood attacks.","The disclosed impact is limited to service disruption: the flaw crashes the operating system but does not provide data modification or arbitrary code execution."],"referencedReports":[{"title":"NoisyTCP","url":"https://github.com/V4bel/NoisyTCP#abstract","publisher":"Hyunwoo Kim","context":"The article cites the researcher's technical explanation of the packet-processing conditions required to trigger the race condition.","category":"research","primary":true},{"title":"CVE-2026-99288","url":"https://access.redhat.com/security/cve/cve-2026-99288","publisher":"Red Hat","context":"The article cites Red Hat's explanation that concurrent socket lookup, freeing, and reallocation can cause a NULL pointer dereference and system crash.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers disclosed NoisyTCP, tracked as CVE-2026-99288, an 11-year-old Linux kernel vulnerability affecting almost all Linux distributions. The pre-authentication remote flaw can allow attackers to crash Linux systems running Nginx, Apache, or SSH services with default configurations. It is a denial-of-service issue that causes a kernel panic and host outage, but it does not allow data modification or arbitrary code execution.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from a race condition in the kernel\u0026rsquo;s TCP networking subsystem that can access recycled socket memory before it is initialized and properly hashed, resulting in a NULL pointer dereference. Exploitation requires specifically timed packet processing across different receive contexts, and may be possible on systems with at least two RX queues or packet distribution across multiple CPUs; the researcher noted that crashing quiet bare-metal servers can take a long time. A fix has been merged into the mainline Linux kernel, while organizations unable to patch immediately can disable SYN cookies or use a single RX queue, although disabling SYN cookies reduces protection against SYN flood attacks.\u003c/p\u003e\n"},{"n":5,"title":"A USB worm’s second life: Retadup spreading CoffeeLoader","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/retadup-delivers-coffeeloader/121908/","time":"07:00","priority":"SHOULD READ","score":82,"tldr":"A revived Retadup USB worm infrastructure is distributing a new CoffeeLoader variant that uses an OpenGL-based Armoury packer, persistence via Run registry keys, process injection, and signed HTTPS payload downloads. The campaign has affected roughly 15,000 systems, primarily in Peru, Angola, Russia, and Bolivia.","briefOverview":"\u003cp\u003eKaspersky detected a new CoffeeLoader variant in August 2026 that is delivered through a patched 7-Zip library named 7z.dll, launched with rundll32.exe. The library contains a new version of the Armoury packer, which uses the computer’s graphics hardware through OpenGL to decrypt malicious code. The decrypted CoffeeLoader downloader combines installation, automatic-start, process-injection, and payload-download functions.\u003c/p\u003e\n\n\u003cp\u003eThe downloader copies itself into ProgramData or LocalAppData, creates a Windows Run registry entry, and attempts to prevent users from disabling that entry through Task Manager. It injects into processes including dllhost.exe, WerFault.exe, svchost.exe, OpenWith.exe, or AtBroker.exe, then downloads CoffeeLoader’s main component over HTTPS and verifies it with an embedded public key and MD5 checksum. The campaign is spread through revived Retadup worm command-and-control domains, which can issue commands to older USB-spreading Retadup infections; Kaspersky blocked attempts on around 15,000 systems in the first three quarters of 2026, mainly in Peru, Angola, Russia, and Bolivia.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detected a new CoffeeLoader variant in August 2026 that uses a patched 7-Zip library and a new Armoury packer variant to decrypt malicious code with the GPU through OpenGL.","The CoffeeLoader downloader establishes persistence by copying itself into ProgramData or LocalAppData, creating a Windows Run registry entry, and launching or injecting into processes such as dllhost.exe, WerFault.exe, svchost.exe, OpenWith.exe, or AtBroker.exe.","The downloader retrieves CoffeeLoader's main component over HTTPS from a hardcoded command-and-control server, verifies the downloaded data using an embedded public key and an MD5 checksum, and then runs the decrypted code.","CoffeeLoader is being distributed through revived Retadup command-and-control domains that issue commands to older Retadup infections, including infections spread through USB drives and shortcut files.","Kaspersky blocked Retadup infection attempts on around 15,000 systems during the first three quarters of 2026, with most detections in Peru, Angola, Russia, and Bolivia."],"insights":["Retadup systems that survived or remained active after the 2019 takedown can still accept commands in 2026 because its simple command protocol has allowed re-registered former command-and-control domains to take over communication.","The new CoffeeLoader downloader creates a StartupApproved registry entry specifically intended to prevent users from disabling its automatic start through Task Manager.","CoffeeLoader’s updated Armoury packer still uses the computer’s graphics hardware for decryption but has changed from OpenCL to OpenGL.","CoffeeLoader now verifies signed command-and-control responses with an embedded public key instead of validating the server certificate, while also checking the decrypted payload’s MD5 value.","The revived Retadup infrastructure has served more than one downstream threat: it initially delivered SmokeLoader and later began distributing CoffeeLoader."],"referencedReports":[{"title":"CoffeeLoader: A Brew of Stealthy Techniques","url":"https://www.zscaler.com/blogs/security-research/coffeeloader-brew-stealthy-techniques","publisher":"zscaler","context":"The article cites Zscaler's prior security research to note that an earlier Armoury packer variant was used in CoffeeLoader.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky detected a new CoffeeLoader variant in August 2026 that is delivered through a patched 7-Zip library named 7z.dll, launched with rundll32.exe. The library contains a new version of the Armoury packer, which uses the computer’s graphics hardware through OpenGL to decrypt malicious code. The decrypted CoffeeLoader downloader combines installation, automatic-start, process-injection, and payload-download functions.\u003c/p\u003e\n\n\u003cp\u003eThe downloader copies itself into ProgramData or LocalAppData, creates a Windows Run registry entry, and attempts to prevent users from disabling that entry through Task Manager. It injects into processes including dllhost.exe, WerFault.exe, svchost.exe, OpenWith.exe, or AtBroker.exe, then downloads CoffeeLoader’s main component over HTTPS and verifies it with an embedded public key and MD5 checksum. The campaign is spread through revived Retadup worm command-and-control domains, which can issue commands to older USB-spreading Retadup infections; Kaspersky blocked attempts on around 15,000 systems in the first three quarters of 2026, mainly in Peru, Angola, Russia, and Bolivia.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft pushes Windows emergency updates to fix activation failures","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-new-windows-emergency-updates-fix-activation-licensing-failures/","time":"08:26","priority":"SHOULD READ","score":78,"tldr":"Microsoft released emergency out-of-band updates for Windows 10, Windows 11 23H2, and Windows Server to fix activation and licensing failures introduced by November security updates, primarily affecting organizations that automate licensing with Slmgr.vbs.","briefOverview":"\u003cp\u003eMicrosoft released emergency out-of-band Windows updates to fix activation and licensing failures caused by the November 2026 security updates. The issue affects organizations that use the Slmgr.vbs command-line tool to automate Windows activation and licensing processes. Microsoft said devices that are already activated remain activated, and organizations with the correct KMS client key and configuration that do not need to run the affected commands are not expected to be affected.\u003c/p\u003e\n\n\u003cp\u003eThe emergency updates apply to Windows Server 2019, 2022, and 2025; Windows 10 Enterprise LTSC 2019 and 2021; Windows 10 22H2 ESU; and Windows 11 version 23H2. Updates for Windows Server 2025, Server 2022, Server 2019, and Windows 10 are available only through the Microsoft Update Catalog, while the Windows 11 23H2 update is also available through Optional updates in Windows Update. Microsoft said the cumulative updates also include the improvements from the November 2026 Windows security update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released emergency out-of-band Windows updates to address activation and licensing failures caused by the November security updates.","The issue affects organizations that use the Slmgr.vbs command-line tool to automate Windows activation and licensing processes.","Devices that are already activated are expected to remain activated, and customers with the appropriate KMS client key and configuration who do not run affected Slmgr.vbs commands are not expected to be affected.","The emergency updates cover Windows Server 2019, 2022, and 2025, Windows 10 21H2 and 22H2 variants, and Windows 11 version 23H2.","Most of the out-of-band updates are available only through the Microsoft Update Catalog, while the Windows 11 23H2 update is also available as an optional Windows Update."],"insights":["The activation problem is limited to organizations that need to run affected Slmgr.vbs licensing commands, rather than all Windows devices receiving the November security updates.","Already activated devices remain activated, which reduces the immediate operational impact for organizations whose licensing configuration is already in place.","Organizations using affected Windows Server or Windows 10 versions must obtain the emergency fixes through the Microsoft Update Catalog, while Windows 11 23H2 users can also install its fix through Optional updates in Windows Update.","The emergency patches are cumulative and include the November 2026 Windows security-update improvements, so organizations do not need to choose between the security fixes and the activation correction."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft released emergency out-of-band Windows updates to fix activation and licensing failures caused by the November 2026 security updates. The issue affects organizations that use the Slmgr.vbs command-line tool to automate Windows activation and licensing processes. Microsoft said devices that are already activated remain activated, and organizations with the correct KMS client key and configuration that do not need to run the affected commands are not expected to be affected.\u003c/p\u003e\n\n\u003cp\u003eThe emergency updates apply to Windows Server 2019, 2022, and 2025; Windows 10 Enterprise LTSC 2019 and 2021; Windows 10 22H2 ESU; and Windows 11 version 23H2. Updates for Windows Server 2025, Server 2022, Server 2019, and Windows 10 are available only through the Microsoft Update Catalog, while the Windows 11 23H2 update is also available through Optional updates in Windows Update. Microsoft said the cumulative updates also include the improvements from the November 2026 Windows security update.\u003c/p\u003e\n"},{"n":6,"title":"Health-ISAC Daily Cyber Headlines – November 16, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-16-2026/","time":"09:13","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 16, 2026 roundup highlights active exploitation of a Check Point zero-day alongside an Apify breach, ARTEX-enabled attacks, Windows and Linux flaws, proposed HIPAA Privacy Rule changes, and growing cyber incidents in Singapore’s health sector.","briefOverview":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 16, 2026 covers active exploitation of a Check Point zero-day. The roundup also includes an Apify breach and ARTEX-enabled attacks. It identifies Windows and Linux vulnerabilities as additional topics.\u003c/p\u003e\n\n\u003cp\u003eThe article covers proposed changes to the HIPAA Privacy Rule. It also reports rising cyber incidents affecting Singapore’s health sector. Related resources listed with the roundup include coverage of ransomware, AI adversaries, autonomous medical robots, industrialized cybercrime, and a cyberattack targeting France’s blood supply.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 16, 2026 daily headlines cover active exploitation of a Check Point zero-day.","The roundup includes an Apify breach and ARTEX-enabled attacks.","The article addresses Windows and Linux vulnerabilities.","It covers proposed changes to the HIPAA Privacy Rule.","The roundup reports rising cyber incidents affecting Singapore’s health sector."],"insights":["The roundup brings together technical security issues, including an actively exploited zero-day and operating-system vulnerabilities, with policy developments involving the HIPAA Privacy Rule.","Singapore’s health sector is specifically identified as experiencing rising cyber incidents, indicating that the daily headlines cover impacts beyond the United States."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 16, 2026 covers active exploitation of a Check Point zero-day. The roundup also includes an Apify breach and ARTEX-enabled attacks. It identifies Windows and Linux vulnerabilities as additional topics.\u003c/p\u003e\n\n\u003cp\u003eThe article covers proposed changes to the HIPAA Privacy Rule. It also reports rising cyber incidents affecting Singapore’s health sector. Related resources listed with the roundup include coverage of ransomware, AI adversaries, autonomous medical robots, industrialized cybercrime, and a cyberattack targeting France’s blood supply.\u003c/p\u003e\n"}]</script>
