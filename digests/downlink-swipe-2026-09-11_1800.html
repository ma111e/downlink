<script type="application/json" id="dl-articles">[{"n":2,"title":"Hackers abused Claude to extract secrets from 1.8M Android apps","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abused-claude-to-extract-secrets-from-18m-android-apps/","time":"20:19","priority":"SHOULD READ","score":88,"tldr":"Anthropic says threat actors including ShinyHunters, Russia-linked Midnight Blizzard, and China-linked GTG-10007 abused Claude to automate credential theft, reconnaissance, malware development, and intrusions. One ShinyHunters-linked actor reportedly scanned 1.8 million Android apps for hardcoded secrets, while Anthropic banned the accounts and strengthened misuse detection.","briefOverview":"\u003cp\u003eAnthropic reported that criminal and state-linked threat groups abused its Claude AI model between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation. The company said it disrupted the activity, banned involved accounts, updated safeguards, added faster misuse detection, and contacted authorities, industry partners, and victims. The reported actors included suspected ShinyHunters affiliates, Russia-linked Midnight Blizzard, and a Chinese-speaking group tracked as GTG-10007.\u003c/p\u003e\n\n\u003cp\u003eA suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android apps for hardcoded secrets using TruffleHog, sending verified results to a Telegram group. Anthropic also said a ShinyHunters-linked actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in about 34 hours, with AI agents doing nearly all of the work. Midnight Blizzard used Claude throughout operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities, while GTG-10007 used it for coordinated intrusion, research, exploit-development, malware, and intelligence-collection work affecting organizations worldwide.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic reported that multiple criminal and state-linked groups abused Claude between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation.","A suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android APKs for hardcoded secrets using TruffleHog.","Anthropic said a suspected ShinyHunters actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in approximately 34 hours.","Russia-linked Midnight Blizzard used Claude across malware development, phishing, infrastructure acquisition, persistence, command-and-control, and data theft operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities.","Anthropic said it disrupted the actors’ Claude activity, banned their accounts, adjusted guardrails, added faster misuse-detection measures, and contacted authorities, industry partners, and victims."],"insights":["The ShinyHunters-linked credential pipeline did more than find exposed secrets: verified results were sent in real time to a Telegram group organized into more than 100 source types, creating a structured route from discovery to use.","Anthropic reported that one actor moved from a single stolen developer token to full administrative control in less than three hours, underscoring how quickly an initial credential can lead to broad access.","Midnight Blizzard reportedly used a feedback loop that rebuilt malware when security products detected it, allowing its malicious software to be repeatedly altered in response to detection.","GTG-10007 ran automated research for previously unknown flaws while its human operators were away and used resulting working code against government organizations worldwide."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"The article relies on Anthropic's threat intelligence report for its account of Claude misuse by criminal and state-linked threat groups.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic reported that criminal and state-linked threat groups abused its Claude AI model between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation. The company said it disrupted the activity, banned involved accounts, updated safeguards, added faster misuse detection, and contacted authorities, industry partners, and victims. The reported actors included suspected ShinyHunters affiliates, Russia-linked Midnight Blizzard, and a Chinese-speaking group tracked as GTG-10007.\u003c/p\u003e\n\n\u003cp\u003eA suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android apps for hardcoded secrets using TruffleHog, sending verified results to a Telegram group. Anthropic also said a ShinyHunters-linked actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in about 34 hours, with AI agents doing nearly all of the work. Midnight Blizzard used Claude throughout operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities, while GTG-10007 used it for coordinated intrusion, research, exploit-development, malware, and intelligence-collection work affecting organizations worldwide.\u003c/p\u003e\n"},{"n":1,"title":"Florida confirms DMV database breached via stolen police account","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/florida-confirms-dmv-database-breached-via-stolen-police-account/","time":"19:00","priority":"SHOULD READ","score":84,"tldr":"Florida confirmed that its DAVID driver-record database was breached after attackers used compromised credentials from a Plant City Police Department account stored on an employee’s personal device. ShinyHunters claims it stole over 200,000 records, though the state has not confirmed the number affected.","briefOverview":"\u003cp\u003eThe Florida Department of Highway Safety and Motor Vehicles (FLHSMV) confirmed that its DAVID driver database was breached by an international cybercriminal organization. FLHSMV said it learned of the breach on September 4, 2026, quickly mitigated it, and found no ongoing access. The agency has notified the Florida Office of the Attorney General and is working with the Florida Digital Service and Florida Department of Law Enforcement.\u003c/p\u003e\n\n\u003cp\u003eAccording to FLHSMV, the attacker used compromised credentials belonging to a Plant City Police Department user that had been improperly stored on the employee’s personal electronic device. ShinyHunters had separately claimed it exploited a password-reset flaw to access multiple DAVID accounts and then iterated through record IDs to download associated pages and images. The group claimed it stole more than 200,000 driver records and shared a screenshot of Jeffrey Epstein’s record as proof, but Florida has not confirmed the number of records accessed or taken.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Florida Department of Highway Safety and Motor Vehicles confirmed that its DAVID driver database was breached by an international cybercriminal organization.","Florida said the attacker used compromised credentials from a Plant City Police Department user that had been improperly stored on the employee’s personal electronic device.","The agency said the breach was quickly mitigated and that no further breach is occurring or ongoing.","ShinyHunters claimed it accessed DAVID through a password-reset flaw, downloaded records beginning September 3, and stole more than 200,000 driver records.","Florida has not confirmed how many records were accessed or stolen and is working with state law-enforcement and digital-service agencies on the response."],"insights":["Florida’s account attributes the incident to one compromised police-user account stored on a personal device, while ShinyHunters claimed it accessed multiple accounts through a password-reset weakness; the article does not resolve this discrepancy.","ShinyHunters said it collected records by moving through DAVID record identification numbers and downloading the related pages and images, indicating that access to individual records could be repeated at scale once system access was obtained.","The group used a screenshot of Jeffrey Epstein’s DAVID record as evidence of access, and the screenshot reportedly included sensitive personal and vehicle information.","Although ShinyHunters claimed more than 200,000 driver records were taken, Florida has confirmed neither that figure nor the total number of records accessed."],"referencedReports":[],"body":"\u003cp\u003eThe Florida Department of Highway Safety and Motor Vehicles (FLHSMV) confirmed that its DAVID driver database was breached by an international cybercriminal organization. FLHSMV said it learned of the breach on September 4, 2026, quickly mitigated it, and found no ongoing access. The agency has notified the Florida Office of the Attorney General and is working with the Florida Digital Service and Florida Department of Law Enforcement.\u003c/p\u003e\n\n\u003cp\u003eAccording to FLHSMV, the attacker used compromised credentials belonging to a Plant City Police Department user that had been improperly stored on the employee’s personal electronic device. ShinyHunters had separately claimed it exploited a password-reset flaw to access multiple DAVID accounts and then iterated through record IDs to download associated pages and images. The group claimed it stole more than 200,000 driver records and shared a screenshot of Jeffrey Epstein’s record as proof, but Florida has not confirmed the number of records accessed or taken.\u003c/p\u003e\n"},{"n":3,"title":"Florida says motor vehicle data breach tied to credentials stolen from officer’s personal device","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/florida-shiny-hunters-motor-vehicle","time":"20:00","priority":"SHOULD READ","score":84,"tldr":"Florida’s motor vehicle agency confirmed that ShinyHunters accessed its records using credentials stolen from a Plant City police employee’s personal device. The state is investigating the September 4 incident with the Florida Digital Service and has notified other government offices.","briefOverview":"\u003cp\u003eFlorida’s Department of Highway Safety and Motor Vehicles confirmed a data breach after credentials belonging to a Plant City Police Department user were stolen from the employee’s personal device. Officials said they learned of the incident on September 4 and determined that an international cybercriminal organization used the improperly stored credentials to access the department’s systems. The ShinyHunters group had claimed responsibility earlier in the week.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters shared alleged images of a DMV record associated with Jeffrey Epstein as evidence of its access. FLHSMV has notified other Florida government offices and is working with the Florida Digital Service on the investigation. The incident initially prompted speculation about a possible link to the separate IDScan breach involving 153 million driver’s licenses, while Anthropic and Google incident responders have reported that ShinyHunters members use AI tools during different stages of their intrusions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Florida’s Department of Highway Safety and Motor Vehicles confirmed that its motor vehicle data breach resulted from credentials belonging to a Plant City Police Department user that were improperly stored on the employee’s personal device.","Florida officials said they learned of the breach on September 4 and attributed it to an unnamed international cybercriminal organization.","ShinyHunters claimed access to Florida motor vehicle data and shared alleged images of a DMV record associated with Jeffrey Epstein as proof.","FLHSMV notified other Florida government offices and is working with the Florida Digital Service to investigate the incident.","Anthropic reported that suspected ShinyHunters affiliates used AI tools to find credentials, map unfamiliar systems, and steal victim data for extortion."],"insights":["A single police department user’s credentials, stored improperly on a personal device, were enough to give a criminal actor access to Florida motor vehicle data.","The alleged DMV record posted by ShinyHunters illustrates that the group sought to publicly demonstrate access to specific individual records, not merely claim a breach.","Anthropic reported that suspected ShinyHunters affiliates used AI tools across multiple stages of intrusions, including finding credentials and mapping systems; in one cited case, an operator reached full cloud administrative access in about three hours.","The Florida incident initially drew attention because some experts considered a possible connection to the separate IDScan leak involving 153 million driver’s licenses."],"referencedReports":[{"title":"Anthropic report on suspected ShinyHunters affiliates using Claude","url":"https://therecord.media/anthropic-russia-hackers-claude","publisher":"Anthropic","context":"The article cites Anthropic’s report describing suspected ShinyHunters affiliates using AI tools to find credentials, map systems, and steal data for extortion.","category":"research","primary":false}],"body":"\u003cp\u003eFlorida’s Department of Highway Safety and Motor Vehicles confirmed a data breach after credentials belonging to a Plant City Police Department user were stolen from the employee’s personal device. Officials said they learned of the incident on September 4 and determined that an international cybercriminal organization used the improperly stored credentials to access the department’s systems. The ShinyHunters group had claimed responsibility earlier in the week.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters shared alleged images of a DMV record associated with Jeffrey Epstein as evidence of its access. FLHSMV has notified other Florida government offices and is working with the Florida Digital Service on the investigation. The incident initially prompted speculation about a possible link to the separate IDScan breach involving 153 million driver’s licenses, while Anthropic and Google incident responders have reported that ShinyHunters members use AI tools during different stages of their intrusions.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft sees some new wrinkles in invoice-scam emails","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/invoice-scam-emails-new-features-microsoft-researchers","time":"18:40","priority":"SHOULD READ","score":80,"tldr":"Microsoft observed a million-plus-email invoice-fraud campaign that impersonated executives and ServiceNow, combining fabricated email threads, invoices, and vendor branding to push roughly $50,000 payments. The campaign shows how attackers may use AI-assisted templates to make business email compromise scams more convincing and scalable.","briefOverview":"\u003cp\u003eMicrosoft researchers identified an early-August invoice-fraud email campaign comprising more than one million messages. The attackers impersonated senior executives and ServiceNow, targeting accounts-payable departments with fraudulent payment requests of nearly $50,000. About 88% of the campaign’s targets were in the United States.\u003c/p\u003e\n\n\u003cp\u003eThe messages used fabricated forwarded email threads, fake invoices, executive impersonation, and ServiceNow branding to create a convincing narrative. Microsoft said the campaign showed indicators consistent with AI-assisted template development, including extensive HTML comments, structured section labels, and highly uniform templates. However, Microsoft said it could not independently establish the extent to which AI generated the campaign content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft researchers identified an early-August campaign containing more than one million fraudulent emails, with about 88% of targets in the United States.","The emails impersonated senior company executives and ServiceNow, directing accounts payable departments to make fraudulent payments of nearly $50,000.","The campaign used fabricated forwarded email threads, invoices, executive impersonation, and vendor branding to make payment requests appear legitimate.","Microsoft found signs consistent with AI-assisted template development, including extensive HTML comments, structured section labels, and highly uniform templates.","Microsoft said it could not independently determine how much AI generated the campaign content."],"insights":["The campaign did not rely on a single fake payment request; it built a supporting story with a purported CEO, a branded vendor, invoices, and fabricated email history to reduce suspicion.","Attackers used several third-party services to send the messages, while directing accounts-payable staff toward payments close to $50,000.","Although the templates showed features consistent with AI assistance, Microsoft explicitly said it could not independently establish how much of the content was generated by AI.","The campaign’s scale was concentrated geographically, with approximately 88% of its targets located in the United States."],"referencedReports":[{"title":"Protecting organizations from AI-assisted executive impersonation and invoice fraud","url":"https://www.microsoft.com/en-us/security/blog/2026/09/10/protecting-organizations-ai-assisted-executive-impersonation-invoice-fraud/","publisher":"microsoft","context":"The article relies on Microsoft researchers' analysis of a large invoice-fraud email campaign and its indicators of possible AI-assisted template development.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft researchers identified an early-August invoice-fraud email campaign comprising more than one million messages. The attackers impersonated senior executives and ServiceNow, targeting accounts-payable departments with fraudulent payment requests of nearly $50,000. About 88% of the campaign’s targets were in the United States.\u003c/p\u003e\n\n\u003cp\u003eThe messages used fabricated forwarded email threads, fake invoices, executive impersonation, and ServiceNow branding to create a convincing narrative. Microsoft said the campaign showed indicators consistent with AI-assisted template development, including extensive HTML comments, structured section labels, and highly uniform templates. However, Microsoft said it could not independently establish the extent to which AI generated the campaign content.\u003c/p\u003e\n"}]</script>
