<script type="application/json" id="dl-articles">[{"n":7,"title":"Cisco warns of max severity ISE zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-identity-service-engine-zero-day-exploited-in-attacks/","time":"07:20","priority":"MUST READ","score":98,"tldr":"Cisco is urging customers to immediately patch the maximum-severity Cisco ISE and ISE-PIC authentication-bypass flaw CVE-2026-76460, which is being actively exploited. No workaround exists, and suspected compromise warrants log review, node reimaging, and restoration from backups.","briefOverview":"\u003cp\u003eCisco released security updates for CVE-2026-76460, a maximum-severity flaw affecting Cisco Identity Services Engine (ISE) and Cisco ISE Passive Identity Connector (ISE-PIC). Cisco says its PSIRT is aware of active exploitation of the issue. The flaw stems from insufficient authentication controls on an API endpoint and can let remote attackers bypass the web-based management interface to gain unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eNo workaround is available, so Cisco strongly recommends upgrading to fixed releases: ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4. Cisco advised administrators to check access logs on every node for suspicious usernames and, if malicious activity is suspected, reimage nodes and restore them from backups. The company also recommends reviewing firewall and network logs for suspicious transfers, because attackers may remove evidence after obtaining root-level command execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco released security updates for CVE-2026-76460, a maximum-severity authentication-bypass flaw affecting Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC).","Cisco says CVE-2026-76460 is being actively exploited and can allow a remote attacker to gain unauthorized access by sending a crafted request to an affected API endpoint.","No workaround is available, so Cisco recommends upgrading to fixed releases, including ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4.","Cisco advised administrators to review access logs for suspicious usernames and to reimage affected nodes and restore backups if malicious activity is suspected.","CISA added CVE-2026-76460 to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to patch affected systems within three days."],"insights":["The authentication bypass affects Cisco ISE and ISE-PIC regardless of configuration, meaning organizations cannot rely on a particular setup to avoid exposure.","Cisco warned that attackers may erase evidence after gaining root-level command execution, so administrators should examine firewall and network logs for suspicious transfers to or from external or malicious IP addresses in addition to checking access logs.","If malicious activity is suspected, Cisco strongly recommends rebuilding affected nodes from scratch and restoring them from backups rather than relying only on cleanup.","CISA required U.S. federal agencies to patch within three days after adding CVE-2026-76460 to its Known Exploited Vulnerabilities Catalog, underscoring the urgency of the active exploitation warning."],"referencedReports":[{"title":"Cisco Identity Services Engine and Cisco ISE Passive Identity Connector Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5","publisher":"cisco","context":"Cisco's security advisory explains that insufficient authentication controls on an API endpoint enable the actively exploited CVE-2026-76460 authentication bypass.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing that CVE-2026-76460 was added to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco released security updates for CVE-2026-76460, a maximum-severity flaw affecting Cisco Identity Services Engine (ISE) and Cisco ISE Passive Identity Connector (ISE-PIC). Cisco says its PSIRT is aware of active exploitation of the issue. The flaw stems from insufficient authentication controls on an API endpoint and can let remote attackers bypass the web-based management interface to gain unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eNo workaround is available, so Cisco strongly recommends upgrading to fixed releases: ISE 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, or 3.5 Patch 4. Cisco advised administrators to check access logs on every node for suspicious usernames and, if malicious activity is suspected, reimage nodes and restore them from backups. The company also recommends reviewing firewall and network logs for suspicious transfers, because attackers may remove evidence after obtaining root-level command execution.\u003c/p\u003e\n"},{"n":16,"title":"Cisco Warns of New Zero-Day ISE Auth Bypass (CVSS 10.0) Exploited in Active Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-warns-of-new-zero-day-ise-auth.html","time":"06:39","priority":"MUST READ","score":98,"tldr":"Cisco is urging immediate patching of CVE-2026-76460, a CVSS 10.0 unauthenticated authentication-bypass flaw in Identity Services Engine and ISE-PIC that is being actively exploited and can lead to root-level command execution.","briefOverview":"\u003cp\u003eCisco has warned that CVE-2026-76460, a maximum-severity authentication-bypass flaw in Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC), is being actively exploited. The CVSS 10.0 issue stems from insufficient authentication controls on an API endpoint, allowing an unauthenticated remote attacker to send a crafted request and bypass the web-based management interface. Cisco said successful exploitation may enable root-level command execution and allow attackers to remove or hide evidence of their activity.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects ISE and ISE-PIC regardless of configuration, and Cisco released patches for supported versions from ISE 3.1 through 3.5. Cisco recommends reviewing the \u003ccode\u003eise-kong/access.log\u003c/code\u003e file for the suspicious username \u003ccode\u003edummyuser\u003c/code\u003e, checking every node in distributed deployments, and re-imaging affected nodes if malicious activity is found. There are no workarounds, although Cisco recommends restricting management and control-plane traffic with infrastructure access control lists; CISA also added the flaw to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian agencies to patch by September 19, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco disclosed CVE-2026-76460, a CVSS 10.0 flaw in Cisco Identity Services Engine and ISE Passive Identity Connector that allows an unauthenticated remote attacker to bypass authentication through a crafted API request.","Cisco stated that CVE-2026-76460 is being actively exploited and warned that successful exploitation may give attackers root-level command execution.","Cisco released fixes for affected ISE versions 3.1 through 3.5, with fixed releases including 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, and 3.5 Patch 4.","Cisco said there are no workarounds, but customers can restrict management and control-plane traffic with infrastructure access control lists while applying updates.","CISA added CVE-2026-76460 to its Known Exploited Vulnerabilities catalog on September 16, 2026, and required Federal Civilian Executive Branch agencies to patch it by September 19, 2026."],"insights":["The affected Cisco ISE and ISE-PIC systems are vulnerable regardless of their configuration, so administrators cannot rely on a particular setup to avoid exposure.","Cisco recommends checking each node in distributed deployments for the username \"dummyuser\" in the ise-kong/access.log file, because its presence likely indicates malicious activity.","Because successful compromise may grant root-level control, Cisco warns that attackers may be able to remove or conceal evidence of their activity; affected nodes should be re-imaged and restored from configuration backups if compromise is detected.","The disclosure coincides with Cisco issuing 77 new CVEs, including numerous critical flaws affecting ISE and Secure Firewall products, creating a broader urgent patching workload for Cisco customers."],"referencedReports":[{"title":"Cisco Security Advisory for CVE-2026-76460","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5","publisher":"cisco","context":"Cisco's advisory describes the actively exploited authentication-bypass flaw affecting Cisco ISE and ISE-PIC.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's addition of CVE-2026-76460 to the Known Exploited Vulnerabilities catalog and its federal patch deadline.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco has warned that CVE-2026-76460, a maximum-severity authentication-bypass flaw in Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC), is being actively exploited. The CVSS 10.0 issue stems from insufficient authentication controls on an API endpoint, allowing an unauthenticated remote attacker to send a crafted request and bypass the web-based management interface. Cisco said successful exploitation may enable root-level command execution and allow attackers to remove or hide evidence of their activity.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects ISE and ISE-PIC regardless of configuration, and Cisco released patches for supported versions from ISE 3.1 through 3.5. Cisco recommends reviewing the \u003ccode\u003eise-kong/access.log\u003c/code\u003e file for the suspicious username \u003ccode\u003edummyuser\u003c/code\u003e, checking every node in distributed deployments, and re-imaging affected nodes if malicious activity is found. There are no workarounds, although Cisco recommends restricting management and control-plane traffic with infrastructure access control lists; CISA also added the flaw to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian agencies to patch by September 19, 2026.\u003c/p\u003e\n"},{"n":2,"title":"Brevo supply-chain attack injected ClickFix scripts on customer sites","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/brevo-supply-chain-attack-injected-clickfix-scripts-on-customer-sites/","time":"17:11","priority":"MUST READ","score":94,"tldr":"Attackers used a stolen, hardcoded Cloudflare API key to deploy an edge Worker that injected ClickFix malware lures into Brevo sites and scripts embedded by up to 100,000 customer websites. Logged-in WordPress administrators were also targeted with a persistent backdoor plugin, so affected site owners should inspect plugins installed on September 14 and rotate admin credentials.","briefOverview":"\u003cp\u003eBrevo confirmed that attackers used a stolen Cloudflare API key to deploy a malicious Cloudflare Worker that injected ClickFix scripts into Brevo websites and JavaScript embedded on customer sites. The Worker modified content at Cloudflare\u0026rsquo;s edge for approximately five and a half hours on September 14, affecting brevo.com, sendinblue.com, Brevo account-related pages, sibforms.com, and Brevo Forms, Conversations, and SDK loader scripts. Sansec, which first reported the incident, estimated that as many as 100,000 websites using affected Brevo components may have been exposed.\u003c/p\u003e\n\n\u003cp\u003eThe long-lived key had been hardcoded in application source code and had full account permissions, allowing attackers to create Workers, routes, and DNS records across Brevo\u0026rsquo;s zones without an alert. Because the Worker altered responses at the edge and removed Content-Security-Policy headers, Brevo\u0026rsquo;s origin files remained unchanged and normal integrity checks did not identify the modification. Visitors were shown fake Cloudflare verification pages that instructed Windows users to run a command, while WordPress administrators visiting affected sites could be targeted with a hidden, persistent backdoor plugin disguised as Web Media Optimizer.\u003c/p\u003e\n\n\u003cp\u003eBrevo removed the Worker and its routes, revoked the compromised key and credentials created with it, removed the hardcoded key from source code, deleted attacker-controlled hostnames, and purged edge caches. It said app.brevo.com, its API, email delivery infrastructure, and customer account data were not affected. WordPress administrators who visited an affected site while logged in on September 14 were advised to check for unusual plugins installed or activated that day, remove them, and rotate administrator passwords if one is found.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Brevo said attackers used a stolen, long-lived Cloudflare API key that was hardcoded in source code to create a malicious Cloudflare Worker with full account permissions.","The Worker altered Brevo web pages and customer-embedded Brevo Forms, Conversations, and SDK loader scripts at the CDN edge for approximately five and a half hours on September 14.","Visitors to affected websites were shown a fake Cloudflare verification page with ClickFix instructions urging Windows users to run a command.","On WordPress sites using an affected Brevo widget, the malicious script checked for logged-in administrators and attempted to install a backdoored plugin disguised as Web Media Optimizer.","Brevo said its app, API, email-delivery infrastructure, and customer account data were not affected, and it revoked the compromised key, removed attacker-controlled infrastructure, and purged edge caches."],"insights":["Because the malicious Cloudflare Worker changed content at the network edge rather than altering Brevo's origin files, standard file-integrity checks did not detect the compromise, and the Worker removed browser security restrictions that could have limited the injected content.","The WordPress payload was designed for persistence: it hid from the plugin list, copied itself into WordPress's must-use plugin directory, retained a backup malicious script address, and periodically contacted an attacker-controlled server.","The malicious WordPress plugin included a hardcoded authentication key that could let attackers create a valid administrator login session without knowing an administrator's password.","Brevo's exposed credential had full account permissions and was long-lived, allowing attackers to create Workers, routes, and DNS records across Brevo's zones without triggering an alert."],"referencedReports":[{"title":"Brevo supply-chain attack","url":"http://sansec.io/research/brevo-supply-chain-attack","publisher":"sansec","context":"Sansec first reported the incident and estimated that up to 100,000 websites using affected Brevo components may have been impacted.","category":"research","primary":true}],"body":"\u003cp\u003eBrevo confirmed that attackers used a stolen Cloudflare API key to deploy a malicious Cloudflare Worker that injected ClickFix scripts into Brevo websites and JavaScript embedded on customer sites. The Worker modified content at Cloudflare\u0026rsquo;s edge for approximately five and a half hours on September 14, affecting brevo.com, sendinblue.com, Brevo account-related pages, sibforms.com, and Brevo Forms, Conversations, and SDK loader scripts. Sansec, which first reported the incident, estimated that as many as 100,000 websites using affected Brevo components may have been exposed.\u003c/p\u003e\n\n\u003cp\u003eThe long-lived key had been hardcoded in application source code and had full account permissions, allowing attackers to create Workers, routes, and DNS records across Brevo\u0026rsquo;s zones without an alert. Because the Worker altered responses at the edge and removed Content-Security-Policy headers, Brevo\u0026rsquo;s origin files remained unchanged and normal integrity checks did not identify the modification. Visitors were shown fake Cloudflare verification pages that instructed Windows users to run a command, while WordPress administrators visiting affected sites could be targeted with a hidden, persistent backdoor plugin disguised as Web Media Optimizer.\u003c/p\u003e\n\n\u003cp\u003eBrevo removed the Worker and its routes, revoked the compromised key and credentials created with it, removed the hardcoded key from source code, deleted attacker-controlled hostnames, and purged edge caches. It said app.brevo.com, its API, email delivery infrastructure, and customer account data were not affected. WordPress administrators who visited an affected site while logged in on September 14 were advised to check for unusual plugins installed or activated that day, remove them, and rotate administrator passwords if one is found.\u003c/p\u003e\n"},{"n":19,"title":"Critical Unbound DNSSEC Validator Flaw Could Allow RCE via a Malicious DNS Zone","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/critical-unbound-dnssec-validator-flaw.html","time":"12:30","priority":"SHOULD READ","score":89,"tldr":"NLnet Labs released Unbound 1.26.1 to fix a critical DNSSEC validator heap overflow (CVE-2026-81642) affecting all earlier versions that a malicious DNS zone could potentially exploit for remote code execution. Administrators should upgrade or apply the available patches immediately.","briefOverview":"\u003cp\u003eNLnet Labs released Unbound 1.26.1 to address CVE-2026-81642, a critical heap overflow in the DNSSEC validator affecting every Unbound release through 1.26.0. An attacker who controls a malicious DNS zone and queries a vulnerable resolver can trigger the flaw, causing denial of service and potentially remote code execution. NLnet Labs said the overflow occurs while the validator processes a DNSKEY record whose owner name is a compression pointer into the record\u0026rsquo;s own data.\u003c/p\u003e\n\n\u003cp\u003eThe release also fixes eight additional issues, including CVE-2026-82717, a heap-corruption flaw in CNAME synthesis that can potentially allow code execution under certain systems and compilation options. NLnet Labs has not reported exploitation of either code-execution issue, and CISA listed exploitation of CVE-2026-81642 as none on Wednesday. Administrators can upgrade to Unbound 1.26.1 or use standalone source patches for the critical issue and CVE-2026-82717, or a combined patch covering all nine fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NLnet Labs released Unbound 1.26.1 to fix CVE-2026-81642, a critical heap overflow in the DNSSEC validator affecting every Unbound release through version 1.26.0.","An attacker controlling a malicious DNS zone can trigger CVE-2026-81642 by querying a vulnerable resolver, causing denial of service and potentially remote code execution.","Unbound 1.26.1 also fixes eight other flaws, including CVE-2026-82717, a CNAME synthesis heap-corruption issue that may permit code execution under certain systems and compilation options.","NLnet Labs provides standalone source patches for CVE-2026-81642 and CVE-2026-82717 as well as a combined patch covering all nine fixes.","NLnet Labs reported no known exploitation of either code-execution issue, and CISA listed exploitation of CVE-2026-81642 as none on Wednesday."],"insights":["The issue affects not only older Unbound releases but also versions 1.25.2 and 1.26.0, while the May fix for the separate critical CVE-2026-33278 does not address this flaw.","NLnet Labs has not stated whether Unbound installations with DNSSEC validation disabled are affected, despite listing no configuration condition for the vulnerable version range.","The 1.26.1 release changes the default for val-clean-additional so that Unbound no longer validates DNSSEC data in a response's additional section by default.","For organizations unable to upgrade, NLnet Labs says the standalone patches for CVE-2026-81642 and CVE-2026-82717 were tested on Unbound 1.26.0, and a combined patch is available for all nine fixes."],"referencedReports":[{"title":"Unbound Security Advisories","url":"https://nlnetlabs.nl/projects/unbound/security-advisories/","publisher":"nlnet-labs","context":"The article cites NLnet Labs' advisory for details of the critical Unbound DNSSEC validator flaw and the release of fixes.","category":"advisory","primary":true}],"body":"\u003cp\u003eNLnet Labs released Unbound 1.26.1 to address CVE-2026-81642, a critical heap overflow in the DNSSEC validator affecting every Unbound release through 1.26.0. An attacker who controls a malicious DNS zone and queries a vulnerable resolver can trigger the flaw, causing denial of service and potentially remote code execution. NLnet Labs said the overflow occurs while the validator processes a DNSKEY record whose owner name is a compression pointer into the record\u0026rsquo;s own data.\u003c/p\u003e\n\n\u003cp\u003eThe release also fixes eight additional issues, including CVE-2026-82717, a heap-corruption flaw in CNAME synthesis that can potentially allow code execution under certain systems and compilation options. NLnet Labs has not reported exploitation of either code-execution issue, and CISA listed exploitation of CVE-2026-81642 as none on Wednesday. Administrators can upgrade to Unbound 1.26.1 or use standalone source patches for the critical issue and CVE-2026-82717, or a combined patch covering all nine fixes.\u003c/p\u003e\n"},{"n":36,"title":"PolinRider Spreads Through Compromised GitHub Accounts and Packagist","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/polinrider-github-packagist?utm_medium=feed","time":"15:33","priority":"SHOULD READ","score":88,"tldr":"The North Korea-linked PolinRider campaign compromised the Visanduma GitHub organization and inserted malware into development branches of the widely downloaded Packagist package visanduma/nova-two-factor. Developers who clone, open, build, or test affected repositories may trigger payloads that steal credentials and cryptocurrency, so organizations should avoid the affected dev branches and investigate potentially exposed endpoints.","briefOverview":"\u003cp\u003eSocket researchers identified malicious code in development branches of \u003ccode\u003evisanduma/nova-two-factor\u003c/code\u003e, a Packagist package with more than 700,000 cumulative downloads. The malicious code was found in \u003ccode\u003edev-*\u003c/code\u003e versions, including \u003ccode\u003edev-main\u003c/code\u003e, while no stable malicious release had been identified at the time of writing. The article attributes the activity to the ongoing North Korea-linked PolinRider campaign and says Visanduma GitHub repositories appear to have been compromised since mid-June 2026 through the LaHiRu developer account.\u003c/p\u003e\n\n\u003cp\u003ePolinRider spreads through compromised developer accounts and Git repositories, using force-pushed history, hidden JavaScript in configuration or apparent \u003ccode\u003e.woff2\u003c/code\u003e font files, and automatic execution when repositories are opened or built. Researchers also found a variation that embeds obfuscated JavaScript in \u003ccode\u003eindex.php\u003c/code\u003e and runs it through PHP\u0026rsquo;s \u003ccode\u003eshell_exec\u003c/code\u003e function. The article warns that repository cleanup does not prove affected developer workstations or CI environments are safe, because systems that executed later-stage payloads may remain compromised and expose cryptocurrency wallets, credentials, source code, and other data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket researchers found malicious code in the dev-* branches of the Packagist package visanduma/nova-two-factor, while no malicious stable release had been identified at the time of writing.","The PolinRider campaign compromised Visanduma GitHub repositories through the LaHiRu developer account and has apparently affected the organization since mid-June 2026.","PolinRider hides JavaScript in configuration files or files presented as .woff2 fonts and can trigger it when developers build, test, clone, or open repositories in compatible IDEs.","Researchers identified a newer variation that places obfuscated JavaScript in index.php and uses PHP's shell_exec function to launch the infection chain.","The article advises organizations to avoid the affected development branches, audit repository history and automatic execution settings, and treat systems that executed affected code as potentially compromised."],"insights":["The malicious code appeared only in development branches of visanduma/nova-two-factor, showing that developers who install directly from dev branches can face risk even when stable releases remain clean.","PolinRider uses compromised source-code accounts and repositories as its main route of spread, with package registries serving as an additional channel when repository code is resolved or released.","Force-pushed Git history, private repositories, and later-cleaned repositories make public code searches insufficient for measuring the campaign’s full reach.","Cleaning malicious code from a repository does not confirm that developer workstations or CI environments are safe, because later-stage payloads may persist independently on systems that executed the code."],"referencedReports":[],"body":"\u003cp\u003eSocket researchers identified malicious code in development branches of \u003ccode\u003evisanduma/nova-two-factor\u003c/code\u003e, a Packagist package with more than 700,000 cumulative downloads. The malicious code was found in \u003ccode\u003edev-*\u003c/code\u003e versions, including \u003ccode\u003edev-main\u003c/code\u003e, while no stable malicious release had been identified at the time of writing. The article attributes the activity to the ongoing North Korea-linked PolinRider campaign and says Visanduma GitHub repositories appear to have been compromised since mid-June 2026 through the LaHiRu developer account.\u003c/p\u003e\n\n\u003cp\u003ePolinRider spreads through compromised developer accounts and Git repositories, using force-pushed history, hidden JavaScript in configuration or apparent \u003ccode\u003e.woff2\u003c/code\u003e font files, and automatic execution when repositories are opened or built. Researchers also found a variation that embeds obfuscated JavaScript in \u003ccode\u003eindex.php\u003c/code\u003e and runs it through PHP\u0026rsquo;s \u003ccode\u003eshell_exec\u003c/code\u003e function. The article warns that repository cleanup does not prove affected developer workstations or CI environments are safe, because systems that executed later-stage payloads may remain compromised and expose cryptocurrency wallets, credentials, source code, and other data.\u003c/p\u003e\n"},{"n":23,"title":"Gyazo Breach Exposes 23.62 Million User Records and 490 Million Image Metadata Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/gyazo-breach-exposes-2362-million-user.html","time":"07:30","priority":"SHOULD READ","score":87,"tldr":"Gyazo disclosed that an attacker exploited its image-upload server to access about 23.62 million user records and metadata for roughly 490 million images, potentially exposing image URLs and sensitive metadata. Users should reset Gyazo passwords, avoid password reuse, and watch for phishing messages.","briefOverview":"\u003cp\u003eHelpfeel said an attacker exploited a vulnerability in Gyazo’s image-upload server, ran arbitrary commands on its systems, and accessed the Gyazo database. The company detected suspicious activity on September 11, blocked identified access routes and fixed the flaw by September 12, confirmed data exposure on September 14, and published its notice on September 16. Outside specialists are conducting a forensic investigation.\u003c/p\u003e\n\n\u003cp\u003eThe exposure includes about 23.62 million Gyazo user records, potentially containing email addresses, password hashes, account identifiers, session IDs, profile information, and connected-service details. It also includes roughly 490 million image metadata records, mostly for images registered in January 2019 or earlier, including image IDs that form Gyazo image links; Helpfeel said those IDs could allow images to be viewed without permission. Metadata may include upload IP addresses, location data embedded in images, OCR-extracted text, titles, source URLs, and hashed passphrases for private images, and Helpfeel said it cannot rule out that some private images were viewed.\u003c/p\u003e\n\n\u003cp\u003eHelpfeel said no payment-card information was exposed and that it has invalidated or restricted some authentication data, though it did not specify which items. It temporarily disabled viewing of some images to limit further harm, but did not say which images were affected or how users could determine whether their captures were included. The company asked all Gyazo users to change their passwords, update reused or similar passwords on other services, and watch for suspicious emails or messages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Helpfeel said an attacker exploited a flaw in Gyazo's image-upload server, ran commands on its systems, and accessed the Gyazo database.","The incident exposed about 23.62 million Gyazo user records, which may contain email addresses, password hashes, account and device identifiers, session identifiers, profile details, and connected-service information.","About 490 million image metadata records, mostly for images registered in January 2019 or earlier, were exposed and included image IDs used to construct Gyazo image links.","Helpfeel said the exposed image IDs could allow images to be viewed without permission, and it temporarily disabled viewing of some images to limit further harm.","Helpfeel asked all Gyazo users to change their passwords, change reused or similar passwords on other services, and watch for suspicious emails or messages."],"insights":["Gyazo’s default captures rely on the secrecy of their 32-character link, so exposure of image IDs removes the protection that normally prevents others from finding those images.","Older images are especially significant because free accounts can view only their 10 newest captures in Gyazo, but older captures are not deleted and remain accessible to anyone with their URL.","The exposed metadata may include OCR-extracted text and EXIF location data, meaning the leak can reveal information contained within images as well as the images’ links.","Helpfeel said the attacker obtained a list identifying private images and could potentially have viewed some of them, despite Gyazo offering paid privacy settings for such captures.","Gyazo initially described image-delivery disruptions as emergency maintenance before Helpfeel publicly confirmed the data exposure."],"referencedReports":[{"title":"Helpfeel security incident notice","url":"https://corp.helpfeel.com/en/news/news-20260916","publisher":"helpfeel","context":"Helpfeel’s notice is the primary source for the disclosed Gyazo data exposure, affected records, and incident timeline.","category":"advisory","primary":true}],"body":"\u003cp\u003eHelpfeel said an attacker exploited a vulnerability in Gyazo’s image-upload server, ran arbitrary commands on its systems, and accessed the Gyazo database. The company detected suspicious activity on September 11, blocked identified access routes and fixed the flaw by September 12, confirmed data exposure on September 14, and published its notice on September 16. Outside specialists are conducting a forensic investigation.\u003c/p\u003e\n\n\u003cp\u003eThe exposure includes about 23.62 million Gyazo user records, potentially containing email addresses, password hashes, account identifiers, session IDs, profile information, and connected-service details. It also includes roughly 490 million image metadata records, mostly for images registered in January 2019 or earlier, including image IDs that form Gyazo image links; Helpfeel said those IDs could allow images to be viewed without permission. Metadata may include upload IP addresses, location data embedded in images, OCR-extracted text, titles, source URLs, and hashed passphrases for private images, and Helpfeel said it cannot rule out that some private images were viewed.\u003c/p\u003e\n\n\u003cp\u003eHelpfeel said no payment-card information was exposed and that it has invalidated or restricted some authentication data, though it did not specify which items. It temporarily disabled viewing of some images to limit further harm, but did not say which images were affected or how users could determine whether their captures were included. The company asked all Gyazo users to change their passwords, update reused or similar passwords on other services, and watch for suspicious emails or messages.\u003c/p\u003e\n"},{"n":20,"title":"BIND 9 Update Fixes 14 Flaws, Including an Unauthenticated Crash Over DNS-over-HTTPS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/bind-9-update-fixes-14-flaws-including.html","time":"08:00","priority":"SHOULD READ","score":86,"tldr":"ISC released BIND 9.20.29 and 9.21.26 to fix 14 flaws, including a high-severity unauthenticated DNS-over-HTTPS issue that can crash named with a malformed SIG(0) request. Organizations should upgrade promptly, especially because the end-of-life 9.18 branch remains exposed to most of the vulnerabilities.","briefOverview":"\u003cp\u003eThe Internet Systems Consortium released BIND 9.20.29 and 9.21.26 to fix 14 security flaws in its DNS server software. BIND 9.20.29 fixes all 14 issues, while BIND 9.21.26 fixes 13 because CVE-2026-19662 does not affect the 9.21 branch. ISC said it was not aware of active exploitation and listed no workarounds.\u003c/p\u003e\n\n\u003cp\u003eOne high-severity flaw, CVE-2026-77692, lets an unauthenticated sender crash a BIND server that answers DNS-over-HTTPS by sending an invalid SIG(0) request and closing the connection early. Other issues can crash DNS resolvers, exhaust their CPU or memory, or cause them to accept incorrect DNS data under specified conditions. Twelve flaws also affect the end-of-life 9.18 branch, including its final 9.18.50 release, but ISC has not issued fixes for that branch and recommends users move to BIND 9.20.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ISC released BIND 9.20.29 and 9.21.26 to address 14 security flaws in its BIND 9 DNS server software.","CVE-2026-77692 can allow an unauthenticated sender to crash a BIND server answering DNS-over-HTTPS by sending an invalid SIG(0) request and closing the connection early.","BIND 9.20.29 fixes all 14 flaws, while BIND 9.21.26 fixes 13 because CVE-2026-19662 does not affect the 9.21 branch.","Twelve of the 14 flaws affect the end-of-life BIND 9.18 branch, for which ISC has not released fixes.","ISC said it was not aware of active exploitation of any of the 14 vulnerabilities."],"insights":["The DNS-over-HTTPS crash requires no attacker-controlled DNS server or credentials, making it one of only two flaws in the set that can be triggered by a request alone.","ISC lists no workarounds for any of the 14 flaws, so updating is the stated remediation path.","Several flaws require an attacker-controlled DNS server, an on-path position, response injection capability, or the ability to load a malformed zone, which limits their trigger conditions compared with the request-only crashes.","Public reproduction tests are available for at least six issues, including the DNS-over-HTTPS crash condition, although ISC describes them as fix-verification tests rather than attack tools.","ISC said users should expect security fixes in every monthly BIND maintenance release for the rest of 2026 because of increased vulnerability reports generated by large language models, researchers, and attackers."],"referencedReports":[{"title":"ISC BIND 9 Security Advisories","url":"https://www.openwall.com/lists/oss-security/2026/09/16/4","publisher":"internet-systems-consortium","context":"The article cites ISC's 16 September disclosure of the 14 BIND 9 security flaws.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe Internet Systems Consortium released BIND 9.20.29 and 9.21.26 to fix 14 security flaws in its DNS server software. BIND 9.20.29 fixes all 14 issues, while BIND 9.21.26 fixes 13 because CVE-2026-19662 does not affect the 9.21 branch. ISC said it was not aware of active exploitation and listed no workarounds.\u003c/p\u003e\n\n\u003cp\u003eOne high-severity flaw, CVE-2026-77692, lets an unauthenticated sender crash a BIND server that answers DNS-over-HTTPS by sending an invalid SIG(0) request and closing the connection early. Other issues can crash DNS resolvers, exhaust their CPU or memory, or cause them to accept incorrect DNS data under specified conditions. Twelve flaws also affect the end-of-life 9.18 branch, including its final 9.18.50 release, but ISC has not issued fixes for that branch and recommends users move to BIND 9.20.\u003c/p\u003e\n"},{"n":14,"title":"China’s FamousSparrow hackers target Latin America with new backdoor","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-hackers-latin-america-espionage","time":"16:30","priority":"SHOULD READ","score":85,"tldr":"ESET says the China-linked FamousSparrow group has targeted government agencies across Latin America since at least August 2025 using the new SparroWocky backdoor for espionage, including file theft and screenshots. Researchers assess the campaign may help Beijing monitor regional governments’ responses to renewed U.S. pressure on Chinese interests.","briefOverview":"\u003cp\u003eESET researchers say the China-linked FamousSparrow group has targeted government departments in Guatemala, Honduras, Puerto Rico, Panama, Venezuela, Peru, and Argentina since at least August 2025. The campaign uses a new backdoor called SparroWocky, named after early samples included the opening stanza of Lewis Carroll’s “Jabberwocky.” ESET described the Latin America-only focus as unusual for a long-running Chinese government-backed campaign, which typically targets multiple regions.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can steal files, take screenshots, and collect information about compromised systems, including IP addresses and usernames. ESET said the backdoor is designed to hinder analysis, demonstrates detailed knowledge of internal Windows systems, and incorporates code from open-source projects. The researchers assessed that the campaign may help China monitor and anticipate local governments’ responses to current U.S. pressure on Chinese interests in Latin America; one targeted Panamanian organization is involved in a dispute over two major ports in the canal area. FamousSparrow, active since at least 2019, has previously targeted hotels, governments, trade groups, international organizations, and law firms, and has been publicly linked to Salt Typhoon.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET has tracked a campaign since at least August 2025 in which the China-linked FamousSparrow group targeted government departments in Guatemala, Honduras, Puerto Rico, Panama, Venezuela, Peru, and Argentina.","The campaign uses a backdoor called SparroWocky, which can steal files, take screenshots, and collect system details such as IP addresses and usernames.","ESET named the malware SparroWocky because early samples contained the opening stanza of Lewis Carroll’s poem “Jabberwocky.”","ESET assessed that the campaign may be intended to help China monitor and anticipate Latin American governments’ reactions to current U.S. pressure in the region.","One targeted organization in Panama is directly involved in a commercial dispute over two major ports in the Panama Canal area."],"insights":["ESET described the campaign’s exclusive focus on Latin America as rare for a long-running China-backed operation, which typically targets multiple regions.","The apparent targeting aligns with current geopolitical pressure over Chinese investments in Latin America, including a Panama-linked organization involved in a dispute over ports near the canal.","SparroWocky was built to hinder examination and incorporates code from open-source projects, while also reflecting detailed knowledge of internal Windows systems.","FamousSparrow’s reported evolution from targeting hotels to governments, trade groups, international organizations, and law firms shows the group has expanded its victim profile since at least 2019.","FamousSparrow has been publicly linked to Salt Typhoon, the group U.S. law enforcement agencies accused of compromising the Treasury Department, large U.S. telecommunications companies, and a congressional staff email platform."],"referencedReports":[{"title":"Beware the SparroWock: Backdoor bites commands catch","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/","publisher":"eset","context":"The article relies on ESET’s detailed technical report for its analysis of the SparroWocky backdoor and the FamousSparrow campaign targeting Latin American governments.","category":"research","primary":true}],"body":"\u003cp\u003eESET researchers say the China-linked FamousSparrow group has targeted government departments in Guatemala, Honduras, Puerto Rico, Panama, Venezuela, Peru, and Argentina since at least August 2025. The campaign uses a new backdoor called SparroWocky, named after early samples included the opening stanza of Lewis Carroll’s “Jabberwocky.” ESET described the Latin America-only focus as unusual for a long-running Chinese government-backed campaign, which typically targets multiple regions.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can steal files, take screenshots, and collect information about compromised systems, including IP addresses and usernames. ESET said the backdoor is designed to hinder analysis, demonstrates detailed knowledge of internal Windows systems, and incorporates code from open-source projects. The researchers assessed that the campaign may help China monitor and anticipate local governments’ responses to current U.S. pressure on Chinese interests in Latin America; one targeted Panamanian organization is involved in a dispute over two major ports in the canal area. FamousSparrow, active since at least 2019, has previously targeted hotels, governments, trade groups, international organizations, and law firms, and has been publicly linked to Salt Typhoon.\u003c/p\u003e\n"},{"n":8,"title":"Chinese hackers use SparroWocky malware in govt espionage attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chinese-hackers-use-sparrowocky-malware-in-govt-espionage-attacks/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"China-linked FamousSparrow has deployed the new modular SparroWocky backdoor against Latin American government organizations, apparently to gather intelligence on responses to U.S. pressure on Chinese economic interests. The malware replaces SparrowDoor and uses DLL side-loading, in-memory execution, and thread-start spoofing to evade detection while enabling extensive espionage capabilities.","briefOverview":"\u003cp\u003eESET reports that the China-linked espionage group FamousSparrow has used a new C++ backdoor called SparroWocky against government organizations in Latin America for more than a year. The activity affected targets in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, with ESET assessing that the group sought intelligence on government responses to increasing U.S. pressure on Chinese economic interests. From mid-2025, ESET telemetry indicates that FamousSparrow primarily focused on Latin American targets.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky replaces the group’s earlier SparrowDoor backdoor and can execute commands, manage files, collect system and user details, capture screenshots, create processes in other logged-in users’ sessions, and forward network connections. It is deployed through DLL side-loading after a loader decrypts an RC4-encoded payload in a .dat file and maps it directly into memory. The malware also uses several evasion methods, including disguising in-memory code as legitimate Windows components and altering thread start addresses so that threads appear to begin at AnimateWindow; it can persist through the ProcAuditManager Windows service or SnapCart registry keys.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET reports that the China-linked FamousSparrow group has used a new C++ backdoor called SparroWocky against government organizations in Latin America for more than a year.","The activity targeted organizations in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, and ESET believes it sought intelligence on government responses to U.S. pressure on Chinese economic interests.","SparroWocky replaces FamousSparrow's earlier SparrowDoor backdoor and can execute commands, collect system information, manage files, capture screenshots, create processes in other users' sessions, and act as a TCP proxy.","The malware is delivered through DLL side-loading, decrypts an RC4-encoded payload from a .dat file, and runs it directly in memory to evade detection.","SparroWocky can persist through a Windows service named ProcAuditManager or registry keys named SnapCart, while ESET identified at least 18 command-and-control addresses associated with the activity."],"insights":["SparroWocky captures screenshots every 500 milliseconds but sends only changed portions after the first full-screen image, reducing the amount of data transmitted.","The malware hooks Windows thread creation so that new threads appear to begin at the legitimate AnimateWindow function rather than their real starting address, an effort to mislead security products.","SparroWocky can create a process in another logged-in user’s session, which gives it a way to operate within a different active user context.","Its command-and-control communications can use direct connections on ports 443 or 8080 as well as HTTP and SOCKS5 proxies, and ESET identified at least 18 associated addresses.","The backdoor can remove its own persistence and delete its files, allowing operators to reduce traces of the compromise."],"referencedReports":[{"title":"Beware the SparroWock backdoor","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/","publisher":"eset","context":"The article relies on ESET's technical research for its analysis of SparroWocky's capabilities, delivery, evasion methods, persistence, and command-and-control infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eESET reports that the China-linked espionage group FamousSparrow has used a new C++ backdoor called SparroWocky against government organizations in Latin America for more than a year. The activity affected targets in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, with ESET assessing that the group sought intelligence on government responses to increasing U.S. pressure on Chinese economic interests. From mid-2025, ESET telemetry indicates that FamousSparrow primarily focused on Latin American targets.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky replaces the group’s earlier SparrowDoor backdoor and can execute commands, manage files, collect system and user details, capture screenshots, create processes in other logged-in users’ sessions, and forward network connections. It is deployed through DLL side-loading after a loader decrypts an RC4-encoded payload in a .dat file and maps it directly into memory. The malware also uses several evasion methods, including disguising in-memory code as legitimate Windows components and altering thread start addresses so that threads appear to begin at AnimateWindow; it can persist through the ProcAuditManager Windows service or SnapCart registry keys.\u003c/p\u003e\n"},{"n":22,"title":"China-Aligned FamousSparrow Deploys SparroWocky Backdoor Across Latin America","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/china-aligned-famoussparrow-deploys.html","time":"10:05","priority":"SHOULD READ","score":84,"tldr":"China-aligned FamousSparrow has deployed its new modular SparroWocky backdoor against government targets across Latin America since at least August 2025, replacing SparrowDoor as its primary implant. The malware uses DLL sideloading and anti-analysis capabilities to execute commands, exfiltrate files, capture screenshots, and evade detection.","briefOverview":"\u003cp\u003eChina-aligned threat actor FamousSparrow has deployed a previously unreported modular C++ backdoor called SparroWocky in attacks targeting Latin America since at least August 2025. ESET assesses that the group, active since at least 2019 and sharing some overlap with Earth Estries and Salt Typhoon, has replaced SparrowDoor with SparroWocky as its primary implant. The malware’s name comes from early versions containing the opening stanza of Lewis Carroll’s poem \u003cem\u003eJabberwocky\u003c/em\u003e. ESET said its design shows strong knowledge of Windows internals and techniques intended to hinder analysis.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can execute arbitrary files and commands, function as a TCP proxy, collect host and network-interface information, steal files, take periodic screenshots, perform file operations, and remove itself. It uses Mbed TLS for encrypted communications with its command-and-control server, MinHook and a SilentMoonwalk variant to conceal activity from security products, and COFF Loader to run in-memory plugins. FamousSparrow continues to use DLL sideloading, in which a legitimate executable launches a loader DLL that decrypts and runs the main payload; the group’s initial access method remains unknown. From July 2025, the group targeted government entities in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, with 90% of targets in ESET telemetry located in Latin America.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET reported that the China-aligned FamousSparrow group has deployed the previously unreported modular C++ backdoor SparroWocky in Latin American attacks since at least August 2025.","SparroWocky can execute files and commands, act as a TCP proxy, collect system and network-interface information, exfiltrate files, take periodic screenshots, perform file operations, and delete itself.","The backdoor incorporates Mbed TLS, MinHook, COFF Loader, and a SilentMoonwalk variant for encrypted command-and-control communications, in-memory plugin execution, and defense evasion.","FamousSparrow uses a DLL sideloading chain in which a legitimate executable launches a loader DLL that decrypts and starts the main payload.","Starting in July 2025, FamousSparrow targeted government entities in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, and ESET said 90% of the group’s telemetry-recorded targets were in Latin America."],"insights":["FamousSparrow appears to have shifted from using open-source offensive tools alongside its malware to embedding their capabilities directly into SparroWocky, indicating custom development beyond simply combining separate tools.","Although SparroWocky is a different malware family from SparrowDoor, FamousSparrow retained the same DLL sideloading delivery approach, making that execution chain a consistent feature of the group’s activity.","ESET recorded 90% of FamousSparrow’s targets in Latin America, with the group’s government-focused activity in the region increasing from July 2025.","The article states that the attackers’ initial method of gaining access is unknown, even though the subsequent DLL sideloading and payload-launch sequence has been observed."],"referencedReports":[{"title":"Beware of SparroWocky: Backdoor Bites Commands and Catches Data","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/#latin-america-in-the-crosshairs","publisher":"eset","context":"The article relies on ESET researchers Alexandre Côté Cyr and Romain Dumont's technical report for its findings on FamousSparrow and the SparroWocky backdoor.","category":"research","primary":true}],"body":"\u003cp\u003eChina-aligned threat actor FamousSparrow has deployed a previously unreported modular C++ backdoor called SparroWocky in attacks targeting Latin America since at least August 2025. ESET assesses that the group, active since at least 2019 and sharing some overlap with Earth Estries and Salt Typhoon, has replaced SparrowDoor with SparroWocky as its primary implant. The malware’s name comes from early versions containing the opening stanza of Lewis Carroll’s poem \u003cem\u003eJabberwocky\u003c/em\u003e. ESET said its design shows strong knowledge of Windows internals and techniques intended to hinder analysis.\u003c/p\u003e\n\n\u003cp\u003eSparroWocky can execute arbitrary files and commands, function as a TCP proxy, collect host and network-interface information, steal files, take periodic screenshots, perform file operations, and remove itself. It uses Mbed TLS for encrypted communications with its command-and-control server, MinHook and a SilentMoonwalk variant to conceal activity from security products, and COFF Loader to run in-memory plugins. FamousSparrow continues to use DLL sideloading, in which a legitimate executable launches a loader DLL that decrypts and runs the main payload; the group’s initial access method remains unknown. From July 2025, the group targeted government entities in Argentina, Ecuador, Guatemala, Honduras, Panama, Peru, Puerto Rico, and Venezuela, with 90% of targets in ESET telemetry located in Latin America.\u003c/p\u003e\n"},{"n":29,"title":"The Odyssey and trojans again: MovieReaper attacks users in multiple countries via compromised torrents","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/moviereaper-malware-torrent-odyssey-solana/121344/","time":"13:00","priority":"SHOULD READ","score":84,"tldr":"Kaspersky uncovered MovieReaper, a modular malware framework distributed through malicious torrent files served via the compromised itorrents.org repository. The campaign targets users and organizations worldwide, uses Solana to resiliently distribute C2 infrastructure, bypasses UAC for persistence, and provides attackers remote file-management capabilities.","briefOverview":"\u003cp\u003eKaspersky identified MovieReaper, a previously unknown modular, multi-stage malware framework spread through torrent files disguised as popular movies. The campaign began with the compromise of itorrents.org, a public torrent-file repository used by multiple torrent trackers, rather than the compromise of the trackers themselves. As a result, users attempting to download content through affected magnet links received malicious torrent files that downloaded the malware loader.\u003c/p\u003e\n\n\u003cp\u003eThe loader performs checks intended to evade automated analysis, then downloads and runs later stages in memory from attacker-controlled infrastructure. MovieReaper uses the Solana blockchain to retrieve an address for a second command server, making the later stages harder to disrupt through ordinary server takedowns. The malware can bypass Windows permission prompts, establish persistence as a file named msedge.exe in a Telemetry directory, and ultimately provide operators with file-management capabilities including reading, uploading, downloading, copying, moving, and deleting files.\u003c/p\u003e\n\n\u003cp\u003eVictims included individuals and organizations in countries across Europe, Asia, Africa, and elsewhere, including Russia, Türkiye, Japan, Kenya, Uganda, Colombia, Spain, the Netherlands, Belgium, and Germany. The affected organizations came from sectors including enterprise, government, IT, consulting, retail, transportation, and agriculture. Kaspersky noted that the first-stage server is a key disruption opportunity because it relies on a specific domain and fallback IP address, whereas the Solana-based second-stage infrastructure is more resilient.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a multi-stage malware framework named MovieReaper that was distributed through malicious torrent files disguised as popular movies.","Attackers compromised the public torrent-file repository itorrents.org rather than individual torrent trackers, causing trackers that relied on it to serve malicious torrent files.","The initial loader downloads shellcode from deadhub.org or the fallback IP address 193.23.118.155, then executes it in memory after performing anti-sandbox checks.","MovieReaper uses the Solana blockchain to obtain the second-stage command-and-control server address, which makes conventional server takedowns more difficult.","The final MovieReaper module provides operators with 21 file-management commands, including the ability to list, read, upload, download, copy, move, rename, and delete files."],"insights":["Compromising itorrents.org allowed the attackers to reach users of multiple torrent trackers without compromising each tracker individually.","The first stage is a potential disruption point because it relies on one domain and one fallback IP address, while later stages are more resilient because they obtain command-server information through Solana.","Only the initial executable is written to disk before execution, while later payloads are loaded and run in memory, reducing opportunities for file-based detection.","The final file-management module can request previews and thumbnails of files and images before extracting them, allowing operators to inspect potential targets before downloading full files."],"referencedReports":[],"body":"\u003cp\u003eKaspersky identified MovieReaper, a previously unknown modular, multi-stage malware framework spread through torrent files disguised as popular movies. The campaign began with the compromise of itorrents.org, a public torrent-file repository used by multiple torrent trackers, rather than the compromise of the trackers themselves. As a result, users attempting to download content through affected magnet links received malicious torrent files that downloaded the malware loader.\u003c/p\u003e\n\n\u003cp\u003eThe loader performs checks intended to evade automated analysis, then downloads and runs later stages in memory from attacker-controlled infrastructure. MovieReaper uses the Solana blockchain to retrieve an address for a second command server, making the later stages harder to disrupt through ordinary server takedowns. The malware can bypass Windows permission prompts, establish persistence as a file named msedge.exe in a Telemetry directory, and ultimately provide operators with file-management capabilities including reading, uploading, downloading, copying, moving, and deleting files.\u003c/p\u003e\n\n\u003cp\u003eVictims included individuals and organizations in countries across Europe, Asia, Africa, and elsewhere, including Russia, Türkiye, Japan, Kenya, Uganda, Colombia, Spain, the Netherlands, Belgium, and Germany. The affected organizations came from sectors including enterprise, government, IT, consulting, retail, transportation, and agriculture. Kaspersky noted that the first-stage server is a key disruption opportunity because it relies on a specific domain and fallback IP address, whereas the Solana-based second-stage infrastructure is more resilient.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft shares workaround for Windows domain login issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-workaround-for-windows-domain-login-authentication-issues/","time":"08:24","priority":"SHOULD READ","score":82,"tldr":"Microsoft confirmed that September 2026 Windows 11 security updates can break domain trust and block valid domain logins when Machine Identity Isolation enforcement is configured on unsupported domain environments. Administrators should disable the feature using its original management method, restart affected devices, and repair the machine secure channel while Microsoft develops a permanent fix.","briefOverview":"\u003cp\u003eMicrosoft confirmed that September 2026 security updates for Windows 11 can cause some domain-connected devices to reject valid sign-in credentials and lose their trusted connection to the domain. Reports from users and IT administrators linked the issue to Machine Identity Isolation enforcement after installing KB5124008 on Windows 11 24H2/25H2 or KB5124012 on Windows 11 26H1. Microsoft said the updates do not directly enable enforcement, but begin honoring enforcement settings that already exist through configuration or policy.\u003c/p\u003e\n\n\u003cp\u003eMachine Identity Isolation enforcement is supported only for environments connected to domain controllers running at the Windows Server 2025 Domain Functional Level or higher, and Microsoft advises disabling it elsewhere. As a temporary workaround, administrators should disable the feature through the same method used to enable it, restart the device, and repair its secure channel; registry-configured systems can change the MachineIdentityIsolation value from 2 to 0. Microsoft is working on a future update to temporarily prevent enforcement, while separate out-of-band updates have addressed some Remote Desktop Services, Hyper-V, and USB audio problems caused by the same month’s updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that September 2026 Windows security updates can cause some domain-joined Windows 11 devices to lose their trusted connection to their domain and reject valid sign-in credentials.","The issue occurs when the updates begin honoring existing Machine Identity Isolation enforcement settings, a feature supported only in environments using Windows Server 2025 domain controllers or later.","Microsoft advises administrators to disable Machine Identity Isolation on affected devices that are not connected to Windows Server 2025 domain controllers, using the same management method that enabled it.","For registry-configured devices, Microsoft says administrators can set the MachineIdentityIsolation value from 2 to 0, restart the device, and repair its secure channel with the Test-ComputerSecureChannel PowerShell command.","Microsoft is working on a future Windows update to temporarily prevent Machine Identity Isolation enforcement and has already issued out-of-band updates for separate Remote Desktop Services, Hyper-V, and USB audio issues from the September updates."],"insights":["The September updates do not directly turn on Machine Identity Isolation enforcement; they cause Windows to honor enforcement settings that were already present through configuration or policy.","Machine Identity Isolation enforcement is supported only when devices are connected to domain controllers using the Windows Server 2025 Domain Functional Level or higher, so organizations using other domain-controller environments should disable it.","For devices configured through the registry, the workaround includes both changing the MachineIdentityIsolation value from 2 to 0 and repairing the computer’s trusted connection after restarting, rather than only changing the setting.","Microsoft’s documentation warns that disabling Machine Identity Isolation after it has been enabled in enforcement mode can itself break domain authentication and may require removing and rejoining the device to the domain."],"referencedReports":[{"title":"Domain-joined devices might lose their secure trust relationship with the domain","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-26h1#domain-joined-devices-might-lose-their-secure-trust-relationship-with-the-domain","publisher":"microsoft","context":"Microsoft’s Windows release health dashboard update confirms the September 2026 updates can trigger domain trust and sign-in failures when existing Machine Identity Isolation enforcement settings are honored.","category":"advisory","primary":true},{"title":"Machine Identity Isolation","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/delegated-managed-service-accounts/credential-guard-protected-machine-accounts","publisher":"microsoft","context":"Microsoft documentation warns that disabling Machine Identity Isolation after enforcement can break domain authentication and may require devices to be removed and rejoined to the domain.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft confirmed that September 2026 security updates for Windows 11 can cause some domain-connected devices to reject valid sign-in credentials and lose their trusted connection to the domain. Reports from users and IT administrators linked the issue to Machine Identity Isolation enforcement after installing KB5124008 on Windows 11 24H2/25H2 or KB5124012 on Windows 11 26H1. Microsoft said the updates do not directly enable enforcement, but begin honoring enforcement settings that already exist through configuration or policy.\u003c/p\u003e\n\n\u003cp\u003eMachine Identity Isolation enforcement is supported only for environments connected to domain controllers running at the Windows Server 2025 Domain Functional Level or higher, and Microsoft advises disabling it elsewhere. As a temporary workaround, administrators should disable the feature through the same method used to enable it, restart the device, and repair its secure channel; registry-configured systems can change the MachineIdentityIsolation value from 2 to 0. Microsoft is working on a future update to temporarily prevent enforcement, while separate out-of-band updates have addressed some Remote Desktop Services, Hyper-V, and USB audio problems caused by the same month’s updates.\u003c/p\u003e\n"},{"n":6,"title":"New RatHat Android malware uses AI to automate device control","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-rathat-android-malware-uses-ai-to-automate-device-control/","time":"21:50","priority":"SHOULD READ","score":82,"tldr":"Zimperium has identified RatHat, an Android banking malware that abuses Accessibility permissions and wireless ADB to steal credentials, SMS one-time passwords, and lock-screen data while maintaining persistent control. Its AI-assisted interface navigation lets operators automate actions on compromised devices more flexibly than fixed scripts.","briefOverview":"\u003cp\u003eZimperium zLabs researchers have identified RatHat, an Android malware family distributed through malicious ads, SMS messages, and phishing sites promoting APK downloads outside Google Play. The researchers found Chinese-language prompts for large language models and believe the malware may be linked to threat actors from China. RatHat targets Android devices by abusing Accessibility permissions to carry out privileged actions.\u003c/p\u003e\n\n\u003cp\u003eThe malware enables Developer Options and Wireless Debugging to obtain local shell-level access, then installs a Go-based agent that can run commands, bypass battery restrictions, and help preserve access. RatHat uses overlays to steal banking and cryptocurrency credentials, can intercept SMS messages and one-time passwords, and can capture lock-screen PINs, passwords, and unlock patterns. Its AI-powered automation sends a live representation of the phone interface to an unnamed AI assistant for element identification and navigation instructions, while anti-analysis and uninstall-blocking features make removal and examination more difficult.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zimperium zLabs identified RatHat as an Android malware family distributed through malicious advertising, SMS messages, and phishing sites that promote APK downloads outside Google Play.","RatHat abuses Android Accessibility permissions and enables Developer Options and Wireless Debugging to obtain local shell-level access without an external computer.","The malware installs a Go-based agent that runs commands with ADB shell privileges, bypasses battery restrictions, and helps restore the malware or agent if either is removed.","RatHat uses HTML overlays to steal banking and cryptocurrency credentials and can intercept SMS messages and notifications, including one-time passwords, as well as capture lock-screen PINs, passwords, and unlock patterns.","RatHat serializes the live Android interface into XML and sends it to an unnamed AI assistant to identify interface elements and return navigation instructions for automated device control."],"insights":["RatHat maintains two-way persistence: its Go-based agent can restore the malware if it is removed or stopped, while the malware can also restore the agent if the agent is removed.","The malware reportedly interferes with its own removal by canceling uninstall confirmation screens and showing a fake Google Play error message, which can make a failed uninstall appear legitimate to the user.","Rather than relying only on fixed screen-action scripts, RatHat sends a live representation of the Android interface to an AI assistant for element identification and navigation instructions, allowing its automation to adapt to the device interface.","RatHat includes several measures intended to hinder analysis, including APK container tampering, a 61MB Android manifest file, and invalid DEX pseudo instructions."],"referencedReports":[],"body":"\u003cp\u003eZimperium zLabs researchers have identified RatHat, an Android malware family distributed through malicious ads, SMS messages, and phishing sites promoting APK downloads outside Google Play. The researchers found Chinese-language prompts for large language models and believe the malware may be linked to threat actors from China. RatHat targets Android devices by abusing Accessibility permissions to carry out privileged actions.\u003c/p\u003e\n\n\u003cp\u003eThe malware enables Developer Options and Wireless Debugging to obtain local shell-level access, then installs a Go-based agent that can run commands, bypass battery restrictions, and help preserve access. RatHat uses overlays to steal banking and cryptocurrency credentials, can intercept SMS messages and one-time passwords, and can capture lock-screen PINs, passwords, and unlock patterns. Its AI-powered automation sends a live representation of the phone interface to an unnamed AI assistant for element identification and navigation instructions, while anti-analysis and uninstall-blocking features make removal and examination more difficult.\u003c/p\u003e\n"},{"n":11,"title":"European Commission set to push social media restrictions, safety requirements into law","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/european-commission-set-to-push-social-media-kids-restrictions-into-law","time":"20:36","priority":"SHOULD READ","score":82,"tldr":"The European Commission has proposed the EU KIDS Act, which would bar under-13s from social media, require parent-controlled accounts for ages 13–15, and impose child-safety-by-design and age-verification requirements on online platforms. The plan could bring fines of up to 6% of global annual revenue but faces privacy and implementation concerns.","briefOverview":"\u003cp\u003eThe European Commission has outlined the EU KIDS Act, a proposed law that would prevent children under 13 from accessing social media and establish a minimum account-creation age of 15 across the European Union. Children aged 13 to 15 could access services only through parent-created “mini accounts,” with limited social contacts and a one-hour daily screen-time cap. The proposal must still be approved by the European Parliament and EU member states before it becomes law.\u003c/p\u003e\n\n\u003cp\u003eThe proposal would require social media, online gaming, video-sharing, and AI chatbot services to make products safer for minors by design. It would restrict features such as endless scrolling, reward mechanisms, nighttime notifications, unsolicited contact from strangers, and recommendation feeds based on user profiling; minors’ accounts would be private by default, with location, microphone, and camera access blocked. Very large providers would need compliance plans and third-party audits, and violations could result in fines of up to 6% of global annual sales, while critics argue that mandatory age verification could create privacy risks and exclude people without identification.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Commission has outlined the EU KIDS Act, a proposal that would bar children under 13 from social media accounts and set a bloc-wide minimum account-creation age of 15.","Under the proposal, children aged 13 to 15 could use parent-created mini accounts with restricted social contact and a one-hour daily screen-time cap.","The proposal would require online services to protect minors by default, including private profiles, disabled location, microphone and camera access, and restrictions on addictive design features.","Very large providers would need to submit child-protection compliance plans and undergo third-party audits, while violations could lead to fines of up to 6% of global annual sales.","Privacy and digital-rights advocates said universal age verification could require adults to provide identification and could harm people without IDs."],"insights":["The proposal would extend beyond social media to online games, video-sharing services, and AI chatbots and companions, making its child-safety requirements broader than an account-age restriction alone.","For ages 13 to 15, the proposed access model would use parent-controlled “mini accounts” rather than independent accounts, with capped screen time and limited social contact.","The Commission plans to rely on its EU age-verification app, which it says does not store identity documents or biometric data, while critics argue universal account checks could still require users to submit IDs and use smartphones.","The proposal sets a 90-day target for Commission investigations into suspected violations and would require providers to pay fees supporting regulatory oversight.","Australia’s experience illustrates an enforcement challenge: government-retained researchers found that 61% of Australian children aged 12 to 15 continued to access accounts on major platforms despite that country’s ban."],"referencedReports":[],"body":"\u003cp\u003eThe European Commission has outlined the EU KIDS Act, a proposed law that would prevent children under 13 from accessing social media and establish a minimum account-creation age of 15 across the European Union. Children aged 13 to 15 could access services only through parent-created “mini accounts,” with limited social contacts and a one-hour daily screen-time cap. The proposal must still be approved by the European Parliament and EU member states before it becomes law.\u003c/p\u003e\n\n\u003cp\u003eThe proposal would require social media, online gaming, video-sharing, and AI chatbot services to make products safer for minors by design. It would restrict features such as endless scrolling, reward mechanisms, nighttime notifications, unsolicited contact from strangers, and recommendation feeds based on user profiling; minors’ accounts would be private by default, with location, microphone, and camera access blocked. Very large providers would need compliance plans and third-party audits, and violations could result in fines of up to 6% of global annual sales, while critics argue that mandatory age verification could create privacy risks and exclude people without identification.\u003c/p\u003e\n"},{"n":15,"title":"Hackers claim breach of Russian election systems days before parliamentary vote","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-election-hackers-breach","time":"13:45","priority":"SHOULD READ","score":82,"tldr":"The CikLeak hacking group claims it accessed Russia’s Central Election Commission and contractor systems ahead of parliamentary elections, allegedly stealing internal documents, passwords and communications. The scope and any impact on voting or vote counting remain unconfirmed.","briefOverview":"\u003cp\u003eA hacking group calling itself CikLeak claimed it accessed systems connected to Russia’s Central Election Commission and companies involved in developing the Vybory election platform. The group said it stole internal documents, server configurations, passwords, and employee communications, including material involving Rostelecom. Important Stories said it authenticated the documents provided by the group, although the extent of the alleged access remains unclear.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure came days before Russia’s three-day election for all 450 State Duma seats, the first federal election to use the new Vybory 2.0 platform. CikLeak said it did not intend to disrupt voting but wanted to expose the electoral system’s internal workings and alleged opportunities to manipulate results. It has not been established whether the hackers reached systems directly used to record votes or count ballots.\u003c/p\u003e\n\n\u003cp\u003eRussian election officials had already warned that attacks on election systems and related infrastructure were increasing ahead of the vote. A security test conducted the day before CikLeak’s disclosure identified the continuous transmission of video-surveillance feeds as a weak link. Russia’s election infrastructure was also targeted during the March 2024 presidential election through denial-of-service attacks, phishing sites, and fake Telegram channels.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The CikLeak group claimed it accessed systems belonging to Russia’s Central Election Commission and companies involved in developing the Vybory election platform.","CikLeak said it stole internal documents, server configurations, passwords, and employee communications, and Important Stories reported that it authenticated the supplied documents.","It remains unclear whether the group accessed systems directly involved in voting or counting ballots.","Russia’s parliamentary election for all 450 State Duma seats will take place over three days beginning Friday and will be the first federal election usin
