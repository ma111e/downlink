<script type="application/json" id="dl-articles">[{"n":1,"title":"Operation FlashHole: Lazarus breaks security, defies control","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/lazarus-operation-flashhole/121541/","time":"02:07","priority":"MUST READ","score":93,"tldr":"Kaspersky reports that Lazarus Group’s Operation FlashHole targeted South Korean organizations by abusing mandatory CrossWeb EX security software and tailored phishing sites to deliver a highly modular, largely memory-resident malware chain. The campaign combines updated TechHub, Cubridge, TouchShift, ClientHub, and LPEClient tooling with GitHub- and compromised-site-based C2 infrastructure for espionage and payload delivery.","briefOverview":"\u003cp\u003eKaspersky describes Operation FlashHole, a Lazarus Group campaign that targeted at least three South Korean organizations in the software, construction, and wired communication equipment sectors. The earliest evidence dates to July 2025, and the campaign followed Operation SyncHole while expanding into different industries. Researchers assess with medium-to-high confidence that targets received spear-phishing emails linking to tailored GitHub Pages sites posing as a job seeker’s résumé or an interior design portfolio. The sites contained external malicious JavaScript and may have initiated infection involving the mandatory financial-security product CrossWeb EX.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain executed \u003ccode\u003efsquirt.exe\u003c/code\u003e under the CrossWeb EX service process and injected shellcode containing TechHub, with much of the initial chain existing only in memory. TechHub used private GitHub repositories for command-and-control communication, while later payloads included Cubridge, TouchHub, TouchShift, ClientHub, and LPEClient. Persistence involved DLL side-loading through a malicious \u003ccode\u003emscoree.dll\u003c/code\u003e and a service created from a legitimate Windows executable, allowing TouchShift to run with SYSTEM privileges. Cubridge and ClientHub could load tools and plugins for activities including process and browser-data collection, Active Directory queries, file collection and archiving, file deletion, and remote-session monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights LPEClient as a longstanding Lazarus tool that was substantially updated to profile systems, inspect patch and security-mitigation status, and receive payloads through ClientHub. Its communication used several cryptographic methods, including ML-KEM-1024 post-quantum key encapsulation, GOST, and Threefish, before reflectively loading Cubridge in memory. Kaspersky links FlashHole to the broader Cascade Hole campaign and to Lazarus’s Dream Job-related toolsets, while distinguishing it from concurrent COPPERHEDGE activity associated with ransomware and data exfiltration. The researchers expect attacks abusing South Korea’s mandatory security software to remain active until that software is eliminated or mitigated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified Operation FlashHole as a Lazarus Group campaign targeting at least three South Korean organizations in the software, construction, and wired communication equipment sectors.","The campaign used tailored phishing links to GitHub Pages sites posing as a job résumé or interior design portfolio, with evidence suggesting the lure content included AI-generated material.","The infection chain abused the South Korean financial-security software CrossWeb EX and executed much of its malware chain in memory to reduce traces on disk.","The operation used updated and newly identified malware including TechHub, Cubridge, TouchHub, TouchShift, ClientHub, and LPEClient, with GitHub repositories and compromised South Korean websites used for command-and-control communications.","Kaspersky assessed with medium-to-high confidence that Operation FlashHole is the latest wave of the broader Cascade Hole campaign and is linked to Lazarus Group activity."],"insights":["The attackers used private GitHub repositories as a command-and-control channel, with TechHub creating and updating GitHub issues and exchanging encrypted files through repository filenames and content.","Much of the initial infection chain operated only in memory, while the few persistent files were disguised through DLL side-loading and legitimate Windows binaries running as services with SYSTEM privileges.","LPEClient’s updated version checks Windows patch-level information and low-level security protections, including Kernel VA Shadow and Shadow Stack status, before receiving later-stage payloads.","The campaign used several cryptographic methods, including ML-KEM-1024 post-quantum key encapsulation, to protect payload delivery; Kaspersky noted that this adoption outpaced many legitimate security products.","South Korea’s plan to phase out mandatory security-software installation beginning in 2026 may leave the currently installed software an attractive attack route until it is eliminated or mitigated."],"referencedReports":[{"title":"Operation SyncHole: Watering-hole attacks by Lazarus","url":"https://securelist.com/operation-synchole-watering-hole-attacks-by-lazarus/116326/","publisher":"kaspersky","context":"The article identifies Operation FlashHole as following this earlier Lazarus campaign.","category":"research","primary":false},{"title":"APT Trends Report Q3 2021","url":"https://securelist.com/apt-trends-report-q3-2021/104708/#southeast-asia-and-korean-peninsula","publisher":"kaspersky","context":"The article cites this report for Lazarus’s 2021 use of CrossWeb EX to deploy the Racket downloader.","category":"research","primary":false},{"title":"CrossWEB security advisory","url":"https://www.krcert.or.kr/kr/bbs/view.do?searchCnd=1\u0026bbsId=B0000133\u0026searchWrd=CrossWEB\u0026menuNo=205020\u0026pageIndex=1\u0026categoryCode=\u0026nttId=71030","publisher":"krcert","context":"The article notes that the observed CrossWeb EX version was released after this public advisory.","category":"advisory","primary":false},{"title":"USENIX Security Symposium 2025 paper on vulnerabilities in South Korean mandatory security software","url":"https://www.usenix.org/conference/usenixsecurity25/presentation/yun","publisher":"usenix","context":"The article cites this paper’s investigation of vulnerabilities and attack surface created by mandatory South Korean security software.","category":"research","primary":false},{"title":"Joint security advisory on Lazarus attack techniques","url":"https://www.boho.or.kr/kr/bbs/view.do?searchCnd=1\u0026bbsId=B0000133\u0026searchWrd=\u0026menuNo=205020\u0026pageIndex=5\u0026categoryCode=\u0026nttId=72144","publisher":"south-korean-government-and-local-security-vendors","context":"The article says the advisory covers Lazarus techniques, including abuse of financial security software, and overlaps with the FlashHole findings.","category":"advisory","primary":false},{"title":"Operation Double Barrel","url":"https://image.ahnlab.com/atip/content/file/20260730/%5BAhnLab%5DOperation%20Double%20Barrel%28ENG%29%282026.07.30%29.pdf","publisher":"ahnlab","context":"The article references AhnLab’s detailed analysis of a broad range of recent Lazarus Group activity.","category":"research","primary":false},{"title":"Lightshow: North Korea’s evolving malware ecosystem","url":"https://cloud.google.com/blog/topics/threat-intelligence/lightshow-north-korea-unc2970","publisher":"mandiant","context":"The article uses this analysis to compare earlier TechHub and TouchShift variants, which Mandiant respectively called CLOUDBURST and SIDESHOW.","category":"research","primary":false},{"title":"Lazarus luring employees with trojanized coding challenges: The case of a Spanish aerospace company","url":"https://www.welivesecurity.com/en/eset-research/lazarus-luring-employees-trojanized-coding-challenges-case-spanish-aerospace-company/","publisher":"eset","context":"The article references ESET’s analysis of an earlier TechHub variant called NickelLoader and related Cubridge functionality.","category":"research","primary":false},{"title":"Shattering the Dream: When a job offer becomes a zero-day attack","url":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","publisher":"check-point-research","context":"The article cites this research for LPEClient’s use to deploy FudModule through a zero-day and for confirmation of its GOST cryptography.","category":"research","primary":false},{"title":"Lazarus new malware: CookiePlus","url":"https://securelist.com/lazarus-new-malware/115059/","publisher":"kaspersky","context":"The article references CookiePlus when describing overlaps that support its assessment that ClientHub is an advanced CookiePlus version.","category":"research","primary":false},{"title":"Lazarus ThreatNeedle","url":"https://securelist.com/lazarus-threatneedle/100803/","publisher":"kaspersky","context":"The article cites this research while discussing its reclassification of the ThreatNeedle variant used in Operation SyncHole as IMETHOD.","category":"research","primary":false},{"title":"AhnLab report on COPPERHEDGE and Gunra ransomware activity","url":"https://asec.ahnlab.com/en/94696/","publisher":"ahnlab","context":"The article cites AhnLab’s report as noting that the COPPERHEDGE backdoor was likely observed in atypical Gunra ransomware activity.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky describes Operation FlashHole, a Lazarus Group campaign that targeted at least three South Korean organizations in the software, construction, and wired communication equipment sectors. The earliest evidence dates to July 2025, and the campaign followed Operation SyncHole while expanding into different industries. Researchers assess with medium-to-high confidence that targets received spear-phishing emails linking to tailored GitHub Pages sites posing as a job seeker’s résumé or an interior design portfolio. The sites contained external malicious JavaScript and may have initiated infection involving the mandatory financial-security product CrossWeb EX.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain executed \u003ccode\u003efsquirt.exe\u003c/code\u003e under the CrossWeb EX service process and injected shellcode containing TechHub, with much of the initial chain existing only in memory. TechHub used private GitHub repositories for command-and-control communication, while later payloads included Cubridge, TouchHub, TouchShift, ClientHub, and LPEClient. Persistence involved DLL side-loading through a malicious \u003ccode\u003emscoree.dll\u003c/code\u003e and a service created from a legitimate Windows executable, allowing TouchShift to run with SYSTEM privileges. Cubridge and ClientHub could load tools and plugins for activities including process and browser-data collection, Active Directory queries, file collection and archiving, file deletion, and remote-session monitoring.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights LPEClient as a longstanding Lazarus tool that was substantially updated to profile systems, inspect patch and security-mitigation status, and receive payloads through ClientHub. Its communication used several cryptographic methods, including ML-KEM-1024 post-quantum key encapsulation, GOST, and Threefish, before reflectively loading Cubridge in memory. Kaspersky links FlashHole to the broader Cascade Hole campaign and to Lazarus’s Dream Job-related toolsets, while distinguishing it from concurrent COPPERHEDGE activity associated with ransomware and data exfiltration. The researchers expect attacks abusing South Korea’s mandatory security software to remain active until that software is eliminated or mitigated.\u003c/p\u003e\n"},{"n":2,"title":"vlt 1.5.0 Adds Agent Skills Management","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/vlt-skills?utm_medium=feed","time":"02:27","priority":"MAY READ","score":64,"tldr":"vlt 1.5.0 adds opt-in agent-skill management, allowing developers to link coding-agent instructions from installed package dependencies and keep them synchronized with lockfile-pinned versions. It also uses Socket security data to exclude skills from packages flagged as malware or other security risks.","briefOverview":"\u003cp\u003evlt 1.5.0 introduces \u003ccode\u003evlt skills\u003c/code\u003e, a command that discovers coding-agent instruction folders in installed JavaScript dependencies and links selected skills into project directories read by agents. Developers install a package, list its available skills, and select which ones to link. The chosen skills are tied to the dependency version in the project\u0026rsquo;s lockfile, so dependency updates also update the linked instructions. Selections are stored as \u003ccode\u003eallow-skills\u003c/code\u003e in \u003ccode\u003evlt.json\u003c/code\u003e and are maintained by subsequent installs, updates, and \u003ccode\u003evlt ci\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eBy default, vlt uses \u003ccode\u003e.agents/skills\u003c/code\u003e and can also link into detected agent-specific directories, including \u003ccode\u003e.claude/skills\u003c/code\u003e; destinations can be changed with \u003ccode\u003eskills-dir\u003c/code\u003e. Developers can select individual skills through the \u003ccode\u003e:skill()\u003c/code\u003e selector rather than linking every skill from a package. Linking is opt-in, and when no selection has been saved, \u003ccode\u003evlt skills link\u003c/code\u003e excludes packages marked as malware by Socket\u0026rsquo;s high-confidence alerts. Teams can also use Socket-powered rules to exclude packages flagged for typosquatting, vulnerabilities, or obfuscated code before their instructions are made available to coding agents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["vlt 1.5.0 introduces the vlt skills command, which finds agent instruction folders in installed dependencies and links selected skills into directories used by coding agents.","Skill selections are saved as allow-skills in vlt.json, allowing subsequent installs, updates, and vlt ci to maintain the configured links.","By default, vlt links skills into .agents/skills and can also use existing agent-specific folders such as .claude/skills.","When no selection is saved, vlt skills link excludes packages flagged as malware by Socket’s high-confidence alerts.","pnpm 12.11.0 also added support for linking skills from approved direct dependencies, indicating that JavaScript package managers are adding management of coding-agent instructions."],"insights":["vlt treats installing a package and making its instructions available to a coding agent as separate decisions, so package-provided guidance is not automatically exposed to agents.","Because linked skills come from the dependency version recorded in the lockfile, updating a dependency also updates the instructions associated with that specific version without manually copying files.","Teams can apply Socket-based rules beyond malware, such as excluding packages flagged for typosquatting, vulnerabilities, or obfuscated code before those packages can supply agent instructions.","The :skill() selector allows developers to approve individual instruction sets within a package rather than accepting every skill the package includes."],"referencedReports":[],"body":"\u003cp\u003evlt 1.5.0 introduces \u003ccode\u003evlt skills\u003c/code\u003e, a command that discovers coding-agent instruction folders in installed JavaScript dependencies and links selected skills into project directories read by agents. Developers install a package, list its available skills, and select which ones to link. The chosen skills are tied to the dependency version in the project\u0026rsquo;s lockfile, so dependency updates also update the linked instructions. Selections are stored as \u003ccode\u003eallow-skills\u003c/code\u003e in \u003ccode\u003evlt.json\u003c/code\u003e and are maintained by subsequent installs, updates, and \u003ccode\u003evlt ci\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eBy default, vlt uses \u003ccode\u003e.agents/skills\u003c/code\u003e and can also link into detected agent-specific directories, including \u003ccode\u003e.claude/skills\u003c/code\u003e; destinations can be changed with \u003ccode\u003eskills-dir\u003c/code\u003e. Developers can select individual skills through the \u003ccode\u003e:skill()\u003c/code\u003e selector rather than linking every skill from a package. Linking is opt-in, and when no selection has been saved, \u003ccode\u003evlt skills link\u003c/code\u003e excludes packages marked as malware by Socket\u0026rsquo;s high-confidence alerts. Teams can also use Socket-powered rules to exclude packages flagged for typosquatting, vulnerabilities, or obfuscated code before their instructions are made available to coding agents.\u003c/p\u003e\n"}]</script>
