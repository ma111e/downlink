Centre for Cyber Security warned that attackers are exploiting the maximum-severity Adobe ColdFusion vulnerability CVE-2026-48282.","CVE-2026-48282 affects Adobe ColdFusion versions 2025.9, 2023.20, and earlier, and can be exploited by attackers without privileges to gain remote code execution on unpatched systems.","Adobe released security updates for CVE-2026-48282 and recommended administrators install them as soon as possible, such as within 72 hours.","Shadowserver tracks nearly 800 Adobe ColdFusion instances exposed online, but the article says it is unknown how many are honeypots or already secured against CVE-2026-48282.","Adobe said it is not aware of any exploits in the wild for the issues addressed in last week’s ColdFusion and Campaign Classic updates, despite the Canadian Centre for Cyber Security citing open-source reporting that CVE-2026-48282 is being exploited."],"insights":["There is a notable gap between Adobe’s statement that it is not aware of exploits in the wild for the recently patched issues and the Canadian Centre for Cyber Security’s warning that open-source reporting shows CVE-2026-48282 is being exploited.","The article highlights a narrow remediation window, with Adobe recommending administrators install the ColdFusion update within 72 hours because the vulnerability is either being targeted or at higher risk of being targeted.","Exposure data is difficult to interpret because Shadowserver sees nearly 800 internet-facing Adobe ColdFusion instances, but the article says it is unknown how many are honeypots or already protected against CVE-2026-48282.","CVE-2026-48282 is part of a broader Adobe risk pattern noted in the article, as CISA has listed 79 actively exploited Adobe product vulnerabilities since November 2021, including 10 abused in ransomware attacks."],"referencedReports":[{"title":"Adobe Security Advisory AV26-647","url":"https://www.cyber.gc.ca/en/alerts-advisories/adobe-security-advisory-av26-647","publisher":"Canadian Centre for Cyber Security","context":"The article cites this advisory as warning that open-source reporting indicates CVE-2026-48282 is being exploited and urging users and administrators to apply updates.","category":"","primary":false}],"body":"\u003cp\u003eAttackers are now exploiting a maximum-severity Adobe ColdFusion vulnerability tracked as CVE-2026-48282, according to a warning from the Canadian Centre for Cyber Security. ColdFusion is a commercial web app development platform used to build and deploy enterprise-grade websites. The flaw affects ColdFusion versions 2025.9, 2023.20, and earlier.\u003c/p\u003e\n\n\u003cp\u003eAdobe released security updates to address the vulnerability and said the issue posed a high risk of exploitation. The company recommended administrators install the update as soon as possible, such as within 72 hours. The vulnerability can be exploited by attackers without privileges to gain remote code execution on unpatched systems.\u003c/p\u003e\n\n\u003cp\u003eThe Canadian Centre for Cyber Security said open-source reporting indicates CVE-2026-48282 is being exploited and urged users and administrators to apply the necessary updates. Shadowserver tracks nearly 800 Adobe ColdFusion instances exposed online, though the article says it is unknown how many are honeypots or already secured. The article also notes that CISA has included 79 Adobe product vulnerabilities in its catalog of actively exploited flaws since November 2021, including 10 abused in ransomware attacks.\u003c/p\u003e\n"},{"n":15,"title":"Threat Actors Probe Gitea Docker Flaw CVE-2026-20896 13 Days After Disclosure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threat-actors-probe-gitea-docker-flaw.html","time":"16:28","priority":"MUST READ","score":94,"tldr":"Threat actors have begun probing a critical Gitea Docker image flaw, CVE-2026-20896, just 13 days after disclosure. Users should upgrade to Gitea 1.26.3 or later because the bug can let unauthenticated attackers impersonate users, including admins, when reverse-proxy authentication is misconfigured.","briefOverview":"\u003cp\u003eThreat actors have been observed attempting to exploit CVE-2026-20896, a recently patched critical security flaw in Gitea Docker images, according to Sysdig. The vulnerability has a CVSS score of 9.8 and stems from Gitea trusting the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header from any source IP address. This can allow an unauthenticated internet client to gain elevated access.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Ali Mustafa said the issue came from Gitea Docker images shipping an \u003ccode\u003eapp.ini\u003c/code\u003e template that hard-codes \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES = *\u003c/code\u003e by default. When reverse-proxy login is enabled, that wildcard trusts every source IP, so anyone who can reach the port can send an \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header and be authenticated as any user. Gitea’s advisory said any process that can reach the container’s HTTP port directly, rather than through the intended authenticating proxy, can impersonate a known or guessable user, with admin accounts being obvious targets.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects Gitea Docker image versions before and including 1.26.2 and was fixed in version 1.26.3, which removed the wildcard and made reverse-proxy authentication opt-in. Sysdig said it detected the first in-the-wild exploitation attempt 13 days after public disclosure, and the activity so far has been related to initial investigation by the threat actor. The article notes that there are about 6,200 internet-facing Gitea instances and urges users to apply the fixes as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors have been observed attempting to exploit CVE-2026-20896, a critical flaw in Gitea Docker images, according to Sysdig.","CVE-2026-20896 has a CVSS score of 9.8 and allows unauthenticated internet clients to gain elevated access because Gitea trusts the X-WEBAUTH-USER header from any source IP address.","Security researcher Ali Mustafa said the issue stems from Gitea Docker images shipping an app.ini template that hard-codes REVERSE_PROXY_TRUSTED_PROXIES = * by default.","The vulnerability affects Gitea Docker image versions before and including 1.26.2 and was fixed in version 1.26.3 by removing the wildcard and making reverse-proxy authentication opt-in.","Sysdig said it detected the first in-the-wild exploitation attempt 13 days after public disclosure, with activity so far limited to initial investigation by the threat actor."],"insights":["The official Gitea Docker image used a less safe default than Gitea’s documented configuration, replacing the localhost-only trusted proxy value with a wildcard that trusts every source IP.","Exposure depends not just on the vulnerable Docker image version but also on whether reverse-proxy authentication is enabled and whether the Gitea container’s HTTP port can be reached directly instead of only through the intended proxy.","If auto-registration is enabled, the article says using an administrator username can result in administrator access, making common admin account names especially sensitive targets.","Sysdig’s observation of probing only 13 days after disclosure shows that internet-facing Gitea instances had a short window before attackers began checking for the flaw."],"referencedReports":[{"title":"Gitea security advisory for CVE-2026-20896","url":"https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4","publisher":"Gitea","context":"The article cites Gitea's advisory as the source for the critical Docker image flaw tracked as CVE-2026-20896.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors have been observed attempting to exploit CVE-2026-20896, a recently patched critical security flaw in Gitea Docker images, according to Sysdig. The vulnerability has a CVSS score of 9.8 and stems from Gitea trusting the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header from any source IP address. This can allow an unauthenticated internet client to gain elevated access.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Ali Mustafa said the issue came from Gitea Docker images shipping an \u003ccode\u003eapp.ini\u003c/code\u003e template that hard-codes \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES = *\u003c/code\u003e by default. When reverse-proxy login is enabled, that wildcard trusts every source IP, so anyone who can reach the port can send an \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header and be authenticated as any user. Gitea’s advisory said any process that can reach the container’s HTTP port directly, rather than through the intended authenticating proxy, can impersonate a known or guessable user, with admin accounts being obvious targets.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects Gitea Docker image versions before and including 1.26.2 and was fixed in version 1.26.3, which removed the wildcard and made reverse-proxy authentication opt-in. Sysdig said it detected the first in-the-wild exploitation attempt 13 days after public disclosure, and the activity so far has been related to initial investigation by the threat actor. The article notes that there are about 6,200 internet-facing Gitea instances and urges users to apply the fixes as soon as possible.\u003c/p\u003e\n"},{"n":11,"title":"Iran-Linked Hackers Use New Cavern C2 Framework to Target Israeli Organizations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/iran-linked-hackers-use-new-cavern-c2.html","time":"18:34","priority":"MUST READ","score":93,"tldr":"Iran-linked Cavern Manticore is using a previously undocumented modular C2 framework called Cavern to target Israeli IT providers and government organizations, abusing SysAid software updates and trusted service-provider relationships for lateral movement. The framework’s mixed .NET compilation methods and plug-in modules support stealthy post-exploitation tasks such as reconnaissance, data theft, tunneling, and brute-force activity.","briefOverview":"\u003cp\u003eAn Iranian hacking group affiliated with Iran’s Ministry of Intelligence and Security has been using a previously undocumented modular command-and-control framework called Cavern, also known as Cav3rn, to target Israeli organizations. Check Point Research tracks the threat cluster as Cavern Manticore and said the activity has primarily singled out IT providers and government sectors. The group shares some tactical overlaps with MuddyWater and Lyceum, with Lyceum assessed as a subgroup within OilRig.\u003c/p\u003e\n\n\u003cp\u003eThe documented attack chain begins with SysAid’s software update feature, which is used to start a DLL side-loading chain that executes a trojanized uxtheme.dll containing the Cavern Agent. The agent loads a communication DLL called n-HTCommp.dll to contact the command-and-control server hospitalinstallation[.]com and fetch additional modules over HTTPS or WebSocket. Check Point Research identified modules for file operations, SQL database activity, Active Directory reconnaissance, network reconnaissance, SMB brute-force attempts, SOCKS5 proxying, and WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eCavern uses multiple .NET compilation formats across its components, including .NET Framework, .NET Mixed-Mode C++/CLI, and .NET Native AOT, which Check Point said creates an anti-analysis layer for reverse engineers. The attacks also involved movement from an initially compromised IT provider to a second-hop provider before reaching the intended target organization, highlighting abuse of trusted service-provider relationships and Remote Monitoring and Management solutions. The article also notes related Iranian activity in which MuddyWater exploited known flaws and shifted from broad reconnaissance to credential harvesting and data exfiltration against aviation, energy, and government sectors in the Middle East.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research attributed attacks on Israeli IT providers and government sectors to an Iran-linked threat cluster it tracks as Cavern Manticore.","Cavern Manticore used a previously undocumented modular command-and-control framework called Cavern, also known as Cav3rn, which separates core communication functions from post-exploitation modules.","The documented attack chain began with SysAid’s software update feature and used DLL side-loading to execute a trojanized uxtheme.dll containing the Cavern Agent.","The Cavern framework includes modules for file operations, SQL database activity, Active Directory reconnaissance, network reconnaissance, SMB brute-force attempts, SOCKS5 proxying, and WebSocket tunneling.","Check Point Research said the actor moved from a compromised IT provider to a second-hop provider before reaching intended targets, showing abuse of trusted service-provider relationships."],"insights":["The Cavern framework uses different .NET compilation formats across components, making the compilation format itself part of the anti-analysis approach because reverse engineers must use multiple toolsets and metadata-reconstruction workflows.","Cavern’s module dispatcher treats files with names starting with “n-” as native DLLs and loads other modules as managed .NET assemblies, making module naming a meaningful indicator of how components are handled.","The actor abused trusted service-provider relationships and Remote Monitoring and Management deployments to move between victims and deliver malicious software disguised as legitimate updates.","The article notes that the actor used browser-based remote desktop technologies and, in some cases, remote printing features to exfiltrate data when clipboard copy-paste or file-transfer capabilities were restricted.","Cavern’s separation of core communications from mission-specific modules lets operators tailor deployments to each victim while reducing forensic visibility and maintaining persistent access."],"referencedReports":[{"title":"Cavern Manticore: Exposing Iran-Linked Modular C2 Framework","url":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","publisher":"Check Point Research","context":"The article relies on Check Point Research’s analysis attributing the Cavern framework activity to Cavern Manticore and describing the framework’s architecture, modules, and anti-analysis features.","category":"","primary":false},{"title":"Oasis Security report on Iranian activity","url":"https://oasis-security.io/blog/260414-Iran","publisher":"Oasis Security","context":"The article cites Oasis Security for details on an Iranian operation that moved from reconnaissance to credential harvesting and data exfiltration against Middle Eastern aviation, energy, and government sectors.","category":"","primary":false}],"body":"\u003cp\u003eAn Iranian hacking group affiliated with Iran’s Ministry of Intelligence and Security has been using a previously undocumented modular command-and-control framework called Cavern, also known as Cav3rn, to target Israeli organizations. Check Point Research tracks the threat cluster as Cavern Manticore and said the activity has primarily singled out IT providers and government sectors. The group shares some tactical overlaps with MuddyWater and Lyceum, with Lyceum assessed as a subgroup within OilRig.\u003c/p\u003e\n\n\u003cp\u003eThe documented attack chain begins with SysAid’s software update feature, which is used to start a DLL side-loading chain that executes a trojanized uxtheme.dll containing the Cavern Agent. The agent loads a communication DLL called n-HTCommp.dll to contact the command-and-control server hospitalinstallation[.]com and fetch additional modules over HTTPS or WebSocket. Check Point Research identified modules for file operations, SQL database activity, Active Directory reconnaissance, network reconnaissance, SMB brute-force attempts, SOCKS5 proxying, and WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eCavern uses multiple .NET compilation formats across its components, including .NET Framework, .NET Mixed-Mode C++/CLI, and .NET Native AOT, which Check Point said creates an anti-analysis layer for reverse engineers. The attacks also involved movement from an initially compromised IT provider to a second-hop provider before reaching the intended target organization, highlighting abuse of trusted service-provider relationships and Remote Monitoring and Management solutions. The article also notes related Iranian activity in which MuddyWater exploited known flaws and shifted from broad reconnaissance to credential harvesting and data exfiltration against aviation, energy, and government sectors in the Middle East.\u003c/p\u003e\n"},{"n":24,"title":"Cavern Manticore: Exposing Iran-Linked Modular C2 Framework","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","time":"12:25","priority":"MUST READ","score":93,"tldr":"Check Point Research details Cavern Manticore, an Iran-linked actor targeting Israeli government and IT organizations with a modular .NET C2 framework that uses unusual compilation formats, AppDomain isolation, and low-detection modules to complicate analysis and forensics. The campaign often begins by abusing trusted RMM software and supplier relationships, highlighting the risk of monitoring blind spots in legitimate administrative tools.","briefOverview":"\u003cp\u003eCheck Point Research tracks Cavern Manticore as an Iran-nexus threat actor operating against Israeli targets, especially in the government and IT sectors. Since early 2026, CPR observed the group using a new modular command-and-control framework called Cavern. In multiple intrusions, the initial foothold was achieved through abuse of existing Remote Monitoring and Management software deployed in the targeted organization.\u003c/p\u003e\n\n\u003cp\u003eCavern is built on .NET but deliberately uses three compilation formats: .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT. The recovered execution chain begins with abuse of SysAid’s software update feature to deploy a WinDirStat DLL sideloading package, where a trojanized \u003ccode\u003euxtheme.dll\u003c/code\u003e acts as the Cavern Agent. The framework separates the core agent and communication module from post-exploitation modules for file operations, SQL database browsing, LDAP querying, network reconnaissance, SMB brute-force, and SOCKS5/WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights Cavern’s anti-analysis design, including uncommon .NET compilation formats, NativeAOT binaries that hide strings and API usage from simple triage, and per-module AppDomain isolation that allows managed modules to be unloaded after execution. Newer agent builds also wipe most working-directory files on startup, leaving only the communication module, configuration file, and logs. CPR assesses that the activity reflects supply-chain risk because compromised IT providers and trusted remote management tools can be used as stepping stones toward higher-value targets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research tracks Cavern Manticore as an Iran-nexus threat actor targeting Israeli organizations, especially in the government and IT sectors.","Cavern Manticore uses a modular command-and-control framework built on .NET, with components compiled as .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT binaries.","The observed execution chain begins with abuse of SysAid’s software update feature to deploy a WinDirStat DLL sideloading package, where a trojanized uxtheme.dll acts as the Cavern Agent.","The Cavern framework includes modules for file system operations, SQL database browsing, LDAP and Active Directory reconnaissance, network reconnaissance, SMB brute-force, and SOCKS5/WebSocket tunneling.","Check Point Research observed that multiple intrusions gained an initial foothold through abuse of existing Remote Monitoring and Management software deployed in the targeted organization."],"insights":["Cavern’s main anti-analysis technique is not traditional packing or string encryption, but the deliberate use of three different .NET compilation formats that force analysts to use separate workflows for different components.","The agent loads each managed module into a separate AppDomain and unloads it after execution, which allows modules to be removed from memory without terminating the host process and reduces recoverable forensic artifacts.","The communication module’s NativeAOT format hides important command verbs, URL fragments, and API usage from simple string and import-table checks, making basic static triage unreliable.","Newer agent builds delete most files in their working directory on startup except the communication module, configuration file, and logs, which can wipe modules delivered in earlier sessions before defenders can collect them.","The fixed Microsoft Edge User-Agent and custom X-User-token header used by HTTP-based C2 traffic provide more stable detection opportunities than many of the framework’s low-detection binaries."],"referencedReports":[{"title":"OilRig’s Outer Space and Juicy Mix: Same ol’ rig, new drill pipes","url":"https://www.welivesecurity.com/en/eset-research/oilrigs-outer-space-juicy-mix-same-ol-rig-new-drill-pipes/","publisher":"ESET Research","context":"The article cites this ESET research when discussing Cavern Manticore’s links to the OilRig subgroup Lyceum.","category":"","primary":false},{"title":"Recovering Metadata from .NET Native AOT Binaries","url":"https://blog.washi.dev/posts/recovering-nativeaot-metadata/","publisher":"Washi","context":"The article references this technical write-up while explaining tooling used to reconstruct metadata from NativeAOT samples.","category":"","primary":false},{"title":"Mercury leveraging Log4j 2 vulnerabilities in unpatched systems to target Israeli organizations","url":"https://www.microsoft.com/en-us/security/blog/2022/08/25/mercury-leveraging-log4j-2-vulnerabilities-in-unpatched-systems-to-target-israeli-organizations/?msockid=0813a307e19b696c19cab43ee0c768c2","publisher":"Microsoft","context":"The article cites this Microsoft report as prior activity involving SysAid servers linked to Iranian MOIS-aligned actors including MuddyWater.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Research tracks Cavern Manticore as an Iran-nexus threat actor operating against Israeli targets, especially in the government and IT sectors. Since early 2026, CPR observed the group using a new modular command-and-control framework called Cavern. In multiple intrusions, the initial foothold was achieved through abuse of existing Remote Monitoring and Management software deployed in the targeted organization.\u003c/p\u003e\n\n\u003cp\u003eCavern is built on .NET but deliberately uses three compilation formats: .NET Framework, Mixed-Mode C++/CLI, and .NET 8 NativeAOT. The recovered execution chain begins with abuse of SysAid’s software update feature to deploy a WinDirStat DLL sideloading package, where a trojanized \u003ccode\u003euxtheme.dll\u003c/code\u003e acts as the Cavern Agent. The framework separates the core agent and communication module from post-exploitation modules for file operations, SQL database browsing, LDAP querying, network reconnaissance, SMB brute-force, and SOCKS5/WebSocket tunneling.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights Cavern’s anti-analysis design, including uncommon .NET compilation formats, NativeAOT binaries that hide strings and API usage from simple triage, and per-module AppDomain isolation that allows managed modules to be unloaded after execution. Newer agent builds also wipe most working-directory files on startup, leaving only the communication module, configuration file, and logs. CPR assesses that the activity reflects supply-chain risk because compromised IT providers and trusted remote management tools can be used as stepping stones toward higher-value targets.\u003c/p\u003e\n"},{"n":8,"title":"Major medical device manufacturer notifies nearly 4 million of breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/medical-device-maker-notifies-nearly-4-million-of-breach","time":"18:03","priority":"MUST READ","score":92,"tldr":"Medtronic is notifying more than 3.8 million people that hackers accessed personal and health-related data, including Social Security numbers, tied to patients with its medical devices. The incident was reportedly linked to ShinyHunters, and the company is offering two years of identity protection services.","briefOverview":"\u003cp\u003eMedtronic, described as the world’s largest medical device company, is notifying more than 3.8 million people that their data may have been exposed. The attack was reportedly linked to the ShinyHunters cybercrime group. On April 24, Medtronic confirmed that an unauthorized party had accessed data in certain corporate IT systems, while saying at the time that it had not identified any connections to customers.\u003c/p\u003e\n\n\u003cp\u003eOn June 29, the California Attorney General released a copy of Medtronic’s notification letter. The letter said that, as patients with Medtronic medical devices, affected people had data collected by the company to provide important product-related updates and meet legal obligations. The accessed information included Social Security numbers, health-related data, names, contact information, and dates of birth. Medtronic said it had no evidence that impacted information had been publicly posted or exposed on the internet.\u003c/p\u003e\n\n\u003cp\u003eMedtronic said it is offering affected individuals 24 months of free credit monitoring, dark web monitoring, and identity theft restoration services. The article describes the breach as the latest example of a hacking gang targeting a company in the medical technology sector. It also cites a March incident involving Stryker, whose systems were wiped in a cyberattack that federal prosecutors attributed to Iran-backed hackers and that directly affected emergency medical services and hospitals in Maryland.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Medtronic is notifying more than 3.8 million people that their data may have been exposed in an attack reportedly linked to the ShinyHunters cybercrime group.","Medtronic confirmed on April 24 that an unauthorized party had accessed data in certain corporate IT systems.","A notification letter released by the California Attorney General said the affected people were patients with Medtronic medical devices.","The accessed data included Social Security numbers, health-related data, names, contact information, and dates of birth.","Medtronic said it has no evidence that the impacted information has been publicly posted or exposed on the internet and is offering affected individuals 24 months of free credit monitoring, dark web monitoring, and identity theft restoration services."],"insights":["Medtronic’s April statement said it had not identified any connections to customers, but the later notification letter described affected individuals as patients with Medtronic medical devices.","The exposed data was collected not only for product-related updates but also to meet Medtronic’s legal obligations, showing that required patient data collection can become part of a breach’s impact.","The article frames the Medtronic incident as part of a broader pattern of medical technology companies being targeted, citing Stryker’s March cyberattack as another example.","The Stryker incident showed that attacks on medical device companies can affect care delivery beyond the company itself, including emergency medical services and hospital connectivity decisions."],"referencedReports":[],"body":"\u003cp\u003eMedtronic, described as the world’s largest medical device company, is notifying more than 3.8 million people that their data may have been exposed. The attack was reportedly linked to the ShinyHunters cybercrime group. On April 24, Medtronic confirmed that an unauthorized party had accessed data in certain corporate IT systems, while saying at the time that it had not identified any connections to customers.\u003c/p\u003e\n\n\u003cp\u003eOn June 29, the California Attorney General released a copy of Medtronic’s notification letter. The letter said that, as patients with Medtronic medical devices, affected people had data collected by the company to provide important product-related updates and meet legal obligations. The accessed information included Social Security numbers, health-related data, names, contact information, and dates of birth. Medtronic said it had no evidence that impacted information had been publicly posted or exposed on the internet.\u003c/p\u003e\n\n\u003cp\u003eMedtronic said it is offering affected individuals 24 months of free credit monitoring, dark web monitoring, and identity theft restoration services. The article describes the breach as the latest example of a hacking gang targeting a company in the medical technology sector. It also cites a March incident involving Stryker, whose systems were wiped in a cyberattack that federal prosecutors attributed to Iran-backed hackers and that directly affected emergency medical services and hospitals in Maryland.\u003c/p\u003e\n"},{"n":19,"title":"16-Year-Old Linux KVM Flaw Lets Guest VMs Escape to Host on Intel and AMD x86 Systems","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/16-year-old-linux-kvm-flaw-lets-guest.html","time":"17:37","priority":"MUST READ","score":92,"tldr":"A 16-year-old Linux KVM flaw called Januscape lets a root user inside an x86 guest VM with nested virtualization enabled crash the host, and a withheld exploit reportedly achieves full host code execution. Operators of Intel and AMD KVM hosts running untrusted guests should patch immediately or disable nested virtualization.","briefOverview":"\u003cp\u003eA use-after-free bug in Linux’s KVM hypervisor, dubbed Januscape and tracked as CVE-2026-53359, can be triggered from a guest virtual machine to corrupt the shadow-page state of the host kernel. The public proof-of-concept panics the host, while researcher Hyunwoo Kim says a separate unreleased exploit turns the same bug into full host code execution. Kim reported the flaw and said it was used as a zero-day submission in Google’s kvmCTF program.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is in KVM’s shadow MMU code shared across Intel and AMD x86 systems, where KVM reused tracking pages based on memory address alone without checking the page type. The vulnerable code has been present since August 2010 and was fixed by commit 81ccda30b4e8, merged into mainline on June 19, 2026. The attack requires root inside the guest VM and nested virtualization exposed by the host, which forces KVM through the legacy shadow MMU path.\u003c/p\u003e\n\n\u003cp\u003eThe main practical risk is to x86 KVM environments hosting untrusted guests with nested virtualization enabled, where an attacker renting one instance could panic the host and take down other VMs on the same machine. Kim said the withheld exploit runs code as root on the host, and noted the bug could also serve as local privilege escalation on distributions such as RHEL where /dev/kvm is world-writable. Fixed stable versions shipped on July 4, 2026, and the article advises operators to verify the fix or disable nested virtualization if they cannot patch immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A use-after-free bug in Linux’s KVM hypervisor, dubbed Januscape and tracked as CVE-2026-53359, can be triggered from a guest virtual machine to corrupt the host kernel’s shadow-page state.","The public proof-of-concept for Januscape panics the host, while researcher Hyunwoo Kim claims a separate unreleased exploit achieves full host code execution.","The flaw affects Intel and AMD x86 KVM environments that host untrusted guests with nested virtualization enabled, and the exploit requires root access inside the guest VM.","The vulnerable code has been present since August 2010 and was fixed by commit 81ccda30b4e8, which was merged into mainline on June 19, 2026.","Fixed stable kernel versions shipped on July 4, 2026, and operators unable to patch immediately can disable nested virtualization with kvm_intel.nested=0 or kvm_amd.nested=0."],"insights":["Nested virtualization is the critical exposure condition because it forces x86 KVM back through the legacy shadow MMU code path even on hosts that normally use hardware EPT or NPT.","The fix is unusually small for a high-impact issue: KVM now checks the shadow page role as well as the guest frame number before reusing a page.","Distribution kernel version strings alone may not show whether the fix is present, so operators are advised to verify package changelogs or the presence of commit 81ccda30b4e8.","The same vulnerable KVM code path has produced two separate shadow MMU use-after-free fixes within two months, including CVE-2026-46113 in May 2026 and Januscape in June 2026.","On distributions where /dev/kvm is world-writable, such as RHEL according to Kim, the bug may also be usable as a local privilege escalation path rather than only a guest-to-host escape."],"referencedReports":[{"title":"Januscape","url":"https://github.com/V4bel/Januscape","publisher":"Hyunwoo Kim / V4bel","context":"The article links to the Januscape research and public proof-of-concept for CVE-2026-53359, which demonstrates a host panic from a guest VM.","category":"","primary":false},{"title":"Patch for kvm_mmu_get_child_sp()","url":"https://lore.kernel.org/all/20260617134425.440091-1-pbonzini@redhat.com/","publisher":"Paolo Bonzini / Red Hat","context":"The article references Paolo Bonzini’s patch as the fix that adds a role check when reusing KVM shadow pages.","category":"","primary":false},{"title":"Dirty Frag","url":"https://github.com/V4bel/dirtyfrag","publisher":"Hyunwoo Kim / V4bel","context":"The article cites Dirty Frag as a prior Linux kernel exploit disclosure by the same researcher in May 2026.","category":"","primary":false},{"title":"ITScape","url":"https://github.com/V4bel/ITScape","publisher":"Hyunwoo Kim / V4bel","context":"The article cites ITScape as a prior KVM/arm64 guest-to-host escape disclosure by the same researcher in June 2026.","category":"","primary":false}],"body":"\u003cp\u003eA use-after-free bug in Linux’s KVM hypervisor, dubbed Januscape and tracked as CVE-2026-53359, can be triggered from a guest virtual machine to corrupt the shadow-page state of the host kernel. The public proof-of-concept panics the host, while researcher Hyunwoo Kim says a separate unreleased exploit turns the same bug into full host code execution. Kim reported the flaw and said it was used as a zero-day submission in Google’s kvmCTF program.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is in KVM’s shadow MMU code shared across Intel and AMD x86 systems, where KVM reused tracking pages based on memory address alone without checking the page type. The vulnerable code has been present since August 2010 and was fixed by commit 81ccda30b4e8, merged into mainline on June 19, 2026. The attack requires root inside the guest VM and nested virtualization exposed by the host, which forces KVM through the legacy shadow MMU path.\u003c/p\u003e\n\n\u003cp\u003eThe main practical risk is to x86 KVM environments hosting untrusted guests with nested virtualization enabled, where an attacker renting one instance could panic the host and take down other VMs on the same machine. Kim said the withheld exploit runs code as root on the host, and noted the bug could also serve as local privilege escalation on distributions such as RHEL where /dev/kvm is world-writable. Fixed stable versions shipped on July 4, 2026, and the article advises operators to verify the fix or disable nested virtualization if they cannot patch immediately.\u003c/p\u003e\n"},{"n":12,"title":"Suspected China-Nexus Hackers Use Fake Indian Tax Filing Utility to Deploy DcRAT","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/suspected-china-nexus-hackers-use-fake.html","time":"10:58","priority":"MUST READ","score":91,"tldr":"A suspected China-linked campaign dubbed Operation DragonReturn is targeting Indian taxpayers and finance professionals with fake Income Tax Department lures that install DcRAT via a malicious tax-filing utility. The operation uses DLL sideloading, anti-analysis checks, persistence, and image-based payload concealment to steal data and maintain covert access.","briefOverview":"\u003cp\u003eA suspected China-nexus threat activity cluster has been observed targeting Indian taxpayers, tax professionals, and corporate finance teams with a remote access trojan designed to steal sensitive data. The campaign, named Operation DragonReturn by Seqrite Labs, uses spear-phishing emails that impersonate the Income Tax Department of India and was first observed on May 18, 2026. Seqrite Labs said the campaign coincides with India’s annual income tax filing season and appears focused specifically on the Indian taxpayer ecosystem.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with phishing messages using tax violations and penalty lures to create urgency and direct recipients to a malicious link embedded in PDF attachments. The fake landing page tells users to download a ZIP archive that appears to contain an official offline tax filing utility, but it is designed to sideload a malicious DLL named nvdaHelperRemote.dll. The malware then retrieves a JPG file from a hard-coded server, extracts a secondary DLL from it, copies itself as Mixed Reality.exe, and creates a Windows service named MixedSvc for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe deployed payloads include a .NET malware loader that performs anti-analysis checks, establishes persistence, disables Windows AMSI scanning, and decrypts and loads DCRat on the infected system. A second payload can take screenshots and exfiltrate data to a remote server. Seqrite Labs said infrastructure clues include ChinaNet IP addresses, a Chinese-language DCRat command-and-control panel, and overlaps with Silver Fox, while the article also notes related ValleyRAT campaigns using fake installers and phishing emails against Chinese- and Japanese-speaking users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Seqrite Labs reported a suspected China-nexus campaign called Operation DragonReturn that targets Indian taxpayers, tax professionals, and corporate finance teams with emails impersonating the Income Tax Department of India.","The campaign uses tax violation and penalty lures in PDF attachments to direct victims to a fake site that offers a ZIP archive posing as an Indian tax filing utility.","The fake utility sideloads a malicious DLL named nvdaHelperRemote.dll, retrieves a JPG file from a hard-coded server, extracts another DLL from it, and creates a Windows service named MixedSvc for persistence.","The deployed payloads include a .NET loader that disables Windows AMSI scanning and loads DCRat, as well as another payload capable of taking screenshots and exfiltrating data to kkxqbh.top.","Seqrite Labs said the infrastructure includes ChinaNet IP addresses and a Chinese-language DCRat command-and-control panel, with tactical overlaps to the Chinese cybercrime group Silver Fox."],"insights":["The campaign’s timing during India’s annual income tax filing season, combined with real legal citations and bilingual lure content, indicates the attackers tailored the operation specifically to the Indian taxpayer ecosystem rather than using a generic phishing theme.","The attackers used an image file as a container for a secondary payload, showing that defenders should not treat downloaded JPG files in this chain as harmless static content.","The malware requests administrative privileges through a User Account Control prompt before continuing, making unexpected elevation prompts from a tax-filing utility a concrete warning sign for affected users.","The article links Operation DragonReturn to broader China-linked activity through multiple clues, including ChinaNet infrastructure, a Chinese-language DCRat management panel, and overlaps with Silver Fox tax-themed phishing campaigns.","The related ValleyRAT campaigns show similar use of fake installers and DLL side-loading across different language communities, suggesting this delivery approach is being reused beyond the Indian tax-themed operation."],"referencedReports":[{"title":"Operation DragonReturn: China-Nexus Cyber Espionage Campaign Targeting Govt of India MoF Tax Infrastructure via Multi-Stage DCRat Deployment","url":"https://www.seqrite.com/blog/operation-dragonreturn-china-nexus-cyber-espionage-campaign-targeting-govt-of-india-mof-tax-infrastructure-via-multi-stage-dcrat-deployment/","publisher":"Seqrite Labs","context":"The article bases its main reporting on Seqrite Labs' analysis of Operation DragonReturn targeting Indian taxpayers with a multi-stage DCRat deployment chain.","category":"","primary":false},{"title":"An Analysis of ValleyRAT Infection Campaigns: From Fake Installers \u0026 Japanese Malicious Emails","url":"https://www.levelblue.com/blogs/spiderlabs-blog/an-analysis-of-valleyrat-infection-campaigns-from-fake-installers-japanese-malicious-emails","publisher":"LevelBlue","context":"The article cites LevelBlue's findings on two distinct ValleyRAT campaigns using fake installers and salary-adjustment phishing lures.","category":"","primary":false},{"title":"Fake Installer ValleyRAT","url":"https://www.cybereason.com/blog/fake-installer-valleyrat","publisher":"Cybereason","context":"The article references Cybereason's analysis of fake installer attack chains that deliver ValleyRAT and use PoolParty Variant 7.","category":"","primary":false},{"title":"Under the SADBRIDGE with GOSAR","url":"https://www.elastic.co/security-labs/under-the-sadbridge-with-gosar","publisher":"Elastic Security Labs","context":"The article cites Elastic Security Labs' analysis connecting SADBRIDGE to deployment of GOSAR and attribution to REF3864.","category":"","primary":false}],"body":"\u003cp\u003eA suspected China-nexus threat activity cluster has been observed targeting Indian taxpayers, tax professionals, and corporate finance teams with a remote access trojan designed to steal sensitive data. The campaign, named Operation DragonReturn by Seqrite Labs, uses spear-phishing emails that impersonate the Income Tax Department of India and was first observed on May 18, 2026. Seqrite Labs said the campaign coincides with India’s annual income tax filing season and appears focused specifically on the Indian taxpayer ecosystem.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with phishing messages using tax violations and penalty lures to create urgency and direct recipients to a malicious link embedded in PDF attachments. The fake landing page tells users to download a ZIP archive that appears to contain an official offline tax filing utility, but it is designed to sideload a malicious DLL named nvdaHelperRemote.dll. The malware then retrieves a JPG file from a hard-coded server, extracts a secondary DLL from it, copies itself as Mixed Reality.exe, and creates a Windows service named MixedSvc for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe deployed payloads include a .NET malware loader that performs anti-analysis checks, establishes persistence, disables Windows AMSI scanning, and decrypts and loads DCRat on the infected system. A second payload can take screenshots and exfiltrate data to a remote server. Seqrite Labs said infrastructure clues include ChinaNet IP addresses, a Chinese-language DCRat command-and-control panel, and overlaps with Silver Fox, while the article also notes related ValleyRAT campaigns using fake installers and phishing emails against Chinese- and Japanese-speaking users.\u003c/p\u003e\n"},{"n":4,"title":"Fake IT support calls on Microsoft Teams push EtherRAT malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fake-it-support-calls-on-microsoft-teams-push-etherrat-malware/","time":"20:23","priority":"SHOULD READ","score":84,"tldr":"Attackers are impersonating IT support on Microsoft Teams voice calls to trick employees into granting remote access and installing EtherRAT malware. The campaign highlights growing abuse of external Teams communications for initial access into corporate networks.","briefOverview":"\u003cp\u003eThreat actors are abusing Microsoft Teams voice calls by impersonating corporate IT support staff to trick employees into installing EtherRAT malware. Palo Alto Networks’ Unit 42 reported that the campaign begins with a phishing email using an “Employee Survey” lure and a malicious PDF attachment. Shortly after the document is opened, the victim receives a Microsoft Teams voice call from an external account posing as a “System Administrator.”\u003c/p\u003e\n\n\u003cp\u003eThe attackers convince the victim to grant remote control through Microsoft Teams’ built-in screen-sharing feature and guide them to install legitimate remote-access tools, including HopToDesk and AnyDesk. They then download and execute a malicious MSI installer from camorreado[.]click, which downloads a legitimate Node.js runtime, decrypts embedded payloads, and launches EtherRAT. EtherRAT is a Node.js-based remote access trojan that can execute commands, manipulate files, steal data, maintain persistence, and use Ethereum smart contracts to retrieve its active command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 found an open directory on a distribution server containing multiple installer versions from v1 through v9, indicating the campaign is actively being developed. The article says this activity follows other Microsoft Teams abuse campaigns in which attackers impersonated IT or helpdesk staff to gain remote access, perform reconnaissance, spread laterally, and steal data. Microsoft has added Teams protections including warnings for external callers and chats, as well as a policy that places suspected third-party bots into meeting lobbies until organizers approve them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are abusing Microsoft Teams voice calls by impersonating corporate IT support staff to trick employees into installing EtherRAT malware.","Unit 42 reported that the campaign begins with a phishing email containing an “Employee Survey” lure and a malicious PDF attachment, followed by a Teams voice call from an external account posing as a system administrator.","Attackers convince victims to grant remote control through Microsoft Teams screen sharing and guide them to install legitimate remote-access tools including HopToDesk and AnyDesk.","The attackers then download and execute a malicious MSI installer from camorreado[.]click that loads a Node.js runtime, decrypts embedded payloads, and launches EtherRAT.","Microsoft has added protections to Teams, including warnings for external callers and chats and a policy that places suspected third-party bots into the meeting lobby."],"insights":["The Teams session showed an “External unfamiliar” label, making Microsoft’s external-caller warning a concrete signal employees could use to recognize the impersonation attempt.","The attackers relied on legitimate remote-access tools such as HopToDesk and AnyDesk before deploying malware, which means the compromise path included software that may not appear malicious by itself.","Unit 42 found an open directory containing installer versions v1 through v9, indicating the malware delivery package was being actively revised during the campaign.","EtherRAT retrieves its active command-and-control server through Ethereum smart contracts, which the article says makes the attacker infrastructure harder to disrupt.","The campaign combined email, Teams voice calls, screen sharing, remote-access tools, and a Node.js-based loader, showing that the intrusion depended on multiple trusted workplace tools rather than a single malicious attachment."],"referencedReports":[{"title":"Fake IT support abuses Teams to deliver EtherRAT","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-06-28-Fake-IT-support-abuses-Teams-to-deliver-EtherRAT.txt","publisher":"Palo Alto Networks Unit 42","context":"The article says Unit 42 reported the Microsoft Teams impersonation campaign and describes its findings from this GitHub report.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors are abusing Microsoft Teams voice calls by impersonating corporate IT support staff to trick employees into installing EtherRAT malware. Palo Alto Networks’ Unit 42 reported that the campaign begins with a phishing email using an “Employee Survey” lure and a malicious PDF attachment. Shortly after the document is opened, the victim receives a Microsoft Teams voice call from an external account posing as a “System Administrator.”\u003c/p\u003e\n\n\u003cp\u003eThe attackers convince the victim to grant remote control through Microsoft Teams’ built-in screen-sharing feature and guide them to install legitimate remote-access tools, including HopToDesk and AnyDesk. They then download and execute a malicious MSI installer from camorreado[.]click, which downloads a legitimate Node.js runtime, decrypts embedded payloads, and launches EtherRAT. EtherRAT is a Node.js-based remote access trojan that can execute commands, manipulate files, steal data, maintain persistence, and use Ethereum smart contracts to retrieve its active command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 found an open directory on a distribution server containing multiple installer versions from v1 through v9, indicating the campaign is actively being developed. The article says this activity follows other Microsoft Teams abuse campaigns in which attackers impersonated IT or helpdesk staff to gain remote access, perform reconnaissance, spread laterally, and steal data. Microsoft has added Teams protections including warnings for external callers and chats, as well as a policy that places suspected third-party bots into meeting lobbies until organizers approve them.\u003c/p\u003e\n"},{"n":23,"title":"When checking the URL isn’t enough: a Device Code Phishing attack via a Microsoft website","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/microsoft-device-code-phishing-attack/120350/","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"Attackers are abusing Microsoft’s legitimate Device Code Flow to trick users into entering one-time codes on official Microsoft pages, allowing them to obtain access and refresh tokens even when MFA is completed. Organizations should disable Device Code Flow where unnecessary and monitor DeviceCodeSignIn events for anomalous activity.","briefOverview":"\u003cp\u003eThe article describes a Device Code Phishing campaign that abused Microsoft’s legitimate Device Authorization Grant flow. Instead of asking victims to enter credentials on a fake domain, attackers guided them to enter a one-time code on Microsoft’s real authentication page. This undermines the common advice to only check whether a login page is on the correct domain. The campaign observed by Kaspersky ran from early April to mid-May 2026 and used phishing emails styled as law firm notices with password-protected PDF attachments.\u003c/p\u003e\n\n\u003cp\u003eThe attack flow led victims from a PDF link through redirects and CAPTCHA pages to a phishing page that displayed a one-time code fetched by the attacker’s server-side application. Clicking the code copied it to the clipboard and redirected the victim to Microsoft’s official device login page, where the victim entered the code and completed MFA. After successful authentication, the attacker obtained access_token, refresh_token, and id_token values, enabling access to the victim’s mailbox, OneDrive files, and Teams conversations. The article also describes a later Portuguese-language variant targeting users in Brazil that used Cacoo.com as a trusted open redirect before sending victims to the same type of code-entry flow.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that users avoid entering authorization codes from unexpected emails or messages, even when the link points to an official Microsoft domain. It also advises checking redirect parameters such as redirect_uri, return_url, or next and confirming the final loaded URL before entering corporate credentials. For enterprises, it recommends evaluating whether Device Code Flow is needed, disabling it globally through Conditional Access policies if not required, monitoring DeviceCodeSignIn events, enforcing device compliance states, and alerting on unusual sign-in behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes a Device Code Phishing campaign in which attackers instructed victims to enter a one-time code on Microsoft’s legitimate device login page as part of the OAuth 2.0 Device Authorization Grant flow.","In the observed campaign from early April to mid-May 2026, victims received phishing emails styled as law firm notices with password-protected PDF attachments that led them through redirects and CAPTCHA pages to a phishing page displaying a one-time code.","After victims entered the code and completed MFA on Microsoft’s official page, the attackers obtained access_token, refresh_token, and id_token values that enabled access to email, OneDrive files, and Teams conversations.","A later variant targeting users in Brazil used an email in Portuguese and a link through the legitimate Cacoo.com domain as an open redirect to the phishing infrastructure.","The article recommends that users avoid entering unexpected authorization codes and that enterprises consider disabling Device Code Flow if unnecessary, monitor DeviceCodeSignIn events, enforce device compliance, and alert on unusual sign-in behavior."],"insights":["Checking for a legitimate Microsoft domain is insufficient in this scenario because the victim completes the decisive step on Microsoft’s real authentication page rather than on a fake login form.","MFA does not prevent this attack when the user is tricked into approving the Device Authorization Grant flow, because successful authentication causes tokens to be issued to the attacker-controlled application.","The refresh_token is especially important because it lets the attacker renew access after the initial access token expires, allowing continued access without further user interaction.","Open redirects on trusted services such as Microsoft-linked URLs and Cacoo.com were used to make phishing links appear safer while still routing victims to attacker-controlled infrastructure.","Monitoring specifically for DeviceCodeSignIn events is a targeted detection opportunity because the attack relies on the Device Code Flow rather than ordinary password theft."],"referencedReports":[],"body":"\u003cp\u003eThe article describes a Device Code Phishing campaign that abused Microsoft’s legitimate Device Authorization Grant flow. Instead of asking victims to enter credentials on a fake domain, attackers guided them to enter a one-time code on Microsoft’s real authentication page. This undermines the common advice to only check whether a login page is on the correct domain. The campaign observed by Kaspersky ran from early April to mid-May 2026 and used phishing emails styled as law firm notices with password-protected PDF attachments.\u003c/p\u003e\n\n\u003cp\u003eThe attack flow led victims from a PDF link through redirects and CAPTCHA pages to a phishing page that displayed a one-time code fetched by the attacker’s server-side application. Clicking the code copied it to the clipboard and redirected the victim to Microsoft’s official device login page, where the victim entered the code and completed MFA. After successful authentication, the attacker obtained access_token, refresh_token, and id_token values, enabling access to the victim’s mailbox, OneDrive files, and Teams conversations. The article also describes a later Portuguese-language variant targeting users in Brazil that used Cacoo.com as a trusted open redirect before sending victims to the same type of code-entry flow.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends that users avoid entering authorization codes from unexpected emails or messages, even when the link points to an official Microsoft domain. It also advises checking redirect parameters such as redirect_uri, return_url, or next and confirming the final loaded URL before entering corporate credentials. For enterprises, it recommends evaluating whether Device Code Flow is needed, disabling it globally through Conditional Access policies if not required, monitoring DeviceCodeSignIn events, enforcing device compliance states, and alerting on unusual sign-in behavior.\u003c/p\u003e\n"},{"n":3,"title":"Phishing poses as big-brand job interview to steal Google accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/phishing-poses-as-big-brand-job-interview-to-steal-google-accounts/","time":"20:27","priority":"SHOULD READ","score":82,"tldr":"A phishing campaign is impersonating recruiters from major brands like Adobe, Netflix, Coca-Cola, and OpenAI in fake job interviews to steal Google credentials from marketing professionals. The attackers abuse legitimate services such as PeopleForce and Salesforce Marketing Cloud redirects before showing a fake Google login using a browser-in-the-browser technique.","briefOverview":"\u003cp\u003eA phishing campaign is impersonating more than 30 well-known brands, including Adobe, Netflix, Coca-Cola, and OpenAI, in fake job interviews to steal Google account credentials from marketing professionals. The operation uses names and pictures of real recruiters at impersonated companies to make the messages appear more trustworthy. BleepingComputer found that the campaign has been running for at least five months and initially used Outlook email addresses with the name of the impersonated company.\u003c/p\u003e\n\n\u003cp\u003eThe campaign abuses the legitimate PeopleForce human resources platform and a domain associated with Salesforce Marketing Cloud before redirecting recipients to a malicious landing page. Will Thomas of Team Cymru found that the campaign relies on nested redirects, routing visitors through multiple legitimate services before reaching the phishing site. The article says the links appear to originate from PeopleForce, resolve to the ExactTarget domain operated by Salesforce, redirect to Wise Agent, and then forward to the phishing landing page.\u003c/p\u003e\n\n\u003cp\u003eOne example involved a fake Adidas recruiter message asking the recipient to schedule a conversation about a potential role, which redirected to adidas-hiring[.]com. The fake scheduling page asks the recipient to continue with Google, then displays a fake Google sign-in popup rendered inside the phishing page. The article identifies this as a browser-in-the-browser technique, where HTML and CSS are used to imitate a legitimate authentication window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing campaign is impersonating more than 30 well-known brands, including Adobe, Netflix, Coca-Cola, and OpenAI, in fake job interviews to steal Google account credentials from marketing professionals.","The campaign abuses the legitimate PeopleForce human resources platform and a domain associated with Salesforce Marketing Cloud before redirecting recipients to a malicious landing page.","The threat actor uses the names and pictures of real recruiters at impersonated companies to increase trust.","The phishing links use nested redirects through legitimate services, including ExactTarget and Wise Agent, before reaching the phishing landing page.","Clicking the “Continue with Google” button on the fake hiring page opens a fake Google sign-in popup rendered inside the phishing page using a browser-in-the-browser technique."],"insights":["The use of legitimate platforms in the redirect chain means the campaign can appear trustworthy even when the final destination is malicious, and the article notes this abuse does not necessarily mean those services were compromised.","The fake Google login is rendered inside the phishing page rather than opened as a real browser window, so a convincing-looking sign-in popup alone is not proof that Google authentication is legitimate.","The campaign has persisted for at least five months and evolved from using Outlook email addresses with impersonated company names to abusing legitimate cloud services and redirects.","The attackers improve credibility by combining brand impersonation with real recruiter names and photos, making the scam harder to spot from the sender’s claimed identity alone."],"referencedReports":[{"title":"Will Thomas’ analysis of the phishing campaign domains","url":"https://gist.github.com/BushidoUK/57c38d5ee75481fb237e968a537de778","publisher":"Will Thomas / Team Cymru","context":"The article cites Will Thomas’ GitHub analysis as the source for findings about nested redirects and the list of domains used in the phishing campaign.","category":"","primary":false}],"body":"\u003cp\u003eA phishing campaign is impersonating more than 30 well-known brands, including Adobe, Netflix, Coca-Cola, and OpenAI, in fake job interviews to steal Google account credentials from marketing professionals. The operation uses names and pictures of real recruiters at impersonated companies to make the messages appear more trustworthy. BleepingComputer found that the campaign has been running for at least five months and initially used Outlook email addresses with the name of the impersonated company.\u003c/p\u003e\n\n\u003cp\u003eThe campaign abuses the legitimate PeopleForce human resources platform and a domain associated with Salesforce Marketing Cloud before redirecting recipients to a malicious landing page. Will Thomas of Team Cymru found that the campaign relies on nested redirects, routing visitors through multiple legitimate services before reaching the phishing site. The article says the links appear to originate from PeopleForce, resolve to the ExactTarget domain operated by Salesforce, redirect to Wise Agent, and then forward to the phishing landing page.\u003c/p\u003e\n\n\u003cp\u003eOne example involved a fake Adidas recruiter message asking the recipient to schedule a conversation about a potential role, which redirected to adidas-hiring[.]com. The fake scheduling page asks the recipient to continue with Google, then displays a fake Google sign-in popup rendered inside the phishing page. The article identifies this as a browser-in-the-browser technique, where HTML and CSS are used to imitate a legitimate authentication window.\u003c/p\u003e\n"},{"n":14,"title":"SkillCloak Lets Malicious AI Agent Skills Evade Static Scanners with Self-Extracting Packing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-skillcloak-technique-lets-malicious.html","time":"06:33","priority":"SHOULD READ","score":82,"tldr":"Researchers found that malicious AI agent “skills” can evade static scanners more than 90% of the time by hiding payloads until runtime, while still working normally. The key takeaway is that teams should not trust scan results alone and need runtime behavior monitoring plus least-privilege controls for coding agents.","briefOverview":"\u003cp\u003eResearchers at the Hong Kong University of Science and Technology found that scanners for malicious AI agent “skills” can be fooled by simple changes that leave the malware working. Their SKILLCLOAK tool rewrites malicious skills so they look clean while behaving the same, including a self-extracting packing method that hides payloads in skipped directories such as \u003ccode\u003e.git/\u003c/code\u003e. Across eight scanners and 1,613 malicious skills from ClawHub, that packing trick bypassed each scanner more than 90% of the time and bypassed most of them more than 99%.\u003c/p\u003e\n\n\u003cp\u003eThe article says this matters because skills run with the AI agent’s own access to files, terminals, and saved passwords, so a malicious skill can steal credentials, copy source code, or install a backdoor. Public marketplaces are already reported to contain malicious skills, including findings from Bitdefender, Koi Security, and Unit 42. The article also cites related runtime trust failures involving Claude Code and Model Context Protocol tool descriptions, where harmful behavior appeared after an initial review or scan.\u003c/p\u003e\n\n\u003cp\u003eTo address the gap, the researchers proposed SKILLDETONATE, a runtime checker that runs a skill in a sandbox and watches what it does at the operating-system level. In a controlled test, it caught 97% of attacks with a 2% false-positive rate, and on real-world malicious skills it caught 87%. The article emphasizes that static scanning should remain cheap hygiene, but teams should also watch what skills do when they run and limit agent access to sensitive data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at the Hong Kong University of Science and Technology found that scanners for malicious AI agent skills can be evaded by simple changes that preserve the malicious behavior.","Their SKILLCLOAK tool rewrites malicious skills either by altering scanner-matched bytes or by using self-extracting packing that hides payloads in directories such as .git/ until runtime.","Across eight scanners and 1,613 malicious skills from ClawHub, the self-extracting packing method bypassed each scanner more than 90% of the time and bypassed most of them more than 99% of the time.","The researchers’ SKILLDETONATE runtime checker runs skills in a sandbox and monitors operating-system behavior, catching 97% of attacks in a controlled test with a 2% false-positive rate and 87% of real-world malicious skills.","The article says public AI skill marketplaces already contain malicious skills, including campaigns and evasive examples found by Bitdefender, Koi Security, and Unit 42."],"insights":["A major evasion opportunity comes from scanner performance choices: directories such as .git/ are often skipped to save time and reduce false alarms, but that creates a blind spot where payloads can be hidden.","The strongest static scanner result in the article collapsed after cloaking, with Cisco’s scanner dropping from catching 99% of real-world malicious skills before cloaking to about 10% after.","Behavior-based checking is more resilient in the study because it follows where sensitive data flows, rather than relying on whether the data still looks readable after encoding or encryption.","The article highlights a practical hunting approach: large high-entropy files in skipped directories, runtime code assembly, and oversized padded files are useful warning signs even when a skill has passed a scan.","The same trust failure appears beyond skill marketplaces, including poisoned Model Context Protocol tool descriptions and a Claude Code case where malicious code was fetched only at runtime."],"referencedReports":[{"title":"Cloak and Detonate","url":"https://arxiv.org/abs/2607.02357","publisher":"Hong Kong University of Science and Technology","context":"The article is primarily based on this new study about SKILLCLOAK evasion and the SKILLDETONATE runtime checker for malicious AI agent skills.","category":"","primary":false},{"title":"Helpful Skills or Hidden Payloads? Bitdefender Labs Dives Deep Into the OpenClaw Malicious Skill Trap","url":"https://www.bitdefender.com/en-us/blog/labs/helpful-skills-or-hidden-payloads-bitdefender-labs-dives-deep-into-the-openclaw-malicious-skill-trap","publisher":"Bitdefender","context":"The article cites Bitdefender’s finding that roughly 17% of skills it checked on one marketplace carried hidden malicious code.","category":"","primary":false},{"title":"ClawHavoc: 341 Malicious ClawedBot Skills Found by the Bot They Were Targeting","url":"https://www.koi.ai/blog/clawhavoc-341-malicious-clawedbot-skills-found-by-the-bot-they-were-targeting","publisher":"Koi Security","context":"The article references Koi Security’s ClawHavoc analysis, which counted 341 malicious skills in a single campaign and later 824 as the marketplace grew.","category":"","primary":false},{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"Unit 42","context":"The article cites Unit 42’s analysis of five evasive skills still live on ClawHub despite built-in scanning.","category":"","primary":false},{"title":"Clone This Repo and I Own Your Machine","url":"https://0din.ai/blog/clone-this-repo-and-i-own-your-machine","publisher":"Mozilla 0DIN","context":"The article references Mozilla’s 0DIN team tracing a case where a clean-looking GitHub repository led Claude Code to open a reverse shell by fetching malicious code at runtime from a DNS record.","category":"","primary":false},{"title":"Securing AI agents: AI tools move from reading to acting","url":"https://www.microsoft.com/en-us/security/blog/2026/06/30/securing-ai-agents-ai-tools-move-from-reading-acting/","publisher":"Microsoft","context":"The article cites Microsoft’s warning about poisoned Model Context Protocol tool descriptions that were changed after approval and caused a finance agent to leak unpaid invoices.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at the Hong Kong University of Science and Technology found that scanners for malicious AI agent “skills” can be fooled by simple changes that leave the malware working. Their SKILLCLOAK tool rewrites malicious skills so they look clean while behaving the same, including a self-extracting packing method that hides payloads in skipped directories such as \u003ccode\u003e.git/\u003c/code\u003e. Across eight scanners and 1,613 malicious skills from ClawHub, that packing trick bypassed each scanner more than 90% of the time and bypassed most of them more than 99%.\u003c/p\u003e\n\n\u003cp\u003eThe article says this matters because skills run with the AI agent’s own access to files, terminals, and saved passwords, so a malicious skill can steal credentials, copy source code, or install a backdoor. Public marketplaces are already reported to contain malicious skills, including findings from Bitdefender, Koi Security, and Unit 42. The article also cites related runtime trust failures involving Claude Code and Model Context Protocol tool descriptions, where harmful behavior appeared after an initial review or scan.\u003c/p\u003e\n\n\u003cp\u003eTo address the gap, the researchers proposed SKILLDETONATE, a runtime checker that runs a skill in a sandbox and watches what it does at the operating-system level. In a controlled test, it caught 97% of attacks with a 2% false-positive rate, and on real-world malicious skills it caught 87%. The article emphasizes that static scanning should remain cheap hygiene, but teams should also watch what skills do when they run and limit agent access to sensitive data.\u003c/p\u003e\n"},{"n":20,"title":"New Java-Based QuimaRAT MaaS Built to Run on Windows, Linux, and macOS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-java-based-quimarat-maas-built-to.html","time":"08:13","priority":"SHOULD READ","score":82,"tldr":"Researchers detailed QuimaRAT, a new Java-based malware-as-a-service RAT designed to run across Windows, Linux, and macOS with modular plugins, persistence, credential theft, surveillance, and resilient C2 capabilities. Its builder and loader ecosystem aims to make deployment easier while evading detection and platform protections.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified QuimaRAT, a new Java-based remote access trojan capable of targeting Windows, Linux, and macOS systems. LevelBlue says the malware is advertised under a malware-as-a-service model, with pricing from \u003cspan class=\"math inline\"\u003e\\(150 for one month to \\)\u003c/span\u003e1,200 for lifetime access. The threat actor also offers related tools called Quima Control, Quima Builder, Quima Loader, and Quima Dropper.\u003c/p\u003e\n\n\u003cp\u003eQuimaRAT is described as a modular platform that can expand its capabilities through encrypted plugins delivered and managed from its command-and-control infrastructure. Its builder can generate multiple output formats, including JAR, EXE, APP, SH, BAT, and VBS, while Quima Loader can create browser-based delivery flows using formats such as HTA or LNK and landing page templates such as fake CAPTCHA checks or software update alerts. The developer claims the loader chain can execute the main payload while bypassing Windows SmartScreen protections.\u003c/p\u003e\n\n\u003cp\u003eLevelBlue’s analysis says QuimaRAT is built as a modular Java project using Apache Maven and includes Java Native Access native libraries for Windows, Linux, and macOS across various architectures. The malware checks the operating system, avoids multiple simultaneous instances through a lock file, uses platform-specific persistence methods, and can communicate with its C2 server over TCP or alternatives such as WebSocket, TLS, and HTTPS. Its capabilities include command execution, plugin delivery, credential theft, file transfer, clipboard manipulation, webcam surveillance, and fileless shellcode execution on Windows hosts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LevelBlue researchers analyzed QuimaRAT, a Java-based remote access trojan advertised as malware-as-a-service for Windows, Linux, and macOS.","QuimaRAT is sold in subscription tiers ranging from $150 for one month to $1,200 for lifetime access.","The Quima suite includes Quima Control, Quima Builder, Quima Loader, and Quima Dropper, with the builder supporting multiple output formats and delivery file types.","QuimaRAT uses operating system-specific persistence methods, including Windows Registry Run keys, scheduled tasks, Linux autostart and crontab entries, and macOS LaunchAgent plist files.","The malware can execute commands, deliver payloads and plugins, steal credentials, transfer files, manipulate the clipboard, conduct webcam surveillance, and perform fileless shellcode execution on Windows hosts."],"insights":["QuimaRAT’s Java base is augmented with embedded Java Native Access libraries for Windows, Linux, and macOS, showing that its cross-platform design still relies on low-level operating system access rather than only generic Java functionality.","The Pastebin-based C2 host update option lets operators change command-and-control infrastructure through configuration without rebuilding or redistributing the payload.","Quima Loader’s delivery chain is designed to place the main payload in the browser cache first, then use a small loader file to read and execute it, which the malware author claims can bypass Windows SmartScreen protections.","QuimaRAT includes obfuscation and build indicators such as ProGuard-class obfuscation, Maven Shade relocation, preserved runtime symbols, and synthetic string decryptors, which LevelBlue says support fingerprint rotation without changing core behavior.","The malware’s one-instance lock file check can prevent multiple copies from running on the same machine, which may be useful to analysts trying to understand or detect its execution behavior."],"referencedReports":[{"title":"Novel Java-Based QuimaRAT Targets Windows, macOS and Linux","url":"https://www.levelblue.com/blogs/spiderlabs-blog/novel-java-based-quimarat-targets-windows-macos-and-linux","publisher":"LevelBlue","context":"The article cites LevelBlue's technical analysis as the source for details on QuimaRAT's modular architecture, platform support, persistence, C2 behavior, and capabilities.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified QuimaRAT, a new Java-based remote access trojan capable of targeting Windows, Linux, and macOS systems. LevelBlue says the malware is advertised under a malware-as-a-service model, with pricing from \u003cspan class=\"math inline\"\u003e\\(150 for one month to \\)\u003c/span\u003e1,200 for lifetime access. The threat actor also offers related tools called Quima Control, Quima Builder, Quima Loader, and Quima Dropper.\u003c/p\u003e\n\n\u003cp\u003eQuimaRAT is described as a modular platform that can expand its capabilities through encrypted plugins delivered and managed from its command-and-control infrastructure. Its builder can generate multiple output formats, including JAR, EXE, APP, SH, BAT, and VBS, while Quima Loader can create browser-based delivery flows using formats such as HTA or LNK and landing page templates such as fake CAPTCHA checks or software update alerts. The developer claims the loader chain can execute the main payload while bypassing Windows SmartScreen protections.\u003c/p\u003e\n\n\u003cp\u003eLevelBlue’s analysis says QuimaRAT is built as a modular Java project using Apache Maven and includes Java Native Access native libraries for Windows, Linux, and macOS across various architectures. The malware checks the operating system, avoids multiple simultaneous instances through a lock file, uses platform-specific persistence methods, and can communicate with its C2 server over TCP or alternatives such as WebSocket, TLS, and HTTPS. Its capabilities include command execution, plugin delivery, credential theft, file transfer, clipboard manipulation, webcam surveillance, and fileless shellcode execution on Windows hosts.\u003c/p\u003e\n"},{"n":22,"title":"Predicting MongoDB ObjectId() continuously in Rocket.Chat","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/predicting-mongodb-objectid-rocket-chat","time":"17:00","priority":"SHOULD READ","score":82,"tldr":"Rocket.Chat had an unauthenticated file access flaw where attackers could use a valid Livechat room token to retrieve arbitrary uploaded files if they knew the file ID. Because MongoDB ObjectId values are predictable once an attacker can generate a probe ID, the researchers showed they could continuously discover and leak uploaded files until patched versions fixed the access-control check.","briefOverview":"\u003cp\u003eAikido researchers found that Rocket.Chat could allow an unauthenticated user to access uploaded files if they knew the file ID. The issue was reported to Rocket.Chat through HackerOne on April 21 and was publicly disclosed as report #3687142. The article says the flaw was fixed as of June 12 in versions 8.5.1, 8.4.4, 8.3.6, 8.2.6, 8.1.6, 8.0.7, 7.13.9, and 7.10.13.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability involved Rocket.Chat’s Livechat feature, which is enabled by default but not visible unless users navigate directly to \u003ccode\u003e/livechat\u003c/code\u003e. Files uploaded through authenticated channels and unauthenticated Livechat were stored
