y Recap: Proxy Botnets, Browser Ransomware, AI Agent Tricks, Fake PoC Malware and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/monday-recap-proxy-botnets-browser.html","time":"13:01","priority":"MAY READ","score":40,"tldr":"This week’s major cybersecurity stories show attackers abusing ordinary trusted systems—home devices, software dependencies, identity flows, browser APIs, and AI agents—to hide, steal credentials, and launch new attacks. The key takeaway is to reduce implicit trust, patch quickly, and scrutinize even routine components before they become entry points.","briefOverview":"\u003cp\u003eThis weekly recap centers on a common theme: attackers are abusing ordinary trusted systems and features, including home devices, clean-looking code repositories, identity reset flows, browser permissions, and AI agent instructions. The threat of the week was the disruption of the NetNut residential proxy network, also known as Popa, by Google in collaboration with the FBI, Lumen, and other partners. Google said the network used SDKs in devices such as smart TVs and streaming boxes and was estimated to include at least 2 million devices globally.\u003c/p\u003e\n\n\u003cp\u003eThe recap highlights several major incidents and techniques, including fake GitHub proof-of-concept repositories that deliver the ChocoPoC trojan through a dependency named skytext, a Brazilian banking trojan called Ousaban targeting Spain and Portugal, and an AI-generated browser ransomware technique abusing Chromium’s File System Access API. It also notes WhatsApp’s username rollout and related impersonation concerns, the extradition of an alleged Scattered Spider suspect to the United States, and a long list of high-priority CVEs affecting products such as Adobe ColdFusion, Cursor, Linux Kernel, Chrome, Langflow, Microsoft Exchange Server, WinRAR, Tomcat, Webmin, QNAP, phpBB, and Gitea.\u003c/p\u003e\n\n\u003cp\u003eAround the cyber world, the article covers indirect prompt injection targeting AI agents, Dropping Elephant’s in-memory RAT campaign, Microsoft’s upcoming Entra self-service password reset change, scam ads impersonating trusted brands, and a ClickFix campaign using Polygon blockchain lookups for command-and-control configuration. It also describes credential theft from more than 6,100 Laravel Livewire applications, TONResolver attacks against Booking.com partner firms in Japan, Mamont Android malware, AsyncRAT campaigns, and multiple phishing-as-a-service kits. The conclusion stresses that many of the week’s problems came from trust placed too early in familiar devices, repos, reset paths, browser features, and other routine parts of technology.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google, working with the FBI, Lumen, and other partners, disrupted the NetNut residential proxy network, which Google estimated included at least 2 million devices globally and used smart TVs and streaming boxes to route malicious traffic.","Security researchers are being targeted with fake Python proof-of-concept exploit repositories on GitHub that pull a malicious dependency named skytext to deliver the ChocoPoC remote access trojan.","A new AI-generated browser ransomware technique abuses Chromium’s File System Access API to run entirely inside the browser on Windows, Linux, macOS, and Android, though the article says there is no evidence it has been abused in the wild.","Microsoft said Entra self-service password reset will require explicitly registered authentication methods starting September 7, 2026, instead of allowing verification through directory-sourced contact information that was never registered by users.","Imperva reported that more than 6,100 applications were compromised in a campaign exploiting CVE-2025-54068 in Laravel Livewire to steal credentials from .env files."],"insights":["The article’s recurring theme is that attackers are gaining leverage by abusing trusted layers before users or systems have reason to suspect anything, including home-device SDKs, clean-looking GitHub code, browser permission prompts, password reset data, and AI agent instructions.","Fake proof-of-concept repositories can appear harmless because the malicious code may be hidden in a dependency, making dependency review as important as reviewing the visible exploit code itself.","Browser-native ransomware is notable because it combines a legitimate browser capability with AI-generated reasoning, showing that dangerous techniques can emerge from normal platform features even when no traditional malware is installed.","Microsoft’s Entra self-service password reset change highlights that stored contact details are not equivalent to user-verified recovery methods, and relying on unregistered directory data can weaken identity recovery flows.","The Laravel Livewire campaign shows that stolen application secrets were not just collected but actively exploited, with the attacker’s infrastructure containing database dumps and email lists from compromised applications."],"referencedReports":[{"title":"Indirect Prompt Injection Web Content Targets AI Agents","url":"https://www.zscaler.com/blogs/security-research/indirect-prompt-injection-web-content-targets-ai-agents","publisher":"Zscaler","context":"The article cites Zscaler’s research on indirect prompt injection campaigns that use SEO poisoning and hidden web instructions to influence AI agents.","category":"","primary":false},{"title":"TR: Malware Tracking Dropping Elephant Tradecraft China-Themed Loader Chain","url":"https://www.rapid7.com/blog/post/tr-malware-tracking-dropping-elephant-tradecraft-china-themed-loader-chain/","publisher":"Rapid7","context":"The article references Rapid7’s analysis of Dropping Elephant using a China-themed lure, DLL side-loading, Donut shellcode, and an in-memory RAT.","category":"","primary":false},{"title":"MC1325414","url":"https://mc.merill.net/message/MC1325414","publisher":"Microsoft","context":"The article cites Microsoft’s notice that Entra self-service password reset will require explicitly registered authentication methods.","category":"","primary":false},{"title":"Branded Gambling Campaigns: How Scammers Are Exploiting Trusted Brands","url":"https://www.netcraft.com/blog/branded-gambling-campaigns-how-scammers-are-exploiting-trusted-brands","publisher":"Netcraft","context":"The article references Netcraft’s research on scam ads impersonating trusted brands to drive users to online gambling sites.","category":"","primary":false},{"title":"PhishLumos","url":"https://ieeexplore.ieee.org/document/11534625","publisher":"Tokyo Metropolitan University and NTT Security Holdings","context":"The article cites a research paper describing PhishLumos, a system for countering cloaking-based phishing campaigns using infrastructure evidence and agent-based analysis.","category":"","primary":false},{"title":"The Vulnerability Curve Bent With the AI Curve","url":"https://projectdiscovery.io/blog/the-vulnerability-curve-bent-with-the-ai-curve#what-this-actually-means","publisher":"ProjectDiscovery","context":"The article cites ProjectDiscovery’s report on the rapid growth of CVEs in 2026 and the shrinking time between disclosure and exploitation.","category":"","primary":false},{"title":"ClickFix Campaign Utilizing MaaS Kit With Blockchain C2","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-07-02-ClickFix-campaign-utilizing-MaaS-kit-with-Blockchain-C2.txt","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s threat intelligence on a ClickFix campaign that abuses the Polygon blockchain for command-and-control configuration.","category":"","primary":false},{"title":"Bypassing Microsoft Entra Conditional Access Policies via Nested App Authentication","url":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/bypassing-microsoft-entra-conditional-access-policies-via-nested-app-authentication/","publisher":"NetSPI","context":"The article cites NetSPI’s technical analysis of a now-fixed method for bypassing Microsoft Entra Conditional Access policies through Nested App Authentication flows.","category":"","primary":false},{"title":"CVE-2025-54068: Laravel Livewire Credential Theft Campaign — 6,000+ Applications Compromised","url":"https://www.imperva.com/blog/cve-2025-54068-laravel-livewire-credential-theft-campaign-6000-applications-compromised/","publisher":"Imperva","context":"The article references Imperva’s report on a campaign exploiting CVE-2025-54068 in Laravel Livewire to steal credentials from thousands of applications.","category":"","primary":false},{"title":"TONResolver","url":"https://www.trendmicro.com/en_us/research/26/f/tonresolver.html","publisher":"Trend Micro","context":"The article cites Trend Micro’s analysis of a campaign targeting Booking.com partner companies in Japan and using TONResolver as a blockchain-based resolver.","category":"","primary":false},{"title":"Dissecting Android Malware Post 1: Mamont Banking Trojan","url":"https://www.nccgroup.com/research/dissecting-android-malware-post-1-mamont-banking-trojan/","publisher":"NCC Group","context":"The article references NCC Group’s technical analysis of the Mamont Android malware distributed through dropper apps masquerading as dating services.","category":"","primary":false},{"title":"Dissecting Android Malware Post 2: Mamont Variant — Advanced Dropper Logic and Encrypted Payload","url":"https://www.nccgroup.com/research/dissecting-android-malware-post-2-mamont-variant-advanced-dropper-logic-and-encrypted-payload/","publisher":"NCC Group","context":"The article cites NCC Group’s follow-up analysis of a Mamont variant with phishing overlays, device data collection, and remote-control functionality.","category":"","primary":false},{"title":"AsyncRAT Reloaded: Python TryCloudflare Malware","url":"https://www.forcepoint.com/blog/x-labs/asyncrat-reloaded-python-trycloudflare-malware","publisher":"Forcepoint","context":"The article references Forcepoint’s analysis of a phishing campaign using Dropbox links and a multi-stage chain to deliver AsyncRAT.","category":"","primary":false},{"title":"AsyncRAT and Remcos Delivered in Multi-Stage Phishing Campaign","url":"https://www.levelblue.com/blogs/spiderlabs-blog/asyncrat-and-remcos-delivered-in-multi-stage-phishing-campaign","publisher":"LevelBlue","context":"The article cites LevelBlue’s analysis of phishing emails with malicious spreadsheets that deliver AsyncRAT or Remcos RAT.","category":"","primary":false},{"title":"CodeStorm Phishkit: Tenant-Aware M365 Replay","url":"https://zerobec.com/blog/codestorm-phishkit-tenant-aware-m365-replay","publisher":"Zerobec","context":"The article links Zerobec’s research while listing CodeStorm as a tenant-aware Microsoft 365 phishing kit observed in the wild.","category":"","primary":false},{"title":"ARToken: Inside an EvilTokens Affiliate Panel Targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article references Cisco Talos research on ARToken, a phishing-as-a-service operator panel tied to Microsoft 365 targeting.","category":"","primary":false},{"title":"Behind the Console: AWS AiTM Phishing Kit and Beyond","url":"https://securitylabs.datadoghq.com/articles/behind-the-console-aws-aitm-phishing-kit-and-beyond/","publisher":"Datadog Security Labs","context":"The article cites Datadog Security Labs research on Console, a phishing kit used to harvest AWS console credentials.","category":"","primary":false},{"title":"Mirage2FA: Obfuscated HTML Loader Delivers Microsoft 365 MFA Phishing Kit","url":"https://www.fortra.com/blog/mirage2fa-obfuscated-html-loader-delivers-microsoft-365-mfa-phishing-kit","publisher":"Fortra","context":"The article references Fortra’s research on Mirage2FA, which uses HTML smuggling and obfuscated JavaScript loaders to deliver fake Microsoft 365 login pages.","category":"","primary":false},{"title":"Bluekit Phishing-as-a-Service Threat","url":"https://www.netcraft.com/blog/bluekit-phishing-as-a-service-threat","publisher":"Netcraft","context":"The article cites Netcraft’s analysis of Bluekit, a phishing-as-a-service kit using a browser-in-the-middle technique.","category":"","primary":false},{"title":"Chinese-Language Phishing Services","url":"https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/","publisher":"Google Cloud","context":"The article references Google Cloud research on expanding Chinese-language phishing-as-a-service communities and the Darcula platform.","category":"","primary":false},{"title":"Lead Data Obfuscation Brokers","url":"https://www.group-ib.com/blog/lead-data-obfuscation-brokers/","publisher":"Group-IB","context":"The article cites a Group-IB report on data brokers in Chinese-speaking dark web forums and Telegram channels advertising purportedly stolen data.","category":"","primary":false}],"body":"\u003cp\u003eThis weekly recap centers on a common theme: attackers are abusing ordinary trusted systems and features, including home devices, clean-looking code repositories, identity reset flows, browser permissions, and AI agent instructions. The threat of the week was the disruption of the NetNut residential proxy network, also known as Popa, by Google in collaboration with the FBI, Lumen, and other partners. Google said the network used SDKs in devices such as smart TVs and streaming boxes and was estimated to include at least 2 million devices globally.\u003c/p\u003e\n\n\u003cp\u003eThe recap highlights several major incidents and techniques, including fake GitHub proof-of-concept repositories that deliver the ChocoPoC trojan through a dependency named skytext, a Brazilian banking trojan called Ousaban targeting Spain and Portugal, and an AI-generated browser ransomware technique abusing Chromium’s File System Access API. It also notes WhatsApp’s username rollout and related impersonation concerns, the extradition of an alleged Scattered Spider suspect to the United States, and a long list of high-priority CVEs affecting products such as Adobe ColdFusion, Cursor, Linux Kernel, Chrome, Langflow, Microsoft Exchange Server, WinRAR, Tomcat, Webmin, QNAP, phpBB, and Gitea.\u003c/p\u003e\n\n\u003cp\u003eAround the cyber world, the article covers indirect prompt injection targeting AI agents, Dropping Elephant’s in-memory RAT campaign, Microsoft’s upcoming Entra self-service password reset change, scam ads impersonating trusted brands, and a ClickFix campaign using Polygon blockchain lookups for command-and-control configuration. It also describes credential theft from more than 6,100 Laravel Livewire applications, TONResolver attacks against Booking.com partner firms in Japan, Mamont Android malware, AsyncRAT campaigns, and multiple phishing-as-a-service kits. The conclusion stresses that many of the week’s problems came from trust placed too early in familiar devices, repos, reset paths, browser features, and other routine parts of technology.\u003c/p\u003e\n"},{"n":25,"title":"6th July – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/6th-july-threat-intelligence-report-2/","time":"12:01","priority":"MAY READ","score":40,"tldr":"This week’s threat report highlights widespread ransomware and data breaches alongside actively exploited critical flaws in Oracle E-Business Suite, Citrix NetScaler, Progress Kemp LoadMaster, and Linux. It also warns of emerging AI-enabled threats and supply-chain campaigns abusing open-source packages, fake PoCs, and hallucinated domains.","briefOverview":"\u003cp\u003eCheck Point Research’s 6th July Threat Intelligence Report summarizes recent attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings. Reported incidents include ransomware or data breaches affecting River Bank \u0026amp; Trust, Indra Group, Nidec’s Taiwanese subsidiary, and Aflac’s Japan operations. Aflac said attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights emerging AI-related risks, including a browser-native ransomware technique generated by a large language model that abuses Chrome’s File System Access API. It also describes research showing that 10 out of 11 open-source AI coding agents failed to block obfuscated destructive shell commands. Researchers also warned that attackers are registering AI-generated domains for phishing, including use of the Montana Empire phishing kit.\u003c/p\u003e\n\n\u003cp\u003eSeveral major vulnerabilities are covered, including CVE-2026-46817 in Oracle E-Business Suite, CVE-2026-46242 in the Linux kernel, CVE-2026-8451 in Citrix NetScaler, and CVE-2026-8037 in Progress Kemp LoadMaster. The article says Oracle E-Business Suite exploitation reportedly affected about 950 internet-exposed instances, while Citrix NetScaler exploitation was observed less than 24 hours after disclosure. The report also cites activity involving PolinRider, Vect and TeamPCP, ChocoPoC, and ClickFix campaigns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["River Bank \u0026 Trust experienced a ransomware incident after an unauthorized actor accessed the network of parent company River Financial Corporation on June 16, and the bank is assessing whether personal data was accessed or exfiltrated.","Aflac disclosed a data breach affecting its Japan operations after attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.","Check Point Research demonstrated a browser-native ransomware technique generated by a large language model that abuses Chrome’s File System Access API to read, exfiltrate, and encrypt photos after users grant folder access.","Oracle E-Business Suite is affected by CVE-2026-46817, a critical remote code execution flaw reportedly exploited against about 950 internet-exposed instances worldwide.","Researchers described a North Korea-aligned supply-chain campaign called PolinRider that published 108 malicious packages and a Chrome extension across open-source registries."],"insights":["Several highlighted vulnerabilities had exploitation activity very soon after disclosure or patching, including Citrix NetScaler attacks observed less than 24 hours after disclosure and Progress Kemp LoadMaster exploitation attempts beginning on June 29.","The report shows that attackers are targeting security and development communities directly, including fake proof-of-concept exploits aimed at vulnerability researchers and malicious open-source packages that abuse VS Code auto-run tasks.","AI-related risks in the report are not limited to fake content; they include practical attack paths such as browser-only file encryption, weak command filtering in AI coding agents, and phishing infrastructure built around hallucinated domains.","Multiple incidents involved trusted portals, subsidiaries, or supply-chain relationships rather than only direct attacks on the headline organization, including Aflac Japan’s policyholder portal, Nidec’s Taiwanese subsidiary, Indra’s subsidiary, and TeamPCP-sourced credentials used by Vect."],"referencedReports":[{"title":"PolinRider: North Korea-Linked Supply Chain Campaign Expands","url":"https://socket.dev/blog/polinrider-north-korea-linked-supply-chain-campaign-expands?__cf_chl_f_tk=7ghpzGOXz_lx2w3mZxpNj_deI74xo2o7zrqFIIqBCtY-1783238962-1.0.1.1-IVRy8bf_c.o2d5gXmE3Pr1OMZtMR667RYlwgH8PBvuc","publisher":"Socket","context":"The article cites researchers elaborating on the North Korea-aligned PolinRider supply-chain campaign involving malicious packages and a Chrome extension.","category":"","primary":false},{"title":"Researcher Analyzes 3,000 Live ClickFix Payloads","url":"https://thehackernews.com/2026/07/researcher-analyzes-3000-live-clickfix.html","publisher":"The Hacker News","context":"The article references an analysis of 3,000 live ClickFix payloads that found rotating wrappers, custom command generation, and AMSI-bypass techniques.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Research’s 6th July Threat Intelligence Report summarizes recent attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings. Reported incidents include ransomware or data breaches affecting River Bank \u0026amp; Trust, Indra Group, Nidec’s Taiwanese subsidiary, and Aflac’s Japan operations. Aflac said attackers accessed its policyholder portal between June 15 and June 25, exposing personal and financial data of nearly 4.4 million customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights emerging AI-related risks, including a browser-native ransomware technique generated by a large language model that abuses Chrome’s File System Access API. It also describes research showing that 10 out of 11 open-source AI coding agents failed to block obfuscated destructive shell commands. Researchers also warned that attackers are registering AI-generated domains for phishing, including use of the Montana Empire phishing kit.\u003c/p\u003e\n\n\u003cp\u003eSeveral major vulnerabilities are covered, including CVE-2026-46817 in Oracle E-Business Suite, CVE-2026-46242 in the Linux kernel, CVE-2026-8451 in Citrix NetScaler, and CVE-2026-8037 in Progress Kemp LoadMaster. The article says Oracle E-Business Suite exploitation reportedly affected about 950 internet-exposed instances, while Citrix NetScaler exploitation was observed less than 24 hours after disclosure. The report also cites activity involving PolinRider, Vect and TeamPCP, ChocoPoC, and ClickFix campaigns.\u003c/p\u003e\n"},{"n":26,"title":"Mid-Year Threat Trends: What H1 2026 Signals for the Rest of the Year","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/2026-threat-intelligence-trends/","time":"12:59","priority":"MAY READ","score":40,"tldr":"Cyble’s mid-year 2026 threat outlook says attackers are scaling ransomware, access-broker operations, identity-based intrusions, geopolitically driven disruption, and AI-enabled campaigns faster than many defenders can respond. Organizations should expect the second half of 2026 to bring more coordinated, faster-moving threats targeting identities, critical infrastructure, and exposed systems.","briefOverview":"\u003cp\u003eCyble’s mid-year threat trends article says the first half of 2026 showed a faster, more coordinated, and harder-to-attribute threat landscape. Ransomware remained highly visible, with 702 ransomware attacks and 54 major data breaches and leaks recorded worldwide in March 2026. More than 56% of that March activity came from five groups: Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights access brokers and identity-based attacks as major drivers of the threat ecosystem. In March 2026, Cyble observed 20 incidents involving the sale of access to compromised networks on underground forums, with professional services and retail most commonly listed. It also states that attackers are increasingly using credential theft, MFA bypass, session hijacking, and third-party access abuses to log in rather than break in.\u003c/p\u003e\n\n\u003cp\u003eGeopolitical activity and AI-driven tooling are also described as important parts of the 2026 threat outlook. During a February 2026 escalation in the Middle East, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, and navigation disruptions affected over 1,100 vessels near the Strait of Hormuz. The article says security teams should expect attackers to keep scaling operations, exploiting identities, and leveraging AI through the rest of the year.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In March 2026, Cyble recorded 702 ransomware attacks and 54 major data breaches and leaks worldwide, with Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom responsible for more than 56% of the activity.","In the Americas during Q1 2026, Cyble tracked 1,305 cyber incidents, including 1,138 publicly claimed ransomware attacks, with construction, professional services, manufacturing, healthcare, and government bodies among the most affected sectors.","Cyble observed 20 incidents of access to compromised networks being sold on underground forums in March 2026, with professional services and retail the most commonly listed sectors.","The article states that identity-based attacks, including credential theft, MFA bypass, session hijacking, and third-party access abuse, have become key vectors as attackers increasingly log in rather than break in.","During the February 2026 escalation in the Middle East, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, and navigation system disruption affected over 1,100 vessels near the Strait of Hormuz."],"insights":["Ransomware activity appears highly concentrated, as five groups accounted for more than 56% of March 2026 global ransomware and breach activity and five groups drove 58% of Q1 ransomware volume in the Americas.","Access brokers create a short response window because compromised network access is often sold and exploited before a breach becomes publicly known.","The article frames identity as a primary security control point, noting that attackers are increasingly using stolen credentials, MFA bypass, session hijacking, and third-party access instead of relying first on malware.","Geopolitical cyber activity is expanding beyond direct targets, as the Middle East escalation involved internet outages, hacktivist participation, navigation disruption near the Strait of Hormuz, and thousands of conflict-themed domains used for scams, malware, and disinformation.","AI-enabled activity is affecting both attackers and defenders, with the article citing AI-native tooling used against Fortinet FortiGate appliances and organizations beginning to use AI-assisted monitoring to keep pace with faster attacks."],"referencedReports":[],"body":"\u003cp\u003eCyble’s mid-year threat trends article says the first half of 2026 showed a faster, more coordinated, and harder-to-attribute threat landscape. Ransomware remained highly visible, with 702 ransomware attacks and 54 major data breaches and leaks recorded worldwide in March 2026. More than 56% of that March activity came from five groups: Qilin, Akira, The Gentlemen, Dragonforce, and INC Ransom.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights access brokers and identity-based attacks as major drivers of the threat ecosystem. In March 2026, Cyble observed 20 incidents involving the sale of access to compromised networks on underground forums, with professional services and retail most commonly listed. It also states that attackers are increasingly using credential theft, MFA bypass, session hijacking, and third-party access abuses to log in rather than break in.\u003c/p\u003e\n\n\u003cp\u003eGeopolitical activity and AI-driven tooling are also described as important parts of the 2026 threat outlook. During a February 2026 escalation in the Middle East, internet connectivity in targeted regions dropped to 1–4% of normal levels, more than 70 hacktivist groups became involved, and navigation disruptions affected over 1,100 vessels near the Strait of Hormuz. The article says security teams should expect attackers to keep scaling operations, exploiting identities, and leveraging AI through the rest of the year.\u003c/p\u003e\n"},{"n":27,"title":"Integrations of the Month","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/integrations-of-the-month-july-2026/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=integrations-of-the-month-july-2026","time":"12:53","priority":"MAY READ","score":40,"tldr":"Silent Push is promoting new integrations with Splunk, Tines, and ServiceNow that bring its preemptive threat intelligence and IOFA data directly into detection, automation, and incident response workflows. The main takeaway is that these integrations aim to help security teams identify and block adversary infrastructure before it is used in attacks.","briefOverview":"\u003cp\u003eSilent Push describes three integrations with Splunk, Tines, and ServiceNow that are designed to place its preemptive threat data into tools security teams already use. The article focuses on Indicators of Future Attack, or IOFAs, and how they can be used inside detection, automation, and incident workflows rather than in a separate console. Silent Push says the goal is to help teams make faster decisions and act on adversary infrastructure while it is still being staged.\u003c/p\u003e\n\n\u003cp\u003eFor Splunk, Silent Push feeds IOFAs into the platform as enrichment data so detection rules can alert on domains or IPs associated with suspicious infrastructure before it reaches an environment. The integration also surfaces Traffic Origin data, such as an IP appearing to be in Ireland while upstream traffic comes from Iran. The Threat Check API can also be used in Splunk workflows to return a scored, contextualized verdict for a domain or IP in milliseconds.\u003c/p\u003e\n\n\u003cp\u003eFor Tines, Silent Push exposes Context Graph data as actions so teams can automate enrichment, alert routing, case closure, and proactive blocking without writing code. The article says workflows can push newly identified pre-weaponized infrastructure to a firewall or WAF before it is used, and states that Threat Check shows an average lead time of 154 days before infrastructure appears in other feeds. For ServiceNow, Context Graph data is attached automatically to tickets for suspicious domains or IPs, including risk scores, related campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push describes three integrations with Splunk, Tines, and ServiceNow that are intended to place Indicators of Future Attack into tools security teams already use.","The Splunk integration feeds IOFAs into Splunk as enrichment data so detection rules can alert on infrastructure that is being staged before it reaches an environment.","The Tines integration exposes Silent Push Context Graph data as Tines actions, enabling automated alert enrichment, routing, case closure, and proactive blocking workflows.","The ServiceNow integration automatically attaches Context Graph data to tickets for suspicious domains or IPs, including a risk score, related campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.","Silent Push says its Threat Check API can return a scored, contextualized verdict for a domain or IP in milliseconds and is available for use in Splunk workflows and custom Tines stories."],"insights":["Silent Push emphasizes that the value of its integrations is not adding another console, but changing decisions inside existing workflows such as alert routing, ticket handling, and firewall or WAF blocking.","The article positions Traffic Origin as a way to avoid misleading location-based decisions, using the example of an IP appearing Irish while upstream traffic comes from Iran.","The Tines use case suggests a concrete automation threshold: infrastructure linked to a known threat actor can be routed to a senior analyst, while low-risk cases can be closed automatically.","Silent Push claims its Threat Check data provides substantial lead time, with an average of 154 days and a median of 117 days between its identification of infrastructure and appearance in other feeds.","The article argues that AI-generated phishing pages do not eliminate infrastructure-based detection opportunities because the domains, hosting, and management activity still leave patterns Silent Push tracks."],"referencedReports":[],"body":"\u003cp\u003eSilent Push describes three integrations with Splunk, Tines, and ServiceNow that are designed to place its preemptive threat data into tools security teams already use. The article focuses on Indicators of Future Attack, or IOFAs, and how they can be used inside detection, automation, and incident workflows rather than in a separate console. Silent Push says the goal is to help teams make faster decisions and act on adversary infrastructure while it is still being staged.\u003c/p\u003e\n\n\u003cp\u003eFor Splunk, Silent Push feeds IOFAs into the platform as enrichment data so detection rules can alert on domains or IPs associated with suspicious infrastructure before it reaches an environment. The integration also surfaces Traffic Origin data, such as an IP appearing to be in Ireland while upstream traffic comes from Iran. The Threat Check API can also be used in Splunk workflows to return a scored, contextualized verdict for a domain or IP in milliseconds.\u003c/p\u003e\n\n\u003cp\u003eFor Tines, Silent Push exposes Context Graph data as actions so teams can automate enrichment, alert routing, case closure, and proactive blocking without writing code. The article says workflows can push newly identified pre-weaponized infrastructure to a firewall or WAF before it is used, and states that Threat Check shows an average lead time of 154 days before infrastructure appears in other feeds. For ServiceNow, Context Graph data is attached automatically to tickets for suspicious domains or IPs, including risk scores, related campaigns, threat actor associations, matching IOFA patterns, and connected infrastructure.\u003c/p\u003e\n"},{"n":1,"title":"Software Is Now Written at the Speed of Thought. Security Isn't.","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/software-is-now-written-at-the-speed-of-thought-security-isnt/","time":"14:00","priority":"MAY READ","score":35,"tldr":"Generative AI and “vibe coding” are making software creation dramatically faster and accessible to non-developers, but they also risk producing insecure code, shadow applications, and unmanaged identities. Organizations need security practices like code review, threat modeling, least privilege, and AI governance to keep pace with AI-driven development.","briefOverview":"\u003cp\u003eThe article argues that software development has evolved from Waterfall to Agile, DevOps, generative AI, and now Vibe Coding, with each stage reducing the friction between an idea and a deployable solution. Waterfall emphasized structured planning and predictable delivery, while Agile and DevOps made development more iterative, collaborative, and automated. Generative AI has further changed the process by allowing developers to describe intent while AI generates implementation details.\u003c/p\u003e\n\n\u003cp\u003eVibe Coding is presented as a major shift in which users, not necessarily developers, describe what they want in plain English and refine AI-generated applications through conversation. The article says working prototypes can now emerge in minutes rather than weeks, making software creation accessible to entrepreneurs, startups, and people without deep expertise in programming languages, frameworks, or deployment processes. However, it emphasizes that easier software creation does not automatically provide the engineering judgment needed for secure, reliable, and trustworthy applications.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that AI-generated code can still contain vulnerabilities, architectural flaws, licensing issues, privilege escalation vulnerabilities, and compliance concerns, even when the application appears to work correctly. It states that traditional security practices such as threat modeling, code review, vulnerability testing, identity security, least privilege, and governance controls remain essential before production deployment. The author concludes that if software can be created at the speed of thought, cybersecurity best practices must evolve just as quickly so trust can be established in what is built.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes software development as evolving from Waterfall to Agile, DevOps, generative AI, and Vibe Coding, with each stage reducing the friction between an idea and a deployable solution.","Vibe Coding allows a user, who is not necessarily a developer, to describe a desired application in plain English while AI generates and refines the application through conversation.","The article states that AI-generated code can contain vulnerabilities, architectural flaws, licensing issues, privilege escalation vulnerabilities, and compliance concerns even when the application appears to work correctly.","Traditional secure software engineering practices such as threat modeling, code review, vulnerability testing, identity security, least privilege, and governance controls remain essential before production deployment.","The author argues that cybersecurity best practices must evolve as quickly as AI-driven software creation so trust can be established in software built at the speed of thought."],"insights":["The article frames Vibe Coding as a potential modern form of shadow IT because it enables rapid, useful software creation outside traditional engineering and security controls.","The author highlights that making software creation accessible to non-developers does not also transfer the engineering judgment needed to make software secure, reliable, and compliant.","The article suggests that skilled developers may increasingly shift from writing code to handling the final safeguards of software creation, especially debugging and cybersecurity review.","The article identifies identity security and least privilege as especially important controls for AI-generated applications, because AI-created software can expand applications, identities, privilege paths, and related exposures."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that software development has evolved from Waterfall to Agile, DevOps, generative AI, and now Vibe Coding, with each stage reducing the friction between an idea and a deployable solution. Waterfall emphasized structured planning and predictable delivery, while Agile and DevOps made development more iterative, collaborative, and automated. Generative AI has further changed the process by allowing developers to describe intent while AI generates implementation details.\u003c/p\u003e\n\n\u003cp\u003eVibe Coding is presented as a major shift in which users, not necessarily developers, describe what they want in plain English and refine AI-generated applications through conversation. The article says working prototypes can now emerge in minutes rather than weeks, making software creation accessible to entrepreneurs, startups, and people without deep expertise in programming languages, frameworks, or deployment processes. However, it emphasizes that easier software creation does not automatically provide the engineering judgment needed for secure, reliable, and trustworthy applications.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that AI-generated code can still contain vulnerabilities, architectural flaws, licensing issues, privilege escalation vulnerabilities, and compliance concerns, even when the application appears to work correctly. It states that traditional security practices such as threat modeling, code review, vulnerability testing, identity security, least privilege, and governance controls remain essential before production deployment. The author concludes that if software can be created at the speed of thought, cybersecurity best practices must evolve just as quickly so trust can be established in what is built.\u003c/p\u003e\n"},{"n":13,"title":"How to Evaluate an AI SOC Platform in 2026: 6 Capabilities That Separate Leaders from Bolt-On AI solutions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/how-to-evaluate-ai-soc-platform-in-2026.html","time":"11:30","priority":"MAY READ","score":35,"tldr":"The article argues that buyers evaluating AI SOC platforms should look beyond generic AI claims and test whether vendors provide a real-time correlated data foundation, full-lifecycle agents, auditable verdicts, broad detection coverage, staged autonomy, and measurable SOC outcomes. It primarily positions Exaforce as an example of a platform built around those capabilities.","briefOverview":"\u003cp\u003eThe article explains how organizations should evaluate AI SOC platforms in 2026, arguing that similar vendor labels can hide very different products. It distinguishes platforms where AI agents perform detection, triage, investigation, and response from bolt-on AI that mainly summarizes alerts inside an existing SIEM. The article says buyers should judge platforms by outcomes such as investigation time, false-positive volume, analyst hours returned, SOC operating cost, and whether the architecture can hold up as attacks increase in volume, speed, and complexity.\u003c/p\u003e\n\n\u003cp\u003eA central technical point is that predictable AI SOC agents depend on real-time correlated context rather than alert payloads alone. The article says stronger platforms maintain a continuously updated knowledge graph of identities, resources, configurations, behavioral baselines, and relationships before an alert fires. It recommends testing six capabilities during a proof of concept: a real-time correlated data foundation, full-lifecycle agents, evidence-backed verdicts, detection beyond SIEM data, staged autonomy with human oversight, and measurable results.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Exaforce as an example of a platform built around these capabilities, with four Exabots covering detection, triage, investigation, and response. It says the Exabots use a unified real-time data platform spanning cloud, SaaS, identity, endpoint, and code, and that the same platform can be operated internally or through Exaforce MDR. It cites customer examples in which Guardant Health made Exaforce its primary SIEM and MDR, Invisible reduced time to investigate by 95%, and Forcepoint achieved a 14-minute mean time to respond on P0 incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article defines an AI SOC platform as a security operations platform where AI agents perform detection, triage, investigation, and response by reasoning over correlated security data under human oversight.","The article says predictable AI SOC agents require a real-time knowledge graph that continuously maps identities, resources, configurations, behavioral baselines, and their relationships before alerts occur.","The article recommends evaluating AI SOC vendors on six capabilities: a real-time correlated data foundation, full-lifecycle agents, auditable verdicts, detection beyond the SIEM, staged autonomy with human oversight, and measurable outcomes.","The article presents Exaforce as an agentic AI SOC platform with four Exabots for detection, triage, investigation, and response, all using a unified real-time data platform.","The article states that Exaforce can be operated by an in-house team or through its MDR offering, with the same architecture and Exabots used in both models."],"insights":["A fast response from a platform is not enough evidence of a strong AI SOC, because the article says a fast query engine can also return results in seconds without having continuously correlated identity, configuration, resource, and baseline data.","A practical proof-of-concept test is to choose a random identity and ask the vendor to show its permissions, configuration drift, and normal behavior, because the article says that context cannot be faked at query time.","The article warns that both immediate full autonomy and permanent read-only operation are red flags, and recommends checking how a platform gradually earns trust for different response actions.","The article suggests testing detection on data sources that are often left out of SIEMs because of ingest cost, such as high-volume cloud audit logs, GitHub, and Google Workspace.","The article recommends defining false-positive rate and mean time to investigate and respond before a proof of concept begins, so vendor claims can be measured against the buyer’s current baseline."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how organizations should evaluate AI SOC platforms in 2026, arguing that similar vendor labels can hide very different products. It distinguishes platforms where AI agents perform detection, triage, investigation, and response from bolt-on AI that mainly summarizes alerts inside an existing SIEM. The article says buyers should judge platforms by outcomes such as investigation time, false-positive volume, analyst hours returned, SOC operating cost, and whether the architecture can hold up as attacks increase in volume, speed, and complexity.\u003c/p\u003e\n\n\u003cp\u003eA central technical point is that predictable AI SOC agents depend on real-time correlated context rather than alert payloads alone. The article says stronger platforms maintain a continuously updated knowledge graph of identities, resources, configurations, behavioral baselines, and relationships before an alert fires. It recommends testing six capabilities during a proof of concept: a real-time correlated data foundation, full-lifecycle agents, evidence-backed verdicts, detection beyond SIEM data, staged autonomy with human oversight, and measurable results.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Exaforce as an example of a platform built around these capabilities, with four Exabots covering detection, triage, investigation, and response. It says the Exabots use a unified real-time data platform spanning cloud, SaaS, identity, endpoint, and code, and that the same platform can be operated internally or through Exaforce MDR. It cites customer examples in which Guardant Health made Exaforce its primary SIEM and MDR, Invisible reduced time to investigate by 95%, and Forcepoint achieved a 14-minute mean time to respond on P0 incidents.\u003c/p\u003e\n"},{"n":29,"title":"Community Bootcamp: Live View - Inspect a suspicious URL right now","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/webinar/community-bootcamp-live-view-inspect-a-suspicious-url-right-now/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=community-bootcamp-live-view-inspect-a-suspicious-url-right-now","time":"10:58","priority":"MAY READ","score":25,"tldr":"This is an announcement for a community bootcamp showing how to use Live View to inspect a suspicious URL in real time.","briefOverview":"\u003cp\u003eThe article is titled “Community Bootcamp: Live View - Inspect a suspicious URL right now.” The title indicates that the piece is about a Community Bootcamp involving Live View. It specifically mentions inspecting a suspicious URL.\u003c/p\u003e\n\n\u003cp\u003eThe article body provided is not readable as normal prose and does not present clear details beyond the title. No specific organization, affected party, URL, incident, technical finding, or impact is explicitly described in the readable text. Based on the available article text, the only clear focus is the bootcamp topic of using Live View to inspect a suspicious URL.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Community Bootcamp: Live View - Inspect a suspicious URL right now.\"","The article refers to a Community Bootcamp.","The article mentions Live View in connection with inspecting a suspicious URL.","The title frames the activity as inspecting a suspicious URL immediately."],"insights":["The phrasing \"right now\" indicates the bootcamp is positioned as a hands-on, immediate exercise rather than a purely theoretical discussion.","Because the title says \"Community Bootcamp,\" the article is framed as an educational community event rather than a report about a specific security incident."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Community Bootcamp: Live View - Inspect a suspicious URL right now.” The title indicates that the piece is about a Community Bootcamp involving Live View. It specifically mentions inspecting a suspicious URL.\u003c/p\u003e\n\n\u003cp\u003eThe article body provided is not readable as normal prose and does not present clear details beyond the title. No specific organization, affected party, URL, incident, technical finding, or impact is explicitly described in the readable text. Based on the available article text, the only clear focus is the bootcamp topic of using Live View to inspect a suspicious URL.\u003c/p\u003e\n"}]</script>
