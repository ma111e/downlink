<script type="application/json" id="dl-articles">[{"n":7,"title":"CISA: Critical VMware RCE flaw now exploited by ransomware gangs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-critical-vmware-vcenter-rce-flaw-now-exploited-by-ransomware-gangs/","time":"12:16","priority":"MUST READ","score":98,"tldr":"CISA warns that ransomware groups are actively exploiting the critical VMware vCenter directory traversal RCE flaw CVE-2026-59310, which was patched in July. Organizations should urgently patch exposed vCenter servers, as attackers have already used the flaw for reverse SSH persistence.","briefOverview":"\u003cp\u003eCISA has updated its Known Exploited Vulnerabilities Catalog to warn that ransomware gangs are actively abusing CVE-2026-59310, a critical VMware vCenter flaw. Broadcom patched the issue on July 29 and described it as a directory traversal weakness in the vCenter Syslog server. Unauthenticated attackers can exploit it to execute arbitrary code, and Broadcom advised customers to treat patching as an emergency.\u003c/p\u003e\n\n\u003cp\u003eWithin two weeks of the patch, DFIR firm QUIRSO reported that a suspected advanced persistent threat actor had exploited the flaw to compromise more than 361 IP addresses across 47 countries. The actor deployed a reverse SSH tool to maintain access and remotely control affected systems. CISA added the flaw to its catalog in August and directed U.S. government agencies to secure affected vCenter systems within three days.\u003c/p\u003e\n\n\u003cp\u003eVMware servers are frequent ransomware targets because compromised vCenter or ESXi systems can provide access to an organization\u0026rsquo;s network and internally stored sensitive data. Shadowserver tracks more than 450 VMware vCenter servers exposed online, though it is unknown how many have been patched. Over the past five years, CISA has marked 26 VMware vulnerabilities as exploited in the wild, including nine that were also used by ransomware operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA updated its Known Exploited Vulnerabilities Catalog to state that ransomware gangs are actively exploiting the critical VMware vCenter flaw CVE-2026-59310.","Broadcom patched CVE-2026-59310 on July 29 and described it as a critical directory traversal issue in the vCenter Syslog server that unauthenticated attackers can use to execute arbitrary code.","QUIRSO reported that a suspected advanced persistent threat actor compromised more than 361 IP addresses across 47 countries by exploiting the flaw and deploying a reverse SSH tool for persistence and remote access.","CISA added CVE-2026-59310 to its Known Exploited Vulnerabilities Catalog in August and ordered U.S. government agencies to secure affected vCenter systems within three days.","Shadowserver tracks more than 450 VMware vCenter servers exposed online, although it is not known how many have been patched against CVE-2026-59310."],"insights":["The threat escalated quickly: Broadcom issued the patch on July 29, suspected attackers were reported exploiting the flaw within two weeks, and CISA subsequently identified ransomware use.","The reported compromise activity was geographically broad, with more than 361 IP addresses affected across 47 countries.","Internet exposure remains a concern because Shadowserver tracks more than 450 VMware vCenter servers online, while the number patched against this flaw is unknown.","VMware is a recurring ransomware target: CISA has listed 26 VMware vulnerabilities as exploited in the wild over the past five years, including nine linked to ransomware operations."],"referencedReports":[{"title":"VMware Security Advisory VMSA-2026-0006 Supplemental FAQ","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/tree/main/security-advisories/vmsa-2026-0006","publisher":"broadcom","context":"The article says Broadcom's supplemental FAQ told customers to treat patching CVE-2026-59310 as an emergency.","category":"advisory","primary":false},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/18/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert as the notice that added CVE-2026-59310 to the Known Exploited Vulnerabilities Catalog and required U.S. government agencies to secure affected vCenter systems within three days.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has updated its Known Exploited Vulnerabilities Catalog to warn that ransomware gangs are actively abusing CVE-2026-59310, a critical VMware vCenter flaw. Broadcom patched the issue on July 29 and described it as a directory traversal weakness in the vCenter Syslog server. Unauthenticated attackers can exploit it to execute arbitrary code, and Broadcom advised customers to treat patching as an emergency.\u003c/p\u003e\n\n\u003cp\u003eWithin two weeks of the patch, DFIR firm QUIRSO reported that a suspected advanced persistent threat actor had exploited the flaw to compromise more than 361 IP addresses across 47 countries. The actor deployed a reverse SSH tool to maintain access and remotely control affected systems. CISA added the flaw to its catalog in August and directed U.S. government agencies to secure affected vCenter systems within three days.\u003c/p\u003e\n\n\u003cp\u003eVMware servers are frequent ransomware targets because compromised vCenter or ESXi systems can provide access to an organization\u0026rsquo;s network and internally stored sensitive data. Shadowserver tracks more than 450 VMware vCenter servers exposed online, though it is unknown how many have been patched. Over the past five years, CISA has marked 26 VMware vulnerabilities as exploited in the wild, including nine that were also used by ransomware operations.\u003c/p\u003e\n"},{"n":35,"title":"Emerging Threat: (CVE-2026-76461) Cisco Secure Email Gateway Root RCE via Email Parsing","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-76461-cisco-secure-email-gateway-root-rce-via-email-parsing/","time":"09:55","priority":"MUST READ","score":98,"tldr":"Cisco Secure Email Gateway appliances running vulnerable AsyncOS releases can be remotely compromised as root by sending a crafted email, with exploitation reportedly active in the wild. Organizations should immediately upgrade to Cisco’s fixed builds and investigate any previously exposed appliances for compromise.","briefOverview":"\u003cp\u003eCVE-2026-76461 is a critical SQL injection vulnerability in the email parsing logic of Cisco AsyncOS Software for Cisco Secure Email Gateway. An attacker can send a crafted email containing SQL statements that are executed while the appliance processes the message, without credentials, user interaction, or management-interface access. Successful exploitation can result in arbitrary operating-system command execution with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects physical and virtual Cisco Secure Email Gateway deployments running releases 15.5 and earlier, 16.0, and 16.5. Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog. Cisco released fixed AsyncOS builds, states there are no configuration workarounds, and recommends organizations patch promptly, review mail logs for \u003ccode\u003eCOPY\u003c/code\u003e statements paired with \u003ccode\u003eTO PROGRAM\u003c/code\u003e, and treat exposed unpatched appliances as potentially compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-76461 is a critical SQL injection flaw in Cisco AsyncOS email parsing that allows an attacker to send a crafted email and execute commands with root privileges without authentication or user interaction.","The issue affects Cisco Secure Email Gateway appliances and virtual deployments running AsyncOS 15.5 and earlier, 16.0, or 16.5, while Cisco Secure Email and Web Manager and Cisco Secure Web Appliance are reported as unaffected.","Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the vulnerability to its Known Exploited Vulnerabilities catalog.","Cisco released fixed AsyncOS builds for affected release trains, and the article states that patching is the only remediation because no configuration workaround exists.","Organizations should review IronPort text mail logs for COPY statements paired with TO PROGRAM, check every member of clustered deployments, and monitor unexpected outbound connections from mail appliances."],"insights":["The initial attack path uses normal inbound email traffic, so limiting management-interface access or segmenting interfaces does not prevent exploitation of this flaw.","Because successful exploitation gives root-level control, an appliance that was reachable while unpatched should be treated as potentially compromised even after it is updated.","Exposure estimates based on service fingerprints identify systems that may be running affected software, not confirmed vulnerable versions, so organizations need to verify their exact AsyncOS build numbers.","Clustered email gateway deployments require investigation and patching of every member, since each appliance may be individually reachable and a partial update can leave exposure behind."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-76461 is a critical SQL injection vulnerability in the email parsing logic of Cisco AsyncOS Software for Cisco Secure Email Gateway. An attacker can send a crafted email containing SQL statements that are executed while the appliance processes the message, without credentials, user interaction, or management-interface access. Successful exploitation can result in arbitrary operating-system command execution with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects physical and virtual Cisco Secure Email Gateway deployments running releases 15.5 and earlier, 16.0, and 16.5. Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog. Cisco released fixed AsyncOS builds, states there are no configuration workarounds, and recommends organizations patch promptly, review mail logs for \u003ccode\u003eCOPY\u003c/code\u003e statements paired with \u003ccode\u003eTO PROGRAM\u003c/code\u003e, and treat exposed unpatched appliances as potentially compromised.\u003c/p\u003e\n"},{"n":21,"title":"Cisco Secure Email Gateway Flaw Exploited in the Wild, Enables Root Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-secure-email-gateway-flaw.html","time":"06:11","priority":"MUST READ","score":97,"tldr":"Cisco Secure Email Gateway vulnerability CVE-2026-76461 is being actively exploited, allowing unauthenticated attackers to send crafted emails that can execute root-level commands. Organizations using affected AsyncOS releases should patch immediately and review mail and external network logs for signs of compromise.","briefOverview":"\u003cp\u003eCisco warned that CVE-2026-76461, a critical flaw in AsyncOS Software for Cisco Secure Email Gateway, is being actively exploited. The issue has a CVSS score of 9.8 and affects physical and virtual Secure Email Gateway devices regardless of configuration. Cisco said Secure Email and Web Manager and Secure Web Appliance are not affected.\u003c/p\u003e\n\n\u003cp\u003eAn unauthenticated remote attacker can send a crafted email containing malicious SQL statements to execute arbitrary SQL commands and gain root-level command execution on the underlying operating system. Cisco released fixes in AsyncOS versions 15.5.5-0141, 16.0.4-302, and 16.5.0-780, with no workaround other than updating. Administrators are advised to inspect mail logs for \u003ccode\u003eCOPY.*TO PROGRAM\u003c/code\u003e statements and review external network and firewall logs, because attackers with root access may remove or conceal evidence of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported active exploitation of CVE-2026-76461, a critical AsyncOS flaw in Cisco Secure Email Gateway with a CVSS score of 9.8.","A crafted email containing malicious SQL statements can allow an unauthenticated remote attacker to execute commands with root privileges on an affected device.","The issue affects physical and virtual Cisco Secure Email Gateway devices regardless of configuration, while Secure Email and Web Manager and Secure Web Appliance are not affected.","Cisco released fixes for AsyncOS 15.5 and earlier, 16.0, and 16.5, and said there are no workarounds besides updating to a supported fixed version.","CISA added CVE-2026-76461 to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian agencies to apply patches by September 17, 2026."],"insights":["Because successful exploitation can grant root-level control, Cisco warns that attackers may remove or conceal evidence on the affected email gateway, making firewall and network logs outside the device especially important for investigation.","Cisco recommends checking mail_logs for SQL statements containing \"COPY.*TO PROGRAM\"; any matching entry may indicate malicious activity.","For clustered email gateways, Cisco says administrators should review logs from every device in the cluster rather than only one system.","Cisco directly contacted Secure Email Cloud customers where it detected malicious activity, but did not disclose the scale of the activity.","Separate late-August activity against Fortinet VPN appliances generated tens of millions of failed logins and used organization-specific employee, affiliate, and administrative account names rather than generic usernames."],"referencedReports":[{"title":"Cisco Security Advisory: Cisco Secure Email Gateway AsyncOS Software SQL Injection Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX","publisher":"cisco","context":"Cisco's advisory describes CVE-2026-76461, affected AsyncOS releases, available fixes, and indicators of compromise.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/14/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert adding CVE-2026-76461 to the Known Exploited Vulnerabilities catalog and setting a federal patch deadline.","category":"advisory","primary":false},{"title":"Large-Scale Fortinet VPN Credential Attacks","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202609-large-scale-fortinet-vpn-cred-attacks","publisher":"arctic-wolf","context":"Arctic Wolf's technical analysis is cited for observations of high-volume credential attacks against internet-facing Fortinet VPN appliances.","category":"research","primary":false}],"body":"\u003cp\u003eCisco warned that CVE-2026-76461, a critical flaw in AsyncOS Software for Cisco Secure Email Gateway, is being actively exploited. The issue has a CVSS score of 9.8 and affects physical and virtual Secure Email Gateway devices regardless of configuration. Cisco said Secure Email and Web Manager and Secure Web Appliance are not affected.\u003c/p\u003e\n\n\u003cp\u003eAn unauthenticated remote attacker can send a crafted email containing malicious SQL statements to execute arbitrary SQL commands and gain root-level command execution on the underlying operating system. Cisco released fixes in AsyncOS versions 15.5.5-0141, 16.0.4-302, and 16.5.0-780, with no workaround other than updating. Administrators are advised to inspect mail logs for \u003ccode\u003eCOPY.*TO PROGRAM\u003c/code\u003e statements and review external network and firewall logs, because attackers with root access may remove or conceal evidence of compromise.\u003c/p\u003e\n"},{"n":1,"title":"Cisco patches Secure Email Gateway zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-cisco-secure-email-zero-day-exploited-to-execute-commands-as-root/","time":"07:31","priority":"MUST READ","score":96,"tldr":"Cisco has patched CVE-2026-76461, a critical actively exploited zero-day in Secure Email Gateway that lets unauthenticated attackers send crafted emails to gain root-level command execution. Organizations should urgently apply Cisco’s fixes and inspect mail, network, and firewall logs for suspicious SQL activity and external data transfers.","briefOverview":"\u003cp\u003eCisco has released patches for CVE-2026-76461, a critical zero-day in Cisco AsyncOS Software for Cisco Secure Email Gateway that has been actively exploited since at least September 2026. The issue affects physical and virtual appliances regardless of configuration. It allows an unauthenticated remote attacker to execute commands with root-level privileges on the underlying operating system.\u003c/p\u003e\n\n\u003cp\u003eCisco said the flaw stems from insufficient validation in email parsing logic and can be triggered by a crafted email containing malicious SQL statements. The company provided indicators of compromise and advised administrators to search each cluster device’s mail_logs for suspicious SQL activity, while also checking network and firewall logs because attackers may remove evidence. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to patch affected systems within three days, by September 17.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco warned that CVE-2026-76461, a critical flaw in Cisco AsyncOS Software for Secure Email Gateway, has been actively exploited since at least September 2026.","The flaw affects physical and virtual Cisco Secure Email Gateway appliances regardless of configuration and can allow an unauthenticated remote attacker to execute commands with root privileges.","Cisco said attackers can exploit the issue by sending a crafted email containing malicious SQL statements, due to insufficient validation in email parsing logic.","Cisco advised defenders to inspect mail_logs for suspicious SQL statements and to review network and firewall logs for suspicious uploads or downloads, as attackers may remove evidence.","CISA added CVE-2026-76461 to its Known Exploited Vulnerabilities Catalog and ordered federal agencies to patch affected systems by September 17."],"insights":["Because the issue affects both physical and virtual Secure Email Gateway appliances regardless of configuration, changing device settings does not remove exposure; applying Cisco’s patch is necessary.","Cisco specifically warns that attackers may delete signs of compromise, so reviewing only the device’s mail_logs may miss activity and should be supplemented with network and firewall log checks.","CISA’s three-day federal patch deadline indicates the flaw is being treated as an urgent, actively abused risk.","Cisco also fixed four additional critical flaws in Secure Email Gateway and Secure Email and Web Manager devices, although it said it had no evidence those four had been exploited."],"referencedReports":[{"title":"Cisco Security Advisory: cisco-sa-esa-inj-2bLVGmhX","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX","publisher":"cisco","context":"Cisco's security advisory warns that CVE-2026-76461 in Secure Email Gateway is under active exploitation and provides indicators of compromise.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/14/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"CISA's alert adds CVE-2026-76461 to its Known Exploited Vulnerabilities Catalog and sets a patch deadline for federal agencies.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco has released patches for CVE-2026-76461, a critical zero-day in Cisco AsyncOS Software for Cisco Secure Email Gateway that has been actively exploited since at least September 2026. The issue affects physical and virtual appliances regardless of configuration. It allows an unauthenticated remote attacker to execute commands with root-level privileges on the underlying operating system.\u003c/p\u003e\n\n\u003cp\u003eCisco said the flaw stems from insufficient validation in email parsing logic and can be triggered by a crafted email containing malicious SQL statements. The company provided indicators of compromise and advised administrators to search each cluster device’s mail_logs for suspicious SQL activity, while also checking network and firewall logs because attackers may remove evidence. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to patch affected systems within three days, by September 17.\u003c/p\u003e\n"},{"n":27,"title":"China-Linked Hackers Exploit Chrome-Windows Zero-Day Chain to Deploy GRIMWEDGE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/china-linked-hackers-exploit-chrome.html","time":"05:31","priority":"MUST READ","score":96,"tldr":"China-linked groups UTA0560 and JungleBamboo exploited a Chrome and Windows patch gap through spear-phishing links to deploy GRIMWEDGE and LONGTALE malware against NGOs. The campaign shows how publicly visible Chromium fixes can remain exploitable as zero-days in Chrome until stable releases ship.","briefOverview":"\u003cp\u003eVolexity attributed a September 1, 2026 spear-phishing campaign against multiple NGOs to the China-linked threat cluster UTA0560. The emails directed recipients through a reflected cross-site scripting flaw on a U.S.-based university website to attacker-controlled infrastructure. That infrastructure delivered a multi-stage Chrome and Windows exploit chain called BlueMoon to systems using Chrome on Windows.\u003c/p\u003e\n\n\u003cp\u003eThe chain used CVE-2026-85046 to gain read/write access in Chrome’s V8 sandbox, CVE-2026-87491 to escape the browser sandbox, and CVE-2026-85880 to inject code into Chrome and execute code. UTA0560 used the chain to deploy GRIMWEDGE, a JavaScript backdoor that can profile systems, manage files and processes, run commands, and download additional payloads. Volexity also saw JungleBamboo use the same chain to install LONGTALE, a credential-stealing Chrome extension, while noting that the Chrome bugs had been fixed in Chromium source code but had not yet reached stable Chrome releases, creating a patch-gap exploitation window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Volexity attributed a September 1, 2026 spear-phishing campaign targeting multiple NGOs to the China-linked threat cluster UTA0560.","The campaign used a reflected cross-site scripting flaw on a U.S.-based university website to redirect victims to a Chrome and Windows exploit chain.","The chain combined CVE-2026-85046 and CVE-2026-87491 in Chrome with CVE-2026-85880 in Windows to obtain code execution in the Chrome browser process.","UTA0560 used the chain to install GRIMWEDGE, a JavaScript backdoor that can collect system information, manage files and processes, execute commands, and download additional payloads.","Volexity also observed JungleBamboo using the same chain to deploy LONGTALE, a fake Google Gemini Chrome extension that steals cookies, session data, keystrokes, and browser activity."],"insights":["The attackers used a legitimate U.S.-based university website with a reflected XSS flaw as an initial redirect, which made the phishing links appear to point to a trusted destination before sending recipients to attacker-controlled infrastructure.","The exploit server filtered visitors to target only systems running Chrome on Windows, limiting exposure of the exploit chain and helping avoid analysis by irrelevant visitors.","Although the Chrome flaws had been fixed in Chromium’s open-source code, they were not yet included in a stable Chrome release, creating a patch-gap window in which they remained zero-days against Chrome users.","GRIMWEDGE has no built-in persistence, lateral movement, or dedicated data-exfiltration feature, but its file-reading, command-running, and payload-upload functions still provide sufficient access for UTA0560 to survey hosts and deploy further tools.","JungleBamboo’s LONGTALE extension focused on credential theft and surveillance rather than remote code execution, collecting browser data and sending it to its command server about every 30 seconds."],"referencedReports":[{"title":"Mind the Patch Gap: Multiple Chinese Threat Actors Chain 0-Day Exploits in Chrome \u0026 Windows","url":"https://www.volexity.com/blog/2026/09/09/mind-the-patch-gap-multiple-chinese-threat-actors-chain-0-day-exploits-in-chrome-windows/","publisher":"volexity","context":"The article relies on Volexity's technical analysis attributing the campaign to UTA0560 and detailing the Chrome-Windows exploit chain and associated malware.","category":"research","primary":true}],"body":"\u003cp\u003eVolexity attributed a September 1, 2026 spear-phishing campaign against multiple NGOs to the China-linked threat cluster UTA0560. The emails directed recipients through a reflected cross-site scripting flaw on a U.S.-based university website to attacker-controlled infrastructure. That infrastructure delivered a multi-stage Chrome and Windows exploit chain called BlueMoon to systems using Chrome on Windows.\u003c/p\u003e\n\n\u003cp\u003eThe chain used CVE-2026-85046 to gain read/write access in Chrome’s V8 sandbox, CVE-2026-87491 to escape the browser sandbox, and CVE-2026-85880 to inject code into Chrome and execute code. UTA0560 used the chain to deploy GRIMWEDGE, a JavaScript backdoor that can profile systems, manage files and processes, run commands, and download additional payloads. Volexity also saw JungleBamboo use the same chain to install LONGTALE, a credential-stealing Chrome extension, while noting that the Chrome bugs had been fixed in Chromium source code but had not yet reached stable Chrome releases, creating a patch-gap exploitation window.\u003c/p\u003e\n"},{"n":25,"title":"Human Attacker Exploits Marimo RCE, Reaches SSH Bastion in Eight Seconds","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/human-attacker-exploits-marimo-rce.html","time":"11:52","priority":"MUST READ","score":93,"tldr":"Sysdig observed a skilled human attacker exploit the critical Marimo RCE flaw CVE-2026-39987 and pivot to an SSH bastion via AWS Secrets Manager credentials in just eight seconds, using hand-written tooling rather than AI. The report underscores that rapid, evasive post-exploitation remains achievable without agentic attack frameworks.","briefOverview":"\u003cp\u003eSysdig reported that a threat actor exploited CVE-2026-39987, a pre-authentication remote code execution flaw affecting all versions of Marimo, to gain an interactive shell on a compromised system. The attacker then used credentials harvested from that system to query AWS Secrets Manager, obtain an SSH private key, and authenticate to a bastion host. Sysdig observed the credential lookup four seconds after a fresh WebSocket connection and SSH authentication four seconds later, for an eight-second pivot.\u003c/p\u003e\n\n\u003cp\u003eThe attacker operated for roughly nine hours, issued more than 850 interactive commands, and used hand-written scripts rather than recognizable public offensive tools or an AI agent. Sysdig said the operator avoided a trap that every agentic threat actor it had profiled against the same flaw fell into, highlighting that skilled human operators can move quickly and evade detections. Separately, Hunt.io reported a cryptomining campaign compromising 3,562 Redis servers, primarily using Redis rogue replication via the SLAVEOF command to deploy an XMRig miner; it attributed the affected systems to missing authentication rather than a version-specific Redis flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig reported that a threat actor exploited CVE-2026-39987, a pre-authentication remote-code-execution flaw affecting all Marimo versions, to obtain an interactive shell on a compromised system.","Using credentials harvested from the compromised instance, the attacker called AWS Secrets Manager, retrieved an SSH private key, and authenticated to a bastion host within eight seconds of the initial WebSocket connection.","The attacker spent roughly nine hours in the environment, issued more than 850 interactive commands, and used hand-written Python scripts rather than recognizable public offensive tools or an AI agent.","Hunt.io identified a cryptomining campaign affecting 3,562 Redis servers, primarily using Redis rogue replication through the SLAVEOF command to deploy an XMRig miner.","Hunt.io said the affected Redis systems ranged from Redis 2.8.17 to 7.2.0, indicating that missing authentication rather than a version-specific flaw was the principal weakness."],"insights":["Sysdig found that a human-operated, hand-built Python workflow reached the SSH bastion at a speed typically associated with AI-assisted activity, demonstrating that rapid intrusion response cannot focus only on agentic threats.","The operator avoided a trap that Sysdig said every agentic threat actor it profiled against the same Marimo flaw had entered, suggesting that manual operators may not follow the same detectable patterns as automated ones.","In the Redis campaign, rogue replication was the only technique that worked at scale, while SSH key injection, MongoDB sandbox-escape attempts, and the recovered WordPress chain did not produce confirmed large-scale results.","The Redis victims spanned versions from 2015 through 2023 and several Linux generations, with Hunt.io attributing the exposure primarily to missing authentication rather than a single software-version defect."],"referencedReports":[{"title":"Machine Speed: Hold the AI — Hand-Rolled Marimo CVE-2026-39987 Exploit","url":"https://www.sysdig.com/blog/machine-speed-hold-the-ai-hand-rolled-marimo-cve-2026-39987-exploit","publisher":"sysdig-threat-research-team","context":"Sysdig's technical analysis details the hand-written attack chain that exploited Marimo and reached an SSH bastion host in eight seconds.","category":"research","primary":true},{"title":"Redis Cryptomining Botnet: 3,562 Servers","url":"https://hunt.io/blog/redis-cryptomining-botnet-3562-servers","publisher":"hunt-io","context":"Hunt.io's analysis describes a cryptomining campaign targeting exposed Redis servers and the techniques tested by its operators.","category":"research","primary":true}],"body":"\u003cp\u003eSysdig reported that a threat actor exploited CVE-2026-39987, a pre-authentication remote code execution flaw affecting all versions of Marimo, to gain an interactive shell on a compromised system. The attacker then used credentials harvested from that system to query AWS Secrets Manager, obtain an SSH private key, and authenticate to a bastion host. Sysdig observed the credential lookup four seconds after a fresh WebSocket connection and SSH authentication four seconds later, for an eight-second pivot.\u003c/p\u003e\n\n\u003cp\u003eThe attacker operated for roughly nine hours, issued more than 850 interactive commands, and used hand-written scripts rather than recognizable public offensive tools or an AI agent. Sysdig said the operator avoided a trap that every agentic threat actor it had profiled against the same flaw fell into, highlighting that skilled human operators can move quickly and evade detections. Separately, Hunt.io reported a cryptomining campaign compromising 3,562 Redis servers, primarily using Redis rogue replication via the SLAVEOF command to deploy an XMRig miner; it attributed the affected systems to missing authentication rather than a version-specific Redis flaw.\u003c/p\u003e\n"},{"n":8,"title":"Acronis warns of actively exploited flaw in its cPanel backup plugin","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/acronis-warns-of-actively-exploited-flaw-in-its-cpanel-backup-plugin/","time":"21:37","priority":"MUST READ","score":92,"tldr":"Acronis says attackers have targeted a high-severity local privilege-escalation flaw (CVE-2026-87886) in its cPanel/WHM and Plesk backup plugins. Administrators should immediately update to Acronis Backup plugin for cPanel \u0026 WHM 1.9.3 HF3 or Plesk extension 1.8.11.","briefOverview":"\u003cp\u003eAcronis has disclosed CVE-2026-87886, a high-severity Linux local privilege-escalation flaw affecting its backup plugin for cPanel \u0026amp; WHM and its extension for Plesk. The company assigned the issue a CVSS score of 7.8 and says exploitation has been detected in limited, targeted attacks against Acronis Backup plugin for cPanel \u0026amp; WHM deployments. Acronis said this assessment is based on a single report from a potentially affected customer.\u003c/p\u003e\n\n\u003cp\u003eAn attacker with limited permissions on a vulnerable Linux server could use the flaw to obtain greater access, potentially view or modify sensitive data, and disrupt the system without user interaction. Affected versions include cPanel \u0026amp; WHM plugin builds earlier than 1.9.3.1021, fixed in version 1.9.3 HF3, and Plesk extension builds earlier than 1.8.11.638, fixed in version 1.8.11. Acronis has not provided technical details or specific indicators of compromise and recommends affected users install the available updates immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis disclosed CVE-2026-87886, a high-severity Linux local privilege-escalation flaw with a CVSS score of 7.8 in its backup integrations for cPanel \u0026 WHM and Plesk.","Acronis says exploitation has been detected in limited, targeted attacks against deployments of its cPanel \u0026 WHM backup plugin, based on one report from a potentially affected customer.","A low-privileged attacker could use the flaw to gain higher permissions on a vulnerable Linux server, potentially accessing or modifying sensitive data and disrupting the system without user interaction.","The cPanel \u0026 WHM plugin is affected before build 1.9.3.1021 and is fixed in version 1.9.3 HF3, while the Plesk extension is affected before build 1.8.11.638 and is fixed in version 1.8.11.","Acronis has not published technical details or specific indicators of compromise and recommends that affected users apply the updates immediately."],"insights":["Acronis’ statement that exploitation was seen in the wild is based on a single report from a potentially affected customer, so the reported activity is limited in both scale and available confirmation.","Acronis has provided no specific indicators of compromise and has withheld technical details, making immediate installation of the available updates the main response described in the article.","The affected software is Acronis’ backup integration for cPanel \u0026 WHM and Plesk rather than the cPanel \u0026 WHM or Plesk platforms themselves.","The vulnerability can be used without user interaction after an attacker has limited access to a vulnerable Linux server, increasing the urgency for affected deployments."],"referencedReports":[{"title":"UPD-2609-3d72-20a7","url":"https://security-advisory.acronis.com/updates/UPD-2609-3d72-20a7","publisher":"acronis","context":"The article says Acronis first published the flaw in this brief advisory before updating it with the CVE identifier and severity score.","category":"advisory","primary":true},{"title":"SEC-10986","url":"https://security-advisory.acronis.com/advisories/SEC-10986","publisher":"acronis","context":"The article cites this Acronis advisory for its warning that limited, targeted exploitation was detected against cPanel \u0026 WHM plugin deployments.","category":"advisory","primary":true}],"body":"\u003cp\u003eAcronis has disclosed CVE-2026-87886, a high-severity Linux local privilege-escalation flaw affecting its backup plugin for cPanel \u0026amp; WHM and its extension for Plesk. The company assigned the issue a CVSS score of 7.8 and says exploitation has been detected in limited, targeted attacks against Acronis Backup plugin for cPanel \u0026amp; WHM deployments. Acronis said this assessment is based on a single report from a potentially affected customer.\u003c/p\u003e\n\n\u003cp\u003eAn attacker with limited permissions on a vulnerable Linux server could use the flaw to obtain greater access, potentially view or modify sensitive data, and disrupt the system without user interaction. Affected versions include cPanel \u0026amp; WHM plugin builds earlier than 1.9.3.1021, fixed in version 1.9.3 HF3, and Plesk extension builds earlier than 1.8.11.638, fixed in version 1.8.11. Acronis has not provided technical details or specific indicators of compromise and recommends affected users install the available updates immediately.\u003c/p\u003e\n"},{"n":10,"title":"Hackers target WordPress sites via third-party WooCommerce plugin","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-target-wordpress-sites-via-third-party-woocommerce-plugin/","time":"14:45","priority":"MUST READ","score":92,"tldr":"Attackers are actively exploiting CVE-2026-27540 in WooCommerce Wholesale Lead Capture versions 2.0.3.1 and earlier to upload PHP webshells and potentially fully compromise WordPress sites. Administrators should update to version 2.0.3.2 or later and investigate upload directories and AJAX logs for signs of compromise.","briefOverview":"\u003cp\u003eAttackers are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture premium plugin for WordPress. The issue affects version 2.0.3.1 and older and can allow an unauthenticated attacker to upload PHP backdoors, potentially resulting in complete site compromise. Wordfence said its web application firewall blocked more than 100,000 attempts linked to the vulnerability, with activity spikes from June 4 to June 17 and on July 1 and August 30.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from an unauthenticated AJAX action, \u003ccode\u003ewwlc_file_upload_handler\u003c/code\u003e, that uses a file-type allowlist provided through the user-controlled \u003ccode\u003efile_settings\u003c/code\u003e parameter. Attackers can add PHP to that allowlist and upload a webshell that gathers host information and offers a browser-based form to upload further malicious files. Version 2.0.3.2, released February 20, fixes the issue; administrators are advised to update, inspect uploads and logs for suspicious activity, remove unknown administrator accounts, and restore from a safe backup if compromise is confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are actively exploiting CVE-2026-27540, an unauthenticated file-upload flaw in WooCommerce Wholesale Lead Capture plugin versions 2.0.3.1 and earlier.","The flaw lets attackers manipulate a user-controlled setting so the plugin accepts uploaded PHP files, enabling them to place webshells on vulnerable WordPress sites.","WooCommerce Wholesale Lead Capture version 2.0.3.2, released February 20, fixes the vulnerability.","Wordfence blocked more than 100,000 exploit attempts and reported spikes in activity from June 4 to June 17, as well as on July 1 and August 30.","Administrators are advised to update the plugin, check upload directories and logs for suspicious activity, remove unknown administrator accounts, and restore from a safe backup if compromise is confirmed."],"insights":["The upload restriction can be bypassed because the plugin trusts a file-type allowlist supplied by the person making the request, allowing attackers to add “php” as an accepted type.","The uploaded shell does more than collect information about the affected website: it also provides a browser-based form for placing additional malicious files on the site.","If a site is confirmed compromised, the article recommends restoring from a known-safe backup rather than relying only on deleting suspicious files, because hidden access mechanisms and unauthorized users may be difficult to fully remove.","Requests to WordPress’s admin-ajax.php endpoint that invoke wwlc_file_upload_handler are a specific log indicator administrators can use to investigate attempted or successful abuse."],"referencedReports":[{"title":"Attackers Actively Exploiting Critical Vulnerability in WooCommerce Wholesale Lead Capture Plugin","url":"https://www.wordfence.com/blog/2026/09/attackers-actively-exploiting-critical-vulnerability-in-woocommerce-wholesale-lead-capture-plugin/","publisher":"wordfence","context":"The article cites Wordfence’s analysis of the exploit request and its reporting on blocked exploitation attempts.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture premium plugin for WordPress. The issue affects version 2.0.3.1 and older and can allow an unauthenticated attacker to upload PHP backdoors, potentially resulting in complete site compromise. Wordfence said its web application firewall blocked more than 100,000 attempts linked to the vulnerability, with activity spikes from June 4 to June 17 and on July 1 and August 30.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from an unauthenticated AJAX action, \u003ccode\u003ewwlc_file_upload_handler\u003c/code\u003e, that uses a file-type allowlist provided through the user-controlled \u003ccode\u003efile_settings\u003c/code\u003e parameter. Attackers can add PHP to that allowlist and upload a webshell that gathers host information and offers a browser-based form to upload further malicious files. Version 2.0.3.2, released February 20, fixes the issue; administrators are advised to update, inspect uploads and logs for suspicious activity, remove unknown administrator accounts, and restore from a safe backup if compromise is confirmed.\u003c/p\u003e\n"},{"n":24,"title":"LiteSpeed Enterprise Flaw Could Let One Hosting Account Gain Root Access on a Shared Server","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/litespeed-enterprise-flaw-could-let-one.html","time":"06:52","priority":"MUST READ","score":92,"tldr":"LiteSpeed Web Server Enterprise versions before 6.3.7 contain a critical flaw that could allow a low-privilege shared-hosting account to gain root access and bypass isolation controls such as CageFS. Administrators should manually update to version 6.3.7 immediately because auto-update availability may be delayed.","briefOverview":"\u003cp\u003eA critical flaw in LiteSpeed Web Server Enterprise versions before 6.3.7 could allow a low-privilege hosting account to gain root access on a shared server, cPanel warned in a September 14 advisory. An attacker could then access or alter other customers’ sites and the server itself. The flaw can bypass account-isolation controls including CloudLinux CageFS, which normally restricts each hosting account’s view of the system.\u003c/p\u003e\n\n\u003cp\u003eLiteSpeed released version 6.3.7 on September 11, and both LiteSpeed and cPanel advised administrators to manually install it with \u003ccode\u003e/usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7\u003c/code\u003e. Automatic delivery may be delayed, and LiteSpeed’s download page still listed 6.3.6 as stable as of September 15. Neither company disclosed how the flaw works, assigned a CVE or severity score, stated whether it has been exploited, or provided indicators for determining whether systems were compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LiteSpeed Web Server Enterprise versions earlier than 6.3.7 contain a critical flaw that could allow a low-privilege shared-hosting account to gain root access on the server.","cPanel said the flaw can bypass account-separation controls, including CloudLinux CageFS, potentially allowing access to or alteration of other customers’ sites and server files.","LiteSpeed released version 6.3.7 on September 11, and cPanel advised administrators to install it manually using /usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7.","Neither cPanel nor LiteSpeed publicly described the technical cause of the flaw, assigned it a CVE identifier or severity score, provided indicators of compromise, or stated whether it has been exploited.","LiteSpeed said there may be a delay before version 6.3.7 reaches auto-update, while its download page still listed 6.3.6 as the stable release as of September 15."],"insights":["Administrators who force the 6.3.7 update must later run touch /usr/local/lsws/autoupdate/follow_stable to resume following LiteSpeed’s stable automatic update tier.","As of September 15, LiteSpeed’s download page still listed 6.3.6 as stable, so relying on the usual stable-release listing could leave servers on an affected version.","The advisory does not clarify whether the 6.4.0 release candidates are affected, despite their changelog not listing the three security changes included in 6.3.7.","This is the third LiteSpeed-related root-access issue on cPanel servers reported since May, but it is the first described as affecting the LiteSpeed web server itself rather than the user-end cPanel plugin."],"referencedReports":[{"title":"Security: LiteSpeed Enterprise security advisory — September 14, 2026","url":"https://support.cpanel.net/hc/en-us/articles/43483286674583-Security-LiteSpeed-Enterprise-security-advisory-September-14-2026","publisher":"cPanel","context":"cPanel's advisory warns that LiteSpeed Enterprise versions before 6.3.7 could permit a shared-hosting account to gain root access.","category":"advisory","primary":true},{"title":"Security Update for LiteSpeed cPanel Plugin","url":"https://blog.litespeedtech.com/2026/05/21/security-update-for-litespeed-cpanel-plugin/","publisher":"LiteSpeed Technologies","context":"The article cites this LiteSpeed security update for CVE-2026-48172, a previously disclosed cPanel plugin flaw said to be actively exploited.","category":"advisory","primary":false},{"title":"Security Update for LiteSpeed cPanel Plugin 2","url":"https://blog.litespeedtech.com/2026/06/01/security-update-for-litespeed-cpanel-plugin-2/","publisher":"LiteSpeed Technologies","context":"The article cites this LiteSpeed security update for CVE-2026-54420, another previously disclosed and actively exploited cPanel plugin flaw.","category":"advisory","primary":false}],"body":"\u003cp\u003eA critical flaw in LiteSpeed Web Server Enterprise versions before 6.3.7 could allow a low-privilege hosting account to gain root access on a shared server, cPanel warned in a September 14 advisory. An attacker could then access or alter other customers’ sites and the server itself. The flaw can bypass account-isolation controls including CloudLinux CageFS, which normally restricts each hosting account’s view of the system.\u003c/p\u003e\n\n\u003cp\u003eLiteSpeed released version 6.3.7 on September 11, and both LiteSpeed and cPanel advised administrators to manually install it with \u003ccode\u003e/usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7\u003c/code\u003e. Automatic delivery may be delayed, and LiteSpeed’s download page still listed 6.3.6 as stable as of September 15. Neither company disclosed how the flaw works, assigned a CVE or severity score, stated whether it has been exploited, or provided indicators for determining whether systems were compromised.\u003c/p\u003e\n"},{"n":23,"title":"Iranian Hackers Use Telegram-Controlled Malware to Spy on Dissidents and Journalists","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/iranian-hackers-use-telegram-controlled.html","time":"16:29","priority":"SHOULD READ","score":89,"tldr":"US, UK, and Dutch agencies say Iran’s MOIS is using Telegram-controlled Windows malware, known as HEAVYGRAM/CHOSEN BRICK, to spy on dissidents, journalists, and activists. The malware is delivered through impersonated software and can steal messages and credentials, record audio, capture screenshots, and maintain persistence on infected devices.","briefOverview":"\u003cp\u003eU.S., U.K., and Dutch agencies say Iran’s Ministry of Intelligence and Security has used Windows malware called HEAVYGRAM, or CHOSEN BRICK, to spy on dissidents, journalists, activists, and other people whose views conflict with the Iranian government. The campaign has targeted people in the United States, United Kingdom, Netherlands, and elsewhere, with the wider activity dated to autumn 2023 and CHOSEN BRICK use reported since at least 2025. The agencies warn that stolen information can expose victims’ contacts, locations, and daily routines, raising personal safety risks when information is published on pro-Iranian leak sites.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly build trust by posing as known contacts or messaging-app support before sending files disguised as software such as Telegram, KeePass, Pictory, Norton Antivirus, or MRI results. The files show a convincing fake screen while installing malware that connects to a separate Telegram bot for each infected computer. The malware can take screenshots, record microphone audio, collect browser-based Telegram and WhatsApp data, steal saved passwords and email addresses, download further tools, delete files, and in at least one version wipe the computer. It also creates Windows startup entries and excludes folders from Microsoft Defender scanning to remain active after a restart.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI, the U.K. National Cyber Security Centre, and the Netherlands’ AIVD say Iran’s Ministry of Intelligence and Security uses Windows malware called HEAVYGRAM or CHOSEN BRICK to target dissidents, journalists, activists, and other people viewed as opposing Iran.","Attackers impersonate trusted contacts, messaging-app support, or legitimate software and send files that display convincing fake screens while installing the malware in the background.","The malware is controlled through a dedicated Telegram bot for each infected computer and can collect messages, emails, passwords, screenshots, microphone recordings, and other data.","CHOSEN BRICK creates Windows startup entries and excludes certain folders from Microsoft Defender scanning to remain active after the computer restarts.","The agencies warn that stolen information can reveal victims’ contacts, locations, and routines, and that some victims’ personal details have been published on pro-Iranian leak sites."],"insights":["Each infected computer receives its own Telegram bot, a design the agencies say prevents one victim’s activity from being mixed with another’s.","The attackers reportedly begin with work computers and, if unsuccessful, try to reach personal devices that may not be protected by workplace security controls.","The malware uses legitimate services including Telegram, Vultr, Storj, and Backblaze B2 to send stolen data, while newer versions route Telegram traffic through proxy servers to conceal it.","At least one observed version can wipe the infected computer, and the agencies do not state whether simply removing the malware fully resolves a compromise."],"referencedReports":[{"title":"Joint Advisory on Iranian Cyber Targeting of Dissidents, Activists, and Journalists","url":"https://www.ic3.gov/CSA/2026/260915-2.pdf","publisher":"national-cyber-security-centre-fbi-aivd","context":"The article relies on this September 15 joint advisory for details of the CHOSEN BRICK malware campaign and its targets.","category":"advisory","primary":true},{"title":"FBI Updated Analysis of HEAVYGRAM Malware","url":"https://www.ic3.gov/CSA/2026/260915.pdf","publisher":"fbi","context":"The article says the FBI released this updated technical analysis with additional malware details and new indicators of compromise.","category":"research","primary":true},{"title":"Government of Iran Cyber Actors Deploy Telegram C2 to Push Malware to Identified Targets","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/government-of-iran-cyber-actors-deploy-telegram-c2-to-push-malware-to-identified-targets","publisher":"fbi","context":"The article identifies this March 2026 FBI alert as the first public description of the campaign.","category":"advisory","primary":false}],"body":"\u003cp\u003eU.S., U.K., and Dutch agencies say Iran’s Ministry of Intelligence and Security has used Windows malware called HEAVYGRAM, or CHOSEN BRICK, to spy on dissidents, journalists, activists, and other people whose views conflict with the Iranian government. The campaign has targeted people in the United States, United Kingdom, Netherlands, and elsewhere, with the wider activity dated to autumn 2023 and CHOSEN BRICK use reported since at least 2025. The agencies warn that stolen information can expose victims’ contacts, locations, and daily routines, raising personal safety risks when information is published on pro-Iranian leak sites.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly build trust by posing as known contacts or messaging-app support before sending files disguised as software such as Telegram, KeePass, Pictory, Norton Antivirus, or MRI results. The files show a convincing fake screen while installing malware that connects to a separate Telegram bot for each infected computer. The malware can take screenshots, record microphone audio, collect browser-based Telegram and WhatsApp data, steal saved passwords and email addresses, download further tools, delete files, and in at least one version wipe the computer. It also creates Windows startup entries and excludes folders from Microsoft Defender scanning to remain active after a restart.\u003c/p\u003e\n"},{"n":18,"title":"Iranian cyber spies used fake MRI scan results to hack ‘enemy of regime’","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/iran-cyber-spies-use-fake-mri-scans-as-lure","time":"16:28","priority":"SHOULD READ","score":88,"tldr":"UK, US and Dutch agencies warn that Iranian state-linked spies are using CHOSEN BRICK Windows malware, often delivered through highly tailored lures such as fake MRI results, to surveil dissidents, activists and journalists. The spyware steals communications and location-related data, potentially enabling harassment and real-world physical threats.","briefOverview":"\u003cp\u003eBritish, American and Dutch security agencies warned that Iranian state-sponsored hackers have used CHOSEN BRICK spyware to target people regarded as threats to Iran’s regime, including dissidents, activists and journalists. The malware has been delivered after tailored trust-building campaigns on WhatsApp and Telegram, including through fake MRI results and files impersonating products such as Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass. The warning covers victims in the United Kingdom, United States and Netherlands dating to at least 2025.\u003c/p\u003e\n\n\u003cp\u003eCHOSEN BRICK affects Windows systems and can collect contacts, email inboxes and social-media messages, capture screen content, and activate a device microphone. It persists after reboot by relaunching at login, adds Microsoft Defender exclusions, and uses separate Telegram bots for each victim to receive commands and send stolen data, alongside commercial cloud-storage services. Agencies said the resulting information can reveal a victim’s location, contacts and daily routine, raising risks of harassment and physical harm; the NCSC also warned that attackers may move targets to personal devices to evade workplace security.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK’s NCSC, the FBI, and the Netherlands’ AIVD warned that Iranian state-sponsored hackers have targeted people viewed as threats to Iran’s regime, including dissidents, activists, and journalists.","The attackers use tailored social-engineering campaigns over WhatsApp and Telegram, sometimes posing as known contacts or technical support, before sending malicious files disguised as items such as MRI scan results or legitimate software.","The CHOSEN BRICK Windows spyware can collect contacts, email inboxes, and social-media messages, capture screen content, and activate a device’s microphone.","CHOSEN BRICK uses separate Telegram bots for each victim for command and control, sends stolen files through Telegram and commercial cloud-storage services, and adds Microsoft Defender exclusions to reduce detection.","The agencies warned that information taken by the spyware can reveal victims’ locations, contacts, and routines, increasing physical risks, while MI5 reported tracking more than 20 potentially lethal Iran-backed plots in the previous year."],"insights":["The campaign’s use of a separate Telegram bot for each victim is designed to limit the chance that compromising one victim’s device exposes other targets or the wider operation.","The attackers tailor fake files to each target’s circumstances, including a purported MRI result, showing that trust-building through messaging apps is a central part of the operation rather than merely a delivery method.","The stolen data can be used to map a person’s location, contacts, and routine, linking computer surveillance directly to risks such as harassment, kidnapping, or assassination.","The NCSC warned that attackers may steer targets toward personal devices, where workplace security protections may not apply.","Personal information obtained through these intrusions has appeared on pro-Iranian leak sites, extending harm beyond the initial compromise."],"referencedReports":[{"title":"FBI Flash Warning","url":"https://www.ic3.gov/CSA/2026/260320.pdf","publisher":"fbi","context":"The article cites the FBI’s March flash warning as attributing similar Telegram-based malware activity to actors operating on behalf of Iran’s Ministry of Intelligence and Security.","category":"advisory","primary":false}],"body":"\u003cp\u003eBritish, American and Dutch security agencies warned that Iranian state-sponsored hackers have used CHOSEN BRICK spyware to target people regarded as threats to Iran’s regime, including dissidents, activists and journalists. The malware has been delivered after tailored trust-building campaigns on WhatsApp and Telegram, including through fake MRI results and files impersonating products such as Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass. The warning covers victims in the United Kingdom, United States and Netherlands dating to at least 2025.\u003c/p\u003e\n\n\u003cp\u003eCHOSEN BRICK affects Windows systems and can collect contacts, email inboxes and social-media messages, capture screen content, and activate a device microphone. It persists after reboot by relaunching at login, adds Microsoft Defender exclusions, and uses separate Telegram bots for each victim to receive commands and send stolen data, alongside commercial cloud-storage services. Agencies said the resulting information can reveal a victim’s location, contacts and daily routine, raising risks of harassment and physical harm; the NCSC also warned that attackers may move targets to personal devices to evade workplace security.\u003c/p\u003e\n"},{"n":20,"title":"Mass-Scanning Campaign Exploits Vite Flaw to Extract Cloud Credentials From Exposed Dev Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/mass-scanning-campaign-exploits-vite.html","time":"11:12","priority":"SHOULD READ","score":88,"tldr":"Attackers are mass-scanning internet-exposed Vite development servers to exploit CVE-2026-39364, bypassing file-deny rules with query parameters to steal .env files, cloud credentials, and infrastructure configuration data. Organizations should keep Vite dev servers off public networks and apply the available fix.","briefOverview":"\u003cp\u003eF5 Labs reported an August 2026 mass-scanning campaign targeting Vite development servers that are exposed to the internet. The activity exploits CVE-2026-39364, a high-severity Vite flaw with a CVSS score of 8.2. Attackers are seeking cloud credentials, configuration data, and infrastructure state files from affected systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated requests to retrieve files that should be blocked by Vite\u0026rsquo;s \u003ccode\u003eserver.fs.deny\u003c/code\u003e setting when query parameters such as \u003ccode\u003e?raw\u003c/code\u003e, \u003ccode\u003e?import\u0026amp;raw\u003c/code\u003e, or \u003ccode\u003e?import\u0026amp;url\u0026amp;inline\u003c/code\u003e are appended. A deployment is affected when its Vite development server is exposed to the network, the target file is within allowed directories, and the file matches a denied-file pattern. Observed requests targeted environment files, AWS and Azure profiles, Terraform state files, and system paths including \u003ccode\u003e/etc/passwd\u003c/code\u003e and \u003ccode\u003e/proc/self/environ\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe requests used fake User-Agent strings impersonating major web crawlers and AI bots, along with forged \u003ccode\u003eX-Forwarded-For\u003c/code\u003e and \u003ccode\u003eX-Real-IP\u003c/code\u003e values intended to bypass IP-based controls and complicate log analysis. Much of the observed malicious activity originated from the United States, Belgium, the Netherlands, Singapore, and Taiwan, with Google Cloud Platform address ranges used by the attackers. Exposing Vite through the \u003ccode\u003e--host\u003c/code\u003e flag, \u003ccode\u003eserver.host\u003c/code\u003e settings, or incorrect Docker port mappings can make a development server reachable outside its default localhost configuration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 Labs observed an August 2026 mass-scanning campaign targeting internet-exposed Vite development servers to steal cloud credentials, configuration data, and infrastructure state files.","The campaign exploits CVE-2026-39364, a Vite flaw that can allow unauthenticated attackers to retrieve files blocked by server.fs.deny by adding query parameters such as ?raw or ?import\u0026raw.","Affected deployments require the Vite development server to be exposed to the network, the sensitive file to be within server.fs.allow directories, and the file to match a server.fs.deny pattern.","Observed requests targeted environment files, AWS credentials and configurations, Terraform state files, Azure profiles, and system files such as /etc/passwd and /proc/self/environ.","The requests used spoofed crawler and AI-bot User-Agent strings and forged X-Forwarded-For and X-Real-IP values, while much of the activity originated from the United States, Belgium, the Netherlands, Singapore, and Taiwan."],"insights":["The flaw is most relevant when a Vite development server has been deliberately or accidentally exposed beyond localhost, including through Docker port-mapping mistakes, rather than under Vite's default local-only configuration.","By requesting /proc/self/cwd/.env, attackers can read the active environment file relative to the running application process without first knowing the application's full path.","The malicious requests impersonated well-known search and AI bots and included forged client-IP headers, which can make traffic appear less suspicious and complicate log review.","The campaign sought infrastructure state files such as terraform.tfstate and serverless.yml in addition to credentials, potentially exposing detailed cloud configuration information."],"referencedReports":[{"title":"Cloud Takeover: Mass Scanning for Exposed Vite Endpoints (CVE-2026-39364)","url":"https://www.f5.com/labs/articles/cloud-takeover-mass-scanning-for-exposed-vite-endpoints-cve-2026-39364","publisher":"f5-labs","context":"The article relies on F5 Labs' analysis of the mass-scanning campaign targeting exposed Vite development servers.","category":"research","primary":true},{"title":"GHSA-v2wj-q39q-566r","url":"https://github.com/vitejs/vite/security/advisories/GHSA-v2wj-q39q-566r","publisher":"vite","context":"The article cites Vite's advisory describing how query parameters can bypass server.fs.deny protections.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 Labs reported an August 2026 mass-scanning campaign targeting Vite development servers that are exposed to the internet. The activity exploits CVE-2026-39364, a high-severity Vite flaw with a CVSS score of 8.2. Attackers are seeking cloud credentials, configuration data, and infrastructure state files from affected systems.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated requests to retrieve files that should be blocked by Vite\u0026rsquo;s \u003ccode\u003eserver.fs.deny\u003c/code\u003e setting when query parameters such as \u003ccode\u003e?raw\u003c/code\u003e, \u003ccode\u003e?import\u0026amp;raw\u003c/code\u003e, or \u003ccode\u003e?import\u0026amp;url\u0026amp;inline\u003c/code\u003e are appended. A deployment is affected when its Vite development server is exposed to the network, the target file is within allowed directories, and the file matches a denied-file pattern. Observed requests targeted environment files, AWS and Azure profiles, Terraform state files, and system paths including \u003ccode\u003e/etc/passwd\u003c/code\u003e and \u003ccode\u003e/proc/self/environ\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe requests used fake User-Agent strings impersonating major web crawlers and AI bots, along with forged \u003ccode\u003eX-Forwarded-For\u003c/code\u003e and \u003ccode\u003eX-Real-IP\u003c/code\u003e values intended to bypass IP-based controls and complicate log analysis. Much of the observed malicious activity originated from the United States, Belgium, the Netherlands, Singapore, and Taiwan, with Google Cloud Platform address ranges used by the attackers. Exposing Vite through the \u003ccode\u003e--host\u003c/code\u003e flag, \u003ccode\u003eserver.host\u003c/code\u003e settings, or incorrect Docker port mappings can make a development server reachable outside its default localhost configuration.\u003c/p\u003e\n"},{"n":4,"title":"CenterPoint Energy confirms customer data stolen in cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/centerpoint-energy-confirms-customer-data-stolen-in-cyberattack/","time":"16:40","priority":"SHOULD READ","score":86,"tldr":"CenterPoint Energy confirmed that an unauthorized party accessed personal information belonging to some customers through an external-facing system, following claims that 7.49 million records were scraped via an inadequately protected public API. The utility says service operations were unaffected and is investigating, strengthening defenses, and preparing required notifications.","briefOverview":"\u003cp\u003eCenterPoint Energy confirmed that an unauthorized third party obtained personal information relating to some customers through one of its external-facing systems. The disclosure followed an online claim by a threat actor using the alias “4d722e4d656f77,” who said they stole 7.49 million customer records. CenterPoint is investigating with third-party experts and will notify affected customers and regulators as required.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor alleged that the records included names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers. They claimed the data was collected by cycling through millions of identifiers on a public API that lacked protections against automated access, including rate limiting and a web application firewall. CenterPoint said its electric and gas services were not affected, while proposed class-action lawsuits have already been filed by firms representing potentially impacted customers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CenterPoint Energy confirmed that an unauthorized third party obtained personal information relating to some customers through an external-facing system.","A threat actor using the alias “4d722e4d656f77” claimed to have stolen and leaked 7.49 million customer records from CenterPoint Energy.","The allegedly stolen records included names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers.","CenterPoint Energy said its electric and natural-gas services were not affected and that it does not believe the incident will materially affect its business or financial condition.","The company has activated incident-response procedures, retained cybersecurity experts, strengthened system protections, and reported the incident to law enforcement and regulators."],"insights":["The alleged data collection method was systematic guessing or cycling through millions of record identifiers on a public-facing interface, rather than a claimed disruption of CenterPoint’s electric or gas operations.","CenterPoint’s SEC filing confirms that personal information was obtained but does not disclose the number of affected customers or the specific data types involved, leaving the investigation’s scope unresolved.","The incident has already produced proposed federal class-action lawsuits alleging that the breach occurred between August 17 and September 1.","CenterPoint said it strengthened protections on its systems after the incident, indicating that its response includes changes beyond investigation and customer notification."],"referencedReports":[{"title":"CenterPoint Energy Form 8-K","url":"https://www.sec.gov/Archives/edgar/data/1130310/000110465926107560/tm2625326d1_8k.htm","publisher":"centerpoint-energy","context":"The article cites CenterPoint Energy's SEC filing as confirmation that an unauthorized third party obtained customer personal information.","category":"advisory","primary":true}],"body":"\u003cp\u003eCenterPoint Energy confirmed that an unauthorized third party obtained personal information relating to some customers through one of its external-facing systems. The disclosure followed an online claim by a threat actor using the alias “4d722e4d656f77,” who said they stole 7.49 million customer records. CenterPoint is investigating with third-party experts and will notify affected customers and regulators as required.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor alleged that the records included names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers. They claimed the data was collected by cycling through millions of identifiers on a public API that lacked protections against automated access, including rate limiting and a web application firewall. CenterPoint said its electric and gas services were not affected, while proposed class-action lawsuits have already been filed by firms representing potentially impacted customers.\u003c/p\u003e\n"},{"n":9,"title":"Malcious Admin Menu Editor Pro plugin backdoors 1,500 WordPress sites","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malcious-admin-menu-editor-pro-plugin-backdoors-1-500-wordpress-sites/","time":"20:34","priority":"SHOULD READ","score":84,"tldr":"Compromised updates for Admin Menu Editor Pro versions 2.35 and 2.36 installed a web shell and hidden WordPress users on potentially more than 1,500 sites. Customers should restore from a known-safe backup or remove the plugin, malicious object-cache directory, and related database entries.","briefOverview":"\u003cp\u003eAn unauthorized party compromised the adminmenueditor.com website and distributed malicious updates for the paid Admin Menu Editor Pro WordPress plugin. Version 2.35 was available from about 06:00 to 13:00 UTC, and the developer’s clean 2.36 replacement was also compromised because the attacker still had access. The developer took the website offline after evidence suggested the attacker may have had root-level server access.\u003c/p\u003e\n\n\u003cp\u003eThe malicious updates included \u003ccode\u003eincludes/wp-user-consent.php\u003c/code\u003e, which installed a web shell and created a hidden user account on affected websites. Approximately 230 customers installed the first malicious version on at least 1,500 sites, while several hundred additional customers may have downloaded a trojanized version 2.36. Customers using versions 2.35 or 2.36 should restore from a safe backup made before September 14, or remove the plugin, \u003ccode\u003e/wp-content/object-cache/\u003c/code\u003e, and the identified malicious database entries; version 2.34 and the free plugin are believed to be unaffected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unauthorized party compromised adminmenueditor.com and distributed malicious Admin Menu Editor Pro updates, including versions 2.35 and 2.36.","The malicious update included a file named includes/wp-user-consent.php that installed a web shell and created a hidden user account on affected WordPress sites.","The developer estimates that version 2.35 affected approximately 230 customers and was installed on at least 1,500 sites, while additional users may have received a trojanized version 2.36.","Indicators of compromise include a new /wp-content/object-cache/ directory, users beginning with wp_ in the wp_users table, and wp_ocache* options in the wp_options table.","The developer recommends restoring affected sites from a backup made before September 14 or, if that is not possible, deleting the plugin, the object-cache directory, and the identified database entries."],"insights":["Installing the initially clean version 2.36 was not necessarily safe because the attacker retained access to the update website and compromised that release as well.","The malicious user account may not appear in the WordPress dashboard, so checking only the visible user list could miss evidence of compromise.","The developer took the distribution website offline because the investigation suggested the attacker may have had root-level server access, indicating the issue could not be contained by simply removing one malicious update.","Version 2.34 is believed to be clean and the free Admin Menu Editor plugin does not appear to be affected, narrowing the incident to specific Pro releases."],"referencedReports":[],"body":"\u003cp\u003eAn unauthorized party compromised the adminmenueditor.com website and distributed malicious updates for the paid Admin Menu Editor Pro WordPress plugin. Version 2.35 was available from about 06:00 to 13:00 UTC, and the developer’s clean 2.36 replacement was also compromised because the attacker still had access. The developer took the website offline after evidence suggested the attacker may have had root-level server access.\u003c/p\u003e\n\n\u003cp\u003eThe malicious updates included \u003ccode\u003eincludes/wp-user-consent.php\u003c/code\u003e, which installed a web shell and created a hidden user account on affected websites. Approximately 230 customers installed the first malicious version on at least 1,500 sites, while several hundred additional customers may have downloaded a trojanized version 2.36. Customers using versions 2.35 or 2.36 should restore from a safe backup made before September 14, or remove the plugin, \u003ccode\u003e/wp-content/object-cache/\u003c/code\u003e, and the identified malicious database entries; version 2.34 and the free plugin are believed to be unaffected.\u003c/p\u003e\n"},{"n":12,"title":"How Money Laundering, Scams, and Espionage Hide in a Web Full of Casino Garbage","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/how-money-laundering-scams-and-espionage-hide-in-a-web-full-of-casino-garbage/","time":"15:00","priority":"SHOULD READ","score":84,"tldr":"Infoblox found that millions of lookalike casino websites conceal distinct criminal operations, including illegal gambling and money laundering, scam gambling, and China-aligned PeckBirdy malware C2 infrastructure. Defenders should not dismiss casino or adult-domain activity as policy violations, because repeated queries to multiple PeckBirdy C2 domains may indicate a compromise.","briefOverview":"\u003cp\u003eInfoblox describes three kinds of malicious casino websites that can appear nearly identical in a browser: illegal Chinese-language casinos supporting gambling and money laundering, scam gambling sites that block withdrawals, and decoy sites used by China-aligned actors running the PeckBirdy command-and-control framework. The company tracks more than 1.7 million illegal Chinese-language casino domains, while the PeckBirdy population consists of dozens of decoy domains. These sites use rapidly changing domains, varied hosting providers, and customer-facing branding that can make criminal infrastructure hard to distinguish from ordinary low-quality gambling content.\u003c/p\u003e\n\n\u003cp\u003ePeckBirdy has operated since 2023 and embeds its communications infrastructure in Chinese-language casino and adult websites. Infoblox identified domains including cache-mcp[.]com and mcp-source[.]online; the latter had zero VirusTotal detections as of August 2026 despite being used for WebSocket connections. Just over 3% of Infoblox enterprise customers resolved at least one PeckBirdy command-and-control domain, with education, IT, banking, financial services, and government among the observed industries. Infoblox advises defenders not to dismiss casino or adult-domain alerts automatically, especially when a network contacts several distinct PeckBirdy domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox separates malicious casino websites into three groups: illegal Chinese-language gambling sites used for gambling and money laundering, scam gambling sites that prevent victims from withdrawing funds, and PeckBirdy decoy sites used for malware command-and-control communications.","Infoblox tracks more than 1.7 million illegal Chinese-language casino domains, with the FUNNULL and Vigorish Viper networks accounting for roughly 81% of that population.","China-aligned APT groups have used the PeckBirdy framework since 2023 to embed command-and-control domains in low-quality Chinese-language casino and adult websites.","The PeckBirdy domain mcp-source[.]online had zero VirusTotal detections as of August 2026, despite being used for WebSocket connections from some PeckBirdy decoy sites.","Infoblox found that just over 3% of its enterprise customers resolved at least one PeckBirdy command-and-control domain, and repeated resolution of three to ten distinct such domains may indicate a potential compromise."],"insights":["The casino decoys used by PeckBirdy are visually indistinguishable from illegal gambling and scam sites, so dismissing a casino-domain alert as employee browsing can overlook malicious activity.","A single query to githubassets[.]net is
