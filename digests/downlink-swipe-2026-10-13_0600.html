<script type="application/json" id="dl-articles">[{"n":2,"title":"Attackers Heat French Supermarket Fridges Up to 50°C by Hijacking Danfoss Controllers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-heat-french-supermarket.html","time":"08:48","priority":"SHOULD READ","score":88,"tldr":"Attackers remotely compromised Danfoss refrigeration controllers at hundreds of French supermarkets, forcing some systems into defrost mode and warming them to 50°C, causing food losses and equipment damage. French authorities urge operators to disconnect or tightly restrict internet access to affected AK-SM and AK-SC controllers, particularly unsupported legacy models.","briefOverview":"\u003cp\u003eAttackers remotely took control of refrigeration systems at hundreds of French supermarkets on October 11, putting fridges and freezers into defrost mode and heating some to as much as 50°C. Retailers including Intermarché, Netto, Coopérative U, Carrefour, Monoprix, and E.Leclerc reported affected stores. Some stores had to discard food, and Les Mousquetaires expected losses of tens of millions of euros across France. The Paris prosecutor’s office opened an inquiry to identify victims and determine the connection between the incident and reported food and equipment damage.\u003c/p\u003e\n\n\u003cp\u003eCERT-FR said numerous Danfoss AK-SM and AK-SC refrigeration controllers were compromised and urged operators to disconnect them from the internet or tightly restrict access. Danfoss said most affected units were older AK-SM 800 and AK-SC 355 models that no longer receive software or security updates, while some current AK-SM 800A devices were running outdated firmware. CERT-FR advised potentially affected operators to limit access, reset devices, apply available fixes, change passwords, review accounts, and reconfigure controllers; unsupported models cannot receive new fixes. As of October 13, authorities and Danfoss had not identified the attackers, the method used to enter the controllers, or a confirmed vulnerability tied to the incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers remotely controlled refrigeration systems at hundreds of French supermarkets on October 11, placing fridges and freezers into defrost mode and heating some to as much as 50°C.","CERT-FR said numerous Danfoss AK-SM and AK-SC refrigeration controllers were compromised and advised operators to disconnect them from the internet or strictly filter access.","Intermarché, Netto, Coopérative U, Carrefour, Monoprix, and E.Leclerc reported affected stores, although not every store lost its food stock.","Danfoss said most affected units were older AK-SM 800 and AK-SC 355 models that no longer receive software or security updates, while some current AK-SM 800A devices were running outdated firmware.","French authorities had not identified the attackers, the entry method, or a confirmed vulnerability linked to the incident as of October 13."],"insights":["The reported impact varied sharply between retailers: Intermarché said affected stores discarded all concerned products, while Coopérative U said most of its 80 affected stores maintained the cold chain and only a minority lost goods.","The two older affected controller models, AK-SM 800 and AK-SC 355, no longer receive security fixes, so CERT-FR’s recommended recovery step of applying available fixes cannot address those devices.","Danfoss had previously recorded attacks against AK-SM 800 controllers in 2022 at Russian and Israeli supermarkets, with the Israeli stores lacking proper firewall or VPN protection.","Although CERT-FR urged operators to remove or tightly restrict internet access, it had not confirmed that internet exposure was the route used in this incident.","Researchers had found thousands of newer AK-SM 800A management interfaces reachable from the internet, while Danfoss had patched three vulnerabilities in that model during 2025 without linking them to the French incident."],"referencedReports":[{"title":"CERTFR-2026-ALE-012","url":"https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/","publisher":"cert-fr","context":"CERT-FR's alert says numerous Danfoss AK-SM and AK-SC refrigeration controllers were compromised and advises operators to disconnect or tightly restrict access to them.","category":"advisory","primary":true},{"title":"CERTFR-2025-DUR-003","url":"https://www.cert.ssi.gouv.fr/dur/CERTFR-2025-DUR-003/","publisher":"cert-fr","context":"The article cites CERT-FR's hardening recommendations as additional guidance for operators that must retain remote administration.","category":"guide","primary":false},{"title":"Freeze the Controller, Defrost the Food: Uncovering Vulnerabilities in Danfoss Refrigeration Controllers","url":"https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers","publisher":"claroty","context":"Claroty researchers described three vulnerabilities affecting the newer AK-SM 800A and reported finding thousands of its management interfaces exposed to the internet.","category":"research","primary":false},{"title":"DSA-2025-03-01","url":"https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-03-01/","publisher":"danfoss","context":"The article references this Danfoss advisory for CVE-2025-41450, an authentication bypass affecting AK-SM 800A versions before 4.2.","category":"advisory","primary":false},{"title":"DSA-2025-08-01","url":"https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-08-01/","publisher":"danfoss","context":"The article references this Danfoss advisory for CVE-2025-41451, a command injection flaw fixed in version 4.3.1.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers remotely took control of refrigeration systems at hundreds of French supermarkets on October 11, putting fridges and freezers into defrost mode and heating some to as much as 50°C. Retailers including Intermarché, Netto, Coopérative U, Carrefour, Monoprix, and E.Leclerc reported affected stores. Some stores had to discard food, and Les Mousquetaires expected losses of tens of millions of euros across France. The Paris prosecutor’s office opened an inquiry to identify victims and determine the connection between the incident and reported food and equipment damage.\u003c/p\u003e\n\n\u003cp\u003eCERT-FR said numerous Danfoss AK-SM and AK-SC refrigeration controllers were compromised and urged operators to disconnect them from the internet or tightly restrict access. Danfoss said most affected units were older AK-SM 800 and AK-SC 355 models that no longer receive software or security updates, while some current AK-SM 800A devices were running outdated firmware. CERT-FR advised potentially affected operators to limit access, reset devices, apply available fixes, change passwords, review accounts, and reconfigure controllers; unsupported models cannot receive new fixes. As of October 13, authorities and Danfoss had not identified the attackers, the method used to enter the controllers, or a confirmed vulnerability tied to the incident.\u003c/p\u003e\n"},{"n":3,"title":"Low-Cost Android Phones Ship With Preinstalled Malware That Turns Them Into Residential Proxies","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/low-cost-android-phones-ship-with.html","time":"06:00","priority":"SHOULD READ","score":84,"tldr":"Bitdefender found Midnight Mimosa malware preinstalled in the firmware of low-cost Android phones, giving operators system-level control to silently install apps, commit ad fraud, and use devices as residential proxy nodes. Because the malicious component resides in the system partition, affected users generally need a firmware-level fix from vendors rather than a normal app uninstall.","briefOverview":"\u003cp\u003eBitdefender has identified a campaign called Midnight Mimosa involving malicious software preinstalled in the firmware of low-cost Android phones built on MediaTek platforms. The system-level component, named \u003ccode\u003ecom.android.system.lite\u003c/code\u003e, can install or remove apps, grant permissions, and download and run code supplied by its operators. Bitdefender said the campaign is intended to generate revenue through ad and click fraud, device-information collection, and use of infected phones as residential proxy relay nodes.\u003c/p\u003e\n\n\u003cp\u003eThe core malware deploys separate apps disguised as utility tools, which use a legitimate advertising software development kit to display ads through invisible windows. It can also disable the Google Play Store before installing a payload and enable it again afterward, likely to avoid Play Protect safeguards. Bitdefender found 13 Google Play apps communicating with the same control servers, while most affected devices appear to be low-cost, white-label, or counterfeit phones.\u003c/p\u003e\n\n\u003cp\u003eThe campaign has been observed on thousands of unique devices in more than 150 countries over roughly two years, with the largest number of infected devices in Mexico. Because the malicious component is stored in the system partition, affected owners generally cannot remove it through normal app-uninstall methods. Bitdefender said lasting remediation requires firmware-level cleanup or action by the vendors and marketplaces that distribute the affected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitdefender tracks the campaign as Midnight Mimosa, involving preinstalled com.android.system.lite malware on low-cost Android devices built on MediaTek platforms.","The system-level malware can download and execute remote payloads, install or remove disguised apps, grant permissions, collect device and installed-app information, enable ad fraud, and turn devices into residential proxy relay nodes.","Bitdefender identified 13 Google Play apps that communicated with the same control servers; the apps offered functions such as weather information and QR-code scanning while also displaying ads outside the app.","The campaign was observed on thousands of unique devices across more than 150 countries over roughly two years, with most infected devices located in Mexico.","Because the core component is located in the system partition, normal app removal is not sufficient and a durable fix requires firmware-level cleanup or action by device vendors and marketplaces."],"insights":["The campaign can evade a key user protection by disabling the Google Play Store before installing a payload and re-enabling it after the payload runs, likely to bypass Play Protect safeguards.","The preinstalled component does not itself generate fraudulent clicks; instead, it deploys separate utility-looking dropper apps that use a legitimate advertising SDK to load ads in an invisible window.","Bitdefender found the malware on firmware signed with certificates attributed to Shenzhen Zediel Co., Ltd., but stated that it is not clear whether the certificate owner was involved in or aware of the deployment.","The affected devices include low-cost white-label or counterfeit phones that use names resembling Samsung Galaxy models and Apple iPhones, and the campaign has infrastructure overlaps with Android.Phantom."],"referencedReports":[{"title":"Midnight Mimosa Malware","url":"https://www.bitdefender.com/en-us/blog/labs/midnight-mimosa-malware","publisher":"bitdefender","context":"The article is based on Bitdefender's analysis tracking the preinstalled Android campaign as Midnight Mimosa.","category":"research","primary":true},{"title":"Android.Phantom","url":"https://news.drweb.com/show/?i=15110","publisher":"doctor-web","context":"The article cites Doctor Web's documentation of Android.Phantom and notes infrastructure overlaps with the Midnight Mimosa campaign.","category":"research","primary":false}],"body":"\u003cp\u003eBitdefender has identified a campaign called Midnight Mimosa involving malicious software preinstalled in the firmware of low-cost Android phones built on MediaTek platforms. The system-level component, named \u003ccode\u003ecom.android.system.lite\u003c/code\u003e, can install or remove apps, grant permissions, and download and run code supplied by its operators. Bitdefender said the campaign is intended to generate revenue through ad and click fraud, device-information collection, and use of infected phones as residential proxy relay nodes.\u003c/p\u003e\n\n\u003cp\u003eThe core malware deploys separate apps disguised as utility tools, which use a legitimate advertising software development kit to display ads through invisible windows. It can also disable the Google Play Store before installing a payload and enable it again afterward, likely to avoid Play Protect safeguards. Bitdefender found 13 Google Play apps communicating with the same control servers, while most affected devices appear to be low-cost, white-label, or counterfeit phones.\u003c/p\u003e\n\n\u003cp\u003eThe campaign has been observed on thousands of unique devices in more than 150 countries over roughly two years, with the largest number of infected devices in Mexico. Because the malicious component is stored in the system partition, affected owners generally cannot remove it through normal app-uninstall methods. Bitdefender said lasting remediation requires firmware-level cleanup or action by the vendors and marketplaces that distribute the affected devices.\u003c/p\u003e\n"},{"n":4,"title":"Two Critical MarkLogic Flaws Could Give Delegated Managers Persistent Admin Control","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/two-critical-marklogic-flaws-could-give.html","time":"08:44","priority":"SHOULD READ","score":82,"tldr":"Progress Software disclosed 31 MarkLogic Server flaws, including critical privilege-escalation bugs that can let delegated managers gain persistent administrator control. Organizations running MarkLogic 11.x or 12.x should upgrade to 11.3.7 or 12.1.0, respectively, as no workarounds are listed.","briefOverview":"\u003cp\u003eProgress Software disclosed 31 vulnerabilities in MarkLogic Server on October 12, including five rated critical. Fixes have been available since September 10 in MarkLogic 11.3.7 and 12.1.0. MarkLogic 11.x versions before 11.3.7 and 12.x versions before 12.1.0 are affected, while the earlier August fixes in 11.3.6 and 12.0.3 are not sufficient for this batch.\u003c/p\u003e\n\n\u003cp\u003eTwo critical flaws could allow accounts with limited management privileges to gain persistent administrator control: CVE-2026-85947 involves forest-management permissions, and CVE-2026-85948 is an XQuery injection issue in a deprecated Management API path. Other critical issues could enable elevated server-side code execution, access to security-critical data through forest backup or restore operations, or unauthorized actions through REST and XDBC evaluation paths. Progress lists no workaround for organizations unable to upgrade, and its documentation does not state whether any of the flaws have been exploited or whether an administrator account created before patching through CVE-2026-85947 would be removed.\u003c/p\u003e\n\n\u003cp\u003eThe updates make security-related behavior changes that may affect existing deployments, including stricter privilege checks, disabled XML external entity processing by default, HTTPS by default for S3 connections, and removal of InfoStudio, OpsDirector, and the /manage/v2/packages API. Older MarkLogic Content Pump versions can fail against the new releases unless upgraded or run with a setting that may reduce performance. Progress advises customers to review upgrade notes, delegated forest and database permissions, and roles holding the xdmp-eval-in privilege before upgrading.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software disclosed 31 vulnerabilities in MarkLogic Server, including five rated critical, with fixes available in MarkLogic 11.3.7 and 12.1.0.","CVE-2026-85947 and CVE-2026-85948 could allow accounts with limited forest-management or user-management permissions to gain persistent administrator control of a MarkLogic server.","MarkLogic 11.x releases before 11.3.7 and MarkLogic 12.x releases before 12.1.0 are affected, and the article states that no workaround is listed for customers unable to upgrade.","The new releases remove the deprecated /manage/v2/packages API, InfoStudio, and OpsDirector, and introduce security-related changes that can affect existing tools and automation.","Progress says the CVE records and upgrade notes do not indicate whether any of the 31 flaws have been exploited in attacks."],"insights":["Applying the August MarkLogic fixes alone is insufficient: versions 11.3.6 and 12.0.3 remain affected by this newly disclosed batch and require upgrading to 11.3.7 or 12.1.0.","The fixes can disrupt operations because older MarkLogic Content Pump versions fail unless upgraded or run with the performance-reducing restrict_hosts setting, and several legacy components are removed.","Organizations should review delegated forest and database permissions and roles holding xdmp-eval-in before upgrading, because the changes tighten access checks and may remove access that was previously allowed incorrectly.","Upgrading may not fully remediate prior compromise: the article says the vendor documentation does not state whether an administrator account created through CVE-2026-85947 before patching is removed.","Some protections require follow-up after installation, because existing log files retain old permissions until rotated or recreated and the Kerberos check is skipped if no keytab is configured."],"referencedReports":[{"title":"MarkLogic Server 11.3.7 Release Notes","url":"https://docs.progress.com/bundle/marklogic-server-whats-new-11/page/topics/release-notes.html","publisher":"progress-software","context":"The article cites these vendor release notes as documenting the fixes and security-related upgrade changes for MarkLogic 11.3.7.","category":"advisory","primary":true},{"title":"MarkLogic Server 12.1.0 Release Notes","url":"https://docs.progress.com/bundle/marklogic-server-whats-new-12/page/topics/release-notes.html","publisher":"progress-software","context":"The article cites these vendor release notes as documenting the fixes and security-related upgrade changes for MarkLogic 12.1.0.","category":"advisory","primary":true}],"body":"\u003cp\u003eProgress Software disclosed 31 vulnerabilities in MarkLogic Server on October 12, including five rated critical. Fixes have been available since September 10 in MarkLogic 11.3.7 and 12.1.0. MarkLogic 11.x versions before 11.3.7 and 12.x versions before 12.1.0 are affected, while the earlier August fixes in 11.3.6 and 12.0.3 are not sufficient for this batch.\u003c/p\u003e\n\n\u003cp\u003eTwo critical flaws could allow accounts with limited management privileges to gain persistent administrator control: CVE-2026-85947 involves forest-management permissions, and CVE-2026-85948 is an XQuery injection issue in a deprecated Management API path. Other critical issues could enable elevated server-side code execution, access to security-critical data through forest backup or restore operations, or unauthorized actions through REST and XDBC evaluation paths. Progress lists no workaround for organizations unable to upgrade, and its documentation does not state whether any of the flaws have been exploited or whether an administrator account created before patching through CVE-2026-85947 would be removed.\u003c/p\u003e\n\n\u003cp\u003eThe updates make security-related behavior changes that may affect existing deployments, including stricter privilege checks, disabled XML external entity processing by default, HTTPS by default for S3 connections, and removal of InfoStudio, OpsDirector, and the /manage/v2/packages API. Older MarkLogic Content Pump versions can fail against the new releases unless upgraded or run with a setting that may reduce performance. Progress advises customers to review upgrade notes, delegated forest and database permissions, and roles holding the xdmp-eval-in privilege before upgrading.\u003c/p\u003e\n"},{"n":5,"title":"The 4 AI Blindspots Your Security Controls Miss","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/the-4-ai-blindspots-security-teams-miss","time":"07:01","priority":"MAY READ","score":55,"tldr":"AI security controls often miss risk on developer endpoints, behind approved chatbots, in agent/MCP activity, and in training-data pipelines, as 2025 incidents demonstrate. Organizations need connected discovery, data classification, and policy enforcement across the full AI ecosystem rather than relying only on network monitoring or approved-app inventories.","briefOverview":"\u003cp\u003eThe article argues that AI security programs can miss four major risk areas: AI tools running directly on endpoints, insecure systems behind approved chatbots, agent and Model Context Protocol (MCP) activity, and sensitive data entering training pipelines. It cites an August 2025 supply-chain incident involving malicious Nx packages that used installed AI command-line tools to search developer machines for secrets, leaking 2,349 distinct credentials. Because local models can communicate over a device’s internal connection rather than the network, network-based controls may not see them.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes how weaknesses behind McDonald’s McHire chatbot exposed data tied to about 64 million job applications, despite the chatbot itself not being the weak point. It cites a malicious Postmark-MCP package that secretly copied every outgoing email to an attacker-controlled address, illustrating how apparently authorized agent activity can conceal harmful behavior. Finally, it notes that an audit of part of the DataComp CommonPool training set found thousands of identity documents and estimated that face blurring missed about 102 million faces, arguing that sensitive data should be classified before it enters model-training processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Network-based controls can miss AI command-line tools running on developer endpoints, as malicious Nx packages used installed AI tools to search for secrets and leaked 2,349 distinct credentials in August 2025.","An approved AI chatbot can still expose data through insecure systems behind it; researchers found a weak staff account and insecure API connected to McDonald’s McHire platform, exposing data tied to about 64 million job applications.","A malicious Postmark-MCP package added code that secretly copied every outgoing email to an attacker-controlled address, and it was downloaded 1,643 times before removal.","An audit of 0.1% of the DataComp CommonPool training set found thousands of validated identity documents and estimated that its face-blurring process missed about 102 million faces overall.","The article argues that organizations need discovery, classification, and policy coverage across endpoints, AI agents, connected data systems, and data pipelines rather than relying only on approved AI inventories or prompt-and-response controls."],"insights":["An AI inventory based only on procurement records and approved applications can miss the AI tools most likely to handle or expose sensitive data, especially tools installed directly on developer laptops.","Blocking public AI websites may drive employees toward personal AI accounts rather than eliminating AI use; the article cites that 47% of employees use personal accounts that bypass corporate controls.","The McDonald’s incident shows that an AI security review focused on the chatbot or its model can overlook the more consequential risk in supporting accounts, APIs, databases, and data-loading jobs.","Agent activity can appear authorized and routine even when a compromised tool is leaking information, such as the malicious package that added a hidden copy recipient to every email.","Sensitive data must be identified before it enters AI training pipelines because removing it after model training may require starting the process over."],"referencedReports":[{"title":"Cloud and Threat Report 2026","url":"https://www.netskope.com/resources/cloud-and-threat-reports/cloud-and-threat-report-2026","publisher":"netskope-threat-labs","context":"The article cites this report for statistics on personal AI accounts bypassing corporate controls and average monthly AI data-policy violations.","category":"research","primary":false},{"title":"AI Risk and Readiness Report","url":"https://www.netskope.com/resources/reports-guides/ai-risk-and-readiness-report","publisher":"netskope","context":"The article cites this report for the finding that 68% of organizations govern AI reactively.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that AI security programs can miss four major risk areas: AI tools running directly on endpoints, insecure systems behind approved chatbots, agent and Model Context Protocol (MCP) activity, and sensitive data entering training pipelines. It cites an August 2025 supply-chain incident involving malicious Nx packages that used installed AI command-line tools to search developer machines for secrets, leaking 2,349 distinct credentials. Because local models can communicate over a device’s internal connection rather than the network, network-based controls may not see them.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes how weaknesses behind McDonald’s McHire chatbot exposed data tied to about 64 million job applications, despite the chatbot itself not being the weak point. It cites a malicious Postmark-MCP package that secretly copied every outgoing email to an attacker-controlled address, illustrating how apparently authorized agent activity can conceal harmful behavior. Finally, it notes that an audit of part of the DataComp CommonPool training set found thousands of identity documents and estimated that face blurring missed about 102 million faces, arguing that sensitive data should be classified before it enters model-training processes.\u003c/p\u003e\n"},{"n":1,"title":"GitLab Patches CVSS 10.0 Flaw That Could Let Unauthenticated Users Run Server Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/gitlab-patches-cvss-100-flaw-that-could.html","time":"08:43","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""}]</script>

#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
