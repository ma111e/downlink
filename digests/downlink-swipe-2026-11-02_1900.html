<script type="application/json" id="dl-articles">[{"n":2,"title":"Chinese hackers use ARTEX AI in automated attacks against 200 orgs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chinese-hackers-use-artex-ai-in-automated-attacks-against-200-orgs/","time":"21:40","priority":"MUST READ","score":93,"tldr":"Chinese-linked Vapor Panda used the ARTEX AI multi-agent penetration-testing framework, alongside commercial language models, to automate cyberespionage against more than 200 organizations in 14 countries, compromising at least nine. The campaign shows AI agents can conduct reconnaissance, exploitation, credential theft, and lateral activity across multiple intrusions under human supervision.","briefOverview":"\u003cp\u003eChinese-linked threat actor Vapor Panda used the ARTEX AI multi-agent penetration-testing framework in a cyberespionage campaign against more than 200 organizations in 14 countries. The operation, which began October 17, targeted government ministries, telecommunications providers, and organizations in pharmaceutical, semiconductor, defense, nuclear, and financial sectors. CrowdStrike said at least nine organizations were compromised, while at least 12 additional high-value targets experienced password-spraying and credential-scanning activity.\u003c/p\u003e\n\n\u003cp\u003eCrowdStrike reported that ARTEX AI, DeepSeek, and another unidentified commercial language model helped coordinate planning and worker agents across multiple intrusions, with human operators intervening for critical decisions. The agents conducted reconnaissance, exploited vulnerabilities, deployed web shells, obtained credentials, and attempted alternate paths, while being directed to avoid Windows systems protected by CrowdStrike Falcon. Separately, the Dutch Institute for Vulnerability Disclosure said ARTEX AI autonomously gained root privileges in its network within 12 minutes by chaining a Zammad zero-day with a second local-privilege-escalation zero-day, generating more than 450,000 requests and 2,500 scripts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike says the China-linked threat actor Vapor Panda used ARTEX AI in a cyberespionage campaign targeting more than 200 organizations across 14 countries beginning on October 17.","The campaign targeted government ministries, telecommunications providers, and organizations in the pharmaceutical, semiconductor, defense, nuclear, and financial sectors, with at least nine organizations compromised.","Vapor Panda used DeepSeek and another commercial language model to coordinate AI agents that performed reconnaissance, exploited flaws, deployed remote-control tools, obtained credentials, and pursued alternative paths.","In an intrusion against a Greek government entity, the agents forged an administrator token and read mailboxes using authentication keys from a 2022 mail-server directory export.","The Dutch Institute for Vulnerability Disclosure said ARTEX AI autonomously reached root-level access on its network in 12 minutes by chaining a Zammad zero-day with a second zero-day that raised its privileges."],"insights":["The campaign combined autonomous AI-agent activity with human decision-making at critical points, allowing one operator to direct multiple intrusions simultaneously.","The operators instructed the agents to avoid Windows systems protected by CrowdStrike Falcon and instead focus on unprotected hosts.","CrowdStrike estimated that AI agents used more than 1.4 billion input tokens during one intrusion.","DIVD said the ARTEX AI activity was highly detectable despite its speed, generating more than 450,000 requests and 2,500 scripts during the attack.","ARTEX AI reportedly reached root-level access in DIVD’s environment within 12 minutes by combining two previously unknown software flaws."],"referencedReports":[{"title":"Vapor Panda Uses ARTEX to Scale Global Campaign","url":"https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/","publisher":"crowdstrike","context":"The article relies on CrowdStrike researchers' analysis of Vapor Panda's use of ARTEX AI and language models to coordinate simultaneous intrusions.","category":"research","primary":true}],"body":"\u003cp\u003eChinese-linked threat actor Vapor Panda used the ARTEX AI multi-agent penetration-testing framework in a cyberespionage campaign against more than 200 organizations in 14 countries. The operation, which began October 17, targeted government ministries, telecommunications providers, and organizations in pharmaceutical, semiconductor, defense, nuclear, and financial sectors. CrowdStrike said at least nine organizations were compromised, while at least 12 additional high-value targets experienced password-spraying and credential-scanning activity.\u003c/p\u003e\n\n\u003cp\u003eCrowdStrike reported that ARTEX AI, DeepSeek, and another unidentified commercial language model helped coordinate planning and worker agents across multiple intrusions, with human operators intervening for critical decisions. The agents conducted reconnaissance, exploited vulnerabilities, deployed web shells, obtained credentials, and attempted alternate paths, while being directed to avoid Windows systems protected by CrowdStrike Falcon. Separately, the Dutch Institute for Vulnerability Disclosure said ARTEX AI autonomously gained root privileges in its network within 12 minutes by chaining a Zammad zero-day with a second local-privilege-escalation zero-day, generating more than 450,000 requests and 2,500 scripts.\u003c/p\u003e\n"},{"n":3,"title":"Largest crypto exchange in Brazil confirms cyberattack as millions flow out of platform","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/mercado-bitcoin-brazil-cryptocurrency-heist","time":"21:42","priority":"SHOULD READ","score":84,"tldr":"Mercado Bitcoin, Brazil’s largest crypto exchange, suspended deposits and withdrawals after a cyberattack reportedly drained more than $46 million, though the company says customers were not harmed. Investigators and other crypto platforms have frozen roughly $6.5 million so far, while researchers dispute whether customer wallets were affected.","briefOverview":"\u003cp\u003eMercado Bitcoin, which calls itself Latin America’s largest digital-assets investment platform and has about 4.5 million customers, suspended all deposits and withdrawals after a cybersecurity incident. Blockchain security companies said more than $46 million left the platform late Sunday, though Mercado Bitcoin did not confirm the figure. The company said the incident did not harm customers or cause a data breach, and said it was investigating, tracking assets, and coordinating with authorities.\u003c/p\u003e\n\n\u003cp\u003eMercado Bitcoin published destination addresses for the stolen funds and said it expected to restore the platform in the coming days. Tether said it froze about \u003cspan class=\"math inline\"\u003e\\(4.5 million connected to the theft, while other platforms froze another \\)\u003c/span\u003e2 million; Chainalysis said it was tracking the funds to help identify and disrupt them. Several security experts challenged Mercado Bitcoin’s claim that customer funds were unaffected, citing blockchain records that they said showed funds being taken from some customer wallets.\u003c/p\u003e\n\n\u003cp\u003eThe incident follows a series of costly attacks on cryptocurrency platforms. The article notes a reported \u003cspan class=\"math inline\"\u003e\\(6.3 billion theft from Binance that U.S. authorities attributed to North Korean hackers, as well as several crypto-exchange incidents exceeding \\)\u003c/span\u003e100 million in losses during the previous six months. It also notes that Chainalysis recently disclosed unauthorized access to internal systems and tools, in which user IDs, names, email addresses, and organization-role labels were taken.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mercado Bitcoin suspended all deposits and withdrawals following a cybersecurity incident on Monday morning.","Blockchain security companies reported that more than $46 million left Mercado Bitcoin late Sunday, although the company did not confirm that amount.","Mercado Bitcoin said the incident did not harm customers or cause a data breach, but several blockchain security experts said blockchain records showed funds were taken from some customer wallets.","Tether froze approximately $4.5 million linked to the theft, while other platforms froze another $2 million in cryptocurrency.","Mercado Bitcoin said it is investigating the incident, tracking the assets, coordinating with authorities, and plans to restore the platform in the coming days."],"insights":["Mercado Bitcoin’s statement that customers were not harmed conflicts with blockchain security experts’ evidence that funds were taken from some customer wallets.","The reported amount that left the platform exceeded $46 million, while Tether and other platforms had frozen about $6.5 million, showing that only part of the reported funds had been stopped at the time of the article.","The incident occurred amid a broader run of major cryptocurrency-platform thefts, including a reported $6.3 billion theft from Binance and several attacks exceeding $100 million in losses over the previous six months.","Even Chainalysis, which helps law enforcement and cryptocurrency companies track stolen assets, disclosed its own recent incident involving unauthorized access to internal systems and user information."],"referencedReports":[],"body":"\u003cp\u003eMercado Bitcoin, which calls itself Latin America’s largest digital-assets investment platform and has about 4.5 million customers, suspended all deposits and withdrawals after a cybersecurity incident. Blockchain security companies said more than $46 million left the platform late Sunday, though Mercado Bitcoin did not confirm the figure. The company said the incident did not harm customers or cause a data breach, and said it was investigating, tracking assets, and coordinating with authorities.\u003c/p\u003e\n\n\u003cp\u003eMercado Bitcoin published destination addresses for the stolen funds and said it expected to restore the platform in the coming days. Tether said it froze about \u003cspan class=\"math inline\"\u003e\\(4.5 million connected to the theft, while other platforms froze another \\)\u003c/span\u003e2 million; Chainalysis said it was tracking the funds to help identify and disrupt them. Several security experts challenged Mercado Bitcoin’s claim that customer funds were unaffected, citing blockchain records that they said showed funds being taken from some customer wallets.\u003c/p\u003e\n\n\u003cp\u003eThe incident follows a series of costly attacks on cryptocurrency platforms. The article notes a reported \u003cspan class=\"math inline\"\u003e\\(6.3 billion theft from Binance that U.S. authorities attributed to North Korean hackers, as well as several crypto-exchange incidents exceeding \\)\u003c/span\u003e100 million in losses during the previous six months. It also notes that Chainalysis recently disclosed unauthorized access to internal systems and tools, in which user IDs, names, email addresses, and organization-role labels were taken.\u003c/p\u003e\n"},{"n":5,"title":"European refrigerator controller redux: A new wave of refrigeration attacks","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/european-refrigerator-controller-redux-a-new-wave-of-refrigeration-attacks/","time":"19:12","priority":"SHOULD READ","score":84,"tldr":"Cyberattacks disrupted commercial refrigeration systems at grocery stores across six European countries, reportedly raising temperatures to 50°C and spoiling food. The incidents again appear linked to internet-exposed Danfoss StoreView controllers, though many exposed systems remain unpatched.","briefOverview":"\u003cp\u003eOn November 2, grocers, butchers, and small shops across Belgium, Estonia, Ireland, Luxembourg, the Netherlands, and Sweden reported cyberattacks on commercial refrigeration units. The attacks reportedly raised refrigerator temperatures to 50°C (122°F), causing food to spoil or melt in dozens of stores. Carrefour, Coop, Delhaize, ICA, Selver, SuperValu, and Spar were among the affected chains.\u003c/p\u003e\n\n\u003cp\u003eThe incidents resembled attacks against French grocers three weeks earlier in their early-morning timing, targeting, and temperature changes. Reports suggest Danfoss StoreView refrigeration controllers may have been involved in both waves, although no group has claimed responsibility and it is unconfirmed whether the same actor was responsible. Censys observed just over 1,000 exposed StoreView instances globally; France had fallen from 1,825 exposed systems before the October attacks to 220 at the time of analysis, with 41% appearing to use patched firmware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On November 2, grocers, butchers, and small shops in Belgium, Estonia, Ireland, Luxembourg, the Netherlands, and Sweden reported attacks on commercial refrigeration units.","Attackers reportedly raised refrigeration temperatures to 50°C (122°F), causing food to spoil or melt in dozens of stores.","Reports indicated that Danfoss StoreView refrigeration controllers, which were involved in attacks on French grocers on October 11, may also have been involved in this wave.","Censys observed just over 1,000 internet-exposed Danfoss StoreView instances globally, with France having the highest concentration.","Censys found that France had 220 exposed StoreView instances at the time of analysis, down from 1,825 before the October attacks, and 41% of the remaining French instances appeared to run patched firmware."],"insights":["France’s exposed Danfoss StoreView systems fell sharply from 1,825 before the October attacks to 220 at the time of analysis, indicating a major reduction in publicly reachable interfaces after the French incidents.","Patching levels varied substantially among affected countries: 68% of observed Belgian StoreView instances and 58% of Swedish instances appeared to run version 4.3.1 or later, compared with 41% in France.","The reported overnight timing and temperature changes to 50°C meant store employees were less likely to be able to respond immediately, increasing the potential for food spoilage.","Despite the similarity to the earlier French incidents, no group had claimed responsibility and it remained unconfirmed whether the same actor was responsible."],"referencedReports":[{"title":"Freeze the Controller, Defrost the Food: Uncovering Vulnerabilities in Danfoss Refrigeration Controllers","url":"https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers","publisher":"claroty-team82","context":"The article cites Claroty Team82 research published in August on vulnerabilities in Danfoss refrigeration products.","category":"research","primary":false}],"body":"\u003cp\u003eOn November 2, grocers, butchers, and small shops across Belgium, Estonia, Ireland, Luxembourg, the Netherlands, and Sweden reported cyberattacks on commercial refrigeration units. The attacks reportedly raised refrigerator temperatures to 50°C (122°F), causing food to spoil or melt in dozens of stores. Carrefour, Coop, Delhaize, ICA, Selver, SuperValu, and Spar were among the affected chains.\u003c/p\u003e\n\n\u003cp\u003eThe incidents resembled attacks against French grocers three weeks earlier in their early-morning timing, targeting, and temperature changes. Reports suggest Danfoss StoreView refrigeration controllers may have been involved in both waves, although no group has claimed responsibility and it is unconfirmed whether the same actor was responsible. Censys observed just over 1,000 exposed StoreView instances globally; France had fallen from 1,825 exposed systems before the October attacks to 220 at the time of analysis, with 41% appearing to use patched firmware.\u003c/p\u003e\n"},{"n":4,"title":"Michigan State cyber incident claimed by ransomware gang behind recent hospital attack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/michigan-state-university-byod-gang-cyber-incident","time":"19:54","priority":"SHOULD READ","score":82,"tldr":"Michigan State University is investigating a suspected credential-compromise incident after the BYOD ransomware gang claimed it stole data on 1.3 million current and former students. MSU says it found no evidence that its central Active Directory or other university data was compromised, but required all users to reset their passwords.","briefOverview":"\u003cp\u003eMichigan State University is investigating suspicious cyber activity reported in early October after the BYOD ransomware gang claimed it had stolen personal information belonging to 1.3 million current and former students. The gang added the university to its leak site on Sunday evening. Michigan State had not responded to follow-up questions about the gang’s claim at the time of the article.\u003c/p\u003e\n\n\u003cp\u003eThe university required everyone with an MSU NetID to reset their password and create a new password with at least 15 characters. Michigan State said its investigation indicated a possible account-credential compromise, but found no evidence that its central Active Directory environment was successfully compromised or that other university data was accessed, changed, or stolen. BYOD is a new group that emerged in September and was also linked in the article to a University of New Mexico incident that disrupted hospital operations and required ambulances to be diverted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The BYOD ransomware gang added Michigan State University to its leak site and claimed it had stolen personal information for 1.3 million current and former students.","Michigan State said it became aware of suspicious cyber activity in early October and began an investigation.","The university required all users with an MSU NetID to reset their passwords and create new passwords at least 15 characters long.","Michigan State said its investigation indicated a possible account-credential compromise but found no evidence of a successful compromise of its central Active Directory environment or theft of other university data.","BYOD recently disrupted the University of New Mexico hospital, causing ambulances to be diverted before the group reportedly apologized and provided decryption keys."],"insights":["The gang’s claim of data theft involving 1.3 million people directly conflicts with Michigan State’s stated finding that it has no evidence that other university data was accessed, altered, or stolen.","Michigan State responded to suspicious activity by requiring a campus-wide password reset and a minimum 15-character password, even though it said its central account directory was not successfully compromised.","BYOD emerged only in September but has already been linked in the article to claims involving Michigan State, Trump Mobile, and a University of New Mexico incident that disrupted hospital operations.","The University of New Mexico incident shows the potential real-world impact of these events: ambulances were diverted before BYOD allegedly supplied free decryption keys."],"referencedReports":[],"body":"\u003cp\u003eMichigan State University is investigating suspicious cyber activity reported in early October after the BYOD ransomware gang claimed it had stolen personal information belonging to 1.3 million current and former students. The gang added the university to its leak site on Sunday evening. Michigan State had not responded to follow-up questions about the gang’s claim at the time of the article.\u003c/p\u003e\n\n\u003cp\u003eThe university required everyone with an MSU NetID to reset their password and create a new password with at least 15 characters. Michigan State said its investigation indicated a possible account-credential compromise, but found no evidence that its central Active Directory environment was successfully compromised or that other university data was accessed, changed, or stolen. BYOD is a new group that emerged in September and was also linked in the article to a University of New Mexico incident that disrupted hospital operations and required ambulances to be diverted.\u003c/p\u003e\n"},{"n":1,"title":"Fintech platform Sageworks taken offline after suspected cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fintech-platform-sageworks-taken-offline-after-suspected-cyberattack/","time":"19:00","priority":"SHOULD READ","score":78,"tldr":"Abrigo took its Sageworks lending-risk platform offline after detecting irregular activity and has restored most functions, though borrower-facing features remain unavailable. The company has not confirmed whether the incident was a cyberattack or data breach.","briefOverview":"\u003cp\u003eAbrigo took its Sageworks risk-management application offline on October 30 after detecting what it described as \u0026ldquo;irregular activity\u0026rdquo; in its environment. The company said it disabled the application at approximately 11:25 a.m. ET as a precaution and continued investigating through the weekend. Abrigo has since restored most Sageworks functions, but borrower-facing capabilities remain unavailable.\u003c/p\u003e\n\n\u003cp\u003eThe outage affected Online Portal Now, Sageworks Analyst, and the Sageworks API. Sageworks is used by lenders to process loan applications, analyze borrowers’ finances, assess creditworthiness, and monitor loan portfolios, meaning it handles sensitive banking customer information. Abrigo serves more than 2,400 community banks and credit unions in the United States, and it has not said whether the incident was a breach or a technical issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Abrigo took its Sageworks application offline on October 30 after detecting irregular activity in its environment.","The outage affected Online Portal Now, Sageworks Analyst, and the Sageworks API, and continued through the weekend.","Abrigo has restored most Sageworks functionality, but borrower-facing capabilities remain unavailable.","Sageworks helps lenders process loan applications, analyze borrower finances, assess creditworthiness, and monitor loan portfolios.","Abrigo has not disclosed the nature of the incident, so it remains unclear whether the outage resulted from a breach or a technical issue."],"insights":["Because Sageworks processes loan applications and borrower financial information, the outage affects functions involving sensitive banking customer data rather than only internal business operations.","Cybersecurity researchers advised banks and credit unions using Sageworks to rotate the platform’s API keys despite Abrigo not confirming a data breach.","The incident follows an earlier unconfirmed claim by a person allegedly linked to ShinyHunters that 1.7 million Abrigo Salesforce records containing personal and internal data were taken.","Abrigo restored most functionality while keeping borrower-facing capabilities unavailable, indicating that recovery is incomplete."],"referencedReports":[],"body":"\u003cp\u003eAbrigo took its Sageworks risk-management application offline on October 30 after detecting what it described as \u0026ldquo;irregular activity\u0026rdquo; in its environment. The company said it disabled the application at approximately 11:25 a.m. ET as a precaution and continued investigating through the weekend. Abrigo has since restored most Sageworks functions, but borrower-facing capabilities remain unavailable.\u003c/p\u003e\n\n\u003cp\u003eThe outage affected Online Portal Now, Sageworks Analyst, and the Sageworks API. Sageworks is used by lenders to process loan applications, analyze borrowers’ finances, assess creditworthiness, and monitor loan portfolios, meaning it handles sensitive banking customer information. Abrigo serves more than 2,400 community banks and credit unions in the United States, and it has not said whether the incident was a breach or a technical issue.\u003c/p\u003e\n"},{"n":6,"title":"Black Hat USA 2026: Apps Leaking PII in the Clear | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/black-hat-usa-2026-apps-leaking-pii-in-the-clear-corelight","time":"20:22","priority":"MAY READ","score":20,"tldr":"Corelight is promoting its Black Hat USA 2026 presence with a focus on how applications can expose personally identifiable information in cleartext.","briefOverview":"\u003cp\u003eCorelight’s article is titled “Black Hat USA 2026: Apps Leaking PII in the Clear.” It references Black Hat USA 2026 and identifies Corelight in the title. The stated subject is applications leaking personally identifiable information in cleartext.\u003c/p\u003e\n\n\u003cp\u003eThe title highlights the exposure of personal information as the central issue. It indicates that the data is being leaked “in the clear,” meaning without the protection implied by the title’s wording. No further readable technical details, affected organizations, incident specifics, or impact information are provided in the article content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Black Hat USA 2026: Apps Leaking PII in the Clear | Corelight.\"","The article references Black Hat USA 2026.","The article concerns applications leaking personally identifiable information in cleartext.","Corelight is identified in the article title."],"insights":[],"referencedReports":[],"body":"\u003cp\u003eC     if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
