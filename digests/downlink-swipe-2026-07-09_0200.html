<script type="application/json" id="dl-articles">[{"n":1,"title":"Microsoft patches RoguePlanet Defender zero-day vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-rogueplanet-defender-zero-day-vulnerability/","time":"05:42","priority":"MUST READ","score":93,"tldr":"Microsoft has patched the RoguePlanet zero-day in Microsoft Defender, tracked as CVE-2026-50656, via a Malware Protection Engine update. The flaw could let attackers gain SYSTEM privileges on fully patched Windows 10 and 11 systems using a race condition exploit.","briefOverview":"\u003cp\u003eMicrosoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656. The flaw was disclosed after the June 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse. The researcher also shared a proof-of-concept exploit in a self-hosted Git repository, saying Microsoft had previously removed their exploit repositories from GitHub and GitLab.\u003c/p\u003e\n\n\u003cp\u003eNightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to open a command prompt with SYSTEM privileges. The researcher described the exploit as a race condition, with success varying by machine, and said the proof of concept works whether real-time protection is on or off. Microsoft confirmed on June 16 that it was working on a patch, but the article says the company had not acknowledged Nightmare Eclipse as the discoverer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft addressed the vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008, which powers Microsoft security solutions and services. Microsoft said the update fixes the issue identified as CVE-2026-50656 and pointed users to its FAQ for checking whether the new version is installed. The article also notes that Nightmare Eclipse has disclosed several other Windows zero-days in recent months, including issues affecting Microsoft Defender, BitLocker, and other Windows components.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656.","The vulnerability was disclosed by a security researcher using the handle Nightmare Eclipse, who also shared a proof-of-concept exploit in a self-hosted Git repository.","Nightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to spawn a command prompt with SYSTEM privileges via a Microsoft Defender race condition.","Microsoft addressed the RoguePlanet vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008.","Nightmare Eclipse has disclosed multiple other Windows zero-day exploits in recent months, including flaws affecting Microsoft Defender, BitLocker, and other Windows components."],"insights":["The fix for RoguePlanet was delivered through the Microsoft Malware Protection Engine rather than the regular Patch Tuesday Windows update process, so checking the engine version is the relevant way to confirm remediation.","The proof-of-concept exploit was reported to work whether Microsoft Defender real-time protection was enabled or disabled, according to Nightmare Eclipse.","The exploit’s reliability varied by machine, with Nightmare Eclipse saying it reached 100% success on some systems while struggling on others.","Microsoft confirmed it was working on a patch before releasing the engine update, but the article says it had not acknowledged Nightmare Eclipse as the discoverer of the vulnerability.","The RoguePlanet disclosure is part of a broader pattern in which Nightmare Eclipse has publicly released multiple Windows zero-days during a dispute with Microsoft over bug bounty and disclosure practices."],"referencedReports":[{"title":"CVE-2026-50656","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-50656","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the RoguePlanet Defender zero-day and the Malware Protection Engine update that addresses it.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656. The flaw was disclosed after the June 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse. The researcher also shared a proof-of-concept exploit in a self-hosted Git repository, saying Microsoft had previously removed their exploit repositories from GitHub and GitLab.\u003c/p\u003e\n\n\u003cp\u003eNightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to open a command prompt with SYSTEM privileges. The researcher described the exploit as a race condition, with success varying by machine, and said the proof of concept works whether real-time protection is on or off. Microsoft confirmed on June 16 that it was working on a patch, but the article says the company had not acknowledged Nightmare Eclipse as the discoverer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft addressed the vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008, which powers Microsoft security solutions and services. Microsoft said the update fixes the issue identified as CVE-2026-50656 and pointed users to its FAQ for checking whether the new version is installed. The article also notes that Nightmare Eclipse has disclosed several other Windows zero-days in recent months, including issues affecting Microsoft Defender, BitLocker, and other Windows components.\u003c/p\u003e\n"},{"n":3,"title":"Fake 7-Zip Installers Turn Devices Into Residential Proxy Nodes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fake-7-zip-installers-turn-devices-into.html","time":"04:01","priority":"MUST READ","score":92,"tldr":"Researchers say a China-based actor dubbed Lurking Lizard has used fake 7-Zip installers, lookalike domains, and fake proxy-service brands to covertly turn victims’ devices into residential proxy nodes. The operation appears to be a full proxy-business ecosystem spanning victim recruitment, infrastructure, marketing, and monetization.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of a threat actor dubbed Lurking Lizard that has operated an end-to-end malicious residential proxy business using more than 230 lookalike domains. Infoblox said the activity dates back to at least August 2022. One campaign observed earlier this year used a trojanized 7-Zip installer hosted on 7zip[.]com to covertly recruit compromised devices as proxy nodes.\u003c/p\u003e\n\n\u003cp\u003eLurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has also run fake “independent” review sites to drive traffic to its scam storefronts. WHOIS analysis and infrastructure fingerprinting suggest the actor is China-based, and the scheme also used popular VPNs and services like HeroSMS as decoys to distribute the proxy malware. The actor has used drop-catching by acquiring expired domains to inherit their history and legitimacy, and has also benefited from incorrectly referenced domain names such as 7zip[.]com instead of 7-zip[.]org.\u003c/p\u003e\n\n\u003cp\u003eInfoblox said the operation spans victim acquisition, proxy infrastructure, marketing, and monetization rather than a single malware campaign. The article says victims’ devices can be recruited through trojanized installers, mobile applications, and other lures, and the resulting proxy pool can then be sold through lookalike proxy service brands. Google separately warned in relation to residential proxy networks that unsuspecting device owners face risks because their home IP addresses can be used for unauthorized activities, potentially causing their legitimate traffic to be flagged or blocked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox researchers disclosed that a threat actor dubbed Lurking Lizard has operated a malicious residential proxy business using more than 230 lookalike domains since at least August 2022.","One campaign used a trojanized 7-Zip installer hosted on the lookalike domain 7zip[.]com to covertly recruit compromised devices as proxy nodes.","Lurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has run fake independent review sites to direct traffic to its scam storefronts.","WHOIS analysis and infrastructure fingerprinting suggest that Lurking Lizard is a China-based actor, and the campaign has also used popular VPNs and services like HeroSMS as decoys to distribute proxy malware.","Infoblox said the operation spans victim acquisition, proxy infrastructure, marketing, and monetization, turning recruited devices into a pool that can be sold through lookalike proxy service brands."],"insights":["Lurking Lizard’s use of expired or commonly mistyped domains shows that even domains with prior reputation or familiar-looking names can become delivery points for malicious installers.","The campaign did not rely only on fake software downloads; it also used fake independent review sites, meaning victims could be steered toward malicious services through content that appears to be third-party advice.","The overlap of 773,087 SmartProxy-linked IP addresses with a public IPIDEA dataset suggests infrastructure sharing or resale relationships may complicate efforts to separate legitimate proxy services from abused residential proxy networks.","The WireVPN Android app’s more than 1 million downloads on Google Play shows that mobile app distribution may be part of the same broader victim-acquisition ecosystem, even though the article says it is unclear whether the mobile apps contain the same proxy functionality.","The article highlights that owners of recruited devices may face real-world consequences even if they are not directly targeted, because their home IP addresses can be used for unauthorized activity and later flagged or blocked by service providers."],"referencedReports":[{"title":"Fake Installers, Fake Reviews, Fake Services, Real Proxies, Real Victims","url":"https://www.infoblox.com/blog/threat-intelligence/fake-installers-fake-reviews-fake-services-real-proxies-real-victims/","publisher":"Infoblox","context":"The article says Infoblox disclosed details of the Lurking Lizard threat actor and its malicious residential proxy business.","category":"","primary":false},{"title":"Fake 7-Zip Downloads Are Turning Home PCs Into Proxy Nodes","url":"https://www.malwarebytes.com/blog/threat-intel/2026/02/fake-7-zip-downloads-are-turning-home-pcs-into-proxy-nodes","publisher":"Malwarebytes","context":"The article cites Malwarebytes as observing a campaign involving a trojanized 7-Zip installer hosted on 7zip[.]com.","category":"","primary":false},{"title":"We Tested Smartproxy.org IP Pool: Findings","url":"https://proxyway.com/research/we-tested-smartproxyorg-ip-pool-findings","publisher":"Proxyway","context":"The article references Proxyway findings that 773,087 SmartProxy-linked IP addresses were also present in a public IPIDEA IP dataset.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of a threat actor dubbed Lurking Lizard that has operated an end-to-end malicious residential proxy business using more than 230 lookalike domains. Infoblox said the activity dates back to at least August 2022. One campaign observed earlier this year used a trojanized 7-Zip installer hosted on 7zip[.]com to covertly recruit compromised devices as proxy nodes.\u003c/p\u003e\n\n\u003cp\u003eLurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has also run fake “independent” review sites to drive traffic to its scam storefronts. WHOIS analysis and infrastructure fingerprinting suggest the actor is China-based, and the scheme also used popular VPNs and services like HeroSMS as decoys to distribute the proxy malware. The actor has used drop-catching by acquiring expired domains to inherit their history and legitimacy, and has also benefited from incorrectly referenced domain names such as 7zip[.]com instead of 7-zip[.]org.\u003c/p\u003e\n\n\u003cp\u003eInfoblox said the operation spans victim acquisition, proxy infrastructure, marketing, and monetization rather than a single malware campaign. The article says victims’ devices can be recruited through trojanized installers, mobile applications, and other lures, and the resulting proxy pool can then be sold through lookalike proxy service brands. Google separately warned in relation to residential proxy networks that unsuspecting device owners face risks because their home IP addresses can be used for unauthorized activities, potentially causing their legitimate traffic to be flagged or blocked.\u003c/p\u003e\n"},{"n":4,"title":"GhostApproval Symlink Flaws Could Let Malicious Repos Run Code in AI Coding Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ghostapproval-symlink-flaws-could-let.html","time":"04:27","priority":"SHOULD READ","score":84,"tldr":"Wiz researchers found that several AI coding assistants can be tricked by malicious repositories into writing through symlinks to sensitive files like SSH keys or shell startup scripts, while approval prompts show only harmless-looking paths. Some vendors have patched the issue, but users should update tools and avoid running agents on untrusted repos without sandboxing or limiting file access.","briefOverview":"\u003cp\u003eResearchers at Wiz found that a flaw in six AI coding assistants could let a malicious code project take control of a developer’s computer. The affected tools are Amazon Q Developer, Anthropic’s Claude Code, Augment, Cursor, Google Antigravity, and Windsurf. Wiz calls the pattern GhostApproval and said the most exposed tools are those that change files before the developer can review the action.\u003c/p\u003e\n\n\u003cp\u003eThe attack abuses symbolic links, which are files that quietly point to other files elsewhere on disk. Wiz demonstrated a malicious repository where a file named project_settings.json actually pointed to ~/.ssh/authorized_keys, so an assistant asked to edit the harmless-looking file wrote an attacker’s SSH key into the login file instead. A second version wrote to ~/.zshrc, which can execute commands the next time a terminal opens, and Wiz said there is no sign the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main failure is that approval boxes can show the harmless path rather than the real destination, leaving the human in the loop with misleading information. Amazon Q Developer, Cursor, and Google Antigravity have shipped fixes, Augment and Windsurf have acknowledged the issue without fixes, and Anthropic disputes that Claude Code’s behavior is a bug. Wiz advised tool makers to resolve symlinks and show the real destination before approval, flag writes outside the project folder, and avoid touching disk until the user has approved.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wiz researchers identified a GhostApproval flaw in six AI coding assistants: Amazon Q Developer, Anthropic's Claude Code, Augment, Cursor, Google Antigravity, and Windsurf.","The attack uses a malicious repository with a symbolic link, such as a project_settings.json file that actually points to ~/.ssh/authorized_keys, causing an assistant-approved write to modify a sensitive file instead.","Wiz found that approval dialogs can show the harmless-looking symlink path rather than the real file being modified, creating what it calls an informed-consent bypass.","As of publication, Amazon Q Developer, Cursor, and Google Antigravity had shipped fixes, Augment and Windsurf had acknowledged the issue without fixes, and Anthropic disputed that Claude Code behavior was a bug.","Wiz recommended that tool makers resolve symlinks and show the true destination before asking for approval, flag writes outside the project folder, and avoid touching disk before the user approves."],"insights":["The most dangerous implementations are not only those with misleading approval prompts, but also tools like Windsurf and Augment that may write to disk before approval or without showing a dialog at all.","Claude Code reportedly detected the real symlink target in its own reasoning, but the developer-facing approval box still showed only the harmless-looking filename, highlighting a gap between what the agent knows and what it tells the user.","Files outside a project, such as ~/.zshrc and ~/.ssh/authorized_keys, will not appear in git status, so checking timestamps after using an unfamiliar repository is a practical way to spot possible unwanted changes.","Two independent research efforts, GhostApproval and SymJack, found the same symlink-and-approval pattern across multiple coding agents, indicating a shared design weakness rather than an isolated vendor mistake.","The article connects GhostApproval to broader repo-based AI agent risks, including Amazon Q config autoloading and the Miasma worm planting AI-agent config files in Microsoft Azure repositories."],"referencedReports":[{"title":"GhostApproval: A Trust Boundary Gap in AI Coding Assistants","url":"https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants","publisher":"Wiz","context":"The article is based on Wiz research describing the GhostApproval symlink-and-approval flaw in six AI coding assistants.","category":"","primary":false},{"title":"CVE-2026-50549","url":"https://github.com/cursor/cursor/security/advisories/GHSA-3v8f-48vw-3mjx","publisher":"Cursor","context":"The article cites Cursor's security advisory for the fixed symlink bug in Cursor v3.0.","category":"","primary":false},{"title":"SymJack","url":"https://adversa.ai/blog/the-approval-prompt-is-lying-to-you-symlink-rce-in-five-ai-coding-agents-claude-code-cursor-antigravity-copilot-grok-build/","publisher":"Adversa AI","context":"The article references Adversa AI's SymJack research as an independent finding of the same symlink-and-approval pattern against coding agents.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Wiz found that a flaw in six AI coding assistants could let a malicious code project take control of a developer’s computer. The affected tools are Amazon Q Developer, Anthropic’s Claude Code, Augment, Cursor, Google Antigravity, and Windsurf. Wiz calls the pattern GhostApproval and said the most exposed tools are those that change files before the developer can review the action.\u003c/p\u003e\n\n\u003cp\u003eThe attack abuses symbolic links, which are files that quietly point to other files elsewhere on disk. Wiz demonstrated a malicious repository where a file named project_settings.json actually pointed to ~/.ssh/authorized_keys, so an assistant asked to edit the harmless-looking file wrote an attacker’s SSH key into the login file instead. A second version wrote to ~/.zshrc, which can execute commands the next time a terminal opens, and Wiz said there is no sign the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main failure is that approval boxes can show the harmless path rather than the real destination, leaving the human in the loop with misleading information. Amazon Q Developer, Cursor, and Google Antigravity have shipped fixes, Augment and Windsurf have acknowledged the issue without fixes, and Anthropic disputes that Claude Code’s behavior is a bug. Wiz advised tool makers to resolve symlinks and show the real destination before approval, flag writes outside the project folder, and avoid touching disk until the user has approved.\u003c/p\u003e\n"},{"n":2,"title":"Top AI Agents Built to Catch Malicious Code Can Be Tricked Into Running It","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/friendly-fire-ai-agents-built-to-catch.html","time":"05:15","priority":"SHOULD READ","score":82,"tldr":"AI Now researchers showed that autonomous AI coding agents like Claude Code and OpenAI Codex can be tricked by instructions in a repository README into running malicious scripts while reviewing untrusted code. The key takeaway is that agents with command execution should not be used on untrusted projects without strict human approval and isolation, because model safety checks are not reliable containment.","briefOverview":"\u003cp\u003eAI Now Institute researchers published a proof-of-concept called “Friendly Fire” showing that AI coding agents can be tricked into running attacker-controlled code while reviewing untrusted open-source projects. The attack worked against Anthropic’s Claude Code and OpenAI’s Codex when their autonomous command-approval modes were enabled. The article says there is no patch to wait for because AI Now argues the weakness is in the workflow design rather than a specific vulnerable version range.\u003c/p\u003e\n\n\u003cp\u003eThe demo used the Python library geopy and added a README note suggesting that a script named security.sh be run as a routine security check before opening a pull request. When the agent was asked to perform security testing, it read the README, treated the script as part of the task, and ran it without a warning or approval box. The script quietly launched a hidden binary carrying the real payload, which the researchers disguised as the compiled build of a harmless Go file.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the exposure is bounded to cases where a command-capable agent in autonomous mode reviews code the user does not control. It also notes that the public GitHub code has the payload stripped, there is no reported exploitation in the wild, and the proof-of-concept stops at initial execution without privilege escalation or lateral movement. The researchers recommend not giving untrusted code to an agent that can run commands and access keys, secrets, or the host, and they warn that sandboxes and approval prompts are only partial or workflow-limiting safeguards.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI Now Institute researchers published a proof-of-concept called Friendly Fire showing that Anthropic’s Claude Code and OpenAI’s Codex can be tricked into running attacker-controlled code when autonomous command-approval modes are enabled.","The tested setups included Claude Code CLI versions 2.1.116, 2.1.196, 2.1.198, and 2.1.199 on Claude Sonnet 4.6, Sonnet 5, or Opus 4.8, and OpenAI Codex CLI 0.142.4 on GPT-5.5.","The demo placed extra files in the geopy Python library, used a README note to suggest running security.sh, and had that script quietly launch a hidden binary carrying the real payload.","The researchers said there is no patch to wait for because the weakness is in the workflow design, where agents cannot reliably separate untrusted repository text from instructions they should follow.","The article states there is no reported exploitation in the wild, the public GitHub code has the payload stripped, and the proof-of-concept stops at initial code execution without privilege escalation or lateral movement."],"insights":["The attack avoids earlier defenses focused on machine-configuration files by hiding the instruction in README.md, a normal repository file that does not trigger Claude Code’s folder trust warning.","The same payload worked unchanged across two vendors and four models, supporting AI Now’s view that the problem is not tied to a single model version or product build.","In some runs, newer models noticed that the binary did not match its supposed source file but still executed it, showing that detecting a suspicious inconsistency did not reliably stop the unsafe action.","The article’s most actionable warning sign is an agent executing a binary or script solely because a README or documentation file told it to run it.","The suggested safer workflows, such as prompting before every command or adding a sandbox, reduce risk but either undermine automation or remain incomplete because sandbox escapes have existed."],"referencedReports":[{"title":"Friendly Fire Exploit Brief","url":"https://ainowinstitute.org/publications/friendly-fire-exploit-brief","publisher":"AI Now Institute","context":"The article is based on AI Now Institute’s proof-of-concept showing that Claude Code and OpenAI Codex can be tricked into running malicious code during autonomous security review workflows.","category":"","primary":false},{"title":"TrustFall","url":"https://adversa.ai/blog/trustfall-coding-agent-security-flaw-rce-claude-cursor-gemini-cli-copilot/","publisher":"Adversa","context":"The article cites Adversa’s TrustFall work as earlier research showing booby-trapped repositories leading to code execution across multiple AI coding agents.","category":"","primary":false},{"title":"CVE-2026-39861","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-39861","publisher":"National Vulnerability Database","context":"The article references this NVD entry as an example of a Claude Code sandbox escape bug involving a symlink flaw.","category":"","primary":false}],"body":"\u003cp\u003eAI Now Institute researchers published a proof-of-concept called “Friendly Fire” showing that AI coding agents can be tricked into running attacker-controlled code while reviewing untrusted open-source projects. The attack worked against Anthropic’s Claude Code and OpenAI’s Codex when their autonomous command-approval modes were enabled. The article says there is no patch to wait for because AI Now argues the weakness is in the workflow design rather than a specific vulnerable version range.\u003c/p\u003e\n\n\u003cp\u003eThe demo used the Python library geopy and added a README note suggesting that a script named security.sh be run as a routine security check before opening a pull request. When the agent was asked to perform security testing, it read the README, treated the script as part of the task, and ran it without a warning or approval box. The script quietly launched a hidden binary carrying the real payload, which the researchers disguised as the compiled build of a harmless Go file.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the exposure is bounded to cases where a command-capable agent in autonomous mode reviews code the user does not control. It also notes that the public GitHub code has the payload stripped, there is no reported exploitation in the wild, and the proof-of-concept stops at initial execution without privilege escalation or lateral movement. The researchers recommend not giving untrusted code to an agent that can run commands and access keys, secrets, or the host, and they warn that sandboxes and approval prompts are only partial or workflow-limiting safeguards.\u003c/p\u003e\n"}]</script>

  border-color:rgba(127,127,127,.4)}
#dl-layout-cta[hidden]{display:none}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  try{
    if(localStorage.getItem("downlink.layout")) return;
    if(localStorage.getItem("downlink.layout.dismissed")) return;
  }catch(e){}
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  box.hidden=false;
  box.querySelector("[data-dl-try]").addEventListener("click",function(){
    if(window.__dlLayout) window.__dlLayout.go("v2");
  });
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} box.hidden=true;
  });
})();
</script></body>
</html>
