<script type="application/json" id="dl-articles">[{"n":2,"title":"Able2Shell: Frequently asked questions for reported N-able N-central zero-day vulnerabilities","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/able2shell-frequently-asked-questions-for-reported-n-able-n-central-zero-day-vulnerabilities","time":"05:55","priority":"MUST READ","score":91,"tldr":"N-able released N-central 2026.4 Hotfix 2 to address seven critical CVEs linked to the publicly disclosed Able2Shell exploit set, including an alleged unauthenticated chain that can execute commands. Exploitation attempts have been observed against honeypots, but no confirmed customer compromise had been reported as of November 10.","briefOverview":"\u003cp\u003eA researcher using the GitHub account Oracle-Security publicly disclosed Able2Shell on November 9, describing 33 alleged vulnerabilities in N-able N-central and providing proof-of-concept code. The findings include four reported exploit chains, with one XXE-based chain described as requiring no credentials and allowing commands to run as the nable account. Two reported chains can reach root-level command execution. N-able characterized the disclosure as involving critical vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eOn November 10, N-able released N-central 2026.4 Hotfix 2, build 2026.4.1.26, to address seven CVEs with CVSSv4 scores from 8.3 to 9.3. The patched issues include XML external entity flaws, server-side request forgery, OGNL injection, path traversal leading to remote code execution, local privilege escalation, and stored cross-site scripting. N-able has not mapped the seven CVEs to all 33 findings, and it said a further hotfix would provide additional security updates. Hosted N-central servers were upgraded globally, while on-premises customers must update their own servers and are advised to keep them offline until they do.\u003c/p\u003e\n\n\u003cp\u003eN-able reported scanning activity associated with the published proof-of-concept code, and Beazley Security Labs and Previdian reported exploitation attempts against honeypot and decoy N-central systems. As of November 10, no confirmed compromise of a customer server had been reported. Organizations are advised to review login and authentication activity from November 8 onward and watch for unusual remote-access sessions, newly deployed scripts, and unauthorized administrator accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A researcher using the GitHub account Oracle-Security publicly disclosed Able2Shell on November 9, 2026, describing 33 alleged N-able N-central vulnerabilities and providing proof-of-concept code.","N-able released N-central 2026.4 Hotfix 2, build 2026.4.1.26, on November 10 to fix seven CVEs with CVSSv4 scores ranging from 8.3 to 9.3.","The researcher described a credential-free XXE-based chain that can run commands as the nable account, while two other reported chains can reach root-level command execution.","N-able upgraded all hosted N-central servers globally, while on-premises customers must upgrade their own servers and are advised to keep them offline until updated.","Security researchers observed scanning and exploitation attempts against N-central honeypots and decoy environments, but no confirmed compromise of a customer server had been reported as of November 10."],"insights":["The seven published CVEs are not a complete accounting of the 33 reported findings, because N-able has not said which findings each CVE covers and has planned an additional hotfix.","The reported MMS3 attack chains require an administrator to view poisoned patch details before the planted code runs, unlike the reported XXE chain, which the researcher describes as requiring no credentials.","On-premises customers are advised to keep N-central servers offline until they can apply the update, while hosted N-central servers were upgraded by N-able.","Customers must upgrade Agents before Probes because an upgraded Probe cannot communicate with Agents that have not yet been upgraded.","Hotfix 2 removes legacy mobile device management and temporarily disables N-central's built-in remote-control feature, although Take Control remains available."],"referencedReports":[{"title":"Able2Shell write-up","url":"https://github.com/Oracle-Security/CVEs/blob/main/0-Days/N-Central%20N-Able/README.md","publisher":"oracle-security","context":"The article relies on this public write-up and its proof-of-concept code describing 33 alleged N-central vulnerabilities and four exploit chains.","category":"research","primary":true},{"title":"Emerging Threat: Critical Vulnerabilities in N-able N-central","url":"https://labs.beazley.security/advisories/BSL-A1242","publisher":"beazley-security-labs","context":"The article cites this advisory for watchTowr-reported exploitation attempts against N-central honeypots and the absence of a reported confirmed customer compromise.","category":"advisory","primary":false},{"title":"N-able N-central critical vulnerabilities, what we know so far","url":"https://blog.previdian.com/n-able-n-central-critical-vulnerabilities-what-we-know-so-far/","publisher":"previdian","context":"The article cites Previdian's analysis of activity observed in its N-central decoy environment, including XXE and sensitive-file access attempts.","category":"research","primary":false},{"title":"N-able Disables Cloud Services Following Disclosure of \"Able2Shell\" Exploit Chains","url":"https://www.huntress.com/blog/n-able-disables-cloud-services-following-disclosure-of-able2shell-exploit-chains","publisher":"huntress","context":"The article cites Huntress for N-able's statement that no customer exploitation evidence had been found and for Huntress's observations in partner environments.","category":"news","primary":false}],"body":"\u003cp\u003eA researcher using the GitHub account Oracle-Security publicly disclosed Able2Shell on November 9, describing 33 alleged vulnerabilities in N-able N-central and providing proof-of-concept code. The findings include four reported exploit chains, with one XXE-based chain described as requiring no credentials and allowing commands to run as the nable account. Two reported chains can reach root-level command execution. N-able characterized the disclosure as involving critical vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eOn November 10, N-able released N-central 2026.4 Hotfix 2, build 2026.4.1.26, to address seven CVEs with CVSSv4 scores from 8.3 to 9.3. The patched issues include XML external entity flaws, server-side request forgery, OGNL injection, path traversal leading to remote code execution, local privilege escalation, and stored cross-site scripting. N-able has not mapped the seven CVEs to all 33 findings, and it said a further hotfix would provide additional security updates. Hosted N-central servers were upgraded globally, while on-premises customers must update their own servers and are advised to keep them offline until they do.\u003c/p\u003e\n\n\u003cp\u003eN-able reported scanning activity associated with the published proof-of-concept code, and Beazley Security Labs and Previdian reported exploitation attempts against honeypot and decoy N-central systems. As of November 10, no confirmed compromise of a customer server had been reported. Organizations are advised to review login and authentication activity from November 8 onward and watch for unusual remote-access sessions, newly deployed scripts, and unauthorized administrator accounts.\u003c/p\u003e\n"},{"n":1,"title":"Cisco BroadWorks and Openwave Flaws Actively Exploited Despite Available Patches","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisco-broadworks-and-openwave-flaws.html","time":"06:04","priority":"SHOULD READ","score":88,"tldr":"CISA added actively exploited flaws in Cisco BroadWorks and Openwave Messaging Webtop Media Transcoder to its Known Exploited Vulnerabilities catalog, despite patches having been available since August and October 2026. Organizations should apply the updates promptly, with U.S. federal agencies directed to remediate by November 24, 2026.","briefOverview":"\u003cp\u003eCISA added two flaws affecting Cisco BroadWorks and Openwave Messaging Webtop Media Transcoder to its Known Exploited Vulnerabilities catalog, citing evidence of active exploitation. The issues are CVE-2026-20320 in Cisco BroadWorks and CVE-2026-111793 in Openwave software. CISA’s action indicates that the flaws are being used in real-world attacks, although the article provides no details about the attacks or responsible group.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-20320 is an XML parser issue in Cisco BroadWorks with a CVSS score of 7.5. It could allow an unauthenticated remote attacker to read sensitive configuration information with the privileges of the Cisco BroadWorks user, and Cisco fixed it in August 2026. CVE-2026-111793, rated 4.3, could allow an authenticated Openwave user who bypasses the Webmail experience to process and convert unintended document types; it was fixed in October 2026. Federal Civilian Executive Branch agencies are recommended to apply the patches by November 24, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-20320 in Cisco BroadWorks and CVE-2026-111793 in Openwave Messaging Webtop Media Transcoder to its Known Exploited Vulnerabilities catalog after evidence of active exploitation.","CVE-2026-20320 is an XML parser flaw in Cisco BroadWorks that could allow an unauthenticated remote attacker to read sensitive configuration information with Cisco BroadWorks user privileges.","CVE-2026-111793 could allow an authenticated Openwave Messaging Webtop Media Transcoder user to process and convert unintended document types outside the Webmail experience.","Cisco fixed the BroadWorks issue in August 2026, while Openwave fixed its issue in October 2026.","CISA recommended that Federal Civilian Executive Branch agencies apply the patches by November 24, 2026."],"insights":["The two newly listed issues have different access requirements: the Cisco BroadWorks flaw can be used remotely without logging in, while the Openwave flaw requires an authenticated user.","CISA’s active-exploitation designation covers a Cisco flaw rated 7.5 and an Openwave flaw rated 4.3, showing that exploitation activity is not limited to the highest-scoring issues.","The affected products had patches available before CISA’s listing—Cisco’s fix was released in August 2026 and Openwave’s in October 2026—making prompt patching the primary action identified in the article.","Public reporting does not yet describe the real-world attack methods or identify a responsible threat group, and Cisco’s own advisory does not state that its flaw is being maliciously used."],"referencedReports":[{"title":"CISA Adds Six Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's alert as the source for adding the Cisco BroadWorks and Openwave flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Cisco BroadWorks Open Client Interface XML External Entity Reference Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-bworks-xxe-uwUd7CEt","publisher":"cisco","context":"The article links Cisco's security advisory for CVE-2026-20320, the Cisco BroadWorks XML parser flaw.","category":"advisory","primary":true},{"title":"CAN-2026-2032674","url":"https://github.com/GISOpenwave/security-advisories-public/blob/main/CAN-2026-2032674.md","publisher":"openwave","context":"The article links Openwave's security advisory for CVE-2026-111793 affecting Messaging Webtop Media Transcoder.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added two flaws affecting Cisco BroadWorks and Openwave Messaging Webtop Media Transcoder to its Known Exploited Vulnerabilities catalog, citing evidence of active exploitation. The issues are CVE-2026-20320 in Cisco BroadWorks and CVE-2026-111793 in Openwave software. CISA’s action indicates that the flaws are being used in real-world attacks, although the article provides no details about the attacks or responsible group.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-20320 is an XML parser issue in Cisco BroadWorks with a CVSS score of 7.5. It could allow an unauthenticated remote attacker to read sensitive configuration information with the privileges of the Cisco BroadWorks user, and Cisco fixed it in August 2026. CVE-2026-111793, rated 4.3, could allow an authenticated Openwave user who bypasses the Webmail experience to process and convert unintended document types; it was fixed in October 2026. Federal Civilian Executive Branch agencies are recommended to apply the patches by November 24, 2026.\u003c/p\u003e\n"},{"n":3,"title":"GitHub Package Firewall vs. StepSecurity Secure Registry: Protection beyond npm","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/github-package-firewall-vs-stepsecurity-secure-registry-protection-beyond-npm","time":"03:34","priority":"MAY READ","score":45,"tldr":"StepSecurity positions Secure Registry as a broader alternative to GitHub’s npm-only Package Firewall, offering multi-ecosystem package controls, installation attribution, rapid malicious-package blocking, cooldown handling, and enforcement across developer machines and CI.","briefOverview":"\u003cp\u003eGitHub has launched Package Firewall in public preview for GitHub Enterprise Cloud customers. The feature checks npm packages against an enterprise policy before they install, addressing supply-chain attacks that can run when a package is installed. The article compares this npm-focused feature with StepSecurity Secure Registry.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says Secure Registry supports npm, PyPI, Maven, NuGet, Go, RubyGems, Cargo, and Packagist in beta, and logs package requests with optional attribution to a developer machine or GitHub Actions run. Its controls include blocking compromised packages, typosquatting protection for npm, custom block lists, and a cooldown for newly released versions. The article also says Dev Machine Guard and Harden-Runner can identify and enforce Secure Registry use on developer machines and CI runners, helping prevent package installs from bypassing the registry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub’s Package Firewall is in public preview and checks npm packages against an enterprise policy before installation for GitHub Enterprise Cloud customers.","StepSecurity Secure Registry supports npm, PyPI, Maven, NuGet, Go, RubyGems, Cargo, and Packagist in beta.","Secure Registry logs package requests and can attribute them to a GitHub Actions run or a developer machine when source attribution is configured.","StepSecurity states that its threat intelligence team and 24×7 SOC are committed by SLA to block a malicious package version within one hour of release.","StepSecurity says its Dev Machine Guard and Harden-Runner can identify and enforce Secure Registry use on developer machines and CI runners."],"insights":["A package cooldown can avoid breaking ordinary builds by hiding held-back versions from package metadata and redirecting the “latest” label to the newest allowed version; only requests for an exact held-back version are blocked.","Logging package requests with source attribution can turn a later malicious-package discovery into a targeted response by identifying the specific developer machine or GitHub Actions run that installed it.","Package-policy protection depends on actual registry adoption, so visibility into machines and CI jobs that still contact public registries is necessary to identify bypasses.","The article highlights that malicious packages may steal credentials immediately upon installation, making pre-install package checks more consequential than detection after a package has already run."],"referencedReports":[],"body":"\u003cp\u003eGitHub has launched Package Firewall in public preview for GitHub Enterprise Cloud customers. The feature checks npm packages against an enterprise policy before they install, addressing supply-chain attacks that can run when a package is installed. The article compares this npm-focused feature with StepSecurity Secure Registry.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says Secure Registry supports npm, PyPI, Maven, NuGet, Go, RubyGems, Cargo, and Packagist in beta, and logs package requests with optional attribution to a developer machine or GitHub Actions run. Its controls include blocking compromised packages, typosquatting protection for npm, custom block lists, and a cooldown for newly released versions. The article also says Dev Machine Guard and Harden-Runner can identify and enforce Secure Registry use on developer machines and CI runners, helping prevent package installs from bypassing the registry.\u003c/p\u003e\n"}]</script>
