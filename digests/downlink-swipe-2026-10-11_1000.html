<script type="application/json" id="dl-articles">[{"n":1,"title":"The DKIM Passed. Nobody Spoofed Anything.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/dkim-pass-dmarc-fail-authenticated-submission-partner-tenant-forward","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email sent through a compromised legitimate mailbox passed SPF, DKIM, and ARC after being auto-forwarded through a partner’s Microsoft 365 tenant and re-signed by the recipient’s Google Workspace group. A DKIM pass—especially on the recipient’s own key—does not prove a message is trustworthy; organizations should scrutinize forwarded mail, group posting policies, and misaligned header From domains.","briefOverview":"\u003cp\u003eA phishing email originated from a compromised real mailbox at a Japanese small business after an attacker authenticated to its Postfix server with valid SMTP credentials. The sender used a display-name impersonation of a communications platform, a subject line the vendor genuinely uses, and a two-word body—“Fix below”—with one link. The message was first sent to a partner organization’s Microsoft 365 tenant, which had already classified it as spam with an SCL:9 score.\u003c/p\u003e\n\n\u003cp\u003eThe partner tenant automatically forwarded the email to a European cyber-insurance provider’s Google Workspace administrative group, despite the upstream spam classification not being carried forward. The Google group redistributed and re-signed the message, so final delivery to the chief revenue officer showed DKIM and SPF passes tied to the recipient organization’s own infrastructure, along with six valid ARC seals, while DMARC failed for the visible From domain. The article emphasizes that a passing DKIM result can show only that a recipient-side system imported and signed a message, not that the visible sender or message is trustworthy; it recommends examining partner auto-forwards, group posting policies, and cases where the visible From domain is not owned by anyone in the delivery path.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The phishing message originated through authenticated SMTP submission to a Japanese small-business Postfix server using valid credentials for a real mailbox.","A partner organization’s Microsoft 365 tenant automatically forwarded the message to the European cyber-insurance provider’s Google Workspace administrative group, despite Microsoft having assigned it an SCL:9 spam score.","The recipient’s Google group redistributed and re-signed the message, causing delivery authentication to show DKIM and SPF passes on the recipient’s own domain while DMARC failed for the visible From domain.","The email body consisted of “Fix below” and a single redirector link that led to a numeric-prefixed Azure Front Door host with an independent malicious scanner verdict.","The article recommends reviewing which domain supplied a passing DKIM signature, investigating header From domains that no organization in the delivery path owns, and auditing inbound partner auto-forwards and group posting policies."],"insights":["A valid DKIM signature from the recipient organization’s own Google Workspace key can indicate that a group imported and redistributed a message, rather than proving that the visible sender is legitimate.","The partner tenant’s SCL:9 spam verdict did not protect the final recipient because the automatic forwarding process relayed the email without carrying Microsoft’s spam judgment to the next organization.","ARC seals accurately preserved each provider’s observed authentication results, but the six valid seals also carried the authentication of a compromised legitimate mailbox through the delivery chain.","The DMARC failure was a meaningful warning because the visible From domain was not owned by any organization in the enumerated delivery path, while the identities that passed authentication belonged to recipient-side or partner infrastructure.","A two-word lure and a single link were sufficient to appear credible after the message reached an administrative distribution list through trusted organizational email plumbing."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s statistics on credentials, phishing as initial access, and the human element in breaches.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the report in discussing the long-observed cost and prevalence of credential-related crime.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA’s guidance when recommending review of partner auto-forwards and group posting policies.","category":"guide","primary":false}],"body":"\u003cp\u003eA phishing email originated from a compromised real mailbox at a Japanese small business after an attacker authenticated to its Postfix server with valid SMTP credentials. The sender used a display-name impersonation of a communications platform, a subject line the vendor genuinely uses, and a two-word body—“Fix below”—with one link. The message was first sent to a partner organization’s Microsoft 365 tenant, which had already classified it as spam with an SCL:9 score.\u003c/p\u003e\n\n\u003cp\u003eThe partner tenant automatically forwarded the email to a European cyber-insurance provider’s Google Workspace administrative group, despite the upstream spam classification not being carried forward. The Google group redistributed and re-signed the message, so final delivery to the chief revenue officer showed DKIM and SPF passes tied to the recipient organization’s own infrastructure, along with six valid ARC seals, while DMARC failed for the visible From domain. The article emphasizes that a passing DKIM result can show only that a recipient-side system imported and signed a message, not that the visible sender or message is trustworthy; it recommends examining partner auto-forwards, group posting policies, and cases where the visible From domain is not owned by anyone in the delivery path.\u003c/p\u003e\n"}]</script>
