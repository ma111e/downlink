<script type="application/json" id="dl-articles">[{"n":3,"title":"North Korea-Linked npm Packages Mimic Rollup Polyfills to Steal Developer Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/north-korea-linked-npm-packages-mimic.html","time":"16:07","priority":"MUST READ","score":92,"tldr":"North Korea-linked actors published malicious npm packages that impersonate Rollup polyfill tooling to infect developer machines, enable remote access, and steal credentials, browser data, crypto wallets, and project secrets. Developers who installed the named packages should remove them, assume compromise, and rotate exposed credentials.","briefOverview":"\u003cp\u003eThreat actors tied to North Korea have been linked by JFrog to malicious npm packages that masqueraded as Rollup polyfill tooling. The packages rollup-packages-polyfill-core and rollup-runtime-polyfill-core mimicked the legitimate rollup-plugin-polyfill-node project, including its description, repository metadata, and package shape. The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe attack used a layered structure in which the lookalike packages installed second-stage packages that posed as SVG utilities. Those second-stage packages fetched a JSON object from JSONKeeper and executed JavaScript from its model field. The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before contacting 216.126.236[.]244 to fetch an encrypted JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eLater payload stages enabled remote access, interactive terminal sessions, command execution, screenshot capture, process termination, mouse and keyboard control on Windows, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture. JFrog said Rollup plugins are often loaded on developer workstations and CI jobs, where source code, npm tokens, Git credentials, cloud keys, SSH keys, browser data, and project secrets may be present. Users who installed the named packages were advised to remove them, assume compromise, rotate credentials, block malicious egress channels, and enable dependency scanning in CI/CD pipelines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog linked North Korea-tied threat actors to malicious npm packages named rollup-packages-polyfill-core and rollup-runtime-polyfill-core that mimic the legitimate rollup-plugin-polyfill-node project.","The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.","The first-stage packages concealed Base64-encoded npm install commands for second-stage packages, which fetched a JSON object from JSONKeeper and executed JavaScript from its model field.","The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before fetching an encrypted JavaScript payload from 216.126.236[.]244.","Later payload stages enabled remote terminal sessions, command execution, screenshot capture, input control, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture."],"insights":["The campaign used a layered package structure in which plausible-looking first-stage packages installed separate second-stage packages, which can make quick dependency reviews and registry-side scanning less likely to reveal the full behavior.","The malware specifically avoided cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure, indicating that testing suspicious packages only in such environments may miss the payload described in the article.","The file collector targeted editor history and configurations for tools including Visual Studio Code, Windsurf, Cursor, AWS, Azure, Google Gemini, Anthropic Claude, Foundry, SSH, and Zsh, showing that developer and AI tool artifacts were explicit collection targets.","The article notes repeated North Korea-linked use of Rollup polyfill impersonation, including a prior package named rollup-plugin-polyfill-route, making similarly named Rollup polyfill packages a particularly important area for scrutiny.","Several unrelated supply-chain campaigns in the article harvested overlapping secrets such as SSH keys, cloud credentials, npm tokens, Docker configurations, shell history, and wallet data, so affected users are advised to assume compromise and rotate credentials rather than only uninstall packages."],"referencedReports":[{"title":"Rollup Polyfill Masquerading","url":"https://research.jfrog.com/post/rollup-polyfill-masquerading/","publisher":"JFrog","context":"The article cites JFrog's technical write-up as the basis for details about malicious npm packages mimicking Rollup polyfill tooling.","category":"","primary":false},{"title":"Operation Navy Ghost: Pyrogram Telegram Supply Chain Attack","url":"https://checkmarx.com/zero-post/operation-navy-ghost-pyrogram-telegram-supplychain-attack/","publisher":"Checkmarx","context":"The article references Checkmarx's report on trojanized pyrogram forks that contained a hidden backdoor and exfiltrated command results via Telegram.","category":"","primary":false},{"title":"DeFi Infostealer: Fake Arbitrage Bot npm","url":"https://safedep.io/defi-infostealer-fake-arbitrage-bot-npm/","publisher":"SafeDep","context":"The article cites SafeDep's research on npm packages mimicking Polymarket tooling and mathematics libraries to deliver a JavaScript infostealer targeting DeFi developers.","category":"","primary":false},{"title":"MarketFront Dependency Confusion Campaign","url":"https://safedep.io/marketfront-dependency-confusion-campaign/","publisher":"SafeDep","context":"The article references SafeDep's analysis of @marketfront npm packages containing a postinstall credential harvester.","category":"","primary":false},{"title":"Credential Stealer \u0026 C2 Backdoor Disguised as Security Monitoring","url":"https://www.linkedin.com/pulse/credential-stealer-c2-backdoor-disguised-security-monitoring-chi-tran-opx2c/","publisher":"Chi Tran","context":"The article cites Chi Tran's analysis of the security-alerts-sdk Python package, which posed as a breach-monitoring tool while running a backdoor and stealing credentials.","category":"","primary":false},{"title":"Operation Friday Harvest: Coordinated npm Campaign Delivering Rust-Compiled ELF Binary","url":"https://www.linkedin.com/pulse/operation-friday-harvest-coordinated-npm-campaign-delivering-tran-lmjlc/","publisher":"Chi Tran","context":"The article references Chi Tran's report on 15 npm packages that used postinstall JavaScript to download and execute a Rust-compiled ELF binary hosted on GitHub.","category":"","primary":false},{"title":"Emitting More Than Events: 125K Downloads Malicious npm","url":"https://www.linkedin.com/pulse/emitting-more-than-events-125k-downloads-malicious-npm-chi-tran-h0bff/","publisher":"Chi Tran","context":"The article cites Chi Tran's analysis of the events-runtime npm package, which typosquatted events and conditionally spawned a cryptocurrency wallet stealer and command channel.","category":"","primary":false},{"title":"Clean npm, Dirty GitHub: Sneaky New Supply Chain Pattern","url":"https://www.linkedin.com/pulse/clean-npm-dirty-github-sneaky-new-supply-chain-pattern-chi-tran-l3sic/","publisher":"Chi Tran","context":"The article references Chi Tran's analysis of o3forms, which split malicious behavior between a benign npm package and a GitHub-pinned sub-dependency.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors tied to North Korea have been linked by JFrog to malicious npm packages that masqueraded as Rollup polyfill tooling. The packages rollup-packages-polyfill-core and rollup-runtime-polyfill-core mimicked the legitimate rollup-plugin-polyfill-node project, including its description, repository metadata, and package shape. The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe attack used a layered structure in which the lookalike packages installed second-stage packages that posed as SVG utilities. Those second-stage packages fetched a JSON object from JSONKeeper and executed JavaScript from its model field. The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before contacting 216.126.236[.]244 to fetch an encrypted JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eLater payload stages enabled remote access, interactive terminal sessions, command execution, screenshot capture, process termination, mouse and keyboard control on Windows, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture. JFrog said Rollup plugins are often loaded on developer workstations and CI jobs, where source code, npm tokens, Git credentials, cloud keys, SSH keys, browser data, and project secrets may be present. Users who installed the named packages were advised to remove them, assume compromise, rotate credentials, block malicious egress channels, and enable dependency scanning in CI/CD pipelines.\u003c/p\u003e\n"},{"n":1,"title":"ARToken PhaaS exposes EvilTokens' Microsoft 365 phishing toolkit","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/artoken-phaas-exposes-eviltokens-microsoft-365-phishing-toolkit/","time":"14:12","priority":"SHOULD READ","score":84,"tldr":"Cisco Talos uncovered ARToken, a phishing-as-a-service panel linked to EvilTokens that helps attackers compromise Microsoft 365 accounts through device code phishing, steal tokens, maintain persistent access, and automate BEC activity. The findings show EvilTokens affiliates have a broad toolkit for bypassing MFA and abusing Outlook, SharePoint, and OneDrive after account takeover.","briefOverview":"\u003cp\u003eCisco Talos researchers discovered a phishing-as-a-service platform called ARToken while investigating phishing infrastructure used in an incident response engagement. The platform includes a React-based management panel called ARToken Panel that exposed more than 80 API endpoints. Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token endpoints documented in prior EvilTokens research.\u003c/p\u003e\n\n\u003cp\u003eARToken is designed to compromise Microsoft 365 accounts by stealing authentication tokens, establishing persistent access using Primary Refresh Tokens, and accessing Outlook mailboxes, SharePoint sites, and OneDrive files. The platform supports business email compromise activity by allowing attackers to send emails as compromised users, create inbox rules that forward or hide messages, monitor mailboxes for keywords, and download attachments. It also includes tools to deploy phishing infrastructure through Cloudflare Workers and operate as a multi-tenant service where affiliates manage campaigns through dedicated workspaces.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that EvilTokens focuses on Microsoft’s device code authentication workflow, where victims enter a legitimate Microsoft-issued code on Microsoft’s official device login page and authentication tokens are issued to the attacker. Because victims authenticate through Microsoft’s legitimate infrastructure, the attacks can bypass multi-factor authentication protections. Talos also found phishing emails tied to the platform that impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 workspace.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos researchers discovered a React-based management panel called ARToken Panel that exposed more than 80 API endpoints while investigating phishing infrastructure used in an incident response engagement.","Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token API endpoints documented in prior EvilTokens research.","ARToken allows attackers to steal Microsoft 365 authentication tokens, establish persistent access using Primary Refresh Tokens, and access Outlook mailboxes, SharePoint sites, and OneDrive files.","The platform includes tools for business email compromise operations, such as sending emails as compromised users, creating inbox rules to forward or hide messages, monitoring mailboxes for keywords, and downloading email attachments.","Phishing emails associated with the platform impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 tenant."],"insights":["ARToken shows that EvilTokens-related activity is not limited to initial credential theft, because the affiliate panel includes post-compromise tools for mailbox monitoring, inbox rule manipulation, file access, and BEC automation.","The use of Microsoft’s legitimate device login page makes these phishing attacks harder to recognize, because victims enter the code on real Microsoft infrastructure while the resulting tokens are issued to the attacker.","The platform’s ability to refresh stolen tokens and elevate access to Primary Refresh Tokens indicates that a single successful device code phishing event can lead to persistent Microsoft 365 access beyond the initial login session.","Attackers using ARToken can make phishing links appear more trustworthy by showing what looks like a legitimate SharePoint address while actually sending victims to a look-alike tenant inside the attacker’s Microsoft 365 workspace.","ARToken’s Cloudflare Workers deployment model and multi-tenant workspace design suggest EvilTokens-style phishing is being operationalized for affiliates who can manage separate campaigns through a service-like platform."],"referencedReports":[{"title":"ARToken: Inside an EvilTokens affiliate panel targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article is based on Talos' report analyzing the ARToken phishing-as-a-service panel and its links to EvilTokens.","category":"","primary":false},{"title":"New widespread EvilTokens kit: Device Code phishing-as-a-Service – Part 1","url":"https://www.sekoia.com/blog/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1","publisher":"Sekoia","context":"The article cites Sekoia's EvilTokens research as prior documentation of the platform's primary refresh token API endpoints and device code phishing activity.","category":"","primary":false},{"title":"EvilTokens: An AI-augmented phishing-as-a-service for automating BEC fraud – Part 2","url":"https://www.sekoia.com/blog/eviltokens-an-ai-augmented-phishing-as-a-service-for-automating-bec-fraud-part-2","publisher":"Sekoia","context":"The article references Sekoia's follow-up report describing EvilTokens' AI-driven workflow for mailbox ingestion and BEC campaign drafting.","category":"","primary":false},{"title":"AI-enabled device code phishing campaign – April 2026","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/","publisher":"Microsoft","context":"The article says Microsoft later warned about EvilTokens as device code phishing attacks increased.","category":"","primary":false}],"body":"\u003cp\u003eCisco Talos researchers discovered a phishing-as-a-service platform called ARToken while investigating phishing infrastructure used in an incident response engagement. The platform includes a React-based management panel called ARToken Panel that exposed more than 80 API endpoints. Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token endpoints documented in prior EvilTokens research.\u003c/p\u003e\n\n\u003cp\u003eARToken is designed to compromise Microsoft 365 accounts by stealing authentication tokens, establishing persistent access using Primary Refresh Tokens, and accessing Outlook mailboxes, SharePoint sites, and OneDrive files. The platform supports business email compromise activity by allowing attackers to send emails as compromised users, create inbox rules that forward or hide messages, monitor mailboxes for keywords, and download attachments. It also includes tools to deploy phishing infrastructure through Cloudflare Workers and operate as a multi-tenant service where affiliates manage campaigns through dedicated workspaces.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that EvilTokens focuses on Microsoft’s device code authentication workflow, where victims enter a legitimate Microsoft-issued code on Microsoft’s official device login page and authentication tokens are issued to the attacker. Because victims authenticate through Microsoft’s legitimate infrastructure, the attacks can bypass multi-factor authentication protections. Talos also found phishing emails tied to the platform that impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 workspace.\u003c/p\u003e\n"},{"n":2,"title":"NetNut proxy network disrupted, 2 million infected devices cut off","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/netnut-proxy-network-disrupted-2-million-infected-devices-cut-off/","time":"17:50","priority":"SHOULD READ","score":84,"tldr":"Google, the FBI, and industry partners disrupted NetNut, a major residential proxy botnet that routed malicious traffic through at least 2 million compromised Android devices, smart TVs, and streaming boxes. The operation seized domains, cut off command-and-control infrastructure, and disabled infected apps via Google Play Protect.","briefOverview":"\u003cp\u003eA joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network that gave access to millions of compromised Android devices, smart TVs, and streaming boxes. Google Threat Intelligence Group estimated that NetNut controlled at least 2 million infected devices globally. The operation included Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners.\u003c/p\u003e\n\n\u003cp\u003eNetNut allowed cybercriminals and espionage groups to hide behind legitimate home internet addresses when launching attacks. Google said it observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups. Threat actors used NetNut to access their own infrastructure, conduct password-spraying attacks, and reach victim environments.\u003c/p\u003e\n\n\u003cp\u003eGoogle disabled accounts and services on its infrastructure that NetNut operators used for malware command-and-control, blocking access to critical backend infrastructure. The FBI took down domains used by the service, including netnut.com. Google also warned users and disabled infected applications using Google Play Protect, and shared technical details about NetNut SDKs and backend infrastructure with platform providers, law enforcement agencies, and cybersecurity researchers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network estimated to control at least 2 million compromised devices globally, including Android devices, smart TVs, and streaming boxes.","Google said NetNut was powered by trojanized applications and botnets such as Badbox 2.0 that package proxy plugins.","The disruption involved Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners, and the FBI took down domains including netnut.com.","Google observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups.","Google disabled accounts and services used by NetNut operators for command-and-control infrastructure and protected users by warning them and disabling infected applications through Google Play Protect."],"insights":["NetNut’s disruption could affect many other residential proxy services because Google said the network has a reseller program that allows whitelabeling and fuels many popular proxy offerings.","Taking down one residential proxy service may not fully remove the capacity from the ecosystem because operators often buy replacement capacity from competing providers and become resellers themselves.","Consumer devices can become part of these networks not only through apps users install, but also through malware that is pre-installed before purchase.","The real-world impact on infected users can include their home internet addresses being flagged as suspicious or blocked by internet service providers or online services, even if they were unaware their devices were being used."],"referencedReports":[{"title":"Google continued disruption of residential proxy networks","url":"http://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks","publisher":"Google Threat Intelligence Group","context":"The article cites GTIG’s linked analysis for observations about threat clusters using suspected NetNut exit nodes and details of the disruption effort.","category":"","primary":false}],"body":"\u003cp\u003eA joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network that gave access to millions of compromised Android devices, smart TVs, and streaming boxes. Google Threat Intelligence Group estimated that NetNut controlled at least 2 million infected devices globally. The operation included Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners.\u003c/p\u003e\n\n\u003cp\u003eNetNut allowed cybercriminals and espionage groups to hide behind legitimate home internet addresses when launching attacks. Google said it observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups. Threat actors used NetNut to access their own infrastructure, conduct password-spraying attacks, and reach victim environments.\u003c/p\u003e\n\n\u003cp\u003eGoogle disabled accounts and services on its infrastructure that NetNut operators used for malware command-and-control, blocking access to critical backend infrastructure. The FBI took down domains used by the service, including netnut.com. Google also warned users and disabled infected applications using Google Play Protect, and shared technical details about NetNut SDKs and backend infrastructure with platform providers, law enforcement agencies, and cybersecurity researchers.\u003c/p\u003e\n"}]</script>
