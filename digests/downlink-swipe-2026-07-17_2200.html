<script type="application/json" id="dl-articles">[{"n":1,"title":"New North Korean campaign uses fake coding interviews to steal developer credentials","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography","time":"00:00","priority":"MUST READ","score":94,"tldr":"Elastic Security Labs uncovered a DPRK-aligned Contagious Interview campaign that lures developers with fake coding challenges and hides OTTERCOOKIE-like malware inside SVG files. Running the trojanized projects can steal browser credentials, crypto wallets, sensitive files and clipboard data while installing a Socket.IO-based remote access backdoor.","briefOverview":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter posted a job offer in its community Slack workspace and sent developers a trojanized coding challenge.","The trojanized projects hid Base64-encoded payload fragments inside HTML comments across SVG flag images, then reassembled and executed the payload when the project server started.","Running the malicious project delivered four OTTERCOOKIE-aligned capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer.","The malware targeted developer machines across Windows, macOS, and Linux by collecting browser data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.","Elastic linked the activity to Contagious Interview based on code similarity, behavior, and infrastructure overlapping with prior reporting on OTTERCOOKIE and related DPRK campaigns."],"insights":["The trojanized repositories had zero antivirus detections at the time of writing, showing that benign-looking coding assignments can evade standard file reputation checks even when they contain active credential theft and remote access code.","The campaign used fully functional e-commerce projects copied from legitimate templates, so a project running correctly was not evidence that it was safe.","The malware avoided simple detection patterns by hiding payload fragments in SVG comments and decoding them with a custom Base64 function before using eval, rather than relying on common decoding methods such as Buffer.from or atob.","The file stealer’s exclusion list deliberately avoided many common developer and AI-coding-tool directories such as .claude, .cursor, .gemini, and .windsurf, indicating the attackers tuned collection to reduce noise on developer systems.","The malware tagged virtual machines and sandboxes in its command-and-control response but did not stop running, which means analysis environments may still observe behavior while operators can separately prioritize likely real victims."],"referencedReports":[{"title":"Contagious Interview malware delivered through fake developer job interviews","url":"https://www.microsoft.com/en-us/security/blog/2026/03/11/contagious-interview-malware-delivered-through-fake-developer-job-interviews/","publisher":"Microsoft","context":"The article cites this Microsoft blog as prior public reporting whose strings, behavior, and script layout overlap with the malicious JavaScript analyzed by Elastic.","category":"","primary":false},{"title":"OTTERCOOKIE Contagious Interview analysis","url":"https://jp.security.ntt/insights_resources/tech_blog/en-contagious-interview-ottercookie/","publisher":"NTT Security","context":"The article references NTT Security’s OTTERCOOKIE analysis as prior research on the malware family that Elastic says its samples resemble.","category":"","primary":false},{"title":"Rollup polyfill masquerading infrastructure","url":"https://research.jfrog.com/post/rollup-polyfill-masquerading/","publisher":"JFrog Security","context":"The article cites JFrog Security research because the observed API endpoints in Elastic’s samples matched infrastructure recently linked by JFrog.","category":"","primary":false}],"body":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n"}]</script>
