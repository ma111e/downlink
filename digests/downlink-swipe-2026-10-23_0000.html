<script type="application/json" id="dl-articles">[{"n":4,"title":"Python packages are also vulnerable to the Node2Shell Brotli flaw (CVE-2026-111497)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/python-packages-vulnerable-node2shell-brotli-cve-2026-111497","time":"20:45","priority":"MUST READ","score":93,"tldr":"Python applications with Brotli 1.2.0 or earlier or brotlicffi 1.2.0.x may be exposed to the critical Node2Shell Brotli decoder flaw (CVE-2026-111497), including indirectly through HTTP clients such as requests and urllib3. Upgrade to Brotli 1.2.1 or brotlicffi 1.2.1.0 and rebuild affected environments and containers.","briefOverview":"\u003cp\u003eCVE-2026-111497, the Brotli decoder flaw known as Node2Shell, also affects Python packages Brotli and brotlicffi because they compile the same vulnerable decoder. Python environments are affected when they contain Brotli 1.2.0 or earlier or brotlicffi 1.2.0.x. Applications may be exposed even without directly importing these packages because HTTP clients such as urllib3, requests, httpx, aiohttp, and Scrapy can use them automatically when installed.\u003c/p\u003e\n\n\u003cp\u003eAn attacker may reach the decoder by sending a malicious Brotli-compressed response to an outbound request or a request body marked with \u003ccode\u003eContent-Encoding: br\u003c/code\u003e. The flaw involves decoder handling of Brotli block switches and can lead to an out-of-bounds write; the upstream fix adds an error for malformed block switches and stops decoding. Organizations should upgrade to Brotli 1.2.1 or brotlicffi 1.2.1.0, rebuild affected containers and bundled wheels, and manually check environments because the article states that pip-audit, Dependabot, and Safety do not yet map the CVE to these PyPI packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-111497, also called Node2Shell in Node.js and Python2Shell in this article, is a Brotli decoder flaw that affects the Python Brotli package through version 1.2.0 and brotlicffi 1.2.0.x.","Python applications may reach the vulnerable decoder through HTTP clients such as urllib3, requests, httpx, aiohttp, and Scrapy when Brotli or brotlicffi is installed, even if the application does not import either package directly.","An attacker may deliver malicious Brotli-compressed data through a response fetched by an application or through a request body encoded with Content-Encoding: br.","The patched releases are Brotli 1.2.1 and brotlicffi 1.2.1.0, and affected organizations should also rebuild container images and bundled wheels after upgrading.","As of October 23, the article states that pip-audit, Dependabot, and Safety do not flag the affected PyPI packages because advisory databases do not yet map the CVE to them."],"insights":["A Python application can be exposed without directly importing Brotli because installed Brotli bindings may be automatically used by HTTP clients to decode server responses.","Removing \"br\" from outbound Accept-Encoding is not complete protection, because the article states that a malicious server can still send a Brotli-encoded response and urllib3 decodes based on the response header.","Standard dependency-scanning tools such as pip-audit, Dependabot, and Safety may not detect this issue yet because the advisory databases had not mapped the CVE to the affected PyPI packages.","Updating a dependency alone is insufficient for deployed software if vulnerable versions remain in existing container images or bundled wheels; those artifacts must be rebuilt.","Uninstalling Brotli and brotlicffi is presented as a temporary mitigation that removes the vulnerable decoder entirely, while HTTP clients fall back to gzip and deflate."],"referencedReports":[{"title":"GHSA-9v8h-qqgm-4m35","url":"https://github.com/advisories/GHSA-9v8h-qqgm-4m35","publisher":"github-advisory-database","context":"The article says an official GitHub advisory was posted for the affected Python Brotli packages.","category":"advisory","primary":true},{"title":"Node2Shell: From Brotli Data to Remote Code Execution","url":"https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/","publisher":"imperva","context":"The article cites Imperva's reporting on researchers exploiting the same decoder code against an unmodified Node.js 24.22.0 build.","category":"research","primary":false}],"body":"\u003cp\u003eCVE-2026-111497, the Brotli decoder flaw known as Node2Shell, also affects Python packages Brotli and brotlicffi because they compile the same vulnerable decoder. Python environments are affected when they contain Brotli 1.2.0 or earlier or brotlicffi 1.2.0.x. Applications may be exposed even without directly importing these packages because HTTP clients such as urllib3, requests, httpx, aiohttp, and Scrapy can use them automatically when installed.\u003c/p\u003e\n\n\u003cp\u003eAn attacker may reach the decoder by sending a malicious Brotli-compressed response to an outbound request or a request body marked with \u003ccode\u003eContent-Encoding: br\u003c/code\u003e. The flaw involves decoder handling of Brotli block switches and can lead to an out-of-bounds write; the upstream fix adds an error for malformed block switches and stops decoding. Organizations should upgrade to Brotli 1.2.1 or brotlicffi 1.2.1.0, rebuild affected containers and bundled wheels, and manually check environments because the article states that pip-audit, Dependabot, and Safety do not yet map the CVE to these PyPI packages.\u003c/p\u003e\n"},{"n":10,"title":"How CVE-2026-73570 turns a Zimbra log file into remote code execution","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570","time":"00:00","priority":"MUST READ","score":92,"tldr":"CVE-2026-73570 is an unauthenticated Zimbra RCE flaw where a malformed SMTP recipient is logged and then executed by Swatchdog through an unsafe Perl shell call, granting code execution as the zimbra user. Upgrade to Zimbra 10.1.20 or later and monitor for suspicious child processes spawned from Swatchdog’s SNMP shell command.","briefOverview":"\u003cp\u003eCVE-2026-73570 is an unauthenticated command-injection vulnerability affecting unpatched Zimbra installations, fixed in Zimbra 10.1.20 and later. An attacker can send a specially malformed SMTP recipient address that Postfix records in \u003ccode\u003e/var/log/zimbra.log\u003c/code\u003e. The Swatchdog monitoring daemon can interpret attacker-controlled log text as a service-status message and invoke an SNMP notification command containing the injected content.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable Swatchdog Perl code passes the service value through a backticked command, causing \u003ccode\u003e/bin/sh\u003c/code\u003e to execute arbitrary commands as the \u003ccode\u003ezimbra\u003c/code\u003e user. According to the article, that account can read every mailbox on the server and send mail as any local identity, enabling identity abuse and further targeting from the compromised mail server. The article recommends upgrading to Zimbra 10.1.20 or later and detecting exploitation by monitoring for processes other than \u003ccode\u003esnmptrap\u003c/code\u003e launched from the Swatchdog-related shell process.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-73570 is an unauthenticated command-injection issue in unpatched Zimbra that can be triggered by a malformed SMTP recipient address.","A malformed recipient is written to /var/log/zimbra.log, where the Swatchdog daemon can match attacker-controlled text to a service-status pattern.","Swatchdog passes the service value into a Perl backticked command that invokes /bin/sh, allowing arbitrary commands to run as the zimbra user.","The article states that upgrading to Zimbra 10.1.20 or later is the only complete fix.","Elastic’s detection rule looks for a shell started by the Swatchdog Perl script that launches a process other than snmptrap."],"insights":["Several public proofs of concept can appear to fail because they write payloads that Swatchdog does not match, which could lead testers to incorrectly conclude that a server is patched.","A successful exploit can be detected by looking for a process other than snmptrap launched by the shell that Swatchdog starts for its normal SNMP notification command.","The command runs as the zimbra user, an account that the article states can read every mailbox on the server and send email as any local identity.","The article’s test used an outbound callback to confirm command execution without making additional on-disk changes on the target."],"referencedReports":[{"title":"CVE-2026-73570: Zimbra Collaboration unauthenticated RCE via Swatchdog/SNMP log-injection command injection swatchrc dosnmp Perl backtick","url":"https://www.pruva.dev/reproductions/REPRO-2026-00327","publisher":"pruva","context":"The article cites this reproduction as a reference for the Zimbra Swatchdog/SNMP command-injection issue.","category":"research","primary":false},{"title":"Unauthenticated command injection on internet-facing mail servers: tracking CVE-2026-73570","url":"https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/","publisher":"microsoft","context":"The article cites Microsoft’s tracking coverage of the unauthenticated command injection affecting internet-facing mail servers.","category":"news","primary":false},{"title":"Zimbra Daffodil (v10.1.20) Patch Release","url":"https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20","publisher":"zimbra","context":"The article references Zimbra’s v10.1.20 patch release as the version that remediates the issue.","category":"advisory","primary":false}],"body":"\u003cp\u003eCVE-2026-73570 is an unauthenticated command-injection vulnerability affecting unpatched Zimbra installations, fixed in Zimbra 10.1.20 and later. An attacker can send a specially malformed SMTP recipient address that Postfix records in \u003ccode\u003e/var/log/zimbra.log\u003c/code\u003e. The Swatchdog monitoring daemon can interpret attacker-controlled log text as a service-status message and invoke an SNMP notification command containing the injected content.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable Swatchdog Perl code passes the service value through a backticked command, causing \u003ccode\u003e/bin/sh\u003c/code\u003e to execute arbitrary commands as the \u003ccode\u003ezimbra\u003c/code\u003e user. According to the article, that account can read every mailbox on the server and send mail as any local identity, enabling identity abuse and further targeting from the compromised mail server. The article recommends upgrading to Zimbra 10.1.20 or later and detecting exploitation by monitoring for processes other than \u003ccode\u003esnmptrap\u003c/code\u003e launched from the Swatchdog-related shell process.\u003c/p\u003e\n"},{"n":11,"title":"New Evidence Shows LiteLLM Secret-Stealing Workflows Ran 11 Days Before Supply Chain Attack","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/litellm-attack-timeline?utm_medium=feed","time":"21:00","priority":"MUST READ","score":92,"tldr":"Socket found that attackers ran malicious GitHub Actions workflows in the LiteLLM repository on October 10 and 12, 2026—up to 11 days before the malicious PyPI release—to exfiltrate organization and environment secrets. LiteLLM later linked the stolen GitHub token from the October 10 workflow to approval of the October 21 malicious release.","briefOverview":"\u003cp\u003eSocket reported that malicious GitHub Actions workflows ran in the BerriAI/litellm repository on October 10 and October 12, 2026, before the October 21 release-pipeline compromise that published malicious litellm==1.107.0 artifacts. The workflows were added through short-lived \u003ccode\u003eci-tmp-\u0026lt;hex\u0026gt;\u003c/code\u003e branches that were created, used, and deleted within minutes, leaving the files absent from \u003ccode\u003emain\u003c/code\u003e. Repository Actions performance metrics recorded one successful \u003ccode\u003ecache.yml\u003c/code\u003e run on each date, placing confirmed malicious workflow activity at least 11 days before the release attack. LiteLLM later said its audit logs linked the \u003ccode\u003eGH_TOKEN\u003c/code\u003e stolen on October 10 to approval of the October 21 malicious release.\u003c/p\u003e\n\n\u003cp\u003eThe October 10 workflow collected six organization-level secrets, including \u003ccode\u003eGH_TOKEN\u003c/code\u003e, a GitHub App private key, and API keys, then encoded them and sent them to a webhook.site endpoint. The expanded October 12 workflow used six jobs, including five bound to named GitHub Environments, to access 14 additional repository, organization, and environment-scoped secrets such as database, Redis, Linear session, and secret-scanning credentials. Both workflows used a trailing \u003ccode\u003e|| true\u003c/code\u003e so their GitHub Actions jobs would report success even if the external transmission failed. Although Socket could reconstruct the activity using logs, metrics, surviving commits, and environment deployment records, it could not confirm whether the collectors received the data, how the initial access was obtained, or whether additional workflow cycles occurred.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket recovered two malicious LiteLLM commits from October 10 and October 12, 2026, that added a GitHub Actions workflow named .github/workflows/cache.yml.","The workflows ran from temporary ci-tmp branches that were created and deleted the same day, allowing them to execute without remaining in the repository’s main branch history.","The October 10 workflow targeted six organization-level secrets, including GH_TOKEN and a GitHub App private key, while the October 12 workflow targeted 14 additional repository, organization, and environment-scoped secrets.","Both workflows encoded collected secrets and sent them to separate webhook.site endpoints, while using error suppression so the GitHub Actions jobs would report success even if transmission failed.","LiteLLM stated that its audit logs linked the GH_TOKEN stolen by the October 10 workflow to approval of the malicious October 21, 2026 LiteLLM release."],"insights":["Deleting the temporary branches did not erase all evidence: GitHub’s activity log, Actions performance metrics, surviving commit objects, and environment deployment records allowed Socket to reconstruct the workflow activity.","The October 12 workflow’s use of real environment names indicates that the attacker had enumerated LiteLLM’s environment inventory before creating the workflow, since binding jobs to those environments unlocked their separately scoped secrets.","A successful GitHub Actions run does not prove the stolen data reached the attacker, because both workflows used \"|| true\" to hide errors from the outbound request; however, the article notes that the expanded October 12 collection and lack of repeated targets are consistent with the earlier delivery succeeding.","The workflow did not need to modify the main branch to access secrets: a push to a temporary branch in the upstream repository was sufficient to trigger the workflow and make repository and environment secrets available.","The activity log identifies the authenticated account used for the branch operations, but it cannot establish whether that account holder acted personally or whether its session, access token, or SSH key had been stolen."],"referencedReports":[{"title":"LiteLLM Security Incident: October 21, 2026 Attack Chain","url":"https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain","publisher":"litellm","context":"The article cites LiteLLM’s attack-chain investigation as corroborating the October 10 malicious workflow activity and linking the stolen GH_TOKEN to approval of the malicious release.","category":"research","primary":false}],"body":"\u003cp\u003eSocket reported that malicious GitHub Actions workflows ran in the BerriAI/litellm repository on October 10 and October 12, 2026, before the October 21 release-pipeline compromise that published malicious litellm==1.107.0 artifacts. The workflows were added through short-lived \u003ccode\u003eci-tmp-\u0026lt;hex\u0026gt;\u003c/code\u003e branches that were created, used, and deleted within minutes, leaving the files absent from \u003ccode\u003emain\u003c/code\u003e. Repository Actions performance metrics recorded one successful \u003ccode\u003ecache.yml\u003c/code\u003e run on each date, placing confirmed malicious workflow activity at least 11 days before the release attack. LiteLLM later said its audit logs linked the \u003ccode\u003eGH_TOKEN\u003c/code\u003e stolen on October 10 to approval of the October 21 malicious release.\u003c/p\u003e\n\n\u003cp\u003eThe October 10 workflow collected six organization-level secrets, including \u003ccode\u003eGH_TOKEN\u003c/code\u003e, a GitHub App private key, and API keys, then encoded them and sent them to a webhook.site endpoint. The expanded October 12 workflow used six jobs, including five bound to named GitHub Environments, to access 14 additional repository, organization, and environment-scoped secrets such as database, Redis, Linear session, and secret-scanning credentials. Both workflows used a trailing \u003ccode\u003e|| true\u003c/code\u003e so their GitHub Actions jobs would report success even if the external transmission failed. Although Socket could reconstruct the activity using logs, metrics, surviving commits, and environment deployment records, it could not confirm whether the collectors received the data, how the initial access was obtained, or whether additional workflow cycles occurred.\u003c/p\u003e\n"},{"n":7,"title":"Signed, Sealed, and Relayed, NTLM-style: Bypassing LDAP Signing Through Reauthentication","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/","time":"16:08","priority":"SHOULD READ","score":88,"tldr":"Researchers found that pre-October 2026 Windows Server domain controllers could be vulnerable to NTLM relay to LDAP even with LDAP signing enforced, by reusing an attacker-controlled signed LDAP session and stacking a victim bind with a privileged LDAP operation. Organizations should patch domain controllers with the October 2026 update, patch the related SMB issue, enforce LDAP signing and channel binding, and reduce NTLM use.","briefOverview":"\u003cp\u003eResearchers described an NTLM relay technique that bypassed required LDAP signing on Windows Server domain controllers before Microsoft’s October 2026 update. An attacker could first establish a signed LDAP session using credentials or, where accepted, an anonymous NTLM SASL context, retaining a session key they controlled. They could then coerce a victim, such as a domain controller or server, to authenticate over SMB and relay that authentication through the existing LDAP connection.\u003c/p\u003e\n\n\u003cp\u003eThe attack worked by placing the victim’s final authentication message and a malicious LDAP request into the same signed SASL record. The domain controller verified that record using the attacker-controlled session key, completed authentication as the victim, and then processed the malicious request with the victim’s permissions. This could enable computer-account takeover techniques such as resource-based constrained delegation or shadow credentials, potentially leading to DCSync and complete domain and forest compromise.\u003c/p\u003e\n\n\u003cp\u003eThe technique applied to plain LDAP on TCP port 389 and did not directly work against LDAPS on port 636, where TLS protects the connection differently. Microsoft’s October 2026 fix, KB5126646, tracks identity changes during processing and discards remaining requests in a signed record if the connection identity changes. The article recommends patching domain controllers and servers, enforcing LDAP signing and channel binding together, restricting LDAP on port 389 where possible, and reducing NTLM use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers described an NTLM relay technique that bypassed required LDAP signing by reusing an existing signed LDAP connection whose session key was known to the attacker.","The attack placed a victim’s final NTLM authentication message and a malicious LDAP modification request in the same signed SASL record, causing the domain controller to verify the record under the attacker’s original session while executing the modification as the victim.","The technique targeted plain LDAP on TCP port 389 and did not directly apply to LDAPS on TCP port 636 because TLS protects the connection differently and channel binding applies there.","The researchers tested domain controllers running Windows Server 2016 and later and reported that they were vulnerable until Microsoft’s October 2026 cumulative update, KB5126646.","Microsoft’s LDAP fix tracks identity changes on an LDAP connection and discards remaining data in a signed SASL record when the identity changes during processing."],"insights":["LDAP signing failed in this case because the server verified a whole protected data record only once, then allowed the connection’s authenticated identity to change before processing another request in that same record.","The Windows SMB client’s request for NTLM message signing, normally an obstacle to SMB-to-LDAP relaying, was required for the described reauthentication technique to work; HTTP/WebDAV authentication did not produce the same result.","Enforcing LDAP signing and channel binding together was still insufficient before the patch when plain LDAP on TCP port 389 remained reachable, because channel binding applies only to TLS-protected LDAP connections.","Microsoft’s fix did not change NTLM cryptography; it added connection identity tracking so the server discards any remaining requests after an identity switch occurs within a signed record.","The article states that an attacker could establish the initial signed LDAP session using valid domain credentials or, where accepted, an anonymous NTLM SASL context, potentially reducing the privileges needed to begin the attack."],"referencedReports":[{"title":"The Renaissance of NTLM Relay Attacks: Everything You Need to Know","url":"https://specterops.io/blog/2025/04/08/the-renaissance-of-ntlm-relay-attacks-everything-you-need-to-know/","publisher":"specterops","context":"The article recommends this technical blog for readers who want background on NTLM and relay attacks.","category":"research","primary":false},{"title":"NTLM Relay","url":"https://en.hackndo.com/ntlm-relay/","publisher":"hackndo","context":"The article recommends this technical analysis as background reading on NTLM relay attacks.","category":"guide","primary":false},{"title":"Defeating Enforced SMB Signing","url":"https://blackfield.ch/blog/defeating-enforced-smb-signing/","publisher":"blackfield.ch","context":"The article cites this research as a separate publication identifying the related SMB signing bypass after Microsoft silently patched it.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers described an NTLM relay technique that bypassed required LDAP signing on Windows Server domain controllers before Microsoft’s October 2026 update. An attacker could first establish a signed LDAP session using credentials or, where accepted, an anonymous NTLM SASL context, retaining a session key they controlled. They could then coerce a victim, such as a domain controller or server, to authenticate over SMB and relay that authentication through the existing LDAP connection.\u003c/p\u003e\n\n\u003cp\u003eThe attack worked by placing the victim’s final authentication message and a malicious LDAP request into the same signed SASL record. The domain controller verified that record using the attacker-controlled session key, completed authentication as the victim, and then processed the malicious request with the victim’s permissions. This could enable computer-account takeover techniques such as resource-based constrained delegation or shadow credentials, potentially leading to DCSync and complete domain and forest compromise.\u003c/p\u003e\n\n\u003cp\u003eThe technique applied to plain LDAP on TCP port 389 and did not directly work against LDAPS on port 636, where TLS protects the connection differently. Microsoft’s October 2026 fix, KB5126646, tracks identity changes during processing and discards remaining requests in a signed record if the connection identity changes. The article recommends patching domain controllers and servers, enforcing LDAP signing and channel binding together, restricting LDAP on port 389 where possible, and reducing NTLM use.\u003c/p\u003e\n"},{"n":2,"title":"Go With the Flow: Taking a Shadow Dependency in GCP Dataflow Cross Tenant","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/shadow-dependency-in-gcp-dataflow-cross-tenant","time":"13:18","priority":"SHOULD READ","score":82,"tldr":"Researchers found that attackers could squat predictable Google Cloud Dataflow staging bucket names and swap Python pickle artifacts to execute code on another organization’s Dataflow workers. Google has globally mitigated the issue through bucket-ownership validation and SHA-256 integrity checks for staged artifacts.","briefOverview":"\u003cp\u003eVaronis Threat Labs identified a cross-tenant Google Cloud Dataflow issue in which an attacker could calculate and claim a project’s predictable default staging-bucket name before the project used it. The affected scenario involved Apache Beam Python pipelines that did not specify a staging location and were the project’s first Dataflow job in that region to use the default bucket. If the job also used \u003ccode\u003e--save_main_session\u003c/code\u003e, the attacker could replace the uploaded Python session file with a malicious version. This could cause attacker-controlled code to run on the victim’s Dataflow workers without the attacker having access to the victim’s project.\u003c/p\u003e\n\n\u003cp\u003eThe malicious session file could retrieve the worker service account’s identity and access token from the instance metadata server and send them to an attacker-controlled endpoint. The resulting impact depended on the worker service account’s permissions and could include credential theft, access to other GCP resources, data manipulation, or data exfiltration. Google addressed the issue with Apache Beam Python SDK ownership checks, Dataflow server-side validation that default staging buckets belong to the submitting project, and SHA-256 integrity checks for staged artifacts. The article notes that explicitly configured staging and temporary buckets remain the customer’s responsibility to secure, and that write access to staging storage should be treated like write access to source code.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs found that predictable default Google Cloud Dataflow staging-bucket names could be squatted by an attacker before a victim’s first eligible Dataflow job in a region.","The attack required a Python Apache Beam pipeline using --save_main_session without an explicit staging location, allowing a malicious replacement pickle file to execute on Dataflow workers.","Successful exploitation could expose the Dataflow worker service account’s identity and access token and enable code execution, data theft, or access to other GCP resources available to that account.","Google added ownership validation to Apache Beam Python SDK version 2.75.0 and deployed server-side checks that reject default staging buckets owned by another project.","Google also rolled out SHA-256 integrity verification for staged artifacts so Dataflow workers abort when a staged file has been modified after upload."],"insights":["The exposure was limited to a project’s first use of the default staging bucket in a given region, because once the legitimate project created that bucket name, an attacker could no longer claim it.","Knowing only a target’s GCP project ID could be sufficient to calculate its future default bucket name, since the name was deterministically derived from the project ID and region.","The attack relied on a race: the attacker had to detect the victim’s uploaded session file and replace it before Dataflow workers downloaded it.","The same malicious session file could execute on additional workers created later through autoscaling, not only on the workers initially launched for the job.","The new ownership protections apply only to automatically selected default buckets, so organizations using explicitly configured staging or temporary buckets must secure those buckets’ permissions themselves."],"referencedReports":[],"body":"\u003cp\u003eVaronis Threat Labs identified a cross-tenant Google Cloud Dataflow issue in which an attacker could calculate and claim a project’s predictable default staging-bucket name before the project used it. The affected scenario involved Apache Beam Python pipelines that did not specify a staging location and were the project’s first Dataflow job in that region to use the default bucket. If the job also used \u003ccode\u003e--save_main_session\u003c/code\u003e, the attacker could replace the uploaded Python session file with a malicious version. This could cause attacker-controlled code to run on the victim’s Dataflow workers without the attacker having access to the victim’s project.\u003c/p\u003e\n\n\u003cp\u003eThe malicious session file could retrieve the worker service account’s identity and access token from the instance metadata server and send them to an attacker-controlled endpoint. The resulting impact depended on the worker service account’s permissions and could include credential theft, access to other GCP resources, data manipulation, or data exfiltration. Google addressed the issue with Apache Beam Python SDK ownership checks, Dataflow server-side validation that default staging buckets belong to the submitting project, and SHA-256 integrity checks for staged artifacts. The article notes that explicitly configured staging and temporary buckets remain the customer’s responsibility to secure, and that write access to staging storage should be treated like write access to source code.\u003c/p\u003e\n"},{"n":8,"title":"Infostealer riding the AI Train","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Check Point researchers identified Aokigahara, an infostealer that expands traditional credential theft to target AI applications and developer environments, including Claude, ChatGPT, Codex, Cursor, GitHub Copilot, cloud credentials, Git secrets, and SSH keys. Stolen session tokens and credentials could expose private AI data, source code, and cloud resources or be monetized through unauthorized use and account resale.","briefOverview":"\u003cp\u003eCheck Point Research identified Aokigahara, a newly observed infostealer that may previously have been known as Kamidere or Stygian. The malware steals common targets such as browser passwords and cookies, cryptocurrency-wallet data, screenshots, clipboard contents, messaging data, VPN and FTP configurations, password-manager files, and selected local files. Its notable feature is dedicated collection of authentication files, session data, and settings associated with AI applications and development tools.\u003c/p\u003e\n\n\u003cp\u003eAokigahara targets Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant, as well as AWS credentials and SSO data. Its developer-focused collection also includes Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credentials and configuration files. The malware sends collected ZIP archives through \u003ccode\u003e/gate/handshake\u003c/code\u003e, \u003ccode\u003e/gate/chunk\u003c/code\u003e, and \u003ccode\u003e/gate/complete\u003c/code\u003e endpoints, encrypting uploads with AES-256-GCM; valid stolen credentials or session tokens could expose private conversations and development data, enable unauthorized use of paid services, or potentially be sold.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified Aokigahara, an infostealer that may have previously been known as Kamidere or Stygian.","Aokigahara steals browser credentials and cookies, cryptocurrency wallet data, screenshots, clipboard contents, messaging and gaming data, email profiles, VPN and FTP client configurations, password-manager data, and selected local files.","Its aisessions component targets authentication files, session data, and configuration files for Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant.","The malware’s ide component collects developer-related data including Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credential and configuration files.","Aokigahara sends collected ZIP archives to command-and-control servers through /gate/handshake, /gate/chunk, and /gate/complete endpoints, encrypting uploaded data with AES-256-GCM."],"insights":["Aokigahara treats AI application sessions and developer credentials as high-value data alongside traditional browser passwords and cryptocurrency wallets, broadening the impact of an infected device to AI services, source repositories, and cloud environments.","The malware can collect session or authentication data without necessarily needing a victim’s password, because it targets local application storage and credential files used by tools such as Claude, ChatGPT Desktop, Cursor, Windsurf, and GitHub Copilot.","All collection modules remain embedded in the executable even when disabled, while a remotely supplied configuration bitmask determines which capabilities run on a particular victim.","The malware avoids execution when configured to detect Russian, Ukrainian, Belarusian, and several other regional language settings, and it also uses debugger, virtual-machine, sandbox, and user-behavior checks to reduce analysis exposure.","Its network activity has recognizable patterns: it uses the /gate/handshake, /gate/chunk, and /gate/complete paths, labels uploads by collection module, and recent samples use the Microsoft-CryptoAPI/10.0 user-agent string."],"referencedReports":[],"body":"\u003cp\u003eCheck Point Research identified Aokigahara, a newly observed infostealer that may previously have been known as Kamidere or Stygian. The malware steals common targets such as browser passwords and cookies, cryptocurrency-wallet data, screenshots, clipboard contents, messaging data, VPN and FTP configurations, password-manager files, and selected local files. Its notable feature is dedicated collection of authentication files, session data, and settings associated with AI applications and development tools.\u003c/p\u003e\n\n\u003cp\u003eAokigahara targets Claude, ChatGPT Desktop, Codex, Cursor, Windsurf, GitHub Copilot, Gemini CLI, Amazon Q, Kiro, and JetBrains AI Assistant, as well as AWS credentials and SSO data. Its developer-focused collection also includes Git credential files, SSH-related files that may contain private keys, and AWS, Azure, and Google Cloud credentials and configuration files. The malware sends collected ZIP archives through \u003ccode\u003e/gate/handshake\u003c/code\u003e, \u003ccode\u003e/gate/chunk\u003c/code\u003e, and \u003ccode\u003e/gate/complete\u003c/code\u003e endpoints, encrypting uploads with AES-256-GCM; valid stolen credentials or session tokens could expose private conversations and development data, enable unauthorized use of paid services, or potentially be sold.\u003c/p\u003e\n"},{"n":3,"title":"A Summons Stamped 2018 That Ends at a OneDrive Login","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/localized-south-african-court-summons-bunnycdn-onedrive-password-form","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing campaign impersonated South African courts with a localized summons PDF that linked to a BunnyCDN-hosted fake OneDrive login page designed to steal Microsoft credentials. The key warning sign was the impossible eight-year-old court stamp and the demand to sign in to view a supposed legal document.","briefOverview":"\u003cp\u003eA South African financial services firm received a one-page PDF called “Summons” that impersonated the Special Tribunal and the Master of the Western Cape High Court. The document alleged a default court order and threatened execution proceedings, using local details including a bilingual English-Afrikaans stamp and references to the tribunal’s mandate. Its most visible inconsistency was a stamp dated October 2018 on a document dated September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained one live link behind a “VIEW COURT SUMMONS HERE” button, which led to an attacker-controlled BunnyCDN pull zone named \u003ccode\u003ehicourtsummons.b-cdn.net\u003c/code\u003e. Rather than showing a court document, the site displayed a OneDrive-style page requesting a Microsoft email address and password, with South African B-BBEE compliance files in the blurred background. IRONSCALES automatically identified the message as phishing and quarantined it; the article records no victim click or credential submission.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A South African financial services firm received a one-page PDF styled as a court summons that impersonated the Special Tribunal and the Master of the Western Cape High Court.","The PDF contained one link, behind a “VIEW COURT SUMMONS HERE” button, that opened a BunnyCDN-hosted page at hicourtsummons.b-cdn.net.","The linked page displayed a OneDrive-style form requesting a Microsoft email address and password, with South African B-BBEE compliance files used as background decoys.","The court stamp was dated October 2018 while the document was dated September 2026, an eight-year discrepancy highlighted as a clear warning sign.","IRONSCALES automatically classified the email as phishing and quarantined it, although no victim click or credential submission was recorded."],"insights":["The attachment itself appeared clean because it had no scripts, embedded files, launch actions, or auto-actions; its only active element was a link to the credential-harvesting page.","The attacker used a legitimate BunnyCDN shared domain, where the deceptive “hicourtsummons” subdomain was attacker-selected even though the broader b-cdn.net domain belonged to the CDN.","The email authenticated cleanly because it was sent from a real South African company’s Microsoft 365 tenant, which the article says may indicate a hijacked account but does not prove it.","Localized details such as real government agencies, Afrikaans wording, and B-BBEE compliance-file decoys added plausibility but did not establish authenticity, while the request for a Microsoft sign-in to view a legal document exposed the fraud."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's statistics on credentials, phishing as an initial access vector, and the human element in breaches.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article links to the FBI IC3 report as background on phishing.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article links to CISA's phishing guidance as background material.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites Microsoft's Digital Defense Report as background on the phishing threat landscape.","category":"research","primary":false}],"body":"\u003cp\u003eA South African financial services firm received a one-page PDF called “Summons” that impersonated the Special Tribunal and the Master of the Western Cape High Court. The document alleged a default court order and threatened execution proceedings, using local details including a bilingual English-Afrikaans stamp and references to the tribunal’s mandate. Its most visible inconsistency was a stamp dated October 2018 on a document dated September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained one live link behind a “VIEW COURT SUMMONS HERE” button, which led to an attacker-controlled BunnyCDN pull zone named \u003ccode\u003ehicourtsummons.b-cdn.net\u003c/code\u003e. Rather than showing a court document, the site displayed a OneDrive-style page requesting a Microsoft email address and password, with South African B-BBEE compliance files in the blurred background. IRONSCALES automatically identified the message as phishing and quarantined it; the article records no victim click or credential submission.\u003c/p\u003e\n"},{"n":1,"title":"Fingerprinting Exposed Siemens S7 PLCs with Netlas","source":"netlas.io","sourceColorIdx":4,"link":"https://netlas.io/blog/fingerprinting_exposed_siemens_s7_plcs_with_netlas/","time":"00:00","priority":"MAY READ","score":52,"tldr":"The article shows how Netlas can be used to identify internet-exposed Siemens S7 PLCs through fingerprinting, helping researchers and defenders assess exposed industrial-control-system assets.","briefOverview":"\u003cp\u003eThe article, titled “Fingerprinting Exposed Siemens S7 PLCs with Netlas,” concerns Siemens S7 PLCs that are exposed. It presents Netlas as the tool used for fingerprinting those PLCs. The focus is on identifying Siemens S7 systems through their observable characteristics.\u003c/p\u003e\n\n\u003cp\u003eThe article connects Siemens S7 PLC exposure with fingerprinting activity performed using Netlas. Its stated subject is limited to this combination of a specific PLC family and a specific platform. No additional incident, affected organization, or remediation detail is identifiable from the available article content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article focuses on fingerprinting Siemens S7 programmable logic controllers exposed to the internet.","The article describes using Netlas for this fingerprinting activity.","Siemens S7 PLCs are the industrial devices discussed in the article."],"insights":["Netlas can be used to distinguish Siemens S7 PLCs that are exposed on the internet through fingerprinting.","The article focuses specifically on publicly reachable Siemens S7 industrial-control devices rather than Siemens systems generally."],"referencedReports":[],"body":"\u003cp\u003eThe article, titled “Fingerprinting Exposed Siemens S7 PLCs with Netlas,” concerns Siemens S7 PLCs that are exposed. It presents Netlas as the tool used for fingerprinting those PLCs. The focus is on identifying Siemens S7 systems through their observable characteristics.\u003c/p\u003e\n\n\u003cp\u003eThe article connects Siemens S7 PLC exposure with fingerprinting activity performed using Netlas. Its stated subject is limited to this combination of a specific PLC family and a specific platform. No additional incident, affected organization, or remediation detail is identifiable from the available article content.\u003c/p\u003e\n"},{"n":5,"title":"Give Users a Deadline With Deferred Policy Action in CASB API","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/give-users-a-deadline-with-deffered-policy-action-in-casb-api","time":"06:55","priority":"MAY READ","score":45,"tldr":"The article appears to announce deferred policy actions in a CASB API, allowing administrators to give users a deadline before a policy action is enforced.","briefOverview":"\u003cp\u003eThe article is titled “Give Users a Deadline With Deferred Policy Action in CASB API.” It concerns deferred policy actions in a CASB API. The title indicates that users can be given a deadline before a policy action takes effect.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable details about the implementation, affected users, or specific policy actions. It also does not identify a vendor, product version, organization, or timeline. The central stated capability is delaying a policy action while providing users with a deadline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Give Users a Deadline With Deferred Policy Action in CASB API.\"","The article concerns deferred policy action in a CASB API.","The article describes giving users a deadline before a policy action is applied."],"insights":["The article’s title indicates that policy enforcement can be deferred rather than applied immediately.","The stated approach is designed to provide users with a deadline before a CASB API policy action occurs."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Give Users a Deadline With Deferred Policy Action in CASB API.” It concerns deferred policy actions in a CASB API. The title indicates that users can be given a deadline before a policy action takes effect.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable details about the implementation, affected users, or specific policy actions. It also does not identify a vendor, product version, organization, or timeline. The central stated capability is delaying a policy action while providing users with a deadline.\u003c/p\u003e\n"},{"n":9,"title":"Belden and Radiflow Partner to Close the Gap Between OT Threat Detection and Network Response","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/news/belden-and-radiflow-partner/","time":"13:00","priority":"MAY READ","score":45,"tldr":"Radiflow and Belden have partnered to integrate Radiflow’s CIARA and iSID OT risk intelligence with Belden’s macmon NAC, enabling automated network-access restrictions when industrial asset risk changes. The integration aims to reduce manual response time for manufacturing, energy, and critical-infrastructure operators.","briefOverview":"\u003cp\u003eRadiflow and Belden announced a strategic partnership to link OT risk detection with automated network-access enforcement. The companies are launching an integrated solution combining Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC. They state that the integration is intended to remove the largely manual handoff between detecting a security issue and applying a network response. The offering targets industrial environments including manufacturing, energy, transportation, and critical infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCIARA maps OT network topology and uses AI-driven threat intelligence to identify critical exposures as they emerge, while iSID supplies real-time OT event context. CIARA provides macmon with current risk scores for individual assets and network zones, enabling macmon to automatically adjust access rights when the assessed risk changes. Belden and Radiflow describe this as a continuous, contextual response that can act at machine speed without manual intervention. The companies say the partnership brings immediate scale to joint customers across Europe, APAC, and North America.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Radiflow and Belden announced a strategic partnership to connect OT threat detection and network-response capabilities.","The integration combines Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC.","CIARA maps OT network topology and uses AI-driven threat intelligence to identify critical exposures, while iSID provides real-time OT event context.","The integrated solution provides macmon with current risk scores for individual assets and network zones, allowing it to automatically adjust access rights when risk posture changes.","The companies say the offering is intended for industrial operators in manufacturing, energy, transportation, and critical-infrastructure environments across Europe, APAC, and North America."],"insights":["The partnership focuses on closing the operational handoff between finding an OT risk and enforcing a network restriction, which the article describes as a process that is often separate and largely manual.","The integrated approach uses both per-asset and per-zone risk scores, allowing access decisions to reflect the changing context of individual equipment and broader sections of an OT network.","Radiflow’s CIARA is positioned to identify emerging critical exposures continuously rather than on a delayed schedule, with macmon NAC applying access-right changes when the associated risk posture changes.","The companies present the integration as a way to restrict access while avoiding disruption to industrial operations, an important consideration for environments such as manufacturing, energy, transportation, and critical infrastructure."],"referencedReports":[],"body":"\u003cp\u003eRadiflow and Belden announced a strategic partnership to link OT risk detection with automated network-access enforcement. The companies are launching an integrated solution combining Radiflow’s CIARA and iSID platforms with Belden’s macmon NAC. They state that the integration is intended to remove the largely manual handoff between detecting a security issue and applying a network response. The offering targets industrial environments including manufacturing, energy, transportation, and critical infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCIARA maps OT network topology and uses AI-driven threat intelligence to identify critical exposures as they emerge, while iSID supplies real-time OT event context. CIARA provides macmon with current risk scores for individual assets and network zones, enabling macmon to automatically adjust access rights when the assessed risk changes. Belden and Radiflow describe this as a continuous, contextual response that can act at machine speed without manual intervention. The companies say the partnership brings immediate scale to joint customers across Europe, APAC, and North America.\u003c/p\u003e\n"},{"n":12,"title":"Cloudflare Introduces a Faster TypeScript Compiler Written in Rust","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/cloudflare-typescript-rust?utm_medium=feed","time":"14:34","priority":"MAY READ","score":45,"tldr":"Cloudflare is bringing tsrs, a Rust port of the TypeScript compiler, into its Oxc toolchain, claiming up to 8× faster type checking and about 70% lower memory use than TypeScript 7.0 in matched tests. The project is working with Microsoft’s TypeScript team to maintain compatibility and upstream performance improvements, while also enabling browser and Cloudflare Worker use through WebAssembly.","briefOverview":"\u003cp\u003eCloudflare announced that it is bringing tsrs, a Rust port of the TypeScript compiler, into its Oxc toolchain, with its VoidZero team taking responsibility for development and maintenance. The project began at Owner.com, where checking a large TypeScript backend consumed enough time and memory to make running multiple coding agents on a laptop impractical. Cloudflare says tsrs is up to eight times faster and uses about 70% less memory than TypeScript 7.0 when tested with the same number of type-checking workers.\u003c/p\u003e\n\n\u003cp\u003eThe TypeScript team is collaborating with tsrs maintainers to understand performance improvements and determine which ones are safe to adopt upstream. Cloudflare notes that the eightfold figure is against TypeScript 7.0, while the TypeScript 7.1 beta is itself reported as up to 2.5 times faster than 7.0. tsrs also has a WebAssembly package that can check in-memory project files in a browser, although its current build is single-threaded, lacks watch-mode and editor language-server support, and has a 4 GiB memory limit per instance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare announced that it is bringing tsrs, a Rust port of the TypeScript compiler, into its Oxc toolchain, with VoidZero taking on development and maintenance.","Cloudflare reports that tsrs is up to eight times faster and uses about 70% less memory than TypeScript 7.0 when compared using the same number of type-checking workers.","Microsoft’s TypeScript team is collaborating with tsrs maintainers, and some optimizations identified in tsrs are being incorporated into the official TypeScript compiler for TypeScript 7.1.","The tsrs project is being combined with Theo Browne’s tsc-rs work and is still addressing compatibility differences from the official compiler, including the order in which errors are reported.","The @tsrs/wasm package can check in-memory project files in browsers, but its current WebAssembly version runs on one thread and does not support watch mode or an editor language server."],"insights":["The reported performance gap should be interpreted carefully: tsrs’s headline eightfold comparison is against TypeScript 7.0, while Cloudflare says the TypeScript 7.1 beta is already up to 2.5 times faster than 7.0.","The TypeScript team says much of tsrs’s speed advantage is not solely due to Rust, and optimizations found by the Rust-port maintainers are already helping improve the official compiler.","For large projects and multiple separate AI-agent workspaces, reducing type-checking memory use can be as important as reducing runtime because each workspace may otherwise consume CPU and memory independently.","Although AI agents helped produce compiler ports quickly, tsrs’s practical value depends on ongoing compatibility work, including tracking TypeScript changes and resolving behavior differences such as diagnostic ordering.","Rust’s WebAssembly build enables in-browser checking of project files, but the current implementation is limited to one thread, lacks watch mode and language-server support, and is capped at 4 GiB of memory per instance."],"referencedReports":[],"body":"\u003cp\u003eCloudflare announced that it is bringing tsrs, a Rust port of the TypeScript compiler, into its Oxc toolchain, with its VoidZero team taking responsibility for development and maintenance. The project began at Owner.com, where checking a large TypeScript backend consumed enough time and memory to make running multiple coding agents on a laptop impractical. Cloudflare says tsrs is up to eight times faster and uses about 70% less memory than TypeScript 7.0 when tested with the same number of type-checking workers.\u003c/p\u003e\n\n\u003cp\u003eThe TypeScript team is collaborating with tsrs maintainers to understand performance improvements and determine which ones are safe to adopt upstream. Cloudflare notes that the eightfold figure is against TypeScript 7.0, while the TypeScript 7.1 beta is itself reported as up to 2.5 times faster than 7.0. tsrs also has a WebAssembly package that can check in-memory project files in a browser, although its current build is single-threaded, lacks watch-mode and editor language-server support, and has a 4 GiB memory limit per instance.\u003c/p\u003e\n"},{"n":6,"title":"Closing the Loop on Data at Rest Incidents","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/closing-the-loop-on-data-at-rest-incidents","time":"06:54","priority":"MAY READ","score":10,"tldr":"The article body is corrupted and cannot be reliably summarized; based on the title, it appears to discuss improving incident-response processes for data-at-rest security incidents.","briefOverview":"\u003cp\u003eThe article is titled “Closing the Loop on Data at Rest Incidents.” The title indicates that its subject concerns incidents involving data while it is stored. No readable byline, date, organization, or incident description is available in the provided article text.\u003c/p\u003e\n\n\u003cp\u003eThe article body is largely corrupted or unreadable. As a result, the provided content does not reliably establish what event occurred, which parties were involved, what technical details were discussed, or what impact resulted. No specific recommendations or conclusions can be extracted from the readable material.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “Closing the Loop on Data at Rest Incidents.”","The article body is predominantly corrupted or unreadable text.","The readable content does not identify a specific incident, affected organization, threat actor, product, or geographic location."],"insights":["The title frames the subject as resolving or completing follow-up on incidents involving stored data, rather than introducing a newly named event.","Because the article body is corrupted, its claims, affected parties, and any recommended actions cannot be in <script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
