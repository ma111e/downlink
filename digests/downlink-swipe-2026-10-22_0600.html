<script type="application/json" id="dl-articles">[{"n":1,"title":"How APT41 revived the BlackLotus bootkit to attack diplomatic organizations in Central Asia","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/uefi-bootkit-blackx/121539/","time":"06:00","priority":"MUST READ","score":91,"tldr":"Kaspersky links a BlackLotus-like UEFI bootkit called BlackX to APT41, which targeted Central Asian diplomatic organizations after gaining administrator access and used it to disable defenses and deploy espionage payloads. Fully patched systems remained exposed because Microsoft’s Baton Drop mitigation requires administrators to manually activate Secure Boot certificate revocation.","briefOverview":"\u003cp\u003eKaspersky identified an early-2026 campaign against diplomatic agencies in Tajikistan, Uzbekistan, and Turkmenistan that used a UEFI bootkit named BlackX. The attackers deployed it after compromising networks and obtaining administrator privileges. BlackX closely resembles the BlackLotus bootkit and uses the Baton Drop flaw to manipulate Secure Boot and load malicious components before Windows starts. Kaspersky attributed the campaign to APT41 with medium confidence based on overlaps with previously reported FishMonger activity and other payload characteristics.\u003c/p\u003e\n\n\u003cp\u003eBlackX installs a kernel driver that attempts to weaken security products by disabling certain monitoring callbacks and interfering with event logging, while also hiding bootkit files by returning a handle to calc.exe instead. It deployed espionage payloads including a remote-access tool that used Google Drive, OneDrive, or Yandex.Disk for communications, as well as OxiDLLRunner, which contacted \u003ccode\u003ewww[.]archivetj[.]com\u003c/code\u003e to retrieve and run additional DLLs. Although the targeted systems were fully patched, the relevant Microsoft protection required a separate manual step to revoke the certificate used by vulnerable boot components. The article warns that this gap can leave organizations exposed even after installing updates, particularly when administrators do not activate the additional Secure Boot revocation process.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified an early-2026 campaign targeting diplomatic agencies in Tajikistan, Uzbekistan, and Turkmenistan that used a UEFI bootkit named BlackX.","BlackX was installed after attackers compromised victim networks and obtained administrator privileges, and its installation chain closely resembled the BlackLotus use of the Baton Drop flaw to bypass Secure Boot.","The BlackX kernel driver attempted to tamper with security software, including security-related process, thread, and registry monitoring and event logging, while protecting bootkit files by returning handles to calc.exe instead.","BlackX delivered espionage payloads including a remote-access tool that used Google Drive, OneDrive, or Yandex.Disk for command-and-control communications and OxiDLLRunner, which contacted www.archivetj.com.","Kaspersky attributed the campaign to APT41 with medium confidence and found that targeted systems were fully patched but had not had Microsoft’s manual Secure Boot certificate-revocation step activated."],"insights":["Installing the relevant Microsoft updates alone did not block BlackX because the revocation of the certificate used by vulnerable boot components required a separate manual activation step.","The October 2026 expiration of the “Windows Production PCA 2011” certificate does not stop vulnerable boot components from loading unless the certificate is explicitly blocklisted.","BlackX’s installer keeps the required bootkit components in an RC4-encrypted, extensionless file rather than embedding them in its installer executable, complicating component recovery during incident response.","The BlackX driver attempted product-specific tampering when Kaspersky or Avast software was present, but Kaspersky’s dynamic analysis found that the Kaspersky-targeting procedures did not interfere with its products.","BlackX closely resembles BlackLotus even though BlackLotus source code has not been published, indicating the operators may have reverse-engineered it or acquired its source code."],"referencedReports":[{"title":"FishMonger’s arsenal upgraded: SprySOCKS and Windows kernel implant","url":"https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/","publisher":"eset","context":"The article cites ESET’s June 2026 research on FishMonger attacks, which described a kernel implant and suggested the possible use of a UEFI bootkit component.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky identified an early-2026 campaign against diplomatic agencies in Tajikistan, Uzbekistan, and Turkmenistan that used a UEFI bootkit named BlackX. The attackers deployed it after compromising networks and obtaining administrator privileges. BlackX closely resembles the BlackLotus bootkit and uses the Baton Drop flaw to manipulate Secure Boot and load malicious components before Windows starts. Kaspersky attributed the campaign to APT41 with medium confidence based on overlaps with previously reported FishMonger activity and other payload characteristics.\u003c/p\u003e\n\n\u003cp\u003eBlackX installs a kernel driver that attempts to weaken security products by disabling certain monitoring callbacks and interfering with event logging, while also hiding bootkit files by returning a handle to calc.exe instead. It deployed espionage payloads including a remote-access tool that used Google Drive, OneDrive, or Yandex.Disk for communications, as well as OxiDLLRunner, which contacted \u003ccode\u003ewww[.]archivetj[.]com\u003c/code\u003e to retrieve and run additional DLLs. Although the targeted systems were fully patched, the relevant Microsoft protection required a separate manual step to revoke the certificate used by vulnerable boot components. The article warns that this gap can leave organizations exposed even after installing updates, particularly when administrators do not activate the additional Secure Boot revocation process.\u003c/p\u003e\n"},{"n":2,"title":"The Keys Are in the Browser: Secret Exposure Across AI-Built Websites","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/secret-exposure-across-ai-built-websites/","time":"08:30","priority":"MAY READ","score":72,"tldr":"Cyble found that 35 of 22,306 AI-built websites exposed live server-side credentials, including OpenAI, Stripe, Supabase, AWS, GitHub, and Slack keys, directly in public front-end code. Reused templates can spread a single exposed secret across many domains, enabling billing fraud, database compromise, cloud access, or internal phishing.","briefOverview":"\u003cp\u003eCyble Research and Intelligence Labs scanned more than 1.3 million newly registered domains and identified 22,306 websites built with AI app-builders. Of those sites, 35 exposed credentials that should remain private in publicly delivered front-end code. The exposed items included OpenAI API keys, Stripe secret keys, Supabase service-role tokens, AWS access keys, GitHub tokens, Google OAuth secrets, and Slack incoming webhooks. Cyble excluded browser-safe or conditionally risky values, such as reCAPTCHA site keys, Stripe publishable keys, and many Google API keys, from its confirmed count.\u003c/p\u003e\n\n\u003cp\u003eThe most significant pattern was credential reuse across cloned site fleets. One Slack webhook was embedded in the same client bundle across 13 near-identical Bubble sites, while one Stripe secret key appeared on four domains under two brands. Cyble also found five sites with 16 live OpenAI keys, including one AI-writing site that contained 12 distinct keys, and four sites exposing Supabase service-role tokens that bypass database access rules. The report recommends placing secrets only in server-side functions or backend workflows, rotating any key exposed in client code, and checking public site code for private credentials before deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyble scanned more than 1.3 million newly registered domains and identified 22,306 websites built with AI app-builders.","Thirty-five of the identified AI-built sites exposed private credentials in public front-end code, including OpenAI API keys, Stripe secret keys, Supabase service-role tokens, AWS access keys, and GitHub or Google OAuth secrets.","Five sites exposed 16 OpenAI API keys, including one AI-writing site that shipped 12 distinct keys in its client-side bundle.","A shared Slack incoming-webhook URL appeared across 13 near-identical Bubble-hosted domains, while a single Stripe secret key was reused across four domains under two brands.","Cyble recommends keeping private keys in server-side functions or backend workflows, rotating any key that appeared on the client side, and reviewing shipped page code for exposed secrets."],"insights":["The confirmed exposure count was limited to credentials that should never be public, excluding thousands of browser-safe keys and other strings that can look sensitive but are not necessarily dangerous.","A single exposed credential can create a much larger problem when AI-built templates are cloned, as shown by one Slack webhook appearing on 13 domains and one Stripe secret key appearing across four domains under two brands.","Supabase service-role tokens are especially consequential because they bypass the database’s normal access restrictions and allow full reading and writing of the project database.","The issue was observed across both Bubble and Next.js-based sites, indicating that the exposure pattern is not limited to one AI-builder platform."],"referencedReports":[],"body":"\u003cp\u003eCyble Research and Intelligence Labs scanned more than 1.3 million newly registered domains and identified 22,306 websites built with AI app-builders. Of those sites, 35 exposed credentials that should remain private in publicly delivered front-end code. The exposed items included OpenAI API keys, Stripe secret keys, Supabase service-role tokens, AWS access keys, GitHub tokens, Google OAuth secrets, and Slack incoming webhooks. Cyble excluded browser-safe or conditionally risky values, such as reCAPTCHA site keys, Stripe publishable keys, and many Google API keys, from its confirmed count.\u003c/p\u003e\n\n\u003cp\u003eThe most significant pattern was credential reuse across cloned site fleets. One Slack webhook was embedded in the same client bundle across 13 near-identical Bubble sites, while one Stripe secret key appeared on four domains under two brands. Cyble also found five sites with 16 live OpenAI keys, including one AI-writing site that contained 12 distinct keys, and four sites exposing Supabase service-role tokens that bypass database access rules. The report recommends placing secrets only in server-side functions or backend workflows, rotating any key exposed in client code, and checking public site code for private credentials before deployment.\u003c/p\u003e\n"}]</script>
