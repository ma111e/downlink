<script type="application/json" id="dl-articles">[{"n":5,"title":"Hackers Exploiting Critical Puppet RCE Flaw Affecting Enterprise Management Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploiting-critical-puppet-rce.html","time":"08:24","priority":"MUST READ","score":96,"tldr":"CISA has added actively exploited CVE-2026-115731, a critical Puppet deserialization flaw that enables remote code execution on Puppet servers, to its KEV catalog. Organizations using affected Puppet Enterprise, Puppet Core, or OpenVox versions should upgrade immediately, as compromise could enable control of managed infrastructure.","briefOverview":"\u003cp\u003eCISA added CVE-2026-115731, a critical Perforce Puppet flaw with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue affects Puppet\u0026rsquo;s report-processing code and can allow a client with a certificate signed by the certificate authority to execute arbitrary code on a Puppet Server under the service account. If certificate requests are automatically approved without strong verification, an unauthenticated network attacker may be able to obtain a valid certificate and use the flaw.\u003c/p\u003e\n\n\u003cp\u003eAffected software includes specified Puppet Enterprise, Puppet Core, and OpenVox releases, and fixes are available from Perforce and OpenVox. Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox. Neodyme said that control of a Puppet Server could enable theft of certificate-authority signing keys and impersonation of other hosts, while Puppet\u0026rsquo;s central access to corporate systems could make ransomware deployment, mass data theft, and movement across a network possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-115731, a critical Puppet vulnerability with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","The flaw is caused by unsafe handling of untrusted data in Puppet report processing and can allow a client with a CA-signed agent certificate to run arbitrary code on the Puppet Server service account.","Affected releases include Puppet Enterprise, Puppet Core, and OpenVox, and fixes are available in Puppet Enterprise 2026.0.1, 2025.12.1, and 2023.8.13; Puppet Core 9.1.3 and 8.22.2; and specified OpenVox releases.","Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox.","CISA directed U.S. Federal Civilian Executive Branch agencies to apply fixes for CVE-2026-115731 by December 1, 2026."],"insights":["A Puppet certificate authority that automatically approves requests without strong checks can allow an unauthenticated network attacker to obtain the certificate needed to exploit CVE-2026-115731.","Successful code execution on a Puppet Server could allow an attacker to steal the certificate-authority signing keys and impersonate other managed hosts.","The reported impact depends on the Puppet Server configuration and whether orchestration protocols are enabled, but code execution on the server remains serious in any configuration.","A Reddit user reported tracing an intrusion involving CVE-2026-115731 after finding a severely misconfigured certificate authority shortly after the vulnerability’s public disclosure."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites this CISA alert for the addition of CVE-2026-115731 to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Report Deserialization Code Execution","url":"https://portal.perforce.com/s/cve/a91Qi000003IaHpIAK/report-deserialization-code-execution","publisher":"perforce","context":"The article links to Perforce's vulnerability advisory for affected Puppet versions and available fixes for CVE-2026-115731.","category":"advisory","primary":true},{"title":"Critical CVE Updates","url":"https://voxpupuli.org/blog/2026/11/03/critical-cve-updates/","publisher":"voxpupuli","context":"The article references this OpenVox update regarding the impact of the issues and resolved OpenVox releases.","category":"advisory","primary":false},{"title":"Certificate Name Authorization Bypass","url":"https://portal.perforce.com/s/cve/a91Qi000003IaJRIA0/certificate-name-authorization-bypass","publisher":"perforce","context":"The article links to Perforce's advisory for CVE-2026-115732, a certificate-name authorization bypass.","category":"advisory","primary":false},{"title":"Puppet RCE","url":"https://neodyme.io/en/blog/puppet_rce/","publisher":"neodyme-ag","context":"The article cites Neodyme's technical report for its assessment of the potential effects of code execution on a Puppet Server.","category":"research","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-115731, a critical Perforce Puppet flaw with a CVSS score of 9.4, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The issue affects Puppet\u0026rsquo;s report-processing code and can allow a client with a certificate signed by the certificate authority to execute arbitrary code on a Puppet Server under the service account. If certificate requests are automatically approved without strong verification, an unauthenticated network attacker may be able to obtain a valid certificate and use the flaw.\u003c/p\u003e\n\n\u003cp\u003eAffected software includes specified Puppet Enterprise, Puppet Core, and OpenVox releases, and fixes are available from Perforce and OpenVox. Researcher Alain Rödel of Neodyme AG also reported CVE-2026-115732, a critical certificate-name authorization bypass affecting Puppet and OpenVox. Neodyme said that control of a Puppet Server could enable theft of certificate-authority signing keys and impersonation of other hosts, while Puppet\u0026rsquo;s central access to corporate systems could make ransomware deployment, mass data theft, and movement across a network possible.\u003c/p\u003e\n"},{"n":7,"title":"Microsoft agent-framework on PyPI: .pth hook steals Azure and CI credentials","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/microsoft-agent-framework-pypi-credential-stealer/","time":"08:53","priority":"MUST READ","score":94,"tldr":"Malicious PyPI releases agent-framework 1.26.1 and 1.26.2 used Python .pth startup hooks to silently steal environment secrets, cloud credentials, and Azure/GitHub Actions OIDC tokens from affected systems. Remove the hooks before running pip, reinstall version 1.26.0, and rotate potentially exposed credentials.","briefOverview":"\u003cp\u003eMalicious versions 1.26.1 and 1.26.2 of Microsoft’s \u003ccode\u003eagent-framework\u003c/code\u003e package were published to PyPI on November 17, 2026, before being removed. Both releases added code that automatically ran during normal Python startup, even if an application did not import the package. The code collected credentials and other sensitive information and sent it to a \u003ccode\u003ewebhook[.]site\u003c/code\u003e URL. Version 1.26.0 does not contain the malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe releases used \u003ccode\u003e.pth\u003c/code\u003e files in \u003ccode\u003esite-packages\u003c/code\u003e to trigger the collector whenever Python starts normally. The collector gathered secret-related environment variables, credentials from files and other processes, and Azure managed-identity tokens; version 1.26.2 additionally requested GitHub Actions OIDC tokens. Affected environments may include system Python installations, virtual environments, Conda environments, containers, and CI caches. The article advises removing the malicious \u003ccode\u003e.pth\u003c/code\u003e hooks before running \u003ccode\u003epip\u003c/code\u003e, reinstalling and pinning \u003ccode\u003eagent-framework==1.26.0\u003c/code\u003e, blocking the known upload destination, rotating exposed secrets, and reviewing Microsoft Entra ID activity for unusual token use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious versions 1.26.1 and 1.26.2 of Microsoft’s agent-framework package were published to PyPI on November 17, 2026, and have since been removed.","Both releases used a .pth startup file that caused their credential-collection code to run during normal Python startup without an application explicitly importing the package.","The code collected secret-related environment variables, credential files, data from other processes, and Azure managed-identity tokens, while version 1.26.2 also requested GitHub Actions OIDC tokens.","Collected data was compressed, encoded, and sent through HTTPS to a webhook[.]site URL.","Affected users should remove the malicious .pth hooks before running pip, reinstall and pin agent-framework version 1.26.0, and rotate potentially exposed secrets."],"insights":["Version 1.26.2 placed its collector in a new top-level module, leaving the agent_framework_meta package byte-identical to version 1.26.0, so a comparison limited to that package would miss the malicious change.","The malicious code can run when tools such as pip start Python, so the article advises deleting the .pth startup hooks before using pip to remove the package.","The collector sets the _AF_TEL environment variable so it generally runs once per process tree, then continues to execute again when a new Python process tree starts while the package remains installed.","Rotating stored passwords and keys alone may not address the exposure, because the code also requested temporary Azure managed-identity and CI/CD identity tokens that require review of Microsoft Entra ID activity logs."],"referencedReports":[],"body":"\u003cp\u003eMalicious versions 1.26.1 and 1.26.2 of Microsoft’s \u003ccode\u003eagent-framework\u003c/code\u003e package were published to PyPI on November 17, 2026, before being removed. Both releases added code that automatically ran during normal Python startup, even if an application did not import the package. The code collected credentials and other sensitive information and sent it to a \u003ccode\u003ewebhook[.]site\u003c/code\u003e URL. Version 1.26.0 does not contain the malicious code.\u003c/p\u003e\n\n\u003cp\u003eThe releases used \u003ccode\u003e.pth\u003c/code\u003e files in \u003ccode\u003esite-packages\u003c/code\u003e to trigger the collector whenever Python starts normally. The collector gathered secret-related environment variables, credentials from files and other processes, and Azure managed-identity tokens; version 1.26.2 additionally requested GitHub Actions OIDC tokens. Affected environments may include system Python installations, virtual environments, Conda environments, containers, and CI caches. The article advises removing the malicious \u003ccode\u003e.pth\u003c/code\u003e hooks before running \u003ccode\u003epip\u003c/code\u003e, reinstalling and pinning \u003ccode\u003eagent-framework==1.26.0\u003c/code\u003e, blocking the known upload destination, rotating exposed secrets, and reviewing Microsoft Entra ID activity for unusual token use.\u003c/p\u003e\n"},{"n":6,"title":"The forced audit: how AuditTeam’s OpsAgent framework masks ransomware as consulting","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/auditteam-opsagent-forced-audit/122031/","time":"07:00","priority":"MUST READ","score":93,"tldr":"AuditTeam is using its evolving OpsAgent malware framework to conduct ransomware-style extortion while posing as a security consultancy, with victims across multiple countries. The toolkit combines defense evasion via a signed antivirus driver, credential and surveillance capabilities, lateral movement, and file encryption, while using GitHub and CloudFront for resilient C2 infrastructure.","briefOverview":"\u003cp\u003eAuditTeam used its OpsAgent framework to compromise dozens of organizations across at least seven countries between January and October 2026. The group presents its extortion as an “Audit \u0026amp; Consulting fee,” promising a vulnerability report in exchange for payment while threatening to publish stolen data. Observed victims were in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia, while its leak site claimed additional victims in other countries.\u003c/p\u003e\n\n\u003cp\u003eOpsAgent provides remote control capabilities including file and process management, privilege escalation, keylogging, screenshot capture, shellcode injection, and movement between compromised systems. Specialized modules can disable security products using a digitally signed Beijing Jiangmin Antivirus driver, terminate database and backup services, encrypt files, remove shadow copies, and leave a ransom note. The framework evolved from C++ to Rust, used Amazon CloudFront subdomains for command-and-control communications, and could retrieve its server address through a public GitHub repository.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AuditTeam used the OpsAgent framework in attacks against dozens of organizations, with observed victims in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia between January and October 2026.","The group’s ransom note demands an “Audit \u0026 Consulting fee” and says a paid victim will receive a vulnerability report instead of having stolen data publicly released.","OpsAgent provides capabilities including file management, process injection, privilege escalation, keylogging, screenshot capture, network pivoting, and remote command execution.","A specialized AV/EDR killer module uses a digitally signed Beijing Jiangmin Antivirus driver to terminate security products, while the cryptor module encrypts files and removes shadow copies.","OpsAgent used Amazon CloudFront subdomains for command-and-control infrastructure and could retrieve C2 addresses from a public GitHub repository."],"insights":["A victim who finds AuditTeam’s ransom note has already had files encrypted, even though the note itself focuses on payment for an “Audit \u0026 Consulting fee” and data-disclosure threats.","Blocking the listed C2 IP addresses alone is not a reliable defense because OpsAgent uses shared Amazon CloudFront infrastructure that also serves legitimate traffic.","Removing the public GitHub repository may not stop every OpsAgent infection, because the latest Rust implants contained configurations with GitHub-based C2 discovery disabled.","OpsAgent’s remote payload delivery keeps functions such as credential theft and pass-the-hash execution out of the main implant, allowing operators to send those payloads through named pipes when needed.","The Rust version changed command-and-control from initial HTTP POST polling to an optional persistent encrypted WebSocket connection after an upgrade command."],"referencedReports":[],"body":"\u003cp\u003eAuditTeam used its OpsAgent framework to compromise dozens of organizations across at least seven countries between January and October 2026. The group presents its extortion as an “Audit \u0026amp; Consulting fee,” promising a vulnerability report in exchange for payment while threatening to publish stolen data. Observed victims were in China, the Philippines, Senegal, Italy, Finland, Hong Kong, and Russia, while its leak site claimed additional victims in other countries.\u003c/p\u003e\n\n\u003cp\u003eOpsAgent provides remote control capabilities including file and process management, privilege escalation, keylogging, screenshot capture, shellcode injection, and movement between compromised systems. Specialized modules can disable security products using a digitally signed Beijing Jiangmin Antivirus driver, terminate database and backup services, encrypt files, remove shadow copies, and leave a ransom note. The framework evolved from C++ to Rust, used Amazon CloudFront subdomains for command-and-control communications, and could retrieve its server address through a public GitHub repository.\u003c/p\u003e\n"},{"n":1,"title":"Apache warns of Roller RCE vulnerability exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/apache-warns-of-roller-rce-vulnerability-exploited-in-attacks/","time":"10:35","priority":"SHOULD READ","score":88,"tldr":"Apache warns that attackers are actively exploiting CVE-2026-129448, a critical unauthenticated deserialization flaw in Apache Roller that enables remote code execution. Organizations should upgrade to Roller 6.1.6 or later immediately, or apply the documented XML-RPC mitigations.","briefOverview":"\u003cp\u003eApache has released security updates for CVE-2026-129448, a critical flaw in Apache Roller that the organization says is being actively exploited. Apache Roller is an open-source, Java-based group-blogging server. Apache has not disclosed who is conducting the attacks or how many servers have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Roller versions 4.0.0 through 6.1.4 and can allow an unauthenticated remote attacker to execute arbitrary code. Roller’s XML-RPC endpoint accepts vendor extension types and processes them before authenticating the requester. Apache recommends upgrading to Roller 6.1.6 or later; organizations unable to update can apply configuration changes that disable extensions and remove the XML-RPC servlet mapping, then restart Roller.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apache has released security updates for CVE-2026-129448, a critical Apache Roller flaw that is being actively exploited in attacks.","The flaw affects Apache Roller versions 4.0.0 through 6.1.4 and allows an unauthenticated remote attacker to run arbitrary code because the XML-RPC endpoint processes certain data before verifying the requester.","Apache recommends upgrading immediately to Apache Roller 6.1.6 or later, which disables the affected extension types and rejects malicious XML-RPC requests.","Organizations unable to upgrade immediately can mitigate the issue by disabling extensions, removing the XML-RPC servlet mapping, and restarting Roller.","Disabling XML-RPC through Roller’s administration interface alone does not prevent attacks because vulnerable versions process the request before checking that setting."],"insights":["Turning off XML-RPC in Roller’s administration interface is insufficient because vulnerable versions deserialize XML-RPC requests before checking whether the feature is enabled.","The issue was previously tracked as CVE-2026-82384, which identified only Roller 6.1.5 as affected, while the updated advisory identifies versions 4.0.0 through 6.1.4.","For organizations that cannot upgrade immediately, Apache’s workaround requires configuration and servlet-mapping changes followed by a Roller restart.","Apache has not disclosed who is behind the ongoing attacks or how many Roller servers have been compromised."],"referencedReports":[{"title":"Apache Roller CVE-2026-129448 Security Advisory","url":"https://lists.apache.org/thread/lnz4s26tv6hdo03wngtdbpfj4hg4gtds","publisher":"Apache Software Foundation","context":"The article cites Apache's Tuesday security advisory describing the actively exploited unauthenticated remote code execution flaw in Apache Roller.","category":"advisory","primary":true}],"body":"\u003cp\u003eApache has released security updates for CVE-2026-129448, a critical flaw in Apache Roller that the organization says is being actively exploited. Apache Roller is an open-source, Java-based group-blogging server. Apache has not disclosed who is conducting the attacks or how many servers have been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Roller versions 4.0.0 through 6.1.4 and can allow an unauthenticated remote attacker to execute arbitrary code. Roller’s XML-RPC endpoint accepts vendor extension types and processes them before authenticating the requester. Apache recommends upgrading to Roller 6.1.6 or later; organizations unable to update can apply configuration changes that disable extensions and remove the XML-RPC servlet mapping, then restart Roller.\u003c/p\u003e\n"},{"n":4,"title":"CISA Urges Immediate Patching of Java4Shell Flaw That Could Allow Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-urges-immediate-patching-of.html","time":"08:24","priority":"SHOULD READ","score":88,"tldr":"CISA is urging organizations to immediately patch Java4Shell (CVE-2026-114938), a critical out-of-bounds write flaw in the HotSpot JVM Base64 decoder that could enable unauthenticated remote code execution or denial of service. Organizations should inventory Java runtimes—including bundled and containerized installations—and apply Oracle, OpenJDK, and vendor patches.","briefOverview":"\u003cp\u003eCISA has urged organizations to immediately patch Java4Shell, a critical Oracle Java flaw tracked as CVE-2026-114938 and rated 8.1 on the CVSS scale. The issue is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot Java Virtual Machine, part of the Java Development Kit. Specially crafted Base64 input could crash the JVM or, in certain conditions, enable unauthenticated remote code execution. Oracle and OpenJDK have released patches, and the article states there is no evidence of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eUnder default settings, the flaw can reportedly allow attackers without accounts to execute arbitrary code on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate. Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker are also listed as affected where an attacker has a login. Blackpoint Cyber reported that about 28,000 unauthenticated requests with malformed Base64 authentication values caused a local Spring Boot application’s JVM to terminate after roughly 20 seconds, while additional testing showed nearby Java-object corruption and changes to live application data without an immediate crash.\u003c/p\u003e\n\n\u003cp\u003eCISA recommends identifying all affected Java installations, including runtimes bundled with third-party applications, container images, and appliances, and applying Java and vendor patches as soon as possible. Where patching cannot happen immediately, CISA advises restricting and validating Base64 input at the application boundary, enforcing input-size limits, and limiting unauthenticated access. Numerous security and software vendors have also published advisories or analyses of the flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA urged organizations to immediately patch Java4Shell, tracked as CVE-2026-114938, a critical Oracle Java flaw with a CVSS score of 8.1.","The flaw is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot JVM that can cause a denial of service or, under certain conditions, unauthenticated remote code execution.","Oracle and OpenJDK have released patches, and the article states that there is no evidence of exploitation in the wild as of publication.","Under default settings, the flaw can allow unauthenticated code execution on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate.","CISA recommends identifying all affected Java installations, including Java bundled with third-party applications, container images, and appliances, and applying available Java and vendor patches promptly."],"insights":["The practical risk differs by application: the article says attackers can run code without an account on several products under default settings, while Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker require a login.","Blackpoint Cyber reported that roughly 28,000 unauthenticated requests containing malformed Base64 authentication data terminated a local Spring Boot application's Java process after about 20 seconds of sustained traffic.","Testing cited in the article found that the flaw could corrupt nearby Java objects and alter live application data without immediately crashing the affected application.","Organizations may overlook affected systems because Java runtimes can be bundled inside third-party applications, container images, and appliances rather than installed separately."],"referencedReports":[{"title":"Critical Java Vulnerability Requires Immediate Patching","url":"https://www.cisa.gov/news-events/alerts/2026/11/17/critical-java-vulnerability-requires-immediate-patching","publisher":"cisa","context":"CISA issued an alert urging organizations to promptly patch the Java4Shell flaw and use compensating controls if patching is delayed.","category":"advisory","primary":true},{"title":"Oracle Critical Security Patch Update, November 2026","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article states that Oracle released patches for CVE-2026-114938.","category":"advisory","primary":true},{"title":"OpenJDK CVE-2026-114938 Advisory","url":"https://openjdk.org/groups/vulnerability/advisories/2026-11-17","publisher":"openjdk","context":"The article states that OpenJDK released patches and an advisory for the Java4Shell flaw.","category":"advisory","primary":true},{"title":"Java 17 RCE Vulnerability: CVE-2026-114938","url":"https://www.aikido.dev/blog/java-17-rce-vulnerability-cve-2026-114938","publisher":"aikido","context":"The article lists Aikido among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938","url":"https://explore.alas.aws.amazon.com/CVE-2026-114938.html","publisher":"amazon-linux","context":"The article lists Amazon Linux among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: CVE-2026-114938 Java Base64 Decoder Flaw","url":"https://blackpointcyber.com/blog/java4shell-cve-2026-114938-java-base64-decoder-flaw/","publisher":"blackpoint-cyber","context":"The article cites Blackpoint Cyber testing showing malformed Base64 authentication requests could terminate a Spring Boot application's JVM and corrupt nearby objects.","category":"research","primary":false},{"title":"Java4Shell: How a Malformed Base64 String Breaks the JVM on AVX-512","url":"https://www.chainguard.dev/unchained/java4shell-how-a-malformed-base64-string-breaks-the-jvm-on-avx-512","publisher":"chainguard","context":"The article lists Chainguard among vendors that published analysis or an advisory for the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://blog.talosintelligence.com/java4shell/","publisher":"cisco-talos","context":"The article lists Cisco Talos among entities that released an advisory or analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://cycode.com/blog/java4shell-cve-2026-114938/","publisher":"cycode","context":"The article lists Cycode among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: Remote Code Execution in OpenJDK CVE-2026-114938","url":"https://securitylabs.datadoghq.com/articles/java4shell-remote-code-execution-in-openjdk-cve-2026-114938/","publisher":"datadog","context":"The article lists Datadog among entities that published technical analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell: Unauthenticated RCE Reported in OpenJDK 17 CVE-2026-114938","url":"https://www.endorlabs.com/learn/java4shell-unauthenticated-rce-reported-in-openjdk-17-cve-2026-114938","publisher":"endor-labs","context":"The article lists Endor Labs among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Oracle Critical Security Patch Update Java 17 RCE Claims","url":"https://hadrian.io/vulnerability-alerts/oracle-critical-security-patch-update-java-17-rce-claims","publisher":"hadrian","context":"The article lists Hadrian among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938","url":"https://horizon3.ai/attack-research/vulnerabilities/cve-2026-114938/","publisher":"horizon3-ai","context":"The article lists Horizon3.ai among entities that released technical vulnerability research.","category":"research","primary":false},{"title":"Java4Shell","url":"https://www.miggo.io/post/java4shell","publisher":"miggo","context":"The article lists Miggo among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: Critical OpenJDK Base64 Decoder Flaw Could Allow Unauthenticated Remote Code Execution","url":"https://orca.security/resources/research/java4shell-critical-openjdk-base64-decoder-flaw-could-allow-unauthenticated-remote-code-execution/","publisher":"orca-security","context":"The article lists Orca Security among entities that published research on the flaw.","category":"research","primary":false},{"title":"How to Find, Mitigate, and Patch the Critical Java4Shell Flaw CVE-2026-114938","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/11/17/how-to-find-mitigate-and-patch-the-critical-java4shell-flaw-cve-2026-114938-now","publisher":"qualys","context":"The article lists Qualys among vendors that published guidance and an advisory for the flaw.","category":"guide","primary":false},{"title":"CVE-2026-114938: Reported Critical Pre-Authentication Remote Code Execution in Java 17","url":"https://www.rapid7.com/blog/post/etr-cve-2026-114938-reported-critical-pre-authentication-remote-code-execution-java-17/","publisher":"rapid7","context":"The article lists Rapid7 among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"RHSB-2026-018","url":"https://access.redhat.com/security/vulnerabilities/RHSB-2026-018","publisher":"red-hat","context":"The article lists Red Hat among vendors that released an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell Vulnerability in OpenJDK Enables RCE on AVX-512 CPUs","url":"https://www.sentinelone.com/blog/java4shell-vulnerability-in-openjdk-enables-rce-on-avx-512-cpus/","publisher":"sentinelone","context":"The article lists SentinelOne among entities that published analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell Could Allow Remote Code Execution","url":"https://www.sophos.com/en-us/blog/java4shell-could-allow-remote-code-execution","publisher":"sophos","context":"The article lists Sophos among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell CVE-2026-114938: Find Every Java Runtime","url":"https://www.tanium.com/blog/java4shell-cve-2026-114938-find-every-java-runtime","publisher":"tanium","context":"The article lists Tanium among vendors that published guidance related to the flaw.","category":"guide","primary":false},{"title":"CVE-2026-114938 Frequently Asked Questions About OpenJDK RCE Vulnerability","url":"https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability","publisher":"tenable","context":"The article lists Tenable among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell: What We Know Now and What Comes Next","url":"https://www.upwind.io/blog/java4shell-what-we-know-now-and-what-comes-next","publisher":"upwind","context":"The article lists Upwind among vendors that published analysis of the flaw.","category":"research","primary":false},{"title":"Java4Shell","url":"https://www.vulncheck.com/blog/java4shell","publisher":"vulncheck","context":"The article lists VulnCheck among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"Java4Shell CVE-2026-114938 FAQ","url":"https://watchtowr.com/intelligence/java4shell-cve-2026-114938-faq/","publisher":"watchtowr","context":"The article lists watchTowr among vendors that published an advisory for the flaw.","category":"advisory","primary":false},{"title":"CVE-2026-114938 RCE Java4Shell OpenJDK","url":"https://www.wiz.io/blog/cve-2026-114938-rce-java4shell-openjdk","publisher":"wiz","context":"The article lists Wiz among vendors that published analysis or an advisory for the flaw.","category":"research","primary":false}],"body":"\u003cp\u003eCISA has urged organizations to immediately patch Java4Shell, a critical Oracle Java flaw tracked as CVE-2026-114938 and rated 8.1 on the CVSS scale. The issue is an out-of-bounds write in the Base64 decoder of the x86-64 HotSpot Java Virtual Machine, part of the Java Development Kit. Specially crafted Base64 input could crash the JVM or, in certain conditions, enable unauthenticated remote code execution. Oracle and OpenJDK have released patches, and the article states there is no evidence of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eUnder default settings, the flaw can reportedly allow attackers without accounts to execute arbitrary code on Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate. Apache Kafka Broker, Apache Solr, Elasticsearch, Gerrit, and Spinnaker are also listed as affected where an attacker has a login. Blackpoint Cyber reported that about 28,000 unauthenticated requests with malformed Base64 authentication values caused a local Spring Boot application’s JVM to terminate after roughly 20 seconds, while additional testing showed nearby Java-object corruption and changes to live application data without an immediate crash.\u003c/p\u003e\n\n\u003cp\u003eCISA recommends identifying all affected Java installations, including runtimes bundled with third-party applications, container images, and appliances, and applying Java and vendor patches as soon as possible. Where patching cannot happen immediately, CISA advises restricting and validating Base64 input at the application boundary, enforcing input-size limits, and limiting unauthenticated access. Numerous security and software vendors have also published advisories or analyses of the flaw.\u003c/p\u003e\n"},{"n":8,"title":"UAT-12643: Suspected North Korea-aligned actor blends blockchain resilience with targeted infostealing","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/","time":"11:00","priority":"SHOULD READ","score":84,"tldr":"Cisco Talos identified UAT-12643, a suspected North Korea-aligned campaign targeting cryptocurrency, gaming, VoIP, and finance users with the Overlord RAT, Good Game infostealer, and a crypto clipboard hijacker. The group uses deceptive LNK, HTA, and MSBuild downloaders and stores encrypted C2 URLs in Solana blockchain transaction memos to make its infrastructure more resilient.","briefOverview":"\u003cp\u003eCisco Talos identified malicious infrastructure tied to UAT-12643, a financially motivated group it assesses with low confidence may be aligned with North Korea. The campaign uses the Go-based Overlord remote-access trojan, the Python-based Good Game infostealer, and a cryptocurrency clipboard hijacker. Lure names and payloads indicate potential targeting of cryptocurrency holders, gaming-platform account owners, VoIP software users, and finance or accounting staff, with file harvesting focused on English, French, Spanish, and Portuguese document names.\u003c/p\u003e\n\n\u003cp\u003eThe actor uses disguised Windows shortcut files, HTA files, and MSBuild XML projects to download and run payloads. Overlord RAT can retrieve encrypted command-and-control addresses from Solana blockchain transaction memos, establish registry and Windows Recovery Environment persistence, and cause a Blue Screen of Death if forcibly terminated after making itself a critical process. Good Game can collect browser credentials, Discord and Roblox data, cryptocurrency wallet and gaming-launcher data, selected personal files, screenshots, and webcam images, then upload the data to GoFile while sending victim details and a download link through a Discord webhook.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos identified malicious infrastructure associated with UAT-12643, a financially motivated group assessed with low confidence to be aligned with North Korea.","The campaign uses the Go-based Overlord RAT, the Python-based Good Game infostealer, and a cryptocurrency clipboard hijacker, with lure themes aimed at cryptocurrency holders, gaming users, VoIP software users, and finance or accounting staff.","UAT-12643 uses weaponized Windows shortcuts, HTA files, and MSBuild XML files to download and execute payloads while disguising activity as legitimate Windows or update-related processes.","Overlord RAT can retrieve encrypted command-and-control server URLs from Solana blockchain transaction memos and includes persistence through Windows registry autorun entries and Windows Recovery Environment reset configuration changes.","Good Game collects browser credentials, Discord and Roblox session data, cryptocurrency wallet and gaming-launcher data, selected personal files, screenshots, and webcam images before uploading archives to GoFile and notifying operators through Discord webhooks."],"insights":["Overlord RAT can make itself a critical Windows process, so forcibly terminating it can trigger a Blue Screen of Death rather than simply stopping the malware.","The RAT’s Windows Recovery Environment modification is designed to execute its payload when a victim uses “Reset this PC,” allowing the implant to survive a full system reset.","By storing encrypted command-and-control addresses in Solana transaction memos, the actor can update where infected systems connect without redeploying the RAT.","Good Game separates stolen-data storage from operator notification by uploading archives to GoFile while sending the victim fingerprint and download link through a Discord webhook.","The exposed staging server revealed both the actor’s payload collection and distinct ports assigned to file delivery, Overlord RAT communication, and the Python stealer’s command-and-control services."],"referencedReports":[{"title":"Don’t Fear the Repo: UNK_DeadDrop Phishing Campaign Targets Developers to Steal","url":"https://www.proofpoint.com/us/blog/threat-insight/dont-fear-repo-unkdeaddrop-phishing-campaign-targets-developers-steal","publisher":"proofpoint","context":"Talos references Proofpoint researchers’ June 2026 reporting that the likely North Korea-linked UNK_DeadDrop cluster had previously used Overlord RAT.","category":"research","primary":false},{"title":"Lazarus Group Is Using the Solana Blockchain as a Dead-Drop C2 Channel and Nobody Noticed for 4 Months","url":"https://intel.breakglass.tech/post/lazarus-group-is-using-the-solana-blockchain-as-a-dead-drop-c2-channel-and-nobody-noticed-for-4-months","publisher":"breakglass","context":"Talos cites this March 2026 technical research as the first report of Lazarus using Solana transaction memos for command-and-control resilience.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos identified malicious infrastructure tied to UAT-12643, a financially motivated group it assesses with low confidence may be aligned with North Korea. The campaign uses the Go-based Overlord remote-access trojan, the Python-based Good Game infostealer, and a cryptocurrency clipboard hijacker. Lure names and payloads indicate potential targeting of cryptocurrency holders, gaming-platform account owners, VoIP software users, and finance or accounting staff, with file harvesting focused on English, French, Spanish, and Portuguese document names.\u003c/p\u003e\n\n\u003cp\u003eThe actor uses disguised Windows shortcut files, HTA files, and MSBuild XML projects to download and run payloads. Overlord RAT can retrieve encrypted command-and-control addresses from Solana blockchain transaction memos, establish registry and Windows Recovery Environment persistence, and cause a Blue Screen of Death if forcibly terminated after making itself a critical process. Good Game can collect browser credentials, Discord and Roblox data, cryptocurrency wallet and gaming-launcher data, selected personal files, screenshots, and webcam images, then upload the data to GoFile while sending victim details and a download link through a Discord webhook.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft announces Windows Server 2028 with hardened security","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-announces-windows-server-2028-with-hardened-security/","time":"09:24","priority":"SHOULD READ","score":78,"tldr":"Microsoft announced Windows Server 2028, featuring a hardened Server Core configuration and security baseline enabled by default, alongside improved management, NVMe/ReFS storage capabilities, and local AI inference support.","briefOverview":"\u003cp\u003eMicrosoft announced Windows Server 2028 at the Ignite 2026 conference as the next major release of its server operating system. The release uses a hardened Server Core configuration by default and introduces a security baseline that administrators can selectively relax. Microsoft said this is intended to reduce the work required to establish a secure configuration from the first day.\u003c/p\u003e\n\n\u003cp\u003eThe default protections include Kerberos over NTLM, protected LSASS, stronger password and account-lockout policies, SMB signing and encryption, a firewall enabled for all profiles, modern TLS cipher suites, and hybrid post-quantum ML-KEM key exchange. It also includes stricter code-signature validation, encrypted paging files, RDP with Network Level Authentication and TLS, restricted WinRM authentication options, and expanded auditing and logging. Microsoft is still developing additional measures such as NTLM blocking, hardware-backed platform protection, and further print and RPC hardening.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2028 also adds Intune management for eligible persistent servers, providing workflows for configuration, compliance, applications, and updates. Storage and performance changes include native NVMe storage by default, NVMe over TCP and RDMA transports, and booting from ReFS. The release further adds AI capabilities for deploying and configuring inference environments, managing accelerated hardware, and supporting models through Windows ML, Foundry Local, vLLM, and Llama.cpp.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced Windows Server 2028 at its Ignite 2026 conference as the next major release of its server operating system.","Windows Server 2028 ships with a hardened Server Core configuration and a new security baseline enabled by default, with options for administrators to relax specific settings.","The default hardening includes protections for identity, network communications, cryptography, administrator access, code integrity, remote access, and logging.","Microsoft said it is still working on additional protections, including NTLM blocking, hardware-backed platform protection, and print and RPC hardening.","Windows Server 2028 adds Intune management for eligible persistent servers, native NVMe storage by default, ReFS boot support, and AI inference tooling for accelerated hardware and custom models."],"insights":["Windows Server 2028 reverses the usual setup burden by applying a hardened Server Core configuration from first boot, while allowing administrators to relax individual settings when needed.","The default protections span both prevention and visibility: they restrict older or unencrypted connections while also enabling detailed auditing, command-line logging, PowerShell script logging, and larger event logs.","Microsoft’s hardening effort is not complete at launch, as NTLM blocking, hardware-backed platform protection, and additional print and RPC protections are still being developed.","The release combines server security and administration changes with infrastructure capabilities such as booting from ReFS, native NVMe storage, and management of local AI inference environments."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft announced Windows Server 2028 at the Ignite 2026 conference as the next major release of its server operating system. The release uses a hardened Server Core configuration by default and introduces a security baseline that administrators can selectively relax. Microsoft said this is intended to reduce the work required to establish a secure configuration from the first day.\u003c/p\u003e\n\n\u003cp\u003eThe default protections include Kerberos over NTLM, protected LSASS, stronger password and account-lockout policies, SMB signing and encryption, a firewall enabled for all profiles, modern TLS cipher suites, and hybrid post-quantum ML-KEM key exchange. It also includes stricter code-signature validation, encrypted paging files, RDP with Network Level Authentication and TLS, restricted WinRM authentication options, and expanded auditing and logging. Microsoft is still developing additional measures such as NTLM blocking, hardware-backed platform protection, and further print and RPC hardening.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2028 also adds Intune management for eligible persistent servers, providing workflows for configuration, compliance, applications, and updates. Storage and performance changes include native NVMe storage by default, NVMe over TCP and RDMA transports, and booting from ReFS. The release further adds AI capabilities for deploying and configuring inference environments, managing accelerated hardware, and supporting models through Windows ML, Foundry Local, vLLM, and Llama.cpp.\u003c/p\u003e\n"},{"n":3,"title":"British Scattered Spider hacker sentenced to 6 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/british-scattered-spider-hacker-sentenced-to-6-years-in-prison/","time":"08:24","priority":"SHOULD READ","score":78,"tldr":"British Scattered Spider leader Tyler Buchanan was sentenced to six years in U.S. prison for phishing employees, conducting SIM-swap-enabled cryptocurrency theft totaling more than $11.6 million, and conspiring to hack multiple companies.","briefOverview":"\u003cp\u003eTyler Robert Buchanan, a 24-year-old British man described as a leader of the Scattered Spider cybercrime collective, was sentenced to six years in U.S. federal prison. He pleaded guilty to cryptocurrency theft charges after prosecutors accused him and four others of wire fraud and aggravated identity theft connected to phishing activity from September 2021 through April 2023. Buchanan was arrested in Spain in June 2024 and has been in U.S. federal custody since April 2025.\u003c/p\u003e\n\n\u003cp\u003eThe group sent hundreds of fraudulent text messages impersonating victim companies or their IT and business-process-outsourcing suppliers, aiming to collect employee credentials and personal information through lookalike websites. The stolen details were used in SIM-swapping schemes to compromise cryptocurrency accounts and wallets, resulting in more than $11.6 million in stolen virtual currency. The victims included companies in telecommunications, technology, entertainment, outsourcing, IT services, cloud communications, and virtual currency, as well as individual victims; other charged conspirators have also received multi-year prison sentences.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tyler Robert Buchanan, a 24-year-old British man described as a Scattered Spider leader, was sentenced to six years in U.S. federal prison.","Buchanan and his accomplices used hundreds of SMS phishing messages impersonating employers or IT and business-process-outsourcing suppliers to obtain employee credentials and personal information.","The stolen information was used in SIM-swapping attacks to steal more than $11.6 million in cryptocurrency from compromised accounts and wallets.","Buchanan was arrested in Palma de Mallorca, Spain, in June 2024, entered U.S. federal custody in April 2025, and pleaded guilty to cryptocurrency theft charges in April.","Other charged Scattered Spider conspirators, including Noah Michael Urban, have also received multi-year prison sentences."],"insights":["The thefts combined fake employee text messages with phone-number takeovers, showing that access to a phone number could be used to reach cryptocurrency accounts and wallets after account information was stolen.","A device found at Buchanan’s Scotland residence contained victims’ names, addresses, cryptocurrency recovery phrases, and account login information, indicating that the conspiracy retained highly sensitive data beyond the initial phishing activity.","Scattered Spider is described as a loose group that organizes through Telegram, Discord, and hacker forums, rather than as a single formal organization.","The group’s activity affected organizations across telecommunications, technology, entertainment, outsourcing, IT services, cloud communications, and virtual-currency services, illustrating its reach across multiple industries.","The article says Scattered Spider partnered with BlackCat/AlphV, Qilin, and RansomHub ransomware operations beginning in early 2023."],"referencedReports":[],"body":"\u003cp\u003eTyler Robert Buchanan, a 24-year-old British man described as a leader of the Scattered Spider cybercrime collective, was sentenced to six years in U.S. federal prison. He pleaded guilty to cryptocurrency theft charges after prosecutors accused him and four others of wire fraud and aggravated identity theft connected to phishing activity from September 2021 through April 2023. Buchanan was arrested in Spain in June 2024 and has been in U.S. federal custody since April 2025.\u003c/p\u003e\n\n\u003cp\u003eThe group sent hundreds of fraudulent text messages impersonating victim companies or their IT and business-process-outsourcing suppliers, aiming to collect employee credentials and personal information through lookalike websites. The stolen details were used in SIM-swapping schemes to compromise cryptocurrency accounts and wallets, resulting in more than $11.6 million in stolen virtual currency. The victims included companies in telecommunications, technology, entertainment, outsourcing, IT services, cloud communications, and virtual currency, as well as individual victims; other charged conspirators have also received multi-year prison sentences.\u003c/p\u003e\n"},{"n":9,"title":"The challenge of defending against bulletproof dead drops on public blockchains","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/","time":"11:00","priority":"MAY READ","score":58,"tldr":"Threat actors are using immutable public blockchains—including Bitcoin, EVM smart contracts, TRON, and Solana memo transactions—as resilient dead drops for encrypted C2 configuration data that cannot be conventionally taken down. Defenders should shift from domain blocklists toward detecting anomalous blockchain JSON-RPC queries and in-memory decryption activity on endpoints.","briefOverview":"\u003cp\u003eThreat actors are increasingly using public blockchains as durable repositories for command-and-control (C2) configuration data, replacing centralized servers and domains that defenders can seize, sinkhole, or block. Encrypted C2 addresses, payload locations, and instructions can be stored in immutable transaction records, smart contracts, wallet activity, or Solana memo data. This removes the traditional single point of failure associated with a hardcoded C2 domain or IP address. Malware can retrieve the data through public blockchain services and then connect to the current operational destination.\u003c/p\u003e\n\n\u003cp\u003eThe article describes earlier Bitcoin-based use by the Glupteba botnet, which queried Electrum servers and extracted AES-encrypted C2 information from transactions. It also describes EtherHiding, in which actors use EVM-compatible smart contracts, including BNB Smart Chain contracts, to store encoded C2 destinations retrieved through read-only \u003ccode\u003eeth_call\u003c/code\u003e requests. UNC5142, linked to ClearFake, and North Korea-linked UNC5342 are cited as groups that adopted this technique, while UAT-12643 is described as using Solana Memo Program transactions to store encrypted C2 URLs. TRON is also presented as part of multi-chain fallback designs that can make disruption more difficult.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional domain blocklists and hosting takedowns are insufficient when the C2 discovery information is preserved across decentralized ledgers. It recommends baselining legitimate blockchain use and detecting automated or high-frequency outbound JSON-RPC calls, including \u003ccode\u003eeth_call\u003c/code\u003e, \u003ccode\u003egetTransaction\u003c/code\u003e, and \u003ccode\u003egetSignaturesForAddress\u003c/code\u003e. Defenders are also encouraged to inspect suspicious encoded data in RPC traffic and prioritize endpoint telemetry that can identify in-memory decryption before malware connects to a resolved C2 server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are using public blockchains as resilient dead drop resolvers to store encrypted command-and-control configuration data that cannot be removed through conventional domain or hosting takedowns.","The Glupteba botnet used Bitcoin transactions to retrieve AES-encrypted command-and-control domains and fallback addresses from public Electrum server queries.","EtherHiding uses EVM-compatible smart contracts to store encoded command-and-control destinations that malware can retrieve through read-only JSON-RPC calls such as eth_call.","Researchers reported that North Korea-aligned actors, including UNC5342 and UAT-12643, have used blockchain-based mechanisms involving BNB Smart Chain, TRON, or Solana memo transactions to obtain payload locations or command-and-control URLs.","The article recommends that defenders monitor anomalous outbound blockchain JSON-RPC activity, inspect unexpected encoded data in requests, and detect in-memory decryption before malware contacts the resolved destination."],"insights":["Read-only smart-contract queries such as eth_call let malware retrieve current command-and-control details without creating a new blockchain transaction, so the retrieval itself leaves no transaction record on the ledger.","Although blockchain records are immutable, smart contracts can hold configuration values that attackers update through later transactions, allowing compromised systems to obtain replacement destinations without receiving a new malware binary.","Solana memo transactions can provide a lightweight update channel: an attacker can publish a new encrypted destination in a fresh transaction, and malware can retrieve the newest transaction associated with a wallet during its next polling cycle.","The article notes that blocking a single malicious website or server is insufficient when attackers use multiple chains such as BNB Smart Chain, TRON, and Solana as fallback sources for command-and-control information.","The same public blockchain lookups used by malware can resemble legitimate activity, making behavioral monitoring of automated JSON-RPC calls and endpoint memory more useful than static domain blocklists alone."],"referencedReports":[{"title":"Glupteba Campaign Hits Network Routers and Updates C\u0026C Servers with Data from Bitcoin Transactions","url":"https://www.trendmicro.com/en_us/research/19/i/glupteba-campaign-hits-network-routers-and-updates-cc-servers-with-data-from-bitcoin-transactions.html?utm_source=gemini","publisher":"trend-micro","context":"The article cites Trend Micro researchers' 2019 discovery of Glupteba using Bitcoin transactions to update its command-and-control servers.","category":"research","primary":false},{"title":"EtherHiding: Hiding Web2 Malicious Code in Web3 Smart Contracts","url":"https://guard.io/labs/etherhiding-hiding-web2-malicious-code-in-web3-smart-contracts","publisher":"guardio-labs","context":"The article references Guardio Labs' documentation of EtherHiding abuse of BNB Smart Chain contracts for resilient malicious hosting.","category":"research","primary":false},{"title":"UNC5142 Uses EtherHiding to Distribute Malware","url":"https://cloud.google.com/blog/u/1/topics/threat-intelligence/unc5142-etherhiding-distribute-malware","publisher":"google-cloud-threat-intelligence","context":"The article references researchers' reporting on UNC5142's use of EtherHiding in connection with the ClearFake distribution campaign.","category":"research","primary":false},{"title":"DPRK Adopts EtherHiding","url":"https://cloud.google.com/blog/topics/threat-intelligence/dprk-adopts-etherhiding","publisher":"google-cloud-threat-intelligence","context":"The article cites a report disclosing UNC5342's use of BNB Smart Chain contracts to store second-stage payloads and command-and-control endpoints.","category":"research","primary":false},{"title":"EtherHiding: Blockchain Dead Drops","url":"https://www.chainalysis.com/blog/etherhiding-blockchain-dead-drops/","publisher":"chainalysis","context":"The article references Chainalysis reporting on threat actors' use of TRON within multi-chain blockchain dead-drop systems.","category":"research","primary":false},{"title":"UAT-12643: Suspected North Korea-Aligned Actor Blends Blockchain Resilience With Targeted Infostealing","url":"https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing","publisher":"cisco-talos","context":"The article cites Cisco Talos research on UAT-12643 using Solana memo transactions to store encrypted command-and-control URLs.","category":"research","primary":false}],"body":"\u003cp\u003eThreat actors are increasingly using public blockchains as durable repositories for command-and-control (C2) configuration data, replacing centralized servers and domains that defenders can seize, sinkhole, or block. Encrypted C2 addresses, payload locations, and instructions can be stored in immutable transaction records, smart contracts, wallet activity, or Solana memo data. This removes the traditional single point of failure associated with a hardcoded C2 domain or IP address. Malware can retrieve the data through public blockchain services and then connect to the current operational destination.\u003c/p\u003e\n\n\u003cp\u003eThe article describes earlier Bitcoin-based use by the Glupteba botnet, which queried Electrum servers and extracted AES-encrypted C2 information from transactions. It also describes EtherHiding, in which actors use EVM-compatible smart contracts, including BNB Smart Chain contracts, to store encoded C2 destinations retrieved through read-only \u003ccode\u003eeth_call\u003c/code\u003e requests. UNC5142, linked to ClearFake, and North Korea-linked UNC5342 are cited as groups that adopted this technique, while UAT-12643 is described as using Solana Memo Program transactions to store encrypted C2 URLs. TRON is also presented as part of multi-chain fallback designs that can make disruption more difficult.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional domain blocklists and hosting takedowns are insufficient when the C2 discovery information is preserved across decentralized ledgers. It recommends baselining legitimate blockchain use and detecting automated or high-frequency outbound JSON-RPC calls, including \u003ccode\u003eeth_call\u003c/code\u003e, \u003ccode\u003egetTransaction\u003c/code\u003e, and \u003ccode\u003egetSignaturesForAddress\u003c/code\u003e. Defenders are also encouraged to inspect suspicious encoded data in RPC traffic and prioritize endpoint telemetry that can identify in-memory decryption before malware connects to a resolved C2 server.\u003c/p\u003e\n"},{"n":10,"title":"Introducing the StepSecurity Secure Registry Community Tier, Integrated with Harden-Runner","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/introducing-the-stepsecurity-secure-registry-community-tier-integrated-with-harden-runner","time":"09:55","priority":"MAY READ","score":55,"tldr":"StepSecurity has launched a free Secure Registry community tier for public GitHub repositories using GitHub-hosted runners, enabled through Harden-Runner. It automatically routes supported JavaScript package installs through a registry that applies a two-day cooldown to new releases and blocks known compromised packages.","briefOverview":"\u003cp\u003eStepSecurity has made its Secure Registry available free through a community tier for public GitHub repositories that use GitHub-hosted runners and the Harden-Runner GitHub Action. The service is intended to protect dependency downloads in CI/CD workflows by delaying newly published package versions and blocking versions known to be compromised. The initial release supports JavaScript package managers including npm, pnpm, and Bun.\u003c/p\u003e\n\n\u003cp\u003eUsers can enable the service by placing Harden-Runner first in a job and setting \u003ccode\u003esecure-registry: true\u003c/code\u003e, which automatically configures npm to use the StepSecurity Community Secure Registry. The default policy enforces a two-day cooldown for new versions and blocks known compromised packages, while Harden-Runner Insights records package requests and the controls that allowed or blocked them. Cached dependencies are not checked, existing custom npm registry settings are left unchanged, and installs fail rather than bypass checks if the secure registry is unavailable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity has made its Secure Registry community tier free for public GitHub repositories using GitHub-hosted runners with the Harden-Runner GitHub Action.","Adding secure-registry: true to a Harden-Runner step configures supported JavaScript package managers to use the StepSecurity Community Secure Registry.","The default community-tier policy applies a two-day cooldown to newly published package versions and blocks known compromised packages.","The initial release supports npm, pnpm, and Bun for JavaScript dependencies, while support for Python, Maven, Ruby, and Rust is planned for future releases.","Harden-Runner Insights records package requests and indicates whether they were allowed or blocked, including the policy control responsible for the decision."],"insights":["If a project already uses another npm registry, Harden-Runner leaves that setting unchanged, so those package downloads are not checked by StepSecurity Secure Registry.","Cached dependencies are not protected because they are restored without being downloaded through the secure registry; the article recommends disabling dependency caching or deleting old caches for full coverage.","Cooldown exemptions can allow selected packages or versions before the waiting period ends, but they cannot override blocks for versions identified as compromised.","If the secure registry is unavailable, package installs fail rather than bypassing security checks, although users can set secure-registry: false if they need to ship sooner."],"referencedReports":[{"title":"20 Popular npm Packages Compromised: Chalk, Debug, Strip-ANSI, Color-Convert, Wrap-ANSI","url":"https://www.stepsecurity.io/blog/20-popular-npm-packages-compromised-chalk-debug-strip-ansi-color-convert-wrap-ansi","publisher":"stepsecurity","context":"The article cites StepSecurity’s September 2025 npm supply chain incident report to document chalk@5.6.1 as a compromised release.","category":"news","primary":false}],"body":"\u003cp\u003eStepSecurity has made its Secure Registry available free through a community tier for public GitHub repositories that use GitHub-hosted runners and the Harden-Runner GitHub Action. The service is intended to protect dependency downloads in CI/CD workflows by delaying newly published package versions and blocking versions known to be compromised. The initial release supports JavaScript package managers including npm, pnpm, and Bun.\u003c/p\u003e\n\n\u003cp\u003eUsers can enable the service by placing Harden-Runner first in a job and setting \u003ccode\u003esecure-registry: true\u003c/code\u003e, which automatically configures npm to use the StepSecurity Community Secure Registry. The default policy enforces a two-day cooldown for new versions and blocks known compromised packages, while Harden-Runner Insights records package requests and the controls that allowed or blocked them. Cached dependencies are not checked, existing custom npm registry settings are left unchanged, and installs fail rather than bypass checks if the secure registry is unavailable.\u003c/p\u003e\n"},{"n":11,"title":"Health-ISAC Daily Cyber Headlines – November 18, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-18-2026/","time":"09:25","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 18 roundup highlights active exploitation of critical Confluence and Java vulnerabilities alongside healthcare-focused espionage, a major dental-data breach, and software supply-chain credential theft. The reporting underscores escalating risk to health-sector organizations and critical research infrastructure.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 18, 2026 daily cyber headlines roundup covers active exploitation of a critical Atlassian Confluence remote-code-execution issue and a critical Java4Shell flaw that enables remote code execution in major Java applications. It also highlights malicious Microsoft Agent Framework packages on PyPI that steal Azure and continuous-integration credentials. The roundup identifies attacks on research and software-development environments as key concerns.\u003c/p\u003e\n\n\u003cp\u003eThe article includes an Access Dental Management data breach affecting more than 340,000 individuals and reports that state-linked cyberespionage targeting the health sector has reached a new high. Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack. It also notes that the French National Assembly approved legislation intended to strengthen cybersecurity and critical-infrastructure resilience.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 18, 2026 daily roundup reports active exploitation of a critical Atlassian Confluence remote-code-execution flaw.","The roundup includes a data breach at Access Dental Management that exposed information belonging to more than 340,000 individuals.","Malicious packages impersonating Microsoft’s Agent Framework were published on PyPI and steal Azure and continuous-integration credentials.","The article reports that state-linked cyberespionage targeting the health sector has reached a new high.","Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack."],"insights":["The roundup links risks across healthcare providers, research institutions, and software-development environments rather than focusing on a single type of organization.","Credential theft through malicious PyPI packages is specifically tied to both Azure and continuous-integration environments, showing that a software package issue can affect cloud and development access.","The items span immediate technical threats, including active Confluence exploitation and Java remote-code execution, alongside policy action through proposed French critical-infrastructure resilience legislation.","Health-sector exposure is presented as both a personal-data issue, through the Access Dental Management breach, and a state-linked espionage concern."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 18, 2026 daily cyber headlines roundup covers active exploitation of a critical Atlassian Confluence remote-code-execution issue and a critical Java4Shell flaw that enables remote code execution in major Java applications. It also highlights malicious Microsoft Agent Framework packages on PyPI that steal Azure and continuous-integration credentials. The roundup identifies attacks on research and software-development environments as key concerns.\u003c/p\u003e\n\n\u003cp\u003eThe article includes an Access Dental Management data breach affecting more than 340,000 individuals and reports that state-linked cyberespionage targeting the health sector has reached a new high. Japan’s RIKEN research institute took its Fugaku supercomputer offline following a cyberattack. It also notes that the French National Assembly approved legislation intended to strengthen cybersecurity and critical-infrastructure resilience.\u003c/p\u003e\n"}]</script>
