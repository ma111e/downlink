<script type="application/json" id="dl-articles">[{"n":4,"title":"Hackers now exploit critical Drupal RCE flaw to hijack sites","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-now-exploit-critical-drupal-rce-flaw-to-hijack-sites/","time":"10:10","priority":"MUST READ","score":98,"tldr":"A critical Drupal installer flaw, CVE-2026-132165, is being actively exploited to take over unpatched sites or achieve remote code execution. Administrators should immediately update Drupal or block access to /core/install.php if patching is not yet possible.","briefOverview":"\u003cp\u003eDrupal has confirmed that attackers have actively exploited CVE-2026-132165 against live, unpatched sites since at least November 19, 2026. The critical flaw can allow anonymous attackers to abuse Drupal\u0026rsquo;s installer to attempt a reinstallation, potentially resulting in site takeover or remote code execution. Drupal is widely used by government entities, research universities, enterprise organizations, and media organizations, increasing the potential impact of exposed sites.\u003c/p\u003e\n\n\u003cp\u003eDrupal advises administrators to upgrade to the latest available version, including those protected by the paid Drupal Steward web application firewall, because other attack paths could emerge. Organizations unable to update immediately can block access to \u003ccode\u003e/core/install.php\u003c/code\u003e in web-server configuration or the web root \u003ccode\u003e.htaccess\u003c/code\u003e file. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems by Friday, November 27.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal confirmed that CVE-2026-132165 has been exploited on live sites since at least November 19, 2026, at 19:00 UTC.","The critical flaw involves Drupal's installer and can allow anonymous attackers to reinstall Drupal, potentially taking over a site or running code on it.","Drupal sites using the paid Drupal Steward web application firewall are protected from known attack methods, but administrators are still advised to upgrade.","Organizations unable to update immediately can block access to /core/install.php through their web-server configuration or the web root .htaccess file.","CISA added CVE-2026-132165 to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems by November 27."],"insights":["Blocking access to Drupal’s installer at /core/install.php is a documented temporary safeguard for organizations that cannot immediately install the update.","Some attack paths are reduced when the web server cannot write to or change permissions on Drupal’s settings.php file.","Drupal Steward’s web application firewall protects against known attack paths, but Drupal still recommends upgrading because additional paths could be found.","CISA has listed five Drupal flaws as actively abused since November 2021, and ransomware groups exploited two of them."],"referencedReports":[{"title":"SA-CORE-2026-017","url":"https://www.drupal.org/sa-core-2026-017","publisher":"drupal-security-team","context":"Drupal's security advisory confirms that CVE-2026-132165 was exploited on live sites as early as November 19, 2026.","category":"advisory","primary":true},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's alert says it added the Drupal flaw to its Known Exploited Vulnerabilities Catalog and directed federal agencies to remediate it.","category":"advisory","primary":false}],"body":"\u003cp\u003eDrupal has confirmed that attackers have actively exploited CVE-2026-132165 against live, unpatched sites since at least November 19, 2026. The critical flaw can allow anonymous attackers to abuse Drupal\u0026rsquo;s installer to attempt a reinstallation, potentially resulting in site takeover or remote code execution. Drupal is widely used by government entities, research universities, enterprise organizations, and media organizations, increasing the potential impact of exposed sites.\u003c/p\u003e\n\n\u003cp\u003eDrupal advises administrators to upgrade to the latest available version, including those protected by the paid Drupal Steward web application firewall, because other attack paths could emerge. Organizations unable to update immediately can block access to \u003ccode\u003e/core/install.php\u003c/code\u003e in web-server configuration or the web root \u003ccode\u003e.htaccess\u003c/code\u003e file. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems by Friday, November 27.\u003c/p\u003e\n"},{"n":23,"title":"Drupal Fail2Install Exploit Details Emerge as Critical RCE Flaw Faces Active Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/drupal-fail2install-exploit-details.html","time":"11:23","priority":"MUST READ","score":98,"tldr":"CISA added Drupal’s actively exploited CVE-2026-132165 “Fail2Install” flaw to its KEV catalog, as attackers can abuse resource exhaustion and the installer to achieve unauthenticated remote code execution. Organizations should urgently update Drupal to the patched 10.6.22, 11.3.22, or 11.4.13 releases.","briefOverview":"\u003cp\u003eCISA added the actively exploited Drupal core flaw CVE-2026-132165, known as Fail2Install, to its Known Exploited Vulnerabilities catalog and set a November 27, 2026 remediation deadline for federal agencies. The critical issue has a CVSS score of 9.8 and can allow an unauthenticated attacker to take over an existing Drupal site or run arbitrary code through the Drupal installer. Drupal’s Security Team said the issue had been exploited on live sites as early as November 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber found that attackers can exhaust ordinary server resources, including open file handles, database connections, or TCP source ports, to make Drupal incorrectly conclude that an existing site is not installed. A subsequent successful database check can reopen the installer, enabling an attacker to create an administrator-controlled account and, through SQLite database-file handling, write PHP code into a file with a \u003ccode\u003e.php\u003c/code\u003e extension. The issue affects Drupal 8.9, 9, 10, and 11 in the tested deployment combinations, and Drupal fixed it in versions 11.4.13, 11.3.22, and 10.6.22.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added Drupal core flaw CVE-2026-132165, also called Fail2Install and rated 9.8, to its Known Exploited Vulnerabilities catalog after reports of exploitation on live sites beginning November 19, 2026.","The flaw can allow an unauthenticated attacker to use Drupal’s install.php process to attempt a reinstallation, potentially taking over an existing site or executing arbitrary code.","Searchlight Cyber found that exhausting file handles, database connections, or TCP source ports can cause Drupal to incorrectly treat an existing site as uninstalled under certain conditions.","The researchers described a path to code execution in which the installer creates an SQLite database file with a .php extension and writes attacker-supplied PHP code into it.","Drupal addressed the issue in versions 11.4.13, 11.3.22, and 10.6.22."],"insights":["The research shows that ordinary availability limits, such as exhausted file handles, database connections, or TCP source ports, can be used to bypass Drupal’s installation safeguards rather than merely cause outages.","Drupal can misread a temporary database failure as proof that no site is installed, and a later successful connection check can reopen the installer on an existing site.","The installer’s ability to create SQLite database files at attacker-selected paths without restricting the extension can allow PHP code to be written into a file ending in .php.","Even where Drupal’s default Apache configuration blocks direct access to the generated PHP file, the researchers reported that an Apache RewriteRule path-handling weakness can enable code execution.","CISA required U.S. federal agencies to apply fixes by November 27, 2026, reflecting that exploitation had already been reported on live sites."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA’s alert announcing that CVE-2026-132165 was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false},{"title":"Fail2Install: System Limits to Pre-Auth RCE in Drupal","url":"https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal#sqlstatehy000-1040-too-many-connections","publisher":"searchlight-cyber","context":"The article relies on Searchlight Cyber’s independent technical analysis for details of the resource-exhaustion and installer-based code-execution chain.","category":"research","primary":true},{"title":"Drupal Core Security Advisory SA-CORE-2026-017","url":"https://www.drupal.org/sa-core-2026-017","publisher":"drupal-security-team","context":"The article cites this Drupal Security Team advisory for the report that the flaw had been exploited on live sites as early as November 19, 2026.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA added the actively exploited Drupal core flaw CVE-2026-132165, known as Fail2Install, to its Known Exploited Vulnerabilities catalog and set a November 27, 2026 remediation deadline for federal agencies. The critical issue has a CVSS score of 9.8 and can allow an unauthenticated attacker to take over an existing Drupal site or run arbitrary code through the Drupal installer. Drupal’s Security Team said the issue had been exploited on live sites as early as November 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber found that attackers can exhaust ordinary server resources, including open file handles, database connections, or TCP source ports, to make Drupal incorrectly conclude that an existing site is not installed. A subsequent successful database check can reopen the installer, enabling an attacker to create an administrator-controlled account and, through SQLite database-file handling, write PHP code into a file with a \u003ccode\u003e.php\u003c/code\u003e extension. The issue affects Drupal 8.9, 9, 10, and 11 in the tested deployment combinations, and Drupal fixed it in versions 11.4.13, 11.3.22, and 10.6.22.\u003c/p\u003e\n"},{"n":39,"title":"Fail2Install (CVE-2026-132165): Drupal Installer Flaw Lets Attackers Take Over Sites and Run Code","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/fail2install-cve-2026-132165","time":"21:46","priority":"MUST READ","score":97,"tldr":"Drupal’s actively exploited Fail2Install flaw (CVE-2026-132165) lets unauthenticated attackers reopen the installer on vulnerable live sites by triggering database connection failures, potentially taking over the site and executing code. Upgrade immediately to Drupal 10.6.22, 11.3.22, or 11.4.13 or later, block access to /core/install.php, and investigate for compromise if the installer was exposed.","briefOverview":"\u003cp\u003eDrupal released fixes on November 18, 2026, for Fail2Install (CVE-2026-132165), an actively exploited flaw in the Drupal core installer. The issue affects Drupal 10 releases before 10.6.22, Drupal 11 releases before 11.3.22 or 11.4.13, and, according to the public write-up, unsupported Drupal 8.9 and 9 sites. CISA added the flaw to its Known Exploited Vulnerabilities catalog on November 24 after Drupal received a report of exploitation on live sites.\u003c/p\u003e\n\n\u003cp\u003eOn affected sites, an unauthenticated attacker can briefly force database connections to fail and then access the installer as though the site had not yet been set up. The attacker can replace the site’s database settings, create a new administrator account, and potentially run code on the server through a writable PHP file path under the web root. Drupal’s fixes make database verification errors stop the installer, restrict an in-progress installation to the browser session that started it, and stop the installer from changing \u003ccode\u003esettings.php\u003c/code\u003e permissions.\u003c/p\u003e\n\n\u003cp\u003eSite owners should upgrade to Drupal 10.6.22, 11.3.22, 11.4.13, or later, and block \u003ccode\u003e/core/install.php\u003c/code\u003e after installation. The article also recommends making \u003ccode\u003esettings.php\u003c/code\u003e and code directories such as \u003ccode\u003eweb/modules\u003c/code\u003e and \u003ccode\u003eweb/themes\u003c/code\u003e read-only to the web server. Signs of possible exploitation include bursts of database connection-refusal errors, HTTP 500 responses, requests to the installer, suspicious \u003ccode\u003e.php/core/\u003c/code\u003e URLs, and PHP-named files that contain SQLite databases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal released fixes for the actively exploited Fail2Install flaw, CVE-2026-132165, in versions 10.6.22, 11.3.22, and 11.4.13 on November 18, 2026.","On affected Drupal sites, an unauthenticated attacker who can cause temporary database connection failures can reopen the installer on an already running site and begin reinstalling it.","Completing a reinstallation can let an attacker point the site to a database they control and create a new administrator account, and the documented SQLite path can lead to server-side code execution when the web server can write to a code directory.","CISA added CVE-2026-132165 to its Known Exploited Vulnerabilities catalog on November 24, 2026, after Drupal received a report of exploitation on live sites.","Drupal recommends upgrading to a fixed release, blocking access to /core/install.php on installed sites, and ensuring the web server cannot write to settings.php or code directories such as web/modules and web/themes."],"insights":["A public version banner cannot distinguish patched from vulnerable modern Drupal releases because Drupal exposes only the major version, such as “Drupal 11,” rather than the installed patch version.","The attack necessarily creates a loud trail of database connection refusals and HTTP 500 errors, making a burst of those events alongside installer requests a strong indicator of possible exploitation.","The Drupal patch closes installer re-entry but does not change the Apache rule that can run a PHP file planted in a writable code directory through a URL containing “.php/core/”.","On nginx, blocking only the exact /core/install.php path may be insufficient because paths such as /core/install.php/foo can still reach the installer on some PHP configurations.","Older Drupal 8.9 and 9 sites are affected according to the public write-up but have no patch, so they must move to a supported branch rather than apply a security update."],"referencedReports":[{"title":"SA-CORE-2026-017: Drupal core, Highly critical, Remote code execution","url":"https://www.drupal.org/sa-core-2026-017","publisher":"drupal","context":"Drupal’s security advisory identifies CVE-2026-132165, describes its impact, and provides remediation guidance.","category":"advisory","primary":true},{"title":"Securing the installer (install.php)","url":"https://www.drupal.org/docs/administering-a-drupal-site/security-in-drupal/securing-the-installer-installphp","publisher":"drupal","context":"The article cites Drupal’s guidance for testing and blocking public access to the installer on completed sites.","category":"guide","primary":false},{"title":"Securing file permissions and ownership","url":"https://www.drupal.org/docs/administering-a-drupal-site/security-in-drupal/securing-file-permissions-and-ownership","publisher":"drupal","context":"The article references this Drupal guide when recommending that the web server not be able to write to settings.php or code directories.","category":"guide","primary":false},{"title":"Updating Drupal core via Composer","url":"https://www.drupal.org/docs/updating-drupal/updating-drupal-core-via-composer","publisher":"drupal","context":"The article uses Drupal’s documented Composer update procedure for upgrading affected sites.","category":"guide","primary":false},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog (November 24, 2026)","url":"https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA’s notice that CVE-2026-132165 was added to the Known Exploited Vulnerabilities catalog.","category":"news","primary":false}],"body":"\u003cp\u003eDrupal released fixes on November 18, 2026, for Fail2Install (CVE-2026-132165), an actively exploited flaw in the Drupal core installer. The issue affects Drupal 10 releases before 10.6.22, Drupal 11 releases before 11.3.22 or 11.4.13, and, according to the public write-up, unsupported Drupal 8.9 and 9 sites. CISA added the flaw to its Known Exploited Vulnerabilities catalog on November 24 after Drupal received a report of exploitation on live sites.\u003c/p\u003e\n\n\u003cp\u003eOn affected sites, an unauthenticated attacker can briefly force database connections to fail and then access the installer as though the site had not yet been set up. The attacker can replace the site’s database settings, create a new administrator account, and potentially run code on the server through a writable PHP file path under the web root. Drupal’s fixes make database verification errors stop the installer, restrict an in-progress installation to the browser session that started it, and stop the installer from changing \u003ccode\u003esettings.php\u003c/code\u003e permissions.\u003c/p\u003e\n\n\u003cp\u003eSite owners should upgrade to Drupal 10.6.22, 11.3.22, 11.4.13, or later, and block \u003ccode\u003e/core/install.php\u003c/code\u003e after installation. The article also recommends making \u003ccode\u003esettings.php\u003c/code\u003e and code directories such as \u003ccode\u003eweb/modules\u003c/code\u003e and \u003ccode\u003eweb/themes\u003c/code\u003e read-only to the web server. Signs of possible exploitation include bursts of database connection-refusal errors, HTTP 500 responses, requests to the installer, suspicious \u003ccode\u003e.php/core/\u003c/code\u003e URLs, and PHP-named files that contain SQLite databases.\u003c/p\u003e\n"},{"n":19,"title":"Hackers Exploit Two GeoServer Flaws as Researchers Warn of Unauthenticated RCE Chains","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-two-geoserver-flaws-as.html","time":"12:48","priority":"MUST READ","score":96,"tldr":"Attackers are actively probing two recently patched GeoServer flaws, including an unauthenticated file-read bug and a service-security bypass. Organizations should urgently update to GeoServer 2.27.7, 2.28.6, or 3.0.2, as these issues can be chained with other defects to achieve unauthenticated remote code execution.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting two recently patched GeoServer flaws, CVE-2026-120705 and CVE-2026-129243, according to watchTowr. The first flaw can let an unauthenticated attacker read local text files available to the GeoServer process or retrieve attacker-selected web addresses through a Web Feature Service request. The second can let an unauthenticated attacker invoke operations that would normally be protected by GeoServer service-security rules.\u003c/p\u003e\n\n\u003cp\u003eResearchers reported that CVE-2026-120705 can be combined with other GeoServer issues to achieve remote code execution without authentication. One described chain uses file disclosure to obtain administrator password data and a predictable signing key, forges an administrator session cookie, and then abuses a JDBC configuration to run code. GeoServer users are advised to update to versions 2.27.7, 2.28.6, or 3.0.2 as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are actively exploiting CVE-2026-120705 and CVE-2026-129243, two newly patched GeoServer flaws, according to watchTowr.","CVE-2026-120705 allows unauthenticated attackers to read local text files accessible to GeoServer or retrieve attacker-selected HTTP or HTTPS URLs through a Web Feature Service request.","CVE-2026-129243 can allow unauthenticated attackers to invoke GeoServer OWS operations that would normally be protected by service-security rules.","Researchers reported that CVE-2026-120705 can be chained with flaws affecting GeoServer's administrator authentication and JDBC configuration to achieve unauthenticated remote code execution.","GeoServer users are advised to update to versions 2.27.7, 2.28.6, or 3.0.2 as soon as possible."],"insights":["A five-step attack chain can turn a file-reading flaw into command execution without requiring an attacker to know an administrator's actual password, because the exposed password digest and predictable signing key can be used to forge an administrator cookie.","GeoServer's service-security restriction for stored queries can be bypassed by prefixing the Web Feature Service name, such as using \"x/WFS,\" according to the independently reported attack chain.","Changing the signing key in GeoServer's security configuration alone does not prevent session forgery if the same file-disclosure issue also lets an attacker read the replacement key.","Active exploit activity included error-based probes that created and invoked stored queries to check whether a GeoServer instance was vulnerable."],"referencedReports":[{"title":"CVE-2026-120705 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-39mw-5chv-jh47","publisher":"geoserver","context":"The article links this advisory for the unauthenticated GeoServer file-read and URL-fetch flaw.","category":"advisory","primary":true},{"title":"CVE-2026-129243 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj","publisher":"geoserver","context":"The article links this advisory for the GeoServer service-security authorization bypass.","category":"advisory","primary":true},{"title":"Unauthenticated Remote Code Execution Vulnerability in GeoServer","url":"https://labs.eye.security/unauthenticated-remote-code-execution-vulnerability-in-geoserver/","publisher":"eye-security","context":"The article cites Eye Security's research describing how the file-read issue can be chained with other GeoServer flaws for unauthenticated remote code execution.","category":"research","primary":true},{"title":"CVE-2026-129245 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-hgm3-wq4h-8vvq","publisher":"geoserver","context":"The article links this advisory for the predictable hard-coded signing key in GeoServer's remember-me function.","category":"advisory","primary":false},{"title":"CVE-2026-120704 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-wc3v-48j7-xf57","publisher":"geoserver","context":"The article links this advisory for the administrator-controlled JDBC configuration issue that can enable code execution.","category":"advisory","primary":false},{"title":"CVE-2026-129244 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-4v26-c537-jvxc","publisher":"geoserver","context":"The article links this advisory for the stored-query exception that reveals the GeoServer data-directory path.","category":"advisory","primary":false},{"title":"CVE-2026-129242 GeoServer Security Advisory","url":"https://github.com/geoserver/geoserver/security/advisories/GHSA-9wf2-fcgq-vxhq","publisher":"geoserver","context":"The article links this advisory for JDBC user and role service deserialization that can allow administrator code execution.","category":"advisory","primary":false},{"title":"GeoServer Pre-Auth RCE Analysis","url":"https://cryptocat.me/blog/research/analysis/geoserver_preauth_rce/","publisher":"jonah-burgess-cryptocat","context":"The article cites Jonah Burgess's technical analysis of the five-step unauthenticated GeoServer command-execution chain.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting two recently patched GeoServer flaws, CVE-2026-120705 and CVE-2026-129243, according to watchTowr. The first flaw can let an unauthenticated attacker read local text files available to the GeoServer process or retrieve attacker-selected web addresses through a Web Feature Service request. The second can let an unauthenticated attacker invoke operations that would normally be protected by GeoServer service-security rules.\u003c/p\u003e\n\n\u003cp\u003eResearchers reported that CVE-2026-120705 can be combined with other GeoServer issues to achieve remote code execution without authentication. One described chain uses file disclosure to obtain administrator password data and a predictable signing key, forges an administrator session cookie, and then abuses a JDBC configuration to run code. GeoServer users are advised to update to versions 2.27.7, 2.28.6, or 3.0.2 as soon as possible.\u003c/p\u003e\n"},{"n":9,"title":"Palo Alto Networks warns of Fragnesia flaw exploited in PAN-OS attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/palo-alto-networks-warns-of-fragnesia-flaw-exploited-in-pan-os-attacks/","time":"22:05","priority":"MUST READ","score":95,"tldr":"Palo Alto Networks warns that internet-exposed PAN-OS management interfaces are being targeted through a chain of PHP2Shell flaws and the Fragnesia Linux privilege-escalation bug, enabling root-level compromise. Administrators should apply PAN-OS patches and restrict management access to trusted internal IP addresses.","briefOverview":"\u003cp\u003ePalo Alto Networks warns that threat actors are targeting PAN-OS devices whose management interfaces are exposed to the internet. The observed attacks chain the PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, with the Fragnesia Linux kernel flaw, CVE-2026-46300. This combination can first allow unauthenticated remote code execution as a PHP web worker and then elevate access to root.\u003c/p\u003e\n\n\u003cp\u003ePalo Alto Networks says all observed exploitation involved publicly exposed management interfaces, contrary to its recommended administrative-access practices. It has released Fragnesia fixes for PAN-OS 10.2, 11.1, 11.2, 12.1, and 12.2, with patch builds varying by release. The company says systems already updated for PHP2Shell should be protected from this attack chain and recommends restricting any required remote management access to trusted internal IP addresses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks says attackers have targeted PAN-OS devices with management interfaces exposed to the public internet by chaining PHP2Shell flaws with the Fragnesia Linux kernel flaw.","PHP2Shell refers to CVE-2026-109618 and CVE-2026-109619, which allow unauthenticated remote code execution with the PHP web worker's privileges.","Fragnesia, tracked as CVE-2026-46300, can allow a low-privileged local attacker to gain root-level permissions through the Linux kernel's XFRM ESP-in-TCP subsystem.","Palo Alto Networks released PAN-OS fixes for Fragnesia across versions 10.2, 11.1, 11.2, 12.1, and 12.2.","The company recommends installing security updates and restricting remote management access to trusted internal IP addresses."],"insights":["Applying updates that remediate the PHP2Shell flaws should protect PAN-OS devices from this specific attack chain, even though Fragnesia is also involved.","Palo Alto Networks says every observed PAN-OS compromise attempt involved a management interface exposed directly to the public internet, making access restriction a particularly important mitigation.","The company states that chaining PHP2Shell with Fragnesia is the only known way to exploit Fragnesia and that it is not aware of another exploitation path."],"referencedReports":[{"title":"PAN-SA-2026-0015","url":"https://security.paloaltonetworks.com/PAN-SA-2026-0015","publisher":"palo-alto-networks","context":"Palo Alto Networks' security bulletin confirms observed targeting of internet-exposed PAN-OS management interfaces and provides patch guidance for Fragnesia.","category":"advisory","primary":true}],"body":"\u003cp\u003ePalo Alto Networks warns that threat actors are targeting PAN-OS devices whose management interfaces are exposed to the internet. The observed attacks chain the PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, with the Fragnesia Linux kernel flaw, CVE-2026-46300. This combination can first allow unauthenticated remote code execution as a PHP web worker and then elevate access to root.\u003c/p\u003e\n\n\u003cp\u003ePalo Alto Networks says all observed exploitation involved publicly exposed management interfaces, contrary to its recommended administrative-access practices. It has released Fragnesia fixes for PAN-OS 10.2, 11.1, 11.2, 12.1, and 12.2, with patch builds varying by release. The company says systems already updated for PHP2Shell should be protected from this attack chain and recommends restricting any required remote management access to trusted internal IP addresses.\u003c/p\u003e\n"},{"n":22,"title":"Hackers Exploited CVSS 10.0 Hex.pm RCE Flaw to Compromise 6 Package Registry Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploited-cvss-100-hexpm-rce.html","time":"09:06","priority":"MUST READ","score":94,"tldr":"Attackers exploited CVE-2026-129514, a CVSS 10.0 unauthenticated remote code execution flaw in Hex.pm, to run OS commands on six package-registry servers. No package tampering was found, but account and private-package data may have been exposed, so Hex.pm users should reset passwords and MFA.","briefOverview":"\u003cp\u003eAn attacker exploited CVE-2026-129514, a CVSS 10.0 flaw in Hex.pm, to run operating-system commands on six production servers used by the package registry for Elixir and Erlang developers. The vulnerable code had existed since February 2016, but Hex.pm deployed a patch to all servers within roughly 15 minutes of the first malicious request. The team found no evidence that packages were modified, including among 23 releases published during the incident.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allowed unauthenticated POST requests to reach a request-body parser before routing or login checks. A crafted data structure caused an error, after which error-reporting code inspected it and ultimately called a function selected by the attacker through the Ecto and DBConnection libraries, enabling OS command execution. Although Hex.pm found no persistent access mechanisms or unauthorized cloud accounts, it cannot rule out access to account data, session information, two-factor authentication secrets, or private packages because some reads were not logged.\u003c/p\u003e\n\n\u003cp\u003eHex.pm invalidated sessions and access tokens and advises account holders to change passwords, reset two-factor authentication, reauthenticate clients, and watch for phishing. API keys do not need replacement, according to the team, because they are stored only as HMAC-SHA256 hashes of random 128-bit values. Until a new Hex client with an updated registry-signing system is released, users are advised to download packages only from repo.hex.pm and avoid third-party mirrors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker exploited CVE-2026-129514, a CVSS 10.0 flaw in Hex.pm’s request-body parser, to run operating-system commands on six production servers.","Hex.pm patched all servers within about 15 minutes of the first malicious request, and load balancer logs recorded 69 exploit requests from two addresses between 18:16 and 18:29 UTC.","The Hex.pm team found no evidence that packages were modified, including after comparing database records and reviewing the 23 releases published during the attack.","The team cannot rule out that the attacker accessed database or file-storage data, including email addresses, password hashes, two-factor authentication secrets, session data, and private packages.","Hex.pm logged out all account holders and advises them to change passwords, reset two-factor authentication, and watch for phishing."],"insights":["The vulnerable parser processed request bodies before routing and login checks, meaning an unauthenticated POST request to any Hex.pm address could reach the flaw.","The malicious input did not directly run commands; it triggered error-handling code that inspected the forged data and ultimately called an attacker-chosen function through the Ecto and DBConnection libraries.","Three servers became exposed during the incident because restarts brought them online with the still-vulnerable build, showing that patching needed to cover newly started systems as well as existing ones.","Hex.pm said API keys do not need replacement because they are stored only as HMAC-SHA256 hashes of random 128-bit values, while passwords should still be changed because weak bcrypt-hashed passwords may be guessed.","Until a new client and registry-signing system are released, users are advised to download packages only from repo.hex.pm and avoid third-party mirrors."],"referencedReports":[{"title":"Security Incident on Hex.pm","url":"https://hex.pm/blog/security-incident-on-hexpm","publisher":"hex.pm","context":"The article cites Hex.pm’s incident report for the timeline, exploit-request count, server impact, and post-incident investigation findings.","category":"news","primary":true},{"title":"GHSA-9pmm-hf4r-27pg","url":"https://github.com/hexpm/hexpm/security/advisories/GHSA-9pmm-hf4r-27pg","publisher":"hex.pm","context":"The article cites this security advisory for the affected timeframe and the decoder fix for CVE-2026-129514.","category":"advisory","primary":true},{"title":"CVE-2026-124283","url":"https://cna.erlef.org/cves/CVE-2026-124283.html","publisher":"Erlang Ecosystem Foundation CNA","context":"The article references the Ash advisory for the conditions required to exploit its struct-related flaw.","category":"advisory","primary":false},{"title":"GHSA-gmmq-fw75-wq46","url":"https://github.com/elixir-ecto/db_connection/security/advisories/GHSA-gmmq-fw75-wq46","publisher":"DBConnection maintainers","context":"The article cites the DBConnection advisory stating that the flaw is not exploitable in DBConnection alone.","category":"advisory","primary":false},{"title":"CVE-2026-130411","url":"https://cna.erlef.org/cves/CVE-2026-130411.html","publisher":"Erlang Ecosystem Foundation CNA","context":"The article references the Flop advisory for exploitation conditions involving pagination cursors.","category":"advisory","primary":false}],"body":"\u003cp\u003eAn attacker exploited CVE-2026-129514, a CVSS 10.0 flaw in Hex.pm, to run operating-system commands on six production servers used by the package registry for Elixir and Erlang developers. The vulnerable code had existed since February 2016, but Hex.pm deployed a patch to all servers within roughly 15 minutes of the first malicious request. The team found no evidence that packages were modified, including among 23 releases published during the incident.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allowed unauthenticated POST requests to reach a request-body parser before routing or login checks. A crafted data structure caused an error, after which error-reporting code inspected it and ultimately called a function selected by the attacker through the Ecto and DBConnection libraries, enabling OS command execution. Although Hex.pm found no persistent access mechanisms or unauthorized cloud accounts, it cannot rule out access to account data, session information, two-factor authentication secrets, or private packages because some reads were not logged.\u003c/p\u003e\n\n\u003cp\u003eHex.pm invalidated sessions and access tokens and advises account holders to change passwords, reset two-factor authentication, reauthenticate clients, and watch for phishing. API keys do not need replacement, according to the team, because they are stored only as HMAC-SHA256 hashes of random 128-bit values. Until a new Hex client with an updated registry-signing system is released, users are advised to download packages only from repo.hex.pm and avoid third-party mirrors.\u003c/p\u003e\n"},{"n":24,"title":"Hackers Compromise 24 Check Point Management Servers in Suspected AI-Driven Attack Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-compromise-24-check-point.html","time":"06:50","priority":"MUST READ","score":94,"tldr":"GreyNoise says an unidentified actor dubbed GT13 compromised 24 Check Point Security Management servers across 22 organizations, using suspected AI-assisted tooling to automate scanning, exploitation, reconnaissance, and lateral movement. Organizations should urgently apply Check Point’s patches and restrict and monitor management-server access.","briefOverview":"\u003cp\u003eGreyNoise reported that an unknown actor it calls GT13 targeted Check Point Security Management servers at 22 organizations worldwide, compromising 24 servers between October 17 and November 2, 2026. The affected sectors include financial services, energy, government, transportation, mining, engineering, and manufacturing. GT13 used 99 IP addresses, primarily ExpressVPN exit points or compromised Check Point devices, during more than 1,400 network sessions.\u003c/p\u003e\n\n\u003cp\u003eGreyNoise suspects the actor uses AI-enabled systems to automate finding and exploiting weaknesses and interacting with compromised systems. The attackers used tools including Nmap, Chisel, Impacket, Paramiko, and Python scripts for internal discovery, gaining higher access, and moving through victim networks. In one environment, they used the patched CVE-2026-16232 flaw to steal firewall databases and internal certificate authority files, create a certificate, unload security policies, and attempt to reach other enterprise systems; Check Point urged customers to apply updates and follow its management-access hardening guidance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GreyNoise tracked an unidentified threat actor called GT13 that targeted Check Point Security Management servers at 22 organizations worldwide between October 17 and November 2, 2026.","The campaign affected 24 Check Point management servers and used 99 IP addresses, including ExpressVPN exit points and compromised Check Point devices, across more than 1,400 network sessions.","GreyNoise suspects GT13 uses AI-enabled systems to automate vulnerability scanning, exploitation, and interaction with compromised assets, though the campaign has not been attributed to a known group.","GT13 used tools including Nmap, Chisel, Impacket, Paramiko, and Python scripts for internal reconnaissance, privilege escalation, and lateral movement.","In one victim environment, the attackers used CVE-2026-16232 to steal firewall databases and internal certificate authority files, create a certificate, unload security policies, and attempt movement to other systems."],"insights":["GT13 had access to the Check Point management servers before it compromised the Rejetto HFS server, indicating the HFS server was used later as an operational relay rather than as the initial entry point into those Check Point environments.","The actor used a previously disclosed and patched Check Point flaw, CVE-2026-16232, to launch more than 100 management tasks across multiple servers, underscoring that available fixes had not prevented the observed post-compromise activity.","By stealing internal certificate authority files and creating a new certificate, the attackers sought control over a trust mechanism within at least one victim environment.","The actor attempted to unload security policies, which would effectively disable firewall protections while it performed internal reconnaissance and tried to move to other systems.","Most of the 99 IP addresses used in the campaign were disposable infrastructure, while some were compromised Check Point devices, making the victims' own systems part of the campaign's operational infrastructure."],"referencedReports":[{"title":"Check Point Security Management Servers Intrusion Campaign","url":"https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign","publisher":"greynoise","context":"The article relies on GreyNoise's tracking and analysis of the GT13 campaign targeting Check Point Security Management servers.","category":"research","primary":true}],"body":"\u003cp\u003eGreyNoise reported that an unknown actor it calls GT13 targeted Check Point Security Management servers at 22 organizations worldwide, compromising 24 servers between October 17 and November 2, 2026. The affected sectors include financial services, energy, government, transportation, mining, engineering, and manufacturing. GT13 used 99 IP addresses, primarily ExpressVPN exit points or compromised Check Point devices, during more than 1,400 network sessions.\u003c/p\u003e\n\n\u003cp\u003eGreyNoise suspects the actor uses AI-enabled systems to automate finding and exploiting weaknesses and interacting with compromised systems. The attackers used tools including Nmap, Chisel, Impacket, Paramiko, and Python scripts for internal discovery, gaining higher access, and moving through victim networks. In one environment, they used the patched CVE-2026-16232 flaw to steal firewall databases and internal certificate authority files, create a certificate, unload security policies, and attempt to reach other enterprise systems; Check Point urged customers to apply updates and follow its management-access hardening guidance.\u003c/p\u003e\n"},{"n":38,"title":"PolinRider Malware Force-Pushed Into AsyncAPI, CircuitVerse and Open Food Facts Pull Requests","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests","time":"22:13","priority":"MUST READ","score":94,"tldr":"PolinRider malware was stealthily force-pushed into open GitHub pull requests from a compromised account, where it ran in CI at CircuitVerse and Open Food Facts and briefly produced potentially infected build artifacts. The campaign has spread across hundreds of repositories, uses Ethereum wallet data to locate command servers, and can steal developer credentials to propagate through GitHub.","briefOverview":"\u003cp\u003eGitHub suspended the account \u003ccode\u003eEternity0207\u003c/code\u003e and removed its pull requests after it force-pushed obfuscated PolinRider malware into still-open pull requests at AsyncAPI Generator, CircuitVerse, and Open Food Facts. The malicious commits briefly replaced clean pull-request revisions before later force-pushes restored clean-looking final diffs, and none of the account’s 145 merged pull requests contained the loader. The campaign affected CI: CircuitVerse confirmed the loader ran in desktop release builds and deleted 40 published installers, while Open Food Facts CI also ran poisoned commits; AsyncAPI’s approval requirement prevented execution.\u003c/p\u003e\n\n\u003cp\u003eThe loader was hidden in files such as \u003ccode\u003eapi.js\u003c/code\u003e, Jest and PostCSS configuration files, and a fake font file launched by a hidden VS Code task. It reads changing server addresses from Ethereum wallet \u003ccode\u003e0x1eef0849eda15d87f64e51c73c8442cf3c8bcef3\u003c/code\u003e, downloads additional code over plain HTTP on port 443, and starts background Node.js processes. A GitHub search review found the loader in 576 repositories across 311 accounts, and reported later stages can steal saved credentials and use GitHub access to spread through additional repositories.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The GitHub account Eternity0207 force-pushed obfuscated PolinRider loader code into open pull requests at AsyncAPI Generator, CircuitVerse, and Open Food Facts on October 19, 2026, before replacing it with clean-looking revisions.","CircuitVerse confirmed that its pull-request workflows ran the loader and published 40 desktop installers that were later deleted, while Open Food Facts CI also ran poisoned commits and AsyncAPI's approval requirement prevented its CI from running them.","The PolinRider loader obtains a server address from Ethereum wallet 0x1eef0849eda15d87f64e51c73c8442cf3c8bcef3, downloads additional code over plain HTTP on port 443, and starts background Node.js processes.","A review of GitHub search results found the loader in 576 repositories across 311 GitHub accounts, with most decoded copies using the same Ethereum wallet.","None of the 145 pull requests from Eternity0207 that had been merged contained the loader; the malicious code appeared only in rewritten commits on still-open pull requests."],"insights":["The malicious code was deliberately hidden after hundreds of tab characters or appended after normal configuration code, allowing GitHub’s visual diff to make an added line appear empty.","The attacker reused the message and date of legitimate signed commits, but the malicious replacements were unsigned and used a different committer name, providing a review signal beyond the final code diff.","Blocking package-install scripts would not have prevented this campaign because the loader was triggered through build and development commands, test or build configuration files, or an automatically run VS Code folder-open task.","GitHub’s fork pull-request restrictions prevented repository secrets from being exposed, but they did not prevent malicious code from running, making outbound network monitoring and approval controls important.","The loader’s use of a public Ethereum wallet to publish changing server addresses means blocking a single server address is insufficient; blocking the build-time requests used to read the wallet can stop it earlier."],"referencedReports":[{"title":"Payload analysis and decoders","url":"https://gist.github.com/derberg/1d438e1c3f08d43e41b25bb77aa3f0eb","publisher":"Lukasz Gornicki (AsyncAPI)","context":"The article states that it statically decoded the PolinRider payloads using the AsyncAPI maintainer's published decoders and links this payload analysis.","category":"research","primary":true},{"title":"The Take-Home Test That Runs on Your Work Laptop: Inside the AccuraSoftHire Fake Interview Campaign","url":"https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines","publisher":"StepSecurity","context":"The article links this prior campaign analysis to support its finding that the PolinRider wallet and the AccuraSoftHire fake-interview campaign share an operator.","category":"research","primary":false}],"body":"\u003cp\u003eGitHub suspended the account \u003ccode\u003eEternity0207\u003c/code\u003e and removed its pull requests after it force-pushed obfuscated PolinRider malware into still-open pull requests at AsyncAPI Generator, CircuitVerse, and Open Food Facts. The malicious commits briefly replaced clean pull-request revisions before later force-pushes restored clean-looking final diffs, and none of the account’s 145 merged pull requests contained the loader. The campaign affected CI: CircuitVerse confirmed the loader ran in desktop release builds and deleted 40 published installers, while Open Food Facts CI also ran poisoned commits; AsyncAPI’s approval requirement prevented execution.\u003c/p\u003e\n\n\u003cp\u003eThe loader was hidden in files such as \u003ccode\u003eapi.js\u003c/code\u003e, Jest and PostCSS configuration files, and a fake font file launched by a hidden VS Code task. It reads changing server addresses from Ethereum wallet \u003ccode\u003e0x1eef0849eda15d87f64e51c73c8442cf3c8bcef3\u003c/code\u003e, downloads additional code over plain HTTP on port 443, and starts background Node.js processes. A GitHub search review found the loader in 576 repositories across 311 accounts, and reported later stages can steal saved credentials and use GitHub access to spread through additional repositories.\u003c/p\u003e\n"},{"n":2,"title":"CISA warns of critical unpatched flaw in Danfoss refrigeration controllers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-critical-unpatched-flaw-in-danfoss-refrigeration-controllers/","time":"16:13","priority":"MUST READ","score":91,"tldr":"CISA warns that Danfoss AK-SM 8xxA refrigeration controllers contain an unpatched critical flaw (CVE-2026-129713) that could allow unauthenticated remote code execution. Organizations should keep affected controllers off the public internet, segment them from business networks, and use VPN-based remote access until Danfoss releases version 5.5.x.","briefOverview":"\u003cp\u003eCISA has warned of CVE-2026-129713, a critical 9.8-rated stack-based buffer overflow affecting Danfoss AK-SM 8xxA Series controllers used by food retailers to manage commercial refrigeration, HVAC, and lighting. The flaw can be triggered without authentication, causing the controller server to restart and potentially allowing remote code execution with the web server’s privileges. Danfoss calls the affected product family the AK-SM 800A Series, including the 820A, 850A, and 880A models.\u003c/p\u003e\n\n\u003cp\u003eNo patch is currently available, although Danfoss said the issue will be addressed in an upcoming 5.5.x release that will also remove the option to disable Strict mode. CISA recommends keeping controllers off the public internet, separating them from business networks with firewalls, and using up-to-date VPNs for required remote access. The warning follows recent attacks across Europe in which attackers remotely shut down refrigeration equipment or changed settings at supermarkets, food retailers, and a supplier serving the French national blood service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that Danfoss AK-SM 8xxA Series refrigeration controllers are affected by CVE-2026-129713, a critical stack-based buffer overflow rated 9.8.","The unpatched flaw can be triggered without authentication, potentially restarting the controller server or allowing remote code execution with the web server’s privileges.","Danfoss said CVE-2026-129713 will be addressed in an upcoming 5.5.x software release, but no patch is currently available.","CISA recommends keeping controllers off the public internet, separating control systems from business networks with firewalls, and using current VPNs for necessary remote access.","Recent attacks in Europe remotely changed or shut down refrigeration equipment at supermarkets, food retailers, and a supplier serving the French national blood service."],"insights":["The planned Danfoss 5.5.x update will not only address the flaw but also remove customers’ ability to disable the product’s “Strict mode.”","The affected controllers can manage not only refrigeration but, depending on the model, store lighting and HVAC, expanding the possible operational effects of a compromise.","CISA says the controllers are deployed worldwide, but the number of installations is unknown, making the overall exposure difficult to quantify.","A supplier said the November supermarket disruptions involved the same vulnerability seen in October attacks in France, indicating repeated targeting of Danfoss systems before a patch is available."],"referencedReports":[{"title":"ICSA-26-328-03","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-26-328-03","publisher":"cisa","context":"The article cites CISA’s industrial control systems advisory for details on the worldwide deployment of the affected Danfoss controllers.","category":"advisory","primary":true},{"title":"DSA-2026-12-01","url":"http://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2026-12-01","publisher":"danfoss","context":"The article cites Danfoss’s security advisory stating that an upcoming 5.5.x release will address CVE-2026-129713.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has warned of CVE-2026-129713, a critical 9.8-rated stack-based buffer overflow affecting Danfoss AK-SM 8xxA Series controllers used by food retailers to manage commercial refrigeration, HVAC, and lighting. The flaw can be triggered without authentication, causing the controller server to restart and potentially allowing remote code execution with the web server’s privileges. Danfoss calls the affected product family the AK-SM 800A Series, including the 820A, 850A, and 880A models.\u003c/p\u003e\n\n\u003cp\u003eNo patch is currently available, although Danfoss said the issue will be addressed in an upcoming 5.5.x release that will also remove the option to disable Strict mode. CISA recommends keeping controllers off the public internet, separating them from business networks with firewalls, and using up-to-date VPNs for required remote access. The warning follows recent attacks across Europe in which attackers remotely shut down refrigeration equipment or changed settings at supermarkets, food retailers, and a supplier serving the French national blood service.\u003c/p\u003e\n"},{"n":16,"title":"Com-Affiliated Hackers Hijack Cloud Accounts via Vishing for Data Theft and Extortion","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/com-affiliated-hackers-hijack-cloud.html","time":"06:37","priority":"SHOULD READ","score":88,"tldr":"Com-affiliated groups are using IT-support vishing and adversary-in-the-middle phishing pages to steal cloud credentials and MFA sessions, establish persistence, and exfiltrate Microsoft 365 data for extortion. The campaigns target data-rich organizations in the U.S., U.K., and Australia, with some actors also deploying a malicious Chrome extension for credential theft and remote browser control.","briefOverview":"\u003cp\u003ePalo Alto Networks Unit 42 reported numerous vishing campaigns by Com-affiliated threat actors since August 2026 that led to data theft and extortion attempts. The groups, including Bling Libra, CL-CRI-1264, CL-CRI-1274, and CL-CRI-1192, targeted organizations in financial services, healthcare, legal services, and other sectors across the United States, United Kingdom, and Australia. Victims commonly held large amounts of sensitive corporate data whose exposure could bring regulatory, legal, or market consequences.\u003c/p\u003e\n\n\u003cp\u003eThe attackers impersonated internal IT staff and sent employees to organization-specific fake login pages that captured credentials and authenticated sessions in real time. They then enrolled their own MFA devices, generated temporary cloud credentials, approved unauthorized OAuth applications, altered mailbox rules, cleared security alerts, and collected data from services such as Microsoft 365, OneDrive, SharePoint, and Salesforce. CL-CRI-1264 used Python scripts for automated data theft and sent extortion messages through Microsoft Teams, while CL-CRI-1192 used a malicious browser extension capable of keylogging, cookie theft, webcam streaming, and remote browser control.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 said the actors mainly relied on native cloud utilities rather than custom tools and were shifting away from file encryption while still pursuing extortion. A shared adversary-in-the-middle phishing kit called Doko\u0026rsquo;s Panel was used to steal authenticated sessions and access connected software-as-a-service platforms. The activity shows how stolen cloud accounts can be used both to take sensitive data and to send threats from within an affected organization\u0026rsquo;s own communication systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks Unit 42 reported numerous vishing campaigns by Com-affiliated actors since August 2026 that resulted in data theft and extortion attempts.","The campaigns targeted financial services, healthcare, legal services, and other sectors in the United States, United Kingdom, and Australia.","Attackers impersonated IT staff, directed employees to organization-specific phishing pages, captured credentials and authenticated sessions, and enrolled unauthorized MFA devices for persistence.","CL-CRI-1264 used Python scripts to automate collection of Microsoft 365 mailbox, OneDrive, and SharePoint data, then sent extortion messages through Microsoft Teams.","Unit 42 observed CL-CRI-1192 using a sideloaded malicious browser extension called Google Chrome that can log keystrokes, steal account data, capture QR-code login tokens, stream webcam feeds, and remotely control browsers."],"insights":["The targeting pattern shifted quickly: financial services were targeted about twice as often as healthcare in August 2026, but healthcare became the more targeted sector in September.","CL-CRI-1264 often enrolled an unauthorized MFA device within minutes of access and reused the device name \"Pixel 10a\" across compromised accounts, providing a concrete persistence indicator.","The actors relied primarily on legitimate cloud utilities and Microsoft Graph activity rather than custom tools, while limiting malware execution and persistence deployments.","Extortion messages were sent from compromised accounts through internal Microsoft Teams and email, making the threats appear to come from within the victim organization.","The Doko's Panel phishing-kit operator was reportedly recruiting fluent English-speaking callers on Telegram and advertising six-to-seven-figure weekly returns, indicating a specialized vishing-for-hire ecosystem."],"referencedReports":[{"title":"Com-Affiliated Vishing Attacks","url":"https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/","publisher":"palo-alto-networks-unit-42","context":"The article relies on Unit 42's disclosure of vishing campaigns by Com-affiliated groups targeting cloud accounts for data theft and extortion.","category":"research","primary":true},{"title":"Inside the Criminal Phishing Panel","url":"https://pushsecurity.com/blog/inside-criminal-phishing-panel","publisher":"push-security","context":"The article cites a Push Security report describing the Doko's Panel operator recruiting experienced English-speaking vishing callers through Telegram.","category":"research","primary":false}],"body":"\u003cp\u003ePalo Alto Networks Unit 42 reported numerous vishing campaigns by Com-affiliated threat actors since August 2026 that led to data theft and extortion attempts. The groups, including Bling Libra, CL-CRI-1264, CL-CRI-1274, and CL-CRI-1192, targeted organizations in financial services, healthcare, legal services, and other sectors across the United States, United Kingdom, and Australia. Victims commonly held large amounts of sensitive corporate data whose exposure could bring regulatory, legal, or market consequences.\u003c/p\u003e\n\n\u003cp\u003eThe attackers impersonated internal IT staff and sent employees to organization-specific fake login pages that captured credentials and authenticated sessions in real time. They then enrolled their own MFA devices, generated temporary cloud credentials, approved unauthorized OAuth applications, altered mailbox rules, cleared security alerts, and collected data from services such as Microsoft 365, OneDrive, SharePoint, and Salesforce. CL-CRI-1264 used Python scripts for automated data theft and sent extortion messages through Microsoft Teams, while CL-CRI-1192 used a malicious browser extension capable of keylogging, cookie theft, webcam streaming, and remote browser control.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 said the actors mainly relied on native cloud utilities rather than custom tools and were shifting away from file encryption while still pursuing extortion. A shared adversary-in-the-middle phishing kit called Doko\u0026rsquo;s Panel was used to steal authenticated sessions and access connected software-as-a-service platforms. The activity shows how stolen cloud accounts can be used both to take sensitive data and to send threats from within an affected organization\u0026rsquo;s own communication systems.\u003c/p\u003e\n"},{"n":11,"title":"Microsoft: China’s Salt Typhoon hackers are using Artex ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-china-salt-typhoon-using-artex-ai-tool","time":"21:18","priority":"SHOULD READ","score":87,"tldr":"Microsoft says Chinese state-backed groups including Salt Typhoon and Crystal Typhoon are using the AI-powered Artex framework to automate reconnaissance, credential attacks, web exploitation, and supply-chain compromises at machine speed.","briefOverview":"\u003cp\u003eMicrosoft reported that Chinese state-backed groups Salt Typhoon and Crystal Typhoon are using the AI-powered Artex platform for network reconnaissance, credential attacks, and web application exploitation. The company said Artex has also been abused to search public repositories for exposed secrets, support supply-chain compromise, and scan internet-facing systems. North Korean groups have also steadily added the tool since its July release.\u003c/p\u003e\n\n\u003cp\u003eArtex uses AI agents to pursue attacker-defined goals and can move from reconnaissance to persistent, privileged access in minutes, according to Microsoft. It relies on existing penetration-testing tools and techniques rather than introducing new ones, but can execute requests, retries, and next-stage actions at machine speed. Microsoft said defenders can identify its use through unusually large, rapid bursts of varied traffic from a single source, since attackers may change simple indicators such as IP addresses and user-agent strings. The FBI separately warned that Artex is being used by cybercriminals and nation-state actors against government agencies and organizations across dozens of critical sectors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that Chinese state-backed groups Salt Typhoon and Crystal Typhoon have incorporated the AI-powered Artex platform into their toolsets for network reconnaissance, credential attacks, and web application exploitation.","Microsoft said Artex can automate multiple stages of an intrusion and progress from reconnaissance to persistent privileged access within minutes.","Microsoft reported recent Artex-abuse campaigns that searched public code repositories for exposed secrets, enabled supply-chain compromise, and scanned internet-facing systems for exploitation.","The FBI warned two weeks earlier that cybercriminals and nation-state actors were using Artex to breach government agencies and organizations across dozens of critical sectors worldwide.","Microsoft said the most reliable indicator of Artex activity is behavioral, including a large volume of varied requests and rapid retries or next-stage actions from a single source."],"insights":["Artex does not introduce new hacking methods; its significance is that it combines existing penetration-testing tools and techniques into an AI-driven workflow that can operate at machine speed.","Microsoft says defenders should prioritize behavioral signs such as rapid, varied requests and high traffic volume from one source, because attackers can easily change simple indicators such as IP addresses and browser-identification strings.","Although the original developer removed Artex source code from GitHub, copies were quickly made and at least one Chinese company now offers commercial access to a version of the tool.","Microsoft said Artex does not hide its activity by default, creating an opportunity to detect it through unusually intense bursts of automated activity."],"referencedReports":[{"title":"What defenders need to know: ARTEX agentic AI framework threat actors abuse","url":"https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/","publisher":"microsoft","context":"Microsoft's technical report is the primary basis for the article's account of Salt Typhoon, Crystal Typhoon, and other actors abusing Artex.","category":"research","primary":true},{"title":"FBI Flash Alert on Artex AI Tool","url":"https://therecord.media/artex-ai-tool-fbi-flash-alert","publisher":"fbi","context":"The article says the FBI issued an advisory warning that Artex was being used by cybercriminals and nation-state actors against government agencies and critical sectors.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft reported that Chinese state-backed groups Salt Typhoon and Crystal Typhoon are using the AI-powered Artex platform for network reconnaissance, credential attacks, and web application exploitation. The company said Artex has also been abused to search public repositories for exposed secrets, support supply-chain compromise, and scan internet-facing systems. North Korean groups have also steadily added the tool since its July release.\u003c/p\u003e\n\n\u003cp\u003eArtex uses AI agents to pursue attacker-defined goals and can move from reconnaissance to persistent, privileged access in minutes, according to Microsoft. It relies on existing penetration-testing tools and techniques rather than introducing new ones, but can execute requests, retries, and next-stage actions at machine speed. Microsoft said defenders can identify its use through unusually large, rapid bursts of varied traffic from a single source, since attackers may change simple indicators such as IP addresses and user-agent strings. The FBI separately warned that Artex is being used by cybercriminals and nation-state actors against government agencies and organizations across dozens of critical sectors.\u003c/p\u003e\n"},{"n":1,"title":"1Password customer data stolen after employee GitHub account breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/","time":"21:33","priority":"SHOULD READ","score":82,"tldr":"1Password says an attacker compromised an employee’s GitHub account, injected malicious code into backend services, and stole limited customer account metadata and internal source code. Password vaults, encryption keys, and customer login credentials were not compromised, but affected users should watch for phishing using stolen invitation or recovery details.","briefOverview":"\u003cp\u003e1Password disclosed that an attacker compromised an employee’s corporate GitHub account and used it to access private source-code repositories. The attacker injected malicious code into backend services that downloaded customer account records. The stolen information included customer names and email addresses, account and user IDs, account timestamps, public cryptographic keys, Secure Remote Password parameters, and certain invitation and account-recovery tokens. The attacker also stole internal source code and accessed 1Password’s CI/CD environment.\u003c/p\u003e\n\n\u003cp\u003e1Password said customer password vaults and the encryption keys protecting them were not compromised, and it found no internal evidence of account takeovers. The company said only a small number of users were affected and notified them individually; invitation and recovery tokens could not alone grant access because SSO authentication or a verification code sent to the registered email address was also required. As a precaution, 1Password changed these codes from six numeric digits to ten alphanumeric characters, disabled the compromised GitHub account, restored clean services, and rotated or revoked potentially exposed infrastructure credentials. The company warned customers to be alert for phishing messages that use the stolen information to request passwords, Secret Keys, or verification codes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["1Password said an attacker compromised an employee’s corporate GitHub account and used it to access private source code repositories and inject malicious code into backend services.","The attacker downloaded customer account records containing names, email addresses, account and user IDs, account timestamps, public cryptographic keys, SRP parameters, certain invitation and recovery tokens, and other internal account metadata.","1Password said customer password vaults and the encryption keys protecting them were not compromised, and it found no internal evidence of customer account takeovers.","The company said only a small number of users were affected and individually notified, and it increased recovery and invitation verification codes from six numeric digits to ten alphanumeric characters.","1Password disabled the compromised GitHub account, revoked the stolen token, restored clean service versions, and rotated or revoked potentially exposed infrastructure credentials."],"insights":["The stolen invitation and account-recovery tokens could not by themselves grant account access because completing those processes also required single sign-on authentication or a verification code sent to the user’s registered email address.","1Password strengthened invitation and recovery verification codes from six numeric digits to ten alphanumeric characters specifically as a precaution against brute-force attempts.","Although password vaults were not taken, the stolen customer names and email addresses can enable targeted phishing messages that impersonate 1Password and reference the breach.","1Password did not require customers to change their account passwords or Secret Keys, but advised them to access accounts directly through its website or app rather than links in unexpected messages.","The attacker’s access to the CI/CD environment potentially exposed internal infrastructure credentials, which 1Password said it rotated or revoked as part of remediation."],"referencedReports":[],"body":"\u003cp\u003e1Password disclosed that an attacker compromised an employee’s corporate GitHub account and used it to access private source-code repositories. The attacker injected malicious code into backend services that downloaded customer account records. The stolen information included customer names and email addresses, account and user IDs, account timestamps, public cryptographic keys, Secure Remote Password parameters, and certain invitation and account-recovery tokens. The attacker also stole internal source code and accessed 1Password’s CI/CD environment.\u003c/p\u003e\n\n\u003cp\u003e1Password said customer password vaults and the encryption keys protecting them were not compromised, and it found no internal evidence of account takeovers. The company said only a small number of users were affected and notified them individually; invitation and recovery tokens could not alone grant access because SSO authentication or a verification code sent to the registered email address was also required. As a precaution, 1Password changed these codes from six numeric digits to ten alphanumeric characters, disabled the compromised GitHub account, restored clean services, and rotated or revoked potentially exposed infrastructure credentials. The company warned customers to be alert for phishing messages that use the stolen information to request passwords, Secret Keys, or verification codes.\u003c/p\u003e\n"},{"n":5,"title":"Hackers reportedly breached CIA intelligence analysis system","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-reportedly-breached-cia-intelligence-analysis-system/","time":"07:45","priority":"SHOULD READ","score":82,"tldr":"Unknown attackers reportedly breached a CIA open-source intelligence analysis system using the ARTEX AI-powered penetration-testing framework, with ODNI and NGA also affected. Officials said no classified networks or information were exposed.","briefOverview":"\u003cp\u003eUnknown attackers reportedly breached an open-source intelligence analysis system at the U.S. Central Intelligence Agency, according to a source cited by The New York Times. The source said the attackers used ARTEX, an AI-powered penetration-testing framework, and that the Office of the Director of National Intelligence and National Geospatial-Intelligence Agency were also affected. The CIA and ODNI had not responded to requests for further details.\u003c/p\u003e\n\n\u003cp\u003eAccording to the source, the breach did not involve classified CIA networks or classified information, and no other systems were believed to be at risk. Separately, the Treasury Department’s Financial Crimes Enforcement Network disclosed unauthorized access to a limited subset of its systems and took some systems offline as a precaution. The article places these incidents among other recent reported cyberattacks affecting U.S. agencies, including Treasury offices and the FBI’s National Crime Information Center.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown attackers reportedly breached a CIA system used for open-source intelligence analysis, according to a source familiar with the matter.","The New York Times reported that the incident allegedly involved the ARTEX AI-powered penetration-testing framework and also affected the Office of the Director of National Intelligence and the National Geospatial-Intelligence Agency.","A source said the breach did not involve classified CIA networks or classified information, and no other systems were currently at risk.","FinCEN separately disclosed that it is investigating unauthorized access to a limited subset of its systems and took some systems offline as a precaution.","The article notes several recent reported cyber incidents affecting U.S. agencies, including Treasury offices and the FBI’s National Crime Information Center."],"insights":["The reported CIA incident was limited to an open-source intelligence system rather than classified networks, illustrating that a breach of a government intelligence organization does not necessarily mean secret material was exposed.","FinCEN’s precautionary decision to take some systems offline affected how banks submit reports, requiring use of the Financial Institutions Hotline while services may be unavailable.","The incidents described span intelligence, financial-crime, sanctions, and law-enforcement organizations, showing that reported cyber disruptions have affected multiple distinct U.S. government functions.","The article identifies ARTEX as the reportedly used AI-powered penetration-testing framework, but does not identify the attackers or state that any data was stolen."],"referencedReports":[],"body":"\u003cp\u003eUnknown attackers reportedly breached an open-source intelligence analysis system at the U.S. Central Intelligence Agency, according to a source cited by The New York Times. The source said the attackers used ARTEX, an AI-powered penetration-testing framework, and that the Office of the Director of National Intelligence and National Geospatial-Intelligence Agency were also affected. The CIA and ODNI had not responded to requests for further details.\u003c/p\u003e\n\n\u003cp\u003eAccording to the source, the breach did not involve classified CIA networks or classified information, and no other systems were believed to be at risk. Separately, the Treasury Department’s Financial Crimes Enforcement Network disclosed unauthorized access to a limited subset of its systems and took some systems offline as a precaution. The article places these incidents among other recent reported cyberattacks affecting U.S. agencies, including Treasury offices and the FBI’s National Crime Information Center.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft confirms authentication issues after November updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-confirms-authentication-issues-after-november-updates/","time":"09:02","priority":"SHOULD READ","score":82,"tldr":"Microsoft says its November Windows security updates for CVE-2026-118737 can break NTLM authentication with some third-party proxies, SSO tools, and application packaging solutions. A temporary registry workaround is available, but Microsoft recommends updating affected products or moving to Kerberos-compatible authentication.","briefOverview":"\u003cp\u003eMicrosoft confirmed that its November security updates can cause authentication failures for some third-party applications and devices that use NTLM authentication. The updates address CVE-2026-118737, a high-severity flaw in the Windows Remote Procedure Call Runtime that could allow unauthenticated attackers to remotely run code on unpatched systems without user interaction. They also begin Microsoft’s NTLM message-signing improvements, intended to reduce relay-attack exposure by ensuring authenticated NTLM sessions establish a cryptographic session key and negotiate real message signing.\u003c/p\u003e\n\n\u003cp\u003eThe compatibility issue can affect authentication proxy servers, single sign-on solutions, and application packaging products that do not correctly implement the NTLM protocol. Microsoft said affected systems may show an NTLMSSP_CHALLENGE message with an empty Target Info List in network traces or a Target Machine value of \u0026ldquo;Not Found\u0026rdquo; in event logs. As a temporary workaround, customers can set the ClientAllowUnsignedNtlm registry value to 1, but Microsoft recommends updating affected products or using Kerberos-compatible authentication because the registry setting may be removed in the future.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that November security updates can cause authentication failures for some third-party applications and devices using NTLM authentication.","The updates address CVE-2026-118737, a high-severity Windows Remote Procedure Call Runtime flaw that unauthenticated attackers can exploit for remote code execution on unpatched systems.","The compatibility problem can affect authentication proxy servers, single sign-on solutions, and application packaging solutions that incorrectly implement NTLM protocol requirements.","Microsoft recommends using Kerberos where supported or obtaining vendor software or firmware updates compatible with the new NTLM signing requirements.","As a temporary workaround, Microsoft advises setting the ClientAllowUnsignedNtlm registry value to 1 on affected systems, while warning that this setting may be removed in the future."],"insights":["Affected organizations can identify this compatibility issue by looking for an NTLMSSP_CHALLENGE message with an empty Target Info List in network traces or a Target Machine value of “Not Found” in event logs.","Microsoft’s temporary registry workaround is not a dur
