<script type="application/json" id="dl-articles">[{"n":6,"title":"Hackers compromise Check Point Servers in 22 organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/","time":"16:15","priority":"MUST READ","score":94,"tldr":"GreyNoise found an ongoing campaign compromising 24 Check Point Security Management servers across 22 organizations, with attackers stealing sensitive firewall data, disabling policies, and attempting lateral movement. The initial access vector is unknown, but attackers abused the actively exploited Check Point SmartConsole authentication-bypass flaw CVE-2026-16232 after compromise.","briefOverview":"\u003cp\u003eGreyNoise reported that a threat actor it tracks as GT13 compromised 24 Check Point Security Management servers belonging to 22 organizations in 17 countries. Affected entities include government organizations, financial-services providers, and companies in the energy, transportation, mining, and manufacturing sectors. GreyNoise observed the activity from October 17 through November 2, when its visibility ended, and believes the campaign may still be active. The attackers used 99 IP addresses that appeared to include compromised Check Point devices and ExpressVPN exit nodes.\u003c/p\u003e\n\n\u003cp\u003eThe attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and generated a new certificate in one victim environment. They also unloaded security policies, performed internal network reconnaissance, and attempted to move to other systems, including Citrix NetScaler, Ivanti Connect Secure, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon. GreyNoise observed exploitation of CVE-2026-16232 during post-compromise activity; the Check Point SmartConsole flaw can let an attacker obtain a login token and authenticate with administrator privileges. The initial access method remains unknown, while GreyNoise also noted unconfirmed signs that GT13 may have used an AI-powered offensive tool.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GreyNoise tracked an intrusion campaign called GT13 that compromised 24 Check Point Security Management servers at 22 organizations across 17 countries between October 17 and November 2.","The affected organizations include government entities, financial services providers, and companies in the energy, transportation, mining, and manufacturing sectors.","The attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and they also unloaded security policies in some cases.","GreyNoise observed post-compromise exploitation of CVE-2026-16232, a Check Point SmartConsole authentication bypass that can provide administrator-level access.","The attackers conducted internal reconnaissance and attempted to move to additional systems including Citrix NetScaler, Ivanti Connect Secure, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon."],"insights":["GreyNoise identified victims after the attacker ran a failed bulk certificate-management operation across all 24 compromised Check Point servers on October 26.","CVE-2026-16232 was observed during post-compromise activity, while the initial method used to breach the Check Point servers remains unknown.","The campaign used 99 source IP addresses, including addresses apparently associated with compromised Check Point devices and ExpressVPN exit nodes.","The attackers targeted security-management infrastructure and then attempted to reach other enterprise systems such as Citrix NetScaler, Ivanti Connect Secure, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon.","GreyNoise assessed that the actor may have used an AI-powered offensive tool based on automation and custom tooling, but stated that AI use was not confirmed."],"referencedReports":[{"title":"Check Point Security Management Servers Intrusion Campaign","url":"https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign","publisher":"greynoise","context":"The article relies on GreyNoise's technical analysis for details of the GT13 intrusion campaign, affected organizations, observed activity, and indicators of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eGreyNoise reported that a threat actor it tracks as GT13 compromised 24 Check Point Security Management servers belonging to 22 organizations in 17 countries. Affected entities include government organizations, financial-services providers, and companies in the energy, transportation, mining, and manufacturing sectors. GreyNoise observed the activity from October 17 through November 2, when its visibility ended, and believes the campaign may still be active. The attackers used 99 IP addresses that appeared to include compromised Check Point devices and ExpressVPN exit nodes.\u003c/p\u003e\n\n\u003cp\u003eThe attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and generated a new certificate in one victim environment. They also unloaded security policies, performed internal network reconnaissance, and attempted to move to other systems, including Citrix NetScaler, Ivanti Connect Secure, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon. GreyNoise observed exploitation of CVE-2026-16232 during post-compromise activity; the Check Point SmartConsole flaw can let an attacker obtain a login token and authenticate with administrator privileges. The initial access method remains unknown, while GreyNoise also noted unconfirmed signs that GT13 may have used an AI-powered offensive tool.\u003c/p\u003e\n"},{"n":7,"title":"Lawmakers warn ID verification companies to bolster security after September hack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/idscan-data-breach-warning-congressional-letter","time":"17:49","priority":"SHOULD READ","score":84,"tldr":"U.S. lawmakers urged identity-verification companies to strengthen data security after an IDScan breach exposed scans of more than 150 million IDs, which were later offered on the Nexus dark-web marketplace. The incident highlights the persistent fraud and national-security risks of retaining detailed identity documents.","briefOverview":"\u003cp\u003eA bipartisan group of six federal lawmakers sent letters to identity-verification companies after a September breach of IDScan exposed scans of more than 150 million driver’s licenses and other identification documents. The breach involved customer data stored on IDScan’s cloud platform and prompted an FBI investigation. Lawmakers asked the companies for detailed information about how they manage and protect sensitive customer data.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data was offered on the Russia-linked Nexus dark-web marketplace and included nearly 600,000 medical cards, employment authorizations, and other sensitive records. The license scans included ultraviolet, infrared, and other detailed images, while the exposed records reportedly included documents belonging to senior military and intelligence officials. Lawmakers warned of identity theft, fraud, and the possibility that foreign adversaries could infer Americans’ behavior through commercial data connected to government credentials, and urged companies to find weaknesses proactively, use zero-trust architecture, and minimize data collection, sharing, and storage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A bipartisan group of six federal lawmakers sent letters to identity verification companies seeking details on how they handle and protect customers’ sensitive data after the September IDScan breach.","The IDScan breach exposed scans of more than 150 million driver’s licenses and other identification documents, along with nearly 600,000 medical cards, employment authorizations, and other sensitive records.","The stolen IDScan data was offered for sale on the Russia-linked Nexus dark-web marketplace, and the FBI opened an investigation.","The lawmakers warned that the exposed information could enable identity theft and fraud and included documents belonging to high-ranking military and intelligence officials.","The letters urged companies to search proactively for weaknesses, use a system in which access is not automatically trusted, and reduce how much personally identifying information they collect, share, and retain."],"insights":["Brian Krebs reported that more than two dozen identity-verification companies retain scanned IDs, often by default, while customers may need to pay extra to stop retention after an identity check.","The Nexus marketplace reportedly began taking the data more than a year before authorities discovered the stolen records online, illustrating that exposure can remain undetected for extended periods.","The stolen license scans included ultraviolet, infrared, and other detailed images, which heightens concern over how the documents could be misused.","Lawmakers noted that even without additional criminal activity, fixing the consequences is difficult because credential copies and data sales are hard to track."],"referencedReports":[],"body":"\u003cp\u003eA bipartisan group of six federal lawmakers sent letters to identity-verification companies after a September breach of IDScan exposed scans of more than 150 million driver’s licenses and other identification documents. The breach involved customer data stored on IDScan’s cloud platform and prompted an FBI investigation. Lawmakers asked the companies for detailed information about how they manage and protect sensitive customer data.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data was offered on the Russia-linked Nexus dark-web marketplace and included nearly 600,000 medical cards, employment authorizations, and other sensitive records. The license scans included ultraviolet, infrared, and other detailed images, while the exposed records reportedly included documents belonging to senior military and intelligence officials. Lawmakers warned of identity theft, fraud, and the possibility that foreign adversaries could infer Americans’ behavior through commercial data connected to government credentials, and urged companies to find weaknesses proactively, use zero-trust architecture, and minimize data collection, sharing, and storage.\u003c/p\u003e\n"},{"n":12,"title":"Recent Trends and Tactics of Agentic AI Attacks","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/","time":"15:00","priority":"SHOULD READ","score":84,"tldr":"Unit 42 reports that attackers are using autonomous AI agents after gaining web-shell access to rapidly perform reconnaissance, credential theft, privilege escalation and lateral movement across Linux, Windows and cloud environments. The core risk is not novel techniques but machine-speed, adaptive execution, though the agents often leave detectable clues such as high command volume, structured output delimiters and reasoning-style code comments.","briefOverview":"\u003cp\u003eUnit 42 reported tracking more than 10 global campaigns between July and September 2026 in which attackers used autonomous AI agents to accelerate intrusions. In every observed campaign, attackers first gained access through web shells placed on vulnerable web applications, then used agents for reconnaissance, credential harvesting, privilege escalation and movement to other systems. Targets included government, logistics, hospitality, manufacturing, agriculture and education organizations.\u003c/p\u003e\n\n\u003cp\u003eThe article says the notable change is speed and adaptive execution rather than new attack methods: agents used familiar open-source tools and lightweight custom scripts, at times running hundreds of commands in minutes. One agent executed about 800 unique commands during 140 minutes of activity, while another campaign used more than 8,000 commands over 12 days; observed median gaps between commands fell from 23.9 seconds during manual activity to 1.4 seconds after an AI agent took over. Agents also moved across Linux, Windows and cloud environments, including adapting from blocked AWS IMDSv1 access to IMDSv2 token acquisition and enumerating cloud services.\u003c/p\u003e\n\n\u003cp\u003eAlthough the agents generated target-specific payloads that complicate signature-based detection, Unit 42 identified recurring indicators of non-human operation. These included unusually rapid command execution, structured section headers and delimiters, reasoning-style comments in scripts, and many unique Base64-encoded payloads. The report also found agents probing security products and their configuration, while recommending that defenders hunt for these behavioral signs and use layered network, endpoint, identity and cloud protections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 reported tracking more than 10 global campaigns between July and September 2026 in which attackers used autonomous AI agents after obtaining access through web shells deployed on vulnerable web applications.","The observed agents performed reconnaissance, credential harvesting, privilege escalation and lateral movement, often under high-level human direction while autonomously selecting and adapting tactical steps.","In one investigated intrusion, an AI agent executed about 800 unique commands during 140 minutes of activity, while another campaign involved more than 8,000 unique commands over 12 days.","The agents moved across Linux, Windows and cloud environments, including an incident in which an agent adapted from blocked AWS IMDSv1 access to successful IMDSv2 token acquisition and then enumerated AWS services across eight regions.","Unit 42 identified behavioral signs that may help defenders recognize agent-driven activity, including unusually rapid command execution, structured output headers, highly varied Base64-encoded payloads and reasoning-style comments embedded in scripts."],"insights":["The most effective observed model paired human strategic direction with AI tactical autonomy: people selected targets and objectives, while agents performed the detailed work and reported structured findings back through orchestration APIs.","The agents were fast but not necessarily stealthy; Unit 42 found recurring machine-like clues such as section delimiters in shell commands and conversational reasoning comments in scripts, which are uncommon in hands-on human intrusions.","Rather than relying on a reusable custom malware toolkit, the agents commonly generated many small, one-time scripts tailored to each target, making static file signatures less useful while creating detectable bursts of diverse script activity.","Some agents actively studied defenses instead of merely avoiding them, including checking for numerous security tools, excluding endpoint-security directories from searches, and using strace against Microsoft Defender for Endpoint to examine how it monitored activity.","Attribution may be more practical through human-controlled infrastructure and operational mistakes than through AI-generated payloads, such as hard-coded C2 addresses, exposed orchestration platforms like CyberStrikeAI, accidental local file paths, and language artifacts in code comments."],"referencedReports":[{"title":"How AI Agents Turned One Exposed Endpoint into a Server Takeover","url":"https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/","publisher":"reliaquest","context":"Unit 42 cites ReliaQuest threat research as documenting the same IP address as a staging and reconnaissance node in a separate agent-driven attack, corroborating infrastructure overlap.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 reported tracking more than 10 global campaigns between July and September 2026 in which attackers used autonomous AI agents to accelerate intrusions. In every observed campaign, attackers first gained access through web shells placed on vulnerable web applications, then used agents for reconnaissance, credential harvesting, privilege escalation and movement to other systems. Targets included government, logistics, hospitality, manufacturing, agriculture and education organizations.\u003c/p\u003e\n\n\u003cp\u003eThe article says the notable change is speed and adaptive execution rather than new attack methods: agents used familiar open-source tools and lightweight custom scripts, at times running hundreds of commands in minutes. One agent executed about 800 unique commands during 140 minutes of activity, while another campaign used more than 8,000 commands over 12 days; observed median gaps between commands fell from 23.9 seconds during manual activity to 1.4 seconds after an AI agent took over. Agents also moved across Linux, Windows and cloud environments, including adapting from blocked AWS IMDSv1 access to IMDSv2 token acquisition and enumerating cloud services.\u003c/p\u003e\n\n\u003cp\u003eAlthough the agents generated target-specific payloads that complicate signature-based detection, Unit 42 identified recurring indicators of non-human operation. These included unusually rapid command execution, structured section headers and delimiters, reasoning-style comments in scripts, and many unique Base64-encoded payloads. The report also found agents probing security products and their configuration, while recommending that defenders hunt for these behavioral signs and use layered network, endpoint, identity and cloud protections.\u003c/p\u003e\n"},{"n":5,"title":"Radware discloses breach exposing customer cloud access keys","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/","time":"17:49","priority":"SHOULD READ","score":82,"tldr":"Radware disclosed that an unauthenticated internal Cloud WAF management API exposed online allowed attackers to access some customer contact details and log-export credentials, including AWS, Azure, and SFTP keys. Affected customers should rotate those credentials and review storage-access logs for suspicious activity since November 19.","briefOverview":"\u003cp\u003eRadware said an unauthorized party accessed an internal Cloud WAF management API on November 19, 2026, after it was left reachable from the public internet without authentication. The company detected the breach roughly ten hours after the initial access, blocked the originating IP address, restricted access to the API, and revoked and replaced internal account credentials. Radware is continuing to investigate whether exposed information was used without authorization.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed data includes customer contact details and, for a subset of customers, credentials used to export Cloud WAF logs to self-managed AWS S3, Azure Blob Storage, or SFTP destinations. Radware strongly advised affected WAF and bot-protection customers to rotate those credentials and review storage access logs for unexpected activity since November 19; it has received reports of AWS alerts involving an unfamiliar IP address attempting to access log-export buckets. The company said WAF protection continued uninterrupted and that it has found no evidence of changes to customer security policies or access to customer application traffic, traffic inspection data, certificates, end-user data, or cloud DDoS services and data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Radware said an unauthorized party accessed an internal Cloud WAF management API that was publicly reachable without authentication on November 19, 2026.","Potentially exposed information included customer contact details and, for some customers, credentials for exporting logs to AWS S3, Azure Blob Storage, or SFTP storage.","Radware blocked the originating IP address, restricted access to the management API, and revoked and replaced all internal account credentials after detecting the incident.","Radware strongly advised affected WAF and bot-protection customers to rotate log-export credentials and review their cloud-storage access logs for unexpected activity since November 19.","Radware said it found no evidence that customer security policies or application traffic were accessed, and that WAF inspection and protection continued without interruption."],"insights":["The most actionable risk is not disruption of Radware’s WAF service but possible access to customers’ separate log-storage locations through exposed export credentials.","Customers should investigate cloud-storage activity dating back to November 19, not just activity after Radware detected the incident, because the unauthorized API access occurred earlier.","The incident affected only a subset of customers’ log-export credentials, while Radware said WAF traffic inspection, customer application traffic, certificates, and cloud DDoS data were not exposed.","Reports of AWS alerts involving an unfamiliar IP address indicate that some customers observed attempted access to their log-export buckets after the exposure."],"referencedReports":[],"body":"\u003cp\u003eRadware said an unauthorized party accessed an internal Cloud WAF management API on November 19, 2026, after it was left reachable from the public internet without authentication. The company detected the breach roughly ten hours after the initial access, blocked the originating IP address, restricted access to the API, and revoked and replaced internal account credentials. Radware is continuing to investigate whether exposed information was used without authorization.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed data includes customer contact details and, for a subset of customers, credentials used to export Cloud WAF logs to self-managed AWS S3, Azure Blob Storage, or SFTP destinations. Radware strongly advised affected WAF and bot-protection customers to rotate those credentials and review storage access logs for unexpected activity since November 19; it has received reports of AWS alerts involving an unfamiliar IP address attempting to access log-export buckets. The company said WAF protection continued uninterrupted and that it has found no evidence of changes to customer security policies or access to customer application traffic, traffic inspection data, certificates, end-user data, or cloud DDoS services and data.\u003c/p\u003e\n"},{"n":9,"title":"Iran-Aligned Volant Manticore Uses IPFS-Based KuboShell Backdoor in Espionage Campaigns","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/iran-aligned-volant-manticore-uses-ipfs.html","time":"16:54","priority":"SHOULD READ","score":82,"tldr":"Check Point identified Volant Manticore, an Iran-aligned espionage group likely linked to former MuddyWater operators, targeting organizations in Cyprus and Saudi Arabia. Its KuboShell backdoor uses IPFS and Pinata for command-and-control before deploying the more capable Homa framework and legitimate RMM tools.","briefOverview":"\u003cp\u003eCheck Point identified Volant Manticore, a previously undocumented Iran-aligned espionage group that has targeted telecommunications companies, airlines, and critical infrastructure in Cyprus since at least late August 2025. The group is also linked to campaigns against Saudi Arabian healthcare entities, including phishing emails sent from a compromised private hospital account. Check Point assesses that the cluster may consist of former MuddyWater operators working independently while using some older MuddyWater-related tooling.\u003c/p\u003e\n\n\u003cp\u003eVolant Manticore delivers its KuboShell Windows backdoor through methods including AI-generated fake CVs, healthcare-themed ZIP files, and a macro-enabled Word document. KuboShell uses IPFS and Pinata to obtain commands, identifies victims using a network adapter\u0026rsquo;s MAC address, and appears to conduct basic reconnaissance before downloading the more capable Homa framework. The group also uses legitimate remote-management tools such as MeshCentral, NetLock RMM, and N-able RMM, while conducting credential-harvesting campaigns against organizations it impersonates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point identified a previously undocumented Iran-aligned espionage group called Volant Manticore that has targeted telecommunications companies, airlines, and critical infrastructure in Cyprus since at least late August 2025.","Volant Manticore uses the Windows backdoor KuboShell, which communicates through IPFS and Pinata to retrieve commands and return execution results.","The group has used AI-generated personas in fake CVs and healthcare-themed phishing ZIP archives to deliver KuboShell, Homa, and remote monitoring and management tools.","Check Point assesses that Volant Manticore may consist of former MuddyWater operators operating separately while retaining older MuddyWater tooling, including a JavaScript reimplementation of MuddyC2Go.","The group targeted Saudi Arabian healthcare entities in campaigns observed as recently as September 2026, including emails sent from a compromised account belonging to a private Saudi hospital."],"insights":["KuboShell appears designed mainly for early-stage assessment rather than full control: it runs basic reconnaissance commands before the group downloads a more capable Homa backdoor.","The backdoor uses a victim computer's network-adapter address as its identifier and polls for a uniquely named command file every 60 seconds through Pinata and IPFS.","KuboShell does not independently capture command output, so operators must issue commands that write results to a specific local text file before those results can be uploaded.","Volant Manticore combines custom malware with legitimate remote-management programs such as MeshCentral, NetLock RMM, and N-able RMM, giving it multiple means of maintaining access.","The group’s use of a compromised Saudi hospital email account to distribute healthcare-themed files could make malicious messages appear more credible to intended recipients."],"referencedReports":[{"title":"Volant Manticore: Flying Under the Radar","url":"https://research.checkpoint.com/2026/volant-manticore-flying-under-the-radar/","publisher":"check-point-research","context":"The article relies on Check Point's analysis identifying Volant Manticore, its targeting, and its KuboShell and Homa tooling.","category":"research","primary":true}],"body":"\u003cp\u003eCheck Point identified Volant Manticore, a previously undocumented Iran-aligned espionage group that has targeted telecommunications companies, airlines, and critical infrastructure in Cyprus since at least late August 2025. The group is also linked to campaigns against Saudi Arabian healthcare entities, including phishing emails sent from a compromised private hospital account. Check Point assesses that the cluster may consist of former MuddyWater operators working independently while using some older MuddyWater-related tooling.\u003c/p\u003e\n\n\u003cp\u003eVolant Manticore delivers its KuboShell Windows backdoor through methods including AI-generated fake CVs, healthcare-themed ZIP files, and a macro-enabled Word document. KuboShell uses IPFS and Pinata to obtain commands, identifies victims using a network adapter\u0026rsquo;s MAC address, and appears to conduct basic reconnaissance before downloading the more capable Homa framework. The group also uses legitimate remote-management tools such as MeshCentral, NetLock RMM, and N-able RMM, while conducting credential-harvesting campaigns against organizations it impersonates.\u003c/p\u003e\n"},{"n":1,"title":"Turnitin discloses cyberattack affecting customer-facing systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/turnitin-discloses-cyberattack-affecting-customer-facing-systems/","time":"18:59","priority":"SHOULD READ","score":78,"tldr":"Turnitin disclosed unauthorized activity on certain customer-facing systems and is investigating with external cybersecurity specialists while notifying law enforcement and regulators. The company says services remain operational, but has not disclosed whether data was accessed, the incident’s scope, or the number of people affected.","briefOverview":"\u003cp\u003eTurnitin disclosed that it identified unauthorized activity involving certain customer-facing systems and activated its incident response plan. CEO Chris Caren said the company is investigating with external cybersecurity specialists and has notified law enforcement and cyber regulators. Turnitin said its systems remain fully operational and safe to use.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the nature or scope of the activity, whether user data was accessed or stolen, when it occurred, or how many people may be affected. It said the affected systems do not collect government identification credentials or institutional financial information, while continuing to monitor for further unauthorized activity. The incident could have broad reach because Turnitin says its software is used by more than 16,000 institutions across 185 countries and serves 71 million students.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Turnitin disclosed unauthorized activity involving certain customer-facing systems and activated its incident response plan.","The company is investigating with external cybersecurity specialists and says it notified law enforcement and cyber regulators.","Turnitin says its systems remain operational and that the affected systems do not collect government identification credentials or institutional financial information.","The company has not disclosed whether user data was accessed or stolen, when the incident occurred, or how many people may have been affected.","Turnitin's status page showed no incidents or service disruptions in November 2026, and no ransomware group had publicly claimed responsibility at the time of reporting."],"insights":["Turnitin’s public status history showed no November 2026 incidents or service disruptions despite the disclosed unauthorized activity, indicating that the event did not necessarily cause visible service downtime.","Turnitin stated that it is continuing to monitor for additional unauthorized activity and could not yet guarantee the threat had been fully eliminated.","Although the company said the affected systems do not collect government ID credentials or institutional financial data, it has not said whether other user data was accessed or taken.","The potential reach is substantial because Turnitin says its services are used by more than 16,000 institutions in 185 countries and serve 71 million students."],"referencedReports":[],"body":"\u003cp\u003eTurnitin disclosed that it identified unauthorized activity involving certain customer-facing systems and activated its incident response plan. CEO Chris Caren said the company is investigating with external cybersecurity specialists and has notified law enforcement and cyber regulators. Turnitin said its systems remain fully operational and safe to use.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the nature or scope of the activity, whether user data was accessed or stolen, when it occurred, or how many people may be affected. It said the affected systems do not collect government identification credentials or institutional financial information, while continuing to monitor for further unauthorized activity. The incident could have broad reach because Turnitin says its software is used by more than 16,000 institutions across 185 countries and serves 71 million students.\u003c/p\u003e\n"},{"n":2,"title":"ShinyHunters claims to return after FBI arrests, uses old PGP keys as proof","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-resurfaces-after-fbi-arrests-uses-old-pgp-keys-as-proof/","time":"16:30","priority":"SHOULD READ","score":78,"tldr":"ShinyHunters claims it has resumed operations after arrests of alleged members, launching a new Tor leak site and using historical PGP keys to support its identity. The signatures show access to old group keys but do not conclusively prove the original operators are behind the comeback.","briefOverview":"\u003cp\u003eShinyHunters claims to have returned through a new Tor data leak site after a series of arrests targeting alleged members. The site contains Russian and English messages that distance the operators from alleged impostors and criticize a former associate reportedly cooperating with law enforcement. The operators said they will communicate only through an Exploit forum account they claim to have controlled since 2020 and through the new Tor site.\u003c/p\u003e\n\n\u003cp\u003eTo support the claim, the site published messages signed with two historical ShinyHunters PGP keys created in 2020, and BleepingComputer verified both signatures. This confirms that the new operators have access to private signing keys historically used by ShinyHunters, but it does not establish that they are the same people who previously ran the group because the keys were rumored to have been shared with numerous people. The old keys were revoked in March 2026 and the new messages were not signed with the replacement key introduced at that time; the operators also said they will use a new CDN for stolen data and stop using existing backup servers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters claims to have returned through a new Tor-based data leak site following arrests of several people reportedly linked to the group.","The new site published Russian and English messages and said it will communicate only through its Exploit forum account and the new Tor site.","The operators signed verification messages with two historical ShinyHunters PGP keys from 2020, and BleepingComputer verified the signatures.","The old signing keys show that the site operators can access keys historically used by ShinyHunters, but they do not prove that the original group members are operating the new site.","The operators said they rotated a PGP key reportedly used by Rey, who they say was arrested and is cooperating with authorities, and plan to use a new CDN for stolen data."],"insights":["The operators relied on two PGP keys that ShinyHunters revoked in March 2026, rather than signing the new announcements with the replacement key the group introduced at that time.","Although the signatures verify access to historical private keys, the article notes that those keys were rumored to have been shared among numerous people, limiting their value as proof of the operators’ identity.","The new operators said they had rotated the data-leak-site signing key reportedly used by Rey because they believed it was likely compromised, indicating they are treating the reported arrest as an operational security risk.","The group said it will abandon existing backup servers and deploy a new content-delivery network for hosting stolen data, signaling an infrastructure change alongside its claimed return."],"referencedReports":[],"body":"\u003cp\u003eShinyHunters claims to have returned through a new Tor data leak site after a series of arrests targeting alleged members. The site contains Russian and English messages that distance the operators from alleged impostors and criticize a former associate reportedly cooperating with law enforcement. The operators said they will communicate only through an Exploit forum account they claim to have controlled since 2020 and through the new Tor site.\u003c/p\u003e\n\n\u003cp\u003eTo support the claim, the site published messages signed with two historical ShinyHunters PGP keys created in 2020, and BleepingComputer verified both signatures. This confirms that the new operators have access to private signing keys historically used by ShinyHunters, but it does not establish that they are the same people who previously ran the group because the keys were rumored to have been shared with numerous people. The old keys were revoked in March 2026 and the new messages were not signed with the replacement key introduced at that time; the operators also said they will use a new CDN for stolen data and stop using existing backup servers.\u003c/p\u003e\n"},{"n":4,"title":"Police disrupt 57 illegal streaming services with 7.3 million visits","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-disrupt-57-illegal-streaming-services-with-73-million-visits/","time":"15:10","priority":"MAY READ","score":68,"tldr":"A coordinated law-enforcement operation across 11 countries disrupted 57 illegal IPTV services and identified 321 piracy websites with more than 7.3 million annual visits. Investigators traced over €26 million in cryptocurrency transactions while targeting the financial networks behind the billion-euro illegal streaming market.","briefOverview":"\u003cp\u003eLaw-enforcement authorities from 11 countries disrupted 57 illegal IPTV services and identified 321 websites offering copyrighted television, live sports, and films without authorization. Europol said the websites had combined annual traffic exceeding 7.3 million visits. The joint action involved Europol, the European Union Intellectual Property Office, INTERPOL, and the European Audiovisual Anti-Piracy Alliance.\u003c/p\u003e\n\n\u003cp\u003eInvestigators traced more than €26 million in cryptocurrency transactions and worked with Binance, Coinbase, and Chainalysis to examine the financial networks supporting the services. They linked streaming services to cryptocurrency wallets, transactions, and the people controlling them, as operators used crypto to collect subscriptions and transfer money across borders. The AAPA estimates that roughly 60 million people in Europe use illegal streaming platforms, resulting in about €4.83 billion in annual losses for legitimate providers.\u003c/p\u003e\n\n\u003cp\u003eThe operation follows other international anti-piracy actions, including Operation KRATOS 2, which removed more than 27,000 illegal streaming URLs, shut down nine organized crime groups, and led to 29 arrests. A prior Operation KRATOS action in summer 2024 shut down an illegal streaming network with more than 22 million users worldwide. Earlier this year, Operation Switch Off led to the seizure of three industrial-scale illegal IPTV services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Law-enforcement authorities from 11 countries disrupted 57 illegal IPTV services and identified 321 websites offering copyrighted content without authorization.","The identified websites had a combined annual traffic of more than 7.3 million visits, according to Europol.","Investigators traced more than €26 million in cryptocurrency transactions while examining payment networks connected to the streaming services.","Europol, the EU Intellectual Property Office, INTERPOL, the Audiovisual Anti-Piracy Alliance, Binance, Coinbase, and Chainalysis participated in the joint action.","The Audiovisual Anti-Piracy Alliance estimates that legitimate providers lose about €4.83 billion annually because roughly 60 million people in Europe use illegal streaming platforms."],"insights":["The investigation focused not only on taking streaming sites offline but also on linking the services’ cryptocurrency wallets, transactions, and controllers to map the financial networks behind them.","Cryptocurrency was used by illegal streaming operators to collect subscription payments and move funds across borders while obscuring the origins of their profits, but investigators still traced more than €26 million in related transactions.","The operation is part of a continuing international enforcement effort: recent actions also removed more than 27,000 illegal streaming URLs, shut down organized crime groups, and seized industrial-scale IPTV services.","The article places the disrupted services within a much larger market, with the AAPA estimating that about 60 million people in Europe use illegal streaming platforms and that legitimate providers lose €4.83 billion annually."],"referencedReports":[],"body":"\u003cp\u003eLaw-enforcement authorities from 11 countries disrupted 57 illegal IPTV services and identified 321 websites offering copyrighted television, live sports, and films without authorization. Europol said the websites had combined annual traffic exceeding 7.3 million visits. The joint action involved Europol, the European Union Intellectual Property Office, INTERPOL, and the European Audiovisual Anti-Piracy Alliance.\u003c/p\u003e\n\n\u003cp\u003eInvestigators traced more than €26 million in cryptocurrency transactions and worked with Binance, Coinbase, and Chainalysis to examine the financial networks supporting the services. They linked streaming services to cryptocurrency wallets, transactions, and the people controlling them, as operators used crypto to collect subscriptions and transfer money across borders. The AAPA estimates that roughly 60 million people in Europe use illegal streaming platforms, resulting in about €4.83 billion in annual losses for legitimate providers.\u003c/p\u003e\n\n\u003cp\u003eThe operation follows other international anti-piracy actions, including Operation KRATOS 2, which removed more than 27,000 illegal streaming URLs, shut down nine organized crime groups, and led to 29 arrests. A prior Operation KRATOS action in summer 2024 shut down an illegal streaming network with more than 22 million users worldwide. Earlier this year, Operation Switch Off led to the seizure of three industrial-scale illegal IPTV services.\u003c/p\u003e\n"},{"n":8,"title":"Carnegie Endowment for International Peace says third-party breach leaked donation info","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/carnegie-endowment-data-breach","time":"16:00","priority":"MAY READ","score":68,"tldr":"A breach at nonprofit fundraising vendor Soapbox Engage exposed some Carnegie Endowment for International Peace donors’ names, contact details, and giving histories, though no full credit card numbers were affected. The incident is part of a recent wave of attacks targeting digital fundraising platforms.","briefOverview":"\u003cp\u003eCarnegie Endowment for International Peace said a cyberattack on its third-party fundraising vendor, Soapbox Engage, exposed information belonging to some donors. The incident occurred on October 28, and Carnegie said the unauthorized users were removed from the vendor’s systems on October 30. Carnegie uses Soapbox Engage for online donations and hired a cybersecurity firm to confirm the intruders had been removed.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data included names, email addresses, phone numbers, and donation histories. Carnegie said an integration between Soapbox Engage and its database temporarily gave the intruders access to Carnegie contact information, but no full credit card numbers were exposed. The organization said a small percentage of its database was affected, notified everyone in the database because of European privacy laws, and did not disclose the number of people impacted.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure comes amid other recently reported security incidents involving digital fundraising platforms. DonorPerfect reported a security incident, while GoFundMe said intruders accessed its systems in two separate attacks in October and November. GoFundMe said its affected data included limited personal information and no card or bank details, while The Nonprofit Times reported that the attacks appeared coordinated and that at least one incident involved stolen funds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Carnegie Endowment for International Peace said a cyberattack on its fundraising vendor Soapbox Engage led to unauthorized access to a small percentage of Carnegie’s database.","The incident occurred on October 28, and Carnegie said the unauthorized users were removed from the vendor’s systems on October 30.","The exposed information included donors’ names, email addresses, phone numbers, and giving histories, while no full credit card numbers were exposed.","Carnegie notified everyone in its database about the incident because of European data privacy laws, though it did not disclose how many people were affected.","DonorPerfect and GoFundMe also recently disclosed security incidents involving their fundraising platforms."],"insights":["Soapbox Engage’s integration with Carnegie’s database meant that a compromise of the fundraising vendor could temporarily expose contact information held by Carnegie itself.","Carnegie notified its entire database rather than only confirmed affected individuals because of European data privacy laws, even though it said only a small percentage was affected.","The disclosures from Carnegie, DonorPerfect, and GoFundMe point to a concentrated period of incidents affecting digital fundraising platforms, with a separate report saying the activity appeared coordinated."],"referencedReports":[],"body":"\u003cp\u003eCarnegie Endowment for International Peace said a cyberattack on its third-party fundraising vendor, Soapbox Engage, exposed information belonging to some donors. The incident occurred on October 28, and Carnegie said the unauthorized users were removed from the vendor’s systems on October 30. Carnegie uses Soapbox Engage for online donations and hired a cybersecurity firm to confirm the intruders had been removed.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data included names, email addresses, phone numbers, and donation histories. Carnegie said an integration between Soapbox Engage and its database temporarily gave the intruders access to Carnegie contact information, but no full credit card numbers were exposed. The organization said a small percentage of its database was affected, notified everyone in the database because of European privacy laws, and did not disclose the number of people impacted.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure comes amid other recently reported security incidents involving digital fundraising platforms. DonorPerfect reported a security incident, while GoFundMe said intruders accessed its systems in two separate attacks in October and November. GoFundMe said its affected data included limited personal information and no card or bank details, while The Nonprofit Times reported that the attacks appeared coordinated and that at least one incident involved stolen funds.\u003c/p\u003e\n"},{"n":10,"title":"AI Agents vs Experts: What the Data Says for 2027","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/penetration-testing-as-a-service/ai-agents-vs-experts-what-the-data-says-for-2027/","time":"17:48","priority":"MAY READ","score":58,"tldr":"NetSPI’s EchoBench testing found that AI pentesting agents still trail trained human testers, particularly on moderate issues, injection flaws, login weaknesses, and contextual attack reasoning. The strongest approach is human-in-the-loop testing: agents broaden discovery and evidence collection while experts validate findings, assess impact, and manage false-positive review volume.","briefOverview":"\u003cp\u003eNetSPI’s 2027 Vision Report uses its EchoBench benchmark to compare AI pentesting systems with trained human testers on five web applications containing curated known issues. The benchmark drew on 425 assessments by 88 pentesters and required findings to match a known issue and include required evidence. It measured complete AI configurations, including models paired with harnesses such as CAI, PentestGPT, PentestSwarm, and OpenCode, as well as source-code and commercial approaches.\u003c/p\u003e\n\n\u003cp\u003eHuman testers outperformed open-source AI setups by an average of 23 percentage points, with the difference growing to 30 points on moderate issues. The best cited setup, Opus 4.7 with harness support, found 44.4% of known issue types versus a 49.4% human baseline; people were stronger on injection and login flaws, while agents did better on cryptographic failures and one exposed WSDL file. Combining a human tester with an agent run found more issues than either alone on every reviewed application, but the report warns that AI-generated findings can create substantial validation work, with 87 AI findings mapping to 32 known issues and leaving 55 additional reports to review.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NetSPI’s EchoBench benchmark compared AI pentesting configurations with 425 assessments conducted by 88 trained pentesters across five web applications.","Experts outperformed the open-source AI setups by an average of 23 percentage points, and the gap increased from 22 points on easy issues to 30 points on moderate issues.","The best tested model configuration, Opus 4.7 with harness support, found 44.4% of known issue types, compared with the human baseline of 49.4%.","Human testers found injection flaws and login flaws more often than agents, while agents performed better on cryptographic failures and frequently identified an exposed WSDL file on one public application.","On every application reviewed, combining a human pentester with a typical agent run found more known issue types than either the human or agent alone."],"insights":["AI and human testers had complementary blind spots: on public app C, each independently found 23 of 26 known issue types, while the combined result found all 26.","Giving an AI system source-code access substantially improved issue matching on proprietary app B, from 4 of 9 to 8 of 9, but 12 of its 20 judged claims were outside the answer key.","Across the AI testing, 87 reported findings mapped to only 32 known issues, leaving 55 additional reports requiring human validation.","A tool harness designed to connect many tools but lacking a testing plan found less than 5% of known issues regardless of which model it used.","The report identifies validation capacity as a growing operational constraint because AI can produce plausible candidate findings faster than organizations can determine which ones matter."],"referencedReports":[],"body":"\u003cp\u003eNetSPI’s 2027 Vision Report uses its EchoBench benchmark to compare AI pentesting systems with trained human testers on five web applications containing curated known issues. The benchmark drew on 425 assessments by 88 pentesters and required findings to match a known issue and include required evidence. It measured complete AI configurations, including models paired with harnesses such as CAI, PentestGPT, PentestSwarm, and OpenCode, as well as source-code and commercial approaches.\u003c/p\u003e\n\n\u003cp\u003eHuman testers outperformed open-source AI setups by an average of 23 percentage points, with the difference growing to 30 points on moderate issues. The best cited setup, Opus 4.7 with harness support, found 44.4% of known issue types versus a 49.4% human baseline; people were stronger on injection and login flaws, while agents did better on cryptographic failures and one exposed WSDL file. Combining a human tester with an agent run found more issues than either alone on every reviewed application, but the report warns that AI-generated findings can create substantial validation work, with 87 AI findings mapping to 32 known issues and leaving 55 additional reports to review.\u003c/p\u003e\n"},{"n":11,"title":"What the ARTEX attacks tell defenders about AI pentesting","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/artex-ai-pentesting-defenders","time":"15:47","priority":"MAY READ","score":58,"tldr":"ARTEX shows how AI-agent frameworks can rapidly scale attacks using familiar weaknesses such as exposed credentials, unauthenticated APIs, IDORs, and injection flaws. Defenders should inventory all internet-facing systems, continuously test each release within tightly controlled scope, and fix findings quickly while maintaining MFA, credential rotation, and secret-management practices.","briefOverview":"\u003cp\u003eARTEX is an open-source framework that coordinates AI agents through penetration-testing tasks, but the article says criminals used it against organizations after its July publication. Its developer removed it in October, yet forks, translated copies, and a commercial version continued circulating, and researchers found more than 1,600 live consoles in early November. The FBI says it has been used since at least August against financial services, government, technology, defense, healthcare, and other sectors. Reported activity includes personal-data theft affecting about 67,000 people in South Korea, attempted sign-ins to more than 2,250 Microsoft 365 tenants, and breaches disclosed by Barracuda and WorkOS.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that ARTEX\u0026rsquo;s importance is its scale and persistence rather than novel attack methods. It cites familiar entry points including hardcoded administrator passwords in JavaScript, unauthenticated APIs, IDORs, command and template injection, weak administrator credentials, and stolen, exposed, or unrevoked credentials. Microsoft said some intrusions moved from initial target selection to privileged access in less than three hours, increasing the importance of rapid detection and repair. The article recommends inventorying every internet-facing application, regularly testing applications, APIs, and external networks, preserving credential controls such as MFA and rotation, and using strict safeguards when conducting defensive AI testing, including verified ownership, network allowlists, rate limits, time windows, audit logs, and pause controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ARTEX is an open-source framework that coordinates AI agents for penetration testing, but the FBI says criminals have used it against organizations since at least August.","Reported ARTEX-linked activity included attacks on financial institutions in South Korea, attempted sign-ins to more than 2,250 Microsoft 365 tenants, and breaches disclosed by Barracuda and WorkOS.","The initial-access weaknesses cited in the article include hardcoded administrator passwords in JavaScript, unauthenticated APIs, insecure direct object references, command and template injection, weak administrator credentials, and stolen, exposed, or unrevoked credentials.","Microsoft said some intrusions progressed from selecting a target to obtaining privileged access in under three hours, making the speed of finding and fixing issues especially important.","The article advises defenders to inventory all internet-facing applications, test applications and external networks regularly, enforce testing scope outside the AI model, and retain MFA, credential rotation, and secret-management practices."],"insights":["A web application firewall can make an automated test appear clean by blocking its traffic, so the article recommends testing the application in a staging environment where authorized test traffic is allowed through.","Researchers reportedly found a backdoored Docker image among ARTEX copies, illustrating that defenders who run an unverified copy of an offensive testing framework could introduce a separate compromise path.","The article says that, across more than 1,000 AI pentests, source-code access found seven times as many high- and critical-severity issues as testing the same targets from the outside.","Hundreds of ARTEX consoles were reportedly left online without passwords, including one associated with the South Korean campaign, allowing outsiders to view operators' campaign activity.","The article argues that safe defensive AI testing requires controls outside the AI model itself, including verified ownership, network-level allowlists, time limits, rate caps, and the ability to pause tests."],"referencedReports":[{"title":"FBI Cybersecurity Advisory on ARTEX","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"fbi","context":"The article cites this FBI advisory for reported ARTEX exploitation, affected sectors, live-console findings, initial-access methods, and defensive recommendations.","category":"advisory","primary":true},{"title":"CSA Research Note: Trojanized Offensive AI Tooling","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-trojanized-offensive-ai-tooling-20261106-c/","publisher":"cloud-security-alliance","context":"The article cites this research note for an independent researcher's report of a backdoored Docker image among ARTEX copies.","category":"research","primary":false}],"body":"\u003cp\u003eARTEX is an open-source framework that coordinates AI agents through penetration-testing tasks, but the article says criminals used it against organizations after its July publication. Its developer removed it in October, yet forks, translated copies, and a commercial version continued circulating, and researchers found more than 1,600 live consoles in early November. The FBI says it has been used since at least August against financial services, government, technology, defense, healthcare, and other sectors. Reported activity includes personal-data theft affecting about 67,000 people in South Korea, attempted sign-ins to more than 2,250 Microsoft 365 tenants, and breaches disclosed by Barracuda and WorkOS.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that ARTEX\u0026rsquo;s importance is its scale and persistence rather than novel attack methods. It cites familiar entry points including hardcoded administrator passwords in JavaScript, unauthenticated APIs, IDORs, command and template injection, weak administrator credentials, and stolen, exposed, or unrevoked credentials. Microsoft said some intrusions moved from initial target selection to privileged access in less than three hours, increasing the importance of rapid detection and repair. The article recommends inventorying every internet-facing application, regularly testing applications, APIs, and external networks, preserving credential controls such as MFA and rotation, and using strict safeguards when conducting defensive AI testing, including verified ownership, network allowlists, rate limits, time windows, audit logs, and pause controls.\u003c/p\u003e\n"},{"n":13,"title":"ARTEX needs nine minutes. How long do your logs need?","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/artex-ai-pentest-framework-cloud-logs","time":"16:02","priority":"MAY READ","score":58,"tldr":"ARTEX-style AI pentest agents do not use novel attack techniques, but they can automate reconnaissance and secret-sweeping fast enough to complete a campaign in minutes. Defenders need real-time visibility into denied cloud requests and AI model calls, since delayed log analysis will miss these short-lived operations.","briefOverview":"\u003cp\u003eThe article examines ARTEX, an AI-driven penetration-testing framework that uses a planner and worker agents to generate and run shell commands. In one observed session, ARTEX made about 20 requests through five Tor exits and completed a secret-sweeping attempt in roughly nine minutes. The authors argue that ARTEX does not introduce new attack methods; it automates familiar reconnaissance, credential searching, and attempts to find exposed files or administrator access.\u003c/p\u003e\n\n\u003cp\u003eIn an AWS lab account with no credentials or website, ARTEX ran more than 2,000 tools but produced only one logged account request: an anonymous, denied attempt to list a bucket. The article says much of its activity, including bucket-name guesses, DNS lookups, and web searches, may never reach the target’s logs, while denied requests can still reveal probing for files such as \u003ccode\u003e.env\u003c/code\u003e, \u003ccode\u003eterraform.tfstate\u003c/code\u003e, and backups. It recommends real-time logging and alert review, because short agent runs can finish before hourly or daily log jobs process the evidence.\u003c/p\u003e\n\n\u003cp\u003eThe authors also describe a test against their web application, where ARTEX mapped the backend, targeted the administrator login, created a throwaway mailbox to register a regular user, and repeatedly attempted to reach restricted pages without obtaining administrator access. They note that agents can be difficult to identify by source address because Tor and CDNs can make a single run appear to originate from many addresses. When an agent runs within an organization’s own cloud environment, repeated calls to AI model services such as Amazon Bedrock may provide another way to detect it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A real ARTEX session observed by the authors lasted about nine minutes, made roughly 20 requests through five Tor exit nodes, and ended with a sweep for secrets.","ARTEX uses a planner agent and worker agents that run model-generated shell commands, rather than containing fixed cloud-attack logic.","In an AWS lab account with no credentials or website, ARTEX ran more than 2,000 tools and made only one logged request to the account: an anonymous, denied bucket-listing attempt.","The article says failed probes are often denied requests, so detections that exclude denied activity can miss AI-agent reconnaissance.","The authors argue that real-time log ingestion and immediate alert assessment are necessary because an AI-driven attack can be completed before hourly or daily log processing occurs."],"insights":["Most of ARTEX’s activity in the AWS lab never appeared in the account’s logs because bucket-name guesses, DNS lookups, web searches, and credential-less commands did not reach the account.","The article identifies a behavioral sequence that can distinguish an agent from routine internet scanning: a newly invented nonexistent filename used to learn the response pattern, followed by requests for files such as .env and terraform.tfstate.","A single AI-agent run can appear to come from many unrelated IP addresses when it uses Tor or when a bucket is behind a CDN, making per-address alert thresholds unreliable.","When ARTEX runs inside an organization’s cloud environment, its repeated model-service calls can expose the agent’s activity even when its external probing leaves very little evidence in target logs."],"referencedReports":[{"title":"ARTEX abuse expands as cybercriminals target financial sector","url":"https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/","publisher":"microsoft","context":"The article cites this Microsoft Security Blog analysis as reporting ARTEX use in attacks targeting banks.","category":"news","primary":false},{"title":"Storm-0940 uses ARTEX agentic AI ConnectWise supply chain compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/","publisher":"microsoft","context":"The article cites this Microsoft Security Blog analysis as reporting ARTEX use against software vendors through a ConnectWise supply-chain compromise.","category":"news","primary":false}],"body":"\u003cp\u003eThe article examines ARTEX, an AI-driven penetration-testing framework that uses a planner and worker agents to generate and run shell commands. In one observed session, ARTEX made about 20 requests through five Tor exits and completed a secret-sweeping attempt in roughly nine minutes. The authors argue that ARTEX does not introduce new attack methods; it automates familiar reconnaissance, credential searching, and attempts to find exposed files or administrator access.\u003c/p\u003e\n\n\u003cp\u003eIn an AWS lab account with no credentials or website, ARTEX ran more than 2,000 tools but produced only one logged account request: an anonymous, denied attempt to list a bucket. The article says much of its activity, including bucket-name guesses, DNS lookups, and web searches, may never reach the target’s logs, while denied requests can still reveal probing for files such as \u003ccode\u003e.env\u003c/code\u003e, \u003ccode\u003eterraform.tfstate\u003c/code\u003e, and backups. It recommends real-time logging and alert review, because short agent runs can finish before hourly or daily log jobs process the evidence.\u003c/p\u003e\n\n\u003cp\u003eThe authors also describe a test against their web application, where ARTEX mapped the backend, targeted the administrator login, created a throwaway mailbox to register a regular user, and repeatedly attempted to reach restricted pages without obtaining administrator access. They note that agents can be difficult to identify by source address because Tor and CDNs can make a single run appear to originate from many addresses. When an agent runs within an organization’s own cloud environment, repeated calls to AI model services such as Amazon Bedrock may provide another way to detect it.\u003c/p\u003e\n"},{"n":3,"title":"From Vulnerability Noise to Resilience: Rethinking Security in the AI Era","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/from-vulnerability-noise-to-resilience-rethinking-security-in-the-ai-era/","time":"15:01","priority":"MAY READ","score":35,"tldr":"RapidFort argues that AI-driven software development increases supply-chain complexity, so organizations should prioritize runtime reachability and exploitability over raw CVE counts. The sponsored article advocates automated hardening, curated container images, runtime profiling, and continuous rebuilding in CI/CD to reduce attack surface.","briefOverview":"\u003cp\u003eRapidFort’s sponsored article argues that AI-assisted development and the widespread use of open-source and third-party components are increasing the hidden complexity of modern software. It says application code is often only a small portion of what organizations ship, alongside operating systems, packages, libraries, frameworks, and transitive dependencies. The article urges leaders to focus less on total vulnerability counts and more on whether vulnerable components are running, reachable, exposed, known to be exploited, automatable, and likely to have meaningful impact.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes a software bill of materials, which lists included components, from a runtime bill of materials, which identifies what is actually used. It cites an NGINX image with 152 packages and 48 CVEs where only 47 packages were running, and says one customer reduced 5,286 findings to three unresolved vulnerabilities within 48 hours using profiling, curated images, and removal of unused components. It recommends integrating curated base images, runtime profiling, hardening, controlled software registries, and automated rebuilding into CI/CD so that security becomes part of normal software production rather than a downstream cleanup effort.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Modern containerized applications include operating systems, packages, libraries, frameworks, and dependencies, while the code written by an organization may be only a small portion of what it ships.","The article argues that vulnerability severity scores alone are insufficient for prioritization because teams should consider whether vulnerable code is running, reachable, exposed, known to be exploited, automatable, and likely to have meaningful technical impact.","A software bill of materials identifies included components, while a runtime bill of materials identifies components actually being used; the article cites an NGINX image with 152 packages and 48 CVEs in which only 47 packages were running.","The article recommends removing unneeded libraries, shells, package managers, build tools, and other default components to reduce the software that must be maintained and the tools available to an attacker after a container compromise.","It says security controls such as curated base images, runtime profiling, removal of unused components, vulnerability context, and automated rebuilding should be integrated into CI/CD so secure software delivery becomes the default path."],"insights":["A single vulnerable package in a base image can be duplicated across every application and container built from that image, making base-image hygiene a high-leverage remediation point.","In the cited NGINX customer example, more than 80% of the image's 152 packages were not being exercised, showing why a raw component inventory can substantially overstate immediate remediation urgency.","The article reports that one customer cut 5,286 initial findings to three unresolved vulnerabilities within 48 hours by combining runtime profiling, curated images, and removal of unused components.","The article frames AI-generated code as a governance issue when developers cannot identify the Python version or packages used by an AI system, rather than simply a productivity issue.","Treating remediation as a repeatable software-production process, rather than a response to scanner backlogs, is presented as a way to prevent complexity from becoming technical debt."],"referencedReports":[],"body":"\u003cp\u003eRapidFort’s sponsored article argues that AI-assisted development and the widespread use of open-source and third-party components are increasing the hidden complexity of modern software. It says application code is often only a small portion of what organizations ship, alongside operating systems, packages, libraries, frameworks, and transitive dependencies. The article urges leaders to focus less on total vulnerability counts and more on whether vulnerable components are running, reachable, exposed, known to be exploited, automatable, and likely to have meaningful impact.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes a software bill of materials, which lists included components, from a runtime bill of materials, which identifies what is actually used. It cites an NGINX image with 152 packages and 48 CVEs where only 47 packages were running, and says one customer reduced 5,286 findings to three unresolved vulnerabilities within 48 hours using profiling, curated images, and removal of unused components. It recommends integrating curated base images, runtime profiling, hardening, controlled software registries, and automated rebuilding into CI/CD so that security becomes part of normal software production rather than a downstream cleanup effort.\u003c/p\u003e\n"}]</script>
