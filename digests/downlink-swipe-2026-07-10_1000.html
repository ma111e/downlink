<script type="application/json" id="dl-articles">[{"n":1,"title":"Zimbra urges customers to patch critical web client XSS flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/zimbra-urges-customers-to-patch-critical-web-client-xss-flaw/","time":"11:47","priority":"MUST READ","score":92,"tldr":"Zimbra is urging customers using the Classic Web Client to upgrade to ZCS 10.1.19 to fix a critical stored XSS flaw that can be triggered by malicious emails and expose session or mailbox data. The bug was reported by Google’s Threat Analysis Group, raising concern because Zimbra flaws have repeatedly been targeted by state-backed hackers.","briefOverview":"\u003cp\u003eZimbra urged customers to patch a critical vulnerability affecting the Classic Web Client used to access the Zimbra Collaboration suite. The company released Zimbra 10.1.19 to fix a stored cross-site scripting flaw that has not yet received a CVE ID. Zimbra said any customer using the Classic Web Client should upgrade to ZCS v10.1.19 as soon as possible because the issue only impacts users of that client.\u003c/p\u003e\n\n\u003cp\u003eAttackers can exploit the flaw through specially crafted emails that execute malicious code when opened. Successful exploitation could allow threat actors to steal session data, account settings, or mailbox information. Zimbra has not tagged the vulnerability as exploited in the wild, but it was reported by Google’s Threat Analysis Group.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Zimbra security issues have frequently been exploited in recent years by Russian state-sponsored hackers. It cites prior activity involving Winter Vivern, APT29, and APT28 targeting Zimbra servers or flaws, including attacks against NATO-aligned organizations, vulnerable servers at mass scale, and Ukrainian government entities. It also notes that Shadowserver warned in April that more than 10,500 Zimbra Collaboration Suite instances exposed online remained vulnerable to ongoing attacks exploiting another XSS flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zimbra released Zimbra 10.1.19 to patch a critical stored cross-site scripting flaw affecting the Classic Web Client used to access the Zimbra Collaboration suite.","Attackers can exploit the flaw through specially crafted emails that execute malicious code when opened, potentially enabling theft of session data, account settings, or mailbox information.","Zimbra said the issue only impacts users of the Classic Web Client and urged those customers to upgrade to ZCS v10.1.19 as soon as possible.","The vulnerability has not yet received a CVE ID, and Zimbra has not said it is being exploited in the wild.","The flaw was reported by Google's Threat Analysis Group, and the article notes that Zimbra security issues have frequently been exploited by Russian state-sponsored hackers in recent years."],"insights":["The flaw has not yet received a CVE ID, so teams may need to track remediation by the ZCS 10.1.19 release rather than by a standard vulnerability identifier.","The issue affects only the Classic Web Client, which the article notes is still used because it is faster than Zimbra’s modern web client when loading large email folders.","Google’s Threat Analysis Group reported the flaw, which is notable because the group often identifies zero-day exploits used by state-backed hackers against high-risk individuals.","Zimbra servers have a recent history of being targeted by multiple Russian-linked groups, including Winter Vivern, APT29, and APT28, making prompt patching especially actionable for exposed environments."],"referencedReports":[{"title":"Patch Release Update: Zimbra 10.1.19","url":"https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-19/","publisher":"Zimbra","context":"The article cites Zimbra’s patch release notice warning Classic Web Client users to upgrade to ZCS v10.1.19 to address the flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eZimbra urged customers to patch a critical vulnerability affecting the Classic Web Client used to access the Zimbra Collaboration suite. The company released Zimbra 10.1.19 to fix a stored cross-site scripting flaw that has not yet received a CVE ID. Zimbra said any customer using the Classic Web Client should upgrade to ZCS v10.1.19 as soon as possible because the issue only impacts users of that client.\u003c/p\u003e\n\n\u003cp\u003eAttackers can exploit the flaw through specially crafted emails that execute malicious code when opened. Successful exploitation could allow threat actors to steal session data, account settings, or mailbox information. Zimbra has not tagged the vulnerability as exploited in the wild, but it was reported by Google’s Threat Analysis Group.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Zimbra security issues have frequently been exploited in recent years by Russian state-sponsored hackers. It cites prior activity involving Winter Vivern, APT29, and APT28 targeting Zimbra servers or flaws, including attacks against NATO-aligned organizations, vulnerable servers at mass scale, and Ukrainian government entities. It also notes that Shadowserver warned in April that more than 10,500 Zimbra Collaboration Suite instances exposed online remained vulnerable to ongoing attacks exploiting another XSS flaw.\u003c/p\u003e\n"},{"n":7,"title":"New MODBEACON RAT Uses gRPC Streaming for Encrypted C2 Traffic","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-modbeacon-rat-uses-grpc-streaming.html","time":"13:15","priority":"MUST READ","score":92,"tldr":"China-linked Silver Fox is using a new Rust-based RAT called MODBEACON, delivered through fake software installers and SEO poisoning, to target organizations in Asia. The malware uses encrypted gRPC streaming based on Xray/V2Ray transport to maintain stealthy C2, load plugins in memory, execute commands, and persist on infected hosts.","briefOverview":"\u003cp\u003eThe China-linked cybercrime group Silver Fox has been attributed to a new Rust-based remote access trojan called MODBEACON. QiAnXin said a mid-June 2026 campaign delivered the previously undocumented modular RAT through counterfeit software installers distributed via SEO campaigns. The campaign targeted technology, education, and state-owned enterprises in Asia, with command-and-control infrastructure hosted on Amazon and Cloudflare’s Content Delivery Network.\u003c/p\u003e\n\n\u003cp\u003eQiAnXin described the distributor behind the campaign as a hybrid threat actor combining the roles of a cybercriminal arms dealer and traffic broker. The article says one part of its operations expands infections across Asia through daily SEO activity for fraud business, while another propagates advanced trojans, rents high-value access, or targets the Cambodian gambling sector in criminal-on-criminal schemes. The campaign combines social engineering, custom malware, and post-compromise tooling to establish long-term access while minimizing detection on infected hosts.\u003c/p\u003e\n\n\u003cp\u003eMODBEACON is described as a memory-resident remote implant that can fetch additional modules, run operator commands, and maintain encrypted communications with attacker infrastructure. QiAnXin said the malware separates the loader and beacon, uses injectable configuration, has a plugin-based architecture, and uses gRPC tunnel streaming for communication. Its core capabilities include host fingerprinting, in-memory plugin loading, heartbeat messages, command-result reporting, and persistence through scheduled tasks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The China-linked cybercrime group Silver Fox has been attributed to a new Rust-based remote access trojan called MODBEACON.","QiAnXin said a mid-June 2026 campaign delivered MODBEACON through counterfeit software installers distributed via SEO campaigns, targeting technology, education, and state-owned enterprises in Asia.","MODBEACON is a memory-resident remote implant that can fetch additional modules, run operator commands, maintain encrypted communications with attacker infrastructure, and set persistence using scheduled tasks.","QiAnXin said MODBEACON uses a separated loader and beacon, injectable configuration, a plugin-based architecture, and gRPC tunnel streaming based on transport reused from the Xray/V2Ray open-source anti-censorship proxy framework.","The campaign’s command-and-control infrastructure is hosted on Amazon and Cloudflare’s Content Delivery Network."],"insights":["Silver Fox may appear to be a low-sophistication, high-activity operation, but QiAnXin says its activity reflects a more organized structure involving multiple distributors across Asia.","The MODBEACON campaign shows Silver Fox blending fraud-driven SEO distribution with more advanced access operations, including propagating advanced trojans, renting high-value access, and targeting the Cambodian gambling sector in criminal-on-criminal schemes.","MODBEACON’s use of gRPC tunnel streaming and transport reused from Xray/V2Ray is notable because QiAnXin describes it as the core highlight of a professionally engineered private C2 framework.","The malware’s plugin-based design makes the initial implant expandable for later activities such as information theft, lateral movement, proxy forwarding, or delivery of other payloads."],"referencedReports":[{"title":"Operation Phnom Penh: SilverFox Ghost Distributor Targets Specific Victims with MODBEACON","url":"https://ti.qianxin.com/blog/articles/operation-phnom-penh-silverfox-ghost-distributor-targets-specific-victims-with-modbeacon-en/","publisher":"QiAnXin","context":"The article relies on QiAnXin's analysis attributing MODBEACON to Silver Fox and describing the malware's architecture, delivery, and command-and-control methods.","category":"research","primary":true}],"body":"\u003cp\u003eThe China-linked cybercrime group Silver Fox has been attributed to a new Rust-based remote access trojan called MODBEACON. QiAnXin said a mid-June 2026 campaign delivered the previously undocumented modular RAT through counterfeit software installers distributed via SEO campaigns. The campaign targeted technology, education, and state-owned enterprises in Asia, with command-and-control infrastructure hosted on Amazon and Cloudflare’s Content Delivery Network.\u003c/p\u003e\n\n\u003cp\u003eQiAnXin described the distributor behind the campaign as a hybrid threat actor combining the roles of a cybercriminal arms dealer and traffic broker. The article says one part of its operations expands infections across Asia through daily SEO activity for fraud business, while another propagates advanced trojans, rents high-value access, or targets the Cambodian gambling sector in criminal-on-criminal schemes. The campaign combines social engineering, custom malware, and post-compromise tooling to establish long-term access while minimizing detection on infected hosts.\u003c/p\u003e\n\n\u003cp\u003eMODBEACON is described as a memory-resident remote implant that can fetch additional modules, run operator commands, and maintain encrypted communications with attacker infrastructure. QiAnXin said the malware separates the loader and beacon, uses injectable configuration, has a plugin-based architecture, and uses gRPC tunnel streaming for communication. Its core capabilities include host fingerprinting, in-memory plugin loading, heartbeat messages, command-result reporting, and persistence through scheduled tasks.\u003c/p\u003e\n"},{"n":8,"title":"Exposed Hacker Server Reveals WP-SHELLSTORM Backdooring Thousands of WordPress Sites","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/exposed-hacker-server-reveals-wp.html","time":"11:30","priority":"MUST READ","score":92,"tldr":"Researchers found an exposed server belonging to the WP-SHELLSTORM cybercrime crew, revealing tools and logs used to mass-scan over 1.4 million sites and backdoor thousands of mostly vulnerable WordPress installations. Site owners should urgently patch affected WordPress/Joomla plugins and hunt for webshells such as .bd.php, .wp-log.php, and .brq-*.php.","briefOverview":"\u003cp\u003eA cybercrime crew left one of its own servers exposed on the internet for 22 days, revealing the inner workings of an operation now tracked as WP-SHELLSTORM. Researchers found about 800MB of files, including webshells, exploit scripts, scan results, command history, and command-and-control settings. The operation targeted more than 1.4 million domains in its lists, but confirmed compromises were much lower, with Ctrl-Alt-Intel counting 25,195 sites with validated compromise evidence and SOCRadar reporting more than 5,700 active webshells.\u003c/p\u003e\n\n\u003cp\u003eThe campaign focused heavily on WordPress sites running outdated plugins, with the Breeze caching plugin flaw CVE-2026-3844 producing the most backdoors. The crew fired that exploit at more than 45,000 targets and, by its own count, backdoored over 17,000 of them, though the flaw only works when the non-default “Host Files Locally – Gravatars” setting is enabled. The toolkit covered 27 known flaws and also included Joomla-related targeting, including the JCE editor flaw CVE-2026-48907.\u003c/p\u003e\n\n\u003cp\u003eThe exposed server also showed an earlier campaign in May 2026 against corporate Java systems, where the crew used an old Nacos flaw, CVE-2021-29441, to pull 613 configuration files from 11 systems across nine companies. Those files included cloud login keys, database passwords, and Alipay RSA private keys. The article recommends patching affected WordPress and Joomla software, securing Nacos, checking for suspicious webshell filenames and fake kworker processes, and blocking known infrastructure tied to the operation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found an exposed server belonging to the WP-SHELLSTORM operation that contained about 800MB of webshells, exploit scripts, scan results, command history, and command-and-control settings.","The operation targeted more than 1.4 million domains in its lists, but confirmed compromises were much lower, with Ctrl-Alt-Intel identifying 25,195 sites with compromise evidence and SOCRadar reporting more than 5,700 active webshells.","The most productive exploit in the campaign was CVE-2026-3844 in the WordPress Breeze caching plugin, which the crew used against more than 45,000 targets and claimed had backdoored over 17,000 sites.","The exposed files showed the crew also ran an earlier campaign against corporate Java systems using CVE-2021-29441 in Nacos to steal configuration files containing cloud keys, database passwords, and Alipay RSA private keys.","The article advises administrators to patch affected WordPress and Joomla plugins, upgrade and secure Nacos, disable risky unauthenticated endpoints, search for webshell filenames, and check suspicious kworker-like processes."],"insights":["The 1.4 million figure is a target-list count rather than a compromise count, and the article shows why scan volume can be misleading by noting that one Joomla exploit was tried against more than 560,000 targets but succeeded on only 77.","The Breeze plugin flaw was highly productive for the crew but only applied when the non-default “Host Files Locally – Gravatars” setting was enabled, meaning configuration choices sharply affected real-world exposure.","The crew’s own operational mistake, a Python web server left open for 22 days, exposed enough logs and tooling for researchers to reconstruct the campaign despite the operators later deleting some log lines.","A process named like “[kworker/X:Y]” is specifically actionable as a hunt clue because the article explains that a real kernel thread should have no executable, command line, or network sockets.","The same infrastructure showed a shift from targeted theft of corporate credentials via exposed Nacos systems to higher-volume website backdooring, suggesting the exposed server captured more than one phase of the crew’s activity."],"referencedReports":[{"title":"WP-SHELLSTORM Expose 1.4M WordPress Sites","url":"https://socradar.io/blog/wp-shellstorm-expose-1-4m-wordpress-sites/","publisher":"SOCRadar","context":"The article cites SOCRadar’s threat intelligence writeup as a primary source for the exposed WP-SHELLSTORM server, tooling, logs, and compromise findings.","category":"research","primary":true},{"title":"Wordpress","url":"https://ctrlaltintel.com/research/Wordpress/","publisher":"Ctrl-Alt-Intel","context":"The article says Ctrl-Alt-Intel analyzed the same exposed directory and published its findings before SOCRadar.","category":"research","primary":true},{"title":"UNC5174 Chinese Threat Actor VShell","url":"https://www.sysdig.com/blog/unc5174-chinese-threat-actor-vshell","publisher":"Sysdig","context":"The article references Sysdig’s April 2025 analysis linking a SNOWLIGHT-to-VShell chain to suspected Chinese state group UNC5174.","category":"research","primary":false},{"title":"Operation Roundish","url":"https://ctrlaltintel.com/research/FancyBear/","publisher":"Ctrl-Alt-Intel","context":"The article cites Ctrl-Alt-Intel’s Operation Roundish research as a comparable case where an exposed directory revealed Fancy Bear tooling and logs.","category":"research","primary":false}],"body":"\u003cp\u003eA cybercrime crew left one of its own servers exposed on the internet for 22 days, revealing the inner workings of an operation now tracked as WP-SHELLSTORM. Researchers found about 800MB of files, including webshells, exploit scripts, scan results, command history, and command-and-control settings. The operation targeted more than 1.4 million domains in its lists, but confirmed compromises were much lower, with Ctrl-Alt-Intel counting 25,195 sites with validated compromise evidence and SOCRadar reporting more than 5,700 active webshells.\u003c/p\u003e\n\n\u003cp\u003eThe campaign focused heavily on WordPress sites running outdated plugins, with the Breeze caching plugin flaw CVE-2026-3844 producing the most backdoors. The crew fired that exploit at more than 45,000 targets and, by its own count, backdoored over 17,000 of them, though the flaw only works when the non-default “Host Files Locally – Gravatars” setting is enabled. The toolkit covered 27 known flaws and also included Joomla-related targeting, including the JCE editor flaw CVE-2026-48907.\u003c/p\u003e\n\n\u003cp\u003eThe exposed server also showed an earlier campaign in May 2026 against corporate Java systems, where the crew used an old Nacos flaw, CVE-2021-29441, to pull 613 configuration files from 11 systems across nine companies. Those files included cloud login keys, database passwords, and Alipay RSA private keys. The article recommends patching affected WordPress and Joomla software, securing Nacos, checking for suspicious webshell filenames and fake kworker processes, and blocking known infrastructure tied to the operation.\u003c/p\u003e\n"},{"n":6,"title":"Hackers Use Fake Microsoft Entra Passkey Enrollment to Gain Microsoft 365 Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/hackers-use-fake-microsoft-entra.html","time":"10:30","priority":"SHOULD READ","score":86,"tldr":"A threat actor tracked as O-UNC-066 is using phone calls and a fake Microsoft Entra passkey enrollment flow to trick Microsoft 365 users into approving access and letting attackers register their own passkeys. The campaign abuses organizations’ push toward passkey adoption to gain persistent account access for data extortion.","briefOverview":"\u003cp\u003eA threat actor tracked by Okta as \u003cstrong\u003eO-UNC-066\u003c/strong\u003e has been targeting organizations with voice-based fake security requests aimed at Microsoft 365 users. The callers persuade users that they need to register a new Microsoft Entra passkey, then direct them to a phishing kit that closely resembles the Microsoft passkey enrollment process. The campaign has targeted organizations in the food and beverage, technology, healthcare, automotive, construction, and aviation industries.\u003c/p\u003e\n\n\u003cp\u003eThe attack matters because it abuses a legitimate security upgrade process to gain unauthorized access to Microsoft accounts. Microsoft allows administrators to configure registration campaigns that encourage users to register passkeys during sign-in, and the threat actor uses that familiarity as a lure. Instead of the victim adding their own passkey, the attacker registers a passkey against the victim’s Microsoft account and can use that access for follow-on activity, including data extortion.\u003c/p\u003e\n\n\u003cp\u003eOkta said the phishing kit is an operator-controlled PHP panel that guides victims through the process in near real time rather than relying only on a static phishing page. The operator can adjust the flow based on the victim’s authentication requirements, including SMS one-time passwords, time-based one-time passwords, and push notifications with number matching. The fake passkey process also includes a 12-word recovery key step, which Okta assessed is a distraction while the attacker enrolls their own passkey.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor tracked by Okta as O-UNC-066 is targeting organizations with voice-based fake security requests that prompt Microsoft 365 users to enroll a new Microsoft Entra passkey.","The campaign has targeted the food and beverage, technology, healthcare, automotive, construction, and aviation industries.","The phishing kit imitates the Microsoft passkey enrollment process while allowing the threat actor to register their own passkey against the victim’s Microsoft account.","The operator-controlled PHP phishing kit can adapt the victim’s experience in real time to different multi-factor authentication requirements, including time-based one-time passwords, push notifications with number matching, and SMS one-time passwords.","Okta said a threat actor linked to O-UNC-066 has operated a data leak site since April 2026 under the name Pink, which Palo Alto Networks Unit 42 tracks as CL-CRI-1147 and describes as affiliated with The Com."],"insights":["The attackers are exploiting the timing of legitimate Microsoft Entra passkey registration campaigns, making a real security upgrade process serve as a convincing lure for victims.","The phishing kit does not simply steal a password; it lets an operator steer each victim through the exact authentication prompts required by that user’s account in near real time.","The fake passkey flow includes a 12-word “recovery key” step that Okta assesses is a distraction to keep the victim occupied while the attacker enrolls their own passkey.","Okta noted there is no indication that the phishing kit redirects users to third-party identity providers such as Okta, narrowing the described activity to Microsoft sign-in and passkey enrollment flows."],"referencedReports":[{"title":"Vishing Actors Target Microsoft Entra Passkey Enrollment","url":"https://www.okta.com/blog/threat-intelligence/vishing-actors-target-microsoft-entra-passkey-enrollment-/","publisher":"Okta","context":"The article cites Okta researcher Houssem Eddine Bordjiba’s analysis of O-UNC-066’s voice phishing campaign and phishing kit targeting Microsoft Entra passkey enrollment.","category":"research","primary":true}],"body":"\u003cp\u003eA threat actor tracked by Okta as \u003cstrong\u003eO-UNC-066\u003c/strong\u003e has been targeting organizations with voice-based fake security requests aimed at Microsoft 365 users. The callers persuade users that they need to register a new Microsoft Entra passkey, then direct them to a phishing kit that closely resembles the Microsoft passkey enrollment process. The campaign has targeted organizations in the food and beverage, technology, healthcare, automotive, construction, and aviation industries.\u003c/p\u003e\n\n\u003cp\u003eThe attack matters because it abuses a legitimate security upgrade process to gain unauthorized access to Microsoft accounts. Microsoft allows administrators to configure registration campaigns that encourage users to register passkeys during sign-in, and the threat actor uses that familiarity as a lure. Instead of the victim adding their own passkey, the attacker registers a passkey against the victim’s Microsoft account and can use that access for follow-on activity, including data extortion.\u003c/p\u003e\n\n\u003cp\u003eOkta said the phishing kit is an operator-controlled PHP panel that guides victims through the process in near real time rather than relying only on a static phishing page. The operator can adjust the flow based on the victim’s authentication requirements, including SMS one-time passwords, time-based one-time passwords, and push notifications with number matching. The fake passkey process also includes a 12-word recovery key step, which Okta assessed is a distraction while the attacker enrolls their own passkey.\u003c/p\u003e\n"},{"n":2,"title":"China, India ran separate spying campaigns against same Pakistani police force","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-india-ran-separate-spy-campaigns-against-same-police-force","time":"13:20","priority":"SHOULD READ","score":84,"tldr":"SentinelOne says China- and India-linked hackers ran separate espionage campaigns against Balochistan Police systems in Pakistan from 2024 to 2026, in some cases compromising the same networks. The intrusions exposed sensitive law enforcement and citizen data, reflecting China’s concerns over threats to its workers in Pakistan and India-Pakistan regional rivalry.","briefOverview":"\u003cp\u003eHacking groups linked to China and India conducted parallel, unconnected espionage operations against Pakistani law enforcement over more than two years, according to research published by SentinelOne. The activity ran between February 2024 and April 2026 and centered on the Balochistan Police, the force responsible for Pakistan’s southwestern province. SentinelLabs said the operations in some cases breached the exact same systems.\u003c/p\u003e\n\n\u003cp\u003eThe compromised systems reportedly held criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints. SentinelLabs assessed that China-linked interest was driven primarily by protecting Beijing’s nationals in Pakistan tied to the China-Pakistan Economic Corridor. The report assessed that the India-linked activity was likely connected to rivalry between India and Pakistan, with access to Balochistan Police data providing visibility into that conflict.\u003c/p\u003e\n\n\u003cp\u003eSentinelLabs described a compromise of the Balochistan Police Complaint Management System, where a China-linked operator planted malware disguised as a portal update. The executable displayed a fake “update complete” message while infecting the visitor’s device, and the tampered portal exposed both police users and members of the public. The China-nexus assessment was anchored by tools including PlugX and ShadowPad, while the India-nexus activity was tied with lower confidence to TAG-179, overlapping with clusters known as Bitter and Mysterious Elephant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SentinelOne reported that hacking groups linked to China and India conducted separate, unconnected espionage operations against Pakistani law enforcement between February 2024 and April 2026.","The activity centered on the Balochistan Police, whose compromised systems reportedly held criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints.","SentinelLabs assessed that China-linked interest was primarily driven by protecting Chinese nationals in Pakistan tied to the China-Pakistan Economic Corridor, while India-linked activity was likely tied to India-Pakistan rivalry.","SentinelLabs said a China-linked operator compromised the Balochistan Police Complaint Management System by planting malware disguised as a portal update that showed a fake “update complete” message while infecting visitors’ devices.","The China-nexus assessments were anchored by tools including PlugX and ShadowPad, while the India-nexus intrusions were tied with lower confidence to TAG-179, overlapping with clusters called Bitter and Mysterious Elephant."],"insights":["The same Pakistani police environment attracted separate China- and India-linked campaigns, showing that regional law enforcement systems can become overlapping intelligence targets for different foreign interests at the same time.","The compromised police systems were especially valuable because they concentrated many kinds of internal-security and citizen data, including biometrics, identity-linked registrations, complaints, and personnel files, in one place.","The tampered complaint portal created risk beyond police users because citizens also used the site to check complaint status, meaning a government service for the public could expose ordinary visitors to infection.","SentinelLabs avoided naming a single Chinese group and instead grouped the activity by toolsets and artifacts, highlighting that shared tools like PlugX and ShadowPad can make precise actor attribution difficult.","The report links Pakistan’s centralization and digitization of policing to a growing concentration of high-value data that adversaries may continue to target."],"referencedReports":[{"title":"One Target: China-India Espionage Converge on Pakistani Law Enforcement","url":"https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/","publisher":"SentinelOne SentinelLabs","context":"The article is based on SentinelOne research describing separate China- and India-linked espionage operations against the Balochistan Police in Pakistan.","category":"research","primary":true}],"body":"\u003cp\u003eHacking groups linked to China and India conducted parallel, unconnected espionage operations against Pakistani law enforcement over more than two years, according to research published by SentinelOne. The activity ran between February 2024 and April 2026 and centered on the Balochistan Police, the force responsible for Pakistan’s southwestern province. SentinelLabs said the operations in some cases breached the exact same systems.\u003c/p\u003e\n\n\u003cp\u003eThe compromised systems reportedly held criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints. SentinelLabs assessed that China-linked interest was driven primarily by protecting Beijing’s nationals in Pakistan tied to the China-Pakistan Economic Corridor. The report assessed that the India-linked activity was likely connected to rivalry between India and Pakistan, with access to Balochistan Police data providing visibility into that conflict.\u003c/p\u003e\n\n\u003cp\u003eSentinelLabs described a compromise of the Balochistan Police Complaint Management System, where a China-linked operator planted malware disguised as a portal update. The executable displayed a fake “update complete” message while infecting the visitor’s device, and the tampered portal exposed both police users and members of the public. The China-nexus assessment was anchored by tools including PlugX and ShadowPad, while the India-nexus activity was tied with lower confidence to TAG-179, overlapping with clusters known as Bitter and Mysterious Elephant.\u003c/p\u003e\n"},{"n":3,"title":"Study of 281 Free Android VPN Apps Finds Traffic Leaks, Unencrypted Data, and Tracking","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/study-of-281-free-android-vpn-apps.html","time":"10:56","priority":"SHOULD READ","score":84,"tldr":"A study of 281 popular free Android VPN apps found widespread security and privacy failures, including traffic and DNS leaks, unencrypted data, tracking, weak encryption, and even hijackable VPN configurations. The main takeaway is that many free VPNs do not provide the protection they promise and may expose users to greater risk.","briefOverview":"\u003cp\u003eResearchers tested 281 popular free Android VPN apps from the Google Play Store using a framework called MVPNalyzer and found that many failed to keep user traffic private and secure. Apps flagged with at least one problem had been installed more than 2.4 billion times. The study was presented at the NDSS security conference in February 2026 by researchers from the University of Michigan, the University of New Mexico, and IIT Delhi.\u003c/p\u003e\n\n\u003cp\u003eThe most serious issue involved five apps that downloaded configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they controlled. The researchers also found that 29 apps leaked traffic outside the encrypted tunnel, including DNS lookups, while 61 apps sent some data in plain text. Separately, 169 apps did not disguise their traffic as anything other than VPN traffic, even though many advertised that they could beat blocking or unlock restricted content.\u003c/p\u003e\n\n\u003cp\u003eThe study also found widespread tracking and weak setups inside the apps. Seventy-six apps sent the device Advertising ID, more than 80% contacted known advertising and tracking servers, and one app sent exact GPS coordinates. Among 108 apps with OpenVPN configuration files examined, only one followed every security best practice measured, while some used weak or outdated encryption or disabled encryption entirely.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers tested 281 popular free Android VPN apps from the Google Play Store with a system called MVPNalyzer and found that apps with at least one flagged problem had more than 2.4 billion installs.","The study found that 29 apps leaked user traffic outside the encrypted tunnel, including DNS lookups, and 61 apps sent some data in plain text that could be read by someone watching the network.","Five apps downloaded their configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they control.","The researchers found that 76 apps sent the device Advertising ID, more than 80% of the apps contacted known advertising and tracking servers, and one app sent exact GPS coordinates.","Among 108 apps with OpenVPN configuration files examined, only one followed every security best practice measured, while some used weak or outdated encryption or disabled encryption entirely."],"insights":["The most dangerous problems described in the study, including cleartext configuration downloads and weak tunnel settings, are not visible to users from the app interface, so the article says users should judge VPNs by the provider’s credibility and independent audits rather than advertised protocols or claims.","The article notes that Google Play safety labels and the “Verified” badge may function more like marketing signals than real security guarantees, because many flawed VPN apps still ranked highly and passed automated store checks.","A VPN does not eliminate the need for trust; it shifts trust from the internet provider or local network to the VPN app maker, which is especially important because many tested apps also contacted advertising and tracking servers.","For users in places where VPN use is risky, the finding that 169 apps did not disguise their traffic as anything other than VPN traffic is especially consequential because it can make the user easy to identify rather than safer.","The article ties the MVPNalyzer findings to other 2025 research, showing that the problem is not isolated to one test set but part of a broader pattern of free Android VPN apps combining privacy promises with weak engineering and hidden data collection."],"referencedReports":[{"title":"MVPNalyzer study of Android VPN apps","url":"https://www.ndss-symposium.org/wp-content/uploads/2026-s1573-paper.pdf","publisher":"NDSS Symposium","context":"The article is based on the MVPNalyzer research presented at NDSS by researchers from the University of Michigan, the University of New Mexico, and IIT Delhi.","category":"research","primary":true},{"title":"Hidden Links: Analyzing Secret Families of VPN Apps","url":"https://citizenlab.ca/2025/08/hidden-links-analyzing-secret-families-of-vpn-apps/","publisher":"Citizen Lab and Arizona State University","context":"The article cites this research as related evidence that popular Android VPN apps were secretly linked, shared hard-coded passwords, and collected location data.","category":"research","primary":false},{"title":"Insecure Mobile VPNs: The Hidden Danger","url":"https://zimperium.com/blog/insecure-mobile-vpns-the-hidden-danger","publisher":"Zimperium","context":"The article cites this report as related research finding that some free VPN apps still bundled an OpenSSL version vulnerable to Heartbleed and requested excessive permissions.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers tested 281 popular free Android VPN apps from the Google Play Store using a framework called MVPNalyzer and found that many failed to keep user traffic private and secure. Apps flagged with at least one problem had been installed more than 2.4 billion times. The study was presented at the NDSS security conference in February 2026 by researchers from the University of Michigan, the University of New Mexico, and IIT Delhi.\u003c/p\u003e\n\n\u003cp\u003eThe most serious issue involved five apps that downloaded configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they controlled. The researchers also found that 29 apps leaked traffic outside the encrypted tunnel, including DNS lookups, while 61 apps sent some data in plain text. Separately, 169 apps did not disguise their traffic as anything other than VPN traffic, even though many advertised that they could beat blocking or unlock restricted content.\u003c/p\u003e\n\n\u003cp\u003eThe study also found widespread tracking and weak setups inside the apps. Seventy-six apps sent the device Advertising ID, more than 80% contacted known advertising and tracking servers, and one app sent exact GPS coordinates. Among 108 apps with OpenVPN configuration files examined, only one followed every security best practice measured, while some used weak or outdated encryption or disabled encryption entirely.\u003c/p\u003e\n"},{"n":4,"title":"Unpatched XRING Flaw in XQUIC Lets Remote Clients Crash HTTP/3 Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/unpatched-xring-flaw-in-xquic-lets.html","time":"11:47","priority":"SHOULD READ","score":82,"tldr":"A flaw dubbed XRING in Alibaba’s XQUIC HTTP/3 library lets unauthenticated remote clients crash affected servers with a small amount of valid QPACK traffic. All releases through v1.9.4 are affected and no patch is available, so operators should disable QPACK dynamic tables or HTTP/3 until a fix ships.","briefOverview":"\u003cp\u003eFoxIO researcher Sébastien Féry disclosed an unpatched flaw in Alibaba’s XQUIC library on July 8 and nicknamed it XRING. The article says any remote client can crash an HTTP/3 server with about 260 bytes of ordinary, specification-compliant QPACK traffic, without login or malformed packets. Every release through XQUIC v1.9.4 is affected, with no fixed release and no CVE as of July 10.\u003c/p\u003e\n\n\u003cp\u003eThe risk extends beyond Alibaba because XQUIC is open source and can be embedded in other servers that serve HTTP/3 with default QPACK settings. The article specifically mentions Tengine, Alibaba’s Nginx-based web server, which FoxIO says fronts the company’s cloud and CDN on sites including Taobao and Alipay. Until a fix ships, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or drop HTTP/3 support entirely.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in XQUIC’s handling of a ring buffer used for QPACK’s dynamic header table when the table grows. In one copy case, the code sizes leftover tail data against the new buffer’s capacity instead of the old one, causing an overcount that can lead to an unsigned size_t underflow and an out-of-bounds memory copy. FoxIO demonstrated a crash, said a proof of concept is public, and reported no exploitation in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FoxIO researcher Sébastien Féry disclosed an unpatched XQUIC flaw called XRING on July 8 that lets a remote unauthenticated client crash an HTTP/3 server with about 260 bytes of legal QPACK traffic.","Every XQUIC release through v1.9.4 is affected, and as of July 10 there is no fixed release and no CVE.","The flaw is in XQUIC’s ring buffer handling when growing the QPACK dynamic table, where one copy path uses the new buffer capacity instead of the old one and can trigger an unsigned size_t underflow.","XQUIC is embedded by other servers that support HTTP/3, including Tengine, Alibaba’s Nginx-based web server, which FoxIO says fronts Alibaba cloud and CDN sites including Taobao and Alipay.","Until a fix is available, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or disable HTTP/3 entirely."],"insights":["The attack does not rely on malformed packets or authentication; the article emphasizes that all values used in the proof of concept comply with QPACK rules, making ordinary-looking traffic sufficient to trigger the crash.","A one-byte table growth from 64 bytes to 65 bytes can be enough to reach the faulty resize logic when the write cursor is positioned near the end of the ring buffer.","The impact extends beyond Alibaba because XQUIC is open source and may be embedded in any HTTP/3 server using the library with default QPACK settings.","The crash was caught by glibc’s _FORTIFY_SOURCE=2 in FoxIO’s release build, but the article says that without this check the same bug writes out of bounds past the end of the new buffer.","FoxIO says it attempted disclosure five times between April 7 and May 9 before publishing details, while the article states there was still no patch or CVE as of July 10."],"referencedReports":[{"title":"XRING: Crashing XQUIC with spec-compliant QPACK instructions","url":"https://foxio.io/blog/xring-crashing-xquic-with-spec-compliant-qpack-instructions","publisher":"FoxIO","context":"The article says FoxIO researcher Sébastien Féry disclosed the XRING flaw in this linked technical write-up.","category":"research","primary":true},{"title":"CVEs 2026: QUIC denial of service","url":"https://www.haproxy.com/blog/cves-2026-quic-denial-of-service","publisher":"HAProxy","context":"The article references HAProxy’s February write-up about two patched QUIC crashes, including an integer underflow during token validation.","category":"advisory","primary":false}],"body":"\u003cp\u003eFoxIO researcher Sébastien Féry disclosed an unpatched flaw in Alibaba’s XQUIC library on July 8 and nicknamed it XRING. The article says any remote client can crash an HTTP/3 server with about 260 bytes of ordinary, specification-compliant QPACK traffic, without login or malformed packets. Every release through XQUIC v1.9.4 is affected, with no fixed release and no CVE as of July 10.\u003c/p\u003e\n\n\u003cp\u003eThe risk extends beyond Alibaba because XQUIC is open source and can be embedded in other servers that serve HTTP/3 with default QPACK settings. The article specifically mentions Tengine, Alibaba’s Nginx-based web server, which FoxIO says fronts the company’s cloud and CDN on sites including Taobao and Alipay. Until a fix ships, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or drop HTTP/3 support entirely.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in XQUIC’s handling of a ring buffer used for QPACK’s dynamic header table when the table grows. In one copy case, the code sizes leftover tail data against the new buffer’s capacity instead of the old one, causing an overcount that can lead to an unsigned size_t underflow and an out-of-bounds memory copy. FoxIO demonstrated a crash, said a proof of concept is public, and reported no exploitation in the wild.\u003c/p\u003e\n"},{"n":9,"title":"The Email With Nothing to Scan: A 1 MB HTML Attachment That Renders Its Own Phishing Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/html-attachment-local-render-no-url-to-scan","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email used a large self-contained HTML attachment to render a credential-harvesting page locally, leaving no URL for gateways to reputation-check and exceeding deep inspection limits. The key lesson is that authenticated email and clean static scans are not enough; detection must rely on sender behavior, message context, and post-delivery remediation.","briefOverview":"\u003cp\u003eAn external first-time Gmail sender delivered a one-line email that told the recipient to open a large HTML attachment named like a finished report. The message had no malicious link in the body, no payment demand, and no urgent credential-reset language. SPF, DKIM, DMARC, and ARC all passed because the email was genuinely sent through Gmail and signed with a gmail.com key.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the attachment was the central technique because it rendered the phishing page locally in the recipient’s browser. Since the page was inside the file, no URL appeared in the message for a secure email gateway to extract and reputation-check. The static scan returned clean, and deeper content analysis failed because the HTML file exceeded the analyzer’s processing limit.\u003c/p\u003e\n\n\u003cp\u003eThe case is mapped to MITRE ATT\u0026amp;CK T1566.001 for spearphishing attachment and T1027 for obfuscated files or information. The article says the meaningful detection signals were behavioral and contextual, including a first-time external sender, no prior correspondence, a high-risk flag, a one-line body, and a large attachment. It argues that clean verdicts should be treated as provisional and that defenses need post-delivery detection and the ability to retract messages after they reach mailboxes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An external first-time Gmail sender delivered a one-line email directing the recipient to open a roughly 1 MB HTML attachment named like a full report.","SPF, DKIM, DMARC, and ARC all passed because the message was genuinely sent through Gmail and signed with a gmail.com key.","The HTML attachment rendered its phishing page locally in the browser, leaving no malicious URL in the message for a secure email gateway to extract and reputation-check.","Static scanning returned a clean verdict, while deeper content analysis failed because the HTML file exceeded the analyzer's processing limit.","The article says the useful detection signals were the first-time external sender, no prior correspondence, high-risk flag, minimal body text, and large attachment."],"insights":["The article emphasizes that passing SPF, DKIM, DMARC, and ARC can still be consistent with a high-risk phishing email because those checks only show that the message was authentically sent, not that it is safe.","The attachment’s size was not incidental; the article describes the analyzer’s failure to process the file as part of the technique because it prevented deeper inspection of embedded forms, scripts, redirects, or remote resource calls.","The most actionable pre-open signals were behavioral and contextual rather than technical reputation indicators: a first-time external sender, no prior correspondence, a high-risk flag, a one-line body, and a large attachment.","The article argues that a clean scan verdict should be treated as provisional when malicious behavior may only become visible after delivery through sandbox analysis or user reporting."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for statistics attributing 16% of breaches to phishing as the initial-access vector and 39% to stolen credentials.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references it as documenting a steady shift toward identity-based and evasive delivery.","category":"research","primary":false},{"title":"FBI IC3 2024 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites it for ranking phishing as the most-reported crime type by complaint volume.","category":"research","primary":false},{"title":"Cost of a Data Breach 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article references it to support the point that the cost of a single breach is high enough that one missed attachment is significant.","category":"research","primary":false}],"body":"\u003cp\u003eAn external first-time Gmail sender delivered a one-line email that told the recipient to open a large HTML attachment named like a finished report. The message had no malicious link in the body, no payment demand, and no urgent credential-reset language. SPF, DKIM, DMARC, and ARC all passed because the email was genuinely sent through Gmail and signed with a gmail.com key.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that the attachment was the central technique because it rendered the phishing page locally in the recipient’s browser. Since the page was inside the file, no URL appeared in the message for a secure email gateway to extract and reputation-check. The static scan returned clean, and deeper content analysis failed because the HTML file exceeded the analyzer’s processing limit.\u003c/p\u003e\n\n\u003cp\u003eThe case is mapped to MITRE ATT\u0026amp;CK T1566.001 for spearphishing attachment and T1027 for obfuscated files or information. The article says the meaningful detection signals were behavioral and contextual, including a first-time external sender, no prior correspondence, a high-risk flag, a one-line body, and a large attachment. It argues that clean verdicts should be treated as provisional and that defenses need post-delivery detection and the ability to retract messages after they reach mailboxes.\u003c/p\u003e\n"},{"n":5,"title":"From 17,000 to 1.1 Million Assets: How Lumen Technologies Rebuilt Exposure Management at Scale","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/from-17000-to-11-million-assets-how.html","time":"11:39","priority":"MAY READ","score":52,"tldr":"Lumen Technologies used Axonius to reconcile data from more than 40 disconnected systems, revealing its asset inventory was vastly undercounted and growing known devices from about 17,000 to 1.1 million. The key takeaway is that trusted asset data is the foundation for effective exposure management, faster zero-day response, and risk-based remediation.","briefOverview":"\u003cp\u003eLumen Technologies used the Axonius asset intelligence platform to reconcile data from more than 40 disconnected IT and security systems into one trusted view. The effort showed that its asset inventory was far larger than existing records indicated, growing from about 17,000 known cyber assets to 500,000 devices after initial reconciliation and approximately 1.1 million devices currently. Geoff Krahn, Director of Product and Platform Security at Lumen, said the visibility helped the organization quantify responsibilities and highlight gaps in controls.\u003c/p\u003e\n\n\u003cp\u003eThe article says trusted asset data changed how Lumen handles exposure management and urgent vulnerability response. Krahn’s team can now identify affected systems, determine whether they are externally exposed, and establish ownership within minutes when a critical vulnerability appears. Lumen also built an Application Posture Dashboard in Axonius by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status to evaluate risk at the application level.\u003c/p\u003e\n\n\u003cp\u003eThe article contrasts Lumen’s newer approach with a previous “scan and spam” model that prioritized findings mainly by severity scores. With asset context, business criticality, and control coverage, Lumen uses Axonius Exposures to identify remediations expected to deliver the greatest risk reduction. The visibility also supported leadership decisions, including a cloud migration, roughly 10 times higher security spending, and board-level reporting on asset coverage, EDR deployment, and compliance insights.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lumen Technologies used the Axonius asset intelligence platform to reconcile data from more than 40 disconnected systems into one trusted view.","Lumen’s known cyber assets increased from about 17,000 in existing inventories to 500,000 after initial reconciliation and approximately 1.1 million devices currently.","Lumen’s team can now identify systems affected by a critical vulnerability, determine whether they are externally exposed, and establish ownership within minutes.","Lumen built an Application Posture Dashboard within Axonius to evaluate risk at the application level by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status.","Lumen’s leadership used Axonius-generated visibility to support cloud migration decisions, increase security spending to roughly 10 times its previous level, and provide board-level reporting on asset coverage, EDR deployment, and compliance insights."],"insights":["Lumen’s case shows that having many inventory tools does not guarantee visibility, since more than 40 disconnected IT and security systems still left the company’s known asset count off by a factor of 60.","Reliable asset ownership data directly improved incident response, because Lumen previously joined incident response calls without knowing who owned affected systems.","The article presents asset data quality as a feedback loop: better asset data enables smarter exposure management, while exposure management outcomes reveal where the asset data still needs improvement.","Quantified visibility changed executive decision-making at Lumen, contributing to roughly 10 times higher security spending and a cloud migration decision that the company associated with a 40% overall risk reduction.","Lumen’s shift away from “scan and spam” suggests that vulnerability prioritization based mainly on severity scores can bury important issues unless paired with business criticality, control coverage, and asset context."],"referencedReports":[],"body":"\u003cp\u003eLumen Technologies used the Axonius asset intelligence platform to reconcile data from more than 40 disconnected IT and security systems into one trusted view. The effort showed that its asset inventory was far larger than existing records indicated, growing from about 17,000 known cyber assets to 500,000 devices after initial reconciliation and approximately 1.1 million devices currently. Geoff Krahn, Director of Product and Platform Security at Lumen, said the visibility helped the organization quantify responsibilities and highlight gaps in controls.\u003c/p\u003e\n\n\u003cp\u003eThe article says trusted asset data changed how Lumen handles exposure management and urgent vulnerability response. Krahn’s team can now identify affected systems, determine whether they are externally exposed, and establish ownership within minutes when a critical vulnerability appears. Lumen also built an Application Posture Dashboard in Axonius by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status to evaluate risk at the application level.\u003c/p\u003e\n\n\u003cp\u003eThe article contrasts Lumen’s newer approach with a previous “scan and spam” model that prioritized findings mainly by severity scores. With asset context, business criticality, and control coverage, Lumen uses Axonius Exposures to identify remediations expected to deliver the greatest risk reduction. The visibility also supported leadership decisions, including a cloud migration, roughly 10 times higher security spending, and board-level reporting on asset coverage, EDR deployment, and compliance insights.\u003c/p\u003e\n"}]</script>
