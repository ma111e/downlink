<script type="application/json" id="dl-articles">[{"n":4,"title":"FBI Links North Korea's TraderTraitor to Record $6.43 Billion Binance Crypto Heist","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/fbi-links-north-koreas-tradertraitor-to.html","time":"07:03","priority":"MUST READ","score":98,"tldr":"The FBI attributed the record $6.43 billion Binance cryptocurrency theft to North Korea-linked TraderTraitor (Jade Sleet), with attackers converting much of the stolen assets to Ethereum for laundering. About $2.85 billion has been frozen, while Binance has begun gradually restoring withdrawals after the incident.","briefOverview":"\u003cp\u003eThe FBI attributed the theft of more than $6 billion in virtual assets from Binance to TraderTraitor, a North Korea-aligned group also tracked as Jade Sleet, Pressure Chollima, PUKCHONG, Slow Pisces, and UNC4899. The FBI, U.S. Secret Service, and IRS Criminal Investigation observed the group converting stolen assets primarily into Ethereum. The agency said the assets are expected to undergo further laundering through decentralized-finance and instant-swap services, and published wallet addresses associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(6.43 billion theft eclipsed the \\)\u003c/span\u003e1.46 billion stolen from Bybit in February 2025, making it the largest cryptocurrency theft in history. The funds were stolen across 11 blockchains, with 82% held on Ethereum and Bitcoin, and $2.85 billion has been frozen on-chain by Tether, Circle, Ripple, Arbitrum, and Optimism. Binance paused withdrawals after the incident but began progressively restoring them following security and readiness checks, while deposits remained available.\u003c/p\u003e\n\n\u003cp\u003eTraderTraitor has been active since at least 2020 and has previously been linked to cryptocurrency thefts involving DMM Bitcoin, Bybit, KelpDAO, and Bitget. Recent reporting described the group using trojanized Terraform providers and fake recruitment approaches to target people connected with cybersecurity, AI, blockchain, and recruitment companies. The malicious Terraform provider delivers a Bash loader that downloads operating-system-specific malware, including the FLATROOF information stealer and the ROOFDECK backdoor, affecting macOS, Linux, and Windows systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI attributed the theft of more than $6 billion in virtual assets from Binance to the North Korea-aligned TraderTraitor group, also known as Jade Sleet and several other names.","U.S. agencies observed the attackers converting stolen assets primarily into Ethereum, which the FBI said could be further laundered through decentralized finance and instant-swap services.","The $6.43 billion theft surpassed the $1.46 billion taken from Bybit in February 2025, making it the largest cryptocurrency theft in history according to the article.","Tether, Circle, Ripple, Arbitrum, and Optimism froze $2.85 billion of the $6.43 billion stolen assets on-chain.","Binance resumed the first phase of withdrawals after pausing them following the incident, while deposit services remained open."],"insights":["Although the theft spanned 11 blockchains, 82% of the stolen assets were on Ethereum and Bitcoin, showing that the largest share was concentrated in two major cryptocurrency ecosystems.","More than $2.85 billion of the $6.43 billion stolen was frozen on-chain by five platforms—Tether, Circle, Ripple, Arbitrum, and Optimism—demonstrating that a substantial portion of the assets could still be blocked after the theft.","TraderTraitor’s operations extend beyond cryptocurrency platforms: the group has used fake recruiting approaches and trojanized Terraform providers to target people in cybersecurity, AI, blockchain, and recruitment-related roles.","The malicious Terraform provider delivers a Bash-based downloader that selects malware for the victim’s operating system, allowing the campaign to target macOS, Linux, and Windows systems."],"referencedReports":[{"title":"North Korea Responsible for $6 Billion Binance Attack","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack","publisher":"fbi","context":"The FBI advisory attributes the Binance theft to TraderTraitor and describes the group’s apparent conversion of stolen assets into Ethereum for laundering.","category":"advisory","primary":true},{"title":"Binance: Largest Hack in History","url":"https://www.elliptic.co/insights/binance-largest-hack-in-history/","publisher":"elliptic","context":"The article cites Elliptic’s blockchain analysis on the scale of the theft and prior cryptocurrency thefts attributed to North Korea-linked actors.","category":"research","primary":false},{"title":"Suspected TraderTraitor Group Uses Trojanized Terraform Provider to Deliver Malware","url":"https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver","publisher":"zscaler-threatlabz","context":"The article references Zscaler ThreatLabz reporting that TraderTraitor used a trojanized Terraform provider as a malware-delivery method.","category":"research","primary":false},{"title":"Tracking AI Adoption in North Korean Threat Actor Tradecraft","url":"https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/","publisher":"microsoft","context":"The article cites Microsoft’s analysis of Jade Sleet using front companies, recruitment-themed targeting, and AI-assisted lures.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI attributed the theft of more than $6 billion in virtual assets from Binance to TraderTraitor, a North Korea-aligned group also tracked as Jade Sleet, Pressure Chollima, PUKCHONG, Slow Pisces, and UNC4899. The FBI, U.S. Secret Service, and IRS Criminal Investigation observed the group converting stolen assets primarily into Ethereum. The agency said the assets are expected to undergo further laundering through decentralized-finance and instant-swap services, and published wallet addresses associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(6.43 billion theft eclipsed the \\)\u003c/span\u003e1.46 billion stolen from Bybit in February 2025, making it the largest cryptocurrency theft in history. The funds were stolen across 11 blockchains, with 82% held on Ethereum and Bitcoin, and $2.85 billion has been frozen on-chain by Tether, Circle, Ripple, Arbitrum, and Optimism. Binance paused withdrawals after the incident but began progressively restoring them following security and readiness checks, while deposits remained available.\u003c/p\u003e\n\n\u003cp\u003eTraderTraitor has been active since at least 2020 and has previously been linked to cryptocurrency thefts involving DMM Bitcoin, Bybit, KelpDAO, and Bitget. Recent reporting described the group using trojanized Terraform providers and fake recruitment approaches to target people connected with cybersecurity, AI, blockchain, and recruitment companies. The malicious Terraform provider delivers a Bash loader that downloads operating-system-specific malware, including the FLATROOF information stealer and the ROOFDECK backdoor, affecting macOS, Linux, and Windows systems.\u003c/p\u003e\n"},{"n":1,"title":"Hackers Steal About $2.7 Million From Polymarket Traders via Hijacked DebugBear Script","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-steal-about-27-million-from.html","time":"07:25","priority":"SHOULD READ","score":88,"tldr":"A DNS compromise at DebugBear caused Polymarket to load a malicious third-party script that hijacked authenticated trading sessions and stole roughly $2.7 million from users. Polymarket removed the script, paused relayer activity, reset sessions, and is refunding affected traders.","briefOverview":"\u003cp\u003eOn October 29, malicious code loaded on Polymarket through a replaced DebugBear page-speed monitoring script used some signed-in traders’ active sessions to sell positions and move funds to a hacker-controlled wallet. Polymarket said it would refund about \u003cspan class=\"math inline\"\u003e\\(2.7 million to 726 affected wallets, while blockchain records showed roughly \\)\u003c/span\u003e2.64 million reaching the attackers’ wallet in under an hour. DebugBear said its DNS records had been compromised through its domain registrar and that initial findings indicated the incident targeted one customer website.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the script read account details stored in the browser, including trading API keys, then located Polymarket’s order function and transaction signer. It did not send passwords, seed phrases, or private keys to its server; instead, it used the account’s existing signing capability and Polymarket’s relayer to submit requests. Polymarket removed the script, paused relayer actions and trading, cleared caches, reset active sessions, and referred the matter to law enforcement. The company also said it would pay an additional \u003cspan class=\"math inline\"\u003e\\(1.19 million to about 5,500 wallets affected by the trading pause or taken positions, for total returns of \\)\u003c/span\u003e3.9 million.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A compromised DebugBear script loaded by Polymarket on October 29 used signed-in traders’ existing access to sell positions or transfer assets to a hacker-controlled wallet.","Polymarket said it is refunding about $2.7 million to 726 affected wallets, while blockchain records showed about $2.64 million in crypto reached the attackers’ wallet in less than an hour.","DebugBear said its DNS records were compromised through its domain registrar and that its initial findings indicated the incident targeted one customer website.","The malicious code used Polymarket account information and the account’s own transaction-approval mechanism, rather than sending passwords, seed phrases, or private keys to its server.","Polymarket removed the script, paused relayer actions, cleared caches, reset active sessions, and referred the incident to law enforcement."],"insights":["The malicious script did not need to steal passwords, seed phrases, or private keys because it could use the transaction-approval capability already available in an authenticated Polymarket page.","Allowing a trusted content delivery address in a website security policy does not ensure the code served from that address is unchanged; the article notes that Subresource Integrity can make browsers reject altered files.","DebugBear provided separate copies of its monitoring script to customers, and researchers found that the swapped file was specifically Polymarket’s copy rather than a broadly changed script.","The attackers moved the stolen 28.6 million POL tokens to three additional addresses within about 10 minutes of the theft ending, according to the cited transaction history."],"referencedReports":[{"title":"Polymarket Breach Alert: Wallet Draining Code Found in a Third-Party Script","url":"https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/","publisher":"hudson-rock","context":"Hudson Rock analyzed the malicious DebugBear-hosted file and described how it used authenticated Polymarket sessions to drain trader assets.","category":"research","primary":true},{"title":"Polymarket DebugBear Wallet Drainer","url":"https://ohey.ca/research/polymarket-debugbear-wallet-drainer/","publisher":"ohey","context":"Ohey researchers traced the altered DebugBear infrastructure and the attacker wallet's transaction timeline.","category":"research","primary":true}],"body":"\u003cp\u003eOn October 29, malicious code loaded on Polymarket through a replaced DebugBear page-speed monitoring script used some signed-in traders’ active sessions to sell positions and move funds to a hacker-controlled wallet. Polymarket said it would refund about \u003cspan class=\"math inline\"\u003e\\(2.7 million to 726 affected wallets, while blockchain records showed roughly \\)\u003c/span\u003e2.64 million reaching the attackers’ wallet in under an hour. DebugBear said its DNS records had been compromised through its domain registrar and that initial findings indicated the incident targeted one customer website.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the script read account details stored in the browser, including trading API keys, then located Polymarket’s order function and transaction signer. It did not send passwords, seed phrases, or private keys to its server; instead, it used the account’s existing signing capability and Polymarket’s relayer to submit requests. Polymarket removed the script, paused relayer actions and trading, cleared caches, reset active sessions, and referred the matter to law enforcement. The company also said it would pay an additional \u003cspan class=\"math inline\"\u003e\\(1.19 million to about 5,500 wallets affected by the trading pause or taken positions, for total returns of \\)\u003c/span\u003e3.9 million.\u003c/p\u003e\n"},{"n":3,"title":"CVSS 10.0 LXD, MicroCloud Flaw Lets Attackers Impersonate Trusted Clients Without a Private Key","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-lxd-and-microcloud-flaw-cvss.html","time":"08:51","priority":"SHOULD READ","score":88,"tldr":"Canonical patched CVE-2026-112816, a CVSS 10.0 LXD and MicroCloud flaw that lets network-reachable attackers impersonate trusted mTLS clients using only their public certificates. Update LXD and MicroCloud immediately and restrict HTTPS API access until patched.","briefOverview":"\u003cp\u003eCanonical released fixes for CVE-2026-112816, a CVSS 10.0 flaw affecting LXD and MicroCloud. The issue could allow an attacker with network access to the HTTPS API and a trusted client’s public certificate to log in as that client without its private key. If the impersonated client has sufficient privileges, Canonical said the attacker could gain root access to the host machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from the server accepting any certificate in a supplied certificate chain that appears in its trust store, although only the first certificate is proven to belong to the connecting client. An attacker could therefore attach a trusted client’s public certificate behind their own certificate and be accepted as that trusted client. Canonical advised updating LXD and MicroCloud, verifying the installed version after refreshing snaps, and restricting network access to the API until patches are in place; there is no public evidence the flaw has been exploited.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-112816 is a CVSS 10.0 flaw in Canonical LXD and MicroCloud that can allow an attacker to impersonate a trusted client without its private key.","The issue occurs because the server checked every certificate supplied by a client against its trust store, even though the connection proves ownership only of the private key for the first certificate.","Exploitation requires network access to the HTTPS API and a public certificate for a client that the server already trusts.","Canonical released fixed LXD versions 6.10.1, 5.21.9, 5.0.11, and 4.0.15, plus MicroCloud versions 3.4.1 and 2.1.5.","There is no public evidence that the flaw has been exploited, and CISA assessed it as not known to be exploited as of October 30."],"insights":["The impersonation method does not require stealing a trusted client’s private key because its public certificate can be added behind an attacker-controlled certificate in the submitted certificate chain.","Standalone LXD installations are not exposed to this risk by default unless an administrator enables the network API with the core.https_address setting.","In MicroCloud, someone able to capture a member’s public certificate while it joins the cluster could later log in as that member.","There is no configuration-based fix for the issue; restricting access to the network listener is the only temporary risk-reduction step until updates are installed.","Because fixed LXD releases were still moving from the candidate channel to stable, administrators should verify the installed version after refreshing the snap."],"referencedReports":[{"title":"Security advisory: Critical vulnerability found in Canonical LXD and MicroCloud","url":"https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557","publisher":"canonical","context":"The article cites Canonical's advisory for the affected products, fixed versions, and mitigation guidance.","category":"advisory","primary":true},{"title":"GHSA-xg75-xf37-cph9","url":"https://github.com/lxc/incus/security/advisories/GHSA-xg75-xf37-cph9","publisher":"incus","context":"The article states that the Incus project reported the same certificate-validation flaw before Canonical confirmed that LXD was affected.","category":"advisory","primary":false}],"body":"\u003cp\u003eCanonical released fixes for CVE-2026-112816, a CVSS 10.0 flaw affecting LXD and MicroCloud. The issue could allow an attacker with network access to the HTTPS API and a trusted client’s public certificate to log in as that client without its private key. If the impersonated client has sufficient privileges, Canonical said the attacker could gain root access to the host machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw stems from the server accepting any certificate in a supplied certificate chain that appears in its trust store, although only the first certificate is proven to belong to the connecting client. An attacker could therefore attach a trusted client’s public certificate behind their own certificate and be accepted as that trusted client. Canonical advised updating LXD and MicroCloud, verifying the installed version after refreshing snaps, and restricting network access to the API until patches are in place; there is no public evidence the flaw has been exploited.\u003c/p\u003e\n"},{"n":2,"title":"NetamLoader Malware Targets Government Windows 10 Systems in Asia via .NET Injection","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/netamloader-malware-targets-government.html","time":"07:02","priority":"SHOULD READ","score":78,"tldr":"Kaspersky uncovered NetamLoader, a sophisticated .NET-based malware chain targeting a government-only Windows 10 deployment in Asia, likely China, possibly through a supply-chain compromise. It uses AppDomainManager injection, AMSI bypasses, layered payloads, and long-delay C2 polling to run covertly in dllhost.exe.","briefOverview":"\u003cp\u003eKaspersky has detailed NetamLoader, a previously undocumented .NET loading framework discovered in an intrusion targeting a custom Windows 10 build used exclusively by government entities in Asia. The activity has not been attributed to a known threat actor, and Kaspersky identified one victim through telemetry. It is also unknown whether more systems were compromised or whether sensitive data was taken.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were contained in a CAB archive placed in a Windows Update-related directory alongside legitimate Patch My PC components. The chain uses .NET application startup settings to load malicious code, then decodes multiple layers of encrypted or compressed files, bypasses Windows antimalware scanning, and ultimately runs a plugin within dllhost.exe. That plugin collects system information, waits 20 to 40 minutes before contacting openaigpt4v[.]com, periodically retrieves further code to execute, and removes malicious files and certain execution records to conceal activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detailed a previously undocumented .NET assembly-loading framework called NetamLoader that targeted a custom Windows 10 build used exclusively by government organizations in Asia.","The NetamLoader files were packaged in a CAB archive placed in a Windows Update package directory, although the article says the exact delivery method remains unknown.","The infection chain abuses .NET's AppDomainManager mechanism to load malicious code through a legitimate Patch My PC component and uses layered encoded, compressed, or encrypted payloads.","The final .NET plugin gathers system information, waits 20 to 40 minutes before contacting the openaigpt4v[.]com command-and-control server, and periodically retrieves XAML files for execution.","Kaspersky telemetry identified one victim in Asia, and the activity has not been attributed to a known threat actor or linked conclusively to theft of sensitive information."],"insights":["The malware was placed in a Windows Update-related directory and used legitimate Patch My PC components, showing how malicious code can be made to appear alongside trusted software and update materials.","NetamLoader deletes extracted malicious files as well as CLR usage logs and Windows Prefetch cache files, indicating that its components were designed to remove records of their execution.","Its command-and-control behavior is deliberately infrequent: after an unsuccessful request, it can wait 22 to 28 hours before trying again while checking the elapsed time every 10 minutes.","The operation targeted a customized government-only Windows 10 build, underscoring Kaspersky's point that maintaining a specialized national software ecosystem also requires protecting its suppliers, updates, and operational processes."],"referencedReports":[{"title":"NetamLoader","url":"https://securelist.com/netamloader/121676/","publisher":"kaspersky","context":"The article relies on Kaspersky's technical analysis for details of the NetamLoader infection chain targeting a government-specific Windows 10 build in Asia.","category":"research","primary":true}],"body":"\u003cp\u003eKaspersky has detailed NetamLoader, a previously undocumented .NET loading framework discovered in an intrusion targeting a custom Windows 10 build used exclusively by government entities in Asia. The activity has not been attributed to a known threat actor, and Kaspersky identified one victim through telemetry. It is also unknown whether more systems were compromised or whether sensitive data was taken.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were contained in a CAB archive placed in a Windows Update-related directory alongside legitimate Patch My PC components. The chain uses .NET application startup settings to load malicious code, then decodes multiple layers of encrypted or compressed files, bypasses Windows antimalware scanning, and ultimately runs a plugin within dllhost.exe. That plugin collects system information, waits 20 to 40 minutes before contacting openaigpt4v[.]com, periodically retrieves further code to execute, and removes malicious files and certain execution records to conceal activity.\u003c/p\u003e\n"}]</script>
