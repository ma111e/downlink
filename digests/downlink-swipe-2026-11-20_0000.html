26/11/18/2","publisher":"linux-kernel-cve-team","context":"The article uses the Linux kernel CVE announcement to identify the stable and long-term kernel releases containing the fix.","category":"advisory","primary":false},{"title":"CVE-2026-99312 Operator Guide","url":"https://www.docs.virtfusion.com/6.2/security/cve-2026-99312/","publisher":"virtfusion","context":"VirtFusion’s operator guide is cited for the default nested-virtualization setting and mitigation guidance for affected hosts.","category":"guide","primary":false}],"body":"\u003cp\u003eResearchers disclosed CVE-2026-99312, an AMD-specific flaw in Linux KVM that can allow a guest virtual machine with root access to access host memory when nested virtualization is enabled. In testing on a DigitalOcean Droplet, they read roughly 127 GB of host RAM, including the host kernel version banner. On a separate bare-metal AMD system, they wrote 32 selected bytes into a live host-kernel memory page. DigitalOcean patched its fleet with a live patch and said customers did not need to take action.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects AMD KVM hosts with nested virtualization enabled, while Intel-based KVM hosts are not affected. It stems from KVM leaving a memory-management pointer directed at freed memory after an INIT reset stops a nested virtual machine. If that page is reused, a guest can populate it with crafted translation entries that reference physical memory on the host. The fix resets this KVM memory-management state during every INIT.\u003c/p\u003e\n\n\u003cp\u003eFixed kernels are available upstream in stable kernel 7.3.5 and long-term kernels 6.18.64 and 6.12.118, but the article says several distribution kernels had not yet received fixes at publication. Updating virtual machines themselves does not address the problem because the affected code is in the host kernel, and hosts require a reboot after installing a fixed kernel. Until patching is complete, operators can disable nested virtualization, though doing so prevents virtual machines from running virtual machines of their own.\u003c/p\u003e\n"},{"n":32,"title":"Dialing for Data: Inside the Com’s High-Profile Heists","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/","time":"22:00","priority":"SHOULD READ","score":88,"tldr":"Com-affiliated extortion groups, including Bling Libra and newly tracked Vortex and Cinder clusters, are using IT-support vishing and adversary-in-the-middle phishing to steal cloud credentials, enroll rogue MFA devices, exfiltrate Microsoft 365 data, and extort data-rich organizations. Defenses should prioritize phishing-resistant MFA, strict help-desk identity verification, browser-extension allowlisting, and monitoring for unauthorized identity and data-export activity.","briefOverview":"\u003cp\u003eUnit 42 reported sustained vishing-based data theft and extortion by Com-affiliated threat actors, including Bling Libra (ShinyHunters) and activity clusters Redact, Pink, Falcon, Helix, Vortex, and Cinder. The campaigns have primarily targeted data-rich financial services, healthcare, and legal organizations in the United States, United Kingdom, and Australia. Attackers impersonate internal IT support personnel and direct employees to organization-themed phishing sites designed to capture credentials and multi-factor authentication approvals. The article says this activity accelerated significantly around August 2026, with healthcare becoming the most targeted industry in September and October.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the actors commonly enroll unauthorized MFA devices, replay authenticated sessions, use residential proxies or commercial VPNs, and collect data through native cloud tools and scripted API access. Vortex was observed targeting Microsoft 365 mailboxes, OneDrive, and SharePoint, while Cinder used persistent session tokens and the Microsoft Graph SDK to collect SharePoint and OneDrive data. The actors then sent internal Microsoft Teams or email messages claiming data theft and directing employees to Tor-hosted negotiation sites. Unit 42 also identified a sideloaded browser extension masquerading as Google Chrome that could log keystrokes, steal authentication cookies and browser storage, capture QR-code login information, stream webcam feeds, and remotely control browsers.\u003c/p\u003e\n\n\u003cp\u003eThe report emphasizes that these groups increasingly rely on data theft and extortion rather than encrypting victim systems, allowing them to move quickly while avoiding many custom tools. It recommends tighter help-desk verification, phishing-resistant MFA such as FIDO2 or passkeys, browser-extension allowlists, visibility into identity actions, and alerts on unauthorized data exports. Unit 42 published indicators including malicious browser-extension hashes, domains, IP addresses, device names, and user-agent strings associated with the activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 reported sustained vishing-based data theft and extortion activity by Com-affiliated actors, including Bling Libra and clusters it tracks as Redact, Pink, Falcon, Helix, Vortex, and Cinder.","The attackers commonly impersonate internal IT support, direct employees to organization-themed phishing sites, capture credentials and multi-factor authentication approvals in real time, and then enroll unauthorized authentication devices or reuse captured login sessions.","Financial services, healthcare, and legal organizations were primary targets, with most observed target organizations based in the United States and increased targeting of Australian organizations beginning in late September 2026.","The Vortex cluster targeted healthcare, pharmaceutical, and medical organizations, used scripted access to collect Microsoft 365 mailbox, OneDrive, and SharePoint data, and sent extortion messages through Microsoft Teams.","Unit 42 identified a malicious browser extension masquerading as Google Chrome that could log keystrokes, steal account cookies and browser data, capture QR-code login information, stream webcam feeds, and remotely control the browser."],"insights":["The actors often avoid traditional ransomware encryption and instead move quickly from stolen login access to cloud-data theft and extortion, reducing their need to deploy custom malware or encrypt victim systems.","Vortex operators enrolled an unauthorized MFA device within minutes of successful authentication and repeatedly used the same device name, \"Pixel 10a,\" across compromised accounts.","Cinder operators avoided triggering new Duo MFA prompts by replaying a persistent \"keep me signed in\" session token from proxy infrastructure.","The identified browser extension was deliberately named \"Google Chrome\" to make Chrome’s developer-mode warning appear less suspicious, while giving operators capabilities including keylogging, webcam streaming, clipboard theft, screenshots, and remote browser control.","Com-affiliated infrastructure used short-lived, target-specific subdomains on domains themed around SSO, MFA, passkeys, IT support, reports, and claims, sometimes with Cloudflare Pages redirects to organization-specific phishing pages."],"referencedReports":[{"title":"Inside UNC6671's Browser Implant","url":"https://deoxy.net/blog/inside-unc6671s-browser-implant/","publisher":"deoxy","context":"Unit 42 credits this September 2026 technical write-up for a detailed investigation of the malicious browser extension associated with CL-CRI-1192.","category":"research","primary":false},{"title":"Passkey-themed social engineering leads to identity and cloud compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/09/09/passkey-themed-social-engineering-leads-identity-cloud-compromise/","publisher":"microsoft","context":"The article cites Microsoft's research on passkey-themed social engineering and builds on its identification of oskeyregister[.]com.","category":"research","primary":false},{"title":"Urgent Threat Alert: ShinyHunters Vishing Campaigns and Domain Impersonation","url":"https://health-isac.org/urgent-threat-alert-shinyhunters-vishing-campaigns-and-domain-impersonation/","publisher":"health-isac","context":"Listed as an additional resource concerning ShinyHunters vishing campaigns and domain impersonation.","category":"advisory","primary":false},{"title":"A Social Engineering Attempt Against ReliaQuest: What We Found","url":"https://reliaquest.com/blog/threat-spotlight-social-engineering-attempt-against-reliaquest-what-we-found/","publisher":"reliaquest","context":"Listed as an additional resource on a social-engineering attempt investigated by ReliaQuest.","category":"research","primary":false},{"title":"UNC6671 Rebrands: Multi-Brand Vishing Extortion Targets Financial Services and Enterprise Cloud Environments","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments","publisher":"google","context":"The article uses Google's UNC6671 tracking as an alternate designation for activity Unit 42 tracks as CL-CRI-1192 and cites its infrastructure findings.","category":"research","primary":false},{"title":"Behind the scenes of a vishing operation","url":"https://www.okta.com/blog/threat-intelligence/behind-the-scenes-of-a-vishing-operation/","publisher":"okta","context":"Listed as an additional technical threat-intelligence resource about vishing operations.","category":"research","primary":false},{"title":"Helix, a New Name in the Data Extortion Ecosystem?","url":"https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem/","publisher":"reliaquest","context":"The article references ReliaQuest reporting related to activity that Unit 42 tracks as CL-CRI-1192.","category":"research","primary":false},{"title":"Vishing actors target Entra passkey enrollment","url":"https://www.okta.com/blog/threat-intelligence/vishing-actors-target-microsoft-entra-passkey-enrollment-/","publisher":"okta","context":"Listed as an additional threat-intelligence resource on vishing directed at Microsoft Entra passkey enrollment.","category":"research","primary":false},{"title":"We infiltrated a criminal phishing panel: here’s what we found","url":"https://pushsecurity.com/blog/inside-criminal-phishing-panel","publisher":"push-security","context":"Unit 42 cites Push Security's reporting on Doko's Panel variants that replace the default backend handler with api_FyekIDWY.php.","category":"research","primary":false},{"title":"Extortion in the Enterprise: Defending Against BlackFile Attacks","url":"https://rhisac.org/threat-intelligence/extortion-in-the-enterprise-defending-against-blackfile-attacks/","publisher":"rh-isac","context":"The article links this threat-intelligence analysis as the source for the Redact/BlackFile alias.","category":"research","primary":false},{"title":"Welcome to BlackFile: Inside a Vishing Extortion Operation","url":"https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/","publisher":"google","context":"Listed as an additional technical analysis of the BlackFile vishing extortion operation.","category":"research","primary":false},{"title":"Vishing for Access: Tracking the Expansion of ShinyHunters-Branded SaaS Data Theft","url":"https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft","publisher":"google","context":"Listed as an additional technical analysis of ShinyHunters-branded SaaS data-theft activity.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 reported sustained vishing-based data theft and extortion by Com-affiliated threat actors, including Bling Libra (ShinyHunters) and activity clusters Redact, Pink, Falcon, Helix, Vortex, and Cinder. The campaigns have primarily targeted data-rich financial services, healthcare, and legal organizations in the United States, United Kingdom, and Australia. Attackers impersonate internal IT support personnel and direct employees to organization-themed phishing sites designed to capture credentials and multi-factor authentication approvals. The article says this activity accelerated significantly around August 2026, with healthcare becoming the most targeted industry in September and October.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the actors commonly enroll unauthorized MFA devices, replay authenticated sessions, use residential proxies or commercial VPNs, and collect data through native cloud tools and scripted API access. Vortex was observed targeting Microsoft 365 mailboxes, OneDrive, and SharePoint, while Cinder used persistent session tokens and the Microsoft Graph SDK to collect SharePoint and OneDrive data. The actors then sent internal Microsoft Teams or email messages claiming data theft and directing employees to Tor-hosted negotiation sites. Unit 42 also identified a sideloaded browser extension masquerading as Google Chrome that could log keystrokes, steal authentication cookies and browser storage, capture QR-code login information, stream webcam feeds, and remotely control browsers.\u003c/p\u003e\n\n\u003cp\u003eThe report emphasizes that these groups increasingly rely on data theft and extortion rather than encrypting victim systems, allowing them to move quickly while avoiding many custom tools. It recommends tighter help-desk verification, phishing-resistant MFA such as FIDO2 or passkeys, browser-extension allowlists, visibility into identity actions, and alerts on unauthorized data exports. Unit 42 published indicators including malicious browser-extension hashes, domains, IP addresses, device names, and user-agent strings associated with the activity.\u003c/p\u003e\n"},{"n":7,"title":"Hackers use autonomous AI tool Cairn to find zero-day, take over server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-use-autonomous-ai-tool-cairn-to-find-zero-day-take-over-server/","time":"17:30","priority":"SHOULD READ","score":86,"tldr":"Amazon Threat Intelligence says a suspected Chinese-linked actor used the autonomous AI platform Cairn to discover and exploit a path traversal zero-day in MONAI Label, gaining root access to a server within minutes. MONAI patched the flaw on November 18, highlighting how AI agents can accelerate vulnerability discovery and exploitation.","briefOverview":"\u003cp\u003eAmazon Threat Intelligence reported that a suspected Chinese-nexus threat actor used the autonomous AI agent platform Cairn to discover and exploit a zero-day flaw in MONAI Label, an open-source medical-imaging application. The attackers reportedly instructed the agents to obtain shell access, while the agents independently mapped the application and found a path traversal issue. The activity occurred between September 8 and 10, 2026, and mainly targeted educational institutions in East Asia outside China. Amazon attributed the campaign with moderate confidence based on retrieved prompt language, activity timing, and target selection.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw allowed files to be written to arbitrary locations on a server, and Amazon said the agents moved from API mapping to exploitation within 11 minutes. In a later session, they wrote a Python reverse shell into \u003ccode\u003esitecustomize.py\u003c/code\u003e, which loads when Python starts, then triggered an API endpoint to obtain root access. Afterward, the operator supplied a proxy into another university network using the same vulnerable software and directed the agents to target additional machines. Project MONAI released a security update after Amazon reported the flaw.\u003c/p\u003e\n\n\u003cp\u003eThe campaign also showed that the agents did not always succeed: an attempt to take over a Redis server failed after 16 hours and 148 actions, and a six-hour attempt involving more than 30,000 credential combinations against a university GPU server also failed. Amazon found the operation after the attackers left a Cairn instance publicly reachable without authentication. The researchers warned that AI agents can find and use software flaws faster than security teams can react and urged organizations to make greater use of automated defenses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Amazon Threat Intelligence reported that a suspected Chinese-linked threat actor used the autonomous AI agent platform Cairn to seek shell access to targeted servers.","Cairn agents found and exploited a path traversal zero-day in MONAI Label, allowing arbitrary file writes and leading to root access through a Python reverse shell placed in sitecustomize.py.","Amazon said the campaign occurred between September 8 and 10, 2026, mainly targeting East Asian educational institutions outside China.","MONAI Label maintainers released a security update for the reported flaw on November 18.","Amazon warned that AI agents can discover and exploit weaknesses faster than security teams can respond, and urged greater reliance on automated defenses."],"insights":["The attackers’ publicly accessible, unauthenticated Cairn instance exposed their operations and enabled Amazon Threat Intelligence to investigate the campaign.","The AI agents mapped MONAI Label’s API and exploited the path traversal flaw within 11 minutes, illustrating a short interval between identifying an application and obtaining a usable path to server compromise.","Cairn’s automation was not consistently successful: a 16-hour, 148-action attempt against Redis failed, as did a six-hour effort involving more than 30,000 credential combinations against a university GPU server.","After finding the MONAI Label flaw, the operator supplied access to a second university network running the same software and directed the agents to pursue additional machines."],"referencedReports":[{"title":"Chinese-nexus actors used Cairn AI agents to find and exploit a zero-day vulnerability","url":"https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/","publisher":"amazon","context":"The article relies on Amazon Threat Intelligence's investigation of the Cairn-enabled campaign and the MONAI Label zero-day.","category":"research","primary":true},{"title":"Path Traversal in MONAI Label","url":"https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94","publisher":"project-monai","context":"The article links to the Project MONAI security advisory for the MONAI Label flaw patched after Amazon reported it.","category":"advisory","primary":false}],"body":"\u003cp\u003eAmazon Threat Intelligence reported that a suspected Chinese-nexus threat actor used the autonomous AI agent platform Cairn to discover and exploit a zero-day flaw in MONAI Label, an open-source medical-imaging application. The attackers reportedly instructed the agents to obtain shell access, while the agents independently mapped the application and found a path traversal issue. The activity occurred between September 8 and 10, 2026, and mainly targeted educational institutions in East Asia outside China. Amazon attributed the campaign with moderate confidence based on retrieved prompt language, activity timing, and target selection.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw allowed files to be written to arbitrary locations on a server, and Amazon said the agents moved from API mapping to exploitation within 11 minutes. In a later session, they wrote a Python reverse shell into \u003ccode\u003esitecustomize.py\u003c/code\u003e, which loads when Python starts, then triggered an API endpoint to obtain root access. Afterward, the operator supplied a proxy into another university network using the same vulnerable software and directed the agents to target additional machines. Project MONAI released a security update after Amazon reported the flaw.\u003c/p\u003e\n\n\u003cp\u003eThe campaign also showed that the agents did not always succeed: an attempt to take over a Redis server failed after 16 hours and 148 actions, and a six-hour attempt involving more than 30,000 credential combinations against a university GPU server also failed. Amazon found the operation after the attackers left a Cairn instance publicly reachable without authentication. The researchers warned that AI agents can find and use software flaws faster than security teams can react and urged organizations to make greater use of automated defenses.\u003c/p\u003e\n"},{"n":10,"title":"Amazon says Chinese hackers used Cairn AI tool to discover apparent zero-day during attack on university","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/amazon-research-cairn-ai-university-attacks-possible-zero-day","time":"17:30","priority":"SHOULD READ","score":84,"tldr":"Amazon says suspected Chinese operators used the autonomous Cairn AI penetration-testing framework to find and exploit an apparent zero-day path traversal flaw in MONAI Label, breaching two East Asian universities. The case highlights how AI agents can autonomously conduct sustained intrusion attempts and potentially outpace conventional security-response workflows.","briefOverview":"\u003cp\u003eAmazon Threat Intelligence said suspected Chinese operators used the open-source Cairn autonomous AI penetration-testing framework against universities in East Asia. The operators supplied IP addresses and asked the tool to obtain shell access, after which its AI agents planned, executed, and adjusted actions without the operator choosing every next step. Amazon linked the activity to Chinese operators based on Simplified Chinese prompts and China Standard Time settings found in a publicly accessible Cairn instance\u0026rsquo;s operational history.\u003c/p\u003e\n\n\u003cp\u003eAmazon said the agents discovered and exploited an unpatched path traversal flaw in the open-source MONAI Label medical-imaging AI application, assessing with high confidence that it was a zero-day because no prior fix, issue, advisory, or database entry existed. The apparent zero-day was then used to breach a second university, and the Project MONAI maintainers fixed the flaw after Amazon contacted them. Although several efforts failed, including a 16-hour attempt involving 148 actions and another that tested more than 30,000 credential combinations, Amazon said the campaign showed AI agents can operate continuously and move faster than many security operations centers can manually triage alerts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Amazon Threat Intelligence said suspected Chinese operators used the open-source Cairn autonomous AI penetration-testing framework against universities in East Asia.","The operators gave Cairn IP addresses and the objective of obtaining shell access, after which its agents planned, executed, and adjusted their actions without the operator selecting every step.","Amazon said Cairn discovered and exploited an unpatched path traversal flaw in the open-source MONAI Label medical-imaging AI application, which it assessed with high confidence was a zero-day.","The same apparent zero-day was used to breach a second university, and Project MONAI fixed the issue after Amazon contacted the maintainers.","Amazon said the campaign demonstrated that autonomous agents can operate continuously and complete some activity faster than many security operations centers can manually triage an alert."],"insights":["The publicly accessible Cairn instance exposed its operational history, allowing Amazon to review prior prompts and activity; the prompts were written in Simplified Chinese and the system used China Standard Time.","Most of the observed activity was unsuccessful, including a 16-hour, 148-action attempt involving Log4Shell and a separate effort that tested more than 30,000 password combinations against 80 real usernames.","Amazon assessed the MONAI Label flaw as an apparent zero-day because it found no prior fix, issue, advisory, or vulnerability-database reference for the path traversal problem at the time it was discovered.","A researcher from Gambit Security said Cairn may be less predictable than Artex because Cairn is a general-purpose tool rather than one internally structured specifically for cybersecurity tasks.","AWS worked with a government partner to notify the affected organizations, while the MONAI Label maintainers fixed the reported flaw."],"referencedReports":[{"title":"Chinese Nexus Actors Used Cairn AI Agents to Find a Zero-Day on Their Own","url":"https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/","publisher":"amazon-web-services","context":"Amazon Threat Intelligence's investigation is the primary basis for the article's account of Cairn discovering and exploiting the apparent zero-day.","category":"research","primary":true},{"title":"GHSA-qc22-rmgc-vg94","url":"https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94","publisher":"project-monai","context":"The article links to the security advisory for the MONAI Label path traversal flaw that Amazon reported and the maintainers fixed.","category":"advisory","primary":false},{"title":"Autonomous AI Agents and Online Retailers","url":"https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company","publisher":"gambit-security","context":"The article cites Gambit Security's September study documenting a financially motivated group using Cairn against online retailers.","category":"research","primary":false}],"body":"\u003cp\u003eAmazon Threat Intelligence said suspected Chinese operators used the open-source Cairn autonomous AI penetration-testing framework against universities in East Asia. The operators supplied IP addresses and asked the tool to obtain shell access, after which its AI agents planned, executed, and adjusted actions without the operator choosing every next step. Amazon linked the activity to Chinese operators based on Simplified Chinese prompts and China Standard Time settings found in a publicly accessible Cairn instance\u0026rsquo;s operational history.\u003c/p\u003e\n\n\u003cp\u003eAmazon said the agents discovered and exploited an unpatched path traversal flaw in the open-source MONAI Label medical-imaging AI application, assessing with high confidence that it was a zero-day because no prior fix, issue, advisory, or database entry existed. The apparent zero-day was then used to breach a second university, and the Project MONAI maintainers fixed the flaw after Amazon contacted them. Although several efforts failed, including a 16-hour attempt involving 148 actions and another that tested more than 30,000 credential combinations, Amazon said the campaign showed AI agents can operate continuously and move faster than many security operations centers can manually triage alerts.\u003c/p\u003e\n"},{"n":23,"title":"ROMULUS ClickFix Attacks Deliver RAT That Can Spy on Users and Control PCs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/romulus-clickfix-attacks-deliver-rat.html","time":"07:11","priority":"SHOULD READ","score":84,"tldr":"ROMULUS is using ClickFix lures and DLL sideloading to deliver CNCMachineRMS, a newly documented RAT that can remotely control infected PCs, capture screens, microphones and cameras, and steal files. The campaign reflects the growing sophistication and breadth of ClickFix operations, which increasingly use fake verification prompts to trick users into running malicious commands.","briefOverview":"\u003cp\u003eBlackpoint Cyber reported that the ROMULUS malware delivery platform is using ClickFix-style lures to distribute a previously undocumented remote-access trojan called CNCMachineRMS, as well as Legion Loader through separate infection chains. ROMULUS retains ClickFix techniques and signed-binary DLL sideloading while changing the applications and loaders used to deliver its payloads. The same CNCMachineRMS implant was also previously delivered through malicious ChatGPT Custom GPT lures.\u003c/p\u003e\n\n\u003cp\u003eOne ROMULUS chain uses a malicious MSI installer named \u003ccode\u003eIconEdit2Turb.msi\u003c/code\u003e, executed with \u003ccode\u003emsiexec.exe\u003c/code\u003e through PowerShell and disguised as Stardock Smart DeElevation Tool. The installer launches a DLL sideloading chain involving a malicious DLL, \u003ccode\u003eI++u.dll\u003c/code\u003e, which decodes embedded shellcode to run CNCMachineRMS. The RAT can remotely control desktops, stream screens, capture microphone and camera data, manage files, perform system reconnaissance, and run additional payloads, communicating with attacker-controlled infrastructure using DNS over HTTPS. The report comes amid numerous ClickFix campaigns using fake verification prompts, compromised websites, deceptive ads, and impersonated pages to deliver remote-access tools and information-stealing malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blackpoint Cyber reported that the ROMULUS malware delivery platform uses ClickFix-style lures to distribute CNCMachineRMS and Legion Loader through separate infection chains.","One ROMULUS chain uses a malicious MSI installer masquerading as Stardock Smart DeElevation Tool to launch a DLL sideloading sequence that executes CNCMachineRMS.","CNCMachineRMS can provide remote desktop control, screen streaming, microphone and camera capture, file management, system reconnaissance, and on-demand execution of additional payloads.","CNCMachineRMS communicates with attacker-controlled infrastructure using DNS over HTTPS.","The article describes multiple other ClickFix campaigns that use fake verification prompts, deceptive ads, compromised websites, and impersonated pages to deliver remote-access tools and information-stealing malware."],"insights":["ROMULUS appears to function as a delivery service rather than being tied to one payload, using separate chains to distribute both CNCMachineRMS and Legion Loader while retaining ClickFix and signed-binary sideloading techniques.","The same CNCMachineRMS implant has been delivered through both ROMULUS activity and malicious ChatGPT Custom GPT lures, linking otherwise different victim-entry paths to a common final payload.","ClickFix campaigns have expanded beyond simple command execution into multi-stage operations that can establish persistence, support movement within environments, conduct reconnaissance, and steal credentials.","Some campaigns combine deceptive verification prompts with unusual delivery methods, including code retrieved through a Polygon smart contract, payloads retrieved through DNS TXT records, and malware reconstructed from data hidden in PNG files.","The article notes that changing the applications and loaders used for delivery can obscure campaign tracking, while the underlying malware architecture can provide a more consistent way to identify related activity."],"referencedReports":[{"title":"ROMULUS and CNCMachineRMS","url":"https://blackpointcyber.com/blog/romulus-cncmachinerms/","publisher":"blackpoint-cyber","context":"Blackpoint Cyber's report is the primary basis for the article's findings on ROMULUS delivering CNCMachineRMS through ClickFix and DLL sideloading.","category":"research","primary":true},{"title":"The Evolving Tradecraft of ClickFix","url":"https://www.huntress.com/blog/the-evolving-tradecraft-of-clickfix","publisher":"huntress","context":"The article cites Huntress' report on ClickFix expanding into more elaborate multi-stage chains involving persistence, lateral movement, reconnaissance, credential theft, and steganography.","category":"research","primary":false}],"body":"\u003cp\u003eBlackpoint Cyber reported that the ROMULUS malware delivery platform is using ClickFix-style lures to distribute a previously undocumented remote-access trojan called CNCMachineRMS, as well as Legion Loader through separate infection chains. ROMULUS retains ClickFix techniques and signed-binary DLL sideloading while changing the applications and loaders used to deliver its payloads. The same CNCMachineRMS implant was also previously delivered through malicious ChatGPT Custom GPT lures.\u003c/p\u003e\n\n\u003cp\u003eOne ROMULUS chain uses a malicious MSI installer named \u003ccode\u003eIconEdit2Turb.msi\u003c/code\u003e, executed with \u003ccode\u003emsiexec.exe\u003c/code\u003e through PowerShell and disguised as Stardock Smart DeElevation Tool. The installer launches a DLL sideloading chain involving a malicious DLL, \u003ccode\u003eI++u.dll\u003c/code\u003e, which decodes embedded shellcode to run CNCMachineRMS. The RAT can remotely control desktops, stream screens, capture microphone and camera data, manage files, perform system reconnaissance, and run additional payloads, communicating with attacker-controlled infrastructure using DNS over HTTPS. The report comes amid numerous ClickFix campaigns using fake verification prompts, compromised websites, deceptive ads, and impersonated pages to deliver remote-access tools and information-stealing malware.\u003c/p\u003e\n"},{"n":24,"title":"SonicWall Warns Gen 6 Firewalls Won't Get Security Patches, Even for Critical Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sonicwall-warns-gen-6-firewalls-wont.html","time":"10:38","priority":"SHOULD READ","score":84,"tldr":"SonicWall warns that unsupported Gen 6 firewalls running SonicOS 6 will no longer receive security patches, including for critical flaws, and should be replaced immediately. Organizations should prioritize removing internet-facing and remote-access units, or tightly restrict them until migration to supported Gen 8 hardware and SonicOS 8 is complete.","briefOverview":"\u003cp\u003eSonicWall has urged customers to immediately retire and replace Generation 6 firewalls running SonicOS 6.x, stating that these unsupported devices will not receive security patches, including for critical flaws. The company expects internet-facing Gen 6 firewalls to be actively targeted as attackers use automation and AI to locate and exploit unsupported edge devices. SonicWall recommends migrating affected organizations to supported Generation 8 firewalls running SonicOS 8.\u003c/p\u003e\n\n\u003cp\u003eThe affected devices include numerous TZ, SOHO, NSA, NSa, NSv, SuperMassive, and NSsp Gen 6 models. Until replacement is complete, SonicWall recommends disabling WAN management, disabling or restricting SSL VPN access, enforcing multi-factor authentication, resetting local passwords, disabling unused services, and monitoring logs for unusual activity. SonicWall warns that compromise of a perimeter firewall can enable credential theft, movement within internal networks, and ransomware deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall has urged customers to retire and replace all Generation 6 firewalls running SonicOS 6.x because the devices are unsupported and will not receive security patches, including for critical flaws.","SonicWall expects internet-facing Gen 6 firewalls to be actively targeted and recommends migration to supported Generation 8 firewalls running SonicOS 8.","The affected portfolio includes multiple TZ, SOHO, NSA, NSa, NSv, SuperMassive, and NSsp Generation 6 models.","Until replacement is complete, SonicWall recommends disabling WAN management, disabling or restricting SSL VPN, enforcing multi-factor authentication, resetting local passwords, disabling unused services, and closely monitoring logs.","SonicWall warns that a compromised perimeter firewall can provide attackers a foothold for credential theft, movement through internal systems, and ransomware deployment."],"insights":["SonicWall states that unsupported Gen 6 devices will not receive patches even for critical flaws, making replacement rather than waiting for a future fix the stated remediation path.","Google Mandiant reported that average exploitation now begins an estimated seven days before a patch is available, illustrating why unsupported internet-facing devices carry immediate risk.","Cisco Talos found that 23% of CVEs discovered in 2025 directly affected network devices, highlighting the concentration of security issues in systems placed at an organization’s perimeter.","For organizations unable to replace affected devices immediately, SonicWall specifically recommends removing WAN management access and disabling or tightly limiting SSL VPN to known source addresses.","A compromised perimeter firewall can give an intruder access for credential theft, movement across internal systems, and ransomware deployment, increasing the consequences beyond the firewall itself."],"referencedReports":[{"title":"Product Advisory: Retire Unsupported Gen 6 Firewalls","url":"https://www.sonicwall.com/support/notices/product-advisory-retire-unsupported-gen-6-firewalls/kA1VN000002iouP0AQ","publisher":"SonicWall","context":"The article is based on SonicWall's advisory urging customers to retire unsupported Generation 6 firewalls because they will not receive security patches.","category":"advisory","primary":true},{"title":"M-Trends 2026","url":"https://www.gstatic.com/security-marketing/m-trends-2026-en.pdf","publisher":"Google Mandiant","context":"The article cites the report's estimate that exploitation begins an average of seven days before patches are available.","category":"research","primary":false},{"title":"2025 Talos Year in Review: Speed, Scale, and Staying Power","url":"https://blog.talosintelligence.com/2025-talos-year-in-review-speed-scale-and-staying-power/","publisher":"Cisco Talos","context":"The article cites Talos' finding that 23% of CVEs discovered in 2025 directly affected network devices.","category":"research","primary":false}],"body":"\u003cp\u003eSonicWall has urged customers to immediately retire and replace Generation 6 firewalls running SonicOS 6.x, stating that these unsupported devices will not receive security patches, including for critical flaws. The company expects internet-facing Gen 6 firewalls to be actively targeted as attackers use automation and AI to locate and exploit unsupported edge devices. SonicWall recommends migrating affected organizations to supported Generation 8 firewalls running SonicOS 8.\u003c/p\u003e\n\n\u003cp\u003eThe affected devices include numerous TZ, SOHO, NSA, NSa, NSv, SuperMassive, and NSsp Gen 6 models. Until replacement is complete, SonicWall recommends disabling WAN management, disabling or restricting SSL VPN access, enforcing multi-factor authentication, resetting local passwords, disabling unused services, and monitoring logs for unusual activity. SonicWall warns that compromise of a perimeter firewall can enable credential theft, movement within internal networks, and ransomware deployment.\u003c/p\u003e\n"},{"n":8,"title":"N-able says recent security breach led to major service outage","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/n-able-says-recent-security-breach-led-to-major-service-outage/","time":"13:18","priority":"SHOULD READ","score":83,"tldr":"N-able says a security breach involving unauthorized access to a Hosted Cloud server caused a global outage of its Mail Assure and SpamExperts services. The company says email delivery and spam filtering remain operational and it has found no evidence of customer data or mailbox access so far.","briefOverview":"\u003cp\u003eN-able says unauthorized access to a server in its Mail Assure and SpamExperts Hosted Cloud environment caused a major worldwide outage. The company initially attributed the disruption to platform configuration and service dependencies, but later determined it resulted from a security incident. N-able disabled UI and API access while it investigates and hardens its services.\u003c/p\u003e\n\n\u003cp\u003eThe incident has taken down the management portal and supporting quarantine, logging, and mailbox synchronization services. Customers may be unable to access the control panel, release quarantined messages, review logs, or make configuration changes such as adding or removing domains. N-able says email flow and spam filtering were not affected, and it has not found evidence that customer data or tenant mailboxes were accessed.\u003c/p\u003e\n\n\u003cp\u003eN-able said this Hosted Cloud incident is unrelated to a separate N-central incident that forced all hosted N-central environments offline for patches addressing more than 30 zero-day flaws. The article also notes that attackers are exploiting a newly disclosed N-central zero-day called 4EverAble2Shell to deploy cryptocurrency miners on vulnerable servers. The Hosted Cloud investigation remains ongoing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able said unauthorized access to a server in its Mail Assure and SpamExperts Hosted Cloud environment caused a major worldwide service outage.","The company initially attributed the disruption to platform configuration and service dependencies before determining it was caused by a security incident.","N-able disabled UI and API access and took down the management portal, quarantine, logging, and mailbox synchronization support services after detecting the incident.","N-able said email flow and spam filtering were not affected and that it has no evidence so far that customer data or tenant mailboxes were accessed.","The company said the Hosted Cloud incident is unrelated to the separate N-central incident involving more than 30 zero-day flaws."],"insights":["The incident primarily disrupted customers' ability to manage email security services—such as accessing the control panel, quarantined messages, logs, and configuration settings—while N-able says email delivery and spam filtering continued to operate.","N-able's initial explanation of configuration and dependency problems changed after further investigation identified unauthorized server access, illustrating that the stated cause of an outage can change as an incident investigation develops.","N-able says the Hosted Cloud security incident is separate from its N-central outage, where more than 30 zero-day flaws were patched and a newly disclosed flaw was reportedly being used to install cryptocurrency-mining software."],"referencedReports":[],"body":"\u003cp\u003eN-able says unauthorized access to a server in its Mail Assure and SpamExperts Hosted Cloud environment caused a major worldwide outage. The company initially attributed the disruption to platform configuration and service dependencies, but later determined it resulted from a security incident. N-able disabled UI and API access while it investigates and hardens its services.\u003c/p\u003e\n\n\u003cp\u003eThe incident has taken down the management portal and supporting quarantine, logging, and mailbox synchronization services. Customers may be unable to access the control panel, release quarantined messages, review logs, or make configuration changes such as adding or removing domains. N-able says email flow and spam filtering were not affected, and it has not found evidence that customer data or tenant mailboxes were accessed.\u003c/p\u003e\n\n\u003cp\u003eN-able said this Hosted Cloud incident is unrelated to a separate N-central incident that forced all hosted N-central environments offline for patches addressing more than 30 zero-day flaws. The article also notes that attackers are exploiting a newly disclosed N-central zero-day called 4EverAble2Shell to deploy cryptocurrency miners on vulnerable servers. The Hosted Cloud investigation remains ongoing.\u003c/p\u003e\n"},{"n":4,"title":"Bell Canada says 'agentic' hacker stole enterprise customer data","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bell-canada-says-agentic-hacker-stole-enterprise-customer-data/","time":"18:51","priority":"SHOULD READ","score":82,"tldr":"Bell Canada says an unidentified “agentic” threat actor breached a pre-production Maximo environment on November 17, 2026, stealing some enterprise customer contact, circuit-ordering, ticket-title, and network IP information. Bell says services were unaffected and that no credentials, highly sensitive personal data, or file attachments were exposed.","briefOverview":"\u003cp\u003eBell Canada confirmed that an unauthorized party accessed some of its systems on November 17, 2026, and exfiltrated enterprise customer data. The company described the intruder as an “agentic threat actor” and said it has not yet identified who was responsible. Bell said it contained the incident and that customer services were not affected.\u003c/p\u003e\n\n\u003cp\u003eThe intrusion included a pre-production environment of Bell’s Maximo system, which is used to order and provision telecommunications network connections. Potentially exposed information includes business names, job titles, corporate email addresses, phone numbers, business addresses, ticket titles, some IP addresses associated with network elements or systems, and limited contextual information. Bell said the affected dataset did not contain credentials, highly sensitive personal information, PDFs, file attachments, or other supplementary Maximo information. The company is sharing indicators of compromise and threat-hunting information with enterprise customers and the Canadian Centre for Cyber Security, while warning customers to remain alert to unsolicited requests and impersonation attempts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bell Canada confirmed that an unauthorized party accessed some of its systems on November 17, 2026, and exfiltrated enterprise customer data.","The intrusion included a pre-production Bell Maximo environment used to order and provision telecommunications network connections.","Potentially stolen information includes business contact details, ticket titles, some IP addresses associated with network elements or systems, and limited contextual information.","Bell said the affected data did not include credentials, highly sensitive personal information, PDFs, file attachments, or other supplementary information stored in Maximo.","Bell said it contained the incident, customer services were not affected, and it has not yet identified the responsible threat actor."],"insights":["Bell characterized the intruder as an “agentic threat actor,” a description the article says suggests the use of AI-powered tools during the intrusion.","Although the compromised environment was pre-production, it contained enterprise customer contact information and details related to ordering and provisioning telecommunications circuits.","Bell is sharing indicators of compromise and threat-hunting information with enterprise customers and the Canadian Centre for Cyber Security, but has not publicly released those indicators.","Bell specifically warned affected organizations to be alert for unsolicited requests and social-engineering attempts from people impersonating the company."],"referencedReports":[],"body":"\u003cp\u003eBell Canada confirmed that an unauthorized party accessed some of its systems on November 17, 2026, and exfiltrated enterprise customer data. The company described the intruder as an “agentic threat actor” and said it has not yet identified who was responsible. Bell said it contained the incident and that customer services were not affected.\u003c/p\u003e\n\n\u003cp\u003eThe intrusion included a pre-production environment of Bell’s Maximo system, which is used to order and provision telecommunications network connections. Potentially exposed information includes business names, job titles, corporate email addresses, phone numbers, business addresses, ticket titles, some IP addresses associated with network elements or systems, and limited contextual information. Bell said the affected dataset did not contain credentials, highly sensitive personal information, PDFs, file attachments, or other supplementary Maximo information. The company is sharing indicators of compromise and threat-hunting information with enterprise customers and the Canadian Centre for Cyber Security, while warning customers to remain alert to unsolicited requests and impersonation attempts.\u003c/p\u003e\n"},{"n":20,"title":"New Unpatched Windows 0-Day FastUnlock Lets Someone Holding a Locked PC Run Programs on It","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-unpatched-windows-0-day-fastunlock.html","time":"05:30","priority":"SHOULD READ","score":82,"tldr":"A newly disclosed, unpatched Windows zero-day called FastUnlock can let someone with physical access to a locked PC launch programs under a limited account through lock-screen recovery and Narrator. Until Microsoft releases a fix, use BitLocker startup PINs and shut down or hibernate sensitive devices before they leave your control.","briefOverview":"\u003cp\u003eA newly disclosed, unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in. The method was published by a researcher known as MSNightmare or Nightmare Eclipse, and ThreatLocker said it independently tested and confirmed it works. No Microsoft fix has been released, and the article says there is no evidence that the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eFastUnlock requires physical access, a Microsoft account reachable through lock-screen recovery options, and use of Windows Narrator to navigate the locked screen. ThreatLocker reached a point where it could run a program under WSIAccount, which it identified as a limited, non-administrator account. BitLocker systems that automatically unlock drives through the TPM may still be exposed because the drive is already unlocked by the time the lock screen appears; the article recommends stronger physical controls, a BitLocker startup PIN, and shutting down or hibernating sensitive devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in.","The technique uses Windows Narrator and lock-screen recovery options, requires access to a Microsoft account, and provides only a limited, non-administrator account.","ThreatLocker tested the publicly disclosed technique and reported that it worked, while no Microsoft fix or evidence of real-world exploitation has been reported.","BitLocker configurations that automatically unlock drives through the TPM may not prevent FastUnlock because the drive is already unlocked when the lock screen appears.","Until a patch is available, the article recommends physical device protection, enabling a BitLocker startup PIN, and shutting down or hibernating devices before they leave someone’s control."],"insights":["A standard BitLocker setup that unlocks the drive automatically with the computer’s security chip may not stop this method, because the drive is already available by the time the lock screen appears.","Adding a BitLocker startup PIN is only protective before the computer starts, so it does not help if the device is already running and sitting at its lock screen.","The disclosed method does not defeat disk encryption or provide administrator access; it operates after the system has already unlocked its own drive and reaches a limited account.","The original disclosure contains little written detail, while ThreatLocker’s independent test provides the clearest description of the technique’s practical effect."],"referencedReports":[{"title":"FastUnlock","url":"https://github.com/MSNightmare/FastUnlock","publisher":"msnightmare / nightmare-eclipse","context":"The article cites the researcher's GitHub disclosure, which includes a video and limited written details of the FastUnlock technique.","category":"research","primary":true},{"title":"Proof of Concept for FastUnlock: Windows Lock Screen Bypass from Nightmare Eclipse","url":"https://www.threatlocker.com/blog/proof-of-concept-for-fastunlock-windows-lock-screen-bypass-from-nightmare-eclipse","publisher":"threatlocker","context":"The article relies on ThreatLocker’s independent test as the clearest account of the technique’s practical effect.","category":"research","primary":true},{"title":"BitLocker Countermeasures","url":"https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/countermeasures","publisher":"microsoft","context":"The article cites Microsoft’s guidance recommending a startup PIN and shutting down or hibernating devices against hands-on attackers.","category":"guide","primary":false}],"body":"\u003cp\u003eA newly disclosed, unpatched Windows zero-day technique called FastUnlock can allow someone with physical access to a locked computer to start programs without signing in. The method was published by a researcher known as MSNightmare or Nightmare Eclipse, and ThreatLocker said it independently tested and confirmed it works. No Microsoft fix has been released, and the article says there is no evidence that the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eFastUnlock requires physical access, a Microsoft account reachable through lock-screen recovery options, and use of Windows Narrator to navigate the locked screen. ThreatLocker reached a point where it could run a program under WSIAccount, which it identified as a limited, non-administrator account. BitLocker systems that automatically unlock drives through the TPM may still be exposed because the drive is already unlocked by the time the lock screen appears; the article recommends stronger physical controls, a BitLocker startup PIN, and shutting down or hibernating sensitive devices.\u003c/p\u003e\n"},{"n":22,"title":"Bazuka Android Malware Uses Fake Screen Overlays to Hide Credential Theft and Device Control","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/bazuka-android-malware-uses-fake-screen.html","time":"16:58","priority":"SHOULD READ","score":82,"tldr":"Researchers uncovered Bazuka, a modular Android banking-malware framework that uses deceptive screen overlays, keylogging, NFC and SMS/2FA interception, ADB-based device control, and AI-assisted victim targeting. A separate Android RAT, ArcticRAT, similarly uses LLMs and black-screen overlays to steal financial data and remotely control infected devices.","briefOverview":"\u003cp\u003eThreatFabric disclosed Bazuka, a previously unknown Android malware framework discovered during an investigation in late October 2026. The framework consists of a dropper or downloader, a core component, and 23 modules supporting functions such as fake login screens, keystroke capture, SMS and verification-code interception, remote control, and cryptocurrency-address replacement. Its control panel also integrates large language models that operators can use to identify and score victims.\u003c/p\u003e\n\n\u003cp\u003eBazuka can capture an image of a phone’s home or lock screen and show it as a cover while malicious actions occur behind it. Its core can use Android accessibility features and Wireless Debugging to gain additional control, while communicating with its operators through separate WebSocket channels for commands and stolen data. The article also highlights ArcticRAT, another Android remote-access tool that uses language-model APIs to identify valuable financial information in stolen data and black-screen overlays to conceal activity from victims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ThreatFabric identified Bazuka as a modular Android malware framework with a downloader, core component, and 23 modules for overlays, keylogging, SMS and two-factor-code interception, remote control, and cryptocurrency address replacement.","Bazuka can take a screenshot of a victim’s home or lock screen and display it as an overlay to conceal malicious activity occurring in the background.","Bazuka’s control panel includes large language model integration that operators can use to identify and score victims, and it supports both locally hosted models and API-accessed models.","Zimperium reported that ArcticRAT is an Android remote-access trojan that uses large language model APIs to analyze stolen SMS messages and app data for high-value financial information while using black-screen overlays to hide remote actions."],"insights":["Bazuka can use Android accessibility features to open settings, enable Wireless Debugging, capture its pairing PIN, and connect to the device’s Android debugging service, allowing it to seek additional control without relying solely on its original app permissions.","Both Bazuka and ArcticRAT conceal attacker activity from the phone owner through screen manipulation: Bazuka displays a captured image of the home or lock screen, while ArcticRAT uses an unclosable black screen and reduces brightness to zero.","Bazuka’s builders can select permissions for each dropper app, a design that ThreatFabric said is likely intended to help evade Google Play review, while its distribution model also supports criminals who drive installs through ads or fraudulent websites.","ArcticRAT uses a VPN privilege to block network communications on the compromised phone during staging, which Zimperium said can blind Google Play Protect telemetry."],"referencedReports":[{"title":"Bazuka: The Fraud Framework That Can Do It All","url":"https://www.threatfabric.com/blogs/bazuka-the-fraud-framework-that-can-do-it-all","publisher":"threatfabric","context":"The article relies on ThreatFabric's technical report for its analysis of the Bazuka Android malware framework.","category":"research","primary":true},{"title":"ArcticRAT: AI-Powered Android RAT","url":"https://zimperium.com/blog/arcticrat-ai-powered-android-rat","publisher":"zimperium","context":"The article cites Zimperium zLabs research describing ArcticRAT's LLM-assisted data theft, remote control, and screen-concealment capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eThreatFabric disclosed Bazuka, a previously unknown Android malware framework discovered during an investigation in late October 2026. The framework consists of a dropper or downloader, a core component, and 23 modules supporting functions such as fake login screens, keystroke capture, SMS and verification-code interception, remote control, and cryptocurrency-address replacement. Its control panel also integrates large language models that operators can use to identify and score victims.\u003c/p\u003e\n\n\u003cp\u003eBazuka can capture an image of a phone’s home or lock screen and show it as a cover while malicious actions occur behind it. Its core can use Android accessibility features and Wireless Debugging to gain additional control, while communicating with its operators through separate WebSocket channels for commands and stolen data. The article also highlights ArcticRAT, another Android remote-access tool that uses language-model APIs to identify valuable financial information in stolen data and black-screen overlays to conceal activity from victims.\u003c/p\u003e\n"},{"n":38,"title":"JPMorganChase, Mastercard and Visa Third-Party Security Breaches and What SaaS Posture and Detection Can Surface","source":"appomni.com","sourceColorIdx":0,"link":"https://appomni.com/ao-labs/jpmorganchase-mastercard-and-visa-third-party-security-breaches-and-what-saas-posture-and-detection-can-surface/","time":"21:19","priority":"SHOULD READ","score":82,"tldr":"JPMorganChase, Visa, and Mastercard disclosed third-party incidents exposing limited marketing or contact data, while the responsible vendor and any connection to Qubole remain unconfirmed. The incident highlights the risk of dormant, over-privileged third-party integrations and the need to tightly govern and monitor their access.","briefOverview":"\u003cp\u003eJPMorganChase, Visa, and Mastercard disclosed third-party security incidents on November 19, 2026, involving marketing or contact data. JPMorganChase said affected data could include customer names and email addresses, while Mastercard cited a limited number of email addresses in a cardholder benefit program; Visa did not specify the data involved. All three said their payment systems or networks were not affected, and no payment card data was exposed.\u003c/p\u003e\n\n\u003cp\u003eThe group n0n claimed it had breached Qubole and released files it said were linked to suppliers of the three companies, but Qubole’s involvement and the leaked data have not been verified. Separately, Wiz, Sentra, and Mandiant reported that an attacker used credentials from a Qubole-associated AWS account to access customer environments through trusted roles, retrieve secrets, and in some cases download entire S3 buckets. The article emphasizes that dormant or overly broad third-party access can create risk, and recommends inventorying integrations, limiting their permissions, monitoring unusual behavior, and being able to quickly disable access and rotate credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JPMorganChase, Visa, and Mastercard disclosed third-party incidents in November 2026 involving limited marketing or contact data, and each said payment data and core payment services were unaffected.","The extortion group n0n claimed it breached Qubole and posted files allegedly linked to suppliers of the three companies, but the companies did not confirm Qubole was involved and the leaked data was not verified.","In a separate report, Wiz, Sentra, and Mandiant documented an attacker using credentials from a Qubole-associated AWS account to access customer environments through trusted cross-account roles.","Wiz reported that many of the trusted roles used in the observed activity were otherwise dormant, and the attacker accessed resources, retrieved secrets, and in some cases downloaded entire Amazon S3 buckets.","The article recommends identifying third-party access, removing stale or excessive permissions, monitoring unusual integration activity, and preparing to quickly revoke access and rotate credentials."],"insights":["Stolen vendor credentials can make an attacker’s activity appear legitimate because requests made through an existing trusted relationship may carry the correct authorization details and succeed without triggering basic login alerts.","Dormant third-party access can be especially dangerous because it may retain broad permissions while receiving little or no regular scrutiny.","Simply counting connected applications or access grants does not identify the greatest risk; the article emphasizes prioritizing grants by their permissions, inactivity, user privilege, and network restrictions.","Behavior-based monitoring can identify misuse of a trusted integration by detecting first-seen networks or user agents, unexpected hosting or VPN infrastructure, and unusually large data reads.","Responding effectively requires revoking active tokens and sessions as well as rotating credentials, since changing a secret alone may not terminate already-active access."],"referencedReports":[{"title":"Trusted by Default: Qubole Cross-Account Access Abused in the Wild","url":"https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild","publisher":"Wiz","context":"The article cites Wiz’s technical report, produced with Sentra and Mandiant, documenting abuse of Qubole-associated AWS credentials to access customer environments through trusted roles.","category":"research","primary":false}],"body":"\u003cp\u003eJPMorganChase, Visa, and Mastercard disclosed third-party security incidents on November 19, 2026, involving marketing or contact data. JPMorganChase said affected data could include customer names and email addresses, while Mastercard cited a limited number of email addresses in a cardholder benefit program; Visa did not specify the data involved. All three said their payment systems or networks were not affected, and no payment card data was exposed.\u003c/p\u003e\n\n\u003cp\u003eThe group n0n claimed it had breached Qubole and released files it said were linked to suppliers of the three companies, but Qubole’s involvement and the leaked data have not been verified. Separately, Wiz, Sentra, and Mandiant reported that an attacker used credentials from a Qubole-associated AWS account to access customer environments through trusted roles, retrieve secrets, and in some cases download entire S3 buckets. The article emphasizes that dormant or overly broad third-party access can create risk, and recommends inventorying integrations, limiting their permissions, monitoring unusual behavior, and being able to quickly disable access and rotate credentials.\u003c/p\u003e\n"},{"n":11,"title":"Container Store restores systems after cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/container-store-restores-systems-cyberattack","time":"19:32","priority":"SHOULD READ","score":78,"tldr":"The Container Store restored its website and internal systems after a cyberattack disrupted online orders and in-store payments, while stores remained open using alternative processing. The n0n ransomware and data-extortion group has claimed responsibility, though the company says there is currently no evidence that customer financial data was stolen.","briefOverview":"\u003cp\u003eThe Container Store restored its website and systems after a cyberattack disrupted online ordering and limited in-store transaction processing. Its roughly 100 U.S. stores remained open by using alternative procedures for customer transactions. Parent company Neighborhood Intelligence said the incident affected only The Container Store, not Bed Bath \u0026amp; Beyond, Overstock, buybuy BABY, or Kirkland’s.\u003c/p\u003e\n\n\u003cp\u003eThe company said it hired cybersecurity experts to contain the incident and restore affected systems, and that it currently has no indication customer financial data was stolen. However, the n0n cybercriminal group listed the company on its leak site earlier in the month, though the company did not address that claim. Researchers describe n0n as a ransomware and data-extortion group that has targeted more than 100 organizations, demanded hundreds of millions of dollars in ransoms, and used AI coding tools and paid AI services to develop and debug attack scripts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Container Store restored its website and systems after a cyberattack disrupted online ordering and limited in-store transaction processing.","The company’s approximately 100 U.S. stores remained open during the disruption by using alternative transaction-processing procedures.","Neighborhood Intelligence said the incident affected only The Container Store and not its other brands, including Bed Bath \u0026 Beyond, Overstock, buybuy BABY, or Kirkland’s.","The company said it hired cybersecurity experts to contain the incident and restore systems, and that it has not found evidence that customer financial data was stolen.","The n0n group listed The Container Store on its leak site, and researchers describe the group as conducting ransomware and data-extortion operations."],"insights":["The incident disrupted both online orders and in-store payment processing, demonstrating that a single event can affect retail sales channels even when physical locations remain open.","n0n reportedly requires victims to pay before they can view samples of allegedly stolen information, a tactic that increases pressure on victims during extortion.","Researchers said n0n has used AI coding tools and paid AI services to write and fix its attack scripts, which LevelBlue said helps the group expand its operations quickly.","The group reportedly instructs affiliates to target companies with more than $10 million in annual revenue while avoiding organizations in Commonwealth of Independent States countries."],"referencedReports":[{"title":"Dark Web Profile: N0N Ransomware","url":"https://socradar.io/blog/dark-web-profile-n0n-ransomware/","publisher":"socradar","context":"The article cites SOCradar’s analysis for details on n0n’s ransomware and extortion practices, including its payment demands for negotiation access and data samples.","category":"research","primary":false}],"body":"\u003cp\u003eThe Container Store restored its website and systems after a cyberattack disrupted online ordering and limited in-store transaction processing. Its roughly 100 U.S. stores remained open by using alternative procedures for customer transactions. Parent company Neighborhood Intelligence said the incident affected only The Container Store, not Bed Bath \u0026amp; Beyond, Overstock, buybuy BABY, or Kirkland’s.\u003c/p\u003e\n\n\u003cp\u003eThe company said it hired cybersecurity experts to contain the incident and restore affected systems, and that it currently has no indication customer financial data was stolen. However, the n0n cybercriminal group listed the company on its leak site earlier in the month, though the company did not address that claim. Researchers describe n0n as a ransomware and data-extortion group that has targeted more than 100 organizations, demanded hundreds of millions of dollars in ransoms, and used AI coding tools and paid AI services to develop and debug attack scripts.\u003c/p\u003e\n"},{"n":14,"title":"Dozens of credit unions hit by supplier breach that went unnoticed for six weeks","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/dozens-of-credit-unions-hit-by-supplier-breach","time":"14:24","priority":"SHOULD READ","score":78,"tldr":"Hackers accessed payee details for users of Wellington IT-operated credit union mobile banking apps, affecting more than 40 Irish credit unions and potentially some in the U.K. The flaw was closed in early October, but affected institutions were not notified until November 16; officials say there is no evidence of stolen funds or fraudulent transactions.","briefOverview":"\u003cp\u003eHackers accessed payment-recipient details belonging to members of more than 40 Irish credit unions after exploiting an unidentified weakness in systems operated by Belfast-based software supplier Wellington IT. Ireland’s Data Protection Commission said it received more than 40 breach notifications from credit unions using Wellington IT as a data processor. The exposure was limited to payee details stored by members who used credit union mobile banking apps operated by Wellington IT; members who did not use the apps were unaffected.\u003c/p\u003e\n\n\u003cp\u003eWellington IT closed the weakness on October 6, but its initial investigation did not identify a data-protection breach, and affected credit unions were not notified until November 16. Irish Minister of State Robert Troy called the delay unacceptable and said outside experts were determining the exact number of affected accounts and users. Irish authorities said there was no indication that member funds were accessed or that unauthorized or fraudulent transactions occurred. Because Wellington IT is based in Northern Ireland, the incident also involves the United Kingdom, where the Information Commissioner’s Office was beginning to receive reports from credit unions and said U.K. members may be affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers accessed payee details stored for members using credit union mobile banking apps operated by Belfast-based software supplier Wellington IT.","Ireland’s Data Protection Commission received more than 40 breach notifications from credit unions that used Wellington IT as a data processor.","Wellington IT closed the unidentified system weakness on October 6, but affected credit unions were not notified until November 16.","Irish officials said there was no evidence that member funds were accessed or that unauthorized or fraudulent transactions had occurred.","The U.K. Information Commissioner’s Office had not received a report from Wellington IT but was beginning to receive reports from credit unions, indicating the incident may also affect members in the United Kingdom."],"insights":["Wellington IT fixed the issue on October 6, but its initial investigation did not identify a data-protection breach, delaying notification of affected credit unions until November 16.","The reported exposure was limited to payee details stored by members using Wellington IT-operated mobile banking apps; members who did not use the apps were not affected.","The incident spans Irish and U.K. oversight because Wellington IT is based in Northern Ireland while many affected credit unions are in Ireland, and U.K. credit unions may also be affected.","Authorities reported no evidence of compromised member funds or unauthorized transactions despite the exposure of payment-recipient information."],"referencedReports":[],"body":"\u003cp\u003eHackers accessed payment-recipient details belonging to members of more than 40 Irish credit unions after exploiting an unidentified weakness in systems operated by Belfast-based software supplier Wellington IT. Ireland’s Data Protection Commission said it received more than 40 breach notifications from credit unions using Wellington IT as a data processor. The exposure was limited to payee details stored by members who used credit union mobile banking apps operated by Wellington IT; members who did not use the apps were unaffected.\u003c/p\u003e\n\n\u003cp\u003eWellington IT closed the weakness on October 6, but its initial investigation did not identify a data-protection breach, and affected credit unions were not notified until November 16. Irish Minister of State Robert Troy called the delay unacceptable and said outside experts were determining the exact number of affected accounts and users. Irish authorities said there was no indication that member funds were accessed or that unauthorized or fraudulent transactions occurred. Because Wellington IT is based in Northern Ireland, the incident also involves the United Kingdom, where the Information Commissioner’s Office was beginning to receive reports from credit unions and said U.K. members may be affected.\u003c/p\u003e\n"},{"n":18,"title":"Fake GTA VI PC client spreads malware through a ClickFix attack","source":"bitdefender.com","sourceColorIdx":7,"link":"https://www.bitdefender.com/en-us/blog/labs/fake-gta-vi-pc-client-malware-clickfix","time":"16:49","priority":"SHOULD READ","score":78,"tldr":"A fake GTA VI PC streaming client uses a ClickFix lure to persuade Windows users to run a PowerShell command that installs an information-stealing malware payload. Anyone who ran it should treat the device as compromised, scan it, and change important passwords from a clean device.","briefOverview":"\u003cp\u003eBitdefender researchers identified a fake GTA VI PC streaming website that tells Windows users to press Win+R and run a pasted PowerShell command. The command downloads a ZIP archive, unpacks it into AppData, and starts GTA6Cloud.exe. The site presents this as a way to stream GTA VI from a PlayStation or Xbox console rather than download the game itself, while stating it is unaffiliated with Rockstar Games or Take-Two Interactive.\u003c/p\u003e\n\n\u003cp\u003eGTA6Cloud.exe displays a GTA VI-themed decoy page and trailer while downloading additional files, including loadperf.dll and the legitimate Windows utility unlodctr.exe, into a hidden folder. The attackers use the legitimate utility to load the malicious DLL, which injects a Rust-based information stealer into legitimate Windows processes. The stealer can collect browser credentials, cookies, tokens, gaming and cryptocurrency wallet data, AI and developer-service credentials, clipboard contents, and screenshots, and can send stolen information to its command-and-control infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe article describes the scheme as a ClickFix attack because victims are convinced to run the command themselves rather than the attackers exploiting a software flaw. Users who ran the command are advised to treat the computer as compromised, disconnect it from the internet if possible, scan it with trusted security software, and change important passwords from a separate clean device. Users who only visited the site without running the command or opening a downloaded file did not complete the described installation chain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake GTA VI PC streaming website instructs Windows users to use Win+R to run a PowerShell command that downloads and starts GTA6Cloud.exe.","The downloaded executable displays a GTA VI-themed decoy while downloading additional files, including loadperf.dll and unlodctr.exe, into a hidden folder.","The malware abuses the legitimate Windows program unlodctr.exe to load its malicious DLL and injects a Rust-based information stealer into legitimate Windows processes.","The stealer can collect browser credentials, cookies, tokens, Discord and Steam data, cryptocurrency wallet data, AI and developer-service credentials, clipboard contents, and screenshots.","People who ran the command should treat the computer as compromised, disconnect it from the internet, scan it with trusted security software, and change important passwords from a clean device."],"insights":["The scam avoids the implausible claim of offering a downloadable GTA VI PC game and instead presents itself as a client for streaming the game from a PlayStation or Xbox console.","The PowerShell instruction uses both an execution-policy bypass and a command that immediately runs internet-downloaded code, so users are asked to execute code without reviewing it first.","The malicious DLL is designed to forward most functions to a legitimate Windows component so that the legitimate host program continues working while the malware runs.","Simply visiting the malicious site does not complete the described infection chain; the user must run the pasted command or open the downloaded file."],"referencedReports":[{"title":"GTA VI cyber threats: fake downloads, ransomware and account hijacking","url":"https://www.darktrace.com/blog/gta-vi-cyber-threats-fake-downloads-ransomware-and-account-hijacking","publisher":"darktrace","context":"The article cites Darktrace researchers as having observed a similar-looking website whose malicious file was described as different malware.","category":"research","primary":false}],"body":"\u003cp\u003eBitdefender researchers identified a fake GTA VI PC streaming website that tells Windows users to press Win+R and run a pasted PowerShell command. The command downloads a ZIP archive, unpacks it into AppData, and starts GTA6Cloud.exe. The site presents this as a way to stream GTA VI from a PlayStation or Xbox console rather than download the game itself, while stating it is unaffiliated with Rockstar Games or Take-Two Interactive.\u003c/p\u003e\n\n\u003cp\u003eGTA6Cloud.exe displays a GTA VI-themed decoy page and trailer while downloading additional files, including loadperf.dll and the legitimate Windows utility unlodctr.exe, into a hidden folder. The attackers use the legitimate utility to load the malicious DLL, which injects a Rust-ba
