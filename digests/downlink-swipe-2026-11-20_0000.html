<script type="application/json" id="dl-articles">[{"n":3,"title":"VMware patches vCenter zero-day exploited in attacks since September","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/vmware-patches-vcenter-zero-day-exploited-in-attacks-since-september/","time":"00:26","priority":"MUST READ","score":98,"tldr":"Broadcom released an emergency patch for CVE-2026-123890, a critical VMware vCenter authentication-bypass flaw exploited since September by the suspected Chinese-linked Armory Castle group. Organizations should patch vCenter immediately, as exploitation can grant attackers administrative control of virtualized environments and enable credential theft.","briefOverview":"\u003cp\u003eBroadcom released emergency updates on November 19 to address CVE-2026-123890, a critical authentication-bypass flaw in VMware vCenter Server’s Directory Service. The issue allows an unauthenticated attacker with network access to bypass login requirements and gain unauthorized access to a vulnerable vCenter Server. Successful compromise can provide administrative control over the virtual machines managed by the server. Broadcom said there are no official workarounds, although network restrictions and firewall controls can reduce exposure.\u003c/p\u003e\n\n\u003cp\u003eMandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw in attacks starting in early September 2026. The group reportedly used the BONESAW tool to create a vCenter SSO administrator account, steal the directory database, and extract SAML signing keys. It then used SAWSNAKE to forge authentication tokens, bypass multifactor authentication, and impersonate legitimate users, while deploying multiple web shells and backdoors for continued access. Broadcom urged organizations using affected vCenter, SDDC Manager, or VMware Tools for Windows versions to apply the security updates as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Broadcom released emergency security updates on November 19 to fix CVE-2026-123890, a critical VMware vCenter Server authentication-bypass flaw.","The flaw lets an unauthenticated attacker with network access to a vulnerable vCenter Server gain unauthorized administrative access and control the virtual machines it manages.","Mandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw in attacks beginning in early September 2026.","The attackers used a custom Golang tool called BONESAW to create a vCenter Single Sign-On administrator account, steal the directory database, and extract SAML signing keys.","Broadcom said there are no official workarounds and urged organizations to install the patches as soon as possible."],"insights":["The same intrusion campaign reportedly combined a BeyondTrust Remote Support zero-day with the VMware vCenter flaw, allowing attackers to move from compromised remote-support appliances through internal Linux systems to VMware infrastructure.","By stealing SAML signing keys and using the SAWSNAKE tool, the attackers could forge login tokens, bypass multifactor authentication, and impersonate legitimate users after the initial vCenter compromise.","The issue affects vCenter whether or not Enhanced Linked Mode is enabled, so disabling or avoiding that configuration does not remove exposure.","Broadcom said that network restrictions and firewall controls may reduce exposure, but it provided no official workaround, making installation of the security updates the primary remediation."],"referencedReports":[{"title":"VMSA-2026-0009","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md","publisher":"broadcom","context":"Broadcom's security advisory lists the affected VMware products and fixed versions for CVE-2026-123890 and four additional vulnerabilities.","category":"advisory","primary":true},{"title":"Armory Castle Exploits vSphere","url":"http://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"google-mandiant","context":"Mandiant and Google Threat Intelligence Group documented Armory Castle's exploitation of CVE-2026-123890 and the tools used in the intrusion campaign.","category":"research","primary":true}],"body":"\u003cp\u003eBroadcom released emergency updates on November 19 to address CVE-2026-123890, a critical authentication-bypass flaw in VMware vCenter Server’s Directory Service. The issue allows an unauthenticated attacker with network access to bypass login requirements and gain unauthorized access to a vulnerable vCenter Server. Successful compromise can provide administrative control over the virtual machines managed by the server. Broadcom said there are no official workarounds, although network restrictions and firewall controls can reduce exposure.\u003c/p\u003e\n\n\u003cp\u003eMandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw in attacks starting in early September 2026. The group reportedly used the BONESAW tool to create a vCenter SSO administrator account, steal the directory database, and extract SAML signing keys. It then used SAWSNAKE to forge authentication tokens, bypass multifactor authentication, and impersonate legitimate users, while deploying multiple web shells and backdoors for continued access. Broadcom urged organizations using affected vCenter, SDDC Manager, or VMware Tools for Windows versions to apply the security updates as soon as possible.\u003c/p\u003e\n"},{"n":26,"title":"China-Linked Hackers Exploit Critical VMware vCenter Zero-Day to Gain Admin Access and Steal Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/china-linked-hackers-exploit-critical.html","time":"06:33","priority":"MUST READ","score":98,"tldr":"China-linked Armory Castle exploited the critical VMware vCenter authentication-bypass zero-day CVE-2026-123890 to obtain administrator access, steal data, and persist across targeted environments. Organizations should urgently apply Broadcom’s November 2026 patches and investigate exposure to associated tools including BONESAW and SAWSNAKE.","briefOverview":"\u003cp\u003eThe suspected China-linked espionage group Armory Castle, formerly UNC5221, exploited the critical VMware vCenter Server zero-day CVE-2026-123890 in early September 2026. The flaw is an unauthenticated authentication bypass in VMware Directory Service that can establish a session as administrator@vsphere.local. Google Threat Intelligence Group and Mandiant said the group used a Golang utility called BONESAW to exploit the issue, obtain data such as the data.mdb database, take over the vCenter Security Token Service, and create an SSO administrator account. Broadcom released patches on November 19, 2026, including vCenter 8.0 U3m and designated Cloud Foundation and vSphere Foundation versions.\u003c/p\u003e\n\n\u003cp\u003eThe vCenter activity was part of a wider campaign that also exploited a BeyondTrust Remote Support zero-day, then moved through an internal Linux appliance toward the virtualized environment. Armory Castle used tools including SLIMSAVAGE and CAGEMATCH web shells, the SAWSNAKE token-forging utility, and BEARBONES and LAZYBONES backdoors. The group scanned for VMware-related ports, enabled vCenter SSH through the VAMI API, created an additional administrator account, enumerated ESXi storage, and stole archived data through the compromised Remote Support appliance. Google said the use of two zero-days and specialized malware for several appliance types demonstrated substantial resources and a sustained effort against high-priority targets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Threat Intelligence Group and Mandiant attributed early September 2026 exploitation of the critical VMware vCenter flaw CVE-2026-123890 to the suspected China-linked group Armory Castle, formerly UNC5221.","CVE-2026-123890 is an unauthenticated VMware Directory Service flaw that can create an authenticated administrator@vsphere.local session, enabling attackers to run commands and obtain files such as the data.mdb database.","Broadcom released fixes for the flaw on November 19, 2026, including VMware vCenter 8.0 U3m and specified VMware Cloud Foundation and vSphere Foundation releases.","Google observed the group using the Golang-based BONESAW utility to exploit the flaw, extract database data, take over the vCenter token service, and create an SSO administrator account.","The campaign also involved web shells, backdoors, internal scanning for VMware-related ports, ESXi file-system reconnaissance, and theft of archived data."],"insights":["The intrusion moved from a compromised BeyondTrust Remote Support device through an internal Linux appliance and into the virtualized environment, showing that the vCenter compromise was part of a broader multi-system campaign rather than an isolated entry point.","After BONESAW accessed vCenter, SAWSNAKE could generate forged login tokens that let the attackers impersonate users and bypass multi-factor authentication through a Golden SAML technique.","The group specifically scanned for ports 9080, 5480, and 2012; port 2012 is the vCenter Single Sign-On control interface used in its remote exploitation workflow.","The attackers established several persistence paths on vCenter and ESXi systems, including a new administrator account, enabled SSH through the VAMI API, and an SSH public key placed in the root account’s authorized keys.","Google said the campaign’s use of two zero-days and several specialized toolsets targeting different appliances indicates substantial resources and operational commitment."],"referencedReports":[{"title":"VMSA-2026-0009","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495","publisher":"broadcom","context":"The article links Broadcom’s security advisory for CVE-2026-123890 and its affected VMware products.","category":"advisory","primary":false},{"title":"VMSA-2026-0009 Security Advisory","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md","publisher":"vmware","context":"The article cites this VMware security-advisory repository entry as the source for the patches released on November 19, 2026.","category":"advisory","primary":false},{"title":"Armory Castle Exploits vSphere","url":"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"google-threat-intelligence-group-and-mandiant","context":"The article relies on Google Threat Intelligence Group and Mandiant’s technical analysis for the attribution, exploitation details, and malware used in the campaign.","category":"research","primary":true}],"body":"\u003cp\u003eThe suspected China-linked espionage group Armory Castle, formerly UNC5221, exploited the critical VMware vCenter Server zero-day CVE-2026-123890 in early September 2026. The flaw is an unauthenticated authentication bypass in VMware Directory Service that can establish a session as administrator@vsphere.local. Google Threat Intelligence Group and Mandiant said the group used a Golang utility called BONESAW to exploit the issue, obtain data such as the data.mdb database, take over the vCenter Security Token Service, and create an SSO administrator account. Broadcom released patches on November 19, 2026, including vCenter 8.0 U3m and designated Cloud Foundation and vSphere Foundation versions.\u003c/p\u003e\n\n\u003cp\u003eThe vCenter activity was part of a wider campaign that also exploited a BeyondTrust Remote Support zero-day, then moved through an internal Linux appliance toward the virtualized environment. Armory Castle used tools including SLIMSAVAGE and CAGEMATCH web shells, the SAWSNAKE token-forging utility, and BEARBONES and LAZYBONES backdoors. The group scanned for VMware-related ports, enabled vCenter SSH through the VAMI API, created an additional administrator account, enumerated ESXi storage, and stole archived data through the compromised Remote Support appliance. Google said the use of two zero-days and specialized malware for several appliance types demonstrated substantial resources and a sustained effort against high-priority targets.\u003c/p\u003e\n"},{"n":19,"title":"Hackers Exploit Critical Cisco Expressway Flaw, Breach Four Devices and Reach Internal Network","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-cisco.html","time":"10:32","priority":"MUST READ","score":96,"tldr":"Attackers exploited the critical Cisco Expressway flaw CVE-2026-76466 shortly after a public PoC was released, gaining root access to internet-facing devices and pivoting into a Russian organization’s internal network. Organizations should urgently patch or migrate affected Expressway versions and investigate for the published indicators of compromise.","briefOverview":"\u003cp\u003eThreat actors exploited CVE-2026-76466, a critical Cisco Expressway flaw with a CVSS score of 9.8, to compromise a Russian organization. The vulnerability can allow an unauthenticated remote attacker with network access to execute operating-system commands as root on an affected device. Cisco said the issue involves persistent cookies and insufficient validation of client certificates when clustering TLS Verify Mode is enabled.\u003c/p\u003e\n\n\u003cp\u003eF6 reported that attackers exploited Cisco Expressway X15.5.3 devices after a public proof-of-concept exploit became available, initially compromising two internet-facing devices and reaching two additional internal cluster nodes through one of them. After obtaining root access, they used custom Python scripts to scan the network, locate SMB resources, interact with SQL Server and WinRM, and access GitLab repositories for credentials and other sensitive data. Cisco released fixes on October 21, 2026, and users are advised to update supported versions, investigate for the published indicators of compromise, isolate affected systems, and limit lateral movement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors exploited CVE-2026-76466, a Cisco Expressway vulnerability rated 9.8 out of 10, to run commands with the highest level of system access on affected devices.","F6 reported the apparent first observed real-world exploitation after a public proof-of-concept became available, affecting Cisco Expressway X15.5.3 devices at a Russian organization.","The attackers initially compromised two internet-facing Cisco Expressway devices and used one to reach two additional cluster nodes on the organization’s internal network.","After gaining access, the attackers used custom Python scripts to scan the network, identify accessible SMB resources, interact with SQL Server and WinRM, and access GitLab repositories to obtain credentials and sensitive data.","Cisco released fixes on October 21, 2026, with Expressway X15.5.20 addressing affected X15.5.3 and earlier releases."],"insights":["The exploitation was observed shortly after a public proof-of-concept was released, showing that public exploit code was followed quickly by real-world use against exposed Cisco Expressway devices.","Compromising an internet-facing Expressway device enabled access to additional cluster nodes on the internal network, illustrating how device clustering can extend the impact beyond the initially exposed systems.","Organizations can hunt for this activity using the published indicators, including \"wombat@127.0.0.1\" in Expressway Erlang logs and Python files staged under the specified /mnt/harddisk paths.","The attackers’ post-compromise scripts targeted SMB shares, SQL Server, WinRM, and GitLab repositories, so investigating an affected device should include checking those internal resources for follow-on activity and credential exposure."],"referencedReports":[{"title":"Cisco Security Advisory for CVE-2026-76466","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t","publisher":"cisco","context":"The article cites Cisco’s advisory for the vulnerability’s cause, impact, and fixed Expressway releases.","category":"advisory","primary":true},{"title":"F6 Report on Cisco Expressway Vulnerability Exploitation","url":"https://f6.security/media-center/press-releases/cisco-vulnerability-exploitation/","publisher":"f6","context":"The article relies on F6’s report for details of the observed intrusion, lateral movement, and indicators of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors exploited CVE-2026-76466, a critical Cisco Expressway flaw with a CVSS score of 9.8, to compromise a Russian organization. The vulnerability can allow an unauthenticated remote attacker with network access to execute operating-system commands as root on an affected device. Cisco said the issue involves persistent cookies and insufficient validation of client certificates when clustering TLS Verify Mode is enabled.\u003c/p\u003e\n\n\u003cp\u003eF6 reported that attackers exploited Cisco Expressway X15.5.3 devices after a public proof-of-concept exploit became available, initially compromising two internet-facing devices and reaching two additional internal cluster nodes through one of them. After obtaining root access, they used custom Python scripts to scan the network, locate SMB resources, interact with SQL Server and WinRM, and access GitLab repositories for credentials and other sensitive data. Cisco released fixes on October 21, 2026, and users are advised to update supported versions, investigate for the published indicators of compromise, isolate affected systems, and limit lateral movement.\u003c/p\u003e\n"},{"n":36,"title":"nginx2root: Five new nginx vulnerabilities, and how Cloudflare protects origins from the worst of them","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/nginx2root/","time":"01:58","priority":"MUST READ","score":96,"tldr":"Five newly disclosed nginx2root flaws, especially CVE-2026-123007 in HTTP/2, can enable remote code execution on vulnerable nginx servers and should be patched immediately. Cloudflare-proxied origins are shielded from the HTTP/2 and HTTP/3 attack paths only if attackers cannot directly reach the origin, but resolver and mail-proxy configurations still require remediation.","briefOverview":"\u003cp\u003eF5 and nginx.org disclosed ten nginx vulnerabilities on November 18, 2026, including five memory-corruption flaws collectively called nginx2root. The flaws can allow an unauthenticated attacker to crash an nginx worker and, according to Xint’s research, potentially run commands as the nginx worker. CVE-2026-123007, affecting HTTP/2-enabled nginx releases since 2015, is presented as the most serious because HTTP/2 is commonly enabled and the bug can lead to an out-of-bounds memory read/write. Xint also identified a separate Linux SCTP kernel flaw that could reportedly elevate nginx-worker code execution to root access on the host, including from a Docker container.\u003c/p\u003e\n\n\u003cp\u003eCloudflare states that its edge is not affected and that origins behind its HTTP proxy are shielded from the HTTP/2 and HTTP/3 flaws because client connections end at Cloudflare rather than reaching nginx directly. This protection does not apply if attackers can connect directly to an origin, nor does it fully protect the resolver flaw CVE-2026-123634 or the mail-proxy flaw CVE-2026-113425. Organizations are advised to update nginx Open Source to 1.30.7 or 1.31.9, nginx Plus to fixed 37.x releases, restart nginx after updating, and restrict origins so they are reachable only through Cloudflare. The article also recommends disabling unneeded HTTP/2, HTTP/3, mail-proxy, and SCTP functionality as temporary mitigations where patching is delayed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 and nginx.org disclosed five nginx2root memory-corruption vulnerabilities on November 18, 2026, including CVE-2026-123007, an HTTP/2 flaw affecting nginx releases since 1.9.5.","CVE-2026-123007 can be triggered when HTTP/2 is enabled and, according to the cited research, may allow an unauthenticated attacker to crash an nginx worker or run commands after bypassing address randomization protections.","Cloudflare says its HTTP proxy protects proxied origins from the HTTP/2 and HTTP/3 nginx2root attacks because client connections terminate at Cloudflare’s edge, but this protection does not apply when an attacker can reach the origin directly.","The resolver flaw CVE-2026-123634 and the mail-proxy flaw CVE-2026-113425 are not fully protected by Cloudflare’s HTTP proxy and require affected nginx configurations to be patched or restricted.","Organizations should update to nginx Open Source 1.30.7 or 1.31.9, nginx Plus 37.0.8.1 or 37.3.0.1, or a vendor-provided fixed build, then restart nginx."],"insights":["Cloudflare’s protection is based on ending and recreating web connections at its edge, not on a WAF signature, so attacker-controlled HTTP/2 and HTTP/3 control messages never reach a properly isolated nginx origin.","The known CVE-2026-123007 attack path requires unusually large traffic volumes—about 128 GB in Rapid7’s proof of concept—over one long-lived HTTP/2 connection, creating a potentially visible pattern of massive inbound traffic with little response traffic.","A configuration reload does not replace nginx’s running program, so organizations must restart nginx or complete a binary upgrade after installing a fixed package.","The related Linux SCTP flaw can reportedly turn code execution as an nginx worker into root access on the host, including from an nginx container, and systems that do not use SCTP can block automatic loading of its kernel module as a temporary safeguard.","Package version output alone may be misleading because Linux distributions can backport fixes without changing nginx’s reported upstream version, so administrators need to compare full package versions with their distribution’s advisory."],"referencedReports":[{"title":"NGINX2Root technical write-up","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"Xint","context":"The article relies on Xint’s technical research for exploit conditions, code-execution findings, and the related Linux SCTP kernel flaw.","category":"research","primary":true},{"title":"F5 advisory index K000164058","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"F5","context":"The article cites F5’s advisory for severity ratings, affected nginx configurations, and fixed nginx Plus releases.","category":"advisory","primary":true},{"title":"nginx security advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx.org","context":"The article references nginx.org’s security-advisory material for the coordinated disclosure and fixed releases.","category":"advisory","primary":true},{"title":"CVE-2026-123007 Critical NGINX HTTP/2 Integer Underflow Leads to RCE","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"Rapid7","context":"The article cites Rapid7’s analysis and proof of concept for the HTTP/2 flaw’s proxy behavior and estimated traffic requirements.","category":"research","primary":false},{"title":"nginx2root simple test","url":"https://censys.com/blog/nginx2root-simple-test","publisher":"Censys","context":"The article cites Censys’s test showing that the corrupted HTTP/2 flow-control state can be reached with a small traffic capture.","category":"research","primary":false},{"title":"nginx HTTP/2 RCE vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"Wiz Research","context":"The article cites Wiz Research among the independent researchers that reported code execution related to the HTTP/2 vulnerability.","category":"research","primary":false}],"body":"\u003cp\u003eF5 and nginx.org disclosed ten nginx vulnerabilities on November 18, 2026, including five memory-corruption flaws collectively called nginx2root. The flaws can allow an unauthenticated attacker to crash an nginx worker and, according to Xint’s research, potentially run commands as the nginx worker. CVE-2026-123007, affecting HTTP/2-enabled nginx releases since 2015, is presented as the most serious because HTTP/2 is commonly enabled and the bug can lead to an out-of-bounds memory read/write. Xint also identified a separate Linux SCTP kernel flaw that could reportedly elevate nginx-worker code execution to root access on the host, including from a Docker container.\u003c/p\u003e\n\n\u003cp\u003eCloudflare states that its edge is not affected and that origins behind its HTTP proxy are shielded from the HTTP/2 and HTTP/3 flaws because client connections end at Cloudflare rather than reaching nginx directly. This protection does not apply if attackers can connect directly to an origin, nor does it fully protect the resolver flaw CVE-2026-123634 or the mail-proxy flaw CVE-2026-113425. Organizations are advised to update nginx Open Source to 1.30.7 or 1.31.9, nginx Plus to fixed 37.x releases, restart nginx after updating, and restrict origins so they are reachable only through Cloudflare. The article also recommends disabling unneeded HTTP/2, HTTP/3, mail-proxy, and SCTP functionality as temporary mitigations where patching is delayed.\u003c/p\u003e\n"},{"n":1,"title":"F5 releases emergency patches for critical BIG-IP RCE flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/f5-releases-emergency-patches-for-critical-big-ip-rce-flaws/","time":"10:57","priority":"MUST READ","score":94,"tldr":"F5 released emergency patches for five critical BIG-IP flaws that unauthenticated attackers could use for remote code execution, plus a high-severity APM denial-of-service flaw. Organizations should apply the out-of-band hotfixes immediately because no mitigations are available and many BIG-IP systems are exposed online.","briefOverview":"\u003cp\u003eF5 released out-of-band hotfixes for five critical BIG-IP vulnerabilities affecting the Access Policy Manager (APM) and the iRules scripting feature. The flaws—CVE-2026-121805, CVE-2026-120292, CVE-2026-120285, CVE-2026-116953, and CVE-2026-123637—are stack-based buffer overflows that unauthenticated attackers can use to execute arbitrary code remotely. F5 also released engineering hotfixes for CVE-2026-126822, a high-severity APM SAML issue caused by an integer underflow that can be used to cause denial of service.\u003c/p\u003e\n\n\u003cp\u003eF5 said no mitigations are available and advised customers to install the hotfixes on vulnerable devices. Shadowserver tracks more than 177,000 BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints exposed online, although the article notes that it is unknown how many are patched or honeypots. F5 has not reported exploitation of these newly disclosed flaws, but the article notes that prior F5 vulnerabilities have been used to breach networks, map internal servers, hijack devices, deploy data-wiping malware, and steal files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 released out-of-band hotfixes for five critical BIG-IP flaws that unauthenticated attackers can exploit to execute arbitrary code remotely.","The affected issues include CVE-2026-121805, CVE-2026-120292, CVE-2026-120285, CVE-2026-116953, and CVE-2026-123637, which affect BIG-IP Access Policy Manager and the BIG-IP iRules feature.","F5 also issued engineering hotfixes for CVE-2026-126822, a high-severity BIG-IP APM flaw that unauthenticated attackers can use to cause denial of service.","F5 said there are no mitigations for these flaws and advised customers to install the released hotfixes on vulnerable devices.","Shadowserver tracks more than 177,000 internet-exposed BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints."],"insights":["The lack of available mitigations means affected organizations have only one stated protective option: installing F5's out-of-band hotfixes.","Although F5 had not reported active exploitation of these newly disclosed flaws, its BIG-IP vulnerabilities have repeatedly been abused in prior incidents, including by ransomware groups.","Shadowserver's count of more than 177,000 exposed BIG-IP instances indicates substantial potential internet exposure, but the article notes that the number of vulnerable systems is unknown because some may be patched or honeypots.","The disclosure follows a separate critical BIG-IP APM remote-code-execution flaw that F5 said was actively exploited as a zero-day in September."],"referencedReports":[{"title":"F5 advisory K000163946 for CVE-2026-121805","url":"https://my.f5.com/manage/s/article/K000163946","publisher":"f5","context":"The article links this F5 advisory as documentation for one of the critical BIG-IP remote-code-execution flaws.","category":"advisory","primary":true},{"title":"F5 advisory K000163940 for CVE-2026-120292","url":"https://my.f5.com/manage/s/article/K000163940","publisher":"f5","context":"The article links this F5 advisory as documentation for one of the critical BIG-IP remote-code-execution flaws.","category":"advisory","primary":true},{"title":"F5 advisory K000163939 for CVE-2026-120285","url":"https://my.f5.com/manage/s/article/K000163939","publisher":"f5","context":"The article links this F5 advisory as documentation for one of the critical BIG-IP remote-code-execution flaws.","category":"advisory","primary":true},{"title":"F5 advisory K000163941 for CVE-2026-116953","url":"https://my.f5.com/manage/s/article/K000163941","publisher":"f5","context":"The article links this F5 advisory as documentation for one of the critical BIG-IP remote-code-execution flaws.","category":"advisory","primary":true},{"title":"F5 advisory K000163937 for CVE-2026-123637","url":"https://my.f5.com/manage/s/article/K000163937","publisher":"f5","context":"The article links this F5 advisory as documentation for one of the critical BIG-IP remote-code-execution flaws.","category":"advisory","primary":true},{"title":"F5 advisory K000163942 for CVE-2026-126822","url":"https://my.f5.com/manage/s/article/K000163942","publisher":"f5","context":"The article links this F5 advisory for the high-severity BIG-IP APM denial-of-service flaw.","category":"advisory","primary":true},{"title":"CISA Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A811","publisher":"cybersecurity-and-infrastructure-security-agency","context":"The article cites CISA's catalog to note that seven F5 vulnerabilities have been flagged as actively exploited since November 2021.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 released out-of-band hotfixes for five critical BIG-IP vulnerabilities affecting the Access Policy Manager (APM) and the iRules scripting feature. The flaws—CVE-2026-121805, CVE-2026-120292, CVE-2026-120285, CVE-2026-116953, and CVE-2026-123637—are stack-based buffer overflows that unauthenticated attackers can use to execute arbitrary code remotely. F5 also released engineering hotfixes for CVE-2026-126822, a high-severity APM SAML issue caused by an integer underflow that can be used to cause denial of service.\u003c/p\u003e\n\n\u003cp\u003eF5 said no mitigations are available and advised customers to install the hotfixes on vulnerable devices. Shadowserver tracks more than 177,000 BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints exposed online, although the article notes that it is unknown how many are patched or honeypots. F5 has not reported exploitation of these newly disclosed flaws, but the article notes that prior F5 vulnerabilities have been used to breach networks, map internal servers, hijack devices, deploy data-wiping malware, and steal files.\u003c/p\u003e\n"},{"n":17,"title":"MoldyRoost: A Malvertising Machine Built to Deliver iOS Exploits","source":"blog.confiant.com","sourceColorIdx":8,"link":"https://blog.confiant.com/p/moldyroost-a-malvertising-machine","time":"12:44","priority":"MUST READ","score":94,"tldr":"MoldyRoost is a large malvertising operation that uses cloaked ads and hidden iPhone browser frames to silently deliver Coruna and DarkSword iOS exploit chains, potentially stealing crypto wallet seed phrases, keychain data, messages and photos. Researchers linked more than 480 ad domains across six sub-clusters and found leaked source code showing per-campaign attribution for stolen data.","briefOverview":"\u003cp\u003eMoldyRoost is a malvertising operation that buys programmatic ads and uses cloaked landing pages to attempt drive-by compromise of vulnerable iPhones when users tap an ad. Researchers linked more than 480 advertising domains, arranged in six sub-clusters, to campaigns observed in more than 47 countries between May 12 and November 17, 2026. The operation is distinct from the November 16 Optimizely supply-chain attack, although both used Coruna and DarkSword iOS exploit kits and related version-routing infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns show benign or decoy pages to most visitors but serve hidden browser frames to targeted iPhone Safari users, where the frames identify the iOS version and select an exploit chain. MoldyRoost uses Coruna, SilkPath, DarkSword, and GhostWave branches; the reported payloads can target crypto wallet seed phrases, keychain data, messages, photos, Wi-Fi passwords, location history, and other device data. A source-code exposure on the sub-cluster F server ab124[.]live revealed code attributed to \u0026ldquo;nano,\u0026rdquo; including Coruna- and DarkSword-style components and a mechanism that creates separate payloads for each sales channel so stolen data can be attributed to the campaign that delivered it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["MoldyRoost is a malvertising operation that uses programmatic ads, cloaked landing pages, and hidden browser frames to attempt drive-by exploitation of vulnerable iPhones after an ad is tapped.","The operation selects among Coruna, SilkPath, DarkSword, and GhostWave exploit kits based on the visitor's iOS version, with the reported payloads targeting crypto wallet seed phrases, keychain data, messages, photos, and other device information.","Researchers linked more than 480 advertising domains to six MoldyRoost sub-clusters between May 12 and November 17, 2026, with campaigns observed across more than 47 countries.","A readable Git repository on the sub-cluster F server ab124[.]live exposed source code and commits attributed to an author named Nano, including code for Coruna- and DarkSword-style chains and per-channel payload attribution.","The article distinguishes MoldyRoost from the November 16 Optimizely supply-chain attack, while noting that both used Coruna and DarkSword exploit kits and related version-routing infrastructure."],"insights":["MoldyRoost's loaders account for iOS 26 Safari reporting a frozen \"18_6\" operating-system version in its user agent by checking alternative version fields, indicating the operators actively adapt their targeting logic to platform changes.","Sub-cluster A can automatically move victims from in-app browsers and other iPhone browsers into Safari after a failed or stalled attempt, then restart the hidden exploit process rather than relying on the victim to follow manual instructions.","The exposed Nano source code shows that separate payloads were built for each sales channel so stolen data could be attributed to the campaign that delivered the victim, supporting a structured, performance-tracked distribution model.","The fake Cloudflare-style check used by sub-cluster D does not ask victims to paste commands or install anything; its purpose is to keep them on the page while the hidden iPhone exploit attempt runs.","Although the six sub-clusters use different ad themes and landing pages, they switch among exploit kits at nearly the same iOS-version boundaries and share delivery and tracking components."],"referencedReports":[{"title":"Coruna: Powerful iOS Exploit Kit","url":"https://cloud.google.com/blog/topics/threat-intelligence/coruna-powerful-ios-exploit-kit","publisher":"google-threat-intelligence-group","context":"The article relies on GTIG's analysis for Coruna's exploit chains, targeting history, and links to UNC6691.","category":"research","primary":true},{"title":"Inside the Nation-State-Grade iOS Exploit Kit We’ve Been Tracking","url":"https://iverify.com/blog/coruna-inside-the-nation-state-grade-ios-exploit-kit-we-ve-been-tracking","publisher":"iverify","context":"The article cites iVerify's Coruna analysis alongside GTIG's reporting on the exploit kit.","category":"research","primary":true},{"title":"DarkSword iOS Exploit Chain","url":"https://cloud.google.com/blog/topics/threat-intelligence/darksword-ios-exploit-chain","publisher":"google-threat-intelligence-group","context":"The article cites GTIG's technical analysis for DarkSword's vulnerabilities, observed users, and patch status.","category":"research","primary":true},{"title":"DarkSword iOS Exploit Kit Explained","url":"https://iverify.com/blog/darksword-ios-exploit-kit-explained","publisher":"iverify","context":"The article references iVerify's DarkSword analysis for its targeted iOS versions and exploit-chain details.","category":"research","primary":true},{"title":"Aye-Coruna iOS Exploit Kit C2","url":"https://www.validin.com/blog/aye_coruna_ios_exploit_kit_c2/","publisher":"validin","context":"The article cites Validin's research identifying the LaSDK loader and off-screen iframe on a Coruna delivery URL.","category":"research","primary":false},{"title":"ADINT: Weaponized Ad Tech for Zero-Click Spyware and Mass Identity Vacuuming","url":"https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming","publisher":"confiant","context":"The article references Confiant's ADINT report as prior research on ad infrastructure built to select spyware targets.","category":"research","primary":false},{"title":"DarkSword Variant Threat Research","url":"https://iverify.com/blog/darksword-variant-threat-research","publisher":"iverify","context":"The article lists iVerify's research on the P7 DarkSword variant among its supporting sources.","category":"research","primary":false}],"body":"\u003cp\u003eMoldyRoost is a malvertising operation that buys programmatic ads and uses cloaked landing pages to attempt drive-by compromise of vulnerable iPhones when users tap an ad. Researchers linked more than 480 advertising domains, arranged in six sub-clusters, to campaigns observed in more than 47 countries between May 12 and November 17, 2026. The operation is distinct from the November 16 Optimizely supply-chain attack, although both used Coruna and DarkSword iOS exploit kits and related version-routing infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns show benign or decoy pages to most visitors but serve hidden browser frames to targeted iPhone Safari users, where the frames identify the iOS version and select an exploit chain. MoldyRoost uses Coruna, SilkPath, DarkSword, and GhostWave branches; the reported payloads can target crypto wallet seed phrases, keychain data, messages, photos, Wi-Fi passwords, location history, and other device data. A source-code exposure on the sub-cluster F server ab124[.]live revealed code attributed to \u0026ldquo;nano,\u0026rdquo; including Coruna- and DarkSword-style components and a mechanism that creates separate payloads for each sales channel so stolen data can be attributed to the campaign that delivered it.\u003c/p\u003e\n"},{"n":28,"title":"phpAfterShell: Critical PHP Vulnerabilities (CVE-2026-115560 \u0026 CVE-2026-126714)","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/phpaftershell-critical-php-vulnerabilities-cve-2026-115560-cve-2026-126714/","time":"20:54","priority":"MUST READ","score":94,"tldr":"PHP patched two critical session-handling flaws, CVE-2026-115560 and CVE-2026-126714, that could enable unauthenticated remote code execution on affected servers. Upgrade to PHP 8.2.36, 8.3.37, 8.4.28, 8.5.13, or later immediately, and temporarily disable session upload progress if patching is delayed.","briefOverview":"\u003cp\u003ePHP released security updates on November 19, 2026, covering 17 advisories and 18 CVE identifiers, including seven Critical-severity issues. This article focuses on two Critical PHP session vulnerabilities, CVE-2026-115560 and CVE-2026-126714, each rated CVSS 4.0 9.2 by the PHP security team. Both could enable unauthenticated remote code execution on affected PHP web servers, potentially exposing application data, secrets, and credentials available to the PHP process.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-115560 involves a mismatch between PHP session serialization formats that can cause attacker-controlled session data to be treated as serialized object data. CVE-2026-126714 affects PHP\u0026rsquo;s built-in files session handler, which can leave old trailing data in a session file if an update is interrupted and later cause mixed data to be interpreted as serialized objects. PHP fixed both issues in versions 8.2.36, 8.3.37, 8.4.28, and 8.5.13; the article recommends upgrading immediately, restarting relevant services, and temporarily disabling session upload progress when patching is delayed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP released security updates on November 19, 2026, addressing 17 advisories covering 18 CVE identifiers, including seven critical-severity issues.","CVE-2026-115560 is a session serialization mismatch involving PHP session upload progress that can lead to object deserialization and remote code execution.","CVE-2026-126714 affects PHP's built-in files session handler, where interrupted writes can leave mixed session data that may later be interpreted as serialized objects.","Both vulnerabilities affect PHP 8.2.0 through 8.2.35, 8.3.0 through 8.3.36, 8.4.0 through 8.4.27, and 8.5.0 through 8.5.12.","PHP fixed both issues in versions 8.2.36, 8.3.37, 8.4.28, and 8.5.13, and the article states that no public exploit code or active exploitation had been identified at the time of writing."],"insights":["Checking only the command-line PHP version is insufficient after patching; organizations should verify that internet-facing PHP workers were restarted or reloaded and are running the updated version.","For CVE-2026-115560, disabling session upload progress must occur in administrative configuration before request input is processed, because an application-level ini_set() change happens too late.","Using different session serialization settings across PHP-FPM pools, virtual hosts, applications, or command-line jobs that share session storage can create exposure, so those settings should be consistent or their session storage isolated.","Disabling upload progress may reduce an accessible path for CVE-2026-126714, but it does not fix the underlying session-file write problem.","Organizations changing session serialization formats should assess existing session files and consider expiring or migrating old session data to avoid reading records created in a different format."],"referencedReports":[{"title":"CVE-2026-115560 (GHSA-658j-r8rw-q6mx)","url":"https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx","publisher":"PHP","context":"The article cites this PHP GitHub Security Advisory for the session serializer mismatch vulnerability.","category":"advisory","primary":true},{"title":"CVE-2026-126714 (GHSA-fm2m-fjf5-v3cp)","url":"https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp","publisher":"PHP","context":"The article cites this PHP GitHub Security Advisory for the partially overwritten session-files vulnerability.","category":"advisory","primary":true},{"title":"phpAfterShell research","url":"https://depthfirst.com/research/phpaftershell","publisher":"DepthFirst","context":"The article lists this as additional phpAfterShell research.","category":"research","primary":false},{"title":"phpAfterShell overview","url":"https://depthfirst.com/phpaftershell","publisher":"DepthFirst","context":"The article lists this as an overview of phpAfterShell.","category":"research","primary":false},{"title":"PHP2Shell, the third one: CVE-2026-115560","url":"https://www.zestsecurity.io/resources/content/php2shell-the-third-one-cve-2026-115560","publisher":"ZEST Security","context":"The article lists this as research covering CVE-2026-115560.","category":"research","primary":false}],"body":"\u003cp\u003ePHP released security updates on November 19, 2026, covering 17 advisories and 18 CVE identifiers, including seven Critical-severity issues. This article focuses on two Critical PHP session vulnerabilities, CVE-2026-115560 and CVE-2026-126714, each rated CVSS 4.0 9.2 by the PHP security team. Both could enable unauthenticated remote code execution on affected PHP web servers, potentially exposing application data, secrets, and credentials available to the PHP process.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-115560 involves a mismatch between PHP session serialization formats that can cause attacker-controlled session data to be treated as serialized object data. CVE-2026-126714 affects PHP\u0026rsquo;s built-in files session handler, which can leave old trailing data in a session file if an update is interrupted and later cause mixed data to be interpreted as serialized objects. PHP fixed both issues in versions 8.2.36, 8.3.37, 8.4.28, and 8.5.13; the article recommends upgrading immediately, restarting relevant services, and temporarily disabling session upload progress when patching is delayed.\u003c/p\u003e\n"},{"n":33,"title":"nginx2root (CVE-2026-123007): HTTP/2 Flaw Lets Attackers Run Code on Unpatched nginx Servers","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-123007-nginx-http2-rce","time":"00:05","priority":"MUST READ","score":94,"tldr":"CVE-2026-123007 is a critical HTTP/2 flow-control flaw in nginx versions 1.9.5 through 1.31.8 that can enable unauthenticated remote code execution under specific conditions. Upgrade to nginx 1.31.9 or 1.30.7 (or your vendor’s backport) and restart nginx immediately; disable HTTP/2 if patching is not yet possible.","briefOverview":"\u003cp\u003eCVE-2026-123007 is a critical nginx HTTP/2 flaw, disclosed as part of the nginx2root group of vulnerabilities and fixed in nginx 1.31.9 and 1.30.7. It affects nginx releases from 1.9.5 through 1.31.8 when HTTP/2 is enabled. The article reports that public researchers demonstrated remote code execution, including an exploit that can run commands as the nginx worker process without credentials under stated conditions.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from an accounting error in HTTP/2 response-data limits that can cause nginx to incorrectly accept excessive connection credit, eventually leading to memory corruption. The published full exploit requires a direct connection, approximately 119 GiB of traffic within nginx\u0026rsquo;s one-hour connection limit, an otherwise idle server, and an x86-64 CPU with AVX-512; a smaller proof of concept crashes workers without AVX-512. Organizations should upgrade to a fixed release or distribution backport and restart nginx, since a configuration reload does not replace the running binary; if they cannot patch immediately, they can disable HTTP/2, though this breaks gRPC through nginx and does not address the other nginx2root bugs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123007 is an integer-underflow flaw in nginx HTTP/2 flow-control accounting that affects nginx versions 1.9.5 through 1.31.8 when HTTP/2 is enabled.","The flaw can corrupt memory and, under the published exploit’s stated conditions, allow an unauthenticated attacker to run a command as the nginx worker process.","nginx fixed the issue in versions 1.31.9 and 1.30.7, while Linux distributions may provide the fix through backported package updates.","The published full exploit requires a direct connection, roughly 119 GiB of traffic within nginx’s one-hour connection limit, an otherwise idle server, and an x86-64 CPU with AVX-512.","Organizations that cannot patch immediately can disable HTTP/2, although doing so breaks gRPC through nginx and does not address the other three nginx2root bugs."],"insights":["A normal nginx configuration reload does not replace the vulnerable program code; administrators must restart nginx or use its on-the-fly binary upgrade mechanism after updating.","A reverse proxy that terminates HTTP/2 prevented the tested public exploit because it rebuilt the HTTP/2 responses, but the vulnerable backend still required patching.","External version scans and the nginx version string can be misleading because Linux distributions may backport the fix without changing the upstream nginx version number.","The public exploit could succeed again without restarting nginx after a worker crash because replacement workers inherited the master process's same memory layout.","The malicious HTTP/2 window-update messages do not appear in normal nginx access logs, so connection-level traffic data and worker crash logs are more useful for spotting attempts."],"referencedReports":[{"title":"Out-of-band Security Notification (November 18, 2026)","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"f5","context":"The article cites this F5 security notification in its references for the nginx vulnerability disclosure.","category":"advisory","primary":false},{"title":"CVE-2026-123007","url":"https://my.f5.com/manage/s/article/K000163926","publisher":"f5","context":"The article links to F5's CVE-specific advisory for affected NGINX Plus versions and available fixes.","category":"advisory","primary":false},{"title":"USN-9159-1","url":"https://usn.ubuntu.com/USN-9159-1","publisher":"ubuntu","context":"The article identifies this Ubuntu security notice as documenting distribution package fixes for CVE-2026-123007.","category":"advisory","primary":false},{"title":"Security Advisory 2026-022","url":"https://www.cert.europa.eu/publications/security-advisories/2026-022/","publisher":"cert-eu","context":"The article cites CERT-EU's advisory when stating that no exploitation in the wild had been reported.","category":"advisory","primary":false}],"body":"\u003cp\u003eCVE-2026-123007 is a critical nginx HTTP/2 flaw, disclosed as part of the nginx2root group of vulnerabilities and fixed in nginx 1.31.9 and 1.30.7. It affects nginx releases from 1.9.5 through 1.31.8 when HTTP/2 is enabled. The article reports that public researchers demonstrated remote code execution, including an exploit that can run commands as the nginx worker process without credentials under stated conditions.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from an accounting error in HTTP/2 response-data limits that can cause nginx to incorrectly accept excessive connection credit, eventually leading to memory corruption. The published full exploit requires a direct connection, approximately 119 GiB of traffic within nginx\u0026rsquo;s one-hour connection limit, an otherwise idle server, and an x86-64 CPU with AVX-512; a smaller proof of concept crashes workers without AVX-512. Organizations should upgrade to a fixed release or distribution backport and restart nginx, since a configuration reload does not replace the running binary; if they cannot patch immediately, they can disable HTTP/2, though this breaks gRPC through nginx and does not address the other nginx2root bugs.\u003c/p\u003e\n"},{"n":35,"title":"How Cloudflare WAF protects against ruby2shell (CVE-2026-132825)","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/ruby2shell-waf-protection/","time":"20:24","priority":"MUST READ","score":92,"tldr":"Cloudflare has deployed default-blocking WAF rules for ruby2shell (CVE-2026-132825), a critical Ruby string case-conversion flaw that can enable pre-authentication RCE in default Rails and Sinatra deployments. Organizations should still urgently upgrade to Ruby 3.3.14, 3.4.13, or 4.0.10, as WAF protection cannot cover traffic that bypasses Cloudflare or non-HTTP attack paths.","briefOverview":"\u003cp\u003eRuby disclosed ruby2shell, CVE-2026-132825, on November 19, 2026, describing a critical heap buffer overflow in string case conversion that can achieve remote code execution in some situations. The issue affects Ruby versions 3.3.13 and earlier, 3.4.0 through 3.4.12, and 4.0.0 through 4.0.9; fixes are available in Ruby 3.3.14, 3.4.13, and 4.0.10. Default Ruby on Rails and classic-style Sinatra applications can be exposed before authentication, and affected Ruby versions were bundled in several self-hosted products, including GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when Ruby processes the German sharp s character in certain legacy single-byte encodings: its uppercase form is SS, but Ruby checks for space for only one byte before writing two. Rack\u0026rsquo;s MethodOverride middleware can trigger the vulnerable conversion while processing a specially formed multipart POST request\u0026rsquo;s \u003ccode\u003e_method\u003c/code\u003e value, before application code or authentication checks run. Cloudflare added default-blocking managed WAF rules for ruby2shell and the related GHSA-87fm-7w84-j2px integer overflow for all customers, including Free-plan users, but states that upgrading Ruby remains necessary because direct-to-origin traffic and non-HTTP inputs can bypass WAF coverage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby disclosed ruby2shell (CVE-2026-132825) on November 19, 2026, a critical heap buffer overflow in string case conversion that Ruby says can lead to remote code execution in some scenarios.","Ruby 3.3.14, 3.4.13, and 4.0.10 contain fixes for ruby2shell, while Ruby 3.2 and earlier are end of life and will not receive the fix.","Default Ruby on Rails and classic-style Sinatra applications can reach the flaw before authentication through Rack's handling of the _method parameter in multipart POST requests.","Cloudflare added default-blocking ruby2shell and related GHSA-87fm-7w84-j2px managed WAF rules for customers, including those on its Free plan.","Cloudflare states that WAF rules are a temporary compensating control and recommends upgrading Ruby because direct-to-origin traffic and non-HTTP inputs can bypass WAF coverage."],"insights":["The flaw is triggered by the German sharp s character in certain legacy single-byte character sets, where Ruby reserves space for one byte but writes its two-character uppercase form, SS.","A multipart POST request can reach the vulnerable case-conversion code during request routing through Rack's _method handling, before an application’s authentication checks or application code run.","UTF-8 strings use a different Ruby code path and are not affected; the exposed path depends on legacy ISO-8859 and Windows-125x encodings.","Updating an application alone may not be sufficient when Ruby is bundled inside self-hosted products or container images; the article specifically recommends updating those products and rebuilding container images.","Cloudflare’s additional rule also covers GHSA-87fm-7w84-j2px, a separate integer overflow in the same Ruby string case-conversion code fixed in the same Ruby releases."],"referencedReports":[{"title":"GHSA-34m4-m9fh-gqp5: ruby2shell (CVE-2026-132825)","url":"https://github.com/ruby/ruby/security/advisories/GHSA-34m4-m9fh-gqp5","publisher":"ruby","context":"The article cites this Ruby security advisory for the disclosure of the ruby2shell heap buffer overflow.","category":"advisory","primary":true},{"title":"Multiple vulnerabilities in Regexp and String","url":"https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/","publisher":"ruby","context":"The article cites this Ruby advisory for the fixed Ruby releases and the six additional memory-safety flaws addressed in the same release.","category":"advisory","primary":true}],"body":"\u003cp\u003eRuby disclosed ruby2shell, CVE-2026-132825, on November 19, 2026, describing a critical heap buffer overflow in string case conversion that can achieve remote code execution in some situations. The issue affects Ruby versions 3.3.13 and earlier, 3.4.0 through 3.4.12, and 4.0.0 through 4.0.9; fixes are available in Ruby 3.3.14, 3.4.13, and 4.0.10. Default Ruby on Rails and classic-style Sinatra applications can be exposed before authentication, and affected Ruby versions were bundled in several self-hosted products, including GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when Ruby processes the German sharp s character in certain legacy single-byte encodings: its uppercase form is SS, but Ruby checks for space for only one byte before writing two. Rack\u0026rsquo;s MethodOverride middleware can trigger the vulnerable conversion while processing a specially formed multipart POST request\u0026rsquo;s \u003ccode\u003e_method\u003c/code\u003e value, before application code or authentication checks run. Cloudflare added default-blocking managed WAF rules for ruby2shell and the related GHSA-87fm-7w84-j2px integer overflow for all customers, including Free-plan users, but states that upgrading Ruby remains necessary because direct-to-origin traffic and non-HTTP inputs can bypass WAF coverage.\u003c/p\u003e\n"},{"n":37,"title":"How Cloudflare WAF helps protect against phpAfterShell and other critical PHP flaws","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/phpaftershell-waf-protection/","time":"20:00","priority":"SHOULD READ","score":89,"tldr":"Cloudflare updated its WAF to block known phpAfterShell exploit patterns by default, but organizations must urgently upgrade PHP to patched releases and restart all workers because the WAF cannot cover every exploitation path. The November 2026 PHP release fixes phpAfterShell and six other critical flaws, with additional Cloudflare rules available for PHP-FPM and SOAP issues.","briefOverview":"\u003cp\u003ePHP fixed phpAfterShell (CVE-2026-126714), a critical vulnerability in its default file-based session handler that can lead to remote code execution, in releases published on November 19, 2026. The same releases also fixed 16 other security issues, including six additional critical flaws affecting components such as PHP-FPM, session handling, timezone caching, and fatal-error backtraces. The article states that there was no indication of exploitation in the wild as of November 19, and none of the 17 flaws was listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ephpAfterShell can occur when a PHP session-file write is interrupted, leaving mixed old and new session data that PHP may later read as attacker-controlled objects. Exploitation can require a way to place controlled data into a session, an interruption at the right point during writing, and a suitable path to run code. Cloudflare updated an existing managed WAF rule to block known phpAfterShell patterns by default for all plans, while adding three paid-plan rules for PHP-FPM and SOAP flaws in logging mode. Cloudflare emphasizes that WAF coverage is only an additional layer of protection and that organizations should upgrade PHP, restart all workers, and apply temporary configuration mitigations if they cannot patch immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP disclosed and fixed phpAfterShell (CVE-2026-126714), a critical flaw in its default file-based session handling that can lead to remote code execution, in releases issued on November 19, 2026.","Cloudflare updated a PHP remote code execution managed WAF rule to cover known phpAfterShell attack patterns; the rule is enabled by default and blocks traffic for Free, Pro, Business, and Enterprise customers.","The same PHP releases fixed 16 additional security issues, including six other critical flaws affecting PHP-FPM, session handling, timezone caching, and fatal-error backtraces under specific conditions.","Cloudflare added three paid-plan managed WAF rules for a PHP-FPM issue and two PHP SOAP issues, but set their default action to Log so customers can assess whether matching requests are legitimate before blocking them.","Cloudflare states that WAF protections are not a replacement for patching, and organizations should upgrade PHP, restart every worker, and apply interim configuration mitigations if they cannot update immediately."],"insights":["Cloudflare’s existing PHP remote-code-execution rule detected part of the phpAfterShell technique before the flaw was publicly disclosed because phpAfterShell and the earlier php2shell issues both involve placing serialized data into session storage.","The final phpAfterShell trigger occurs when PHP later reads a corrupted session file, so a WAF can block malicious requests that place the payload but cannot block that internal read step itself.","The three new rules for PHP-FPM and SOAP flaws default to logging rather than blocking because their request patterns can also occur in legitimate traffic, requiring customers to review matches before enforcing blocks.","Several of the other critical PHP flaws require particular configurations, such as reused FastCGI connections, enabled upload-progress sessions, file-based error logging, or fatal-error backtraces, meaning exposure can differ substantially between deployments.","Linux distributions may backport PHP fixes without changing the visible PHP version number, so administrators need to compare their full package version with their distribution’s advisory rather than relying only on the PHP version label."],"referencedReports":[{"title":"phpAfterShell","url":"https://depthfirst.com/research/phpaftershell","publisher":"depthfirst","context":"The article cites depthfirst’s research disclosure for the phpAfterShell vulnerability and its reported path to code execution.","category":"research","primary":true},{"title":"GHSA-fm2m-fjf5-v3cp","url":"https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp","publisher":"php-project","context":"The article references PHP’s security advisory for the affected session handling behavior and exploit conditions.","category":"advisory","primary":true}],"body":"\u003cp\u003ePHP fixed phpAfterShell (CVE-2026-126714), a critical vulnerability in its default file-based session handler that can lead to remote code execution, in releases published on November 19, 2026. The same releases also fixed 16 other security issues, including six additional critical flaws affecting components such as PHP-FPM, session handling, timezone caching, and fatal-error backtraces. The article states that there was no indication of exploitation in the wild as of November 19, and none of the 17 flaws was listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ephpAfterShell can occur when a PHP session-file write is interrupted, leaving mixed old and new session data that PHP may later read as attacker-controlled objects. Exploitation can require a way to place controlled data into a session, an interruption at the right point during writing, and a suitable path to run code. Cloudflare updated an existing managed WAF rule to block known phpAfterShell patterns by default for all plans, while adding three paid-plan rules for PHP-FPM and SOAP flaws in logging mode. Cloudflare emphasizes that WAF coverage is only an additional layer of protection and that organizations should upgrade PHP, restart all workers, and apply temporary configuration mitigations if they cannot patch immediately.\u003c/p\u003e\n"},{"n":9,"title":"Vendor data breach exposes Chase, Visa, Mastercard customer info","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/vendor-data-breach-exposes-chase-visa-mastercard-customer-info/","time":"15:58","priority":"SHOULD READ","score":88,"tldr":"J.P. Morgan Chase, Visa, and Mastercard said a cyberattack on a third-party provider exposed limited customer marketing information, primarily names and email addresses, without affecting payment systems or card numbers. The n0n ransomware group claims the provider was Qubole and says it leaked data stolen through compromised credentials used to access customer AWS environments.","briefOverview":"\u003cp\u003eJ.P. Morgan Chase said a cyberattack targeting third-party service providers may have exposed vendor-held marketing data, including some customer names and email addresses. The bank said its services were not disrupted and that the incident was unrelated to service disruptions earlier that week. Visa and Mastercard also confirmed third-party incidents, while stating that their payment systems and card numbers were not affected.\u003c/p\u003e\n\n\u003cp\u003eMastercard said a limited number of email addresses belonging to cardholders in a specific benefit program were exposed, and it was working with the provider to support affected people. The n0n ransomware group claimed responsibility for an attack on Qubole, a cloud data analytics company owned by Idera, and alleged it used compromised Qubole credentials to enter customer AWS environments through preconfigured access roles. The group claimed it stole data from Qubole and leaked alleged Chase, Visa, and Mastercard data on its extortion site, while Qubole had not responded to BleepingComputer\u0026rsquo;s request for comment at publication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["J.P. Morgan Chase said a cyberattack targeting third-party service providers may have exposed customer names and email addresses contained in vendor-held marketing data.","Visa said the incident involved a third-party service provider in Asia Pacific and that its systems and payment data, including card numbers, were not affected.","Mastercard said a third-party provider exposed a limited number of email addresses belonging to a small subset of cardholders enrolled in a specific benefit program.","The n0n ransomware group claimed it compromised Qubole credentials between October 14 and 26, 2026, allowing access to customer AWS environments through previously configured IAM roles.","n0n claimed it leaked Chase, Visa, and Mastercard data on its extortion site on November 16, 2026."],"insights":["The reported exposure was concentrated in non-payment information, while Visa and Mastercard both stated that payment operations and card use were unaffected.","The alleged access path relied on customer AWS roles that had already been configured to let Qubole access their environments, illustrating how a provider compromise can extend into multiple customers’ cloud accounts.","Publicly confirmed impacts differ substantially from the ransomware group’s broader claims of possessing nearly one petabyte of customer-network data, and Qubole had not responded to those allegations at publication.","The incident did not disrupt J.P. Morgan Chase services and was reported as unrelated to service disruptions seen earlier that week."],"referencedReports":[],"body":"\u003cp\u003eJ.P. Morgan Chase said a cyberattack targeting third-party service providers may have exposed vendor-held marketing data, including some customer names and email addresses. The bank said its services were not disrupted and that the incident was unrelated to service disruptions earlier that week. Visa and Mastercard also confirmed third-party incidents, while stating that their payment systems and card numbers were not affected.\u003c/p\u003e\n\n\u003cp\u003eMastercard said a limited number of email addresses belonging to cardholders in a specific benefit program were exposed, and it was working with the provider to support affected people. The n0n ransomware group claimed responsibility for an attack on Qubole, a cloud data analytics company owned by Idera, and alleged it used compromised Qubole credentials to enter customer AWS environments through preconfigured access roles. The group claimed it stole data from Qubole and leaked alleged Chase, Visa, and Mastercard data on its extortion site, while Qubole had not responded to BleepingComputer\u0026rsquo;s request for comment at publication.\u003c/p\u003e\n"},{"n":21,"title":"WhatsApp Patches 3 Security Flaws, Including Android Bug Suspected of Use in Scams","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/whatsapp-patches-3-security-flaws.html","time":"17:57","priority":"SHOULD READ","score":88,"tldr":"WhatsApp patched three security flaws, including an Android issue suspected of helping scammers expose users’ IP addresses through crafted Click-to-WhatsApp ad-reply messages. Users should update WhatsApp promptly, as the other fixes address local file deletion, a timing side channel, and certificate-validation weaknesses.","briefOverview":"\u003cp\u003eWhatsApp patched three security vulnerabilities affecting its Android, iOS, Mac, and business applications. The company said one Android flaw, CVE-2026-23871, may have been abused alongside spam messages during a scam campaign. WhatsApp discovered the issue while disrupting that campaign, although it did not disclose its scope or whether the disruption succeeded.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-23871 involved incomplete checks of external ad-reply URLs and could expose a target’s IP information when a crafted Click to WhatsApp ad-reply message displayed media from an attacker-controlled URL. WhatsApp said a scammer may have used this to make scam messages appear more credible. The other fixes include CVE-2026-102769, which could delete locally stored WhatsApp files after a recipient tapped a specially crafted order-details message, and CVE-2026-44908, involving certificate verification for Meta AI confidential computing infrastructure. WhatsApp said there is no evidence the latter two flaws were exploited and advised users to keep their apps and devices updated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WhatsApp patched CVE-2026-23871, an Android and WhatsApp Business for Android flaw that could reveal a target’s IP information when a crafted Click-to-WhatsApp ad-reply message displayed attacker-controlled media.","WhatsApp said CVE-2026-23871 may have been abused with specific spam messages and was discovered while the company disrupted a scam campaign.","CVE-2026-102769 affected WhatsApp for Android before version 2.26.35.74 and could allow a specially crafted order-details message from an unofficial client to delete locally stored WhatsApp files after the recipient tapped it.","WhatsApp said CVE-2026-102769 could also leak one bit of information about a user’s chat database through the timing of a delivery receipt, but it found no evidence of exploitation in the wild.","CVE-2026-44908 affected certificate verification for Meta AI confidential computing infrastructure, and WhatsApp said its transparency ledger confirms that no exploitation occurred."],"insights":["The suspected Android abuse was not described as directly taking over accounts or devices; WhatsApp said scammers may have used it to obtain IP information and make scam messages appear more credible.","The file-deletion issue required the recipient to tap a specially crafted order-details message sent from an unofficial client, making user interaction a stated condition of the reported impact.","The timing-related leak from CVE-2026-102769 was limited to one bit of information and depended on the user being online when the malicious message was received.","For the Meta AI infrastructure flaw, WhatsApp said any fraudulent hardware certificate would have had to appear in a third-party public record, and that record showed all published certificates were properly linked to the hardware manufacturer’s trust system.","WhatsApp did not disclose the size of the scam activity associated with CVE-2026-23871 or whether its disruption efforts succeeded."],"referencedReports":[{"title":"WhatsApp Security Advisories 2026","url":"https://www.whatsapp.com/security/advisories/2026/","publisher":"whatsapp","context":"The article cites WhatsApp’s security advisories as the source for the three patched vulnerabilities and their affected versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eWhatsApp patched three security vulnerabilities affecting its Android, iOS, Mac, and business applications. The company said one Android flaw, CVE-2026-23871, may have been abused alongside spam messages during a scam campaign. WhatsApp discovered the issue while disrupting that campaign, although it did not disclose its scope or whether the disruption succeeded.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-23871 involved incomplete checks of external ad-reply URLs and could expose a target’s IP information when a crafted Click to WhatsApp ad-reply message displayed media from an attacker-controlled URL. WhatsApp said a scammer may have used this to make scam messages appear more credible. The other fixes include CVE-2026-102769, which could delete locally stored WhatsApp files after a recipient tapped a specially crafted order-details message, and CVE-2026-44908, involving certificate verification for Meta AI confidential computing infrastructure. WhatsApp said there is no evidence the latter two flaws were exploited and advised users to keep their apps and devices updated.\u003c/p\u003e\n"},{"n":25,"title":"Linux KVM Flaw CVE-2026-99312 Lets Guest VMs Access Host Memory on AMD Hosts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-linux-kvm-flaw-cve-2026-99312-lets.html","time":"12:20","priority":"SHOULD READ","score":88,"tldr":"CVE-2026-99312 is a critical AMD-specific Linux KVM nested-virtualization flaw that can let a root-controlled guest VM read, and potentially write, host memory. Cloud and KVM operators should install the fixed host kernel and reboot, or disable nested virtualization until patching is complete.","briefOverview":"\u003cp\u003eResearchers disclosed CVE-2026-99312, an AMD-specific flaw in Linux KVM that can allow a guest virtual machine with root access to access host memory when nested virtualization is enabled. In testing on a DigitalOcean Droplet, they read roughly 127 GB of host RAM, including the host kernel version banner. On a separate bare-metal AMD system, they wrote 32 selected bytes into a live host-kernel memory page. DigitalOcean patched its fleet with a live patch and said customers did not need to take action.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects AMD KVM hosts with nested virtualization enabled, while Intel-based KVM hosts are not affected. It stems from KVM leaving a memory-management pointer directed at freed memory after an INIT reset stops a nested virtual machine. If that page is reused, a guest can populate it with crafted translation entries that reference physical memory on the host. The fix resets this KVM memory-management state during every INIT.\u003c/p\u003e\n\n\u003cp\u003eFixed kernels are available upstream in stable kernel 7.3.5 and long-term kernels 6.18.64 and 6.12.118, but the article says several distribution kernels had not yet received fixes at publication. Updating virtual machines themselves does not address the problem because the affected code is in the host kernel, and hosts require a reboot after installing a fixed kernel. Until patching is complete, operators can disable nested virtualization, though doing so prevents virtual machines from running virtual machines of their own.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-99312 is an AMD-specific Linux KVM flaw involving nested virtualization that allowed researchers with root access in a guest VM to read approximately 127 GB of host memory on a DigitalOcean server.","On their own bare-metal AMD server, the researchers also wrote 32 selected bytes into a live host-kernel memory page, and a kernel module confirmed the modification.","The flaw occurs when an INIT reset for a nested VM leaves KVM using a pointer to freed memory, allowing a guest to forge memory-translation entries that can reference host physical memory.","Upstream fixes reset KVM’s memory-management state during every INIT and were released in stable kernel 7.3.5 and long-term kernels 6.18.64 and 6.12.118.","Operators should update and reboot vulnerable AMD KVM hosts, or disable nested virtualization with the kvm_amd nested=0 setting until they can install a fixed kernel."],"insights":["The vulnerable code was introduced by a 2022 security fix for CVE-2022-3344, illustrating that a patch for one nested-virtualization problem created another flaw that remained for nearly four years.","Updating a guest VM does not mitigate this issue because the vulnerable component runs in the host kernel; even after installing a fixed host kernel, the host must be rebooted for protection to take effect.","Nested virtualization is enabled by default in the kvm_amd module according to VirtFusion, so an unpatched AMD KVM host may be exposed unless an operator intentionally changed that setting.","There is no published exploit code, no reported exploitation outside research, and no available guidance for determining whether an attempted exploitation occurred.","Severity assessments differ substantially: the Linux kernel CVE team assigned an 8.8 score, Red Hat initially categorized it as Moderate at 5.6 with denial-of-service impact, and DigitalOcean treated it as critical in its shared-cloud environment."],"referencedReports":[{"title":"CVE-2026-99312 KVM Patch Disclosure","url":"https://www.digitalocean.com/blog/cve-2026-99312-kvm-patch","publisher":"digitalocean","context":"DigitalOcean’s disclosure post describes the researchers reading approximately 127 GB of host memory from a Droplet and confirms the provider patched its fleet.","category":"advisory","primary":true},{"title":"CVE-2026-99312 Security Assessment","url":"https://access.redhat.com/security/cve/cve-2026-99312","publisher":"red-hat","context":"The article cites Red Hat’s preliminary assessment, which rates the issue Moderate and characterizes its impact as denial of service.","category":"advisory","primary":false},{"title":"KVM Guest-to-Host Escape","url":"https://www.terra.security/blog/kvm-guest-to-host-escape","publisher":"terra-security","context":"Terra Security’s technical analysis explains the freed-memory pointer condition and how forged page-table entries enabled host-memory access.","category":"research","primary":true},{"title":"CVE-2026-99312 Linux Kernel CVE Announcement","url":"https://lists.openwall.net/linux-cve-announce/20
