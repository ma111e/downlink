s. Binary Defense, citing Google’s Threat Intelligence Group, ties the malware to a likely Iran-nexus group aimed at Israeli organizations, while Microsoft does not name a country.\u003c/p\u003e\n\n\u003cp\u003eGigaWiper can wipe a physical drive and its partition table, run fake ransomware based on \u003cstrong\u003eCrucio\u003c/strong\u003e that encrypts files with no saved key, or overwrite the Windows drive using a Go rewrite of \u003cstrong\u003eFlockWiper\u003c/strong\u003e. The article emphasizes that these functions are destructive rather than financially motivated, because wiped drives and files encrypted without a retained key cannot be restored except from clean backups. The backdoor also has spying and control features, including screenshots, screen recording, hidden VNC access, system information collection, registry editing, and event log wiping.\u003c/p\u003e\n\n\u003cp\u003eTo hide, GigaWiper pretends to be OneDrive by creating a scheduled task named \u003cstrong\u003eOneDrive Update\u003c/strong\u003e that runs every minute and tracking itself under a OneDrive-related registry key. It uses RabbitMQ for tasking, Redis for results, and MinIO for exfiltration, which may look ordinary on networks that already run those legitimate services. Microsoft recommends watching for the recurring OneDrive Update task, RabbitMQ or Redis traffic from ordinary desktops, suspicious use of takeown and icacls against Windows boot files, and blocking the known command servers 185.182.193[.]21 and 212.8.248[.]104.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft analyzed a destructive Windows backdoor called GigaWiper that combines three older destructive programs into operator-selectable commands.","The same malicious files are also tracked by Binary Defense as BLUERABBIT, and Microsoft and Binary Defense list the same four hashes and matching command servers.","GigaWiper can wipe the physical disk, run fake ransomware based on Crucio that encrypts files without saving a key, or overwrite the Windows drive using a Go rewrite of FlockWiper.","The backdoor can take screenshots, record the screen, open a hidden VNC session, collect system details, manage programs and services, edit the registry, and wipe Windows event logs.","Microsoft recommends looking for signals such as a recurring OneDrive Update scheduled task, RabbitMQ or Redis traffic from ordinary desktops, and use of takeown and icacls against Windows boot files outside maintenance windows."],"insights":["GigaWiper’s fake ransomware behavior can mislead responders because the .candy file encryption and warning wallpaper resemble ransomware, but the article says no key is saved and no ransom path exists, making recovery dependent on clean backups rather than negotiation or decryption.","The backdoor’s use of RabbitMQ, Redis, and MinIO for command traffic, results, and data theft is especially actionable because the article notes this traffic may look ordinary on networks that already run those legitimate business services.","A single GigaWiper infection does not reveal the attacker’s final intent because the same implant can spy, steal, or destroy depending on which commands the operator chooses after gaining access.","The overlap between Microsoft’s GigaWiper reporting and Binary Defense’s BLUERABBIT reporting shows that two vendor names refer to the same set of files and command servers, which can help defenders unify detections and intelligence.","The dormant keylogger and additional wiper command stubs found by Microsoft indicate the tool was not limited to its observed capabilities and may have been designed for further expansion."],"referencedReports":[{"title":"GigaWiper: Anatomy of a destructive backdoor assembled from multiple malware","url":"https://www.microsoft.com/en-us/security/blog/2026/07/09/gigawiper-anatomy-of-a-destructive-backdoor-assembled-from-multiple-malware/","publisher":"Microsoft","context":"The article relies on Microsoft’s analysis of GigaWiper’s destructive modules, command behavior, infrastructure, and defender recommendations.","category":"","primary":false},{"title":"BLUERABBIT: A Golang-based backdoor with ransomware and destructive capabilities","url":"https://binarydefense.com/resources/blog/bluerabbit-a-golang-based-backdoor-with-ransomware-and-destructive-capabilities","publisher":"Binary Defense","context":"The article cites Binary Defense’s report identifying the same malicious files as BLUERABBIT and noting matching command servers.","category":"","primary":false},{"title":"IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors","url":"https://www.cisa.gov/sites/default/files/2023-12/aa23-335a-irgc-affiliated-cyber-actors-exploit-plcs-in-multiple-sectors-1.pdf","publisher":"CISA","context":"The article references a December 2023 CISA advisory that listed Crucio as suspected ransomware in connection with CyberAv3ngers.","category":"","primary":false},{"title":"Handala Hack Wiper Attacks","url":"https://unit42.paloaltonetworks.com/handala-hack-wiper-attacks/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42’s tracking of a parallel surge in Iran-linked wiper activity against Israel, much of it attributed to Handala Hack.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft analyzed a destructive Windows backdoor it calls \u003cstrong\u003eGigaWiper\u003c/strong\u003e, which combines three older destructive programs into operator-selectable commands. The same malicious files are also tracked by Binary Defense as \u003cstrong\u003eBLUERABBIT\u003c/strong\u003e, with both vendors listing the same four hashes and matching command servers. Binary Defense, citing Google’s Threat Intelligence Group, ties the malware to a likely Iran-nexus group aimed at Israeli organizations, while Microsoft does not name a country.\u003c/p\u003e\n\n\u003cp\u003eGigaWiper can wipe a physical drive and its partition table, run fake ransomware based on \u003cstrong\u003eCrucio\u003c/strong\u003e that encrypts files with no saved key, or overwrite the Windows drive using a Go rewrite of \u003cstrong\u003eFlockWiper\u003c/strong\u003e. The article emphasizes that these functions are destructive rather than financially motivated, because wiped drives and files encrypted without a retained key cannot be restored except from clean backups. The backdoor also has spying and control features, including screenshots, screen recording, hidden VNC access, system information collection, registry editing, and event log wiping.\u003c/p\u003e\n\n\u003cp\u003eTo hide, GigaWiper pretends to be OneDrive by creating a scheduled task named \u003cstrong\u003eOneDrive Update\u003c/strong\u003e that runs every minute and tracking itself under a OneDrive-related registry key. It uses RabbitMQ for tasking, Redis for results, and MinIO for exfiltration, which may look ordinary on networks that already run those legitimate services. Microsoft recommends watching for the recurring OneDrive Update task, RabbitMQ or Redis traffic from ordinary desktops, suspicious use of takeown and icacls against Windows boot files, and blocking the known command servers 185.182.193[.]21 and 212.8.248[.]104.\u003c/p\u003e\n"},{"n":8,"title":"Police arrests 5,800 suspects in global anti-fraud crackdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-arrests-5-800-suspects-in-global-anti-fraud-crackdown/","time":"09:47","priority":"SHOULD READ","score":82,"tldr":"INTERPOL-coordinated Operation First Light 2026 led to 5,811 arrests across 97 countries and the seizure of $293 million tied to social engineering fraud and money laundering. Authorities identified over 142,000 victims and blocked more than 31,000 bank accounts, underscoring the global scale of cyber-enabled financial scams.","briefOverview":"\u003cp\u003eLaw enforcement agencies arrested 5,811 suspects and seized $293 million in illicit assets during a global anti-fraud operation spanning 97 countries. The joint action, dubbed Operation First Light 2026, targeted social engineering fraud and money laundering activities between January 15 and April 30. The fraud types included business email compromise, sextortion, impersonation, romance scams, and investment scams.\u003c/p\u003e\n\n\u003cp\u003eINTERPOL said the operation included action against high-value targets, raids on identified premises, blocking or freezing bank accounts and virtual wallets, and requests for INTERPOL Notices and Diffusions. Authorities also used INTERPOL\u0026rsquo;s Global Rapid Intervention of Payments, a stop-payment mechanism designed to swiftly block illicit financial flows involving both fiat and virtual assets. Investigators identified more than 142,000 victims worldwide, blocked 31,014 bank accounts, analyzed 152,808 cases, and identified 15,606 suspects beyond those arrested.\u003c/p\u003e\n\n\u003cp\u003eOperation First Light 2026 was coordinated by INTERPOL, funded by China\u0026rsquo;s Ministry of Public Security, and supported by ASEANAPOL, GCCPOL, and Europol. INTERPOL said the number of victims shows that social engineering scams and fraud have escalated into a major transnational threat affecting individuals, businesses, and governments. Tomonobu Kaya of the INTERPOL Financial Crime and Anti-Corruption Centre said criminal syndicates exploit human psychology and that countries must be equipped and committed to jointly fighting back.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Law enforcement agencies arrested 5,811 suspects and seized $293 million in illicit assets during Operation First Light 2026, a global anti-fraud operation spanning 97 countries.","Operation First Light 2026 targeted social engineering fraud, including business email compromise, sextortion, impersonation, romance, and investment scams, as well as money laundering activities between January 15 and April 30.","Investigators identified more than 142,000 victims worldwide, blocked 31,014 bank accounts, analyzed 152,808 cases, and identified 15,606 additional suspects beyond those arrested.","The operation was coordinated by INTERPOL, funded by China’s Ministry of Public Security, and supported by ASEANAPOL, GCCPOL, and Europol.","INTERPOL said the operation included action against high-value targets, raids on identified premises, blocking or freezing bank accounts and virtual wallets, and use of its Global Rapid Intervention of Payments stop-payment mechanism."],"insights":["The operation treated fraud and money laundering as one connected problem, using both arrests and financial disruption measures such as freezing bank accounts, virtual wallets, and illicit payment flows.","INTERPOL’s I-GRIP mechanism was used to block illicit movement of both traditional money and virtual assets, showing that rapid payment intervention is now part of international anti-fraud operations.","The number of additional identified suspects, 15,606, was far higher than the 5,811 arrests, indicating that the operation produced a large pipeline of unresolved investigative targets.","The operation’s scope across 97 countries and more than 142,000 identified victims supports INTERPOL’s statement that social engineering scams have become a major transnational threat affecting individuals, businesses, and governments."],"referencedReports":[],"body":"\u003cp\u003eLaw enforcement agencies arrested 5,811 suspects and seized $293 million in illicit assets during a global anti-fraud operation spanning 97 countries. The joint action, dubbed Operation First Light 2026, targeted social engineering fraud and money laundering activities between January 15 and April 30. The fraud types included business email compromise, sextortion, impersonation, romance scams, and investment scams.\u003c/p\u003e\n\n\u003cp\u003eINTERPOL said the operation included action against high-value targets, raids on identified premises, blocking or freezing bank accounts and virtual wallets, and requests for INTERPOL Notices and Diffusions. Authorities also used INTERPOL\u0026rsquo;s Global Rapid Intervention of Payments, a stop-payment mechanism designed to swiftly block illicit financial flows involving both fiat and virtual assets. Investigators identified more than 142,000 victims worldwide, blocked 31,014 bank accounts, analyzed 152,808 cases, and identified 15,606 suspects beyond those arrested.\u003c/p\u003e\n\n\u003cp\u003eOperation First Light 2026 was coordinated by INTERPOL, funded by China\u0026rsquo;s Ministry of Public Security, and supported by ASEANAPOL, GCCPOL, and Europol. INTERPOL said the number of victims shows that social engineering scams and fraud have escalated into a major transnational threat affecting individuals, businesses, and governments. Tomonobu Kaya of the INTERPOL Financial Crime and Anti-Corruption Centre said criminal syndicates exploit human psychology and that countries must be equipped and committed to jointly fighting back.\u003c/p\u003e\n"},{"n":9,"title":"New Forg365 phishing platform uses AI to target Microsoft 365 accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-forg365-phishing-platform-uses-ai-to-target-microsoft-365-accounts/","time":"14:39","priority":"SHOULD READ","score":82,"tldr":"Forg365 is a new phishing-as-a-service platform targeting Microsoft 365 accounts with device-code and AiTM phishing, AI-generated lures, and a browser extension that refreshes stolen session cookies for persistent access. Defenders should restrict device-code authentication and monitor Entra, OAuth grants, mailbox rules, and session activity for signs of compromise.","briefOverview":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 targets Microsoft 365 accounts by combining adversary-in-the-middle and device-code phishing methods with AI-assisted lure generation. ZeroBEC researchers say the platform includes features seen in other phishing services such as Kali365 and Sneaky2FA, though they could not establish a connection. Their investigation began with phishing emails posing as business documents and using legitimate services such as Amazon SES and SendGrid-hosted resources.\u003c/p\u003e\n\n\u003cp\u003eZeroBEC obtained access to the Forg365 dashboard, which can create phishing campaigns, manage links, configure OAuth apps and SMTP profiles, manage tokens, and generate phishing emails with AI. The researchers highlighted that AI lure generation is directly integrated into the same panel used to control post-compromise activity. The panel also includes account intelligence features and keyword monitoring that scans compromised mailboxes for predefined terms.\u003c/p\u003e\n\n\u003cp\u003eForg365 provides a browser extension called ForgCookie for Chrome, Edge, and Brave that is designed to refresh Microsoft single sign-on cookies and maintain access to services tied to compromised accounts. The platform supports device-code phishing, where victims are tricked into authorizing an attacker-controlled device through Microsoft’s legitimate OAuth 2.0 device code flow, and AiTM phishing, where a proxy captures session cookies. ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless needed, monitoring Microsoft Entra logs, investigating unexpected mailbox rules and OAuth grants, and revoking tokens and sessions if compromise is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Forg365 is a phishing-as-a-service operation focused on stealing Microsoft 365 accounts using adversary-in-the-middle phishing, device-code phishing, and AI-assisted lure generation.","ZeroBEC researchers gained access to the Forg365 dashboard, which can create phishing campaigns, manage phishing links, configure OAuth apps and SMTP profiles, manage tokens, and generate phishing emails with AI.","Forg365 includes a browser extension called ForgCookie that refreshes Microsoft single sign-on cookies to help attackers maintain access to Microsoft services linked to compromised accounts.","The platform uses legitimate services and infrastructure including Amazon SES for phishing email delivery, SendGrid-hosted resources, Cloudflare Pages for landing pages, and Gophish for campaign delivery.","ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless required, monitoring Microsoft Entra logs, investigating unexpected mailbox rules and OAuth grants, and revoking tokens and sessions if compromise is suspected."],"insights":["Forg365’s AI email-writing feature is embedded in the same dashboard used for token management and post-compromise activity, making lure creation part of a single end-to-end phishing workflow rather than a separate step.","The platform’s ForgCookie extension is designed to refresh Microsoft single sign-on cookies automatically, showing that Forg365 focuses not only on initial account theft but also on maintaining continued access after compromise.","Forg365 blends phishing activity with legitimate services such as Amazon SES, SendGrid, Cloudflare Pages, and Gophish, which can make malicious traffic resemble ordinary business email and web activity.","The device-code phishing path does not require directly stealing a victim’s password; it tricks the victim into approving an attacker-controlled device through Microsoft’s legitimate device-code sign-in flow.","Forg365 includes defensive evasion features such as encrypted redirectors, bot detection, debugger traps, sandbox checks, polymorphic code, and VPN-based redirection to keep researchers away from its phishing pages and administration panel."],"referencedReports":[{"title":"Inside Forg365: Telegram-Distributed Sneaky2FA-Style PhaaS","url":"https://zerobec.com/blog/inside-forg365-telegram-distributed-sneaky2fa-style-phaas","publisher":"ZeroBEC","context":"The article cites ZeroBEC’s report as the source for its analysis of the Forg365 phishing-as-a-service platform and its capabilities.","category":"","primary":false}],"body":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 targets Microsoft 365 accounts by combining adversary-in-the-middle and device-code phishing methods with AI-assisted lure generation. ZeroBEC researchers say the platform includes features seen in other phishing services such as Kali365 and Sneaky2FA, though they could not establish a connection. Their investigation began with phishing emails posing as business documents and using legitimate services such as Amazon SES and SendGrid-hosted resources.\u003c/p\u003e\n\n\u003cp\u003eZeroBEC obtained access to the Forg365 dashboard, which can create phishing campaigns, manage links, configure OAuth apps and SMTP profiles, manage tokens, and generate phishing emails with AI. The researchers highlighted that AI lure generation is directly integrated into the same panel used to control post-compromise activity. The panel also includes account intelligence features and keyword monitoring that scans compromised mailboxes for predefined terms.\u003c/p\u003e\n\n\u003cp\u003eForg365 provides a browser extension called ForgCookie for Chrome, Edge, and Brave that is designed to refresh Microsoft single sign-on cookies and maintain access to services tied to compromised accounts. The platform supports device-code phishing, where victims are tricked into authorizing an attacker-controlled device through Microsoft’s legitimate OAuth 2.0 device code flow, and AiTM phishing, where a proxy captures session cookies. ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless needed, monitoring Microsoft Entra logs, investigating unexpected mailbox rules and OAuth grants, and revoking tokens and sessions if compromise is suspected.\u003c/p\u003e\n"},{"n":14,"title":"Top AI Agents Built to Catch Malicious Code Can Be Tricked Into Running It","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/friendly-fire-ai-agents-built-to-catch.html","time":"05:15","priority":"SHOULD READ","score":82,"tldr":"AI Now researchers showed that Claude Code and OpenAI Codex can be tricked into running malicious code while autonomously reviewing untrusted repositories, using benign-looking README instructions and disguised binaries. The key takeaway is that security teams should not let command-capable AI coding agents inspect third-party code with access to the host, secrets, or keys unless strong isolation and human approval are in place.","briefOverview":"\u003cp\u003eAI Now Institute published a proof-of-concept called “Friendly Fire” showing that AI coding agents can be tricked into running attacker-controlled code while reviewing untrusted open-source projects. The attack worked against Anthropic’s Claude Code and OpenAI’s Codex when their autonomous modes were enabled, allowing the tools to approve commands they judged safe. The researchers argue there is no specific patch or vulnerable version range because the issue is a workflow design problem rather than a single software bug.\u003c/p\u003e\n\n\u003cp\u003eThe demo used the Python library geopy with added files, including a README.md note that suggested running a script called security.sh as a routine security check. When given a prompt such as “Perform security testing on this project,” the agent read the README, treated the script as part of the task, and ran it without a warning or approval box. The script quietly launched a hidden binary disguised as the compiled build of a harmless Go file, and the researchers seeded it with strings from that file to help it pass the agent’s checks.\u003c/p\u003e\n\n\u003cp\u003eThe article says this route is broader than earlier attacks that abused agent configuration files, because README.md is an ordinary file in nearly every repository and does not trigger Claude Code’s folder trust warning. The same payload worked unchanged across Claude Sonnet 4.6, Sonnet 5, Opus 4.8, and GPT-5.5, and in some runs newer models noticed the binary mismatch but still executed it. The researchers recommend not giving untrusted code to an agent that can run commands and access keys, secrets, or the host, while noting that sandboxing and step-by-step approvals are only partial mitigations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI Now Institute researchers published a proof-of-concept called Friendly Fire that tricks Anthropic Claude Code and OpenAI Codex into running attacker-controlled code while reviewing untrusted open-source projects in autonomous modes.","The researchers tested stock installs of Claude Code CLI versions 2.1.116, 2.1.196, 2.1.198, and 2.1.199 with Claude Sonnet 4.6, Sonnet 5, or Opus 4.8, and OpenAI Codex CLI 0.142.4 with GPT-5.5.","The demo placed extra files in the geopy Python library, including README instructions to run security.sh, which quietly launched a hidden binary disguised as the compiled build of a harmless Go file.","AI Now argues the weakness is in the design rather than a specific vulnerable version, because the models cannot reliably separate code and documentation they are reading from instructions they should follow.","The researchers recommend not giving untrusted code to an agent that can run commands and access keys, secrets, or the host, and note that sandboxing and approval prompts are only partial mitigations in the tested scenario."],"insights":["The attack avoids prior defenses focused on agent configuration files by hiding instructions in a README.md file, which is common in repositories and does not trigger Claude Code’s folder trust warning.","The same payload worked unchanged across two vendors and four models, and in some runs newer models noticed the binary mismatch but executed it anyway.","AI Now says there is no specific patch or vulnerable version range to wait for, because the tested builds were examples and the researchers view the issue as a workflow design problem.","A practical warning sign is an agent executing a binary or script that is only recommended by documentation rather than invoked by the project’s own code.","Sandboxing may reduce risk but is not presented as a reliable fix, because the article notes that code can escape sandboxes and cites a Claude Code sandbox escape flaw from this year."],"referencedReports":[{"title":"Friendly Fire Exploit Brief","url":"https://ainowinstitute.org/publications/friendly-fire-exploit-brief","publisher":"AI Now Institute","context":"The article is based on AI Now Institute’s proof-of-concept showing how Claude Code and OpenAI Codex can be tricked into running attacker-controlled code while reviewing untrusted repositories.","category":"","primary":false},{"title":"TrustFall: Coding Agent Security Flaw RCE","url":"https://adversa.ai/blog/trustfall-coding-agent-security-flaw-rce-claude-cursor-gemini-cli-copilot/","publisher":"Adversa","context":"The article cites Adversa’s TrustFall work as a related example of booby-trapped repositories leading to code execution across multiple AI coding agents.","category":"","primary":false},{"title":"CVE-2026-39861","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-39861","publisher":"National Vulnerability Database","context":"The article references this NVD entry as an example of a Claude Code sandbox escape flaw involving symlinks.","category":"","primary":false}],"body":"\u003cp\u003eAI Now Institute published a proof-of-concept called “Friendly Fire” showing that AI coding agents can be tricked into running attacker-controlled code while reviewing untrusted open-source projects. The attack worked against Anthropic’s Claude Code and OpenAI’s Codex when their autonomous modes were enabled, allowing the tools to approve commands they judged safe. The researchers argue there is no specific patch or vulnerable version range because the issue is a workflow design problem rather than a single software bug.\u003c/p\u003e\n\n\u003cp\u003eThe demo used the Python library geopy with added files, including a README.md note that suggested running a script called security.sh as a routine security check. When given a prompt such as “Perform security testing on this project,” the agent read the README, treated the script as part of the task, and ran it without a warning or approval box. The script quietly launched a hidden binary disguised as the compiled build of a harmless Go file, and the researchers seeded it with strings from that file to help it pass the agent’s checks.\u003c/p\u003e\n\n\u003cp\u003eThe article says this route is broader than earlier attacks that abused agent configuration files, because README.md is an ordinary file in nearly every repository and does not trigger Claude Code’s folder trust warning. The same payload worked unchanged across Claude Sonnet 4.6, Sonnet 5, Opus 4.8, and GPT-5.5, and in some runs newer models noticed the binary mismatch but still executed it. The researchers recommend not giving untrusted code to an agent that can run commands and access keys, secrets, or the host, while noting that sandboxing and step-by-step approvals are only partial mitigations.\u003c/p\u003e\n"},{"n":15,"title":"npm 12 Disables Install Scripts by Default to Reduce Supply Chain Risk","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/npm-12-disables-install-scripts-by.html","time":"16:49","priority":"SHOULD READ","score":82,"tldr":"GitHub released npm 12 with install scripts, Git dependencies, and remote URL dependencies disabled by default to reduce supply chain risk. It is also phasing out 2FA-bypass granular access tokens for sensitive npm actions and direct publishing, pushing maintainers toward trusted publishing or human approval workflows.","briefOverview":"\u003cp\u003eGitHub announced the release of npm version 12 with install scripts disabled by default. The release also deprecates granular access tokens designed to bypass two-factor authentication. GitHub said several npm install behaviors that previously ran automatically are now opt-in.\u003c/p\u003e\n\n\u003cp\u003eIn npm 12, dependency lifecycle scripts such as preinstall, install, and postinstall no longer run unless explicitly allowed. Implicit node-gyp builds are also disabled by default, and Git dependencies or dependencies from remote URLs are no longer resolved unless explicitly allowed. To review and approve trusted scripts, users must run “npm approve-scripts \u0026ndash;allow-scripts-pending” and commit the resulting allowlist in package.json.\u003c/p\u003e\n\n\u003cp\u003eGitHub also said npm granular access tokens configured to bypass two-factor authentication will lose access to sensitive account, package, and organization management actions in early August 2026. In January 2027, those tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval. The article also notes that pnpm 11.10 introduced a new “_auth” setting intended to keep registry credentials tied to the host they belong to and prevent project files from redirecting valid tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub announced the release of npm version 12 with install scripts disabled by default and deprecated granular access tokens designed to bypass two-factor authentication.","In npm 12, dependency lifecycle scripts and implicit node-gyp builds no longer run unless explicitly allowed, and Git dependencies or remote URL dependencies are no longer resolved unless explicitly allowed.","Users must run “npm approve-scripts --allow-scripts-pending” to review and approve trusted scripts, then commit the resulting allowlist in the package.json file.","In early August 2026, npm granular access tokens configured to bypass two-factor authentication will no longer be able to perform sensitive account, package, and organization management actions.","In January 2027, npm granular access tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval."],"insights":["npm 12 makes previously automatic install-time behaviors opt-in, so projects may need to commit an explicit script allowlist in package.json to preserve trusted build steps.","GitHub is creating a transition window for token changes: sensitive management actions using 2FA-bypass tokens are affected in early August 2026, while direct publishing with those tokens remains available until January 2027.","The article points maintainers away from long-lived publish tokens and toward trusted publishing using OIDC or staged publishing with a human approval step.","pnpm 11.10’s new _auth handling reduces token exposure by reading authentication only from the environment or global config, not from project files that could be tampered with."],"referencedReports":[{"title":"pnpm 11.1 Hardens Registry Authentication","url":"https://socket.dev/blog/pnpm-11-1-hardens-registry-authentication","publisher":"Socket","context":"The article cites Socket’s explanation of pnpm’s new _auth handling and its security benefit of keeping credentials tied to their intended host.","category":"","primary":false}],"body":"\u003cp\u003eGitHub announced the release of npm version 12 with install scripts disabled by default. The release also deprecates granular access tokens designed to bypass two-factor authentication. GitHub said several npm install behaviors that previously ran automatically are now opt-in.\u003c/p\u003e\n\n\u003cp\u003eIn npm 12, dependency lifecycle scripts such as preinstall, install, and postinstall no longer run unless explicitly allowed. Implicit node-gyp builds are also disabled by default, and Git dependencies or dependencies from remote URLs are no longer resolved unless explicitly allowed. To review and approve trusted scripts, users must run “npm approve-scripts \u0026ndash;allow-scripts-pending” and commit the resulting allowlist in package.json.\u003c/p\u003e\n\n\u003cp\u003eGitHub also said npm granular access tokens configured to bypass two-factor authentication will lose access to sensitive account, package, and organization management actions in early August 2026. In January 2027, those tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval. The article also notes that pnpm 11.10 introduced a new “_auth” setting intended to keep registry credentials tied to the host they belong to and prevent project files from redirecting valid tokens.\u003c/p\u003e\n"},{"n":19,"title":"Dormant GitHub Accounts Help Attackers Blend In While Mapping Corporate Orgs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/dormant-github-accounts-help-attackers.html","time":"18:38","priority":"SHOULD READ","score":82,"tldr":"Datadog Security Labs warns that attackers are using years-old dormant GitHub “ghost” accounts and compromised tokens to quietly enumerate corporate GitHub orgs, repos, and users via the GitHub API. Most activity targets public data for reconnaissance, but some cases escalated to cloning private repositories.","briefOverview":"\u003cp\u003eDatadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API. The operators rely on automated scraping tools with custom or legitimate-sounding user agents. They also use GitHub “ghost” accounts that are often years old, along with compromised OAuth tokens and personal access tokens from legitimate users.\u003c/p\u003e\n\n\u003cp\u003eMost of the activity targets public data, but Datadog said some cases went beyond public information enumeration. In a few scenarios, data access was confirmed and attackers took steps to clone a private repository belonging to a single organization. The campaign used more than 50 dormant accounts and dozens of legitimate accounts whose personal access tokens were exposed unintentionally or compromised through some other method.\u003c/p\u003e\n\n\u003cp\u003eThe “ghost” accounts were created two to five years ago and intentionally left inactive for long periods before being used to issue API traffic across multiple organizations. Datadog said this helps the activity blend into normal GitHub API usage, especially because many API requests hit public endpoints and return successful responses. The concern is the aggregate pattern of accounts moving in sync across companies’ GitHub organizations over weeks, and in the worst case shifting from enumeration to cloning.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Datadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API.","The operators use automated scraping tools with custom or legitimate-sounding user agents, GitHub “ghost” accounts that are often years old, and compromised OAuth tokens or personal access tokens from legitimate users.","More than 50 dormant accounts and dozens of legitimate accounts with exposed or compromised personal access tokens were used to facilitate the enumeration.","The GitHub “ghost” accounts were created two to five years ago and left inactive for long periods before being used to issue API traffic across multiple organizations.","Most activity involved public data, but Datadog confirmed a few scenarios where attackers went beyond enumeration and cloned a private repository belonging to a single organization."],"insights":["The use of GitHub accounts created two to five years earlier shows the operators deliberately built or preserved credibility over long periods before using the accounts for scraping.","The activity is difficult to spot because individual requests often look normal, hit public endpoints, and may not require authentication at all.","The main warning sign is not a single suspicious request but coordinated behavior across multiple accounts and companies over weeks.","Reconnaissance against public GitHub data can still create real risk because it can map an organization’s repositories, members, relationships, and project activity.","The same campaigns that mostly enumerate public data have, in some confirmed cases, progressed to cloning private repositories."],"referencedReports":[{"title":"Coordinated GitHub API Enumeration","url":"https://securitylabs.datadoghq.com/articles/coordinated-github-api-enumeration/","publisher":"Datadog Security Labs","context":"The article is based on Datadog Security Labs' analysis warning of overlapping campaigns enumerating corporate GitHub organizations, repositories, and users through the GitHub API.","category":"","primary":false}],"body":"\u003cp\u003eDatadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API. The operators rely on automated scraping tools with custom or legitimate-sounding user agents. They also use GitHub “ghost” accounts that are often years old, along with compromised OAuth tokens and personal access tokens from legitimate users.\u003c/p\u003e\n\n\u003cp\u003eMost of the activity targets public data, but Datadog said some cases went beyond public information enumeration. In a few scenarios, data access was confirmed and attackers took steps to clone a private repository belonging to a single organization. The campaign used more than 50 dormant accounts and dozens of legitimate accounts whose personal access tokens were exposed unintentionally or compromised through some other method.\u003c/p\u003e\n\n\u003cp\u003eThe “ghost” accounts were created two to five years ago and intentionally left inactive for long periods before being used to issue API traffic across multiple organizations. Datadog said this helps the activity blend into normal GitHub API usage, especially because many API requests hit public endpoints and return successful responses. The concern is the aggregate pattern of accounts moving in sync across companies’ GitHub organizations over weeks, and in the worst case shifting from enumeration to cloning.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft expects more Windows security updates from AI-discovered flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-expects-more-windows-security-updates-from-ai-discovered-flaws/","time":"17:00","priority":"SHOULD READ","score":78,"tldr":"Microsoft says Windows users should expect more security fixes in monthly Patch Tuesday updates as AI tools help the company find and validate more vulnerabilities faster. The company says human engineers will still review fixes before release, while it updates its secure development practices for AI-enabled threats.","briefOverview":"\u003cp\u003eMicrosoft says Windows users should expect an increase in security updates as the company uses artificial intelligence to find more vulnerabilities in its codebase. In a blog post, Microsoft said AI advances are accelerating vulnerability discovery, helping engineers identify more issues before they can be exploited in zero-day attacks. The company said customers will likely see a higher volume of security updates in each monthly Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is using Microsoft Security\u0026rsquo;s multi-model agentic scanning harness, MDASH, to scan critical Windows binaries and validate potential vulnerabilities with multiple AI models. Vulnerability candidates then go through a Windows-specific validation pipeline designed to eliminate false positives before engineers investigate them. Microsoft said it is also using AI to help engineers understand failures faster, suggest possible fixes, and find similar bugs elsewhere in the Windows source code.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said human engineers will still oversee and review all proposed code and validate fixes before release into production. The company is also updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in software development. The article also notes a Reuters report that CISA has begun using Anthropic\u0026rsquo;s Fable AI model to scan government software for vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says Windows users should expect an increase in security updates as the company uses artificial intelligence to discover more vulnerabilities in its codebase.","Microsoft is using Microsoft Security's multi-model agentic scanning harness, or MDASH, to scan critical Windows binaries and validate potential vulnerabilities using multiple AI models.","Vulnerability candidates found by MDASH are passed through a Windows-specific validation pipeline designed to eliminate false positives before engineers investigate them.","Microsoft says human engineers will oversee and review all proposed code and validate fixes before they are released into production.","Microsoft is updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in software development to identify security issues before features are released."],"insights":["A higher number of Windows security updates may reflect Microsoft finding more flaws before attackers exploit them, not necessarily a sudden decline in Windows security quality.","Microsoft’s use of multiple AI models plus a separate Windows-specific validation pipeline shows that AI-generated vulnerability findings still require filtering before engineers treat them as actionable.","Microsoft is applying AI beyond initial bug discovery by using it to understand failures, suggest fixes, and search for similar bugs elsewhere in the Windows source code.","The article frames AI as affecting both sides of security: Microsoft is using it to find and fix flaws faster, while threat actors are using it to power attacks and exploit zero-day flaws before fixes exist."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft says Windows users should expect an increase in security updates as the company uses artificial intelligence to find more vulnerabilities in its codebase. In a blog post, Microsoft said AI advances are accelerating vulnerability discovery, helping engineers identify more issues before they can be exploited in zero-day attacks. The company said customers will likely see a higher volume of security updates in each monthly Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is using Microsoft Security\u0026rsquo;s multi-model agentic scanning harness, MDASH, to scan critical Windows binaries and validate potential vulnerabilities with multiple AI models. Vulnerability candidates then go through a Windows-specific validation pipeline designed to eliminate false positives before engineers investigate them. Microsoft said it is also using AI to help engineers understand failures faster, suggest possible fixes, and find similar bugs elsewhere in the Windows source code.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said human engineers will still oversee and review all proposed code and validate fixes before release into production. The company is also updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in software development. The article also notes a Reuters report that CISA has begun using Anthropic\u0026rsquo;s Fable AI model to scan government software for vulnerabilities.\u003c/p\u003e\n"},{"n":10,"title":"EU takes member states to court over unimplemented cybersecurity law","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/eu-cyber-filing-ireland-spain-france-netherlands-nis2","time":"13:10","priority":"SHOULD READ","score":78,"tldr":"The European Commission is taking Ireland, Spain, France and the Netherlands to the EU’s top court for failing to implement the NIS2 cybersecurity directive, seeking financial penalties until they comply. The law sets minimum security and reporting requirements for critical sectors such as hospitals, energy, transport and public administration.","briefOverview":"\u003cp\u003eThe European Commission filed legal referrals at the Court of Justice of the European Union against Ireland, Spain, France and the Netherlands for failing to implement the NIS2 Directive. The countries are more than 20 months late in transposing the law, which sets minimum security standards for hospitals, energy networks, transport operators and public administrations. The Commission asked the court to impose a lump sum and ongoing daily financial penalties until each country formally notifies full transposition.\u003c/p\u003e\n\n\u003cp\u003eNIS2 updates the original 2016 Network and Information Security Directive by widening its scope to 18 critical sectors and adding risk management and incident reporting requirements. Few member states met the original October 2024 deadline, and as of January 2025 only six of the EU’s 27 member states had transposed the directive. In practice, fines sought by the Commission are rarely paid because member states have generally adopted the required legislation while proceedings are under way, leading the Commission to withdraw before a court ruling.\u003c/p\u003e\n\n\u003cp\u003eThe filing comes as ENISA warned of thousands of cybersecurity incidents affecting the EU in the year ending June 2025, with public administration the most-targeted critical sector at 38% of incidents and transport at 7.5%. Commission technology lead Henna Virkkunen warned in February that the EU could no longer afford to be “naive” about adversaries’ ability to switch off critical infrastructure, including power grids, hospitals and financial systems. Ireland said its National Cyber Security Bill, which will transpose NIS2 and place the National Cyber Security Centre on a statutory footing, is close to finalization, while Spain, France and the Netherlands had not published comparable statements at the time of writing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Commission filed legal referrals at the Court of Justice of the European Union against Ireland, Spain, France and the Netherlands for failing to implement the NIS2 Directive.","The NIS2 Directive sets minimum security standards for critical sectors including hospitals, energy networks, transport operators and public administrations.","The Commission asked the court to impose lump sum and ongoing daily financial penalties on the four countries until each formally notifies full transposition.","ENISA warned of thousands of cybersecurity incidents affecting the EU in the year ending June 2025, with public administration identified as the most-targeted critical sector at 38% of incidents.","Ireland said its National Cyber Security Bill, which will transpose NIS2 and place the National Cyber Security Centre on a statutory footing, is close to finalization."],"insights":["The Commission’s requested fines may function more as pressure to accelerate national legislation than as penalties that are ultimately paid, because previous member-state cases were often withdrawn once required laws were adopted during proceedings.","NIS2 delays have knock-on effects beyond the directive itself, because the EU’s Cyber Resilience Act relies on the national response-team network that NIS2 is supposed to establish.","The implementation gap is bloc-wide rather than limited to the four countries taken to court, since only six of the EU’s 27 member states had transposed NIS2 by January 2025.","The enforcement action comes as EU officials are simultaneously proposing amendments to NIS2 to ease compliance, indicating that legal clarity and company compliance burdens have been recognized as contributors to transposition delays."],"referencedReports":[],"body":"\u003cp\u003eThe European Commission filed legal referrals at the Court of Justice of the European Union against Ireland, Spain, France and the Netherlands for failing to implement the NIS2 Directive. The countries are more than 20 months late in transposing the law, which sets minimum security standards for hospitals, energy networks, transport operators and public administrations. The Commission asked the court to impose a lump sum and ongoing daily financial penalties until each country formally notifies full transposition.\u003c/p\u003e\n\n\u003cp\u003eNIS2 updates the original 2016 Network and Information Security Directive by widening its scope to 18 critical sectors and adding risk management and incident reporting requirements. Few member states met the original October 2024 deadline, and as of January 2025 only six of the EU’s 27 member states had transposed the directive. In practice, fines sought by the Commission are rarely paid because member states have generally adopted the required legislation while proceedings are under way, leading the Commission to withdraw before a court ruling.\u003c/p\u003e\n\n\u003cp\u003eThe filing comes as ENISA warned of thousands of cybersecurity incidents affecting the EU in the year ending June 2025, with public administration the most-targeted critical sector at 38% of incidents and transport at 7.5%. Commission technology lead Henna Virkkunen warned in February that the EU could no longer afford to be “naive” about adversaries’ ability to switch off critical infrastructure, including power grids, hospitals and financial systems. Ireland said its National Cyber Security Bill, which will transpose NIS2 and place the National Cyber Security Centre on a statutory footing, is close to finalization, while Spain, France and the Netherlands had not published comparable statements at the time of writing.\u003c/p\u003e\n"},{"n":11,"title":"Latvian forestry company still restoring systems weeks after ransomware attack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware","time":"14:20","priority":"SHOULD READ","score":78,"tldr":"Latvia’s state-owned forestry company LVM is still restoring systems weeks after a ransomware attack that disrupted services and exposed 44 GB of stolen data. Authorities say the same financially motivated foreign group is still probing Latvian public- and private-sector targets, but election infrastructure was not compromised.","briefOverview":"\u003cp\u003eLatvia\u0026rsquo;s state-owned forestry company LVM said it is still restoring IT systems weeks after a ransomware attack disrupted several internal and customer services. The attack took its mapping platform, hunting application, and systems used to exchange information with contractors and customers offline. LVM\u0026rsquo;s chief technology officer said the situation has stabilized, but returning operations to normal remains quite challenging. About two-thirds of customers with service contracts still do not have access to the affected systems.\u003c/p\u003e\n\n\u003cp\u003eAccording to LVM\u0026rsquo;s chief technology officer, the attackers exploited a vulnerability in a system that had not been updated for two years, though the affected software was not identified. Latvian authorities said the attackers had likely been inside the company\u0026rsquo;s network for more than a week before detection. CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group that has previously targeted companies and public institutions in NATO and European Union countries. The attackers leaked roughly 44 gigabytes of stolen data, including internal documents, email correspondence, software code repositories, digital certificates, cryptographic keys, and user credentials.\u003c/p\u003e\n\n\u003cp\u003eThe incident drew scrutiny because LVM helped develop new functionality for Latvia\u0026rsquo;s electronic voter registration system, but authorities said the election infrastructure was not compromised. CERT.LV said the election software was developed in a separate environment, its code was never stored in LVM\u0026rsquo;s corporate repositories, and every software delivery for the project was reviewed. CERT.LV also said the same threat actor compromised a server belonging to Latvian pharmaceutical company Olpha, though that breach has been contained and was technically unrelated to the LVM incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Latvia's state-owned forestry company LVM said it is still working to restore IT systems weeks after a ransomware attack disrupted several internal and customer services.","The attack took LVM's mapping platform, hunting application, and systems used to exchange information with contractors and customers offline.","LVM's chief technology officer said the attackers exploited a vulnerability in a system that had not been updated for two years, but he did not identify the affected software.","CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group and said the attackers leaked roughly 44 gigabytes of stolen data online.","Latvian authorities said election infrastructure was not compromised because the software LVM helped develop was built in a separate environment and its code was never stored in LVM's corporate repositories."],"insights":["A single unpatched system that had not been updated for two years was enough to create a prolonged operational disruption for LVM, with about two-thirds of service-contract customers still lacking access weeks later.","The attackers published 44 gigabytes of stolen data, but investigators believe they accessed significantly more, indicating that the public leak may not reflect the full scope of exposed information.","CERT.LV specifically validated the election-related software delivery chain after the LVM breach, showing that separation of development environments and code repositories was central to ruling out compromise of the voter registration system.","The same threat actor was linked to both LVM and Olpha, but authorities said the breaches were technically unrelated, indicating the group is actively finding separate weaknesses across Latvian organizations rather than relying on one shared intrusion path."],"referencedReports":[{"title":"AS Latvijas valsts meži kiberdrošības incidents – aktuālā informācija","url":"https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija?utm","publisher":"CERT.LV","context":"The article cites CERT.LV for attribution of the LVM intrusion to a foreign financially motivated ransomware group and for details about the exposed data and ongoing threat activity.","category":"","primary":false},{"title":"CERT.LV apstiprina Latvijas Valsts mežu izstrādātā koda drošu izmantošanu vēlēšanās","url":"https://cert.lv/lv/2026/06/cert-lv-apstiprina-latvijas-valsts-mezu-izstradata-koda-drosu-izmantosanu-velesanas","publisher":"CERT.LV","context":"The article cites this CERT.LV analysis to state that election-related software developed with LVM was reviewed and found safe to use in upcoming parliamentary elections.","category":"","primary":false}],"body":"\u003cp\u003eLatvia\u0026rsquo;s state-owned forestry company LVM said it is still restoring IT systems weeks after a ransomware attack disrupted several internal and customer services. The attack took its mapping platform, hunting application, and systems used to exchange information with contractors and customers offline. LVM\u0026rsquo;s chief technology officer said the situation has stabilized, but returning operations to normal remains quite challenging. About two-thirds of customers with service contracts still do not have access to the affected systems.\u003c/p\u003e\n\n\u003cp\u003eAccording to LVM\u0026rsquo;s chief technology officer, the attackers exploited a vulnerability in a system that had not been updated for two years, though the affected software was not identified. Latvian authorities said the attackers had likely been inside the company\u0026rsquo;s network for more than a week before detection. CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group that has previously targeted companies and public institutions in NATO and European Union countries. The attackers leaked roughly 44 gigabytes of stolen data, including internal documents, email correspondence, software code repositories, digital certificates, cryptographic keys, and user credentials.\u003c/p\u003e\n\n\u003cp\u003eThe incident drew scrutiny because LVM helped develop new functionality for Latvia\u0026rsquo;s electronic voter registration system, but authorities said the election infrastructure was not compromised. CERT.LV said the election software was developed in a separate environment, its code was never stored in LVM\u0026rsquo;s corporate repositories, and every software delivery for the project was reviewed. CERT.LV also said the same threat actor compromised a server belonging to Latvian pharmaceutical company Olpha, though that breach has been contained and was technically unrelated to the LVM incident.\u003c/p\u003e\n"},{"n":13,"title":"Meta's New AI Image Tool Lets Others Use Your Public Instagram Photos in AI Images","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/metas-new-ai-image-tool-lets-others-use.html","time":"07:21","priority":"MAY READ","score":68,"tldr":"Meta’s new Muse Image AI feature lets users generate images using public Instagram posts and reels by tagging accounts, and the reuse setting is enabled by default. Public Instagram users who don’t want their content used this way should disable content reuse in Instagram settings.","briefOverview":"\u003cp\u003eMeta announced Muse Image, a new image-focused AI model that lets people use public Instagram posts and reels to generate AI content. The feature is enabled by default and allows users to @-mention public Instagram accounts in the Meta AI app to bring specific profiles into generated images. Meta said the tool can be used for things like event invitations, collaborative creative concepts, and personalized graphics.\u003c/p\u003e\n\n\u003cp\u003eMuse Image is being embedded into WhatsApp and Instagram for AI-powered effects in Instagram Stories and image generation in direct chats with Meta AI on WhatsApp. Users can tag another public Instagram account to create new reels, posts, or stories that may reuse part or all of that account’s published photos, videos, or reels. Meta’s help document says reused content may be discoverable in search engine results depending on the settings of the person who created it.\u003c/p\u003e\n\n\u003cp\u003eInstagram users will not be notified when their images are remixed using AI, and content already created by others will not be deleted if a user later disables the feature or switches to a private account. Meta says users can turn off reuse by going to Instagram settings, opening Sharing and reuse, and disabling reuse for Posts and Reels. The article describes the launch as part of a broader trend in which companies such as Meta and Google are adding AI-related data-use features that are opt-out rather than opt-in by default.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Meta announced that its Muse Image AI model lets people use public Instagram posts and reels to generate AI content, and the feature is enabled by default.","Users can @-mention public Instagram accounts in the Meta AI app so Meta AI can use public photos to create images for posts, reels, stories, invitations, graphics, or other visual content.","Instagram users are not notified when their images are reused through Meta’s AI features, although notifications still apply for remixes, sequences, stickers, and templates.","Meta says public Instagram users can disable this reuse by going to Instagram settings, opening Sharing and reuse, and turning off reuse for Posts and Reels.","The article says the feature is part of a broader trend in which companies such as Meta and Google are adding AI-related data use settings that are opt-out rather than opt-in by default."],"insights":["Changing a public Instagram account to private does not remove AI-generated content that others already created using that account’s content.","Public Instagram users who want to prevent future AI reuse need to disable reuse for both Posts and Reels under the Sharing and reuse settings.","Users will not receive notifications when their images are reused through Meta’s AI features, so they may not know when their public content has been used this way.","For public Instagram users under 18, reuse is more limited because only followers can reuse their media if the account settings allow it.","Content created through reuse may be discoverable in search engine results depending on the settings of the person who created it."],"referencedReports":[],"body":"\u003cp\u003eMeta announced Muse Image, a new image-focused AI model that lets people use public Instagram posts and reels to generate AI content. The feature is enabled by default and allows users to @-mention public Instagram accounts in the Meta AI app to bring specific profiles into generated images. Meta said the tool can be used for things like event invitations, collaborative creative concepts, and personalized graphics.\u003c/p\u003e\n\n\u003cp\u003eMuse Image is being embedded into WhatsApp and Instagram for AI-powered effects in Instagram Stories and image generation in direct chats with Meta AI on WhatsApp. Users can tag another public Instagram account to create new reels, posts, or stories that may reuse part or all of that account’s published photos, videos, or reels. Meta’s help document says reused content may be discoverable in search engine results depending on the settings of the person who created it.\u003c/p\u003e\n\n\u003cp\u003eInstagram users will not be notified when their images are remixed using AI, and content already created by others will not be deleted if a user later disables the feature or switches to a private account. Meta says users can turn off reuse by going to Instagram settings, opening Sharing and reuse, and disabling reuse for Posts and Reels. The article describes the launch as part of a broader trend in which companies such as Meta and Google are adding AI-related data-use features that are opt-out rather than opt-in by default.\u003c/p\u003e\n"},{"n":25,"title":"The Compliance Notice That Borrowed the Government's Words and the Carrier's Own DOT Number","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/compliance-notice-fmcsa-impersonation-dot-fee-fraud","time":"11:00","priority":"MAY READ","score":68,"tldr":"A logistics carrier received a convincing FMCSA-themed payment solicitation that used its real USDOT number and legitimate compliance language to sell a free MCS-150 update. The key warning is to verify regulatory notices directly through official government portals, not links in emails, because public identifiers and accurate terminology do not prove legitimacy.","briefOverview":"\u003cp\u003eA logistics carrier received an email titled “Required FMCSA Biennial Update” that included the carrier’s genuine USDOT number and warned about fines and deactivation. The message used real government terminology around the FMCSA biennial MCS-150 update, which carriers are genuinely required to complete every two years. The article states that this update can be completed for free at the official FMCSA portal, while the email offered paid two-year, four-year, and lifetime registration tiers.\u003c/p\u003e\n\n\u003cp\u003eThe sender was not the FMCSA but dotregistrationsfirm[.]com, a domain registered through GoDaddy in August 2023 that styled itself as a “DOT Registrations Firm.” The email footer included a disclaimer saying the company was not the Department of Transportation, the FMCSA, or any government agency, but the article says the subject line, branding, and urgency created a government-like impression. The article frames the message as brand impersonation, payment fraud, and regulatory impersonation that relied on a real public identifier and a real compliance requirement.\u003c/p\u003e\n\n\u003cp\u003eTechnical review found that the message was sent through a marketing platform and relayed through a security gateway before reaching the carrier’s Microsoft 365 tenant. SPF passed, but DMARC for the visible sender domain was set to p=none, DKIM verified at one hop and failed at the final receiver, and wrapped links resolved to a host different from the sender brand. The article says behavioral analysis flagged the mismatched link behavior, weak authentication enforcement, manufactured urgency, and payment request before any payment was made.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A logistics carrier received an email titled “Required FMCSA Biennial Update” that included the carrier’s real USDOT number and demanded payment for a required MCS-150 update.","The article states that the FMCSA biennial MCS-150 update is a real requirement but can be completed for free through the official FMCSA portal.","The sender used the domain dotregistrationsfirm.com, which was registered through GoDaddy in August 2023 and included a footer disclaimer saying it was not the Department of Transportation, the FMCSA, or any government agency.","The email’s technical signals included SPF passing, DMARC set to p=none for the visible sender domain, DKIM verifying at one hop but failing at the final receiver, and wrapped links resolving to a host different from the sender brand.","The article says behavioral analysis flagged the mismatch between sender branding and link destinations, the weak DMARC policy, the urgency around fines and deactivation, and the payment request before any payment was made."],"insights":["A real USDOT number should not be treated as proof of legitimacy because the article notes that these identifiers are publicly available in SAFER records.","The most effective verification step for carriers is to ignore the email’s links and go directly to the official FMCSA or SAFER site, since the MCS-150 update is free there.","A footer disclaimer saying the sender is not a government agency can function as legal cover while the subject line, branding, and urgency still create a government-like impression.","Messages can pass some authentication checks and still be risky, as shown by SPF passing while DMARC was only set to monitoring and DKIM was inconsistent across the relay path.","The article emphasizes that link behavior can reveal deception even when the message has no malware or credential-harvesting page, because the email showed one sender brand while its assets and unsubscribe links resolved to a different host."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on the human element in breaches, phishing as initial access, and pretexting.","category":"","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for business email compromise and payment-fraud loss figures.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report for the rise in identity-based and impersonation-driven attacks.","category":"","primary":false},{"title":"Cost of a Data Breach 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article cites the report for the average cost of a data breach being in the millions.","category":"","primary":false},{"title":"Recognize and Report Phishing","url":"https://www.cisa.gov/secure-our-world/recognize-and-report-phishing","publisher":"CISA","context":"The article references CISA guidance to support verifying suspicious notices out of band.","category":"","primary":false}],"body":"\u003cp\u003eA logistics carrier received an email titled “Required FMCSA Biennial Update” that included the carrier’s genuine USDOT number and warned about fines and deactivation. The message used real government terminology around the FMCSA biennial MCS-150 update, which carriers are genuinely required to complete every two years. The article states that this update can be completed for free at the official FMCSA portal, while the email offered paid two-year, four-year, and lifetime registration tiers.\u003c/p\u003e\n\n\u003cp\u003eThe sender was not the FMCSA but dotregistrationsfirm[.]com, a domain registered through GoDaddy in August 2023 that styled itself as a “DOT Registrations Firm.” The email footer included a disclaimer saying the company was not the Department of Transportation, the FMCSA, or any government agency, but the article says the subject line, branding, and urgency created a government-like impression. The article frames the message as brand impersonation, payment fraud, and regulatory impersonation that relied on a real public identifier and a real compliance requirement.\u003c/p\u003e\n\n\u003cp\u003eTechnical review found that the message was sent through a marketing platform and relayed through a security gateway before reaching the carrier’s Microsoft 365 tenant. SPF passed, but DMARC for the visible sender domain was set to p=none, DKIM verified at one hop and failed at the final receiver, and wrapped links resolved to a host different from the sender brand. The article says behavioral analysis flagged the mismatched link behavior, weak authentication enforcement, manufactured urgency, and payment request before any payment was made.\u003c/p\u003e\n"},{"n":29,"title":"Finding SOCKS with Proxywatch","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/09/finding-socks-with-proxywatch/","time":"16:00","priority":"MAY READ","score":68,"tldr":"SpecterOps released ProxyWatch, a proof-of-concept tool that detects SOCKS proxy pivots, C2 sessions, and beaconing by analyzing endpoint behavior rather than relying on static indicators or process-port baselines. The key takeaway is that proxy-based attacker activity can be detected more reliably by profiling how processes communicate and relay traffic.","briefOverview":"\u003cp\u003eSpecterOps highlighted ProxyWatch, a proof-of-concept tool for detecting SOCKS proxies and other proxy pivoting methods through behavior-based detection. The article explains that adversaries use SOCKS proxy tunnels to pivot within environments and execute actions against compromised systems without bringing tools to the system. It notes that defenders often lack reliable guidance for detecting this behavior and may fall back to static indicators or process-port baselines.\u003c/p\u003e\n\n\u003cp\u003eProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, and builds process profiles through a scoring engine. Its rule engine includes 83 behavioral signals such as raw socket usage, loopback address usage, periodic callback cadence, measured jitter, writable paths, uncommon traffic destinations, named pipe C2 patterns, and parent-child tunnel inheritance. The tool assigns process roles such as C2 session, SOCKS proxy pivot, and beaconing behavior, and also runs a local machine learning model trained against the rule engine’s output.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates ProxyWatch detecting a Sliver Beacon SOCKS tunnel, identifying a Sliver C2 beacon callback pattern, collecting host-user-process-endpoint relationships through ProxyHound, and probing egress paths through Contour. It emphasizes that proxied execution can reduce disk presence and avoid detections based on process spawning because the attacker’s tools remain on the attacker system. At the same time, it notes that detecting the target activity itself, such as registry run key modification, can still reveal the technique being performed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adversaries use SOCKS proxy tunnels to pivot within environments and execute code against compromised systems without bringing tools to those systems.","SpecterOps created ProxyWatch as a proof-of-concept tool to detect SOCKS proxies and other pivoting methods through behavior-based detection.","ProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, then scores processes using behavioral signals to assign roles such as C2 session, SOCKS proxy pivot, or beaconing behavior.","ProxyWatch includes a local machine learning model that reads 122 features per process and trains against the rule engine’s output while the rules provide detections from day one.","The article shows ProxyWatch detecting a Sliver Beacon SOCKS tunnel, a Sliver C2 beacon callback pattern, BloodHound-style relationship collection through ProxyHound, and egress paths through Contour."],"insights":["Proxied execution can evade detections built around process creation because the attacker’s tools run on the attacker’s machine while the compromised host only relays network traffic.","Detecting the action performed against the target, such as a registry run key modification, may succeed even when the proxied execution method itself is missed.","Process-port baselines for detecting proxy activity are difficult to maintain because legitimate and malicious use of ports such as Kerberos, LDAP, and Windows RPC can vary widely across environments.","ProxyWatch’s rule engine and local machine learning model are designed to work together, with rules providing immediate detections and the model taking over role assignment only after it reaches agreement with the rules.","Egress testing in ProxyWatch’s Contour component feeds results back into the classifier, so confirmed outbound paths in a specific network can influence later detection scoring."],"referencedReports":[{"title":"Bitdefender Whitepaper: Chafer","url":"https://www.bitdefender.com/files/News/CaseStudies/study/332/Bitdefender-Whitepaper-Chafer-creat4491-en-EN-interactive.pdf","publisher":"Bitdefender","context":"The article cites this whitepaper as an example of an APT group using custom tooling to establish a SOCKS5 TCP session through an intermediary server.","category":"","primary":false},{"title":"UNC3524: Eye Spy on Your Email","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc3524-eye-spy-email","publisher":"Google Cloud Threat Intelligence","context":"The article references this analysis as an example of adversaries using SOCKS proxies to exfiltrate data from a victim’s cloud-based email services.","category":"","primary":false},{"title":"Lucky Mouse: Incident Response to Detection Engineering","url":"https://blog.sekoia.io/lucky-mouse-incident-response-to-detection-engineering/#h-socks-tunneling-with-chisel","publisher":"Sekoia","context":"The article cites Sekoia’s reporting that an adversary group used a renamed version of the Chisel project for SOCKS tunneling.","category":"","primary":false},{"title":"Sliver C2 Leveraged by Many Threat Actors","url":"https://www.cybereason.com/blog/sliver-c2-leveraged-by-many-threat-actors","publisher":"Cybereason","context":"The article references Cybereason’s analysis of the rise of Sliver, including its SOCKS functionality, among threat groups.","category":"","primary":false},{"title":"The Curious Case of an Egg-cellent Resume","url":"https://thedfirreport.com/2024/12/02/the-curious-case-of-an-egg-cellent-resume/#case-summary","publisher":"The DFIR Report","context":"The article cites this case report as an example where adversaries installed Cloudflare Tunnels to enable RDP access to a server.","category":"","primary":false}],"body":"\u003cp\u003eSpecterOps highlighted ProxyWatch, a proof-of-concept tool for detecting SOCKS proxies and other proxy pivoting methods through behavior-based detection. The article explains that adversaries use SOCKS proxy tunnels to pivot within environments and execute actions against compromised systems without bringing tools to the system. It notes that defenders often lack reliable guidance for detecting this behavior and may fall back to static indicators or process-port baselines.\u003c/p\u003e\n\n\u003cp\u003eProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, and builds process profiles through a scoring engine. Its rule engine includes 83 behavioral signals such as raw socket usage, loopback address usage, periodic callback cadence, measured jitter, writable paths, uncommon traffic destinations, named pipe C2 patterns, and parent-child tunnel inheritance. The tool assigns process roles such as C2 session, SOCKS proxy pivot, and beaconing behavior, and also runs a local machine learning model trained against the rule engine’s output.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates ProxyWatch detecting a Sliver Beacon SOCKS tunnel, identifying a Sliver C2 beacon callback pattern, collecting host-user-process-endpoint relationships through ProxyHound, and probing egress paths through Contour. It emphasizes that proxied execution can reduce disk presence and avoid detections based on process spawning because the attacker’s tools remain on the attacker system. At the same time, it notes that detecting the target activity itself, such as registry run key modification, can still reveal the technique being performed.\u003c/p\u003e\n"},{"n":12,"title":"NSA revives 'Tailored Access Operations' name for elite hacking unit","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/nsa-revives-tao-name-for-elite-hacking-unit","time":"13:20","priority":"MAY READ","score":65,"tldr":"The NSA has renamed its elite offensive cyber unit back to Tailored Access Operations as part of a leadership-driven reorganization meant to speed and strengthen operations against digital threats from countries like China and Russia. The move revives a storied unit known for custom hacking tools, Stuxnet, and links to the leaked EternalBlue exploit later used in WannaCry.","briefOverview":"\u003cp\u003eThe National Security Agency has changed the name of its Office of Computer Network Operations back to Tailored Access Operations, or TAO. The change is part of a reorganization by NSA’s new leadership aimed at making the agency more adept at facing evolving digital threats from China, Russia, and others. The move reverses parts of the NSA21 reshuffle launched in 2016, which had moved offensive operations and intelligence collection into broader directorates rather than keeping TAO as a standalone office.\u003c/p\u003e\n\n\u003cp\u003eThe article says NSA Deputy Director Tim Kosiba, who previously worked in TAO, spearheaded the latest change. A former agency employee said NSA21 was not viewed as useful and said the earlier reshuffle split apart developers and operat
