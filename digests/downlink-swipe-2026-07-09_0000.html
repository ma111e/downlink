ors. Other former NSA personnel believe bringing those sides back together under one roof, with TAO expected to open its own building at Fort Meade next month, will speed up operations and boost creativity.\u003c/p\u003e\n\n\u003cp\u003eTAO creates and deploys custom software tools to penetrate foreign computer networks for espionage purposes, including implants and other software-based methods. The unit helped craft Stuxnet, the cyber weapon used to sabotage Iran’s nuclear program. It also drew public attention after the Shadow Brokers advertised stolen hacking techniques, and the article notes that Russia and North Korea were believed to have used pilfered tools in major global cyberattacks, including the 2017 WannaCry ransomware outbreak using EternalBlue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The National Security Agency changed the name of its Office of Computer Network Operations back to Tailored Access Operations last week.","The renaming is part of a reorganization by NSA’s new leadership intended to make the agency more adept at facing evolving digital threats from China, Russia, and others.","The move reverses parts of the NSA21 restructuring launched in 2016, which had folded offensive operations and intelligence collection into broader directorates rather than keeping TAO as a standalone office.","TAO creates and deploys custom software tools to penetrate foreign computer networks for espionage and helped craft the Stuxnet cyber weapon used to sabotage Iran’s nuclear program.","The unit drew public attention after the Shadow Brokers advertised stolen hacking techniques, including tools later associated with the EternalBlue exploit used in the 2017 WannaCry ransomware outbreak."],"insights":["The rebrand is not just cosmetic because TAO is expected to move into its own building at Fort Meade next month, physically concentrating personnel under one roof.","A former NSA employee described NSA21 as counterproductive because it separated developers and operators at a time when the agency had been trying to bring them closer together.","NSA leadership is explicitly using TAO’s historical reputation and internal identity as a tool to drive future mission performance.","The article connects the revived TAO name to both high-impact successes, such as Stuxnet, and high-profile fallout from stolen tools, such as EternalBlue’s use in WannaCry."],"referencedReports":[],"body":"\u003cp\u003eThe National Security Agency has changed the name of its Office of Computer Network Operations back to Tailored Access Operations, or TAO. The change is part of a reorganization by NSA’s new leadership aimed at making the agency more adept at facing evolving digital threats from China, Russia, and others. The move reverses parts of the NSA21 reshuffle launched in 2016, which had moved offensive operations and intelligence collection into broader directorates rather than keeping TAO as a standalone office.\u003c/p\u003e\n\n\u003cp\u003eThe article says NSA Deputy Director Tim Kosiba, who previously worked in TAO, spearheaded the latest change. A former agency employee said NSA21 was not viewed as useful and said the earlier reshuffle split apart developers and operators. Other former NSA personnel believe bringing those sides back together under one roof, with TAO expected to open its own building at Fort Meade next month, will speed up operations and boost creativity.\u003c/p\u003e\n\n\u003cp\u003eTAO creates and deploys custom software tools to penetrate foreign computer networks for espionage purposes, including implants and other software-based methods. The unit helped craft Stuxnet, the cyber weapon used to sabotage Iran’s nuclear program. It also drew public attention after the Shadow Brokers advertised stolen hacking techniques, and the article notes that Russia and North Korea were believed to have used pilfered tools in major global cyberattacks, including the 2017 WannaCry ransomware outbreak using EternalBlue.\u003c/p\u003e\n"},{"n":40,"title":"Unmasking BitRAT's C2 over HTTPS | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/detecting-bitrat-c2-over-https","time":"15:00","priority":"MAY READ","score":65,"tldr":"Corelight analyzes how BitRAT uses HTTPS for command-and-control and shows that defenders can still identify its activity through network telemetry and behavioral indicators despite encryption.","briefOverview":"\u003cp\u003eThe article is titled “Unmasking BitRAT\u0026rsquo;s C2 over HTTPS | Corelight.” The title identifies BitRAT as the subject of the article. It also indicates that the article focuses on command-and-control activity over HTTPS.\u003c/p\u003e\n\n\u003cp\u003eThe article is associated with Corelight, as shown in the title. The available text does not provide readable details about specific victims, affected organizations, indicators, or findings beyond the title. Based strictly on the readable article information, the core technical focus is BitRAT’s C2 over HTTPS.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Unmasking BitRAT's C2 over HTTPS | Corelight.\"","The title identifies BitRAT as the subject of the article.","The title indicates that the article focuses on BitRAT's C2 activity over HTTPS.","The title associates the article with Corelight."],"insights":["The title suggests that BitRAT’s use of HTTPS for command-and-control is not treated as fully opaque or impossible to analyze.","The article’s focus on “C2 over HTTPS” indicates the analysis centers on BitRAT’s communications channel rather than only the malware sample itself."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Unmasking BitRAT\u0026rsquo;s C2 over HTTPS | Corelight.” The title identifies BitRAT as the subject of the article. It also indicates that the article focuses on command-and-control activity over HTTPS.\u003c/p\u003e\n\n\u003cp\u003eThe article is associated with Corelight, as shown in the title. The available text does not provide readable details about specific victims, affected organizations, indicators, or findings beyond the title. Based strictly on the readable article information, the core technical focus is BitRAT’s C2 over HTTPS.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft to retire the OWA Light client in Exchange Server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-announces-owa-light-retirement-in-exchange-server/","time":"11:00","priority":"MAY READ","score":62,"tldr":"Microsoft plans to disable and remove the legacy OWA Light client from on-premises Exchange Server in an upcoming update, likely in August 2026. Users will need to use the modern Outlook on the web experience, while admins can proactively block OWA Light now via Exchange PowerShell settings.","briefOverview":"\u003cp\u003eMicrosoft announced plans to disable and remove OWA Light, the lightweight version of the Outlook Web App email client, in a future Exchange Server update. The Exchange Team said OWA Light was once important for compatibility, but that the full Outlook on the web experience is now where Microsoft plans to focus. Microsoft said retiring OWA Light will reduce legacy surface area, simplify engineering work, and help it continue improving the experience customers use every day.\u003c/p\u003e\n\n\u003cp\u003eOWA Light was introduced roughly two decades ago as an alternative to OWA Premium for systems that did not have Internet Explorer 6 or later installed or that ran older web browsers. Microsoft said at the time that OWA Light offered a cleaner look, faster logon times on low-bandwidth Internet connections, and support for locked-down browser modes such as kiosks. The article notes that OWA Light has fewer features than the standard version, including no weekly or monthly calendar views, no access to shared mailboxes or shared calendars, no import or export of messages or contacts, and no ability to create or modify tasks or notes.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft deprecated OWA Light as of August 19, 2024, and said the experience will likely be removed from on-premises Exchange Server in an upcoming update estimated for August 2026. After the change, users will no longer be able to choose or be redirected to OWA Light and should use the modern Outlook on the web experience instead. Administrators can block OWA Light immediately with \u003ccode\u003eSet-OwaMailboxPolicy -OwaLightEnabled $false\u003c/code\u003e and disable the OWA Light selection menu on the logon page with \u003ccode\u003eSet-OwaVirtualDirectory -LogonPageLightSelectionEnabled $false\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced plans to disable and remove OWA Light from Exchange Server in an upcoming update estimated for August 2026.","OWA Light was introduced roughly two decades ago as a simplified alternative for systems without Internet Explorer 6 or later, older browsers, low-bandwidth connections, or locked-down browser modes such as kiosks.","Microsoft said retiring OWA Light will reduce legacy surface area, simplify engineering work, and allow it to focus on the full Outlook on the web experience.","After the change is introduced, users will no longer be able to choose or be redirected to OWA Light and should use the modern Outlook on the web experience instead.","Admins can block OWA Light immediately with Set-OwaMailboxPolicy -OwaLightEnabled $false and remove the light selection menu on the logon page with Set-OwaVirtualDirectory -LogonPageLightSelectionEnabled $false."],"insights":["Organizations do not need to wait for the future Exchange Server update to remove OWA Light access, because Microsoft provides PowerShell commands to block it now and hide the Light option from the logon page.","The retirement affects only the legacy OWA Light experience, not Outlook on the web as a whole, so users are being directed to the modern full web experience rather than losing browser-based email access.","Microsoft frames the change partly as a security and maintenance reduction, saying removal will reduce legacy surface area and simplify ongoing engineering work.","OWA Light’s original purpose has largely diminished because Microsoft says modern browsers are more capable and consistent, network conditions have improved for many customers, and the security landscape has changed significantly."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft announced plans to disable and remove OWA Light, the lightweight version of the Outlook Web App email client, in a future Exchange Server update. The Exchange Team said OWA Light was once important for compatibility, but that the full Outlook on the web experience is now where Microsoft plans to focus. Microsoft said retiring OWA Light will reduce legacy surface area, simplify engineering work, and help it continue improving the experience customers use every day.\u003c/p\u003e\n\n\u003cp\u003eOWA Light was introduced roughly two decades ago as an alternative to OWA Premium for systems that did not have Internet Explorer 6 or later installed or that ran older web browsers. Microsoft said at the time that OWA Light offered a cleaner look, faster logon times on low-bandwidth Internet connections, and support for locked-down browser modes such as kiosks. The article notes that OWA Light has fewer features than the standard version, including no weekly or monthly calendar views, no access to shared mailboxes or shared calendars, no import or export of messages or contacts, and no ability to create or modify tasks or notes.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft deprecated OWA Light as of August 19, 2024, and said the experience will likely be removed from on-premises Exchange Server in an upcoming update estimated for August 2026. After the change, users will no longer be able to choose or be redirected to OWA Light and should use the modern Outlook on the web experience instead. Administrators can block OWA Light immediately with \u003ccode\u003eSet-OwaMailboxPolicy -OwaLightEnabled $false\u003c/code\u003e and disable the OWA Light selection menu on the logon page with \u003ccode\u003eSet-OwaVirtualDirectory -LogonPageLightSelectionEnabled $false\u003c/code\u003e.\u003c/p\u003e\n"},{"n":16,"title":"Summer of Clearinghouses","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/summer-of-clearinghouses.html","time":"11:00","priority":"MAY READ","score":58,"tldr":"The article argues that the new wave of open source vulnerability clearinghouses only matters if they can rapidly turn private findings into rebuilt, tested, signed, and upstreamed fixes. The real measure of success is throughput and reach, not how many vulnerabilities a clearinghouse holds.","briefOverview":"\u003cp\u003eThe article argues that the recent wave of open source vulnerability clearinghouse announcements is a response to a real shift, but that the clearinghouse itself is not the most important part. Chainguard says its Athena clearinghouse was already operating before its announcement, taking private findings and shipping fixes because customers asked for it. The author says these clearinghouses are mainly pools of pre-disclosure vulnerability data, while the real value is turning findings into rebuilt, tested, signed fixes that users can actually consume.\u003c/p\u003e\n\n\u003cp\u003eThe article says the flood of private findings is a byproduct of AI models being tested against running applications, where they find exploitable flaws across both first-party code and open source dependencies. Because applications depend heavily on open source code, flaws in obscure dependencies can still affect the whole running process. The author argues that bigger, faster clearinghouses are more useful than small or slow ones because many findings land in the same widely used libraries, and because a backlog of embargoed findings becomes a leak surface.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main test for any clearinghouse is whether it can measure and improve throughput and reach: median time from finding to rebuilt, tested, signed fix; the fraction handled without human intervention; and how many fixes land upstream rather than only reaching the vendor’s own customers. Chainguard says Athena has taken in more than twenty thousand findings and shipped over two thousand patches across five hundred projects, but says the more important number is how many fixes are accepted upstream. The author concludes that clearinghouses are a temporary safety net, while the long-term goal should be secure-by-design open source software that makes whole classes of attacks impossible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chainguard says its clearinghouse, Athena, was already running before it was announced and had been taking findings and shipping fixes for months.","The article argues that a clearinghouse is only a pool of vulnerability data, and the hard part is turning findings into rebuilt, tested, signed fixes that users can consume.","Chainguard says its build system watches thousands of open source projects and typically remediates most CVEs in roughly two days, with a one-day SLA for CISA Known Exploited Vulnerabilities.","The article says many private vulnerabilities are being found because AI models are tested against running applications and often discover flaws in open source dependencies rather than first-party code.","The author argues that successful clearinghouses should be judged by median time from finding to shipped fix, the fraction of fixes that do not require human handling, and the share of fixes that land upstream."],"insights":["The article frames a growing clearinghouse backlog as a warning sign rather than a success metric, because findings waiting under embargo are the current leak surface.","The author argues that smaller clearinghouses are not necessarily safer, because a slow operator can accumulate more dangerous in-flight findings than a larger operator with faster fix throughput.","The article says public disclosure can increase risk because a published fix acts as a map to the bug, and Chainguard claims it has seen an advisory become a working exploit in under an hour.","The author predicts that the sustainable model is not one universal clearinghouse or many fragmented ones, but a few large clearinghouses that can coordinate with each other and reach enough partners to act quickly.","The article’s proposed vendor test is actionable: ask for median time from finding to rebuilt, tested, signed fix, the fraction handled without humans, and the share of fixes accepted upstream rather than only delivered to that vendor’s customers."],"referencedReports":[{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites CISA’s catalog when discussing Chainguard’s one-day SLA for vulnerabilities that CISA says are actively exploited.","category":"","primary":false},{"title":"M-Trends 2026","url":"https://cloud.google.com/blog/topics/threat-intelligence/m-trends-2026","publisher":"Google Cloud","context":"The article cites this report for the estimate that mean time to exploit is now negative seven days.","category":"","primary":false},{"title":"APRA letter to industry on Artificial Intelligence (AI)","url":"https://www.apra.gov.au/apra-letter-to-industry-on-artificial-intelligence-ai","publisher":"APRA","context":"The article references APRA’s letter as an example of a regulator urging banks to move quickly on AI while managing concentration risk.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that the recent wave of open source vulnerability clearinghouse announcements is a response to a real shift, but that the clearinghouse itself is not the most important part. Chainguard says its Athena clearinghouse was already operating before its announcement, taking private findings and shipping fixes because customers asked for it. The author says these clearinghouses are mainly pools of pre-disclosure vulnerability data, while the real value is turning findings into rebuilt, tested, signed fixes that users can actually consume.\u003c/p\u003e\n\n\u003cp\u003eThe article says the flood of private findings is a byproduct of AI models being tested against running applications, where they find exploitable flaws across both first-party code and open source dependencies. Because applications depend heavily on open source code, flaws in obscure dependencies can still affect the whole running process. The author argues that bigger, faster clearinghouses are more useful than small or slow ones because many findings land in the same widely used libraries, and because a backlog of embargoed findings becomes a leak surface.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main test for any clearinghouse is whether it can measure and improve throughput and reach: median time from finding to rebuilt, tested, signed fix; the fraction handled without human intervention; and how many fixes land upstream rather than only reaching the vendor’s own customers. Chainguard says Athena has taken in more than twenty thousand findings and shipped over two thousand patches across five hundred projects, but says the more important number is how many fixes are accepted upstream. The author concludes that clearinghouses are a temporary safety net, while the long-term goal should be secure-by-design open source software that makes whole classes of attacks impossible.\u003c/p\u003e\n"},{"n":37,"title":"Why we cannot wait for better post-quantum signature algorithms","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/ml-dsa-will-have-to-do/","time":"14:00","priority":"MAY READ","score":58,"tldr":"Cloudflare argues organizations cannot wait for newer, smaller post-quantum signature algorithms because they likely will not be widely deployable until the 2030s. The practical path is to begin migrating now with ML-DSA despite its drawbacks, while continuing research into better alternatives for future upgrades.","briefOverview":"\u003cp\u003eCloudflare argues that organizations cannot wait for better post-quantum signature algorithms before migrating away from RSA and ECC, because sufficiently advanced quantum computers would be able to break those older systems. The article says ML-KEM encryption and ML-DSA signatures were standardized by NIST in 2024 after an eight-year competition, and Cloudflare is targeting 2029 to become fully post-quantum secure. It notes that much of Cloudflare’s traffic already uses ML-KEM encryption, but authentication systems still need post-quantum signatures.\u003c/p\u003e\n\n\u003cp\u003eThe article compares current and candidate post-quantum signature schemes, including ML-DSA, SLH-DSA, FN-DSA, SQIsign, UOV, MAYO, SNOVA, HAWK, FAEST, MQOM, and SDitH. It says there is no single post-quantum “all-star” equivalent to elliptic-curve signatures: some schemes have small signatures but slow signing, huge public keys, difficult secure implementations, or newer security assumptions. ML-DSA is described as the available general-purpose option today, even though it has larger sizes and fewer tricks than RSA and ECC.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says the newer signature algorithms will not be ready in time for the first post-quantum transition, with broad availability for many candidates expected in the 2030s. The article argues that migration must start now because large systems need transition periods, and supporting both old and new signatures can create downgrade risks. It also says continued NIST work remains important because smaller future signatures and related techniques may help systems that cannot easily absorb ML-DSA’s costs and may support tools such as anonymous credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare says RSA and ECC are vulnerable to sufficiently advanced quantum computers, and it is targeting 2029 to become fully post-quantum secure.","The article argues that newer post-quantum signature algorithms will not be ready in time for the first transition, so ML-DSA must be used despite larger sizes and reduced flexibility compared with RSA and ECC.","NIST advanced nine post-quantum signature schemes to the third round of its signatures on-ramp, while a draft standard for FN-DSA is expected imminently.","The article says FN-DSA has smaller keys and signatures than ML-DSA but is difficult to implement securely for signing because of issues involving floating-point arithmetic and side-channel safety.","Cloudflare argues continued work on new signature schemes remains important because some systems cannot easily absorb ML-DSA’s size costs and because the research may help enable other post-quantum tools such as anonymous credentials."],"insights":["The article warns that meeting a 2035 post-quantum deadline by deploying signatures in 2034 would still be insufficient, because large systems need a long period supporting both old and new signatures, which can create downgrade risks.","FN-DSA’s main weakness is not verification but signing: the article says verification is straightforward, while secure signing is difficult because different floating-point implementations can behave differently and may affect testability and side-channel safety.","Some post-quantum signature schemes are useful even if they are not ready for the first migration, because their underlying methods can support other hard-to-replace tools such as anonymous credentials and blind signatures.","The article says there is no single post-quantum signature algorithm that replaces elliptic-curve signatures across all important measures, so different systems may need different trade-offs between signature size, public key size, speed, and implementation risk.","Cloudflare argues that NIST’s continued signature competition is still a good use of resources even though the candidates will arrive too late for the first migration, because smaller future signatures could remove costly compensating controls in systems that cannot efficiently use ML-DSA."],"referencedReports":[{"title":"An Efficient Key Recovery Attack on SIDH","url":"https://eprint.iacr.org/2022/975.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper as the work that badly broke SIKE during the NIST post-quantum cryptography process.","category":"","primary":false},{"title":"NIST IR 8413-upd1","url":"https://nvlpubs.nist.gov/nistpubs/ir/2022/NIST.IR.8413-upd1.pdf","publisher":"NIST","context":"The article references this NIST report while explaining that SIKE was deferred to an additional evaluation round before it was broken.","category":"","primary":false},{"title":"Cryptanalysis of the Oil and Vinegar Signature Scheme","url":"https://weizmann.elsevierpure.com/en/publications/cryptanalysis-of-the-oil-and-vinegar-signature-scheme-2/","publisher":"Weizmann Institute / Elsevier Pure","context":"The article cites this research as the attack that showed the original balanced oil-and-vinegar scheme had unsafe parameters.","category":"","primary":false},{"title":"Intersection attack paper on multivariate schemes","url":"https://eprint.iacr.org/2020/1343.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper for the 2020 discovery of the intersection attack against then-proposed UOV parameters.","category":"","primary":false},{"title":"Wedges attack paper on multivariate schemes","url":"https://eprint.iacr.org/2025/1143.pdf","publisher":"IACR ePrint Archive","context":"The article cites this publication as introducing the use of wedges to attack multivariate signature schemes.","category":"","primary":false},{"title":"Analysis of wedges attacks as intersection attacks over truncated rings","url":"https://eprint.iacr.org/2026/298","publisher":"IACR ePrint Archive","context":"The article cites this work for the finding that wedges attacks and generalizations can be viewed as a special case of intersection attacks over truncated rings.","category":"","primary":false},{"title":"Analysis of one-time key reuse in hash-based signatures","url":"https://eprint.iacr.org/2020/1243.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper while explaining that reusing a one-time-signature key in stateful hash-based signatures can likely allow forgeries.","category":"","primary":false},{"title":"NIST SP 800-230 Initial Public Draft","url":"https://csrc.nist.gov/pubs/sp/800/230/ipd","publisher":"NIST","context":"The article references this NIST draft as the proposal to standardize an additional SLH-DSA parameter set with smaller signatures and a signing limit.","category":"","primary":false},{"title":"Key recovery from deterministic FN-DSA signatures by different implementations","url":"https://eprint.iacr.org/2024/1709","publisher":"IACR ePrint Archive","context":"The article cites this research for the finding that two deterministic FN-DSA signatures from slightly different implementations can reveal parts of the private key.","category":"","primary":false},{"title":"Attack on the lattice isomorphism problem in totally real number fields","url":"https://eprint.iacr.org/2024/441","publisher":"IACR ePrint Archive","context":"The article cites this work as showing that HAWK’s lattice isomorphism problem is easy in the special case of totally real number fields.","category":"","primary":false},{"title":"Extension of lattice isomorphism attacks to broader number fields","url":"https://eprint.iacr.org/2025/280.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper as extending the 2024 lattice isomorphism attack to a broader class of number fields.","category":"","primary":false},{"title":"Proposed extension of lattice isomorphism attacks toward HAWK","url":"https://eprint.iacr.org/2026/1318.pdf","publisher":"IACR ePrint Archive","context":"The article cites this June 2026 paper as suggesting a way to extend lattice isomorphism attacks to HAWK, while noting that an error was later found.","category":"","primary":false},{"title":"Lattice-based zero-knowledge proof systems for general statements","url":"https://eprint.iacr.org/2022/1341.pdf","publisher":"IACR ePrint Archive","context":"The article references this work as an example of ways to create zero-knowledge proofs using lattices for general statements, though with larger signatures.","category":"","primary":false},{"title":"Post-quantum blind signatures paper","url":"https://eprint.iacr.org/2026/109.pdf","publisher":"IACR ePrint Archive","context":"The article cites this research while discussing how proof-of-knowledge schemes can support blind signatures beyond ordinary signatures.","category":"","primary":false},{"title":"KuMQuat paper","url":"https://eprint.iacr.org/2024/490.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper for a more efficient scheme combining FAEST-style proof machinery with the MQ hard problem and for reported performance trade-offs.","category":"","primary":false},{"title":"NIST IR 8610","url":"https://csrc.nist.gov/pubs/ir/8610/final","publisher":"NIST","context":"The article references this NIST report for NIST’s expectation that multivariate signature schemes will need at least one additional round before standardization.","category":"","primary":false},{"title":"SNOVA structure analysis paper","url":"https://eprint.iacr.org/2024/1297.pdf","publisher":"IACR ePrint Archive","context":"The article cites this paper in support of the claim that SNOVA’s structure can be viewed as a special form of MAYO’s whipping map.","category":"","primary":false},{"title":"SNOVA and MAYO structural analysis paper","url":"https://eprint.iacr.org/2026/659","publisher":"IACR ePrint Archive","context":"The article cites this work alongside another paper to support the relationship between SNOVA’s structure and MAYO’s whipping map.","category":"","primary":false},{"title":"Post-quantum anonymous credential paper","url":"https://www.usenix.org/system/files/conference/usenixsecurity26/sec26_prepub_baum.pdf","publisher":"USENIX Security","context":"The article cites this paper as an example of using FAEST’s underlying machinery with a multivariate scheme like MAYO to create efficient post-quantum anonymous credentials.","category":"","primary":false}],"body":"\u003cp\u003eCloudflare argues that organizations cannot wait for better post-quantum signature algorithms before migrating away from RSA and ECC, because sufficiently advanced quantum computers would be able to break those older systems. The article says ML-KEM encryption and ML-DSA signatures were standardized by NIST in 2024 after an eight-year competition, and Cloudflare is targeting 2029 to become fully post-quantum secure. It notes that much of Cloudflare’s traffic already uses ML-KEM encryption, but authentication systems still need post-quantum signatures.\u003c/p\u003e\n\n\u003cp\u003eThe article compares current and candidate post-quantum signature schemes, including ML-DSA, SLH-DSA, FN-DSA, SQIsign, UOV, MAYO, SNOVA, HAWK, FAEST, MQOM, and SDitH. It says there is no single post-quantum “all-star” equivalent to elliptic-curve signatures: some schemes have small signatures but slow signing, huge public keys, difficult secure implementations, or newer security assumptions. ML-DSA is described as the available general-purpose option today, even though it has larger sizes and fewer tricks than RSA and ECC.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says the newer signature algorithms will not be ready in time for the first post-quantum transition, with broad availability for many candidates expected in the 2030s. The article argues that migration must start now because large systems need transition periods, and supporting both old and new signatures can create downgrade risks. It also says continued NIST work remains important because smaller future signatures and related techniques may help systems that cannot easily absorb ML-DSA’s costs and may support tools such as anonymous credentials.\u003c/p\u003e\n"},{"n":28,"title":"AI Authority Drift: The Permissions Nobody Approved","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/ai-authority-drift-the-permissions-nobody-approved","time":"07:05","priority":"MAY READ","score":55,"tldr":"AI agents are accumulating permissions through integrations and inherited access faster than traditional reviews can track, creating “authority drift” that attackers can exploit using the agents’ own legitimate access. Organizations need live visibility and real-time enforcement of agent permissions rather than relying on static approval records or periodic reviews.","briefOverview":"\u003cp\u003eThe article discusses “authority drift,” defined as the expansion of an AI agent’s permission footprint beyond what was originally approved until nobody can account for everything it can reach. It describes a case where a coding agent started with recorded read access to a code repository but later gained connections to a ticketing system, a documentation tool, and a data store. The article argues that this creates a gap between what security teams think an agent can do and what it can actually do.\u003c/p\u003e\n\n\u003cp\u003eThe article says authority drift does not behave like traditional overprovisioning because AI agent permissions can change faster than quarterly access reviews can catch. It identifies three drivers of growth: inherited access from connected systems, new integrations added by developers, and broad access granted for convenience. It also cites September 2025 incidents where state-sponsored attackers hijacked enterprise AI agent instances across 30 defense, energy, and technology targets, and CVE-2025-32711, a Microsoft 365 Copilot zero-click prompt injection that extracted data from OneDrive, SharePoint, and Teams.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that organizations often lack a current map of what each AI agent can reach, while agent deployment is increasing across enterprise applications. It says static inventories from deployment quickly become outdated when integrations or data stores change. The article recommends a live map of agent access, restrictions to fixed tools or models, and an enforcement point that can scope access without waiting for the next scheduled review.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article defines authority drift as an AI agent’s permission footprint expanding beyond what was originally approved until nobody can account for everything it can reach.","The article says AI agent access grows through inherited permissions from connected systems, new integrations added to solve immediate problems, and broad access granted for convenience.","In September 2025, state-sponsored attackers hijacked enterprise AI agent instances across 30 targets in defense, energy, and technology, using the agents’ accumulated access to move laterally in minutes.","CVE-2025-32711 was described as a zero-click prompt injection in Microsoft 365 Copilot that used a crafted email to extract data from OneDrive, SharePoint, and Teams through a trusted Microsoft domain.","The article argues that organizations need a live map of each agent’s access, restrictions to a fixed set of tools or models, and an enforcement point that can scope access without waiting for the next scheduled review."],"insights":["Traditional quarterly access reviews are poorly matched to AI agents because the article says an agent’s permissions can expand in weeks rather than years.","The article highlights that individually reasonable access decisions by separate teams can combine into an overall permission footprint that no single team approved or understands.","The article argues that visibility alone is insufficient because a live access map and tool restrictions only produce reports unless there is an enforcement point that can act before the next scheduled review.","The article warns that continuous monitoring can fail operationally if every integration change triggers an alert, because overstretched security teams may tune out the noise within a quarter.","The article frames the most useful governance question as procedural rather than static: who last checked what an agent can reach, and when."],"referencedReports":[{"title":"CVE-2025-32711","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711","publisher":"Microsoft Security Response Center","context":"The article cites this Microsoft advisory as the disclosure for a zero-click prompt injection in Microsoft 365 Copilot.","category":"","primary":false}],"body":"\u003cp\u003eThe article discusses “authority drift,” defined as the expansion of an AI agent’s permission footprint beyond what was originally approved until nobody can account for everything it can reach. It describes a case where a coding agent started with recorded read access to a code repository but later gained connections to a ticketing system, a documentation tool, and a data store. The article argues that this creates a gap between what security teams think an agent can do and what it can actually do.\u003c/p\u003e\n\n\u003cp\u003eThe article says authority drift does not behave like traditional overprovisioning because AI agent permissions can change faster than quarterly access reviews can catch. It identifies three drivers of growth: inherited access from connected systems, new integrations added by developers, and broad access granted for convenience. It also cites September 2025 incidents where state-sponsored attackers hijacked enterprise AI agent instances across 30 defense, energy, and technology targets, and CVE-2025-32711, a Microsoft 365 Copilot zero-click prompt injection that extracted data from OneDrive, SharePoint, and Teams.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that organizations often lack a current map of what each AI agent can reach, while agent deployment is increasing across enterprise applications. It says static inventories from deployment quickly become outdated when integrations or data stores change. The article recommends a live map of agent access, restrictions to fixed tools or models, and an enforcement point that can scope access without waiting for the next scheduled review.\u003c/p\u003e\n"},{"n":27,"title":"AI Pentesting Buyer's Guide: How to evaluate AI pentesting vendors","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/ai-pentesting-buyers-guide","time":"09:55","priority":"MAY READ","score":45,"tldr":"Aikido’s AI pentesting buyer’s guide argues that organizations should evaluate vendors on how well they fit modern continuous delivery workflows, especially whether they support source-code-assisted whitebox testing, enforce scope technically, and retest as software changes.","briefOverview":"\u003cp\u003eThe article presents an AI pentesting buyer’s guide for organizations evaluating vendors in a software development environment where releases happen frequently. It cites Aikido’s State of AI in Pentesting survey of 200 CISOs and 200 engineering leaders, which found that 76% deploy significant changes at least weekly, nearly 40% deploy daily, and only 21% validate security on every release. The article says this gap leads to concern about missed vulnerabilities, outdated findings, and security testing timelines that can delay deployments or force teams to accept additional risk.\u003c/p\u003e\n\n\u003cp\u003eThe guide argues that buyers should ask whether an AI pentesting platform can use source code, keep testing within scope, and continue delivering value as software changes. It says that across more than 1,000 AI pentests, whitebox testing uncovered 7x more vulnerabilities while requiring fewer attempts than greybox testing alone. It recommends comparing vendors under comparable conditions, including source code access, authentication, runtime, credit use, scope, validation, and reporting.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several evaluation red flags, including vendors that cannot explain how findings are validated, dismiss code access without comparative evidence, rely on prompts instead of technical controls for guardrails, or focus demos mainly on familiar OWASP vulnerabilities. It also says buyers should ask whether testing can run automatically as software changes, whether fixes can be retested without scheduling another engagement, and how quickly a new application can produce meaningful results. The full guide is described as including a vendor checklist, AI versus manual pentesting comparisons, research from more than 1,000 AI pentests, whitebox versus greybox analysis, State of AI in Pentesting findings, and an anonymised customer case study.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido’s survey of 200 CISOs and 200 engineering leaders found that 76% deploy significant changes at least weekly, nearly 40% deploy daily, and only 21% validate security on every release.","The article says AI pentesting is becoming a practical way to close the gap between continuous software releases and less frequent security validation.","Across more than 1,000 AI pentests, whitebox testing uncovered 7x more vulnerabilities while requiring fewer attempts than greybox testing alone.","The article recommends comparing AI pentesting vendors under comparable conditions, including authentication, source code, scope, validation, and reporting.","The article identifies red flags such as vendors being unable to explain finding validation, dismissing code access without evidence, relying on prompts for guardrails, or focusing demos only on familiar OWASP vulnerabilities."],"insights":["AI pentesting vendor comparisons can be misleading if one platform receives source code, runs longer, or uses more credits than another, so evaluation conditions must be standardized before reports are compared.","The article treats source code access as an evidence-backed differentiator rather than a simple feature choice, urging buyers to ask vendors how code is used, protected, and proven to improve results.","Prompt-based instructions are presented as weaker scope controls than technical enforcement, making the method of keeping AI agents within bounds a critical evaluation criterion.","The ability to retest fixes and run automatically as software changes is framed as central to AI pentesting value, because a single completed test loses relevance when teams keep shipping new code."],"referencedReports":[],"body":"\u003cp\u003eThe article presents an AI pentesting buyer’s guide for organizations evaluating vendors in a software development environment where releases happen frequently. It cites Aikido’s State of AI in Pentesting survey of 200 CISOs and 200 engineering leaders, which found that 76% deploy significant changes at least weekly, nearly 40% deploy daily, and only 21% validate security on every release. The article says this gap leads to concern about missed vulnerabilities, outdated findings, and security testing timelines that can delay deployments or force teams to accept additional risk.\u003c/p\u003e\n\n\u003cp\u003eThe guide argues that buyers should ask whether an AI pentesting platform can use source code, keep testing within scope, and continue delivering value as software changes. It says that across more than 1,000 AI pentests, whitebox testing uncovered 7x more vulnerabilities while requiring fewer attempts than greybox testing alone. It recommends comparing vendors under comparable conditions, including source code access, authentication, runtime, credit use, scope, validation, and reporting.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several evaluation red flags, including vendors that cannot explain how findings are validated, dismiss code access without comparative evidence, rely on prompts instead of technical controls for guardrails, or focus demos mainly on familiar OWASP vulnerabilities. It also says buyers should ask whether testing can run automatically as software changes, whether fixes can be retested without scheduling another engagement, and how quickly a new application can produce meaningful results. The full guide is described as including a vendor checklist, AI versus manual pentesting comparisons, research from more than 1,000 AI pentests, whitebox versus greybox analysis, State of AI in Pentesting findings, and an anonymised customer case study.\u003c/p\u003e\n"},{"n":39,"title":"Mitiga Joins Anthropic’s Cyber Verification Program","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/mitiga-joins-anthropic-cyber-verification-program","time":"15:08","priority":"MAY READ","score":45,"tldr":"Mitiga has joined Anthropic’s Cyber Verification Program to use Claude’s advanced, vetted dual-use cyber reasoning to improve its Agentic Runtime Security detections. The key message is that as AI accelerates exploitation beyond the speed of patching, defenders need runtime controls that detect and stop attacks before they cause business impact.","briefOverview":"\u003cp\u003eMitiga announced that it has joined Anthropic’s Cyber Verification Program, a vetting process that unlocks certain restricted cyber capabilities in frontier AI models for legitimate defensive work. The article explains that Anthropic blocks dangerous cyber activity by default, while allowing verified organizations to access dual-use reasoning for work such as exploitation analysis, adversarial simulation, and threat modeling. Mitiga says this access will help apply Claude’s reasoning to improve Agentic Runtime Security detections powered by Helios AIDR.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that this matters because AI has compressed the attacker’s timeline and made the traditional patching model insufficient on its own. It says exploitation can now happen before a patch is available, and that public patches can also help attackers understand what changed and where to look. Mitiga frames this as a need for compensating controls that can watch open exposure windows and stop attacks in runtime.\u003c/p\u003e\n\n\u003cp\u003eMitiga describes Agentic Runtime Security as a runtime defense layer across cloud, SaaS, identity, AI, and third-party services, using logs as ground truth rather than relying on endpoint agents alone. The company says verified access to Claude will support deeper reasoning about attacker tradecraft, including how exploits are reasoned, how exfiltration patterns form, and how adversaries chain footholds across modern infrastructure. The article’s bottom line is that prevention alone is not enough when exploits can beat patches, and that Mitiga aims to prevent business impact even if attackers gain an initial foothold.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga has joined Anthropic’s Cyber Verification Program to use Claude’s advanced cyber reasoning for legitimate defensive work that is blocked by default for unverified users.","Anthropic’s Cyber Verification Program distinguishes between cyber activities with no legitimate use, which remain blocked for everyone, and dual-use activities such as exploitation analysis, adversarial simulation, and threat modeling, which verified defensive organizations can access.","The article argues that AI has compressed attackers’ timelines so much that exploitation can occur before a patch is available, making faster patching insufficient by itself.","Mitiga says it will use verified access to improve detections in Helios AIDR, the engine behind its Agentic Runtime Security, by reasoning about real attacker tradecraft such as exploit paths, exfiltration patterns, and chained footholds.","The article presents Agentic Runtime Security as a compensating control that watches cloud, SaaS, identity, AI, and third-party services to detect, interrupt, and stop attacks before they cause business impact."],"insights":["The article frames public patches as a potential attacker aid because once a fix is released, attackers can examine what changed and use it as a roadmap to the weakness.","Mitiga argues that the AI-era defense problem is a cost-curve problem, not just a speed or staffing problem, because AI made attacking dramatically cheaper before it made defending cheaper.","The article highlights comprehensive logs as the practical ground truth for defense across cloud, SaaS, identity, AI, and third-party services when no single fix can be trusted to arrive in time.","Mitiga’s stated reason for joining the CVP is not primarily faster code scanning, but improving runtime detections by using model reasoning to study how attacker tradecraft develops across modern infrastructure."],"referencedReports":[],"body":"\u003cp\u003eMitiga announced that it has joined Anthropic’s Cyber Verification Program, a vetting process that unlocks certain restricted cyber capabilities in frontier AI models for legitimate defensive work. The article explains that Anthropic blocks dangerous cyber activity by default, while allowing verified organizations to access dual-use reasoning for work such as exploitation analysis, adversarial simulation, and threat modeling. Mitiga says this access will help apply Claude’s reasoning to improve Agentic Runtime Security detections powered by Helios AIDR.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that this matters because AI has compressed the attacker’s timeline and made the traditional patching model insufficient on its own. It says exploitation can now happen before a patch is available, and that public patches can also help attackers understand what changed and where to look. Mitiga frames this as a need for compensating controls that can watch open exposure windows and stop attacks in runtime.\u003c/p\u003e\n\n\u003cp\u003eMitiga describes Agentic Runtime Security as a runtime defense layer across cloud, SaaS, identity, AI, and third-party services, using logs as ground truth rather than relying on endpoint agents alone. The company says verified access to Claude will support deeper reasoning about attacker tradecraft, including how exploits are reasoned, how exfiltration patterns form, and how adversaries chain footholds across modern infrastructure. The article’s bottom line is that prevention alone is not enough when exploits can beat patches, and that Mitiga aims to prevent business impact even if attackers gain an initial foothold.\u003c/p\u003e\n"},{"n":22,"title":"ThreatsDay: Cloud Bucket Hijacking, Windows LPE Chain, Global Fraud Bust + 17 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threatsday-cloud-bucket-hijacking.html","time":"15:09","priority":"MAY READ","score":40,"tldr":"This week’s threats show how ordinary operational gaps—reused cloud bucket names, trusted remote tools, typosquatted packages, stale credentials, and loose egress controls—can quickly become paths for data theft, privilege escalation, and ransomware. The key takeaway is to scrutinize normal-looking workflows and permissions before attackers turn them into quiet compromise channels.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers 20 security stories centered on ordinary administrative gaps becoming serious risks. It includes a global fraud operation that led to 5,811 arrests and the interception of $293 million, malicious npm and PyPI packages typosquatting payment SDKs, and a critical Esri ArcGIS Server flaw that could allow unauthenticated access to sensitive files. The article also highlights social engineering campaigns using Microsoft Teams, Meta Business Account Manager, tax refund lures, and remote access tools to steal credentials or deploy malware.\u003c/p\u003e\n\n\u003cp\u003eSeveral items focus on technical methods that avoid detection or abuse trusted systems. Researchers described Process Parameter Poisoning for stealthy code injection, a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service, and multiple flaws in Realtek’s RtsPer.sys driver that could expose kernel memory or allow physical memory access. Other reports covered GhostChrome-X modifying Chrome extension integrity metadata, fileless and steganographic Remcos delivery, and ransomware activity involving Interlock, Rhysida, WhiteLock, Prinz Eugen, Bumblebee, AdaptixC2, and Akira.\u003c/p\u003e\n\n\u003cp\u003eCloud and identity risks are a major theme across the roundup. Mandiant warned that manually rotated ADFS certificates can leave active signing keys exposed through Machine DPAPI, creating a risk of forged high-privilege SAML tokens, while AWS emphasized layered egress controls to reduce data exfiltration risk. Palo Alto Networks Unit 42 described cloud bucket hijacking, where deleting and recreating a globally unique bucket name under another account can reroute logs and sensitive data to an attacker-controlled environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation First Light 2026 involved 97 countries and territories, led to 5,811 arrests, intercepted $293 million in illicit assets, and identified more than 142,000 victims of social engineering scams and related money laundering.","Seventeen malicious npm and PyPI packages typosquatted Paysafe, Skrill, and Neteller SDKs to steal system information and developer secrets and send them to an Ngrok endpoint.","A critical Esri ArcGIS Server flaw, CVE-2026-9181, could allow unauthenticated attackers to access sensitive files by using crafted path parameters in the REST Uploads resource.","A fake IT support campaign used phishing emails and Microsoft Teams calls to get victims to install remote access tools and ultimately deliver EtherRAT.","Palo Alto Networks Unit 42 described a cloud bucket hijacking technique in which an attacker can recreate a deleted globally unique bucket name under their own account and reroute logs or sensitive data to their environment."],"insights":["Several campaigns relied on legitimate or trusted channels, including Microsoft Teams, Meta Business Account Manager, Chrome extensions, remote management tools, and cloud storage services, showing that normal business tools can become attacker infrastructure when permissions and trust are too broad.","The cloud bucket hijacking risk is especially actionable because it depends on globally unique bucket names: deleting and recreating a bucket name under another account can silently redirect active data streams without exploiting a software bug.","Multiple items show attackers designing malware to avoid early detection, including packages that skip sandbox-like machines, fileless Remcos execution, Process Parameter Poisoning, and GhostChrome-X forging Chrome extension integrity metadata.","Old or leftover trusted state created major exposure in more than one case, including manually rotated ADFS signing keys remaining recoverable through Machine DPAPI and reused cloud bucket names becoming hijackable after deletion.","Remote access tools were both targeted and abused: WhiteLock terminates AnyDesk and TeamViewer to block defenders, while fake Teams support campaigns guided victims into installing HopToDesk and AnyDesk for attacker persistence."],"referencedReports":[{"title":"Coordinated npm and PyPI Campaign Typosquats Secure Payment Apps","url":"https://socket.dev/blog/npm-pypi-campaign-typosquats-popular-secure-payment-apps#Campaign-Attributes","publisher":"Socket","context":"The article cites Socket’s analysis of 17 malicious npm and PyPI packages typosquatting Paysafe, Skrill, and Neteller SDKs.","category":"","primary":false},{"title":"Process Parameter Poisoning to Avoid Detection","url":"https://sensepost.com/blog/2026/process-parameter-poisoning/","publisher":"SensePost","context":"The article references SensePost research describing Process Parameter Poisoning as a stealthy code injection technique.","category":"","primary":false},{"title":"Critical Directory Traversal Flaw in Esri ArcGIS Server","url":"https://horizon3.ai/attack-research/vulnerabilities/cve-2026-9181/","publisher":"Horizon3.ai","context":"The article cites Horizon3.ai’s analysis of CVE-2026-9181 in Esri ArcGIS Server.","category":"","primary":false},{"title":"Interlock and Rhysida Ransomware Ecosystem Detailed","url":"https://www.ibm.com/think/x-force/interlock-and-rhysida-within-the-ransonware-ecosystem","publisher":"IBM X-Force","context":"The article references IBM X-Force’s analysis of tooling overlaps in the Interlock and Rhysida ransomware ecosystems.","category":"","primary":false},{"title":"China Urges Developers to Ditch Claude","url":"https://cnvdb.org.cn/announcement/2074682031259299842","publisher":"China National Vulnerability Database","context":"The article cites CNVDB’s warning urging developers to uninstall or update affected Claude Code versions over sensitive data collection concerns.","category":"","primary":false},{"title":"Fake IT Support Scheme Delivers EtherRAT","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-06-28-Fake-IT-support-abuses-Teams-to-deliver-EtherRAT.txt","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s threat intelligence on a fake IT support campaign abusing Microsoft Teams to deliver EtherRAT.","category":"","primary":false},{"title":"Are Scattered Spider and 0ktapus the Same?","url":"https://www.group-ib.com/blog/connecting-scattered-spider/","publisher":"Group-IB","context":"The article cites Group-IB’s analysis connecting Scattered Spider activity with 0ktapus as a sub-cluster.","category":"","primary":false},{"title":"Meta Phishers Abuse Business Account Manager Service","url":"https://www.huntress.com/blog/meta-business-manager-phishing","publisher":"Huntress","context":"The article references Huntress research on phishing emails sent through Meta’s Business Account Manager service.","category":"","primary":false},{"title":"Extending EPM Poisoning to Achieve LPE on Windows","url":"https://www.safebreach.com/blog/an-update-on-you-snooze-you-lose-winning-lpes-by-racing-services-for-rpc-endpoints/","publisher":"SafeBreach","context":"The article cites SafeBreach’s technical analysis of a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service.","category":"","primary":false},{"title":"Multiple Flaws in Realtek SD Card Reader Driver","url":"https://zwclose.github.io/2026/07/08/rtsper2.html","publisher":"zwclose","context":"The article references a researcher’s disclosure of multiple vulnerabilities in Realtek’s RtsPer.sys SD card reader driver.","category":"","primary":false},{"title":"WhiteLock and Prinz Eugen Ransomware Analyzed","url":"https://asec.ahnlab.com/en/94390/","publisher":"AhnLab","context":"The article cites AhnLab’s analysis of WhiteLock ransomware behavior, including terminating remote access services.","category":"","primary":false},{"title":"Prinz Eugen Ransomware: A Deep Dive into a New Go-Based Encryptor","url":"https://www.threatdown.com/blog/prinz-eugen-ransomware-a-deep-dive-into-a-new-go-based-encryptor/","publisher":"ThreatDown","context":"The article references ThreatDown’s deep dive on Prinz Eugen ransomware, a Go-based encryptor detected in May 2026.","category":"","primary":false},{"title":"GhostChrome-X, a Chrome Extension Integrity Bypass","url":"https://zerolabs.rubrik.com/blog/inside-ghostchrome-x-chrome-extension-integrity-bypass","publisher":"Rubrik Zero Labs","context":"The article cites Rubrik Zero Labs’ analysis of GhostChrome-X and its bypass of Chrome extension integrity protections.","category":"","primary":false},{"title":"Indian Income Tax Lures Used to Deliver AsyncRAT and LX RAT","url":"https://zerobec.com/blog/lx-rat-itr-phishing-finance-tech","publisher":"ZeroBEC","context":"The article references ZeroBEC’s analysis of phishing campaigns using Indian Income Tax Return refund lures to deliver AsyncRAT and LX RAT.","category":"","primary":false},{"title":"An Income Tax Assessment Notice Phishing Campaign Delivering Malware","url":"https://www.cyfirma.com/research/an-income-tax-assessment-notice-phishing-campaign-delivering-malware/","publisher":"CYFIRMA","context":"The article cites CYFIRMA’s research on fraudulent tax assessment notifications used to distribute a trojan-like payload.","category":"","primary":false},{"title":"Steganographic Loader Campaign Drops Remcos RAT","url":"https://labs.k7computing.com/index.php/a-multi-stage-steganographic-loader-campaign-deploying-diverse-payloads-globally/","publisher":"K7 Labs","context":"The article references K7 Labs’ analysis of a GST-themed ZIP lure campaign using steganography and in-memory execution to deliver Remcos RAT.","category":"","primary":false},{"title":"Microsoft Teams-Themed Remote Access Phishing Campaign Spotted","url":"https://www.cyfirma.com/research/microsoft-teams-themed-remote-access-phishing-campaign/","publisher":"CYFIRMA","context":"The article cites CYFIRMA’s research on a Microsoft Teams-themed phishing campaign distributing a legitimate remote access tool configured for unauthorized access.","category":"","primary":false},{"title":"Recovering Active ADFS Signing Keys via Machine DPAPI","url":"https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi/","publisher":"Mandiant","context":"The article references Mandiant’s technical analysis showing how active ADFS signing keys can remain exposed through Machine DPAPI after manual certificate rotation.","category":"","primary":false},{"title":"AWS Egress Controls to Prevent Data Exfiltration","url":"https://aws.amazon.com/blogs/security/prevent-data-exfiltration-aws-egress-controls-for-cloud-workloads/","publisher":"Amazon Web Services","context":"The article cites AWS guidance on using layered egress controls to prevent data exfiltration from cloud workloads and AI agents.","category":"","primary":false},{"title":"Cloud Bucket Hijacking Attack","url":"https://unit42.paloaltonetworks.com/cloud-bucket-hijacking-risks/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42’s analysis of a cloud bucket hijacking technique that can reroute active data streams to an attacker-controlled bucket.","category":"","primary":false},{"title":"Active Directory Certificate Services Exploitation","url":"https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s warning that insecure AD CS defaults and overly permissive enrollment rights can enable privilege escalation and persistence.","category":"","primary":false},{"title":"Modern Kubernetes Threats","url":"https://unit42.paloaltonetworks.com/modern-kubernetes-threats/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s analysis of Kubernetes identities being abused with exposed attack surfaces to reach sensitive backend cloud infrastructure.","category":"","primary":false},{"title":"Amazon Bedrock Multiagent Applications","url":"https://unit42.paloaltonetworks.com/amazon-bedrock-multiagent-applications/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s research on exploitation paths in multi-agent AI systems through inter-agent communication and prompt injection.","category":"","primary":false},{"title":"Bypass of AWS Sandbox Network Isolation Mode","url":"https://unit42.paloaltonetworks.com/bypass-of-aws-sandbox-network-isolation-mode/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s finding that Amazon Bedrock AgentCore Code Interpreter sandbox network isolation mode can be bypassed via DNS tunneling.","category":"","primary":false},{"title":"Exploit of AWS AgentCore IAM God Mode","url":"https://unit42.paloaltonetworks.com/exploit-of-aws-agentcore-iam-god-mode/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s analysis of AgentCore starter toolkit auto-created IAM roles that grant broad privileges across an AWS account.","category":"","primary":false}],"body":"\u003cp\u003eThis ThreatsDay roundup covers 20 security stories centered on ordinary administrative gaps becoming serious risks. It includes a global fraud operation that led to 5,811 arrests and the interception of $293 million, malicious npm and PyPI packages typosquatting payment SDKs, and a critical Esri ArcGIS Server flaw that could allow unauthenticated access to sensitive files. The article also highlights social engineering campaigns using Microsoft Teams, Meta Business Account Manager, tax refund lures, and remote access tools to steal credentials or deploy malware.\u003c/p\u003e\n\n\u003cp\u003eSeveral items focus on technical methods that avoid detection or abuse trusted systems. Researchers described Process Parameter Poisoning for stealthy code injection, a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service, and multiple flaws in Realtek’s RtsPer.sys driver that could expose kernel memory or allow physical memory access. Other reports covered GhostChrome-X modifying Chrome extension integrity metadata, fileless and steganographic Remcos delivery, and ransomware activity involving Interlock, Rhysida, WhiteLock, Prinz Eugen, Bumblebee, AdaptixC2, and Akira.\u003c/p\u003e\n\n\u003cp\u003eCloud and identity risks are a major theme across the roundup. Mandiant warned that manually rotated ADFS certificates can leave active signing keys exposed through Machine DPAPI, creating a risk of forged high-privilege SAML tokens, while AWS emphasized layered egress controls to reduce data exfiltration risk. Palo Alto Networks Unit 42 described cloud bucket hijacking, where deleting and recreating a globally unique bucket name under another account can reroute logs and sensitive data to an attacker-controlled environment.\u003c/p\u003e\n"},{"n":32,"title":"Winning 54% of the time","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/winning-54-of-the-time/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos reports that China-linked UAT-7810 is expanding covert Operational Relay Box networks by exploiting unpatched Ruckus and ASUS routers and deploying custom backdoors like LONGLEASH and DOGLEASH. Defenders should prioritize patching edge devices and monitoring for unusual proxying or unauthorized connections.","briefOverview":"\u003cp\u003eThe article opens with a commentary on the idea that cybersecurity defenders must be perfect, arguing instead that security work involves thousands of judgment calls rather than flawless performance. Using Roger Federer’s career statistic of winning 80% of matches while winning only 54% of total points, the author compares tennis to security operations. The point is that context, timing, and deciding when to attack, defend, or follow a hypothesis can matter more than being right every time.\u003c/p\u003e\n\n\u003cp\u003eThe main security item is Cisco Talos’ latest findings on the China-nexus threat actor UAT-7810, which is expanding its Operational Relay Box networks with a new suite of custom malware. The group exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy tools including upgraded LONGLEASH and DOGLEASH backdoors. Talos says UAT-7810 builds these covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eThe article says ORB networks create a major blind spot because they let secondary threat actors mask their origins and route malicious traffic through seemingly innocuous nodes. It warns that compromising edge devices like wireless routers helps create a highly evasive, decentralized proxy network that can bypass traditional perimeter defenses. The recommended actions are to fully patch edge devices, especially Ruckus and ASUS routers, monitor for unusual proxying behavior or unauthorized connections, and use the indicators of compromise in the Talos blog post.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos’ latest findings say the China-nexus threat actor UAT-7810 is expanding its Operational Relay Box networks with a new suite of custom malware.","UAT-7810 exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy tools including upgraded LONGLEASH and DOGLEASH backdoors.","The article says UAT-7810 builds covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets.","ORB networks can let secondary threat actors mask their origins and route malicious traffic through seemingly innocuous nodes.","Defenders are advised to patch edge devices, especially Ruckus and ASUS routers, monitor for unusual proxying behavior or unauthorized connections, and use the indicators of compromise in the Talos blog post."],"insights":["The article emphasizes that UAT-7810 relies on known, already disclosed vulnerabilities, making timely patching of edge devices a particularly direct way to reduce exposure.","Routers and similar edge devices are singled out as a detection opportunity because they typically lack complex services, so unusual proxying behavior or unauthorized connections may stand out.","The use of Operational Relay Box networks means defenders cannot rely only on where traffic appears to come from, because malicious activity may be routed through seemingly innocuous compromised devices.","The upgraded LONGLEASH and DOGLEASH backdoors indicate that UAT-7810 is actively investing in infrastructure designed to be resilient and difficult to dismantle."],"referencedReports":[],"body":"\u003cp\u003eThe article opens with a commentary on the idea that cybersecurity defenders must be perfect, arguing instead that security work involves thousands of judgment calls rather than flawless performance. Using Roger Federer’s career statistic of winning 80% of matches while winning only 54% of total points, the author compares tennis to security operations. The point is that context, timing, and deciding when to attack, defend, or follow a hypothesis can matter more than being right every time.\u003c/p\u003e\n\n\u003cp\u003eThe main security item is Cisco Talos’ latest findings on the China-nexus threat actor UAT-7810, which is expanding its Operational Relay Box networks with a new suite of custom malware. The group exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy tools including upgraded LONGLEASH and DOGLEASH backdoors. Talos says UAT-7810 builds these covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eThe article says ORB networks create a major blind spot because they let secondary threat actors mask their origins and route malicious traffic through seemingly innocuous nodes. It warns that compromising edge devices like wireless routers helps create a highly evasive, decentralized proxy network that can bypass traditional perimeter defenses. The recommended actions are to fully patch edge devices, especially Ruckus and ASUS routers, monitor for unusual proxying behavior or unauthorized connections, and use the indicators of compromise in the Talos blog post.\u003c/p\u003e\n"},{"n":33,"title":"WolfSSL, GeoVision, VTK vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/wolfssl-vulnerabilities/","time":"18:52","priority":"MAY READ","score":40,"tldr":"Cisco Talos disclosed and vendors patched multiple vulnerabilities across WolfSSL, GeoVision, and VTK-DICOM, including command injection, buffer overflow, privilege escalation, XSS, and authentication issues. Users should apply vendor updates and use the latest Snort rules to detect potential exploitation.","briefOverview":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed three vulnerabilities in WolfSSL, fourteen in GeoVision, and one vulnerability in VTK-DICOM. The vulnerabilities have been patched by their respective vendors in adherence to Cisco’s third-party vulnerability disclosure policy. Cisco Talos also notes that Snort coverage for detecting exploitation of these vulnerabilities is available through the latest rule sets from Snort.org.\u003c/p\u003e\n\n\u003cp\u003eThe WolfSSL vulnerabilities were discovered by Ankur Tyagi of Cisco Talos. WolfSSL is described as an open-source product that provides secure data transfer and aims to offer lightweight and embedded security solutions. Talos identified two improper input validation vulnerabilities, tracked as TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, tracked as TALOS-2026-2408.\u003c/p\u003e\n\n\u003cp\u003eThe GeoVision advisories cover 37 CVEs across 14 advisories, including memory corruption, OS command injection, buffer overflow, stack overflow, privilege escalation, reflected XSS, guessable session cookie, insufficient encryption, out-of-bounds read, and lack of authentication issues. GeoVision is described as specializing in security technologies such as cameras, monitoring solutions, access control, and machine identification. Talos also disclosed one VTK-DICOM issue, TALOS-2026-2366 and CVE-2026-22879, which is a heap-based buffer overflow vulnerability in software used to parse DICOM medical data for VTK users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos’ Vulnerability Discovery \u0026 Research team disclosed three vulnerabilities in WolfSSL, fourteen in GeoVision, and one vulnerability in VTK-DICOM.","The vulnerabilities discussed in the article have been patched by their respective vendors in accordance with Cisco’s third-party vulnerability disclosure policy.","The WolfSSL issues include two improper input validation vulnerabilities, TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, TALOS-2026-2408.","Talos released 14 advisories for GeoVision vulnerabilities covering 37 CVEs, including memory corruption, OS command injection, buffer overflow, privilege escalation, reflected XSS, insufficient encryption, out-of-bounds read, and lack of authentication issues.","Talos found one VTK-DICOM vulnerability, TALOS-2026-2366, identified as CVE-2026-22879, which is a heap-based buffer overflow vulnerability."],"insights":["The GeoVision disclosures are the broadest set in the article, with 14 advisories covering 37 CVEs across multiple issue types, indicating that GeoVision users have a larger patch-review burden than users of the other two products mentioned.","The article points to two separate response actions: apply the vendors’ patches and download the latest Snort rule sets for detection coverage.","The affected products span very different real-world environments, including secure data transfer, security cameras and monitoring systems, access control, machine identification, 3D rendering tools, and medical data parsing.","Several GeoVision advisories involve access-related weaknesses such as privilege escalation, guessable session cookies, insufficient encryption, and lack of authentication, not only memory-safety flaws."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed three vulnerabilities in WolfSSL, fourteen in GeoVision, and one vulnerability in VTK-DICOM. The vulnerabilities have been patched by their respective vendors in adherence to Cisco’s third-party vulnerability disclosure policy. Cisco Talos also notes that Snort coverage for detecting exploitation of these vulnerabilities is available through the latest rule sets from Snort.org.\u003c/p\u003e\n\n\u003cp\u003eThe WolfSSL vulnerabilities were discovered by Ankur Tyagi of Cisco Talos. WolfSSL is described as an open-source product that provides secure data transfer and aims to offer lightweight and embedded security solutions. Talos identified two improper input validation vulnerabilities, tracked as TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, tracked as TALOS-2026-2408.\u003c/p\u003e\n\n\u003cp\u003eThe GeoVision advisories cover 37 CVEs across 14 advisories, including memory corruption, OS command injection, buffer overflow, stack overflow, privilege escalation, reflected XSS, guessable session cookie, insufficient encryption, out-of-bounds read, and lack of authentication issues. GeoVision is described as specializing in security technologies such as cameras, monitoring solutions, access control, and machine identification. Talos also disclosed one VTK-DICOM issue, TALOS-2026-2366 and CVE-2026-22879, which is a heap-based buffer overflow vulnerability in software used to parse DICOM medical data for VTK users.\u003c/p\u003e\n"},{"n":3,"title":"The Hidden Security Risks of Reduced Summer IT Coverage","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-hidden-security-risks-of-reduced-summer-it-coverage/","time":"14:02","priority":"MAY READ","score":35,"tldr":"Reduced summer IT staffing gives attackers more time to exploit phishing, BEC, unpatched systems, and delayed responses. Organizations can reduce this risk by using automation, alert prioritization, continuous monitoring, and predefined response workflows to maintain coverage when key staff are away.","briefOverview":"\u003cp\u003eThe article argues that summer vacation periods create security risks because IT and security teams often operate with reduced staffing while attackers continue looking for opportunities. It says cybercriminals exploit slower response times and reduced oversight, allowing suspicious activity to go unnoticed for longer. The article cites data indicating a 40% increase in cyberattacks during holiday periods, with summer months being particularly vulnerable.\u003c/p\u003e\n\n\u003cp\u003eThe article says lean staffing can make phishing and Business Email Compromise harder to detect and easier to act on, especially when approval chains are disrupted and key decision makers are out of the office. It also notes that attackers increasingly use AI to make phishing attacks more convincing and scalable, making traditional warning signs less reliable. If attackers succeed, delayed detection and response can increase dwell time, giving them more opportunity to steal credentials, access sensitive data, move laterally, or launch ransomware.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies heavy reliance on human availability as the broader problem, with alert fatigue, manual processes, and human-speed response creating bottlenecks during reduced coverage periods. It presents AI-driven automation, automated patching, intelligent alert prioritization, autonomous runbook execution, and continuous monitoring as ways to maintain protection when key staff are unavailable. It concludes that resilience is valuable year round because attackers also look for opportunities during other vacation and holiday periods.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybercriminals look for opportunities during summer vacation periods because redu
