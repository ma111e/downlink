<script type="application/json" id="dl-articles">[{"n":36,"title":"Injective npm Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","time":"16:42","priority":"MUST READ","score":94,"tldr":"Attackers compromised a trusted Injective Labs developer account and published backdoored npm packages that stole wallet seed phrases and private keys during wallet creation or loading. Anyone who installed the affected 1.20.21 packages should treat touched wallet secrets as exposed and rotate funds to new wallets.","briefOverview":"\u003cp\u003eOn July 8, 2026, attackers used access to a trusted developer\u0026rsquo;s account to add a backdoor to Injective Labs\u0026rsquo; official TypeScript SDK for the Injective blockchain. The malicious version, 1.20.21, was published across 18 related \u003ccode\u003e@injectivelabs\u003c/code\u003e npm packages and remained live for less than an hour before being pulled and fixed. Applications that installed any affected package during that window, or later used a cached copy, should treat any wallet secrets handled by those packages as exposed.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor was disguised as harmless key-derivation telemetry and was placed directly in \u003ccode\u003ePrivateKey.fromMnemonic()\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex()\u003c/code\u003e, the SDK entry points for turning wallet recovery phrases or raw private keys into signing keys. When those functions were called, the code captured the mnemonic or private key, batched the data briefly, base64-encoded it, and sent it to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network/\u003c/code\u003e. The data was carried in the \u003ccode\u003eX-Request-Id\u003c/code\u003e request header with an empty body and a \u003ccode\u003eContent-Type\u003c/code\u003e meant to resemble legitimate gRPC-Web traffic.\u003c/p\u003e\n\n\u003cp\u003eThe article says the malicious release came through the repository\u0026rsquo;s own GitHub Actions trusted-publishing workflow, with provenance pointing to a commit on \u003ccode\u003emaster\u003c/code\u003e authored under the existing maintainer identity \u003ccode\u003ethomasRalee\u003c/code\u003e. The 17 non-\u003ccode\u003esdk-ts\u003c/code\u003e packages did not contain the payload themselves, but they pinned the exact backdoored \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e dependency. A later revert removed the telemetry file and call sites, and clean version \u003ccode\u003e1.20.23\u003c/code\u003e was published across all 18 affected packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On July 8, 2026, attackers used access to a trusted developer's account to add a backdoor to Injective Labs' TypeScript SDK for the Injective blockchain.","The malicious code was disguised as key derivation telemetry and sent wallet recovery phrases or raw private keys to an attacker-controlled server when PrivateKey.fromMnemonic() or PrivateKey.fromHex() was called.","The malicious version 1.20.21 was published across 18 @injectivelabs packages, with 17 packages carrying risk because they pinned the backdoored @injectivelabs/sdk-ts dependency exactly.","The npm provenance for the malicious release pointed to a GitHub Actions trusted-publishing workflow from the InjectiveLabs/injective-ts repository, and the commits were authored under the existing maintainer identity thomasRalee.","Injective Labs removed the payload, deprecated version 1.20.21, and republished clean version 1.20.23 across all 18 affected packages about 49 minutes after the malicious packages went live."],"insights":["The attack did not require a stolen npm token because the malicious packages were published through the repository’s own GitHub Actions trusted-publishing workflow after code was pushed to master.","The exfiltration endpoint was hidden as a character-code array and made to resemble legitimate Injective gRPC-Web infrastructure, which would make simple source searches for URLs less effective.","The stolen wallet secrets were sent in the X-Request-Id header with an empty body, so defenders would need to inspect headers in egress or proxy logs rather than only request bodies.","The 17 related packages did not contain the payload themselves but still created exposure because they pinned the exact malicious @injectivelabs/sdk-ts version.","Because the malicious code ran only when wallet keys were created or loaded, affected users must treat any wallet secrets touched by applications using the tainted package as exposed, not merely remove the package."],"referencedReports":[],"body":"\u003cp\u003eOn July 8, 2026, attackers used access to a trusted developer\u0026rsquo;s account to add a backdoor to Injective Labs\u0026rsquo; official TypeScript SDK for the Injective blockchain. The malicious version, 1.20.21, was published across 18 related \u003ccode\u003e@injectivelabs\u003c/code\u003e npm packages and remained live for less than an hour before being pulled and fixed. Applications that installed any affected package during that window, or later used a cached copy, should treat any wallet secrets handled by those packages as exposed.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor was disguised as harmless key-derivation telemetry and was placed directly in \u003ccode\u003ePrivateKey.fromMnemonic()\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex()\u003c/code\u003e, the SDK entry points for turning wallet recovery phrases or raw private keys into signing keys. When those functions were called, the code captured the mnemonic or private key, batched the data briefly, base64-encoded it, and sent it to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network/\u003c/code\u003e. The data was carried in the \u003ccode\u003eX-Request-Id\u003c/code\u003e request header with an empty body and a \u003ccode\u003eContent-Type\u003c/code\u003e meant to resemble legitimate gRPC-Web traffic.\u003c/p\u003e\n\n\u003cp\u003eThe article says the malicious release came through the repository\u0026rsquo;s own GitHub Actions trusted-publishing workflow, with provenance pointing to a commit on \u003ccode\u003emaster\u003c/code\u003e authored under the existing maintainer identity \u003ccode\u003ethomasRalee\u003c/code\u003e. The 17 non-\u003ccode\u003esdk-ts\u003c/code\u003e packages did not contain the payload themselves, but they pinned the exact backdoored \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e dependency. A later revert removed the telemetry file and call sites, and clean version \u003ccode\u003e1.20.23\u003c/code\u003e was published across all 18 affected packages.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft patches RoguePlanet Defender zero-day vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-rogueplanet-defender-zero-day-vulnerability/","time":"05:42","priority":"MUST READ","score":93,"tldr":"Microsoft has patched the RoguePlanet zero-day in Microsoft Defender, tracked as CVE-2026-50656, via a Malware Protection Engine update. The flaw could let attackers gain SYSTEM privileges on fully patched Windows 10 and 11 systems using a race condition exploit.","briefOverview":"\u003cp\u003eMicrosoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656. The flaw was disclosed after the June 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse. The researcher also shared a proof-of-concept exploit in a self-hosted Git repository, saying Microsoft had previously removed their exploit repositories from GitHub and GitLab.\u003c/p\u003e\n\n\u003cp\u003eNightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to open a command prompt with SYSTEM privileges. The researcher described the exploit as a race condition, with success varying by machine, and said the proof of concept works whether real-time protection is on or off. Microsoft confirmed on June 16 that it was working on a patch, but the article says the company had not acknowledged Nightmare Eclipse as the discoverer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft addressed the vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008, which powers Microsoft security solutions and services. Microsoft said the update fixes the issue identified as CVE-2026-50656 and pointed users to its FAQ for checking whether the new version is installed. The article also notes that Nightmare Eclipse has disclosed several other Windows zero-days in recent months, including issues affecting Microsoft Defender, BitLocker, and other Windows components.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656.","The vulnerability was disclosed by a security researcher using the handle Nightmare Eclipse, who also shared a proof-of-concept exploit in a self-hosted Git repository.","Nightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to spawn a command prompt with SYSTEM privileges via a Microsoft Defender race condition.","Microsoft addressed the RoguePlanet vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008.","Nightmare Eclipse has disclosed multiple other Windows zero-day exploits in recent months, including flaws affecting Microsoft Defender, BitLocker, and other Windows components."],"insights":["The fix for RoguePlanet was delivered through the Microsoft Malware Protection Engine rather than the regular Patch Tuesday Windows update process, so checking the engine version is the relevant way to confirm remediation.","The proof-of-concept exploit was reported to work whether Microsoft Defender real-time protection was enabled or disabled, according to Nightmare Eclipse.","The exploit’s reliability varied by machine, with Nightmare Eclipse saying it reached 100% success on some systems while struggling on others.","Microsoft confirmed it was working on a patch before releasing the engine update, but the article says it had not acknowledged Nightmare Eclipse as the discoverer of the vulnerability.","The RoguePlanet disclosure is part of a broader pattern in which Nightmare Eclipse has publicly released multiple Windows zero-days during a dispute with Microsoft over bug bounty and disclosure practices."],"referencedReports":[{"title":"CVE-2026-50656","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-50656","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the RoguePlanet Defender zero-day and the Malware Protection Engine update that addresses it.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released a security patch for a Microsoft Defender zero-day vulnerability known as RoguePlanet, tracked as CVE-2026-50656. The flaw was disclosed after the June 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse. The researcher also shared a proof-of-concept exploit in a self-hosted Git repository, saying Microsoft had previously removed their exploit repositories from GitHub and GitLab.\u003c/p\u003e\n\n\u003cp\u003eNightmare Eclipse said RoguePlanet affects fully patched Windows 10 and Windows 11 devices and can allow attackers to open a command prompt with SYSTEM privileges. The researcher described the exploit as a race condition, with success varying by machine, and said the proof of concept works whether real-time protection is on or off. Microsoft confirmed on June 16 that it was working on a patch, but the article says the company had not acknowledged Nightmare Eclipse as the discoverer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft addressed the vulnerability by releasing Microsoft Malware Protection Engine version 1.1.26060.3008, which powers Microsoft security solutions and services. Microsoft said the update fixes the issue identified as CVE-2026-50656 and pointed users to its FAQ for checking whether the new version is installed. The article also notes that Nightmare Eclipse has disclosed several other Windows zero-days in recent months, including issues affecting Microsoft Defender, BitLocker, and other Windows components.\u003c/p\u003e\n"},{"n":7,"title":"AssuranceAmerica data breach exposes records of 6.9 million drivers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/assuranceamerica-data-breach-exposes-records-of-69-million-drivers/","time":"07:47","priority":"MUST READ","score":92,"tldr":"AssuranceAmerica disclosed a data breach affecting nearly 7 million drivers after attackers accessed its IT systems and stole files containing personal, policy, vehicle, claims, and driver’s license information. The company says it has contained the intrusion, strengthened security measures, and is notifying affected individuals.","briefOverview":"\u003cp\u003eAssuranceAmerica disclosed a data breach affecting 6,998,886 people after attackers gained access to its systems earlier this year. The American insurance company provides auto, renters, and commercial auto insurance across 14 U.S. states through more than 9,500 independent agents. The breach was revealed in a filing with Maine\u0026rsquo;s Office of the Attorney General, though the company had not yet published a press release about the incident.\u003c/p\u003e\n\n\u003cp\u003eAssuranceAmerica detected suspicious activity on March 17, 2026, and said the activity appeared to result from malicious activity on March 16, 2026, that targeted one of its employees. The company determined that an unauthorized third party accessed certain portions of its IT environment and copied certain data files. Its review of the affected files was completed on June 15, 2026, and notification letters were scheduled to be sent to affected people on Friday.\u003c/p\u003e\n\n\u003cp\u003eThe stolen documents contained combinations of names, contact information, automobile insurance policy or account information, driver or vehicle information, claims-related information, and driver\u0026rsquo;s license numbers. AssuranceAmerica said it disabled compromised credentials, ended unauthorized sessions, isolated affected systems, notified law enforcement, reset passwords, deployed enhanced monitoring and threat detection tools, and provided additional cybersecurity instruction to personnel. The company advised affected customers to review credit reports, bank accounts, and other financial statements, and to alert their financial institution if they detect suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AssuranceAmerica disclosed in a filing with Maine's Office of the Attorney General that a data breach exposed information belonging to 6,998,886 people.","AssuranceAmerica detected suspicious activity on March 17, 2026, and determined that malicious activity on March 16, 2026 targeted one of its employees.","The company said an unauthorized third party accessed parts of its IT environment and copied certain data files.","The stolen documents contained combinations of names, contact information, automobile insurance policy or account information, driver or vehicle information, claims-related information, and driver's license numbers.","AssuranceAmerica said it disabled compromised credentials and unauthorized sessions, isolated affected systems, notified law enforcement, reset passwords, deployed enhanced monitoring and threat detection tools, and provided additional cybersecurity instruction to personnel."],"insights":["A single targeted incident involving one employee led to exposure of records for nearly 7 million people, showing the scale of data accessible from the affected company systems.","The breach was detected on March 17, 2026, but AssuranceAmerica said notice is being sent only after the file review was completed on June 15, 2026, indicating that determining whose information was affected took about three months.","The incident became public through a filing with Maine's Office of the Attorney General even though AssuranceAmerica had not yet published a press release about it.","The stolen files combined identity, contact, insurance, vehicle, claims, and driver's license information, giving affected people multiple types of records to monitor for suspicious activity."],"referencedReports":[],"body":"\u003cp\u003eAssuranceAmerica disclosed a data breach affecting 6,998,886 people after attackers gained access to its systems earlier this year. The American insurance company provides auto, renters, and commercial auto insurance across 14 U.S. states through more than 9,500 independent agents. The breach was revealed in a filing with Maine\u0026rsquo;s Office of the Attorney General, though the company had not yet published a press release about the incident.\u003c/p\u003e\n\n\u003cp\u003eAssuranceAmerica detected suspicious activity on March 17, 2026, and said the activity appeared to result from malicious activity on March 16, 2026, that targeted one of its employees. The company determined that an unauthorized third party accessed certain portions of its IT environment and copied certain data files. Its review of the affected files was completed on June 15, 2026, and notification letters were scheduled to be sent to affected people on Friday.\u003c/p\u003e\n\n\u003cp\u003eThe stolen documents contained combinations of names, contact information, automobile insurance policy or account information, driver or vehicle information, claims-related information, and driver\u0026rsquo;s license numbers. AssuranceAmerica said it disabled compromised credentials, ended unauthorized sessions, isolated affected systems, notified law enforcement, reset passwords, deployed enhanced monitoring and threat detection tools, and provided additional cybersecurity instruction to personnel. The company advised affected customers to review credit reports, bank accounts, and other financial statements, and to alert their financial institution if they detect suspicious activity.\u003c/p\u003e\n"},{"n":18,"title":"Fake 7-Zip Installers Turn Devices Into Residential Proxy Nodes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fake-7-zip-installers-turn-devices-into.html","time":"04:01","priority":"MUST READ","score":92,"tldr":"Researchers say a China-based actor dubbed Lurking Lizard has used fake 7-Zip installers, lookalike domains, and other branded lures to turn victims’ devices into residential proxy nodes. The operation appears to be a full proxy-for-profit ecosystem, from infecting devices to marketing and selling access through fake proxy brands and review sites.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of a threat actor dubbed \u003cstrong\u003eLurking Lizard\u003c/strong\u003e that has operated an end-to-end malicious residential proxy business using more than 230 lookalike domains. Infoblox says the activity dates back to at least August 2022. One campaign observed earlier this year used a trojanized 7-Zip installer hosted on \u003ccode\u003e7zip[.]com\u003c/code\u003e to covertly recruit compromised devices as proxy nodes.\u003c/p\u003e\n\n\u003cp\u003eLurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has also run fake independent review sites to drive traffic to its scam storefronts. WHOIS analysis and infrastructure fingerprinting suggest the actor is based in China. The operation also used popular VPNs and services like HeroSMS as decoys to distribute proxy malware.\u003c/p\u003e\n\n\u003cp\u003eThe campaign evolved to use WireVPN branding and target users across Android, macOS, and Windows, including an Android app called “wirevpn - Fast Unlimited Proxy” that has more than 1 million downloads. The article says it is unclear whether the same proxy-node functionality is present in the mobile applications or limited to desktop applications. The broader impact is that compromised home devices can be used to funnel unauthorized third-party traffic, creating risks for device owners whose home IP addresses may be associated with suspicious or blocked activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers disclosed a threat actor dubbed Lurking Lizard that has operated an end-to-end malicious residential proxy business using more than 230 lookalike domains.","A campaign observed earlier this year used a trojanized 7-Zip installer hosted on 7zip[.]com to covertly recruit compromised devices as proxy nodes.","Lurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has run fake independent review sites to drive traffic to its scam storefronts.","WHOIS analysis and infrastructure fingerprinting suggest that Lurking Lizard is a China-based actor, and the scheme has also used popular VPNs and services like HeroSMS as decoys to distribute proxy malware.","Google recently announced that it had significantly degraded the NetNut residential proxy network, which turned at least 2 million devices such as smart TVs and streaming boxes into conduits for unauthorized network traffic."],"insights":["Lurking Lizard’s use of drop-catching means expired domains with existing reputation can become distribution points for malicious installers, making domain history itself a potential trust risk.","The actor benefited from user confusion around a commonly mistyped or incorrectly referenced domain, using 7zip[.]com instead of the legitimate 7-zip[.]org to lure victims.","A single embedded IPLogger URL tied the 7-Zip campaign to fake installers for multiple brands, showing that small tracking artifacts can reveal shared infrastructure across otherwise separate-looking campaigns.","The operation did not stop at infecting devices; it also included fake proxy brands and fake independent review sites, indicating that the actor managed both victim acquisition and customer-facing monetization.","Proxyway found that 773,087 SmartProxy-linked IP addresses overlapped with a public IPIDEA dataset, suggesting infrastructure relationships between proxy services can expose connections in the residential proxy ecosystem."],"referencedReports":[{"title":"Fake Installers, Fake Reviews, Fake Services: Real Proxies, Real Victims","url":"https://www.infoblox.com/blog/threat-intelligence/fake-installers-fake-reviews-fake-services-real-proxies-real-victims/","publisher":"Infoblox","context":"The article cites Infoblox’s disclosure of Lurking Lizard and its malicious residential proxy operation using more than 230 lookalike domains.","category":"","primary":false},{"title":"Fake 7-Zip downloads are turning home PCs into proxy nodes","url":"https://www.malwarebytes.com/blog/threat-intel/2026/02/fake-7-zip-downloads-are-turning-home-pcs-into-proxy-nodes","publisher":"Malwarebytes","context":"The article references Malwarebytes’ earlier observation of a campaign using a trojanized 7-Zip installer hosted on 7zip[.]com.","category":"","primary":false},{"title":"We Tested Smartproxy’s IP Pool: Findings","url":"https://proxyway.com/research/we-tested-smartproxyorg-ip-pool-findings","publisher":"Proxyway","context":"The article cites Proxyway’s findings that 773,087 SmartProxy-linked IP addresses overlapped with a public IPIDEA dataset.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of a threat actor dubbed \u003cstrong\u003eLurking Lizard\u003c/strong\u003e that has operated an end-to-end malicious residential proxy business using more than 230 lookalike domains. Infoblox says the activity dates back to at least August 2022. One campaign observed earlier this year used a trojanized 7-Zip installer hosted on \u003ccode\u003e7zip[.]com\u003c/code\u003e to covertly recruit compromised devices as proxy nodes.\u003c/p\u003e\n\n\u003cp\u003eLurking Lizard has impersonated major proxy providers including IPIDEA, SmartProxy, IP Royal, and 911Proxy, and has also run fake independent review sites to drive traffic to its scam storefronts. WHOIS analysis and infrastructure fingerprinting suggest the actor is based in China. The operation also used popular VPNs and services like HeroSMS as decoys to distribute proxy malware.\u003c/p\u003e\n\n\u003cp\u003eThe campaign evolved to use WireVPN branding and target users across Android, macOS, and Windows, including an Android app called “wirevpn - Fast Unlimited Proxy” that has more than 1 million downloads. The article says it is unclear whether the same proxy-node functionality is present in the mobile applications or limited to desktop applications. The broader impact is that compromised home devices can be used to funnel unauthorized third-party traffic, creating risks for device owners whose home IP addresses may be associated with suspicious or blocked activity.\u003c/p\u003e\n"},{"n":23,"title":"GodDamn Ransomware Uses PoisonX Driver to Disable Endpoint Defenses","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/goddamn-ransomware-uses-poisonx-driver.html","time":"10:43","priority":"MUST READ","score":92,"tldr":"The new GodDamn ransomware, believed to be a rebrand of Beast/Monster, is using the Microsoft-signed PoisonX kernel driver in BYOVD attacks to disable endpoint security tools before encryption. Recent attacks also involved AnyDesk for remote access, NirSoft-based credential theft, PsExec lateral movement, and persistent AnyDesk deployment across hosts.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a new ransomware family called \u003cstrong\u003eGodDamn\u003c/strong\u003e that uses the PoisonX kernel driver to disable security software as part of its defense evasion strategy. Symantec’s Threat Hunter Team said the ransomware was first publicly spotted in the wild on May 21, 2026. The company assesses GodDamn to be a rebrand of Beast ransomware, which was itself an enhanced version of Monster, and tracks the developer behind these families as Hyadina.\u003c/p\u003e\n\n\u003cp\u003eIn an early June 2026 attack, the operators used AnyDesk for remote access and a NirSoft-based credential harvesting toolkit before deploying the ransomware. The toolkit was designed to extract sensitive data from browsers, Windows Credential Manager, cached domain credentials, VNC sessions, email clients, Wi-Fi profiles, and live network traffic. The attackers also used a user-mode defense evasion tool disguised as a Symantec product, named \u003ccode\u003esymantec.exe\u003c/code\u003e, together with the PoisonX driver, named \u003ccode\u003eg11.sys\u003c/code\u003e, in a bring-your-own-vulnerable-driver attack.\u003c/p\u003e\n\n\u003cp\u003eSymantec said PoisonX appears to be unusual because it looks like a malicious driver that its developers succeeded in getting signed by Microsoft. The attack also involved PsExec for lateral movement and repeated AnyDesk deployment across at least 10 hosts, with AnyDesk registered as an auto-start Windows service to survive reboots. GodDamn was later detected on June 3 on a separate network segment, and CYFIRMA reported that the ransom note instructed victims to contact the attackers by email or the qTox encrypted messaging app.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers identified a new ransomware family called GodDamn that uses the PoisonX kernel driver to disable security software as part of its defense evasion strategy.","Symantec assesses GodDamn to be a rebrand of Beast ransomware, which was an enhanced version of the Delphi-based Monster ransomware, and tracks the developer behind these families as Hyadina.","In an early June 2026 attack, the threat actors used AnyDesk for remote access, a NirSoft-based credential harvesting toolkit, PsExec for lateral movement, and a tool masquerading as symantec.exe alongside the PoisonX driver g11.sys.","Symantec said PoisonX appears to be a malicious driver that its developers succeeded in getting signed by Microsoft, and it is now being used by ransomware attackers.","GodDamn was first detected on June 3 on a separate network segment associated with a distinct organizational unit, where it renamed files using the victim’s name as the extension instead of the .God8Damn extension used in other Hyadina attacks."],"insights":["PoisonX is notable because Symantec says it appears to be a malicious driver that was nevertheless signed by Microsoft, making it different from typical bring-your-own-vulnerable-driver attacks that rely on flawed but otherwise legitimate drivers.","GodDamn’s operators used a reusable-looking AnyDesk deployment process across at least 10 hosts, including installation as an auto-start Windows service, showing that remote access persistence was built into the intrusion before ransomware execution.","The same PoisonX driver has been adopted by The Gentlemen ransomware-as-a-service operation in its GentleKiller tool, indicating that this driver is being reused across more than one ransomware ecosystem.","In the observed attack, GodDamn used the victim’s name as the encrypted file extension rather than the .God8Damn extension seen in other Hyadina attacks, showing that file-renaming behavior may vary by victim or operation."],"referencedReports":[{"title":"GodDamn Ransomware Beast Rebrand","url":"https://www.security.com/threat-intelligence/goddamn-ransomware-beast-rebrand","publisher":"Symantec Threat Hunter Team","context":"The article says Symantec published a new report identifying GodDamn ransomware and assessing it as a Beast ransomware rebrand.","category":"","primary":false},{"title":"BYOVD Vulnerable Drivers","url":"https://www.security.com/threat-intelligence/byovd-vulnerable-drivers","publisher":"Broadcom","context":"The article cites Broadcom's prior analysis explaining how attackers abuse signed vulnerable drivers to disable endpoint defenses.","category":"","primary":false},{"title":"Weekly Intelligence Report - 19 Jun 2026","url":"https://www.cyfirma.com/news/weekly-intelligence-report-19-jun-2026/","publisher":"CYFIRMA","context":"The article cites CYFIRMA's report for details about the ransom note instructing victims to contact the attackers by email or qTox.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a new ransomware family called \u003cstrong\u003eGodDamn\u003c/strong\u003e that uses the PoisonX kernel driver to disable security software as part of its defense evasion strategy. Symantec’s Threat Hunter Team said the ransomware was first publicly spotted in the wild on May 21, 2026. The company assesses GodDamn to be a rebrand of Beast ransomware, which was itself an enhanced version of Monster, and tracks the developer behind these families as Hyadina.\u003c/p\u003e\n\n\u003cp\u003eIn an early June 2026 attack, the operators used AnyDesk for remote access and a NirSoft-based credential harvesting toolkit before deploying the ransomware. The toolkit was designed to extract sensitive data from browsers, Windows Credential Manager, cached domain credentials, VNC sessions, email clients, Wi-Fi profiles, and live network traffic. The attackers also used a user-mode defense evasion tool disguised as a Symantec product, named \u003ccode\u003esymantec.exe\u003c/code\u003e, together with the PoisonX driver, named \u003ccode\u003eg11.sys\u003c/code\u003e, in a bring-your-own-vulnerable-driver attack.\u003c/p\u003e\n\n\u003cp\u003eSymantec said PoisonX appears to be unusual because it looks like a malicious driver that its developers succeeded in getting signed by Microsoft. The attack also involved PsExec for lateral movement and repeated AnyDesk deployment across at least 10 hosts, with AnyDesk registered as an auto-start Windows service to survive reboots. GodDamn was later detected on June 3 on a separate network segment, and CYFIRMA reported that the ransom note instructed victims to contact the attackers by email or the qTox encrypted messaging app.\u003c/p\u003e\n"},{"n":1,"title":"New Helix vishing group emerges in SharePoint data theft attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/","time":"17:08","priority":"MUST READ","score":91,"tldr":"A new extortion group called Helix is using vishing, device-code phishing, and MFA abuse to take over Microsoft 365 accounts and steal SharePoint data. Researchers say its tactics and infrastructure overlap with ShinyHunters and the defunct BlackFile group, and recommend disabling device-code authentication where possible.","briefOverview":"\u003cp\u003eA new data-extortion group called Helix is using identity-focused tactics to steal data from SharePoint environments. The group begins with voice phishing, sometimes calling employees while impersonating their manager through the manager’s name or caller ID spoofing. The goal is to trick targets into device-code phishing schemes that give the attackers access to their accounts.\u003c/p\u003e\n\n\u003cp\u003eOnce inside, Helix operators quickly register a new multi-factor authenticator app for persistence, then browse and enumerate SharePoint before exfiltrating files. ReliaQuest researchers said the strongest technical fingerprint is automated SharePoint enumeration and collection from 179.43.185[.]230 using the \u003ccode\u003epython-requests/2.28.1\u003c/code\u003e user-agent. The stolen data is typically used to extort victim organizations by threatening publication unless a ransom is paid, or it is sold to other cybercriminals.\u003c/p\u003e\n\n\u003cp\u003eReliaQuest believes Helix may have emerged from the ShinyHunters and BlackFile data-extortion groups based on techniques and infrastructure, although it found no definitive connection. The researchers cited similarities including vishing, employee impersonation, Microsoft 365 targeting, SharePoint data theft, use of the NICENIC registrar, and an exfiltration IP in the same autonomous system as a confirmed BlackFile IP address. ReliaQuest recommends disabling device code authentication where possible, restricting SharePoint access to managed devices, and blocking exchanges with newly registered domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new data-extortion group called Helix is using voice phishing, device code phishing, and multi-factor authentication abuse to steal data from SharePoint environments.","Helix operators have impersonated employees’ managers by using the manager’s name or caller ID spoofing to trick targets into device-code phishing schemes.","After gaining access, Helix operators register a new multi-factor authenticator app, enumerate SharePoint, and exfiltrate files.","ReliaQuest researchers identified Helix’s strongest technical fingerprint as automated SharePoint enumeration and collection from 179.43.185[.]230 using the python-requests/2.28.1 user-agent.","ReliaQuest believes Helix may be linked to ShinyHunters and BlackFile based on similar techniques and infrastructure, but did not find a definitive connection."],"insights":["ReliaQuest identified Helix’s most reliable fingerprint as its SharePoint enumeration and bulk-download pattern, specifically activity from 179.43.185[.]230 using the python-requests/2.28.1 user-agent.","The highest-impact defensive measure recommended by ReliaQuest is disabling device code authentication where possible.","Helix appears to rely on persistence through registering a new multi-factor authenticator app immediately after gaining account access.","ReliaQuest noted that one Helix exfiltration IP address was in the same autonomous system, AS 51852, as a confirmed BlackFile IP address, suggesting possible shared resources.","Blocking exchanges with newly registered domains is specifically recommended because Helix typically uses such domains in its attacks."],"referencedReports":[{"title":"Threat Spotlight: Helix, New Name in Data Extortion Ecosystem","url":"https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem","publisher":"ReliaQuest","context":"The article cites ReliaQuest researchers’ analysis of Helix’s SharePoint enumeration behavior, infrastructure, and possible links to ShinyHunters and BlackFile.","category":"","primary":false}],"body":"\u003cp\u003eA new data-extortion group called Helix is using identity-focused tactics to steal data from SharePoint environments. The group begins with voice phishing, sometimes calling employees while impersonating their manager through the manager’s name or caller ID spoofing. The goal is to trick targets into device-code phishing schemes that give the attackers access to their accounts.\u003c/p\u003e\n\n\u003cp\u003eOnce inside, Helix operators quickly register a new multi-factor authenticator app for persistence, then browse and enumerate SharePoint before exfiltrating files. ReliaQuest researchers said the strongest technical fingerprint is automated SharePoint enumeration and collection from 179.43.185[.]230 using the \u003ccode\u003epython-requests/2.28.1\u003c/code\u003e user-agent. The stolen data is typically used to extort victim organizations by threatening publication unless a ransom is paid, or it is sold to other cybercriminals.\u003c/p\u003e\n\n\u003cp\u003eReliaQuest believes Helix may have emerged from the ShinyHunters and BlackFile data-extortion groups based on techniques and infrastructure, although it found no definitive connection. The researchers cited similarities including vishing, employee impersonation, Microsoft 365 targeting, SharePoint data theft, use of the NICENIC registrar, and an exfiltration IP in the same autonomous system as a confirmed BlackFile IP address. ReliaQuest recommends disabling device code authentication where possible, restricting SharePoint access to managed devices, and blocking exchanges with newly registered domains.\u003c/p\u003e\n"},{"n":17,"title":"Microsoft Patches RoguePlanet Defender Flaw That Can Grant SYSTEM Privileges","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-patches-rogueplanet-defender.html","time":"08:48","priority":"SHOULD READ","score":88,"tldr":"Microsoft patched the RoguePlanet flaw in its Malware Protection Engine, a Defender privilege-escalation vulnerability that could let attackers gain SYSTEM-level access on fully updated Windows systems. The fix is included in engine version 1.1.26060.3008 and should install automatically for most users.","briefOverview":"\u003cp\u003eMicrosoft has released security updates for a Defender vulnerability known as RoguePlanet nearly a month after details of the flaw became public. The vulnerability is tracked as CVE-2026-50656 and has a CVSS score of 7.8. Microsoft said the issue has been remediated in Microsoft Malware Protection Engine version 1.1.26060.3008, along with defense-in-depth updates to harden unspecified security-related features.\u003c/p\u003e\n\n\u003cp\u003eRoguePlanet is a privilege escalation issue in the Microsoft Malware Protection Engine, \u0026ldquo;mpengine.dll,\u0026rdquo; which provides scanning, detection, and cleaning capabilities for Microsoft antivirus and antispyware software. Security researcher Chaotic Eclipse described it as a race condition that could be abused to spawn a shell with SYSTEM-level privileges, allowing arbitrary code execution or unauthorized actions. The exploit was found to work on systems running up-to-date versions of Windows with the June 2026 Patch Tuesday updates installed, and the researcher said it worked regardless of whether real-time protection was enabled.\u003c/p\u003e\n\n\u003cp\u003eRoguePlanet is the fourth Defender vulnerability disclosed by Chaotic Eclipse after BlueHammer, UnDefend, and RedSun, all of which Microsoft has since patched. Microsoft said no customer action is required to install the update for CVE-2026-50656 because its antimalware software is frequently updated to protect customers against new and evolving threats. The company said enterprise and end-user default configurations help keep malware definitions and the Microsoft Malware Protection Engine updated automatically.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released security updates for the Defender vulnerability known as RoguePlanet nearly a month after details of the flaw became public.","RoguePlanet is tracked as CVE-2026-50656 and is a privilege escalation issue in the Microsoft Malware Protection Engine, mpengine.dll.","Microsoft remediated the issue in Microsoft Malware Protection Engine version 1.1.26060.3008 and included defense-in-depth updates to harden unspecified security-related features.","Security researcher Chaotic Eclipse described RoguePlanet as a race condition that could be abused to spawn a shell with SYSTEM-level privileges and allow arbitrary code execution or unauthorized actions.","Microsoft said no customer action is required to install the update because its antimalware software is frequently updated automatically."],"insights":["The exploit reportedly worked on fully updated Windows systems with the June 2026 Patch Tuesday updates installed, showing that normal monthly patching had not addressed this Defender issue before the engine update.","Chaotic Eclipse said the exploit worked whether Defender real-time protection was enabled or disabled, so turning off real-time protection was not described as a workaround.","Microsoft’s fix was delivered through the Malware Protection Engine update mechanism rather than requiring customer action, making engine version verification the clearest way to confirm remediation.","RoguePlanet was the fourth Defender vulnerability disclosed by the same researcher after BlueHammer, UnDefend, and RedSun, all of which Microsoft has since patched."],"referencedReports":[{"title":"CVE-2026-50656","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-50656","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the RoguePlanet Defender privilege escalation vulnerability and its remediation details.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft has released security updates for a Defender vulnerability known as RoguePlanet nearly a month after details of the flaw became public. The vulnerability is tracked as CVE-2026-50656 and has a CVSS score of 7.8. Microsoft said the issue has been remediated in Microsoft Malware Protection Engine version 1.1.26060.3008, along with defense-in-depth updates to harden unspecified security-related features.\u003c/p\u003e\n\n\u003cp\u003eRoguePlanet is a privilege escalation issue in the Microsoft Malware Protection Engine, \u0026ldquo;mpengine.dll,\u0026rdquo; which provides scanning, detection, and cleaning capabilities for Microsoft antivirus and antispyware software. Security researcher Chaotic Eclipse described it as a race condition that could be abused to spawn a shell with SYSTEM-level privileges, allowing arbitrary code execution or unauthorized actions. The exploit was found to work on systems running up-to-date versions of Windows with the June 2026 Patch Tuesday updates installed, and the researcher said it worked regardless of whether real-time protection was enabled.\u003c/p\u003e\n\n\u003cp\u003eRoguePlanet is the fourth Defender vulnerability disclosed by Chaotic Eclipse after BlueHammer, UnDefend, and RedSun, all of which Microsoft has since patched. Microsoft said no customer action is required to install the update for CVE-2026-50656 because its antimalware software is frequently updated to protect customers against new and evolving threats. The company said enterprise and end-user default configurations help keep malware definitions and the Microsoft Malware Protection Engine updated automatically.\u003c/p\u003e\n"},{"n":26,"title":"Compromised @injectivelabs/sdk-ts exfiltrates wallet keys through fake telemetry","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys","time":"15:26","priority":"SHOULD READ","score":88,"tldr":"A malicious npm release of @injectivelabs/sdk-ts@1.20.21 stole wallet mnemonics and private keys during normal key derivation and exfiltrated them as fake gRPC telemetry. Anyone who used the affected Injective packages should upgrade to 1.20.23 and treat any exposed keys or seed phrases as compromised.","briefOverview":"\u003cp\u003eA malicious release of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e, version \u003ccode\u003e1.20.21\u003c/code\u003e, shipped code that recorded wallet mnemonics and private keys as they were derived and sent them to an attacker-controlled endpoint. The package receives around 50,000 weekly downloads, and the bad version was live on npm for under an hour on June 8, 2026. During that window, the attacker also republished the same version number across 17 other packages in the \u003ccode\u003e@injectivelabs\u003c/code\u003e scope, each pinned to the poisoned SDK.\u003c/p\u003e\n\n\u003cp\u003eThe stealer did not run at install time or break SDK behavior, but instead waited until an application called normal wallet key-derivation functions. It hooked \u003ccode\u003ePrivateKey.fromMnemonic\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex\u003c/code\u003e, capturing full seed phrases or raw private keys before legitimate derivation continued. The stolen data was queued, base64-encoded, and sent in the \u003ccode\u003eX-Request-Id\u003c/code\u003e header to \u003ccode\u003ehttps://testnet[.]archival[.]chain[.]grpc-web[.]injective[.]network/\u003c/code\u003e, using gRPC-web-looking headers to blend in with normal Injective traffic.\u003c/p\u003e\n\n\u003cp\u003eThe malicious version was downloaded 310 times before it was pulled, and the maintainer published a clean version, \u003ccode\u003e1.20.23\u003c/code\u003e, shortly after reverting the change. The article says the compromise appears to have come through commits from an established GitHub account, pointing to account takeover rather than a drive-by. Any mnemonic or private key that passed through the affected packages should be treated as exposed, with users advised to move funds, rotate keys and seed phrases, and upgrade affected \u003ccode\u003e@injectivelabs\u003c/code\u003e packages to \u003ccode\u003e1.20.23\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A malicious release of @injectivelabs/sdk-ts version 1.20.21 recorded wallet mnemonics and private keys during key derivation and sent them to an attacker-controlled endpoint.","The malicious package was live on npm for under an hour on June 8, 2026, before the maintainer noticed and published a clean fix.","The attacker also republished 17 other @injectivelabs packages at version 1.20.21 with hard dependency pins to the poisoned sdk-ts package, causing projects using those packages to pull it transitively.","The stealer disguised its exfiltration as gRPC-web telemetry by sending base64-encoded stolen data in the X-Request-Id header to testnet.archival.chain.grpc-web.injective.network.","Any mnemonic or private key that passed through the affected packages should be treated as exposed, and users are advised to move funds, rotate keys and seed phrases, and upgrade affected @injectivelabs packages to version 1.20.23."],"insights":["Install-time scanners and sandboxes that only monitor package lifecycle scripts could miss this compromise because the stealer did not run during installation and only activated when an application derived a wallet key during normal use.","Auditing only direct dependencies is insufficient in this incident because 17 related @injectivelabs packages were republished to pin the poisoned SDK as a transitive dependency.","The exfiltration was designed to blend into legitimate Injective application traffic by using a lookalike gRPC-web endpoint, the application/grpc-web+proto content type, and the X-Request-Id header instead of the request body.","The malicious code was limited to two build artifacts and differed from the clean build by one injected block and two hook lines, showing how a small change in release artifacts can create severe wallet compromise.","Deprecation alone did not fully contain the risk because the article says the malicious npm version remained downloadable and compromised GitHub release artifacts were still present at the time of the source report."],"referencedReports":[],"body":"\u003cp\u003eA malicious release of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e, version \u003ccode\u003e1.20.21\u003c/code\u003e, shipped code that recorded wallet mnemonics and private keys as they were derived and sent them to an attacker-controlled endpoint. The package receives around 50,000 weekly downloads, and the bad version was live on npm for under an hour on June 8, 2026. During that window, the attacker also republished the same version number across 17 other packages in the \u003ccode\u003e@injectivelabs\u003c/code\u003e scope, each pinned to the poisoned SDK.\u003c/p\u003e\n\n\u003cp\u003eThe stealer did not run at install time or break SDK behavior, but instead waited until an application called normal wallet key-derivation functions. It hooked \u003ccode\u003ePrivateKey.fromMnemonic\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex\u003c/code\u003e, capturing full seed phrases or raw private keys before legitimate derivation continued. The stolen data was queued, base64-encoded, and sent in the \u003ccode\u003eX-Request-Id\u003c/code\u003e header to \u003ccode\u003ehttps://testnet[.]archival[.]chain[.]grpc-web[.]injective[.]network/\u003c/code\u003e, using gRPC-web-looking headers to blend in with normal Injective traffic.\u003c/p\u003e\n\n\u003cp\u003eThe malicious version was downloaded 310 times before it was pulled, and the maintainer published a clean version, \u003ccode\u003e1.20.23\u003c/code\u003e, shortly after reverting the change. The article says the compromise appears to have come through commits from an established GitHub account, pointing to account takeover rather than a drive-by. Any mnemonic or private key that passed through the affected packages should be treated as exposed, with users advised to move funds, rotate keys and seed phrases, and upgrade affected \u003ccode\u003e@injectivelabs\u003c/code\u003e packages to \u003ccode\u003e1.20.23\u003c/code\u003e.\u003c/p\u003e\n"},{"n":34,"title":"Compromised Injective SDK npm Package Exfiltrates Wallet Keys and Mnemonics","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/compromised-injective-sdk-npm-package?utm_medium=feed","time":"13:32","priority":"SHOULD READ","score":88,"tldr":"A compromised @injectivelabs/sdk-ts npm release, version 1.20.21, secretly exfiltrated wallet mnemonics and private keys during normal SDK use, with 17 related @injectivelabs packages also pinned to the malicious version. Anyone who used these versions should upgrade to a clean release and treat any exposed keys or seed phrases as compromised.","briefOverview":"\u003cp\u003eSocket detected a malicious \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e release on npm that used fake telemetry functionality to exfiltrate wallet private keys and mnemonic phrases. The affected package is part of the Injective Labs TypeScript SDK and receives roughly 50,000 weekly downloads. The malicious functionality was introduced through commits from a GitHub account belonging to a developer with an established contribution history in the repository.\u003c/p\u003e\n\n\u003cp\u003eThe impact extended beyond direct users of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e because version \u003ccode\u003e1.20.21\u003c/code\u003e was also published across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages. Those packages depended on and pinned the malicious SDK version, exposing users who may not have installed the SDK directly. The compromised version was deprecated on npm but had not been removed at the time of writing, and related GitHub release artifacts were still present.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was located in \u003ccode\u003e/dist/esm/accounts-jQ1GSgaW.js\u003c/code\u003e and \u003ccode\u003e/dist/cjs/accounts-Cy0p4lLW.cjs\u003c/code\u003e, where the \u003ccode\u003efromMnemonic\u003c/code\u003e and \u003ccode\u003efromHex\u003c/code\u003e functions were hooked to call \u003ccode\u003etrackKeyDerivation\u003c/code\u003e. That function recorded the method used and the sensitive information needed to derive the key, then base64-encoded and sent the records through a POST request to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network\u003c/code\u003e. The article advises developers to move to clean version \u003ccode\u003e1.20.23\u003c/code\u003e, audit direct and transitive dependencies, and treat any private key or mnemonic passed through the affected packages as compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket detected a malicious @injectivelabs/sdk-ts@1.20.21 npm release that exfiltrated wallet private keys and mnemonic phrases through fake telemetry functionality.","The malicious code was introduced through commits from a GitHub account belonging to an established Injective Labs repository contributor, with suspicious activity starting on June 8, 2026.","The threat actor also published version 1.20.21 across 17 additional @injectivelabs scoped packages that depended on and pinned the malicious SDK version, exposing transitive users.","The malicious functionality hooked the fromMnemonic and fromHex functions and sent base64-encoded key material through a POST request to https://testnet.archival.chain.grpc-web.injective.network.","Developers are advised to move to clean version 1.20.23, audit direct and transitive @injectivelabs dependencies, and treat any private key or mnemonic phrase passed through the affected packages as compromised."],"insights":["Because the malicious code ran during normal wallet functions rather than at install time, projects could install the package without immediately triggering the theft behavior.","The exfiltration endpoint was an Injective Labs public infrastructure endpoint, which made the malicious network traffic appear similar to ordinary Injective software traffic.","Deprecation on npm did not remove the malicious version, so it remained downloadable even after being marked as compromised.","Auditing only direct dependencies is insufficient because the attacker published related @injectivelabs packages that pinned the compromised SDK version as a dependency.","The article states the malicious version had 310 downloads, suggesting the real-world impact was much smaller than the potential exposure from a package with about 50,000 weekly downloads."],"referencedReports":[],"body":"\u003cp\u003eSocket detected a malicious \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e release on npm that used fake telemetry functionality to exfiltrate wallet private keys and mnemonic phrases. The affected package is part of the Injective Labs TypeScript SDK and receives roughly 50,000 weekly downloads. The malicious functionality was introduced through commits from a GitHub account belonging to a developer with an established contribution history in the repository.\u003c/p\u003e\n\n\u003cp\u003eThe impact extended beyond direct users of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e because version \u003ccode\u003e1.20.21\u003c/code\u003e was also published across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages. Those packages depended on and pinned the malicious SDK version, exposing users who may not have installed the SDK directly. The compromised version was deprecated on npm but had not been removed at the time of writing, and related GitHub release artifacts were still present.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was located in \u003ccode\u003e/dist/esm/accounts-jQ1GSgaW.js\u003c/code\u003e and \u003ccode\u003e/dist/cjs/accounts-Cy0p4lLW.cjs\u003c/code\u003e, where the \u003ccode\u003efromMnemonic\u003c/code\u003e and \u003ccode\u003efromHex\u003c/code\u003e functions were hooked to call \u003ccode\u003etrackKeyDerivation\u003c/code\u003e. That function recorded the method used and the sensitive information needed to derive the key, then base64-encoded and sent the records through a POST request to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network\u003c/code\u003e. The article advises developers to move to clean version \u003ccode\u003e1.20.23\u003c/code\u003e, audit direct and transitive dependencies, and treat any private key or mnemonic passed through the affected packages as compromised.\u003c/p\u003e\n"},{"n":35,"title":"Fake Braintree NuGet Package Skims Credit Cards and Harvests Merchant Credentials","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/braintree-nuget-typosquat-skims-credit-cards?utm_medium=feed","time":"19:58","priority":"SHOULD READ","score":88,"tldr":"A malicious NuGet typosquat, Braintree.Net, impersonated PayPal Braintree’s official SDK while stealing live payment card data, Braintree merchant API keys, and host secrets through a companion DependencyInjector.Core package. Any organization that used the affected packages should remove them, rotate credentials, investigate possible card-data exposure, and block the attacker domain.","briefOverview":"\u003cp\u003eSocket’s AI scanner flagged a suspicious NuGet package, \u003ccode\u003eBraintree.Net\u003c/code\u003e, masquerading as the official PayPal Braintree .NET SDK, with the first malicious version published on July 3, 2026. The package copied the surface API, README content, metadata, and project URL of the legitimate Braintree library while using a different package name and version scheme. Socket’s Threat Research team found that affected versions routed stolen data to attacker-controlled infrastructure at \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package intercepted live payment card data and stole Braintree merchant API credentials when used in production. Its added \u003ccode\u003eCardOperationLogger\u003c/code\u003e hooked payment-related methods to send card numbers, CVVs, expiration dates, customer IDs, amounts, and related transaction details to \u003ccode\u003e/api/card\u003c/code\u003e. Its modified \u003ccode\u003eBraintreeGateway.PrivateKey\u003c/code\u003e setter sent the \u003ccode\u003emerchantId\u003c/code\u003e, \u003ccode\u003epublicKey\u003c/code\u003e, and \u003ccode\u003eprivateKey\u003c/code\u003e to \u003ccode\u003e/api/account\u003c/code\u003e when the gateway was configured for Braintree’s production environment.\u003c/p\u003e\n\n\u003cp\u003eStarting with \u003ccode\u003eBraintree.Net\u003c/code\u003e 3.36.0, the package also depended on \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, which used module initializers to run on assembly load and harvest environment variables, configuration files, cloud and container metadata, dependencies, and loaded assemblies. The article also identifies related affected packages, including \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, \u003ccode\u003eSipNet\u003c/code\u003e, and \u003ccode\u003eSipNet.OpenAI.Realtime\u003c/code\u003e, and notes that some were affected transitively. Recommended actions include removing \u003ccode\u003eBraintree.Net\u003c/code\u003e, replacing it with the official \u003ccode\u003eBraintree\u003c/code\u003e package, rotating Braintree credentials, treating production card data as potentially disclosed, auditing dependency graphs, blocking the attacker domain, and hunting for outbound POSTs to \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s AI scanner flagged a malicious NuGet package named Braintree.Net that masqueraded as PayPal Braintree’s official .NET SDK and routed stolen data to api.348672-shakepay[.]com.","Confirmed malicious Braintree.Net versions 3.35.8 through 3.36.1 intercepted live payment card data, including full card numbers, CVVs, expiration dates, customer IDs, amounts, operations, gateways, card types, and timestamps.","The typosquat stole Braintree merchant credentials by sending merchantId, publicKey, and privateKey values to the attacker endpoint when a production gateway was configured.","Starting with Braintree.Net 3.36.0, the package depended on DependencyInjector.Core, which used module initializers to collect environment variables, appsettings JSON contents, cloud and container metadata, dependencies, and loaded assemblies on assembly load.","Socket recommended removing Braintree.Net, replacing it with the official Braintree package, rotating Braintree merchant credentials, auditing for DependencyInjector.Core, SipNet, and SipNet.OpenAI.Realtime, and hunting for outbound POSTs to api.348672-shakepay[.]com."],"insights":["The package’s reported popularity was misleading: roughly 11 million of its approximately 14 million downloads came from 120 empty placeholder versions, while the confirmed malicious releases had only about 334 real installs.","The payment-card and merchant-credential theft paths activated only for Braintree production environments, which reduced the chance of discovery during sandbox or development testing.","The companion DependencyInjector.Core harvester ran on assembly load through module initializers, so victim applications could leak environment and configuration secrets without calling any malicious API directly.","The attacker used different hiding strategies for different payloads: the card and account theft endpoints were plaintext strings, while the broader analytics/report endpoint was XOR-obfuscated.","SipNet became malicious through a manifest-only dependency change for .NET 8, .NET 9, and .NET 10 targets, while its own DLL remained a clean recompile of SIPSorcery."],"referencedReports":[],"body":"\u003cp\u003eSocket’s AI scanner flagged a suspicious NuGet package, \u003ccode\u003eBraintree.Net\u003c/code\u003e, masquerading as the official PayPal Braintree .NET SDK, with the first malicious version published on July 3, 2026. The package copied the surface API, README content, metadata, and project URL of the legitimate Braintree library while using a different package name and version scheme. Socket’s Threat Research team found that affected versions routed stolen data to attacker-controlled infrastructure at \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package intercepted live payment card data and stole Braintree merchant API credentials when used in production. Its added \u003ccode\u003eCardOperationLogger\u003c/code\u003e hooked payment-related methods to send card numbers, CVVs, expiration dates, customer IDs, amounts, and related transaction details to \u003ccode\u003e/api/card\u003c/code\u003e. Its modified \u003ccode\u003eBraintreeGateway.PrivateKey\u003c/code\u003e setter sent the \u003ccode\u003emerchantId\u003c/code\u003e, \u003ccode\u003epublicKey\u003c/code\u003e, and \u003ccode\u003eprivateKey\u003c/code\u003e to \u003ccode\u003e/api/account\u003c/code\u003e when the gateway was configured for Braintree’s production environment.\u003c/p\u003e\n\n\u003cp\u003eStarting with \u003ccode\u003eBraintree.Net\u003c/code\u003e 3.36.0, the package also depended on \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, which used module initializers to run on assembly load and harvest environment variables, configuration files, cloud and container metadata, dependencies, and loaded assemblies. The article also identifies related affected packages, including \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, \u003ccode\u003eSipNet\u003c/code\u003e, and \u003ccode\u003eSipNet.OpenAI.Realtime\u003c/code\u003e, and notes that some were affected transitively. Recommended actions include removing \u003ccode\u003eBraintree.Net\u003c/code\u003e, replacing it with the official \u003ccode\u003eBraintree\u003c/code\u003e package, rotating Braintree credentials, treating production card data as potentially disclosed, auditing dependency graphs, blocking the attacker domain, and hunting for outbound POSTs to \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n"},{"n":5,"title":"Injective SDK on npm infected with cryptocurrency wallet stealer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/injective-sdk-on-npm-infected-with-cryptocurrency-wallet-stealer/","time":"20:10","priority":"SHOULD READ","score":85,"tldr":"Hackers compromised Injective Labs’ GitHub repository and published malicious npm packages that stole crypto wallet private keys and mnemonic seed phrases when developers used wallet key functions. A clean version has been released, but anyone who installed the malicious 1.20.21 package should move funds to new wallets and rotate secrets.","briefOverview":"\u003cp\u003eHackers compromised the Injective Labs SDK project’s GitHub repository and used it to publish a malicious version of the @injectivelabs/sdk-ts package on npm. The affected version, 1.20.21, stole cryptocurrency wallet private keys and mnemonic seed phrases. Socket, Ox Security, and StepSecurity detected the supply-chain attack, and Socket reported that the malicious version was downloaded 310 times before it was deprecated.\u003c/p\u003e\n\n\u003cp\u003eInjective SDK is a TypeScript/JavaScript software development kit for building applications on the Injective blockchain. The package has 50,000 weekly npm downloads and is used by developers building cryptocurrency wallets, trading bots, decentralized exchanges, DeFi applications, and payment tools. The attacker also published version 1.20.21 for another 17 project-associated packages, pinning all of them to the compromised SDK version.\u003c/p\u003e\n\n\u003cp\u003eThe malware activated when developers used SDK functions that generate or import wallet keys, rather than when the package was installed. It captured full mnemonic seed phrases and private keys, encoded the data in base64, queued multiple keys and mnemonics for two seconds, and sent them in an HTTP POST request header to an Injective Labs public infrastructure endpoint. The legitimate account owner reverted the changes within minutes and published a clean release, version 1.20.23, and developers who suspect compromise are advised to transfer cryptocurrency to new wallets and rotate all secrets in their environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers compromised a GitHub account belonging to a legitimate Injective Labs SDK project contributor and used it to publish malicious version 1.20.21 of the @injectivelabs/sdk-ts npm package.","The malicious package stole cryptocurrency wallet private keys and mnemonic seed phrases when developers used SDK functions that generate or import wallet keys.","The attacker also published version 1.20.21 for 17 other packages associated with the project, pinning all of them to the compromised SDK version.","Socket reported that the malicious package version was downloaded 310 times before it was deprecated, and Ox Security reported that 87 dependent packages had a cumulative download count of just over 112,000.","Developers who suspect compromise are advised to transfer their cryptocurrency to new wallets and rotate all secrets in their environment."],"insights":["The malicious code did not run at installation time, so checking only install scripts would not be enough to detect this compromise.","The stolen wallet data was sent to an Injective Labs public infrastructure endpoint, making the outbound traffic appear legitimate.","The malware queued multiple keys and mnemonics for two seconds and bundled them into an HTTP request header before sending them.","Although the malicious npm version was deprecated, Socket reported that it was not removed and the malicious GitHub release artifacts remained available."],"referencedReports":[{"title":"Compromised Injective SDK npm Package","url":"http://socket.dev/blog/compromised-injective-sdk-npm-package","publisher":"Socket","context":"The article cites Socket’s analysis for the number of downloads of the malicious package version before it was deprecated and for the status of the malicious GitHub release artifacts.","category":"","primary":false},{"title":"InjectiveLabs npm Package Hijacked Impacting 87 Dependent Packages","url":"https://www.ox.security/blog/injectivelabs-npm-package-hijacked-impacting-87-dependent-packages/","publisher":"Ox Security","context":"The article cites Ox Security’s report for the impact on 87 dependent packages and their cumulative download count.","category":"","primary":false},{"title":"Injective npm Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","url":"http://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","publisher":"StepSecurity","context":"The article cites StepSecurity’s analysis describing how the malware queued keys and mnemonics before sending them in an HTTP request header.","category":"","primary":false}],"body":"\u003cp\u003eHackers compromised the Injective Labs SDK project’s GitHub repository and used it to publish a malicious version of the @injectivelabs/sdk-ts package on npm. The affected version, 1.20.21, stole cryptocurrency wallet private keys and mnemonic seed phrases. Socket, Ox Security, and StepSecurity detected the supply-chain attack, and Socket reported that the malicious version was downloaded 310 times before it was deprecated.\u003c/p\u003e\n\n\u003cp\u003eInjective SDK is a TypeScript/JavaScript software development kit for building applications on the Injective blockchain. The package has 50,000 weekly npm downloads and is used by developers building cryptocurrency wallets, trading bots, decentralized exchanges, DeFi applications, and payment tools. The attacker also published version 1.20.21 for another 17 project-associated packages, pinning all of them to the compromised SDK version.\u003c/p\u003e\n\n\u003cp\u003eThe malware activated when developers used SDK functions that generate or import wallet keys, rather than when the package was installed. It captured full mnemonic seed phrases and private keys, encoded the data in base64, queued multiple keys and mnemonics for two seconds, and sent them in an HTTP POST request header to an Injective Labs public infrastructure endpoint. The legitimate account owner reverted the changes within minutes and published a clean release, version 1.20.23, and developers who suspect compromise are advised to transfer cryptocurrency to new wallets and rotate all secrets in their environment.\u003c/p\u003e\n"},{"n":20,"title":"GhostApproval Symlink Flaws Could Let Malicious Repos Run Code in AI Coding Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ghostapproval-symlink-flaws-could-let.html","time":"04:27","priority":"SHOULD READ","score":84,"tldr":"Wiz researchers found “GhostApproval,” a symlink flaw in several AI coding assistants that can make a malicious repository trick agents into writing to sensitive files like SSH keys or shell startup scripts while showing users a misleading approval prompt. Some vendors have patched, but users should update tools and avoid running agents on untrusted repositories without sandboxing or limited file access.","briefOverview":"\u003cp\u003eResearchers at Wiz found a flaw in six popular AI coding assistants that could let a malicious code project quietly take control of a developer’s computer. The affected tools are Amazon Q Developer, Anthropic’s Claude Code, Augment, Cursor, Google Antigravity, and Windsurf. Wiz calls the pattern GhostApproval and says it allows an assistant to ask permission to edit a harmless-looking file while the actual write lands on a sensitive file instead.\u003c/p\u003e\n\n\u003cp\u003eThe attack abuses symbolic links, which are files that point to other files elsewhere on disk. In Wiz’s example, a malicious repository used a file named project_settings.json that actually pointed to ~/.ssh/authorized_keys, so an instruction to add a line to the project file could add an attacker’s SSH key to the victim’s login file. Another version writes to ~/.zshrc, which can run commands the next time a terminal is opened, and Wiz said there is no sign the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eWiz reported the issue to all six vendors, and Amazon Q Developer, Cursor, and Google Antigravity have shipped fixes. Augment and Windsurf acknowledged the issue but had no fix at publication, while Anthropic disputed that Claude Code’s behavior is a bug and said current versions warn users about symlinks. Wiz recommends that tool makers resolve symlinks and show the real destination before approval, flag writes outside the project folder, and avoid touching disk until the user has actually approved.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wiz researchers found a flaw they call GhostApproval in six AI coding assistants: Amazon Q Developer, Anthropic's Claude Code, Augment, Cursor, Google Antigravity, and Windsurf.","The attack uses a symlink in a malicious repository so that an assistant asked to edit a harmless-looking file actually writes to a sensitive file such as ~/.ssh/authorized_keys or ~/.zshrc.","Wiz says the approval prompt can show the harmless file name instead of the real destination, creating an informed-consent bypass where the user approves an edit without seeing where it will actually land.","Amazon Q Developer, Cursor, and Google Antigravity have shipped fixes, Augment and Windsurf have acknowledged the issue without fixes yet, and Anthropic disputes that the Claude Code behavior is a bug.","Wiz recommends that tool makers resolve symlinks and show the real destination before approval, flag writes outside the project folder, and avoid writing to disk until the user has approved."],"insights":["The highest-risk tools are not necessarily the ones with no approval prompt; Windsurf showed Accept and Reject buttons only after writing the file to disk, making the prompt function as an undo mechanism rather than a true approval gate.","Wiz observed that Claude Code’s internal reasoning could identify the real symlink target while the developer-facing approval box still displayed only the harmless-looking path, showing a gap between what the agent knows and what it tells the user.","The issue affects files outside the project directory, so a developer may not see evidence of the change in git status and must check files such as shell startup files, SSH keys, and AI tool configuration separately.","Two independent research efforts, Wiz’s GhostApproval and Adversa AI’s SymJack, found the same symlink-and-approval pattern across multiple coding agents, indicating a shared design weakness rather than an isolated vendor mistake."],"referencedReports":[{"title":"GhostApproval: A Trust Boundary Gap in AI Coding Assistants","url":"https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants","publisher":"Wiz","context":"The article is based on Wiz's July 8 research describing the GhostApproval symlink-and-approval flaw in six AI coding assistants.","category":"","primary":false},{"title":"GHSA-3v8f-48vw-3mjx","url":"https://github.com/cursor/cursor/security/advisories/GHSA-3v8f-48vw-3mjx","publisher":"Cursor","context":"The article cites Cursor's advisory for CVE-2026-50549 as the fix notice for its symlink bug.","category":"","primary":false},{"title":"The approval prompt is lying to you: Symlink RCE in five AI Coding Agents","url":"https://adversa.ai/blog/the-approval-prompt-is-lying-to-you-symlink-rce-in-five-ai-coding-agents-claude-code-cursor-antigravity-copilot-grok-build/","publisher":"Adversa AI","context":"The article references Adversa AI's SymJack research as an independent finding of the same symlink-and-approval pattern against multiple coding agents.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Wiz found a flaw in six popular AI coding assistants that could let a malicious code project quietly take control of a developer’s computer. The affected tools are Amazon Q Developer, Anthropic’s Claude Code, Augment, Cursor, Google Antigravity, and Windsurf. Wiz calls the pattern GhostApproval and says it allows an assistant to ask permission to edit a harmless-looking file while the actual write lands on a sensitive file instead.\u003c/p\u003e\n\n\u003cp\u003eThe attack abuses symbolic links, which are files that point to other files elsewhere on disk. In Wiz’s example, a malicious repository used a file named project_settings.json that actually pointed to ~/.ssh/authorized_keys, so an instruction to add a line to the project file could add an attacker’s SSH key to the victim’s login file. Another version writes to ~/.zshrc, which can run commands the next time a terminal is opened, and Wiz said there is no sign the technique has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eWiz reported the issue to all six vendors, and Amazon Q Developer, Cursor, and Google Antigravity have shipped fixes. Augment and Windsurf acknowledged the issue but had no fix at publication, while Anthropic disputed that Claude Code’s behavior is a bug and said current versions warn users about symlinks. Wiz recommends that tool makers resolve symlinks and show the real destination before approval, flag writes outside the project folder, and avoid touching disk until the user has actually approved.\u003c/p\u003e\n"},{"n":24,"title":"New GigaWiper Windows Backdoor Bundles Disk Wiping, Fake Ransomware, and Spyware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-gigawiper-windows-backdoor-bundles.html","time":"18:08","priority":"SHOULD READ","score":84,"tldr":"Microsoft analyzed GigaWiper, a Windows backdoor also tracked as BLUERABBIT, that combines spying capabilities with multiple destructive options including disk wiping and fake ransomware that cannot be decrypted. Defenders should treat it as a post-compromise tool and prioritize early detection, blocking known command servers, and maintaining clean offline backups.","briefOverview":"\u003cp\u003eMicrosoft analyzed a destructive Windows backdoor it calls \u003cstrong\u003eGigaWiper\u003c/strong\u003e, which combines three older destructive programs into operator-selectable commands. The same malicious files are also tracked by Binary Defense as \u003cstrong\u003eBLUERABBIT\u003c/strong\u003e, with both vendors listing the same four hashes and matching command server
