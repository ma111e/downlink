<script type="application/json" id="dl-articles">[{"n":1,"title":"Pro-Russian hackers target European officials, offer rewards for personal information","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/hackers-russia-italy-noname","time":"13:15","priority":"SHOULD READ","score":84,"tldr":"Pro-Russian hacktivist group NoName057(16) published personal data of senior European officials and offered cryptocurrency rewards for further information on them and their families, apparently in retaliation for a 2025 international law-enforcement disruption. Italy is investigating the campaign, while G7 foreign ministers are considering joint responses to pro-Russian cyber threats.","briefOverview":"\u003cp\u003ePro-Russian hacktivist group NoName057(16) published personal information about 18 European politicians, law-enforcement officials, and journalists on a dedicated dark-web site. The information included phone numbers, email addresses, social-media accounts, and in some cases home addresses, while the group offered cryptocurrency rewards for additional details about targets and their relatives. Italian Foreign Minister Antonio Tajani said he and his family were being targeted for intimidation connected to Italy’s support for Ukraine.\u003c/p\u003e\n\n\u003cp\u003eThe targets reportedly include officials from Eurojust, Europol, Italy’s Postal Police, the German Federal Criminal Police Office, and journalists who investigated Russian hackers and influence operations. The campaign appears to be retaliation for a July 2025 international law-enforcement operation that took more than 100 NoName057(16) servers offline, and several listed individuals were reportedly involved in that investigation. Although the group is primarily known for flooding websites with traffic to make them unavailable, researchers said it has expanded into paid information gathering through the Tor network; Italian prosecutors are investigating, and G7 foreign ministers were expected to discuss possible joint measures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Pro-Russian hacktivist group NoName057(16) published personal information for 18 European politicians, law-enforcement officials, and journalists on a dedicated dark-web site.","The published profiles included phone numbers, email addresses, social-media accounts, and sometimes home addresses, and the group offered cryptocurrency rewards for further information about targets and their relatives.","Italian Foreign Minister Antonio Tajani said the campaign targeted him and his family to intimidate him over Italy's support for Ukraine.","The campaign appears linked to retaliation for a July 2025 multinational law-enforcement operation that took more than 100 NoName057(16) servers offline.","Italian prosecutors are investigating the publication of the personal information, and Tajani said G7 foreign ministers would discuss recent cyberattacks attributed to pro-Russian groups."],"insights":["NoName057(16), previously best known for overwhelming websites with traffic, has expanded into paid collection and publication of personal information through a Tor-based platform.","Several people named by the group were reportedly involved in the 2025 investigation that disrupted its infrastructure, indicating that law-enforcement personnel became direct targets after the operation.","The group continued claiming attacks on European targets after more than 100 of its servers were taken offline in the multinational 2025 operation.","Claims by NoName057(16) and another pro-Russian group to have disrupted supermarket refrigeration systems have not been independently verified, and researchers warned against assigning blame without technical evidence."],"referencedReports":[{"title":"NoName057(16) Telegram Activity Assessment","url":"https://www.darkowl.com/blog-content/noname05716-telegram-activity-assessment/","publisher":"darkowl","context":"The article cites this October report as documenting NoName057(16)'s paid Tor-based information-gathering platform and its publication of people it considers hostile to Russia.","category":"research","primary":false},{"title":"Defrost and Disrupt: An Assessment of Europe’s Refrigeration Attacks","url":"https://www.sentinelone.com/labs/defrost-and-disrupt-an-assessment-of-europe-s-refrigeration-attacks/","publisher":"sentinelone","context":"The article cites this technical assessment for its caution against attributing reported supermarket refrigeration disruptions without further technical evidence.","category":"research","primary":false}],"body":"\u003cp\u003ePro-Russian hacktivist group NoName057(16) published personal information about 18 European politicians, law-enforcement officials, and journalists on a dedicated dark-web site. The information included phone numbers, email addresses, social-media accounts, and in some cases home addresses, while the group offered cryptocurrency rewards for additional details about targets and their relatives. Italian Foreign Minister Antonio Tajani said he and his family were being targeted for intimidation connected to Italy’s support for Ukraine.\u003c/p\u003e\n\n\u003cp\u003eThe targets reportedly include officials from Eurojust, Europol, Italy’s Postal Police, the German Federal Criminal Police Office, and journalists who investigated Russian hackers and influence operations. The campaign appears to be retaliation for a July 2025 international law-enforcement operation that took more than 100 NoName057(16) servers offline, and several listed individuals were reportedly involved in that investigation. Although the group is primarily known for flooding websites with traffic to make them unavailable, researchers said it has expanded into paid information gathering through the Tor network; Italian prosecutors are investigating, and G7 foreign ministers were expected to discuss possible joint measures.\u003c/p\u003e\n"},{"n":4,"title":"Default 'admin:admin' Server Password Helps Researchers Hack Two Automakers, Unlock and Start Cars","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/default-adminadmin-server-password.html","time":"11:27","priority":"SHOULD READ","score":82,"tldr":"Researchers found that two automakers' connected-car identity systems exposed an Apache Felix admin console with default admin:admin credentials, enabling takeover of customer accounts and remote vehicle unlock/start commands. The flaw was fixed shortly after disclosure, highlighting the risk of leaving development consoles and default passwords in production.","briefOverview":"\u003cp\u003eSecurity researchers Shubham Shah and Sam Curry found that the customer-login systems behind two car brands’ mobile apps could be taken over through a default administrator password. The affected systems used ForgeRock, now part of Ping Identity, and exposed an Apache Felix administrator console that retained the documented \u003ccode\u003eadmin:admin\u003c/code\u003e credentials. The researchers said they reported the issue in February 2026, and the affected United States systems were fixed roughly two hours later.\u003c/p\u003e\n\n\u003cp\u003eAlthough the console was blocked from the open internet, the researchers used specially formed web addresses that the site’s edge and its Java server interpreted differently to reach it. From the console, they ran code on the identity server, changed a target account’s email address and password, and signed in through the normal app to obtain the same access tokens used by the customer. Those tokens enabled vehicle commands such as unlocking doors and starting an engine, which the researchers tested only on cars they owned or had permission to use. A separate Australian attack used identity-server administrator credentials left in the app’s code for a test setup, and the researchers said the combined attacks could affect cars in Australia, the United States, and Canada.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers Shubham Shah and Sam Curry found that the login systems for two car brands exposed an Apache Felix administrator console using the documented default credentials admin:admin.","By exploiting differences in how the internet-facing edge and the Java server interpreted web addresses, the researchers reached the otherwise blocked administrator console.","Access to the identity servers allowed the researchers to change a target account’s email address and password, sign in through the normal app, and obtain the account’s access tokens.","Using those tokens, the researchers unlocked doors and started the engine only on cars they owned or had permission to test, and the affected United States systems were fixed about two hours after reporting.","A separate Australian attack used identity-server administrator credentials left in the app’s code for a test setup, and the researchers said the combined attacks could affect cars in Australia, the United States, and Canada."],"insights":["Blocking an administrator page at the internet-facing edge was insufficient because the edge and the server interpreted specially formed web addresses differently, allowing the researchers to reach the page.","Taking over an account could be difficult for an owner to notice because changing the email address and password did not log the owner out, and account alerts could be redirected to the researchers’ phone.","The issue was a production configuration failure rather than a newly discovered ForgeRock product flaw, so it had no CVE or vendor advisory despite allowing full account and vehicle-command access.","The researchers found separate weaknesses in different regions: default administrator credentials on the United States systems and test administrator credentials embedded in the app code for Australian systems."],"referencedReports":[{"title":"ForgeRock Technical Analysis","url":"https://samcurry.net/forgerock","publisher":"Sam Curry","context":"The article links this technical analysis for the full method used to bypass the blocked administrator console and access the identity server.","category":"research","primary":true},{"title":"Unlocking Any Car From X Brand in Most of the World","url":"https://shubs.io/unlocking-any-car-from-x-brand-in-most-of-the-world/","publisher":"Shubham Shah","context":"The article links this separate post for the Australian attack chain involving identity-server administrator credentials embedded in app code.","category":"research","primary":true},{"title":"Remove Development Tools","url":"https://docs.pingidentity.com/pingidm/7.2/security-guide/security-remove-dev-tools.html","publisher":"Ping Identity","context":"The article cites Ping Identity’s production hardening guidance, which instructs operators to remove or protect the Apache Felix console before deployment.","category":"guide","primary":false}],"body":"\u003cp\u003eSecurity researchers Shubham Shah and Sam Curry found that the customer-login systems behind two car brands’ mobile apps could be taken over through a default administrator password. The affected systems used ForgeRock, now part of Ping Identity, and exposed an Apache Felix administrator console that retained the documented \u003ccode\u003eadmin:admin\u003c/code\u003e credentials. The researchers said they reported the issue in February 2026, and the affected United States systems were fixed roughly two hours later.\u003c/p\u003e\n\n\u003cp\u003eAlthough the console was blocked from the open internet, the researchers used specially formed web addresses that the site’s edge and its Java server interpreted differently to reach it. From the console, they ran code on the identity server, changed a target account’s email address and password, and signed in through the normal app to obtain the same access tokens used by the customer. Those tokens enabled vehicle commands such as unlocking doors and starting an engine, which the researchers tested only on cars they owned or had permission to use. A separate Australian attack used identity-server administrator credentials left in the app’s code for a test setup, and the researchers said the combined attacks could affect cars in Australia, the United States, and Canada.\u003c/p\u003e\n"},{"n":2,"title":"Alleged AI-aided cyberattack exploits assistant interface to breach German web host","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cyberattack-germany-ai-mittwald","time":"14:15","priority":"MAY READ","score":72,"tldr":"German hosting provider Mittwald said attackers exploited a flaw in its Model Context Protocol server to compromise 56 customer projects, remaining undetected for eight days. The company suspects the intruders used AI to accelerate their activity, though it provided no conclusive evidence beyond rapid actions in its logs.","briefOverview":"\u003cp\u003eMittwald CM Service, a German hosting provider for web agencies, said attackers compromised 56 customer projects after exploiting a flaw in its Model Context Protocol (MCP) server. The server allows customers to connect AI assistants to mStudio, Mittwald’s website and hosting management platform. According to the company, the intruder remained undetected for eight days.\u003c/p\u003e\n\n\u003cp\u003eManaging director Robert Meyer said logs indicated the attacker moved through the environment unusually quickly, with some steps occurring seconds apart, and suggested AI tools may have been involved. Mittwald provided no additional evidence separating possible AI assistance from conventional automated scripts, and it remains unclear whether the flaw was in Mittwald’s code or open-source MCP libraries. The company said external forensic experts are assisting, authorities have been notified, and repeated scans had found no additional attacker activity as of Friday.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mittwald CM Service said attackers exploited a flaw in its Model Context Protocol server, which connects customer AI assistants to its mStudio website and hosting management platform.","The company reported that 56 customer projects were compromised and that the attacker remained undetected for eight days.","Mittwald managing director Robert Meyer said logs showed the attacker moving through systems unusually quickly, but the company provided no further evidence that AI tools were used.","Mittwald said external forensic experts are assisting the investigation, relevant authorities have been informed, and repeated scans had found no additional attacker activity as of Friday."],"insights":["The claimed AI involvement is not established: Mittwald cited unusually fast activity in its logs but did not provide evidence distinguishing AI assistance from conventional automated scripts.","The intrusion targeted an interface intended to connect customer AI assistants with hosting-management accounts, making it a compromise path tied to an emerging customer integration feature rather than the hosted projects themselves.","The attacker reportedly used disguised access attempts and diversionary tactics while Mittwald was responding to the broader PHP2Shell patching effort.","Mittwald’s reported impact was limited to 56 customer projects, and its subsequent forensic reviews and repeated internal scans had not identified further attacker activity as of Friday."],"referencedReports":[],"body":"\u003cp\u003eMittwald CM Service, a German hosting provider for web agencies, said attackers compromised 56 customer projects after exploiting a flaw in its Model Context Protocol (MCP) server. The server allows customers to connect AI assistants to mStudio, Mittwald’s website and hosting management platform. According to the company, the intruder remained undetected for eight days.\u003c/p\u003e\n\n\u003cp\u003eManaging director Robert Meyer said logs indicated the attacker moved through the environment unusually quickly, with some steps occurring seconds apart, and suggested AI tools may have been involved. Mittwald provided no additional evidence separating possible AI assistance from conventional automated scripts, and it remains unclear whether the flaw was in Mittwald’s code or open-source MCP libraries. The company said external forensic experts are assisting, authorities have been notified, and repeated scans had found no additional attacker activity as of Friday.\u003c/p\u003e\n"},{"n":3,"title":"⚡ Weekly Recap: SSHole Exploited, APT Root RCE, Robot Takeovers, 15K Hacked Sites, and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/weekly-recap-sshole-exploited-apt-root.html","time":"13:28","priority":"MAY READ","score":40,"tldr":"This weekly roundup highlights active exploitation of the SSHole OpenSSH flaw, supply-chain compromises of server-update mechanisms, and critical bugs affecting APT, Zyxel switches, and other widely deployed systems. The main takeaway is that unpatched internet-facing services, weak configurations, and compromised update channels remain high-impact entry points for attackers.","briefOverview":"\u003cp\u003eThis weekly cybersecurity roundup reports active attempts to exploit SSHole, an OpenSSH flaw identified as CVE-2026-123158 that can permit sign-ins to accounts without passwords on affected Linux systems using musl with PAM disabled. It also covers a Debian and Ubuntu APT issue, CVE-2026-109518, where an attacker able to intercept network traffic could cause installation of an unverified package under specific HTTP-source and retry-setting conditions. These cases highlight how configuration choices and exposed services can turn relatively limited weaknesses into unauthorized system access.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes compromised update channels and widespread attacks against connected devices and online services. A trojanized Control Web Panel server component delivered the CWPdoor backdoor, while attackers used OPSSHIELD\u0026rsquo;s compromised cPGuard update infrastructure to distribute a backdoor and data-stealing script. Other reported activity included exploitation of Zyxel GS1900 switches, malicious JavaScript on about 15,579 websites, phishing campaigns targeting Microsoft 365 and financial accounts, and flaws that could allow control of Reachy Mini robot motors. The overall message is that unpatched software, unsafe updates, forgotten settings, and internet-connected systems continue to create practical opportunities for attackers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have attempted to exploit CVE-2026-123158, known as SSHole, which can allow sign-ins to passwordless accounts on Linux systems using OpenSSH with musl and PAM disabled, including Alpine Linux’s default configuration.","A flaw in Debian and Ubuntu’s APT package manager, CVE-2026-109518, can allow an attacker positioned between a host and package mirror to cause installation of an unverified package when HTTP sources and retry settings are used, with package scripts running with elevated privileges.","Zyxel patched CVE-2026-107441 in GS1900 network switches after attackers exploited it to compromise nearly 1,000 devices and steal configuration files and credentials.","Unknown attackers used compromised credentials to access OPSSHIELD’s update-distribution infrastructure and distribute a backdoor and data-stealing script through the cPGuard update channel.","The roundup also reports that roughly 15,579 websites are infected with malicious JavaScript used for credit-card skimming, ClickFix lures, iOS exploitation kits, and malicious redirects."],"insights":["CWPdoor is designed to blend into normal web-server activity: it activates only on requests containing special headers and suppresses logs for those requests, leaving no access-log record of the attacker interaction.","The APT issue shows that package verification can be bypassed only under a specific combination of HTTP package sources, retry settings, and an attacker able to intercept traffic between a system and its package mirror.","Compromised refrigeration controllers were reportedly used as proxy exits and spam senders, demonstrating that internet-connected building equipment can be repurposed as abuse infrastructure.","A misspelled email-service domain in a U.S. county’s SPF record authorized at least 32,066 IP addresses to send mail on the county’s behalf, despite the government domain itself remaining registered.","Reachy Mini could reportedly be compromised either through a direct attack chain or merely by an operator visiting a malicious web page, with the chained flaws ultimately allowing control of the robot’s motor."],"referencedReports":[{"title":"A Dish Served Lukewarm: The Refrigerator Botnet","url":"https://securityscorecard.com/blog/a-dish-served-lukewarm-the-refrigerator-botnet/","publisher":"securityscorecard","context":"The article cites SecurityScorecard's report on a suspected SMTP botnet that included compromised Dixell/Copeland XWEB PRO refrigeration controllers.","category":"research","primary":false},{"title":"PhantomDOM Browser-in-the-Middle Microsoft 365 Analysis","url":"https://zerobec.com/blog/phantomdom-browser-in-the-middle-microsoft-365","publisher":"zerobec","context":"The article references ZeroBEC's analysis of the PhantomDOM phishing operation that mirrors a remote browser's web page to hijack Microsoft 365 sessions.","category":"research","primary":false},{"title":"Agents, Secrets, and Swarms","url":"https://aialignmentfoundation.org/early-explorations/agents-secrets-swarms","publisher":"ai-alignment-foundation","context":"The article cites an AI Alignment Foundation experiment in which coding agents shared a private token and ran untrusted code to obtain help from an agent forum.","category":"research","primary":false},{"title":"CPython 0-Day Vulnerabilities Threaten the AI Supply Chain","url":"https://www.runsybil.com/blog/cpython-0-day-vulnerabilities-threaten-the-ai-supply-chain","publisher":"runsybil","context":"The article references RunSybil's technical analysis of a CPython memory-safety flaw that could enable sandbox escape in AI hosting environments.","category":"research","primary":false},{"title":"Government Dangling DNS Records","url":"https://www.sh.consulting/blog/government-dangling-dns-records","publisher":"sh-consulting","context":"The article cites SH Consulting's study of 25,964 U.S. government-related domains and identifies dangling or repurposed external DNS dependencies.","category":"research","primary":false},{"title":"Inside Qilin Ransomware: ESXi Attacks, Affiliate Networks, and Double Extortion","url":"https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/","publisher":"acronis","context":"The article references Acronis research describing Qilin ransomware affiliates' access methods and flexible encryption capabilities.","category":"research","primary":false},{"title":"BOSSAI: Inside the AI Attack Mesh That Targeted Taiwan's Emergency Services","url":"https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/","publisher":"acronis","context":"The article cites Acronis findings on a single threat actor using a mesh of 12 AI agents to target organizations in eleven countries.","category":"research","primary":false},{"title":"Greeter: Flowise AI Infrastructure Attack","url":"https://era.security/blog/greeter-flowise-ai-infrastructure-attack","publisher":"era-security","context":"The article references Era Security's analysis of the Greeter exploitation framework targeting exposed Flowise instances through CVE-2024-58351.","category":"research","primary":false},{"title":"Bank Phishing Campaign Uses Fake Takedown Notices","url":"https://www.kelacyber.com/blog/bank-phishing-campaign-fake-takedown/","publisher":"kela","context":"The article cites KELA's research on a bank-phishing cluster whose sites show a fake suspended-account notice to returning visitors.","category":"research","primary":false},{"title":"The Speed of Cyber Threats Is Changing: Are We Keeping Up?","url":"https://www.trellix.com/blogs/research/the-speed-of-cyber-threats-is-changing-are-we-keeping-up/","publisher":"trellix","context":"The article references Trellix's study reporting a 41.4% decline in observed Chinese nation-state activity from April through September 2026.","category":"research","primary":false},{"title":"Reachy HTTP Request Hijacks AI Robot","url":"https://jfrog.com/blog/reachy-http-request-hijacks-ai-robot/","publisher":"jfrog","context":"The article cites JFrog's technical analysis of five chained Reachy Mini flaws that could lead to persistent root access and motor control.","category":"research","primary":false},{"title":"AI-Themed Fake Event Campaign Analysis","url":"https://pushsecurity.com/blog/ai-themed-fake-event-campaign-analysis","publisher":"push-security","context":"The article references Push Security's analysis of phishing invitations impersonating OpenAI, SpaceX, and Anthropic events.","category":"research","primary":false},{"title":"3AM Ransomware Hybrid AI Attack","url":"https://www.bitdefender.com/en-us/blog/businessinsights/3am-ransomware-hybrid-ai-attack","publisher":"bitdefender","context":"The article cites Bitdefender's analysis of a 3AM ransomware incident at a U.S. school estate that showed both human-operated and agent-like behavior.","category":"research","primary":false},{"title":"Residential Proxies on the White House Network","url":"https://layer3intel.com/blog/residential-proxies-white-house-network","publisher":"layer3-intel","context":"The article references Layer3 Intel's report that residential-proxy traffic exited through White House network addresses during a 30-day period.","category":"research","primary":false},{"title":"QNAP Security Notice: Plex Media Server Vulnerabilities (Plex2Shell)","url":"https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately-no-data-loss-reported","publisher":"qnap","context":"The article cites QNAP's security notice urging NAS users to update Plex Media Server following reports of active Plex2Shell exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eThis weekly cybersecurity roundup reports active attempts to exploit SSHole, an OpenSSH flaw identified as CVE-2026-123158 that can permit sign-ins to accounts without passwords on affected Linux systems using musl with PAM disabled. It also covers a Debian and Ubuntu APT issue, CVE-2026-109518, where an attacker able to intercept network traffic could cause installation of an unverified package under specific HTTP-source and retry-setting conditions. These cases highlight how configuration choices and exposed services can turn relatively limited weaknesses into unauthorized system access.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes compromised update channels and widespread attacks against connected devices and online services. A trojanized Control Web Panel server component delivered the CWPdoor backdoor, while attackers used OPSSHIELD\u0026rsquo;s compromised cPGuard update infrastructure to distribute a backdoor and data-stealing script. Other reported activity included exploitation of Zyxel GS1900 switches, malicious JavaScript on about 15,579 websites, phishing campaigns targeting Microsoft 365 and financial accounts, and flaws that could allow control of Reachy Mini robot motors. The overall message is that unpatched software, unsafe updates, forgotten settings, and internet-connected systems continue to create practical opportunities for attackers.\u003c/p\u003e\n"}]</script>

#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
