<script type="application/json" id="dl-articles">[{"n":2,"title":"Microsoft smashes Patch Tuesday record for second successive month","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-vulnerabilities-patch-tuesday-release","time":"12:15","priority":"MUST READ","score":94,"tldr":"Microsoft released a record 622 security fixes in July’s Patch Tuesday, the second straight month it has broken its own record amid surging vulnerability reports. Two flaws are already being exploited in the wild, including issues in SharePoint Server and Active Directory Federation Services.","briefOverview":"\u003cp\u003eMicrosoft released fixes for 622 security vulnerabilities in July, making it the largest Patch Tuesday in the program’s history. The release is more than triple the size of the previous record, which was set last month, and is larger than the three previous months combined. Microsoft’s Security Update Guide also changed format, replacing the previously itemized batch of CVEs with a summary table by product family and a “Notable CVEs” section. Individual advisories for each CVE remain available separately.\u003c/p\u003e\n\n\u003cp\u003eThe article says the surge reflects a broader rise in vulnerability reporting, which Microsoft and analysts have linked to AI-assisted discovery tools. Rapid7’s Adam Barnett described the trend as an industry-wide increase in vulnerability report counts, while Jerry Gamblin found that only 85 of more than 35,000 CVEs published by all vendors in the first half of the year had appeared in CISA’s Known Exploited Vulnerabilities catalog. Microsoft said two July flaws are already being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. The release also includes a SharePoint security feature bypass, CVE-2026-55040, that Rapid7 said is the first half of an exploit chain leading to unauthenticated remote code execution against a vulnerable server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released fixes for 622 CVEs in July, making it the largest Patch Tuesday in the program’s history and more than triple the size of the previous record set last month.","Microsoft’s Security Update Guide no longer lists the individual CVEs in the Patch Tuesday batch, instead showing a summary table by product family and a “Notable CVEs” section while keeping individual advisories available separately.","Microsoft said two July flaws are being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services.","Rapid7 said CVE-2026-55040 is the first half of an exploit chain that leads to unauthenticated remote code execution against a vulnerable SharePoint server, with the second vulnerability expected to be patched in August.","The article says Microsoft and analysts have suggested AI-assisted tools are contributing to rapidly rising vulnerability discovery volumes, while Jerry Gamblin found that only 85 of more than 35,000 CVEs published in the first half of the year had appeared in CISA’s Known Exploited Vulnerabilities catalog."],"insights":["Microsoft’s move from listing every Patch Tuesday CVE to providing only a summary table may make defender triage harder because teams and third-party trackers must reconstruct the full vulnerability picture from separate advisory feeds.","The sharp rise in published CVEs has not yet translated into a matching rise in confirmed exploitation, with Jerry Gamblin finding that only 0.24% of first-half 2026 CVEs had appeared in CISA’s KEV catalog at the time of his analysis.","SharePoint deserves near-term attention because one SharePoint flaw is already exploited in the wild, while another newly patched SharePoint bypass is described by Rapid7 as part of a still-incomplete exploit chain leading to unauthenticated remote code execution.","The Nightmare Eclipse dispute remains operationally relevant because the researcher continues to release or threaten proof-of-concept code around Windows flaws, including LegacyHive and claims about the RoguePlanet patch introducing a disk-exhaustion vector."],"referencedReports":[{"title":"Patch Tuesday - July 2026","url":"https://www.rapid7.com/blog/post/em-patch-tuesday-july-2026/","publisher":"Rapid7","context":"The article cites Rapid7’s Adam Barnett on the industry-wide rise in vulnerability report counts and references Rapid7’s analysis of several July Patch Tuesday vulnerabilities.","category":"advisory","primary":false},{"title":"Analysis by Jerry Gamblin on vulnerability and exploitation trends","url":"https://jgamblin.com/2026/07/01/3528/","publisher":"Jerry Gamblin","context":"The article cites Jerry Gamblin’s analysis showing that while published vulnerability counts have risen sharply, confirmed exploitation has not risen at the same pace.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft released fixes for 622 security vulnerabilities in July, making it the largest Patch Tuesday in the program’s history. The release is more than triple the size of the previous record, which was set last month, and is larger than the three previous months combined. Microsoft’s Security Update Guide also changed format, replacing the previously itemized batch of CVEs with a summary table by product family and a “Notable CVEs” section. Individual advisories for each CVE remain available separately.\u003c/p\u003e\n\n\u003cp\u003eThe article says the surge reflects a broader rise in vulnerability reporting, which Microsoft and analysts have linked to AI-assisted discovery tools. Rapid7’s Adam Barnett described the trend as an industry-wide increase in vulnerability report counts, while Jerry Gamblin found that only 85 of more than 35,000 CVEs published by all vendors in the first half of the year had appeared in CISA’s Known Exploited Vulnerabilities catalog. Microsoft said two July flaws are already being exploited in the wild: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. The release also includes a SharePoint security feature bypass, CVE-2026-55040, that Rapid7 said is the first half of an exploit chain leading to unauthenticated remote code execution against a vulnerable server.\u003c/p\u003e\n"},{"n":6,"title":"Researcher Drops New Windows Zero-Day PoC Hours After Microsoft Patch Tuesday","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-drops-new-windows-zero-day.html","time":"11:07","priority":"MUST READ","score":94,"tldr":"A researcher released a PoC for LegacyHive, a Windows User Profile Service privilege escalation zero-day that reportedly works on fully patched Windows systems after July 2026 Patch Tuesday. The disclosure comes amid Microsoft’s record patch release and active exploitation of several SharePoint Server and ADFS vulnerabilities now tracked by CISA.","briefOverview":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive shortly after Microsoft’s July 2026 Patch Tuesday. The issue is described as a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability. The researcher said the public proof of concept requires another standard user credential and a third username, and that a successful run mounts the target user hive in the current user classes root.\u003c/p\u003e\n\n\u003cp\u003eThe researcher said the released exploit was stripped down to prevent public exploitation, while the original exploit did not require additional user credentials and was not limited to the usrclass.dat hive. The article says LegacyHive is functional on all supported desktop and server versions of Windows, including systems running the latest July 2026 Patch Tuesday update. The disclosure follows an ongoing dispute between Chaotic Eclipse and Microsoft over public release of vulnerability details before patches are available.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that Microsoft’s July 2026 updates addressed a record 622 flaws, including actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services. CISA added those two vulnerabilities to its Known Exploited Vulnerabilities catalog and separately warned of active exploitation of multiple SharePoint Server flaws affecting supported on-premises versions. CISA said the SharePoint activity involved remote code execution and post-exploitation actions such as stealing IIS machine keys, deserialization techniques, persistence, and malware deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive for a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability.","The LegacyHive proof of concept reportedly works on all supported desktop and server versions of Windows, including systems with the latest July 2026 Patch Tuesday update.","Chaotic Eclipse said the public proof of concept was stripped down to prevent public exploitation and that the original exploit did not require additional user credentials or limit loading to the usrclass.dat hive.","Microsoft’s July 2026 Patch Tuesday fixed a record 622 flaws, including actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services.","CISA added CVE-2026-56164 and CVE-2026-56155 to its Known Exploited Vulnerabilities catalog and said it is aware of active exploitation of multiple SharePoint Server flaws affecting supported on-premises SharePoint Server versions."],"insights":["LegacyHive is especially notable because the researcher says it remains functional even after the latest July 2026 Patch Tuesday update, meaning routine patching alone would not address this specific Windows issue at the time of publication.","The public LegacyHive proof of concept was intentionally weakened, but the researcher stated that the original exploit was broader and did not require the extra credentials described in the release.","Microsoft’s recent Defender fixes show signs of follow-on risk, because the article says the RoguePlanet defense-in-depth updates may cause Defender to leak 8 bytes of data in certain file-opening scenarios.","CISA’s separate SharePoint warning indicates that attackers are not focused on a single flaw, but are using multiple SharePoint Server vulnerabilities for unauthorized access, persistence, and malware deployment.","CVE-2026-55040 could be particularly important for SharePoint exposure because Rapid7 said it can bypass authentication and then be chained with other vulnerabilities in the authenticated attack surface."],"referencedReports":[{"title":"LegacyHive Public Disclosure","url":"https://blog.projectnightcrawler.dev/posts/2026-07-14-legacyhive-public-disclosure/","publisher":"Chaotic Eclipse / Project Nightcrawler","context":"The article cites this public disclosure as the source for the released LegacyHive proof-of-concept exploit.","category":"research","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references this CISA alert for the addition of CVE-2026-56164 and CVE-2026-56155 to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false},{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article cites this separate CISA advisory about active exploitation of multiple SharePoint Server flaws.","category":"advisory","primary":false},{"title":"CVE-2026-55040 Microsoft SharePoint Server Security Feature Bypass Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-55040","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s update guidance for CVE-2026-55040, a critical SharePoint Server security feature bypass vulnerability fixed in the July 2026 update.","category":"advisory","primary":false},{"title":"VE: CVE-2026-55040: Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article quotes Rapid7’s analysis that CVE-2026-55040 involves issues in the JWT token validation pipeline and can be chained with other vulnerabilities.","category":"research","primary":false}],"body":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as Nightmare-Eclipse, released a proof-of-concept exploit called LegacyHive shortly after Microsoft’s July 2026 Patch Tuesday. The issue is described as a Windows User Profile Service arbitrary hive load elevation of privileges vulnerability. The researcher said the public proof of concept requires another standard user credential and a third username, and that a successful run mounts the target user hive in the current user classes root.\u003c/p\u003e\n\n\u003cp\u003eThe researcher said the released exploit was stripped down to prevent public exploitation, while the original exploit did not require additional user credentials and was not limited to the usrclass.dat hive. The article says LegacyHive is functional on all supported desktop and server versions of Windows, including systems running the latest July 2026 Patch Tuesday update. The disclosure follows an ongoing dispute between Chaotic Eclipse and Microsoft over public release of vulnerability details before patches are available.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that Microsoft’s July 2026 updates addressed a record 622 flaws, including actively exploited privilege escalation vulnerabilities in SharePoint Server and Active Directory Federation Services. CISA added those two vulnerabilities to its Known Exploited Vulnerabilities catalog and separately warned of active exploitation of multiple SharePoint Server flaws affecting supported on-premises versions. CISA said the SharePoint activity involved remote code execution and post-exploitation actions such as stealing IIS machine keys, deserialization techniques, persistence, and malware deployment.\u003c/p\u003e\n"},{"n":12,"title":"Emerging Threat: (CVE-2026-56164) SharePoint Server Privilege Escalation via Missing Authentication","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-56164-sharepoint-server-privilege-escalation-via-missing-authentication/","time":"11:01","priority":"MUST READ","score":94,"tldr":"CVE-2026-56164 is a zero-day privilege escalation flaw in on-premises Microsoft SharePoint Server that has been exploited in the wild, so internet-facing farms should be patched through SharePoint’s own update process immediately. Organizations should also verify exposure, review logs for compromise, and prioritize migration if still running unsupported SharePoint 2016 or 2019.","briefOverview":"\u003cp\u003eCVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function. An unauthenticated attacker can exploit it over a network without credentials or user interaction. Microsoft assigned it a CVSS v3.1 base score of 5.3 and rated it Moderate, but confirmed exploitation in the wild and disclosed it as a zero-day.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope. The article describes the affected assets as internet-facing SharePoint farms, including collaboration portals, document stores, intranet gateways, and extranet sites running IIS. It notes that SharePoint Server 2016 and 2019 reached end of extended support on July 14, 2026, with no paid extended security update program available.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, but the article stresses that SharePoint must be patched through its own servicing process rather than by installing only the Windows cumulative update. Recommended actions include inventorying internet-facing SharePoint instances, enabling AMSI integration in Full Mode, restricting network access, reviewing IIS and SharePoint logs, and rotating IIS machine keys on farms suspected of compromise. The article also says privilege escalation in observed on-premises SharePoint attacks is often chained with remote code execution and post-exploitation steps such as stealing IIS machine keys and abusing deserialization to establish persistence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function.","Microsoft confirmed that CVE-2026-56164 has been exploited in the wild and disclosed it as a zero-day with a CVSS v3.1 base score of 5.3.","The vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope.","Microsoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, but the patch must be applied through SharePoint’s own servicing process rather than only installing a Windows cumulative update.","The article recommends inventorying internet-facing SharePoint Server instances, enabling AMSI integration in Full Mode, restricting network access, reviewing logs, and rotating IIS machine keys on farms suspected of compromise."],"insights":["The article emphasizes that the CVSS score and Microsoft’s Moderate rating understate the urgency because Microsoft confirmed exploitation in the wild and the flaw was disclosed as a zero-day.","The discovery credit to Mandiant incident responders and Google’s FLARE team is presented as a signal that the flaw was likely found during active attack investigations rather than routine research.","Installing the Windows cumulative update is not sufficient because SharePoint patches must be applied through SharePoint’s own servicing process and validated on each server.","SharePoint Server 2016 and 2019 reached end of extended support on the same day the fix shipped, leaving organizations on those versions without a paid extended security update fallback.","The article highlights orphaned or ambiguously owned SharePoint farms as a practical exposure driver, especially because older portals created for specific teams or projects can remain internet-facing after their original owners are gone."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-56164 is a privilege escalation vulnerability in on-premises Microsoft SharePoint Server caused by a missing authentication check on a critical function. An unauthenticated attacker can exploit it over a network without credentials or user interaction. Microsoft assigned it a CVSS v3.1 base score of 5.3 and rated it Moderate, but confirmed exploitation in the wild and disclosed it as a zero-day.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition, while SharePoint Online is not in scope. The article describes the affected assets as internet-facing SharePoint farms, including collaboration portals, document stores, intranet gateways, and extranet sites running IIS. It notes that SharePoint Server 2016 and 2019 reached end of extended support on July 14, 2026, with no paid extended security update program available.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released patches for CVE-2026-56164 in the July 14, 2026 Patch Tuesday update, but the article stresses that SharePoint must be patched through its own servicing process rather than by installing only the Windows cumulative update. Recommended actions include inventorying internet-facing SharePoint instances, enabling AMSI integration in Full Mode, restricting network access, reviewing IIS and SharePoint logs, and rotating IIS machine keys on farms suspected of compromise. The article also says privilege escalation in observed on-premises SharePoint attacks is often chained with remote code execution and post-exploitation steps such as stealing IIS machine keys and abusing deserialization to establish persistence.\u003c/p\u003e\n"},{"n":10,"title":"OkoBot: new sophisticated malware framework targets cryptocurrency users","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/okobot-framework-targets-cryptocurrency-wallets/120660/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky details OkoBot, an active and evolving malware framework delivered via TookPS that targets cryptocurrency users with SSH-based control, hidden browser extensions, keylogging, screen recording, and wallet seed-phrase phishing. The campaign has hit hundreds of victims across more than 25 countries and uses many coordinated modules to steal crypto-related data and credentials.","briefOverview":"\u003cp\u003eKaspersky identified an active malware campaign called OkoBot that targets cryptocurrency users and is based on the TookPS downloader. The framework includes more than 20 malicious payloads and implants, with functions including local file collection, remote command execution, browser extension delivery, and cryptocurrency wallet theft. Kaspersky detected hundreds of victims in more than 25 countries, with the largest proportions of attacked end users in Brazil, Vietnam, Canada, Mexico, and Türkiye.\u003c/p\u003e\n\n\u003cp\u003eInitial infection is delivered mainly through ClickFix attacks and malware distributed through GitHub that masquerades as legitimate software, including a fake SQL Server Management Studio package. After TookPS runs, it installs SSH, connects to an attacker-controlled SSH server, forwards the SSH daemon port, and allows an automated SSH bot to connect back to the victim system. The bot collects system information, harvests cryptocurrency wallet files, browser cookies, profiles, and other credentials, disables Windows Defender notifications, and sets up Remote Desktop access through a reverse SSH tunnel.\u003c/p\u003e\n\n\u003cp\u003eOkoBot deploys several modules, including HDUtil, a browser extensions loader, a Volume2-based plugin dispatcher, SeedHunter, MC Keylogger, and OkoSpyware. The browser extension components can silently install and hide malicious extensions in Chromium-based browsers, while SeedHunter targets Ledger and Trezor-related applications to collect seed phrases through phishing pages. MC Keylogger records user input, clipboard activity, connected devices, and screenshots, while OkoSpyware captures keystrokes and video streams from targeted application windows.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified OkoBot as an updated TookPS campaign that uses a malware framework with more than 20 payloads and implants to deliver and orchestrate malicious modules via an SSH tunnel.","The initial infection is delivered mainly through ClickFix attacks and GitHub-hosted malware masquerading as legitimate software, including a fake SQL Server Management Studio package that was actually Audacity with a malicious implant embedded in one library.","After infection, an automated SSH bot collects system information, harvests cryptocurrency wallet files, browser cookies, profiles, and credentials, and sets up Remote Desktop access through a reverse SSH tunnel.","OkoBot includes modules such as a hidden browser extension loader, a plugin dispatcher, SeedHunter for Ledger and Trezor seed phrase theft, MC Keylogger, and OkoSpyware for capturing keystrokes and video of targeted application windows.","Kaspersky detected hundreds of OkoBot victims in more than 25 countries, with the largest proportions of attacked end users in Brazil, Vietnam, Canada, Mexico, and Türkiye."],"insights":["OkoBot’s operators improved the framework over time by replacing the HDUtil launcher → extl injector → Rilide chain with the ext_daemon Volume2 plugin and removing TeviRAT, showing that the campaign is actively maintained rather than static.","The fake SQL Server Management Studio GitHub repository gained credibility because it was indexed by search engines and appeared high in results for the query “SSMS,” making ordinary software searches a realistic infection path.","The framework repeatedly checks for a valid HWID file such as %PROGRAMDATA%\\hwid.dat before running modules, making that file path a useful host artifact for investigation across multiple stages of the campaign.","OkoBot hides malicious browser extensions by hooking internal Chromium-based browser functions, allowing it to install extensions, grant permissions, suppress warnings, and keep them out of the visible extensions list.","SeedHunter does not only steal existing wallet data; it can display phishing pages inside Ledger and Trezor-related applications to trick users into entering hardware wallet seed phrases."],"referencedReports":[{"title":"Calling Local Windows RPC Servers from a Low-Privileged Client","url":"https://googleprojectzero.blogspot.com/2019/12/calling-local-windows-rpc-servers-from.html","publisher":"Google Project Zero","context":"The article cites Project Zero’s full technical report as the source describing the Windows RPC and msconfig.exe UAC bypass technique used by HDUtil.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky identified an active malware campaign called OkoBot that targets cryptocurrency users and is based on the TookPS downloader. The framework includes more than 20 malicious payloads and implants, with functions including local file collection, remote command execution, browser extension delivery, and cryptocurrency wallet theft. Kaspersky detected hundreds of victims in more than 25 countries, with the largest proportions of attacked end users in Brazil, Vietnam, Canada, Mexico, and Türkiye.\u003c/p\u003e\n\n\u003cp\u003eInitial infection is delivered mainly through ClickFix attacks and malware distributed through GitHub that masquerades as legitimate software, including a fake SQL Server Management Studio package. After TookPS runs, it installs SSH, connects to an attacker-controlled SSH server, forwards the SSH daemon port, and allows an automated SSH bot to connect back to the victim system. The bot collects system information, harvests cryptocurrency wallet files, browser cookies, profiles, and other credentials, disables Windows Defender notifications, and sets up Remote Desktop access through a reverse SSH tunnel.\u003c/p\u003e\n\n\u003cp\u003eOkoBot deploys several modules, including HDUtil, a browser extensions loader, a Volume2-based plugin dispatcher, SeedHunter, MC Keylogger, and OkoSpyware. The browser extension components can silently install and hide malicious extensions in Chromium-based browsers, while SeedHunter targets Ledger and Trezor-related applications to collect seed phrases through phishing pages. MC Keylogger records user input, clipboard activity, connected devices, and screenshots, while OkoSpyware captures keystrokes and video streams from targeted application windows.\u003c/p\u003e\n"},{"n":7,"title":"Cursor Flaw Lets Malicious Cloned Repositories Trigger Windows Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cursor-flaw-lets-malicious-cloned.html","time":"10:55","priority":"SHOULD READ","score":86,"tldr":"Cursor on Windows can automatically execute a malicious git.exe placed in a cloned repository’s root when the folder is opened, enabling zero-click code execution as the logged-in user. There is reportedly no patch or advisory yet, so users should treat untrusted repositories as executable content and open them only in isolated environments.","briefOverview":"\u003cp\u003eCursor on Windows can execute a file named git.exe from a project root when a repository is opened, without a click, approval dialog, or warning. The article says the binary runs as the logged-in user and can access the user’s source code, SSH keys, and cloud tokens. Mindgard reported the flaw to Cursor on December 15, 2025 and published technical details seven months later, while the article says there was still no patch or Cursor advisory as of July 15.\u003c/p\u003e\n\n\u003cp\u003eThe mechanism described is that Cursor checks several locations for a Git binary when a project loads, including the workspace itself. Process Monitor output in Mindgard’s write-up showed Cursor.exe spawning the repository-root binary with the command line git rev-parse \u0026ndash;show-toplevel. Mindgard’s proof of concept used Windows Calculator renamed to git.exe and committed to the root, causing Calculator windows to open automatically while the project stayed open.\u003c/p\u003e\n\n\u003cp\u003eThe article says the practical risk is that cloning and opening an untrusted repository can place and run an attacker’s binary on a developer’s machine. It recommends workarounds such as AppLocker or Windows App Control path-based deny rules on managed Windows fleets, or opening untrusted repositories in a disposable VM or Windows Sandbox. It also notes similar Windows executable-search behavior reported by Cymulate in GitHub Copilot CLI, Gemini CLI, the Codex desktop app, and Cursor CLI, and compares the weakness to a Git Credential Manager Core issue from 2020.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cursor on Windows can execute a file named git.exe from a project root when a repository is opened, with no click, approval dialog, or warning.","Mindgard reported the flaw to Cursor on December 15, 2025 and published technical details seven months later, while the article says there was still no patch or Cursor advisory as of July 15.","Mindgard’s proof of concept used Windows Calculator renamed to git.exe and committed to the repository root, causing Calculator windows to open automatically while the project remained open.","The article says the risk is that a malicious binary in a cloned repository can run as the logged-in user with access to source code, SSH keys, and cloud tokens.","Cymulate reported similar Windows executable-search behavior in GitHub Copilot CLI, Gemini CLI, the Codex desktop app, and Cursor CLI, and said none of those vendors had shipped fixes as of its June 4 write-up."],"insights":["The article emphasizes that the issue does not require prompt injection, an AI agent, or model behavior; the risk comes from ordinary folder-opening behavior in the tool.","Mindgard recommends path-based blocking rules rather than hash-based rules because attacker-supplied binaries can easily change hashes while still using the same filename and location pattern.","The disclosure history is notable because Cursor published other security advisories while Mindgard’s report on this Git-related issue remained unresolved and unanswered after multiple update requests.","The same Windows search-path weakness has appeared across multiple AI coding tools, yet several vendors reportedly treated malicious binaries in cloned repositories as out of scope or not a vulnerability.","The article connects the Cursor issue to an older Git Credential Manager Core flaw from 2020, showing that the same calc.exe-renamed-as-git.exe technique has been known for years."],"referencedReports":[{"title":"Cursor 0day: When Full Disclosure Becomes the Only Protection Left","url":"https://mindgard.ai/blog/cursor-0day-when-full-disclosure-becomes-the-only-protection-left","publisher":"Mindgard","context":"The article says Mindgard published full technical details of the Cursor Windows code-execution flaw seven months after reporting it to Cursor.","category":"research","primary":true},{"title":"Zero-Click RCE \u0026 Prompt Injection in AI Tools","url":"https://cymulate.com/blog/zero-click-rce-prompt-injection-ai-tools/","publisher":"Cymulate","context":"The article cites Cymulate’s advice on checking cloned repositories and later references Cymulate’s June write-up on similar Windows executable-search behavior across AI tools.","category":"research","primary":false},{"title":"GHSA-8pcm-8jpx-hv8r","url":"https://github.com/cursor/cursor/security/advisories/GHSA-8pcm-8jpx-hv8r","publisher":"Cursor","context":"The article cites this Cursor advisory as an example of another Git-related Cursor issue that was reported under coordinated disclosure and fixed in Cursor 2.5.","category":"advisory","primary":false},{"title":"Cursor IDE CVE-2026-26268 Git Hook Arbitrary Code Execution","url":"https://novee.security/blog/cursor-ide-cve-2026-26268-git-hook-arbitrary-code-execution/","publisher":"Novee","context":"The article links to Novee’s report on a separate Cursor Git-hook sandbox escape that received CVE-2026-26268.","category":"research","primary":false},{"title":"AWS Security Bulletin 2026-037","url":"https://aws.amazon.com/security/security-bulletins/2026-037-aws/","publisher":"AWS","context":"The article references AWS’s advisory assigning CVE-2026-10591 for a Kiro issue that was patched in Kiro 0.11.","category":"advisory","primary":false},{"title":"CVE-2020-26233","url":"https://nvd.nist.gov/vuln/detail/CVE-2020-26233","publisher":"National Vulnerability Database","context":"The article cites this older Git Credential Manager Core flaw as a prior example of the same untrusted search path weakness.","category":"advisory","primary":false},{"title":"Attack of the Clones 2: Git Command Client Remote Code Execution Strikes Back","url":"https://www.blazeinfosec.com/post/attack-of-the-clones-2-git-command-client-remote-code-execution-strikes-back/","publisher":"Blaze Information Security","context":"The article references Blaze Information Security’s earlier proof of concept using calc.exe renamed as git.exe.","category":"research","primary":false}],"body":"\u003cp\u003eCursor on Windows can execute a file named git.exe from a project root when a repository is opened, without a click, approval dialog, or warning. The article says the binary runs as the logged-in user and can access the user’s source code, SSH keys, and cloud tokens. Mindgard reported the flaw to Cursor on December 15, 2025 and published technical details seven months later, while the article says there was still no patch or Cursor advisory as of July 15.\u003c/p\u003e\n\n\u003cp\u003eThe mechanism described is that Cursor checks several locations for a Git binary when a project loads, including the workspace itself. Process Monitor output in Mindgard’s write-up showed Cursor.exe spawning the repository-root binary with the command line git rev-parse \u0026ndash;show-toplevel. Mindgard’s proof of concept used Windows Calculator renamed to git.exe and committed to the root, causing Calculator windows to open automatically while the project stayed open.\u003c/p\u003e\n\n\u003cp\u003eThe article says the practical risk is that cloning and opening an untrusted repository can place and run an attacker’s binary on a developer’s machine. It recommends workarounds such as AppLocker or Windows App Control path-based deny rules on managed Windows fleets, or opening untrusted repositories in a disposable VM or Windows Sandbox. It also notes similar Windows executable-search behavior reported by Cymulate in GitHub Copilot CLI, Gemini CLI, the Codex desktop app, and Cursor CLI, and compares the weakness to a Git Credential Manager Core issue from 2020.\u003c/p\u003e\n"},{"n":8,"title":"It Passed SPF, DKIM, and DMARC. It Was Still a W-2 Heist.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/w2-payroll-bec-authenticated-isp-mailbox-reply-to-third-domain","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A payroll W-2 theft attempt passed SPF, DKIM, and DMARC because it used a legitimately authenticated consumer ISP mailbox, while the real deception was display-name impersonation and a fresh third-party Reply-To domain. The key lesson is that email authentication verifies the sending domain, not the human identity or legitimacy of the request.","briefOverview":"\u003cp\u003eA payroll inbox received an urgent same-day request to send the 2025 W-2 PDFs for every employee at every location. The message had no malicious link, attachment, or malware, but it asked for highly sensitive employee tax records containing Social Security numbers, wages, and home addresses. The article frames the incident as a business email compromise attempt in which the visible sender identity was deceptive even though the email authentication checks passed.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox at \u003ccode\u003ewing.ocn[.]ne[.]jp\u003c/code\u003e and routed through the provider’s legitimate mail servers. The display name embedded the recipient organization’s name and a company leader’s identity, while the Reply-To pointed to \u003ccode\u003epointdsk[.]com\u003c/code\u003e, a third domain registered roughly two hours before the send. Microsoft assigned the message SCL 9 and routed it to Junk, while IRONSCALES quarantined it, showing that behavioral and impersonation signals identified risk that authentication did not.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main lesson is that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name. It maps the case to MITRE ATT\u0026amp;CK techniques T1566, T1598, and T1656, and cites BEC losses above 2.9 billion dollars in the FBI IC3 2024 Annual Report. The recommended takeaway is to treat authenticated email as only one signal and require out-of-band verification before sending W-2 batches, payroll changes, or employee-data exports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A payroll inbox received an urgent request to send the 2025 W-2 PDFs for every employee at every location the same day.","The message passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox and routed through the provider’s legitimate mail servers.","The email used a display name containing a company leader’s identity while the Reply-To pointed to pointdsk[.]com, a third domain registered roughly two hours before the message was sent.","Microsoft scored the message SCL 9, tagged it as high-confidence spam, and placed it in Junk, while IRONSCALES quarantined it outright.","The article emphasizes that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name."],"insights":["A clean SPF, DKIM, and DMARC result can give attackers the benefit of the doubt when defenders or mail systems are tuned to trust authenticated senders.","The decisive fraud signals were outside traditional authentication, including the external sender’s display-name mismatch, the urgent bulk-PII request, the third-domain Reply-To address, and the freshly registered reply domain.","The message contained no malicious link or attachment, showing that a dangerous email can consist only of a convincing request and a path for replies.","The article recommends an out-of-band verification rule for bulk PII requests so that W-2 batches, payroll changes, and employee-data exports are never approved based only on an email."],"referencedReports":[{"title":"FBI IC3 2024 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report for the figure that BEC losses were above 2.9 billion dollars.","category":"research","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for gateway telemetry showing BEC as roughly 3 percent of the email attack mix.","category":"research","primary":false}],"body":"\u003cp\u003eA payroll inbox received an urgent same-day request to send the 2025 W-2 PDFs for every employee at every location. The message had no malicious link, attachment, or malware, but it asked for highly sensitive employee tax records containing Social Security numbers, wages, and home addresses. The article frames the incident as a business email compromise attempt in which the visible sender identity was deceptive even though the email authentication checks passed.\u003c/p\u003e\n\n\u003cp\u003eThe message passed SPF, DKIM, and DMARC because it was sent from a compromised or attacker-controlled consumer ISP mailbox at \u003ccode\u003ewing.ocn[.]ne[.]jp\u003c/code\u003e and routed through the provider’s legitimate mail servers. The display name embedded the recipient organization’s name and a company leader’s identity, while the Reply-To pointed to \u003ccode\u003epointdsk[.]com\u003c/code\u003e, a third domain registered roughly two hours before the send. Microsoft assigned the message SCL 9 and routed it to Junk, while IRONSCALES quarantined it, showing that behavioral and impersonation signals identified risk that authentication did not.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main lesson is that SPF, DKIM, and DMARC validate the sending domain, not the human identity claimed in the display name. It maps the case to MITRE ATT\u0026amp;CK techniques T1566, T1598, and T1656, and cites BEC losses above 2.9 billion dollars in the FBI IC3 2024 Annual Report. The recommended takeaway is to treat authenticated email as only one signal and require out-of-band verification before sending W-2 batches, payroll changes, or employee-data exports.\u003c/p\u003e\n"},{"n":1,"title":"LAPD sidelines relationship with license-plate reader company Flock Safety","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/lapd-halts-flock-safety-alpr-contract","time":"13:00","priority":"SHOULD READ","score":78,"tldr":"The LAPD is pausing its use of Flock Safety license-plate reader cameras and not renewing its contract until it can secure enforceable rules on data ownership, privacy, security, and sharing. The move follows an audit finding Flock data led police to investigate 161 people whose cars were wrongly flagged as stolen.","briefOverview":"\u003cp\u003eThe Los Angeles Police Department is not renewing its contract with automated license plate reader camera company Flock Safety amid a dispute over control of the data Flock collects. The department announced on July 11 that it was putting the relationship on hold after an inspector general’s audit pushed it to stop using Flock technology until enforceable privacy and security rules are added. LAPD Chief Information Officer Dean Gialamas said the main issue is having clear terms about who owns the data and what happens to it after collection.\u003c/p\u003e\n\n\u003cp\u003eThe audit found that over a two-month period, the LAPD investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media. Gialamas said the LAPD will not use Flock until data, privacy, security, and sharing concerns are resolved through a contractual relationship. A department spokesperson confirmed the decision but did not otherwise comment.\u003c/p\u003e\n\n\u003cp\u003eFlock called the LAPD’s decision a surprise and said it is confident ongoing discussions can clear up what it described as misconceptions behind the pause. The company said it had been working with LAPD on privacy protections, auditability, accountability, and limits on data access. The article notes that thousands of police departments use Flock and similar technology, and that Flock has faced controversy over data sharing with immigration police, use in an abortion-related investigation, and tracking protesters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Los Angeles Police Department is not renewing its contract with automated license plate reader company Flock Safety amid a dispute over who controls the data Flock collects.","An inspector general’s audit urged the LAPD to stop using Flock technology until enforceable privacy and security rules are added.","The audit found that over a two-month period, the LAPD investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media.","LAPD Chief Information Officer Dean Gialamas said the department will not use Flock until data, privacy, security, and sharing concerns are resolved through a contract.","Flock said the LAPD’s decision was a surprise and that it is working with the department to ensure privacy protections, auditability, accountability, and limits on data access."],"insights":["The LAPD’s pause shows that contract terms over data ownership, sharing, privacy, and security can be decisive enough to halt police use of surveillance technology.","Los Angeles is the largest police department to break with Flock, making its decision more significant than earlier contract losses in smaller or other listed communities.","The article links Flock’s controversy to multiple real-world uses beyond stolen-car detection, including immigration enforcement, an abortion investigation, and tracking protesters.","The audit’s finding that 161 car owners were investigated after wrong stolen-vehicle matches highlights that errors in license-plate systems can directly affect innocent drivers."],"referencedReports":[],"body":"\u003cp\u003eThe Los Angeles Police Department is not renewing its contract with automated license plate reader camera company Flock Safety amid a dispute over control of the data Flock collects. The department announced on July 11 that it was putting the relationship on hold after an inspector general’s audit pushed it to stop using Flock technology until enforceable privacy and security rules are added. LAPD Chief Information Officer Dean Gialamas said the main issue is having clear terms about who owns the data and what happens to it after collection.\u003c/p\u003e\n\n\u003cp\u003eThe audit found that over a two-month period, the LAPD investigated 161 car owners whose vehicles Flock wrongly identified as stolen, according to 404 Media. Gialamas said the LAPD will not use Flock until data, privacy, security, and sharing concerns are resolved through a contractual relationship. A department spokesperson confirmed the decision but did not otherwise comment.\u003c/p\u003e\n\n\u003cp\u003eFlock called the LAPD’s decision a surprise and said it is confident ongoing discussions can clear up what it described as misconceptions behind the pause. The company said it had been working with LAPD on privacy protections, auditability, accountability, and limits on data access. The article notes that thousands of police departments use Flock and similar technology, and that Flock has faced controversy over data sharing with immigration police, use in an abortion-related investigation, and tracking protesters.\u003c/p\u003e\n"},{"n":13,"title":"New critical infrastructure cybersecurity framework features government, regional council options","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/new-critical-infrastructure-cybersecurity-framework-features-government-regional-council-options/","time":"13:45","priority":"MAY READ","score":68,"tldr":"DHS proposed a new public-private critical infrastructure collaboration framework called ANCHOR to replace the eliminated CIPAC system, shifting more cybersecurity resilience work to state and local levels. Health-ISAC warned that without legal protections for sensitive incident sharing, companies may be reluctant to participate candidly.","briefOverview":"\u003cp\u003eThe Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday. The article says this system would replace a framework that President Donald Trump eliminated weeks after returning to office. The Trump administration has said it wants to shift more cybersecurity resilience responsibilities to state and local levels.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC highlighted concerns about whether the new framework can meet its goals without addressing legal risk for participants. Errol Weiss, chief security officer at Health-ISAC, said the government needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents. He said industry leaders relied on legal protections in the old CIPAC framework to hold candid, strategic conversations about sensitive vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article points readers to SmartCities Dive for the full report on the proposed system. It frames the issue around information sharing between government and industry for critical infrastructure risk mitigation. The key impact described is that legal concerns may limit companies’ willingness to share sensitive incident and vulnerability information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday.","The proposed system would replace a framework that President Donald Trump eliminated weeks after returning to office.","The Trump administration has said it wants to shift more cybersecurity resilience responsibilities to state and local levels.","Errol Weiss of Health-ISAC said the government needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents.","Weiss said industry leaders relied on legal protections in the old CIPAC framework to have candid, strategic conversations about sensitive vulnerabilities."],"insights":["Health-ISAC frames legal exposure as a practical barrier to ANCHOR’s success, meaning the effectiveness of the new collaboration system depends partly on whether participants feel legally safe sharing sensitive incident details.","The old CIPAC framework’s value to industry leaders was not just its collaboration structure, but the legal protections that enabled candid discussions about sensitive vulnerabilities.","The proposed replacement comes as the Trump administration is emphasizing more state and local responsibility for cybersecurity resilience, making regional participation a central part of the new approach."],"referencedReports":[],"body":"\u003cp\u003eThe Department of Homeland Security proposed a new public-private critical infrastructure collaboration system on Tuesday. The article says this system would replace a framework that President Donald Trump eliminated weeks after returning to office. The Trump administration has said it wants to shift more cybersecurity resilience responsibilities to state and local levels.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC highlighted concerns about whether the new framework can meet its goals without addressing legal risk for participants. Errol Weiss, chief security officer at Health-ISAC, said the government needs to address legal exposures that often prevent companies from sharing information about sensitive cyber incidents. He said industry leaders relied on legal protections in the old CIPAC framework to hold candid, strategic conversations about sensitive vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article points readers to SmartCities Dive for the full report on the proposed system. It frames the issue around information sharing between government and industry for critical infrastructure risk mitigation. The key impact described is that legal concerns may limit companies’ willingness to share sensitive incident and vulnerability information.\u003c/p\u003e\n"},{"n":9,"title":"5 reasons to bring application security data into your exposure management platform","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/application-security-data-exposure-management-integration","time":"12:45","priority":"MAY READ","score":55,"tldr":"Tenable argues that integrating application security scanner data into an exposure management platform gives teams code-to-runtime visibility and the context needed to prioritize the riskiest flaws. This helps reduce alert noise, automate remediation, and translate application security risk into business-level exposure metrics.","briefOverview":"\u003cp\u003eThe article argues that organizations should integrate application security scanner data into an exposure management platform to gain broader visibility into code flaws and their real-world risk. It says application security data often sits in isolated code-scanning tools, making it difficult to correlate code issues with risks in cloud workloads, on-prem assets, operational technology systems, identity platforms, and other environments. This can prevent security teams from properly assessing, prioritizing, and remediating vulnerabilities as quickly as developers release code.\u003c/p\u003e\n\n\u003cp\u003eThe article says the challenge is growing as developers use AI tools to create and release code faster through continuous integration and continuous deployment pipelines. It cites statistics claiming that developers using AI coding assistants commit code three to four times faster but introduce security findings at 10 times the rate, that 45% of AI-generated code contains known security flaws, and that CVEs attributed to AI coding tools tripled month-over-month in early 2026. The article also says new agentic application security testing tools may increase the number of discovered code vulnerabilities and worsen alert fatigue unless their findings are placed in broader risk context.\u003c/p\u003e\n\n\u003cp\u003eThe article lists five reasons to bring application security data into exposure management: visibility, agentic application security testing integration, prioritization context, organizational exposure, and remediation mobilization. It says this approach can show where code is written and deployed, who owns it, where it is running, whether it is exposed externally, whether it affects production or critical business applications, and how it contributes to overall organizational risk. The article concludes by describing how Tenable One can ingest and normalize static-code security data from tools such as Snyk and other application security testing tools so organizations can manage application security risk alongside other exposure data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that application security data often remains isolated in code-scanning tools, making it difficult to correlate code flaws with security issues in cloud workloads, on-prem assets, operational technology systems, identity platforms, and other parts of the environment.","The article says integrating application security scanner data into an exposure management platform provides code-to-runtime visibility, including where developers write and deploy code, who owns it, where the code is running, and its blast radius.","The article states that exposure management can help prioritize code vulnerabilities by considering context such as whether assets are in production, user identities and entitlements, external accessibility, business criticality, and compliance requirements.","The article says integrating agentic application security testing tools with an exposure management platform can help deduplicate code-security findings, investigate issues, assess risk, and orchestrate remediations and patches.","The article explains that Tenable One can ingest and normalize static-code security data from tools such as Snyk and other application security testing tools so organizations can manage application security risk alongside other exposure data."],"insights":["AI coding assistants are presented as a force multiplier for both development speed and security findings, with the article citing claims that users commit code three to four times faster while introducing security findings at 10 times the rate.","The same code flaw can warrant very different urgency depending on where it runs, such as an isolated QA environment versus a customer authentication API, making runtime and business context essential for remediation decisions.","The article frames application security metrics as board-level business risk measures, arguing that code flaws can be tied to resilience, financial risk, compliance penalties, industry benchmarking, and business-line accountability.","A unified exposure management platform can reduce friction between security and development teams by narrowing large lists of code issues to a smaller set of critical fixes and even providing pre-written pull requests.","The article says integrating application security data can help CISOs compare development teams by how safely they produce code and whether they consistently meet security SLAs."],"referencedReports":[{"title":"Bad Vibes: AI-generated code is vulnerable, researchers warn","url":"https://research.gatech.edu/bad-vibes-ai-generated-code-vulnerable-researchers-warn","publisher":"Georgia Tech","context":"The article cites Georgia Tech research for the claim that CVEs directly attributable to AI coding tools tripled month-over-month in early 2026.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that organizations should integrate application security scanner data into an exposure management platform to gain broader visibility into code flaws and their real-world risk. It says application security data often sits in isolated code-scanning tools, making it difficult to correlate code issues with risks in cloud workloads, on-prem assets, operational technology systems, identity platforms, and other environments. This can prevent security teams from properly assessing, prioritizing, and remediating vulnerabilities as quickly as developers release code.\u003c/p\u003e\n\n\u003cp\u003eThe article says the challenge is growing as developers use AI tools to create and release code faster through continuous integration and continuous deployment pipelines. It cites statistics claiming that developers using AI coding assistants commit code three to four times faster but introduce security findings at 10 times the rate, that 45% of AI-generated code contains known security flaws, and that CVEs attributed to AI coding tools tripled month-over-month in early 2026. The article also says new agentic application security testing tools may increase the number of discovered code vulnerabilities and worsen alert fatigue unless their findings are placed in broader risk context.\u003c/p\u003e\n\n\u003cp\u003eThe article lists five reasons to bring application security data into exposure management: visibility, agentic application security testing integration, prioritization context, organizational exposure, and remediation mobilization. It says this approach can show where code is written and deployed, who owns it, where it is running, whether it is exposed externally, whether it affects production or critical business applications, and how it contributes to overall organizational risk. The article concludes by describing how Tenable One can ingest and normalize static-code security data from tools such as Snyk and other application security testing tools so organizations can manage application security risk alongside other exposure data.\u003c/p\u003e\n"},{"n":11,"title":"Life Finds a Way: Securing the Enterprise When Everyone Is a Developer","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/life-finds-a-way-securing-the-enterprise-when-everyone-is-a-developer/","time":"10:34","priority":"MAY READ","score":55,"tldr":"AI agents are rapidly breaking long-held security assumptions by making everyone a developer, expanding unmanaged attack surfaces, and compressing exploitation timelines from weeks to hours. Security teams need to embrace and secure agentic tools at scale rather than rely on traditional basics or slow adoption cycles.","briefOverview":"\u003cp\u003eRob Gurzeev of CyCognito interviewed Gadi Evron, founder and CEO of Knostic and CISO-in-Residence for AI at the Cloud Security Alliance, about how AI is changing enterprise security. Evron argues that security programs are being forced to adapt because AI agents and coding tools now let many more people create software, workflows, and infrastructure. The conversation centers on the idea that “shadow AI” or “shadow IT” may no longer be enough to describe the situation, because AI-driven building is spreading across organizations.\u003c/p\u003e\n\n\u003cp\u003eA major theme is that long-standing security assumptions are breaking. Evron says vulnerabilities are becoming easier to find with tools like Claude Code, time to exploitation has collapsed from weeks or months to hours, and defenders can no longer rely on older signals such as CVEs, KEV timing, poor phishing language, or quick vendor patches. Gurzeev adds that AI can make it easier to exploit production systems cheaply and quickly when it is given deep context from attack surface management.\u003c/p\u003e\n\n\u003cp\u003eThe article also emphasizes scale and coverage as central problems for security teams. Gurzeev and Evron discuss how organizations may face thousands of new applications, agents, MCP servers, extensions, and workflows, many of which may not be centrally managed or secure. Evron recommends that leaders stay hands-on with AI agents, push employees to use and understand them, work closely with vendors, and be prepared to change direction quickly as tools and risks evolve.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Gadi Evron argues that AI agents are shifting enterprise security from centrally managed IT and shadow IT concerns to an environment where everyone can build infrastructure, workflows, and applications.","The discussion highlights that AI has reduced the time from vulnerability discovery to exploitation from weeks or months to hours, making old patching and prioritization assumptions less reliable.","Evron says that simply “doing the basics” is no longer sufficient because agents can take unexpected actions and organizations may not even know what those agents have done.","Rob Gurzeev and Evron emphasize that security teams now face a scale and coverage problem because many more applications, agents, MCP servers, extensions, and workflows can appear across an organization.","Evron recommends that leaders stay hands-on with AI agents, work closely with vendors and startups, and help employees learn to use these tools rather than trying to block adoption."],"insights":["Evron argues that the same AI agents creating security risk may be the only practical way for organizations to keep up with basic security work, because human-speed processes cannot match the new pace of exploitation.","The article frames “do the basics” as a new kind of silver-bullet thinking, because breach reports often show organizations tried to address fundamentals but still could not cover decades of accumulated security debt.","Evron says security leaders should demand that vendors explain how they keep up with rapid AI-driven change and should ask to be embedded in vendor roadmaps, not just receive product support.","The conversation suggests that security hiring and engineering evaluation are changing from traditional coding tests toward observing whether candidates can use AI tools agentically to produce and test a working proof of concept quickly.","Evron describes research as a standalone business function whose job is to find the next pivot every month, reflecting the article’s view that security vendors may need to be ready to discard recent work as AI capabilities change."],"referencedReports":[],"body":"\u003cp\u003eRob Gurzeev of CyCognito interviewed Gadi Evron, founder and CEO of Knostic and CISO-in-Residence for AI at the Cloud Security Alliance, about how AI is changing enterprise security. Evron argues that security programs are being forced to adapt because AI agents and coding tools now let many more people create software, workflows, and infrastructure. The conversation centers on the idea that “shadow AI” or “shadow IT” may no longer be enough to describe the situation, because AI-driven building is spreading across organizations.\u003c/p\u003e\n\n\u003cp\u003eA major theme is that long-standing security assumptions are breaking. Evron says vulnerabilities are becoming easier to find with tools like Claude Code, time to exploitation has collapsed from weeks or months to hours, and defenders can no longer rely on older signals such as CVEs, KEV timing, poor phishing language, or quick vendor patches. Gurzeev adds that AI can make it easier to exploit production systems cheaply and quickly when it is given deep context from attack surface management.\u003c/p\u003e\n\n\u003cp\u003eThe article also emphasizes scale and coverage as central problems for security teams. Gurzeev and Evron discuss how organizations may face thousands of new applications, agents, MCP servers, extensions, and workflows, many of which may not be centrally managed or secure. Evron recommends that leaders stay hands-on with AI agents, push employees to use and understand them, work closely with vendors, and be prepared to change direction quickly as tools and risks evolve.\u003c/p\u003e\n"},{"n":4,"title":"Firefox, Chrome, Adobe, and VMware Updates Fix Multiple Critical Security Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/firefox-chrome-adobe-and-vmware-updates.html","time":"13:18","priority":"MAY READ","score":40,"tldr":"Mozilla, Google, Adobe, and Broadcom released security updates fixing multiple critical flaws across Firefox, Chrome, Adobe products, and VMware Avi Load Balancer. Organizations should patch promptly, especially because public exploit code exists for two Firefox vulnerabilities.","briefOverview":"\u003cp\u003eMozilla released Firefox version 152.0.6 to address two critical vulnerabilities, CVE-2026-15718 and CVE-2026-15719. Mozilla said exploit code for the flaws is public, but it is not aware of any attacks in the wild abusing them. The flaws affect the JavaScript: WebAssembly and DOM: Navigation components.\u003c/p\u003e\n\n\u003cp\u003eGoogle also shipped fixes for 15 Chrome security flaws, including two critical use-after-free bugs in Ozone tracked as CVE-2026-15764 and CVE-2026-15765. The article says CVE-2026-15764 could allow a remote attacker who convinces a user to perform specific UI gestures to potentially exploit heap corruption through a crafted HTML page. The Chrome fixes are included in version 150.0.7871.124/.125 for Windows and Mac and 150.0.7871.124 for Linux.\u003c/p\u003e\n\n\u003cp\u003eAdobe published security updates for 88 vulnerabilities, including multiple critical-severity bugs in ColdFusion, Commerce, Experience Manager, and Illustrator. The ColdFusion issues include path traversal, code injection, improper input validation, incorrect authorization, missing authentication for a critical function, and SQL injection flaws that could lead to arbitrary code execution or privilege escalation. Broadcom also released a fix for CVE-2026-47865, a critical authentication bypass vulnerability in VMware Avi Load Balancer that could let a malicious user with network access access the Avi Control plane.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mozilla released Firefox 152.0.6 to fix two critical vulnerabilities, CVE-2026-15718 and CVE-2026-15719, and said public exploit code exists but it is not aware of attacks in the wild.","Google fixed 15 security flaws in Chrome, including two critical use-after-free bugs in Ozone tracked as CVE-2026-15764 and CVE-2026-15765.","Adobe published security updates for 88 vulnerabilities, including critical flaws in ColdFusion, Commerce, Experience Manager, and Illustrator.","Adobe fixed eight ColdFusion vulnerabilities that could lead to outcomes including arbitrary code execution and privilege escalation in ColdFusion 2025 Update 11 and ColdFusion 2023 Update 22.","Broadcom released a fix for CVE-2026-47865, a critical authentication bypass vulnerability in VMware Avi Load Balancer that could allow a malicious user with network access to access the Avi Control plane."],"insights":["The Firefox fixes are especially urgent because Mozilla says exploit code is already public, even though it has not seen attacks using the flaws in the wild.","The Chrome Ozone flaw description says exploitation requires convincing a user to perform specific UI gestures on a crafted HTML page, narrowing the conditions under which the bug can be abused.","Adobe ColdFusion stands out in Adobe’s update set because eight listed flaws affect it and several could lead to arbitrary code execution, with CVSS scores as high as 9.9.","The VMware Avi Load Balancer issue is particularly sensitive because the article says a malicious user with network access could reach the Avi Control plane through the authentication bypass flaw.","The article emphasizes prompt patching even without confirmed active exploitation because threat actors are known to weaponize flaws in these products."],"referencedReports":[{"title":"Mozilla Foundation Security Advisory 2026-67","url":"https://www.mozilla.org/en-US/security/advisories/mfsa2026-67/","publisher":"Mozilla","context":"The article cites Mozilla's advisory for fixes to two critical Firefox flaws with public exploit code.","category":"advisory","primary":true},{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/07/stable-channel-update-for-desktop_0353146366.html","publisher":"Google","context":"The article cites Google's Chrome release notes for fixes to 15 security flaws, including two critical Ozone use-after-free bugs.","category":"advisory","primary":true},{"title":"Adobe Security Bulletin APSB26-82","url":"https://helpx.adobe.com/in/security/products/coldfusion/apsb26-82.html","publisher":"Adobe","context":"The article cites Adobe's ColdFusion security bulletin for eight vulnerabilities fixed in ColdFusion 2025 Update 11 and ColdFusion 2023 Update 22.","category":"advisory","primary":true},{"title":"Adobe Security Bulletin APSB26-73","url":"https://helpx.adobe.com/in/security/products/magento/apsb26-73.html","publisher":"Adobe","context":"The article cites Adobe's Commerce and Magento Open Source security bulletin for two critical flaws.","category":"advisory","primary":true},{"title":"Adobe Security Bulletin APSB26-74","url":"https://helpx.adobe.com/in/security/products/experience-manager/apsb26-74.html","publisher":"Adobe","context":"The article cites Adobe's Experience Manager security bulletin for two critical flaws.","category":"advisory","primary":true},{"title":"Broadcom Security Advisory 37926","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926","publisher":"Broadcom","context":"The article cites Broadcom's advisory for a critical authentication bypass vulnerability in VMware Avi Load Balancer.","category":"advisory","primary":true}],"body":"\u003cp\u003eMozilla released Firefox version 152.0.6 to address two critical vulnerabilities, CVE-2026-15718 and CVE-2026-15719. Mozilla said exploit code for the flaws is public, but it is not aware of any attacks in the wild abusing them. The flaws affect the JavaScript: WebAssembly and DOM: Navigation components.\u003c/p\u003e\n\n\u003cp\u003eGoogle also shipped fixes for 15 Chrome security flaws, including two critical use-after-free bugs in Ozone tracked as CVE-2026-15764 and CVE-2026-15765. The article says CVE-2026-15764 could allow a remote attacker who convinces a user to perform specific UI gestures to potentially exploit heap corruption through a crafted HTML page. The Chrome fixes are included in version 150.0.7871.124/.125 for Windows and Mac and 150.0.7871.124 for Linux.\u003c/p\u003e\n\n\u003cp\u003eAdobe published security updates for 88 vulnerabilities, including multiple critical-severity bugs in ColdFusion, Commerce, Experience Manager, and Illustrator. The ColdFusion issues include path traversal, code injection, improper input validation, incorrect authorization, missing authentication for a critical function, and SQL injection flaws that could lead to arbitrary code execution or privilege escalation. Broadcom also released a fix for CVE-2026-47865, a critical authentication bypass vulnerability in VMware Avi Load Balancer that could let a malicious user with network access access the Avi Control plane.\u003c/p\u003e\n"},{"n":3,"title":"New Webinar: Closing the Approval Gap in AI-Era Ad Tech","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-webinar-closing-approval-gap-in-ai.html","time":"11:06","priority":"MAY READ","score":35,"tldr":"Reflectiz is promoting an on-demand webinar with Taboola on the “Approval Gap,” where approved marketing tags can silently load unvetted fourth-party scripts with access to sensitive browser-side data. The key takeaway is that security teams need continuous visibility and governance over ad tech scripts because one-time vendor approval no longer reflects what is actually running on their sites.","briefOverview":"\u003cp\u003eReflectiz is promoting an on-demand webinar with Taboola about what it calls the Approval Gap in AI-era ad tech. The article describes this gap as the distance between a marketing vendor that security approved and the third- and fourth-party scripts actually running in users’ browsers later. It says a single approved marketing tag can load additional code that security teams have never reviewed.\u003c/p\u003e\n\n\u003cp\u003eThe article says these client-side scripts can have the same access to forms, checkout fields, and customer data as code written by the site’s own engineers. Reflectiz co-founder and CEO Idan Cohen and Taboola Director of Product Omri Ariav discuss the issue from both the security and ad tech platform sides. Ariav says initial approval is not the finish line and that organizations need continuous monitoring, sandboxing, and checks against security standards.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is presented as a way to help teams inventory, monitor, and govern their web supply chain without slowing marketing work. The article says AI-driven ad tech is increasing integrations, endpoints, and data flows faster than point-in-time audits can track. It also connects the issue to compliance concerns including GDPR, CCPA, and PCI DSS 4.0.1 Requirements 6.4.3 and 11.6.1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Reflectiz is offering an on-demand webinar with Taboola about the “Approval Gap,” where a previously approved marketing tag may later load third- and fourth-party scripts that security teams have not reviewed.","The article says these client-side scripts can have access to forms, checkout fields, and customer data in users’ browsers.","Reflectiz co-founder and CEO Idan Cohen and Taboola Director of Product Omri Ariav discuss the issue from both the security-monitoring and ad tech platform perspectives.","The article argues that AI-driven ad tech is creating new integrations, endpoints, and data flows faster than point-in-time audits can track.","The webinar promises a three-step playbook to inventory, monitor, and govern an organization’s web supply chain without creating operational friction."],"insights":["A vendor’s initial security approval can become outdated quickly because the article says a script that was clean at approval can change the day after.","The article frames inability to answer questions about loaded code as a risk signal, stating that a vendor that cannot answer is not necessarily malicious but is unmonitored.","The first actionable vendor question highlighted is to ask what other code a marketing tag loads and who vetted it before allowing the tag onto a site.","The article identifies excessive tracking tools as a major retail exposure source, citing Reflectiz’s State of Web Exposure Report 2026 finding that 53% of retail risk exposures stem from them.","The article suggests the responsibility gap between marketing’s speed and security’s thoroughness is where undisclosed script calls can slip past firewalls, WAFs, and point-in-time code review."],"referencedReports":[],"body":"\u003cp\u003eReflectiz is promoting an on-demand webinar with Taboola about what it calls the Approval Gap in AI-era ad tech. The article describes this gap as the distance between a marketing vendor that security approved and the third- and fourth-party scripts actually running in users’ browsers later. It says a single approved marketing tag can load additional code that security teams have never reviewed.\u003c/p\u003e\n\n\u003cp\u003eThe article says these client-side scripts can have the same access to forms, checkout fields, and customer data as code written by the site’s own engineers. Reflectiz co-founder and CEO Idan Cohen and Taboola Director of Product Omri Ariav discuss the issue from both the security and ad tech platform sides. Ariav says initial approval is not the finish line and that organizations need continuous monitoring, sandboxing, and checks against security standards.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is presented as a way to help teams inventory, monitor, and govern their web supply chain without slowing marketing work. The article says AI-driven ad tech is increasing integrations, endpoints, and data flows faster than point-in-time audits can track. It also connects the issue to compliance concerns including GDPR, CCPA, and PCI DSS 4.0.1 Requirements 6.4.3 and 11.6.1.\u003c/p\u003e\n"},{"n":5,"title":"SASE Has An AI Blind Spot. Inspecting Packets Is No Longer Enough.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sase-has-ai-blind-spot-inspecting.html","time":"11:50","priority":"MAY READ","score":35,"tldr":"Traditional SASE architectures that rely on cloud proxy packet inspection struggle to see and control AI and SaaS interactions happening in the browser, especially with modern encryption and certificate pinning. The article argues enforcement must move closer to the endpoint and browser to inspect user intent before data leaves the device.","briefOverview":"\u003cp\u003eThe article argues that traditional SASE models based on routing traffic through cloud proxies are no longer sufficient for modern enterprise work. It says work has moved into SaaS applications, browsers, generative AI tools, unsanctioned browser extensions, and autonomous agents. As a result, important data interactions now happen at the presentation layer, which network-centric architectures were not designed to observe.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that traditional SASE depends on decrypting, inspecting, and enforcing policy through cloud proxies. I
