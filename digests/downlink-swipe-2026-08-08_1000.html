<script type="application/json" id="dl-articles">[{"n":1,"title":"A Carrier's Own DKIM Signed a Bank Credential Phish","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/hijacked-sendgrid-domain-authentication-four-hour-old-landing-domain","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing email impersonating Crédit Agricole passed SPF, DKIM, DMARC, and Microsoft composite authentication because attackers abused a properly configured SendGrid sending channel belonging to a European logistics carrier. The key lesson is that email authentication proves domain control, not brand legitimacy, so defenses must also evaluate display-name/domain mismatch, link destinations, and newly registered landing domains.","briefOverview":"\u003cp\u003eA bank credential phishing message reached a manufacturing mailbox while SPF, DKIM, DMARC, and Microsoft composite authentication all passed. The email used Crédit Agricole branding, but the authenticated sending domain belonged to a real European logistics carrier with no plausible connection to retail banking. The article says the carrier was a second victim because its own email service provider domain authentication had been hijacked, allowing the attacker to inherit a reputable sending channel.\u003c/p\u003e\n\n\u003cp\u003eThe message’s single call to action was a French device-renewal request that routed through SendGrid click tracking before landing on \u003ccode\u003einfo-actualisation-client[.]com\u003c/code\u003e. That landing domain was created roughly four hours before the message was sent, had privacy-shielded registrant fields, was unsigned for DNSSEC, and used nameservers with a low-profile hosting operator. The subject line included invisible zero-width characters and a trailing word joiner, and the message included a one-pixel open beacon on the same provider account.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that email authentication proved the provider domain authentication had been hijacked, allowing the attacker to inherit a reputable sending channel.\u003c/p\u003e\n\n\u003cp\u003eThe message’s single call to action was a French device-renewal request that routed through SendGrid click tracking before landing on \u003ccode\u003einfo-actualisation-client[.]com\u003c/code\u003e. That landing domain was created roughly four hours before the message was sent, had privacy-shielded registrant fields, was unsigned for DNSSEC, and used nameservers with a low-profile hosting operator. The subject line included invisible zero-width characters and a trailing word joiner, and the message included a one-pixel open beacon on the same provider account.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that email authentication proved the carrier’s domain was in control of the sending channel, not that the visible bank brand was legitimate. Microsoft composite authentication returned its strongest pass result, while the same platform also marked the message as spam with an SCL score of 5. Themis flagged the call-to-action link as malicious, scored the message at 88% confidence for credential theft, and automatically resolved the incident as phishing for the single affected mailbox.\u003c/p\u003e\n"}]</script>
