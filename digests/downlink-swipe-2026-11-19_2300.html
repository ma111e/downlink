<script type="application/json" id="dl-articles">[{"n":1,"title":"VMware patches vCenter zero-day exploited in attacks since September","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/vmware-patches-vcenter-zero-day-exploited-in-attacks-since-september/","time":"00:26","priority":"MUST READ","score":98,"tldr":"Broadcom has patched CVE-2026-123890, a critical VMware vCenter authentication-bypass flaw that Mandiant says Chinese-linked Armory Castle exploited as a zero-day since September 2026 to gain administrator access and compromise virtualized environments. Organizations should urgently update affected vCenter deployments, as no official workaround is available.","briefOverview":"\u003cp\u003eBroadcom released security updates on November 19 for CVE-2026-123890, a critical authentication-bypass flaw in VMware vCenter Server’s Directory Service. The company said an unauthenticated attacker with network access could bypass authentication and gain unauthorized access to a vulnerable vCenter server. Successful exploitation can provide administrative control over the virtual machines managed by vCenter, and Broadcom urged organizations to install the patches promptly.\u003c/p\u003e\n\n\u003cp\u003eMandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw as a zero-day beginning in early September 2026. The attackers reportedly used a custom Golang tool called BONESAW to create a vCenter SSO administrator account, obtain the directory database, and extract SAML signing keys; they then used SAWSNAKE to forge authentication tokens and bypass multifactor authentication. The campaign also involved a BeyondTrust Remote Support zero-day, Linux web shells, lateral movement into VMware infrastructure, access to ESXi hosts, and theft of sensitive information from virtual machines, including Windows Active Directory database files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Broadcom released security updates on November 19 to fix CVE-2026-123890, a critical VMware vCenter Server authentication-bypass vulnerability.","Mandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw in attacks beginning in early September 2026.","Exploitation can create an authenticated vCenter session as administrator@vsphere.local, enabling attackers to execute commands and obtain files such as the vCenter directory database.","Mandiant observed attackers using the BONESAW tool to create a vCenter SSO administrator account, steal the directory database, and extract SAML signing keys.","Broadcom urged organizations to install the patches promptly because no official workaround is available, although network restrictions and firewall controls can reduce exposure."],"insights":["The campaign combined a BeyondTrust Remote Support zero-day with the VMware vCenter flaw, allowing the attackers to move from compromised remote-support appliances through internal Linux systems to VMware infrastructure.","By stealing SAML signing keys and using SAWSNAKE, the attackers could forge login tokens, bypass multifactor authentication, and impersonate legitimate users after the initial vCenter compromise.","The vCenter flaw affects deployments whether or not Enhanced Linked Mode is enabled, so that setting does not limit exposure to this issue.","Mandiant observed multiple platform-specific tools and web shells in the campaign, including BONESAW for vCenter and SLIMSAVAGE on Linux systems, which supported persistence, credential theft, and movement through the victim environment."],"referencedReports":[{"title":"VMSA-2026-0009","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md","publisher":"broadcom","context":"Broadcom's security advisory identifies affected VMware products, fixed versions, and the lack of official workarounds.","category":"advisory","primary":true},{"title":"Armory Castle Exploits vSphere","url":"http://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"google-mandiant-and-google-threat-intelligence-group","context":"Mandiant and Google Threat Intelligence Group's report documents Armory Castle's exploitation of CVE-2026-123890 and the tools used in the intrusion campaign.","category":"research","primary":true}],"body":"\u003cp\u003eBroadcom released security updates on November 19 for CVE-2026-123890, a critical authentication-bypass flaw in VMware vCenter Server’s Directory Service. The company said an unauthenticated attacker with network access could bypass authentication and gain unauthorized access to a vulnerable vCenter server. Successful exploitation can provide administrative control over the virtual machines managed by vCenter, and Broadcom urged organizations to install the patches promptly.\u003c/p\u003e\n\n\u003cp\u003eMandiant and Google Threat Intelligence Group reported that the suspected Chinese state-sponsored group Armory Castle exploited the flaw as a zero-day beginning in early September 2026. The attackers reportedly used a custom Golang tool called BONESAW to create a vCenter SSO administrator account, obtain the directory database, and extract SAML signing keys; they then used SAWSNAKE to forge authentication tokens and bypass multifactor authentication. The campaign also involved a BeyondTrust Remote Support zero-day, Linux web shells, lateral movement into VMware infrastructure, access to ESXi hosts, and theft of sensitive information from virtual machines, including Windows Active Directory database files.\u003c/p\u003e\n"},{"n":3,"title":"nginx2root: Five new nginx vulnerabilities, and how Cloudflare protects origins from the worst of them","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/nginx2root/","time":"01:58","priority":"MUST READ","score":96,"tldr":"Five newly disclosed nginx2root flaws, especially CVE-2026-123007 in HTTP/2, can enable remote code execution on vulnerable nginx servers and should be patched immediately. Cloudflare-proxied origins are shielded from the HTTP/2 and HTTP/3 attack paths only if attackers cannot directly reach the origin, but resolver and mail-proxy configurations still require remediation.","briefOverview":"\u003cp\u003eF5 and nginx.org disclosed ten nginx vulnerabilities on November 18, 2026, including five memory-corruption flaws collectively called nginx2root. The flaws can allow an unauthenticated attacker to crash an nginx worker and, according to Xint’s research, potentially run commands as the nginx worker. CVE-2026-123007, affecting HTTP/2-enabled nginx releases since 2015, is presented as the most serious because HTTP/2 is commonly enabled and the bug can lead to an out-of-bounds memory read/write. Xint also identified a separate Linux SCTP kernel flaw that could reportedly elevate nginx-worker code execution to root access on the host, including from a Docker container.\u003c/p\u003e\n\n\u003cp\u003eCloudflare states that its edge is not affected and that origins behind its HTTP proxy are shielded from the HTTP/2 and HTTP/3 flaws because client connections end at Cloudflare rather than reaching nginx directly. This protection does not apply if attackers can connect directly to an origin, nor does it fully protect the resolver flaw CVE-2026-123634 or the mail-proxy flaw CVE-2026-113425. Organizations are advised to update nginx Open Source to 1.30.7 or 1.31.9, nginx Plus to fixed 37.x releases, restart nginx after updating, and restrict origins so they are reachable only through Cloudflare. The article also recommends disabling unneeded HTTP/2, HTTP/3, mail-proxy, and SCTP functionality as temporary mitigations where patching is delayed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 and nginx.org disclosed five nginx2root memory-corruption vulnerabilities on November 18, 2026, including CVE-2026-123007, an HTTP/2 flaw affecting nginx releases since 1.9.5.","CVE-2026-123007 can be triggered when HTTP/2 is enabled and, according to the cited research, may allow an unauthenticated attacker to crash an nginx worker or run commands after bypassing address randomization protections.","Cloudflare says its HTTP proxy protects proxied origins from the HTTP/2 and HTTP/3 nginx2root attacks because client connections terminate at Cloudflare’s edge, but this protection does not apply when an attacker can reach the origin directly.","The resolver flaw CVE-2026-123634 and the mail-proxy flaw CVE-2026-113425 are not fully protected by Cloudflare’s HTTP proxy and require affected nginx configurations to be patched or restricted.","Organizations should update to nginx Open Source 1.30.7 or 1.31.9, nginx Plus 37.0.8.1 or 37.3.0.1, or a vendor-provided fixed build, then restart nginx."],"insights":["Cloudflare’s protection is based on ending and recreating web connections at its edge, not on a WAF signature, so attacker-controlled HTTP/2 and HTTP/3 control messages never reach a properly isolated nginx origin.","The known CVE-2026-123007 attack path requires unusually large traffic volumes—about 128 GB in Rapid7’s proof of concept—over one long-lived HTTP/2 connection, creating a potentially visible pattern of massive inbound traffic with little response traffic.","A configuration reload does not replace nginx’s running program, so organizations must restart nginx or complete a binary upgrade after installing a fixed package.","The related Linux SCTP flaw can reportedly turn code execution as an nginx worker into root access on the host, including from an nginx container, and systems that do not use SCTP can block automatic loading of its kernel module as a temporary safeguard.","Package version output alone may be misleading because Linux distributions can backport fixes without changing nginx’s reported upstream version, so administrators need to compare full package versions with their distribution’s advisory."],"referencedReports":[{"title":"NGINX2Root technical write-up","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"Xint","context":"The article relies on Xint’s technical research for exploit conditions, code-execution findings, and the related Linux SCTP kernel flaw.","category":"research","primary":true},{"title":"F5 advisory index K000164058","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"F5","context":"The article cites F5’s advisory for severity ratings, affected nginx configurations, and fixed nginx Plus releases.","category":"advisory","primary":true},{"title":"nginx security advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx.org","context":"The article references nginx.org’s security-advisory material for the coordinated disclosure and fixed releases.","category":"advisory","primary":true},{"title":"CVE-2026-123007 Critical NGINX HTTP/2 Integer Underflow Leads to RCE","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"Rapid7","context":"The article cites Rapid7’s analysis and proof of concept for the HTTP/2 flaw’s proxy behavior and estimated traffic requirements.","category":"research","primary":false},{"title":"nginx2root simple test","url":"https://censys.com/blog/nginx2root-simple-test","publisher":"Censys","context":"The article cites Censys’s test showing that the corrupted HTTP/2 flow-control state can be reached with a small traffic capture.","category":"research","primary":false},{"title":"nginx HTTP/2 RCE vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"Wiz Research","context":"The article cites Wiz Research among the independent researchers that reported code execution related to the HTTP/2 vulnerability.","category":"research","primary":false}],"body":"\u003cp\u003eF5 and nginx.org disclosed ten nginx vulnerabilities on November 18, 2026, including five memory-corruption flaws collectively called nginx2root. The flaws can allow an unauthenticated attacker to crash an nginx worker and, according to Xint’s research, potentially run commands as the nginx worker. CVE-2026-123007, affecting HTTP/2-enabled nginx releases since 2015, is presented as the most serious because HTTP/2 is commonly enabled and the bug can lead to an out-of-bounds memory read/write. Xint also identified a separate Linux SCTP kernel flaw that could reportedly elevate nginx-worker code execution to root access on the host, including from a Docker container.\u003c/p\u003e\n\n\u003cp\u003eCloudflare states that its edge is not affected and that origins behind its HTTP proxy are shielded from the HTTP/2 and HTTP/3 flaws because client connections end at Cloudflare rather than reaching nginx directly. This protection does not apply if attackers can connect directly to an origin, nor does it fully protect the resolver flaw CVE-2026-123634 or the mail-proxy flaw CVE-2026-113425. Organizations are advised to update nginx Open Source to 1.30.7 or 1.31.9, nginx Plus to fixed 37.x releases, restart nginx after updating, and restrict origins so they are reachable only through Cloudflare. The article also recommends disabling unneeded HTTP/2, HTTP/3, mail-proxy, and SCTP functionality as temporary mitigations where patching is delayed.\u003c/p\u003e\n"},{"n":2,"title":"nginx2root (CVE-2026-123007): HTTP/2 Flaw Lets Attackers Run Code on Unpatched nginx Servers","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-123007-nginx-http2-rce","time":"00:05","priority":"MUST READ","score":94,"tldr":"CVE-2026-123007 (nginx2root) is a critical HTTP/2 flow-control flaw affecting nginx 1.9.5–1.31.8 that can enable unauthenticated worker-process code execution under favorable conditions. Upgrade to nginx 1.31.9 or 1.30.7 (or a vendor-backported fixed package) and restart nginx; disable HTTP/2 if patching is not immediately possible.","briefOverview":"\u003cp\u003enginx released versions 1.31.9 and 1.30.7 on November 18, 2026, fixing CVE-2026-123007, an HTTP/2 flaw included in the nginx2root disclosure. The issue affects nginx 1.9.5 through 1.31.8 when HTTP/2 is enabled and can allow unauthenticated code execution as the nginx worker user. A public exploit is available, although the article reports no known exploitation in the wild as of November 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw results from HTTP/2 connection flow-control accounting that can refund queued response data twice, allowing nginx\u0026rsquo;s send-window value to exceed its allowed maximum and eventually trigger a memory-corrupting copy. The published full exploit reportedly requires a direct connection to nginx, about 119 GiB of traffic within nginx\u0026rsquo;s one-hour connection limit, an otherwise idle server, and AVX-512 support on the server CPU; a smaller proof of concept can crash a worker without AVX-512. The article\u0026rsquo;s tests found that version 1.31.9 rejected the malicious extra credit, while vulnerable version 1.31.8 could be crashed and, under the tested conditions, made to run a command.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should upgrade to nginx 1.31.9 or 1.30.7, or install their distribution\u0026rsquo;s backported fix, and then restart nginx because a configuration reload does not replace the running binary. If patching cannot happen immediately, disabling HTTP/2 blocks both HTTP/2 nginx2root bugs, though it can break gRPC through nginx. The article also advises verifying distribution package versions rather than relying only on nginx\u0026rsquo;s displayed upstream version, since distributions may backport the fix without changing that version string.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123007 is an integer-underflow flaw in nginx HTTP/2 flow-control accounting that affects nginx 1.9.5 through 1.31.8 when HTTP/2 is enabled.","The flaw can allow unauthenticated code execution as the nginx worker user, and researchers reported a public exploit that requires a direct connection, high bandwidth, an otherwise idle server, and AVX-512 support for the published full exploit.","nginx fixed the issue in versions 1.31.9 and 1.30.7 by tracking queued response bytes and including them when validating HTTP/2 WINDOW_UPDATE frames.","The article reports that its tests crashed nginx 1.31.8 workers with a proof of concept and ran a command with the full exploit, while the same attempts failed against nginx 1.31.9.","Organizations should upgrade to a fixed package and restart nginx, or temporarily disable HTTP/2 if they cannot patch immediately."],"insights":["A normal nginx configuration reload does not replace the vulnerable executable; a full restart or nginx on-the-fly binary upgrade is required after updating the package.","The public full exploit needs roughly 119 GiB of traffic on one connection within nginx’s default one-hour connection limit, making bandwidth of about 300 Mbit/s or more necessary, while the crash proof of concept sends about 60 GiB.","A reverse proxy that terminates HTTP/2 and connects to the vulnerable backend over HTTP/1.1 stopped the tested public exploit, but the article emphasizes that the backend still requires patching.","Distribution backports can leave nginx reporting an older upstream version even after the security fix is installed, so administrators must verify the installed package version against their distribution advisory rather than relying on nginx -v or external version scans.","HTTP/2 WINDOW_UPDATE frames do not appear in nginx access logs, so investigators should also look for a single connection receiving 60 GiB or more, worker exits on signals 6 or 11, and bursts of HEAD requests from one address."],"referencedReports":[{"title":"Out-of-band Security Notification (November 18, 2026)","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"f5","context":"The article cites this F5 security notification in its references for the November 2026 nginx vulnerability disclosure.","category":"advisory","primary":false},{"title":"CVE-2026-123007","url":"https://my.f5.com/manage/s/article/K000163926","publisher":"f5","context":"The article links F5's advisory for CVE-2026-123007 when describing affected NGINX Plus releases and available fixes.","category":"advisory","primary":false},{"title":"USN-9159-1","url":"https://usn.ubuntu.com/USN-9159-1","publisher":"ubuntu","context":"The article states that Ubuntu's fixes for the vulnerability are provided through this Ubuntu Security Notice.","category":"advisory","primary":false},{"title":"Security Advisory 2026-022","url":"https://www.cert.europa.eu/publications/security-advisories/2026-022/","publisher":"cert-eu","context":"The article cites CERT-EU's advisory as reporting no exploitation in the wild as of November 19, 2026.","category":"advisory","primary":false}],"body":"\u003cp\u003enginx released versions 1.31.9 and 1.30.7 on November 18, 2026, fixing CVE-2026-123007, an HTTP/2 flaw included in the nginx2root disclosure. The issue affects nginx 1.9.5 through 1.31.8 when HTTP/2 is enabled and can allow unauthenticated code execution as the nginx worker user. A public exploit is available, although the article reports no known exploitation in the wild as of November 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw results from HTTP/2 connection flow-control accounting that can refund queued response data twice, allowing nginx\u0026rsquo;s send-window value to exceed its allowed maximum and eventually trigger a memory-corrupting copy. The published full exploit reportedly requires a direct connection to nginx, about 119 GiB of traffic within nginx\u0026rsquo;s one-hour connection limit, an otherwise idle server, and AVX-512 support on the server CPU; a smaller proof of concept can crash a worker without AVX-512. The article\u0026rsquo;s tests found that version 1.31.9 rejected the malicious extra credit, while vulnerable version 1.31.8 could be crashed and, under the tested conditions, made to run a command.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should upgrade to nginx 1.31.9 or 1.30.7, or install their distribution\u0026rsquo;s backported fix, and then restart nginx because a configuration reload does not replace the running binary. If patching cannot happen immediately, disabling HTTP/2 blocks both HTTP/2 nginx2root bugs, though it can break gRPC through nginx. The article also advises verifying distribution package versions rather than relying only on nginx\u0026rsquo;s displayed upstream version, since distributions may backport the fix without changing that version string.\u003c/p\u003e\n"}]</script>
