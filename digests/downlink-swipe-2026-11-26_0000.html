rtment of Homeland Security ordered civilian agencies to remove DeepSeek products, including certain third-party products built using its technology. The order highlights whether agencies can identify prohibited AI use, determine what data it can access, and verify that security policies are enforced. In a May 2026 survey of 275 federal civilian and defense IT and security leaders, only 31% reported high or complete visibility into public AI tools and shadow AI activity, while 33% reported limited or nonexistent visibility.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI risks can arise through approved applications with embedded AI features, application-to-model exchanges through APIs, and Model Context Protocol connections to external tools and data sources. Only 24% of respondents reported high or complete visibility into API-based AI interactions, and Netskope Threat Labs observed a fourfold increase in enterprise MCP traffic over 10 weeks. Just 13% said their agencies apply security policy consistently across AI agents, applications, endpoints, cloud, and SaaS, which the article presents as a gap for agencies seeking to meet OMB M-25-21 governance and risk-management requirements.\u003c/p\u003e\n"},{"n":10,"title":"Most Wanted: The Phishing Kits and Techniques Getting Past Security Controls","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/most-wanted-phishing-kits-and.html","time":"10:57","priority":"MAY READ","score":54,"tldr":"Push Security reports that the DOMDIFFER adversary-in-the-middle phishing kit has the highest observed breakthrough rate, using DOM mirroring to relay genuine Google and Microsoft sign-in flows while evading common email, web, and safe-browsing controls. The article promotes a webinar covering DOMDIFFER and other high-performing phishing kits, including their use of bot checks, rotating infrastructure, and alternate payloads such as device-code phishing and remote-access tools.","briefOverview":"\u003cp\u003ePush Security describes “breakthrough rate” as the share of phishing attacks that bypass email security, web gateways, and safe-browsing controls to reach a user in their browser. It reports that DOMDIFFER, an adversary-in-the-middle phishing kit aimed at corporate Google and Microsoft accounts, had the highest breakthrough rate from August through October 2026. According to the article, the kit broke through two to four times as often as the next-ranked kit in each month and was commonly delivered through fake calendar-event lures.\u003c/p\u003e\n\n\u003cp\u003eDOMDIFFER uses DOM mirroring, where the attacker’s own browser carries out the real sign-in and transmits the page structure to the victim’s browser, which rebuilds a working copy of the page. The article says this allows the kit to present a genuine Google sign-in experience while providing Google with legitimate browser signals and handling new sign-in steps without additional code. It also notes that phishing kits can evade controls through bot checks, rotating domains, trusted hosting, and delivery methods outside email, while some combine sign-in theft with device-code phishing or prompts to install remote-access tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Push Security defines breakthrough rate as the share of phishing attacks that bypass email security, web gateways, and safe-browsing controls and reach a user’s browser.","DOMDIFFER, an adversary-in-the-middle phishing kit targeting corporate Google and Microsoft accounts, ranked first by breakthrough rate from August through October 2026 and reportedly broke through two to four times as often as the next kit.","DOMDIFFER uses DOM mirroring, in which an attacker’s browser performs the real sign-in and sends the page structure to the victim’s browser to recreate a working copy of the sign-in page.","The article says DOMDIFFER lures commonly included fake calendar events and describes an example fake Google Voice voicemail notification that used a bot check to deter scanners.","The article states that phishing kits may pair adversary-in-the-middle sign-in theft with other methods, including Microsoft device-code phishing and prompts to install remote-access tools."],"insights":["The article states that about half of observed browser-based phishing attacks do not use email at all, instead arriving through channels such as search ads, chat messages, social media, calendar invites, or QR codes.","A low volume of detections in email or proxy logs does not necessarily mean a phishing kit is uncommon, because breakthrough-rate measurements focus on attacks that reach a user’s browser after bypassing upstream controls.","DOM mirroring can make a phishing page more convincing than a static imitation because the attacker’s own browser completes the real sign-in process and can handle new sign-in steps without extra kit code.","Passkeys can stop adversary-in-the-middle phishing where they are enforced, but the article notes that attackers may instead use authorization scams or remote-access software installation prompts that passkeys do not prevent.","Some phishing lures can contain two kits or select different payloads based on a visitor’s platform, so closing one path may still leave another route for the attacker."],"referencedReports":[],"body":"\u003cp\u003ePush Security describes “breakthrough rate” as the share of phishing attacks that bypass email security, web gateways, and safe-browsing controls to reach a user in their browser. It reports that DOMDIFFER, an adversary-in-the-middle phishing kit aimed at corporate Google and Microsoft accounts, had the highest breakthrough rate from August through October 2026. According to the article, the kit broke through two to four times as often as the next-ranked kit in each month and was commonly delivered through fake calendar-event lures.\u003c/p\u003e\n\n\u003cp\u003eDOMDIFFER uses DOM mirroring, where the attacker’s own browser carries out the real sign-in and transmits the page structure to the victim’s browser, which rebuilds a working copy of the page. The article says this allows the kit to present a genuine Google sign-in experience while providing Google with legitimate browser signals and handling new sign-in steps without additional code. It also notes that phishing kits can evade controls through bot checks, rotating domains, trusted hosting, and delivery methods outside email, while some combine sign-in theft with device-code phishing or prompts to install remote-access tools.\u003c/p\u003e\n"},{"n":14,"title":"ThreatsDay: 10M NGINX Services at Risk, 250+ Malicious Extensions, AI Server Hijacking + 17 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/threatsday-250-rogue-extensions-10m.html","time":"19:39","priority":"MAY READ","score":40,"tldr":"This week’s threat roundup highlights how ordinary weaknesses—stolen credentials, exposed AI services, unmonitored infrastructure software, and misconfigured applications—are enabling major compromises. Notable developments include 10 million potentially vulnerable NGINX services, more than 250 malicious browser extensions, rising ransomware activity, and AI infrastructure abuse.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers a range of November 2026 security developments, with many incidents stemming from stolen credentials, internet-exposed services, and unsafe configurations rather than novel technical exploits. Todoist said an attacker used a stolen version-control credential to access production systems and retrieve some customer information affecting 6% of users. Censys reported that more than 10 million exposed NGINX services run affected HTTP/2 versions associated with NGINX2Root flaws, while Rapid7 identified thousands of accessible AI and notebook servers that could be misused without authentication.\u003c/p\u003e\n\n\u003cp\u003eThe report also highlights threats that can evade ordinary checks. Microsoft documented more than 250 browser extensions whose data collection, advertising injection, and shopping-link changes were activated when installations came through paid search advertisements, and a WordPress malware campaign served harmful JavaScript only to logged-out visitors. Ransomware activity rose 23% in October 2026 to 1,049 claimed incidents, with attacks affecting critical services such as hospitals and universities; one group’s activity reportedly led to ambulance diversions, clinic closures, and campus-wide device shutdowns. Other cases involved malicious Minecraft mods, phishing pages hosted through AI website-building services, compromised online shops, and attackers abusing power-management or banking middleware to run commands and access sensitive systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Todoist said an attacker used a stolen version-control credential to access production systems, obtain additional credentials, and retrieve customer information affecting 6% of its users.","Microsoft documented more than 250 browser extensions that behaved normally unless installed through paid search advertisements, which activated browsing-data collection, ad injection, and shopping-link changes.","Rapid7 found thousands of internet-facing AI and notebook service hosts without authentication, including exposed Ollama servers that could let others use an owner’s paid AI subscription.","Censys reported that more than 10 million exposed NGINX services running affected HTTP/2 versions could be vulnerable to NGINX2Root flaws under specific feature configurations.","NCC Group reported 1,049 claimed ransomware incidents in October 2026, a 23% increase from September."],"insights":["Some malicious browser extensions activated harmful behavior only when users arrived through paid search ads, meaning an extension could appear legitimate during ordinary testing or review.","Rapid7 found that more than half of exposed Ollama servers had already been accessed by someone other than their owner, and 79% listed at least one cloud model that could use the owner’s paid subscription.","A WordPress malware campaign deliberately stayed inactive for logged-in users while serving arbitrary JavaScript to anonymous visitors, making a compromised site appear normal to its administrators.","An attacker used CyberPower PowerPanel Business event scripts to run commands as the highest-privileged Windows account, extract Active Directory secrets, and establish a persistent implant.","Ransomware activity became more fragmented in Q3 2026: the ten most active groups accounted for 49% of victims, down from 71% in Q1."],"referencedReports":[{"title":"SleeperWidget: How Ad-Driven Installs Activate Hidden Browser Extension Behavior","url":"https://microsoftedge.github.io/edgevr/posts/SleeperWidget-How-Ad-Driven-Installs-Activate-Hidden-Browser-Extension-Behavior/","publisher":"microsoft-edge-extensions-security-team","context":"The article cites Microsoft's documentation of SleeperWidget extensions whose harmful behavior activates after installation through paid-search advertisements.","category":"research","primary":true},{"title":"Internet-Exposed Hosts Could Become Targets for AI Abuse","url":"https://www.rapid7.com/blog/post/tr-self-hosted-ai-renting-compute-exposed-servers/","publisher":"rapid7","context":"The article relies on Rapid7's analysis of 20,354 internet-facing hosts running accessible AI services or notebook APIs.","category":"research","primary":true},{"title":"Fake Minecraft Mod Uses the Polygon Blockchain to Deliver a Python Infostealer","url":"https://www.sonicwall.com/blog/fake-minecraft-mod-uses-the-polygon-blockchain-to-deliver-a-python-infostealer","publisher":"sonicwall-capture-labs","context":"The article references SonicWall's technical analysis of a SilentNet loader masquerading as a Minecraft mod.","category":"research","primary":true},{"title":"Hugging Face AI Used to Host Phishing Pages","url":"https://www.aikido.dev/blog/hugging-face-phishing-pages","publisher":"aikido","context":"The article cites Aikido's research identifying phishing pages on Hugging Face Spaces, including pages created with DeepSite.","category":"research","primary":true},{"title":"Credential Harvesting","url":"https://www.vulncheck.com/blog/credential-harvesting","publisher":"vulncheck","context":"The article references VulnCheck's honeypot-based analysis of credential-harvesting attempts across exploited CVEs.","category":"research","primary":true},{"title":"October 2026 Cyber Threat Intelligence Report","url":"https://insights.nccgroup.com/l/898251/2026-11-19/31p6lv6/898251/1795085578SO8oe8pJ/October_2026_Cyber_Threat_Intelligence_Report.pdf","publisher":"ncc-group","context":"The article cites this report for the 23% month-over-month increase in claimed ransomware incidents during October 2026.","category":"research","primary":true},{"title":"The State of Ransomware Q3 2026","url":"https://research.checkpoint.com/2026/the-state-of-ransomware-q3-2026/","publisher":"check-point-research","context":"The article uses Check Point Research's report for Q3 2026 ransomware victim and group activity statistics.","category":"research","primary":true},{"title":"CartJacked: One in 195 Online Shops We Scanned Was Hijacked","url":"https://guard.io/labs/cartjacked---one-in-195-online-shops-we-scanned-was-hijacked","publisher":"guardio-labs","context":"The article cites Guardio Labs' analysis estimating that about 12,200 online stores were hijacked in October 2026.","category":"research","primary":true},{"title":"NGINX2Root Advisory","url":"https://censys.com/advisory/nginx2root/","publisher":"censys","context":"The article references Censys' advisory that more than 10 million exposed NGINX services may be affected by the NGINX2Root flaws.","category":"advisory","primary":true},{"title":"Power Management Software Attack Vector","url":"https://www.security.com/threat-intelligence/power-management-software-attack-vector","publisher":"symantec","context":"The article cites Symantec's technical account of an intrusion that abused CyberPower PowerPanel Business event-script functionality.","category":"research","primary":true},{"title":"BankWeaver Campaign Abuses Digital Banking Middleware to Deploy Web Shells","url":"https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-banking-middleware-to-deploy-web-shells/","publisher":"forescout","context":"The article relies on Forescout's analysis of the BankWeaver campaign targeting an exposed Temenos Quantum Fabric deployment.","category":"research","primary":true}],"body":"\u003cp\u003eThis ThreatsDay roundup covers a range of November 2026 security developments, with many incidents stemming from stolen credentials, internet-exposed services, and unsafe configurations rather than novel technical exploits. Todoist said an attacker used a stolen version-control credential to access production systems and retrieve some customer information affecting 6% of users. Censys reported that more than 10 million exposed NGINX services run affected HTTP/2 versions associated with NGINX2Root flaws, while Rapid7 identified thousands of accessible AI and notebook servers that could be misused without authentication.\u003c/p\u003e\n\n\u003cp\u003eThe report also highlights threats that can evade ordinary checks. Microsoft documented more than 250 browser extensions whose data collection, advertising injection, and shopping-link changes were activated when installations came through paid search advertisements, and a WordPress malware campaign served harmful JavaScript only to logged-out visitors. Ransomware activity rose 23% in October 2026 to 1,049 claimed incidents, with attacks affecting critical services such as hospitals and universities; one group’s activity reportedly led to ambulance diversions, clinic closures, and campus-wide device shutdowns. Other cases involved malicious Minecraft mods, phishing pages hosted through AI website-building services, compromised online shops, and attackers abusing power-management or banking middleware to run commands and access sensitive systems.\u003c/p\u003e\n"},{"n":20,"title":"Health-ISAC Daily Cyber Headlines – November 26, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-26-2026/","time":"10:01","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s daily roundup highlights threats and policy developments relevant to healthcare, including exposed U.S. hospital credentials, Saudi health-sector phishing by Volant Manticore, and a reported 1Password intrusion. It also covers AI-enabled attacks, critical Adobe flaws, clinical AI safeguards, and infrastructure resilience guidance.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 26, 2026 Daily Cyber Headlines is a roundup of cybersecurity developments relevant to the health sector. It covers exposed U.S. hospital credentials after threat actors accessed a manufacturer’s cloud infrastructure, phishing directed at Saudi Arabia’s health sector, and reported AI-agent cyberattacks against organizations in Switzerland. The briefing also includes critical Adobe flaws that could enable malicious code execution on servers and a reported 1Password incident exposing customer data and source code.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights broader operational and policy concerns alongside individual incidents. It references guidance urging critical-infrastructure CEOs to prioritize assets and test both response and recovery, as well as new California safeguards for clinical AI and healthcare chatbot privacy. Health-ISAC directs members to its portal for threat intelligence and indicators of compromise, while describing the linked stories as open-source reporting intended to support situational awareness for health-sector defenders.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 26, 2026 daily briefing covers exposed U.S. hospital credentials linked to threat actors accessing a manufacturer’s cloud infrastructure.","The roundup includes reporting that Iran-nexus Volant Manticore shifted phishing operations toward Saudi Arabia’s health sector.","The briefing highlights Switzerland’s confirmation of AI-agent cyberattacks against local organizations.","It includes critical Adobe vulnerabilities that could allow threat actors to execute malicious code on servers and a reported 1Password breach exposing customer data and source code.","The briefing also covers California safeguards for clinical AI and healthcare chatbot privacy, along with guidance for critical-infrastructure CEOs on asset prioritization and response and recovery testing."],"insights":["The briefing shows that healthcare-related exposure can arise through a manufacturer’s cloud infrastructure, not only through hospital systems themselves.","The Saudi health sector is specifically identified as a target of phishing activity attributed to Iran-nexus Volant Manticore.","The roundup places AI-related security issues in two distinct contexts: reported AI-agent attacks on organizations in Switzerland and California safeguards for clinical AI and healthcare chatbot privacy.","The infrastructure guidance emphasizes three concrete priorities for CEOs: identifying important assets, testing incident response, and testing recovery."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 26, 2026 Daily Cyber Headlines is a roundup of cybersecurity developments relevant to the health sector. It covers exposed U.S. hospital credentials after threat actors accessed a manufacturer’s cloud infrastructure, phishing directed at Saudi Arabia’s health sector, and reported AI-agent cyberattacks against organizations in Switzerland. The briefing also includes critical Adobe flaws that could enable malicious code execution on servers and a reported 1Password incident exposing customer data and source code.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights broader operational and policy concerns alongside individual incidents. It references guidance urging critical-infrastructure CEOs to prioritize assets and test both response and recovery, as well as new California safeguards for clinical AI and healthcare chatbot privacy. Health-ISAC directs members to its portal for threat intelligence and indicators of compromise, while describing the linked stories as open-source reporting intended to support situational awareness for health-sector defenders.\u003c/p\u003e\n"},{"n":4,"title":"NordVPN Black Friday Deal: Get 78% off VPN plans in 2026","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nordvpn-black-friday-deal-get-78-percent-off-vpn-plans-in-2026/","time":"17:58","priority":"MAY READ","score":15,"tldr":"NordVPN is promoting a Black Friday/Cyber Monday 2026 offer of up to 78% off two-year plans plus three extra months, with higher tiers bundling tools such as malware scanning, phishing protection, password management, and encrypted storage.","briefOverview":"\u003cp\u003eNordVPN\u0026rsquo;s 2026 Black Friday and Cyber Monday promotion offers discounts of up to 78% on subscriptions, plus three additional months on a two-year plan. The two-year offer provides 27 months of protection, while actual savings depend on the selected subscription plan and introductory term. The advertised 78% figure compares the introductory monthly price of the highest-tier two-year plan, including extra months, with the current monthly price for annual renewal.\u003c/p\u003e\n\n\u003cp\u003eNordVPN says its network includes more than 6,900 servers across 225 locations, unlimited bandwidth, and high-speed connections through its WireGuard-based NordLynx protocol. A single account supports up to 10 devices and can also be installed on a compatible router. Higher-tier plans may include download malware scanning, phishing protection, ad and tracker blocking, Dark Web Monitor alerts, password management, application vulnerability scanning, specialty servers, and 1 TB of encrypted cloud storage; the company also offers a 30-day money-back guarantee and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e support.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NordVPN's 2026 Black Friday and Cyber Monday promotion offers savings of up to 78% and three extra months with a two-year subscription, for 27 months of service.","The advertised 78% savings compare the introductory monthly price of NordVPN's highest-tier two-year plan, including the extra months, with its current annual-renewal monthly price, and actual savings vary by plan and term.","NordVPN says its network has more than 6,900 servers across 225 locations and supports unlimited bandwidth through its NordLynx protocol.","A NordVPN account can protect up to 10 devices, and compatible routers can be configured to protect a home network.","Higher-tier NordVPN subscriptions may include download malware scanning, phishing protection, ad and tracker blocking, a password manager, and encrypted cloud storage."],"insights":["The headline 78% discount is based on a comparison with the current monthly cost of annual renewal, rather than a direct comparison with every available plan, so buyers should review the selected plan's actual price.","The two-year offer provides 27 months of service because it includes three additional months, making the longest commitment the route to the stated highest discount.","NordVPN positions its higher-tier plans as a combined privacy and security package by including features such as download scanning, phishing protection, password management, and encrypted storage.","One account can cover up to 10 devices and may also be installed on a compatible router, potentially extending protection across a home network.","The 30-day money-back guarantee allows subscribers to test the service before deciding whether to keep the long-term plan."],"referencedReports":[],"body":"\u003cp\u003eNordVPN\u0026rsquo;s 2026 Black Friday and Cyber Monday promotion offers discounts of up to 78% on subscriptions, plus three additional months on a two-year plan. The two-year offer provides 27 months of protection, while actual savings depend on the selected subscription plan and introductory term. The advertised 78% figure compares the introductory monthly price of the highest-tier two-year plan, including extra months, with the current monthly price for annual renewal.\u003c/p\u003e\n\n\u003cp\u003eNordVPN says its network includes more than 6,900 servers across 225 locations, unlimited bandwidth, and high-speed connections through its WireGuard-based NordLynx protocol. A single account supports up to 10 devices and can also be installed on a compatible router. Higher-tier plans may include download malware scanning, phishing protection, ad and tracker blocking, Dark Web Monitor alerts, password management, application vulnerability scanning, specialty servers, and 1 TB of encrypted cloud storage; the company also offers a 30-day money-back guarantee and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e support.\u003c/p\u003e\n"},{"n":19,"title":"Easy File Uploader for Joomla: It's Right There in the Name","source":"chocapikk.com","sourceColorIdx":0,"link":"https://chocapikk.com/posts/2026/easy-file-uploader-unauthenticated-upload-to-rce/","time":"00:00","priority":"MAY READ","score":10,"tldr":"The article promotes Easy File Uploader, a Joomla extension designed to simplify file uploads within Joomla websites.","briefOverview":"\u003cp\u003eThe article is titled “Easy File Uploader for Joomla: It’s Right There in the Name.” The title identifies Easy File Uploader as being associated with Joomla. No
