<script type="application/json" id="dl-articles">[{"n":3,"title":"Attackers Exploit 'Ill Bloom' Vulnerability to Drain $3.1 Million From Cryptocurrency Wallets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/attackers-exploit-ill-bloom.html","time":"09:00","priority":"MUST READ","score":92,"tldr":"Coinspect says attackers exploited the “Ill Bloom” weak-randomness flaw in some older or lesser-known crypto wallets to drain about $3.1 million from 431 wallets, with more funds potentially exposed. Users should check public addresses at illbloom.org and, if matched, move funds to a brand-new wallet with a freshly generated recovery phrase.","briefOverview":"\u003cp\u003eCoinspect disclosed a crypto wallet flaw called Ill Bloom that attackers are already using to steal funds. The flaw is in how some wallet software generated recovery phrases, which are the words that control the money in a self-custody wallet. Coinspect confirmed a coordinated May 27 sweep that drained about \u003cspan class=\"math inline\"\u003e\\(3.1 million from 431 wallets, and it says roughly \\)\u003c/span\u003e2 million more has moved from exposed wallets since then.\u003c/p\u003e\n\n\u003cp\u003eThe affected wallets used weak randomness when creating recovery phrases, shrinking the possible phrase pool enough for attackers to search. Coinspect rebuilt the attack by generating the phrases the weak generator could produce, deriving the wallet addresses, and checking public blockchain records for addresses still holding funds. As of June 30, it had traced 2,114 exposed addresses with on-chain activity across Bitcoin, Ethereum, Rootstock, Tron, and Polygon.\u003c/p\u003e\n\n\u003cp\u003eCoinspect says hardware wallets are not affected and most mainstream software wallets are not either, with the main risk in older or lesser-known mobile wallets, some dating back to 2018. Users can check public wallet addresses at illbloom.org, but a clean result is not a guarantee because the list is incomplete. If an address matches, Coinspect advises treating the recovery phrase as compromised, creating a brand-new wallet with a brand-new phrase, and moving funds there.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Coinspect disclosed a crypto wallet flaw called Ill Bloom, where some wallet software generated recovery phrases with weak randomness that attackers could work out.","Coinspect confirmed a coordinated sweep on May 27 that drained about $3.1 million from 431 wallets, with roughly $2 million more moving from exposed wallets since then.","Coinspect says wallets created on hardware devices are not affected, and most mainstream software wallets are not affected, while the real risk is with older or lesser-known mobile wallets, some dating back to 2018.","The affected weak phrases can expose funds across every chain they control, including Bitcoin, Ethereum, Rootstock, Tron, and Polygon addresses traced by Coinspect.","Coinspect advises users to check public wallet addresses at illbloom.org and, if there is a match, create a brand-new wallet with a brand-new recovery phrase and move funds there."],"insights":["A clean result from the Ill Bloom checker is not a guarantee of safety because Coinspect says its list of known-vulnerable wallets is incomplete.","Reinstalling the old wallet app or importing the same recovery phrase into another app does not fix the problem, because the weakness is baked into the phrase itself.","One weak recovery phrase can expose funds across every blockchain address it controls, so users need to check every address tied to the same seed rather than only addresses that were already drained.","Coinspect has not named the affected apps because a public wallet address does not reveal which app created it, so matched users are being asked to report what they used to help identify vendors.","A real Ill Bloom checker does not need recovery phrases, private keys, signatures, approvals, or payments, so any service asking for those is inconsistent with Coinspect’s warning."],"referencedReports":[],"body":"\u003cp\u003eCoinspect disclosed a crypto wallet flaw called Ill Bloom that attackers are already using to steal funds. The flaw is in how some wallet software generated recovery phrases, which are the words that control the money in a self-custody wallet. Coinspect confirmed a coordinated May 27 sweep that drained about \u003cspan class=\"math inline\"\u003e\\(3.1 million from 431 wallets, and it says roughly \\)\u003c/span\u003e2 million more has moved from exposed wallets since then.\u003c/p\u003e\n\n\u003cp\u003eThe affected wallets used weak randomness when creating recovery phrases, shrinking the possible phrase pool enough for attackers to search. Coinspect rebuilt the attack by generating the phrases the weak generator could produce, deriving the wallet addresses, and checking public blockchain records for addresses still holding funds. As of June 30, it had traced 2,114 exposed addresses with on-chain activity across Bitcoin, Ethereum, Rootstock, Tron, and Polygon.\u003c/p\u003e\n\n\u003cp\u003eCoinspect says hardware wallets are not affected and most mainstream software wallets are not either, with the main risk in older or lesser-known mobile wallets, some dating back to 2018. Users can check public wallet addresses at illbloom.org, but a clean result is not a guarantee because the list is incomplete. If an address matches, Coinspect advises treating the recovery phrase as compromised, creating a brand-new wallet with a brand-new phrase, and moving funds there.\u003c/p\u003e\n"},{"n":1,"title":"Former ransomware negotiator gets 4 years for BlackCat attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-ransomware-negotiator-gets-4-years-in-prison-for-blackcat-attacks/","time":"08:17","priority":"SHOULD READ","score":82,"tldr":"Former DigitalMint ransomware negotiator Angelo Martino was sentenced to 70 months in prison for helping carry out BlackCat ransomware attacks against U.S. organizations and sharing victims’ confidential negotiation details to maximize extortion payments.","briefOverview":"\u003cp\u003eFormer DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat, also known as ALPHV, ransomware attacks. He was charged and pleaded guilty alongside former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg. Martin and Goldberg pleaded guilty in December to conspiracy to obstruct commerce by extortion and were sentenced to four years in prison each in May.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025. While operating as BlackCat affiliates, the three demanded ransom payments, threatened to leak stolen data, and encrypted victims’ systems. They paid BlackCat administrators a 20% share of ransom proceeds for access to the ransomware and extortion portal.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Martino also shared confidential information about victims’ insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims. The victims included at least five U.S. organizations, including a financial services firm that paid \u003cspan class=\"math inline\"\u003e\\(25,660,000 and a nonprofit that paid \\)\u003c/span\u003e26,793,000, as well as school districts, medical facilities, law firms, and other financial services companies. DigitalMint CEO Jonathan Solomon said the company condemned Martin and Martino’s conduct and fired them immediately after their actions were discovered.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat ransomware attacks.","Martino pleaded guilty to his role in the attacks along with former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg.","Court documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025.","Prosecutors said Martino shared confidential information about victims' insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims.","The victims included at least five U.S. organizations, including a financial services firm that paid $25,660,000 and a nonprofit that paid $26,793,000."],"insights":["The case shows that ransomware negotiators can become especially damaging insiders because they may have access to victims' insurance limits and negotiation positions during active extortion cases.","The three former Sygnia and DigitalMint employees allegedly used BlackCat as affiliates rather than operating the entire ransomware infrastructure themselves, paying the gang's administrators a 20% share of ransom proceeds.","The reported ransom payments from two victims exceeded $25 million each, showing that the attacks described in the case involved unusually high-value extortion outcomes.","Martino was initially identified only as “Co-Conspirator 1” in the indictment before later being named in unsealed court documents, indicating that public attribution of participants unfolded over time through court filings."],"referencedReports":[],"body":"\u003cp\u003eFormer DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat, also known as ALPHV, ransomware attacks. He was charged and pleaded guilty alongside former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg. Martin and Goldberg pleaded guilty in December to conspiracy to obstruct commerce by extortion and were sentenced to four years in prison each in May.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025. While operating as BlackCat affiliates, the three demanded ransom payments, threatened to leak stolen data, and encrypted victims’ systems. They paid BlackCat administrators a 20% share of ransom proceeds for access to the ransomware and extortion portal.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Martino also shared confidential information about victims’ insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims. The victims included at least five U.S. organizations, including a financial services firm that paid \u003cspan class=\"math inline\"\u003e\\(25,660,000 and a nonprofit that paid \\)\u003c/span\u003e26,793,000, as well as school districts, medical facilities, law firms, and other financial services companies. DigitalMint CEO Jonathan Solomon said the company condemned Martin and Martino’s conduct and fired them immediately after their actions were discovered.\u003c/p\u003e\n"},{"n":2,"title":"Ransomware Negotiator Gets 70 Months in Prison for Aiding BlackCat Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ransomware-negotiator-gets-70-months-in.html","time":"08:10","priority":"SHOULD READ","score":78,"tldr":"Former ransomware negotiator Angelo Martino was sentenced to 70 months in U.S. prison for secretly helping BlackCat operators extort his own clients by sharing their confidential negotiation and insurance details. Prosecutors said he also helped target additional victims with two other cybersecurity professionals, while authorities have seized $10 million in illicit assets.","briefOverview":"\u003cp\u003eAngelo Martino, a 41-year-old former ransomware negotiator from Land O\u0026rsquo;Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with the now-defunct BlackCat ransomware operators. He pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion. Federal prosecutors described him as a “double agent” who worked to maximize harm to his clients and financial gain for the cybercriminals who paid him part of the ransom.\u003c/p\u003e\n\n\u003cp\u003eMartino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about those victims’ negotiating positions and strategies. The information included details about victims’ insurance policy limits and internal negotiation positions, which prosecutors said allowed the operators to maximize the ransom amounts victims were required to pay. Justice Department officials said victims described how their businesses were nearly destroyed after hiring people they expected to help them.\u003c/p\u003e\n\n\u003cp\u003eMartino was also accused of colluding with Ryan Goldberg of Georgia and Kevin Martin of Texas to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023. Martino and Martin were employed at DigitalMint, while Goldberg worked as an incident response manager for Sygnia, and both Goldberg and Martin were sentenced to four years in prison in May 2026. The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat, and a court hearing is scheduled for September 17, 2026, to determine restitution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Angelo Martino, a 41-year-old former ransomware negotiator from Land O'Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with BlackCat ransomware operators to extort multiple victims.","Federal prosecutors said Martino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about the victims' negotiation positions, strategies, and insurance policy limits.","Martino pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion.","Martino was also accused of colluding with Ryan Goldberg and Kevin Martin to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023.","The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat."],"insights":["The case shows that sensitive details shared during ransom negotiations, such as insurance policy limits and internal negotiating positions, can directly increase the amount victims are pressured to pay if exposed to the attackers.","The people accused or convicted in the scheme were not only outside criminals but cybersecurity professionals working in negotiation and incident response roles, highlighting that trusted crisis advisers can become part of the harm to victims.","Federal prosecutors treated Martino’s conduct as more than passive information sharing, describing him as a “double agent” who maximized both victim harm and criminal financial gain.","The Justice Department’s seizure of digital currency, vehicles, a food truck, and a luxury fishing boat shows that authorities pursued proceeds converted into both crypto assets and physical property."],"referencedReports":[],"body":"\u003cp\u003eAngelo Martino, a 41-year-old former ransomware negotiator from Land O\u0026rsquo;Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with the now-defunct BlackCat ransomware operators. He pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion. Federal prosecutors described him as a “double agent” who worked to maximize harm to his clients and financial gain for the cybercriminals who paid him part of the ransom.\u003c/p\u003e\n\n\u003cp\u003eMartino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about those victims’ negotiating positions and strategies. The information included details about victims’ insurance policy limits and internal negotiation positions, which prosecutors said allowed the operators to maximize the ransom amounts victims were required to pay. Justice Department officials said victims described how their businesses were nearly destroyed after hiring people they expected to help them.\u003c/p\u003e\n\n\u003cp\u003eMartino was also accused of colluding with Ryan Goldberg of Georgia and Kevin Martin of Texas to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023. Martino and Martin were employed at DigitalMint, while Goldberg worked as an incident response manager for Sygnia, and both Goldberg and Martin were sentenced to four years in prison in May 2026. The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat, and a court hearing is scheduled for September 17, 2026, to determine restitution.\u003c/p\u003e\n"}]</script>
