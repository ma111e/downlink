<script type="application/json" id="dl-articles">[{"n":5,"title":"CISA orders feds to patch exploited Citrix flaws by Wednesday","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-exploited-citrix-flaws-by-wednesday/","time":"06:24","priority":"MUST READ","score":98,"tldr":"CISA ordered U.S. federal agencies to patch actively exploited Citrix NetScaler RCE flaws CVE-2026-88771 and CVE-2026-88772 by September 30. Organizations with affected internet-facing appliances should assess for compromise and preserve forensic evidence before updating.","briefOverview":"\u003cp\u003eCISA has ordered U.S. Federal Civilian Executive Branch agencies to secure vulnerable Citrix NetScaler appliances by September 30 after adding CVE-2026-88771 and CVE-2026-88772 to its Known Exploited Vulnerabilities Catalog. Citrix confirmed on Sunday that both flaws are being actively exploited in zero-day attacks and urged customers to install updates immediately. The Dutch National Cyber Security Center had reportedly warned organizations about the two critical flaws before CVE identifiers were assigned. CISA said that, where possible, organizations should look for signs of compromise before patching.\u003c/p\u003e\n\n\u003cp\u003eBoth vulnerabilities can let an unauthenticated attacker remotely run code on affected NetScaler ADC and NetScaler Gateway deployments. CVE-2026-88771 affects deployments using default configurations, while CVE-2026-88772 requires DTLS to be enabled; Citrix says DTLS is enabled by default on VPN virtual servers. Citrix made generic indicators of compromise available through NetScaler Console, but warned that they may have limited forensic value and fail to identify actual compromises. It advised potentially affected customers to retain experienced forensic investigators, while CISA cautioned that updates may result in lost forensic visibility.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks more than 23,000 internet-exposed IP addresses with NetScaler fingerprints, though the article notes this does not show how many are honeypots, patched, or vulnerable under their configurations. CERT-EU strongly advised EU organizations to perform a compromise assessment on internet-facing appliances running affected builds. The two flaws follow several other Citrix vulnerabilities exploited this year, and CISA has flagged 26 actively exploited Citrix vulnerabilities since November 2021, including six used by ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-88771 and CVE-2026-88772 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal civilian agencies to secure vulnerable Citrix appliances by September 30.","Citrix confirmed that both NetScaler flaws are being exploited in zero-day attacks and urged customers to install the relevant updates immediately.","The vulnerabilities can allow unauthenticated attackers to remotely run code on affected NetScaler ADC and NetScaler Gateway appliances; the second flaw requires DTLS, which is enabled by default on VPN virtual servers.","Citrix provided generic indicators of compromise through NetScaler Console but warned they may have limited forensic value and may not identify actual compromises.","CERT-EU strongly advised EU organizations to assess internet-facing appliances running affected builds for signs of compromise."],"insights":["Organizations should check for signs of compromise and preserve forensic evidence before applying updates, because Citrix and CISA warn that updating may reduce forensic visibility.","Citrix’s supplied indicators of compromise may miss real intrusions, so the company recommends retaining experienced forensic investigators for potentially compromised deployments.","The second flaw affects deployments with DTLS enabled, and Citrix says DTLS is enabled by default on VPN virtual servers, making configuration review especially important.","More than 23,000 NetScaler-fingerprinted internet-facing IP addresses are visible to Shadowserver, although the article notes that the count does not establish which systems remain vulnerable or patched."],"referencedReports":[{"title":"NetScaler ADC and NetScaler Gateway Security Bulletin for CVE-2026-88771 through CVE-2026-88778","url":"https://community.citrix.com/techzone-blogs/110_security-updates/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-88771-through-cve-2026-88778","publisher":"citrix","context":"Citrix's security bulletin confirms active exploitation and provides update guidance and indicators of compromise for affected NetScaler deployments.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/27/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA added CVE-2026-88771 and CVE-2026-88772 to its Known Exploited Vulnerabilities Catalog and set a federal remediation deadline.","category":"advisory","primary":true},{"title":"Critical Zero-Day Vulnerabilities Exploited: Citrix NetScaler ADC and Gateway","url":"https://www.cisa.gov/news-events/alerts/2026/09/27/critical-zero-day-vulnerabilities-exploited-citrix-netscaler-adc-gateway","publisher":"cisa","context":"CISA's alert urges administrators to review Citrix guidance, check for compromise before patching where possible, and preserve forensic evidence.","category":"advisory","primary":true},{"title":"Security Advisory 2026-014","url":"https://cert.europa.eu/publications/security-advisories/2026-014/","publisher":"cert-eu","context":"CERT-EU strongly advised EU organizations to conduct a compromise assessment on internet-facing appliances running affected builds.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA has ordered U.S. Federal Civilian Executive Branch agencies to secure vulnerable Citrix NetScaler appliances by September 30 after adding CVE-2026-88771 and CVE-2026-88772 to its Known Exploited Vulnerabilities Catalog. Citrix confirmed on Sunday that both flaws are being actively exploited in zero-day attacks and urged customers to install updates immediately. The Dutch National Cyber Security Center had reportedly warned organizations about the two critical flaws before CVE identifiers were assigned. CISA said that, where possible, organizations should look for signs of compromise before patching.\u003c/p\u003e\n\n\u003cp\u003eBoth vulnerabilities can let an unauthenticated attacker remotely run code on affected NetScaler ADC and NetScaler Gateway deployments. CVE-2026-88771 affects deployments using default configurations, while CVE-2026-88772 requires DTLS to be enabled; Citrix says DTLS is enabled by default on VPN virtual servers. Citrix made generic indicators of compromise available through NetScaler Console, but warned that they may have limited forensic value and fail to identify actual compromises. It advised potentially affected customers to retain experienced forensic investigators, while CISA cautioned that updates may result in lost forensic visibility.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks more than 23,000 internet-exposed IP addresses with NetScaler fingerprints, though the article notes this does not show how many are honeypots, patched, or vulnerable under their configurations. CERT-EU strongly advised EU organizations to perform a compromise assessment on internet-facing appliances running affected builds. The two flaws follow several other Citrix vulnerabilities exploited this year, and CISA has flagged 26 actively exploited Citrix vulnerabilities since November 2021, including six used by ransomware gangs.\u003c/p\u003e\n"},{"n":10,"title":"Oh Look, The Foot Gun Went Off Again (Citrix NetScaler PreAuth Command Injection CVE-2026-88771)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/","time":"10:55","priority":"MUST READ","score":98,"tldr":"Citrix NetScaler CVE-2026-88771 is an actively exploited, pre-authentication command-injection flaw in default configurations that can let remote attackers execute commands as root by poisoning logs. Organizations should urgently upgrade NetScaler ADC/Gateway to Citrix’s fixed releases and investigate exposure.","briefOverview":"\u003cp\u003ewatchTowr analyzed CVE-2026-88771, an actively exploited pre-authentication command-injection vulnerability in Citrix NetScaler ADC and Gateway appliances that affects default configurations. The article states that an unauthenticated attacker can cause arbitrary commands to run as root by placing crafted text into NetScaler logs. Citrix addressed this flaw alongside seven other vulnerabilities in bulletin CTX697096, including CVE-2026-88772, which the article also identifies as exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable \u003ccode\u003ens_monuploadd_err.pl\u003c/code\u003e script extracted a supposed NSPPE core-file name from logs using shell pipelines, then inserted that value into a later shell command. Crafted log content containing shell control characters could therefore turn the later \u003ccode\u003efind\u003c/code\u003e command into command execution; the article says login fields, failed-login data, rate-limit events, request parameters, and User-Agent headers can reach relevant logs. Citrix’s fix restricts the expected NSPPE name and numeric process ID, invokes \u003ccode\u003efind\u003c/code\u003e without a shell, and validates returned paths; the article lists fixed releases including NetScaler 14.1-73.37 and 13.1-64.23.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-88771 is an actively exploited pre-authentication command-injection flaw affecting default Citrix NetScaler ADC and Gateway configurations.","The vulnerable NetScaler script used shell commands to process log data and later inserted an insufficiently validated log-derived filename into another shell command.","An unauthenticated request can place attacker-controlled text into NetScaler authentication logs, enabling the malicious input to reach the vulnerable script.","The command injection runs when ns_monuploadd_err.pl processes the poisoned logs, which the article says can take up to 24 hours without a forced trigger.","Citrix fixed the issue by tightly validating the expected NSPPE name and process ID and by invoking find without a shell; fixed versions include 14.1-73.37 and 13.1-64.23."],"insights":["The malicious input does not execute when it is first written to logs; execution occurs later when the maintenance script reuses log-derived text inside a shell command.","The article states that multiple unauthenticated inputs—not just the demonstrated login field—can reach logs, including failed-login data, rate-limit events, request parameters, and User-Agent headers.","Because the vulnerable script can run only as part of a periodic process, normal exploitation may take up to 24 hours to execute unless its processing is forced.","The patch uses two independent protections: it builds the core filename from narrowly restricted log fields and runs find through separate arguments rather than a shell command.","The advisory includes seven additional flaws, including CVE-2026-88772, which the article says was also exploited in the wild and affects DTLS-enabled VPN virtual servers by default."],"referencedReports":[{"title":"Citrix NetScaler ADC and Citrix NetScaler Gateway Security Bulletin for CVE-2026-88771 through CVE-2026-88778","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697096\u0026articleURL=Citrix_NetScaler_ADC_and_Citrix_NetScaler_Gateway_Security_Bulletin_for_CVE_2026_88771_CVE_2026_88772_CVE_2026_88773_CVE_2026_88774_CVE_2026_88775_CVE_2026_88776_CVE_2026_88777_and_CVE_2026_88778","publisher":"citrix","context":"The article cites Citrix's security bulletin for the eight vulnerabilities covered, their severity and exploitation status, and the fixed NetScaler releases.","category":"advisory","primary":false}],"body":"\u003cp\u003ewatchTowr analyzed CVE-2026-88771, an actively exploited pre-authentication command-injection vulnerability in Citrix NetScaler ADC and Gateway appliances that affects default configurations. The article states that an unauthenticated attacker can cause arbitrary commands to run as root by placing crafted text into NetScaler logs. Citrix addressed this flaw alongside seven other vulnerabilities in bulletin CTX697096, including CVE-2026-88772, which the article also identifies as exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable \u003ccode\u003ens_monuploadd_err.pl\u003c/code\u003e script extracted a supposed NSPPE core-file name from logs using shell pipelines, then inserted that value into a later shell command. Crafted log content containing shell control characters could therefore turn the later \u003ccode\u003efind\u003c/code\u003e command into command execution; the article says login fields, failed-login data, rate-limit events, request parameters, and User-Agent headers can reach relevant logs. Citrix’s fix restricts the expected NSPPE name and numeric process ID, invokes \u003ccode\u003efind\u003c/code\u003e without a shell, and validates returned paths; the article lists fixed releases including NetScaler 14.1-73.37 and 13.1-64.23.\u003c/p\u003e\n"},{"n":12,"title":"US, UK warn of exploited Citrix NetScaler zero-day bugs","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-uk-warn-of-citrix-netscaler-zero-day-bug","time":"16:19","priority":"MUST READ","score":98,"tldr":"Citrix has patched two critical NetScaler ADC and Gateway zero-days, CVE-2026-88771 and CVE-2026-88772, that are being actively exploited worldwide. US, UK, and Dutch authorities urge organizations to patch immediately and conduct forensic triage for signs of compromise.","briefOverview":"\u003cp\u003eCitrix disclosed eight vulnerabilities affecting NetScaler ADC and NetScaler Gateway devices, with patches released for all of them. Two flaws, CVE-2026-88771 and CVE-2026-88772, have severity scores of 9.5 out of 10 and are being actively exploited, according to Citrix. Cybersecurity agencies in the United States, United Kingdom, and Netherlands issued warnings after incident responders raised concerns about potential NetScaler Gateway vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCISA said it has reports and partner intelligence confirming that threat actors are exploiting at least some of the flaws globally, and gave US federal agencies until Wednesday to patch the two exploited issues. It also said agencies using the affected products need to conduct forensic triage, while Citrix published guidance for customers that suspect compromise. The issue is significant because NetScaler appliances manage traffic and authentication for large organizations, and prior high-profile campaigns targeting the products were linked to hundreds of breaches.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix disclosed eight new NetScaler ADC and Gateway vulnerabilities and released patches for all of them.","Citrix said CVE-2026-88771 and CVE-2026-88772, each rated 9.5 out of 10, are being actively exploited.","CISA said it has received reports and partner intelligence confirming global exploitation and ordered US federal agencies to patch the two exploited flaws by Wednesday.","CISA said federal agencies using the affected products will need to conduct forensic triage.","The UK, US, and Dutch cybersecurity agencies issued advisories after incident responders warned of potential NetScaler Gateway vulnerabilities."],"insights":["CVE-2026-88771 was exploited before a fix was available, according to watchTowr researchers.","CISA’s response goes beyond patching: agencies using the affected products are also expected to perform forensic triage to look for evidence of compromise.","Private security companies urged customers to take NetScaler appliances offline before official advisories were published, although the article says they did not provide evidence of the vulnerabilities at that time.","NetScaler appliances are especially consequential targets because they are widely deployed in large enterprise networks and manage both traffic and user authentication.","Earlier Citrix NetScaler campaigns known as Citrix Bleed One and Two were linked to hundreds of breaches, underscoring the product line’s history as a frequent target."],"referencedReports":[{"title":"NCSC-2026-0394","url":"https://advisories.ncsc.nl/2026/ncsc-2026-0394.html","publisher":"netherlands-national-cyber-security-centre","context":"The article says the Dutch cybersecurity agency issued an advisory confirming the NetScaler vulnerabilities.","category":"advisory","primary":true},{"title":"Critical Zero-Day Vulnerabilities Exploited in Citrix NetScaler ADC and Gateway","url":"https://www.cisa.gov/news-events/alerts/2026/09/27/critical-zero-day-vulnerabilities-exploited-citrix-netscaler-adc-gateway","publisher":"cisa","context":"The article cites CISA's alert confirming active exploitation and directing US federal agencies to patch and conduct forensic triage.","category":"advisory","primary":true},{"title":"Exploitation of vulnerabilities affecting Citrix NetScaler ADC and Citrix NetScaler Gateway","url":"https://www.ncsc.gov.uk/news/exploitation-of-vulnerabilities-affecting-citrix-netscaler-adc-and-citrix-netscaler-gateway","publisher":"uk-national-cyber-security-centre","context":"The article says the UK National Cyber Security Centre issued an advisory confirming the vulnerabilities.","category":"advisory","primary":true},{"title":"NetScaler ADC and NetScaler Gateway Security Bulletin for CVE-2026-88771 through CVE-2026-88778","url":"https://community.citrix.com/techzone-blogs/110_security-updates/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-88771-through-cve-2026-88778/?utm_id=cid2026-0806\u0026utm_source=facebook\u0026utm_medium=social%20media%20organic\u0026utm_campaign=citrix%20organic\u0026utm_content=1790523126","publisher":"citrix","context":"Citrix's security bulletin confirms eight vulnerabilities, identifies two as exploited, and provides patches.","category":"advisory","primary":true},{"title":"Steps to Take if NetScaler ADC Is Suspected to Be Compromised","url":"https://support.citrix.com/external/article/CTX694799/steps-to-take-if-netscaler-adc-is-suspec.html","publisher":"citrix","context":"The article links to Citrix guidance for customers that suspect compromise through the vulnerabilities.","category":"guide","primary":false},{"title":"Oh Look, the Foot-Gun Went Off Again: Citrix NetScaler Pre-Auth Command Injection (CVE-2026-88771)","url":"https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/","publisher":"watchtowr","context":"The article cites watchTowr researchers' technical analysis stating that CVE-2026-88771 was exploited before a fix existed and describing NetScaler's enterprise use.","category":"research","primary":false}],"body":"\u003cp\u003eCitrix disclosed eight vulnerabilities affecting NetScaler ADC and NetScaler Gateway devices, with patches released for all of them. Two flaws, CVE-2026-88771 and CVE-2026-88772, have severity scores of 9.5 out of 10 and are being actively exploited, according to Citrix. Cybersecurity agencies in the United States, United Kingdom, and Netherlands issued warnings after incident responders raised concerns about potential NetScaler Gateway vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCISA said it has reports and partner intelligence confirming that threat actors are exploiting at least some of the flaws globally, and gave US federal agencies until Wednesday to patch the two exploited issues. It also said agencies using the affected products need to conduct forensic triage, while Citrix published guidance for customers that suspect compromise. The issue is significant because NetScaler appliances manage traffic and authentication for large organizations, and prior high-profile campaigns targeting the products were linked to hundreds of breaches.\u003c/p\u003e\n"},{"n":24,"title":"CISA Says Attackers Are Exploiting Two Critical Citrix NetScaler Flaws Globally","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisa-says-attackers-are-exploiting-two.html","time":"07:21","priority":"MUST READ","score":98,"tldr":"CISA warns that attackers are actively exploiting two critical Citrix NetScaler ADC and Gateway flaws, CVE-2026-88771 and CVE-2026-88772, which can enable unauthenticated command execution or remote code execution. Organizations should urgently update to Citrix’s patched releases and investigate potentially exposed appliances.","briefOverview":"\u003cp\u003eCISA added two critical Citrix NetScaler ADC and Gateway vulnerabilities, CVE-2026-88771 and CVE-2026-88772, to its Known Exploited Vulnerabilities catalog after receiving reports of active exploitation worldwide. Both flaws have a CVSS score of 9.5. Federal Civilian Executive Branch agencies were directed to apply fixes by September 30, 2026.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-88771 can allow an unauthenticated attacker to execute arbitrary commands, while CVE-2026-88772 can allow remote code execution or denial of service when DTLS is enabled, which is the default on VPN virtual servers. Citrix released fixes for affected NetScaler 14.1, 13.1, FIPS, and NDcPP versions and made indicators of compromise available through NetScaler Console. watchTowr Labs reported that CVE-2026-88771 involves attacker-influenced log data being passed into a shell command by a NetScaler Perl script, allowing pre-authentication command injection as root.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-88771 and CVE-2026-88772, two critical Citrix NetScaler ADC and Gateway flaws, to its Known Exploited Vulnerabilities catalog after reports of active exploitation worldwide.","CVE-2026-88771 can allow an unauthenticated attacker to execute arbitrary commands, while CVE-2026-88772 can enable remote code execution or denial of service when DTLS is enabled.","Citrix fixed the flaws in NetScaler ADC and Gateway 14.1-73.37 and later, 13.1-64.23 and later 13.1 releases, and specified FIPS and NDcPP releases.","Citrix provided indicators of compromise through NetScaler Console and recommends isolating suspected compromised devices, preserving evidence, revoking access, rebuilding and updating firmware, and rotating credentials.","watchTowr Labs reported that CVE-2026-88771 stems from a NetScaler Perl script that processes error information and can be manipulated through a pre-authentication request to run shell commands as root."],"insights":["CVE-2026-88772 has a narrower exposure condition than CVE-2026-88771 because it requires DTLS to be enabled, but DTLS is enabled by default on VPN virtual servers.","CISA said patching NetScaler appliances can be complex and may require downtime, making advance planning for mitigation and risk management important.","For suspected compromise, Citrix recommends treating the appliance as a possible pivot point by investigating every server and system it connected to, not only the appliance itself.","watchTowr Labs found that CVE-2026-88771 can be triggered through a pre-authentication login request because attacker-controlled data written into logs is later incorporated into a shell command.","When restoring from a known-good NetScaler backup, Citrix recommends rotating local-account passwords and Key Encryption Keys and replacing restored SSL certificates."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/27/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA announced that it added the two Citrix NetScaler vulnerabilities to its Known Exploited Vulnerabilities catalog following active-exploitation reports.","category":"advisory","primary":true},{"title":"Critical Zero-Day Vulnerabilities Exploited in Citrix NetScaler ADC and Gateway","url":"https://www.cisa.gov/news-events/alerts/2026/09/27/critical-zero-day-vulnerabilities-exploited-citrix-netscaler-adc-gateway","publisher":"cisa","context":"The article cites this CISA alert for confirmation from reports and partner intelligence that the flaws are being exploited globally.","category":"advisory","primary":true},{"title":"NetScaler ADC and NetScaler Gateway Security Bulletin for CVE-2026-88771 Through CVE-2026-88778","url":"https://community.citrix.com/techzone-blogs/110_security-updates/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-88771-through-cve-2026-88778","publisher":"citrix","context":"Citrix’s security bulletin is referenced for indicators of compromise available through NetScaler Console.","category":"advisory","primary":false},{"title":"Oh Look, The Foot-Gun Went Off Again: Citrix NetScaler Pre-Auth Command Injection (CVE-2026-88771)","url":"https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/","publisher":"watchtowr-labs","context":"watchTowr Labs’ technical analysis is cited for its finding that a Perl script enables pre-authentication command injection as root.","category":"research","primary":false},{"title":"watchTowr-vs-Citrix-Netscaler-CVE-2026-88771","url":"https://github.com/watchtowrlabs/watchTowr-vs-Citrix-Netscaler-CVE-2026-88771","publisher":"watchtowr-labs","context":"The article links to watchTowr Labs’ CVE-2026-88771 technical material alongside its analysis of the flaw.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added two critical Citrix NetScaler ADC and Gateway vulnerabilities, CVE-2026-88771 and CVE-2026-88772, to its Known Exploited Vulnerabilities catalog after receiving reports of active exploitation worldwide. Both flaws have a CVSS score of 9.5. Federal Civilian Executive Branch agencies were directed to apply fixes by September 30, 2026.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-88771 can allow an unauthenticated attacker to execute arbitrary commands, while CVE-2026-88772 can allow remote code execution or denial of service when DTLS is enabled, which is the default on VPN virtual servers. Citrix released fixes for affected NetScaler 14.1, 13.1, FIPS, and NDcPP versions and made indicators of compromise available through NetScaler Console. watchTowr Labs reported that CVE-2026-88771 involves attacker-influenced log data being passed into a shell command by a NetScaler Perl script, allowing pre-authentication command injection as root.\u003c/p\u003e\n"},{"n":32,"title":"Threat Brief: NetScaler Zero Days CVE-2026-88771 and CVE-2026-88772 Exploited in the Wild","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/","time":"15:02","priority":"MUST READ","score":98,"tldr":"Citrix reports that two critical NetScaler ADC and Gateway zero-days, CVE-2026-88771 and CVE-2026-88772, are being exploited in the wild and can enable unauthenticated remote code execution or denial of service. Organizations should immediately identify exposed appliances, preserve evidence, hunt for compromise, isolate affected systems, and apply Citrix updates.","briefOverview":"\u003cp\u003eCitrix reports that CVE-2026-88771 and CVE-2026-88772 affecting NetScaler ADC and NetScaler Gateway have been exploited in the wild. Unit 42 describes the activity as possible zero-day activity and states that no further details about the exploitation were available. Both vulnerabilities have a CVSS v4.0 base score of 9.5.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-88771 is an improper input-validation flaw that can allow an unauthenticated actor to run commands on affected systems. CVE-2026-88772 is a memory-overflow flaw in the Datagram Transport Layer Security configuration that can lead to remote code execution or denial of service. As of September 27, 2026, Cortex Xpanse telemetry identified more than 50,277 exposed instances potentially vulnerable to the two CVEs.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 recommends that customers confirm whether their appliances meet the Citrix advisory’s conditions, isolate vulnerable systems, preserve relevant evidence, and update to the latest versions as soon as possible. It also recommends hunting for suspicious administrative sessions, unexpected outbound connections, and unexplained gaps in logging, while noting that these are general hunting suggestions rather than observed behaviors tied specifically to these CVEs. The article cautions that updating and patching will not remove attacker access if persistence has already been established.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix reports that CVE-2026-88771 and CVE-2026-88772 in NetScaler ADC and NetScaler Gateway have been exploited in the wild.","CVE-2026-88771 can allow an unauthenticated actor to run commands on affected NetScaler ADC and Gateway systems because of improper input validation.","CVE-2026-88772 is a memory-overflow issue in the DTLS configuration that can result in remote code execution or denial of service.","Both vulnerabilities have a CVSS v4.0 base score of 9.5.","Unit 42 recommends confirming exposure, isolating vulnerable systems, preserving evidence, hunting for suspicious activity, and updating Citrix software as soon as possible."],"insights":["Patching alone may not remove an attacker who already established persistent access, so organizations should also investigate for compromise.","Unit 42’s recommended hunting indicators, such as suspicious administrative sessions, unexpected outbound connections, and gaps in logging, are general guidance rather than behaviors specifically tied to these CVEs.","Cortex Xpanse telemetry identified more than 50,277 exposed instances potentially vulnerable to these CVEs as of September 27, 2026.","The article states that no further details about the observed exploitation activity were available at the time of publication, making evidence preservation especially important."],"referencedReports":[{"title":"Citrix NetScaler ADC and Citrix NetScaler Gateway Security Bulletin for CVE-2026-88771, CVE-2026-88772, CVE-2026-88773, CVE-2026-88774, CVE-2026-88775, CVE-2026-88776, CVE-2026-88777, and CVE-2026-88778","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697096","publisher":"citrix","context":"The article cites this Citrix security advisory as reporting exploitation in the wild and directs customers to its exposure-assessment steps.","category":"advisory","primary":true}],"body":"\u003cp\u003eCitrix reports that CVE-2026-88771 and CVE-2026-88772 affecting NetScaler ADC and NetScaler Gateway have been exploited in the wild. Unit 42 describes the activity as possible zero-day activity and states that no further details about the exploitation were available. Both vulnerabilities have a CVSS v4.0 base score of 9.5.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-88771 is an improper input-validation flaw that can allow an unauthenticated actor to run commands on affected systems. CVE-2026-88772 is a memory-overflow flaw in the Datagram Transport Layer Security configuration that can lead to remote code execution or denial of service. As of September 27, 2026, Cortex Xpanse telemetry identified more than 50,277 exposed instances potentially vulnerable to the two CVEs.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 recommends that customers confirm whether their appliances meet the Citrix advisory’s conditions, isolate vulnerable systems, preserve relevant evidence, and update to the latest versions as soon as possible. It also recommends hunting for suspicious administrative sessions, unexpected outbound connections, and unexplained gaps in logging, while noting that these are general hunting suggestions rather than observed behaviors tied specifically to these CVEs. The article cautions that updating and patching will not remove attacker access if persistence has already been established.\u003c/p\u003e\n"},{"n":15,"title":"ShinyHunters exploiting workarounds for Oracle PeopleSoft bug, Mandiant warns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/shinyhunters-cyberattacks-oracle-mandiant","time":"19:30","priority":"MUST READ","score":95,"tldr":"Mandiant warns that ShinyHunters has resumed exploiting Oracle PeopleSoft CVE-2026-35273, specifically targeting organizations that used workarounds instead of installing Oracle’s patch. The group has compromised dozens of systems globally, deploying web shells and stealing data for extortion.","briefOverview":"\u003cp\u003eMandiant warned that ShinyHunters has resumed exploiting CVE-2026-35273, an Oracle PeopleSoft vulnerability that the group previously used as a zero-day against academic institutions between May 27 and June 9. Oracle released a patch on June 10, but Mandiant said the renewed campaign targets organizations that implemented workarounds rather than applying the patch. PeopleSoft is widely used by government, education, and healthcare organizations for functions including invoices, projects, staffing, payroll, and student records.\u003c/p\u003e\n\n\u003cp\u003eMandiant said ShinyHunters deployed web shells on dozens of systems worldwide across higher education, technology, IT services, healthcare, agriculture, transportation, and government. In analyzed compromises, the group gained full control of an operating system or accessed PeopleSoft configuration files, database connection strings, and application data. Mandiant urged organizations to review database logs for queries involving human-resources, payroll, and student-record tables and to prepare for extortion demands or public exposure of stolen data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mandiant warned that ShinyHunters resumed exploiting Oracle PeopleSoft CVE-2026-35273 by targeting organizations that applied workarounds but did not install Oracle’s June 10 patch.","Mandiant said the group deployed web shells on dozens of systems globally across higher education, technology, IT services, healthcare, agriculture, transportation, and government.","In compromised PeopleSoft systems, ShinyHunters obtained full operating-system control or accessed configuration files, database connection strings, and application data.","ShinyHunters claimed it breached an FBI jobs website through an Oracle PeopleSoft vulnerability and allegedly stole sensitive FBI data, while FBI officials said they were operating under the premise that employee personal information was also being taken.","Mandiant advised PeopleSoft users to review database logs for queries involving human-resources, payroll, and student-record tables and prepare for potential extortion demands."],"insights":["Published workarounds were not sufficient against the renewed campaign: Mandiant said ShinyHunters adapted its approach to target organizations that used them without applying Oracle’s patch.","The compromise can extend beyond the PeopleSoft application itself, because Mandiant observed attackers obtaining either full control of the underlying operating system or access to database connection details and application data.","Mandiant’s recommendation to inspect queries involving human-resources, payroll, and student-record tables indicates that the most sensitive data may be identifiable through database activity logs.","Organizations affected by the campaign should prepare not only for technical remediation but also for extortion messages and possible public release of stolen information, based on ShinyHunters’ established data-theft pattern."],"referencedReports":[{"title":"ShinyHunters’ Renewed Mass Exploitation Campaign Targeting Oracle PeopleSoft","url":"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft","publisher":"mandiant","context":"The article relies on Mandiant’s analysis warning that ShinyHunters resumed exploiting CVE-2026-35273 against organizations that used workarounds without patching.","category":"research","primary":true},{"title":"Oracle Security Alert for CVE-2026-35273","url":"https://www.oracle.com/security-alerts/alert-cve-2026-35273.html","publisher":"oracle","context":"The article cites Oracle’s security alert announcing the patch for the PeopleSoft vulnerability on June 10.","category":"advisory","primary":false}],"body":"\u003cp\u003eMandiant warned that ShinyHunters has resumed exploiting CVE-2026-35273, an Oracle PeopleSoft vulnerability that the group previously used as a zero-day against academic institutions between May 27 and June 9. Oracle released a patch on June 10, but Mandiant said the renewed campaign targets organizations that implemented workarounds rather than applying the patch. PeopleSoft is widely used by government, education, and healthcare organizations for functions including invoices, projects, staffing, payroll, and student records.\u003c/p\u003e\n\n\u003cp\u003eMandiant said ShinyHunters deployed web shells on dozens of systems worldwide across higher education, technology, IT services, healthcare, agriculture, transportation, and government. In analyzed compromises, the group gained full control of an operating system or accessed PeopleSoft configuration files, database connection strings, and application data. Mandiant urged organizations to review database logs for queries involving human-resources, payroll, and student-record tables and to prepare for extortion demands or public exposure of stolen data.\u003c/p\u003e\n"},{"n":21,"title":"Apple Patches CoreGraphics Flaw Possibly Exploited in Targeted Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/apple-patches-coregraphics-flaw.html","time":"19:18","priority":"MUST READ","score":94,"tldr":"Apple patched CVE-2026-86950, a CoreGraphics out-of-bounds write flaw that may have been used in highly sophisticated targeted attacks against older iOS versions. Users should update affected iPhones, iPads, and Macs to the latest available releases.","briefOverview":"\u003cp\u003eApple released security updates for older iOS, iPadOS, and macOS versions to fix CVE-2026-86950, a flaw in the CoreGraphics component. The issue is an out-of-bounds write that could allow arbitrary code execution when an affected device processes a maliciously crafted file. Apple said it fixed the flaw by improving bounds checking and credited Meta Product Security with reporting it.\u003c/p\u003e\n\n\u003cp\u003eApple said it is aware of a report that the issue may have been used in an extremely sophisticated attack against specifically targeted individuals on iOS versions before iOS 27. The company did not say how many people may have been targeted, whether exploitation attempts succeeded, or when the first possible exploitation occurred. Fixes are included in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1 for supported devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple released security updates for older iOS, iPadOS, and macOS versions to address CVE-2026-86950 in CoreGraphics.","CVE-2026-86950 is an out-of-bounds write issue that could allow arbitrary code execution when a device processes a maliciously crafted file.","Apple said the flaw may have been exploited in an extremely sophisticated attack against specifically targeted individuals using iOS versions before iOS 27.","The issue was fixed through improved bounds checking and was reported to Apple by Meta Product Security.","The fixes are available in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1."],"insights":["Apple publicly acknowledged possible real-world use of the flaw but did not disclose how many people were targeted, whether attempts succeeded, or when the first exploitation occurred.","The flaw can be triggered through processing a specially crafted file, making timely installation of the listed operating-system updates particularly important for eligible Apple devices.","The updates cover both Apple’s current Tahoe release and the older Sequoia macOS release, indicating that supported devices on either version can receive the fix."],"referencedReports":[{"title":"About the security content of iOS 26.7.1 and iPadOS 26.7.1","url":"https://support.apple.com/en-us/149226","publisher":"apple","context":"The article links to Apple's security update information for iOS 26.7.1 and iPadOS 26.7.1, which address CVE-2026-86950.","category":"advisory","primary":true},{"title":"About the security content of macOS Tahoe 26.7.1","url":"https://support.apple.com/en-us/149228","publisher":"apple","context":"The article links to Apple's security update information for macOS Tahoe 26.7.1, which includes the CoreGraphics fix.","category":"advisory","primary":true},{"title":"About the security content of macOS Sequoia 15.8.1","url":"https://support.apple.com/en-us/149229","publisher":"apple","context":"The article links to Apple's security update information for macOS Sequoia 15.8.1, which includes the CoreGraphics fix.","category":"advisory","primary":true}],"body":"\u003cp\u003eApple released security updates for older iOS, iPadOS, and macOS versions to fix CVE-2026-86950, a flaw in the CoreGraphics component. The issue is an out-of-bounds write that could allow arbitrary code execution when an affected device processes a maliciously crafted file. Apple said it fixed the flaw by improving bounds checking and credited Meta Product Security with reporting it.\u003c/p\u003e\n\n\u003cp\u003eApple said it is aware of a report that the issue may have been used in an extremely sophisticated attack against specifically targeted individuals on iOS versions before iOS 27. The company did not say how many people may have been targeted, whether exploitation attempts succeeded, or when the first possible exploitation occurred. Fixes are included in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1 for supported devices.\u003c/p\u003e\n"},{"n":23,"title":"Bitget Says Attacker Exploited Third-Party Security Product Flaw to Steal $388M","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/bitget-says-attacker-exploited-third.html","time":"17:42","priority":"MUST READ","score":94,"tldr":"Bitget says attackers stole about $388 million from its hot and warm wallets after exploiting a zero-day flaw in an unnamed third-party security product to obtain privileged internal credentials and issue fraudulent withdrawals. The exchange says cold wallets and customer balances were unaffected, and it still suspects a North Korean-linked group.","briefOverview":"\u003cp\u003eBitget said an attacker stole about $388 million after exploiting a vulnerability in an unnamed third-party security product used by the cryptocurrency exchange. The flaw allegedly gave the attacker high-level internal credentials and access to an internal management system. On September 24, the attacker used that access to insert fraudulent withdrawal commands into wallet-related backend services, where they were treated as legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe attacker first made two small transfers below Bitget\u0026rsquo;s risk-control threshold before larger transfers began about 30 minutes later and bypassed the exchange\u0026rsquo;s controls. Bitget said the theft affected portions of its hot and warm wallets, while its cold wallets, private keys, and customer account balances were not affected. The exchange says its Protection Fund will cover the loss, has restricted internal access and added withdrawal checks, and still suspects a North Korean-linked group while its investigation continues with support from Mandiant and SlowMist.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitget said an attacker stole about $388 million after exploiting a vulnerability in an unnamed third-party security product to gain high-level internal credentials.","On September 24, the attacker used those credentials to send fraudulent withdrawal commands that were processed by Bitget’s wallet system, affecting hot and warm wallets but not cold wallets.","Bitget said the attacker first made two small transfers below its risk-control threshold before executing larger transfers roughly 30 minutes later.","Bitget said no private keys or customer account balances were affected, and that its Protection Fund will cover the loss.","Bitget still suspects a North Korean-linked group, while TRM Labs reported that fund movements overlap with wallets previously used to launder North Korean thefts."],"insights":["The attacker’s two small test transfers stayed below Bitget’s risk-control threshold, showing that controls focused on individual transaction size did not flag the early activity.","Because the attacker used legitimate high-level credentials, fraudulent withdrawal commands were treated as routine administrative actions and bypassed existing approval safeguards.","Bitget’s statement that private keys were not compromised indicates the loss resulted from abuse of its internal withdrawal workflow rather than direct theft of wallet signing keys.","TRM Labs advised screening not only direct deposits from known attacker addresses but also funds routed through intermediate wallets, because the proceeds were being moved through bridges and cross-chain swap services."],"referencedReports":[{"title":"Bitget Loses $351.6 Million in Hot Wallet Breach in Likely North Korea Attack","url":"https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack","publisher":"trm-labs","context":"The article cites TRM Labs' blockchain analysis finding overlaps between the stolen funds and wallets previously used to launder North Korean thefts.","category":"research","primary":false}],"body":"\u003cp\u003eBitget said an attacker stole about $388 million after exploiting a vulnerability in an unnamed third-party security product used by the cryptocurrency exchange. The flaw allegedly gave the attacker high-level internal credentials and access to an internal management system. On September 24, the attacker used that access to insert fraudulent withdrawal commands into wallet-related backend services, where they were treated as legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe attacker first made two small transfers below Bitget\u0026rsquo;s risk-control threshold before larger transfers began about 30 minutes later and bypassed the exchange\u0026rsquo;s controls. Bitget said the theft affected portions of its hot and warm wallets, while its cold wallets, private keys, and customer account balances were not affected. The exchange says its Protection Fund will cover the loss, has restricted internal access and added withdrawal checks, and still suspects a North Korean-linked group while its investigation continues with support from Mandiant and SlowMist.\u003c/p\u003e\n"},{"n":9,"title":"Bitget resumes Bitcoin withdrawals after $387.5 million crypto heist","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bitget-resumes-bitcoin-withdrawals-after-3875-million-crypto-heist/","time":"09:25","priority":"MUST READ","score":93,"tldr":"Bitget resumed Bitcoin withdrawals after a suspected North Korean-linked breach of its wallet infrastructure led to the theft of an estimated $387.5 million, while withdrawals for other assets are being restored on a staged schedule.","briefOverview":"\u003cp\u003eBitget has resumed Bitcoin withdrawals after suspending all withdrawals following unauthorized transfers from a limited number of its cryptocurrency wallets. The exchange initially reported \u003cspan class=\"math inline\"\u003e\\(351.6 million stolen, but later updated the total to \\)\u003c/span\u003e387.5 million based on on-chain tracing and transaction classification. It said the incident is contained, user account balances remain unaffected, and trading and deposits continue to operate.\u003c/p\u003e\n\n\u003cp\u003eBitget CEO Gracy Chen attributed the theft to North Korean hackers who allegedly breached a critical backend system in the company’s wallet infrastructure. The attackers reportedly spoofed transaction data, causing Bitget’s authorization process to move funds from compromised hot and warm wallets across several networks and assets. Bitget said it fixed the exploited security weakness and will restore withdrawals in stages, while its Protection Fund covers the financial impact and a recovery bounty offers 5% for help recovering or freezing funds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitget resumed Bitcoin withdrawals after suspending all withdrawals following unauthorized transfers from a limited number of its cryptocurrency wallets.","Bitget said its latest on-chain tracing and transaction classification found that $387.5 million was transferred to attacker-controlled addresses.","Bitget CEO Gracy Chen attributed the incident to North Korean hackers who allegedly breached a critical backend system in the company’s wallet infrastructure and spoofed transaction data.","The exchange said customer account balances remain unaffected, its Protection Fund covers the financial impact, and trading and deposits continue to operate.","Bitget plans to restore withdrawals for Ethereum-related networks on September 29, USDT on selected networks on September 30, and other tokens, fiat, and peer-to-peer assets beginning October 2."],"insights":["The theft was attributed to transaction-data spoofing in Bitget’s wallet backend, meaning the attackers allegedly caused the exchange’s own authorization process to approve transfers from compromised hot and warm wallets.","The incident affected multiple blockchain networks and assets, including Ethereum, XRP Ledger, Arbitrum, Avalanche, Optimism, BSC, Base, ETH, XRP, BNB, AVAX, USDT, and USDC, illustrating that the disruption was not limited to a single cryptocurrency.","Bitget is restoring withdrawals in stages by asset and network while keeping trading and deposits available, showing that service recovery is being separated from the broader security containment process.","Bitget launched a recovery bounty offering 5% for assistance recovering or freezing funds, while stating that its Protection Fund will cover the incident’s financial impact."],"referencedReports":[],"body":"\u003cp\u003eBitget has resumed Bitcoin withdrawals after suspending all withdrawals following unauthorized transfers from a limited number of its cryptocurrency wallets. The exchange initially reported \u003cspan class=\"math inline\"\u003e\\(351.6 million stolen, but later updated the total to \\)\u003c/span\u003e387.5 million based on on-chain tracing and transaction classification. It said the incident is contained, user account balances remain unaffected, and trading and deposits continue to operate.\u003c/p\u003e\n\n\u003cp\u003eBitget CEO Gracy Chen attributed the theft to North Korean hackers who allegedly breached a critical backend system in the company’s wallet infrastructure. The attackers reportedly spoofed transaction data, causing Bitget’s authorization process to move funds from compromised hot and warm wallets across several networks and assets. Bitget said it fixed the exploited security weakness and will restore withdrawals in stages, while its Protection Fund covers the financial impact and a recovery bounty offers 5% for help recovering or freezing funds.\u003c/p\u003e\n"},{"n":25,"title":"JADEPUFFER-Linked Attackers Used Compromised Service Principals to Delete Azure Resources","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/jadepuffer-linked-attackers-used.html","time":"09:08","priority":"MUST READ","score":92,"tldr":"Microsoft says JADEPUFFER (Storm-3168) used service-principal credentials exposed in a public GitHub edit history to enumerate an Azure tenant and delete numerous storage and recovery-related resources. The incident highlights how leaked cloud credentials and broad permissions can enable rapid, ransomware-aligned destruction even when some protections, such as resource locks, remain in place.","briefOverview":"\u003cp\u003eMicrosoft said the threat actor JADEPUFFER, which it tracks as Storm-3168, used compromised service principals to carry out destructive activity in an Azure environment over about 18 hours in early June 2026. Two service principals associated with the same tenant were used, with one largely conducting reconnaissance and the other performing discovery, collecting credentials, and executing destructive actions. The activity targeted Azure Storage Accounts, SQL databases, Key Vaults, Function Apps, recovery protection locks, Virtual Machines, and App Services.\u003c/p\u003e\n\n\u003cp\u003eThe attackers spent nearly 16 hours performing more than 300 read operations to enumerate subscriptions, resource groups, virtual machines, and other resources before launching destructive and credential-collection activity. They attempted more than 100 storage-account deletions in about seven minutes, and Microsoft said most targeted storage accounts were successfully deleted. Attempts to delete Azure SQL databases failed because the attackers used an unsupported API version, while resource locks and storage-level deletion protection prevented some storage-account deletions.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed that the affected service principal\u0026rsquo;s client ID, client secret, and tenant ID had previously appeared in plaintext in a public GitHub issue and remained accessible through its edit history after being removed. Microsoft assessed the activity as ransomware-aligned because it included deletion of resources and backup- and recovery-related protections, although it observed no ransom note or successful data theft. The article also notes that JADEPUFFER was previously linked to an LLM-assisted ransomware operation exploiting Langflow CVE-2025-3248 and later using the Go-based ENCFORGE ransomware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft tracked JADEPUFFER as Storm-3168 after attackers used two compromised Azure service principals to conduct reconnaissance, collect credentials, and attempt destructive actions in an Azure tenant.","The activity occurred over about 18 hours in early June 2026, including nearly 16 hours of more than 300 read operations before over 150 destructive or credential-collection operations were performed in 35 minutes.","The attackers attempted more than 100 Azure Storage account deletions and targeted Azure Key Vault, Function App, App Service plan, Azure SQL databases, and backup and recovery-related protections.","Most targeted Azure Storage accounts were successfully deleted, while resource locks and storage account-level deletion protection prevented deletion of some accounts.","Microsoft observed that the compromised client ID, client secret, and tenant ID had previously been exposed in plaintext in a public GitHub issue, including in the public edit history after the secret was removed."],"insights":["Azure resource locks and storage account-level deletion protection stopped some deletion attempts even though the compromised identity had broad administrative permissions, demonstrating the value of safeguards that operate independently of an account’s privileges.","Removing a secret from a public GitHub issue was insufficient because the client ID, client secret, and tenant ID remained available in the issue’s public edit history.","The attackers separated reconnaissance from destruction across two compromised service principals, and Microsoft said the timing and division of work indicated the activity was likely automated or scripted.","The attempted Azure SQL database deletions failed because the attackers used an unsupported API version for that Azure SQL resource type."],"referencedReports":[{"title":"Storm-3168: Agentic-driven cloud attacks using compromised service principals","url":"https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/","publisher":"microsoft","context":"The article relies on Microsoft's analysis of Storm-3168's use of compromised Azure service principals for reconnaissance, credential collection, and destructive resource deletion.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft said the threat actor JADEPUFFER, which it tracks as Storm-3168, used compromised service principals to carry out destructive activity in an Azure environment over about 18 hours in early June 2026. Two service principals associated with the same tenant were used, with one largely conducting reconnaissance and the other performing discovery, collecting credentials, and executing destructive actions. The activity targeted Azure Storage Accounts, SQL databases, Key Vaults, Function Apps, recovery protection locks, Virtual Machines, and App Services.\u003c/p\u003e\n\n\u003cp\u003eThe attackers spent nearly 16 hours performing more than 300 read operations to enumerate subscriptions, resource groups, virtual machines, and other resources before launching destructive and credential-collection activity. They attempted more than 100 storage-account deletions in about seven minutes, and Microsoft said most targeted storage accounts were successfully deleted. Attempts to delete Azure SQL databases failed because the attackers used an unsupported API version, while resource locks and storage-level deletion protection prevented some storage-account deletions.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed that the affected service principal\u0026rsquo;s client ID, client secret, and tenant ID had previously appeared in plaintext in a public GitHub issue and remained accessible through its edit history after being removed. Microsoft assessed the activity as ransomware-aligned because it included deletion of resources and backup- and recovery-related protections, although it observed no ransom note or successful data theft. The article also notes that JADEPUFFER was previously linked to an LLM-assisted ransomware operation exploiting Langflow CVE-2025-3248 and later using the Go-based ENCFORGE ransomware.\u003c/p\u003e\n"},{"n":2,"title":"Times Car confirms data breach affecting 6.6 million user accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/times-car-confirms-data-breach-affecting-66-million-user-accounts/","time":"20:31","priority":"SHOULD READ","score":88,"tldr":"Japanese car-sharing service Times Car confirmed that a cyberattack exposed personal data for about 6.6 million current and former users, including identity-document images and password hashes. Credit card data was not affected, and the company is notifying impacted customers while investigating the incident.","briefOverview":"\u003cp\u003eJapanese car-sharing service Times Car confirmed that a cyberattack compromised information tied to approximately 6.6 million current and former members, including members of its Times Business Service corporate program. The company said a third party accessed its systems at the beginning of September and that it blocked the unauthorized access on September 26. Times Car is operated by Times Mobility, part of the Park24 Group, and has said its services continue operating normally.\u003c/p\u003e\n\n\u003cp\u003eThe exposed information includes names, addresses, birth dates, phone numbers, email addresses, driver’s license details, identity-verification document images, account passwords, and linked service IDs; corporate members’ department names may also be affected. Times Car said passwords were stored in a form that cannot be restored, but did not provide further details. The company said credit card information was unaffected and that it has no current evidence the stolen data has been distributed online, while it investigates with an external expert and notifies affected customers in stages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Times Car confirmed that a cyberattack compromised information associated with approximately 6.6 million current and former users, including members of its Times Business Service corporate program.","The company said unauthorized access to its systems began at the start of September and that it blocked the access on September 26.","Exposed data includes names, addresses, birth dates, telephone numbers, email addresses, driver’s license details, identity-document images, passwords, and linked service IDs.","Times Car said credit card information was not affected and that it has no current evidence that the stolen data has been distributed online.","The company is conducting a forensic investigation with an external expert and will notify affected customers in stages."],"insights":["The 6.6 million affected accounts include former members as well as current users, exceeding Times Car’s stated 4 million active members as of August 2026.","The exposed records may include images of driver’s licenses and other identity-verification documents, not only standard contact and account information.","Corporate-program members may have had their department names exposed in addition to personal details.","Times Car said customer notifications will be sent in stages, while its car-sharing services continue to operate normally."],"referencedReports":[],"body":"\u003cp\u003eJapanese car-sharing service Times Car confirmed that a cyberattack compromised information tied to approximately 6.6 million current and former members, including members of its Times Business Service corporate program. The company said a third party accessed its systems at the beginning of September and that it blocked the unauthorized access on September 26. Times Car is operated by Times Mobility, part of the Park24 Group, and has said its services continue operating normally.\u003c/p\u003e\n\n\u003cp\u003eThe exposed information includes names, addresses, birth dates, phone numbers, email addresses, driver’s license details, identity-verification document images, account passwords, and linked service IDs; corporate members’ department names may also be affected. Times Car said passwords were stored in a form that cannot be restored, but did not provide further details. The company said credit card information was unaffected and that it has no current evidence the stolen data has been distributed online, while it investigates with an external expert and notifies affected customers in stages.\u003c/p\u003e\n"},{"n":6,"title":"JadePuffer agentic AI attacks target Azure, destroy cloud resources","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/jadepuffer-agentic-ai-attacks-target-azure-destroy-cloud-resources/","time":"15:49","priority":"SHOULD READ","score":88,"tldr":"Microsoft observed JadePuffer (Storm-3168) using compromised Azure service principals in agent-driven attacks to map tenant resources, steal storage keys, and rapidly delete more than 100 storage accounts and other cloud assets. Resource locks and account protections limited some damage, while a service-principal credential may have been exposed publicly on GitHub.","briefOverview":"\u003cp\u003eMicrosoft Security Research observed two June attacks in which JadePuffer, tracked as Storm-3168, used compromised Azure service principals to map cloud resources, collect storage account keys, and delete resources. The destructive activity lasted seven minutes and targeted more than 100 Azure Storage accounts, as well as Key Vaults, Function Apps, virtual machines, and App Services. Most targeted storage accounts were deleted, though Azure resource locks and storage account-level protections prevented some deletions.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used one compromised service principal for reconnaissance and another for discovery, destructive actions, and credential collection. Attempts to delete Azure SQL databases failed because an unsupported API version was used, and attempts to remove Azure Site Recovery protection locks also failed. About 30 minutes later, Storm-3168 made more than 30 requests for storage account keys, most of which succeeded; Microsoft noted that credentials for one service principal had appeared in a public GitHub issue before the attacks, although the initial access method was not confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft observed two June attacks by JadePuffer, tracked as Storm-3168, against Azure tenants using two compromised service principals from the same tenant.","The attackers mapped cloud resources, retrieved Azure Storage account keys, and attempted destructive actions against more than 100 storage accounts, Key Vaults, Function Apps, virtual machines, and App Services within seven minutes.","Most targeted Azure Storage accounts were deleted, but Azure resource locks and storage account-level protections prevented some deletions.","Attempts to delete Azure SQL databases and remove Azure Site Recovery protection locks failed because the attackers used an unsupported API version and could not remove the recovery locks.","About 30 minutes after the deletion attempts, Storm-3168 made more than 30 requests for storage account keys, most of which succeeded; Microsoft noted that credentials for one service principal had appeared in a public GitHub issue before the attacks."],"insights":["Azure resource locks and storage account-level protections prevented some storage-account deletions, showing that these controls limited the observed destructive activity.","The attacker used separate compromised service principals for reconnaissance and for discovery, credential collection, and destructive actions, dividing tasks between two identities in the same tenant.","The destructive activity targeted multiple Azure service types rather than storage alone, including Key Vaults, Function Apps, virtual machines, and App Services.","Deletion attempts against Azure SQL databases failed because the attacker used an unsupported API version, and attempts to remove Azure Site Recovery locks also failed.","A credential for one of the compromised service principals appeared in a public GitHub issue before the attacks, although Microsoft could not determine the exact initial-access method."],"referencedReports":[{"title":"Storm-3168: Agentic-driven cloud attacks using compromised service principals","url":"https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/","publisher":"microsoft","context":"The article relies on Microsoft Security Research's analysis of observed Storm-3168 attacks against Azure tenants and cites its findings on the attackers' destructive activity.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft Security Research observed two June attacks in which JadePuffer, tracked as Storm-3168, used compromised Azure service principals to map cloud resources, collect storage account keys, and delete resources. The destructive activity lasted seven minutes and targeted more than 100 Azure Storage accounts, as well as Key Vaults, Function Apps, virtual machines, and App Services. Most targeted storage accounts were deleted, though Azure resource locks and storage account-level protections prevented some deletions.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used one compromised service principal for reconnaissance and another for discovery, destructive actions, and credential collection. Attempts to delete Azure SQL databases failed because an unsupported API version was used, and attempts to remove Azure Site Recovery protection locks also failed. About 30 minutes later, Storm-3168 made more than 30 requests for storage account keys, most of which succeeded; Microsoft noted that credentials for one service principal had appeared in a public GitHub issue before the attacks, although the initial access method was not confirmed.\u003c/p\u003e\n"},{"n":1,"title":"Over 16,000 Supabase databases expose PII, passwords, auth tokens","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/misconfigured-supabase-apps-expose-data-in-over-16-000-databases/","time":"18:50","priority":"SHOULD READ","score":84,"tldr":"UpGuard found more than 16,000 publicly accessible, misconfigured Supabase databases exposing sensitive data such as PII, plaintext passwords, and authentication tokens. The exposures stem largely from weak or missing row-level security policies and improper use of public keys, with AI-assisted development potentially increasing configuration mistakes.","briefOverview":"\u003cp\u003eUpGuard researchers found more than 16,000 misconfigured Supabase databases with readable tables exposing personally identifiable information, passwords, or authentication tokens. The researchers analyzed roughly 300,000 domains that appeared to use Supabase and examined accessible table schemas, including tables with names other than “users.” More than half of the exposed databases contained personal information, while smaller subsets exposed passwords and authentication tokens. UpGuard believes a very small portion of the exposed data included credit card information.\u003c/p\u003e\n\n\u003cp\u003eThe exposed records affected organizations in multiple sectors and countries, including a U.S. valet service, a Canadian immigration service, an India-based adult creator platform, a Philippines-based OTP service, and an African government consulate. Examples included over 100,000 valet customer records, 884 plaintext passwords at the Canadian service, more than 100,000 private messages at the adult creator platform, and emergency housing locations in consulate records. UpGuard attributed the problem to poor application security configuration, including absent or ineffective row-level security policies and misuse of public keys. The researchers said AI-assisted development may increase the risk of such mistakes, though their scans did not establish that every exposed site was built using an AI coding agent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["UpGuard researchers found more than 16,000 misconfigured Supabase databases with readable tables exposing personal information, passwords, or authentication tokens.","The researchers analyzed about 300,000 domains showing signs of Supabase use and used accessible table schemas to infer the types of data exposed.","More than half of the exposed databases contained personally identifiable information, while smaller subsets contained passwords and authentication tokens.","Examples included a U.S. valet service with over 100,000 exposed customer records and a Canadian immigration service with nearly 5,000 user records, including 884 plaintext passwords.","UpGuard attributed the exposures to poor application security settings, including missing or ineffective row-level security policies and misuse of public keys."],"insights":["The exposure was not limited to databases with a table named “users”; when that table was absent, researchers sometimes found that differently named tables were still accessible.","The affected organizations spanned unrelated sectors and regions, including valet parking, immigration services, adult-content platforms, SMS services, and a government consulate, indicating the configuration problem was not tied to one business type.","Although AI-assisted development accounts for more than 60% of newly created Supabase databases, UpGuard said its scans did not prove that every exposed site was created with an AI coding agent.","Some exposed data went beyond account details: researchers identified private messages, SMS communications, license plates, visit histories, emergency housing locations, and a small amount of apparent credit card data.","UpGuard said it notified application owners when deeper analysis identified significant exposure and directed Supabase users to the platform’s security advisors and API security guidance."],"referencedReports":[{"title":"Everything Everywhere: Systemic Data Exposure in Supabase Apps","url":"https://www.upguard.com/blog/everything-everywhere-systemic-data-exposure-in-supabase-apps","publisher":"upguard","context":"The article relies on UpGuard's research into misconfigured Supabase databases exposing sensitive information.","category":"research","primary":true}],"body":"\u003cp\u003eUpGuard researchers found more than 16,000 misconfigured Supabase databases with readable tables exposing personally identifiable information, passwords, or authentication tokens. The researchers analyzed roughly 300,000 domains that appeared to use Supabase and examined accessible table schemas, including tables with names other than “users.” More than half of the exposed databases contained personal information, while smaller subsets exposed passwords and authentication tokens. UpGuard believes a very small portion of the exposed data included credit card information.\u003c/p\u003e\n\n\u003cp\u003eThe exposed records affected organizations in multiple sectors and countries, including a U.S. valet service, a Canadian immigration service, an India-based adult creator platform, a Philippines-based OTP service, and an African government consulate. Examples included over 100,000 valet customer records, 884 plaintext passwords at the Canadian service, more than 100,000 private messages at the adult creator platform, and emergency housing locations in consulate records. UpGuard attributed the problem to poor application security configuration, including absent or ineffective row-level security policies and misuse of public keys. The researchers said AI-assisted development may increase the risk of such mistakes, though their scans did not establish that every exposed site was built using an AI coding agent.\u003c/p\u003e\n"},{"n":11,"title":"Cyberattack on Polish medical software provider exposes patient data","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-cyberattack-medical-medyc","time":"13:30","priority":"SHOULD READ","score":84,"tldr":"Polish medical software provider Qbusoft’s Medyc platform was breached through an SQL injection flaw, potentially exposing patient identities and sensitive medical records. Authorities are investigating amid concerns that the attackers may have stolen data on millions of patients.","briefOverview":"\u003cp\u003ePolish healthcare software provider Qbusoft said attackers breached its Medyc platform after exploiting an SQL injection weakness in August. The intrusion was detected overnight on September 9, after an unauthorized person transferred an encrypted database archive outside Qbusoft’s systems. Qbusoft said the attackers obtained names, PESEL national identification numbers, addresses, phone numbers, and email addresses.\u003c/p\u003e\n\n\u003cp\u003eQbusoft has not confirmed that medical records were taken, but an affected treatment center said evidence showed attackers ran scripts against database tables containing medical information, making some record theft highly likely. The center said potentially affected information included hospital treatment records and discharge summaries for patients at its addiction-treatment day unit. Qbusoft fixed the weakness, restricted database permissions, rotated credentials, and added monitoring, while Polish authorities opened an investigation and ordered an audit of the company behind Medyc.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Qbusoft’s Medyc healthcare platform was breached after an attacker exploited an SQL injection weakness in August, with the intrusion detected overnight on September 9.","The attackers obtained names, PESEL national identification numbers, home addresses, phone numbers, and email addresses, while Qbusoft said it had not confirmed theft of medical records.","An affected treatment center said Qbusoft found evidence that attackers ran scripts against database tables containing medical information, making theft of some medical records highly likely.","Qbusoft fixed the SQL injection issue, restricted database permissions, rotated passwords and other credentials, and added monitoring after detecting the incident.","Polish authorities are investigating the breach, and the country’s data protection authority has ordered an audit of the company behind Medyc."],"insights":["Although some names and PESEL numbers were encrypted in the database, Qbusoft advised affected providers to assume the attackers could readily decrypt them.","The affected Inowrocław treatment center was also impacted by the separate MyDr breach, illustrating that the same healthcare organizations can be exposed through multiple software providers.","Poland’s digital affairs minister said Qbusoft did not initially report the incident to CERT Polska or the healthcare-sector incident response team, prompting criticism that delayed reporting can put citizens at risk.","Medyc reported repeated attack attempts after the breach and warned that protective measures could temporarily slow the website or limit access to some services."],"referencedReports":[{"title":"Zawiadomienie o naruszeniu ochrony danych osobowych","url":"https://terapia-inowroclaw.pl/aktualnosci/zawiadomienie-o-naruszeniu-ochrony-danych-osobowych/","publisher":"Addiction and Psychiatric Treatment Center in Inowrocław","context":"The article cites this breach notification for details on the SQL injection incident, potentially affected medical records, and Qbusoft’s remediation steps.","category":"advisory","primary":true}],"body":"\u003cp\u003ePolish healthcare software provider Qbusoft said attackers breached its Medyc platform after exploiting an SQL injection weakness in August. The intrusion was detected overnight on September 9, after an unauthorized person transferred an encrypted database archive outside Qbusoft’s systems. Qbusoft said the attackers obtained names, PESEL national identification numbers, addresses, phone numbers, and email addresses.\u003c/p\u003e\n\n\u003cp\u003eQbusoft has not confirmed that medical records were taken, but an affected treatment center said evidence showed attackers ran scripts against database tables containing medical information, making some record theft highly likely. The center said potentially affected information included hospital treatment records and discharge summaries for patients at its addiction-treatment day unit. Qbusoft fixed the weakness, restricted database permissions, rotated credentials, and added monitoring, while Polish authorities opened an investigation and ordered an audit of the company behind Medyc.\u003c/p\u003e\n"},{"n":16,"title":"Hackers Use NeedyMantis to Maintain Long-Term Access in Breached Networks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/hackers-use-needymanti
