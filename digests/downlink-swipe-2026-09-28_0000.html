s-to-maintain.html","time":"18:35","priority":"SHOULD READ","score":82,"tldr":"Microsoft says the NeedyMantis malware family is being used in targeted post-compromise intrusions to maintain long-term access, commonly via DLL sideloading of legitimate tools. The activity, including possible links to China-nexus actor Storm-3069, has affected a small set of organizations and can be hunted using Microsoft’s published hashes, paths, domain, and user-agent indicators.","briefOverview":"\u003cp\u003eMicrosoft reported that the NeedyMantis malware family has been used to maintain long-term access in a small number of targeted intrusions since at least October 2025. Affected organizations include telecommunications companies, universities, medical nonprofits, intergovernmental organizations, and government contractors. Microsoft tracks one user of the malware as Storm-3069, whose activity it assesses appears to originate in China, while noting that multiple groups may use NeedyMantis and that no specific nation-state actor has been identified.\u003c/p\u003e\n\n\u003cp\u003eNeedyMantis is delivered as a bundle containing a legitimate program, a malicious DLL file named after one the program normally loads, and an encrypted archive. When the legitimate program runs, it loads the malicious DLL, which extracts later components that communicate with a command-and-control server over HTTPS before switching to WebSocket. Microsoft published file hashes, file paths, the C2 domain corp.tripswithengine[.]com, and the hard-coded firefox/21.0 user agent to help organizations identify activity, but cautioned that its hunting queries search only the previous seven days and that a normal Poedit WinSparkle.dll file alone does not prove infection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft identified NeedyMantis as a malware family used to maintain long-term access after targeted network intrusions, with activity observed since at least October 2025.","The malware commonly uses DLL sideloading, pairing a legitimate program such as Poedit, curl, Vim, or TightVNC with a malicious file that the program loads.","Microsoft observed NeedyMantis in intrusions affecting telecommunications organizations, universities, medical nonprofits, intergovernmental organizations, and government contractors.","Microsoft tracks one user of NeedyMantis as Storm-3069, assesses its activity appears to originate in China, and says multiple groups may use the malware.","Microsoft published hashes, malicious file paths, a command-and-control domain, and a user-agent string to help organizations search for NeedyMantis activity."],"insights":["A WinSparkle.dll file in Poedit’s normal installation path is not by itself evidence of infection because Poedit legitimately uses that file; Microsoft’s published hash should be used to distinguish the malicious version.","Microsoft’s published hunting queries look back only seven days, so running them unchanged would not detect activity from the malware samples first seen in October 2025 or May 2026.","Although Microsoft connected Storm-3069 to the DAEMON Tools supply-chain campaign, it has not observed NeedyMantis being delivered through the tampered DAEMON Tools installers.","After initially connecting over HTTPS, NeedyMantis switches to a WebSocket connection that operators can use to load or unload additional modules and send data to them."],"referencedReports":[{"title":"NeedyMantis: Unpacking a Post-Compromise Malware Family Used in Targeted Operations","url":"https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/","publisher":"microsoft","context":"The article is based on Microsoft’s technical analysis of the NeedyMantis malware family and its use in targeted intrusions.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft reported that the NeedyMantis malware family has been used to maintain long-term access in a small number of targeted intrusions since at least October 2025. Affected organizations include telecommunications companies, universities, medical nonprofits, intergovernmental organizations, and government contractors. Microsoft tracks one user of the malware as Storm-3069, whose activity it assesses appears to originate in China, while noting that multiple groups may use NeedyMantis and that no specific nation-state actor has been identified.\u003c/p\u003e\n\n\u003cp\u003eNeedyMantis is delivered as a bundle containing a legitimate program, a malicious DLL file named after one the program normally loads, and an encrypted archive. When the legitimate program runs, it loads the malicious DLL, which extracts later components that communicate with a command-and-control server over HTTPS before switching to WebSocket. Microsoft published file hashes, file paths, the C2 domain corp.tripswithengine[.]com, and the hard-coded firefox/21.0 user agent to help organizations identify activity, but cautioned that its hunting queries search only the previous seven days and that a normal Poedit WinSparkle.dll file alone does not prove infection.\u003c/p\u003e\n"},{"n":18,"title":"Carbonato Botnet Compromises Docker Hosts to Deploy Telegram-Controlled Hermes AI Agent","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/carbonato-botnet-compromises-docker.html","time":"11:46","priority":"SHOULD READ","score":82,"tldr":"The Carbonato botnet targets exposed Docker daemons to worm across networks, establish persistent remote access, and deploy a modified Hermes AI agent controlled through Telegram. The campaign illustrates how attackers are using AI agents to automate credential theft, command execution, and post-compromise operations.","briefOverview":"\u003cp\u003eResearchers at ThreatDown disclosed Carbonato, a botnet that targets Docker services exposed without authentication on port 2375. It spreads by scanning nearby networks every five minutes for additional exposed Docker daemons. On compromised hosts, it launches privileged containers that can run commands on the underlying system.\u003c/p\u003e\n\n\u003cp\u003eCarbonato establishes remote access through a reverse SSH tunnel to a relay in Costa Rica, installs an SSH server using the operators\u0026rsquo; key, and uses cron jobs and watchdog scripts to maintain persistence. It then installs the open-source Hermes Agent framework and replaces its SOUL.md persona file with instructions to receive tasks over Telegram, preserve access, and collect AI API keys and other credentials. The article describes Carbonato as part of a broader rise in the use of AI agents to automate reconnaissance, exploitation, post-compromise activity, and data theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Carbonato targets Docker daemons exposed without authentication on port 2375 and scans nearby networks every five minutes to find additional vulnerable hosts.","After compromising a host, Carbonato uses a privileged container to run commands on the underlying system, creates persistence with cron jobs and watchdog scripts, and establishes a reverse SSH tunnel to a relay in Costa Rica.","The botnet installs Hermes Agent and replaces its SOUL.md persona file with instructions to accept Telegram tasks, maintain persistence, and prioritize collecting AI API keys and other credentials.","Hermes Agent forwards Telegram-supplied tasks to a large language model gateway, which generates terminal commands that are executed on compromised hosts and returns results to the operators.","Researchers said the activity has not been attributed to a known group, although language, timezone, and infrastructure clues suggest the operators are based in Costa Rica."],"insights":["Carbonato does not need to modify the Hermes Agent software itself; replacing its 39-line SOUL.md persona prompt is sufficient to turn the framework into a Telegram-controlled tool for executing operator tasks and collecting credentials.","The botnet combines multiple persistence measures—cron jobs, watchdog scripts, an installed SSH server, and a reverse SSH tunnel—so removing a single malicious artifact may not stop it from returning.","Researchers discovered the operation through a publicly accessible, unauthenticated Docker registry that had been exposed since May 2026, and the stored material also referenced a separate campaign involving trojanized cryptocurrency wallet applications.","The article places Carbonato within a wider pattern of operations using AI agents to automate reconnaissance, exploitation, post-compromise activity, and data theft with limited direct human involvement."],"referencedReports":[{"title":"Carbonato","url":"https://www.threatdown.com/blog/carbonato/","publisher":"threatdown","context":"ThreatDown disclosed Carbonato's targeting of unauthenticated Docker daemons and its deployment of a Telegram-controlled Hermes Agent implant.","category":"research","primary":true},{"title":"Autonomous AI Cyber Attack Campaign","url":"https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/","publisher":"palo-alto-networks-unit-42","context":"The article cites Unit 42's analysis linking the China-based knaithe and KnYuan operators to an AI-enabled campaign using Hermes Agent and DeepSeek.","category":"research","primary":false},{"title":"Thailand Ministry of Finance Targeted With Hermes AI Agent","url":"https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent","publisher":"hunt-io","context":"The article references Hunt.io's analysis of an operation that used Hermes Agent in unattended mode against Thailand's Ministry of Finance.","category":"research","primary":false},{"title":"Autonomous AI Agents Against Online Retailers","url":"https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company","publisher":"gambit-security","context":"The article cites Gambit Security's findings on a Chinese-speaking operator using multiple AI harnesses to compromise online retailers and steal payment-card data.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers at ThreatDown disclosed Carbonato, a botnet that targets Docker services exposed without authentication on port 2375. It spreads by scanning nearby networks every five minutes for additional exposed Docker daemons. On compromised hosts, it launches privileged containers that can run commands on the underlying system.\u003c/p\u003e\n\n\u003cp\u003eCarbonato establishes remote access through a reverse SSH tunnel to a relay in Costa Rica, installs an SSH server using the operators\u0026rsquo; key, and uses cron jobs and watchdog scripts to maintain persistence. It then installs the open-source Hermes Agent framework and replaces its SOUL.md persona file with instructions to receive tasks over Telegram, preserve access, and collect AI API keys and other credentials. The article describes Carbonato as part of a broader rise in the use of AI agents to automate reconnaissance, exploitation, post-compromise activity, and data theft.\u003c/p\u003e\n"},{"n":3,"title":"US soldier gets 70 months in prison for extorting 10 tech, telecom firms","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-soldier-gets-70-months-in-prison-for-extorting-10-tech-telecom-firms/","time":"07:30","priority":"SHOULD READ","score":78,"tldr":"Former U.S. Army soldier Cameron Wagenius was sentenced to 70 months in prison and ordered to pay nearly $295,000 for hacking and extorting at least 10 U.S. technology and telecom companies. He and accomplices stole credentials and sensitive data, threatened leaks, and attempted to extort at least $1 million.","briefOverview":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, known online as “kiberphant0m” and “cyb3rph4nt0m,” was sentenced to 70 months in prison for hacking and extorting at least 10 U.S. technology and telecommunications companies between April 2023 and December 2024. He was also ordered to pay $294,978 in restitution. Wagenius had pleaded guilty to charges involving unlawful transfer of confidential phone records, aggravated identity theft, wire-fraud conspiracy, and computer-fraud extortion.\u003c/p\u003e\n\n\u003cp\u003eWhile on active duty, Wagenius and accomplices used the SSH Brute tool, which he helped develop, to steal network login credentials and used Telegram to share credentials and plan activity. The group threatened to publish stolen information on BreachForums and XSS.is, sold some stolen data, and used data in further fraud including SIM-swapping. They attempted to extort at least $1 million from data owners, while two alleged accomplices were also tied to thefts from more than 165 organizations using Snowflake services. Following the Snowflake-linked incidents, Snowflake announced that it would enforce multi-factor authentication and require passwords of at least 14 characters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former U.S. Army soldier Cameron John Wagenius was sentenced to 70 months in prison and ordered to pay $294,978 in restitution for hacking and extorting U.S. technology and telecommunications companies.","While on active duty, Wagenius and his accomplices used a credential-guessing tool called SSH Brute and shared stolen login details through Telegram to access victim networks.","The group threatened to publish stolen data on BreachForums and XSS.is, sold some of the data, and attempted to extort at least $1 million from victim data owners.","Two alleged accomplices, Connor Riley Moucka and John Erin Binns, were accused of stealing terabytes of data from more than 165 organizations using Snowflake cloud storage services.","Following breaches linked to the Snowflake incidents, Snowflake announced it would enforce multi-factor authentication and require customer passwords to be at least 14 characters long."],"insights":["The case shows that stolen customer data was used for more than ransom demands: the conspirators also sold some of it and used it to support SIM-swapping fraud.","The alleged activity occurred while Wagenius was on active duty in the U.S. Army, and the group coordinated credential sharing and attack planning through Telegram.","The Snowflake-related incidents prompted Snowflake to require multi-factor authentication and passwords of at least 14 characters, illustrating a direct security-policy response to large-scale account compromises."],"referencedReports":[],"body":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, known online as “kiberphant0m” and “cyb3rph4nt0m,” was sentenced to 70 months in prison for hacking and extorting at least 10 U.S. technology and telecommunications companies between April 2023 and December 2024. He was also ordered to pay $294,978 in restitution. Wagenius had pleaded guilty to charges involving unlawful transfer of confidential phone records, aggravated identity theft, wire-fraud conspiracy, and computer-fraud extortion.\u003c/p\u003e\n\n\u003cp\u003eWhile on active duty, Wagenius and accomplices used the SSH Brute tool, which he helped develop, to steal network login credentials and used Telegram to share credentials and plan activity. The group threatened to publish stolen information on BreachForums and XSS.is, sold some stolen data, and used data in further fraud including SIM-swapping. They attempted to extort at least $1 million from data owners, while two alleged accomplices were also tied to thefts from more than 165 organizations using Snowflake services. Following the Snowflake-linked incidents, Snowflake announced that it would enforce multi-factor authentication and require passwords of at least 14 characters.\u003c/p\u003e\n"},{"n":8,"title":"Japan's Keio confirms ransomware attack disrupted business systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japans-keio-confirms-ransomware-attack-disrupted-business-systems/","time":"20:56","priority":"SHOULD READ","score":78,"tldr":"Japanese railway operator Keio confirmed a ransomware attack that disrupted hospitality business systems and may have affected customer or partner data, while train operations remain unaffected. Separately, Tokyo Metro disclosed unauthorized access exposing 59,000 member email addresses.","briefOverview":"\u003cp\u003eKeio Corporation, a major Japanese private railway operator, confirmed that its group servers were hit by ransomware in the early hours of September 26, 2026. The company shut down its network to prevent further damage, reported the incident to police, and is investigating the attack route and impact with external experts. Keio is also assessing whether customer or business partner information was accessed.\u003c/p\u003e\n\n\u003cp\u003eThe disruption appears to affect Keio’s hospitality business rather than train operations, and Keio Plaza Hotel Tokyo warned that some customer-facing services may be delayed. Local media reported that payment systems were disrupted, while no ransomware group had publicly claimed responsibility when the article was published. Separately, Tokyo Metro disclosed unauthorized access to systems containing 59,000 member email addresses, though it said it had identified and closed the security weakness used.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Keio Corporation confirmed that a ransomware attack on its group servers was detected in the early hours of September 26, 2026.","Keio shut down its network, reported the incident to police, and is investigating the attack route, damage, and possible access to customer or business partner information with external experts.","The disruption appears limited to Keio's hospitality business rather than train operations, and Keio Plaza Hotel Tokyo warned that some customer-facing services could be delayed.","Local media reported that the incident disrupted Keio's payment systems, and no ransomware group had publicly claimed responsibility at the time of reporting.","Tokyo Metro separately disclosed unauthorized system access that exposed 59,000 member email addresses and said it had identified and closed the weakness used by the intruders."],"insights":["Keio’s incident appears to have disrupted its hospitality operations and payment systems without affecting train services, illustrating that impacts within a diversified company can be limited to particular business areas.","Two major Japanese transit operators disclosed separate cyber incidents over the same weekend, but the article states there is no confirmation that the incidents were coordinated or involved the same actor.","Tokyo Metro said the affected system contained only member email addresses and that the security weakness used to enter the system had already been closed."],"referencedReports":[],"body":"\u003cp\u003eKeio Corporation, a major Japanese private railway operator, confirmed that its group servers were hit by ransomware in the early hours of September 26, 2026. The company shut down its network to prevent further damage, reported the incident to police, and is investigating the attack route and impact with external experts. Keio is also assessing whether customer or business partner information was accessed.\u003c/p\u003e\n\n\u003cp\u003eThe disruption appears to affect Keio’s hospitality business rather than train operations, and Keio Plaza Hotel Tokyo warned that some customer-facing services may be delayed. Local media reported that payment systems were disrupted, while no ransomware group had publicly claimed responsibility when the article was published. Separately, Tokyo Metro disclosed unauthorized access to systems containing 59,000 member email addresses, though it said it had identified and closed the security weakness used.\u003c/p\u003e\n"},{"n":13,"title":"New Mexico jury finds Meta deceived consumers about data privacy practices","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/facebook-new-mexico-privacy","time":"17:15","priority":"SHOULD READ","score":78,"tldr":"A New Mexico jury found Facebook willfully deceived consumers about data privacy, content moderation, and its post-Cambridge Analytica app investigation, finding nearly 44 million violations of state consumer-protection law. A judge will set penalties that could reach billions of dollars and may order major privacy-practice reforms.","briefOverview":"\u003cp\u003eA New Mexico jury found that Facebook violated the state’s Unfair Practices Act nearly 44 million times by deceiving consumers about its data privacy practices. The jury concluded that Facebook misled users about their control over information sharing and its claims that it did not buy or sell private data, particularly to advertisers. It also found Facebook’s statements about hate speech and misinformation were willfully deceptive.\u003c/p\u003e\n\n\u003cp\u003eThe jury found that Facebook falsely claimed it deleted harmful misinformation, did not profit from misinformation or hate, did not tolerate hate speech, and had no incentive to retain hateful content. It also found the company misrepresented its adherence to community standards and its lack of exceptions for politicians or newsworthy content, as well as its investigation of third-party apps after the Cambridge Analytica scandal. A judge will determine the civil penalties in coming weeks; each violation can carry up to $5,000 under New Mexico law, and the state is also seeking court-ordered changes to Facebook’s future privacy practices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A New Mexico jury found that Facebook violated the state’s Unfair Practices Act nearly 44 million times by deceiving consumers about its data privacy practices.","The jury found Facebook misled consumers about their control over information sharing, whether it bought or sold private data, and its handling of hate speech and misinformation.","Jurors found Facebook did not fulfill stated commitments to investigate third-party apps, conduct forensic audits, stop working with developers that misused data, and notify affected people after the Cambridge Analytica scandal.","A judge will determine civil penalties in coming weeks, with each violation carrying up to $5,000 in penalties under New Mexico law.","New Mexico is seeking both financial penalties and court-ordered changes to Facebook’s future data privacy practices."],"insights":["The potential financial exposure is unusually large because the jury found nearly 44 million violations and New Mexico law permits up to $5,000 in civil penalties for each violation.","The verdict covered not only data-sharing claims but also Facebook’s statements about misinformation, hate speech, exceptions for politicians or newsworthy content, and its incentives regarding harmful content.","The state is seeking operational changes to Facebook’s future privacy practices in addition to fines, meaning the case could result in court-ordered reforms rather than a financial penalty alone.","The verdict follows other recent New Mexico and California actions involving Meta’s consumer-protection and children’s online-safety practices, adding to prior penalties and settlements."],"referencedReports":[],"body":"\u003cp\u003eA New Mexico jury found that Facebook violated the state’s Unfair Practices Act nearly 44 million times by deceiving consumers about its data privacy practices. The jury concluded that Facebook misled users about their control over information sharing and its claims that it did not buy or sell private data, particularly to advertisers. It also found Facebook’s statements about hate speech and misinformation were willfully deceptive.\u003c/p\u003e\n\n\u003cp\u003eThe jury found that Facebook falsely claimed it deleted harmful misinformation, did not profit from misinformation or hate, did not tolerate hate speech, and had no incentive to retain hateful content. It also found the company misrepresented its adherence to community standards and its lack of exceptions for politicians or newsworthy content, as well as its investigation of third-party apps after the Cambridge Analytica scandal. A judge will determine the civil penalties in coming weeks; each violation can carry up to $5,000 under New Mexico law, and the state is also seeking court-ordered changes to Facebook’s future privacy practices.\u003c/p\u003e\n"},{"n":14,"title":"Former US soldier gets nearly six-year sentence for hacking, extorting telecoms","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/hacker-telecom-army-sentenced","time":"12:45","priority":"SHOULD READ","score":78,"tldr":"Former U.S. Army soldier Cameron John Wagenius was sentenced to 70 months in prison and ordered to pay nearly $295,000 for hacking telecoms, stealing sensitive call records, and extorting victims. Prosecutors said he used the stolen data for fraud and attempted to sell it to a foreign military intelligence service.","briefOverview":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, 22, was sentenced to 70 months in federal prison and ordered to pay nearly $295,000 in restitution. He pleaded guilty to charges including hacking telecommunications companies, extortion, wire fraud, and aggravated identity theft. Prosecutors said he conducted the activity while on active duty, between April 2023 and December 2024.\u003c/p\u003e\n\n\u003cp\u003eUsing the name \u0026ldquo;kiberphant0m,\u0026rdquo; Wagenius worked with others to breach at least 10 organizations using a tool he created called \u0026ldquo;SSH Brute.\u0026rdquo; The group stole hundreds of thousands of sensitive business and customer records, including call and text-history metadata and other personally identifiable information, then sought at least $1 million in ransoms and marketed data on cybercrime forums. The Justice Department said Wagenius also sold some data, used stolen information for SIM-swapping fraud, and attempted to sell information to an address he believed belonged to a foreign military intelligence service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former U.S. Army soldier Cameron John Wagenius, 22, received a 70-month federal prison sentence and was ordered to pay nearly $295,000 in restitution.","Wagenius pleaded guilty to hacking telecommunications companies, stealing sensitive call and text-history records, extorting victims, wire fraud, and aggravated identity theft.","Using the online name \"kiberphant0m,\" Wagenius and others breached at least 10 organizations between April 2023 and December 2024, including by using a tool he created called \"SSH Brute.\"","Prosecutors said Wagenius and his associates sought at least $1 million in ransoms, sold some stolen data, and used stolen information for fraud including SIM-swapping.","The Justice Department said Wagenius attempted to sell stolen information to an email address he believed belonged to an unidentified country's military intelligence service."],"insights":["The stolen telecom data was not limited to a single victim or use: prosecutors said it included hundreds of thousands of business and customer records and was used for extortion, sale on cybercrime forums, and SIM-swapping fraud.","Wagenius publicly threatened to release confidential call records connected to a government official and relatives of another former official unless he was paid, illustrating that call-history data can be used to pressure high-profile individuals even without message content.","The case was linked to the 2024 Snowflake-related campaign that affected more than 100 customers, and the AT\u0026T data reportedly included nearly all customer call and text logs for a six-month period in 2022.","Wagenius allegedly tried to market stolen information to what he believed was a foreign military intelligence service while serving on active duty in the U.S. Army."],"referencedReports":[],"body":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, 22, was sentenced to 70 months in federal prison and ordered to pay nearly $295,000 in restitution. He pleaded guilty to charges including hacking telecommunications companies, extortion, wire fraud, and aggravated identity theft. Prosecutors said he conducted the activity while on active duty, between April 2023 and December 2024.\u003c/p\u003e\n\n\u003cp\u003eUsing the name \u0026ldquo;kiberphant0m,\u0026rdquo; Wagenius worked with others to breach at least 10 organizations using a tool he created called \u0026ldquo;SSH Brute.\u0026rdquo; The group stole hundreds of thousands of sensitive business and customer records, including call and text-history metadata and other personally identifiable information, then sought at least $1 million in ransoms and marketed data on cybercrime forums. The Justice Department said Wagenius also sold some data, used stolen information for SIM-swapping fraud, and attempted to sell information to an address he believed belonged to a foreign military intelligence service.\u003c/p\u003e\n"},{"n":22,"title":"RatHat Android Malware Console Uses Gemini to Identify Higher-Value Victims","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/rathat-android-malware-console-uses.html","time":"17:38","priority":"SHOULD READ","score":78,"tldr":"RatHat’s Android banking-malware operators use a Gemini-enabled control panel to rank victims by estimated bank balance and prioritize profitable targets. The malware also abuses Accessibility and wireless ADB to gain shell-level control and remotely monitor or manipulate infected phones.","briefOverview":"\u003cp\u003eCleafy reported that RatHat operators use a web console to build Android banking malware and manage infected phones, tracing nearly 100 console deployments since April 2026. The latest console uses Google’s Gemini model to estimate victims’ bank balances from stolen text messages and categorize devices as high- or mid-value targets. Cleafy said the model is used to help operators decide which victims deserve attention, not to transfer money.\u003c/p\u003e\n\n\u003cp\u003eRatHat is distributed through text messages and online ads leading to third-party download sites, then requests Accessibility access to control the phone. It can enable wireless debugging and connect through Android Debug Bridge, giving operators a shell outside the app’s usual permissions; a separately deployed Go program can stream screens and send taps without a recording icon on supported Android versions. The program may remain active after the app is removed until the phone restarts, and Zimperium found it can reinstall the app and re-enable Accessibility access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cleafy traced nearly 100 deployments of RatHat’s web-based control console since April 2026, which it said is consistent with a malware-as-a-service model in which customers operate separate copies.","The latest RatHat console uses Google’s Gemini model to estimate victims’ bank balances from stolen text messages and sort infected phones into high-value and mid-value groups.","RatHat can use Android Accessibility access to enable wireless debugging, pair with Android Debug Bridge, and obtain a shell running as Android’s shell user outside the app’s permissions.","After an operator deploys a separate Go program, RatHat can use minicap and minitouch to stream a victim’s screen and send taps without a permission prompt or recording icon on supported Android versions.","The Go program can remain active after the victim removes the RatHat app until the phone restarts, and Zimperium found it can reinstall the app and re-enable Accessibility access."],"insights":["RatHat uses Gemini in two distinct ways: the control console prioritizes victims based on estimated balances, while the app on the phone can ask Gemini where to tap when its prewritten instructions fail.","The console’s scheduled rebuild feature produces new versions of the same malware every hour, an approach Cleafy said is intended to evade tools that identify known files by their digital fingerprint.","Although the malware’s Android app has changed little since late 2025, its operator console was replaced several times in 2026, with BlackCat Remote Control Management and Panda Workshop V5 and V6 sharing the same underlying code.","The more covert screen-viewing tools do not work on Android 14 and later, where RatHat must rely on its app-based screen capture that requests permission and displays a recording indicator.","After the separate Go component is deployed, its minicap and minitouch files can be found under /data/local/tmp, and Cleafy recommended monitoring processes that run as Android’s shell user, UID 2000."],"referencedReports":[{"title":"From BlackCat to Panda Workshop: Inside the Evolving C2 Panel Behind RatHat","url":"https://www.cleafy.com/cleafy-labs/from-blackcat-to-panda-workshop-inside-the-evolving-c2-panel-behind-rathat","publisher":"cleafy","context":"The article relies on Cleafy’s analysis for details of RatHat console deployments, Gemini-based victim scoring, malware-building features, and remote-control capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eCleafy reported that RatHat operators use a web console to build Android banking malware and manage infected phones, tracing nearly 100 console deployments since April 2026. The latest console uses Google’s Gemini model to estimate victims’ bank balances from stolen text messages and categorize devices as high- or mid-value targets. Cleafy said the model is used to help operators decide which victims deserve attention, not to transfer money.\u003c/p\u003e\n\n\u003cp\u003eRatHat is distributed through text messages and online ads leading to third-party download sites, then requests Accessibility access to control the phone. It can enable wireless debugging and connect through Android Debug Bridge, giving operators a shell outside the app’s usual permissions; a separately deployed Go program can stream screens and send taps without a recording icon on supported Android versions. The program may remain active after the app is removed until the phone restarts, and Zimperium found it can reinstall the app and re-enable Accessibility access.\u003c/p\u003e\n"},{"n":34,"title":"No Passwords, No Customer Data, Still a Problem","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/why-a-hackers-stolen-directory-data-claims-matter-more-than-you-think","time":"17:32","priority":"SHOULD READ","score":78,"tldr":"Threat actor TheHatman advertised millions of apparently genuine corporate directory records allegedly taken from Azure and Entra environments, though evidence does not confirm recent breaches of the named organizations. Even without passwords or customer data, directory information enables highly convincing phishing and impersonation, underscoring the need to restrict and monitor identity and application access to Microsoft Graph and directory data.","briefOverview":"\u003cp\u003eIn August 2026, a threat actor known as TheHatman advertised approximately 3.6 million employee records allegedly obtained from the Microsoft Azure and Entra environments of nine organizations. Cyera Research found that sampled records appeared to contain genuine corporate directory information, including names, work email addresses, phone numbers, job titles, office locations, group memberships, service accounts, and privileged accounts. However, the available evidence does not establish when or where the data was obtained, whether TheHatman personally accessed the named organizations, or whether nine separate cloud environments were compromised.\u003c/p\u003e\n\n\u003cp\u003eSeveral named organizations disputed evidence of a recent breach, and the article notes that authentic older data can be repackaged and resold. Even without passwords or customer information, directory data can provide criminals with an organizational map that supports targeted phishing, executive impersonation, and requests to reset multi-factor authentication. The article advises organizations to review who and what can read directory information, examine application permissions to Microsoft Graph, reduce standing privileges, and monitor for unusual bulk directory searches or exports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Between July 31 and August 16, TheHatman posted underground listings claiming to offer about 3.64 million employee records from nine organizations, allegedly obtained from Microsoft Azure and Entra environments.","Cyera Research found that sample records appeared to contain genuine corporate directory data, including names, work email addresses, telephone numbers, job titles, locations, group memberships, service accounts, and privileged accounts.","The available evidence does not establish when or where the records were obtained, whether TheHatman personally compromised the named organizations, or whether nine separate cloud environments were breached.","TCS, Gap, and Vodafone disputed indications of recent compromises, with TCS saying the material appeared to be more than four years old and Vodafone saying customer data was not affected.","Directory information can help criminals tailor phishing, executive impersonation, and identity-recovery scams, so organizations should review directory-read access and investigate unusual bulk directory-enumeration activity."],"insights":["Authentic directory records do not prove a recent breach because old data can be repackaged and resold while remaining accurate.","A single privileged application, integration, or service account with directory-reading permissions could provide broad visibility across an environment without requiring separate compromises of every organization named by the seller.","Information often treated as non-sensitive, such as reporting lines, job titles, and administrator identities, can become a detailed organizational map for targeted impersonation and phishing.","Help-desk and account-recovery processes should not regard knowledge of an employee’s manager, department, title, phone number, or administrator as reliable proof of identity because such details may already be publicly available or circulating on criminal forums.","AI agents can create a broader and less predictable exposure than narrowly scoped service accounts because they may retain persistent access to multiple applications, APIs, databases, and cloud resources."],"referencedReports":[],"body":"\u003cp\u003eIn August 2026, a threat actor known as TheHatman advertised approximately 3.6 million employee records allegedly obtained from the Microsoft Azure and Entra environments of nine organizations. Cyera Research found that sampled records appeared to contain genuine corporate directory information, including names, work email addresses, phone numbers, job titles, office locations, group memberships, service accounts, and privileged accounts. However, the available evidence does not establish when or where the data was obtained, whether TheHatman personally accessed the named organizations, or whether nine separate cloud environments were compromised.\u003c/p\u003e\n\n\u003cp\u003eSeveral named organizations disputed evidence of a recent breach, and the article notes that authentic older data can be repackaged and resold. Even without passwords or customer information, directory data can provide criminals with an organizational map that supports targeted phishing, executive impersonation, and requests to reset multi-factor authentication. The article advises organizations to review who and what can read directory information, examine application permissions to Microsoft Graph, reduce standing privileges, and monitor for unusual bulk directory searches or exports.\u003c/p\u003e\n"},{"n":4,"title":"Dutch police confirm arrest in ShinyHunters hacking investigation","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/dutch-police-confirm-arrest-in-shinyhunters-hacking-investigation/","time":"19:49","priority":"MAY READ","score":72,"tldr":"Dutch police arrested a 24-year-old Amsterdam man as part of an investigation into ShinyHunters, with reports identifying him as convicted hacker Pepijn van der Stap, known as “Umbreon.” Authorities have not publicly established his connection to the group, and ShinyHunters denies any association.","briefOverview":"\u003cp\u003eDutch police confirmed that a 24-year-old Amsterdam man was arrested this month as part of an investigation into the ShinyHunters hacking group. The suspect is due to appear before the Rotterdam District Court on September 29, when police said further information would be released. KrebsOnSecurity and DataBreaches identified him as Pepijn van der Stap, a Dutch hacker previously known online as \u0026ldquo;Umbreon.\u0026rdquo; ShinyHunters told BleepingComputer that he has no association with the group.\u003c/p\u003e\n\n\u003cp\u003eVan der Stap was previously arrested in January 2023 and later pleaded guilty to hacking and blackmailing more than a dozen companies in the Netherlands and worldwide. He was sentenced to four years in prison, with one year suspended, followed by a three-year probation period with conditions. DataBreaches reported that Dutch tactical police searched the Amsterdam home he shared with his mother on September 15 and seized electronic devices. Reports cited the Umbreon identity and Pokémon imagery as a possible link to ShinyHunters, though the same character also appeared in a 2020 HackForums defacement before Van der Stap created his Umbreon account.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dutch police confirmed that they arrested a 24-year-old Amsterdam man this month as part of an investigation into the ShinyHunters hacking group.","KrebsOnSecurity and DataBreaches identified the suspect as Pepijn van der Stap, a Dutch hacker previously known online as “Umbreon.”","Van der Stap was previously arrested in January 2023, later pleaded guilty to hacking and blackmailing more than a dozen companies, and received a four-year prison sentence with one year suspended.","Authorities searched the Amsterdam home Van der Stap shared with his mother on September 15 and seized electronic devices, according to DataBreaches.","ShinyHunters denied that Van der Stap was associated with the group when asked by BleepingComputer."],"insights":["The reported link between the suspect and ShinyHunters is not established publicly: it relies in part on the shared “Umbreon” imagery, but that character also appeared in a 2020 HackForums defacement before the suspect’s Umbreon account was created.","In the separate Odido case, police said the suspected caller gained access by impersonating an IT employee and persuading a help-desk worker to enter credentials and a verification code on a fake login page.","DataBreaches reported that both Van der Stap and a close friend believed the voice released by Dutch police in the Odido investigation did not sound like him.","The suspect’s new arrest occurred while he was subject to a three-year probationary period following an earlier conviction, according to the article."],"referencedReports":[],"body":"\u003cp\u003eDutch police confirmed that a 24-year-old Amsterdam man was arrested this month as part of an investigation into the ShinyHunters hacking group. The suspect is due to appear before the Rotterdam District Court on September 29, when police said further information would be released. KrebsOnSecurity and DataBreaches identified him as Pepijn van der Stap, a Dutch hacker previously known online as \u0026ldquo;Umbreon.\u0026rdquo; ShinyHunters told BleepingComputer that he has no association with the group.\u003c/p\u003e\n\n\u003cp\u003eVan der Stap was previously arrested in January 2023 and later pleaded guilty to hacking and blackmailing more than a dozen companies in the Netherlands and worldwide. He was sentenced to four years in prison, with one year suspended, followed by a three-year probation period with conditions. DataBreaches reported that Dutch tactical police searched the Amsterdam home he shared with his mother on September 15 and seized electronic devices. Reports cited the Umbreon identity and Pokémon imagery as a possible link to ShinyHunters, though the same character also appeared in a 2020 HackForums defacement before Van der Stap created his Umbreon account.\u003c/p\u003e\n"},{"n":26,"title":"A Salary Notice Whose Effective Date Was Its Build Clock","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/salary-notice-effective-date-was-its-build-clock","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing campaign used personalized but error-filled payroll PDFs whose “effective date” was the document generator’s timestamp, revealing automated mass production. Although the attachments contained no malicious links or code, they directed recipients to scan an unrecovered verification code, illustrating why human reporting caught what automated attachment scanning could not.","briefOverview":"\u003cp\u003eFour mailboxes at a UAE-based food import and distribution group received fake internal payroll notices with personalized PDF attachments, and all messages were quarantined. The PDFs claimed a compensation adjustment was effective at \u003ccode\u003e2026-05-07 11:50:13\u003c/code\u003e, while the stored file was created one second later and the email was timestamped one second after that. This timing sequence indicated that the stated effective date was likely drawn from the document generator’s clock rather than a genuine business decision.\u003c/p\u003e\n\n\u003cp\u003eThe document exposed other template failures: it used the recipient’s email address for both employee identification and document reference, greeted a shared mailbox as if it were a person, and contained an unmatched quotation mark consistent with an unresolved merge field. It instructed recipients to scan a verification code to review and electronically sign documentation, but the PDF contained no links, scripts, automatic actions, or recovered code destination. The attachment was technically clean and fully readable, so automated scanning found no executable payload; a human report produced the malicious verdict, illustrating how social-engineering lures can evade controls focused on files and links.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake payroll PDF stated that a compensation adjustment was effective at 2026-05-07 11:50:13, while its creation time was one second later and the email reached the first recorded transit hop one second after that.","Four mailboxes at a UAE-based food import and distribution group received the messages within about four minutes, and all messages were quarantined.","The PDF used the recipient’s email address as both the employee identification and document reference, addressed a shared mailbox as a person, and contained an unmatched quotation mark where a merge field appeared not to have resolved.","The attachment contained no URI links, JavaScript, automatic actions, or recovered verification code destination, but instructed the recipient to scan a verification code to review and electronically sign documentation.","The file was technically clean and readable, and the malicious verdict resulted from a human report rather than automated scanning or the platform’s AI analyst."],"insights":["A salary effective date rendered to the second, followed by PDF creation and email transit within two seconds, provided a strong clue that the stated business date was copied from an automated document generator’s clock rather than a genuine compensation decision.","Personalizing a document only with the recipient’s email address can create the appearance of internal targeting while exposing template failures in fields that should contain employee identity, document references, and greetings.","A PDF can be clean from a file-scanning perspective yet still serve as a phishing lure when it directs the recipient to continue the interaction by scanning a code with another device.","Passing sender-authentication checks at the final delivery hop did not establish that the message’s full history was trustworthy, because the earlier recorded origin results showed SPF, DKIM, and DMARC failures and the ARC chain was broken.","The incident demonstrates that human reporting can be decisive for detecting social-engineering messages when automated attachment analysis finds no executable content, links, or scripts."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s email gateway attack-mix figures and statistics on phishing as an initial access vector and the human element in breaches.","category":"research","primary":false},{"title":"CISA Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references this guidance for stopping phishing during the first phase of an attack cycle.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites the report as a survey of the broader threat landscape at scale.","category":"research","primary":false}],"body":"\u003cp\u003eFour mailboxes at a UAE-based food import and distribution group received fake internal payroll notices with personalized PDF attachments, and all messages were quarantined. The PDFs claimed a compensation adjustment was effective at \u003ccode\u003e2026-05-07 11:50:13\u003c/code\u003e, while the stored file was created one second later and the email was timestamped one second after that. This timing sequence indicated that the stated effective date was likely drawn from the document generator’s clock rather than a genuine business decision.\u003c/p\u003e\n\n\u003cp\u003eThe document exposed other template failures: it used the recipient’s email address for both employee identification and document reference, greeted a shared mailbox as if it were a person, and contained an unmatched quotation mark consistent with an unresolved merge field. It instructed recipients to scan a verification code to review and electronically sign documentation, but the PDF contained no links, scripts, automatic actions, or recovered code destination. The attachment was technically clean and fully readable, so automated scanning found no executable payload; a human report produced the malicious verdict, illustrating how social-engineering lures can evade controls focused on files and links.\u003c/p\u003e\n"},{"n":27,"title":"Aikido funds Node.js security","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-openjs-ssp-node-security","time":"15:41","priority":"MAY READ","score":68,"tldr":"Aikido has become an inaugural partner of the OpenJS Security Stewardship Program, funding Node.js vulnerability bounties and maintainer remediation support. The initiative aims to address under-resourced open-source security work and the growing burden of low-quality AI-generated vulnerability reports.","briefOverview":"\u003cp\u003eAikido has joined the OpenJS Foundation’s Security Stewardship Program as an inaugural partner, starting with Node.js. Its contribution goes into a pool split evenly between rewards for researchers who identify security issues and support for maintainers who validate, fix, and release repairs. The program also handles issue triage and CVE coordination, helping maintainers manage official issue identifiers and disclosure timelines.\u003c/p\u003e\n\n\u003cp\u003eThe announcement comes after Node.js ended its security bug bounty program when Internet Bug Bounty funding ended. Aikido says AI has made it easier to submit vulnerability reports, including low-quality reports that add pressure to the small, often volunteer maintainer community. The company argues that supporting both discovery and remediation helps make the JavaScript ecosystem harder to compromise, where widely used npm packages can be affected by compromised maintainer accounts or malicious package versions. Aikido also cites its prior work with Drydock and its Aikido Intel feed, which is used for malware blocking in Composer for Packagist.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido joined the OpenJS Foundation’s Security Stewardship Program as an inaugural partner, beginning with support for Node.js.","Program funding is split evenly between rewards for researchers who identify security issues and support for maintainers who validate, fix, and release those fixes.","The Security Stewardship Program provides vulnerability triage and CVE coordination, reducing the administrative burden on maintainers.","Node.js discontinued its security bug bounty program after Internet Bug Bounty funding ended, while AI-generated low-quality reports have increased pressure on maintainers.","Aikido said its support is intended to help researchers and maintainers keep Node.js secure and strengthen the wider open-source software ecosystem."],"insights":["The program treats finding a security flaw and getting it fixed as equally funded needs, allocating its pool evenly between researcher rewards and maintainer support.","OpenJS’s role as a CVE Numbering Authority means participating maintainers can receive help with both assigning an official identifier to a flaw and organizing its disclosure timeline.","The article links AI-generated reports to a practical resource problem: more convincing but low-quality submissions consume the same limited maintainer capacity needed to assess and repair legitimate issues.","Aikido’s prior support spans different stages of software safety, including checking staged package releases before publication and supplying malware intelligence used by Composer for Packagist."],"referencedReports":[],"body":"\u003cp\u003eAikido has joined the OpenJS Foundation’s Security Stewardship Program as an inaugural partner, starting with Node.js. Its contribution goes into a pool split evenly between rewards for researchers who identify security issues and support for maintainers who validate, fix, and release repairs. The program also handles issue triage and CVE coordination, helping maintainers manage official issue identifiers and disclosure timelines.\u003c/p\u003e\n\n\u003cp\u003eThe announcement comes after Node.js ended its security bug bounty program when Internet Bug Bounty funding ended. Aikido says AI has made it easier to submit vulnerability reports, including low-quality reports that add pressure to the small, often volunteer maintainer community. The company argues that supporting both discovery and remediation helps make the JavaScript ecosystem harder to compromise, where widely used npm packages can be affected by compromised maintainer accounts or malicious package versions. Aikido also cites its prior work with Drydock and its Aikido Intel feed, which is used for malware blocking in Composer for Packagist.\u003c/p\u003e\n"},{"n":7,"title":"80,000+ Organizations Had AI Logins Stolen: From Shadow AI to LLMjacking","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/80-000-plus-organizations-had-ai-logins-stolen-from-shadow-ai-to-llmjacking/","time":"14:00","priority":"MAY READ","score":58,"tldr":"SOCRadar reports that infostealer logs contain AI-service credentials and sessions tied to more than 80,000 corporate domains, with ChatGPT/OpenAI accounts dominating its sampled enterprise dataset. Stolen AI sessions can expose sensitive prompt histories, bypass MFA through session-cookie replay, enable abuse of connected automation tools, and facilitate API-key theft and LLMjacking.","briefOverview":"\u003cp\u003eSOCRadar’s AI Identity Exposure Report examined more than one million infostealer records associated with AI services across more than 80,000 corporate domains. It narrowed its analysis to 482 established enterprises, finding 5,434 records linked to 1,500 corporate email addresses; 295 of those companies appeared in records from the previous 90 days. ChatGPT or OpenAI sessions were found at 358 of the 482 companies and represented about 90% of the records, while Zapier, Notion, Hugging Face, Replit, Lovable, and ElevenLabs appeared less often.\u003c/p\u003e\n\n\u003cp\u003eThe article says a stolen AI login can expose stored chat histories containing source code, customer information, contracts, and unreleased plans. Stolen active-session cookies can be replayed without a password prompt, while connected automation accounts can carry existing permissions into CRM, email, and storage systems; stolen API keys can also be used or resold for paid AI capacity. It recommends putting AI platforms behind single sign-on with short-lived sessions, rotating and monitoring API keys, detecting reused sessions, and identifying unmanaged AI accounts tied to corporate domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOCRadar analyzed more than one million infostealer records tied to AI services across more than 80,000 corporate domains and closely examined 482 major enterprises.","The 482 enterprises had 5,434 stealer-log records tied to 1,500 distinct corporate email addresses, and 295 of the companies appeared in records from the preceding 90 days.","ChatGPT or OpenAI sessions appeared at 358 of the 482 companies and accounted for roughly 90% of the study’s records.","The article says stolen AI sessions can expose conversation histories, remain usable without a password prompt, enable misuse of connected automation services, and allow API keys to be billed to or resold from the victim.","The article recommends placing AI platforms behind single sign-on with short-lived sessions, rotating API keys, monitoring for reused sessions, and identifying unmanaged AI accounts."],"insights":["The report interprets ChatGPT’s overwhelming presence in the dataset as evidence of employees using unapproved AI accounts with work email addresses, rather than as a comparison of vendors’ security.","Changing an account password may not remove an intruder if the attacker has already stolen an active session token, so the article recommends treating a stealer-log appearance as an infected-device incident rather than only a password-reset issue.","Connected automation accounts can extend the impact beyond the AI service itself because an attacker could use existing permissions to create scheduled workflows that remove data from other business systems.","The article emphasizes that AI API keys can create both data-access and financial risk, since stolen keys may be used for paid AI capacity or resold to others."],"referencedReports":[],"body":"\u003cp\u003eSOCRadar’s AI Identity Exposure Report examined more than one million infostealer records associated with AI services across more than 80,000 corporate domains. It narrowed its analysis to 482 established enterprises, finding 5,434 records linked to 1,500 corporate email addresses; 295 of those companies appeared in records from the previous 90 days. ChatGPT or OpenAI sessions were found at 358 of the 482 companies and represented about 90% of the records, while Zapier, Notion, Hugging Face, Replit, Lovable, and ElevenLabs appeared less often.\u003c/p\u003e\n\n\u003cp\u003eThe article says a stolen AI login can expose stored chat histories containing source code, customer information, contracts, and unreleased plans. Stolen active-session cookies can be replayed without a password prompt, while connected automation accounts can carry existing permissions into CRM, email, and storage systems; stolen API keys can also be used or resold for paid AI capacity. It recommends putting AI platforms behind single sign-on with short-lived sessions, rotating and monitoring API keys, detecting reused sessions, and identifying unmanaged AI accounts tied to corporate domains.\u003c/p\u003e\n"},{"n":35,"title":"Hunting Citrix NetScaler Zero-Days with Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/hunting-citrix-netscaler-zero-days-corelight","time":"23:28","priority":"MAY READ","score":50,"tldr":"Corelight explains how network telemetry can help detect exploitation of Citrix NetScaler zero-days, including CVE-2023-3519, by identifying suspicious appliance and web traffic patterns.","briefOverview":"\u003cp\u003eThe article is titled “Hunting Citrix NetScaler Zero-Days with Corelight.” It concerns identifying Citrix NetScaler zero-day activity. Corelight is presented in connection with this hunting effort.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable technical details, affected organizations, or impact information. It therefore does not clearly describe a specific incident, vulnerability identifier, or detection method. No additional conclusions can be drawn from the readable material.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “Hunting Citrix NetScaler Zero-Days with Corelight.”","The article concerns Citrix NetScaler zero-day vulnerabilities.","The article presents Corelight in the context of hunting for Citrix NetScaler zero-days."],"insights":["The article frames Corelight as a resource for hunting, rather than merely responding to, Citrix NetScaler zero-day activity.","The focus on zero-days indicates the article concerns threats that may be exploited before a fix is available."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Hunting Citrix NetScaler Zero-Days with Corelight.” It concerns identifying Citrix NetScaler zero-day activity. Corelight is presented in connection with this hunting effort.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable technical details, affected organizations, or impact information. It therefore does not clearly describe a specific incident, vulnerability identifier, or detection method. No additional conclusions can be drawn from the readable material.\u003c/p\u003e\n"},{"n":31,"title":"Danglegeddon: Find your vulnerable subdomains before AI agents take them over","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/webinar/danglegeddon-webinar-on-demand/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=danglegeddon-webinar-on-demand","time":"13:51","priority":"MAY READ","score":48,"tldr":"Silent Push’s Danglegeddon research found roughly 85,000 dangling DNS records across 12,500 major organizations, with about 16,000 requiring review for potential subdomain takeover. The webinar explains how AI accelerates discovery of these abandoned records and outlines remediation practices such as removing records before service deprovisioning and continuously monitoring DNS.","briefOverview":"\u003cp\u003eSilent Push’s Danglegeddon research simulation examined how quickly dangling DNS records can be identified and taken over at scale. These records continue to point to services that have been deleted, such as a CNAME linked to a decommissioned cloud resource. If another party claims the deleted service, they can gain control of the associated subdomain.\u003c/p\u003e\n\n\u003cp\u003eThe team scanned 12,500 apex domains across government, banking, pharmaceutical, and automotive organizations and found roughly 85,000 dangling DNS records. AI-assisted validation and mapping reduced that number to around 16,000 findings worth reviewing, and every finding was disclosed to the affected organizations. The webinar explains that dangling CNAME, MX, and NS records can carry different risks, from hosting a phishing page on a trusted subdomain to taking over an entire DNS zone, and recommends removing records before deprovisioning services, assigning record owners, publishing CAA records, and monitoring continuously.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push’s Danglegeddon simulation examined how quickly dangling DNS records can be identified and taken over at scale.","The research scanned 12,500 apex domains across government, banking, pharmaceutical, and automotive organizations and identified roughly 85,000 dangling DNS records.","AI-assisted validation and mapping narrowed the approximately 85,000 records to around 16,000 findings worth reviewing.","Silent Push disclosed every finding from the research to the affected organizations.","The webinar recommends removing DNS records before services are deprovisioned, assigning record owners, publishing CAA records, and continuously monitoring DNS."],"insights":["AI can help reduce a large set of suspected abandoned DNS entries into a smaller, more manageable set for human review, as the research narrowed roughly 85,000 records to around 16,000 findings.","Different abandoned DNS record types have different potential consequences: a CNAME can enable a phishing page on a trusted subdomain, while an NS record can enable takeover of an entire DNS zone.","Organizational changes such as mergers, acquisitions, layoffs, and team changes can leave DNS records in place long after the linked service has been shut down.","Publishing CAA records is listed as a practical defensive measure alongside removing records before deprovisioning services, assigning record owners, and continuous monitoring."],"referencedReports":[],"body":"\u003cp\u003eSilent Push’s Danglegeddon research simulation examined how quickly dangling DNS records can be identified and taken over at scale. These records continue to point to services that have been deleted, such as a CNAME linked to a decommissioned cloud resource. If another party claims the deleted service, they can gain control of the associated subdomain.\u003c/p\u003e\n\n\u003cp\u003eThe team scanned 12,500 apex domains across government, banking, pharmaceutical, and automotive organizations and found roughly 85,000 dangling DNS records. AI-assisted validation and mapping reduced that number to around 16,000 findings worth reviewing, and every finding was disclosed to the affected organizations. The webinar explains that dangling CNAME, MX, and NS records can carry different risks, from hosting a phishing page on a trusted subdomain to taking over an entire DNS zone, and recommends removing records before deprovisioning services, assigning record owners, publishing CAA records, and monitoring continuously.\u003c/p\u003e\n"},{"n":17,"title":"IAM for AI agents: A Practical Enterprise Framework","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/iam-for-ai-agent.html","time":"18:20","priority":"MAY READ","score":45,"tldr":"Enterprise IAM for AI agents must go beyond provisioning and static roles by assigning distinct, owned identities; using short-lived, task-scoped delegated access; and continuously monitoring actual tool use and data access. Runtime telemetry and rapid revocation are essential to prove agents acted within authorized scope.","briefOverview":"\u003cp\u003eThe article presents a practical identity and access management framework for AI agents operating across enterprise systems. It argues that agents should be managed as non-human identities with a named human owner, defined purpose, limited authority, expiration, and ongoing monitoring. Traditional identity systems can manage provisioning and sign-in controls, but they often do not reveal what an agent actually did after gaining access to an application.\u003c/p\u003e\n\n\u003cp\u003eThe framework calls for distinct agent identities, short-lived and automatically rotated credentials, and delegated access that keeps the agent\u0026rsquo;s identity separate from a user\u0026rsquo;s authority. It recommends task-scoped permissions, tool allowlists, data boundaries, and human approval for high-consequence actions to limit agent behavior. The article emphasizes runtime visibility across applications and infrastructure so organizations can compare intended tasks with actual actions, revoke authority quickly when behavior diverges, and generate telemetry-backed audit evidence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI agents should be treated as non-human identities with a human owner, defined purpose, scoped authorization, expiration, and continuous monitoring.","Traditional IAM systems manage configured access and login-time controls but generally do not show what an autonomous agent actually does inside an application.","Each agent should have a distinct identity and should use federated workload identity with short-lived, automatically rotated credentials rather than shared accounts or embedded secrets.","Agent authority can be limited through task-scoped grants, tool allowlists, data boundaries, and human approval for high-consequence actions.","Continuous identity observability compares an agent's actual behavior across applications and infrastructure with its intended task scope and creates telemetry-backed audit evidence."],"insights":["An identity-provider-only view can make an agent appear well governed even when its meaningful actions, such as exporting customer data or changing entitlements, occur only inside connected applications.","When an agent acts for a user, preserving the difference between the agent's own identity and the authority lent by the user is important; reusing a user's session token removes that distinction.","Framework evaluations should prioritize how quickly authority can be revoked and whether the system produces evidence of actual behavior, not just whether access was provisioned correctly.","Many enterprises will need a combined approach: extend existing IAM for lifecycle governance, build in-application enforcement, and add tooling for discovering identities and verifying runtime behavior.","Agent-to-agent task delegation can propagate authority through chains that no human approved step by step, making identity, scope, expiration, and human accountability necessary at every link."],"referencedReports":[],"body":"\u003cp\u003eThe article presents a practical identity and access management framework for AI agents operating across enterprise systems. It argues that agents should be managed as non-human identities with a named human owner, defined purpose, limited authority, expiration, and ongoing monitoring. Traditional identity systems can manage provisioning and sign-in controls, but they often do not reveal what an agent actually did after gaining access to an application.\u003c/p\u003e\n\n\u003cp\u003eThe framework calls for distinct agent identities, short-lived and automatically rotated credentials, and delegated access that keeps the agent\u0026rsquo;s identity separate from a user\u0026rsquo;s authority. It recommends task-scoped permissions, tool allowlists, data boundaries, and human approval for high-consequence actions to limit agent behavior. The article emphasizes runtime visibility across applications and infrastructure so organizations can compare intended tasks with actual actions, revoke authority quickly when behavior diverges, and generate telemetry-backed audit evidence.\u003c/p\u003e\n"},{"n":33,"title":"Quarantined isn't contained: Agentic phishing response with Elastic and Sublime","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/blog/phishing-incident-response-sublime-security","time":"00:00","priority":"MAY READ","score":45,"tldr":"Elastic and Sublime Security integrate email-quarantine telemetry with endpoint, identity, and network signals so agentic workflows can correlate phishing campaigns and coordinate response. Teams can use human-approved or automated actions, including quarantining related emails across mailboxes based on endpoint malware hashes.","briefOverview":"\u003cp\u003eElastic’s native integration with Sublime Security brings email detections and quarantine actions into Elastic Security, where they can be reviewed alongside endpoint, identity, cloud, and network activity. The article illustrates how a quarantined phishing email and a suspicious PowerShell command five minutes later may individually seem resolved or insignificant but together can indicate a campaign. It argues that consolidating these signals reduces investigation handoffs and helps defenders respond at the speed of automated phishing and vulnerability chaining.\u003c/p\u003e\n\n\u003cp\u003eElastic Attack Discovery can examine related alerts, entity context, and raw logs to assemble evidence-grounded attack chains mapped to MITRE ATT\u0026amp;CK. Elastic Workflows can open a case, send evidence to an analyst through Slack, and allow the analyst to approve or reject a recommended response. In the reverse direction, when Elastic Defend identifies malware on an endpoint, a workflow can use its SHA-256 hash to trigger a Sublime blast-radius quarantine that removes related messages from mailboxes; teams can choose which actions are automatic and which require human approval.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The native Sublime Security integration sends email detection and quarantine telemetry into Elastic Security alongside endpoint, cloud, network, and identity data.","Elastic Attack Discovery can correlate Sublime phishing alerts with related security alerts, gather supporting evidence, query raw logs, and present prioritized attack chains mapped to MITRE ATT\u0026CK.","Elastic Workflows can create an incident case, notify an analyst in Slack with supporting evidence, and require the analyst to approve or reject recommended actions.","When Elastic Defend identifies malware on a host, an Elastic Workflow can use the file's SHA-256 hash to trigger a Sublime Security blast-radius quarantine across mailboxes.","The article recommends first deploying Sublime telemetry collection for immediate correlation benefits, then adding two-way response actions after deciding which actions require analyst approval."],"insights":["A quarantined phishing email can still be valuable evidence of a broader campaign when it is linked to later endpoint activity, even though the original message never reached an inbox.","The integration supports containment in the reverse direction: a malware hash discovered on an endpoint can be used to remove matching messages from every mailbox reached by that file.","The article recommends setting autonomy separately for each response action, keeping high-impact mailbox-wide quarantines under human approval while automating lower-impact enrichment or tagging steps.","Both Sublime's detection logic and Elastic's detection rules are described as open and tunable, allowing analysts to inspect why an alert or quarantine decision occurred."],"referencedReports":[],"body":"\u003cp\u003eElastic’s native integration with Sublime Security brings email detections and quarantine actions into Elastic Security, where they can be reviewed alongside endpoint, identity, cloud, and network activity. The article illustrates how a quarantined phishing email and a suspicious PowerShell command five minutes later may individually seem resolved or insignificant but together can indicate a campaign. It argues that consolidating these signals reduces investigation handoffs and helps defenders respond at the speed of automated phishing and vulnerability chaining.\u003c/p\u003e\n\n\u003cp\u003eElastic Attack Discovery can examine related alerts, entity context, and raw logs to assemble evidence-grounded attack chains mapped to MITRE ATT\u0026amp;CK. Elastic Workflows can open a case, send evidence to an analyst through Slack, and allow the analyst to approve or reject a recommended response. In the reverse direction, when Elastic Defend identifies malware on an endpoint, a workflow can use its SHA-256 hash to trigger a Sublime blast-radius quarantine that removes related messages from mailboxes; teams can choose which actions are automatic and which require human approval.\u003c/p\u003e\n"},{"n":19,"title":"⚡ Weekly Recap: $387M Crypto Hack, Citrix Exploits, AI Agents Go Off-Script, and More Threats","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/weekly-recap-387m-crypto-hack-citrix.html","time":"14:00","priority":"MAY READ","score":40,"tldr":"This week’s major security risks centered on neglected attack surfaces—actively exploited Citrix NetScaler flaws, weak service accounts, maliciously claimed placeholder domains, and increasingly capable phishing and AI-agent abuse. Organizations should prioritize urgent patching, rotate and secure non-human identities, audit hard-coded external domains, and monitor AI and identity workflows.","briefOverview":"\u003cp\u003eThis weekly recap highlights a range of cyber threats driven largely by neglected systems, weak accounts, old flaws, and exposed services. Citrix warned that CVE-2026-88771 and CVE-2026-88772 in NetScaler ADC and Gateway are under active global exploitation, with the flaws enabling unauthenticated command execution, remote code execution, or denial of service. Bitget also resumed Bitcoin withdrawals after suspected North Korean hackers stole more than $387 million through unauthorized transfers involving hot wallets.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes how the non-reserved placeholder domain third-party[.]com, referenced in roughly 1,700 repositories, was registered and used to serve a ClickFix lure to Windows visitors. A TeamFiltration campaign targeting Microsoft 365 tenants in Chile compromised seven unmanaged service or functional accounts that had default or unrotated passwords and lacked multi-factor authentication. Other reported developments include the takedown of the EvilTokens phishing service, malware that uses server-side decryption to resist analysis, and research showing that hundreds of leaked GitHub App private keys remain active with potentially powerful access permissions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released patches for actively exploited NetScaler ADC and Gateway flaws CVE-2026-88771 and CVE-2026-88772, and CISA said attackers are exploiting them globally.","Bitget resumed Bitcoin withdrawals in phases after suspected North Korean hackers stole more than $387 million through unauthorized transfers involving a limited number of hot wallets.","A registrant used third-party[.]com, a non-reserved domain commonly used as documentation placeholder text and referenced in about 1,700 repositories, to serve a ClickFix lure to Windows browsers.","The UNK_CondorFiltration campaign targeted more than 5,700 accounts across 28 Microsoft 365 tenants, compromising seven unmanaged service or functional accounts with default or unrotated passwords and no MFA.","Microsoft-led law enforcement and private-sector partners dismantled the EvilTokens phishing s
