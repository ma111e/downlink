<script type="application/json" id="dl-articles">[{"n":3,"title":"Over 1,000 GitLab servers vulnerable to ongoing RCE attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/over-1-000-gitlab-servers-vulnerable-to-code-execution-attacks/","time":"12:47","priority":"MUST READ","score":96,"tldr":"More than 1,000 internet-exposed GitLab servers remain unpatched against CVE-2026-97229, a maximum-severity unauthenticated remote code execution flaw that attackers are actively exploiting. Administrators should immediately upgrade self-managed GitLab CE or EE instances to versions 19.4.2, 19.3.5, 19.2.8, or later.","briefOverview":"\u003cp\u003eMore than 1,000 internet-exposed GitLab servers remain unpatched against CVE-2026-97229, a maximum-severity flaw that attackers are actively exploiting for remote code execution. The issue is an integer overflow in GitLab\u0026rsquo;s CI/CD Regular Expression Compiler, where a specially crafted regular expression in a pipeline configuration can allow an unauthenticated user to run arbitrary code on a GitLab server. GitLab issued fixes on October 12 for Community and Enterprise Edition versions 19.4.2, 19.3.5, and 19.2.8, and urged self-managed customers to upgrade immediately.\u003c/p\u003e\n\n\u003cp\u003eCISA confirmed exploitation in the wild, added CVE-2026-97229 to its Known Exploited Vulnerabilities Catalog, and ordered U.S. federal agencies to secure affected systems by Sunday. GitLab.com is already patched, and GitLab Dedicated customers do not need to take action, leaving self-managed deployments as the primary systems requiring updates. Shadowserver also reported more than 11,300 instances vulnerable to another maximum-severity GitLab code-execution flaw, CVE-2026-110264, out of roughly 39,000 GitLab instances it sees daily.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-97229 is a maximum-severity GitLab flaw in the CI/CD Regular Expression Compiler that can allow unauthenticated remote code execution through a specially crafted regular expression in a pipeline configuration.","GitLab released fixes for self-managed Community and Enterprise Edition installations in versions 19.4.2, 19.3.5, and 19.2.8, while GitLab.com is already patched.","CISA confirmed active exploitation of CVE-2026-97229 and added it to its Known Exploited Vulnerabilities Catalog, directing U.S. federal agencies to secure affected servers by Sunday.","Shadowserver reported that it tracks more than 1,000 internet-exposed GitLab instances still vulnerable to CVE-2026-97229.","Shadowserver also reported more than 11,300 GitLab instances vulnerable to the separate maximum-severity CVE-2026-110264 flaw, out of roughly 39,000 GitLab instances it observes daily."],"insights":["Despite patches being available for three weeks, Shadowserver still observed more than 1,000 internet-exposed GitLab instances vulnerable to CVE-2026-97229 while attacks were ongoing.","The exposure is broader than the newly exploited flaw alone: Shadowserver reported over 11,300 instances vulnerable to the separate maximum-severity CVE-2026-110264, from about 39,000 GitLab instances it sees daily.","GitLab.com was already running a patched release and GitLab Dedicated customers did not need to act, so the urgent remediation burden falls on organizations operating self-managed GitLab installations.","CISA has added six GitLab vulnerabilities to its actively exploited catalog since November 2021, including one that was used in ransomware attacks."],"referencedReports":[{"title":"CVE-2026-97229 - Integer overflow issue in CI/CD regular expression compiler impacts GitLab CE/EE","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/#cve-2026-97229---integer-overflow-issue-in-cicd-regular-expression-compiler-impacts-gitlab-ceee","publisher":"gitlab","context":"GitLab's patch-release advisory describes the flaw and the fixed GitLab CE and EE versions.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/29/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's advisory confirms that CVE-2026-97229 is being exploited and adds it to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eMore than 1,000 internet-exposed GitLab servers remain unpatched against CVE-2026-97229, a maximum-severity flaw that attackers are actively exploiting for remote code execution. The issue is an integer overflow in GitLab\u0026rsquo;s CI/CD Regular Expression Compiler, where a specially crafted regular expression in a pipeline configuration can allow an unauthenticated user to run arbitrary code on a GitLab server. GitLab issued fixes on October 12 for Community and Enterprise Edition versions 19.4.2, 19.3.5, and 19.2.8, and urged self-managed customers to upgrade immediately.\u003c/p\u003e\n\n\u003cp\u003eCISA confirmed exploitation in the wild, added CVE-2026-97229 to its Known Exploited Vulnerabilities Catalog, and ordered U.S. federal agencies to secure affected systems by Sunday. GitLab.com is already patched, and GitLab Dedicated customers do not need to take action, leaving self-managed deployments as the primary systems requiring updates. Shadowserver also reported more than 11,300 instances vulnerable to another maximum-severity GitLab code-execution flaw, CVE-2026-110264, out of roughly 39,000 GitLab instances it sees daily.\u003c/p\u003e\n"},{"n":10,"title":"Ivanti patches two more Connect Secure zero-days chained in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ivanti-patches-two-more-connect-secure-zero-days-chained-in-attacks/","time":"09:33","priority":"MUST READ","score":96,"tldr":"Ivanti has patched two additional Connect Secure flaws, CVE-2026-111357 and CVE-2026-118527, that attackers chained with the previously patched CVE-2026-104935 authentication bypass to achieve unauthenticated root-level code execution. Administrators should urgently update exposed Connect Secure gateways, as exploitation has been active since early October.","briefOverview":"\u003cp\u003eIvanti released security updates for two additional Connect Secure flaws, CVE-2026-111357 and CVE-2026-118527, that have been used in chained zero-day attacks since at least October 1. CVE-2026-111357 is a high-severity flaw that can let an attacker gain greater control, while CVE-2026-118527 allows authenticated attackers to upload files to an unpatched device. The two flaws were used alongside CVE-2026-104935, an authentication bypass Ivanti patched in October.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that UTA0576 chained the three flaws to gain root-level code execution without authentication on fully patched Connect Secure devices. The actor reportedly did not install malware or a web shell, instead re-exploiting the device for each command and tampering with logs to evade Ivanti\u0026rsquo;s Integrity Checker Tool. CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and directed U.S. federal agencies to patch by Friday, while Shadowserver tracks more than 5,000 internet-exposed Connect Secure instances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ivanti released updates for two Connect Secure zero-day flaws, CVE-2026-111357 and CVE-2026-118527, that have been chained in attacks since at least October 1.","CVE-2026-111357 is a high-severity privilege-escalation flaw, while CVE-2026-118527 allows authenticated attackers to upload files to unpatched devices.","Attackers combined these flaws with the previously patched CVE-2026-104935 authentication bypass to gain unauthenticated root-level code execution on fully patched Connect Secure devices.","Volexity reported that the UTA0576 threat actor repeatedly re-exploited affected devices for each command and altered logs rather than deploying malware or a web shell.","CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and ordered U.S. federal agencies to patch by Friday."],"insights":["The attackers avoided installing malware or a web shell, instead reusing the security flaws for every command and altering logs to evade Ivanti's Integrity Checker Tool.","Ivanti initially prioritized fixing CVE-2026-104935 because it addressed the primary attack path, while the related privilege-escalation flaw was identified during that response.","More than 5,000 Ivanti Connect Secure instances remain exposed to the internet, and the article says it is unknown how many have been secured against the ongoing attacks.","CISA added the earlier CVE-2026-104935 flaw to its actively exploited vulnerabilities catalog and required U.S. federal agencies to patch by Friday."],"referencedReports":[{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"ivanti","context":"Ivanti's updated advisory explains that it initially prioritized a fix for CVE-2026-104935 because it addressed the primary exploitation path.","category":"advisory","primary":false},{"title":"A Series of Unauthenticated Events: Chained Exploitation of Ivanti Connect Secure Zero-Days","url":"https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/","publisher":"volexity","context":"Volexity reported that UTA0576 chained CVE-2026-104935 with two other flaws to obtain unauthenticated root-level code execution on fully patched Connect Secure devices.","category":"research","primary":true}],"body":"\u003cp\u003eIvanti released security updates for two additional Connect Secure flaws, CVE-2026-111357 and CVE-2026-118527, that have been used in chained zero-day attacks since at least October 1. CVE-2026-111357 is a high-severity flaw that can let an attacker gain greater control, while CVE-2026-118527 allows authenticated attackers to upload files to an unpatched device. The two flaws were used alongside CVE-2026-104935, an authentication bypass Ivanti patched in October.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that UTA0576 chained the three flaws to gain root-level code execution without authentication on fully patched Connect Secure devices. The actor reportedly did not install malware or a web shell, instead re-exploiting the device for each command and tampering with logs to evade Ivanti\u0026rsquo;s Integrity Checker Tool. CISA added CVE-2026-104935 to its catalog of actively exploited vulnerabilities and directed U.S. federal agencies to patch by Friday, while Shadowserver tracks more than 5,000 internet-exposed Connect Secure instances.\u003c/p\u003e\n"},{"n":27,"title":"Critical Linux kernel TCP vulnerability can allow remote code execution (CVE-2026-98432)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/linux-kernel-tcp-rce-vulnerability-cve-2026-98432","time":"09:00","priority":"MUST READ","score":95,"tldr":"CVE-2026-98432 is a critical Linux kernel IPv4 TCP use-after-free flaw that may enable unauthenticated remote code execution on reachable MPTCP-enabled services. Install your vendor’s patched kernel and reboot immediately; disabling MPTCP and filtering IPv4 IP options are only temporary mitigations.","briefOverview":"\u003cp\u003eCVE-2026-98432 is a critical flaw in Linux kernel IPv4 TCP connection handling that affects kernel 4.4 and later. The Linux kernel CVE team rates it 9.8 out of 10, while vendor assessments vary because the issue relies on winning a timing race. Anthropic reported that an unreleased Claude research model produced an exploit that gained root-level command execution on a Linux server with an MPTCP listener. No vendor advisory had reported exploitation in the wild as of October 29, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when the kernel can free connection-related IP-options memory while another processor is still using it, potentially allowing memory disclosure, memory corruption, or a crash. Internet-reachable Linux hosts with IPv4 TCP ports are affected, including cloud virtual machines and the underlying nodes that run containers; a proxy on the same host does not prevent the kernel from handling the connection. The complete remediation is to install the vendor-patched kernel and reboot into it, while disabling MPTCP or dropping IPv4 packets carrying IP options are temporary measures. Operators should verify the running kernel with \u003ccode\u003euname -r\u003c/code\u003e, because installing an update without rebooting does not activate the fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-98432 is a Linux kernel IPv4 TCP use-after-free flaw affecting kernel version 4.4 and later, which the kernel CVE team rates 9.8 out of 10.","Anthropic reported that an unreleased Claude research model produced an exploit that achieved root-level command execution on a Linux server with an MPTCP listener.","Installing a vendor-patched kernel and rebooting is the complete remediation, while disabling MPTCP or dropping IPv4 packets with IP options are temporary exposure-reduction measures.","Internet-reachable Linux hosts, including EC2 instances, ECS container instances, and EKS nodes, are affected when they expose an IPv4 TCP port; the container host kernel is what matters for containers.","No vendor advisory had reported exploitation in the wild as of October 29, 2026."],"insights":["Go 1.24 and later programs request MPTCP listeners by default where the kernel permits it, which can expose a Go server even if its operator did not intentionally enable that feature.","A proxy running on the same Linux host does not protect that host, because its kernel still processes the incoming TCP connection before the proxy handles application traffic.","An installed kernel update is not sufficient until the machine restarts into it; the article notes that a host may appear fixed in scanning results even though it is still running the old kernel.","According to Anthropic, a failed attempt at the timing-dependent exploit only fails that connection attempt rather than crashing the target, allowing an attacker to keep retrying.","For containers, the relevant software to patch is the Linux kernel on the underlying node, not the container image itself."],"referencedReports":[{"title":"Discovering Vulnerabilities with Claude","url":"https://www.anthropic.com/research/discovering-vulnerabilities-with-claude","publisher":"anthropic","context":"The article cites Anthropic's research for its report that an unreleased Claude model produced an exploit achieving root-level command execution against a Linux server with an MPTCP listener.","category":"research","primary":true},{"title":"AWS Security Bulletin 2026-160","url":"https://aws.amazon.com/security/security-bulletins/2026-160-aws/","publisher":"aws","context":"The article relies on AWS's advisory for remediation guidance, affected AWS services, interim mitigations, and exposure details.","category":"advisory","primary":true},{"title":"CVE-2026-98432","url":"https://ubuntu.com/security/CVE-2026-98432","publisher":"canonical","context":"The article cites Ubuntu's CVE tracker for distribution fix status and its listed CVSS 4.0 severity vector.","category":"advisory","primary":false},{"title":"CVE-2026-98432 Linux Kernel IPv4 TCP Flaw Status for CloudLinux","url":"https://blog.cloudlinux.com/cve-2026-98432-linux-kernel-ipv4-tcp-flaw-status-for-cloudlinux","publisher":"cloudlinux","context":"The article references CloudLinux's kernel-team analysis stating that it could not reproduce Anthropic's exploit claim.","category":"research","primary":false}],"body":"\u003cp\u003eCVE-2026-98432 is a critical flaw in Linux kernel IPv4 TCP connection handling that affects kernel 4.4 and later. The Linux kernel CVE team rates it 9.8 out of 10, while vendor assessments vary because the issue relies on winning a timing race. Anthropic reported that an unreleased Claude research model produced an exploit that gained root-level command execution on a Linux server with an MPTCP listener. No vendor advisory had reported exploitation in the wild as of October 29, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when the kernel can free connection-related IP-options memory while another processor is still using it, potentially allowing memory disclosure, memory corruption, or a crash. Internet-reachable Linux hosts with IPv4 TCP ports are affected, including cloud virtual machines and the underlying nodes that run containers; a proxy on the same host does not prevent the kernel from handling the connection. The complete remediation is to install the vendor-patched kernel and reboot into it, while disabling MPTCP or dropping IPv4 packets carrying IP options are temporary measures. Operators should verify the running kernel with \u003ccode\u003euname -r\u003c/code\u003e, because installing an update without rebooting does not activate the fix.\u003c/p\u003e\n"},{"n":9,"title":"Synology warns of C3RB3R ransomware attacks targeting NAS devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/synology-warns-customers-of-ongoing-c3rb3r-ransomware-attacks/","time":"11:28","priority":"MUST READ","score":94,"tldr":"Synology warns that C3RB3R ransomware operators are exploiting a December 2024-patched DSM vulnerability to encrypt data on outdated Internet-exposed NAS devices. Users should immediately update DSM, enable automatic updates, and block public access to the NAS management interface.","briefOverview":"\u003cp\u003eSynology has warned that threat actors are using a vulnerability patched in December 2024 to deploy C3RB3R ransomware against NAS devices running outdated DiskStation Manager (DSM) versions. The attacks encrypt victims’ data and demand payment for a purported “C3rb3r Decryptor.” Synology urged users to update DSM immediately and enable automatic updates. The company also advised blocking internet access to NAS management web interfaces.\u003c/p\u003e\n\n\u003cp\u003eSynology has not said which vulnerability is being exploited, but it linked to a November 2024 advisory covering CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445. Those flaws could allow an attacker to execute code, read files, or write files on unpatched devices. Affected users reported that encrypted files receive a .L0CK3D extension and that the malware leaves a read-me3.txt ransom note. The note warns against using third-party recovery software and directs victims to a dark-web payment portal.\u003c/p\u003e\n\n\u003cp\u003eThe warning follows more than two weeks of user reports and is unusual for Synology, whose prior comparable warning was published in August 2019. Shadowserver tracks more than 380,000 Synology NAS devices exposed to the internet, although it does not show how many are protected against the attacks. The current C3RB3R operation uses the name of the older Cerber ransomware service and has previously been used against Atlassian Confluence and GitLab servers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Synology warned that C3RB3R ransomware actors are exploiting a vulnerability patched in December 2024 to target NAS devices running outdated DiskStation Manager software.","The attacks encrypt data and demand payment for a purported \"C3rb3r Decryptor,\" with affected users reporting a read-me3.txt ransom note and a .L0CK3D file extension.","Synology advised users to update DSM immediately, enable automatic updates, and block internet access to the management web interface.","Synology linked the active attacks to a November 2024 advisory covering CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445, though it did not identify which specific flaw is being exploited.","Shadowserver tracks more than 380,000 internet-exposed Synology NAS devices, although it does not indicate how many are patched or honeypots."],"insights":["The ransomware campaign targets a flaw that Synology patched in December 2024, showing that devices left on older DSM releases remain exposed long after fixes are available.","Synology rarely issues alerts about active attacks against its customers; its previous comparable warning was in August 2019, following brute-force activity associated with eCh0raix ransomware infections.","Affected users can recognize this campaign through the .L0CK3D extension and the read-me3.txt ransom note advertising a “C3rb3r Decryptor.”","The article identifies internet exposure of the NAS management interface as a preventable risk factor, alongside installing the specified DSM updates and enabling automatic updates.","The current C3RB3R operation shares its name with the older Cerber ransomware service but is described as a separate operation that has also targeted Confluence and GitLab servers since December 2021."],"referencedReports":[{"title":"Synology urges users to update DSM following ransomware attacks on outdated DSM versions","url":"https://www.synology.com/en-global/company/news/article/C3RB3R/Synology%20urges%20users%20to%20update%20DSM%20following%20ransomware%20attacks%20on%20outdated%20DSM%20versions","publisher":"synology","context":"The article relies on this Synology advisory for the warning that C3RB3R actors are exploiting a previously patched DSM flaw against outdated devices.","category":"advisory","primary":true},{"title":"Synology SA-24:20","url":"https://www.synology.com/zh-tw/security/advisory/Synology_SA_24_20","publisher":"synology","context":"The article links this November 2024 security advisory for patch information on CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445.","category":"advisory","primary":false}],"body":"\u003cp\u003eSynology has warned that threat actors are using a vulnerability patched in December 2024 to deploy C3RB3R ransomware against NAS devices running outdated DiskStation Manager (DSM) versions. The attacks encrypt victims’ data and demand payment for a purported “C3rb3r Decryptor.” Synology urged users to update DSM immediately and enable automatic updates. The company also advised blocking internet access to NAS management web interfaces.\u003c/p\u003e\n\n\u003cp\u003eSynology has not said which vulnerability is being exploited, but it linked to a November 2024 advisory covering CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445. Those flaws could allow an attacker to execute code, read files, or write files on unpatched devices. Affected users reported that encrypted files receive a .L0CK3D extension and that the malware leaves a read-me3.txt ransom note. The note warns against using third-party recovery software and directs victims to a dark-web payment portal.\u003c/p\u003e\n\n\u003cp\u003eThe warning follows more than two weeks of user reports and is unusual for Synology, whose prior comparable warning was published in August 2019. Shadowserver tracks more than 380,000 Synology NAS devices exposed to the internet, although it does not show how many are protected against the attacks. The current C3RB3R operation uses the name of the older Cerber ransomware service and has previously been used against Atlassian Confluence and GitLab servers.\u003c/p\u003e\n"},{"n":6,"title":"Chinese hackers use ARTEX AI in automated attacks against 200 orgs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chinese-hackers-use-artex-ai-in-automated-attacks-against-200-orgs/","time":"21:40","priority":"MUST READ","score":93,"tldr":"Chinese-linked Vapor Panda used the ARTEX AI multi-agent penetration-testing framework to automate cyberespionage against more than 200 organizations in 14 countries, compromising at least nine. The campaign demonstrates how human-directed AI agents can scale reconnaissance, exploitation, credential theft, and lateral movement across multiple targets simultaneously.","briefOverview":"\u003cp\u003eChinese-linked threat actor Vapor Panda used ARTEX AI, a multi-agent penetration-testing framework, in a cyberespionage campaign targeting more than 200 organizations across 14 countries. The operation began on October 17 and targeted government ministries, telecommunications providers, and organizations in the pharmaceutical, semiconductor, defense, nuclear, and financial sectors. CrowdStrike reported that at least nine organizations were compromised, while password-spraying and credential-scanning activity affected at least 12 additional high-value targets.\u003c/p\u003e\n\n\u003cp\u003eCrowdStrike said the attackers used DeepSeek and an unidentified commercial language model to coordinate planning and worker agents across simultaneous intrusions, with human operators intervening for critical decisions. The agents conducted reconnaissance, exploited vulnerabilities, deployed web shells, obtained credentials, and sought alternative attack paths; operators also instructed them to avoid Windows hosts protected by CrowdStrike Falcon. Separately, DIVD said ARTEX AI autonomously gained root privileges in its September 2026 breach within 12 minutes by chaining a Zammad zero-day with a second local privilege-escalation zero-day, generating more than 450,000 requests and 2,500 scripts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike says the China-linked threat actor Vapor Panda used the ARTEX AI penetration-testing framework in a campaign targeting more than 200 organizations across 14 countries beginning October 17.","The campaign targeted government ministries, telecommunications providers, and organizations in the pharmaceutical, semiconductor, defense, nuclear, and financial sectors, and compromised at least nine organizations.","Vapor Panda used DeepSeek and an unidentified commercial language model to coordinate AI agents that conducted reconnaissance, exploited flaws, deployed web shells, collected credentials, and pursued alternative paths during multiple intrusions.","In an intrusion against a Greek government entity, researchers say the agents forged an administrator token and read mailboxes using authentication keys from a 2022 mail-server directory export.","The Dutch Institute for Vulnerability Disclosure said ARTEX AI autonomously gained root privileges on its network in 12 minutes by chaining a Zammad zero-day with a second zero-day for local privilege escalation."],"insights":["The operators directed AI agents in Chinese but personally intervened at critical decision points, indicating that the campaign combined automated execution with human oversight rather than relying entirely on autonomous activity.","The attackers explicitly told the agents to avoid Windows systems protected by CrowdStrike Falcon and instead focus on hosts without that protection.","CrowdStrike estimated that AI agents used more than 1.4 billion input tokens during one intrusion, illustrating the unusually large volume of automated activity involved.","DIVD recorded more than 450,000 requests and 2,500 scripts during its ARTEX AI incident and characterized the activity as highly noisy and disorganized."],"referencedReports":[{"title":"Vapor Panda Uses ARTEX to Scale Global Campaign","url":"https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/","publisher":"crowdstrike","context":"The article relies on CrowdStrike researchers' analysis of Vapor Panda's AI-assisted cyberespionage campaign targeting organizations in 14 countries.","category":"research","primary":true}],"body":"\u003cp\u003eChinese-linked threat actor Vapor Panda used ARTEX AI, a multi-agent penetration-testing framework, in a cyberespionage campaign targeting more than 200 organizations across 14 countries. The operation began on October 17 and targeted government ministries, telecommunications providers, and organizations in the pharmaceutical, semiconductor, defense, nuclear, and financial sectors. CrowdStrike reported that at least nine organizations were compromised, while password-spraying and credential-scanning activity affected at least 12 additional high-value targets.\u003c/p\u003e\n\n\u003cp\u003eCrowdStrike said the attackers used DeepSeek and an unidentified commercial language model to coordinate planning and worker agents across simultaneous intrusions, with human operators intervening for critical decisions. The agents conducted reconnaissance, exploited vulnerabilities, deployed web shells, obtained credentials, and sought alternative attack paths; operators also instructed them to avoid Windows hosts protected by CrowdStrike Falcon. Separately, DIVD said ARTEX AI autonomously gained root privileges in its September 2026 breach within 12 minutes by chaining a Zammad zero-day with a second local privilege-escalation zero-day, generating more than 450,000 requests and 2,500 scripts.\u003c/p\u003e\n"},{"n":7,"title":"Google disrupts million-device XCPE Android malware botnet, bans TV box maker","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-disrupts-million-device-xcpe-android-malware-botnet-bans-tv-box-maker/","time":"18:16","priority":"SHOULD READ","score":89,"tldr":"Google disrupted the XCPE botnet, which it attributes to Chinese manufacturer Videostrong for allegedly preinstalling a persistent Android backdoor on more than 1.3 million TV boxes and selling access to criminal affiliates. Google revoked Videostrong’s Android TV certification, but affected devices require clean firmware or internet disconnection because the malware persists in the OEM partition.","briefOverview":"\u003cp\u003eGoogle and industry partners disrupted the XCPE botnet, which the company says consisted of more than 1.3 million Android TV streaming boxes manufactured by Chinese company Videostrong Technology Co. Google assessed with high confidence that Videostrong intentionally embedded a persistent backdoor into device firmware and sold access to criminal affiliates. Google revoked Videostrong’s Android TV license and banned the company and its future affiliates from producing certified Android devices or supplying software to certified vendors.\u003c/p\u003e\n\n\u003cp\u003eThe XCPE backdoor, tracked as \u003ccode\u003ex.cpe\u003c/code\u003e and \u003ccode\u003ecom.oemservice\u003c/code\u003e, operated with Android system-level privileges and contacted command-and-control infrastructure to receive instructions. Operators could install apps, disable Google Play Protect, run commands, capture screenshots, inject keystrokes, collect device and account data, and establish remote access. Google said the devices were also used for ad fraud and residential proxy services, while the disrupted infrastructure served more than a dozen related malware families and affected at least 10 million additional compromised devices. Although the command infrastructure was disrupted, the malware remains on affected devices and can reinstall itself from the \u003ccode\u003e/oem/\u003c/code\u003e partition unless users install clean firmware or disconnect the devices from the internet.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google and industry partners disrupted the XCPE botnet, which Google says involved more than 1.3 million Android TV streaming boxes manufactured by Videostrong Technology Co. with a persistent backdoor installed during manufacturing.","Google attributed the operation to Videostrong with high confidence and revoked the company’s Android TV license, banning it and future affiliates from producing certified Android devices or supplying software to certified vendors.","The XCPE backdoor could install additional apps, disable Google Play Protect, run commands with system-level privileges, capture screenshots, inject keystrokes, and collect device and account information.","Google said the botnet was used for ad fraud and residential proxy services, allowing third-party internet traffic to be routed through infected devices without owners’ knowledge or consent.","Although Google disrupted the command-and-control infrastructure, it said XCPE remains on infected devices and can reinstall itself from the /oem/ partition unless users install clean firmware or disconnect the device from the internet."],"insights":["XCPE was embedded in device firmware during manufacturing, rather than reaching devices through a software flaw or by persuading owners to install an app.","The disrupted command-and-control infrastructure was also used by more than a dozen related malware families, so Google said the action cut off access to at least 10 million additional compromised devices, including non-Android equipment such as karaoke and telehealth hardware.","Removing the malware from an affected device may not be sufficient because it can reinstall itself from the /oem/ partition; Google said clean firmware or disconnecting the device from the internet is needed to prevent further activity.","Google said Videostrong used code-obscuring techniques and delayed loading of malicious code until after a device’s first startup to evade certification security testing, prompting Google to modify its review process.","The botnet operated as a modular platform that enabled different criminal affiliates to deploy their own ad-fraud, residential-proxy, and additional backdoor components onto affected devices."],"referencedReports":[{"title":"Shutting the door on the XCPE botnet","url":"https://cloud.google.com/blog/topics/threat-intelligence/shutting-the-door-on-the-xcpe-botnet","publisher":"google-threat-intelligence-group","context":"Google's Threat Intelligence Group report details the XCPE botnet, its capabilities, its alleged attribution to Videostrong, and the disruption operation.","category":"research","primary":true},{"title":"The internals of a BadBox operation","url":"https://synthient.com/blog/the-internals-of-a-badbox-operation","publisher":"synthient","context":"Synthient's coordinated report describes evidence it used to trace XCPE backdoor infrastructure and code-signing activity to Videostrong.","category":"research","primary":false}],"body":"\u003cp\u003eGoogle and industry partners disrupted the XCPE botnet, which the company says consisted of more than 1.3 million Android TV streaming boxes manufactured by Chinese company Videostrong Technology Co. Google assessed with high confidence that Videostrong intentionally embedded a persistent backdoor into device firmware and sold access to criminal affiliates. Google revoked Videostrong’s Android TV license and banned the company and its future affiliates from producing certified Android devices or supplying software to certified vendors.\u003c/p\u003e\n\n\u003cp\u003eThe XCPE backdoor, tracked as \u003ccode\u003ex.cpe\u003c/code\u003e and \u003ccode\u003ecom.oemservice\u003c/code\u003e, operated with Android system-level privileges and contacted command-and-control infrastructure to receive instructions. Operators could install apps, disable Google Play Protect, run commands, capture screenshots, inject keystrokes, collect device and account data, and establish remote access. Google said the devices were also used for ad fraud and residential proxy services, while the disrupted infrastructure served more than a dozen related malware families and affected at least 10 million additional compromised devices. Although the command infrastructure was disrupted, the malware remains on affected devices and can reinstall itself from the \u003ccode\u003e/oem/\u003c/code\u003e partition unless users install clean firmware or disconnect the devices from the internet.\u003c/p\u003e\n"},{"n":4,"title":"BTCPay Server warns of hot wallet crypto thefts on outdated instances","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/btcpay-server-warns-of-hot-wallet-thefts-targeting-outdated-instances/","time":"15:03","priority":"SHOULD READ","score":88,"tldr":"BTCPay Server warns that attackers are draining hot wallets on self-hosted instances running version 2.4.1 or earlier and urges operators to take vulnerable servers offline and update immediately to version 2.4.7.","briefOverview":"\u003cp\u003eBTCPay Server has warned that attackers have been draining Bitcoin and Litecoin from hot wallets on self-hosted instances running version 2.4.1 or earlier. The project initially advised operators to shut down servers while it investigated unauthorized payments. BTCPay Server lets businesses accept cryptocurrency payments directly into their own wallets, including through the Lightning Network.\u003c/p\u003e\n\n\u003cp\u003eThe project said its investigation identified an attack vector affecting versions 2.4.1 and older, and it is examining how attackers logged in as administrators on versions released before 2.4.2. BTCPay Server released version 2.4.7 as an emergency security update after a critical issue was discovered through Anthropic’s Frontier OSS scanner, and says it has no credible reports of hot-wallet thefts affecting users on that latest release. Operators of version 2.4.1 or earlier are urged to take instances offline immediately and update, while affected users are asked to contact the project and report losses to local authorities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BTCPay Server says attackers have been draining hot wallets on instances running version 2.4.1, released July 23, 2026, or earlier.","The project urged operators of version 2.4.1 or older to take their instances offline as soon as possible and update to version 2.4.7.","The investigation is examining how the threat actor logged in as an administrator on instances running versions older than 2.4.2.","BTCPay Server says it has no credible reports of hot-wallet drains affecting users on the latest 2.4.7 release.","Affected users are asked to contact security@btcpayserver.org with incident details and report losses to local authorities."],"insights":["The reported thefts were tied to administrator-level access on older BTCPay Server installations rather than attacks on public servers, according to the project founder.","BTCPay Server had already issued version 2.4.7 as an emergency update after a critical issue was found through Anthropic’s Frontier OSS scanner.","The project asked VPS hosting providers to take affected instances offline as a precaution while it investigated the theft reports.","Operators can update through the BTCPay Server administration interface or, for Docker deployments, by running the project’s update script over SSH."],"referencedReports":[{"title":"BTCPay Server Security Incident: 2.4.1 and Earlier","url":"https://blog.btcpayserver.org/btcpay-server-security-incident-2-4-1-and-earlier/","publisher":"btcpay-server","context":"The article cites this security alert for BTCPay Server’s response to hot-wallet thefts affecting older instances.","category":"advisory","primary":true},{"title":"Security Advisory: BTCPay Server 2.4.2","url":"http://blog.btcpayserver.org/security-advisory-btcpay-server-2-4-2/","publisher":"btcpay-server","context":"The article references this advisory as the announcement for version 2.4.2, released on August 7.","category":"advisory","primary":false}],"body":"\u003cp\u003eBTCPay Server has warned that attackers have been draining Bitcoin and Litecoin from hot wallets on self-hosted instances running version 2.4.1 or earlier. The project initially advised operators to shut down servers while it investigated unauthorized payments. BTCPay Server lets businesses accept cryptocurrency payments directly into their own wallets, including through the Lightning Network.\u003c/p\u003e\n\n\u003cp\u003eThe project said its investigation identified an attack vector affecting versions 2.4.1 and older, and it is examining how attackers logged in as administrators on versions released before 2.4.2. BTCPay Server released version 2.4.7 as an emergency security update after a critical issue was discovered through Anthropic’s Frontier OSS scanner, and says it has no credible reports of hot-wallet thefts affecting users on that latest release. Operators of version 2.4.1 or earlier are urged to take instances offline immediately and update, while affected users are asked to contact the project and report losses to local authorities.\u003c/p\u003e\n"},{"n":25,"title":"Google Disrupts 1.3 Million-Device Android Botnet, Says TV Box Maker Sold Criminal Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/google-disrupts-13-million-device.html","time":"15:50","priority":"SHOULD READ","score":88,"tldr":"Google disrupted a 1.3 million-device Android botnet tied to Videostrong, which it says deliberately embedded the x.cpe backdoor in TV boxes and sold criminal access. Because the backdoor is firmware-level and survives normal cleanup, affected owners may need vendor remediation or device replacement.","briefOverview":"\u003cp\u003eGoogle led a late-October operation that disrupted a botnet controlling more than 1.3 million Android devices, mainly TV set-top boxes. Google said it is highly confident that Shenzhen-based device maker Videostrong intentionally included the x.cpe backdoor in device firmware and sold access to criminals. The company has banned Videostrong and future affiliates from building or selling certified Android devices and from supplying software to certified device makers.\u003c/p\u003e\n\n\u003cp\u003eThe firmware-level x.cpe backdoor ran with system access, contacted control servers for instructions, and could disable Google Play Protect before silently installing software. Operators used it to collect device and account information, take screenshots, run remote commands, and turn devices into residential proxies or tools for ad-view fraud. Because the backdoor reinstalls after a restart, affected owners cannot reliably remove it themselves; TrendAI said remediation requires vendor action, platform protection, or replacement, while Synthient advised organizations to identify, disconnect, and discard affected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google led a late-October takedown that disrupted a botnet of more than 1.3 million Android devices, mostly TV set-top boxes.","Google said it was highly confident that Shenzhen-based device maker Videostrong intentionally embedded the x.cpe backdoor in affected devices and sold access to criminals.","The x.cpe backdoor, installed as a system app in device firmware, could disable Google Play Protect, silently install apps, run commands, capture screens, and map local networks.","Most criminal modules used the infected devices as residential proxies or to sell their unused internet bandwidth, while other modules generated fraudulent online ad views.","Because x.cpe is embedded in firmware and reinstalls after restart, TrendAI said cleanup requires vendor action, platform protection, or replacement of the device."],"insights":["Google said the malicious code was concealed to evade its device certification tests and was loaded after a device’s first boot, prompting changes to its review process and firmware checks for certified Android TV devices.","The same backdoor was found beyond TV boxes, including telehealth devices, karaoke machines, and digital signage, showing that affected device types were not limited to consumer streaming hardware.","Taking down the x.cpe control infrastructure also disrupted control domains for more than a dozen malware families, and Google expects this to cut off access to at least 10 million additional infected devices.","A factory reset may remove additional malicious programs installed by the backdoor, but it does not reliably remove x.cpe itself because the backdoor is part of the device firmware."],"referencedReports":[{"title":"Shutting the Door on the x.cpe Botnet","url":"https://cloud.google.com/blog/topics/threat-intelligence/shutting-the-door-on-the-xcpe-botnet/","publisher":"google","context":"Google's technical analysis describes the x.cpe backdoor, the botnet disruption, and its attribution to Videostrong.","category":"research","primary":true},{"title":"TrendAI Research Helps Disrupt Android TV Botnet of More Than 1.3 Million Pre-Infected Devices","url":"https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/trendaitm-research-helps-disrupt-android-tv-botnet-of-more-than-13-million-pre-infected-devices","publisher":"trendai","context":"The article cites TrendAI's device count, affected models and countries, and its assessment that firmware-level cleanup requires vendor action, platform protection, or replacement.","category":"research","primary":false},{"title":"The Internals of a Badbox Operation","url":"https://synthient.com/blog/the-internals-of-a-badbox-operation","publisher":"synthient","context":"The article cites Synthient's technical findings on MECOOL devices, Videostrong attribution, indicators, and recommended actions for organizations.","category":"research","primary":false},{"title":"x.cpe Botnet Whitepaper","url":"https://www.plume.com/xcpe-botnet-whitepaper-pdf","publisher":"plume","context":"The article references Plume's findings on devices using the botnet control server and Videostrong's firmware and remote-management capabilities.","category":"research","primary":false}],"body":"\u003cp\u003eGoogle led a late-October operation that disrupted a botnet controlling more than 1.3 million Android devices, mainly TV set-top boxes. Google said it is highly confident that Shenzhen-based device maker Videostrong intentionally included the x.cpe backdoor in device firmware and sold access to criminals. The company has banned Videostrong and future affiliates from building or selling certified Android devices and from supplying software to certified device makers.\u003c/p\u003e\n\n\u003cp\u003eThe firmware-level x.cpe backdoor ran with system access, contacted control servers for instructions, and could disable Google Play Protect before silently installing software. Operators used it to collect device and account information, take screenshots, run remote commands, and turn devices into residential proxies or tools for ad-view fraud. Because the backdoor reinstalls after a restart, affected owners cannot reliably remove it themselves; TrendAI said remediation requires vendor action, platform protection, or replacement, while Synthient advised organizations to identify, disconnect, and discard affected devices.\u003c/p\u003e\n"},{"n":21,"title":"Critical Langflow Flaws Could Let Unauthenticated Attackers Run Code on Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-langflow-flaws-could-let.html","time":"11:50","priority":"SHOULD READ","score":86,"tldr":"Langflow versions 1.0.0 through 1.12.8 contain critical flaws that can let unauthenticated attackers bypass authentication and execute code remotely, including through MCP tool enumeration. Organizations should upgrade to Langflow 1.13.0 immediately, as IBM provides no workaround.","briefOverview":"\u003cp\u003eIBM reported four Langflow vulnerabilities affecting every release from 1.0.0 through 1.12.8, including two critical issues rated 9.8. CVE-2026-93680 can let an unauthenticated attacker bypass authentication, while CVE-2026-110186 can allow unauthenticated remote code execution through Model Context Protocol tool enumeration. The other issues could allow a low-privileged user to cause operating-system commands to run on the server or obtain sensitive information from insufficiently protected credentials.\u003c/p\u003e\n\n\u003cp\u003eA public Metasploit Framework module already connects to vulnerable Langflow MCP endpoints without credentials, opens a session, and lists available tools, though it does not execute commands. Langflow\u0026rsquo;s automatic-login setting was enabled by default in version 1.12.8 and can log users in as superusers; version 1.13.0 turns it off by default. Version 1.13.0, released on October 22, is the only stated fix for these four issues, and IBM offers no workaround for organizations unable to upgrade.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["IBM reported that Langflow versions 1.0.0 through 1.12.8 contain four vulnerabilities, including two critical issues rated 9.8 that do not require an account.","CVE-2026-93680 can bypass authentication, while CVE-2026-110186 can allow unauthenticated remote code execution through Model Context Protocol tool enumeration.","A public Metasploit Framework module for CVE-2026-93680 can connect to Langflow's MCP endpoint without credentials, start a session, and list available tools.","Langflow 1.13.0, released on October 22, is the only stated fix for the four flaws, and IBM provides no workaround for organizations that cannot upgrade.","Langflow 1.13.0 disables automatic login by default; the setting was enabled by default in version 1.12.8 and can log users in as superusers without prompting for sign-in."],"insights":["Version 1.12.8 was released on the same day as 1.13.0 but still contains the critical flaws, making an upgrade specifically to 1.13.0 necessary rather than simply moving to the latest 1.12 release.","Automatic login was enabled by default in Langflow 1.12.8 and logs users in as superusers; IBM’s bulletin does not clarify whether servers with that setting disabled remain vulnerable.","A public Metasploit module already supports unauthenticated access to Langflow’s MCP endpoint for CVE-2026-93680, although the module itself only starts a session and enumerates available tools rather than executing commands.","Organizations upgrading from automatic login need to prepare existing accounts for password sign-in, and Langflow warns that deleting or reinstalling the product to recover access can permanently remove saved flows."],"referencedReports":[{"title":"Security Bulletin: Langflow OSS Affected by Multiple Vulnerabilities","url":"https://www.ibm.com/support/pages/security-bulletin-langflow-oss-affected-multiple-vulnerabilities-2","publisher":"ibm","context":"The article relies on IBM's security bulletin for details of four Langflow vulnerabilities, their severity ratings, affected versions, and the lack of a workaround.","category":"advisory","primary":true},{"title":"Langflow Installation and Upgrade Guidance","url":"https://docs.langflow.org/get-started-installation","publisher":"langflow","context":"The article references Langflow's guidance for preparing automatic-login accounts for password sign-in and recovering access after an upgrade.","category":"guide","primary":false}],"body":"\u003cp\u003eIBM reported four Langflow vulnerabilities affecting every release from 1.0.0 through 1.12.8, including two critical issues rated 9.8. CVE-2026-93680 can let an unauthenticated attacker bypass authentication, while CVE-2026-110186 can allow unauthenticated remote code execution through Model Context Protocol tool enumeration. The other issues could allow a low-privileged user to cause operating-system commands to run on the server or obtain sensitive information from insufficiently protected credentials.\u003c/p\u003e\n\n\u003cp\u003eA public Metasploit Framework module already connects to vulnerable Langflow MCP endpoints without credentials, opens a session, and lists available tools, though it does not execute commands. Langflow\u0026rsquo;s automatic-login setting was enabled by default in version 1.12.8 and can log users in as superusers; version 1.13.0 turns it off by default. Version 1.13.0, released on October 22, is the only stated fix for these four issues, and IBM offers no workaround for organizations unable to upgrade.\u003c/p\u003e\n"},{"n":1,"title":"Hackers disrupt refrigeration systems at European supermarkets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-disrupt-refrigeration-systems-at-european-supermarkets/","time":"14:28","priority":"SHOULD READ","score":84,"tldr":"A cyberattack remotely altered refrigeration controls at more than 115 supermarkets and shops across several European countries, causing freezers to shut down, defrost, or heat up and leading to product losses. The incidents may exploit the same weakness recently used against French stores’ Danfoss and Dixell refrigeration controllers.","briefOverview":"\u003cp\u003eA cyberattack disrupted freezer and refrigeration systems at more than 115 supermarkets and other shops in Belgium, the Netherlands, Sweden, Luxembourg, Ireland, and Estonia. Hackers remotely changed temperature settings, shut down refrigerators, or activated defrosting functions, causing temperatures to rise and creating significant product losses. Affected chains included ICA, Coop, Ahold Delhaize, Carrefour, Spar Colruyt, Intermarché, SuperValu, and Selver, while at least 17 Dutch butcher shops and neighborhood stores were also affected.\u003c/p\u003e\n\n\u003cp\u003eStores took steps including discarding frozen food, using refrigerated trucks to preserve stock, and disconnecting affected installations. An ICA manager said freezer settings had been changed to +50°C and could not be modified, while Coop reported one system began generating heat. Sabcobel director Stephan Moelans said the attacker used the same vulnerability involved in French supermarket incidents the previous month, which affected Danfoss AK-SM/AK-SC and Copeland/Dixell XWEB controllers by setting them to defrost mode.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack disrupted refrigeration and freezer systems at more than 115 stores in Belgium, the Netherlands, Sweden, Luxembourg, Ireland, and Estonia.","Affected equipment was reportedly shut down, placed into defrost mode, or had its temperature settings changed, leading to rising temperatures and product losses.","ICA, Coop, Ahold Delhaize, Carrefour, Spar Colruyt, Intermarché, SuperValu, and Selver confirmed refrigeration problems at some of their stores.","An ICA store manager said freezer settings were changed overnight to +50°C and could not be modified, forcing the store to discard frozen food.","Sabcobel director Stephan Moelans said the attacker used the same weakness involved in similar attacks on French supermarkets the previous month."],"insights":["The affected stores span multiple independent supermarket chains and countries, while ICA said impacted stores operated outside its central network, indicating that the disruption was not limited to one retailer’s core systems.","The incident had immediate physical consequences: one Coop refrigeration system began generating heat, and an ICA manager reported freezer settings changed to +50°C, requiring frozen food to be discarded.","Sabcobel’s director said remotely activating defrost functions was involved and that disconnecting affected installations required technicians, highlighting that recovery could require on-site action rather than only a software update.","According to Sabcobel, protecting some refrigeration systems requires physical modifications in addition to software updates, while secure internet connections were presented as the simplest management solution."],"referencedReports":[{"title":"CERTFR-2026-ALE-012","url":"https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012","publisher":"cert-fr","context":"The article cites this CERT-FR alert when describing the Danfoss and Copeland/Dixell refrigeration controllers affected in the prior French supermarket attacks.","category":"advisory","primary":false}],"body":"\u003cp\u003eA cyberattack disrupted freezer and refrigeration systems at more than 115 supermarkets and other shops in Belgium, the Netherlands, Sweden, Luxembourg, Ireland, and Estonia. Hackers remotely changed temperature settings, shut down refrigerators, or activated defrosting functions, causing temperatures to rise and creating significant product losses. Affected chains included ICA, Coop, Ahold Delhaize, Carrefour, Spar Colruyt, Intermarché, SuperValu, and Selver, while at least 17 Dutch butcher shops and neighborhood stores were also affected.\u003c/p\u003e\n\n\u003cp\u003eStores took steps including discarding frozen food, using refrigerated trucks to preserve stock, and disconnecting affected installations. An ICA manager said freezer settings had been changed to +50°C and could not be modified, while Coop reported one system began generating heat. Sabcobel director Stephan Moelans said the attacker used the same vulnerability involved in French supermarket incidents the previous month, which affected Danfoss AK-SM/AK-SC and Copeland/Dixell XWEB controllers by setting them to defrost mode.\u003c/p\u003e\n"},{"n":14,"title":"Largest crypto exchange in Brazil confirms cyberattack as millions flow out of platform","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/mercado-bitcoin-brazil-cryptocurrency-heist","time":"21:42","priority":"SHOULD READ","score":84,"tldr":"Brazilian crypto exchange Mercado Bitcoin halted deposits and withdrawals after a cyberattack, with blockchain analysts estimating that more than $46 million was moved from the platform. The company says customers were not harmed, but security researchers report evidence that some customer wallets were drained.","briefOverview":"\u003cp\u003eMercado Bitcoin, which describes itself as Latin America’s largest digital-assets investment platform, suspended deposits and withdrawals after a cybersecurity incident on Monday. Blockchain security companies said that more than $46 million left the platform late Sunday, though Mercado Bitcoin did not confirm that amount. The company said it was investigating, tracking the assets, working with authorities, and expected to restore the platform in the coming days.\u003c/p\u003e\n\n\u003cp\u003eMercado Bitcoin said the incident neither harmed customers nor exposed data, but security experts disputed that assessment and cited blockchain transaction records indicating that some customer wallets were drained. Tether said it froze about \u003cspan class=\"math inline\"\u003e\\(4.5 million connected to the incident, while other platforms froze another \\)\u003c/span\u003e2 million, and Chainalysis said it was tracking the funds to help identify and disrupt them. The event follows several major recent cryptocurrency-platform thefts, while Chainalysis itself disclosed a separate recent incident in which attackers used AI-backed tools to access internal systems and obtain user-related information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mercado Bitcoin suspended deposits and withdrawals after confirming a cybersecurity incident on Monday morning.","Blockchain security companies reported that more than $46 million left Mercado Bitcoin late Sunday, although the company did not confirm that amount.","Mercado Bitcoin said the incident did not harm customers or expose data, but security experts cited blockchain records indicating that some customer wallets were drained.","Tether froze about $4.5 million linked to the incident, while other platforms froze another roughly $2 million.","Mercado Bitcoin said it is investigating, tracking the assets, coordinating with authorities, and expects to restore the platform in the coming days."],"insights":["Mercado Bitcoin’s assertion that customers were unharmed was publicly challenged by blockchain security experts, who pointed to transaction records they said showed funds leaving some customer wallets.","The public and traceable nature of the stolen digital-currency transfers enabled Tether and other platforms to freeze approximately $6.5 million of the funds soon after the incident.","The incident occurred amid several recent large cryptocurrency-platform thefts, including a reported $6.3 billion theft from Binance that U.S. authorities attributed to North Korean hackers.","Chainalysis, which is helping track the Mercado Bitcoin funds, reported its own recent incident in which attackers used AI-backed tools to access internal systems and obtain user-related information."],"referencedReports":[],"body":"\u003cp\u003eMercado Bitcoin, which describes itself as Latin America’s largest digital-assets investment platform, suspended deposits and withdrawals after a cybersecurity incident on Monday. Blockchain security companies said that more than $46 million left the platform late Sunday, though Mercado Bitcoin did not confirm that amount. The company said it was investigating, tracking the assets, working with authorities, and expected to restore the platform in the coming days.\u003c/p\u003e\n\n\u003cp\u003eMercado Bitcoin said the incident neither harmed customers nor exposed data, but security experts disputed that assessment and cited blockchain transaction records indicating that some customer wallets were drained. Tether said it froze about \u003cspan class=\"math inline\"\u003e\\(4.5 million connected to the incident, while other platforms froze another \\)\u003c/span\u003e2 million, and Chainalysis said it was tracking the funds to help identify and disrupt them. The event follows several major recent cryptocurrency-platform thefts, while Chainalysis itself disclosed a separate recent incident in which attackers used AI-backed tools to access internal systems and obtain user-related information.\u003c/p\u003e\n"},{"n":19,"title":"Government Linux Servers Targeted With SysGoRAT and Suspected AI-Generated Scripts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/government-linux-servers-targeted-with.html","time":"10:49","priority":"SHOULD READ","score":84,"tldr":"Palo Alto Networks uncovered CL-UNK-1211, an espionage campaign targeting government-linked Linux servers with the SysGoRAT backdoor, web shells, credential theft, mailbox collection, and persistence mechanisms. Researchers say scripts with conversational reasoning notes may indicate attackers used AI tools or autonomous agents to rapidly generate and deploy post-exploitation code.","briefOverview":"\u003cp\u003ePalo Alto Networks Unit 42 reported that a cyber-espionage cluster tracked as CL-UNK-1211 targeted Linux infrastructure linked to government entities and state-affiliated organizations between October 2025 and April 2026. The operators conducted reconnaissance, sought to maintain long-term access, attempted to dump sensitive databases, and targeted government mailboxes in an effort to access social-media accounts. Unit 42 said the campaign combined open-source tools, custom backdoors, and web shells, while also attempting to disable endpoint protections, erase logs, and leave deceptive red-team markers.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used malicious PHP and shell scripts for persistence, reconnaissance, credential collection, and data theft, with several scripts containing conversational explanations of their logic. Unit 42 said these notes suggest the scripts may have been copied from an AI prompt response or deployed by an automated AI agent. The campaign also used SysGoRAT, a custom Go-based remote-access trojan for Windows and Linux that connects to a hard-coded command-and-control address and can execute commands, provide interactive shells, transfer files, establish persistence, and relay network traffic.\u003c/p\u003e\n\n\u003cp\u003eCredential theft methods included replacing \u003ccode\u003e.bashrc\u003c/code\u003e with a malicious version, adding password-harvesting code to PHP login pages, and searching configuration files and command history for cleartext credentials. The attackers also searched mail directories and deployed a PHP script to identify social-media-related emails, although a separate script intended to compress collected mail failed because of syntax errors. Unit 42 described the activity as an example of attackers combining conventional post-compromise methods with AI-accelerated workflows to increase operational speed while reducing manual development work.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks Unit 42 tracked a cyber-espionage campaign called CL-UNK-1211 targeting Linux infrastructure associated with government entities and state-affiliated organizations between October 2025 and April 2026.","The attackers used PHP and shell scripts, some containing conversational reasoning notes that Unit 42 said may indicate code copied from AI output or deployed by an automated AI agent.","The campaign used a custom Go-based remote-access trojan called SysGoRAT, which connects over WebSocket to a hard-coded command-and-control address and works on both Linux and Windows.","The attackers sought credentials by replacing .bashrc files, inserting credential-harvesting code into PHP login pages, and searching configuration and command-history files for cleartext passwords.","The activity included attempts to collect government mailboxes and social-media-related emails, while also disabling endpoint protections, deleting system logs, and using deceptive red-team markers."],"insights":["Conversational, step-by-step reasoning embedded in malicious scripts gave Unit 42 a potential indicator that the code was copied directly from an AI response or deployed through an automated AI agent.","The attackers paired credential theft with targeted mailbox searches for social-media-related messages, indicating that email content and associated account access were both collection priorities.","SysGoRAT’s ability to run on Linux and Windows, establish interactive shells, transfer files, and relay traffic through arbitrary TCP connections gave the operators a single backdoor with multiple ways to maintain and extend access.","The attackers tried to make their activity resemble an authorized security assessment by planting deceptive red-team markers while also disabling protections and deleting logs, which could complicate incident investigation.","AI-assisted tooling did not eliminate operational mistakes: the attempted zip_mails.sh email-collection script contained syntax errors and failed to run."],"referencedReports":[{"title":"AI Campaign Targets Linux Infrastructure","url":"https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/","publisher":"palo-alto-networks-unit-42","context":"The article relies on Unit 42's technical analysis of the CL-UNK-1211 campaign targeting government-linked Linux infrastructure.","category":"research","primary":true},{"title":"ARTEX and Friends: Enter Agentic Offensive Frameworks","url":"https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks","publisher":"google-threat-intelligence-group-and-mandiant","context":"The article cites this analysis for reporting on threat actors' use of open-source agentic penetration-testing frameworks, including ARTEX and PentAGI.","category":"research","primary":false},{"title":"Tracking AI Adoption in North Korean Threat Actor Tradecraft","url":"https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/","publisher":"microsoft","context":"The article references Microsoft's reporting that North Korean groups such as Onyx Sleet and Pearl Sleet used ARTEX in operations.","category":"research","primary":false}],"body":"\u003cp\u003ePalo Alto Networks Unit 42 reported that a cyber-espionage cluster tracked as CL-UNK-1211 targeted Linux infrastructure linked to government entities and state-affiliated organizations between October 2025 and April 2026. The operators conducted reconnaissance, sought to maintain long-term access, attempted to dump sensitive databases, and targeted government mailboxes in an effort to access social-media accounts. Unit 42 said the campaign combined open-source tools, custom backdoors, and web shells, while also attempting to disable endpoint protections, erase logs, and leave deceptive red-team markers.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used malicious PHP and shell scripts for persistence, reconnaissance, credential collection, and data theft, with several scripts containing conversational explanations of their logic. Unit 42 said these notes suggest the scripts may have been copied from an AI prompt response or deployed by an automated AI agent. The campaign also used SysGoRAT, a custom Go-based remote-access trojan for Windows and Linux that connects to a hard-coded command-and-control address and can execute commands, provide interactive shells, transfer files, establish persistence, and relay network traffic.\u003c/p\u003e\n\n\u003cp\u003eCredential theft methods included replacing \u003ccode\u003e.bashrc\u003c/code\u003e with a malicious version, adding password-harvesting code to PHP login pages, and searching configuration files and command history for cleartext credentials. The attackers also searched mail directories and deployed a PHP script to identify social-media-related emails, although a separate script intended to compress collected mail failed because of syntax errors. Unit 42 described the activity as an example of attackers combining conventional post-compromise methods with AI-accelerated workflows to increase operational speed while reducing manual development work.\u003c/p\u003e\n"},{"n":20,"title":"Attackers Pose as IT Support on Microsoft Teams, Abuse AD CS to Steal Company Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-pose-as-it-support-on.html","time":"11:08","priority":"SHOULD READ","score":84,"tldr":"Attackers impersonated IT support on Microsoft Teams to gain remote access through Quick Assist, then abused insecure Active Directory Certificate Services configurations to obtain privileged certificates, access domain controllers, and exfiltrate data. Organizations should harden AD CS against ESC1 and ESC8, restrict external Teams contact and remote-support tools, and ensure no privileged identities are excluded from containment.","briefOverview":"\u003cp\u003eMicrosoft investigated two intrusions in which attackers posed as internal IT support through Microsoft Teams and persuaded employees to provide Quick Assist connection codes. The attackers then gained hands-on control of employee workstations and used insecure Active Directory Certificate Services (AD CS) settings to obtain login certificates for privileged accounts. Microsoft said one incident resulted in company data being copied to an external server, and it did not attribute the activity to a known group.\u003c/p\u003e\n\n\u003cp\u003eIn the first case, attackers abused an ESC1 certificate template to impersonate privileged accounts, accessed a domain controller, began DCSync activity, and used a renamed Rclone tool to copy files to an external SFTP server. In the second, they used PetitPotam to coerce a domain controller authentication and relayed it to an AD CS web enrollment endpoint, an ESC8 technique, to obtain a certificate for the domain controller; isolating the compromised workstation stopped further activity. Microsoft recommended verifying unexpected support requests, restricting external Teams contact and remote-support tools, securing AD CS templates and enrollment endpoints, auditing certificate activity, and ensuring that any account excluded from automatic containment receives a manual response.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers impersonated internal IT or help-desk staff through Microsoft Teams and persuaded employees to provide Quick Assist connection codes, giving them remote control of workstations.","Microsoft investigated two intrusions in which attackers abused insecure Active Directory Certificate Services configurations to obtain certificates for privileged accounts or a domain controller.","In the first intrusion, attackers exploited an ESC1 certificate template, performed DCSync on a domain controller, and used a renamed Rclone utility to transfer company data from a file share to an external SFTP server.","In the second intrusion, attackers used PetitPotam and NTLM relay against an AD CS web enrollment endpoint to obtain a domain-controller certificate, but workstation isolation stopped further activity.","Microsoft recommends restricting external Teams contact and remote-support tools, reviewing certificate-template permissions, enabling HTTPS and Extended Protection for Authentication on enrollment endpoints, and auditing certificate issuance."],"insights":["A certificate obtained through a weak Active Directory Certificate Services template can remain usable even after the associated account password is reset or the originally compromised computer is wiped.","Containing most compromised privileged accounts was insufficient in the first case because one excluded account remained usable and enabled continued access and data theft.","The attackers signed in to a domain controller and began copying Active Directory password data within seconds of obtaining a certificate, showing how little time defenders may have after certificate abuse is detected.","Revoking a maliciously issued certificate does not invalidate Kerberos tickets that were already issued, so organizations must also review active tickets during response.","Windows Server 2025 enables Extended Protection for Authentication by default for Active Directory Certificate Services, while Windows Server 2019 and 2022 require it to be enabled manually."],"referencedReports":[{"title":"Help desk impersonation and AD CS abuse: Investigating ESC1 and ESC8 intrusion paths","url":"https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/","publisher":"microsoft","context":"Microsoft's report is the primary source for the two investigated intrusions involving Teams help-desk impersonation and AD CS certificate abuse.","category":"research","primary":true},{"title":"Certified Pre-Owned","url":"https://specterops.io/research/certified-pre-owned/","publisher":"specterops","context":"The article cites this research as the 2021 work that named the ESC1 and ESC8 Active Directory Certificate Services weaknesses.","category":"research","primary":false},{"title":"KB5005413: Mitigating NTLM Relay Attacks on Active Directory Certificate Services (AD CS)","url":"https://support.microsoft.com/en-us/topic/kb5005413-mitigating-ntlm-relay-attacks-on-active-directory-certificate-services-ad-cs-3612b773-4043-4aa9-b23d-b87910cd3429","publisher":"microsoft","context":"The article points to Microsoft's guidance for mitigating NTLM relay attacks against AD CS enrollment endpoints.","category":"advisory","primary":false},{"title":"Cross-tenant help desk impersonation and data exfiltration: Human-operated intrusion playbook","url":"https://www.microsoft.com/en-us/security/blog/2026/04/18/crosstenant-helpdesk-impersonation-data-exfiltration-human-operated-intrusion-playbook/","publisher":"microsoft","context":"The article references this earlier Microsoft technical analysis as documentation of the Teams help-desk impersonation and remote-access entry method.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft investigated two intrusions in which attackers posed as internal IT support through Microsoft Teams and persuaded employees to provide Quick Assist connection codes. The attackers then gained hands-on control of employee workstations and used insecure Active Directory Certificate Services (AD CS) settings to obtain login certificates for privileged accounts. Microsoft said one incident resulted in company data being copied to an external server, and it did not attribute the activity to a known group.\u003c/p\u003e\n\n\u003cp\u003eIn the first case, attackers abused an ESC1 certificate template to impersonate privileged accounts, accessed a domain controller, began DCSync activity, and used a renamed Rclone tool to copy files to an external SFTP server. In the second, they used PetitPotam to coerce a domain controller authentication and relayed it to an AD CS web enrollment endpoint, an ESC8 technique, to obtain a certificate for the domain controller; isolating the compromised workstation stopped further activity. Microsoft recommended verifying unexpected support requests, restricting external Teams contact and remote-support tools, securing AD CS templates and enrollment endpoints, auditing certificate activity, and ensuring that any account excluded from automatic containment receives a manual response.\u003c/p\u003e\n"},{"n":22,"title":"DarkBlinders Compromises Israeli Target and Iraqi Kurdish Government Cloud Environment","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/darkblinders-compromises-israeli-target.html","time":"14:46","priority":"SHOULD READ","score":84,"tldr":"Iran-aligned DarkBlinders used tailored phishing, fake recruitment coding tests, and counterfeit software to compromise an Israeli target and an Iraqi Kurdish government cloud environment, deploying ShelbyLoader/ShelbyC2 and Blackwood. Researchers assess the activity may be linked to broader Iran-nexus clusters associated with APT34.","briefOverview":"\u003cp\u003eDream Research Labs reported that Iran-aligned DarkBlinders compromised a high-profile individual in Israel and additional targets in a government cloud environment in Iraq’s Kurdistan Region between August and October 2026. The group, active since at least September 2024, has previously targeted aviation and telecommunications organizations in the United Arab Emirates and Iraq. Researchers said the campaign combines credential phishing with malware delivery through government, webmail, and cloud-service lookalike domains. The activity underscores DarkBlinders’ continued focus on tailored social engineering against high-value and government-related targets.\u003c/p\u003e\n\n\u003cp\u003eDarkBlinders used fake recruitment outreach, malicious Visual Studio coding assessments, and a counterfeit videoconferencing application named StarkMeet to deliver its tools. Its attack chain used a malicious C# project file, AppDomainManager injection, and DLL sideloading to run ShelbyLoader V2, which then launched the ShelbyC2 backdoor and deployed the Blackwood tunneling utility. ShelbyC2 has been associated with GitHub-based command-and-control, data exfiltration, and remote control. Dream assessed with medium confidence that DarkBlinders overlaps with UNC5795 and Dust Specter, and that related clusters may be operationally connected to the broader APT34 group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dream Research Labs reported that Iran-aligned DarkBlinders compromised a high-profile individual in Israel and additional targets in a government cloud environment in the Kurdistan Region of Iraq between August and October 2026.","DarkBlinders uses targeted phishing and fraudulent downloads, including fake job-recruitment coding assessments and a counterfeit videoconferencing application called StarkMeet, to deliver its tools.","The campaign used a malicious Visual Studio project, a method that abuses an application loading feature, and DLL sideloading to run ShelbyLoader V2, which launches the ShelbyC2 rem
