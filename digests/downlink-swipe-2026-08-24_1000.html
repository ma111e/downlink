<script type="application/json" id="dl-articles">[{"n":1,"title":"The Phishing Email That Read Backwards in Its Own Source","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/css-bidi-override-source-reversal-esignature-lure-bot-check-gate","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonating an e-signature notice hid its visible English text by storing it backwards in the HTML and using CSS bidi override to render it normally, bypassing simple keyword and Unicode-control-character defenses. The lure passed email authentication and routed clicks through reputable trackers to a malicious bot-check page, showing why scanners need to compare rendered text with source and follow full redirect chains.","briefOverview":"\u003cp\u003eA senior executive at a national home-care services company received an e-signature completion notice that appeared ordinary, with a short heading and a button reading \u0026ldquo;View Completed Document.\u0026rdquo; In the raw HTML source, the visible text was stored backward, including \u003ccode\u003etnemucoD detelpmoC weiV\u003c/code\u003e, while CSS made it render as normal English. The article classifies the case as high-severity credential harvesting, brand impersonation, obfuscation, and email service provider abuse.\u003c/p\u003e\n\n\u003cp\u003eThe obfuscation used four inline spans with \u003ccode\u003eunicode-bidi:bidi-override; direction:rtl; display:inline-block\u003c/code\u003e, which caused reversed printable ASCII strings to display left-to-right to the recipient. The article stresses that this was not the better-known Unicode control-character technique, so stripping invisible or directional characters would not fix it. Because the inversion existed in the style layer rather than in unusual characters, ordinary keyword matching would not find the displayed phrases in the source.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF and DKIM through a large email service provider, and ARC was present and consistent, but the display name impersonated a cloud e-signature service while the authenticated domain was an unrelated aged business domain. The button link went through the provider\u0026rsquo;s click tracker, then a second commercial tracker, and finally to a shared-hosting page that the platform scanner marked malicious. The captured landing page showed a press-and-hold human-verification card, with no credential fields visible, and Themis returned an 84 percent confidence credential-theft classification.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A senior executive at a national home-care services company received an e-signature completion notice whose visible text rendered normally but was stored backward in the raw HTML source.","Four inline spans used the CSS declaration `unicode-bidi:bidi-override; direction:rtl; display:inline-block` to display reversed source strings as fluent English without using Unicode control characters.","The message passed SPF and DKIM through a large email service provider, but the display name impersonated a cloud e-signature service while the authenticated sending domain was an unrelated aged business domain.","The button link routed through the sending provider's click tracker, then through a second commercial tracking service, and finally to a shared-hosting page that the platform's scanner marked malicious.","The captured landing page showed a press-and-hold human-verification card, and no credential entry fields were visible in the capture."],"insights":["Stripping zero-width or directional Unicode characters would not detect this lure because the obfuscation was done with CSS styling while the stored text remained ordinary printable ASCII.","Defenses should compare the text a recipient sees with the text stored in the email source, then reverse and re-score content when inline styles use `unicode-bidi:bidi-override` or `direction:rtl` in an otherwise left-to-right message.","A message can pass SPF, DKIM, and ARC while still impersonating a brand through the display name, especially when there is no effective DMARC alignment policy for the sending arrangement.","Stopping URL analysis at reputable tracking services can miss the final malicious destination, because this click path passed through two shared trackers before reaching the page marked malicious.","The press-and-hold human-verification page acted as a gate, so the platform classified the case as credential theft even though the captured page did not show credential fields."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that phishing accounts for 16 percent of initial access vectors and the human element appears in 62 percent of breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance when recommending that unexpected document notices be verified inside the application rather than through an email button.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior executive at a national home-care services company received an e-signature completion notice that appeared ordinary, with a short heading and a button reading \u0026ldquo;View Completed Document.\u0026rdquo; In the raw HTML source, the visible text was stored backward, including \u003ccode\u003etnemucoD detelpmoC weiV\u003c/code\u003e, while CSS made it render as normal English. The article classifies the case as high-severity credential harvesting, brand impersonation, obfuscation, and email service provider abuse.\u003c/p\u003e\n\n\u003cp\u003eThe obfuscation used four inline spans with \u003ccode\u003eunicode-bidi:bidi-override; direction:rtl; display:inline-block\u003c/code\u003e, which caused reversed printable ASCII strings to display left-to-right to the recipient. The article stresses that this was not the better-known Unicode control-character technique, so stripping invisible or directional characters would not fix it. Because the inversion existed in the style layer rather than in unusual characters, ordinary keyword matching would not find the displayed phrases in the source.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF and DKIM through a large email service provider, and ARC was present and consistent, but the display name impersonated a cloud e-signature service while the authenticated domain was an unrelated aged business domain. The button link went through the provider\u0026rsquo;s click tracker, then a second commercial tracker, and finally to a shared-hosting page that the platform scanner marked malicious. The captured landing page showed a press-and-hold human-verification card, with no credential fields visible, and Themis returned an 84 percent confidence credential-theft classification.\u003c/p\u003e\n"},{"n":2,"title":"How Aikido finds more vulnerabilities than Claude Security at half the cost","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-finds-more-vulnerabilities-claude-security-mythos","time":"11:38","priority":"MAY READ","score":55,"tldr":"Aikido claims its Code Security Audit found more known vulnerabilities than Anthropic’s Claude Security and Codex Security on the same benchmark while costing significantly less. The main takeaway is that the design of the security-testing harness and cost controls can matter more than the underlying AI model alone.","briefOverview":"\u003cp\u003eAikido compared Anthropic’s Claude Security, which runs on Mythos, with Aikido Code Security Audit and Codex Security on the same private benchmark application. The benchmark contained 89 known vulnerabilities identified beforehand. Claude Security found 60 of 89 vulnerabilities for \u003cspan class=\"math inline\"\u003e\\(157, Aikido found 68 of 89 for \\)\u003c/span\u003e75, and Codex Security found 58 of 89 for $125.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that vulnerability discovery depends heavily on the system around the model, not only on model capability. Aikido says its approach uses lower-cost, smaller models for tasks where they are best suited and reserves expensive frontier reasoning for stages where it is most likely to affect the outcome. The article says this let Aikido spend more of its budget on broader investigation, resulting in higher recall.\u003c/p\u003e\n\n\u003cp\u003eAikido found eight more vulnerabilities than Claude Security, including one critical issue and three high-severity issues. The article highlights a critical cross-tenant authorization flaw that could let users change their organization assignment and access another organization’s data, as well as a timestamp-format mismatch that allowed expired API keys to remain valid. It also emphasizes cost predictability, stating that Aikido provides a pre-scan estimate and adjustable coverage level, while the Claude Security run showed the cost only after completion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido compared its Code Security Audit against Anthropic’s Claude Security running on Mythos and Codex Security on the same private benchmark application with 89 known vulnerabilities.","Aikido’s Code Security Audit found 68 of 89 vulnerabilities for $75, while Claude Security found 60 of 89 for $157 and Codex Security found 58 of 89 for $125.","Aikido found eight more vulnerabilities than Claude Security, including one critical and three high-severity issues.","The article says Aikido’s approach uses lower-cost, smaller models for tasks where they are best suited and reserves expensive frontier reasoning for stages where it is most likely to affect the outcome.","The article says Claude Security did not provide a cost estimate before the run, while Aikido estimates scan cost beforehand and lets users adjust the coverage level before committing."],"insights":["Using the strongest available model did not produce the best result in this benchmark, because Aikido’s broader search across more independent leads found more vulnerabilities than Claude Security running on Mythos.","Cost predictability is presented as a practical differentiator, since Aikido shows an estimated scan cost and lets users adjust coverage before running, while Claude Security revealed the final cost only after completion.","The article highlights that missed findings were not only low-impact issues, since Aikido found a critical cross-tenant authorization flaw and a timestamp-format issue that allowed expired API keys to remain valid.","The benchmark suggests that spending more of the budget on breadth of investigation can improve vulnerability recall compared with applying expensive frontier reasoning more broadly."],"referencedReports":[],"body":"\u003cp\u003eAikido compared Anthropic’s Claude Security, which runs on Mythos, with Aikido Code Security Audit and Codex Security on the same private benchmark application. The benchmark contained 89 known vulnerabilities identified beforehand. Claude Security found 60 of 89 vulnerabilities for \u003cspan class=\"math inline\"\u003e\\(157, Aikido found 68 of 89 for \\)\u003c/span\u003e75, and Codex Security found 58 of 89 for $125.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that vulnerability discovery depends heavily on the system around the model, not only on model capability. Aikido says its approach uses lower-cost, smaller models for tasks where they are best suited and reserves expensive frontier reasoning for stages where it is most likely to affect the outcome. The article says this let Aikido spend more of its budget on broader investigation, resulting in higher recall.\u003c/p\u003e\n\n\u003cp\u003eAikido found eight more vulnerabilities than Claude Security, including one critical issue and three high-severity issues. The article highlights a critical cross-tenant authorization flaw that could let users change their organization assignment and access another organization’s data, as well as a timestamp-format mismatch that allowed expired API keys to remain valid. It also emphasizes cost predictability, stating that Aikido provides a pre-scan estimate and adjustable coverage level, while the Claude Security run showed the cost only after completion.\u003c/p\u003e\n"},{"n":3,"title":"Danglegeddon: The Full Research Report Is Now Available","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/news/danglegeddon-the-full-research-report-is-now-available/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=danglegeddon-the-full-research-report-is-now-available","time":"10:21","priority":"MAY READ","score":55,"tldr":"Silent Push has released its full Danglegeddon research report on how forgotten dangling DNS records can enable subdomain takeovers. The report explains the simulated takeover technique, attacker impact, and defender steps for SOC, IR, and CTI teams.","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push researchers ran a dangling DNS takeover simulation to demonstrate how forgotten infrastructure can become an entry point.","Silent Push has published the full findings in its latest Danglegeddon research report.","The article explains that dangling DNS records are left behind when infrastructure changes and the pointer is not cleaned up.","The report covers the takeover technique Silent Push simulated, what an attacker gains after gaining a foothold, and steps defenders can add to their playbook.","The article says the report is relevant for teams running SOC, incident response, or cyber threat intelligence workflows."],"insights":["Forgotten DNS pointers are presented as an operational cleanup failure that can directly create an attacker entry point after infrastructure changes.","The article emphasizes that attackers are already scanning for dangling DNS records and are becoming faster at finding them, making delayed cleanup increasingly risky.","Silent Push frames dangling DNS review as relevant not only to infrastructure owners but also to SOC, incident response, and cyber threat intelligence workflows.","The report is positioned as actionable because it includes both the simulated takeover technique and defender playbook steps."],"referencedReports":[],"body":""}]</script>
