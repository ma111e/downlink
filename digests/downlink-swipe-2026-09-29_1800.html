<script type="application/json" id="dl-articles">[{"n":15,"title":"Microsoft Breach by Midnight Blizzard (APT29): What Happened?","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/microsoft-breach-by-midnight-blizzard-apt29-what-happened-and-what-now","time":"21:23","priority":"SHOULD READ","score":84,"tldr":"Midnight Blizzard (APT29) reportedly used password spraying against a poorly secured Microsoft test tenant, then abused legacy OAuth app permissions and Entra ID roles to create persistent malicious applications with broad Exchange Online mailbox access. The incident highlights the need for MFA everywhere, strict least-privilege controls, and continuous auditing of app registrations, service principals, and consent grants.","briefOverview":"\u003cp\u003eThe article describes a campaign against Microsoft attributed to Midnight Blizzard, also known as APT29 or Cozy Bear, which it links to Russia’s Foreign Intelligence Service. The attackers reportedly gained initial access by password spraying a non-production test tenant that lacked multi-factor authentication. The article presents the incident as an example of how a less-protected test environment can become an entry point into a corporate environment.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers allegedly abused a legacy OAuth application and elevated Microsoft Entra ID permissions to create a new user and assign high-privilege roles. They then created malicious OAuth applications, obtained consent for them, and granted them the Office 365 Exchange Online \u003ccode\u003efull_access_as_app\u003c/code\u003e permission, which the article says enabled access to corporate mailboxes. The article recommends enforcing MFA, applying least privilege, auditing users, applications, service principals, and permissions, monitoring unusual consent and application activity, and securing legacy and test systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article attributes the Microsoft campaign to Midnight Blizzard, also known as APT29 or Cozy Bear, and describes the group as linked to Russia’s Foreign Intelligence Service (SVR).","The attackers obtained initial access by password spraying a non-production Microsoft test tenant that lacked multi-factor authentication.","The article says the attackers abused a legacy OAuth application and Microsoft Entra ID permissions to create a new user and assign high-privilege roles in Microsoft’s corporate tenant.","The attackers created malicious OAuth applications and granted them the Office 365 Exchange Online full_access_as_app permission, enabling access to corporate mailboxes.","The article recommends enforcing multi-factor authentication, auditing permissions and application registrations, monitoring unusual activity, and securing legacy and test systems."],"insights":["A less-protected test tenant can serve as a bridge into a corporate environment when it contains legacy applications with elevated permissions.","Several directory and application permissions can be combined to create users, assign powerful roles, and authorize applications to access sensitive resources such as mailboxes.","Creating multiple malicious OAuth applications gives attackers redundant access paths, making full removal more difficult if only one application is discovered.","A newly created administrative user can be used to approve malicious applications, causing service accounts for those applications to be established inside the corporate tenant.","Monitoring new application registrations, unusual consent activity, and high-risk permission grants can reveal this attack path before mailbox access is used."],"referencedReports":[],"body":"\u003cp\u003eThe article describes a campaign against Microsoft attributed to Midnight Blizzard, also known as APT29 or Cozy Bear, which it links to Russia’s Foreign Intelligence Service. The attackers reportedly gained initial access by password spraying a non-production test tenant that lacked multi-factor authentication. The article presents the incident as an example of how a less-protected test environment can become an entry point into a corporate environment.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers allegedly abused a legacy OAuth application and elevated Microsoft Entra ID permissions to create a new user and assign high-privilege roles. They then created malicious OAuth applications, obtained consent for them, and granted them the Office 365 Exchange Online \u003ccode\u003efull_access_as_app\u003c/code\u003e permission, which the article says enabled access to corporate mailboxes. The article recommends enforcing MFA, applying least privilege, auditing users, applications, service principals, and permissions, monitoring unusual consent and application activity, and securing legacy and test systems.\u003c/p\u003e\n"},{"n":13,"title":"How Okta Passwords Can Be Compromised:  Uncovering a Risk to User Data","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/how-okta-passwords-can-be-compromised-uncovering-a-risk-to-user-data","time":"21:23","priority":"SHOULD READ","score":82,"tldr":"Okta audit logs can store passwords in plaintext when users mistakenly enter them in the username field during a failed login, exposing credentials to anyone with access to those logs or forwarded SIEM data. Organizations should identify and rotate affected credentials, restrict log access, and enforce phishing-resistant MFA.","briefOverview":"\u003cp\u003eMitiga researchers found that Okta audit logs can contain passwords in plaintext when users accidentally enter their password in the username field during a failed login. The failed request records the erroneous username value, while a later successful login may record the user’s actual username. Mitiga reported finding hundreds of potentially exposed passwords and credentials for customers, including administrator-level users.\u003c/p\u003e\n\n\u003cp\u003eThe risk affects anyone able to read Okta audit logs, including users of SIEM platforms where the logs are forwarded and third-party services with Okta Read-only Administrator permissions. An attacker could use obtained credentials to attempt access to Okta-connected applications or seek higher privileges if an administrator password is exposed. Mitiga recommends using its detection query to identify possible exposures, rotating affected passwords, limiting and monitoring log access, educating users, and enforcing MFA; Okta also recommends username-field validation, clear labels, FastPass, and phishing-resistant MFA.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta audit logs can record a password in plaintext when a user mistakenly enters it in the username field during a failed login attempt.","People who can read Okta audit logs, including through a SIEM system where those logs are forwarded, may be able to access exposed user passwords.","Mitiga reported identifying hundreds of potentially leaked passwords and credentials for customers, including administrator-level users, by matching failed and successful login events.","Multi-factor authentication can reduce the risk from exposed passwords, but the article notes that phishing, repeated approval requests, and session hijacking may still be used to bypass it.","Mitiga recommends identifying affected users with its query, rotating their passwords, limiting and monitoring access to logs, educating users, and enabling MFA."],"insights":["The exposure can extend beyond Okta administrators because audit logs are often forwarded to SIEM platforms, where read-only security personnel may be able to see the logged values.","Mitiga’s detection method links a failed login containing a likely password to a later successful login using the date, hour, device fingerprint, source IP address, and user agent.","A third-party product with Okta’s Read-only Administrator role may be able to read audit logs, so a breach of that service could expose credentials found in the logs.","The article notes that access to login patterns in the logs could let an attacker send an MFA approval request shortly after a genuine login, making it appear more legitimate to the user.","Okta recommends custom username-character restrictions, clear field labels, and FastPass to reduce the chance that users enter passwords in the username field."],"referencedReports":[],"body":"\u003cp\u003eMitiga researchers found that Okta audit logs can contain passwords in plaintext when users accidentally enter their password in the username field during a failed login. The failed request records the erroneous username value, while a later successful login may record the user’s actual username. Mitiga reported finding hundreds of potentially exposed passwords and credentials for customers, including administrator-level users.\u003c/p\u003e\n\n\u003cp\u003eThe risk affects anyone able to read Okta audit logs, including users of SIEM platforms where the logs are forwarded and third-party services with Okta Read-only Administrator permissions. An attacker could use obtained credentials to attempt access to Okta-connected applications or seek higher privileges if an administrator password is exposed. Mitiga recommends using its detection query to identify possible exposures, rotating affected passwords, limiting and monitoring log access, educating users, and enforcing MFA; Okta also recommends username-field validation, clear labels, FastPass, and phishing-resistant MFA.\u003c/p\u003e\n"},{"n":4,"title":"Former US Air Force members sent to prison over BEC attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/former-us-air-force-members-sent-to-prison-over-bec-attacks/","time":"18:09","priority":"MAY READ","score":69,"tldr":"Two former U.S. Air Force members received combined prison sentences of 189 months for running business email compromise and phishing schemes that diverted millions of dollars in corporate payments.","briefOverview":"\u003cp\u003eFormer U.S. Air Force members Chijioke Timothy Odimegwu and Harafat Mogaji were sentenced to a combined 189 months in federal prison for business email compromise scams and phishing campaigns. Odimegwu received 111 months and was ordered to pay \u003cspan class=\"math inline\"\u003e\\(366,617.59 in restitution, while Mogaji received 78 months and was ordered to pay \\)\u003c/span\u003e995,680.45. Both will also serve three years of supervised release after their prison terms.\u003c/p\u003e\n\n\u003cp\u003eWhile stationed at Dover Air Force Base in Delaware, they stole employee email credentials and used spoofed addresses resembling business partners to redirect payments to accounts controlled by accomplices in the United States and abroad. The conspiracy diverted more than \u003cspan class=\"math inline\"\u003e\\(1.68 million from a victim in Iowa City and more than \\)\u003c/span\u003e720,000 from a victim in Ohio, in addition to other attempted diversions. The FBI\u0026rsquo;s 2025 Internet Crime Report recorded 24,768 business email compromise complaints and more than $3 billion in losses, underscoring the financial impact of these schemes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former U.S. Air Force members Chijioke Timothy Odimegwu and Harafat Mogaji were sentenced to 111 months and 78 months in federal prison, respectively, for their roles in business email compromise scams and phishing campaigns.","While stationed at Dover Air Force Base in Delaware, the defendants stole employee email credentials and used spoofed business-partner email addresses to redirect payments to accounts controlled by accomplices.","The conspiracy diverted more than $1.68 million from an Iowa City victim and more than $720,000 from an Ohio victim, according to the Department of Justice.","Odimegwu was ordered to pay $366,617.59 in restitution and Mogaji was ordered to pay $995,680.45, and both will serve three years of supervised release after prison.","The FBI recorded 24,768 business email compromise complaints and more than $3 billion in related losses in its 2025 Internet Crime Report."],"insights":["The scheme combined stolen employee email credentials with lookalike business-partner addresses, showing how fraudulent payment-change requests can appear credible to billing departments.","The conspirators rapidly drained or moved diverted funds through accomplice-controlled accounts, a practice described as helping evade court-ordered account freezes.","The defendants carried out the activity while stationed at Dover Air Force Base, demonstrating that the scheme was conducted from within a U.S. military installation.","Business email compromise remained a high-impact crime in 2025, with the FBI recording 24,768 complaints and more than $3 billion in losses."],"referencedReports":[{"title":"2025 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for 2025 business email compromise complaint and loss figures.","category":"research","primary":false}],"body":"\u003cp\u003eFormer U.S. Air Force members Chijioke Timothy Odimegwu and Harafat Mogaji were sentenced to a combined 189 months in federal prison for business email compromise scams and phishing campaigns. Odimegwu received 111 months and was ordered to pay \u003cspan class=\"math inline\"\u003e\\(366,617.59 in restitution, while Mogaji received 78 months and was ordered to pay \\)\u003c/span\u003e995,680.45. Both will also serve three years of supervised release after their prison terms.\u003c/p\u003e\n\n\u003cp\u003eWhile stationed at Dover Air Force Base in Delaware, they stole employee email credentials and used spoofed addresses resembling business partners to redirect payments to accounts controlled by accomplices in the United States and abroad. The conspiracy diverted more than \u003cspan class=\"math inline\"\u003e\\(1.68 million from a victim in Iowa City and more than \\)\u003c/span\u003e720,000 from a victim in Ohio, in addition to other attempted diversions. The FBI\u0026rsquo;s 2025 Internet Crime Report recorded 24,768 business email compromise complaints and more than $3 billion in losses, underscoring the financial impact of these schemes.\u003c/p\u003e\n"},{"n":7,"title":"US Air Force members given over 6 years in prison for cyber theft of more than $2 million","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-air-force-members-given-6-year-sentence-cyber","time":"21:01","priority":"MAY READ","score":68,"tldr":"Two U.S. Air Force members received prison sentences of more than six and nine years for a business email compromise scheme that stole over $2 million by phishing credentials and diverting corporate wire payments.","briefOverview":"\u003cp\u003eTwo U.S. Air Force members, Chijioke Timothy Odimegwu and Harafat Mogaji, received federal prison sentences for a business email compromise scheme that stole more than $2 million from organizations. Odimegwu was sentenced to more than nine years in prison, while Mogaji received a 6.5-year sentence. Both pleaded guilty in June to wire fraud, identity theft, and access-device fraud, and each will serve three years of supervised release after prison.\u003c/p\u003e\n\n\u003cp\u003eThe men sent phishing emails to obtain employee email account credentials, then used the compromised accounts and spoofed addresses to monitor payment discussions. They inserted themselves into existing email chains and sent updated wire instructions that redirected business payments to bank accounts they controlled. Prosecutors said they targeted at least 15 victim organizations over more than two years, including diverting a \u003cspan class=\"math inline\"\u003e\\(1.7 million payment involving an Iowa victim and a \\)\u003c/span\u003e720,000 wire payment involving an Ohio victim.\u003c/p\u003e\n\n\u003cp\u003eThe scheme also involved stealing financial account numbers and credit and debit card information, which the men used themselves or sold to other hackers. They were stationed at Dover Air Force Base in Delaware when they conducted the fraud. Odimegwu was ordered to pay \u003cspan class=\"math inline\"\u003e\\(366,617 in restitution, and Mogaji was ordered to pay \\)\u003c/span\u003e995,680.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. Air Force members Chijioke Timothy Odimegwu and Harafat Mogaji were sentenced for a business email compromise scheme that stole more than $2 million from organizations.","The pair used phishing emails to obtain employee email credentials, then monitored payment discussions and sent altered wiring instructions to redirect funds into accounts they controlled.","Prosecutors said the scheme targeted at least 15 victim organizations and ran for more than two years while the men were stationed at Dover Air Force Base in Delaware.","Odimegwu received a prison sentence of more than nine years and was ordered to pay $366,617 in restitution, while Mogaji received 6.5 years and was ordered to pay $995,680.","Both men pleaded guilty in June to wire fraud, identity theft, and access-device fraud, and each will serve three years of supervised release after prison."],"insights":["The scheme relied on taking over existing business email conversations after accounts were breached, allowing the false payment instructions to appear within legitimate payment discussions.","In addition to redirecting wire transfers, the men obtained bank account, credit card, and debit card information that they either used themselves or sold to other hackers.","The two also shared stolen card information with each other to make purchases.","The reported diverted payments included a $1.7 million transfer involving a victim in Iowa and a $720,000 wire payment involving a victim in Ohio."],"referencedReports":[],"body":"\u003cp\u003eTwo U.S. Air Force members, Chijioke Timothy Odimegwu and Harafat Mogaji, received federal prison sentences for a business email compromise scheme that stole more than $2 million from organizations. Odimegwu was sentenced to more than nine years in prison, while Mogaji received a 6.5-year sentence. Both pleaded guilty in June to wire fraud, identity theft, and access-device fraud, and each will serve three years of supervised release after prison.\u003c/p\u003e\n\n\u003cp\u003eThe men sent phishing emails to obtain employee email account credentials, then used the compromised accounts and spoofed addresses to monitor payment discussions. They inserted themselves into existing email chains and sent updated wire instructions that redirected business payments to bank accounts they controlled. Prosecutors said they targeted at least 15 victim organizations over more than two years, including diverting a \u003cspan class=\"math inline\"\u003e\\(1.7 million payment involving an Iowa victim and a \\)\u003c/span\u003e720,000 wire payment involving an Ohio victim.\u003c/p\u003e\n\n\u003cp\u003eThe scheme also involved stealing financial account numbers and credit and debit card information, which the men used themselves or sold to other hackers. They were stationed at Dover Air Force Base in Delaware when they conducted the fraud. Odimegwu was ordered to pay \u003cspan class=\"math inline\"\u003e\\(366,617 in restitution, and Mogaji was ordered to pay \\)\u003c/span\u003e995,680.\u003c/p\u003e\n"},{"n":19,"title":"OpenAI pledges $1B to provide resources, training for frontline cyber defenders","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/openai-pledges-1b-to-provide-resources-training-for-frontline-cyber-defenders/","time":"20:36","priority":"MAY READ","score":68,"tldr":"OpenAI pledged $1 billion in subsidized frontier-AI access and training through its Daybreak for Frontline Defenders program to help small security teams at essential-service providers identify vulnerabilities, detect suspicious activity, and respond to intrusions.","briefOverview":"\u003cp\u003eOpenAI said it will commit $1 billion in subsidized access and training to help small IT security teams use frontier AI. The Daybreak for Frontline Defenders program is intended for organizations protecting essential services, including electricity, water, and local government services. The announcement comes amid heightened scrutiny of the company.\u003c/p\u003e\n\n\u003cp\u003eThe program will help defenders search for critical weaknesses in software and investigate suspicious activity across their technology systems. It is also designed to help stop harmful actions if hackers gain access to those systems. Errol Weiss, chief security officer at Health-ISAC, said this subsidized access could deliver essential security capabilities to hospitals and healthcare organizations at the “last mile,” where they are needed most.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI said it will commit $1 billion in subsidized access and training for small IT security teams that protect essential services.","The Daybreak for Frontline Defenders program is intended to support electricity, water, and local government service providers.","The program will help defenders search for critical software weaknesses, investigate suspicious activity in their technology systems, and stop harmful actions after hackers gain access.","Errol Weiss of Health-ISAC said subsidized access could help bring essential security capabilities to hospitals and healthcare organizations where they are most needed."],"insights":["The initiative is aimed at small security teams, indicating that the subsidized access and training are intended to address resource constraints among organizations operating essential services.","Its planned uses span finding software weaknesses, identifying suspicious activity, and containing harmful actions after access is gained, rather than focusing on only one stage of a security incident.","Health-ISAC’s Errol Weiss highlighted hospitals and healthcare organizations as potential beneficiaries, describing subsidized access as a way to bring security capabilities to the operational “last mile.”"],"referencedReports":[],"body":"\u003cp\u003eOpenAI said it will commit $1 billion in subsidized access and training to help small IT security teams use frontier AI. The Daybreak for Frontline Defenders program is intended for organizations protecting essential services, including electricity, water, and local government services. The announcement comes amid heightened scrutiny of the company.\u003c/p\u003e\n\n\u003cp\u003eThe program will help defenders search for critical weaknesses in software and investigate suspicious activity across their technology systems. It is also designed to help stop harmful actions if hackers gain access to those systems. Errol Weiss, chief security officer at Health-ISAC, said this subsidized access could deliver essential security capabilities to hospitals and healthcare organizations at the “last mile,” where they are needed most.\u003c/p\u003e\n"},{"n":1,"title":"Custom ChatGPTs push ClickFix attacks to deploy RAT malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/custom-chatgpts-push-clickfix-attacks-to-deploy-rat-malware/","time":"20:59","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":2,"title":"Signal adds encypted local backup support to iOS, desktop apps","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/signal-adds-encypted-local-backup-support-to
