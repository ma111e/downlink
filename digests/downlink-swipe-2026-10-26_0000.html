<script type="application/json" id="dl-articles">[{"n":5,"title":"How to patch PHP2Shell with free Aikido Images","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/how-to-patch-php2shell-with-free-aikido-images","time":"22:15","priority":"MUST READ","score":98,"tldr":"PHP2Shell (CVE-2026-109618 and CVE-2026-109619) is being exploited and requires immediate patching; update to fixed PHP releases or use Aikido’s backported container images for unsupported PHP versions.","briefOverview":"\u003cp\u003ePHP2Shell refers to two critical PHP remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, each scored 9.2 under CVSS v4.0. Either flaw can allow an unauthenticated attacker to run code on a server handling PHP requests, and Cloudflare reports exploitation has begun. PHP released fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35. PHP 8.1 and earlier are unsupported and will not receive upstream releases.\u003c/p\u003e\n\n\u003cp\u003eAikido provides free patched PHP container images for most release lines from PHP 5.5 through 8.5, excluding PHP 8.0, with PHP2Shell fixes backported for older versions. Organizations should rebuild and redeploy every PHP container after changing images, then ensure no workers remain on the old build. The article also recommends keeping \u003ccode\u003esession.upload_progress.enabled=0\u003c/code\u003e, because it is a confirmed path to CVE-2026-109619, and using Aikido’s free checker to test a public URL. Users whose version or image variant is unavailable should update to a fixed PHP version or seek a vendor backport.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP2Shell consists of two critical PHP remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, each rated 9.2 under CVSS v4.0.","PHP released fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35, while PHP 8.1 and older no longer receive upstream releases.","Cloudflare reports that exploitation of PHP2Shell has begun.","Aikido provides free patched PHP container images for most PHP release lines from 5.5 through 8.5, with PHP2Shell fixes backported for unsupported versions.","After changing images, organizations should rebuild and redeploy PHP containers, disable session.upload_progress.enabled, and test their public URL with Aikido’s PHP2Shell checker."],"insights":["Replacing the PHP image is not sufficient by itself: every affected container image must be rebuilt and redeployed so that no existing worker continues running the old PHP build.","Disabling the little-used session.upload_progress.enabled setting is a practical temporary safeguard because the article identifies it as one confirmed route to CVE-2026-109619.","Organizations can remain on some exact older PHP patch versions, such as 8.2.34 or 8.5.11, by using Aikido’s backported images rather than immediately moving to a newer PHP release line.","PHP 8.0 is a notable exception because Aikido does not yet provide an image for it, leaving users to update to a fixed PHP version or obtain a vendor backport."],"referencedReports":[{"title":"Critical Vulnerabilities in PHP: PHP2Shell","url":"https://www.aikido.dev/blog/critical-vulnerabilities-in-php-php2shell","publisher":"aikido","context":"The article directs readers to Aikido’s PHP2Shell post for details on both CVEs, temporary mitigations, compromise checks, and patching guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003ePHP2Shell refers to two critical PHP remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, each scored 9.2 under CVSS v4.0. Either flaw can allow an unauthenticated attacker to run code on a server handling PHP requests, and Cloudflare reports exploitation has begun. PHP released fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35. PHP 8.1 and earlier are unsupported and will not receive upstream releases.\u003c/p\u003e\n\n\u003cp\u003eAikido provides free patched PHP container images for most release lines from PHP 5.5 through 8.5, excluding PHP 8.0, with PHP2Shell fixes backported for older versions. Organizations should rebuild and redeploy every PHP container after changing images, then ensure no workers remain on the old build. The article also recommends keeping \u003ccode\u003esession.upload_progress.enabled=0\u003c/code\u003e, because it is a confirmed path to CVE-2026-109619, and using Aikido’s free checker to test a public URL. Users whose version or image variant is unavailable should update to a fixed PHP version or seek a vendor backport.\u003c/p\u003e\n"},{"n":12,"title":"LiteLLM Compromise: Coding Agents as the New Insider Risk","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/litellm-compromise-and-the-new-insider-risk-coding-agents-unmanaged-identities","time":"16:00","priority":"SHOULD READ","score":88,"tldr":"A leaked master key in an OpenCode agent configuration enabled attackers to steal GitHub tokens, abuse CI workflows to harvest more secrets, and publish the credential-stealing LiteLLM 1.107.0 package. The incident shows that coding agents and unmanaged, long-lived credentials can create a high-impact supply-chain risk unless identities are scoped, short-lived, monitored, and kept out of endpoint configs.","briefOverview":"\u003cp\u003eIn May 2026, an OpenCode configuration file containing a master key for LiteLLM’s internal Agent Platform was committed to a public repository. Although the commit was removed, the key remained active for roughly four and a half months. On October 10, an attacker used it to retrieve agent configurations, including a GitHub CLI OAuth token belonging to a LiteLLM GitHub organization owner.\u003c/p\u003e\n\n\u003cp\u003eThe attacker then used GitHub access to add CI workflows that collected repository secrets, maintainer tokens, database credentials, and Redis credentials and sent them to an external webhook. On October 21, the attacker published the poisoned \u003ccode\u003elitellm==1.107.0\u003c/code\u003e package to PyPI, Docker Hub, and GHCR; it was available on PyPI for about two hours. The package executed code at Python startup, including where LiteLLM was not imported, and searched affected systems for cloud credentials, SSH keys, tokens, environment files, browser passwords, AI-provider keys, and other secrets before sending them to an attacker-controlled domain.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the incident as an example of risk created when coding agents and automation can access unmanaged, long-lived credentials. It recommends revoking exposed keys immediately, using short-lived and narrowly scoped identities for automation, protecting CI environments and secrets, and scanning developer endpoints and agent configurations for plaintext credentials. It also identifies unusual token locations, multiple tokens used from one place, and unexpected administrative actions as signals that stolen credentials may be in use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A LiteLLM internal Agent Platform master key was committed in an OpenCode configuration file to a public repository on May 27 and remained valid for about four and a half months after the commit was removed.","On October 10, an attacker used the leaked master key to retrieve managed-agent configurations, including a GitHub CLI OAuth token belonging to a LiteLLM GitHub organization owner.","The attacker used stolen GitHub access to add CI workflows that collected and sent repository, database, Redis, and maintainer credentials to an external webhook service.","The poisoned litellm==1.107.0 release was available on PyPI from 11:39 to 13:23 UTC on October 21, 2026, and its Docker images remained available until 14:20 UTC.","The malicious package ran code whenever Python started and searched affected machines for cloud credentials, SSH keys, software-package tokens, environment files, browser passwords, and AI-provider keys before sending them to an attacker-controlled domain."],"insights":["Removing a secret from Git history does not neutralize it: the article notes that deleted commits can remain available through forks and public archives, so the key must be revoked before or alongside cleanup.","A single leaked platform key did not need to be a GitHub credential to enable GitHub takeover; it could retrieve an agent configuration containing an organization owner’s long-lived GitHub CLI token.","CI secret exposure depended on workflow and environment controls, not just secret storage: a newly created branch was able to trigger jobs that read secrets, including credentials protected by deployment environments.","The malicious LiteLLM package executed on every Python start even when LiteLLM was never imported, meaning exposure extended beyond applications that actively used the package.","The article identifies behavioral signals that can reveal stolen-token use early, including a credential appearing from a new network or client, multiple users’ tokens acting from one location, and unusual administrative actions."],"referencedReports":[{"title":"The attack chain behind the v1.107.0 LiteLLM release","url":"https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain","publisher":"litellm","context":"The article cites LiteLLM's root-cause analysis as a primary account of how the compromised release was produced.","category":"research","primary":true},{"title":"LiteLLM secret-stealing workflows ran 11 days before the attack","url":"https://socket.dev/blog/litellm-attack-timeline","publisher":"socket","context":"The article relies on Socket's timeline and reconstruction for details of the malicious CI workflows and secret theft.","category":"research","primary":true},{"title":"LiteLLM supply chain compromise","url":"https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-docker/","publisher":"datadog-security-labs","context":"The article cites Datadog Security Labs for analysis of the malicious package behavior and the credentials it targeted.","category":"research","primary":true},{"title":"GHSA-69fq-xp46-6x23","url":"https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23","publisher":"aqua-security","context":"The article references Aqua Security's advisory when comparing the incident with the Trivy compromise and incomplete credential rotation.","category":"advisory","primary":false},{"title":"The hidden attack surface of agentic AI: securing AI agent integration platforms","url":"https://www.cyera.com/research/the-hidden-attack-surface-of-agentic-ai-securing-ai-agent-integration-platforms","publisher":"cyera","context":"The article cites this research for findings that publicly accessible agent and MCP configuration files can contain AI-platform credentials.","category":"research","primary":false},{"title":"Agent-inflicted damage: real-world failures of enterprise AI systems","url":"https://www.cyera.com/research/agent-inflicted-damage-inside-the-real-world-failures-of-enterprise-ai-systems","publisher":"cyera","context":"The article lists this Cyera research among related material on risks created by enterprise AI agents.","category":"research","primary":false}],"body":"\u003cp\u003eIn May 2026, an OpenCode configuration file containing a master key for LiteLLM’s internal Agent Platform was committed to a public repository. Although the commit was removed, the key remained active for roughly four and a half months. On October 10, an attacker used it to retrieve agent configurations, including a GitHub CLI OAuth token belonging to a LiteLLM GitHub organization owner.\u003c/p\u003e\n\n\u003cp\u003eThe attacker then used GitHub access to add CI workflows that collected repository secrets, maintainer tokens, database credentials, and Redis credentials and sent them to an external webhook. On October 21, the attacker published the poisoned \u003ccode\u003elitellm==1.107.0\u003c/code\u003e package to PyPI, Docker Hub, and GHCR; it was available on PyPI for about two hours. The package executed code at Python startup, including where LiteLLM was not imported, and searched affected systems for cloud credentials, SSH keys, tokens, environment files, browser passwords, AI-provider keys, and other secrets before sending them to an attacker-controlled domain.\u003c/p\u003e\n\n\u003cp\u003eThe article presents the incident as an example of risk created when coding agents and automation can access unmanaged, long-lived credentials. It recommends revoking exposed keys immediately, using short-lived and narrowly scoped identities for automation, protecting CI environments and secrets, and scanning developer endpoints and agent configurations for plaintext credentials. It also identifies unusual token locations, multiple tokens used from one place, and unexpected administrative actions as signals that stolen credentials may be in use.\u003c/p\u003e\n"},{"n":16,"title":"Cross-request KV cache exposure in the GLM-5.3 Workers AI model, and our remediation with SGLang","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/kv-cache-exposure-remediation/","time":"22:01","priority":"SHOULD READ","score":85,"tldr":"Cloudflare disclosed that a misconfigured KV-cache pool and an SGLang disaggregated-inference bug caused 155 GLM-5.3 Workers AI responses to expose data from recent requests by other customers between August 27 and September 9, 2026. Cloudflare took the model offline, corrected the configuration and engine behavior, restored service, and worked with SGLang on upstream fixes and broader KV-cache safety hardening.","briefOverview":"\u003cp\u003eCloudflare disclosed a tenant-isolation issue in its GLM-5.3 Workers AI model that caused some customers to receive responses containing data from other customers’ recent requests. The exposure was present from the model’s August 27, 2026 launch until Cloudflare disabled it on September 9, and it affected 155 responses to prompts longer than 681,280 tokens. Cloudflare stated that it found no evidence of deliberate exploitation and confirmed that no other Workers AI model was affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue resulted from a mismatch between GLM-5.3’s 1,048,576-token context window and a prefill memory cache that could hold only 681,280 tokens, combined with an SGLang bug in its distributed processing mode. Oversized prompts were internally replaced with a one-token placeholder, but the system still treated the transfer as complete and generated output using leftover memory pages from earlier requests. Cloudflare increased the cache capacity to about 2.04 million tokens, patched the rejection path, validated the changes, and restored the model on September 9. It also worked with SGLang maintainers on upstream fixes, broader safeguards for memory-transfer races, integrity checks, and recommendations for operators to use SGLang v0.5.22 or later.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare disclosed that 155 responses from its GLM-5.3 Workers AI model contained data from other customers’ recent requests between August 27 and September 9, 2026.","The exposure occurred only for prompts longer than 681,280 tokens, because the model’s configured 1,048,576-token context window exceeded the capacity of its prefill memory cache.","An SGLang disaggregated prefill/decode bug allowed rejected oversized requests to transfer only placeholder data while decode systems read leftover memory pages from earlier requests.","Cloudflare disabled the model on September 9, increased the prefill cache capacity to about 2.04 million tokens, patched the inference engine, and restored the model later that day.","Cloudflare stated that no other Workers AI model was affected and recommended that disaggregated SGLang operators update to version 0.5.22 or later."],"insights":["Cloudflare knew the memory cache was smaller than the model’s advertised input limit before launch, but its testing checked successful HTTP responses rather than whether long-input output was correct and coherent.","The exposed data did not require an attacker to directly read memory: the model generated normal-looking responses while using leftover internal data that had not been overwritten by the new request.","Increasing cache capacity prevented valid requests from reaching the faulty rejection path, but Cloudflare also patched SGLang because future configuration changes could recreate the same unsafe condition.","Cloudflare’s broader hardening addresses cases where a cancelled request can still be writing data into memory later assigned to another request, showing that safe cleanup must be coordinated across both parts of the AI serving system.","Cloudflare is pursuing checks that verify a request owns each memory page before it is used, aiming to stop an affected request instead of returning another user’s data."],"referencedReports":[{"title":"SGLang team post on the Cloudflare security incident","url":"https://www.lmsys.org/blog/2026-10-26-cf-security","publisher":"SGLang team at RadixArk","context":"Cloudflare links to a coordinated post from the SGLang team for additional details on the incident and upstream remediation work.","category":"advisory","primary":false}],"body":"\u003cp\u003eCloudflare disclosed a tenant-isolation issue in its GLM-5.3 Workers AI model that caused some customers to receive responses containing data from other customers’ recent requests. The exposure was present from the model’s August 27, 2026 launch until Cloudflare disabled it on September 9, and it affected 155 responses to prompts longer than 681,280 tokens. Cloudflare stated that it found no evidence of deliberate exploitation and confirmed that no other Workers AI model was affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue resulted from a mismatch between GLM-5.3’s 1,048,576-token context window and a prefill memory cache that could hold only 681,280 tokens, combined with an SGLang bug in its distributed processing mode. Oversized prompts were internally replaced with a one-token placeholder, but the system still treated the transfer as complete and generated output using leftover memory pages from earlier requests. Cloudflare increased the cache capacity to about 2.04 million tokens, patched the rejection path, validated the changes, and restored the model on September 9. It also worked with SGLang maintainers on upstream fixes, broader safeguards for memory-transfer races, integrity checks, and recommendations for operators to use SGLang v0.5.22 or later.\u003c/p\u003e\n"},{"n":2,"title":"Borrowed Reputation: Domain Shadowing and Gambling SEO","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/borrowed-reputation-domain-shadowing-and-gambling-seo/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Infoblox uncovered two domain-shadowing operations that abused unauthorized DNS records and subdomain delegations under legitimate school and government domains to host illegal gambling SEO pages. Organizations should monitor DNS changes, especially unexpected CNAMEs, NS delegations, and wildcard records, and secure all DNS-management accounts with MFA and auditing.","briefOverview":"\u003cp\u003eInfoblox identified two unrelated domain-shadowing operations that used unauthorized DNS changes beneath legitimate school and government domains to promote illegal gambling content. The primary institutional websites remained available, potentially allowing the unauthorized hostnames to go unnoticed by organizations focused on their main sites or application logs. The affected institutions were in Bangladesh, India, and Mexico, and the activity used the reputation of their domains to support search visibility and traffic acquisition.\u003c/p\u003e\n\n\u003cp\u003eOne actor, Hidden Hawk, added individual CNAME records that directed institutional hostnames to gambling pages, mostly hosted on Cloudflare Pages, and was associated with more than 850 observed entry points across eight institutional domains. A separate operation delegated subzones under \u003ccode\u003emaharashtra.gov.in\u003c/code\u003e and \u003ccode\u003eonline.esic.gov.in\u003c/code\u003e to third-party nameservers, allowing the actor to manage records below those subzones; a wildcard under \u003ccode\u003egam.maharashtra.gov.in\u003c/code\u003e enabled arbitrary names to resolve. Infoblox recommends that DNS operators validate new NS delegations, investigate unexpected subdomains, CNAMEs, and wildcard records, and secure DNS-management accounts with MFA, credential rotation, and access-log reviews.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox identified two unrelated domain-shadowing operations that placed illegal gambling content beneath legitimate school and government domains.","Hidden Hawk added individual CNAME records beneath institutional domains, generally pointing the affected hostnames to gambling pages hosted on Cloudflare Pages.","A separate operation delegated subzones under maharashtra.gov.in and online.esic.gov.in to ClouDNS nameservers, enabling the operator to manage records beneath those subzones and use a wildcard under gam.maharashtra.gov.in.","The primary institutional websites remained available, meaning unauthorized subdomains could evade detection by organizations focused only on their main websites or application logs.","The article recommends that DNS operators validate new NS delegations, investigate unexpected subdomains and CNAMEs, review wildcard records, and secure DNS-management accounts with MFA and access-log reviews."],"insights":["The abuse did not require replacing or defacing an institution’s main website, so normal website availability and application logs may not reveal that unauthorized gambling pages exist under the same domain.","Delegating a subzone to external nameservers gives an actor ongoing control of records below that subzone without needing to alter the victim’s DNS environment for every new hostname; a wildcard can then make arbitrary names resolve.","Hidden Hawk’s Cloudflare Pages hostnames often replicated the compromised institutional hostname with dots replaced by hyphens, providing a way to reconstruct relationships between victim-side DNS names and externally hosted content.","The article cautions against blocking affected school and government domains at the second-level domain because the institutions themselves are legitimate; remediation should target unauthorized hostnames, actor infrastructure, and the access that enabled the DNS changes."],"referencedReports":[],"body":"\u003cp\u003eInfoblox identified two unrelated domain-shadowing operations that used unauthorized DNS changes beneath legitimate school and government domains to promote illegal gambling content. The primary institutional websites remained available, potentially allowing the unauthorized hostnames to go unnoticed by organizations focused on their main sites or application logs. The affected institutions were in Bangladesh, India, and Mexico, and the activity used the reputation of their domains to support search visibility and traffic acquisition.\u003c/p\u003e\n\n\u003cp\u003eOne actor, Hidden Hawk, added individual CNAME records that directed institutional hostnames to gambling pages, mostly hosted on Cloudflare Pages, and was associated with more than 850 observed entry points across eight institutional domains. A separate operation delegated subzones under \u003ccode\u003emaharashtra.gov.in\u003c/code\u003e and \u003ccode\u003eonline.esic.gov.in\u003c/code\u003e to third-party nameservers, allowing the actor to manage records below those subzones; a wildcard under \u003ccode\u003egam.maharashtra.gov.in\u003c/code\u003e enabled arbitrary names to resolve. Infoblox recommends that DNS operators validate new NS delegations, investigate unexpected subdomains, CNAMEs, and wildcard records, and secure DNS-management accounts with MFA, credential rotation, and access-log reviews.\u003c/p\u003e\n"},{"n":14,"title":"eMudhra, Brotli, and the Long Tail of a Security Fix","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/emudhra-brotli-security-fix?utm_medium=feed","time":"21:18","priority":"SHOULD READ","score":78,"tldr":"Fixing a high-impact flaw such as the eMudhra certificate compromise or the Brotli decoder bug requires more than updating one runtime: teams must find every bundled, vendored, or separately trusted copy across their shipped applications. Effective remediation means rebuilding artifacts, validating the live verifier or decoder, restarting services where needed, and tracking deployment—not merely waiting for a patch to be published.","briefOverview":"\u003cp\u003eThe article examines how the eMudhra certificate compromise and the Brotli decoder flaw spread beyond a single patch or product. Researchers recovered eight eMudhra intermediate certificate authority private keys because the supposed 384-bit values fit within eight bits, making them possible to try by counting to 255. Node.js later released fixes that addressed both the eMudhra certificate blocks and Brotli, but other software and runtimes could contain the same affected components.\u003c/p\u003e\n\n\u003cp\u003eChrome and Firefox rapidly blocked the compromised certificates, while other programs could still trust them through separate certificate bundles, operating-system services, or different verification paths. Go addressed the certificate issue with verifier changes, but existing applications had to be rebuilt with patched Go versions; similarly, Bun executables built with a bundled runtime needed rebuilding after Brotli was fixed. The article notes that Python Requests, .NET, and other software may decode Brotli data even when an application\u0026rsquo;s visible dependency list does not mention Brotli. It recommends tracking bundled components and certificate settings, maintaining rebuild processes, testing the actual running application, and confirming that fixes are installed, loaded, and in use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers showed that eight eMudhra intermediate certificate authority private keys could be recovered because the supposed 384-bit keys all fit within eight bits, allowing their possible values to be tried by counting to 255.","Chrome and Firefox distributed blocks for the compromised eMudhra certificates, but other programs may use different certificate stores or verification methods and can still require updated bundles or verifier changes.","The Brotli flaw, CVE-2026-111497, can corrupt memory when an application decodes malicious compressed input, and fixes were released in Node.js, Bun, and .NET.","Applications built with bundled runtimes or compiled copies of Brotli, including executables created with Bun's compile feature, require rebuilding because updating a system-installed component does not replace embedded copies.","The article recommends tracking bundled dependencies and certificate settings, maintaining automated rebuild paths, testing the actual application verifier or decoder, and monitoring whether patched releases are installed and running."],"insights":["A browser can reject compromised certificates while a command-line tool on the same machine still accepts them, because protections delivered through Apple security frameworks do not automatically apply to tools that read /etc/ssl/cert.pem.","Removing a single trusted root may not block the compromised eMudhra intermediates because Mozilla identified trust paths through three roots, so another path can remain available.","Installing a patched Go compiler does not change already-built Go executables; each affected application must be rebuilt with the patched toolchain.","An application can use the vulnerable Brotli decoder without directly listing or importing it, such as when Python Requests automatically enables Brotli decoding after another dependency installs brotli or brotlicffi.","A published patch is not equivalent to remediation: bundled copies must be replaced in shipped artifacts, and even shared-library applications may need a restart before they load the corrected version."],"referencedReports":[{"title":"Eight Bits of Trust: eMudhra’s CA Keys Cracked in Milliseconds","url":"https://scotthelme.co.uk/eight-bits-of-trust-emudhras-ca-keys-cracked-in-milliseconds/","publisher":"scott-helme","context":"The article cites Scott Helme's technical analysis showing that the affected eMudhra private keys could be recovered in less than a second.","category":"research","primary":true},{"title":"Certificate Security Incident","url":"https://emudhra.com/en/post/certificate-security-incident","publisher":"emudhra","context":"The article references eMudhra's incident statement about the flawed key-generation ceremony in April 2025.","category":"advisory","primary":false},{"title":"Protecting Firefox Users Following the Compromise of eMudhra Intermediate Certificates","url":"https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/","publisher":"mozilla","context":"The article cites Mozilla's account of distributing an OneCRL certificate block to Firefox users.","category":"advisory","primary":false},{"title":"eMudhra Compromised Intermediate Certificates","url":"https://www.openwall.com/lists/oss-security/2026/10/20/1","publisher":"mozilla","context":"The article references Mozilla's guidance to block the compromised intermediate certificates where possible.","category":"advisory","primary":false},{"title":"Go 1.27.3 and Go 1.26.10 Are Released","url":"https://groups.google.com/g/golang-announce/c/66pojueaQek","publisher":"golang","context":"The article cites the Go security release that added a verifier change for the eMudhra issue.","category":"advisory","primary":false},{"title":"Brotli v1.2.1","url":"https://github.com/google/brotli/releases/tag/v1.2.1","publisher":"google","context":"The article identifies this Brotli release as the advisory for CVE-2026-111497.","category":"advisory","primary":false},{"title":"Bun Security Advisory GHSA-663w-cv8g-jj2p","url":"https://github.com/oven-sh/bun/security/advisories/GHSA-663w-cv8g-jj2p","publisher":"oven","context":"The article cites Bun's advisory stating that Bun 1.4.4 updated the affected Brotli library.","category":"advisory","primary":false},{"title":"GHSA-p3jp-9v83-76w9","url":"https://github.com/dotnet/runtime/security/advisories/GHSA-p3jp-9v83-76w9","publisher":"microsoft","context":"The article references Microsoft's .NET advisory for the same Brotli flaw and its mitigation examples.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe article examines how the eMudhra certificate compromise and the Brotli decoder flaw spread beyond a single patch or product. Researchers recovered eight eMudhra intermediate certificate authority private keys because the supposed 384-bit values fit within eight bits, making them possible to try by counting to 255. Node.js later released fixes that addressed both the eMudhra certificate blocks and Brotli, but other software and runtimes could contain the same affected components.\u003c/p\u003e\n\n\u003cp\u003eChrome and Firefox rapidly blocked the compromised certificates, while other programs could still trust them through separate certificate bundles, operating-system services, or different verification paths. Go addressed the certificate issue with verifier changes, but existing applications had to be rebuilt with patched Go versions; similarly, Bun executables built with a bundled runtime needed rebuilding after Brotli was fixed. The article notes that Python Requests, .NET, and other software may decode Brotli data even when an application\u0026rsquo;s visible dependency list does not mention Brotli. It recommends tracking bundled components and certificate settings, maintaining rebuild processes, testing the actual running application, and confirming that fixes are installed, loaded, and in use.\u003c/p\u003e\n"},{"n":4,"title":"Even the 'Block this Host' Link Went to the Phishing Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/block-this-host-link-same-phishing-page-evite-footer-trap","time":"11:00","priority":"MAY READ","score":68,"tldr":"A fake Evite invitation sent every link—including privacy, unsubscribe-style, and “Block this Host” footer links—to the same phishing URL, leaving no safe element to click. Users should avoid interacting with unexpected notifications and instead access the purported service directly.","briefOverview":"\u003cp\u003eA fake Evite RSVP invitation reached an employee at a U.S. small-business fintech lender, with recipients hidden in Bcc. The message contained 13 clickable anchors, and every one—including the main RSVP button, privacy links, app-store badges, social icons, and postal address—pointed to \u003ccode\u003ehxxps://aalzntp[.]vu/aut\u003c/code\u003e. This meant even links a cautious recipient might use to avoid the main call to action, such as “Block this Host” or “Do Not Sell My Info,” led to the same hostile destination.\u003c/p\u003e\n\n\u003cp\u003eThe platform’s link inventory deduplicated the 13 anchors into a single entry labeled “View \u0026amp; RSVP,” obscuring the fact that the footer links were also malicious. The email originated from a legitimate Google Workspace mailbox belonging to an unrelated business and passed SPF, DKIM, DMARC, and ARC checks, though the record does not establish why the account sent it. IRONSCALES’ Themis initially flagged the message at 50% confidence, and a human analyst later resolved it as malicious; the article advises recipients not to click any part of an unexpected lookalike notification and instead access the legitimate platform directly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake Evite RSVP email sent to an employee at a U.S. small-business fintech lender contained 13 links, all pointing to hxxps://aalzntp[.]vu/aut.","The links included the RSVP button, privacy and notification settings links, “Block this Host,” “Do Not Sell My Info,” app-store badges, social-media icons, and the postal address.","The platform’s link inventory combined the 13 identical destinations into one entry labeled “View \u0026 RSVP,” which hid the separate footer-link behavior from reviewers.","The email was sent from a legitimate Google Workspace mailbox belonging to an unrelated small business and passed SPF, DKIM, DMARC, and ARC authentication checks.","IRONSCALES classified the email as malicious after its Themis analyst initially flagged it at 50% confidence under the label VIP Recipient."],"insights":["The phishing email turned common safety habits against recipients by making even its privacy, notification, and “Block this Host” links lead to the same hostile destination as the RSVP button.","A deduplicated link inventory can obscure meaningful context: one suspicious URL record represented 13 separate clickable anchors, including deceptive footer links that were not visible as individual entries.","Passed SPF, DKIM, DMARC, and ARC checks did not establish that the Evite-branded message was legitimate, because it was sent from a real but unrelated business mailbox.","For unexpected invitations, opening the legitimate platform directly is safer than attempting to find a harmless link within the email itself."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for statistics on phishing in the email gateway attack mix and the human element in breaches.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the FBI IC3 report alongside CISA guidance to support the point that credible-looking messages from real accounts enable phishing.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA's phishing guidance to emphasize that credible-looking emails from real accounts can be deceptive.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references the report in discussing the role of stolen credentials and phishing in costly incidents.","category":"research","primary":false},{"title":"Cost of a Data Breach Report 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article cites IBM's report alongside Microsoft's report to discuss the costs associated with stolen credentials and phishing.","category":"research","primary":false}],"body":"\u003cp\u003eA fake Evite RSVP invitation reached an employee at a U.S. small-business fintech lender, with recipients hidden in Bcc. The message contained 13 clickable anchors, and every one—including the main RSVP button, privacy links, app-store badges, social icons, and postal address—pointed to \u003ccode\u003ehxxps://aalzntp[.]vu/aut\u003c/code\u003e. This meant even links a cautious recipient might use to avoid the main call to action, such as “Block this Host” or “Do Not Sell My Info,” led to the same hostile destination.\u003c/p\u003e\n\n\u003cp\u003eThe platform’s link inventory deduplicated the 13 anchors into a single entry labeled “View \u0026amp; RSVP,” obscuring the fact that the footer links were also malicious. The email originated from a legitimate Google Workspace mailbox belonging to an unrelated business and passed SPF, DKIM, DMARC, and ARC checks, though the record does not establish why the account sent it. IRONSCALES’ Themis initially flagged the message at 50% confidence, and a human analyst later resolved it as malicious; the article advises recipients not to click any part of an unexpected lookalike notification and instead access the legitimate platform directly.\u003c/p\u003e\n"},{"n":11,"title":"Kernel eviction notice: What wesp.sys reveals about the Windows Endpoint Security Platform","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/blog/windows-endpoint-security-platform-wesp","time":"00:00","priority":"MAY READ","score":68,"tldr":"Microsoft is developing the Windows Endpoint Security Platform (WESP) to let EDR vendors move much of their monitoring out of third-party kernel drivers, reducing the risk of system-wide crashes like the 2024 CrowdStrike outage. Insider-build binaries show WESP currently uses Microsoft's wesp.sys mini-filter and espclient.dll to deliver filtered security events to user-mode clients, though user-mode blocking decisions do not yet appear implemented.","briefOverview":"\u003cp\u003eMicrosoft is developing the Windows Endpoint Security Platform (WESP), a framework intended to move endpoint detection and response (EDR) functionality from third-party Windows kernel drivers into user-mode services. The effort follows the July 19, 2024 CrowdStrike outage, when a bad configuration-file update caused its EDR kernel driver to crash millions of Windows machines. Microsoft’s goal is to maintain a single kernel driver itself rather than having each EDR vendor ship its own kernel code. WESP is still early-stage and is not publicly documented, but related binaries are present in Windows Insider builds.\u003c/p\u003e\n\n\u003cp\u003eThe available binaries include the kernel driver \u003ccode\u003ewesp.sys\u003c/code\u003e and the user-mode API library \u003ccode\u003eespclient.dll\u003c/code\u003e. Analysis using public symbols indicates that \u003ccode\u003ewesp.sys\u003c/code\u003e is a file-system mini-filter at altitude 329500 and communicates with user-mode clients through a FilterCommunicationPort named \u003ccode\u003eESPFilterPort\u003c/code\u003e. The platform appears designed to provide filtered event notifications, since high-volume file and Registry activity cannot efficiently all be forwarded to user mode. Although \u003ccode\u003eespclient.dll\u003c/code\u003e exposes functions for filters, rules, and event queues, its observed imports do not include \u003ccode\u003eFilterReplyMessage\u003c/code\u003e, suggesting that custom user-mode responses to block operations such as process creation may not yet be implemented.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is developing the Windows Endpoint Security Platform (WESP) to move EDR product functionality from third-party kernel drivers into user mode while retaining a Microsoft-maintained kernel component.","The initiative follows the July 19, 2024 CrowdStrike outage, in which a bad configuration-file update caused CrowdStrike's EDR kernel driver to crash millions of Windows machines.","Windows Insider builds include the WESP kernel driver wesp.sys and the user-mode API library espclient.dll, although the platform is not publicly documented.","Analysis of wesp.sys shows that it is a file-system mini-filter at altitude 329500 that communicates with user-mode clients through a FilterCommunicationPort named ESPFilterPort.","The espclient.dll exports functions related to filters, rules, and event queues, but its imports do not include FilterReplyMessage, suggesting user-mode clients may not currently be able to return decisions such as blocking process creation."],"insights":["Although WESP is undocumented, Microsoft’s public symbols for its binaries allow researchers to inspect meaningful implementation details through kernel debugging.","WESP must filter high-volume file and Registry activity before sending it to user mode, because forwarding every such event would be too slow or inefficient.","The current espclient.dll imports message-send and message-receive functions but not FilterReplyMessage, indicating that the examined implementation likely does not support a user-mode client making a custom allow-or-block decision in response to an event.","WESP does not immediately eliminate existing EDR kernel drivers, because current security products will need time to migrate and Windows must continue supporting existing behavior."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is developing the Windows Endpoint Security Platform (WESP), a framework intended to move endpoint detection and response (EDR) functionality from third-party Windows kernel drivers into user-mode services. The effort follows the July 19, 2024 CrowdStrike outage, when a bad configuration-file update caused its EDR kernel driver to crash millions of Windows machines. Microsoft’s goal is to maintain a single kernel driver itself rather than having each EDR vendor ship its own kernel code. WESP is still early-stage and is not publicly documented, but related binaries are present in Windows Insider builds.\u003c/p\u003e\n\n\u003cp\u003eThe available binaries include the kernel driver \u003ccode\u003ewesp.sys\u003c/code\u003e and the user-mode API library \u003ccode\u003eespclient.dll\u003c/code\u003e. Analysis using public symbols indicates that \u003ccode\u003ewesp.sys\u003c/code\u003e is a file-system mini-filter at altitude 329500 and communicates with user-mode clients through a FilterCommunicationPort named \u003ccode\u003eESPFilterPort\u003c/code\u003e. The platform appears designed to provide filtered event notifications, since high-volume file and Registry activity cannot efficiently all be forwarded to user mode. Although \u003ccode\u003eespclient.dll\u003c/code\u003e exposes functions for filters, rules, and event queues, its observed imports do not include \u003ccode\u003eFilterReplyMessage\u003c/code\u003e, suggesting that custom user-mode responses to block operations such as process creation may not yet be implemented.\u003c/p\u003e\n"},{"n":3,"title":"Authorization Differential Testing in Salesforce","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/authorization-differential-testing-in-salesforce/","time":"19:17","priority":"MAY READ","score":55,"tldr":"Salesforce authorization can differ between UI API/GraphQL and custom Apex, so the same restricted user may receive data through Apex that native APIs correctly withhold. Test identical requests across all exposed paths, especially Experience Cloud guest flows, and explicitly review Apex sharing, API version, and user- versus system-mode database access.","briefOverview":"\u003cp\u003eThe article presents Authorization Differential Testing, a method for comparing how Salesforce handles the same user, record, field, and operation through UI API, GraphQL, custom Apex, and Experience Cloud paths. It highlights a case where UI API and GraphQL withhold an Account\u0026rsquo;s \u003ccode\u003eAnnualRevenue\u003c/code\u003e field from a restricted user, while a custom \u003ccode\u003e@AuraEnabled\u003c/code\u003e Apex method returns it. This difference can occur because the paths apply different authorization checks after a request reaches Salesforce. The article recommends investigating any inconsistent result rather than assuming the endpoint alone determines access control.\u003c/p\u003e\n\n\u003cp\u003eUI API and UI API GraphQL enforce the caller\u0026rsquo;s object permissions, field-level security, and record-sharing access, while custom Apex requires separate review of sharing, database access mode, and permission handling. In Apex classes compiled at API version 66 or earlier, database operations default to system mode unless user mode is selected; classes at version 67 or later default to user context. A \u003ccode\u003ewith sharing\u003c/code\u003e declaration enforces record-level sharing but does not alone enforce object or field permissions for system-mode operations. The article advises testing guest access to native APIs separately from guest-reachable Apex, and repeating restricted-user and guest tests after permission changes, LWR migrations, and Apex API-version upgrades.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Authorization Differential Testing compares the same user, record, field, and operation across UI API, GraphQL, custom Apex, and other application paths to identify inconsistent access decisions.","Salesforce UI API and its GraphQL API apply the caller’s object permissions, field-level restrictions, and record-sharing access when returning supported record data.","Apex classes compiled at API version 66 or earlier use system-mode database operations by default unless user mode is explicitly selected, while classes compiled at version 67 or later use user context by default.","Apex declared \"with sharing\" enforces record-level sharing but does not by itself enforce object permissions or field-level restrictions for system-mode database operations.","Experience Cloud guest access to native public APIs and guest access to custom Apex classes are separate controls that should be tested independently."],"insights":["Two nearly identical Apex controllers can make different permission decisions solely because one was compiled at API version 66 or earlier and the other at version 67 or later, making API-version upgrades an authorization regression-testing event.","Removing an old Aura route or disabling guest access to native public APIs during an LWR migration does not automatically secure custom Apex methods that remain reachable by a guest user.","A restricted user receiving a shared record through Apex is not evidence that field access was checked: record sharing can succeed while a system-mode query still returns a field hidden by the user’s field permissions.","For operations that should return only permitted data rather than fail completely, the article identifies Security.stripInaccessible() as an option to remove fields the caller cannot access."],"referencedReports":[],"body":"\u003cp\u003eThe article presents Authorization Differential Testing, a method for comparing how Salesforce handles the same user, record, field, and operation through UI API, GraphQL, custom Apex, and Experience Cloud paths. It highlights a case where UI API and GraphQL withhold an Account\u0026rsquo;s \u003ccode\u003eAnnualRevenue\u003c/code\u003e field from a restricted user, while a custom \u003ccode\u003e@AuraEnabled\u003c/code\u003e Apex method returns it. This difference can occur because the paths apply different authorization checks after a request reaches Salesforce. The article recommends investigating any inconsistent result rather than assuming the endpoint alone determines access control.\u003c/p\u003e\n\n\u003cp\u003eUI API and UI API GraphQL enforce the caller\u0026rsquo;s object permissions, field-level security, and record-sharing access, while custom Apex requires separate review of sharing, database access mode, and permission handling. In Apex classes compiled at API version 66 or earlier, database operations default to system mode unless user mode is selected; classes at version 67 or later default to user context. A \u003ccode\u003ewith sharing\u003c/code\u003e declaration enforces record-level sharing but does not alone enforce object or field permissions for system-mode operations. The article advises testing guest access to native APIs separately from guest-reachable Apex, and repeating restricted-user and guest tests after permission changes, LWR migrations, and Apex API-version upgrades.\u003c/p\u003e\n"},{"n":6,"title":"Discover and remediate PHP2Shell exposure with Tenable","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/discover-and-remediate-php2shell-exposure-with-tenable","time":"19:48","priority":"MAY READ","score":55,"tldr":"Tenable promotes its platform as a way to identify, prioritize, patch, and validate remediation for the critical PHP2Shell vulnerabilities CVE-2026-109618 and CVE-2026-109619 across external assets, endpoints, web apps, and cloud workloads.","briefOverview":"\u003cp\u003eThe article discusses PHP2Shell, referring to CVE-2026-109618 and CVE-2026-109619, and urges organizations to identify affected PHP installations and update to fixed versions. It states that PHP runs on more than 70% of websites and that many sites use unsupported legacy branches, creating pressure to remediate before systems are targeted. The article presents Tenable’s products as tools for locating, prioritizing, and tracking these exposures.\u003c/p\u003e\n\n\u003cp\u003eTenable One Attack Surface Management is described as a way to find externally facing and potentially unknown PHP assets, while Tenable One Vulnerability Management and Tenable Security Center provide PHP detections, including local checks for Linux packages. Tenable One Web App Scanning can inspect web applications for PHP versions and associated vulnerabilities, and Tenable One Cloud Exposure can identify affected cloud virtual machines, images, and containers. Tenable Patch Management can match findings to patches and validate fixes with follow-up scans, while Tenable Hexa AI can help create exposure initiatives and remediation tickets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says the PHP2Shell vulnerabilities CVE-2026-109618 and CVE-2026-109619 require organizations to identify affected PHP deployments and update to fixed versions quickly.","Tenable One Attack Surface Management can discover externally facing PHP assets and monitor for new PHP deployments or end-of-life PHP installations.","Tenable One Vulnerability Management and Tenable Security Center provide PHP detections, including local checks for PHP packages from Linux distributions, and support remediation tracking.","Tenable One Web App Scanning can assess web applications for PHP2Shell by inspecting components, HTTP headers, server signatures, and cookies for PHP versions and associated vulnerabilities.","Tenable Patch Management can match exposure findings to relevant patches, launch patch workflows, and validate remediation through post-scan checks."],"insights":["The article emphasizes that exposure may exist on forgotten, rogue, or shadow IT assets, so finding PHP2Shell is not limited to systems already listed in an organization’s inventory.","It recommends enabling thorough testing and paranoia mode for vulnerability scans because default scan settings can miss software installed across all drives or deep component-level issues.","Web application scans can use externally discovered assets from Attack Surface Management as new targets, helping teams assess web applications they did not previously know about.","For cloud environments, the article describes saving a PHP2Shell query and reusing it for dashboards, daily reports, custom response policies, and alerts when newly affected resources appear.","Tenable Hexa AI can be prompted to create a PHP2Shell remediation initiative, define service-level targets, and generate Jira remediation tickets for affected systems."],"referencedReports":[],"body":"\u003cp\u003eThe article discusses PHP2Shell, referring to CVE-2026-109618 and CVE-2026-109619, and urges organizations to identify affected PHP installations and update to fixed versions. It states that PHP runs on more than 70% of websites and that many sites use unsupported legacy branches, creating pressure to remediate before systems are targeted. The article presents Tenable’s products as tools for locating, prioritizing, and tracking these exposures.\u003c/p\u003e\n\n\u003cp\u003eTenable One Attack Surface Management is described as a way to find externally facing and potentially unknown PHP assets, while Tenable One Vulnerability Management and Tenable Security Center provide PHP detections, including local checks for Linux packages. Tenable One Web App Scanning can inspect web applications for PHP versions and associated vulnerabilities, and Tenable One Cloud Exposure can identify affected cloud virtual machines, images, and containers. Tenable Patch Management can match findings to patches and validate fixes with follow-up scans, while Tenable Hexa AI can help create exposure initiatives and remediation tickets.\u003c/p\u003e\n"},{"n":13,"title":"5 attack chains that started with assets nobody thought to test","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/5-attack-chains-that-started-with-assets-nobody-thought-to-test/","time":"10:18","priority":"MAY READ","score":55,"tldr":"Organizations often leave low-priority external assets—such as legacy servers, subsidiary systems, supplier applications, and demos—untested, even though they can provide paths to critical systems and sensitive data. The article argues that comprehensive attack-surface discovery and scalable AI-driven pentesting can uncover these overlooked attack chains.","briefOverview":"\u003cp\u003eThe article presents five examples from CyCognito AI pentesting runs in which external assets considered low priority led to access to critical systems or sensitive information. It cites Synack and Omdia research finding that organizations test about 32% of their attack surface on average. The overlooked assets included an IP-only homegrown transportation tool, an unpatched legacy reporting server, a subsidiary registration service, a supplier-built clinical application, and a public healthcare demo. The article argues that these assets often remain outside normal pentest plans despite their connections to more valuable environments.\u003c/p\u003e\n\n\u003cp\u003eIn the examples, crafted requests bypassed a login gateway on a transportation system, manipulated XML requests exposed local files and passwords on legacy and subsidiary servers, and SQL injection reached a shared database environment containing 59 databases. The public healthcare demo exposed patient records through a debug endpoint, lacked checks that limited clinicians to authorized records, and allowed low-privilege users to generate non-expiring patient-portal tokens. Some of the paths had been missed by earlier manual pentests, including the subsidiary service, supplier application, and healthcare demo. The article concludes that organizations need complete external asset discovery, context about asset relationships and technologies, and sufficiently scalable testing to revisit systems as they change.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Research from Synack and Omdia found that organizations pentest about 32% of their attack surface on average, leaving roughly two thirds untested.","An IP-only homegrown transportation application allowed unauthenticated access to live vehicle cargo data and controls that could reroute vehicles because a crafted web address bypassed its login gateway.","A legacy analytics server at a global IT services company exposed an administrative password through manipulated XML requests, enabling system-level access and a potential foothold into a PCI-scoped environment.","A supplier-built clinical-data application at a pharmaceutical company contained an unauthenticated SQL injection path to a shared database server with 59 databases, including databases belonging to 14 other companies.","The article argues that organizations need complete external attack-surface discovery and scalable testing to investigate overlooked assets such as legacy systems, subsidiaries, supplier applications, and public demos."],"insights":["Assets that appear low-risk can become high-impact entry points when they connect to operational systems, production databases, or shared hosting environments.","Previous manual pentests had missed several of the demonstrated paths, including flaws in a subsidiary registration service, a supplier application, and a public healthcare demo.","The same XML-based file-reading weakness appeared on a legacy reporting server, its sister server, and an unrelated system in another country, showing that one finding can point to similar exposure elsewhere.","A public demo containing only synthetic patient data still exposed meaningful risk because it ran the same application code as production and included accessible debug and QA functions.","A supplier application hosted on a company domain created potential access to databases belonging to 14 other companies, meaning the affected organization did not own all of the data exposed by the shared environment."],"referencedReports":[{"title":"95% of Enterprises Prioritize Pentesting Yet Only 32% of Attack Surfaces Are Tested, New Research Finds","url":"https://www.nasdaq.com/press-release/95-enterprises-prioritize-pentesting-yet-only-32-attack-surfaces-are-tested-new","publisher":"synack-and-omdia","context":"The article cites research from Synack and Omdia finding that organizations pentest about 32% of their attack surface on average.","category":"research","primary":false}],"body":"\u003cp\u003eThe article presents five examples from CyCognito AI pentesting runs in which external assets considered low priority led to access to critical systems or sensitive information. It cites Synack and Omdia research finding that organizations test about 32% of their attack surface on average. The overlooked assets included an IP-only homegrown transportation tool, an unpatched legacy reporting server, a subsidiary registration service, a supplier-built clinical application, and a public healthcare demo. The article argues that these assets often remain outside normal pentest plans despite their connections to more valuable environments.\u003c/p\u003e\n\n\u003cp\u003eIn the examples, crafted requests bypassed a login gateway on a transportation system, manipulated XML requests exposed local files and passwords on legacy and subsidiary servers, and SQL injection reached a shared database environment containing 59 databases. The public healthcare demo exposed patient records through a debug endpoint, lacked checks that limited clinicians to authorized records, and allowed low-privilege users to generate non-expiring patient-portal tokens. Some of the paths had been missed by earlier manual pentests, including the subsidiary service, supplier application, and healthcare demo. The article concludes that organizations need complete external asset discovery, context about asset relationships and technologies, and sufficiently scalable testing to revisit systems as they change.\u003c/p\u003e\n"},{"n":10,"title":"Know How Cyble Brand Intelligence Can Help Stop ClickFix Campaigns in its Tracks","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/booking-com-brand-intelligence-clickfix-campaign/","time":"10:50","priority":"MAY READ","score":48,"tldr":"Cyble uses the Storm-1865 Booking.com ClickFix phishing campaign to promote its Brand Intelligence \u0026 Protection service, arguing that monitoring lookalike domains, cloned pages, lures, and leaked credentials can disrupt brand impersonation before victims are compromised.","briefOverview":"\u003cp\u003eMicrosoft Threat Intelligence reported that Storm-1865 impersonated Booking.com from December 2024 to target hotel and hospitality staff across North America, Europe, Oceania, and South and Southeast Asia. The group used emails and PDFs about negative reviews, guest requests, promotions, and account verification to direct recipients to fake CAPTCHA pages overlaid on faint copies of Booking.com pages. Victims were instructed to open the Windows Run box and paste a command that had been copied to their clipboard, using mshta.exe to retrieve malware including XWorm, Lumma Stealer, VenomRAT, AsyncRAT, Danabot, and NetSupport RAT.\u003c/p\u003e\n\n\u003cp\u003eBooking.com said its own systems were not breached, but some accommodation partners and customers were affected. The article argues that brand impersonation leaves observable traces outside a victim’s network, such as lookalike domains, copied web pages, fraudulent lures, and exposed credentials. It presents Cyble Brand Intelligence \u0026amp; Protection as a way to monitor those traces, detect and remove confirmed phishing pages, and watch for credential leaks, while noting that email filtering, endpoint controls, script controls, and phishing-resistant MFA are needed to stop execution on a victim’s device.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that Storm-1865 impersonated Booking.com from December 2024 to target hotel and hospitality staff across North America, Europe, Oceania, and South and Southeast Asia.","The campaign used fake Booking.com messages and CAPTCHA-style pages to persuade victims to paste a pre-copied command into the Windows Run box, which then used mshta.exe to download credential- and payment-data-stealing malware.","Booking.com said its own systems were not breached, although some accommodation partners and customers were affected.","The article says Cyble Brand Intelligence \u0026 Protection can monitor lookalike domains, detect cloned phishing pages and copied brand assets, support takedowns, and watch for exposed credentials connected to a brand.","The article states that endpoint and email controls, script controls, and phishing-resistant multi-factor authentication are needed to stop the pasted command if a victim reaches that stage."],"insights":["Booking.com’s own systems did not need to be breached for its reputation to be used against hotels and customers; the campaign depended on external websites and copied branding that could be monitored outside affected organizations’ networks.","The ClickFix step relied on victims manually opening the Windows Run box and pasting a command already placed on their clipboard, turning a familiar-looking “verification” request into the delivery mechanism for malware.","A fake sender domain is not always necessary for brand impersonation, because the article notes that lures can come through ordinary Gmail or iCloud Mail accounts; in those cases, the fraudulent landing page is the key asset to identify.","The article distinguishes between preventing exposure and containing compromise: brand monitoring can remove fake infrastructure and identify leaked credentials, while email filtering, endpoint controls, script controls, and phishing-resistant MFA are needed to stop or limit execution on a victim’s device.","The article states that lookalike-domain monitoring can identify suspicious domains at registration, before they host a phishing page, creating an opportunity to act before targets receive a link."],"referencedReports":[{"title":"Phishing campaign impersonates Booking.com, delivers a suite of credential-stealing malware","url":"https://www.microsoft.com/en-us/security/blog/?p=137933","publisher":"microsoft-threat-intelligence","context":"The article relies on Microsoft Threat Intelligence’s March 2025 analysis for details of the Storm-1865 Booking.com impersonation and ClickFix campaign.","category":"research","primary":true},{"title":"2025 imposter scam data release","url":"https://www.ftc.gov/node/333221","publisher":"us-federal-trade-commission","context":"The article cites the FTC’s data release for reported 2025 losses from business impersonators and imposter scams.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft Threat Intelligence reported that Storm-1865 impersonated Booking.com from December 2024 to target hotel and hospitality staff across North America, Europe, Oceania, and South and Southeast Asia. The group used emails and PDFs about negative reviews, guest requests, promotions, and account verification to direct recipients to fake CAPTCHA pages overlaid on faint copies of Booking.com pages. Victims were instructed to open the Windows Run box and paste a command that had been copied to their clipboard, using mshta.exe to retrieve malware including XWorm, Lumma Stealer, VenomRAT, AsyncRAT, Danabot, and NetSupport RAT.\u003c/p\u003e\n\n\u003cp\u003eBooking.com said its own systems were not breached, but some accommodation partners and customers were affected. The article argues that brand impersonation leaves observable traces outside a victim’s network, such as lookalike domains, copied web pages, fraudulent lures, and exposed credentials. It presents Cyble Brand Intelligence \u0026amp; Protection as a way to monitor those traces, detect and remove confirmed phishing pages, and watch for credential leaks, while noting that email filtering, endpoint controls, script controls, and phishing-resistant MFA are needed to stop execution on a victim’s device.\u003c/p\u003e\n"},{"n":7,"title":"Deploying AI agents securely: how Kaspersky products mitigate AI threats","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/how-to-secure-ai-agents/121444/","time":"10:00","priority":"MAY READ","score":45,"tldr":"Kaspersky promotes a layered approach to securing enterprise AI agents: discover and restrict them with application and web controls, monitor risky behavior with EDR detections, and scan agent skills and LLM files for malicious code. The article highlights risks such as unsafe auto-approval settings, credential-file access, malicious MCP server artifacts, and untrusted agent extensions.","briefOverview":"\u003cp\u003eKaspersky describes AI agents as a growing corporate-security concern because they can access data, run commands, and interact with external services using a user’s privileges. The article says agentic tools, particularly software-development agents, are among the most popular AI applications observed in Kaspersky telemetry, while AI-related software and services have accumulated more than 2,500 published vulnerabilities since 2025. It argues that organizations need visibility and controls because agents may execute harmful instructions from documents, web pages, emails, downloaded skills, or unsafe external sources.\u003c/p\u003e\n\n\u003cp\u003eKaspersky Endpoint Security can use Application Control to allow or block AI tools and Web Control to restrict access to AI-as-a-service websites. Kaspersky EDR monitors agents as processes and includes rules for behavior such as access to credential files, execution with automatic approval or disabled sandboxing, suspicious MCP server artifacts, and unusual applications connecting to known LLM APIs. Kaspersky Threat Intelligence Portal provides AI-agent profiles and detection-rule information, while Kaspersky Scan Engine can scan agent skills, associated scripts, generated files, and certain LLM model formats for malicious code.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI agents can access data, run commands, and interact with external services using user privileges, creating security risks when deployed without security-team oversight or well-designed policies.","Kaspersky Endpoint Security provides Application Control and Web Control features that organizations can use to restrict AI agent software and access to websites offering AI as a service.","Kaspersky EDR includes specialized rules that identify AI agents accessing credential, token, or key files; launching with automatic approval or disabled sandboxing; creating suspicious MCP server files; and unusual applications connecting to external LLM APIs.","Kaspersky Threat Intelligence Portal provides AI-agent profiles and Hunt Hub detection rules with information such as system artifacts, audit sources, MITRE ATT\u0026CK mappings, detection logic, and possible false positives.","Kaspersky Scan Engine can scan AI-agent skills, associated scripts, agent-generated files, and potentially dangerous LLM model formats for malicious code."],"insights":["An AI agent’s launch alone does not indicate an attack; the article says investigators need to connect suspicious actions to the specific agent and the conditions under which it was running.","Existing behavior-based detections can identify many malicious actions performed by AI agents because traces such as suspicious PowerShell commands, scheduled-task persistence, credential theft, process relationships, and network activity remain recognizable regardless of what initiated them.","The article identifies “YOLO mode” and disabled sandboxing as risky agent settings because they allow actions to proceed without user confirmation, although those settings alone do not prove malicious activity.","AI tools that run models locally can evade visibility based only on external AI-service connections, so the article notes that creation or modification of local model files can reveal their presence.","Agent skills and some LLM model-file formats can carry malicious code, meaning a seemingly harmless AI agent can introduce threats through downloaded instructions, helper scripts, or model files."],"referencedReports":[{"title":"Vulnerabilities and exploits in Q2 2026","url":"https://securelist.com/vulnerabilities-and-exploits-in-q2-2026/121091/#llm-ai-tool-vulnerabilities","publisher":"kaspersky","context":"The article cites this analysis when noting a sharp increase in published vulnerabilities affecting LLMs, AI tools, and related plugins.","category":"research","primary":false},{"title":"Armored Likho APT with BusySnake Stealer","url":"https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/","publisher":"kaspersky","context":"The article references this technical analysis as an example of a campaign in which AI was used to create loader, dropper, and malware-module samples.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky describes AI agents as a growing corporate-security concern because they can access data, run commands, and interact with external services using a user’s privileges. The article says agentic tools, particularly software-development agents, are among the most popular AI applications observed in Kaspersky telemetry, while AI-related software and services have accumulated more than 2,500 published vulnerabilities since 2025. It argues that organizations need visibility and controls because agents may execute harmful instructions from documents, web pages, emails, downloaded skills, or unsafe external sources.\u003c/p\u003e\n\n\u003cp\u003eKaspersky Endpoint Security can use Application Control to allow or block AI tools and Web Control to restrict access to AI-as-a-service websites. Kaspersky EDR monitors agents as processes and includes rules for behavior such as access to credential files, execution with automatic approval or disabled sandboxing, suspicious MCP server artifacts, and unusual applications connecting to known LLM APIs. Kaspersky Threat Intelligence Portal provides AI-agent profiles and detection-rule information, while Kaspersky Scan Engine can scan agent skills, associated scripts, generated files, and certain LLM model formats for malicious code.\u003c/p\u003e\n"},{"n":17,"title":"2026 Healthcare Cyber Survey: New Trends in AI, Application API Security","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/2026-healthcare-cyber-survey-new-trends-in-ai-application-api-security/","time":"18:38","priority":"MAY READ","score":45,"tldr":"Radware’s 2026 healthcare cybersecurity survey finds that rapid AI adoption is creating significant visibility, governance, and security challenges for healthcare organizations, including concerns around application and API security.","briefOverview":"\u003cp\u003eHealth-ISAC published “2026 Healthcare Cyber Survey: New Trends in AI, Application API Security” on October 26, 2026. The resource is a report by Radware, identified as a Health-ISAC Community Services Champion. It is based on responses from healthcare organizations.\u003c/p\u003e\n\n\u003cp\u003eThe report describes rapid AI adoption in healthcare organizations. It highlights related challenges involving visibility, governance, and security. Its stated focus includes AI as well as application and API security.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC published the “2026 Healthcare Cyber Survey: New Trends in AI, Application API Security” on October 26, 2026.","The report is based on responses from healthcare organizations.","The report identifies rapid AI adoption among healthcare organizations.","It highlights visibility, governance, and security challenges associated with AI adoption.","Radware, a Health-ISAC Community Services Champion, provided the report."],"insights":["The survey frames AI adoption as not only a security issue but also a visibility and governance challenge for healthcare organizations.","The report specifically links emerging AI trends with application and API security, indicating that both areas are within its stated focus."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published “2026 Healthcare Cyber Survey: New Trends in AI, Application API Security” on October 26, 2026. The resource is a report by Radware, identified as a Health-ISAC Community Services Champion. It is based on responses from healthcare organizations.\u003c/p\u003e\n\n\u003cp\u003eThe report describes rapid AI adoption in healthcare organizations. It highlights related challenges involving visibility, governance, and security. Its stated focus includes AI as well as application and API security.\u003c/p\u003e\n"},{"n":15,"title":"Socket Threat Intel Now Shows Which Malware Campaigns Were Blocked or Detected","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/threat-intel-campaign-impact?utm_medium=feed","time":"22:14","priority":"MAY READ","score":42,"tldr":"Socket Threat Intel now shows whether malware campaigns were blocked, detected, or not seen in an organization, with links to the underlying repository scans and Firewall events. The Org Impact view lets teams trace affected package versions to specific repositories, branches, and installation activity.","briefOverview":"\u003cp\u003eSocket Threat Intel has added organization-specific summaries to its Threat Intel → Campaigns page that show whether a malware campaign was blocked by Socket, detected in Firewall/SCA, or not detected. The feature is intended to help organizations determine whether a newly identified malware campaign reached them and whether their defenses stopped it. Campaign summaries use immutable full repository scans, immutable pull-request diff scans, and Socket Firewall event traffic.\u003c/p\u003e\n\n\u003cp\u003eA campaign’s Org Impact tab lists each campaign package found in the organization, including the repositories and branches where it appeared and the first and last times it was seen. The listed dates link directly to the relevant scan report or matching Socket Firewall events, allowing users to trace findings to supporting evidence. For campaigns involving multiple packages, each package and version is shown separately with its own status and observation dates, while Blog and Affected Packages tabs provide related Socket posts and the full affected-package list.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket Threat Intel now provides organization-specific campaign summaries showing whether Socket blocked a campaign, detected it in Firewall or SCA, or did not detect it.","Campaign summaries draw on immutable full repository scans, pull-request diff scans, and Socket Firewall event traffic.","The Org Impact tab lists campaign packages found in an organization along with the repositories, branches, and first and last observed dates.","Date links in the Org Impact tab lead directly to the relevant scan report or matching Socket Firewall events.","For campaigns involving multiple packages, Socket shows each package and version separately with its own status and first and last seen dates."],"insights":["The campaign status distinguishes between harmful packages that were present in code and attempts that Socket Firewall blocked, giving organizations visibility into prevented exposure as well as detected exposure.","Organizations can move from a campaign-level finding to the exact repository, branch, scan, or Firewall event through date-linked evidence, reducing the effort needed to investigate a finding.","Multi-package campaigns are tracked at the individual package-version level, so different malicious versions within the same campaign can have different statuses and observation dates.","The Campaigns page also centralizes related Socket blog coverage and the complete list of affected packages alongside an organization’s own impact data."],"referencedReports":[],"body":"\u003cp\u003eSocket Threat Intel has added organization-specific summaries to its Threat Intel → Campaigns page that show whether a malware campaign was blocked by Socket, detected in Firewall/SCA, or not detected. The feature is intended to help organizations determine whether a newly identified malware campaign reached them and whether their defenses stopped it. Campaign summaries use immutable full repository scans, immutable pull-request diff scans, and Socket Firewall event traffic.\u003c/p\u003e\n\n\u003cp\u003eA campaign’s Org Impact tab lists each campaign package found in the organization, including the repositories
