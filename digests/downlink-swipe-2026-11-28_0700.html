<script type="application/json" id="dl-articles">[{"n":1,"title":"pCloud Password Manager Hit by Cyber Attack Involving Email Address Exposure and Login Attempts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/pcloud-password-manager-hit-by-cyber.html","time":"08:08","priority":"SHOULD READ","score":78,"tldr":"pCloud Pass contained a cyberattack that exposed a small number of user email addresses and triggered login attempts, but says encrypted vault data, passwords, and notes were not compromised. Users should watch for phishing attempts seeking their master password or recovery words.","briefOverview":"\u003cp\u003epCloud Pass said it promptly contained a cyberattack that exposed a small number of user email addresses and involved login attempts. Users had reported alerts showing an unknown device connected to their accounts, including accounts with two-factor authentication enabled. pCloud said the incident was limited to its password manager and did not affect pCloud Cloud Storage.\u003c/p\u003e\n\n\u003cp\u003eAccording to pCloud, passwords, notes, and other stored information were not compromised because they are encrypted and require a Master Password to access. Reported alerts identified a device named \u0026ldquo;pd\u0026rdquo; connecting from two IP addresses associated with pCloud infrastructure in Luxembourg, but it remains unclear whether the login attempts succeeded or whether encrypted vaults were accessed or downloaded. pCloud has not disclosed how the attackers entered, when the intrusion took place, or how long access lasted, and it urged users to be alert for phishing attempts seeking Master Passwords or recovery words.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["pCloud Pass said it promptly contained a cyberattack that exposed a small number of user email addresses and involved login attempts.","pCloud said passwords, notes, and other information stored in pCloud Pass were not compromised because they are encrypted and require a master password to access.","The incident was limited to pCloud Pass and did not affect pCloud Cloud Storage services, according to the company.","Users reported receiving new-device sign-in alerts for a device called \"pd,\" including users who had two-factor authentication enabled.","pCloud urged users to watch for phishing messages that request their master password or recovery words through email, phone, or chat."],"insights":["New-device alerts were reported even by users with two-factor authentication enabled, indicating that the observed activity was not necessarily blocked before account-associated device activity occurred.","The unfamiliar device named \"pd\" was observed connecting from two IP addresses assigned to pCloud infrastructure in Luxembourg, rather than from an obviously external network.","The “Open Settings” link in at least one alert reportedly redirected through pCloud tracking to a passqa1.pcloud.com address that appeared to be an internal quality-assurance environment and did not load.","pCloud did not disclose how attackers gained access, when the intrusion occurred, how long access lasted, or whether login attempts succeeded and encrypted vaults were accessed or downloaded.","The incident follows other reported password-manager security incidents involving mSecure and 1Password during the same month, underscoring the trust and transparency concerns raised when password-management providers experience intrusions."],"referencedReports":[],"body":"\u003cp\u003epCloud Pass said it promptly contained a cyberattack that exposed a small number of user email addresses and involved login attempts. Users had reported alerts showing an unknown device connected to their accounts, including accounts with two-factor authentication enabled. pCloud said the incident was limited to its password manager and did not affect pCloud Cloud Storage.\u003c/p\u003e\n\n\u003cp\u003eAccording to pCloud, passwords, notes, and other stored information were not compromised because they are encrypted and require a Master Password to access. Reported alerts identified a device named \u0026ldquo;pd\u0026rdquo; connecting from two IP addresses associated with pCloud infrastructure in Luxembourg, but it remains unclear whether the login attempts succeeded or whether encrypted vaults were accessed or downloaded. pCloud has not disclosed how the attackers entered, when the intrusion took place, or how long access lasted, and it urged users to be alert for phishing attempts seeking Master Passwords or recovery words.\u003c/p\u003e\n"}]</script>
