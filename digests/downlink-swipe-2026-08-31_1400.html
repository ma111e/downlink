<script type="application/json" id="dl-articles">[{"n":2,"title":"13 Malicious Packagist Themes Deliver iOS Spyware That Steals Crypto Wallet Seeds","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/packagist-themes-ios-spyware?utm_medium=feed","time":"14:25","priority":"MUST READ","score":94,"tldr":"Socket researchers found 13 malicious Packagist Composer themes for Vietnamese streaming CMS sites that inject JavaScript to run ad-fraud redirects and, on vulnerable iPhones, a FUNNULL-hosted exploit chain that installs spyware. The payload can steal sensitive iOS data including keychain contents, messages, photos, location history, and crypto wallet seeds, so affected site operators should remove the packages and users should update iOS immediately.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team found 13 malicious Composer theme packages on Packagist across five vendor namespaces: \u003ccode\u003evsmov\u003c/code\u003e, \u003ccode\u003evsphim\u003c/code\u003e, \u003ccode\u003ehaiau009\u003c/code\u003e, \u003ccode\u003echilltvcms\u003c/code\u003e, and \u003ccode\u003eophimcms\u003c/code\u003e. The themes target Vietnamese movie and comic streaming sites built on OphimCMS and KKPhim by injecting JavaScript into every page of sites that install them. The injected code runs a mobile gambling and ad-fraud redirect chain, and on iPhones it can load a WebKit-to-kernel exploit chain that installs spyware.\u003c/p\u003e\n\n\u003cp\u003eThe iOS chain pulls stages from FUNNULL-hosted infrastructure and uses WebKit entry points identified in the article as CVE-2025-31277 and CVE-2025-43529, followed by a kernel escape involving AppleM2ScalerCSCDriver. Apple confirmed to Socket that the kernel escape was already fixed in iOS and macOS 26.1 before the report, while the WebKit entry points are public, patched, and listed in CISA’s Known Exploited Vulnerabilities catalog. The article says the chain targets devices that have not updated past iOS 18.6.x, with no offset tables for iOS 18.7 or iOS 26.\u003c/p\u003e\n\n\u003cp\u003eOn successful exploitation, the spyware can collect keychain databases, Wi-Fi passwords, SMS, contacts, Photos, browser cookies, call history, location history, and account databases, then encrypt and upload them to command-and-control domains. A redeployed payload added iOS keychain queries for crypto-wallet seed and mnemonic material from Bitget, BitKeep, Bitpie, Phantom, Tonkeeper, Trust Wallet, and OKX. Socket recommends that site operators remove themes from the listed vendors, rotate credentials handled on the host, inspect theme scripts, and block the listed network indicators.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team found 13 malicious Composer theme packages on Packagist across five vendor namespaces that inject JavaScript into Vietnamese movie and comic streaming sites that install them.","The injected JavaScript runs a mobile ad-fraud and gambling-redirect chain, and on iPhones it can trigger a WebKit-to-kernel exploit chain that installs spyware.","Apple confirmed that the kernel escape used by the iOS chain was already fixed in iOS and macOS 26.1 before Socket’s report, while the two WebKit entry points are public and listed in CISA’s Known Exploited Vulnerabilities catalog.","The spyware payload can collect keychain databases, Wi-Fi passwords, SMS, address book, Photos, browser cookies, call history, location history, account databases, and crypto-wallet seed or mnemonic data from several wallet apps.","The article recommends that site operators remove any themes from the vsmov, vsphim, haiau009, chilltvcms, or ophimcms vendors, rotate credentials handled on the host, inspect theme scripts, and block the listed network indicators."],"insights":["The same five Packagist vendor namespaces publish additional themes that currently carry no active payload, but the article says they should still be treated as untrusted because they share operators, activation mechanisms, and in one case opaque ionCube-encrypted account code with confirmed malicious packages.","The operators redeployed the iOS chain under new filenames in August 2026, but the exploit tables still only cover iOS 18.4 through 18.6.x and not iOS 18.7 or iOS 26, indicating the campaign is focused on devices left on older versions rather than current iOS releases.","The campaign combines two different monetization paths in the same poisoned themes: broad mobile gambling and ad-fraud redirects for mobile visitors, and higher-value spyware and crypto-wallet seed theft for vulnerable iPhone visitors.","The article separates the Vietnamese theme operators, the iOS exploit-kit operators, and a Chinese npm gambling operation as distinct tenants sharing FUNNULL infrastructure, rather than attributing all activity to one actor.","The themes’ admin “Custom JS” fields are rendered into every page unescaped, which means an inactive theme from the same operators could be armed through a package update or a stored settings change without requiring a newly installed package."],"referencedReports":[{"title":"DarkSword iOS exploit chain","url":"https://cloud.google.com/blog/topics/threat-intelligence/darksword-ios-exploit-chain","publisher":"Google Cloud","context":"The article says the renderer CVEs and staging pattern overlap with the publicly documented DarkSword iOS exploit kit.","category":"research","primary":false},{"title":"Triad Nexus FUNNULL 2026","url":"https://www.silentpush.com/blog/triad-nexus-funnull-2026/","publisher":"Silent Push","context":"The article cites Silent Push as naming Yunray and CDN1 as FUNNULL front infrastructure.","category":"research","primary":false},{"title":"4 Years, 51 Packages, 3 Organizations: How npm Became a Gambling Ring’s Config Server","url":"https://panther.com/blog/4-years-51-packages-3-organizations-how-npm-became-a-gambling-ring-s-config-server","publisher":"Panther Threat Research","context":"The article references Panther Threat Research’s documentation of an unrelated Chinese sports-gambling and pirate-streaming operation using npm packages as a configuration dead-drop.","category":"research","primary":false}],"body":"\u003cp\u003eSocket’s Threat Research Team found 13 malicious Composer theme packages on Packagist across five vendor namespaces: \u003ccode\u003evsmov\u003c/code\u003e, \u003ccode\u003evsphim\u003c/code\u003e, \u003ccode\u003ehaiau009\u003c/code\u003e, \u003ccode\u003echilltvcms\u003c/code\u003e, and \u003ccode\u003eophimcms\u003c/code\u003e. The themes target Vietnamese movie and comic streaming sites built on OphimCMS and KKPhim by injecting JavaScript into every page of sites that install them. The injected code runs a mobile gambling and ad-fraud redirect chain, and on iPhones it can load a WebKit-to-kernel exploit chain that installs spyware.\u003c/p\u003e\n\n\u003cp\u003eThe iOS chain pulls stages from FUNNULL-hosted infrastructure and uses WebKit entry points identified in the article as CVE-2025-31277 and CVE-2025-43529, followed by a kernel escape involving AppleM2ScalerCSCDriver. Apple confirmed to Socket that the kernel escape was already fixed in iOS and macOS 26.1 before the report, while the WebKit entry points are public, patched, and listed in CISA’s Known Exploited Vulnerabilities catalog. The article says the chain targets devices that have not updated past iOS 18.6.x, with no offset tables for iOS 18.7 or iOS 26.\u003c/p\u003e\n\n\u003cp\u003eOn successful exploitation, the spyware can collect keychain databases, Wi-Fi passwords, SMS, contacts, Photos, browser cookies, call history, location history, and account databases, then encrypt and upload them to command-and-control domains. A redeployed payload added iOS keychain queries for crypto-wallet seed and mnemonic material from Bitget, BitKeep, Bitpie, Phantom, Tonkeeper, Trust Wallet, and OKX. Socket recommends that site operators remove themes from the listed vendors, rotate credentials handled on the host, inspect theme scripts, and block the listed network indicators.\u003c/p\u003e\n"},{"n":1,"title":"SIEM Is Not Enough: Why You Need DAM for Your Databases","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/siem-vs-dam-database-security","time":"16:35","priority":"MAY READ","score":45,"tldr":"The article argues that sending database audit logs to a SIEM is costly and lacks the data sensitivity, identity, and behavior context needed to detect real risk, especially as AI agents increase database access. It promotes Varonis Next-Gen DAM as a way to monitor all databases through native audit collection and turn raw activity into actionable security findings.","briefOverview":"\u003cp\u003eThe article argues that the long-standing database security approach of deploying legacy Database Activity Monitoring on a small number of critical databases and sending the rest of the audit logs to a SIEM no longer works. It says SIEM-based monitoring creates large ingest bills, produces alerts without database context, and still leaves audit reporting as a manual process. The article also says legacy agent-based DAM can take years to deploy, cover only part of the database estate, and overwhelm teams with undifferentiated alerts.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights AI agents as a major reason this model is failing. In its example, an internal customer support agent may run thousands of database queries through a shared service account, while native logs show only that service account accessing data. The article says a SIEM lacks context about sensitive data, originating users or workflows, and normal behavior, making it hard to tell whether this activity is risky.\u003c/p\u003e\n\n\u003cp\u003eVaronis presents its Next-Gen DAM as an alternative that brings databases into its unified Data Security Platform through native audit collection, with Varonis Gatekeeper reserved for hypercritical databases needing inline enforcement such as blocking or dynamic masking. The article says Varonis turns raw database activity into findings by combining data classification, identity resolution through Active Directory or Entra, and user behavior analytics. It promotes a free Varonis Data Risk Assessment that can map sensitive data, resolve database accounts to identities, surface live activity alerts, and provide a remediation report.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that sending native database audit logs to a SIEM creates high ingest costs while producing raw events that lack database security context.","The article says legacy agent-based DAM deployments often take years, cover only a fraction of databases, and generate many undifferentiated alerts.","Varonis Next-Gen DAM uses native audit collection for most major database engines and the Varonis Gatekeeper for hypercritical databases that need inline enforcement such as blocking or dynamic masking.","Varonis says its platform turns database activity into findings by combining data classification, identity resolution, and user behavior analytics.","The article highlights AI agents as a growing database security challenge because they can generate large volumes of queries through shared service accounts while obscuring the originating user or workflow."],"insights":["The article frames SIEM-based database monitoring as “compliance theater” because teams may still need to manually query and format audit reports even after paying to ingest large volumes of logs.","The article claims the historical performance argument against native database auditing has weakened because modern native audit overhead is described as well under five percent and comparable to agent-based collection.","The article identifies shared service accounts used by AI workflows as a practical blind spot because database logs may show only the service account, not the human prompt or workflow that triggered the query.","The article presents a split deployment model as an alternative to all-agent DAM: use native audit collection for most databases and reserve inline enforcement through Varonis Gatekeeper for a smaller set of hypercritical systems.","The article suggests organizations can repurpose database audit streams already being sent to Splunk by pointing the same streams to Varonis instead, reducing the setup burden for broader database monitoring."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that the long-standing database security approach of deploying legacy Database Activity Monitoring on a small number of critical databases and sending the rest of the audit logs to a SIEM no longer works. It says SIEM-based monitoring creates large ingest bills, produces alerts without database context, and still leaves audit reporting as a manual process. The article also says legacy agent-based DAM can take years to deploy, cover only part of the database estate, and overwhelm teams with undifferentiated alerts.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights AI agents as a major reason this model is failing. In its example, an internal customer support agent may run thousands of database queries through a shared service account, while native logs show only that service account accessing data. The article says a SIEM lacks context about sensitive data, originating users or workflows, and normal behavior, making it hard to tell whether this activity is risky.\u003c/p\u003e\n\n\u003cp\u003eVaronis presents its Next-Gen DAM as an alternative that brings databases into its unified Data Security Platform through native audit collection, with Varonis Gatekeeper reserved for hypercritical databases needing inline enforcement such as blocking or dynamic masking. The article says Varonis turns raw database activity into findings by combining data classification, identity resolution through Active Directory or Entra, and user behavior analytics. It promotes a free Varonis Data Risk Assessment that can map sensitive data, resolve database accounts to identities, surface live activity alerts, and provide a remediation report.\u003c/p\u003e\n"}]</script>
